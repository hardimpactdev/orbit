id: 25e07c84-55fc-4e9f-9a5a-dc587d36092d
name: operation-database-import
queueTimeout: 30
description: database:import from 209, one script over official SSH as the Node's SSH user; the Gateway builds its argv and reads its one result line.
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database.import}
    # argv: timeout, then bash with the script DatabaseImport renders, the file, the server's container and image, the
    # driver, the owner and the database. It reads the owner's password line from stdin.
    intent:
      type: object
      properties:
        argv: {type: array, items: {type: string}}
        ssh_execution: {type: object}
      required: [argv, ssh_execution]
      additionalProperties: false
    # Names only: import is one whole value, the owner's password line.
    execution_secrets:
      type: object
      properties:
        import:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^database-import-intent-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [import]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: import
  labels: {role: swamp}
  steps:
    # No sudo: the shell opens the dump as the Node's SSH user. The script ends 0 with one result line for every outcome it
    # names (refused file, login, not empty, loaded, failed); only a timeout or a lost SSH fails the step.
  - name: 'Load the dump'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-import-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "database-import-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: ${{ inputs.intent.argv }}
        stdin: ${{ vault.get(inputs.execution_secrets.import.vault, inputs.execution_secrets.import.key) }}
        timeoutSec: 3610
