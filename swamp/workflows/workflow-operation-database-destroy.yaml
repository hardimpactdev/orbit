id: ad81876c-b31c-4ea4-8930-e9468294471a
name: operation-database-destroy
description: database:destroy on a Database server from 209 in the chart's phases, one shipped phase per official SSH step.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database.destroy}
    intent: {type: object}
    # Names only: admin, the server's own key.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-server-[1-9][0-9]*-admin$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: destroy
  labels: {role: swamp}
  steps:
  - name: 'Read the scripts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-create-command-assets'
      behaviorName: database-destroy-assets
      methodName: phase
      inputs:
        module: database_destroy
        intent:
          driver: '${{ inputs.intent.driver }}'
          container: '${{ inputs.intent.container }}'
          host: '${{ inputs.intent.host }}'
          port: '${{ inputs.intent.port }}'
          databases: '${{ inputs.intent.databases }}'
          users: '${{ inputs.intent.users }}'
          test_prefixes: '${{ inputs.intent.test_prefixes }}'
    # Blockers refuse with database.in_use before the first drop; missing names count as removed.
  - name: 'Drop databases and users'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Read the scripts', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '300', python3, -I, -c, '${{ steps["Read the scripts"].outputs.shipped }}', '${{ steps["Read the scripts"].outputs.modules_json }}', database_destroy, '${{ steps["Read the scripts"].outputs.intent_json }}', drop]
        stdin: ${{ vault.get(inputs.execution_secrets.admin.vault, inputs.execution_secrets.admin.key) }}
        okExitCodes: [0, 1]
        timeoutSec: 310
  - name: 'Check they are gone'
    labels: {role: swamp}
    dependsOn: [{step: 'Drop databases and users', condition: {type: succeeded}}]
    guard: ${{ steps["Drop databases and users"].outputs.exitCode != 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', python3, -I, -c, '${{ steps["Read the scripts"].outputs.shipped }}', '${{ steps["Read the scripts"].outputs.modules_json }}', database_destroy, '${{ steps["Read the scripts"].outputs.intent_json }}', gone]
        stdin: ${{ vault.get(inputs.execution_secrets.admin.vault, inputs.execution_secrets.admin.key) }}
        okExitCodes: [0, 1]
        timeoutSec: 70
  - name: 'Report the result'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Read the scripts', condition: {type: always}}
    - {step: 'Drop databases and users', condition: {type: always}}
    - {step: 'Check they are gone', condition: {type: always}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: database-destroy-result
      methodName: execute
      inputs:
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          # A phase that ran and failed names the failed step; its script's error_code wins over the fallback.
          phases = [('READ', 'Read the scripts', 'database.destroy_outcome_unknown'), ('DROP', 'Drop databases and users', 'database.destroy_outcome_unknown'),
                    ('GONE', 'Check they are gone', 'database.destroy_incomplete')]
          result = {'backend': 'absent'}
          for name, label, fallback in phases:
              status, exit_code, stdout = (os.environ[name + suffix] for suffix in ('_STATUS', '_EXIT', '_STDOUT'))
              if status == 'failed' or (status == 'succeeded' and exit_code not in ('', '0')):
                  try:
                      value = json.loads(stdout) if stdout else {}
                  except ValueError:
                      value = {}
                  code = value.get('error_code') if isinstance(value, dict) and isinstance(value.get('error_code'), str) else fallback
                  result = {'failed_step': label, 'error_code': code}
                  break
          if 'error_code' not in result and os.environ['GONE_STATUS'] != 'succeeded':
              result = {'failed_step': None, 'error_code': 'database.destroy_outcome_unknown'}
          print(json.dumps(result))
          sys.exit(0 if 'error_code' not in result else 1)
          PY
        env:
          READ_STATUS: '${{ "Read the scripts" in steps ? steps["Read the scripts"].status : "skipped" }}'
          READ_EXIT: ''
          READ_STDOUT: ''
          DROP_STATUS: '${{ "Drop databases and users" in steps ? steps["Drop databases and users"].status : "skipped" }}'
          DROP_EXIT: '${{ "Drop databases and users" in steps && steps["Drop databases and users"].status == "succeeded" ? string(steps["Drop databases and users"].outputs.exitCode) : "" }}'
          DROP_STDOUT: '${{ "Drop databases and users" in steps && steps["Drop databases and users"].status == "succeeded" ? steps["Drop databases and users"].outputs.stdout : "" }}'
          GONE_STATUS: '${{ "Check they are gone" in steps ? steps["Check they are gone"].status : "skipped" }}'
          GONE_EXIT: '${{ "Check they are gone" in steps && steps["Check they are gone"].status == "succeeded" ? string(steps["Check they are gone"].outputs.exitCode) : "" }}'
          GONE_STDOUT: '${{ "Check they are gone" in steps && steps["Check they are gone"].status == "succeeded" ? steps["Check they are gone"].outputs.stdout : "" }}'
        ignoreExitCode: true
  - name: 'Fail on an error'
    labels: {role: swamp}
    dependsOn: [{step: 'Report the result', condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Report the result"].outputs.exitCode == 0', severity: high, message: The database removal did not complete.}
