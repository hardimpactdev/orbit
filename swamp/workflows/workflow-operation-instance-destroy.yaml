id: 10c1e646-19cd-4527-8be5-01f524976346
name: operation-instance-destroy
queueTimeout: 30
description: Development Instance destroy from209 through separately placed official SSH actions.
vaults:
  - orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: instance.destroy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
              - orbit-control-inputs
          key:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{0,254}$'
        required:
          - vault
          - key
        additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: destroy
    labels: {role: swamp}
    steps:
      - name: destroy-directory
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-0-" + run.id }}'
          methodName: exec
          globalArgs: &ref_0
            name: '${{ "id-destroy-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.ssh_execution.target.host }}'
                transport:
                  hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/mkdir
              - '-p'
              - '${{ "/tmp/orbit-instance-" + run.id }}'
      - name: destroy-observe-asset
        labels: {role: swamp}
        dependsOn:
          - step: destroy-directory
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-1-" + run.id + "-" + string(self._index) }}'
          methodName: read
          inputs:
            action: inspect_source
            input:
              member: '${{ self.member }}'
              retained: '${{ inputs.intent.source_capture }}'
              force: '${{ inputs.intent.force }}'
              repository: '${{ inputs.intent.repository }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-observe
        labels: {role: swamp}
        dependsOn:
          - step: destroy-observe-asset
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-2-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destroy-observe-asset-" + string(self._index)].outputs.script_body }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-observed
        labels: {role: swamp}
        dependsOn:
          - step: destroy-observe
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-3-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: decode
          inputs:
            observation: '${{ steps["destroy-observe-"+string(self._index)].outputs }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-origin-assets
        labels: {role: swamp}
        dependsOn:
          - step: destroy-observed
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "idm-destro-4-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: read
          inputs:
            action: origin
            input:
              checkout: '${{ self.member.checkout_path }}'
              allow_empty: '${{ self.member.failed_creation }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-origin
        labels: {role: swamp}
        dependsOn:
          - step: destroy-origin-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-5-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destroy-origin-assets-"+string(self._index)].outputs.script_body }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
        guard: '${{ !steps["destroy-observed-"+string(self._index)].outputs.origin_required }}'
      - name: destroy-inspect
        labels: {role: swamp}
        dependsOn:
          - step: destroy-origin
            condition:
              type: always
          - step: destroy-observed
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-6-" + run.id }}'
          methodName: inspect
          inputs:
            input: '${{ inputs.intent }}'
            steps: '${{ steps }}'
      - name: destroy-source-assets
        labels: {role: swamp}
        dependsOn:
          - step: destroy-inspect
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "idm-destro-7-" + run.id }}'
          methodName: paths
          inputs:
            intent: '${{ inputs.intent }}'
      - name: destroy-mint
        labels: {role: swamp}
        dependsOn:
          - step: destroy-source-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "id-mint-" + run.id }}'
          methodName: execute
          inputs:
            run: python3 -B "$ORBIT_MINT_FILE"
            env:
              ORBIT_MINT_FILE: '${{ steps["destroy-source-assets"].outputs.directory + "/mint.py" }}'
              ORBIT_OPERATION_ID: '${{ string(inputs.operation_id) }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_GIT_REFERENCES: '${{ inputs.intent.execution_references_json }}'
        guard: '${{ inputs.intent.force || inputs.intent.members.all(member,member.failed_creation) }}'
      - name: destroy-fetch-files
        labels: {role: swamp}
        dependsOn:
          - step: destroy-source-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-9-" + run.id }}'
          methodName: copy
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            src: '${{ steps["destroy-source-assets"].outputs.directory + "/." }}'
            dst: '${{ "/tmp/orbit-instance-" + run.id + "/" }}'
            direction: to
            recursive: true
      - name: destroy-fetch
        labels: {role: swamp}
        dependsOn:
          - step: destroy-fetch-files
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-10-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/python3
              - '-B'
              - '${{ "/tmp/orbit-instance-" + run.id + "/fetch.py" }}'
              - '${{ self.member.checkout_path }}'
              - '${{ inputs.intent.repository }}'
            stdin: '${{ vault.get(inputs.execution_secrets.git_read.vault,inputs.execution_secrets.git_read.key) }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
        guard: '${{ inputs.intent.force || self.member.failed_creation || !steps["destroy-observed-"+string(self._index)].outputs.origin_required }}'
      - name: destroy-verify-asset
        labels: {role: swamp}
        dependsOn:
          - step: destroy-inspect
            condition:
              type: succeeded
          - step: destroy-fetch
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-11-" + run.id + "-" + string(self._index) }}'
          methodName: read
          inputs:
            action: verify_source
            input:
              admitted_paths: '${{ inputs.intent.members.map(member,member.checkout_path) }}'
              member: '${{ self.member }}'
              capture: '${{ steps["destroy-inspect"].outputs.members.filter(row,row.instance_id == self.member.instance_id)[0] }}'
              force: '${{ inputs.intent.force }}'
              removal_id: '${{ inputs.intent.removal_id }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-verify
        labels: {role: swamp}
        dependsOn:
          - step: destroy-verify-asset
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-12-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destroy-verify-asset-" + string(self._index)].outputs.script_body }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-verified
        labels: {role: swamp}
        dependsOn:
          - step: destroy-verify
            condition:
              type: always
          - step: destroy-inspect
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-13-" + run.id }}'
          methodName: require_actions
          inputs:
            names:
              - destroy-verify
            counts:
              - '${{ size(inputs.intent.members) }}'
            steps: '${{ steps }}'
      - name: destroy-schedules
        labels: {role: swamp}
        dependsOn:
          - step: destroy-verified
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: operation-schedule-destroy
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: schedule.destroy
            intent:
              schedule:
                id: '${{ self.schedule.id }}'
              cascade: true
              ssh_execution: '${{ inputs.intent.ssh_execution }}'
            execution_secrets: {}
        forEach:
          item: schedule
          in: '${{ inputs.intent.direct_destroy.runtime.schedules }}'
      - name: destroy-schedules-ready
        labels: {role: swamp}
        dependsOn:
          - step: destroy-schedules
            condition:
              type: always
          - step: destroy-verified
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-15-" + run.id }}'
          methodName: require_actions
          inputs:
            names:
              - destroy-schedules
            counts:
              - '${{ size(inputs.intent.direct_destroy.runtime.schedules) }}'
            steps: '${{ steps }}'
      - name: destroy-processes
        labels: {role: swamp}
        dependsOn:
          - step: destroy-schedules-ready
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: operation-process-destroy
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.destroy
            intent:
              control: '${{ self.process }}'
              ssh_execution: '${{ inputs.intent.ssh_execution }}'
            execution_secrets: {}
        forEach:
          item: process
          in: '${{ inputs.intent.native_runtime.processes }}'
      - name: destroy-runtime-ready
        labels: {role: swamp}
        dependsOn:
          - step: destroy-schedules
            condition:
              type: always
          - step: destroy-processes
            condition:
              type: always
          - step: destroy-verified
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-17-" + run.id }}'
          methodName: require_actions
          inputs:
            names:
              - destroy-schedules
              - destroy-processes
            counts:
              - '${{ size(inputs.intent.direct_destroy.runtime.schedules) }}'
              - '${{ size(inputs.intent.native_runtime.processes) }}'
            steps: '${{ steps }}'
      - name: destroy-step-assets
        labels: {role: swamp}
        dependsOn:
          - step: destroy-runtime-ready
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-18-" + run.id }}'
          methodName: read
          inputs:
            action: run_project_step
            input: {}
      - name: destroy-step-copy
        labels: {role: swamp}
        dependsOn:
          - step: destroy-step-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-19-" + run.id }}'
          methodName: copy
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            src: '${{ steps["destroy-step-assets"].outputs.script_file }}'
            dst: '${{ "/tmp/orbit-instance-" + run.id + "/run_project_step.py" }}'
            direction: to
      - name: destroy-teardown-0
        labels: {role: swamp}
        dependsOn:
          - step: destroy-step-copy
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-20-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/python3
              - '-B'
              - '${{ "/tmp/orbit-instance-"+run.id+"/run_project_step.py" }}'
            timeoutSec: '${{ self.command.timeout_seconds }}'
            stdin: '${{ vault.get(inputs.execution_secrets[self.command.secret_field].vault,inputs.execution_secrets[self.command.secret_field].key) }}'
        forEach:
          item: command
          in: '${{ inputs.intent.teardown_commands.filter(command,command.index==0) }}'
      - name: destroy-teardown-1
