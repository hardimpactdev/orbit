id: 3b0f6f0e-6f0c-4b7e-9d0a-5c1f2a7e8b41
name: proof-fleet-base-restore
description: Task-local disposable proof fleet; never touches the outer control plane.
version: 1
inputs:
  type: object
  properties:
    request:
      type: string
      description: Absolute path to the owned nonsecret execution request.
    candidate:
      type: string
      description: Candidate repository owning the bounded phase programs.
  required: [request, candidate]
  additionalProperties: false
jobs:
  - name: base
    steps:
      - name: restore
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: proof-base-restore
          methodName: execute
          inputs:
            run: 'python3 "$PROOF_CANDIDATE/swamp/proof/reset/phases.py" base-restore'
            timeout: 60000
            env:
              PROOF_REQUEST: "${{ inputs.request }}"
              PROOF_CANDIDATE: "${{ inputs.candidate }}"
