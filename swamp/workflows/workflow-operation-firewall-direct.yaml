id: 4093f46d-9dd2-4e67-a151-dd5bb9addb0c
name: operation-firewall-direct
description: Converge one admitted firewall rule from Node 209 with one shipped script over official SSH.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [firewall.allow, firewall.deny, firewall.remove]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: firewall
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/firewall-assets'
      behaviorName: '${{ "firewall-assets-" + run.id }}'
      methodName: read
      inputs: {intent: '${{ inputs.intent }}'}
  - name: apply
    target: orbit-node-209
    writes: true
    dependsOn: [{step: assets, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "firewall-apply-" + run.id }}'
      methodName: exec
      globalArgs:
        name: '${{ "firewall-apply-" + run.id }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
          hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}'}]
      inputs:
        hosts: 'name:target'
        sudo: true
        argv: [timeout, '60', python3, -I, -c, '${{ steps.assets.outputs.script }}', '${{ steps.assets.outputs.input }}']
        okExitCodes: [0, 1]
  - name: accepted
    target: orbit-node-209
    dependsOn: [{step: apply, condition: {type: succeeded}}]
    task: {type: assert, expr: steps.apply.outputs.exitCode == 0, severity: high, message: The firewall rule did not converge.}
