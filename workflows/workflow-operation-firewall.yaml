id: 9249dbc7-f61a-4288-9e51-a10a3c0bfa1d
name: operation-firewall
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
queueTimeout: 60
autoResume: true
trigger:
  schedule: "3 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-firewall-discovery
          methodName: discover
          inputs:
            family: operation-firewall
            kinds: ["firewall.allow", "firewall.deny", "firewall.remove"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-firewall"
          behaviorName: '${{ "operation-firewall-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: "${{ self.work.kind }}"
            worker: '${{ self.work.worker }}'
