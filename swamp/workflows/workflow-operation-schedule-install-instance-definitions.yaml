id: 73c78a4c-e148-4130-89e3-33104b28ae6e
name: operation-schedule-install-instance-definitions
description: One native Instance runtime parent with placed member steps.
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: schedule.install_instance_definitions
  required:
    - operation_id
    - node_id
    - kind
jobs:
  - name: prepare
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: { node: "${{ string(inputs.node_id) }}" }
    writes: true
    steps:
      - name: prepare
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-runtime"
          behaviorName: ${{ "instance-runtime-node-" + string(inputs.node_id) }}
          methodName: prepareInstance
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
      - name: caddy
        allowFailure: true
        guard: ${{ !data.latest("instance-runtime-node-" + string(inputs.node_id), "instance-plan-" + run.id).attributes.vite
          || !data.latest("instance-runtime-node-" + string(inputs.node_id), "instance-plan-" + run.id).attributes.proceed }}
        dependsOn:
          - step: prepare
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: "@nckrtl/route-publication"
          behaviorName: ${{ "route-publication-node-" + string(inputs.node_id) }}
          methodName: publishCaddy
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
  - name: members
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: { node: "${{ string(inputs.node_id) }}" }
    writes: true
    dependsOn:
      - job: prepare
        condition:
          type: or
          conditions:
            - type: succeeded
            - type: failed
    steps:
      - name: member-${{ string(self.member) }}
        forEach:
          item: member
          in: ${{ data.latest("instance-runtime-node-" + string(inputs.node_id), "instance-plan-" + run.id).attributes.member_ids
            }}
        allowFailure: true
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-runtime"
          behaviorName: ${{ "instance-runtime-node-" + string(inputs.node_id) }}
          methodName: applyInstanceMember
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            member_id: ${{ self.member }}
            publication_status: '${{ has(steps.caddy) ? steps.caddy.status : "skipped" }}'
  - name: finish
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: { node: "${{ string(inputs.node_id) }}" }
    writes: true
    dependsOn:
      - job: members
        condition:
          type: or
          conditions:
            - type: succeeded
            - type: failed
            - type: skipped
    steps:
      - name: finish
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-runtime"
          behaviorName: ${{ "instance-runtime-node-" + string(inputs.node_id) }}
          methodName: finishInstance
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
