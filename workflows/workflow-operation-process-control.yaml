id: fe404a82-4210-4047-b440-5f385b8e49c3
name: operation-process-control
description: One directly admitted Process control on its exact Node worker.
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: {
      type: string,
      enum: [process.start, process.stop, process.restart, process.destroy],
    }
  required: [operation_id, node_id, kind]
jobs:
  - name: node
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: { node: "${{ string(inputs.node_id) }}" }
    writes: true
    steps:
      - name: control
        guard: '${{ inputs.kind == "process.start" }}'
        task:
          type: behavior
          behaviorType: "@nckrtl/process-control"
          behaviorName: '${{ "process-control-node-" + string(inputs.node_id) }}'
          methodName: control
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: prepare-start
        guard: '${{ inputs.kind != "process.start" }}'
        dependsOn: [
          {
            step: control,
            condition: {
              type: or,
              conditions: [{ type: succeeded }, { type: skipped }],
            },
          },
        ]
        task:
          type: behavior
          behaviorType: "@nckrtl/process-control"
          behaviorName: '${{ "process-control-node-" + string(inputs.node_id) }}'
          methodName: prepareStart
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: caddy
        guard: '${{ !data.latest("process-control-node-" + string(inputs.node_id), "start-" + run.id).attributes.vite || !data.latest("process-control-node-" + string(inputs.node_id), "start-" + run.id).attributes.proceed }}'
        dependsOn: [{ step: prepare-start, condition: { type: succeeded } }]
        task:
          type: behavior
          behaviorType: "@nckrtl/route-publication"
          behaviorName: '${{ "route-publication-node-" + string(inputs.node_id) }}'
          methodName: publishCaddy
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: activate-start
        guard: '${{ inputs.kind != "process.start" }}'
        dependsOn:
          - step: prepare-start
            condition: { type: succeeded }
          - step: caddy
            condition: {
              type: or,
              conditions: [
                { type: succeeded },
                { type: failed },
                { type: skipped },
              ],
            }
        task:
          type: behavior
          behaviorType: "@nckrtl/process-control"
          behaviorName: '${{ "process-control-node-" + string(inputs.node_id) }}'
          methodName: activateStart
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            preparation: '${{ data.latest("process-control-node-" + string(inputs.node_id), "start-" + run.id).attributes }}'
            publication_status: '${{ has(steps.caddy) ? steps.caddy.status : "skipped" }}'
