id: 878a384f-8b8a-4066-bd17-dcad8eac3e86
name: operation-task-vm-image-build
tags: {}
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  steps:
  - name: intent
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: build
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  steps:
  - name: reset
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: reset
  - name: launch
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: launch
    dependsOn:
    - step: reset
      condition:
        type: succeeded
  - name: boot
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: boot
    dependsOn:
    - step: launch
      condition:
        type: succeeded
  - name: apt-source
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: apt-source
    dependsOn:
    - step: boot
      condition:
        type: succeeded
  - name: packages
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: packages
    dependsOn:
    - step: apt-source
      condition:
        type: succeeded
  - name: javascript
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: javascript
    dependsOn:
    - step: packages
      condition:
        type: succeeded
  - name: rust
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: rust
    dependsOn:
    - step: javascript
      condition:
        type: succeeded
  - name: agent
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: agent
    dependsOn:
    - step: rust
      condition:
        type: succeeded
  - name: pi
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: pi
    dependsOn:
    - step: agent
      condition:
        type: succeeded
  - name: prepare
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: prepare
    dependsOn:
    - step: pi
      condition:
        type: succeeded
  - name: ssh-enable
    target: orbit-node-209
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "image-ssh-"+run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "image-ssh-"+run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/incus
        - --project
        - ${{ inputs.project }}
        - exec
        - --mode=non-interactive
        - --user
        - '0'
        - --group
        - '0'
        - --
        - ${{ inputs.name }}
        - /usr/bin/systemctl
        - enable
        - --now
        - ssh.service
        timeoutSec: 30
  - name: clean
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: clean
    dependsOn:
    - step: ssh-enable
      condition:
        type: succeeded
  - name: publish
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: publish
    dependsOn:
    - step: clean
      condition:
        type: succeeded
  - name: smoke
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: smoke
    dependsOn:
    - step: publish
      condition:
        type: succeeded
  - name: ssh-smoke
    target: orbit-node-209
    dependsOn:
    - step: smoke
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "image-ssh-"+run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/incus
        - --project
        - ${{ inputs.project }}
        - exec
        - --mode=non-interactive
        - --user
        - '0'
        - --group
        - '0'
        - --
        - ${{ inputs.name + "-smoke" }}
        - /usr/bin/systemctl
        - is-active
        - ssh.service
        timeoutSec: 30
  - name: seed
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: seed
    dependsOn:
    - step: ssh-smoke
      condition:
        type: succeeded
  - name: delete-smoke
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: delete-smoke
    dependsOn:
    - step: seed
      condition:
        type: succeeded
  - name: finish-seed
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: finish-seed
    dependsOn:
    - step: delete-smoke
      condition:
        type: succeeded
  - name: promote
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: promote
    dependsOn:
    - step: finish-seed
      condition:
        type: succeeded
  - name: prune
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: prune
    dependsOn:
    - step: promote
      condition:
        type: succeeded
  - name: complete
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: complete
    dependsOn:
    - step: prune
      condition:
        type: succeeded
- name: cleanup
  dependsOn:
  - job: admission
    condition:
      type: always
  - job: build
    condition:
      type: always
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  steps:
  - name: cleanup
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + run.id }}
      methodName: cleanup
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
version: 1
description: Build, verify, seed and promote one image in one native run; no Gateway
  children.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.image_build
    ssh_execution:
      type: object
    project:
      type: string
    name:
      type: string
  required:
  - operation_id
  - node_id
  - kind
  - ssh_execution
  - project
  - name
vaults: []
