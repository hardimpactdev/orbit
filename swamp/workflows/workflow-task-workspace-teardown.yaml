id: 6e47270b-266c-463f-9fa8-d595e26e7150
name: task-workspace-teardown
description: Run captured workspace teardown actions over official SSH on 209 before
  VM destruction.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - tasks.cancel
      - tasks.maintenance_finish
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: teardown
  target: orbit-node-209
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-repository-assets'
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
      behaviorName: ${{ "task-repository-assets-" + string(inputs.operation_id) }}
  - name: prepare-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-task-repository-" + run.id }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: copy-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.directory }}
        dst: ${{ "/tmp/orbit-task-repository-" + run.id + "/" }}
        recursive: true
        direction: to
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
  - name: teardown-${{ self._index }}
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-teardown-"+run.id+"-"+string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-teardown-"+run.id+"-"+string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-task-repository-" + run.id + "/scripts/provision_setup.py"
          }}
        - ${{ self.item.input_json }}
        stdin: ${{ steps.assets.outputs.input_json }}
        timeoutSec: ${{ self.item.timeout_seconds }}
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
    forEach:
      item: item
      in: ${{ inputs.intent.teardown }}
    concurrency: 1
