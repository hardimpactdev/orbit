id: a37dfa1b-1633-475f-90c7-dfd9c83008ca
name: maintenance-projects
queueTimeout: 30
description: Hourly tick of Project maintenance. It lists the Projects that this source configures, with the request keys of the fire; the Gateway selects the work from its own state.
trigger:
  schedule: '40 17 * * * *'
reports:
  skip: ['@swamp/workflow-summary']
jobs:
  - name: maintenance
    labels: {role: swamp}
    steps:
      - name: tick
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@nckrtl/project-maintenance-input'
          behaviorName: '${{ "maintenance-input-project-maintenance-input" }}'
          methodName: schedule
          inputs: {}
