          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE,ORBIT_CONTAINER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_CONTAINER_INTENT: ${{ self.item.json }}
          ORBIT_CONTAINER_BEFORE: ${{ steps["inspect-runtime-container" + self.item.key].outputs.stdout }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["preserve-runtime-container"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: create-runtime-container
  dependsOn:
  - job: preserve-runtime-container
    condition:
      type: succeeded
  steps:
  - name: create-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
