version = "1.41.0"
php-version = "8.5"

[source]
paths = ["app", "bin", "bootstrap", "config", "database", "routes", "tests"]
includes = ["vendor"]
excludes = ["bootstrap/cache", "build", "public/build", "storage", "var"]

[formatter]
preset = "laravel"

[analyzer]
baseline = "mago-analyzer-baseline.toml"

[linter]
baseline = "mago-linter-baseline.toml"
integrations = ["laravel", "pest", "phpunit"]
