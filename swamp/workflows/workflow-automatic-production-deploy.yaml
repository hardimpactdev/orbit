id: 78efdd30-08ce-4ffb-a8eb-c7259c96ad24
name: automatic-production-deploy
queueTimeout: 30
description: Run production automatic deployment policy after its Gateway cutover.
labels: {role: swamp}
trigger:
  schedule: 30 * * * * *
inputs:
  properties:
    instances:
      type: array
      items: { type: integer, minimum: 1 }
      uniqueItems: true
      default: []
      description: Optional narrower filter. Empty discovers every enabled production Instance from the Gateway.
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: policy
    steps:
      - name: tick
        writes: true
        task:
          type: model_method
          modelType: "@nckrtl/automatic-deploy"
          modelName: automatic-production-deploy
          methodName: tick
          inputs:
            instances: "${{ inputs.instances }}"
      - name: failures
        dependsOn: [{step: tick, condition: {type: succeeded}}]
        task:
          type: assert
          expr: steps.tick.outputs.failure_count == 0
          severity: high
          message: An Instance's automatic deploy tick failed; the Gateway reads the policy producer receipt.
