id: 4093f46d-9dd2-4e67-a151-dd5bb9addb0c
name: operation-firewall-direct
description: Execute one admitted Firewall intent on its Node without polling.
labels: { pool: migration }
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: {
      type: string,
      enum: [firewall.allow, firewall.deny, firewall.remove],
    }
  required: [operation_id, node_id, kind]
jobs:
  - name: firewall
    steps:
      - name: apply
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/firewall-direct"
          behaviorName: '${{ "firewall-node-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
