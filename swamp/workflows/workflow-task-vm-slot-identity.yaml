id: 87403a3e-6d71-404a-bade-6fbf2b3f6257
name: task-vm-slot-identity
description: One Ansible phase that writes the identity tree of a task VM slot into its Incus volume. The private keys are made on the host and never leave it.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
    execution_secrets:
      type: object
      properties:
        pi_token:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-pi-token-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
        model_key:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-model-key-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [pi_token, model_key]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: intent
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
- name: secrets
  dependsOn: [{job: intent, condition: {type: succeeded}}]
  steps:
  - name: Write the Pi token
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("ansible-slot-pi-token-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          umask 077
          printf '%s' "$ORBIT_VALUE" > "$ORBIT_FILE"
        env:
          ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-pi_token" }}'
          ORBIT_VALUE: '${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}'
  - name: Write the model key
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("ansible-slot-model-key-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          umask 077
          printf '%s' "$ORBIT_VALUE" > "$ORBIT_FILE"
        env:
          ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-model_key" }}'
          ORBIT_VALUE: '${{ vault.get(inputs.execution_secrets.model_key.vault, inputs.execution_secrets.model_key.key) }}'
- name: input
  dependsOn: [{job: secrets, condition: {type: succeeded}}]
  steps:
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("ansible-slot-input-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_slot_vars.py" "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}'}
- name: identity
  dependsOn: [{job: input, condition: {type: succeeded}}]
  steps:
  - name: Apply the identity
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("ansible-slot-identity-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 600 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags identity "$ORBIT_ANSIBLE/operation-task-vm-slot-enroll.yml"
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
          ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}'
          ANSIBLE_CONFIG: '${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}'
          ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
          ANSIBLE_FORCE_COLOR: '0'
- name: public
  dependsOn: [{job: identity, condition: {type: succeeded}}]
  steps:
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-public'
      behaviorName: ansible-public
      methodName: read
      inputs: {path: '${{ "/tmp/orbit-ansible-" + run.id + "/public.json" }}'}
- name: cleanup
  dependsOn:
  - {job: intent, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: secrets, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: input, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: identity, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: public, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  steps:
  - name: Remove the run folder
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("ansible-slot-cleanup-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
