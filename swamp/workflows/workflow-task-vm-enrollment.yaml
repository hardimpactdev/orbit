        stdin: ${{ inputs.intent.agent.certificate }}
        sudo: ${{ inputs.intent.provider != "incus" }}
    dependsOn:
    - step: observer-configuration
      condition:
        type: succeeded
    # The unit names orbit-env in SupplementaryGroups, and a unit that names a missing group does not start.
  - name: observer-group
