id: ede34ced-7d0e-4764-84c1-cfc533d9e980
name: operation-task-vm-upcloud-image-build
description: Build, smoke and promote one UpCloud task VM template from 209 with inline curl for UpCloud and the task VM role phases by Ansible for the server; TypeScript shapes request bodies and reads answers only.
version: 1
queueTimeout: 60
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.upcloud_image_build]}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(task-vm-upcloud-token|task-vm-image-bootstrap-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
      propertyNames: {enum: [upcloud, bootstrap]}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: build
  writes: true
  steps:
  - name: Launch the builder
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-upcloud-image-server
      inputs:
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        slot: builder
        source: ${{ inputs.intent.source }}
  - name: Run the task image phases
    labels: {role: swamp}
    dependsOn:
    - {step: Launch the builder, condition: {type: succeeded}}
    task:
      type: workflow
      workflowIdOrName: task-vm-upcloud-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        address: ${{ steps["Launch the builder"].outputs.server.address }}
        tags: software,tools,check
        with_pi: true
  - name: Prepare and clean
    labels: {role: swamp}
    dependsOn:
    - {step: Run the task image phases, condition: {type: succeeded}}
    task:
      type: workflow
      workflowIdOrName: task-vm-upcloud-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        address: ${{ steps["Launch the builder"].outputs.server.address }}
        tags: clean
        with_pi: false
  - name: Make the template
    # A soft stop that UpCloud hard-stops after 150 s; UpCloud refuses templatize until the server has stopped and
    # changes nothing, so curl's bounded retry is the wait (Q-WAIT).
    labels: {role: swamp}
    dependsOn:
    - {step: Prepare and clean, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request POST --header 'Content-Type: application/json' --data '{"stop_server":{"stop_type":"soft","timeout":"150"}}' \
            --output /dev/null "https://api.upcloud.com/1.3/server/$ORBIT_UUID/stop"
          timeout 330 curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --retry 30 --retry-delay 10 --retry-max-time 300 --retry-all-errors \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request POST --header 'Content-Type: application/json' --data "$ORBIT_TEMPLATE_DATA" \
            "https://api.upcloud.com/1.3/storage/$ORBIT_STORAGE/templatize"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ steps["Launch the builder"].outputs.server.uuid }}
          ORBIT_STORAGE: ${{ steps["Launch the builder"].outputs.server.storage }}
          ORBIT_TEMPLATE_DATA: ${{ inputs.intent.template_data }}
  - name: Read the template
    labels: {role: swamp}
    dependsOn:
    - {step: Make the template, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: template
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps["Make the template"].outputs.stdout }}
  - name: Smoke the template
    labels: {role: swamp}
    dependsOn:
    - {step: Read the template, condition: {type: succeeded}}
    task:
      type: workflow
      workflowIdOrName: task-vm-upcloud-image-smoke
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        template: ${{ steps["Read the template"].outputs.template_uuid }}
  - name: Promote the template
    # PUT is safe to repeat; curl retries while UpCloud still clones the template for the smoke server.
    labels: {role: swamp}
    dependsOn:
    - {step: Smoke the template, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          timeout 330 curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --retry 30 --retry-delay 10 --retry-max-time 300 --retry-all-errors \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request PUT --header 'Content-Type: application/json' --data "$ORBIT_PROMOTE_DATA" \
            --output /dev/null "https://api.upcloud.com/1.3/storage/$ORBIT_TEMPLATE"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_TEMPLATE: ${{ steps["Read the template"].outputs.template_uuid }}
          ORBIT_PROMOTE_DATA: ${{ inputs.intent.promote_data }}
# Settle runs after success, failure or cancellation: one listing finds this attempt's servers and templates,
# also those whose create answer or child output was lost.
- name: settle
  dependsOn:
  - {job: build, condition: {type: always}}
  steps:
  - name: List servers, templates
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          upcloud() {
            curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
              --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
              --header 'Accept: application/json' "https://api.upcloud.com/1.3/$1"
          }
          servers=$(upcloud 'server?label=orbit-task-image')
          templates=$(upcloud storage/template)
          printf '{"servers":%s,"templates":%s}\n' "$servers" "$templates"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: Plan the cleanup
    labels: {role: swamp}
    dependsOn:
    - {step: 'List servers, templates', condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: cleanup
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps["List servers, templates"].outputs.stdout }}
        template_uuid: ${{ steps[?"Read the template"].?outputs.?template_uuid.orValue("") }}
- name: check
  dependsOn:
  - {job: build, condition: {type: succeeded}}
  - {job: settle, condition: {type: succeeded}}
  steps:
  - name: Check the template
    labels: {role: swamp}
    task:
      type: assert
      expr: steps["Plan the cleanup"].outputs.promoted && steps["Plan the cleanup"].outputs.template_uuid == steps["Read the template"].outputs.template_uuid
      message: task_vm.image_build_failed
      severity: high
# Cleanup is best effort: a failed delete does not fail the run, and the next host sweep removes what stays.
- name: cleanup
  writes: true
  dependsOn:
  - {job: settle, condition: {type: succeeded}}
  steps:
  - name: Delete servers, templates
    labels: {role: swamp}
    allowFailure: true
    forEach:
      item: resource
      in: ${{ steps["Plan the cleanup"].outputs.deletes }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-delete-" + string(self._index) }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          if [ "$ORBIT_STOP" = true ]; then
            curl --silent --show-error --proto =https --max-redirs 0 --max-time 60 \
              --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
              --request POST --header 'Content-Type: application/json' --data '{"stop_server":{"stop_type":"hard"}}' \
              --output /dev/null "https://api.upcloud.com/1.3/server/$ORBIT_UUID/stop"
          fi
          timeout 330 curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --retry 30 --retry-delay 10 --retry-max-time 300 --retry-all-errors \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request DELETE "https://api.upcloud.com/1.3/$ORBIT_PATH"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ self.resource.uuid }}
          ORBIT_PATH: ${{ self.resource.path }}
          ORBIT_STOP: ${{ string(self.resource.stop) }}
