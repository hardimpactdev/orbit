id: 2fb743f6-7bd7-4d0a-8a61-168d30da8a44
name: operation-database-server-destroy
description: Database server removal from 209 in the chart's phases; the data volume stays on the Node.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database_server.destroy}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: server
  labels: {role: swamp}
  steps:
  - name: 'Read the scripts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-node-command'
      behaviorName: database-server-destroy-assets
      methodName: server_destroy
      inputs:
        intent:
          process_id: '${{ inputs.intent.process_id }}'
          container: '${{ inputs.intent.container }}'
  - name: 'Stop and remove them'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the scripts', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '300', python3, -I, -c, '${{ steps["Read the scripts"].outputs.destroy }}', '${{ steps["Read the scripts"].outputs.intent_json }}', remove]
        okExitCodes: [0, 1]
        timeoutSec: 310
  - name: 'Check they are gone'
    labels: {role: swamp}
    dependsOn: [{step: 'Stop and remove them', condition: {type: succeeded}}]
    guard: ${{ steps["Stop and remove them"].outputs.exitCode != 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', python3, -I, -c, '${{ steps["Read the scripts"].outputs.destroy }}', '${{ steps["Read the scripts"].outputs.intent_json }}', gone]
        okExitCodes: [0, 1]
        timeoutSec: 70
  - name: 'Report the result'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Read the scripts', condition: {type: always}}
    - {step: 'Stop and remove them', condition: {type: always}}
    - {step: 'Check they are gone', condition: {type: always}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: database-server-destroy-result
      methodName: execute
      inputs:
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          # A phase that ran and failed names the failed step; its script's error_code wins over the fallback.
          phases = [('READ', 'Read the scripts', 'database.server_remove_failed'), ('REMOVE', 'Stop and remove them', 'database.server_remove_failed'), ('GONE', 'Check they are gone', 'database.server_remove_incomplete')]
          result = {'backend': 'absent'}
          for name, label, fallback in phases:
              status, exit_code, stdout = (os.environ[name + suffix] for suffix in ('_STATUS', '_EXIT', '_STDOUT'))
              if status == 'failed' or (status == 'succeeded' and exit_code not in ('', '0')):
                  try:
                      value = json.loads(stdout) if stdout else {}
                  except ValueError:
                      value = {}
                  code = value.get('error_code') if isinstance(value, dict) and isinstance(value.get('error_code'), str) else fallback
                  result = {'failed_step': label, 'error_code': code}
                  break
          if 'error_code' not in result and os.environ['GONE_STATUS'] != 'succeeded':
              result = {'failed_step': None, 'error_code': 'database.server_remove_incomplete'}
          print(json.dumps(result))
          sys.exit(0 if 'error_code' not in result else 1)
          PY
        env:
          READ_STATUS: '${{ "Read the scripts" in steps ? steps["Read the scripts"].status : "skipped" }}'
          READ_EXIT: ''
          READ_STDOUT: ''
          REMOVE_STATUS: '${{ "Stop and remove them" in steps ? steps["Stop and remove them"].status : "skipped" }}'
          REMOVE_EXIT: '${{ "Stop and remove them" in steps && steps["Stop and remove them"].status == "succeeded" ? string(steps["Stop and remove them"].outputs.exitCode) : "" }}'
          REMOVE_STDOUT: '${{ "Stop and remove them" in steps && steps["Stop and remove them"].status == "succeeded" ? steps["Stop and remove them"].outputs.stdout : "" }}'
          GONE_STATUS: '${{ "Check they are gone" in steps ? steps["Check they are gone"].status : "skipped" }}'
          GONE_EXIT: '${{ "Check they are gone" in steps && steps["Check they are gone"].status == "succeeded" ? string(steps["Check they are gone"].outputs.exitCode) : "" }}'
          GONE_STDOUT: '${{ "Check they are gone" in steps && steps["Check they are gone"].status == "succeeded" ? steps["Check they are gone"].outputs.stdout : "" }}'
        ignoreExitCode: true
  - name: 'Fail on an error'
    labels: {role: swamp}
    dependsOn: [{step: 'Report the result', condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Report the result"].outputs.exitCode == 0', severity: high, message: The Database server removal did not complete.}
