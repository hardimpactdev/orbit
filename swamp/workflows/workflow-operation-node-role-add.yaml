    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/fetch'
      behaviorName: '${{ ("swamp-binary-"+string(inputs.node_id)).split(".").join("-") }}'
      methodName: check
      globalArgs:
        nodeHost: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.host }}'
        nodeUser: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.user }}'
        nodePort: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.port }}'
        nodeIdentityFile: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.identity_file }}'
        become: true
        url: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.url }}'
        path: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.path }}'
        checksum: '${{ "sha256:" + (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.sha256 }}'
        owner: root
        group: root
        mode: '0755'
      inputs: {}
  - name: Check Swamp link
    labels:
      role: swamp
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/link'
      behaviorName: '${{ ("swamp-link-"+string(inputs.node_id)).split(".").join("-") }}'
      methodName: check
      globalArgs:
        nodeHost: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.host }}'
        nodeUser: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.user }}'
        nodePort: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.port }}'
        nodeIdentityFile: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.identity_file }}'
        become: true
        path: /usr/local/bin/swamp
        ensure: present
        target: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.path }}'
      inputs: {}
  - name: Check Swamp identity
    labels:
      role: swamp
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ ("swamp-identity-file-"+string(inputs.node_id)).split(".").join("-") }}', methodName: check, globalArgs: {
        nodeHost: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[]}
          : inputs.intent.runtime.swamp).ssh_execution.target.host }}', nodeUser: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[]}
          : inputs.intent.runtime.swamp).ssh_execution.target.user }}', nodePort: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[]}
          : inputs.intent.runtime.swamp).ssh_execution.target.port }}', nodeIdentityFile: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[]}
          : inputs.intent.runtime.swamp).ssh_execution.identity_file }}', become: true, path: /etc/orbit/swamp-role-worker/ssh-identity, ensure: present, owner: root, group: '${{ (inputs.intent.runtime.swamp
          == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[]} : inputs.intent.runtime.swamp).user
          }}', mode: '0440'}, inputs: {}}
  labels:
    role: swamp
- name: Check Swamp runtime_job
  dependsOn:
  - {job: swamp_check_job, condition: {type: succeeded}}
  steps:
  - name: Check Swamp runtime
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task: {type: assert, expr: '["Check Swamp binary", "Check Swamp link", "Check Swamp serve", "Check Swamp worker unit", "Check Swamp identity"].all(k, steps[k].outputs.status == "compliant") && (inputs.intent.runtime.swamp
        == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[]} : inputs.intent.runtime.swamp).workers.all(w,
        steps["Check " + w].outputs.status == "compliant")', severity: high, message: 'The swamp role''s binary, serve, workers or SSH identity drifted'}
    labels:
      role: swamp
  labels:
    role: swamp
- name: phase_51
  labels: {role: swamp}
  steps:
  - name: Sign role certificates
    labels: {role: swamp}
    writes: true
    forEach: {item: leaf, in: '${{ inputs.intent.certificates.leaves }}'}
    task:
      type: workflow
      workflowIdOrName: node-role-certificate-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        parent_run_id: '${{ has(inputs.parent_run_id) && inputs.parent_run_id != "" ? inputs.parent_run_id : run.id }}'
        leaf: ${{ self.leaf }}
        ssh:
          name: ${{ "role-add-certificate-"+string(self.leaf.node_id)+"-"+self.leaf.scope }}
          transport: {kind: ssh, user: '${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.user
              }}', port: '${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.port }}', identityFile: '${{
              inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.identity_file }}'}
          hosts:
          - name: target
            address: ${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.host }}
            transport: {hostKeys: '${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.host_keys
                }}'}
  dependsOn:
  - job: Check Swamp runtime_job
    condition: {type: succeeded}
- name: phase_52
  labels: {role: swamp}
  steps:
  - name: Publish PHP pools
    labels: {role: swamp}
    writes: true
    forEach: {item: publication, in: '${{ inputs.intent.publications.filter(p, p.after.php != null && (p.after.php.configurations.size() > 0 ||
        (p.before.php != null && p.before.php.configurations.size() > 0))) }}'}
    task:
      type: workflow
      workflowIdOrName: operation-route-php-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: {node_id: '${{ self.publication.node_id }}', user: '${{ self.publication.connection.nodeUser }}', control_node_id: '${{ self.publication.control_node_id }}', host_keys: '${{
            self.publication.host_keys }}', connection: '${{ self.publication.connection }}', before: '${{ self.publication.before.php }}', after: '${{
            self.publication.after.php }}', direction: forward}
        execution_secrets: {}
  dependsOn:
  - job: phase_51
    condition: {type: succeeded}
- name: publication
  labels: {role: swamp}
  steps:
  - name: Publish role sites
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-publication-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 180 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags publication
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: phase_52
    condition: {type: succeeded}
- name: firewall
  labels: {role: swamp}
  steps:
  - name: Open the firewall
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-firewall-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags firewall
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: publication
    condition: {type: succeeded}
- name: phase_56
  labels: {role: swamp}
  steps:
  - name: Publish private DNS
    labels: {role: swamp}
    writes: true
    forEach: {item: publication, in: '${{ inputs.intent.publications.filter(p,p.after.dns != null) }}'}
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.publication.node_id }}
          connection: ${{ self.publication.connection }}
          host_keys: ${{ self.publication.host_keys }}
          before: ${{ self.publication.before.dns }}
          after: ${{ self.publication.after.dns }}
          alternatives: []
        execution_secrets: {}
  dependsOn:
  - job: firewall
    condition: {type: succeeded}
- name: exporters
  labels: {role: swamp}
  steps:
  - name: Add the exporters
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-exporters-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags exporters
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
    guard: ${{ inputs.intent.exporters.size() == 0 }}
  dependsOn:
  - job: phase_56
    condition: {type: succeeded}
- name: prometheus
  labels: {role: swamp}
  steps:
  - name: Publish Prometheus
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-prometheus-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags prometheus
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
    guard: ${{ inputs.intent.prometheus == null }}
  dependsOn:
  - job: exporters
    condition: {type: succeeded}
- name: role
  labels: {role: swamp}
  steps:
  - name: Check the role
    labels: {role: swamp}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-role-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 60 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags check "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: prometheus
    condition: {type: succeeded}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: "intent", condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: "private-metrics_password", condition: *settled}
  - {job: "private-websocket_environment", condition: *settled}
  - {job: "private-analytics_environment", condition: *settled}
  - {job: "input", condition: *settled}
  - {job: "phase_0", condition: *settled}
  - {job: "phase_1", condition: *settled}
  - {job: "ansible", condition: *settled}
  - {job: "prerequisites", condition: *settled}
  - {job: "phase_13", condition: *settled}
  - {job: "node", condition: *settled}
  - {job: "analytics_storage", condition: *settled}
  - {job: "phase_46", condition: *settled}
  - {job: "phase_47", condition: *settled}
  - {job: "analytics_migrate", condition: *settled}
  - {job: "phase_48", condition: *settled}
  - {job: "readiness", condition: *settled}
  - {job: "swamp_runtime_job", condition: *settled}
  - {job: "swamp_workers_job", condition: *settled}
  - {job: "swamp_check_job", condition: *settled}
  - {job: "Check Swamp runtime_job", condition: *settled}
  - {job: "phase_51", condition: *settled}
  - {job: "phase_52", condition: *settled}
  - {job: "publication", condition: *settled}
  - {job: "firewall", condition: *settled}
  - {job: "phase_56", condition: *settled}
  - {job: "exporters", condition: *settled}
  - {job: "prometheus", condition: *settled}
  - {job: "role", condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
  - name: Remove init containers
    concurrency: 1
    guard: ${{ inputs.kind == "node.role_converge" }}
    labels: {role: swamp}
    writes: true
    allowFailure: true
    forEach: {item: initialization, in: '${{ inputs.intent.runtime.analytics == null ? [] : inputs.intent.runtime.analytics.initialize }}'}
    dataOutputOverrides:
    - {specName: state, vaultName: orbit-control-inputs}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_container'
      behaviorName: ${{ "role-add-analytics-init-cleanup-"+string(inputs.node_id) + "-"+string(self._index) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true, name: '${{ self.initialization.name }}', image: '${{
          self.initialization.image }}', ensure: absent}
      inputs: {}
