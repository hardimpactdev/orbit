id: dd1ccba6-5339-44da-8040-616a905706a4
name: operation-task-publish
description: Publish the admitted checked commit in the chart's six steps; task VM work is official SSH exec argv, a task copy's export is its workspace phase, 209 work is inline git and gh api.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.publish]}
    # The root run of the Operation, which the Gateway checks when it mints. A parent run passes its own; a run started by the Gateway is the root.
    run_id: {type: string, pattern: '^[a-f0-9-]{36}$'}
    intent:
      type: object
      properties:
        group_id:
          type: integer
          minimum: 1
        instance_id:
          type: integer
          minimum: 1
        node_id:
          type: integer
          minimum: 1
        check:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        checkout_path:
          type: string
          minLength: 1
        base:
          type: string
          minLength: 1
        remote:
          type: string
          minLength: 1
        refspec:
          type: string
          minLength: 1
        pull_head:
          type: string
          minLength: 1
        commit:
          type: string
          pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
        tree:
          type: string
          pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        branch:
          type: string
          pattern: ^task-[1-9][0-9]*$
        object_format:
          type: string
          enum:
          - sha1
          - sha256
        # A task copy: its recorded container, its start commit and the path of the .env Orbit wrote (docs/reference/tasks.md#task-copy).
        workspace:
          type: object
          properties:
            runtime:
              type: object
              properties:
                project: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'}
                name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'}
              required: [project, name]
              additionalProperties: false
            branch: {type: string, minLength: 1}
            snapshot_id: {type: string, format: uuid}
            start: {type: string, pattern: '^(?:[a-f0-9]{40}|[a-f0-9]{64})$'}
            environment_path: {type: string, minLength: 1, pattern: '^[^/]'}
          required: [runtime, branch, snapshot_id, start, environment_path]
          additionalProperties: false
        pull_request:
          default: null
          anyOf:
          - type: 'null'
          - type: object
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 256
              body:
                type: string
                maxLength: 65536
              draft:
                type: boolean
            required:
            - title
            - body
            additionalProperties: false
        ssh_execution:
          type: object
          properties:
            target:
              type: object
              properties:
                node_id:
                  type: integer
                  minimum: 1
                host:
                  type: string
                  minLength: 1
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                user:
                  type: string
                  minLength: 1
                host_keys:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                name:
                  type: string
                  enum:
                  - target
              required:
              - host
              - port
              - user
              - host_keys
              - name
              additionalProperties: false
            control_node_id:
              type: integer
              enum:
              - 209
            public_key:
              type: string
              minLength: 1
          required:
          - identity_file
          - target
          - control_node_id
          - public_key
          additionalProperties: true
      required:
      - group_id
      - instance_id
      - node_id
      - check
      - checkout_path
      - base
      - remote
      - refspec
      - pull_head
      - commit
      - tree
      - repository
      - branch
      - object_format
      - pull_request
      - ssh_execution
      additionalProperties: false
    # Vault references only. A task copy's run also names the .env Orbit renders for the Instance (docs/reference/tasks.md#task-copy).
    execution_secrets:
      type: object
      propertyNames: {enum: [github_token, git_authorization, environment]}
      maxProperties: 3
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^task-publish-(?:token-[a-f0-9-]{36}|environment-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: Create publication scratch
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-scratch-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 5 mktemp -d /tmp/orbit-task-publish-XXXXXXXX
    writes: true
  - name: Preflight the copy
    # A task copy: its checkout is read as agent through its Node, and the bundle comes to this worker. The task VM steps skip.
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ !("workspace" in inputs.intent) }}'
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        phase: preflight
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution} }}'
    dependsOn:
    - step: Create publication scratch
      condition:
        type: succeeded
  - name: Export the copy
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ !("workspace" in inputs.intent) }}'
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        phase: export
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution, "checkout_fingerprint": steps["Preflight the copy"].outputs.evidence.evidence.checkout_fingerprint, "candidate": {"head": inputs.intent.commit, "tree": inputs.intent.tree}, "worker_bundle": steps["Create publication scratch"].outputs.stdout.trim() + "/candidate.bundle", "environment_path": inputs.intent.workspace.environment_path, "worker_environment": steps["Create publication scratch"].outputs.stdout.trim() + "/environment"} }}'
    dependsOn:
    - step: Preflight the copy
      condition:
        type: succeeded
  - name: Read the index
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ "workspace" in inputs.intent }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-index-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-publish-" + run.id + ".index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - read-tree
        - HEAD
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-publish-index-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: Create publication scratch
      condition:
        type: succeeded
    writes: true
  - name: Add workspace files
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-add-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-publish-" + run.id + ".index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-publish-add-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: Read the index
      condition:
        type: succeeded
    writes: true
  - name: Read workspace tree
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-tree-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-publish-" + run.id + ".index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-publish-tree-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: Add workspace files
      condition:
        type: succeeded
    writes: true
  - name: Read workspace HEAD
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-head-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '10'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-publish-head-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: Read workspace tree
      condition:
        type: succeeded
  - name: Check the workspace
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-verify-" + string(inputs.intent.node_id) }}
      methodName: verify
      inputs:
        input: ${{ inputs.intent }}
        "steps":
          snapshot-head: ${{ steps["Read workspace HEAD"] }}
          snapshot-tree: ${{ steps["Read workspace tree"] }}
    dependsOn:
    - step: Read workspace HEAD
      condition:
        type: succeeded
  - name: Export the commit
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-export-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - bundle
        - create
        - ${{ "/tmp/orbit-task-publish-" + run.id + ".bundle" }}
        - HEAD
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-publish-export-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: Check the workspace
      condition:
        type: succeeded
    writes: true
  - name: Copy the bundle
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-copy-" + string(inputs.intent.node_id) }}
      methodName: copy
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-task-publish-" + run.id + ".bundle" }}
        dst: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/candidate.bundle" }}
        direction: from
      globalArgs:
        name: ${{ "task-publish-copy-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: Export the commit
      condition:
        type: succeeded
  - name: Init the bare repo
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-init-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 git init --quiet --bare --template= --object-format="$ORBIT_OBJECT_FORMAT" "$ORBIT_REPOSITORY"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_OBJECT_FORMAT: ${{ inputs.intent.object_format }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
    # One of the two bundle steps skips; a skip after a failure must not start the import, so the step of this path must have succeeded.
    guard: '${{ !(("workspace" in inputs.intent ? "Export the copy" : "Copy the bundle") in steps && steps["workspace" in inputs.intent ? "Export the copy" : "Copy the bundle"].status == "succeeded") }}'
    dependsOn:
    - step: Copy the bundle
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Export the copy
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    writes: true
  - name: Import the bundle
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-import-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 60 git -C "$ORBIT_REPOSITORY" fetch --quiet --no-tags "$ORBIT_BUNDLE" "$ORBIT_REF:refs/heads/candidate"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          # A task VM bundles HEAD; a task copy's export bundles only its branch.
          ORBIT_REF: '${{ "workspace" in inputs.intent ? "refs/heads/" + inputs.intent.workspace.branch : "HEAD" }}'
          ORBIT_BUNDLE: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/candidate.bundle" }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
    dependsOn:
    - step: Init the bare repo
      condition:
        type: succeeded
    writes: true
  - name: Read bundle contents
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-bundle-read-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 git -C "$ORBIT_REPOSITORY" rev-parse refs/heads/candidate 'refs/heads/candidate^{tree}'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
    dependsOn:
    - step: Import the bundle
      condition:
        type: succeeded
  - name: Check imported commit
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-imported-" + string(inputs.intent.node_id) }}
      methodName: imported
      inputs:
        input: ${{ inputs.intent }}
        "steps":
          import: ${{ steps["Read bundle contents"] }}
    dependsOn:
    - step: Read bundle contents
      condition:
        type: succeeded
  - name: Check the environment file
    # The .env Orbit wrote never leaves a copy: every commit from the copy's start to the candidate holds that path as the start does.
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ !("workspace" in inputs.intent) }}'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-environment-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: >-
          set -eu;
          base=$(git -C "$ORBIT_REPOSITORY" rev-parse -q --verify "$ORBIT_START:$ORBIT_PATH" || true);
          commits=$(timeout 30 git -C "$ORBIT_REPOSITORY" rev-list "$ORBIT_START..refs/heads/candidate" --);
          for commit in $commits; do
          held=$(git -C "$ORBIT_REPOSITORY" rev-parse -q --verify "$commit:$ORBIT_PATH" || true);
          if [ "$held" != "$base" ]; then echo tasks.publish_secret_path; exit 3; fi;
          done
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_START: ${{ inputs.intent.workspace.start }}
          ORBIT_PATH: ${{ inputs.intent.workspace.environment_path }}
    dependsOn:
    - step: Check imported commit
      condition:
        type: succeeded
  - name: Check the .env content
    # The .env content leaves a copy under no name: neither the whole file nor one of its values of 8 bytes or more that the start
    # tree does not already hold, in any object new in the range or in the pull request text. Both references count: the copy's file,
    # which the agent can change, and the render of the Instance's stored values (docs/reference/tasks.md#task-copy). An error refuses
    # too. A refusal names a path only when the path holds no value.
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ !("workspace" in inputs.intent) }}'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-content-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          umask 077
          export LC_ALL=C
          work=$ORBIT_DIRECTORY/content
          mkdir "$work"
          range="$ORBIT_START..refs/heads/candidate"
          repo() { git -C "$ORBIT_REPOSITORY" "$@"; }
          refuse() { printf 'tasks.publish_secret_content: %s\n' "$1" >&2; exit 3; }
          # A path or folder is named only when it holds no checked value, also with its slashes removed.
          named() {
            if [ -s "$work/checked" ] && { printf '%s\n' "$1" | grep -q -F -f "$work/checked" || printf '%s\n' "$1" | tr -d / | grep -q -F -f "$work/checked"; }; then
              echo "a path that holds a value"
            else
              echo "'${1:-.}'"
            fi
          }
          first() {
            repo log -m -t --reverse --format=%H --find-object="$1" "$range" -- >"$work/first"
            repo log --reverse --format='%H %T' "$range" -- >>"$work/first"
            awk -v id="$1" 'NF == 1 { print; exit } $2 == id { print $1; exit }' "$work/first"
          }
          if [ ! -f "$ORBIT_FILE" ] || [ -L "$ORBIT_FILE" ]; then echo 'tasks.publish_secret_unchecked: the copy has no .env file' >&2; exit 1; fi
          printf '%s' "$ORBIT_ENVIRONMENT" >"$work/rendered"
          printf '%s\n%s\n' "$ORBIT_PULL_TITLE" "$ORBIT_PULL_BODY" >"$work/pull"
          # Each value as written and unescaped: KEY=VALUE also in a comment line, quotes and inline comments removed; other lines whole.
          awk -v quote="'" '
            function out(text, parts, count, i) { count = split(text, parts, /\\n/); for (i = 1; i <= count; i++) if (length(parts[i]) >= 8) print parts[i] }
            function value(text, opening, i, c, raw, plain) {
              opening = substr(text, 1, 1)
              if (opening == "\"") {
                raw = ""; plain = ""
                for (i = 2; i <= length(text); i++) {
                  c = substr(text, i, 1)
                  if (c == "\\" && i < length(text)) {
                    raw = raw c substr(text, i + 1, 1)
                    plain = plain (substr(text, i + 1, 1) == "n" ? "\\n" : substr(text, i + 1, 1)); i++; continue
                  }
                  if (c == "\"") break
                  raw = raw c; plain = plain c
                }
                out(raw); out(plain); return
              }
              if (opening == quote) { i = index(substr(text, 2), quote); out(i ? substr(text, 2, i - 1) : substr(text, 2)); return }
              sub(/[ \t]+#.*$/, "", text); out(text)
            }
            { sub(/\r$/, ""); line = $0; sub(/^[ \t]+/, "", line); sub(/[ \t]+$/, "", line) }
            line == "" { next }
            substr(line, 1, 1) == "#" { line = substr(line, 2); sub(/^[ \t]+/, "", line) }
            match(line, /^(export[ \t]+)?[A-Za-z_][A-Za-z0-9_.-]*[ \t]*=[ \t]*/) { value(substr(line, RLENGTH + 1)); next }
            { out(line); last = substr(line, length(line), 1); if (last == "\"" || last == quote) out(substr(line, 1, length(line) - 1)) }
          ' "$ORBIT_FILE" "$work/rendered" >"$work/all"
          sort -u "$work/all" >"$work/values"
          : >"$work/checked"
          if [ -s "$work/values" ]; then
            timeout 60 git -C "$ORBIT_REPOSITORY" grep -a -h -o -F -f "$work/values" "$ORBIT_START" -- >"$work/public" || [ $? -eq 1 ]
            grep -v -x -F -f "$work/public" "$work/values" >"$work/checked" || [ $? -eq 1 ]
          fi
          timeout 60 git -C "$ORBIT_REPOSITORY" rev-list --objects "$range" -- >"$work/objects"
          for file in "$ORBIT_FILE" "$work/rendered"; do
            if [ -s "$file" ]; then
              id=$(repo hash-object --no-filters --stdin <"$file")
              match=$(awk -v id="$id" '$1 == id { print; exit }' "$work/objects")
              if [ -n "$match" ]; then refuse "the whole .env is the file $(named "${match#* }") ($id) in commit $(first "$id")"; fi
            fi
          done
          if [ ! -s "$work/checked" ]; then exit 0; fi
          if grep -q -a -F -f "$work/checked" "$work/pull"; then refuse "a value of the .env is in the pull request title or body"; fi
          cut -d ' ' -f 1 "$work/objects" >"$work/ids"
          { timeout 120 git -C "$ORBIT_REPOSITORY" cat-file --batch <"$work/ids"; echo $? >"$work/batch"; } | grep -c -a -F -f "$work/checked" >"$work/hits" || [ $? -eq 1 ]
          [ "$(cat "$work/batch")" = 0 ]
          if [ "$(cat "$work/hits")" = 0 ]; then exit 0; fi
          while read -r id path; do
            kind=$(repo cat-file -t "$id")
            if repo cat-file "$kind" "$id" | grep -q -a -F -f "$work/checked"; then
              case $kind in
                commit) refuse "a value of the .env is in the message or author of commit $id" ;;
                tree) refuse "a value of the .env is in a file name in folder $(named "$path") ($id) in commit $(first "$id")" ;;
                *) refuse "a value of the .env is in the file $(named "$path") ($id) in commit $(first "$id")" ;;
              esac
            fi
          done <"$work/objects"
          refuse "a value of the .env is in an object of the range"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_FILE: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/environment" }}
          ORBIT_START: ${{ inputs.intent.workspace.start }}
          ORBIT_ENVIRONMENT: ${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}
          ORBIT_PULL_TITLE: '${{ inputs.intent.pull_request == null ? "" : inputs.intent.pull_request.title }}'
          ORBIT_PULL_BODY: '${{ inputs.intent.pull_request == null ? "" : inputs.intent.pull_request.body }}'
    dependsOn:
    - step: Check the environment file
      condition:
        type: succeeded
    writes: true
  - name: Mint the push token
    labels:
      role: swamp
    queueTimeout: 30
    # A copy mints only after its content check succeeded; a skip of that check is never a pass.
    guard: '${{ "workspace" in inputs.intent && !("Check the .env content" in steps && steps["Check the .env content"].status == "succeeded") }}'
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: '${{ has(inputs.run_id) ? inputs.run_id : run.id }}'
        purpose: publish
    dependsOn:
    - step: Check imported commit
      condition:
        type: succeeded
    - step: Check the environment file
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Check the .env content
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
  - name: Push the branch
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-push-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 60 git -C "$ORBIT_REPOSITORY" push --porcelain -- "$ORBIT_REMOTE" "$ORBIT_REFSPEC" >"$ORBIT_DIRECTORY/push.stdout" 2>"$ORBIT_DIRECTORY/push.stderr"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ALLOW_PROTOCOL: https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: core.hooksPath
          GIT_CONFIG_VALUE_1: /dev/null
          GIT_CONFIG_KEY_2: http.followRedirects
          GIT_CONFIG_VALUE_2: 'false'
          GIT_CONFIG_KEY_3: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_3: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key) }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_REMOTE: ${{ inputs.intent.remote }}
          ORBIT_REFSPEC: ${{ inputs.intent.refspec }}
        ignoreExitCode: true
    dependsOn:
    - step: Mint the push token
      condition:
        type: succeeded
    writes: true
  - name: Read push result
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-pushed-" + string(inputs.intent.node_id) }}
      methodName: pushed
      inputs:
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Push the branch"].outputs.exitCode }}
    dependsOn:
    - step: Push the branch
      condition:
        type: succeeded
  - name: Read open PRs
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-pull-read-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method GET "$ORBIT_PATH" -f state=open -f head="$ORBIT_HEAD" -f per_page=100 >"$ORBIT_DIRECTORY/pulls.json" 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_PATH: ${{ "repos/" + inputs.intent.repository + "/pulls" }}
          ORBIT_HEAD: ${{ inputs.intent.pull_head }}
        ignoreExitCode: true
    dependsOn:
    - step: Read push result
      condition:
        type: succeeded
    guard: ${{ inputs.intent.pull_request == null }}
  - name: Plan the PR
    writes: true
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-pull-plan-" + string(inputs.intent.node_id) }}
      methodName: pull
      inputs:
        input: ${{ inputs.intent }}
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Read open PRs"].outputs.exitCode }}
    dependsOn:
    - step: Read open PRs
      condition:
        type: succeeded
    guard: ${{ inputs.intent.pull_request == null }}
  - name: Write the PR
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-pull-write-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method "$ORBIT_METHOD" "$ORBIT_PATH" --input "$ORBIT_BODY_FILE" >"$ORBIT_DIRECTORY/pull.json" 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_METHOD: ${{ steps["Plan the PR"].outputs.method }}
          ORBIT_PATH: ${{ steps["Plan the PR"].outputs.path }}
          ORBIT_BODY_FILE: ${{ steps["Plan the PR"].outputs.body_file }}
        ignoreExitCode: true
    dependsOn:
    - step: Plan the PR
      condition:
        type: succeeded
    writes: true
    guard: ${{ inputs.intent.pull_request == null }}
  - name: Read PR result
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-pull-result-" + string(inputs.intent.node_id) }}
      methodName: written
      inputs:
        input: ${{ inputs.intent }}
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Write the PR"].outputs.exitCode }}
        number: ${{ steps["Plan the PR"].outputs.number }}
    dependsOn:
    - step: Write the PR
      condition:
        type: succeeded
    guard: ${{ inputs.intent.pull_request == null }}
- name: cleanup
  labels:
    role: swamp
  dependsOn:
  - job: publish
    condition:
      type: completed
  steps:
  - name: Revoke the token
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-revoke-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method DELETE installation/token 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    guard: ${{ !("Mint the push token" in steps && steps["Mint the push token"].status == "succeeded") }}
    allowFailure: true
    writes: true
  - name: Remove remote scratch
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ "workspace" in inputs.intent }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-publish-remote-cleanup-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '10'
        - rm
        - -f
        - --
        - ${{ "/tmp/orbit-task-publish-" + run.id + ".index" }}
        - ${{ "/tmp/orbit-task-publish-" + run.id + ".bundle" }}
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-publish-remote-cleanup-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    allowFailure: true
    writes: true
  - name: Discard the copy scratch
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ !("Preflight the copy" in steps && steps["Preflight the copy"].status == "succeeded") }}'
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        phase: discard
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution, "checkout_fingerprint": steps["Preflight the copy"].outputs.evidence.evidence.checkout_fingerprint} }}'
    allowFailure: true
  - name: Remove local scratch
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-local-cleanup-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_DIRECTORY" "$ORBIT_GH_DIRECTORY"
        env:
          ORBIT_DIRECTORY: '${{ "Create publication scratch" in steps && steps["Create publication scratch"].status == "succeeded" ? steps["Create publication scratch"].outputs.stdout.trim()
            : "" }}'
          ORBIT_GH_DIRECTORY: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
    writes: true
  - name: Confirm publication
    labels:
      role: swamp
    queueTimeout: 30
    dependsOn:
    # The revoke is guarded off when no token was minted, and each path guards off the other path's scratch step;
    # a skipped dependency must still let the end check run.
    - step: Revoke the token
      condition: {type: or, conditions: [{type: completed}, {type: skipped}]}
    - step: Remove remote scratch
      condition: {type: or, conditions: [{type: completed}, {type: skipped}]}
    - step: Remove local scratch
      condition:
        type: completed
    - step: Discard the copy scratch
      condition: {type: or, conditions: [{type: completed}, {type: skipped}]}
    task:
      type: assert
      expr: '"Read push result" in steps && steps["Read push result"].status == "succeeded" && (inputs.intent.pull_request == null || ("Read PR result" in steps && steps["Read PR result"].status
        == "succeeded")) && steps["Remove local scratch"].status == "succeeded"'
      message: Task publication or scratch cleanup failed.
      severity: high
