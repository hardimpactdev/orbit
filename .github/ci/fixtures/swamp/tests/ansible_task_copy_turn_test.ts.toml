# The stop cases (task 5402) have no hosted receipt: the settle cases' 70s and 100s and the cut-run stop's 60s are ESTIMATES over local runs of 19s
# alone, 57.3s and 40.7s two units at a time (tools/tests/ci-task-copy-turn-costs.json), until a hosted run.
# The Codex create case (task 5645) has no hosted receipt: its 40s is an ESTIMATE over a 19s local run of its three phases, until a hosted run.
# Task 5873: the ID readback case's 30s is local 20s plus headroom, and the settle-over case's 80s is an ESTIMATE over a local 57s run now that it
# reads each recorded run through the helper (tools/tests/ci-task-copy-turn-costs.json), until a hosted run.
# One case per slice prevents several slow Ansible paths sharing one unit.
