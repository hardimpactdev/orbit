id: db23a0cf-d815-42eb-b769-4323db8133fe
name: operation-task-vms
description: Claim a bounded batch of this family on its placed workers.
inputs:
  properties:
    operation_id: { type: integer, minimum: 0, default: 0 }
    node_id: { type: integer, minimum: 0, default: 0 }
    kind: { type: string, enum: [poll, task_vm.lifecycle_intent], default: poll }
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "1,31 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        guard: '${{ inputs.operation_id > 0 }}'
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-task-vms-discovery
          methodName: discover
          inputs:
            family: operation-task-vms
            kinds: ["task_vm.incus_create", "task_vm.incus_start", "task_vm.incus_stop", "task_vm.incus_delete", "task_vm.model_issue", "task_vm.model_revoke", "task_vm.pi_upload", "task_vm.runtime_confirm", "task_vm.pi_install", "task_vm.configure_runtime", "task_vm.upcloud_create", "task_vm.upcloud_start", "task_vm.upcloud_stop", "task_vm.upcloud_hard_stop", "task_vm.upcloud_delete", "task_vm.prepare_enrollment", "task_vm.enroll_node", "task_vm.mark_destroying", "task_vm.forget_workspaces", "task_vm.destroy_records", "task_vm.stop_worker", "task_vm.upcloud_image_prepare", "task_vm.upcloud_image_launch_builder", "task_vm.upcloud_image_launch_smoke", "task_vm.upcloud_image_stop", "task_vm.upcloud_image_hard_stop_builder", "task_vm.upcloud_image_hard_stop_smoke", "task_vm.upcloud_image_templatize", "task_vm.upcloud_image_delete_builder", "task_vm.upcloud_image_delete_smoke", "task_vm.upcloud_image_promote", "task_vm.upcloud_image_prune_template", "task_vm.upcloud_image_discard_template", "task_vm.upcloud_guest_guest_cloud_init", "task_vm.upcloud_guest_image_owner", "task_vm.upcloud_guest_image_boot", "task_vm.upcloud_guest_image_firewall", "task_vm.upcloud_guest_image_check", "task_vm.upcloud_guest_image_trust_ca", "task_vm.upcloud_guest_image_clean", "task_vm.upcloud_guest_image_recipe_marker", "task_vm.upcloud_guest_image_start_phase", "task_vm.upcloud_guest_image_verify", "task_vm.upcloud_guest_agent_install_guest", "task_vm.upcloud_guest_pi_upload_guest", "task_vm.prepare_runtime", "task_vm.provision", "task_vm.enroll", "task_vm.resume", "task_vm.destroy", "task_vm.upcloud_image_build"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ inputs.operation_id > 0 ? [] : (has(steps.discover.outputs) ? steps.discover.outputs.work : []) }}"
        task:
          type: workflow
          workflowIdOrName: operation-task-vm-dispatch
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
            behavior: '${{ "operation-task-vms-slot-" + string(self.work.slot) }}'
  - name: acknowledge
    target: swamp209-migration-a
    labels: { node: "209", pool: migration }
    steps:
      - name: lifecycle-intent
        guard: '${{ inputs.operation_id == 0 }}'
        writes: true
        task:
          type: behavior
          behaviorType: '@nckrtl/task-vm-lifecycle-intent'
          behaviorName: task-vm-lifecycle-intent
          methodName: execute
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            run_id: '${{ run.id }}'
