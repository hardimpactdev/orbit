          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - -H
        - -u
        - ${{ inputs.intent.user }}
        - --
        - /usr/bin/env
        - -C
        - ${{ inputs.intent.home.path }}
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - cd -- "$1" 2>/dev/null || { echo absent; echo missing; exit 0; }; if [ -L "$2" ]; then echo unsafe; elif [ -f "$2"
          ]; then echo regular; elif [ -e "$2" ]; then echo other; else echo absent; fi; if [ -L composer.json ]; then echo
          unsafe; elif [ ! -e composer.json ]; then echo missing; elif [ -f composer.json ]; then echo file; head -c 1048577
          composer.json; else echo unsafe; fi
        - sh
        - ${{ inputs.intent.application }}
        - '${{ has(inputs.intent.entry_point) && inputs.intent.entry_point != null ? inputs.intent.entry_point : "artisan"
          }}'
  - name: source-result
    labels:
      role: swamp
    dependsOn:
    - step: source-profile-read
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "src-25" }}
      methodName: provisioningResult
      inputs:
        intent: ${{ inputs.intent }}
        profile: ${{ steps["source-profile-read"].outputs }}
        branch: ${{ steps["source-selected"].outputs.branch }}
        commit: ${{ steps["source-commit"].outputs }}
queueTimeout: 60
