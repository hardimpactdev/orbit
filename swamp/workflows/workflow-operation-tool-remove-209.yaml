id: 5c48c4ee-452a-4dd5-8f14-5d3e1b681445
name: operation-tool-remove-209
description: Tool removal from 209 in the steps of flows/tool.remove.mmd, one shipped phase script per step through official SSH.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [tool.remove]}
    intent: {type: object}
    ssh: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, ssh]
  additionalProperties: false
# Node steps carry their flow chart labels (ADR 0246); lowercase steps are typed work on 209 that the chart does not show.
jobs:
- name: tools
  steps:
  - name: assets
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/tool-remove-command'
      behaviorName: '${{ "tr-assets-" + run.id }}'
      methodName: assets
      inputs: {input: '${{ inputs.intent }}'}
  # The installed package and, for apt and brew, what removing it would also remove.
  - name: Plan the removal
    labels: {role: swamp}
    dependsOn: [{step: assets, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tr-plan-" + run.id }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ "tr-ssh-" + run.id }}'
        transport:
          kind: ssh
          user: '${{ inputs.ssh.target.user }}'
          port: '${{ inputs.ssh.target.port }}'
          identityFile: '${{ inputs.ssh.identity_file }}'
          identitiesOnly: true
          hostKeys: '${{ inputs.ssh.target.host_keys }}'
        hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 65
        argv: [timeout, '60', python3, -I, -c, '${{ steps.assets.outputs.driver }}', plan]
        stdin: '${{ steps.assets.outputs.bundle }}'
  # Refuse a plan that removes anything else, a Composer non-root or an unsafe cask; nothing changes then.
  - name: decide
    labels: {role: swamp}
    dependsOn: [{step: Plan the removal, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/tool-remove-command'
      behaviorName: '${{ "tr-decide-" + run.id }}'
      methodName: decide
      inputs: {input: '${{ inputs.intent }}', plan: '${{ steps["Plan the removal"] }}'}
  - name: Remove the package
    labels: {role: swamp}
    dependsOn: [{step: decide, condition: {type: succeeded}}]
    guard: '${{ !steps.decide.outputs.remove }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tr-remove-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 125
        argv: [timeout, '120', python3, -I, -c, '${{ steps.assets.outputs.driver }}', remove]
        stdin: '${{ steps.assets.outputs.bundle }}'
  - name: Check it is gone
    labels: {role: swamp}
    dependsOn: [{step: Remove the package, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tr-check-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 65
        argv: [timeout, '60', python3, -I, -c, '${{ steps.assets.outputs.driver }}', gone]
        stdin: '${{ steps.assets.outputs.bundle }}'
  # Best-effort: the package is already gone, so a failure here keeps the apt repository record for a later cleanup.
  - name: Remove the apt source
    labels: {role: swamp}
    allowFailure: true
    dependsOn:
      - {step: decide, condition: {type: succeeded}}
      - {step: Check it is gone, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ !inputs.intent.remove_repository || !steps.decide.outputs.ready || (steps.decide.outputs.remove && !("Check it is gone" in steps && steps["Check it is gone"].status == "succeeded")) }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tr-source-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 65
        argv: [timeout, '60', python3, -I, -c, '${{ steps.assets.outputs.driver }}', remove_source]
        stdin: '${{ steps.assets.outputs.bundle }}'
  - name: result
    labels: {role: swamp}
    dependsOn:
      - {step: Plan the removal, condition: {type: always}}
      - {step: decide, condition: {type: always}}
      - {step: Remove the package, condition: {type: always}}
      - {step: Check it is gone, condition: {type: always}}
      - {step: Remove the apt source, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/tool-remove-command'
      behaviorName: '${{ "tr-result-" + run.id }}'
      methodName: result
      inputs:
        input: '${{ inputs.intent }}'
        plan: '${{ "Plan the removal" in steps ? steps["Plan the removal"] : null }}'
        decision: '${{ "decide" in steps ? steps.decide : null }}'
        remove: '${{ "Remove the package" in steps ? steps["Remove the package"] : null }}'
        check: '${{ "Check it is gone" in steps ? steps["Check it is gone"] : null }}'
        source: '${{ "Remove the apt source" in steps ? steps["Remove the apt source"] : null }}'
  - name: accepted
    labels: {role: swamp}
    dependsOn: [{step: result, condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps.result.outputs.ok == true', severity: high, message: The Tool removal did not prove the package absent.}
