---
- name: Read the OS
  ansible.builtin.setup: { gather_subset: [min] }
- name: Require the recipe release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == recipe.ubuntu.release
    quiet: true
- name: Resolve the tools of the profile
  vars:
    names: "{{ (recipe.common + recipe[profile]) | unique | list }}"
    versions: "{{ names | select('match', '^php:') | map('regex_replace', '^php:', '') | list }}"
    php_names: "{{ versions | map('extract', recipe.php.versions) | map(attribute='packages') | flatten + recipe.php.shared }}"
  ansible.builtin.set_fact:
    php_versions: "{{ versions }}"
    tool_list: >-
      {%- set out = [] -%}
      {%- for name in (names | reject('match', '^php:') | list + php_names) | unique -%}
      {%- set tool = recipe.tools[name] -%}
      {%- set artifact = (tool.artifacts | default({}))['amd64'] | default({}) -%}
      {%- set digest = artifact.sha256 | default(artifact.sha512 | default('')) -%}
      {%- set _ = out.append({
          'name': name, 'source': tool.source, 'package': tool.package | default(name),
          'version': artifact.version | default(tool.version), 'url': artifact.url | default(''),
          'sha256': artifact.sha256 | default(''), 'sha512': artifact.sha512 | default(''),
          'path': '/var/cache/orbit/debs/' ~ name ~ '_' ~ digest ~ '.deb'}) -%}
      {%- endfor -%}
      {{ out }}
- name: Split the tools by how they install
  ansible.builtin.set_fact:
    ubuntu_tools: "{{ tool_list | selectattr('source', 'equalto', 'ubuntu') | list }}"
    deb_tools: "{{ tool_list | selectattr('url', 'match', '.*[.]deb$') | list }}"
    tool_by_name: "{{ dict(tool_list | map(attribute='name') | zip(tool_list)) }}"
- name: Name the shape gate tools
  vars:
    pins: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/shape-gate-requirements.txt', rstrip=False)
      ~ lookup('ansible.builtin.file', playbook_dir ~ '/requirements.txt', rstrip=False) }}
    gate_collections: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/requirements.yml', rstrip=False) }}"
  ansible.builtin.set_fact:
    shape_venv: "/opt/orbit-shape-gate/venv-{{ pins | hash('sha256') | truncate(16, True, '') }}"
    shape_collections: "/opt/orbit-shape-gate/collections-{{ gate_collections | hash('sha256') | truncate(16, True, '') }}"
- name: Name the packages that the snapshot pins
  ansible.builtin.set_fact:
    # Not in the recipe: the snapshot date is their pin. The shape gate builds its venv with python3-venv, and its Swamp load test pipes through jq.
    snapshot_packages: [python3-venv, jq]
# What the VM already converged to (docs/cli/task/vm-image-refresh.mmd). Each phase records the digest of its inputs and of the role's
# code when it ends; a phase whose digest is unchanged is skipped, so a converge on a current image changes nothing and restarts nothing.
- name: Read what the VM converged to
  ansible.builtin.command: { argv: [grep, -rH, "", "{{ converge_stamps_dir }}"] }
  register: converge_read
  changed_when: false
  failed_when: converge_read.rc not in [0, 2]
- name: Work out what changed
  vars:
    # Every file the role reads: its tasks, the shared task files they include and the pins of the shape gate, in a fixed order.
    files: >-
      {{ ['task-vm-role.yml', 'requirements.txt', 'requirements.yml', 'shape-gate-requirements.txt', 'transport-exit-codes.json',
          'library/orbit_artifact.py']
      | map('regex_replace', '^', playbook_dir ~ '/') | list }}
    code: "{{ query('ansible.builtin.file', *(files + (query('ansible.builtin.fileglob', playbook_dir ~ '/tasks/*.yml') | sort))) | join | hash('sha256') }}"
    tools_input: "{{ code ~ (recipe | to_json) ~ profile ~ (intent.fleet.network | default('')) }}"
    # The operator join reads only the operator end and the container names; what the fleet is built from does not redo it.
    fleet_intent: "{{ intent.fleet | default({}) }}"
    operator_input: "{{ code ~ (fleet_intent.operator | default({}) | to_json) ~ (fleet_intent.guests | default({}) | to_json) }}"
  ansible.builtin.set_fact:
    converge_stamps: "{{ dict(converge_read.stdout_lines | map('regex_replace', '^.*/([^/:]+):.*$', '\\1')
      | zip(converge_read.stdout_lines | map('regex_replace', '^[^:]*:', ''))) }}"
    converge_digests:
      software: "{{ (code ~ (recipe | to_json) ~ profile) | hash('sha256') }}"
      tools: "{{ tools_input | hash('sha256') }}"
      boot: "{{ (code ~ (intent.boot | default({}) | to_json)) | hash('sha256') }}"
      check: "{{ (tools_input ~ 'check') | hash('sha256') }}"
      operator: "{{ operator_input | hash('sha256') }}"
# A part is due when its recorded digest differs. The nested Swamp tokens last 30 days, so their renewal is due a week after the last one.
- name: Work out which parts are due
  ansible.builtin.set_fact:
    converge_due: >-
      {%- set out = {} -%}
      {%- for name, digest in converge_digests.items() -%}
      {%- set _ = out.update({name: converge_stamps[name] | default('') != digest}) -%}
      {%- endfor -%}
      {%- set _ = out.update({'tokens': (now(utc=true).timestamp() | int) - (converge_stamps.tokens | default(0) | int) > 7 * 86400}) -%}
      {{ out }}
