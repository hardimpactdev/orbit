---
- name: Start Incus
  ansible.builtin.systemd: { name: incus.service, state: started, enabled: true }
  when:
    - not ci_check_only
# One read of the CI collections, settings, profile and ACL instead of an `incus` call per item. Each read keeps its
# registered shape, so the changes and checks below judge every item as before; a failed read names its item.
- name: Plan the CI reads
  ansible.builtin.set_fact:
    ci_collection_plan:
      - collection: storage-pools
        name: "{{ plans.ci.pool }}"
        create:
          - storage
          - create
          - "{{ plans.ci.pool }}"
          - dir
      - collection: projects
        name: "{{ plans.ci.project }}"
        create:
          - project
          - create
          - "{{ plans.ci.project }}"
      - collection: network-acls
        name: "{{ plans.ci.acl }}"
        create:
          - network
          - acl
          - create
          - "{{ plans.ci.acl }}"
      - collection: networks
        name: "{{ plans.ci.network }}"
        create:
          - network
          - create
          - "{{ plans.ci.network }}"
          - --type=bridge
          - ipv4.address=auto
          - ipv4.nat=true
          - ipv6.address=none
    ci_setting_plan: >-
      {{ plans.ci.projectConfig | dict2items | map('combine', {'scope': 'project', 'name': plans.ci.project}) | list +
      plans.ci.networkConfig | dict2items | map('combine', {'scope': 'network', 'name': plans.ci.network}) | list }}
- name: Read CI collections, settings, profile and ACL
  ansible.builtin.import_tasks: check-read.yml
  vars:
    check_read_commands: >-
      {%- set out = {'profile': ['incus', 'query', '/1.0/profiles/default?project=' ~ plans.ci.project],
                     'acl': ['incus', 'query', '/1.0/network-acls/' ~ plans.ci.acl]} -%}
      {%- for item in ci_collection_plan -%}
      {%- set _ = out.update({'collection ' ~ item.collection: ['incus', 'query', '/1.0/' ~ item.collection]}) -%}
      {%- endfor -%}
      {%- for item in ci_setting_plan -%}
      {%- set _ = out.update({item.scope ~ ' ' ~ item.name ~ ' ' ~ item.key: ['incus', item.scope, 'get', item.name, item.key]}) -%}
      {%- endfor -%}
      {{ out }}
- name: Require every CI read
  ansible.builtin.assert:
    that: item.value.rc == 0
    fail_msg: "{{ item.key }} could not be read (exit {{ item.value.rc }})."
    quiet: true
  loop: "{{ check_read.commands | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
- name: Keep the CI reads
  ansible.builtin.set_fact:
    ci_collections:
      results: >-
        {%- set out = [] -%}
        {%- for item in ci_collection_plan -%}
        {%- set _ = out.append({'item': item, 'stdout': check_read.commands['collection ' ~ item.collection].stdout}) -%}
        {%- endfor -%}
        {{ out }}
    ci_settings:
      results: >-
        {%- set out = [] -%}
        {%- for item in ci_setting_plan -%}
        {%- set _ = out.append({'item': item, 'stdout': check_read.commands[item.scope ~ ' ' ~ item.name ~ ' ' ~ item.key].stdout}) -%}
        {%- endfor -%}
        {{ out }}
    ci_profile: "{{ check_read.commands.profile }}"
    ci_acl: "{{ check_read.commands.acl }}"
- name: Create missing CI resources
  ansible.builtin.command: { argv: "{{ ['incus', '--project', 'default'] + item.item.create }}" }
  loop: "{{ ci_collections.results }}"
  when:
    - not ci_check_only
    - ('/1.0/' ~ item.item.collection ~ '/' ~ item.item.name) not in item.stdout | from_json
  changed_when: true
- name: Apply changed CI settings
  ansible.builtin.command: { argv: "{{ ['incus', item.item.scope, 'set', item.item.name, item.item.key, item.item.value] }}" }
  loop: "{{ ci_settings.results }}"
  when:
    - not ci_check_only
    - item.stdout | trim != item.item.value
  changed_when: true
- name: Apply the CI profile
  ansible.builtin.command:
    argv:
      - incus
      - --project
      - "{{ plans.ci.project }}"
      - profile
      - edit
      - default
    stdin: "{{ plans.ci.profile | to_json }}"
  when:
    - not ci_check_only
    - (ci_profile.stdout | from_json).config != plans.ci.profile.config or (ci_profile.stdout | from_json).devices != plans.ci.profile.devices or
      (ci_profile.stdout | from_json).description != plans.ci.profile.description
  changed_when: true
- name: Normalize CI egress rules
  ansible.builtin.set_fact:
    ci_egress: >-
      {{ (ci_acl.stdout | from_json).egress | map('dict2items') |
      map('rejectattr', 'value', 'equalto', '') | map('list') | map('items2dict') | list }}
- name: Apply CI egress rules
  vars:
    desired_acl:
      description: Orbit CI runner boundary
      egress: "{{ plans.ci.egress }}"
      ingress: []
      config: {}
  ansible.builtin.command:
    argv:
      - incus
      - network
      - acl
      - edit
      - "{{ plans.ci.acl }}"
    stdin: "{{ desired_acl | to_json }}"
  when:
    - not ci_check_only
    - >-
      ci_egress != plans.ci.egress or (ci_acl.stdout | from_json).ingress != [] or
      (ci_acl.stdout | from_json).config != {} or (ci_acl.stdout | from_json).description != desired_acl.description
  changed_when: true
- name: Check CI resources
  when: ci_check_only
  ansible.builtin.assert: { that: ('/1.0/' ~ item.item.collection ~ '/' ~ item.item.name) in item.stdout | from_json, quiet: true }
  loop: "{{ ci_collections.results }}"
- name: Check CI settings
  when: ci_check_only
  ansible.builtin.assert: { that: item.stdout | trim == item.item.value, quiet: true }
  loop: "{{ ci_settings.results }}"
- name: Check the CI profile
  when: ci_check_only
  ansible.builtin.assert:
    that:
      - (ci_profile.stdout | from_json).config == plans.ci.profile.config
      - (ci_profile.stdout | from_json).devices == plans.ci.profile.devices
      - (ci_profile.stdout | from_json).description == plans.ci.profile.description
    quiet: true
- name: Check CI egress
  when: ci_check_only
  ansible.builtin.assert:
    that:
      - ci_egress == plans.ci.egress
      - (ci_acl.stdout | from_json).ingress == []
      - (ci_acl.stdout | from_json).config == {}
      - (ci_acl.stdout | from_json).description == 'Orbit CI runner boundary'
    quiet: true
