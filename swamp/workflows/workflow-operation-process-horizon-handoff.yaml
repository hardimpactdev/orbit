id: 2c2668b7-1864-48aa-966b-9705870cf69d
name: operation-process-horizon-handoff
description: Horizon handoff on Node 209 through official SSH to the captured Gateway target.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - process.horizon_handoff
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        process_id:
          type: integer
          minimum: 1
        unit:
          type: string
          pattern: ^orbit-process-[1-9][0-9]*-[a-z0-9-]+\.service$
        content:
          type: string
          maxLength: 65536
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        command:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
        directory:
          type: string
          pattern: ^/
        user:
          type: string
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        created:
          type: boolean
        ssh_execution:
          type: object
      required:
      - process_id
      - unit
      - content
      - content_hash
      - command
      - directory
      - user
      - created
      - ssh_execution
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: horizon
  target: orbit-node-209
  labels: &id001
    node: '209'
  steps:
  - name: assets
    target: orbit-node-209
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/horizon-observation'
      behaviorName: ${{ "horizon-observation-" + string(inputs.operation_id) }}
      methodName: assets
      inputs: {}
  - name: prepare-assets
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id002
        name: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-horizon-" + run.id }}
  - name: copy-assets
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id002
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-horizon-" + run.id + "/" }}
        direction: to
        recursive: true
  - name: inspect
    target: orbit-node-209
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "UNIT=" + inputs.intent.unit }}
        - ${{ "PROCESS_ID=" + string(inputs.intent.process_id) }}
        - ${{ "EXPECTED_HASH=" + inputs.intent.content_hash }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-horizon-" + run.id + "/scripts/inspect.py" }}
        sudo: true
      globalArgs: *id002
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
  - name: observation
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/horizon-observation'
      behaviorName: ${{ "horizon-observation-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        stdout: ${{ steps.inspect.outputs.stdout }}
  - name: stage-unit
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.observation.outputs.matches }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "UNIT=" + inputs.intent.unit }}
        - ${{ "PROCESS_ID=" + string(inputs.intent.process_id) }}
        - ${{ "EXPECTED_HASH=" + inputs.intent.content_hash }}
        - ${{ "UNIT_CONTENT=" + inputs.intent.content }}
        - ${{ "CANDIDATE=" + "/etc/orbit/horizon-candidates/" + string(inputs.operation_id) + "-" + inputs.intent.unit
          }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-horizon-" + run.id + "/scripts/stage_unit.py" }}
        sudo: true
      globalArgs: *id002
  - name: validate-unit
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.observation.outputs.matches }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemd-analyze
        - verify
        - ${{ "/etc/orbit/horizon-candidates/" + string(inputs.operation_id) + "-" + inputs.intent.unit }}
        sudo: true
      globalArgs: *id002
  - name: publish-unit
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.observation.outputs.matches }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "UNIT=" + inputs.intent.unit }}
        - ${{ "PROCESS_ID=" + string(inputs.intent.process_id) }}
        - ${{ "EXPECTED_HASH=" + inputs.intent.content_hash }}
        - ${{ "CANDIDATE=" + "/etc/orbit/horizon-candidates/" + string(inputs.operation_id) + "-" + inputs.intent.unit
          }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-horizon-" + run.id + "/scripts/publish_unit.py" }}
        sudo: true
      globalArgs: *id002
  - name: reload-units
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: publish-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.observation.outputs.matches }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - daemon-reload
        sudo: true
      globalArgs: *id002
  - name: enable
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: publish-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: reload-units
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - enable
        - ${{ inputs.intent.unit }}
        sudo: true
      globalArgs: *id002
  - name: graceful-handoff
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: publish-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: reload-units
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: enable
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !steps.observation.outputs.active }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - --user
        - ${{ inputs.intent.user }}
        - --
        - /usr/bin/env
        - ${{ "--chdir=" + inputs.intent.directory }}
        - ${{ inputs.intent.command[0] }}
        - artisan
        - horizon:terminate
        sudo: true
      globalArgs: *id002
  - name: start
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: publish-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: reload-units
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: enable
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: graceful-handoff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.observation.outputs.active }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - start
        - ${{ inputs.intent.unit }}
        sudo: true
      globalArgs: *id002
  - name: verify
    guard: ${{ steps.observation.outputs.active }}
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: publish-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: reload-units
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: enable
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: graceful-handoff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: start
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - is-active
        - --quiet
        - ${{ inputs.intent.unit }}
        sudo: true
      globalArgs: *id002
  - name: result
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: stage-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: validate-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: publish-unit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: reload-units
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: enable
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: graceful-handoff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: start
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: verify
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "horizon-result-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: 'set -eu

          : "${OUTCOME:?}" "${PROCESS_ID:?}"

          printf ''{"ready":true,"state":"%s","outcome":"%s","process_id":%s}\n'' "$STATE" "$OUTCOME" "$PROCESS_ID"

          '
        env:
          UNIT: ${{ inputs.intent.unit }}
          PROCESS_ID: ${{ string(inputs.intent.process_id) }}
          EXPECTED_HASH: ${{ inputs.intent.content_hash }}
          STATE: '${{ steps.observation.outputs.active ? "unknown" : "active" }}'
          OUTCOME: '${{ steps.observation.outputs.active ? "terminated" : (inputs.intent.created ? "created" : "started")
            }}'
  - name: cleanup-assets
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - --
        - ${{ "/tmp/orbit-horizon-" + run.id }}
        sudo: true
    allowFailure: true
