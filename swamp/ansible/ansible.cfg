[defaults]
collections_path = /opt/orbit/ansible/collections
inventory = inventory.yml
forks = 8
gathering = explicit
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
stdout_callback = default
display_skipped_hosts = False
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null
