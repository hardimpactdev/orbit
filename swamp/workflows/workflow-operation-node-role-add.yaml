id: 00fd4b62-f72a-4795-9924-a48704608c88
name: operation-node-role-add
description: Apply role state in idempotent Ansible phases; keep signing, bootstrap and initialization native.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind:
      type: string
      enum: [node.role_add, node.role_converge]
    parent_run_id: {type: string}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum: [orbit-control-inputs]
          key: {type: string, pattern: '^(node-role-operation-[1-9][0-9]*-[a-z-]+|process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: intent
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
- name: private-metrics_password
  labels: {role: swamp}
  steps:
  - name: Write the private input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-private-metrics-password-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_FILE"]).write_text(os.environ["ORBIT_VALUE"])'' '
        env: {ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-metrics_password" }}', ORBIT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.metrics_password.key) }}'}
    guard: ${{ !has(inputs.execution_secrets.metrics_password) }}
  dependsOn:
  - job: intent
    condition: {type: succeeded}
- name: private-websocket_environment
  labels: {role: swamp}
  steps:
  - name: Write WebSocket input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-private-websocket-environment-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_FILE"]).write_text(os.environ["ORBIT_VALUE"])'' '
        env: {ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-websocket_environment" }}', ORBIT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.websocket_environment.key) }}'}
    guard: ${{ !has(inputs.execution_secrets.websocket_environment) }}
  dependsOn:
  - job: private-metrics_password
    condition: {type: succeeded}
- name: private-analytics_environment
  labels: {role: swamp}
  steps:
  - name: Write Analytics input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-private-analytics-environment-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_FILE"]).write_text(os.environ["ORBIT_VALUE"])'' '
        env: {ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-analytics_environment" }}', ORBIT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.analytics_environment.key) }}'}
    guard: ${{ !has(inputs.execution_secrets.analytics_environment) }}
  dependsOn:
  - job: private-websocket_environment
    condition: {type: succeeded}
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ORBIT_KIND: '${{
            inputs.kind }}'}
  dependsOn:
  - job: private-analytics_environment
    condition: {type: succeeded}
- name: phase_0
  labels: {role: swamp}
  steps:
  - name: Read the OS release
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-add-platform-"+string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-add-platform-"+string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: [cat, /etc/os-release]
        timeoutSec: 20
  dependsOn:
  - job: input
    condition: {type: succeeded}
- name: phase_1
  labels: {role: swamp}
  steps:
  - name: Require supported Ubuntu
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Read the OS release"].outputs.stdout.split("\n").exists(line,line in ["ID=ubuntu","ID=\"ubuntu\""]) &&
        inputs.intent.releases.exists(r,steps["Read the OS release"].outputs.stdout.split("\n").exists(line,line == "VERSION_CODENAME="+r || line
        == "VERSION_CODENAME=\""+r+"\""))', severity: high, message: The role requires an admitted Ubuntu release.}
  dependsOn:
  - job: phase_0
    condition: {type: succeeded}
- name: ansible
  labels: {role: swamp}
  steps:
  - name: Install Python venv
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-0-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-0-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout","900","apt-get","-o","DPkg::Lock::Timeout=300","install","--yes"] + inputs.intent.packages.filter(p, p != "caddy") }}'
        timeoutSec: 905
  - name: Create Ansible venv
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-1-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-1-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', python3, -m, venv, /opt/orbit/ansible/venv]
        timeoutSec: 905
    dependsOn:
    - step: Install Python venv
      condition: {type: succeeded}
  - name: Write Ansible pin
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    dependsOn:
    - step: Create Ansible venv
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "ansible-pins-requirements-txt-"+string(inputs.node_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true, path: /opt/orbit/ansible/requirements.txt, content: '${{
          steps["Write the intent"].outputs.requirements }}', owner: root, group: root, mode: '0644', ensure: present}
      inputs: {}
  - name: Write collection pins
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    dependsOn:
    - step: Write Ansible pin
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "ansible-pins-requirements-yml-"+string(inputs.node_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true, path: /opt/orbit/ansible/requirements.yml, content: '${{
          steps["Write the intent"].outputs.collections }}', owner: root, group: root, mode: '0644', ensure: present}
      inputs: {}
  - name: Install Ansible
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-2-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-2-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '900', /opt/orbit/ansible/venv/bin/pip, install, --disable-pip-version-check, -r, /opt/orbit/ansible/requirements.txt]
        timeoutSec: 905
    dependsOn:
    - step: Write collection pins
      condition: {type: succeeded}
  - name: Install collections
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-3-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-3-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '900', /opt/orbit/ansible/venv/bin/ansible-galaxy, collection, install, -r, /opt/orbit/ansible/requirements.yml, -p, /opt/orbit/ansible/collections]
        timeoutSec: 905
    dependsOn:
    - step: Install Ansible
      condition: {type: succeeded}
  dependsOn:
  - job: phase_1
    condition: {type: succeeded}
- name: prerequisites
  labels: {role: swamp}
  steps:
  - name: Apply role prerequisites
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-prerequisites-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags prerequisites
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: &id001 {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{
            steps["Write the intent"].outputs.assets + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s
            -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}',
          ANSIBLE_FORCE_COLOR: '0'}
  dependsOn:
  - job: ansible
    condition: {type: succeeded}
- name: phase_13
  labels: {role: swamp}
  steps:
  - name: Set up Tool Managers
    labels: {role: swamp}
    writes: true
    forEach: {item: manager, in: '${{ inputs.intent.managers }}'}
    concurrency: 1
    task:
      type: workflow
      workflowIdOrName: operation-tool-manager-setup
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', intent: '${{ self.manager }}', ssh: '${{ inputs.intent.ssh
          }}', report: false, converge: true}
  dependsOn:
  - job: prerequisites
    condition: {type: succeeded}
- name: node
  labels: {role: swamp}
  steps:
  - name: Apply the role on the Node
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-node-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags node "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: phase_13
    condition: {type: succeeded}
- name: analytics_storage
  labels: {role: swamp}
  dependsOn: [{job: node, condition: {type: succeeded}}]
  steps:
  - name: Open Analytics storage
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.analytics == null || inputs.intent.firewall.desired.filter(rule, "docker0" in rule).size() == 0 }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-storage-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags storage-firewall "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: phase_46
  labels: {role: swamp}
  steps:
  - name: Pull the Analytics image
    concurrency: 1
    guard: ${{ inputs.kind == "node.role_converge" }}
    labels: {role: swamp}
    writes: true
    forEach: {item: analytics, in: '${{ inputs.kind == "node.role_converge" ? [] : inputs.intent.runtime.analytics == null ? [] : [inputs.intent.runtime.analytics]
        }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_image'
      behaviorName: ${{ "role-add-analytics-image-"+string(inputs.node_id) + "-"+string(self._index) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true, image: '${{ self.analytics.intent.installation.definition.image
          }}', ensure: present}
      inputs: {}
  dependsOn:
  - job: analytics_storage
    condition: {type: succeeded}
- name: phase_47
  labels: {role: swamp}
  steps:
  - name: Create Analytics database
    guard: ${{ inputs.kind == "node.role_converge" }}
    labels: {role: swamp}
    writes: true
    forEach: {item: initialization, in: '${{ inputs.kind == "node.role_converge" ? [] : inputs.intent.runtime.analytics == null ? [] : [inputs.intent.runtime.analytics.initialize[0]]
        }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-add-analytics-initialize-"+string(inputs.node_id)+"-"+string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-add-analytics-initialize-"+string(inputs.node_id)+"-"+string(self._index) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs: {hosts: 'name:target', sudo: true, argv: '${{ self.initialization.argv }}', timeoutSec: 905}
  dependsOn:
  - job: phase_46
    condition: {type: succeeded}
- name: analytics_migrate
  labels: {role: swamp}
  steps:
  - name: Migrate Analytics database
    guard: ${{ inputs.kind == "node.role_converge" }}
    labels: {role: swamp}
    writes: true
    forEach: {item: initialization, in: '${{ inputs.kind == "node.role_converge" ? [] : inputs.intent.runtime.analytics == null ? [] : [inputs.intent.runtime.analytics.initialize[1]]
        }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-add-analytics-migrate-"+string(inputs.node_id)+"-"+string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-add-analytics-migrate-"+string(inputs.node_id)+"-"+string(self._index) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs: {hosts: 'name:target', sudo: true, argv: '${{ self.initialization.argv }}', timeoutSec: 905}
  dependsOn:
  - job: phase_47
    condition: {type: succeeded}
- name: phase_48
  labels: {role: swamp}
  steps:
  - name: Apply Analytics runtime
    guard: ${{ inputs.kind == "node.role_converge" }}
    labels: {role: swamp}
    writes: true
    forEach: {item: analytics, in: '${{ inputs.kind == "node.role_converge" ? [] : inputs.intent.runtime.analytics == null ? [] : [inputs.intent.runtime.analytics]
        }}'}
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.create
        intent: ${{ self.analytics.intent }}
        execution_secrets: {environment: '${{ "analytics_environment" in inputs.execution_secrets ? inputs.execution_secrets["analytics_environment"] : {}
            }}'}
  dependsOn:
  - job: analytics_migrate
    condition: {type: succeeded}
- name: readiness
  labels: {role: swamp}
  dependsOn: [{job: phase_48, condition: {type: succeeded}}]
  steps:
  - name: Wait for Analytics
    labels: {role: swamp}
    guard: ${{ inputs.kind == "node.role_converge" || inputs.intent.runtime.analytics == null }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-ready-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags readiness "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: swamp_runtime_job
  dependsOn:
  - {job: readiness, condition: {type: succeeded}}
  steps:
    # The recipe's pinned release, by checksum, at a path of its own version: no process runs from it yet.
  - name: Install Swamp
    writes: true
    labels:
      role: swamp
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/fetch'
      behaviorName: '${{ ("swamp-binary-"+string(inputs.node_id)).split(".").join("-") }}'
      methodName: apply
      globalArgs:
        nodeHost: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.host }}'
        nodeUser: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.user }}'
        nodePort: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.target.port }}'
        nodeIdentityFile: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).ssh_execution.identity_file }}'
        become: true
        url: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.url }}'
        path: '${{ (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.path }}'
        checksum: '${{ "sha256:" + (inputs.intent.runtime.swamp == null ? {"node_id":inputs.node_id,"user":inputs.intent.ssh.target.user,"ssh_execution":inputs.intent.ssh,"units":{"serve":"","worker":""},"workers":[],"binary":{"url":"","sha256":"","path":""} } : inputs.intent.runtime.swamp).binary.sha256 }}'
        owner: root
        group: root
        mode: '0755'
      inputs: {}
    # Serve and the workers run /usr/local/bin/swamp. While it is a file, rename it into a fresh 0755 directory under
    # /usr/local/lib/orbit-swamp and link the path to the release at once: a rename keeps the inode, so a running process
    # keeps a binary it can start children from. Replacing the file in place would leave it running a deleted binary
    # (Swamp db3f6373 rollout, 2026-11-03). A link is left alone; Link Swamp then points it at the release.
  - name: Keep the running Swamp
    writes: true
    labels:
      role: swamp
    guard: ${{ inputs.intent.runtime.swamp == null }}
    dependsOn: [{step: Install Swamp, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("swamp-keep-"+string(inputs.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("swamp-keep-"+string(inputs.node_id)).split(".").join("-") }}'
