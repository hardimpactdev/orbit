id: 6ffbd69a-5fed-4525-9a07-820b449fb8dd
name: group-approve
description: >-
  Approve one human gate of a task group (gateId, stage, cycle) and wake the group.
  Serve runs remote-only; this is the placed approval.
queueTimeout: 60
inputs:
  type: object
  properties:
    workItem: { type: string, pattern: '^tg-[1-9][0-9]*$' }
    gateId: { type: string, minLength: 1 }
    stage: { type: string, minLength: 1 }
    cycle: { type: integer, minimum: 1 }
    actor: { type: string, minLength: 1 }
    note: { type: string, default: "" }
  required: [workItem, gateId, stage, cycle, actor]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: group
    steps:
      - name: approve
        labels: {role: swamp}
        task:
          type: model_method
          modelIdOrName: orbit-driver-groups
          methodName: preapprove
          inputs:
            workItem: '${{ inputs.workItem }}'
            gateId: '${{ inputs.gateId }}'
            stage: '${{ inputs.stage }}'
            cycle: '${{ inputs.cycle }}'
            actor: '${{ inputs.actor }}'
            note: '${{ inputs.note }}'
      - name: wake
        dependsOn: [{ step: approve, condition: { type: succeeded } }]
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@nckrtl/orbit-group-run'
          behaviorName: '${{ ("orbit-group-" + inputs.workItem).split(".").join("-") }}'
          methodName: wake
          globalArgs:
            factory: orbit-groups
            assistanceModel: orbit-gateway
            preapprovalModel: orbit-driver-groups
          inputs:
            workItem: '${{ inputs.workItem }}'
