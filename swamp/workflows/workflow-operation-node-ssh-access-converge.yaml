id: d672c246-33c1-4fc7-b8b4-ae37f4885b1e
name: operation-node-ssh-access-converge
description: Write Orbit's marked authorized_keys block from 209 over official SSH; keys outside the block stay.
queueTimeout: 30
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer}
    node_id: {type: integer}
    kind: {type: string, enum: [node.ssh_access_converge]}
    intent: {type: object}
    execution_secrets:
      type: object
      properties:
        bootstrap_identity:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^bootstrap-identity-node-14$'}
          required: [vault, key]
          additionalProperties: false
      required: [bootstrap_identity]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: ssh_access
  labels: {role: swamp}
  steps:
  - name: 'Read the scripts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-scripts'
      behaviorName: node-ssh-access-scripts
      methodName: read
      inputs: {script: authorized_keys, input: {keys: '${{ inputs.intent.keys }}'}}
    # The identity Node 12 already accepts, from the vault; the Swamp identity may not be accepted yet.
  - name: 'Write the Orbit block'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the scripts', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-ssh-access-" + string(inputs.node_id) + "-bootstrap" }}
      methodName: exec
      globalArgs: &access
        name: ${{ "node-ssh-access-" + string(inputs.node_id) + "-bootstrap" }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.target.user }}
          port: ${{ inputs.intent.target.port }}
          hostKeys: ${{ inputs.intent.target.host_keys }}
          identityContent: ${{ vault.get(inputs.execution_secrets.bootstrap_identity.vault, inputs.execution_secrets.bootstrap_identity.key) }}
        hosts:
        - name: target
          address: ${{ inputs.intent.target.host }}
      inputs:
        hosts: name:target
        sudo: false
        argv: [timeout, '30', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', write, '${{ steps["Read the scripts"].outputs.input }}']
        timeoutSec: 40
    # The block holds exactly the keys and every line outside it is unchanged.
  - name: 'Read the file back'
    labels: {role: swamp}
    dependsOn: [{step: 'Write the Orbit block', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-ssh-access-" + string(inputs.node_id) + "-bootstrap" }}
      methodName: exec
      globalArgs: *access
      inputs:
        hosts: name:target
        sudo: false
        argv: [timeout, '30', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', verify, '${{ steps["Read the scripts"].outputs.input }}',
          '${{ steps["Write the Orbit block"].outputs.stdout }}']
        timeoutSec: 40
    # A new session with the swamp role identity only.
  - name: 'Log in with Swamp identity'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the file back', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-ssh-access-" + string(inputs.node_id) + "-own" }}
      methodName: exec
      globalArgs:
        name: ${{ "node-ssh-access-" + string(inputs.node_id) + "-own" }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.target.user }}
          port: ${{ inputs.intent.target.port }}
          hostKeys: ${{ inputs.intent.target.host_keys }}
          identityFile: ${{ inputs.intent.identity_file }}
          identitiesOnly: true
        hosts:
        - name: target
          address: ${{ inputs.intent.target.host }}
      inputs:
        hosts: name:target
        argv: [/usr/bin/printf, '%s\n', '{"ssh_access_ready":true}']
        timeoutSec: 30
