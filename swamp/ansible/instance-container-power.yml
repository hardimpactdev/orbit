---
# probe: an outer Instance-container play only (release 2157 shape).
# The one phase of a development container's sleep, tag `prepared_sleep` (docs/reference/development-containers.md#sleep-and-wake,
# docs/reference/prepared-restore.md#sleep): check that Caddy's loaded site of the Instance has the asleep check, write the marker,
# then let the power helper open swap, pause the container, record its plan and push its memory to swap; stop it instead when swap
# does not take the memory. A wake's `start` part of instance-container.yml resumes the container and removes the marker itself.
# It writes `result.json` in the run folder: `{"sleep", "swap_subtree", "prepared_restore"}`, or the public error code.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: container_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Put the container to sleep
  hosts: container_node
  gather_facts: false
  become: true
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    container: "{{ intent.container }}"
    marker: "{{ intent.marker }}"
    # The app-dev role makes the marker directory root:caddy; Caddy reads the marker.
    marker_owner: root
    marker_group: caddy
    # Caddy's admin API on the Node, which listens on loopback only.
    caddy_admin: http://127.0.0.1:2019
    operation_id: "{{ lookup('ansible.builtin.env', 'ORBIT_OPERATION_ID') }}"
  tasks:
    - name: Run the part
      tags: [always]
      block:
        - name: Run the disabled-mode part
          when: not intent.signed_power | default(false) | bool
          ansible.builtin.include_tasks:
            file: tasks/instance-container-power.yml
            apply: {tags: [always]}
          tags: [always]
          vars:
            power: "{{ ansible_run_tags | first }}"
        - name: Deliver the recovery sleep order
          when: intent.signed_power | default(false) | bool
          ansible.builtin.include_tasks:
            file: tasks/executor-power-relay.yml
            apply: {tags: [always]}
          tags: [always]
          vars:
            executor_phase: power
            executor_action: sleep
        - name: Keep the signed sleep receipt
          when: intent.signed_power | default(false) | bool
          tags: [always]
          ansible.builtin.set_fact:
            power_result: "{{ {'executor': executor_receipt} }}"
        - name: Write the result
          tags: [always]
          ansible.builtin.copy:
            content: "{{ power_result | default({}) | to_json }}"
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
          vars: &local
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue:
        - name: Write the failure
          tags: [always]
          ansible.builtin.copy:
            content: >-
              {{ ({'executor': executor_receipt} if executor_receipt is defined else {}) | combine({'error_code': ansible_failed_result.msg
                  if (ansible_failed_result.msg | default('') is match('^[a-z]+\.[a-z0-9_]+$'))
                  else 'instance.container_' ~ ('asleep' if sleep_prepared is not defined else 'freeze') ~ '_failed'}) | to_json }}
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
          vars: *local
        - name: Fail the part
          tags: [always]
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The power part failed.') }}"
