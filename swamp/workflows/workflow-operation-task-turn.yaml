id: d98239bb-4a95-4873-a3e1-6f7c5bdb76ab
name: operation-task-turn
description: Run admitted Pi turns from Node 209 with official SSH workspace actions and public terminal projection.
vaults:
- orbit-control-inputs
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.turn]}
    # A parent run that sends several turns names each Pi message, passes the commit a reviewer restores, and adds what
    # it learned after admission to the prompt, such as a review's findings.
    turn_key:
      type: string
      pattern: ^[A-Za-z0-9_.:-]{1,128}$
    candidate:
      type: string
      pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
    review_evidence:
      type: object
    prompt_append:
      type: string
      maxLength: 60000
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        pi_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-vm-pi-token-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - pi_token
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  type: object
  additionalProperties: false
jobs:
- name: turn
  steps:
  - name: prepare
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        turn_key: '${{ has(inputs.turn_key) ? inputs.turn_key : "" }}'
        prompt_append: '${{ has(inputs.prompt_append) ? inputs.prompt_append : "" }}'
      behaviorName: ${{ "task-turn-prepare-" + string(inputs.node_id) }}
  - name: prepare_local
    labels: {role: swamp}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: 'umask 077

          mkdir -p "$ORBIT_DIRECTORY"

          '
        env:
          ORBIT_DIRECTORY: ${{ "/tmp/orbit-task-turn-local-" + run.id }}
      behaviorName: ${{ "task-turn-prepare-local-" + string(inputs.node_id) }}
  - name: prepare_remote
    labels: {role: swamp}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-prepare-remote-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-prepare-remote-" + string(inputs.node_id) }}
        transport: &id001
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts: &id002
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - mkdir
        - -m
        - '0700'
        - -p
        - ${{ "/tmp/orbit-task-turn-" + run.id }}
        timeoutSec: 60
    guard: ${{ steps.prepare.outputs.error_code != null }}
    writes: true
  - name: snapshot_before_index
    labels: {role: swamp}
    dependsOn:
    - step: prepare_remote
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-before-index-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-before-index-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - cp
        - --
        - ${{ inputs.intent.checkout_path + "/.git/index" }}
        - ${{ "/tmp/orbit-task-turn-" + run.id + "/before.index" }}
        timeoutSec: 60
    writes: true
  - name: snapshot_before_add
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_before_index
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-before-add-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-before-add-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-turn-" + run.id + "/before.index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
        timeoutSec: 60
    writes: true
  - name: snapshot_before_head
    labels: {role: swamp}
    dependsOn:
    - step: prepare_remote
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-before-head-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-before-head-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
        timeoutSec: 60
  - name: snapshot_before_tree
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_before_add
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-before-tree-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-before-tree-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-turn-" + run.id + "/before.index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
        timeoutSec: 60
    writes: true
  - name: snapshot_before
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_before_head
      condition:
        type: succeeded
    - step: snapshot_before_tree
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: ${{ "task-turn-snapshot-before-" + string(inputs.node_id) }}
      methodName: snapshot
      inputs:
        head: ${{ steps.snapshot_before_head.outputs.stdout }}
        tree: ${{ steps.snapshot_before_tree.outputs.stdout }}
  - name: review_prompt
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_before
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: ${{ "task-turn-review-prompt-" + string(inputs.node_id) }}
      methodName: reviewPrompt
      inputs:
        send_json: ${{ steps.prepare.outputs.send_json }}
        role: ${{ inputs.intent.role }}
        candidate: '${{ has(inputs.candidate) ? inputs.candidate : inputs.intent.candidate }}'
        tree: ${{ steps.snapshot_before.outputs.tree }}
        evidence: '${{ has(inputs.review_evidence) ? inputs.review_evidence : null }}'
  - name: receipt_prepare
    labels: {role: swamp}
    dependsOn:
    - step: review_prompt
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-receipt-prepare-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-receipt-prepare-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - mkdir
        - -m
        - '0700'
        - -p
        - ${{ inputs.intent.checkout_path + "/.git/orbit" }}
        timeoutSec: 60
    writes: true
  - name: receipt_clear
    labels: {role: swamp}
    dependsOn:
    - step: receipt_prepare
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-receipt-clear-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-receipt-clear-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - rm
        - -f
        - --
        - ${{ inputs.intent.checkout_path + "/.git/orbit/receipt.json" }}
        timeoutSec: 60
    writes: true
  - name: session_create
    labels: {role: swamp}
    dependsOn:
    - step: receipt_clear
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: &pi_write |
          set -eu
          curl --fail --silent --show-error --location --max-redirs 0 --max-time 30 \
            --variable %ORBIT_PI_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_PI_TOKEN}}' \
            --variable %ORBIT_PI_BODY --expand-data '{{ORBIT_PI_BODY}}' \
            --header 'Content-Type: application/json' --output /dev/null "$ORBIT_PI_URL$ORBIT_PI_PATH"
          printf '%s\n' '{"accepted":true}'
        env:
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
          ORBIT_PI_URL: ${{ steps.prepare.outputs.pi_url }}
          ORBIT_PI_PATH: /sessions
          ORBIT_PI_BODY: ${{ steps.prepare.outputs.create_json }}
      behaviorName: ${{ "task-turn-session_create-" + string(inputs.node_id) }}
    guard: ${{ !inputs.intent.new_session }}
    writes: true
  - name: message_send
    labels: {role: swamp}
    dependsOn:
    - step: receipt_clear
      condition:
        type: succeeded
    - step: session_create
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: *pi_write
        env:
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
          ORBIT_PI_URL: ${{ steps.prepare.outputs.pi_url }}
          ORBIT_PI_PATH: ${{ "/sessions/" + inputs.intent.session_id + "/messages" }}
          ORBIT_PI_BODY: ${{ steps.review_prompt.outputs.send_json }}
      behaviorName: ${{ "task-turn-message_send-" + string(inputs.node_id) }}
    writes: true
  - name: observe
    labels: {role: swamp}
    dependsOn:
    - step: message_send
      condition:
        type: succeeded
    - step: prepare_local
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        # Keep a bounded stream tail privately. Only redacted terminal evidence reaches history.
        run: |
          set -u
          umask 077
          status=0
          curl --fail --silent --location --max-redirs 0 --max-time 3300 --no-buffer \
            --variable %ORBIT_PI_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_PI_TOKEN}}' \
            "$ORBIT_PI_URL/sessions/$ORBIT_PI_SESSION/stream?max_bytes=1048576" |
            awk -v turn="$ORBIT_PI_TURN" -v out="$ORBIT_TERMINAL" '
              BEGIN { code = 22; first = 1; last = 0; bytes = 0; printf "" > out; close(out) }
              length($0) > 1048576 { code = 21; exit }
              {
                truncated = 0; rows[++last] = $0; bytes += length($0) + 1
                while (bytes > 1048576 && first < last) { bytes -= length(rows[first]) + 1; delete rows[first++]; truncated = 1 }
                if (truncated) {
                  print "{\"kind\":\"truncated\"}" > out
                  for (i = first; i <= last; i++) print rows[i] > out
                } else { print $0 >> out }
                close(out)
              }
              $0 ~ ("\"turnId\"[ \t]*:[ \t]*\"" turn "\"") && $0 ~ /"state"[ \t]*:[ \t]*"(done|failed)"/ {
                code = 0; exit
              }
              END {
                exit code
              }' 2>/dev/null || status=$?
          case $status in
            0) exit 0 ;;
            21) code=tasks.pi_event_too_large ;;
            22) code=tasks.pi_completion_unconfirmed ;;
            *) code=tasks.pi_event_invalid ;;
          esac
          printf '%s\n' "$code" >&2
          exit 1
        env:
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
          ORBIT_PI_URL: ${{ steps.prepare.outputs.pi_url }}
          ORBIT_PI_SESSION: ${{ inputs.intent.session_id }}
          ORBIT_PI_TURN: ${{ steps.prepare.outputs.turn_key }}
          ORBIT_TERMINAL: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/terminal.json" }}
        timeout: 3300000
      behaviorName: ${{ "task-turn-observe-" + string(inputs.node_id) }}
  - name: terminal
    labels: {role: swamp}
    dependsOn:
    - step: observe
      condition:
        type: completed
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: ${{ "task-turn-terminal-" + string(inputs.node_id) }}
      methodName: terminal
      inputs:
        path: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/terminal.json" }}
        turn: ${{ steps.prepare.outputs.turn_key }}
        partial: true
  - name: snapshot_after_index
    labels: {role: swamp}
    dependsOn:
    - step: observe
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-after-index-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-after-index-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - cp
        - --
        - ${{ inputs.intent.checkout_path + "/.git/index" }}
        - ${{ "/tmp/orbit-task-turn-" + run.id + "/after.index" }}
        timeoutSec: 60
    writes: true
  - name: snapshot_after_add
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_after_index
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-after-add-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-after-add-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-turn-" + run.id + "/after.index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
        timeoutSec: 60
    writes: true
  - name: snapshot_after_head
    labels: {role: swamp}
    dependsOn:
    - step: observe
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-after-head-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-after-head-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
        timeoutSec: 60
  - name: snapshot_after_tree
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_after_add
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-snapshot-after-tree-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-snapshot-after-tree-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-turn-" + run.id + "/after.index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
        timeoutSec: 60
    writes: true
  - name: snapshot_after
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_after_head
      condition:
        type: succeeded
    - step: snapshot_after_tree
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: ${{ "task-turn-snapshot-after-" + string(inputs.node_id) }}
      methodName: snapshot
      inputs:
        head: ${{ steps.snapshot_after_head.outputs.stdout }}
        tree: ${{ steps.snapshot_after_tree.outputs.stdout }}
  - name: receipt_exists
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_after
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-receipt-exists-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-receipt-exists-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - test
        - -f
        - ${{ inputs.intent.checkout_path + "/.git/orbit/receipt.json" }}
        timeoutSec: 60
        okExitCodes:
        - 0
        - 1
  - name: receipt_copy
    labels: {role: swamp}
    dependsOn:
    - step: receipt_exists
      condition:
        type: succeeded
    - step: prepare_local
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-receipt-copy-" + string(inputs.node_id) }}
      methodName: copy
      globalArgs:
        name: ${{ "task-turn-receipt-copy-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        direction: from
        src: ${{ inputs.intent.checkout_path + "/.git/orbit/receipt.json" }}
        dst: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/receipt.json" }}
        timeoutSec: 60
    guard: ${{ steps.receipt_exists.outputs.exitCode != 0 }}
  - name: difference_counts
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_after
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-difference-counts-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-difference-counts-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - diff
        - --no-renames
        - --numstat
        - -z
        - ${{ "--output=/tmp/orbit-task-turn-" + run.id + "/difference.numstat" }}
        - '${{ inputs.intent.role == "reviewer" ? steps.snapshot_before.outputs.head : steps.snapshot_before.outputs.tree }}'
        - ${{ steps.snapshot_after.outputs.tree }}
        - --
        timeoutSec: 60
    writes: true
    guard: ${{ inputs.intent.role == "implementer" }}
  - name: difference_counts_copy
    labels: {role: swamp}
    dependsOn:
    - step: difference_counts
      condition:
        type: succeeded
    - step: prepare_local
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-difference-counts-copy-" + string(inputs.node_id) }}
      methodName: copy
      globalArgs:
        name: ${{ "task-turn-difference-counts-copy-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        direction: from
        src: ${{ "/tmp/orbit-task-turn-" + run.id + "/difference.numstat" }}
        dst: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/difference.numstat" }}
        timeoutSec: 60
  - name: difference_patch
    labels: {role: swamp}
    dependsOn:
    - step: snapshot_after
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-difference-patch-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-difference-patch-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - diff
        - --no-renames
        - ${{ "--output=/tmp/orbit-task-turn-" + run.id + "/difference.patch" }}
        - '${{ inputs.intent.role == "reviewer" ? steps.snapshot_before.outputs.head : steps.snapshot_before.outputs.tree }}'
        - ${{ steps.snapshot_after.outputs.tree }}
        - --
        timeoutSec: 60
    writes: true
    guard: ${{ inputs.intent.role == "implementer" }}
  - name: difference_patch_copy
    labels: {role: swamp}
    dependsOn:
    - step: difference_patch
      condition:
        type: succeeded
    - step: prepare_local
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-difference-patch-copy-" + string(inputs.node_id) }}
      methodName: copy
      globalArgs:
        name: ${{ "task-turn-difference-patch-copy-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        direction: from
        src: ${{ "/tmp/orbit-task-turn-" + run.id + "/difference.patch" }}
        dst: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/difference.patch" }}
        timeoutSec: 60
  - name: receipt_read
    labels: {role: swamp}
    dependsOn:
    - step: receipt_copy
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: receipt_exists
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      methodName: receipt
      inputs:
        path: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/receipt.json" }}
      behaviorName: ${{ "task-turn-receipt-read-" + string(inputs.node_id) }}
  - name: difference
    labels: {role: swamp}
    dependsOn:
    - step: difference_counts_copy
      condition:
        type: succeeded
    - step: difference_patch_copy
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      methodName: difference
      inputs:
        counts: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/difference.numstat" }}
        patch: ${{ "/tmp/orbit-task-turn-local-" + run.id + "/difference.patch" }}
      behaviorName: ${{ "task-turn-difference-" + string(inputs.node_id) }}
    guard: ${{ inputs.intent.role == "implementer" }}
  - name: interrupt
    labels: {role: swamp}
    dependsOn:
    - step: observe
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: *pi_write
        env:
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
          ORBIT_PI_URL: ${{ steps.prepare.outputs.pi_url }}
          ORBIT_PI_PATH: ${{ "/sessions/" + inputs.intent.session_id + "/interrupt" }}
          ORBIT_PI_BODY: '{}'
      behaviorName: ${{ "task-turn-interrupt-" + string(inputs.node_id) }}
    guard: ${{ (has(steps.observe) && steps.observe.status == "succeeded") || !has(steps.message_send) || steps.message_send.status != "succeeded" }}
    writes: true
  - name: restore_reset
    labels: {role: swamp}
    dependsOn:
    - step: difference
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    - step: interrupt
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    - step: snapshot_before
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-restore-reset-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-restore-reset-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - reset
        - --quiet
        - --hard
        - '${{ has(inputs.candidate) ? inputs.candidate : inputs.intent.candidate }}'
        timeoutSec: 60
    writes: true
    guard: ${{ inputs.intent.role != "reviewer" }}
  - name: restore_clean
    labels: {role: swamp}
    dependsOn:
    - step: restore_reset
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-restore-clean-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-restore-clean-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - clean
        - --quiet
        - -fd
        timeoutSec: 60
    writes: true
  - name: restore_head
    labels: {role: swamp}
    dependsOn:
    - step: restore_clean
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-restore-head-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-restore-head-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
        timeoutSec: 60
  - name: restore_tree
    labels: {role: swamp}
    dependsOn:
    - step: restore_clean
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-restore-tree-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-restore-tree-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
        timeoutSec: 60
  - name: restore
    labels: {role: swamp}
    dependsOn:
    - step: restore_head
      condition:
        type: succeeded
    - step: restore_tree
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: ${{ "task-turn-restore-" + string(inputs.node_id) }}
      methodName: snapshot
      inputs:
        head: ${{ steps.restore_head.outputs.stdout }}
        tree: ${{ steps.restore_tree.outputs.stdout }}
  - name: shape_result
    labels: {role: swamp}
    dependsOn:
    - step: prepare
      condition:
        type: always
    - step: snapshot_before
      condition:
        type: always
    - step: terminal
      condition:
        type: always
    - step: observe
      condition:
        type: always
    - step: snapshot_after
      condition:
        type: always
    - step: receipt_read
      condition:
        type: always
    - step: difference
      condition:
        type: always
    - step: interrupt
      condition:
        type: always
    - step: restore
      condition:
        type: always
    - step: delete_snapshot_indexes
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      methodName: result
      inputs:
        input: ${{ inputs.intent }}
        before: '${{ has(steps.snapshot_before) && has(steps.snapshot_before.outputs) && has(steps.snapshot_before.outputs.stdout) ? steps.snapshot_before.outputs.stdout
          : "" }}'
        after: '${{ has(steps.snapshot_after) && has(steps.snapshot_after.outputs) && has(steps.snapshot_after.outputs.stdout) ? steps.snapshot_after.outputs.stdout
          : "" }}'
        terminal: '${{ has(steps.terminal) && has(steps.terminal.outputs) && has(steps.terminal.outputs.stdout) ? steps.terminal.outputs.stdout : "" }}'
        receipt: '${{ has(steps.receipt_read) && has(steps.receipt_read.outputs) && has(steps.receipt_read.outputs.stdout) ? steps.receipt_read.outputs.stdout
          : "" }}'
        difference: '${{ has(steps.difference) && has(steps.difference.outputs) && has(steps.difference.outputs.stdout) ? steps.difference.outputs.stdout
          : "" }}'
        restored: '${{ has(steps.restore) && has(steps.restore.outputs) && has(steps.restore.outputs.stdout) ? steps.restore.outputs.stdout : "" }}'
        failure: ${{ !has(steps.terminal) || steps.terminal.status != "succeeded" || !has(steps.receipt_read) || steps.receipt_read.status != "succeeded"
          || (inputs.intent.role == "reviewer" && (!has(steps.restore) || steps.restore.status != "succeeded")) || (inputs.intent.role != "implementer"
          && (!has(steps.difference) || steps.difference.status != "succeeded")) }}
        failure_code: '${{ has(steps.prepare.outputs) ? steps.prepare.outputs.error_code : null }}'
      behaviorName: ${{ "task-turn-shape_result-" + string(inputs.node_id) }}
  - name: delete_local_artifacts
    labels: {role: swamp}
    guard: ${{ !has(steps.receipt_read) || steps.receipt_read.status != "succeeded" || (inputs.intent.role != "implementer" && (!has(steps.difference) || steps.difference.status != "succeeded")) }}
    dependsOn:
    - step: shape_result
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_DIRECTORY"

          '
        env:
          ORBIT_DIRECTORY: ${{ "/tmp/orbit-task-turn-local-" + run.id }}
      behaviorName: ${{ "task-turn-delete-local-artifacts-" + string(inputs.node_id) }}
  - name: outcome
    labels: {role: swamp}
    dependsOn:
    - step: shape_result
      condition:
        type: succeeded
    - step: delete_local_artifacts
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: assert
      expr: steps.shape_result.outputs.successful
      message: Pi did not complete the task turn.
      severity: high
  - name: delete_snapshot_indexes
    labels: {role: swamp}
    guard: ${{ !has(steps.snapshot_before_tree) || steps.snapshot_before_tree.status != "succeeded" || !has(steps.snapshot_after_tree) || steps.snapshot_after_tree.status
      != "succeeded" }}
    dependsOn:
    - step: snapshot_before_tree
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    - step: snapshot_after_tree
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    - step: difference
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    - step: restore
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-turn-delete-snapshot-indexes-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-turn-delete-snapshot-indexes-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - rm
        - -f
        - ${{ "/tmp/orbit-task-turn-" + run.id + "/before.index" }}
        - ${{ "/tmp/orbit-task-turn-" + run.id + "/after.index" }}
        - ${{ "/tmp/orbit-task-turn-" + run.id + "/difference.numstat" }}
        - ${{ "/tmp/orbit-task-turn-" + run.id + "/difference.patch" }}
        timeoutSec: 60
    writes: true
  labels: {role: swamp}
queueTimeout: 60
