  # `incus query /1.0/instances/<name>` of a nested-fleet default, cut to its root disk (2026-11-14, Beast).
  root-smaller:
    phase: start
    container_read:
      rc: 0
      stdout: '{"name": "instance-2454", "project": "orbit-instances-nested", "status": "Running", "expanded_devices": {"root": {"path": "/", "pool": "orbit-instances", "size": "40GiB", "type": "disk"}}}'
    container:
      root_disk_size: 80GiB
      allowed_devices:
        root: {type: disk, path: /, pool: orbit-instances, size: 80GiB}
  root-larger:
    phase: start
    container_read:
      rc: 0
      stdout: '{"name": "instance-2454", "project": "orbit-instances-nested", "status": "Running", "expanded_devices": {"root": {"path": "/", "pool": "orbit-instances", "size": "80GiB", "type": "disk"}}}'
    container:
      root_disk_size: 40GiB
      allowed_devices:
        root: {type: disk, path: /, pool: orbit-instances, size: 40GiB}
  root-odd-form:
    phase: start
    container_read:
      rc: 0
      stdout: '{"name": "instance-2454", "project": "orbit-instances-nested", "status": "Running", "expanded_devices": {"root": {"path": "/", "pool": "orbit-instances", "size": "50GB", "type": "disk"}}}'
