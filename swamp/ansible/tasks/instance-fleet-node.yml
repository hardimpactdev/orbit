---
# The first part of the container branch on an Instance fleet Node: `nested-app-dev` of a nested fleet, a third level below the host
# (docs/reference/development-containers.md#instance-host-in-the-fleet). The Gateway sends `instances.fleet_node` only for it, so a real
# app-dev or CI Node keeps the branch as it was. The Node has no Incus and no pool: this part installs Incus first, runs it without
# AppArmor, which cannot load a profile there, and creates the btrfs pool. The rest of the branch then finds both.
- name: Make the folder of the Incus drop-in
  ansible.builtin.file: { path: /etc/systemd/system/incus.service.d, state: directory, owner: root, group: root, mode: "0755" }
- name: Run the fleet Node's Incus without AppArmor
  ansible.builtin.copy:
    dest: /etc/systemd/system/incus.service.d/50-orbit-nested.conf
    content: |
      [Service]
      Environment=INCUS_SECURITY_APPARMOR=false
    owner: root
    group: root
    mode: "0644"
  register: fleet_node_apparmor

- name: Install Incus on the fleet Node
  ansible.builtin.include_tasks: incus-install.yml
  vars:
    container_host: { incus: "{{ instances.incus }}" }

# An Incus that started before the drop-in, such as one installed by hand, takes it now.
- name: Restart Incus with the drop-in # noqa: no-handler -- host bridge preparation needs the restarted daemon
  when: fleet_node_apparmor.changed
  ansible.builtin.systemd_service: { name: incus.service, daemon_reload: true, state: restarted }

# Every pool of a fleet Node is btrfs on the Node's own btrfs root, so a copy is a subvolume snapshot, never a file copy: the Instance
# pool of nested-app-dev and the release pool of a nested app-prod Node (production-release-host.yml). No Incus layer has a `dir` pool.
# The Incus btrfs driver needs `btrfs-progs`.
- name: Find the btrfs tools on the fleet Node
  ansible.builtin.import_tasks: apt-missing.yml
  vars: { apt_wanted: [btrfs-progs] }
- name: Install the btrfs tools on the fleet Node
  when: apt_missing | length > 0
  ansible.builtin.apt: { name: btrfs-progs, state: present, install_recommends: false, update_cache: true, cache_valid_time: 3600 }

# fleet-node-pool.py creates a missing pool and moves a `dir` pool of an older copy to btrfs with every instance and volume it holds, so
# no copy needs a hand step. A run stopped part way finishes on the next one, so a create that hangs and is killed gets one more run.
# Any other driver refuses.
- name: Keep the pool on btrfs
  ansible.builtin.script:
    cmd: "files/fleet-node-pool.py {{ instances.pool | quote }}"
    executable: /usr/bin/python3
  register: fleet_node_pool
  until: fleet_node_pool is succeeded
  retries: 1
  delay: 5
  changed_when: fleet_node_pool.rc | default(1) == 0 and (fleet_node_pool.stdout | from_json).changed

# The power helper reads this marker and keeps the fast wake off for every Instance here, as for nested-fleet Instances (ADR 0261).
- name: Make the folder of the marker
  ansible.builtin.file: { path: /etc/orbit, state: directory, owner: root, group: root, mode: "0755" }
- name: Mark the Instance fleet Node
  ansible.builtin.copy:
    dest: /etc/orbit/instance-fleet-node
    content: "# Managed by Orbit: an Instance fleet Node; the fast wake stays off (docs/reference/development-containers.md#instance-host-in-the-fleet).\n"
    owner: root
    group: root
    mode: "0644"
