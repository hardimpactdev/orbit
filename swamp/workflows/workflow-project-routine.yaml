id: eefb6690-519c-4416-a89c-c43c1c34ec97
name: project-routine
description: Select this week's routine from the admitted Project and task groups; the Gateway admits the group from the step output.
inputs:
  type: object
  additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      enum:
      - 209
    kind: {type: string, const: project.routine}
    intent:
      type: object
    execution_secrets:
      type: object
      properties: {}
      additionalProperties: false
reports:
  skip:
  - '@swamp/workflow-summary'
jobs:
- name: routine
  labels: {role: swamp}
  steps:
  - name: Select this week's routine
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/project-maintenance-input'
      behaviorName: ${{ "project-maintenance-input-" + string(inputs.intent.project.id) }}
      methodName: routine
      inputs:
        project: ${{ inputs.intent.project }}
        groups: ${{ inputs.intent.groups }}
        admitted_at: ${{ inputs.intent.admitted_at }}
