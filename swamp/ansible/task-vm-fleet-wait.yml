---
# One wait of the fleet build, or of the readiness of a nested fleet (task-nested-ready), run from Node 209 against the task VM: the nested
# Gateway ends one of its Operations, or its Doctor is healthy.
# Each check is one `incus exec` into the nested Gateway, every `wait_delay` seconds, with the tool's own `until` and `retries`.
# `wait_seconds` is the time of the delays. The checks take their own time on top, so the step that runs this playbook gives it
# a `timeout` of twice `wait_seconds`.
# A check that finds the Gateway guest not running ends the wait at once, and the task after it names the nested containers that are not running.
# Doctor passes only on the fleet's own `healthy`, which opens the answer: each Node in it carries one too (op 11756).
- name: Wait for the nested fleet
  hosts: task_vm
  gather_facts: false
  vars:
    wait_delay: 5
    gateway: "{{ intent.fleet.guests.gateway }}"
    checks: "{{ ((wait_seconds | int) / (wait_delay | int)) | round(0, 'ceil') | int }}"
    ended: [succeeded, failed, cancelled, interrupted]
    running: "{{ nested_vms.stdout_lines | default([]) | select('match', '^[^,]+,RUNNING$') | map('regex_replace', ',.*$', '') | list }}"
    not_running: "{{ intent.fleet.guests.values() | list | difference(running) }}"
    why: "{{ nested_why.stdout | default('') | trim }}"
  tasks:
    - name: Wait for the Operation of the nested Gateway to end
      when: wait_kind == 'operation'
      ansible.builtin.command:
        argv:
          - timeout
          - "30"
          - incus
          - exec
          - "{{ gateway }}"
          - "--"
          - sqlite3
          - /home/orbit/.orbit/gateway.sqlite
          - "select status from operations where id = {{ wait_operation | int }}"
      register: nested_operation
      changed_when: false
      failed_when: false
      until: nested_operation.stdout | trim in ended or 'Instance is not running' in nested_operation.stderr
      retries: "{{ checks }}"
      delay: "{{ wait_delay }}"
    - name: Wait for Doctor of the nested Gateway
      when: wait_kind == 'doctor'
      ansible.builtin.command:
        argv:
          - timeout
          - "120"
          - incus
          - exec
          - "{{ gateway }}"
          - "--"
          - curl
          - -sk
          - -m
          - "100"
          - -X
          - POST
          - https://10.45.0.1/api/v1/doctor
          - -H
          - "Host: gateway.orbit"
          - -H
          - "Accept: application/json"
          - -H
          - "Content-Type: application/json"
          - -d
          - "{}"
      register: nested_doctor
      changed_when: false
      failed_when: false
      until: nested_doctor.stdout is match('\{"data":\{"healthy":true') or 'Instance is not running' in nested_doctor.stderr
      retries: "{{ checks }}"
      delay: "{{ wait_delay }}"
    - name: Read why the Operation did not succeed
      when: wait_kind == 'operation' and nested_operation.stdout | trim in ended and nested_operation.stdout | trim != 'succeeded'
      ansible.builtin.command:
        argv:
          - timeout
          - "30"
          - incus
          - exec
          - "{{ gateway }}"
          - "--"
          - sqlite3
          - /home/orbit/.orbit/gateway.sqlite
          - >-
            select coalesce('at ' || failed_step || ' ', '') || coalesce('code ' || error_code, '')
            from operations where id = {{ wait_operation | int }}
      register: nested_why
      changed_when: false
      failed_when: false
    - name: Read the state of the nested containers
      ansible.builtin.command:
        argv: [incus, list, --format, csv, --columns, ns]
      register: nested_vms
      changed_when: false
    - name: Check that every nested container is running
      ansible.builtin.assert:
        that: not_running | length == 0
        fail_msg: "A nested container is not running: {{ not_running | join(', ') }}"
    - name: Check that the Operation succeeded
      when: wait_kind == 'operation'
      ansible.builtin.assert:
        that: nested_operation.stdout | trim == 'succeeded'
        fail_msg: >-
          The Operation {{ wait_operation }} of the nested Gateway ended
          {{ nested_operation.stdout | trim | default('with no status', true) }}{{ ' ' + why if why else '' }}
    - name: Check that Doctor is healthy
      when: wait_kind == 'doctor'
      ansible.builtin.assert:
        that: nested_doctor.stdout is match('\{"data":\{"healthy":true')
        fail_msg: "Doctor of the nested Gateway has a finding: {{ nested_doctor.stdout | default('') | truncate(400) }}"
