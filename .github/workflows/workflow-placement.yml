name: Workflow placement
on:
  pull_request:
    paths:
      - 'workflows/**'
      - 'bin/lint-workflow-placement.ts'
      - 'tests/workflow_placement_test.ts'
      - '.github/workflows/workflow-placement.yml'
  push:
    branches: [main]
    paths:
      - 'workflows/**'
      - 'bin/lint-workflow-placement.ts'
      - 'tests/workflow_placement_test.ts'
      - '.github/workflows/workflow-placement.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  worker-placement:
    runs-on: [self-hosted, hardimpact]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.8
      - name: Reject unplaced workflow steps
        run: deno run --allow-read bin/lint-workflow-placement.ts
