id: c1097e7d-de2c-5300-bf85-eea72ccef264
name: instance-clone-database-snapshot
description: Snapshot the chosen SQLite file on the candidate Node with the backup API and copy it to 209.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        git_read:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        environment:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        git_credential:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - git_read
      - environment
      - git_credential
      additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  additionalProperties: false
jobs:
- name: database
  labels:
    role: swamp
  steps:
  - name: snapshot
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-db-snap-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-")
        }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-db-snap-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - -u
        - ${{ inputs.intent.sqlite.user }}
        - --
        - /usr/bin/timeout
        - '120'
        - /usr/bin/python3
        - -I
        - -c
        - 'import os,sqlite3,sys

          os.umask(0o077)

          s=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True)

          d=sqlite3.connect(sys.argv[2])

          s.backup(d)

          d.close()

          s.close()'
        - ${{ inputs.intent.sqlite.source }}
        - ${{ inputs.intent.sqlite.snapshot }}
    writes: true
  - name: digest
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-db-snap-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-")
        }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-db-snap-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - -u
        - ${{ inputs.intent.sqlite.user }}
        - --
        - /usr/bin/sha256sum
        - --
        - ${{ inputs.intent.sqlite.snapshot }}
    dependsOn:
    - step: snapshot
      condition:
        type: succeeded
  - name: copy
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-db-snap-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-")
        }}
      methodName: copy
      globalArgs:
        name: ${{ ("icl-db-snap-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ inputs.intent.sqlite.snapshot }}
        dst: ${{ "/tmp/orbit-clone-sqlite-" + inputs.run_id + ".sqlite" }}
        direction: from
    dependsOn:
    - step: digest
      condition:
        type: succeeded
queueTimeout: 60
