  - name: Decode package state
    labels: {role: swamp}
    dependsOn: [{step: Check apt package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check Homebrew formula, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
