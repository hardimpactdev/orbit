---
# The native clone and Ansible use the same gate. Expanded devices include profile inheritance and local overrides. A nested-fleet
# container also passes its allowed config: the intent's `container.config`, which create and clone write.
- name: Check the effective NIC gates on the Instance bridge
  tags: [always]
  ansible.builtin.command:
    argv: "{{ ['python3', '-c', network_check_source, network_name, expected_network_device | default('')] + ([network_allowed_devices | to_json, network_allowed_config | to_json] if network_nested else []) }}"
    stdin: "{{ network_container | to_json }}"
  vars:
    network_nested: "{{ network_allowed_devices is defined and network_allowed_devices | length > 0 }}"
    network_plain_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_network.py') }}"
    network_check_source: "{{ network_plain_source.split('if __name__ == \"__main__\":')[0] ~ lookup('ansible.builtin.file', playbook_dir ~ '/instance_nested.py') if network_nested else network_plain_source }}"
  register: network_nic_check
  changed_when: false
  failed_when: false

# The error code stays the result; the log names the key or device that the nested guard refused.
- name: Name what the nested guard refused
  tags: [always]
  when: network_nested and network_nic_check.rc == 1
  ansible.builtin.debug:
    msg: "{{ network_failure }}: {{ network_nic_check.stdout }}"
  vars:
    network_nested: "{{ network_allowed_devices is defined and network_allowed_devices | length > 0 }}"

- name: Refuse an unsafe effective NIC on the Instance bridge
  tags: [always]
  ansible.builtin.assert:
    that: network_nic_check.rc == 0
    fail_msg: "{{ network_code if expected_network_device is defined else network_code ~ ': ' ~ network_nic_check.stdout }}"
    quiet: true
  vars:
    # Exit 2: a NIC with its own address lacks the address filters (docs/reference/development-containers.md#network).
    network_code: "{{ 'instance.nic_filters_missing' if network_nic_check.rc == 2 else network_failure }}"
