# One wave of probes: every probe of the wave starts as an async job in its container, then one status read per job, every `poll_delay` seconds
# until it ends. A wave item is a pair [probe, protocol]. As the runner does (steps.py probe_result), the exit code tells the result:
# 0 connected (a UDP echo came), 124 the timeout of a dropped packet (blocked), anything else refused, which fits neither expectation.
- name: Start the probes of the wave
  vars:
    p: {tip: "{{ item.0.tip }}", port: "{{ item.0.port }}", proto: "{{ item.1 }}"}
  ansible.builtin.command:
    argv: "{{ probe_argv }}"
  delegate_to: "{{ item.0.from }}"
  loop: "{{ wave }}"
  loop_control: {label: "{{ item.0.case }} {{ item.0.from }} {{ item.1 }} {{ item.0.port }}"}
  async: 30
  poll: 0
  register: started
  changed_when: false

- name: Wait for the probes of the wave
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ started.results }}"
  loop_control: {label: "{{ item.item.0.case }} {{ item.item.0.from }} {{ item.item.1 }} {{ item.item.0.port }}"}
  delegate_to: "{{ item.item.0.from }}"
  register: finished
  until: finished.finished
  retries: 30
  delay: "{{ poll_delay | int }}"
  failed_when: false

- name: Keep what each probe saw
  vars:
    probe: "{{ item.0.0 }}"
    proto: "{{ item.0.1 }}"
    observed: "{{ 'connect' if item.1.rc | default(-1) == 0 else ('blocked' if item.1.rc | default(-1) == 124 else 'refused') }}"
  ansible.builtin.set_fact:
    probe_obs: >-
      {{ probe_obs + [probe | combine({'proto': proto, 'observed': observed, 'ok': observed == probe.expect,
         'text': probe.from ~ ' to ' ~ proto ~ '/' ~ probe.port ~ ' ' ~ observed ~ ', expected ' ~ probe.expect})] }}
  loop: "{{ wave | zip(finished.results) | list }}"
  loop_control: {label: "{{ item.0.0.case }} {{ item.0.1 }} {{ item.0.0.port }}"}
