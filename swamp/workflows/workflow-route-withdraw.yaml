id: 7d3c1e52-84a1-4f6b-9b0e-2c5a6f1d9e47
name: route-withdraw
autoContinue: false
queueTimeout: 30
labels: {role: swamp}
description: "instance.destroy: withdraw a Route from every Node it touches, one plan and one Node-local transaction per Node, and prove every contribution."
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    # forward: an Instance removal, from the captured states in order; restore: the reverse of a publication, for a create that failed.
    side:
      type: string
      enum: [forward, restore]
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - side
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: withdraw
  steps:
    # The firewall rules and ingress that stay open during the withdrawal are applied before it.
  - name: withdraw_lan
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations[inputs.side].lan }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn: []
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
  - name: withdraw_ingress
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations[inputs.side].ingress }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-ingress-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
    # Each Node that serves the Route, holds a withdrawn certificate scope, or holds private DNS lines of the Route, in parallel: its
    # pools, Caddyfile, private DNS records and certificate folders, each written once. The captured states run in order against what
    # the Node holds. The Gateway captures only the DNS lines and catalog values that differ between the states
    # (NativeRoutePublicationArtifacts::scope) and interns equal states as one artifact, so equal indexes mean that the Node holds no
    # line of the Route and the Node transaction would write nothing: such a Node is not visited (an in-TLD Route, ADR 0234).
    # The `forward` step requires the same selection.
  - name: withdraw_node
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.serves_routes || (p.prepared.dns != null && (p.before.dns != p.prepared.dns || (p.withdrawn.dns != null && p.withdrawn.dns != p.prepared.dns) || (p.after.dns != null && p.after.dns != p.prepared.dns))) || inputs.intent.route_mutations[inputs.side].cleanup.exists(leaf,leaf.node_id == p.node_id)) }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-withdraw-node
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          publication:
            node_id: ${{ self.part.node_id }}
            user: ${{ self.part.user }}
            control_node_id: ${{ self.part.control_node_id }}
            connection: ${{ self.part.connection }}
            host_keys: ${{ self.part.host_keys }}
            serves_routes: ${{ self.part.serves_routes }}
            # The withdrawn Route picks the Node steps' slot (route-withdraw-node), one of 16 per Node. The restore stage lists the Routes
            # the Node served before: the withdrawn ones of a destroy, the prior one of a failed create.
            route_id: '${{ ("restore" in inputs.intent.route_mutations && "routes" in inputs.intent.route_mutations.restore && size(inputs.intent.route_mutations.restore.routes) > 0 ? string(inputs.intent.route_mutations.restore.routes[0].route_id) : "none") }}'
            # Where the Node's refusal goes when its transaction refuses; the `refusal` step reads it into the result.
            refusal_path: '${{ "/tmp/orbit-route-withdraw-" + run.id + "-" + string(self.part.node_id) + ".json" }}'
          php: '${{ self.part.serves_routes ? {"before": inputs.intent.route_mutations.artifacts.php[inputs.side == "restore" ? self.part.after.php : self.part.before.php], "after": inputs.intent.route_mutations.artifacts.php[inputs.side == "restore" ? self.part.before.php : self.part.after.php]} : {} }}'
          caddy: '${{ self.part.serves_routes ? {"before": inputs.intent.route_mutations.artifacts.caddy[inputs.side == "restore" ? self.part.after.caddy : self.part.before.caddy], "prepared": inputs.intent.route_mutations.artifacts.caddy[inputs.side == "restore" ? self.part.withdrawn.caddy : self.part.prepared.caddy], "withdrawn": inputs.intent.route_mutations.artifacts.caddy[inputs.side == "restore" ? self.part.prepared.caddy : self.part.withdrawn.caddy], "after": inputs.intent.route_mutations.artifacts.caddy[inputs.side == "restore" ? self.part.before.caddy : self.part.after.caddy]} : {} }}'
          dns: '${{ self.part.prepared.dns != null ? {"before": inputs.intent.route_mutations.artifacts.dns[inputs.side == "restore" ? (self.part.after.dns != null ? self.part.after.dns : self.part.prepared.dns) : self.part.before.dns], "prepared": inputs.intent.route_mutations.artifacts.dns[inputs.side == "restore" ? (self.part.withdrawn.dns != null ? self.part.withdrawn.dns : self.part.prepared.dns) : self.part.prepared.dns], "withdrawn": inputs.intent.route_mutations.artifacts.dns[inputs.side == "restore" ? self.part.prepared.dns : (self.part.withdrawn.dns != null ? self.part.withdrawn.dns : self.part.prepared.dns)], "after": inputs.intent.route_mutations.artifacts.dns[inputs.side == "restore" ? self.part.before.dns : (self.part.after.dns != null ? self.part.after.dns : self.part.prepared.dns)]} : {} }}'
          cleanup: '${{ inputs.intent.route_mutations[inputs.side].cleanup.filter(leaf,leaf.node_id == self.part.node_id).map(leaf,{"scope": leaf.scope, "user": leaf.user}) }}'
        execution_secrets: {}
    allowFailure: true
  - name: withdraw_retire_lan
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations[inputs.side].retire_lan }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
  - name: withdraw_retire_ingress
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations[inputs.side].retire_ingress }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    - {step: withdraw_retire_lan, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-ingress-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations[inputs.side].publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
    # Every contribution proved. A destroy has no new certificate, no environment write and no live leaf: the count of any such work
    # is required under a step that does not exist, so it fails closed with route.contribution_incomplete instead of being dropped.
  - name: forward
    forEach:
      item: stage
      in: ${{ [inputs.intent.route_mutations[inputs.side]] }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    - {step: withdraw_retire_lan, condition: {type: always}}
    - {step: withdraw_retire_ingress, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: '${{ ("forward-result-" + string(self._index) + "-" + ("restore" in inputs.intent.route_mutations && "routes" in inputs.intent.route_mutations.restore && size(inputs.intent.route_mutations.restore.routes) > 0 ? string(int(inputs.intent.route_mutations.restore.routes[0].route_id) % 16) : "none")).split(".").join("-") }}'
      methodName: result
      inputs:
        stage: ${{ self.stage }}
        mode: forward
        required:
          withdraw_lan: ${{ size(inputs.intent.route_mutations[inputs.side].lan) }}
          withdraw_ingress: ${{ size(inputs.intent.route_mutations[inputs.side].ingress) }}
          withdraw_node: ${{ size(inputs.intent.route_mutations[inputs.side].publications.filter(p,p.serves_routes || (p.prepared.dns != null && (p.before.dns != p.prepared.dns || (p.withdrawn.dns != null && p.withdrawn.dns != p.prepared.dns) || (p.after.dns != null && p.after.dns != p.prepared.dns))) || inputs.intent.route_mutations[inputs.side].cleanup.exists(leaf,leaf.node_id == p.node_id))) }}
          withdraw_retire_lan: ${{ size(inputs.intent.route_mutations[inputs.side].retire_lan) }}
          withdraw_retire_ingress: ${{ size(inputs.intent.route_mutations[inputs.side].retire_ingress) }}
          withdraw_unsupported: '${{ ("prepare_certificates" in inputs.intent.route_mutations[inputs.side] ? size(inputs.intent.route_mutations[inputs.side].prepare_certificates) : 0) + size(inputs.intent.route_mutations[inputs.side].certificates) + size(inputs.intent.route_mutations[inputs.side].url_writes) }}'
        outcomes: ${{ steps }}
    allowFailure: true
    # The refusal a Node transaction wrote (route-withdraw-node `failure`), the first one by Node, printed and removed.
  - name: refusal
    labels: {role: swamp}
    dependsOn:
    - {step: withdraw_node, condition: {type: always}}
    guard: ${{ !steps.exists(key, key.startsWith("withdraw_node") && steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("route-withdraw-refusal-" + ("restore" in inputs.intent.route_mutations && "routes" in inputs.intent.route_mutations.restore && size(inputs.intent.route_mutations.restore.routes) > 0 ? string(int(inputs.intent.route_mutations.restore.routes[0].route_id) % 16) : "none")).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          set -- "$ORBIT_REFUSALS"-*.json
          if [ -f "$1" ]; then timeout 10 cat -- "$1"; fi
          rm -f -- "$ORBIT_REFUSALS"-*.json
        env: {ORBIT_REFUSALS: '${{ "/tmp/orbit-route-withdraw-" + run.id }}'}
    allowFailure: true
  - name: result
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    - {step: withdraw_retire_lan, condition: {type: always}}
    - {step: withdraw_retire_ingress, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    - {step: refusal, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-update-result'
      behaviorName: '${{ ("route-mutation-phase-" + ("restore" in inputs.intent.route_mutations && "routes" in inputs.intent.route_mutations.restore && size(inputs.intent.route_mutations.restore.routes) > 0 ? string(int(inputs.intent.route_mutations.restore.routes[0].route_id) % 16) : "none")).split(".").join("-") }}'
      methodName: phase
      inputs:
        mode: forward
        steps: ${{ steps }}
