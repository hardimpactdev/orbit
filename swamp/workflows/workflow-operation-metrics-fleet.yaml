- name: publish-runtime-files
  dependsOn:
  - job: remove-fpm-exporter-binary
    condition:
      type: succeeded
  concurrency: 1
  steps:
  - name: publish-runtime-file${{ string(self.item.key) }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    writes: true
    forEach:
      item: item
      in: ${{ steps.read.outputs.files }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-runtime-file-" + string(inputs.operation_id) + "-" + string(self.item.key) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_RUNTIME_FILE -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import stat
          import tempfile

          v = json.loads(os.environ["ORBIT_RUNTIME_FILE"])
          root = pathlib.Path("/")
          p = root / v["path"].lstrip("/")
          base = root / "etc/orbit/metrics"
          marker = base / ".orbit-owner"
          for parent in [
              *reversed([q for q in p.parents if q == root or root in q.parents]),
              p,
              marker,
          ]:
              try:
                  st = parent.lstat()
              except FileNotFoundError:
                  continue
              if stat.S_ISLNK(st.st_mode) or (
                  parent != p and parent != marker and not stat.S_ISDIR(st.st_mode)
              ):
                  raise SystemExit("metrics.configuration_ownership_drift")
          if base.exists() and (not marker.is_file() or marker.read_bytes() != b"metrics\n"):
              raise SystemExit("metrics.configuration_ownership_drift")
          p.parent.mkdir(parents=True, exist_ok=True)
          # The marker is part of publishing the owned configuration tree, not a run ledger.
          if not marker.exists():
              fd = os.open(marker, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o640)
              with os.fdopen(fd, "wb") as out:
                  out.write(b"metrics\n")
          fd, temporary = tempfile.mkstemp(prefix=".orbit-metrics-", dir=p.parent)
          try:
              with os.fdopen(fd, "w") as out:
                  out.write(v["content"])
                  os.fchmod(out.fileno(), 0o644)
                  out.flush()
                  os.fsync(out.fileno())
              os.replace(temporary, p)
          finally:
              pathlib.Path(temporary).unlink(missing_ok=True)
          print('{"published":true}')
          PYTHON
        env:
          ORBIT_RUNTIME_FILE: ${{ self.item.json }}
- name: publish-grafana-password
  dependsOn:
  - job: publish-runtime-files
    condition:
      type: succeeded
  steps:
  - name: publish-grafana-password
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-publish-grafana-password-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_GRAFANA_PASSWORD -- /usr/bin/python3 - <<'PYTHON'
          import os
          import pathlib
          import stat
          import tempfile

          password = os.environ.pop("ORBIT_GRAFANA_PASSWORD")
          if not password or len(password.encode()) > 65536 or "\x00" in password:
              raise SystemExit("metrics.credentials_missing")
          root = pathlib.Path("/")
          p = root / "etc/orbit/metrics/grafana/admin-password"
          marker = root / "etc/orbit/metrics/.orbit-owner"
          for parent in [*reversed([q for q in p.parents if q == root or root in q.parents]), p]:
              st = parent.lstat() if parent.exists() or parent.is_symlink() else None
              if st is None:
                  continue
              if (
                  stat.S_ISLNK(st.st_mode)
                  or st.st_mode & 0o022
                  or (parent != p and (not stat.S_ISDIR(st.st_mode) or st.st_uid != 0))
                  or (parent == p and (not stat.S_ISREG(st.st_mode) or st.st_uid not in (0, 472)))
              ):
                  raise SystemExit("metrics.configuration_ownership_drift")
          if not marker.is_file() or marker.is_symlink() or marker.read_bytes() != b"metrics\n":
              raise SystemExit("metrics.configuration_ownership_drift")
          fd, temporary = tempfile.mkstemp(prefix=".orbit-password-", dir=p.parent)
          try:
              with os.fdopen(fd, "w") as stream:
                  stream.write(password)
                  os.fchown(stream.fileno(), 472, 472)
                  os.fchmod(stream.fileno(), 0o400)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary, p)
          finally:
              pathlib.Path(temporary).unlink(missing_ok=True)
          print('{"published":true}')
          PYTHON
        env: *id005
- name: inspect-runtime-container
  dependsOn:
  - job: publish-grafana-password
    condition:
      type: succeeded
  steps:
  - name: inspect-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-runtime-container-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          expected = hashlib.sha256(os.environ["ORBIT_CONTAINER_INTENT"].encode()).hexdigest()
          found = {}
          for kind, name in [
              ("container", v["name"]),
              ("container", v["backup"]),
              ("volume", v["volume"]),
          ]:
              r = subprocess.run(
                  ["/usr/bin/docker", kind, "inspect", "--", name],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if r.returncode:
                  listing = subprocess.run(
                      [
                          "/usr/bin/docker",
                          kind,
                          "ls",
                          *(["--all"] if kind == "container" else []),
                          "--format",
                          "{{.Names}}" if kind == "container" else "{{.Name}}",
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )
                  if name in listing.stdout.splitlines():
                      raise SystemExit("metrics.container_inspection_failed")
                  found[name] = None
                  continue
              item = json.loads(r.stdout)[0]
              labels = item.get("Labels") if kind == "volume" else item["Config"].get("Labels")
              required = {
                  "com.orbit.managed": "metrics",
                  "com.orbit.metrics." + ("volume" if kind == "volume" else "service"): v[
                      "service"
                  ],
              }
              if not isinstance(labels, dict) or any(
                  labels.get(k) != value for k, value in required.items()
              ):
                  raise SystemExit("metrics.container_ownership_drift")
              found[name] = {
                  "hash": labels.get("com.orbit.metrics.spec-hash"),
                  "running": item.get("State", {}).get("Running", False),
              }
          print(
              json.dumps(
                  {
                      "current": found[v["name"]],
                      "backup": found[v["backup"]],
                      "volume": found[v["volume"]],
                      "expected_hash": expected,
                  }
              )
          )
          PYTHON
        env: &id006
          ORBIT_CONTAINER_INTENT: ${{ self.item.json }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
