---
# What each case runs and what it must see. Loaded by converge.yml and verify.yml for every case host: `inventory_hostname` is the case, `d` its
# definition, `c` its ports (molecule.yml). Source: missing-input-prompts, missing-input-cancel and missing-input-noninteractive of
# swamp/proof/firewall/allow.cases.yaml.
tnode: "{{ hostvars['localhost'].target_node }}"
tcontainer: "nested-{{ tnode }}"
tid: "{{ hostvars['localhost'].node_ids[tnode] }}"
d: "{{ case_defs[inventory_hostname] }}"
c: "{{ cases[inventory_hostname] | default({}) }}"

# How a prompt that WAITS for input looks in the log of the CLI under NO_COLOR (read from a real run of the CLI in a pseudo-terminal): a box
# whose title line is the label, whose second line is the value. The same prompt is drawn again once it is answered (the box then shows the
# answer), so the label alone is not enough; the second line tells the two apart.
#   port  the text prompt `Destination port or range`: while it waits, line 2 shows the placeholder 8000:8100. Answered, it shows the answer.
#   node  the select prompt `Node`: while it waits, its options carry the markers ● (highlighted) and ○. Answered, it shows the chosen name.
# These are regular expressions of pexpect (bytes, DOTALL), so they are written without `.*`. The runner's `see: port` and `see: Node` match
# the label only; it moves on with the keys, which `expect` cannot do (see `answers` below).
prompt_regex:
  port: 'Destination port or range[^\n]*\n[^\n]*8000:8100'
  node: 'Node [^\n]*\n[^\n]*●'

# `answers` is the `tty` list of the cases file, as `ansible.builtin.expect` can say it: for a prompt, the texts to send, one for each time the
# prompt is seen (a list, so the port prompt can be answered `abc` first and `PORT` the second time it is drawn). `expect` sends each text
# followed by one newline, in ONE write. A text-input prompt takes such a chunk as typed keys followed by Enter, so `send: [abc]` is the runner's
# `send: abc`. A select list matches a chunk only if it is exactly one key: Enter ("") picks the highlighted (FIRST) entry, and
# `{choose: app-dev}` (the Down key, or j, then Enter) is NOT expressible: the newline `expect` adds makes the chunk "Down\n", which the list ignores.
# `^C` is "\x03": the CLI's input reader aborts on a chunk that holds the byte, so "\x03\n" cancels like the runner's "^C".
#
# `expect` of a run: rc (exit status), ops (Operations of kind firewall.allow created by the run), text (regular expressions the transcript must
# match; the transcript is stdout and stderr, carriage returns removed), absent (must not match), once (must match exactly once).
case_defs:
  # Row "Missing input", case 1: omitted port asked, an invalid port asked again, then the Node chosen; second run: port given, only the Node asked.
  missing_input_prompts:
    runs:
      - argv: [firewall:allow]
        tty: true
        answers:
          - {prompt: port, send: ["abc", "{{ c.port }}"]}
          - {prompt: node, send: [""]}
        expect:
          rc: 0
          ops: 1
          text:
            - '(?s)│ abc +│.*Firewall port must be from 1 to 65535 or an ordered range[.].*│ {{ c.port }} +│.*Node .*│ {{ tnode }} +│'
          once: ['Firewall port must be from 1 to 65535 or an ordered range[.]']
      - argv: [firewall:allow, "{{ c.port2 }}"]
        tty: true
        answers:
          - {prompt: node, send: [""]}
        expect:
          rc: 0
          ops: 1
          text:
            - '(?s)Node .*│ {{ tnode }} +│'
          absent: ['Destination port or range', 'Firewall port must be']

  # Row "Missing input", case 2: Ctrl-C at the port prompt ends the command without a request.
  missing_input_cancel:
    runs:
      - argv: [firewall:allow]
        tty: true
        answers:
          - {prompt: port, send: ["\x03"]}
        expect:
          rc: 1
          ops: 0
          text: ['input[.]cancelled']
          absent: ['●']

  # Row "Missing input", case 3, human form (default has the --json form as failure_code): no terminal, no --node.
  missing_input_noninteractive:
    runs:
      - argv: [firewall:allow, "{{ c.port }}"]
        tty: false
        expect:
          rc: 1
          ops: 0
          text: ['firewall[.]node_id_invalid']
          absent: ['Destination port or range']
