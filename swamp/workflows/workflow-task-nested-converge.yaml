id: 9e8233c6-dac8-44b9-bcf0-062e51c30774
name: task-nested-converge
description: >-
  Bring the Nodes of a task VM's nested fleet to the release of its checkout before the refresh saves them as ready copies (the nested part of
  `Converge once`, docs/reference/pipeline/6-task-image-seed-refresh.mmd): the nested Gateway admits one `node.converge` per Node it manages,
  from its own checkout, so the Node agent, its unit, the CLI, role software and network are at the pins of that release, and each converge
  is waited for until it ends. A Node already at the pins reports no change.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    guest_node_id: {type: integer, minimum: 1}
    ssh_execution: {type: object}
  required: [guest_node_id, ssh_execution]
  additionalProperties: false
jobs:
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ {"ssh_execution": inputs.ssh_execution, "fleet": {"guests": {"gateway": "nested-gateway", "app-dev": "nested-app-dev", "app-prod": "nested-app-prod"} } } }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
  # The waits run the readiness playbook input: the same task VM and nested Gateway.
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "nested-converge-input-" + string(inputs.guest_node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" task_vm.nested_ready
        env: &ansible
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
- name: converge
  labels: {role: swamp}
  dependsOn: [{job: input, condition: {type: succeeded}}]
  steps:
  # The Nodes the nested Gateway manages, by name: every Node but the operator, which is the task VM itself.
  - name: 'Read the Nodes'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-read-the-nodes").split(".").join("-") }}', methodName: exec, globalArgs: &vm {name: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-read-the-nodes").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh_execution.target.user }}', port: '${{ inputs.ssh_execution.target.port }}', identityFile: '${{ inputs.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', 'nested-gateway', '--', 'sqlite3', '/home/orbit/.orbit/gateway.sqlite', "select name from nodes where name <> 'operator' order by id"], timeoutSec: 40}}
  # The nested Gateway admits each converge from its own checkout, as the fleet build admits each Node (`orbit:node-add`).
  - name: 'Admit the converge'
    labels: {role: swamp}
    writes: true
    forEach: {item: node, in: '${{ steps["Read the Nodes"].outputs.stdout.split("\n").filter(n, n != "") }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-admit-" + self.node).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-admit-" + self.node).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', 'nested-gateway', '--user', '1000', '--env', 'HOME=/home/orbit', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'orbit:node-converge', '${{ self.node }}'], timeoutSec: 130}}
    dependsOn: [{step: 'Read the Nodes', condition: {type: succeeded}}]
  - name: 'Wait for the converge'
    labels: {role: swamp}
    forEach: {item: node, in: '${{ steps["Read the Nodes"].outputs.stdout.split("\n").filter(n, n != "") }}'}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-wait-" + self.node).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 1800 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "wait_kind=operation wait_operation=$ORBIT_WAIT_OPERATION wait_seconds=900" "$ORBIT_ANSIBLE/task-vm-fleet-wait.yml"
        env:
          <<: *ansible
          ORBIT_WAIT_OPERATION: '${{ steps["Admit the converge-" + self.node].outputs.stdout.split("#")[1].split(" ")[0] }}'
    dependsOn: [{step: 'Admit the converge', condition: {type: succeeded}}]
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: converge, condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "nested-converge-cleanup-" + string(inputs.guest_node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
