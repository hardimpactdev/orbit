        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" || steps.exists(k, k.startsWith("Run the deploy steps") && steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - symbolic-ref
        - --quiet
        - --short
        - HEAD
        timeoutSec: 60
  - name: Read the checkout commit
    labels:
      role: swamp
    dependsOn:
    - step: Read the checkout branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - HEAD
        timeoutSec: 60
  - name: Check the checkout
    dependsOn:
    - step: Read the checkout commit
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: assert
      severity: high
      message: The checkout moved during the deployment.
      expr: steps["Read the checkout branch"].outputs.stdout.trim() == inputs.intent.deployment.branch && steps["Read the checkout commit"].outputs.stdout.trim() == steps["Resolve the commit"].outputs.stdout.trim()
- name: deploy
  labels: {node: '${{ string(inputs.node_id) }}'}
  writes: true
  steps:
  - guard: ${{ inputs.intent.deployment.variant != "production" }}
    name: prepare-production
    task:
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      behaviorType: '@nckrtl/instance-deploy-direct'
      inputs:
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
      methodName: prepareProduction
      type: behavior
  - name: install-processes
    labels: {role: swamp}
    forEach:
      item: member
      in: '${{ inputs.intent.deployment.variant == "production" ? inputs.intent.process_members : [] }}'
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ self.member.node_id }}
        kind: process.create
        intent: ${{ self.member.intent }}
        execution_secrets: '${{ "node_" + string(self.member.node_id) + "_member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["node_" + string(self.member.node_id) + "_member_" + string(self.member.id)]} : {} }}'
    dependsOn:
    - step: prepare-production
      condition:
        type: succeeded
  - guard: ${{ inputs.intent.deployment.variant != "production" }}
    name: finish-production
    task:
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      behaviorType: '@nckrtl/instance-deploy-direct'
      inputs:
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
      methodName: finishProduction
      type: behavior
    dependsOn:
    - step: install-processes
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: prepare-production
      condition:
        type: succeeded
- name: failure
  dependsOn:
  - job: deploy
    condition:
      type: failed
  labels: {node: '${{ string(inputs.node_id) }}'}
  writes: true
  steps:
  - name: report
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-deploy-direct'
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      methodName: failure
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ inputs.intent.deployment.variant != "production" }}
