name: CI

on:
  pull_request:
  push:
    branches: [main, 'task-*-handoff']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'

jobs:
  php:
    name: PHP syntax and Composer
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['php']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Cache frozen published agent
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orbit-frozen-agent
          key: frozen-agent-${{ runner.os }}-${{ hashFiles('apps/gateway/resources/agent/frozen-manifest.json') }}
      - name: Check frozen agent command references
        run: bin/check-frozen-agent-commands --binary-cache "$HOME/.cache/orbit-frozen-agent"
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Validate Composer metadata
        run: git ls-files -z '*composer.json' | xargs -0 -I '{}' composer validate --strict --no-check-publish '{}'
      - name: Check changed PHP syntax
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=HEAD^; fi
          git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- '*.php' | xargs -0 -r -n 1 -P 4 php -l

  gateway-static:
    name: Gateway static analysis
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['gateway-static']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Cache Gateway analysis dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/gateway/vendor
          key: php-analysis-${{ runner.os }}-8.5-${{ hashFiles('apps/gateway/composer.lock', 'packages/php-sdk/composer.json') }}
      - name: Install Gateway analysis dependencies
        run: |
          cp apps/gateway/.env.example apps/gateway/.env
          composer install --working-dir=apps/gateway --no-interaction --prefer-dist --no-scripts
      - name: Analyze the complete Gateway and collect its tests
        working-directory: apps/gateway
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          composer analyse
          vendor/bin/pest --list-tests
      # The one test of the container model forwarder's nftables table on a real kernel. The flag turns a missing requirement into a
      # failure, so it never passes as a skip here.
      - name: Prove the model forwarder's nftables table on a real kernel
        working-directory: apps/gateway
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          ORBIT_REAL_KERNEL_TESTS: '1'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nftables
          vendor/bin/pest --default-time-limit=5 --group privileged tests/Feature/Extensions/AiRouter/AiRouterModelForwarderTest.php --filter 'on a real kernel'
      # The same for the Instance egress proxy's table. It runs after the forwarder's step, which installed nftables.
      - name: Prove the Instance egress proxy's nftables table on a real kernel
        working-directory: apps/gateway
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          ORBIT_REAL_KERNEL_TESTS: '1'
        run: vendor/bin/pest --default-time-limit=5 --group privileged tests/Feature/Domain/Instances/InstanceEgressTest.php --filter 'on a real kernel'

  gateway-tests:
    name: Gateway Pest suite
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['gateway-tests']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Give every PHP worker 1 GiB
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-tests-php"
          echo 'memory_limit=1G' > "$RUNNER_TEMP/gateway-tests-php/memory.ini"
          echo "PHP_INI_SCAN_DIR=${PHP_INI_SCAN_DIR:-}:$RUNNER_TEMP/gateway-tests-php" >> "$GITHUB_ENV"
      - name: Set the firewall dependency cache directory
        run: echo "DENO_DIR=$RUNNER_TEMP/gateway-tests-deno" >> "$GITHUB_ENV"
      - name: Cache Gateway test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/gateway/vendor
          key: gateway-tests-dev-${{ runner.os }}-8.5-${{ hashFiles('apps/gateway/composer.json', 'apps/gateway/composer.lock', 'packages/php-sdk/composer.json', 'packages/php-sdk/composer.lock') }}
      - name: Cache CLI test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli/vendor
          key: cli-tests-dev-${{ runner.os }}-8.5-${{ hashFiles('apps/cli/composer.json', 'apps/cli/composer.lock', 'packages/php-sdk/composer.json', 'packages/php-sdk/composer.lock') }}
      - name: Install Gateway and CLI dev dependencies
        run: |
          cp apps/gateway/.env.example apps/gateway/.env
          composer install --working-dir=apps/gateway --no-interaction --prefer-dist --no-scripts
          composer install --working-dir=apps/cli --no-interaction --prefer-dist --no-scripts
      - name: Build the test API contracts
        run: bin/build-api
      - name: Cache pinned Deno download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orbit-gateway-tests/deno
          key: gateway-tests-deno-download-${{ runner.os }}-${{ runner.arch }}-2.9.8-${{ hashFiles('apps/gateway/resources/machine-software/recipe.json') }}
      - name: Verify and extract the recipe Deno
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess, urllib.request, zipfile
          from pathlib import Path
          tool = json.loads(Path('apps/gateway/resources/machine-software/recipe.json').read_text())['tools']['deno']
          if tool['version'] != '2.9.8':
              raise SystemExit('Update the Gateway test Deno pin with the recipe')
          artifact = tool['artifacts']['amd64']
          archive = Path.home() / '.cache/orbit-gateway-tests/deno/deno_2.9.8_linux_amd64.zip'
          archive.parent.mkdir(parents=True, exist_ok=True)
          if not archive.exists():
              urllib.request.urlretrieve(artifact['url'], archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != artifact['sha256']:
              raise SystemExit('Deno checksum mismatch')
          destination = Path(os.environ['RUNNER_TEMP']) / 'gateway-tests-deno-bin'
          with zipfile.ZipFile(archive) as release:
              release.extract('deno', destination)
          binary = destination / 'deno'
          binary.chmod(0o755)
          if subprocess.check_output([str(binary), '--version'], text=True).split()[:2] != ['deno', '2.9.8']:
              raise SystemExit('Deno version mismatch')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(binary.parent) + '\n')
          PYTHON
      - name: Cache firewall Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DENO_DIR }}
          key: gateway-tests-deno-${{ runner.os }}-${{ runner.arch }}-2.9.8-${{ hashFiles('swamp/deno.lock', 'swamp/extensions/behaviors/operations/firewall/**', 'swamp/extensions/behaviors/_lib/**') }}
      - name: Warm firewall imports
        working-directory: swamp
        run: deno cache --no-lock extensions/behaviors/operations/firewall/firewall_test.ts
      - name: Cache pinned Caddy download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orbit-gateway-tests/caddy
          key: gateway-tests-caddy-${{ runner.os }}-${{ runner.arch }}-2.11.7-${{ hashFiles('apps/gateway/resources/machine-software/recipe.json') }}
      - name: Verify and extract the recipe Caddy
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          tool = json.loads(Path('apps/gateway/resources/machine-software/recipe.json').read_text())['tools']['caddy']
          if tool['version'] != '2.11.7':
              raise SystemExit('Update the Gateway test Caddy pin with the recipe')
          artifact = tool['artifacts']['amd64']
          archive = Path.home() / '.cache/orbit-gateway-tests/caddy/caddy_2.11.7_linux_amd64.deb'
          archive.parent.mkdir(parents=True, exist_ok=True)
          if not archive.exists():
              urllib.request.urlretrieve(artifact['url'], archive)
          if hashlib.sha512(archive.read_bytes()).hexdigest() != artifact['sha512']:
              raise SystemExit('Caddy checksum mismatch')
          destination = Path(os.environ['RUNNER_TEMP']) / 'gateway-tests-caddy'
          subprocess.run(['dpkg-deb', '-x', str(archive), str(destination)], check=True)
          binary = destination / 'usr/bin/caddy'
          if subprocess.check_output([str(binary), 'version'], text=True).split()[0] != 'v2.11.7':
              raise SystemExit('Caddy version mismatch')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(binary.parent) + '\n')
          PYTHON
      - name: Run the complete Gateway Pest suite
        working-directory: apps/gateway
        run: |
          php -r 'if (ini_get("memory_limit") !== "1G") { exit(1); }'
          command -v caddy
          vendor/bin/pest --parallel --processes=4 --default-time-limit=5 --fail-on-skipped --compact --colors=never --log-junit="$RUNNER_TEMP/gateway-tests.xml"
      - name: Publish Gateway Pest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-tests-junit
          path: ${{ runner.temp }}/gateway-tests.xml
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI build
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['cli']) != 'false' }}
    uses: ./.github/workflows/orbit-cli-binary.yml
    with:
      commit: ${{ github.sha }}
      version: ''

  cli-static:
    name: CLI static analysis
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['cli-static']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install the dependencies of apps/cli
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --no-scripts
      - name: Analyze apps/cli
        working-directory: apps/cli
        run: composer analyse

  cli-tests:
    name: CLI Pest suite
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['cli-tests']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Give PHP and child processes 1 GiB
        run: |
          mkdir -p "$RUNNER_TEMP/cli-tests-php"
          echo 'memory_limit=1G' > "$RUNNER_TEMP/cli-tests-php/memory.ini"
          echo "PHP_INI_SCAN_DIR=${PHP_INI_SCAN_DIR:-}:$RUNNER_TEMP/cli-tests-php" >> "$GITHUB_ENV"
      - name: Cache CLI test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cli/vendor
          key: cli-tests-dev-${{ runner.os }}-8.5-${{ hashFiles('apps/cli/composer.json', 'apps/cli/composer.lock', 'packages/php-sdk/composer.json', 'packages/php-sdk/composer.lock') }}
      - name: Install CLI dev dependencies
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --no-scripts
      - name: Run the complete CLI Pest suite
        working-directory: apps/cli
        run: |
          # jq ships with ubuntu-26.04 and is required by the CLI release tests.
          jq --version
          php -r 'if (ini_get("memory_limit") !== "1G") { exit(1); }'
          vendor/bin/pest --compact --colors=never --log-junit="$RUNNER_TEMP/cli-tests.xml"
      - name: Publish CLI Pest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-tests-junit
          path: ${{ runner.temp }}/cli-tests.xml
          if-no-files-found: error
          retention-days: 7

  sdk-static:
    name: PHP SDK static analysis
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['sdk-static']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install the dependencies of packages/php-sdk
        run: composer install --working-dir=packages/php-sdk --no-interaction --prefer-dist --no-scripts
      - name: Analyze packages/php-sdk
        working-directory: packages/php-sdk
        run: composer analyse

  e2e-static:
    name: E2E static analysis
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['e2e-static']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install the dependencies of apps/e2e
        run: composer install --working-dir=apps/e2e --no-interaction --prefer-dist --no-scripts
      - name: Analyze apps/e2e
        working-directory: apps/e2e
        run: composer analyse

  docs:
    name: Docs build
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['docs']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install Docs dependencies
        run: composer install --working-dir=apps/docs --no-interaction --prefer-dist --no-dev
      - name: Build and check the documentation index
        run: |
          composer docs-build
          composer docs-lint
      - name: Check flow charts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node bin/check-flows

  api-reference:
    name: Generated contracts
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['api-reference']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache installed PHP dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/gateway/vendor
          key: php-runtime-${{ runner.os }}-8.5-${{ hashFiles('apps/gateway/composer.lock', 'packages/php-sdk/composer.json') }}
      - name: Install generator dependencies
        run: |
          cp apps/gateway/.env.example apps/gateway/.env
          composer install --working-dir=apps/gateway --no-interaction --prefer-dist --no-dev
          bun install --cwd apps/web --frozen-lockfile
      - name: Boot and validate Operation kinds, their flow charts, and intended workflow grants
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: bin/check-operation-kinds
      - name: Generate OpenAPI and MCP tools, then check the recorded fixtures
        run: |
          bin/docs-openapi
          bin/mcp-tools
          bin/api-fixtures --check
      - name: Generate web schema
        run: bun run --cwd apps/web types

  web:
    name: Web build
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['web']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Cache installed PHP dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/gateway/vendor
          key: php-runtime-${{ runner.os }}-8.5-${{ hashFiles('apps/gateway/composer.lock', 'packages/php-sdk/composer.json') }}
      - name: Build API contracts
        working-directory: .
        run: composer install --working-dir=apps/gateway --no-dev --no-interaction --prefer-dist
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build && test -s dist/index.html && test -s dist/version.json
      - name: Publish web build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  pi:
    name: Pi check, test and build
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['pi']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: apps/pi-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install and verify worker ACL prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y acl
          sudo -n -u nobody true
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  agent:
    name: Rust agent check and test
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['agent']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Prepare stable Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "version=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/agent/target
          key: agent-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/agent/Cargo.lock', 'apps/agent/Cargo.toml', 'apps/agent/crates/**/Cargo.toml', 'apps/gateway/extensions/*/agent/Cargo.toml') }}
          restore-keys: |
            agent-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - run: cargo check --locked --all-targets
      - name: Test the agent and composed extension crates
        run: scripts/check-crates test --locked

  changes:
    name: Select build inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      swamp_checks: ${{ steps.plan.outputs.swamp_checks }}
      gateway_release: ${{ steps.plan.outputs.gateway_release }}
      swamp_base_ref: ${{ steps.plan.outputs.swamp_base_ref }}
      proof_run: ${{ steps.plan.outputs.proof_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI scope and import fixtures
        run: |
          python3 -m unittest discover -s tools -p 'test_ci_*.py'
          python3 -m unittest discover -s tools/ci-runners -p 'test_*.py'
          python3 tools/test_swamp_import_base.py
          python3 tools/test_frozen_agent_commands.py
      - name: Select changed build inputs
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=HEAD^; fi
          args=()
          if [ "$MAIN" = true ]; then args+=(--main); fi
          python3 bin/ci-build-plan --base "$BASE" --head "${{ github.event.pull_request.head.sha || github.sha }}" "${args[@]}" --proof-cases --proof-selection-output proof-selection.json --swamp-base --github-output "$GITHUB_OUTPUT"
      - name: Publish runner case selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-selection-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof-selection.json
          retention-days: 7
          if-no-files-found: error

  proof:
    name: Proof harness
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['proof']) != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Unit tests of the case runner
        run: python3 -m unittest discover -s swamp/proof/runner/tests
      - name: Lint the proof programs
        run: |
          python3 -m venv "$RUNNER_TEMP/proof-tools"
          "$RUNNER_TEMP/proof-tools/bin/pip" install --disable-pip-version-check ruff==0.17.0
          "$RUNNER_TEMP/proof-tools/bin/ruff" check --isolated --select=E4,E7,E9,F,I swamp/proof/runner swamp/proof/firewall tools/swamp-proof-guest

  # A selected proof is part of the single Required checks result.
  proof-run:
    name: CI proof
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
    needs: changes
    # Only a pull request from a branch of this repository. A fork or outside PR needs a maintainer's review and
    # the label `run-proofs` (stage 4 of the command pipeline) and never starts this job: the workflow proof-outside.yml
    # runs its proof. There is no queue run, and no run after the merge: the proof tests the PR head once per push.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.proof_run == 'true'
    # The runner must act as an enrolled Node that may reach the Gateway: the orbit CLI on its PATH calls the Gateway
    # from its WireGuard address and uses no secret. Set the variable ORBIT_PROOF_RUNNER to a JSON list of labels to
    # move the job to such a runner.
    runs-on: ${{ fromJSON(vars.ORBIT_PROOF_RUNNER || '["self-hosted","hardimpact","orbit-shard"]') }}
    # The VM wait plus the 30 minute run budget.
    timeout-minutes: 195
    # A new push cancels the proof run of the previous push on the same PR. A cancelled step cancels its Orbit run.
    concurrency:
      group: proof-run-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The job checks out one file, the script. It passes the head SHA and an idempotency key, and Orbit chooses the cases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: bin/ci-proof-run
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Run orbit proof:run on the pull request head
        id: report
        env:
          PROOF_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_RECEIPT: ${{ runner.temp }}/proof-receipt.json
        run: python3 -I bin/ci-proof-run
      - name: Store the proof report receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-receipt.json
          if-no-files-found: warn

  swamp:
    name: Swamp
    needs: changes
    if: ${{ toJSON(fromJSON(needs.changes.outputs.jobs)['swamp']) != 'false' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/swamp-shape.yml
    with:
      working-directory: swamp
      changed-only: true
      shape: ${{ fromJSON(needs.changes.outputs.swamp_checks).shape }}
      validate: ${{ fromJSON(needs.changes.outputs.swamp_checks).validate }}
      tests: ${{ fromJSON(needs.changes.outputs.swamp_checks).tests }}
      base-ref: ${{ needs.changes.outputs.swamp_base_ref }}
    secrets:
      SWAMP_API_KEY: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task-') && endsWith(github.ref, '-handoff') && github.actor == 'orbit-nckrtl[bot]') && secrets.SWAMP_API_KEY || '' }}
      SWAMP_SIGNIN_TOKEN: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task-') && endsWith(github.ref, '-handoff') && github.actor == 'orbit-nckrtl[bot]') && secrets.SWAMP_SIGNIN_TOKEN || '' }}
  gateway-release:
    name: Gateway release inputs
    needs: changes
    if: needs.changes.outputs.gateway_release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo 'This commit has Orbit inputs and may release after Required checks pass.'

  required:
    name: Required checks
    if: always()
    needs: [php, gateway-static, gateway-tests, cli, cli-static, cli-tests, sdk-static, e2e-static, docs, api-reference, web, pi, agent, proof, gateway-release, changes, swamp]
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ vars.ORBIT_SLOW_CHECKS_BLOCKING != 'false' && vars.ORBIT_PROOF_BLOCKING != 'false' && needs.changes.outputs.proof_run == 'true' && 195 || 2 }}
    permissions:
      contents: read
      statuses: read
      actions: read
    steps:
      - name: Require builds, static checks and Gateway and CLI tests
        env:
          NEEDS: ${{ toJSON(needs) }}
          PROOF_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.proof_run == 'true' }}
          # Set the repository variable ORBIT_PROOF_BLOCKING to false to report the proof without blocking this result.
          PROOF_BLOCKING: ${{ vars.ORBIT_PROOF_BLOCKING != 'false' }}
          # Set the repository variable ORBIT_SLOW_CHECKS_BLOCKING to false to report proof without waiting for it.
          SLOW_CHECKS_BLOCKING: ${{ vars.ORBIT_SLOW_CHECKS_BLOCKING != 'false' }}
          CI_RUN_ID: ${{ github.run_id }}
          FORK_PROOF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PROOF_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROOF_RUN_URL_PREFIX: ${{ github.server_url }}/${{ github.repository }}/actions/runs/
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, sys, time
          needs = json.loads(os.environ['NEEDS'])
          if needs['changes']['result'] != 'success':
              sys.exit('Build input selection failed')
          selected = json.loads(needs['changes']['outputs']['jobs'])
          selected['proof-run'] = os.environ['PROOF_REQUIRED'] == 'true'
          selected['gateway-release'] = needs['changes']['outputs']['gateway_release'] == 'true'
          expected = (set(needs) - {'changes'}) | {'proof-run'}
          if set(selected) != expected or any(type(value) is not bool for value in selected.values()):
              sys.exit('Incomplete build selections')
          slow_blocking = os.environ['SLOW_CHECKS_BLOCKING'] == 'true'
          proof_blocking = slow_blocking and os.environ['PROOF_BLOCKING'] == 'true'
          pending = {}
          if proof_blocking and selected['proof-run'] and os.environ['FORK_PROOF'] != 'true':
              pending['CI proof'] = 'proof-run'
          needs['proof-run'] = {'result': 'skipped'}
          # Bound the API wait by the existing longest explicit job budget (CI proof: 195 minutes).
          deadline = time.monotonic() + 195 * 60
          while pending:
              pages = json.loads(subprocess.check_output([
                  'timeout', '60', 'gh', 'api', '--paginate', '--slurp',
                  f"repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['CI_RUN_ID']}/jobs?filter=all&per_page=100",
              ], timeout=65))
              # A rerun of this gate alone must retain successful jobs from earlier attempts.
              latest = {}
              for job in (job for page in pages for job in page['jobs']):
                  name = job['name']
                  previous = latest.get(name)
                  if previous is None or (job['run_attempt'], job['id']) > (previous['run_attempt'], previous['id']):
                      latest[name] = job
              for name, job in latest.items():
                  if name not in pending or job['status'] != 'completed':
                      continue
                  component = pending.pop(name)
                  result = job['conclusion']
                  if result != 'success' and not (not selected[component] and result == 'skipped'):
                      sys.exit(f'Required job failed: {name}: {result}')
                  needs[component]['result'] = 'success'
              if pending:
                  if time.monotonic() >= deadline:
                      sys.exit(f'Timed out waiting for required jobs: {list(pending)}')
                  print(f'Waiting for required jobs: {list(pending)}', flush=True)
                  time.sleep(15)
          if proof_blocking and selected['proof-run'] and os.environ['FORK_PROOF'] == 'true':
              pages = json.loads(subprocess.check_output([
                  'timeout', '60', 'gh', 'api', '--paginate', '--slurp',
                  f"repos/{os.environ['GH_REPO']}/commits/{os.environ['PROOF_SHA']}/statuses?per_page=100",
              ], timeout=65))
              status = next((status for page in pages for status in page
                             if status['context'] == 'Orbit outside proof'
                             and status.get('creator', {}).get('login') == 'github-actions[bot]'
                             and (status.get('target_url') or '').startswith(os.environ['PROOF_RUN_URL_PREFIX'])), None)
              if status is None or status['state'] != 'success':
                  sys.exit('The outside proof has not passed on this head. Approve and run it, then rerun Required checks.')
              needs['proof-run']['result'] = 'success'
          if not proof_blocking:
              selected['proof-run'] = False
              needs['proof-run']['result'] = 'skipped'
          failed = {job: needs[job]['result'] for job, touched in selected.items()
                    if needs[job]['result'] != 'success' and not (not touched and needs[job]['result'] == 'skipped')}
          if failed:
              sys.exit(f'Builds or static checks failed: {failed}')
          PYTHON

  cli-release:
    name: Start the CLI release
    # Start after Required checks passes on main, independently of the slow-check policy.
    # The CI-completion trigger is safe: release runs serialize by commit and skip an existing complete release.
    # always() plus the explicit result: without a status function, GitHub's implicit success() also looks at Required's
    # own needs, so an unselected test job (skipped by its job-level if) would skip the release although Required passed.
    needs: required
    if: always() && needs.required.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch Orbit CLI Release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run orbit-cli-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f commit="$GITHUB_SHA"
