---
- name: Reconcile one recorded Tool without aborting other Tools
  timeout: 45
  block:
    - name: Forget the previous Tool's source preferences
      ansible.builtin.set_fact: { tool_pins: {} }
    - name: Validate the Tool and compile public argv
      ansible.builtin.command:
        argv: ["{{ converge_deno }}", run, --no-prompt, --allow-read, "{{ converge_tool_helper }}", plan]
        stdin: "{{ {'tool': tool, 'node_id': intent.node_id, 'user': intent.user} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: tool_plan
    - name: Hold the compiled Tool argv
      ansible.builtin.set_fact: { tool_argv: "{{ tool_plan.stdout | from_json }}" }
    - name: Read macOS compatibility for Homebrew
      when: tool.manager in ['brew', 'brew-cask'] and (tool.platform | default('linux')) == 'macos'
      ansible.builtin.command: { argv: "{{ tool_argv.os }}" }
      become: false
      changed_when: false
      register: tool_os
    # The preferences of this Tool's source from before candidate selection: the owned Tools of its plan, the Tools of the source
    # this run already installed, and this Tool, which a refusal or failure takes out again in the rescue below. Every other package
    # from the source's origins stays at priority 1 from the moment the source is published.
    - name: Compute the preferences of this Tool's source
      when: tool.manager == 'apt' and tool.repository is not none
      vars:
        tool_run_installed: >-
          {{ intent.tools | selectattr('manager', 'equalto', 'apt') | rejectattr('repository', 'none')
             | selectattr('id', 'in', tool_results | selectattr('status', 'equalto', 'installed') | map(attribute='id') | list)
             | selectattr('repository.name', 'equalto', tool.repository.name) | map(attribute='package') | list }}
      ansible.builtin.command:
        argv: ["{{ converge_deno }}", run, --no-prompt, --allow-read, "{{ converge_tool_helper }}", pins]
        stdin: "{{ {'tool': tool, 'node_id': intent.node_id, 'user': intent.user, 'installed': tool_run_installed} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: tool_pins
    - name: Reconcile a recorded apt repository
      when: tool.manager == 'apt' and tool.repository is not none
      ansible.builtin.include_tasks:
        file: node-converge-tool-repository.yml
        apply: { become: true, timeout: 45 }
    - name: Read the Tool manager version
      ansible.builtin.command: { argv: "{{ tool_argv.version }}" }
      become: "{{ tool.manager == 'apt' }}"
      changed_when: false
      register: tool_version
    - name: Read installed Tool state
      ansible.builtin.command: { argv: "{{ tool_argv.inventory }}" }
      become: "{{ tool.manager == 'apt' }}"
      register: tool_query
      changed_when: false
      failed_when: false
      timeout: 75
    - name: Compare observed state with the recorded constraint
      ansible.builtin.command:
        argv: ["{{ converge_deno }}", run, --no-prompt, --allow-read, "{{ converge_tool_helper }}", inspect]
        stdin: "{{ {'tool': tool, 'node_id': intent.node_id, 'user': intent.user, 'version': tool_version, 'query': tool_query} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: tool_inspection
    - name: Repair an absent or nonmatching Tool
      when: (tool_inspection.stdout | from_json).needs_write
      block:
        - name: Refresh applicable apt candidate metadata
          when: tool.manager == 'apt'
          ansible.builtin.command: { argv: "{{ tool_argv.refresh }}" }
          become: true
          timeout: 150
          changed_when: false
        - name: Refresh Linux cask metadata
          when: tool.manager == 'brew-cask' and (tool.platform | default('linux')) == 'linux'
          ansible.builtin.command: { argv: "{{ tool_argv.refresh }}" }
          become: false
          changed_when: false
          register: tool_refresh
          timeout: 150
        - name: Read the manager candidate
          ansible.builtin.command: { argv: "{{ tool_argv.candidate }}" }
          become: "{{ tool.manager == 'apt' }}"
          changed_when: false
          register: tool_candidate
          timeout: 120
        - name: Validate and pin the candidate before any package write
          ansible.builtin.command:
            argv: ["{{ converge_deno }}", run, --no-prompt, --allow-read, "{{ converge_tool_helper }}", candidate]
            stdin: >-
              {{ ({'tool': tool, 'node_id': intent.node_id, 'user': intent.user, 'version': tool_version,
              'query': tool_query, 'candidate': tool_candidate}
              | combine({'os': tool_os} if tool_os.rc is defined else {})
              | combine({'refresh': tool_refresh} if tool_refresh.rc is defined else {})) | to_json }}
          delegate_to: localhost
          become: false
          changed_when: false
          register: tool_write
        - name: Apply the validated Tool candidate
          ansible.builtin.command: { argv: "{{ (tool_write.stdout | from_json).write }}" }
          become: "{{ tool.manager == 'apt' }}"
          changed_when: true
          timeout: 900
    - name: Read the resulting Tool state
      ansible.builtin.command: { argv: "{{ tool_argv.inventory }}" }
      become: "{{ tool.manager == 'apt' }}"
      register: tool_after
      changed_when: false
      failed_when: false
      timeout: 75
    - name: Verify the Tool postcondition
      ansible.builtin.command:
        argv: ["{{ converge_deno }}", run, --no-prompt, --allow-read, "{{ converge_tool_helper }}", verify]
        stdin: "{{ {'tool': tool, 'node_id': intent.node_id, 'user': intent.user, 'version': tool_version, 'query': tool_after} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: tool_verified
    - name: Record only the bounded successful observation
      ansible.builtin.set_fact:
        tool_results: "{{ tool_results + [{'id': tool.id, 'status': 'installed', 'installed_version': (tool_verified.stdout | from_json).installed_version}] }}"
  rescue:
    - name: Restore the source preferences without this unacquired Tool
      when: tool.manager == 'apt' and tool.repository is not none and (tool_pins.stdout | default('')) != ''
      ansible.builtin.copy:
        dest: "/etc/apt/preferences.d/orbit-{{ tool.repository.name }}.pref"
        content: "{{ (tool_pins.stdout | from_json).repository_preferences_restore }}"
        owner: root
        group: root
        mode: "0644"
      become: true
    - name: Record this Tool failure and continue the loop
      ansible.builtin.set_fact:
        tool_results: "{{ tool_results + [{'id': tool.id, 'status': 'failed', 'installed_version': none}] }}"
- name: Checkpoint completed Tool observations
  ansible.builtin.copy:
    dest: "{{ orbit_run }}/tools-result.json"
    content: "{{ tool_results | to_json }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
