        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed_step: teardown
  dependsOn:
  - job: teardown
    condition:
      type: failed
- name: failure_verify_sources
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: failure_verify_sources
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-destroy'
      behaviorName: ${{ "instance-destroy-" + run.id }}
