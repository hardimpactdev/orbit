id: b1a5e413-5c52-4d05-966b-f78d57c2da06
name: operation-route-update
description: One admitted Route parent with exact Node effects and native recovery.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.update
  required:
  - operation_id
  - node_id
  - kind
  additionalProperties: false
jobs:
- name: admission
  steps:
  - name: admit
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-convergence'
      behaviorName: ${{ "route-convergence-node-" + string(inputs.node_id) }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    writes: true
  dependsOn: []
- name: store-update
  steps:
  - name: store-web-root
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-convergence'
      behaviorName: ${{ "route-convergence-node-" + string(inputs.node_id) }}
      methodName: checkpoint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        checkpoint: web-root-stored
    guard: ${{ !(data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "web_root") }}
    writes: true
  - name: store-publication
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-convergence'
      behaviorName: ${{ "route-convergence-node-" + string(inputs.node_id) }}
      methodName: checkpoint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        checkpoint: publication-stored
    guard: ${{ !(data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "publication") }}
    writes: true
  dependsOn:
  - job: admission
    condition: &id001
      type: or
      conditions:
      - type: succeeded
      - type: skipped
- name: certificate-requests
  steps:
  - name: certificate-request
    target: ${{ "orbit-node-" + string(self.node) }}
    labels:
      node: ${{ string(self.node) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificate-node-" + string(self.node) }}
      methodName: requestAll
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.node }}
        leaves: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.certificates.filter(leaf,
          leaf.node_id == self.node) }}
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "publication" }}
    forEach:
      item: node
      in: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.node_ids
        }}
    writes: true
  dependsOn:
  - job: admission
    condition: *id001
  - job: store-update
    condition: *id001
- name: certificate-signatures
  steps:
  - name: certificate-sign-http-input
    target: orbit-node-209
    labels:
      node: '209'
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" +
      run.id).attributes.intent.mode == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id),
      "admission-" + run.id).attributes.intent.mode == "publication" }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: orbit-certificate-signing
      methodName: prepareSignBatch
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        requests: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.node_ids.map(node,
          data.latest("certificate-node-" + string(node), "requests-" + run.id).attributes.requests) }}
        leaves: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.certificates
          }}
  - name: certificate-sign-http
    target: orbit-node-209
    labels:
      node: '209'
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" +
      run.id).attributes.intent.mode == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id),
      "admission-" + run.id).attributes.intent.mode == "publication" }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: orbit-certificate-signing-http
      methodName: execute
      inputs:
        run: |
          #!/bin/sh
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import re
          import ssl
          import sys
          import urllib.request


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          try:
              operation = os.environ["ORBIT_CERTIFICATE_OPERATION_ID"]
              run_id = os.environ["ORBIT_CERTIFICATE_RUN_ID"]
              if not re.fullmatch(r"[1-9][0-9]*", operation):
                  raise ValueError("Invalid operation")
              raw = json.loads(os.environ["ORBIT_CERTIFICATE_REQUESTS"])
              if os.environ["ORBIT_CERTIFICATE_MODE"] == "single":
                  leaf = json.loads(os.environ["ORBIT_CERTIFICATE_LEAF"])
                  raw = [dict(node_id=leaf["node_id"], scope=leaf["scope"], **raw)]
              else:
                  raw = [record for batch in raw for record in batch]
              if len(raw) > 256:
                  raise ValueError("Too many requests")
              requests = [record for record in raw if record.get("state") == "request"]
              if not requests:
                  print(json.dumps({"certificates": []}))
                  sys.exit(0)
              body = {"run_id": run_id, "requests": requests}
              if os.environ.get("ORBIT_CERTIFICATE_RESTORING") == "true":
                  body["restoring"] = True
              payload = json.dumps(body).encode()
              url = (
                  "https://gateway.orbit/api/v1/direct-operations/"
                  + operation
                  + "/certificates/sign"
              )
              request = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              context = ssl.create_default_context(
                  cafile="/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"
              )
              opener = urllib.request.build_opener(
                  NoRedirect(), urllib.request.HTTPSHandler(context=context)
              )
              with opener.open(request, timeout=60) as response:
                  raw_response = response.read(16_777_217)
                  if len(raw_response) > 16_777_216 or response.status != 200:
                      raise ValueError("Invalid signing response")
              result = json.loads(raw_response)["data"]
              print(json.dumps(result))
          except Exception:
              print(json.dumps({"error_code": "app-dev.certificate_sign_failed"}))
              sys.exit(1)
          PYTHON
        env:
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ run.id }}
          ORBIT_CERTIFICATE_MODE: batch
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["certificate-sign-http-input"].outputs.requests_json }}
    dependsOn:
    - step: certificate-sign-http-input
      condition:
        type: succeeded
  - name: certificate-sign
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: orbit-certificate-signing
      methodName: signBatch
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        requests: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.node_ids.map(node,
          data.latest("certificate-node-" + string(node), "requests-" + run.id).attributes.requests) }}
        leaves: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.certificates
          }}
        native_stdout: ${{ steps["certificate-sign-http"].outputs.stdout }}
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" +
      run.id).attributes.intent.mode == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id),
      "admission-" + run.id).attributes.intent.mode == "publication" }}
    writes: true
    dependsOn:
    - step: certificate-sign-http
      condition:
        type: succeeded
  dependsOn:
  - job: admission
    condition: *id001
  - job: store-update
    condition: *id001
  - job: certificate-requests
    condition: *id001
- name: certificates
  steps:
  - name: certificate-publish
    target: ${{ "orbit-node-" + string(self.node) }}
    labels:
      node: ${{ string(self.node) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificate-node-" + string(self.node) }}
      methodName: publishAll
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.node }}
        leaves: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.certificates.filter(leaf,
          leaf.node_id == self.node) }}
        requests: ${{ data.latest("certificate-node-" + string(self.node), "requests-" + run.id).attributes.requests
          }}
        signed: ${{ data.latest("orbit-certificate-signing", "signed-" + run.id).attributes.certificates }}
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "publication" }}
    forEach:
      item: node
      in: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.node_ids
        }}
    writes: true
  dependsOn:
  - job: admission
    condition: *id001
  - job: store-update
    condition: *id001
  - job: certificate-requests
    condition: *id001
  - job: certificate-signatures
    condition: *id001
- name: web-roots
  steps:
  - name: prepare-web-roots
    target: ${{ "orbit-node-" + string(self.node) }}
    labels:
      node: ${{ string(self.node) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-convergence'
      behaviorName: ${{ "route-convergence-node-" + string(self.node) }}
      methodName: prepareWebRoots
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.node }}
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "publication" || !data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.production
      || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.web_root
      == null }}
    forEach:
      item: node
      in: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.workload_node_ids
        }}
    writes: true
  dependsOn:
  - job: admission
    condition: *id001
  - job: store-update
    condition: *id001
  - job: certificate-requests
    condition: *id001
  - job: certificate-signatures
    condition: *id001
  - job: certificates
    condition: *id001
