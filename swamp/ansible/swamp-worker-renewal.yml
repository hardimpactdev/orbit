---
- name: Renew persistent Swamp workers one at a time
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    renewal_credential_owner: root
    renewal_credential_group: "{{ orbit_user }}"
    renewal_credentials_dir: /etc/orbit/swamp-role-worker/c
    renewal_swamp_binary: /usr/local/bin/swamp
    renewal_accepting: [idle, busy]
    renewal_session_seconds: 28800
    renewal_drain_seconds: 4500
    renewal_margin_seconds: 300
    renewal_round_seconds: 10800
    renewal_name: "{{ renewal_names[renewal_slot] }}"
    renewal_peer_name: "{{ renewal_names[renewal_peer] }}"
    renewal_overlap_name: "swamp-role-{{ orbit_node_id }}-c"
  tasks:
    - name: Find the worker account home
      ansible.builtin.getent:
        database: passwd
        key: "{{ orbit_user }}"
    - name: Set the official CLI environment
      ansible.builtin.set_fact:
        renewal_home: "{{ ansible_facts.getent_passwd[orbit_user][4] }}"
    - name: Use the existing worker account credentials
      ansible.builtin.set_fact:
        renewal_remote:
          - --server
          - http://127.0.0.1:9418
          - --token-file
          - "{{ renewal_home }}/.config/swamp/serve-driver-token"
          - --json
        renewal_environment:
          HOME: "{{ renewal_home }}"
          SWAMP_HOME: "{{ renewal_home }}/.swamp"
          SWAMP_CONFIG_DIR: "{{ renewal_home }}/.config/swamp"
          SWAMP_API_KEY_FILE: "{{ renewal_home }}/.config/swamp/api-key"
          SWAMP_NO_UPDATE_CHECK: '1'
          SWAMP_NO_TELEMETRY: '1'
    # Swamp names the worker from its enrollment token. Bootstrap, remint and
    # existing swamp Nodes use different token names. Read each unit's own receipt.
    - name: Read the latest enrollment receipt of each worker unit
      ansible.builtin.command:
        argv:
          - timeout
          - '10'
          - journalctl
          - "--unit=orbit-swamp-worker@{{ item }}.service"
          - '--grep=Enrolled as '
          - --lines=1
          - --output=cat
          - --no-pager
          - --quiet
      loop: [a, b]
      register: renewal_receipts
      changed_when: false
      # Report read failures through the public assertion below, without raw journal output.
      failed_when: false
      no_log: true
    - name: Resolve the real pool names from the enrollment receipts
      ansible.builtin.set_fact:
        renewal_names: >-
          {{ renewal_names | default({}) | combine({item.item:
            (item.stdout | default('') | regex_replace('\x1b\[[0-9;]*m', '')
            | regex_findall('Enrolled as "?([^"\s]+)"?') | first | default(''))
            if item.rc | default(-1) in [0, 1] else ''}) }}
      loop: "{{ renewal_receipts.results }}"
      loop_control: {label: "{{ item.item }}"}
    - name: Require two distinct enrollment names before maintenance
      ansible.builtin.assert:
        that:
          - renewal_names.a | length > 0
          - renewal_names.b | length > 0
          - renewal_names.a != renewal_names.b
        fail_msg: >-
          Worker renewal stopped: cannot resolve both unit names from enrollment journals.
          The eight-hour session cap can still abort active dispatches.
          No worker was drained; retry in five minutes
    - name: Name the role-owned overlap enrollment
      ansible.builtin.set_fact:
        renewal_names: "{{ renewal_names | combine({'c': renewal_overlap_name}) }}"
        renewal_completed: false
    - name: Finish retiring overlap from a previously completed round first
      ansible.builtin.import_tasks: tasks/swamp-worker-retire-overlap.yml
      vars: {renewal_retire_if_ready: true}
    - name: Renew at most one base worker with replacement capacity
      ansible.builtin.include_tasks: tasks/swamp-worker-renew-slot.yml
      loop:
        - {slot: a, peer: b}
        - {slot: b, peer: a}
      loop_control: {loop_var: renewal_pair, label: "{{ renewal_pair.slot }}"}
      vars:
        renewal_slot: "{{ renewal_pair.slot }}"
        renewal_peer: "{{ renewal_pair.peer }}"
      when: not renewal_completed
    - name: Retire any overlap left by a completed renewal
      ansible.builtin.import_tasks: tasks/swamp-worker-retire-overlap.yml
