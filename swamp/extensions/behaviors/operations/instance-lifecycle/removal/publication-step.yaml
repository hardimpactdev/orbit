# Native alternatives for public and credentialed Git publication checks.
jobs:
- name: check_publication
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: capture_sources
    condition:
      type: succeeded
  steps:
  - name: published-public-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.members }}
    guard: ${{ !self.member.publication_required || has(inputs.execution_secrets.git_read) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-public-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: /usr/bin/python3 "${{ steps["public-inputs"].outputs.scripts.check_publication }}"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
  - name: published-private-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.members }}
    guard: ${{ !self.member.publication_required || !has(inputs.execution_secrets.git_read) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-private-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: /usr/bin/python3 "${{ steps["public-inputs"].outputs.scripts.check_publication }}"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
          ORBIT_GIT_READ: ${{ vault.get(inputs.execution_secrets.git_read.vault, inputs.execution_secrets.git_read.key) }}
