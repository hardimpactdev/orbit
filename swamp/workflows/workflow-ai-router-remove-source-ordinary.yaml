id: cab079f0-614c-4a99-85db-b639f3721449
name: ai-router-remove-source-ordinary
description: Remove fixed collector source on an ordinary Node; proxy Nodes are schema-excluded.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_.-]+$
    intent:
      type: object
      properties:
        target_node_id:
          type: integer
          minimum: 1
          not:
            enum:
            - 1
            - 18
        retired:
          type: boolean
      required:
      - target_node_id
      - retired
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: source
  steps:
  - name: ordinary-target
    target: ${{ "orbit-node-" + string(inputs.intent.target_node_id) }}
    labels:
      node: ${{ string(inputs.intent.target_node_id) }}
    task:
      type: assert
      expr: inputs.intent.target_node_id != 1 && inputs.intent.target_node_id != 18
      message: ai_router.ordinary_source_target_required
      severity: high
  - name: input
    target: ${{ "orbit-node-" + string(inputs.intent.target_node_id) }}
    labels:
      node: ${{ string(inputs.intent.target_node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/ai-router-source-input'
      behaviorName: ${{ "ai-router-source-input-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        retired: ${{ inputs.intent.retired }}
    dependsOn:
    - step: ordinary-target
      condition:
        type: succeeded
  - name: remove
    dependsOn:
    - step: input
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(inputs.intent.target_node_id) }}
    labels:
      node: ${{ string(inputs.intent.target_node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ai-router-source-remove-" + string(inputs.intent.target_node_id)
        }}
      methodName: execute
      inputs:
        run: 'set -eu

          sudo -n --preserve-env=ORBIT_AI_SOURCE_INTENT -- /usr/bin/python3 -I "$ORBIT_AI_SOURCE_SCRIPT"

          '
        env:
          ORBIT_AI_SOURCE_SCRIPT: ${{ steps.input.outputs.script }}
          ORBIT_AI_SOURCE_INTENT: ${{ steps.input.outputs.intent_json }}
