---
# The converge of the nested Nodes in `fleet_converge_nodes` for the refresh (instance-fleet-refresh.yml), through the nested Gateway's
# API as the operator. Each row names its Node (`id`, `name`), its request `body` (`{"base":false}` for the default scope,
# `{"base":true}` for the base, docs/reference/development-containers.md#instance-host-in-the-fleet) and its bound `seconds`. Every
# Node in the list is admitted first, so their converges run side by side; then one read of all admitted Operations every
# `fleet_ready_delay` seconds, at most the largest `seconds`, waits until every one has ended, so no run is still going when a failure
# fails the refresh and the run restores the old seed. The refresh fails when a Node's admission was refused or its converge did not
# succeed, and names each such Node; a Node that failed records no phases. The task VM refresh does the same with
# `node:converge <id> --base` (task-vm-fleet-base-node.yml). The count of tasks each converge changed (`result.changed`) adds to
# `fleet_converge_changed`, and a Node with a change joins `fleet_converge_changed_roles`; a result without a count counts as a change.
- name: Admit the converge of each due nested Node
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '90'] + fleet_curl + ['--fail', '-X', 'POST', fleet_api ~ '/nodes/' ~ item.id ~ '/converge',
          '-H', 'Content-Type: application/json', '-d', item.body] }}
  loop: "{{ fleet_converge_nodes }}"
  loop_control: { label: "{{ item.name }}" }
  register: fleet_converge
  changed_when: true
  # A refused admission fails the refresh only after the admitted converges have ended (the check below).
  failed_when: false
- name: Name the admitted converges
  ansible.builtin.set_fact:
    fleet_converge_admitted: >-
      {{ fleet_converge.results | selectattr('rc', 'eq', 0) | map(attribute='item.name')
         | zip(fleet_converge.results | selectattr('rc', 'eq', 0) | map(attribute='stdout') | map('from_json') | map(attribute='data.id'))
         | list }}
# One read names every admitted Operation. curl writes each body on a line of its own, in the order of the URLs, and that transfer's
# own exit code on the next line: curl's exit code is only the last transfer's. A read counts only when every transfer exited 0 with
# a JSON object; any other read, a dropped or cut first response too, is polled again and never parsed.
- name: Wait for the converges of the due nested Nodes
  when: fleet_converge_admitted | length > 0
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '90'] + fleet_curl + ['--fail', '-w', '\n%{exitcode}\n']
         + (fleet_converge_admitted | map(attribute='1') | map('regex_replace', '^', fleet_api ~ '/operations/') | list) }}
  register: fleet_converge_wait
  changed_when: false
  failed_when: false
  vars: &fleet_converge_poll
    fleet_converge_lines: "{{ fleet_converge_wait.stdout_lines | default([]) }}"
    fleet_converge_whole: >-
      {{ fleet_converge_lines | length == 2 * fleet_converge_admitted | length
         and fleet_converge_lines[1::2] | reject('equalto', '0') | list | length == 0
         and fleet_converge_lines[0::2] | reject('match', '^\{.*\}$') | list | length == 0 }}
    fleet_converge_read: "{{ fleet_converge_lines[0::2] | map('from_json') | map(attribute='data') | list if fleet_converge_whole | bool else [] }}"
  until: >-
    fleet_converge_whole | bool
    and fleet_converge_read | map(attribute='status') | difference(['succeeded', 'failed', 'cancelled', 'interrupted']) | length == 0
  retries: "{{ ((fleet_converge_nodes | map(attribute='seconds') | map('int') | max) / 5) | int }}"
  delay: "{{ fleet_ready_delay }}"
- name: Read the converges of the nested Nodes
  vars: *fleet_converge_poll
  ansible.builtin.set_fact:
    # One row per admitted Node: its name, its Operation and the Operation as last read; a last read that was not whole reads none.
    fleet_converge_ops: >-
      {%- set rows = [] -%}
      {%- for admitted in fleet_converge_admitted -%}
      {%- set _ = rows.append({'name': admitted[0], 'id': admitted[1],
            'data': fleet_converge_read[loop.index0] if fleet_converge_read | length == fleet_converge_admitted | length else {}}) -%}
      {%- endfor -%}
      {{ rows }}
- name: Check the converges of the nested Nodes
  vars:
    fleet_converge_refused: "{{ fleet_converge.results | rejectattr('rc', 'eq', 0) | list }}"
    fleet_converge_failed: "{{ fleet_converge_ops | rejectattr('data.status', 'defined') | list
      + (fleet_converge_ops | selectattr('data.status', 'defined') | rejectattr('data.status', 'eq', 'succeeded') | list) }}"
  ansible.builtin.assert:
    that: fleet_converge_refused | length == 0 and fleet_converge_failed | length == 0
    fail_msg: >-
      The converge of the nested fleet failed. {% for row in fleet_converge_refused %}The nested Gateway did not admit the converge of {{ row.item.name }}:
      {{ row.stderr | default('') | trim | truncate(300) }}. {% endfor %}{% for row in fleet_converge_failed %}The converge of the
      nested Node {{ row.name }} (Operation {{ row.id }}) ended {{ row.data.status | default('with no status') }}{{ (' with '
      ~ row.data.error_code) if row.data.error_code | default(none) else '' }}. {% endfor %}
    quiet: true
- name: Count the tasks the converges changed
  vars:
    fleet_operation_changed: "{{ (item.data.result | default({}, true)).changed | default(none) }}"
    fleet_operation_phases: "{{ (item.data.result | default({}, true)).phases | default(none) }}"
  ansible.builtin.set_fact:
    # The skippable phases the converge ran: those whose phase digest moved, by the Node's one skip rule. `input` and `check` always run.
    fleet_converge_phases: >-
      {{ fleet_converge_phases | default({}) | combine({item.name: fleet_operation_phases | rejectattr('status', 'eq', 'unchanged')
         | map(attribute='name') | reject('in', ['input', 'check']) | list} if fleet_operation_phases is iterable and fleet_operation_phases is not string
         and fleet_operation_phases is not mapping else {}) }}
    fleet_converge_changed: "{{ fleet_converge_changed | int + (fleet_operation_changed | int if fleet_operation_changed is number else 1) }}"
    # The Nodes whose disk the converge changed: their `base` is retaken, with the nested Gateway's.
    fleet_converge_changed_roles: >-
      {{ fleet_converge_changed_roles + ([item.name] if fleet_operation_changed is not number or fleet_operation_changed | int > 0 else []) }}
  loop: "{{ fleet_converge_ops }}"
  loop_control: { label: "{{ item.name }}" }
