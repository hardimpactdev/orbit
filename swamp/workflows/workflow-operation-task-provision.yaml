id: 11b8ed3f-1814-4165-80c9-8af59fe94c22
name: operation-task-provision
description: Compose canonical VM provision, source checkout and ordered setup from full inputs on209;
  no guest worker or Gateway step callbacks.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: tasks.provision}
    intent:
      type: object
    converge:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models|provider-bootstrap)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token|agent-secret-node-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: provision
  labels: {role: swamp}
  steps:
  - name: Create and prepare the VM
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provision
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: Set up the workspace
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-workspace-source
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        vm: ${{ steps["Create and prepare the VM"].outputs.result }}
    dependsOn:
    - step: Create and prepare the VM
      condition:
        type: succeeded
  - name: Pin the converge
    labels: {role: swamp}
    # Stage 2, "Converge once": the task VM role phases on the outer VM (the NFS export of the checkout to the nested network, Incus with the seed pool); a VM at the pins reports no change.
    guard: '${{ !has(inputs.converge) }}'
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: tp-data-pin-converge
      methodName: pin
      inputs:
        receipt: ${{ steps["Create and prepare the VM"].outputs.result }}
        guest_node_id: ${{ inputs.intent.guest_node_id }}
        # The inputs of a skipped step are still evaluated, so a provision without a nested topology (no converge input) needs a value here.
        intents: '${{ {"converge": has(inputs.converge) ? inputs.converge : {} } }}'
    dependsOn:
    - step: Set up the workspace
      condition:
        type: succeeded
  - name: Converge once
    labels: {role: swamp}
    writes: true
    guard: '${{ !has(inputs.converge) }}'
    task:
      type: workflow
      workflowIdOrName: operation-task-vm-converge
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.intent.guest_node_id }}
        kind: task_vm.converge
        intent: '${{ has(inputs.converge) ? steps["Pin the converge"].outputs.converge : {} }}'
        execution_secrets: '${{ {} }}'
    dependsOn:
    - step: Pin the converge
      condition:
        type: succeeded
  - name: Start the nested fleet
    labels: {role: swamp}
    writes: true
    guard: '${{ inputs.intent.create == null || !inputs.intent.create.topology }}'
    task:
      type: workflow
      workflowIdOrName: task-nested-fleet
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        vm: ${{ steps["Create and prepare the VM"].outputs.result }}
    dependsOn:
    - step: Set up the workspace
      condition:
        type: succeeded
    - step: Converge once
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    # The Gateway left the guest's SSH targets unpinned; the VM step just pinned its key.
  - name: Bind the workspace keys
    labels: {role: swamp}
    guard: '${{ inputs.intent.route == null && size(inputs.intent.processes) == 0 }}'
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-bind" }}'
      methodName: bind
      inputs:
        vm: ${{ steps["Create and prepare the VM"].outputs.result }}
        guest_node_id: ${{ inputs.intent.guest_node_id }}
        route: ${{ inputs.intent.route }}
        processes: ${{ inputs.intent.processes }}
    dependsOn:
    - step: Set up the workspace
      condition:
        type: succeeded
  - name: Route the workspace
    labels: {role: swamp}
    writes: true
    guard: '${{ inputs.intent.route == null }}'
    task:
      type: workflow
      workflowIdOrName: operation-route-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        parent_run_id: ${{ run.id }}
        kind: route.create
        intent: ${{ steps["Bind the workspace keys"].outputs.route }}
        execution_secrets: ${{ inputs.intent.route_secrets }}
    dependsOn:
    - step: Bind the workspace keys
      condition:
        type: succeeded
  - name: Create, start Processes
    labels: {role: swamp}
    writes: true
    forEach:
      item: member
      in: ${{ inputs.intent.processes }}
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.create
        intent: ${{ steps["Bind the workspace keys"].outputs.processes[self._index].intent }}
        execution_secrets: '${{ "member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["member_" + string(self.member.id)]} : {} }}'
    dependsOn:
    - step: Bind the workspace keys
      condition:
        type: succeeded
    - step: Route the workspace
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
  - name: Check the workspace
    labels: {role: swamp}
    # Prints the whole receipt, workspace Route and Processes included; `accepted` fails the run on its error code.
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-result" }}'
      methodName: execute
      inputs:
        run: |
          python3 -c '
          import json, os
          result = json.loads(os.environ["ORBIT_RESULT"])
          route, processes = os.environ["ORBIT_ROUTE"], [p for p in os.environ["ORBIT_PROCESSES"].split(";") if p]
          result["route"], result["processes"] = route, processes
          result["nested_fleet"] = json.loads(os.environ["ORBIT_FLEET"]).get("nested_fleet", "none")
          failed = "bind" if os.environ["ORBIT_BIND"] == "failed" else "route" if route == "failed" else "processes" if any(p.endswith("=failed") for p in processes) else None
          if failed and "error_code" not in result:
              result.update(error_code="tasks.provision_failed", failed_step=failed)
          print(json.dumps(result))'
        env:
          ORBIT_FLEET: '${{ "Start the nested fleet" in steps && "outputs" in steps["Start the nested fleet"] && "result" in steps["Start the nested fleet"].outputs ? steps["Start the nested fleet"].outputs.result.stdout : "{}" }}'
          ORBIT_BIND: '${{ "Bind the workspace keys" in steps ? steps["Bind the workspace keys"].status : "skipped" }}'
          ORBIT_ROUTE: '${{ "Route the workspace" in steps ? steps["Route the workspace"].status : "skipped" }}'
          ORBIT_PROCESSES: '${{ steps.filter(k, k.startsWith("Create, start Processes-")).map(k, k + "=" + steps[k].status).join(";") }}'
          ORBIT_RESULT: '${{ "Set up the workspace" in steps && "outputs" in steps["Set up the workspace"] && "result" in steps["Set up the workspace"].outputs ? steps["Set up the workspace"].outputs.result.result_json : "{\"error_code\":\"tasks.provision_failed\",\"failed_step\":\"vm\"}" }}'
    dependsOn:
    - step: Create and prepare the VM
      condition:
        type: always
    - step: Set up the workspace
      condition:
        type: always
    - step: Bind the workspace keys
      condition:
        type: always
    - step: Route the workspace
      condition:
        type: always
    - step: Create, start Processes
      condition:
        type: always
    - step: Start the nested fleet
      condition:
        type: always
  - name: Accept the workspace
    labels: {role: swamp}
    task: {type: assert, expr: '!steps["Check the workspace"].outputs.stdout.contains("\"error_code\"")', severity: high, message: tasks.provision_failed}
    dependsOn:
    - step: Check the workspace
      condition:
        type: succeeded
