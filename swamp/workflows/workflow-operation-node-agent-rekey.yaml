id: 8ae4fb17-d77a-4fb3-8ecb-cf6f5384e65e
name: operation-node-agent-rekey
description: Write a new Node agent key with official cfgmgmt from 209, restart the agent and prove the key.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [node.agent_rekey]}
    intent: {type: object}
    execution_secrets:
      type: object
      properties:
        agent_key:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^node-agent-rekey-[1-9][0-9]*-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [agent_key]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: rekey
  labels: {role: swamp}
  steps:
    # The key from the vault, root:root 0600; the Gateway keeps the old verifier until the end check passes.
  - name: 'Write the new agent key'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-rekey-key-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: /etc/orbit/agent/secret, ensure: present, content: '${{ vault.get(inputs.execution_secrets.agent_key.vault, inputs.execution_secrets.agent_key.key) }}',
        owner: root, group: root, mode: '0600', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # The agent reads its key only when it starts.
  - name: 'Restart the Node agent'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Write the new agent key', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-rekey-agent-" + string(inputs.node_id) }}
      methodName: restart
      globalArgs: {service: orbit-agent.service, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Check the Node agent'
    labels: {role: swamp}
    dependsOn: [{step: 'Restart the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-rekey-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "node-rekey-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/bin/systemctl, is-active, orbit-agent.service]
        timeoutSec: 40
  - name: 'Check the new key'
    labels: {role: swamp}
    dependsOn: [{step: 'Check the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-rekey-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "node-rekey-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/bin/sha256sum, /etc/orbit/agent/secret]
        timeoutSec: 40
  - name: 'Prove the new key'
    labels: {role: swamp}
    dependsOn: [{step: 'Check the new key', condition: {type: succeeded}}]
    task: {type: assert, severity: high, message: The agent key on the Node is not the new key.,
      expr: 'steps["Check the new key"].outputs.stdout in [inputs.intent.verifier_hash + "  /etc/orbit/agent/secret", inputs.intent.verifier_hash + "  /etc/orbit/agent/secret\n"]'}
