id: 3d11d920-5ae2-4a1f-8d47-19bddfe0ccbe
name: operation-task-vm-destroy
description: Owning TaskVM destroy root; Gateway records only the complete terminal result.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.destroy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: destroy
  labels: {role: swamp}
  steps:
  - name: vm
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "vm-destroy-result-"+run.id }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' "$RESULT"

          '
        env:
          RESULT: ${{ steps.vm.outputs.result.result_json }}
    dependsOn:
    - step: vm
      condition:
        type: succeeded
