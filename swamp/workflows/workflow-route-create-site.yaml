id: eeaaf23d-8fd2-5f7e-92c5-5619f1752423
name: route-create-site
description: "route.create: one Node's certificate, web root, pools, site, awake marker and APP_URL as one Ansible phase, and its production environment file."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    # Existing admitted input may be reused read-only; the site child owns a separate scratch folder.
    admitted:
      type: object
      properties:
        path: {type: string}
        assets: {type: string}
        field: {type: string, enum: ['', route]}
      required: [path, assets, field]
      additionalProperties: false
    intent: {type: object}
    node_id: {type: integer, minimum: 1}
    signed: {type: array, items: {type: string}}
    prepared: {type: string}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [intent, node_id, signed, execution_secrets]
  additionalProperties: false
jobs:
- name: create
  labels: {role: swamp}
  steps:
    # Input: the admitted intent and the shipped playbooks, as the run folder that the phase reads.
  - name: 'input'
    guard: '${{ has(inputs.admitted) && inputs.admitted.path != "" }}'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs:
        intent: '${{ inputs.intent }}'
        path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
    # Site: the account, the Caddy access ACLs, links, PHP-FPM pools (written, tested, reloaded), the signed certificate and its
    # account copy, the trust store, the Caddyfile (written, validated, reloaded), the APP_URL lines and the awake markers of this Node.
  - name: 'site'
    labels: {role: swamp}
    dependsOn:
    - {step: 'input', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("route-site-" + string(inputs.node_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 170 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags site "$ORBIT_ANSIBLE/route-create-site.yml"
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
          ORBIT_ANSIBLE: '${{ has(inputs.admitted) && inputs.admitted.path != "" ? inputs.admitted.assets : steps.input.outputs.assets }}'
          ORBIT_INTENT_PATH: '${{ has(inputs.admitted) && inputs.admitted.path != "" ? inputs.admitted.path : "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
          ORBIT_INTENT_FIELD: '${{ has(inputs.admitted) && inputs.admitted.path != "" ? inputs.admitted.field : "" }}'
          ORBIT_NODE_ID: '${{ string(inputs.node_id) }}'
          ORBIT_SIGNED: '${{ inputs.signed.join("|||") }}'
          ANSIBLE_CONFIG: '${{ (has(inputs.admitted) && inputs.admitted.path != "" ? inputs.admitted.assets : steps.input.outputs.assets) + "/ansible.cfg" }}'
          ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
          ORBIT_PREPARED: '${{ has(inputs.prepared) ? inputs.prepared : "" }}'
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
    # A .env is group orbit-env, so the Node agent can report its key names.
  - name: 'environment-group'
    labels: {role: swamp}
    dependsOn: [{step: site, condition: {type: always}}]
    guard: '${{ steps.exists(k, steps[k].status == "failed") || size(inputs.intent.env_files.filter(e, string(e.node_id) == string(inputs.node_id))) == 0 }}'
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/group'
      behaviorName: '${{ ("route-env-group-" + string(inputs.node_id)).split(".").join("-") }}'
      methodName: apply
      globalArgs: {groupname: orbit-env, ensure: present, system: true, become: true,
        nodeHost: '${{ inputs.intent.nodes[string(inputs.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(inputs.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(inputs.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(inputs.node_id)].identity_file }}'}
      inputs: {}
    # Production: the whole rendered .env from the vault.
  - name: 'environment'
    labels: {role: swamp}
    dependsOn:
    - {step: site, condition: {type: always}}
    - {step: environment-group, condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: env, in: '${{ inputs.intent.env_files.filter(e, string(e.node_id) == string(inputs.node_id)) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("route-env-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ self.env.path }}', content: '${{ vault.get(inputs.execution_secrets[self.env.secret_field].vault, inputs.execution_secrets[self.env.secret_field].key) }}', owner: '${{ self.env.owner }}',
        group: orbit-env, mode: '0640', ensure: present,
        nodeHost: '${{ inputs.intent.nodes[string(inputs.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(inputs.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(inputs.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(inputs.node_id)].identity_file }}', become: true}
      inputs: {}
    # Cleanup: the run folder after a failure; a success removed it in the last task of the phase, so this step is skipped.
  - name: 'cleanup'
    labels: {role: swamp}
    dependsOn:
    - {step: 'input', condition: {type: always}}
    - {step: site, condition: {type: always}}
    - {step: environment-group, condition: {type: always}}
    - {step: environment, condition: {type: always}}
    guard: '${{ !steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("route-site-cleanup-" + string(inputs.node_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
