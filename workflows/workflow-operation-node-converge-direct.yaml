              : []) + (has(steps.tmpfiles) && has(steps.tmpfiles.outputs) ? [steps.tmpfiles.outputs] : []) + (has(steps.agent)
              && has(steps.agent.outputs) ? [steps.agent.outputs] : []) }}"
        guard: ${{ !has(steps.admit) || !has(steps.admit.outputs) }}
