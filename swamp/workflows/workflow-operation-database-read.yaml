id: 40402584-b11e-468f-b58e-0d7328a8e62c
name: operation-database-read
queueTimeout: 30
description: database:query and the catalog reads from 209, one client over official SSH; the Gateway builds its argv and shapes its output.
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database.read}
    # argv: docker exec into a Database server's container, or sqlite3 as the file's owner, on the ssh_execution host.
    # local: the client body and its arguments for a registered external database, read on 209 itself. One is empty.
    intent:
      type: object
      properties:
        argv: {type: array, items: {type: string}}
        local:
          type: object
          properties:
            client: {type: string}
            user: {type: string}
            database: {type: string}
            host: {type: string}
            port: {type: string}
            marker: {type: string}
          required: [client, user, database, host, port, marker]
          additionalProperties: false
        ssh_execution: {type: object}
      required: [argv, local, ssh_execution]
      additionalProperties: false
    # Names only: read is one whole value, the password line (none for SQLite) and the statements.
    execution_secrets:
      type: object
      properties:
        read:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^database-read-intent-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [read]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: read
  labels: {role: swamp}
  steps:
    # A read changes nothing: READ ONLY on MySQL and PostgreSQL, -readonly -safe on SQLite. The output stops at 64 KiB.
  - name: 'Run the read'
    labels: {role: swamp}
    guard: ${{ size(inputs.intent.argv) == 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-read-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "database-read-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: ${{ inputs.intent.argv }}
        stdin: ${{ vault.get(inputs.execution_secrets.read.vault, inputs.execution_secrets.read.key) }}
        timeoutSec: 40
    # A registered external database: the swamp role's mysql or psql client on 209, with the same bounds.
  - name: 'Run the read on 209'
    labels: {role: swamp}
    guard: ${{ inputs.intent.local.client == "" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "database-read-local" }}
      methodName: execute
      inputs:
        run: printf '%s' "$ORBIT_READ" | timeout 30 sh -c "$ORBIT_CLIENT" sh "$ORBIT_USER" "$ORBIT_DATABASE" "$ORBIT_HOST" "$ORBIT_PORT" "$ORBIT_NULL"
        env:
          ORBIT_READ: ${{ vault.get(inputs.execution_secrets.read.vault, inputs.execution_secrets.read.key) }}
          ORBIT_CLIENT: ${{ inputs.intent.local.client }}
          ORBIT_USER: ${{ inputs.intent.local.user }}
          ORBIT_DATABASE: ${{ inputs.intent.local.database }}
          ORBIT_HOST: ${{ inputs.intent.local.host }}
          ORBIT_PORT: ${{ inputs.intent.local.port }}
          ORBIT_NULL: ${{ inputs.intent.local.marker }}
