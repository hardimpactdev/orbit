id: 6def8239-b27a-5feb-961b-fd2b54515359
name: operation-database-sqlite-seed-abandon
description: Run database.sqlite_seed_abandon as one native placed DAG.
writes: true
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - database.sqlite_seed_abandon
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: read
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: abandon
  target: ${{ "orbit-node-" + string(data.latest("database-sqlite-" + run.id, "intent").attributes.target.node_id) }}
  labels:
    node: ${{ string(data.latest("database-sqlite-" + run.id, "intent").attributes.target.node_id) }}
  steps:
  - name: cleanupTarget
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: cleanupTarget
      inputs:
        target: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.target }}
        run_id: ${{ run.id }}
        selected_node_id: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.target.node_id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
- name: cleanup
  target: ${{ "orbit-node-" + string(data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id) }}
  labels:
    node: ${{ string(data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id) }}
  steps:
  - name: cleanupSource
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: cleanupSource
      inputs:
        source: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.source }}
        run_id: ${{ run.id }}
        selected_node_id: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  - job: abandon
    condition:
      type: always
- name: projection
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: project
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  - job: abandon
    condition:
      type: always
  - job: cleanup
    condition:
      type: always
