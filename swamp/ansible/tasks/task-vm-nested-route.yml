---
# The nested containers reach the internet (the Swamp Club, packages) through the task VM, which routes their bridge. Two settings of the
# VM decide whether it does, whatever starts first at boot:
# - the kernel forwards IPv4: Incus turns it on when it makes a bridge, and nothing may turn it off again;
# - Docker leaves the FORWARD policy alone: a Docker that turns forwarding on itself sets the policy to DROP, which drops the bridge's
#   traffic in every chain that hooks forwarding, also when UFW accepts it (`ip-forward-no-drop`, Docker 28 and later).
- name: Keep IPv4 forwarding on for the nested bridge
  when: intent.nested is not none
  ansible.builtin.copy: { dest: /etc/sysctl.d/60-orbit-nested.conf, content: "net.ipv4.ip_forward = 1\n", mode: "0644" }
- name: Turn IPv4 forwarding on now
  when: intent.nested is not none
  ansible.builtin.command: { argv: [sysctl, -w, net.ipv4.ip_forward=1] }
  changed_when: false
- name: Look for Docker
  when: intent.nested is not none
  ansible.builtin.stat: { path: /usr/bin/dockerd }
  register: nested_docker
- name: Read the Docker daemon settings
  when: intent.nested is not none and nested_docker.stat.exists
  ansible.builtin.slurp: { src: /etc/docker/daemon.json }
  register: nested_docker_settings
  failed_when: nested_docker_settings.failed and 'not found' not in (nested_docker_settings.msg | default(''))
- name: Keep Docker from dropping routed traffic
  when: intent.nested is not none and nested_docker.stat.exists
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ (nested_docker_settings.content | default('e30=', true) | b64decode | from_json) | combine({'ip-forward-no-drop': true}) | to_nice_json }}\n"
  register: nested_docker_config
- name: Restart Docker with the setting
  when: intent.nested is not none and nested_docker.stat.exists and nested_docker_config.changed
  ansible.builtin.systemd: { name: docker.service, state: restarted }
- name: Read the FORWARD chain that Docker uses
  when: intent.nested is not none
  ansible.builtin.command: { argv: [iptables, -S, FORWARD] }
  register: nested_forward
  changed_when: false
# A Docker that started before the setting left its DROP policy in a chain that UFW does not use; the setting keeps it from coming back.
- name: Undo the DROP policy that Docker set
  when:
    - intent.nested is not none and nested_docker.stat.exists
    - nested_forward.stdout is search('-P FORWARD DROP') and nested_forward.stdout is not search('ufw')
  ansible.builtin.command: { argv: [iptables, -P, FORWARD, ACCEPT] }
  changed_when: true
