id: 7b6f1d4e-2c3a-4e9b-9f1a-5d8c3e2b1a07
name: operation-instance-env-import
description: Copy one Instance's .env into Swamp's vault on 209, for the Gateway to read once; nothing changes on the Node.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: instance.env_import}
    intent:
      type: object
      properties:
        base: {type: string, pattern: '^/'}
        user: {type: string, pattern: '^[a-z_][a-z0-9_-]{0,31}$'}
        ssh_execution: {type: object}
      required: [base, user, ssh_execution]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: import
  labels: {role: swamp}
  steps:
    # A private copy owned by the SSH account; the file must be the account's regular file up to 1 MiB.
  - name: 'Stage .env for the copy'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-env-import-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ ("instance-env-import-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        timeoutSec: 40
        argv: [/usr/bin/sudo, -n, --, /usr/bin/timeout, '30', /bin/sh, -c, "p=\"$1/.env\"; o=\"$2\"; if [ ! -e \"$p\" ] && [ ! -L \"$p\" ]; then echo \"env.import_source_missing: $p does not exist\" >&2; exit 3; fi; [ -f \"$p\" ] && [ ! -L \"$p\" ] && [ \"$(stat -c %U -- \"$p\")\" = \"$4\" ] && [ \"$(stat -c %s -- \"$p\")\" -le 1048576 ] || { echo \"env.import_source_missing: $p is not a regular file of $4 up to 1 MiB\" >&2; exit 3; }; install -m 600 -o \"$3\" -- \"$p\" \"$o\"", sh, '${{ inputs.intent.base }}',
          '${{ "/tmp/orbit-env-import-" + run.id + "-node" }}', '${{ inputs.intent.ssh_execution.target.user }}', '${{ inputs.intent.user }}']
  - name: 'Copy .env to 209'
    labels: {role: swamp}
    dependsOn: [{step: 'Stage .env for the copy', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-env-import-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: copy
      globalArgs: *ssh
      inputs: {hosts: 'name:target', src: '${{ "/tmp/orbit-env-import-" + run.id + "-node" }}', dst: '${{ "/tmp/orbit-env-import-" + run.id }}', direction: from}
  - name: 'Remove the staged copy'
    labels: {role: swamp}
    dependsOn: [{step: 'Copy .env to 209', condition: {type: always}}]
    guard: '${{ !("Stage .env for the copy" in steps) || steps["Stage .env for the copy"].status != "succeeded" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-env-import-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *ssh
      inputs: {hosts: 'name:target', timeoutSec: 20, argv: [/usr/bin/rm, -f, --, '${{ "/tmp/orbit-env-import-" + run.id + "-node" }}']}
    # The end check: the bytes go to the vault as instance-env-import.content.<operation>; only size and sha256 come back.
  - name: 'Read .env into the vault'
    labels: {role: swamp}
    dependsOn: [{step: 'Copy .env to 209', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-env-import'
      behaviorName: ${{ "instance-env-import-store-" + string(inputs.node_id) }}
      methodName: store
      inputs: {path: '${{ "/tmp/orbit-env-import-" + run.id }}', operation: '${{ inputs.operation_id }}'}
