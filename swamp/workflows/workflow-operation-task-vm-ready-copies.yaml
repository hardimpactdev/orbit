        - agent
        - '--timeout'
        - '120'
        timeoutSec: 140
    dependsOn:
    - step: Start app-dev to check
      condition: {type: succeeded}
  - name: Wait for app-prod
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '130'
        - incus
        - wait
        - ready-check-app-prod
        - agent
        - '--timeout'
        - '120'
        timeoutSec: 140
    dependsOn:
    - step: Start app-prod to check
      condition: {type: succeeded}
  # The same scan as before the stop, on the stored copy: files the guest wrote while it stopped are searched too.
  - name: Search gateway for the Club key
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '900'
        - incus
        - exec
        - ready-check-gateway
        - '--'
        - sh
        - '-c'
        - grep -rlF --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run -f - /; echo scan-exit=$?
        stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}'
        timeoutSec: 910
    dependsOn:
    - step: Wait for gateway
      condition: {type: succeeded}
  # The copy holds no checkout: `rmdir` of an empty directory succeeds and fails on one that holds a file. The directory is the throwaway's.
  - name: Look for a checkout in gateway
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-gateway
        - '--'
        - rmdir
        - /home/orbit/orbit
        timeoutSec: 40
    dependsOn:
    - step: Wait for gateway
      condition: {type: succeeded}
  # The state stays on the guest's own disk; the mount step puts it over the shared checkout.
  - name: Look for the state of gateway
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-gateway
        - '--'
        - stat
        - '-c'
        - '%n'
        - /var/lib/orbit-checkout-state/apps/gateway/.env
        - /var/lib/orbit-checkout-state/apps/gateway/storage
        - /var/lib/orbit-checkout-state/apps/gateway/bootstrap/cache
        timeoutSec: 40
    dependsOn:
    - step: Wait for gateway
      condition: {type: succeeded}
  - name: Search app-dev for the Club key
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '900'
        - incus
        - exec
        - ready-check-app-dev
        - '--'
        - sh
        - '-c'
        - grep -rlF --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run -f - /; echo scan-exit=$?
        stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}'
        timeoutSec: 910
    dependsOn:
    - step: Wait for app-dev
      condition: {type: succeeded}
  - name: Look for a checkout in app-dev
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-app-dev
        - '--'
        - rmdir
        - /home/orbit/orbit
        timeoutSec: 40
    dependsOn:
    - step: Wait for app-dev
      condition: {type: succeeded}
  - name: Look for the state of app-dev
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-app-dev
        - '--'
        - stat
        - '-c'
        - '%n'
        - /var/lib/orbit-checkout-state/apps/gateway/.env
        - /var/lib/orbit-checkout-state/apps/gateway/storage
        - /var/lib/orbit-checkout-state/apps/gateway/bootstrap/cache
        timeoutSec: 40
    dependsOn:
    - step: Wait for app-dev
      condition: {type: succeeded}
  - name: Search app-prod for the Club key
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '900'
        - incus
        - exec
        - ready-check-app-prod
        - '--'
        - sh
        - '-c'
        - grep -rlF --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run -f - /; echo scan-exit=$?
        stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}'
        timeoutSec: 910
    dependsOn:
    - step: Wait for app-prod
      condition: {type: succeeded}
  # The Gateway database is the one its own `.env` names, the one the key step updated.
  - name: Read the database path
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-gateway
        - '--'
        - grep
        - '-m1'
        - ^DB_DATABASE=
        - /var/lib/orbit-checkout-state/apps/gateway/.env
        timeoutSec: 40
    dependsOn:
    - step: Wait for gateway
      condition: {type: succeeded}
  - name: Read the operator keys
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-gateway
        - '--'
        - sqlite3
        - '${{ steps["Read the database path"].outputs.stdout.split("\n")[0].split("=")[1] }}'
        - 'select count(*) from nodes where name = ''operator'' and wireguard_public_key is not null'
        timeoutSec: 40
    dependsOn:
    - step: Read the database path
      condition: {type: succeeded}
  # The hub has no peer of the operator: grep finds nothing and exits 1. The shell prints the status, as for the scans.
  - name: Look for the operator peer
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - incus
        - exec
        - ready-check-gateway
        - '--'
        - sh
        - '-c'
        - 'grep -rq ''10\.45\.0\.10/32'' /etc/wireguard; echo peer-exit=$?'
        timeoutSec: 40
    dependsOn:
    - step: Wait for gateway
      condition: {type: succeeded}
  - name: Read the gateway stateful setting
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - incus
        - config
        - get
        - fleet-ready-gateway
        - migration.stateful
        timeoutSec: 40
  - name: Read the gateway devices
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - incus
        - config
        - device
        - list
        - fleet-ready-gateway
        timeoutSec: 40
  - name: Read the app-dev stateful setting
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - incus
        - config
        - get
        - fleet-ready-app-dev
        - migration.stateful
        timeoutSec: 40
  - name: Read the app-dev devices
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - incus
        - config
        - device
        - list
        - fleet-ready-app-dev
        timeoutSec: 40
  - name: Read the app-prod stateful setting
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - incus
        - config
        - get
        - fleet-ready-app-prod
        - migration.stateful
        timeoutSec: 40
  - name: Read the app-prod devices
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - incus
        - config
        - device
        - list
        - fleet-ready-app-prod
        timeoutSec: 40
  dependsOn:
  - job: copy
    condition: {type: succeeded}
- name: cleanup
  labels: {role: swamp}
  steps:
  # Runs after success, failure and cancellation. A check copy that was never made is not an error.
  - name: Remove the gateway check copy
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '120'
        - incus
        - delete
        - '--force'
        - ready-check-gateway
        okExitCodes: any
        timeoutSec: 130
  - name: Remove the app-dev check copy
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '120'
        - incus
        - delete
        - '--force'
        - ready-check-app-dev
        okExitCodes: any
        timeoutSec: 130
  - name: Remove the app-prod check copy
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '120'
        - incus
        - delete
        - '--force'
        - ready-check-app-prod
        okExitCodes: any
        timeoutSec: 130
  dependsOn:
  - job: check
    condition: {type: completed}
- name: end
  labels: {role: swamp}
  steps:
  - name: Check the ready copies
    labels: {role: swamp}
    task:
      type: assert
      # The three copies are complete and self-contained: no operator key in the record or on the hub, no Club key before and after the stop,
      # stateful, and no NIC. The checkout and state checks fail their own steps.
      expr: 'steps["Read the operator keys"].outputs.stdout.split("\n")[0] == "0" && steps["Look for the operator peer"].outputs.stdout.startsWith("peer-exit=1") && steps["Scan gateway for the Club key"].outputs.stdout.startsWith("scan-exit=1") && steps["Search gateway for the Club key"].outputs.stdout.startsWith("scan-exit=1") && steps["Scan app-dev for the Club key"].outputs.stdout.startsWith("scan-exit=1") && steps["Search app-dev for the Club key"].outputs.stdout.startsWith("scan-exit=1") && steps["Scan app-prod for the Club key"].outputs.stdout.startsWith("scan-exit=1") && steps["Search app-prod for the Club key"].outputs.stdout.startsWith("scan-exit=1") && steps["Read the gateway stateful setting"].outputs.stdout.split("\n")[0] == "true" && !steps["Read the gateway devices"].outputs.stdout.contains("eth0") && steps["Read the app-dev stateful setting"].outputs.stdout.split("\n")[0] == "true" && !steps["Read the app-dev devices"].outputs.stdout.contains("eth0") && steps["Read the app-prod stateful setting"].outputs.stdout.split("\n")[0] == "true" && !steps["Read the app-prod devices"].outputs.stdout.contains("eth0")'
      severity: high
      message: The ready copies are not self-contained.
  dependsOn:
  - job: check
    condition: {type: succeeded}
  - job: cleanup
    condition: {type: succeeded}
