id: 626ebb3f-5bf4-4135-a00d-ecaab1218bd5
name: task-vm-upcloud-image-ansible
description: Run phases of the task VM role playbook on one UpCloud build server, reached from 209 straight to its public address with the host key the Gateway admitted.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.upcloud_image_build]}
    intent: {type: object}
    address: {type: string, minLength: 1}
    tags: {type: string, minLength: 1}
    with_pi: {type: boolean}
  required: [operation_id, node_id, kind, intent, address, tags, with_pi]
  additionalProperties: false
jobs:
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
    # Pi is an internal artifact on the Gateway host; the software phase copies it to the server when the server copy differs from the pin. A guard that is true skips the step.
  - name: Fetch the Pi server
    labels: {role: swamp}
    writes: true
    guard: ${{ !inputs.with_pi }}
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-upcloud-image-pi-" + string(inputs.node_id) }}
      methodName: copy
      globalArgs:
        name: ${{ "task-vm-upcloud-image-pi-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.pi.source.ssh.target.user }}
          port: ${{ inputs.intent.pi.source.ssh.target.port }}
          identityFile: ${{ inputs.intent.pi.source.ssh.identity_file }}
        hosts:
        - name: source
          address: ${{ inputs.intent.pi.source.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.pi.source.ssh.target.host_keys }}'}
      inputs:
        hosts: name:source
        src: ${{ inputs.intent.pi.source.path }}
        dst: ${{ "/tmp/orbit-ansible-" + run.id + "/pi-server" }}
        direction: from
        timeoutSec: 300
  - name: Check the Pi server
    labels: {role: swamp}
    writes: true
    guard: ${{ !inputs.with_pi }}
    dependsOn:
    - {step: Fetch the Pi server, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-upcloud-image-pi-check-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: printf '%s  %s\n' "$ORBIT_SHA" "$ORBIT_RUN/pi-server" | timeout 60 sha256sum -c --quiet
        env:
          ORBIT_SHA: ${{ inputs.intent.pi.sha256 }}
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    - {step: Check the Pi server, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-upcloud-image-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ORBIT_KIND: ${{ inputs.kind }}
          ORBIT_TARGET_HOST: ${{ inputs.address }}
          ORBIT_TARGET_KEY: ${{ inputs.intent.host_key }}
- name: run
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: {type: succeeded}}
  steps:
  - name: Run the Ansible phases
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-upcloud-image-phases-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 3300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "pi_path=$ORBIT_RUN/pi-server" --tags "$ORBIT_TAGS" "$ORBIT_ANSIBLE/task-vm-role.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ORBIT_TAGS: ${{ inputs.tags }}
          ANSIBLE_CONFIG: ${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: run, condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-upcloud-image-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
