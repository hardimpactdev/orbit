id: 52eb4df2-ee4b-4950-9c46-d6f9fb1836e9
name: operation-conn-pairing-revoke
description: Revoke admitted Conn sessions and links with native curl steps and private response shaping.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [conn.pairing_revoke]}
    intent:
      type: object
      properties:
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        pairings:
          type: array
          maxItems: 4096
          items:
            type: object
            properties:
              id: {type: integer, minimum: 1}
              label: {type: string}
              ipAddress: {type: string, minLength: 1}
              issuedAfter: {type: string}
              expiresAt: {type: string}
              delivered: {type: boolean}
            required: [id, label, ipAddress, issuedAfter, expiresAt, delivered]
            additionalProperties: false
        links:
          type: array
          items:
            type: string
      required:
      - url
      - labels
      - pairings
      - links
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        admin_session:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^conn-pairing-revoke-[a-f0-9-]+$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - admin_session
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  steps:
  - name: Create private replies
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/conn-revocation-plan'
      behaviorName: ${{ "conn-revocation-prepare" }}
      methodName: prepare
      inputs: {}
    writes: true
  - name: Read session inventory
    writes: true
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "conn-revocation-inventory" }}
      methodName: execute
      inputs:
        run: timeout 15 deno run --allow-net --allow-env --allow-write "$ORBIT_CONN_READER"
        env:
          ORBIT_CONN_READER: ${{ steps["Create private replies"].outputs.reader }}
          ORBIT_CONN_URL: ${{ inputs.intent.url }}
          ORBIT_CONN_ADMIN_SESSION: ${{ vault.get(inputs.execution_secrets.admin_session.vault, inputs.execution_secrets.admin_session.key) }}
          ORBIT_CONN_DIRECTORY: ${{ steps["Create private replies"].outputs.directory }}
    dependsOn:
    - step: Create private replies
      condition:
        type: succeeded
    guard: ${{ inputs.intent.labels.size() == 0 && inputs.intent.pairings.size() == 0 }}
  - name: Select the sessions
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/conn-revocation-plan'
      behaviorName: ${{ "conn-revocation-select" }}
      methodName: select
      inputs:
        intent: ${{ inputs.intent }}
        directory: ${{ steps["Create private replies"].outputs.directory }}
    dependsOn:
    - step: Read session inventory
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
- name: sessions
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
  steps:
  - name: Revoke the sessions
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "conn-revocation-session-" + string(self._index) }}
      methodName: execute
      inputs:
        run: 'timeout 15 curl --fail --silent --max-time 10 --max-filesize 4194304 --variable %ORBIT_CONN_ADMIN_SESSION --expand-header ''Authorization: Bearer {{ORBIT_CONN_ADMIN_SESSION}}''
          --header ''Content-Type: application/json'' --data "$ORBIT_CONN_BODY" --output "$ORBIT_CONN_DIRECTORY/session-$ORBIT_CONN_INDEX.json" "${ORBIT_CONN_URL%/}/api/auth/clients/revoke"
          2>/dev/null'
        env:
          ORBIT_CONN_URL: ${{ inputs.intent.url }}
          ORBIT_CONN_ADMIN_SESSION: ${{ vault.get(inputs.execution_secrets.admin_session.vault, inputs.execution_secrets.admin_session.key) }}
          ORBIT_CONN_DIRECTORY: ${{ steps["Create private replies"].outputs.directory }}
          ORBIT_CONN_BODY: ${{ self.item.body }}
          ORBIT_CONN_INDEX: ${{ string(self._index) }}
    writes: true
    forEach:
      item: item
      in: ${{ steps["Select the sessions"].outputs.sessions }}
- name: session-replies
  dependsOn:
  - job: sessions
    condition:
      type: completed
  steps:
  - name: Read session revocations
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/conn-revocation-plan'
      behaviorName: ${{ "conn-revocation-replies" }}
      methodName: replies
      inputs:
        directory: ${{ steps["Create private replies"].outputs.directory }}
        family: session
        pairings: ${{ steps["Select the sessions"].outputs.pairings }}
        statuses: ${{ steps["Select the sessions"].outputs.sessions.map(item, steps["Revoke the sessions-" + string(item.index)].status) }}
- name: links
  dependsOn:
  - job: session-replies
    condition:
      type: succeeded
  steps:
  - name: Revoke unused links
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "conn-revocation-link-" + string(self._index) }}
      methodName: execute
      inputs:
        run: 'timeout 15 curl --fail --silent --max-time 10 --max-filesize 4194304 --variable %ORBIT_CONN_ADMIN_SESSION --expand-header ''Authorization: Bearer {{ORBIT_CONN_ADMIN_SESSION}}''
          --header ''Content-Type: application/json'' --data "$ORBIT_CONN_BODY" --output "$ORBIT_CONN_DIRECTORY/link-$ORBIT_CONN_INDEX.json" "${ORBIT_CONN_URL%/}/api/auth/pairing-links/revoke"
          2>/dev/null'
        env:
          ORBIT_CONN_URL: ${{ inputs.intent.url }}
          ORBIT_CONN_ADMIN_SESSION: ${{ vault.get(inputs.execution_secrets.admin_session.vault, inputs.execution_secrets.admin_session.key) }}
          ORBIT_CONN_DIRECTORY: ${{ steps["Create private replies"].outputs.directory }}
          ORBIT_CONN_BODY: ${{ self.item.body }}
          ORBIT_CONN_INDEX: ${{ string(self._index) }}
    writes: true
    forEach:
      item: item
      in: ${{ steps["Select the sessions"].outputs.links }}
    guard: ${{ !steps["Read session revocations"].outputs.valid }}
- name: link-replies
  dependsOn:
  - job: links
    condition:
      type: completed
  steps:
  - name: Read link revocations
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/conn-revocation-plan'
      behaviorName: ${{ "conn-revocation-replies" }}
      methodName: replies
      inputs:
        directory: ${{ steps["Create private replies"].outputs.directory }}
        family: link
        pairings: []
        statuses: ${{ steps["Select the sessions"].outputs.links.map(item, steps["Revoke unused links-" + string(item.index)].status) }}
- name: cleanup
  dependsOn:
  - job: link-replies
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  steps:
  - name: Remove private replies
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "conn-revocation-cleanup" }}
      methodName: execute
      inputs:
        run: timeout 5 rm -rf -- "$ORBIT_CONN_DIRECTORY"
        env:
          ORBIT_CONN_DIRECTORY: ${{ steps["Create private replies"].outputs.directory }}
    writes: true
    guard: ${{ !("Create private replies" in steps) || steps["Create private replies"].status != "succeeded" }}
  - name: Confirm revocation
    labels:
      role: swamp
    queueTimeout: 30
    dependsOn:
    - step: Remove private replies
      condition:
        type: succeeded
    task:
      type: assert
      expr: '"Read session revocations" in steps && steps["Read session revocations"].status == "succeeded" && steps["Read session revocations"].outputs.valid &&
        "Read link revocations" in steps && steps["Read link revocations"].status == "succeeded" && steps["Read link revocations"].outputs.valid'
      message: conn.revocation_failed
      severity: high
