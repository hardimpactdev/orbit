id: "b100f60c-b164-4036-8881-17e603ba3901"
name: "operation-node-update"
description: "Create a Node's apps folder with official cfgmgmt from 209 and prove its owner and mode."
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [node.update]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: settings
  labels: {role: swamp}
  steps:
    # Missing parts are created; the folder gets the managed user and group, mode 0755.
  - name: 'Create the apps folder'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ "node-update-folder-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: '${{ inputs.intent.storage.root }}', ensure: present, owner: '${{ inputs.intent.storage.user }}', group: '${{ inputs.intent.storage.group }}',
        mode: '0755', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # The folder's type, owner, group and mode in one stat.
  - name: 'Check owner and mode'
    labels: {role: swamp}
    dependsOn: [{step: 'Create the apps folder', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-update-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "node-update-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '20', /usr/bin/stat, -c, '%F %U:%G %a', '${{ inputs.intent.storage.root }}']
        timeoutSec: 30
