id: b42b9a7e-70cf-4729-a16c-107ffef9e08c
name: operation-route-target-unset
description: Execute immutable admitted Route intent using canonical native children
  on209.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.target_unset
    intent:
      type: object
      properties:
        route_id:
          type: integer
          minimum: 1
        target_ids:
          type: array
          maxItems: 0
      required:
      - route_id
      - target_ids
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: confirmation
  steps:
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-result-" + run.id }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' ''{"ready":true}''

          '
