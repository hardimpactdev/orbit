id: e749e20e-cbba-49da-963b-c01796a2a049
name: task-vm-slot-boot
description: Boot the VM of a task VM slot from the task image. Clone the topology seed, create the VM with the read-only identity volume, and start it. A slot enrolment and a claim boot the same way.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: boot
  steps:
  - name: Remove a stale VM
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &host
        name: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.host_ssh_execution.target.user }}', port: '${{ inputs.intent.host_ssh_execution.target.port }}', identityFile: '${{ inputs.intent.host_ssh_execution.identity_file }}'}
        hosts: [{name: host, address: '${{ inputs.intent.host_ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.host_ssh_execution.target.host_keys }}'}}]
      # A VM or a seed clone of an earlier attempt is stale: no VM of a slot exists while the slot is enrolling or free.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '120'
        - sh
        - -c
        - |
          set -eu
          if incus --project "$1" info "$3" >/dev/null 2>&1; then incus --project "$1" delete --force "$3"; fi
          if incus --project "$1" storage volume show "$2" "$4" >/dev/null 2>&1; then incus --project "$1" storage volume delete "$2" "$4"; fi
        - sh
        - '${{ inputs.intent.vm.project }}'
        - '${{ inputs.intent.vm.pool }}'
        - '${{ inputs.intent.vm.name }}'
        - '${{ inputs.intent.vm.seed_clone }}'
        timeoutSec: 130
  - name: Clone the seed
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Remove a stale VM, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '600'
        - incus
        - --project
        - '${{ inputs.intent.vm.project }}'
        - storage
        - volume
        - copy
        - '${{ inputs.intent.vm.pool + "/" + inputs.intent.vm.seed_source }}'
        - '${{ inputs.intent.vm.pool + "/" + inputs.intent.vm.seed_clone }}'
        timeoutSec: 620
  - name: Create the VM
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Clone the seed, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # One action: the instance config on stdin holds the limits, the account, the static address and MAC, the seed clone and the read-only identity disk.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '120'
        - sh
        - -c
        - |
          set -eu
          incus --project "$1" init --vm -- "$3" "$2"
        - sh
        - '${{ inputs.intent.vm.project }}'
        - '${{ inputs.intent.vm.name }}'
        - '${{ inputs.intent.vm.fingerprint }}'
        stdin: '${{ inputs.intent.vm.config_json }}'
        timeoutSec: 130
  - name: Start the VM
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Create the VM, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '120'
        - sh
        - -c
        - |
          set -eu
          incus --project "$1" start -- "$2"
        - sh
        - '${{ inputs.intent.vm.project }}'
        - '${{ inputs.intent.vm.name }}'
        timeoutSec: 130
  - name: Wait for the guest
    labels: {role: swamp}
    dependsOn: [{step: Start the VM, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # The guest has its static address once the Incus agent reports it; the check then connects over WireGuard.
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '130', incus, --project, '${{ inputs.intent.vm.project }}', wait, '${{ inputs.intent.vm.name }}', ipv4, --timeout, '120', --interval, '1']
        timeoutSec: 140
