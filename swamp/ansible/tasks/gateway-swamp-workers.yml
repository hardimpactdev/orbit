---
# The three workers of a Gateway's own Swamp, made whole: each has its folder, and a worker without token files gets its enrollment and
# access tokens, minted with the Swamp CLI by the same names as the first build. A worker that has its files keeps them. Two plays
# import this: `gateway-swamp.yml` at the first build, and `gateway-swamp-remint.yml`, so an older fleet with only workers a and b
# gets c before its tokens are renewed (docs/reference/development-containers.md#refresh-after-a-release). Serve must be stopped:
# it holds the token store open. No token reaches output.
- name: Make the credential folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ swamp_credentials }}", mode: "0755" }
    # The workers run as the swamp account and read their tokens directly: systemd credentials do nothing in a system container.
    - { path: "{{ swamp_credentials }}/a", mode: "0750", group: "{{ swamp_user }}" }
    - { path: "{{ swamp_credentials }}/b", mode: "0750", group: "{{ swamp_user }}" }
    - { path: "{{ swamp_credentials }}/c", mode: "0750", group: "{{ swamp_user }}" }
  loop_control: { label: "{{ item.path }}" }
- name: Look for the worker tokens
  ansible.builtin.stat: { path: "{{ swamp_credentials }}/{{ item }}/server.token", get_checksum: false, get_mime: false, get_attributes: false }
  loop: [a, b, c]
  register: worker_tokens
- name: Name the workers without tokens
  ansible.builtin.set_fact:
    swamp_workers_missing: "{{ worker_tokens.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
- name: Mint the worker tokens
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      stage={{ swamp_home }}/.config/swamp/worker-{{ item }}
      swamp worker token create orbit-worker-{{ item }} --duration 30d --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' > "$stage.enrollment"
      swamp access token mint orbit-worker-{{ item }}-access --principal worker:{{ item }} --duration 30d --json >/dev/null
      swamp access token reveal orbit-worker-{{ item }}-access --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' > "$stage.server"
    chdir: "{{ swamp_repository }}"
    executable: /bin/bash
  become_user: "{{ swamp_user }}"
  environment: "{{ swamp_cli }}"
  loop: "{{ swamp_workers_missing }}"
  no_log: true
- name: Place the worker tokens
  ansible.builtin.copy:
    src: "{{ swamp_home }}/.config/swamp/worker-{{ item.0 }}.{{ item.1 }}"
    remote_src: true
    dest: "{{ swamp_credentials }}/{{ item.0 }}/{{ item.1 }}.token"
    owner: root
    group: "{{ swamp_user }}"
    mode: "0640"
    force: false
  loop: "{{ swamp_workers_missing | product(['enrollment', 'server']) | list }}"
  loop_control: { label: "{{ item.0 }} {{ item.1 }}" }
  no_log: true
# Every staged file goes, also one that a cut run left for a worker that has its files now.
- name: Remove the staged worker tokens
  ansible.builtin.file: { path: "{{ swamp_home }}/.config/swamp/worker-{{ item.0 }}.{{ item.1 }}", state: absent }
  loop: "{{ ['a', 'b', 'c'] | product(['enrollment', 'server']) | list }}"
  loop_control: { label: "{{ item.0 }} {{ item.1 }}" }
