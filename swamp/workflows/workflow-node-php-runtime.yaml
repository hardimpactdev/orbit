id: 47b3bd2e-815e-412b-a3e1-5e608e6b107d
name: node-php-runtime
description: Configure Orbit's PHP-FPM runtime settings for one PHP version with official cfgmgmt and reload its running masters.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: php-runtime
  labels: {role: swamp}
  steps:
  - name: 'Find PHP-FPM'
    labels: {role: swamp}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("node-php-ssh-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ ("node-php-ssh-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["test", "-x", "/usr/sbin/php-fpm" + inputs.intent.php.version] }}'
        timeoutSec: 20
  - name: 'Write the runtime settings'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Find PHP-FPM', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("node-php-ini-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: apply
      globalArgs: {path: '${{ "/etc/php/" + inputs.intent.php.version + "/mods-available/orbit-runtime.ini" }}', ensure: present, content: '${{ inputs.intent.php.runtime_ini }}',
        owner: root, group: root, mode: '0644', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Enable the runtime settings'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Write the runtime settings', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/link'
      behaviorName: ${{ ("node-php-link-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: apply
      globalArgs: {path: '${{ "/etc/php/" + inputs.intent.php.version + "/fpm/conf.d/99-orbit-runtime.ini" }}', ensure: present, target: ../../mods-available/orbit-runtime.ini,
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # A master gets 30 s to stop its workers on reload.
  - name: 'Set the stop timeout'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Enable the runtime settings', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/line'
      behaviorName: ${{ ("node-php-line-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: apply
      globalArgs: {path: '${{ "/etc/php/" + inputs.intent.php.version + "/fpm/php-fpm.conf" }}', regexp: '^\s*process_control_timeout\s*=', line: process_control_timeout = 30s,
        insertAfter: '^\[global\]', createFile: false, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Test PHP-FPM'
    labels: {role: swamp}
    dependsOn: [{step: 'Set the stop timeout', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("node-php-ssh-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "30", "/usr/sbin/php-fpm" + inputs.intent.php.version, "-t"] }}'
        timeoutSec: 40
  - name: 'Enable PHP-FPM'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Test PHP-FPM', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ ("node-php-fpm-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: apply
      globalArgs: {service: '${{ "php" + inputs.intent.php.version + "-fpm.service" }}', enabled: true, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Reload PHP-FPM'
    guard: ${{ inputs.kind == "node.role_converge" && steps["Write the runtime settings"].outputs.changes.size() == 0 && steps["Enable the runtime settings"].outputs.changes.size() == 0 && steps["Set the stop timeout"].outputs.changes.size() == 0 }}
    labels: {role: swamp}
    dependsOn: [{step: 'Enable PHP-FPM', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("node-php-ssh-" + string(inputs.node_id) + "-" + inputs.intent.php.version).split(".").join("-") }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60", "/usr/bin/systemctl", "try-reload-or-restart", "php" + inputs.intent.php.version + "-fpm.service", "orbit-*-php" + inputs.intent.php.version + "-fpm.service"] }}'
        timeoutSec: 70
