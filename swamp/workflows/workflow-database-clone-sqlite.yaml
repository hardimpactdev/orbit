id: e30d6747-70ce-41e0-b82b-e5d438f1cfde
name: database-clone-sqlite
description: One admitted database clone through placed native actions and official SSH from Node 209.
writes: true
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [database.clone]}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-clone-intent-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: clone
  target: orbit-node-209
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/database-clone-command-assets'
      behaviorName: ${{ "dbcm-" + run.id }}
      methodName: read
      inputs: {intent: '${{ inputs.intent }}'}
  - name: target_dir
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: &id001 {name: '${{ "dbtq-" + run.id }}', transport: {kind: ssh, user: '${{ inputs.intent.target_ssh.user }}', identityFile: /run/credentials/orbit-node-worker.service/proxy-ssh-identity},
        hosts: [{name: server, address: '${{ inputs.intent.target_ssh.host }}', transport: {hostKeys: '${{ inputs.intent.target_ssh.host_keys }}'}}]}
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/mkdir, -p, '${{ "/tmp/orbit-dbc-target-" + run.id }}']}
  - name: target_files
    target: orbit-node-209
    dependsOn:
    - {step: assets, condition: {type: succeeded}}
    - {step: target_dir, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: copy
      inputs: {hosts: 'name:server', src: '${{ steps.assets.outputs.directory + "/." }}', dst: '${{ "/tmp/orbit-dbc-target-" + run.id }}', direction: to, recursive: true}
  - name: local_copy
    target: orbit-node-209
    dependsOn:
    - {step: target_files, condition: {type: succeeded}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_local" }}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/python3, -B, '${{ "/tmp/orbit-dbc-target-" + run.id + "/sqlite_clone_local.py" }}', '${{ steps.assets.outputs.intent_json
            }}'], okExitCodes: [0, 1]}
  - name: source_dir
    target: orbit-node-209
    dependsOn:
    - {step: assets, condition: {type: succeeded}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbsq-" + run.id }}
      globalArgs: &id002 {name: '${{ "dbsq-" + run.id }}', transport: {kind: ssh, user: '${{ inputs.intent.source_ssh.user }}', identityFile: /run/credentials/orbit-node-worker.service/proxy-ssh-identity},
        hosts: [{name: server, address: '${{ inputs.intent.source_ssh.host }}', transport: {hostKeys: '${{ inputs.intent.source_ssh.host_keys }}'}}]}
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/mkdir, -p, '${{ "/tmp/orbit-dbc-source-" + run.id }}']}
  - name: source_files
    target: orbit-node-209
    dependsOn:
    - {step: source_dir, condition: {type: succeeded}}
    - {step: assets, condition: {type: succeeded}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbsq-" + run.id }}
      globalArgs: *id002
      methodName: copy
      inputs: {hosts: 'name:server', src: '${{ steps.assets.outputs.directory + "/." }}', dst: '${{ "/tmp/orbit-dbc-source-" + run.id }}', direction: to, recursive: true}
  - name: export
    target: orbit-node-209
    dependsOn:
    - {step: source_files, condition: {type: succeeded}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" }}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbsq-" + run.id }}
      globalArgs: *id002
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/python3, -B, '${{ "/tmp/orbit-dbc-source-" + run.id + "/sqlite_clone_export.py" }}', '${{ steps.assets.outputs.intent_json
            }}'], okExitCodes: [0, 1]}
  - name: snapshot
    target: orbit-node-209
    dependsOn:
    - {step: export, condition: {type: succeeded}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-clone-command-assets'
      behaviorName: ${{ "dbcm-" + run.id }}
      methodName: snapshot
      inputs: {stdout: '${{ steps.export.outputs.stdout }}', exit_code: '${{ steps.export.outputs.exitCode }}'}
  - name: transfer_dir
    target: orbit-node-209
    dependsOn:
    - {step: snapshot, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dbcc-" + run.id }}
      methodName: execute
      inputs: {run: 'umask 077

          mkdir -p -- /tmp/orbit-dbc-transfer-${{ run.id }}'}
  - name: download
    target: orbit-node-209
    dependsOn:
    - {step: snapshot, condition: {type: succeeded}}
    - {step: transfer_dir, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbsq-" + run.id }}
      globalArgs: *id002
      methodName: copy
      inputs: {hosts: 'name:server', src: '${{ inputs.intent.source.directory + "/snapshot.sqlite" }}', dst: '${{ "/tmp/orbit-dbc-transfer-" + run.id + "/snapshot.sqlite"
          }}', direction: from}
  - name: prepare_target
    target: orbit-node-209
    dependsOn:
    - {step: target_files, condition: {type: succeeded}}
    - {step: download, condition: {type: succeeded}}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/python3, -B, '${{ "/tmp/orbit-dbc-target-" + run.id + "/sqlite_clone_prepare.py" }}', '${{ steps.assets.outputs.intent_json
            }}'], okExitCodes: [0, 1]}
  - name: target_checked
    target: orbit-node-209
    dependsOn:
    - {step: prepare_target, condition: {type: succeeded}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" }}
    task:
      type: assert
      expr: 'steps.prepare_target.outputs.exitCode == 0 && steps.prepare_target.outputs.stdout == "{\"ready\": true}\n"'
      severity: high
      message: Clone target is unavailable.
  - name: upload
    target: orbit-node-209
    dependsOn:
    - {step: target_checked, condition: {type: succeeded}}
    - {step: download, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: copy
      inputs: {hosts: 'name:server', src: '${{ "/tmp/orbit-dbc-transfer-" + run.id + "/snapshot.sqlite" }}', dst: '${{ inputs.intent.target.incoming }}', direction: to}
  - name: install
    target: orbit-node-209
    dependsOn:
    - {step: upload, condition: {type: succeeded}}
    - {step: snapshot, condition: {type: succeeded}}
    - {step: target_files, condition: {type: succeeded}}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/python3, -B, '${{ "/tmp/orbit-dbc-target-" + run.id + "/sqlite_clone_install.py" }}', '${{ steps.assets.outputs.intent_json
            }}', '${{ steps.snapshot.outputs.json }}'], okExitCodes: [0, 1]}
  - name: cleanup_source
    target: orbit-node-209
    dependsOn:
    - {step: assets, condition: {type: always}}
    - {step: target_dir, condition: {type: always}}
    - {step: target_files, condition: {type: always}}
    - {step: local_copy, condition: {type: always}}
    - {step: source_dir, condition: {type: always}}
    - {step: source_files, condition: {type: always}}
    - {step: export, condition: {type: always}}
    - {step: snapshot, condition: {type: always}}
    - {step: transfer_dir, condition: {type: always}}
    - {step: download, condition: {type: always}}
    - {step: prepare_target, condition: {type: always}}
    - {step: target_checked, condition: {type: always}}
    - {step: upload, condition: {type: always}}
    - {step: install, condition: {type: always}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" || steps.source_files.status != "succeeded" }}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbsq-" + run.id }}
      globalArgs: *id002
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/python3, -B, '${{ "/tmp/orbit-dbc-source-" + run.id + "/sqlite_clone_cleanup_source.py" }}', '${{ steps.assets.outputs.intent_json
            }}'], okExitCodes: [0, 1]}
  - name: cleanup_incoming
    target: orbit-node-209
    dependsOn:
    - {step: assets, condition: {type: always}}
    - {step: target_dir, condition: {type: always}}
    - {step: target_files, condition: {type: always}}
    - {step: local_copy, condition: {type: always}}
    - {step: source_dir, condition: {type: always}}
    - {step: source_files, condition: {type: always}}
    - {step: export, condition: {type: always}}
    - {step: snapshot, condition: {type: always}}
    - {step: transfer_dir, condition: {type: always}}
    - {step: download, condition: {type: always}}
    - {step: prepare_target, condition: {type: always}}
    - {step: target_checked, condition: {type: always}}
    - {step: upload, condition: {type: always}}
    - {step: install, condition: {type: always}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" || steps.target_files.status != "succeeded" }}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/python3, -B, '${{ "/tmp/orbit-dbc-target-" + run.id + "/sqlite_clone_cleanup_target.py" }}', '${{ steps.assets.outputs.intent_json
            }}'], okExitCodes: [0, 1]}
  - name: cleanup_transfer
    target: orbit-node-209
    dependsOn:
    - {step: assets, condition: {type: always}}
    - {step: target_dir, condition: {type: always}}
    - {step: target_files, condition: {type: always}}
    - {step: local_copy, condition: {type: always}}
    - {step: source_dir, condition: {type: always}}
    - {step: source_files, condition: {type: always}}
    - {step: export, condition: {type: always}}
    - {step: snapshot, condition: {type: always}}
    - {step: transfer_dir, condition: {type: always}}
    - {step: download, condition: {type: always}}
    - {step: prepare_target, condition: {type: always}}
    - {step: target_checked, condition: {type: always}}
    - {step: upload, condition: {type: always}}
    - {step: install, condition: {type: always}}
    allowFailure: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dbcc-" + run.id }}
      methodName: execute
      inputs: {run: 'rm -rf -- /tmp/orbit-dbc-transfer-${{ run.id }}'}
  - name: cleanup_source_scripts
    target: orbit-node-209
    dependsOn:
    - {step: cleanup_source, condition: {type: always}}
    guard: ${{ steps.assets.status != "succeeded" || inputs.intent.variant != "sqlite_remote" }}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbsq-" + run.id }}
      globalArgs: *id002
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/rm, -rf, --, '${{ "/tmp/orbit-dbc-source-" + run.id }}']}
  - name: cleanup_target_scripts
    target: orbit-node-209
    dependsOn:
    - {step: cleanup_incoming, condition: {type: always}}
    - {step: local_copy, condition: {type: always}}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dbtq-" + run.id }}
      globalArgs: *id001
      methodName: exec
      inputs: {hosts: 'name:server', argv: [/usr/bin/rm, -rf, --, '${{ "/tmp/orbit-dbc-target-" + run.id }}']}
  - name: result
    target: orbit-node-209
    dependsOn:
    - {step: assets, condition: {type: always}}
    - {step: target_dir, condition: {type: always}}
    - {step: target_files, condition: {type: always}}
    - {step: local_copy, condition: {type: always}}
    - {step: source_dir, condition: {type: always}}
    - {step: source_files, condition: {type: always}}
    - {step: export, condition: {type: always}}
    - {step: snapshot, condition: {type: always}}
    - {step: transfer_dir, condition: {type: always}}
    - {step: download, condition: {type: always}}
    - {step: prepare_target, condition: {type: always}}
    - {step: target_checked, condition: {type: always}}
    - {step: upload, condition: {type: always}}
    - {step: install, condition: {type: always}}
    - {step: cleanup_source, condition: {type: always}}
    - {step: cleanup_incoming, condition: {type: always}}
    - {step: cleanup_transfer, condition: {type: always}}
    - {step: cleanup_source_scripts, condition: {type: always}}
    - {step: cleanup_target_scripts, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-clone-command-assets'
      behaviorName: ${{ "dbcm-" + run.id }}
      methodName: result
      inputs: {expected: '${{ inputs.intent.variant == "sqlite_local" ? ["local_copy","cleanup_transfer","cleanup_target_scripts"] : ["install","cleanup_source","cleanup_incoming","cleanup_transfer","cleanup_source_scripts","cleanup_target_scripts"]
          }}', steps: '${{ steps }}'}
  - name: accept_result
    target: orbit-node-209
    dependsOn:
    - {step: result, condition: {type: succeeded}}
    task:
      type: assert
      expr: steps.result.outputs.exitCode == 0
      severity: high
      message: Database clone did not complete.
