name: CI

on:
  pull_request:
  push:
    branches: [main, 'task-*-handoff']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'

jobs:
  php:
    name: PHP syntax and Composer
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cache frozen published agent
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/orbit-frozen-agent
          key: frozen-agent-${{ runner.os }}-${{ hashFiles('apps/gateway/resources/agent/frozen-manifest.json') }}
      - name: Check frozen agent command references
        run: bin/check-frozen-agent-commands --binary-cache "$HOME/.cache/orbit-frozen-agent"
      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          job: php
      - uses: ./.github/actions/php
        if: steps.scope.outputs.selected == 'true'
        with:
          coverage: none
      - name: Validate Composer metadata
        if: steps.scope.outputs.selected == 'true'
        run: git ls-files -z '*composer.json' | xargs -0 -I '{}' composer validate --strict --no-check-publish '{}'
      - name: Check changed PHP syntax
        if: steps.scope.outputs.selected == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=$(git merge-base origin/main HEAD); fi
          git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- '*.php' | xargs -0 -r -n 1 -P 4 php -l

  cli:
    name: CLI build
    uses: ./.github/workflows/orbit-cli-binary.yml
    with:
      commit: ${{ github.sha }}
      version: ''
      changed-only: true

  docs:
    name: Docs build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          job: docs
      - uses: ./.github/actions/php
        if: steps.scope.outputs.selected == 'true'
        with:
          coverage: none
      - name: Install Docs dependencies
        if: steps.scope.outputs.selected == 'true'
        run: composer install --working-dir=apps/docs --no-interaction --prefer-dist --no-dev
      - name: Build and check the documentation index
        if: steps.scope.outputs.selected == 'true'
        run: |
          composer docs-build
          composer docs-lint

  api-reference:
    name: Generated contracts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          job: api-reference
      - uses: ./.github/actions/php
        if: steps.scope.outputs.selected == 'true'
        with:
          coverage: none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.selected == 'true'
        with:
          bun-version: 1.4.2
      - name: Cache installed PHP dependencies
        if: steps.scope.outputs.selected == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/gateway/vendor
          key: php-runtime-${{ runner.os }}-8.5-${{ hashFiles('apps/gateway/composer.lock', 'packages/php-sdk/composer.json') }}
      - name: Install generator dependencies
        if: steps.scope.outputs.selected == 'true'
        run: |
          cp apps/gateway/.env.example apps/gateway/.env
          composer install --working-dir=apps/gateway --no-interaction --prefer-dist --no-dev
          bun install --cwd apps/web --frozen-lockfile
      - name: Boot and validate Operation kinds
        if: steps.scope.outputs.selected == 'true'
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: bin/check-operation-kinds
      - name: Check OpenAPI and MCP tools
        if: steps.scope.outputs.selected == 'true'
        run: |
          bin/docs-openapi --check
          bin/mcp-tools --check
      - name: Generate web schema
        if: steps.scope.outputs.selected == 'true'
        run: bun run --cwd apps/web types

  web:
    name: Web build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          job: web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.selected == 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.selected == 'true'
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/php
        if: steps.scope.outputs.selected == 'true'
        with:
          coverage: none
      - name: Cache installed PHP dependencies
        if: steps.scope.outputs.selected == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/gateway/vendor
          key: php-runtime-${{ runner.os }}-8.5-${{ hashFiles('apps/gateway/composer.lock', 'packages/php-sdk/composer.json') }}
      - name: Build API contracts
        if: steps.scope.outputs.selected == 'true'
        working-directory: .
        run: composer install --working-dir=apps/gateway --no-dev --no-interaction --prefer-dist
      - run: bun install --frozen-lockfile
        if: steps.scope.outputs.selected == 'true'
      - name: Build
        if: steps.scope.outputs.selected == 'true'
        run: bun run build && test -s dist/index.html && test -s dist/version.json
      - name: Publish web build
        if: steps.scope.outputs.selected == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  changes:
    name: Select build inputs
    runs-on: ubuntu-26.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - name: Select changed build inputs
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=HEAD^; fi
          if [ "$PR" = true ]; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          args=()
          if [ "$MAIN" = true ]; then args+=(--main); fi
          python3 bin/ci-build-plan --base "$BASE" "${args[@]}" --github-output "$GITHUB_OUTPUT"

  agent-delivery:
    name: Combine agent delivery
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse the frozen published agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/ci-agent-delivery reuse --destination "$RUNNER_TEMP/agent-delivery"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-delivery
          path: ${{ runner.temp }}/agent-delivery
          if-no-files-found: error
          retention-days: 30

  required:
    name: Required checks
    if: always()
    needs: [php, cli, docs, api-reference, web, changes]
    runs-on: ubuntu-26.04
    steps:
      - name: Require builds and static checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          if needs['changes']['result'] != 'success':
              sys.exit('Build input selection failed')
          selected = json.loads(needs['changes']['outputs']['jobs'])
          expected = set(needs) - {'changes'}
          if set(selected) != expected or any(type(value) is not bool for value in selected.values()):
              sys.exit('Incomplete build selections')
          failed = {job: needs[job]['result'] for job, touched in selected.items()
                    if needs[job]['result'] != 'success' and not (not touched and needs[job]['result'] == 'skipped')}
          if failed:
              sys.exit(f'Builds or static checks failed: {failed}')
          PYTHON
