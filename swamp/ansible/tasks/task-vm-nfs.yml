---
# The task VM exports its checkout to the nested fleet and to nothing else.
# intent.nfs is null on an image, which only holds the server; a task VM names its checkout, the nested subnet and the nested bridge.
- name: Enable the NFS server
  ansible.builtin.systemd: { name: nfs-server.service, enabled: true, state: started }
- name: Create the exports folder
  ansible.builtin.file: { path: /etc/exports.d, state: directory, owner: root, group: root, mode: "0755" }
- name: Export the checkout to the nested subnet
  when: intent.nfs is not none
  ansible.builtin.copy:
    dest: /etc/exports.d/orbit-checkout.exports
    content: "{{ intent.nfs.checkout }} {{ intent.nfs.subnet }}(rw,async,no_subtree_check)\n"
    owner: root
    group: root
    mode: "0644"
  notify: Reload exports
- name: Withdraw the export
  when: intent.nfs is none
  ansible.builtin.file: { path: /etc/exports.d/orbit-checkout.exports, state: absent }
  notify: Reload exports
- name: Allow NFS from the nested bridge
  when: intent.nfs is not none
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ intent.nfs.interface }}"
    from_ip: "{{ intent.nfs.subnet }}"
    to_port: "2049"
    proto: tcp
    comment: orbit:task-vm-nfs
