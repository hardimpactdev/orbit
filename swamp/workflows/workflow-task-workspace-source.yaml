description: Set up one captured Tasks workspace on the provisioned VM as official
  SSH exec argv from 209, and fold the provision receipt; no script reaches the VM.
id: 46a068b0-6512-4c23-8729-e5bdc43c136c
inputs:
  additionalProperties: false
  properties:
    intent:
      type: object
    kind:
      enum:
      - tasks.provision
      type: string
    node_id:
      minimum: 1
      type: integer
    operation_id:
      minimum: 1
      type: integer
    # The root run of the Operation, which the Gateway checks when it mints the clone credential.
    run_id:
      pattern: ^[a-f0-9-]{36}$
      type: string
    vm:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - run_id
  - vm
  type: object
jobs:
- name: source
  steps:
  # The workspace connection pins the host key the VM child observed at enrollment; the same step builds the argv of each setup command.
  - name: guest
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-guest" }}'
      methodName: guest
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
        root: ${{ "/tmp/orbit-task-provision-"+run.id }}
    # Every failure lands in the receipt; this workspace run itself always ends with it.
    allowFailure: true
  # The credential is minted here, at the start and beside the guest steps, because the VM step before this run can wait for capacity for longer than an
  # installation token lives. It exists only in the vault and in the environment of the clone: the VM gets a bundle, never a credential.
  # The call is the one of the task-github-mint child, made in one step so that the clone starts one dispatch sooner.
  - name: mint_clone
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-github-mint-clone" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 60 --max-filesize 65536 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_MINT_REQUEST\" \"$ORBIT_MINT_URL\"\n"
        env:
          ORBIT_MINT_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/github-token" }}
          ORBIT_MINT_REQUEST: '${{ "{\"run_id\":\"" + inputs.run_id + "\",\"purpose\":\"clone\"}" }}'
    allowFailure: true
  # The run folder on the Swamp Node, the clone with its full history, and the bundle that the VM gets: three commands in one step.
  - name: clone
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-clone" }}'
      methodName: execute
      inputs:
        run: 'set -e

          umask 077

          mkdir -p -- "$ORBIT_ROOT"

          git clone --branch "$ORBIT_BRANCH" -- "$ORBIT_REPOSITORY" "$ORBIT_ROOT/source"

          git -C "$ORBIT_ROOT/source" bundle create "$ORBIT_ROOT/source.bundle" --all

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
          ORBIT_BRANCH: ${{ inputs.intent.workspace.default_branch }}
          ORBIT_REPOSITORY: ${{ inputs.intent.workspace.repository }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.intent.git_authorization.vault,
            inputs.intent.git_authorization.key) }}
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: 'git@github.com:'
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: ssh://git@github.com/
    dependsOn:
    - step: mint_clone
      condition:
        type: succeeded
    allowFailure: true
  # The guest steps are two Ansible phases (swamp/ansible/task-vm-workspace.yml): `prepare` beside the clone, `checkout` once the bundle exists.
  # This step writes their intent; the first phase builds the inventory and the pinned known hosts from it.
  - name: input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs:
        intent: '${{ {"ssh_execution": steps.guest.outputs.workspace.ssh_execution, "workspace": {"checkout_path": inputs.intent.workspace.checkout_path, "repository": inputs.intent.workspace.repository, "branch": inputs.intent.workspace.branch, "start_commit": inputs.intent.workspace.start_commit, "entry_point": inputs.intent.workspace.entry_point, "skip_profile": inputs.intent.workspace.skip_profile, "access": has(inputs.intent.workspace.access) ? inputs.intent.workspace.access : []}} }}'
        path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    allowFailure: true
  # Phase one: the checkout folder and the output folder on the VM, and a check that the account can write the checkout folder. It builds the
  # inventory and the known hosts, so it runs beside the clone and the bundle is not waited for.
  - name: prepare
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-workspace-prepare" }}'
      methodName: execute
      inputs:
        run: "timeout 30 python3 \"$ORBIT_ANSIBLE/build_vars.py\" \"$ORBIT_RUN\" task_vm.workspace && timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.yml\" -e \"@$ORBIT_RUN/vars.yml\" --tags prepare \"$ORBIT_ANSIBLE/task-vm-workspace.yml\"\n"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps.input.outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps.input.outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ORBIT_REMOTE_ROOT: ${{ "/tmp/orbit-task-provision-" + run.id }}
          ORBIT_LOCAL_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/" + run.id }}
    dependsOn:
    - step: input
      condition:
        type: succeeded
    allowFailure: true
  # Phase two: the bundle to the VM and its clone, the origin and the task branch, the commit and metadata facts, the Route's rows of Caddy access
  # (one at a time, before the setup steps write into the tree: what they create inherits the default entries) and the composer.json. The facts and the
  # composer.json come back as files in the run folder on the Swamp Node, for `profile`.
  - name: checkout
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-workspace-checkout" }}'
      methodName: execute
      inputs:
        run: "timeout 600 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.yml\" -e \"@$ORBIT_RUN/vars.yml\" --tags checkout \"$ORBIT_ANSIBLE/task-vm-workspace.yml\"\n"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps.input.outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps.input.outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ORBIT_REMOTE_ROOT: ${{ "/tmp/orbit-task-provision-" + run.id }}
          ORBIT_LOCAL_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/" + run.id }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    - step: clone
      condition:
        type: succeeded
    allowFailure: true
  - name: profile
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-profile" }}'
      methodName: profile
      inputs:
        intent: ${{ inputs.intent }}
        facts: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/facts.json" }}
        composer: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
    dependsOn:
    - step: checkout
      condition:
        type: succeeded
    allowFailure: true
  # Private dependencies (docs/cli/tasks/provision.mmd). The token is minted beside the clone credential, so its dispatch is off the critical path; the old
  # files are cleared early for the same reason (uutils `install` cannot overwrite from stdin). Right before the first setup step the two files are written
  # by two parallel steps, so the write costs one dispatch. `deps_remove_files` and `deps_revoke` run together after the last setup step, whatever it did:
  # a revoked token is dead whether or not the files are gone yet.
  - name: deps_mint
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        purpose: dependencies
    dependsOn: []
    guard: ${{ size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: deps_clear
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-clear-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-clear-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - rm
        - -f
        - --
        - ${{ "/home/" + inputs.intent.workspace.user + "/.config/composer/auth.json" }}
        - ${{ "/home/" + inputs.intent.workspace.user + "/.npmrc" }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    guard: ${{ size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: deps_write_composer
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-composer-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-composer-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - install
        - -D
        - -m
        - '0600'
        - /dev/stdin
        - ${{ "/home/" + inputs.intent.workspace.user + "/.config/composer/auth.json" }}
        stdin: ${{ vault.get(inputs.intent.dependency_auth.composer.vault, inputs.intent.dependency_auth.composer.key) }}
    dependsOn:
    - step: checkout
      condition:
        type: succeeded
    - step: deps_mint
      condition:
        type: succeeded
    - step: deps_clear
      condition:
        type: succeeded
    guard: ${{ size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: deps_write_npm
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-npm-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-npm-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - install
        - -m
        - '0600'
        - /dev/stdin
        - ${{ "/home/" + inputs.intent.workspace.user + "/.npmrc" }}
        stdin: ${{ vault.get(inputs.intent.dependency_auth.npm.vault, inputs.intent.dependency_auth.npm.key) }}
    dependsOn:
    - step: checkout
      condition:
        type: succeeded
    - step: deps_mint
      condition:
        type: succeeded
    - step: deps_clear
      condition:
        type: succeeded
    guard: ${{ size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: setup-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv: ${{ steps.guest.outputs.setup[self._index] }}
        timeoutSec: ${{ self.setup.timeout_seconds }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: deps_write_composer
      condition:
        type: succeeded
    - step: deps_write_npm
      condition:
        type: succeeded
    forEach:
      item: setup
      in: ${{ inputs.intent.workspace.setup }}
    concurrency: 1
    guard: ${{ has(steps.profile.outputs.error_code)
      || (self._index > 0 && (!("setup-"+string(self._index-1) in steps) || steps["setup-"+string(self._index-1)].status != "succeeded")) }}
    allowFailure: true
  - name: deps_remove_files
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-remove-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-remove-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - rm
        - -f
        - --
        - ${{ "/home/" + inputs.intent.workspace.user + "/.config/composer/auth.json" }}
        - ${{ "/home/" + inputs.intent.workspace.user + "/.npmrc" }}
    dependsOn:
    - step: deps_mint
      condition:
        type: always
    - step: deps_clear
      condition:
        type: always
    - step: deps_write_composer
      condition:
        type: always
    - step: deps_write_npm
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    # A skipped mint asked for no token: there is no file to remove and no token to revoke.
    guard: ${{ !("deps_mint" in steps) }}
    allowFailure: true
  # curl prints the HTTP status instead of failing on it, so the receipt can tell a revoked token (204) from one that GitHub does not know (401, none minted
  # or already expired) and from a revoke that failed. The step itself fails only when GitHub could not be reached.
  - name: deps_revoke
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "tp-deps-revoke" }}
      methodName: execute
      inputs:
        run: "curl --silent --show-error --proto =https --max-time 30 --request DELETE \\\n  --variable %ORBIT_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_TOKEN}}' \\\n  --header 'Accept: application/vnd.github+json' \\\n  --output /dev/null --write-out '%{http_code}' https://api.github.com/installation/token\n"
        env:
          ORBIT_TOKEN: ${{ vault.get(inputs.intent.dependency_auth.token.vault, inputs.intent.dependency_auth.token.key) }}
    dependsOn:
    - step: deps_mint
      condition:
        type: always
    - step: deps_clear
      condition:
        type: always
    - step: deps_write_composer
      condition:
        type: always
    - step: deps_write_npm
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    guard: ${{ !("deps_mint" in steps) }}
    writes: true
    allowFailure: true
  - name: setup_copy
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        recursive: true
        src: ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/" }}
        timeoutSec: 60
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    - step: clone
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    allowFailure: true
  - name: setup_output
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-setup-output" }}'
      methodName: setup_output
      inputs:
        intent: ${{ inputs.intent }}
        directory: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/output" }}
    dependsOn:
    - step: setup_copy
      condition:
        type: succeeded
    allowFailure: true
  # The proof club token's private directory, owned by orbit.
  - name: proof_club_directory
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -d
        - -m
        - '0700'
        - -o
        - orbit
        - -g
        - orbit
        - --
        - /home/orbit/.config/swamp
  # install cannot replace an existing file from stdin; drop any previous token or link first.
  - name: proof_club_previous
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_directory
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - rm
        - -f
        - --
        - /home/orbit/.config/swamp/club-api-key
  # The token from the vault on SSH stdin, written 0600 for orbit; it never enters argv or history.
  - name: proof_club
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_previous
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -m
        - '0600'
        - -o
        - orbit
        - -g
        - orbit
        - /dev/stdin
        - /home/orbit/.config/swamp/club-api-key
        stdin: ${{ vault.get(inputs.intent.proof_club.vault, inputs.intent.proof_club.key) }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-result" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
        steps: ${{ steps }}
    dependsOn:
    - step: guest
      condition:
        type: always
    - step: mint_clone
      condition:
        type: always
    - step: clone
      condition:
        type: always
    - step: input
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    - step: checkout
      condition:
        type: always
    - step: profile
      condition:
        type: always
    - step: deps_mint
      condition:
        type: always
    - step: deps_clear
      condition:
        type: always
    - step: deps_write_composer
      condition:
        type: always
    - step: deps_write_npm
      condition:
        type: always
    - step: deps_remove_files
      condition:
        type: always
    - step: deps_revoke
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    - step: proof_club_directory
      condition:
        type: always
    - step: proof_club_previous
      condition:
        type: always
    - step: proof_club
      condition:
        type: always
  # Both cleanups wait for the last reader of the run folders: the output copy and the profile. The receipt does not wait for them.
  - name: cleanup
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-cleanup" }}'
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_ROOT" "$ORBIT_RUN"

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-"+run.id }}
    dependsOn:
    - step: setup_output
      condition:
        type: always
    - step: checkout
      condition:
        type: always
    - step: profile
      condition:
        type: always
    allowFailure: true
  - name: cleanup_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id }}
    dependsOn:
    - step: setup_output
      condition:
        type: always
    - step: checkout
      condition:
        type: always
    allowFailure: true
  labels: {role: swamp}
name: task-workspace-source
# Each SSH step is limited to 3900 s, the run budget of the largest Operation that calls it (OperationBudgetTable::SecondsByKind).
vaults:
- orbit-control-inputs
