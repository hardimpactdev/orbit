id: 393024cd-986d-46f7-bf26-2a500281d492
name: swamp-credential-monitor
description: Hourly read-only expiry check of Swamp-side credentials on Node 209; the Gateway alerts.
trigger:
  schedule: '0 7 * * * *'
reports:
  skip: ["@swamp/workflow-summary"]
vaults: []
queueTimeout: 120
jobs:
  - name: monitor
    steps:
      - name: assets
        labels: {role: swamp}
        queueTimeout: 120
        task:
          type: behavior
          behaviorType: '@nckrtl/node-worker-assets'
          behaviorName: credential-monitor-assets
          methodName: credential_check
          inputs: {node_id: 209}
      - name: check
        labels: {role: swamp}
        queueTimeout: 120
        dependsOn:
          - step: assets
            condition: {type: succeeded}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: credential-monitor-check
          methodName: execute
          inputs:
            run: timeout 150 /usr/bin/python3 -I '${{ steps.assets.outputs.script_path }}'
