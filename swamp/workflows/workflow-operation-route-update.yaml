  - name: production-urls
    target: ${{ "orbit-node-" + string(self.node) }}
    labels:
      node: ${{ string(self.node) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-convergence'
      behaviorName: ${{ "route-convergence-node-" + string(self.node) }}
      methodName: synchronizeEnvironment
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.node }}
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "publication" || !(data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "web_root" && data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.production)
      }}
    forEach:
      item: node
      in: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.workload_node_ids
        }}
    writes: true
  dependsOn:
  - job: admission
    condition: *id001
  - job: store-update
    condition: *id001
  - job: certificate-requests
    condition: *id001
  - job: certificate-signatures
    condition: *id001
  - job: certificates
    condition: *id001
  - job: web-roots
    condition: *id001
