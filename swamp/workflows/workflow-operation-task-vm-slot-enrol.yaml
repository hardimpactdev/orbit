id: 7d0f2c6e-3b4a-4f1e-9c58-2a6e1b9d4f30
name: operation-task-vm-slot-enrol
description: Enrol one ready slot (docs/cli/tasks/vm-slots.mmd) - the VM child of tasks:provision, the converge, then a stop; no workspace,
  nested fleet, Route or Processes.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: task_vm.slot_enrol}
    intent:
      type: object
    converge:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models|provider-bootstrap)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token|agent-secret-node-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - converge
  - execution_secrets
  additionalProperties: false
jobs:
- name: provision
  labels: {role: swamp}
  steps:
  - name: Create and prepare the VM
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provision
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: task_vm.provision
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: Pin the converge
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: tp-data-pin-converge
      methodName: pin
      inputs:
        receipt: ${{ steps["Create and prepare the VM"].outputs.result }}
        guest_node_id: ${{ inputs.intent.guest_node_id }}
        intents: '${{ {"converge": inputs.converge} }}'
    dependsOn:
    - step: Create and prepare the VM
      condition:
        type: succeeded
  - name: Create the checkout folder
    labels: {role: swamp}
    writes: true
    # The converge exports the Project's checkout path, which the claim's workspace step fills; it must exist first.
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-slot-stop-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-slot-stop-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.host_ssh_execution.target.user }}
          port: ${{ inputs.intent.host_ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.host_ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.host_ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.host_ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', incus, exec, --project, '${{ inputs.intent.vm.project }}', '${{ inputs.intent.name }}', --, runuser, -u, orbit, --, mkdir, -p, --, '${{ inputs.converge.nfs.checkout }}']
    dependsOn:
    - step: Create and prepare the VM
      condition:
        type: succeeded
    # The task VM role phases on the slot: nested Incus with the seed pool, the NFS export of the Project's checkout path.
  - name: Converge once
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-task-vm-converge
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.intent.guest_node_id }}
        kind: task_vm.converge
        intent: ${{ steps["Pin the converge"].outputs.converge }}
        execution_secrets: '${{ {} }}'
    dependsOn:
    - step: Pin the converge
      condition:
        type: succeeded
    - step: Create the checkout folder
      condition:
        type: succeeded
    # A stopped VM keeps disk, not memory. A VM that is already stopped makes `incus stop` exit 1 and counts as stopped.
  - name: Stop the VM
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-slot-stop-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-slot-stop-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.host_ssh_execution.target.user }}
          port: ${{ inputs.intent.host_ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.host_ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.host_ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.host_ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '130', incus, stop, --project, '${{ inputs.intent.vm.project }}', --timeout, '120', --, '${{ inputs.intent.name }}']
    dependsOn:
    - step: Converge once
      condition:
        type: succeeded
  - name: Check the VM stopped
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-slot-stop-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-slot-stop-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.host_ssh_execution.target.user }}
          port: ${{ inputs.intent.host_ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.host_ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.host_ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.host_ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', incus, list, --project, '${{ inputs.intent.vm.project }}', --format, csv, --columns, s, '${{ "^" + inputs.intent.name + "$" }}']
    dependsOn:
    - step: Stop the VM
      condition:
        type: succeeded
  - name: result
    labels: {role: swamp}
    dependsOn:
    - step: Check the VM stopped
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "vm-slot-enrol-result" }}'
      methodName: execute
      inputs:
        run: |
          case "$ORBIT_STATE" in STOPPED*) printf '%s\n' "$ORBIT_RESULT" ;; *) echo task_vm.slot_not_stopped >&2; exit 1 ;; esac
        env:
          ORBIT_STATE: ${{ steps["Check the VM stopped"].outputs.stdout }}
          ORBIT_RESULT: ${{ steps["Create and prepare the VM"].outputs.result.result_json }}
