id: 73c78a4c-e148-4130-89e3-33104b28ae6e
name: operation-schedule-install-instance-definitions
description: Converge captured Schedule definitions through native child workflows on 209.
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [schedule.install_instance_definitions]}
    intent:
      type: object
      properties:
        instance_id: {type: integer, minimum: 1}
        members:
          type: array
          maxItems: 4096
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              intent: {type: object}
            required: [id, intent]
            additionalProperties: false
      required: [instance_id, members]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: instance
    labels: {role: swamp}
    steps:
      - name: members
        labels: {role: swamp}
        forEach: {item: member, in: '${{ inputs.intent.members }}'}
        task:
          type: workflow
          workflowIdOrName: operation-schedule-create
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: schedule.create
            intent: ${{ self.member.intent }}
            execution_secrets: {}
      - name: result
        labels: {role: swamp}
        dependsOn: [{step: members, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "schedule-def-result-" + run.id }}
          methodName: execute
          inputs:
            run: |
              printf '%s\n' '{"ready":true}'
