# Runnable additions for the uncovered requirements of the frozen show.cases.yaml spec.
# Uses the same shared runner and chart; the approved spec remains unchanged.
command: node:show
chart: node/show
target: app-dev
sources: [gateway, app-prod]
baseline: [operations, node_records]

cases:
  - id: retained-recorded-detail
    batch: fresh-fleet
    covers: [main, node-found, allowed, no-agent]
    summary: A retained failed Node exposes named Cluster, settings, access and every role assignment through the shared projection.
    setup:
      - node_fixture: {kind: retained, as: retained, consumer: app-prod, serving: app-dev}
    act:
      - cli:
          run: [node:show, "${retained.id}"]
          forms: [json, human]
          save: {assignments: recorded-roles}
          expect:
            exit: 0
            request: none
            human: ["${retained.name}", "${retained.cluster_name}", "Apps folder", /srv/proof-apps, provisioning, removing, "converge:database", node.role_failed, "app-prod (#${app-prod.id})", "app-dev (#${app-dev.id})"]
            json:
              - {path: id, equals: "${retained.id}"}
              - {path: name, equals: "${retained.name}"}
              - {path: cluster_name, equals: "${retained.cluster_name}"}
              - {path: status, equals: failed}
              - {path: platform, equals: linux}
              - {path: architecture, equals: x86_64}
              - {path: tld, equals: "${retained.tld}"}
              - {path: public_ssh_host, equals: 192.0.2.99}
              - {path: public_ssh_port, equals: 2222}
              - {path: user, equals: orbit}
              - {path: lan_ip, equals: 192.168.88.2}
              - {path: wireguard_public_key, equals: recorded-proof-key}
              - {path: wireguard_endpoint_override, equals: "192.0.2.99:51820"}
              - {path: dns_server_override, equals: 192.168.88.1}
              - {path: settings.apps.path, equals: /srv/proof-apps}
              - {path: failed_step, equals: "converge:apps"}
              - {path: error_code, equals: node.enrollment_failed}
              - {path: agent, equals: null}
              - {path: roles, equals: [app-dev, app-prod, metrics, database]}
              - {path: "assignments[0].role", equals: app-dev}
              - {path: "assignments[0].status", equals: active}
              - {path: "assignments[1].role", equals: app-prod}
              - {path: "assignments[1].status", equals: provisioning}
              - {path: "assignments[2].role", equals: metrics}
              - {path: "assignments[2].status", equals: removing}
              - {path: "assignments[3].role", equals: database}
              - {path: "assignments[3].status", equals: failed}
              - {path: "assignments[3].failed_step", equals: "converge:database"}
              - {path: "assignments[3].error_code", equals: node.role_failed}
              - {path: "access.can_access[0].id", equals: "${app-dev.id}"}
              - {path: "access.can_access[0].name", equals: app-dev}
              - {path: "access.accessible_by[0].id", equals: "${app-prod.id}"}
              - {path: "access.accessible_by[0].name", equals: app-prod}
              - {path: skipped, absent: true}
      - cli:
          run: [node:role:list, "${retained.id}"]
          expect: {exit: 0, request: none, json: [{path: roles, equals: "${recorded-roles}"}]}
      - cli:
          run: [node:list]
          expect: {exit: 0, request: none, json: [{path: "nodes[id=${retained.id}].assignments", equals: "${recorded-roles}"}]}
      - cli:
          run: [node:show, "${retained.id}"]
          expect: {exit: 0, request: none, json: [{path: assignments, equals: "${recorded-roles}"}, {path: skipped, absent: true}]}
      - recorded_request:
          node: "${retained.id}"
          caller: gateway
          expect: [{path: status, equals: 200}, {path: body.data.status, equals: failed}, {path: body.data.assignments, equals: "${recorded-roles}"}]
    expect:
      - unchanged: {since: act, what: [operations, node_records]}

  - id: sparse-recorded-detail
    batch: fresh-fleet
    covers: [main, node-found, allowed, no-agent]
    summary: Sparse and unmanaged records preserve null values, have no assigned roles and use the standard empty human rendering.
    variants:
      - {name: sparse, kind: sparse}
      - {name: unmanaged, kind: unmanaged}
    setup:
      - node_fixture: {kind: "${kind}", as: sparse}
    act:
      - cli:
          run: [node:show, "${sparse.id}"]
          forms: [json, human]
          expect:
            exit: 0
            request: none
            human: ["${sparse.name}", "Apps folder", "—"]
            json:
              - {path: cluster_id, equals: null}
              - {path: cluster_name, equals: null}
              - {path: agent, equals: null}
              - {path: architecture, equals: null}
              - {path: wireguard_ip, equals: null}
              - {path: lan_ip, equals: null}
              - {path: settings, equals: null}
              - {path: roles, equals: []}
              - {path: assignments, equals: []}
              - {path: skipped, absent: true}
      - recorded_request:
          node: "${sparse.id}"
          caller: gateway
          expect: [{path: status, equals: 200}, {path: body.data.agent, equals: null}]
    expect:
      - unchanged: {since: act, what: [operations, node_records]}

  - id: recorded-agent-state
    batch: fresh-fleet
    covers: [main, node-found, allowed]
    summary: A request-local recorded view proves exact freshness boundaries and offline last-seen retention without any outbound contact.
    variants:
      - {name: fresh, state: online, age: 0, since: null}
      - {name: exact-boundary, state: online, age: 15, since: null}
      - {name: stale, state: offline, age: 16, since: "2026-01-01T11:59:44Z"}
      - {name: entry-expired, state: offline, age: 120, since: "2026-01-01T11:58:00Z"}
      - {name: never-seen, state: not_seen, age: null, since: null}
      - {name: unavailable-view, state: unknown, age: 0, since: null}
    setup:
      - node_fixture: {kind: managed, as: managed}
    act:
      - cli:
          run: [node:show, "${managed.id}"]
          expect: {exit: 0, request: none, json: [{path: name, equals: "${managed.name}"}, {path: skipped, absent: true}]}
      - recorded_request:
          node: "${managed.id}"
          caller: gateway
          agent: "${state}"
          age: "${age}"
          expect:
            - {path: status, equals: 200}
            - {path: body.data.name, equals: "${managed.name}"}
            - {path: body.data.agent.state, equals: "${state}"}
            - {path: body.data.agent.since, equals: "${since}"}
    expect:
      - unchanged: {since: act, what: [operations, node_records]}
