id: 7d3c1e52-84a1-4f6b-9b0e-2c5a6f1d9e47
name: route-withdraw
queueTimeout: 30
labels: {role: swamp}
description: "instance.destroy: withdraw a Route from every Node it touches, one Ansible read, one composition and one Ansible apply per Node, and prove every contribution."
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
    parent_run_id:
      type: string
      format: uuid
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - parent_run_id
  additionalProperties: false
jobs:
- name: withdraw
  steps:
    # The firewall rules and ingress a destroy still opens are applied first, as the mutation applies them.
  - name: withdraw_lan
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.lan }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn: []
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
  - name: withdraw_ingress
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.ingress }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-ingress-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
    # Each Node that serves the Route, answers its DNS or holds a withdrawn certificate scope, in parallel: its pools, Caddyfile,
    # private DNS records and certificate folders, each written once. The captured states run in order against what the Node holds.
  - name: withdraw_node
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.serves_routes || p.prepared.dns != null || inputs.intent.route_mutations.forward.cleanup.exists(leaf,leaf.node_id == p.node_id)) }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-withdraw-node
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          publication:
            node_id: ${{ self.part.node_id }}
            user: ${{ self.part.user }}
            control_node_id: ${{ self.part.control_node_id }}
            connection: ${{ self.part.connection }}
            host_keys: ${{ self.part.host_keys }}
            serves_routes: ${{ self.part.serves_routes }}
          php: '${{ self.part.serves_routes ? {"before": inputs.intent.route_mutations.artifacts.php[self.part.before.php], "after": inputs.intent.route_mutations.artifacts.php[self.part.after.php]} : {} }}'
          caddy: '${{ self.part.serves_routes ? {"before": inputs.intent.route_mutations.artifacts.caddy[self.part.before.caddy], "prepared": inputs.intent.route_mutations.artifacts.caddy[self.part.prepared.caddy], "withdrawn": inputs.intent.route_mutations.artifacts.caddy[self.part.withdrawn.caddy], "after": inputs.intent.route_mutations.artifacts.caddy[self.part.after.caddy]} : {} }}'
          dns: '${{ self.part.prepared.dns != null ? {"before": inputs.intent.route_mutations.artifacts.dns[self.part.before.dns], "prepared": inputs.intent.route_mutations.artifacts.dns[self.part.prepared.dns], "withdrawn": inputs.intent.route_mutations.artifacts.dns[self.part.withdrawn.dns != null ? self.part.withdrawn.dns : self.part.prepared.dns], "after": inputs.intent.route_mutations.artifacts.dns[self.part.after.dns != null ? self.part.after.dns : self.part.prepared.dns]} : {} }}'
          cleanup: '${{ inputs.intent.route_mutations.forward.cleanup.filter(leaf,leaf.node_id == self.part.node_id).map(leaf,{"scope": leaf.scope, "user": leaf.user}) }}'
        execution_secrets: {}
    allowFailure: true
  - name: withdraw_retire_lan
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.retire_lan }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
  - name: withdraw_retire_ingress
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.retire_ingress }}
    guard: ${{ steps.exists(key, key.startsWith("withdraw_") && steps[key].status == "failed") }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    - {step: withdraw_retire_lan, condition: {type: always}}
    task:
      type: workflow
      workflowIdOrName: route-ingress-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].control_node_id }}
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}
        execution_secrets: {}
    allowFailure: true
    # Every contribution proved. A destroy has no new certificate, no environment write and no live leaf: the count of any such work
    # is required under a step that does not exist, so it fails closed with route.contribution_incomplete instead of being dropped.
  - name: forward
    forEach:
      item: stage
      in: ${{ [inputs.intent.route_mutations.forward] }}
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    - {step: withdraw_retire_lan, condition: {type: always}}
    - {step: withdraw_retire_ingress, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: '${{ "forward-result-" + string(self._index) }}'
      methodName: result
      inputs:
        stage: ${{ self.stage }}
        mode: forward
        required:
          withdraw_lan: ${{ size(inputs.intent.route_mutations.forward.lan) }}
          withdraw_ingress: ${{ size(inputs.intent.route_mutations.forward.ingress) }}
          withdraw_node: ${{ size(inputs.intent.route_mutations.forward.publications.filter(p,p.serves_routes || p.prepared.dns != null || inputs.intent.route_mutations.forward.cleanup.exists(leaf,leaf.node_id == p.node_id))) }}
          withdraw_retire_lan: ${{ size(inputs.intent.route_mutations.forward.retire_lan) }}
          withdraw_retire_ingress: ${{ size(inputs.intent.route_mutations.forward.retire_ingress) }}
          withdraw_unsupported: ${{ size(inputs.intent.route_mutations.forward.prepare_certificates) + size(inputs.intent.route_mutations.forward.certificates) + size(inputs.intent.route_mutations.forward.url_writes) }}
        outcomes: ${{ steps }}
    allowFailure: true
  - name: result
    dependsOn:
    - {step: withdraw_lan, condition: {type: always}}
    - {step: withdraw_ingress, condition: {type: always}}
    - {step: withdraw_node, condition: {type: always}}
    - {step: withdraw_retire_lan, condition: {type: always}}
    - {step: withdraw_retire_ingress, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-update-result'
      behaviorName: route-mutation-phase
      methodName: phase
      inputs:
        mode: forward
        steps: ${{ steps }}
