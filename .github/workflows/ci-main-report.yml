name: Main consumer answer collector
'on':
  workflow_run:
    workflows:
    - Main deferred fixtures
    - Main full set
    - Main copy proof
    types:
    - completed
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Publish missing terminal answers from their durable claims
      env:
        GH_TOKEN: ${{ github.token }}
        ENDED_RUN: ${{ github.event.workflow_run.id }}
      run: bin/ci-main-queue collect --run-id "$ENDED_RUN" --output "$RUNNER_TEMP/collected-answer.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: collected-answer
        path: ${{ runner.temp }}/collected-answer.json
        if-no-files-found: error
        overwrite: true
