id: 4093f46d-9dd2-4e67-a151-dd5bb9addb0c
name: operation-firewall-direct
description: Converge one admitted firewall rule from Node 209; each ufw change is one argv over official SSH.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [firewall.allow, firewall.deny, firewall.remove]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: firewall
  steps:
  - name: Read the rules
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("firewall-read-" + string(inputs.intent.ssh.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("firewall-read-" + string(inputs.intent.ssh.target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
          hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}'}]
      inputs:
        hosts: 'name:target'
        sudo: true
        argv: [timeout, '30', /usr/sbin/ufw, status, numbered]
  - name: Plan the changes
    labels: {role: swamp}
    dependsOn: [{step: Read the rules, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/firewall-plan'
      behaviorName: '${{ "firewall-plan" }}'
      methodName: plan
      inputs: {intent: '${{ inputs.intent }}', stdout: '${{ steps["Read the rules"].outputs.stdout }}'}
    # One ufw argv per planned change, in order; numbered inserts count the rows as they will be.
  - name: Change the rules
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Plan the changes, condition: {type: succeeded}}]
    forEach: {item: change, in: '${{ [0, 1, 2, 3, 4, 5, 6, 7] }}'}
    concurrency: 1
    guard: '${{ self.change >= size(steps["Plan the changes"].outputs.commands) }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("firewall-change-" + string(inputs.intent.ssh.target.host) + "-" + string(self.change)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("firewall-change-" + string(inputs.intent.ssh.target.host) + "-" + string(self.change)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
          hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}'}]
      inputs:
        hosts: 'name:target'
        sudo: true
        argv: '${{ steps["Plan the changes"].outputs.commands[self.change] }}'
  - name: Read the result
    labels: {role: swamp}
    # A plan without changes leaves ufw as the first read showed it: the check uses that read, and no second read runs.
    guard: '${{ size(steps["Plan the changes"].outputs.commands) == 0 }}'
    dependsOn:
    - {step: Plan the changes, condition: {type: succeeded}}
    - {step: Change the rules, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("firewall-reread-" + string(inputs.intent.ssh.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("firewall-reread-" + string(inputs.intent.ssh.target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
          hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}'}]
      inputs:
        hosts: 'name:target'
        sudo: true
        argv: [timeout, '30', /usr/sbin/ufw, status, numbered]
  - name: Check the rules
    labels: {role: swamp}
    dependsOn:
    - {step: Plan the changes, condition: {type: succeeded}}
    - {step: Read the result, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: '@nckrtl/firewall-plan'
      behaviorName: '${{ "firewall-check" }}'
      methodName: check
      inputs:
        intent: '${{ inputs.intent }}'
        stdout: '${{ size(steps["Plan the changes"].outputs.commands) == 0 ? steps["Read the rules"].outputs.stdout : steps["Read the result"].outputs.stdout }}'
        refusal: '${{ steps["Plan the changes"].outputs.stdout }}'
        changes: '${{ size(steps["Plan the changes"].outputs.commands) }}'
  - name: accepted
    labels: {role: swamp}
    dependsOn: [{step: Check the rules, condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Check the rules"].outputs.ok', severity: high, message: The firewall rule did not converge.}
