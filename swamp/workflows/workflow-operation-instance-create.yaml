            sudo: true
            argv: '${{ ["timeout", "20", "rm", "-rf", "--", "/tmp/orbit-clone-" + string(inputs.intent.instance_id) + "-" + run.id] }}'
            stdin: ''
            timeoutSec: 30
      - name: accepted
        labels: {role: swamp}
        dependsOn: [{step: finish, condition: {type: succeeded}}, {step: withdraw-route, condition: {type: always}}, {step: stop-container, condition: {type: always}}, {step: clone-private-cleanup, condition: {type: always}}]
        task: {type: assert, expr: 'steps.finish.outputs.ready == true', severity: high, message: The development Instance create did not complete.}
      - name: cleanup
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: stop-container, condition: {type: always}}, {step: clone-private-cleanup, condition: {type: always}}]
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-cleanup-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 30 rm -rf -- "$ORBIT_RUN"
            env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
