id: 738a2f9d-dc6c-4754-92c3-f51de9cb91f9
name: operation-instance-deploy-direct
description: Native development deployment; production execution reports kind_unavailable until its native DAG lands.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: instance.deploy
    node_id:
      type: integer
      minimum: 1
    execution_secrets:
      type: object
      default: {}
      additionalProperties:
        type: object
        additionalProperties: false
        properties:
          vault:
            type: string
            enum: [orbit-control-inputs]
          key:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'
        required: [vault, key]

    intent:
      type: object
      properties:
        instance_id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        commit:
          type: string
          default: ''
        deployment:
          type: object
          properties:
            variant:
              type: string
              enum:
              - development
              - production
            node_user:
              type: string
            home:
              type: string
            repository:
              type: string
            branch:
              type: string
            protocols:
              type: array
              items:
                type: string
            needs_vp:
              type: boolean
            steps:
              type: array
              items:
                type: object
          required:
          - variant
          - node_user
          - home
          - repository
          - branch
          - protocols
          - steps
      required:
      - instance_id
      - project_id
      - commit
      - deployment
  required:
  - operation_id
  - kind
  - node_id
  - intent
  - execution_secrets
jobs:
- name: deployment
  steps:
  - name: inspect-checkout
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-inspect-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          ACCOUNT: ${{ inputs.intent.deployment.node_user }}
          REPOSITORY: ${{ inputs.intent.deployment.repository }}
          BRANCH: ${{ inputs.intent.deployment.branch }}
        run: |
          set -eu
          test "$(id -un)" = "$ACCOUNT"
          test "$(id -u)" -ne 0
          test -d "$CHECKOUT/.git"
          test ! -L "$CHECKOUT"
          test ! -L "$CHECKOUT/.git"
          test "$(realpath -e -- "$CHECKOUT")" = "$CHECKOUT"
          test "$(stat -c %u -- "$CHECKOUT")" = "$(id -u)"
          test "$(stat -c %u -- "$CHECKOUT/.git")" = "$(id -u)"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" config --get remote.origin.url)" = "$REPOSITORY"
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" rev-parse --git-common-dir)" = .git
          git check-ref-format --branch "$BRANCH" >/dev/null
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" symbolic-ref --short HEAD)" = "$BRANCH"
          test -z "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" status --porcelain --untracked-files=no)"
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: fetch-source
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: inspect-checkout
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-fetch-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          REPOSITORY: ${{ inputs.intent.deployment.repository }}
          BRANCH: ${{ inputs.intent.deployment.branch }}
          PROTOCOLS: ${{ inputs.intent.deployment.protocols.join(":") }}
          GIT_READ: ${{ vault.get(inputs.execution_secrets.git_read.vault, inputs.execution_secrets.git_read.key)
            }}
        run: |
          set -eu
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=0
          header=$(python3 -c 'import base64,json,os; token=json.loads(os.environ["GIT_READ"])["github_token"]; print("Authorization: Basic " + base64.b64encode(("x-access-token:" + token).encode()).decode() if token else "")')
          unset GIT_READ
          export GIT_ALLOW_PROTOCOL="$PROTOCOLS"
          if [ -n "$header" ]; then
            export GIT_ALLOW_PROTOCOL=https
            export GIT_CONFIG_COUNT=3 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0=$header
            export GIT_CONFIG_VALUE_0
            GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf GIT_CONFIG_VALUE_1=git@github.com:
            GIT_CONFIG_KEY_2=url.https://github.com/.insteadOf GIT_CONFIG_VALUE_2=ssh://git@github.com/
            export GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2
          fi
          unset header
          exec git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -c http.followRedirects=false \
            -C "$CHECKOUT" fetch --quiet --no-tags -- "$REPOSITORY" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: resolve-commit
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: fetch-source
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-resolve-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          BRANCH: ${{ inputs.intent.deployment.branch }}
          COMMIT: ${{ inputs.intent.commit }}
        run: |
          set -eu
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          tracking="refs/remotes/origin/$BRANCH"
          if [ -z "$COMMIT" ]; then
            COMMIT=$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" rev-parse --verify "$tracking^{commit}")
          fi
          case "$COMMIT" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#COMMIT}" -eq 40 || test "${#COMMIT}" -eq 64
          distance=$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" rev-list --first-parent --count "$COMMIT..$tracking")
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" rev-parse --verify "$tracking~$distance")" = "$COMMIT"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" merge-base --is-ancestor "refs/heads/$BRANCH" "$COMMIT"
          printf '{"commit":"%s"}\n' "$COMMIT"
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: select-commit
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: resolve-commit
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-select-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          BRANCH: ${{ inputs.intent.deployment.branch }}
          SOURCE: ${{ steps["resolve-commit"].outputs.stdout }}
        run: |
          set -eu
          COMMIT=$(python3 -c 'import json,os; print(json.loads(os.environ["SOURCE"])["commit"])')
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          test -z "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" status --porcelain --untracked-files=no)"
          exec git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" \
            checkout --quiet --no-track -B "$BRANCH" "$COMMIT"
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: read-vp-requirements
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: select-commit
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-read-vp-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          NEEDS_VP: ${{ string(inputs.intent.deployment.needs_vp) }}
        run: |
          set -eu
          exec python3 - <<'PY'
          import json
          import os
          import pathlib
          import pwd
          import re
          import stat

          if os.environ["NEEDS_VP"] != "true":
              print(json.dumps({"package": {}, "store": None}))
              raise SystemExit(0)
          root = pathlib.Path(os.environ["CHECKOUT"])


          def read(path, maximum=4194304):
              try:
                  descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              except FileNotFoundError:
                  return None
              with os.fdopen(descriptor, "rb") as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_size > maximum:
                      raise ValueError("deployment.vp_requirements_invalid")
                  content = stream.read(maximum + 1)
                  if len(content) > maximum:
                      raise ValueError("deployment.vp_requirements_invalid")
                  return content.decode()


          def public(value, grammar):
              if (
                  not isinstance(value, str)
                  or len(value) > 512
                  or not re.fullmatch(grammar, value)
              ):
                  raise ValueError("deployment.vp_requirements_invalid")
              return value


          version = r"[0-9vV<>=~^.*|+() -]+(?:-[0-9A-Za-z.-]+)?"
          selector = r"(?:npm|pnpm)@[0-9][0-9A-Za-z.+-]*"
          pkg = json.loads(read(root / "package.json") or "{}")
          package = {}
          for section in ("dependencies", "devDependencies"):
              package[section] = {
                  name: public(value, r"[0-9A-Za-z@:/.*^~+_-]+")
                  for name, value in (pkg.get(section) or {}).items()
                  if name == "vite-plus"
                  or isinstance(value, str)
                  and value.startswith("npm:vite-plus@")
              }
          uses = any(package.values())
          locks, workspaces = {}, {}
          if uses:
              package["engines"] = {
                  name: public(value, version)
                  for name, value in (pkg.get("engines") or {}).items()
                  if name in ("node", "npm", "pnpm")
              }
              if "packageManager" in pkg:
                  package["packageManager"] = public(pkg["packageManager"], selector)
              pnpm = read(root / "pnpm-lock.yaml")
              if pnpm is not None:
                  # Retain only scalar syntax used by the canonical pin parser. Arbitrary
                  # resolutions, scripts, URLs, registry settings and comments never leave this step.
                  safe = []
                  for line in pnpm.splitlines():
                      mapping = re.fullmatch(
                          r"( *)(?:['\"]?)([A-Za-z0-9_./@+*-]+)(?:['\"]?): *", line
                      )
                      scalar = re.fullmatch(
                          r"( *)(?:['\"]?)(packageManager|version|node)(?:['\"]?): *(.*?) *", line
                      )
                      if mapping:
                          safe.append(mapping[1] + json.dumps(mapping[2]) + ":")
                      elif scalar:
                          value = scalar[3]
                          if len(value) >= 2 and value[0] in ("'", '"') and value[-1] == value[0]:
                              value = value[1:-1]
                          grammar = (
                              selector
                              if scalar[2] == "packageManager"
                              else (
                                  version
                                  if scalar[2] == "node"
                                  else r"(?:npm:)?(?:vite-plus@|workspace:|link:)?[0-9A-Za-z./@_+()-]+"
                              )
                          )
                          try:
                              value = public(value, grammar)
                          except ValueError:
                              continue
                          safe.append(scalar[1] + scalar[2] + ": " + json.dumps(value))
                          if scalar[2] == "version" and value.startswith("link:"):
                              path = (root / value[5:]).resolve()
                              if not path.is_relative_to(root):
                                  raise ValueError("deployment.vp_requirements_invalid")
                              workspace = json.loads(read(path / "package.json") or "{}")
                              if workspace.get("name") == "vite-plus":
                                  workspaces[value] = public(
                                      workspace.get("version"), r"[0-9][0-9A-Za-z.+-]*"
                                  )
                  locks["pnpm-lock.yaml"] = "\n".join(safe)
              else:
                  npm = json.loads(read(root / "package-lock.json") or "{}")
                  packages = {}
                  names = {
                      name
                      for section in ("dependencies", "devDependencies")
                      for name in package[section]
                  }
                  entries = {
                      name: (npm.get("packages") or {}).get(
                          "node_modules/" + name, (npm.get("dependencies") or {}).get(name)
                      )
                      for name in names
                  }
                  for name, entry in entries.items():
                      if not isinstance(entry, dict):
                          raise ValueError("deployment.vp_requirements_invalid")
                      if entry.get("link") is True:
                          entry = (npm.get("packages") or {}).get(entry.get("resolved"))
                      if not isinstance(entry, dict):
                          raise ValueError("deployment.vp_requirements_invalid")
                      packages["node_modules/" + name] = {
                          "version": public(entry.get("version"), r"[0-9][0-9A-Za-z.+-]*"),
                          "engines": {
                              key: public(value, version)
                              for key, value in (entry.get("engines") or {}).items()
                              if key == "node"
                          },
                      }
                  lock = {"packages": packages}
                  for key in ("npmVersion", "packageManager"):
                      if key in npm:
                          lock[key] = public(
                              npm[key],
                              selector if key == "packageManager" else r"[0-9][0-9A-Za-z.+-]*",
                          )
                  locks["package-lock.json"] = json.dumps(lock)
          home = pathlib.Path(pwd.getpwuid(os.getuid()).pw_dir)
          candidates = []
          for store in (
              (
                  pathlib.Path("/opt/orbit/vite-plus"),
                  home / ".vite-plus",
                  home / ".local/share/vite-plus",
              )
              if uses
              else ()
          ):
              binary = store / "bin/vp"
              if not binary.exists():
                  continue
              for path in (store, store / "bin", binary):
                  info = path.lstat()
                  if (
                      stat.S_ISLNK(info.st_mode)
                      or info.st_uid != os.getuid()
                      or info.st_mode & 0o022
                  ):
                      raise ValueError("tool.vp_scope_conflict")
              candidates.append(store)
          if len(candidates) > 1:
              raise ValueError("tool.vp_scope_conflict")
          print(
              json.dumps(
                  {
                      "package": package,
                      "locks": locks,
                      "workspaces": workspaces,
                      ".node-version": public(value.strip(), r"v?[0-9][0-9A-Za-z.+-]*")
                      if uses and (value := read(root / ".node-version"))
                      else None,
                      ".nvmrc": public(value.strip(), r"v?[0-9][0-9A-Za-z.+-]*")
                      if uses and (value := read(root / ".nvmrc"))
                      else None,
                      "store": str(candidates[0]) if candidates else None,
                  }
              )
          )
          PY
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: vp-pins
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: read-vp-requirements
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy-data'
      behaviorName: ${{ "dev-pins-" + string(inputs.operation_id) }}
      methodName: pins
      inputs:
        configuration: ${{ steps["read-vp-requirements"].outputs.stdout }}
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: inspect-vp-manager
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: vp-pins
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-vp-version-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          VP_HOME: ${{ steps["vp-pins"].outputs.store }}
          NODE_VERSION: ${{ steps["vp-pins"].outputs.node_version }}
        run: |
          set -eu
          if [ -z "$NODE_VERSION" ]; then exit 0; fi
          exec "$VP_HOME/bin/vp" --version
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: verify-vp-manager
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: inspect-vp-manager
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy-data'
      behaviorName: ${{ "dev-vp-version-gate-" + string(inputs.operation_id) }}
      methodName: managerVersion
      inputs:
        runtime: ${{ steps["vp-pins"].outputs.runtime }}
        observed: ${{ steps["inspect-vp-manager"].outputs.stdout }}
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: verify-vp-environment
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: verify-vp-manager
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-prepare-vp-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          VP_HOME: ${{ steps["vp-pins"].outputs.store }}
          NODE_VERSION: ${{ steps["vp-pins"].outputs.node_version }}
          RUNTIME: ${{ steps["vp-pins"].outputs.runtime_json }}
        run: |
          set -eu
          if [ -z "$NODE_VERSION" ]; then exit 0; fi
          exec python3 - <<'PY'
          import json
          import os
          import pathlib
          import stat

          runtime = json.loads(os.environ['RUNTIME'])
          store = pathlib.Path(runtime['store'])
          node = store / 'js_runtime/node' / runtime['node_version']
          manager = store / 'package_manager' / runtime['package_manager'] / runtime['package_manager_version']
          for target in (node, manager):
              current = store
              for part in target.relative_to(store).parts:
                  current = current / part
                  info = current.lstat()
                  if stat.S_ISLNK(info.st_mode) or info.st_uid != os.getuid() or info.st_mode & 0o022:
                      raise ValueError('deployment.vp_preparation_unavailable')
          executable = node / 'bin/node'
          package = manager / runtime['package_manager']
          for target in (executable, package / 'package.json', package / 'bin' / runtime['package_manager']):
              if not target.resolve().is_relative_to(store):
                  raise ValueError('deployment.vp_preparation_unavailable')
          manifest = json.loads((package / 'package.json').read_text())
          if (manifest.get('name') != runtime['package_manager'] or manifest.get('version') != runtime['package_manager_version']
                  or not os.access(executable, os.X_OK) or not os.access(package / 'bin' / runtime['package_manager'], os.X_OK)):
              raise ValueError('deployment.vp_preparation_unavailable')
          print('{"verified":true}')
          PY
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: application
    forEach:
      item: command
      in: ${{ inputs.intent.deployment.steps }}
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: verify-vp-environment
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-command-" + string(inputs.operation_id) + "-" + self.command.name }}
      methodName: execute
      inputs:
        timeout: ${{ self.command.timeout_seconds * 1000 }}
        ignoreExitCode: true
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          ACCOUNT: ${{ inputs.intent.deployment.node_user }}
          EXPECTED_DIGEST: ${{ self.command.command_digest }}
          ADMITTED_COMMAND: ${{ vault.get(inputs.execution_secrets[self.command.program_field].vault, inputs.execution_secrets[self.command.program_field].key)
            }}
          VP_HOME: ${{ steps["vp-pins"].outputs.store }}
          NODE_VERSION: ${{ steps["vp-pins"].outputs.node_version }}
          PACKAGE_MANAGER: ${{ steps["vp-pins"].outputs.package_manager }}
          SOURCE: ${{ steps["resolve-commit"].outputs.stdout }}
        run: |
          set -eu
          exec python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import pwd
          import re
          import stat
          import subprocess
          import tempfile

          account = pwd.getpwnam(os.environ["ACCOUNT"])
          if account.pw_uid != os.getuid() or account.pw_uid == 0:
              raise ValueError("deployment.identity_changed")
          script = os.environ.pop("ADMITTED_COMMAND")
          if hashlib.sha256(script.encode()).hexdigest() != os.environ["EXPECTED_DIGEST"]:
              raise ValueError("instance.step_not_admitted")
          checkout = pathlib.Path(os.environ["CHECKOUT"])
          env = {
              "HOME": account.pw_dir,
              "USER": account.pw_name,
              "LOGNAME": account.pw_name,
              "PATH": "/usr/local/bin:/usr/bin:/bin",
              "ORBIT_SEED_PATH": str(checkout),
              "ORBIT_SEED_COMMIT": json.loads(os.environ["SOURCE"])["commit"],
          }
          dotenv = checkout / ".env"
          try:
              descriptor = os.open(
                  dotenv, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK
              )
          except FileNotFoundError:
              content = ""
          else:
              with os.fdopen(descriptor, "rb") as stream:
                  info = os.fstat(stream.fileno())
                  if (
                      not stat.S_ISREG(info.st_mode)
                      or info.st_uid != account.pw_uid
                      or info.st_gid != account.pw_gid
                      or info.st_mode & 0o022
                      or info.st_size > 1048576
                  ):
                      raise ValueError("instance.step_layout_invalid")
                  content = stream.read(1048577).decode()
              if len(content.encode()) > 1048576:
                  raise ValueError("instance.step_layout_invalid")
          if content:
              count = 0
              for line in content.splitlines():
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  key, separator, value = line.partition("=")
                  if (
                      not separator
                      or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,254}", key)
                      or key.startswith(("LD_", "BASH_"))
                  ):
                      raise ValueError("instance.step_layout_invalid")
                  if key in env:
                      raise ValueError("instance.step_layout_invalid")
                  if value.startswith('"'):
                      if not value.endswith('"') or len(value) < 2:
                          raise ValueError("instance.step_layout_invalid")
                      value = value[1:-1]
                      if re.search(r'\\(?![nr\\"$])', value):
                          raise ValueError("instance.step_layout_invalid")
                      translations = {"n": "\n", "r": "\r", "\\": "\\", '"': '"', "$": "$"}
                      value = re.sub(
                          r'\\([nr\\"$])', lambda match: translations[match.group(1)], value
                      )
                  elif '"' in value or "'" in value:
                      raise ValueError("instance.step_layout_invalid")
                  count += 1
                  if "\0" in value or len(value.encode()) > 65536 or count > 1024:
                      raise ValueError("instance.step_layout_invalid")
                  env[key] = value
          command = ["/bin/bash", "--noprofile", "--norc", "-p", "-eu", "/proc/self/fd/3"]
          store, node, manager = (
              os.environ.get(key, "") for key in ("VP_HOME", "NODE_VERSION", "PACKAGE_MANAGER")
          )
          if store:
              env.update(VP_HOME=store, PATH=store + "/bin:" + env["PATH"])
          if node:
              command = [
                  store + "/bin/vp",
                  "env",
                  "exec",
                  "--node",
                  node,
                  "--package-manager",
                  manager,
                  "--",
              ] + command
          with tempfile.TemporaryFile() as program:
              program.write(script.encode())
              program.flush()
              command[-1] = (
                  "/proc/" + str(os.getpid()) + "/fd/" if node else "/proc/self/fd/"
              ) + str(program.fileno())
              child = subprocess.Popen(
                  command,
                  cwd=checkout,
                  env=env,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  pass_fds=(program.fileno(),),
              )
              redactions = {line for value in env.values() for line in value.splitlines() if line}
              remaining, work = 1048576, 16777216
              pending, tail, truncated, dropping, pem = bytearray(), "", False, False, False
              for chunk in iter(lambda: child.stdout.read1(4096), b""):
                  if remaining <= 0:
                      truncated = True
                      continue
                  for byte in chunk:
                      remaining -= 1
                      if remaining < 0:
                          pending.clear()
                          truncated = True
                          break
                      if byte != 10:
                          if not dropping:
                              if len(pending) < 4096:
                                  pending.append(byte)
                              else:
                                  pending.clear()
                                  dropping = True
                                  truncated = True
                          continue
                      if dropping:
                          dropping = False
                          continue
                      text = pending.decode("utf-8", errors="replace")
                      pending.clear()
                      if "-----BEGIN " in text:
                          pem = True
                      if pem:
                          if "-----END " in text:
                              pem = False
                          continue
                      text = re.sub(
                          r"(?i)(authorization\s*:\s*(?:bearer|basic)\s+)\S+",
                          r"\1[REDACTED]",
                          text,
                      )
                      text = re.sub(
                          r"(?i)([a-z][a-z0-9+.-]*://)[^\s/@]+:[^\s/@]+@", r"\1[REDACTED]@", text
                      )
                      text = re.sub(
                          r"(?i)((?:password|token|secret|api[_-]?key)\s*[=:]\s*)[^\s,;]+",
                          r"\1[REDACTED]",
                          text,
                      )
                      for value in sorted(redactions, key=len, reverse=True):
                          work -= len(text) * 2 + len(value)
                          if work < 0:
                              remaining = 0
                              truncated = True
                              text = ""
                              break
                          text = text.replace(value, "[REDACTED]")
                      encoded = (tail + text + "\n").encode()
                      if len(encoded) > 2048:
                          truncated = True
                      tail = encoded[-2048:].decode("utf-8", errors="ignore")
              if pending:
                  truncated = True
              status = child.wait()
          print(json.dumps({"exit_code": status, "output_tail": tail, "truncated": truncated}))
          raise SystemExit(status if status >= 0 else 1)
          PY
    guard: ${{ inputs.intent.deployment.variant != "development" || inputs.intent.deployment.steps.exists(command,
      command.order < self._index && command.required && ("application-" + string(command.order)) in steps && "outputs"
      in steps["application-" + string(command.order)] && steps["application-" + string(command.order)].outputs.exitCode
      != 0) }}
    concurrency: 1
  - name: verify-checkout
    labels:
      node: ${{ string(inputs.node_id) }}
    guard: ${{ inputs.intent.deployment.variant != "development" || steps["select-commit"].status != "succeeded"
      }}
    dependsOn:
    - step: application
      condition:
        type: always
    - step: select-commit
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-verify-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          CHECKOUT: ${{ inputs.intent.deployment.home }}
          ACCOUNT: ${{ inputs.intent.deployment.node_user }}
          REPOSITORY: ${{ inputs.intent.deployment.repository }}
          BRANCH: ${{ inputs.intent.deployment.branch }}
          SOURCE: ${{ steps["resolve-commit"].outputs.stdout }}
        run: |
          set -eu
          test "$(id -un)" = "$ACCOUNT"
          test "$(id -u)" -ne 0
          test -d "$CHECKOUT/.git"
          test ! -L "$CHECKOUT"
          test ! -L "$CHECKOUT/.git"
          test "$(realpath -e -- "$CHECKOUT")" = "$CHECKOUT"
          test "$(stat -c %u -- "$CHECKOUT")" = "$(id -u)"
          test "$(stat -c %u -- "$CHECKOUT/.git")" = "$(id -u)"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" config --get remote.origin.url)" = "$REPOSITORY"
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" rev-parse --git-common-dir)" = .git
          git check-ref-format --branch "$BRANCH" >/dev/null
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" symbolic-ref --short HEAD)" = "$BRANCH"
          COMMIT=$(python3 -c 'import json,os; print(json.loads(os.environ["SOURCE"])["commit"])')
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.alternateRefsCommand=true -c core.sshCommand=ssh -c core.askPass= -c core.gitProxy= -c credential.helper= -c uploadpack.packObjectsHook= -c protocol.ext.allow=never -C "$CHECKOUT" rev-parse --verify HEAD)" = "$COMMIT"
          printf '{"commit":"%s"}\n' "$COMMIT"
  - name: summarize
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: verify-checkout
      condition:
        type: always
    - step: application
      condition:
        type: always
    - step: inspect-checkout
      condition:
        type: always
    - step: fetch-source
      condition:
        type: always
    - step: resolve-commit
      condition:
        type: always
    - step: select-commit
      condition:
        type: always
    - step: read-vp-requirements
      condition:
        type: always
    - step: vp-pins
      condition:
        type: always
    - step: inspect-vp-manager
      condition:
        type: always
    - step: verify-vp-manager
      condition:
        type: always
    - step: verify-vp-environment
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy-data'
      behaviorName: ${{ "dev-result-" + string(inputs.operation_id) }}
      methodName: result
      inputs:
        instance_id: ${{ inputs.intent.instance_id }}
        steps: ${{ steps }}
        commands: ${{ inputs.intent.deployment.steps }}
        runtime: '${{ "vp-pins" in steps && "outputs" in steps["vp-pins"] ? steps["vp-pins"].outputs.runtime : null }}'
    guard: ${{ inputs.intent.deployment.variant != "development" }}
  - name: result
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: summarize
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "dev-public-result-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        env:
          RESULT: '${{ inputs.intent.deployment.variant == "development" ? steps.summarize.outputs.json : ''{"error_code":"operation.kind_unavailable","failed_step":"production_deploy"}''
            }}'
        run: |
          set -eu
          printf '%s\n' "$RESULT"
  - name: deployment-succeeded
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: result
      condition:
        type: succeeded
    task:
      type: assert
      expr: inputs.intent.deployment.variant == "development" && steps.summarize.outputs.ok
      message: The admitted development deployment failed.
vaults:
- orbit-control-inputs
