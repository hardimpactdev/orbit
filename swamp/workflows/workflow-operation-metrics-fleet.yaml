id: a02d5140-0af9-4049-b8d9-56032384330d
name: operation-metrics-fleet
description: Reconcile full admitted public Metrics intent with placed single-action command steps.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - metrics.reconcile
    intent:
      type: object
      properties:
        participant_node_ids:
          type: array
          items:
            type: integer
            minimum: 1
        metrics_fleet:
          type: object
        caddy_publications:
          type: array
          items:
            type: object
      required:
      - participant_node_ids
      - metrics_fleet
      - caddy_publications
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        grafana_password:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^metrics-grafana-node-[1-9][0-9]*-active$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - grafana_password
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: intent
  steps:
  - name: read
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: &id001
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/metrics-fleet-intent'
      behaviorName: ${{ "metrics-intent-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
- name: shared-native-prerequisites
  dependsOn:
  - job: intent
    condition:
      type: succeeded
  steps:
  - name: shared-native-prerequisites
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: assert
      expr: size(steps.read.outputs.pools) == 0 && size(steps.read.outputs.publications) == 0
      message: metrics.native_shared_steps_unavailable
      severity: high
- name: verify-existing-credential
  dependsOn:
  - job: shared-native-prerequisites
    condition:
      type: succeeded
  steps:
  - name: verify-existing-credential
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-existing-credential-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_GRAFANA_PASSWORD,ORBIT_METRICS_ADDRESS -- /usr/bin/python3 - <<'PYTHON'
          import base64
          import os
          import urllib.error
          import urllib.request

          password = os.environ.pop("ORBIT_GRAFANA_PASSWORD")
          address = os.environ["ORBIT_METRICS_ADDRESS"]
          request = urllib.request.Request(
              "http://" + address + ":3000/api/user",
              headers={
                  "Authorization": "Basic "
                  + base64.b64encode(("admin:" + password).encode()).decode()
              },
          )


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          try:
              with urllib.request.build_opener(
                  urllib.request.ProxyHandler({}), NoRedirect()
              ).open(request, timeout=30) as response:
                  if response.status != 200:
                      raise ValueError()
          except Exception:
              raise SystemExit("metrics.credentials_unverified") from None
          print('{"verified":true}')
          PYTHON
        env: &id005
          ORBIT_GRAFANA_PASSWORD: ${{ vault.get(inputs.execution_secrets.grafana_password.vault, inputs.execution_secrets.grafana_password.key)
            }}
          ORBIT_METRICS_ADDRESS: ${{ inputs.intent.metrics_fleet.metrics_address }}
- name: inspect-exporter-files
  dependsOn:
  - job: verify-existing-credential
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-files${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-files-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import stat

          v = json.loads(os.environ["ORBIT_EXPORTER_INTENT"])
          root = pathlib.Path("/")
          p = root / v["path"].lstrip("/")
          for parent in [*reversed([q for q in p.parents if q == root or root in q.parents]), p]:
              try:
                  st = parent.lstat()
              except FileNotFoundError:
                  continue
              if stat.S_ISLNK(st.st_mode) or st.st_uid != 0 or st.st_mode & 0o022:
                  raise SystemExit("metrics.exporter_configuration_ownership_drift")
              if parent != p and not stat.S_ISDIR(st.st_mode):
                  raise SystemExit("metrics.exporter_configuration_ownership_drift")
          content = None
          if p.exists():
              if not p.is_file() or p.stat().st_size > 65536:
                  raise SystemExit("metrics.exporter_configuration_ownership_drift")
              content = p.read_text()
              if not content.startswith(v["marker"]):
                  raise SystemExit("metrics.exporter_configuration_ownership_drift")
          print(json.dumps({"configuration": content}))
          PYTHON
        env: &id002
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_EXPORTER_BEFORE: ${{ steps["inspect-exporter-files" + self.item.key].outputs.stdout }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: inspect-exporter-service
  dependsOn:
  - job: inspect-exporter-files
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-service${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-service-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_EXPORTER_INTENT"])
          r = subprocess.run(
              ["/usr/bin/systemctl", "is-active", v["service"]],
              capture_output=True,
              text=True,
              check=False,
          )
          state = r.stdout.strip()
          if (r.returncode == 0 and state == "active") or (
              r.returncode in (1, 3, 4) and state in ("inactive", "failed", "unknown")
          ):
              print(json.dumps({"active": r.returncode == 0}))
          else:
              raise SystemExit("metrics.exporter_service_inspection_failed")
          PYTHON
        env: *id002
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: inspect-exporter-firewall
  dependsOn:
  - job: inspect-exporter-service
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-firewall${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-firewall-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import ipaddress
          import json
          import os
          import re
          import subprocess

          v = json.loads(os.environ["ORBIT_EXPORTER_INTENT"])
          r = subprocess.run(
              ["/usr/sbin/ufw", "status", "numbered"], capture_output=True, text=True, check=True
          )
          if not any(line.strip().lower() == "status: active" for line in r.stdout.splitlines()):
              raise SystemExit("metrics.exporter_firewall_inactive")
          source = None
          for line in r.stdout.splitlines():
              text, separator, comment = line.rpartition("#")
              if not separator or comment.strip() != v["comment"]:
                  continue
              match = re.fullmatch(r"\s*\[\s*[1-9][0-9]*\]\s+(.*)", text)
              if not match or source is not None:
                  raise SystemExit("metrics.exporter_firewall_ownership_drift")
              words = match.group(1).split()
              if len(words) == 7 and words[2:4] == ["on", "orbit"]:
                  words = words[:2] + words[4:] + words[2:4]
              if (
                  len(words) != 7
                  or words[0].removesuffix("/32") != v["address"]
                  or words[1] != v["port"] + "/tcp"
                  or words[2:4] != ["ALLOW", "IN"]
                  or words[5:] != ["on", "orbit"]
              ):
                  raise SystemExit("metrics.exporter_firewall_ownership_drift")
              source = str(ipaddress.IPv4Address(words[4].removesuffix("/32")))
          print(json.dumps({"source": source}))
          PYTHON
        env: *id002
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: inspect-fpm-exporter
  dependsOn:
  - job: inspect-exporter-firewall
    condition:
      type: succeeded
  steps:
  - name: inspect-fpm-exporter${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-fpm-exporter-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - <<'PYTHON'
          import json
          import pathlib
          import stat

          root = pathlib.Path("/")
          base = root / "etc/orbit/service-metrics"
          marker = base / ".orbit-owner"
          paths = [
              base / "fpm.yml",
              root / "etc/systemd/system/orbit-fpm-exporter.service",
              marker,
          ]
          state = {}
          for p in paths:
              for parent in [
                  *reversed([q for q in p.parents if q == root or root in q.parents]),
                  p,
              ]:
                  try:
                      st = parent.lstat()
                  except FileNotFoundError:
                      continue
                  if (
                      stat.S_ISLNK(st.st_mode)
                      or st.st_uid != 0
                      or st.st_mode & 0o022
                      or (parent != p and not stat.S_ISDIR(st.st_mode))
                  ):
                      raise SystemExit("metrics.service_ownership")
              if p.exists():
                  if (
                      not p.is_file()
                      or p.stat().st_size > 65536
                      or not p.read_text().startswith("# Managed by Orbit: service-metrics\n")
                  ):
                      raise SystemExit("metrics.service_ownership")
                  state[str(p.relative_to(root))] = p.read_text()
              else:
                  state[str(p.relative_to(root))] = None
          if base.exists() and (base.stat().st_mode & 0o077 or not marker.exists()):
              raise SystemExit("metrics.service_ownership")
          print(json.dumps({"files": state}))
          PYTHON
        env: &id004
          ORBIT_SERVICE_INTENT: ${{ self.item.json }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
- name: inspect-service-firewall
  dependsOn:
  - job: inspect-fpm-exporter
    condition:
      type: succeeded
  steps:
  - name: inspect-service-firewall${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-service-firewall-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - <<'PYTHON'
          import json
          import shlex
          import subprocess

          status = subprocess.run(
              ["/usr/sbin/ufw", "status"], capture_output=True, text=True, check=True
          )
          if not status.stdout.startswith("Status: active"):
              raise SystemExit("metrics.service_firewall_inactive")
          result = subprocess.run(
              ["/usr/sbin/ufw", "show", "added"], capture_output=True, text=True, check=True
          )
          rules = []
          seen = set()
          for line in result.stdout.splitlines():
              if "orbit:metrics-service-" not in line:
                  continue
              words = shlex.split(line)
              if not words or words.pop(0) != "ufw":
                  raise SystemExit("metrics.service_firewall_ownership_drift")
              if words[0] == "insert":
                  words = words[:0] + words[2:]
              if (
                  len(words) < 4
                  or words[0] not in ("allow", "deny")
                  or words[1:4] != ["in", "on", "orbit"]
              ):
                  raise SystemExit("metrics.service_firewall_ownership_drift")
              fields = dict(zip(words[4::2], words[5::2], strict=True))
              if words[0] == "deny" and "from" not in fields:
                  fields["from"] = "any"
              comment = fields.get("comment", "")
              if (
                  comment in seen
                  or len(fields) != 5
                  or set(fields) != {"proto", "from", "to", "port", "comment"}
              ):
                  raise SystemExit("metrics.service_firewall_ownership_drift")
              seen.add(comment)
              rules.append(
                  [
                      words[0],
                      "in",
                      "on",
                      "orbit",
                      "proto",
                      fields["proto"],
                      "from",
                      fields["from"],
                      "to",
                      fields["to"],
                      "port",
                      fields["port"],
                      "comment",
                      comment,
                  ]
              )
          print(json.dumps({"rules": rules}))
          PYTHON
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
- name: plan-service-rules
  dependsOn:
  - job: inspect-service-firewall
    condition:
      type: succeeded
  steps:
  - name: rule-plan
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/metrics-fleet-intent'
      behaviorName: ${{ "metrics-rules-" + string(inputs.operation_id) }}
      methodName: serviceRules
      inputs:
        intent: ${{ inputs.intent }}
        snapshots: ${{ steps.read.outputs.ids.map(id, {"node_id":id,"stdout":steps["inspect-service-firewall"+string(id)].outputs.stdout})
          }}
- name: install-node-exporter
  dependsOn:
  - job: plan-service-rules
    condition:
      type: succeeded
  steps:
  - name: install-node-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-install-node-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/apt-get -o DPkg::Lock::Timeout=60 install --yes --no-install-recommends -- prometheus-node-exporter
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "node_exporter" || !self.item.selected }}
- name: download-cadvisor
  dependsOn:
  - job: install-node-exporter
    condition:
      type: succeeded
  steps:
  - name: download-cadvisor${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-download-cadvisor-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 - <<'PYTHON'
          import os
          import pathlib
          import stat
          import urllib.request

          root = pathlib.Path("/")
          op = os.environ["ORBIT_OPERATION_ID"]
          if not op.isdecimal():
              raise SystemExit("metrics.input_invalid")
          p = root / ("run/orbit-metrics-cadvisor-" + op)
          fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
          with (
              os.fdopen(fd, "wb") as out,
              urllib.request.urlopen(
                  "https://github.com/google/cadvisor/releases/download/v0.60.5/cadvisor-v0.60.5-linux-amd64",
                  timeout=30,
              ) as response,
          ):
              st = os.fstat(out.fileno())
              if not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or st.st_mode & 0o077:
                  raise SystemExit("metrics.cadvisor_binary_ownership_drift")
              data = response.read(128 * 1024 * 1024 + 1)
              if len(data) > 128 * 1024 * 1024:
                  raise SystemExit("metrics.cadvisor_download_failed")
              out.write(data)
              out.flush()
              os.fsync(out.fileno())
          print('{"downloaded":true}')
          PYTHON
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || !self.item.selected }}
- name: verify-cadvisor-digest
  dependsOn:
  - job: download-cadvisor
    condition:
      type: succeeded
  steps:
  - name: verify-cadvisor-digest${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-cadvisor-digest-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import os
          import pathlib

          op = os.environ["ORBIT_OPERATION_ID"]
          if not op.isdecimal():
              raise SystemExit("metrics.input_invalid")
          p = pathlib.Path("/run/orbit-metrics-cadvisor-" + op)
          with p.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if digest != "6f258bed28113218c88729634c47ead8d928b81b1504b75fd911b98d29003a87":
              raise SystemExit("metrics.cadvisor_checksum_mismatch")
          print('{"verified":true}')
          PYTHON
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || !self.item.selected }}
- name: publish-cadvisor-binary
  dependsOn:
  - job: verify-cadvisor-digest
    condition:
      type: succeeded
  steps:
  - name: publish-cadvisor-binary${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-publish-cadvisor-binary-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import os
          import pathlib
          import stat
          import tempfile

          root = pathlib.Path("/")
          op = os.environ["ORBIT_OPERATION_ID"]
          if not op.isdecimal():
              raise SystemExit("metrics.input_invalid")
          source = root / ("run/orbit-metrics-cadvisor-" + op)
          path = root / "usr/local/bin/orbit-cadvisor"
          for p in [*reversed([q for q in path.parents if q == root or root in q.parents]), path]:
              try:
                  st = p.lstat()
              except FileNotFoundError:
                  continue
              if (
                  stat.S_ISLNK(st.st_mode)
                  or st.st_uid != 0
                  or st.st_mode & 0o022
                  or (p != path and not stat.S_ISDIR(st.st_mode))
              ):
                  raise SystemExit("metrics.cadvisor_binary_ownership_drift")
          data = source.read_bytes()
          if (
              hashlib.sha256(data).hexdigest()
              != "6f258bed28113218c88729634c47ead8d928b81b1504b75fd911b98d29003a87"
          ):
              raise SystemExit("metrics.cadvisor_checksum_mismatch")
          fd, temporary = tempfile.mkstemp(prefix=".orbit-cadvisor-", dir=path.parent)
          try:
              with os.fdopen(fd, "wb") as stream:
                  stream.write(data)
                  os.fchmod(stream.fileno(), 0o755)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary, path)
          finally:
              pathlib.Path(temporary).unlink(missing_ok=True)
          print('{"installed":true}')
          PYTHON
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || !self.item.selected }}
- name: stop-exporter
  dependsOn:
  - job: publish-cadvisor-binary
    condition:
      type: succeeded
  steps:
  - name: stop-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-stop-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_BEFORE,ORBIT_EXPORTER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_EXPORTER_INTENT"])
          # A missing unit is already stopped; never stop an unmanaged package service.
          r = subprocess.run(
              ["/usr/bin/systemctl", "show", "--property=LoadState", "--value", v["service"]],
              capture_output=True,
              text=True,
              check=True,
          )
          if (
              json.loads(os.environ["ORBIT_EXPORTER_BEFORE"])["configuration"] is not None
              and r.stdout.strip() != "not-found"
          ):
              subprocess.run(["/usr/bin/systemctl", "stop", v["service"]], check=True)
          PYTHON
        env: *id002
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.selected }}
- name: disable-exporter
  dependsOn:
  - job: stop-exporter
    condition:
      type: succeeded
  steps:
  - name: disable-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-disable-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_BEFORE,ORBIT_EXPORTER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

