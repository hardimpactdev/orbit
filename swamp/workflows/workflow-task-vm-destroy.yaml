id: a5dc9328-9812-4f24-9055-d874830f9bb7
name: task-vm-destroy
description: Revoke same-VM model access, delete the provider VM, then complete canonical Node cleanup
  on209.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: destroy
  labels: {role: swamp}
  steps:
  - name: plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: plan
      inputs:
        intent: ${{ inputs.intent }}
  - name: inspect
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: '${{ inputs.intent.provider == "upcloud" ? {"upcloud":inputs.execution_secrets.upcloud}
          : {} }}'
        action: inspect
    dependsOn:
    - step: plan
      condition:
        type: succeeded
  - name: stop
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: '${{ inputs.intent.provider == "upcloud" ? {"upcloud":inputs.execution_secrets.upcloud}
          : {} }}'
        action: stop
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    guard: ${{ !steps.inspect.outputs.result.running }}
  - name: model
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-model-revoke
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.model_intent }}
        execution_secrets: '${{ steps.plan.outputs.model_required ? {"model_key":inputs.execution_secrets.model_key,"model_router_management":inputs.execution_secrets.model_router_management,"model_router_anchor":inputs.execution_secrets.model_router_anchor}
          : {} }}'
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: stop
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !steps.plan.outputs.model_required }}
  - name: revoked
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: revocation
      inputs:
        intent: ${{ inputs.intent }}
        stdout: '${{ steps.plan.outputs.model_required ? steps.model.outputs.result.stdout : "" }}'
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: stop
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: model
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: delete
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: '${{ inputs.intent.provider == "upcloud" ? {"upcloud":inputs.execution_secrets.upcloud}
          : {} }}'
        action: delete
    dependsOn:
    - step: revoked
      condition:
        type: succeeded
  - name: seed-before
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "vm-seed-"+run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "vm-provider-" + run.id }}
        transport:
          kind: ssh
          user: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.user
            : "orbit" }}'
          port: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.port
            : 22 }}'
          identityFile: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.identity_file
            : "/unused-upcloud" }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.host
            : "127.0.0.1" }}'
          transport:
            hostKeys: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.host_keys
              : ["unused-upcloud"] }}'
      inputs:
        hosts: name:target
        argv: ${{ steps.plan.outputs.seed_observe_argv }}
        timeoutSec: 180
    dependsOn:
    - step: delete
      condition:
        type: succeeded
    guard: ${{ steps.plan.outputs.provider != "incus" }}
  - name: seed
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: seed
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps["seed-before"].outputs.stdout }}
    dependsOn:
    - step: seed-before
      condition:
        type: succeeded
    guard: ${{ steps.plan.outputs.provider != "incus" }}
  - name: seed-delete
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "vm-seed-"+run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: ${{ steps.plan.outputs.seed_delete_argv }}
        timeoutSec: 180
    dependsOn:
    - step: seed
      condition:
        type: succeeded
    guard: ${{ steps.plan.outputs.provider != "incus" || !steps.seed.outputs.present }}
  - name: seed-after
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "vm-seed-"+run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: ${{ steps.plan.outputs.seed_observe_argv }}
        timeoutSec: 180
    dependsOn:
    - step: seed
      condition:
        type: succeeded
    - step: seed-delete
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.plan.outputs.provider != "incus" }}
  - name: cleanup
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: operation-node-remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.removal }}
        execution_secrets: {}
    dependsOn:
    - step: delete
      condition:
        type: succeeded
    - step: seed-after
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !steps.plan.outputs.node_present }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: terminal
      inputs:
        intent: ${{ inputs.intent }}
        provider: ${{ steps.delete.outputs.result }}
        removal_stdout: '${{ steps.plan.outputs.node_present ? steps.cleanup.outputs.result.stdout : ""
          }}'
        seed_stdout: '${{ inputs.intent.provider == "incus" ? steps["seed-after"].outputs.stdout : ""
          }}'
    dependsOn:
    - step: delete
      condition:
        type: succeeded
    - step: cleanup
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: seed-after
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
