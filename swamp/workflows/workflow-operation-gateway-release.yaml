id: 1e788227-08e7-4c2a-b926-94a77a0edafa
name: operation-gateway-release
description: Build, migrate and load one Gateway release on the Gateway Node, then hand over to it from the new commit's own definition.
# Chart: docs/cli/gateway/release-deploy.mmd. The legacy runner's sequence (docs/reference/gateway-recovery.md#deploy-a-release):
# prepare, guard, configuration, snapshot, migrate, swamp, then the promoter in the child run.
queueTimeout: 120
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: gateway.release}
    intent:
      type: object
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        id: {type: string, pattern: '^[a-f0-9]{12}$'}
        force: {type: boolean}
        previous: {type: string, pattern: '^[a-f0-9]{12}$'}
        repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
        manifest: {type: string, minLength: 2}
        web:
          type: object
          properties:
            artifact_id: {type: integer, minimum: 1}
            size: {type: integer, minimum: 1}
            digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
          required: [artifact_id, size, digest]
          additionalProperties: false
        horizon_unit: {type: string, pattern: '^$|^[A-Za-z0-9@_.-]+\.service$'}
        horizon_drain_seconds: {type: integer, minimum: 1, maximum: 3600}
        keep: {type: integer, minimum: 2, maximum: 20}
        ssh: {type: object}
        swamp_ssh: {type: object}
      required: [sha, id, force, previous, repository, manifest, web, horizon_unit, horizon_drain_seconds, keep, ssh, swamp_ssh]
      additionalProperties: false
    # Names only: one scoped GitHub token (contents and actions read) the Gateway minted at run start.
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^gateway-release-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [github_token]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: intent
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          umask 077
          printf %s "$ORBIT_VALUE" > "$ORBIT_RUN/secret-github_token"
          timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ORBIT_KIND: '${{ inputs.kind }}',
          ORBIT_VALUE: '${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}'}
  dependsOn:
  - {job: intent, condition: {type: succeeded}}
- name: release
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: {type: succeeded}}
  steps:
    # Fetches the commit into the shared repository when it is not there yet (the token reaches git through a private file), clones it, links the shared env and storage, installs the dependencies, writes the agent manifest and seals the release with
    # REVISION and a cached configuration. A sealed release of the commit is reused. Prints the release's rendered Swamp grants.
  - name: Build the release
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-build-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 2730 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags fetch,build "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2 && cat "$ORBIT_RUN/grants"
        env: &ansible {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{
            steps["Write the intent"].outputs.assets + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null
              -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}', ANSIBLE_FORCE_COLOR: '0'}
    # The web build of the commit from its CI artifact, checked against the artifact digest and extracted with safe names only.
  - name: Install the web build
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Build the release, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-web-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags web "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2
        env: *ansible
    # Runs beside the web build. VACUUM INTO a private copy before any migration; the newest three stay, and the one a pause names. Prints its path.
  - name: Snapshot the database
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Build the release, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-snapshot-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags snapshot "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2 && cat "$ORBIT_RUN/snapshot"
        env: *ansible
    # Always runs, as the legacy runner; from here a failure pauses automatic releases with the old release live.
  - name: Migrate
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Snapshot the database, condition: {type: succeeded}}, {step: Install the web build, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-migrate-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "gateway-release-ssh-" + string(inputs.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        timeoutSec: 960
        argv: [/usr/bin/timeout, '900', /bin/sh, -c, 'cd "/home/orbit/releases/$1/apps/gateway" && exec php8.5 artisan migrate --force --isolated --no-interaction', sh, '${{ inputs.intent.id }}']
  - name: Load Swamp on Node 209
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Migrate, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: operation-gateway-swamp-load
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: 209
        kind: gateway.swamp_load
        intent:
          sha: ${{ inputs.intent.sha }}
          grants:
            grants/orbit-gateway.yaml: '${{ steps["Build the release"].outputs.stdout.split("---\n")[0] }}'
            grants/orbit-serve.yaml: '${{ steps["Build the release"].outputs.stdout.split("---\n")[1] }}'
          ssh: ${{ inputs.intent.swamp_ssh }}
        execution_secrets: {}
    # Serve now holds the new commit's definitions, so the switch and handoff run from the release they install.
  - name: Hand over the release
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Load Swamp on Node 209, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: gateway-release-activate
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: gateway.release
        intent:
          sha: ${{ inputs.intent.sha }}
          id: ${{ inputs.intent.id }}
          previous: ${{ inputs.intent.previous }}
          horizon_unit: ${{ inputs.intent.horizon_unit }}
          horizon_drain_seconds: ${{ inputs.intent.horizon_drain_seconds }}
          keep: ${{ inputs.intent.keep }}
          ssh: ${{ inputs.intent.ssh }}
    # A failed load or hand-over leaves Swamp on the new commit while the Gateway runs the old one: the next two steps load the previous
    # commit back.
  - name: Render the previous grants
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: Load Swamp on Node 209, condition: {type: or, conditions: [{type: failed}, {type: succeeded}]}}, {step: Hand over the release, condition: {type: or, conditions: [{type: failed}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-previous-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags previous "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2 && cat "$ORBIT_RUN/previous"
        env: *ansible
  - name: Restore Swamp on Node 209
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: Render the previous grants, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: operation-gateway-swamp-load
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: 209
        kind: gateway.swamp_load
        intent:
          sha: ${{ steps["Render the previous grants"].outputs.stdout.split("---\n")[0] }}
          restore: true
          grants:
            grants/orbit-gateway.yaml: '${{ steps["Render the previous grants"].outputs.stdout.split("---\n")[1] }}'
            grants/orbit-serve.yaml: '${{ steps["Render the previous grants"].outputs.stdout.split("---\n")[2] }}'
          ssh: ${{ inputs.intent.swamp_ssh }}
        execution_secrets: {}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: intent, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: input, condition: *settled}
  - {job: release, condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
