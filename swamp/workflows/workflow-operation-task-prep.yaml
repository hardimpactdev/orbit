id: f4f30f87-85e7-49d5-80be-d3bca90132ab
name: operation-task-prep
description: >-
  Prepare one command (stage 1 of the command development pipeline) in one run from full inputs on 209: the existing
  provision, turn and publish workflows as children, a bounded review loop, and a draft pull request. No step calls the
  Gateway.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: tasks.prep}
    intent:
      type: object
      properties:
        provision: {type: object}
        draft: {type: object}
        fix: {type: object}
        reviews: {type: array, minItems: 3, maxItems: 3, items: {type: object}}
        publish: {type: object}
        plan: {type: object}
      required: [provision, draft, fix, reviews, publish, plan]
      additionalProperties: false
    execution_secrets:
      type: object
      # The slot's identity, which the start writes onto the new VM; and the claim: the Pi token and the models file with the
      # fixed model key.
      properties:
        wireguard: &secret
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^(task-vm-slot-(wireguard|ssh-host|agent)-[1-9][0-9]*)$'}
          required: [vault, key]
          additionalProperties: false
        ssh_host: *secret
        agent_secret: *secret
        claim:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-pi-claim-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
        # The claim's Pi token, which every turn of the prep reads.
        pi_token:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-pi-token-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [wireguard, ssh_host, agent_secret, claim, pi_token]
      additionalProperties: false
    publish_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-publish-token-[a-f0-9-]{36}$'}
          required: [vault, key]
          additionalProperties: false
        git_authorization:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-publish-token-[a-f0-9-]{36}$'}
          required: [vault, key]
          additionalProperties: false
      required: [github_token, git_authorization]
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - publish_secrets
  additionalProperties: false
jobs:
- name: prep
  labels: {role: swamp}
  steps:
  - name: Claim a slot
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: operation-task-provision
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: tasks.provision
        intent: ${{ inputs.intent.provision }}
        execution_secrets: '${{ {"wireguard": inputs.execution_secrets.wireguard, "ssh_host": inputs.execution_secrets.ssh_host,
          "agent_secret": inputs.execution_secrets.agent_secret,
          "claim": inputs.execution_secrets.claim} }}'
  - name: Draft the spec
    labels: {role: swamp}
    dependsOn:
    - step: Claim a slot
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: operation-task-turn
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.intent.draft.node_id }}'
        kind: tasks.turn
        turn_key: '${{ "prep-" + string(inputs.operation_id) + "-draft" }}'
        intent: '${{ inputs.intent.draft }}'
        execution_secrets: '${{ {"pi_token": inputs.execution_secrets.pi_token} }}'
  - name: Read the draft
    labels: {role: swamp}
    dependsOn:
    - step: Draft the spec
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-prep-read-the-draft-" + string(inputs.intent.publish.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: outcome
      inputs:
        result_json: ${{ steps["Draft the spec"].outputs.shape_result.result_json }}
  - name: Check the draft
    labels: {role: swamp}
    dependsOn:
    - step: Read the draft
      condition:
        type: succeeded
    task: {type: assert, expr: 'steps["Read the draft"].outputs.moved', severity: high, message: tasks.prep_not_committed}
  - name: Plan the cases 0
    labels: {role: swamp}
    dependsOn:
    - step: Check the draft
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "task-prep-plan-" + string(inputs.intent.draft.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "task-prep-plan-" + string(inputs.intent.draft.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.draft.ssh_execution.target.user }}
          port: ${{ inputs.intent.draft.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.draft.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.draft.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.draft.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        # The runner prints a refusal on stderr and exits 3; 0 and 3 are both answers, anything else fails the run.
        argv: '${{ ["timeout", "60", "env", "-C", inputs.intent.draft.checkout_path, "python3", "swamp/proof/runner/runner.py", "plan", "--file", inputs.intent.plan.cases_file] }}'
        okExitCodes: [0, 3]
        timeoutSec: 70
  - name: Review the spec 1
    labels: {role: swamp}
    dependsOn:
    - step: Plan the cases 0
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: operation-task-turn
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.intent.reviews[0].node_id }}'
        kind: tasks.turn
        turn_key: '${{ "prep-" + string(inputs.operation_id) + "-review-1" }}'
        intent: '${{ inputs.intent.reviews[0] }}'
        execution_secrets: '${{ {"pi_token": inputs.execution_secrets.pi_token} }}'
        candidate: '${{ steps["Read the draft"].outputs.head }}'
  - name: Settle review 1
    labels: {role: swamp}
    dependsOn:
    - step: Review the spec 1
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    - step: Plan the cases 0
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-prep-settle-review-1-" + string(inputs.intent.publish.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: settle
      inputs:
        approved: '${{ steps["Read the draft"].outputs.approved }}'
        head: '${{ steps["Read the draft"].outputs.head }}'
        tree: '${{ steps["Read the draft"].outputs.tree }}'
        review: '${{ ("Review the spec 1" in steps && "outputs" in steps["Review the spec 1"] && "shape_result" in steps["Review the spec 1"].outputs) ? steps["Review the spec 1"].outputs.shape_result.result_json : "" }}'
        fix: ''
        plan_exit: '${{ ("Plan the cases 0" in steps && "outputs" in steps["Plan the cases 0"] && "exitCode" in steps["Plan the cases 0"].outputs) ? steps["Plan the cases 0"].outputs.exitCode : 0 }}'
        plan_output: '${{ ("Plan the cases 0" in steps && "outputs" in steps["Plan the cases 0"] && "stderr" in steps["Plan the cases 0"].outputs) ? steps["Plan the cases 0"].outputs.stdout + steps["Plan the cases 0"].outputs.stderr : "" }}'
  - name: Fix the findings 1
    labels: {role: swamp}
    guard: '${{ steps["Settle review 1"].outputs.approved }}'
    dependsOn:
    - step: Settle review 1
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: operation-task-turn
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.intent.fix.node_id }}'
        kind: tasks.turn
        turn_key: '${{ "prep-" + string(inputs.operation_id) + "-fix-1" }}'
        intent: '${{ inputs.intent.fix }}'
        execution_secrets: '${{ {"pi_token": inputs.execution_secrets.pi_token} }}'
        prompt_append: '${{ steps["Settle review 1"].outputs.findings }}'
  - name: Settle fix 1
    labels: {role: swamp}
    dependsOn:
    - step: Fix the findings 1
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-prep-settle-fix-1-" + string(inputs.intent.publish.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: settle
      inputs:
        approved: '${{ steps["Settle review 1"].outputs.approved }}'
        head: '${{ steps["Settle review 1"].outputs.head }}'
        tree: '${{ steps["Settle review 1"].outputs.tree }}'
        review: ''
        fix: '${{ ("Fix the findings 1" in steps && "outputs" in steps["Fix the findings 1"] && "shape_result" in steps["Fix the findings 1"].outputs) ? steps["Fix the findings 1"].outputs.shape_result.result_json : "" }}'
  - name: Plan the cases 1
    labels: {role: swamp}
    guard: '${{ steps["Settle fix 1"].outputs.approved }}'
    dependsOn:
    - step: Settle fix 1
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "task-prep-plan-" + string(inputs.intent.draft.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "task-prep-plan-" + string(inputs.intent.draft.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.draft.ssh_execution.target.user }}
          port: ${{ inputs.intent.draft.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.draft.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.draft.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.draft.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        # The runner prints a refusal on stderr and exits 3; 0 and 3 are both answers, anything else fails the run.
        argv: '${{ ["timeout", "60", "env", "-C", inputs.intent.draft.checkout_path, "python3", "swamp/proof/runner/runner.py", "plan", "--file", inputs.intent.plan.cases_file] }}'
        okExitCodes: [0, 3]
        timeoutSec: 70
  - name: Review the spec 2
    labels: {role: swamp}
    guard: '${{ steps["Settle fix 1"].outputs.approved }}'
    dependsOn:
    - step: Settle fix 1
      condition:
        type: succeeded
    - step: Plan the cases 1
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: workflow
      workflowIdOrName: operation-task-turn
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.intent.reviews[1].node_id }}'
        kind: tasks.turn
        turn_key: '${{ "prep-" + string(inputs.operation_id) + "-review-2" }}'
        intent: '${{ inputs.intent.reviews[1] }}'
        execution_secrets: '${{ {"pi_token": inputs.execution_secrets.pi_token} }}'
        candidate: '${{ steps["Settle fix 1"].outputs.head }}'
        prompt_append: '${{ "Findings of the previous review, which the author has since tried to fix. Check each one and report only what is still wrong or new:\n" + steps["Settle review 1"].outputs.findings }}'
  - name: Settle review 2
    labels: {role: swamp}
    dependsOn:
    - step: Review the spec 2
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    - step: Plan the cases 1
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-prep-settle-review-2-" + string(inputs.intent.publish.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: settle
      inputs:
        approved: '${{ steps["Settle fix 1"].outputs.approved }}'
        head: '${{ steps["Settle fix 1"].outputs.head }}'
        tree: '${{ steps["Settle fix 1"].outputs.tree }}'
        review: '${{ ("Review the spec 2" in steps && "outputs" in steps["Review the spec 2"] && "shape_result" in steps["Review the spec 2"].outputs) ? steps["Review the spec 2"].outputs.shape_result.result_json : "" }}'
        fix: ''
        plan_exit: '${{ ("Plan the cases 1" in steps && "outputs" in steps["Plan the cases 1"] && "exitCode" in steps["Plan the cases 1"].outputs) ? steps["Plan the cases 1"].outputs.exitCode : 0 }}'
        plan_output: '${{ ("Plan the cases 1" in steps && "outputs" in steps["Plan the cases 1"] && "stderr" in steps["Plan the cases 1"].outputs) ? steps["Plan the cases 1"].outputs.stdout + steps["Plan the cases 1"].outputs.stderr : "" }}'
  - name: Fix the findings 2
    labels: {role: swamp}
    guard: '${{ steps["Settle review 2"].outputs.approved }}'
    dependsOn:
    - step: Settle review 2
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: operation-task-turn
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.intent.fix.node_id }}'
        kind: tasks.turn
        turn_key: '${{ "prep-" + string(inputs.operation_id) + "-fix-2" }}'
        intent: '${{ inputs.intent.fix }}'
        execution_secrets: '${{ {"pi_token": inputs.execution_secrets.pi_token} }}'
        prompt_append: '${{ steps["Settle review 2"].outputs.findings }}'
  - name: Settle fix 2
    labels: {role: swamp}
    dependsOn:
    - step: Fix the findings 2
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-prep-settle-fix-2-" + string(inputs.intent.publish.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: settle
      inputs:
        approved: '${{ steps["Settle review 2"].outputs.approved }}'
        head: '${{ steps["Settle review 2"].outputs.head }}'
        tree: '${{ steps["Settle review 2"].outputs.tree }}'
        review: ''
        fix: '${{ ("Fix the findings 2" in steps && "outputs" in steps["Fix the findings 2"] && "shape_result" in steps["Fix the findings 2"].outputs) ? steps["Fix the findings 2"].outputs.shape_result.result_json : "" }}'
  - name: Plan the cases 2
    labels: {role: swamp}
    guard: '${{ steps["Settle fix 2"].outputs.approved }}'
    dependsOn:
    - step: Settle fix 2
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "task-prep-plan-" + string(inputs.intent.draft.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "task-prep-plan-" + string(inputs.intent.draft.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.draft.ssh_execution.target.user }}
          port: ${{ inputs.intent.draft.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.draft.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.draft.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.draft.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        # The runner prints a refusal on stderr and exits 3; 0 and 3 are both answers, anything else fails the run.
        argv: '${{ ["timeout", "60", "env", "-C", inputs.intent.draft.checkout_path, "python3", "swamp/proof/runner/runner.py", "plan", "--file", inputs.intent.plan.cases_file] }}'
        okExitCodes: [0, 3]
        timeoutSec: 70
  - name: Review the spec 3
    labels: {role: swamp}
    guard: '${{ steps["Settle fix 2"].outputs.approved }}'
    dependsOn:
    - step: Settle fix 2
      condition:
        type: succeeded
    - step: Plan the cases 2
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: workflow
      workflowIdOrName: operation-task-turn
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.intent.reviews[2].node_id }}'
        kind: tasks.turn
        turn_key: '${{ "prep-" + string(inputs.operation_id) + "-review-3" }}'
        intent: '${{ inputs.intent.reviews[2] }}'
        execution_secrets: '${{ {"pi_token": inputs.execution_secrets.pi_token} }}'
        candidate: '${{ steps["Settle fix 2"].outputs.head }}'
        prompt_append: '${{ "Findings of the previous review, which the author has since tried to fix. Check each one and report only what is still wrong or new:\n" + steps["Settle review 2"].outputs.findings }}'
  - name: Settle review 3
    labels: {role: swamp}
    dependsOn:
    - step: Review the spec 3
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    - step: Plan the cases 2
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-prep-settle-review-3-" + string(inputs.intent.publish.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: settle
      inputs:
        approved: '${{ steps["Settle fix 2"].outputs.approved }}'
        head: '${{ steps["Settle fix 2"].outputs.head }}'
        tree: '${{ steps["Settle fix 2"].outputs.tree }}'
        review: '${{ ("Review the spec 3" in steps && "outputs" in steps["Review the spec 3"] && "shape_result" in steps["Review the spec 3"].outputs) ? steps["Review the spec 3"].outputs.shape_result.result_json : "" }}'
        fix: ''
        plan_exit: '${{ ("Plan the cases 2" in steps && "outputs" in steps["Plan the cases 2"] && "exitCode" in steps["Plan the cases 2"].outputs) ? steps["Plan the cases 2"].outputs.exitCode : 0 }}'
        plan_output: '${{ ("Plan the cases 2" in steps && "outputs" in steps["Plan the cases 2"] && "stderr" in steps["Plan the cases 2"].outputs) ? steps["Plan the cases 2"].outputs.stdout + steps["Plan the cases 2"].outputs.stderr : "" }}'
  - name: Review has no findings
    labels: {role: swamp}
    dependsOn:
    - step: Settle review 3
      condition:
        type: succeeded
    task: {type: assert, expr: 'steps["Settle review 3"].outputs.approved', severity: high, message: tasks.prep_review_unresolved}
  - name: Open a draft PR
    labels: {role: swamp}
    dependsOn:
    - step: Review has no findings
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: operation-task-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.intent.publish.node_id }}
        kind: tasks.publish
        intent:
          group_id: ${{ inputs.intent.publish.group_id }}
          instance_id: ${{ inputs.intent.publish.instance_id }}
          node_id: ${{ inputs.intent.publish.node_id }}
          check: null
          checkout_path: ${{ inputs.intent.publish.checkout_path }}
          commit: ${{ steps["Settle review 3"].outputs.head }}
          tree: ${{ steps["Settle review 3"].outputs.tree }}
          repository: ${{ inputs.intent.publish.repository }}
          base: ${{ inputs.intent.publish.base }}
          branch: ${{ inputs.intent.publish.branch }}
          remote: ${{ inputs.intent.publish.remote }}
          refspec: '${{ steps["Settle review 3"].outputs.head + ":refs/heads/" + inputs.intent.publish.branch }}'
          object_format: '${{ size(steps["Settle review 3"].outputs.head) == 64 ? "sha256" : "sha1" }}'
          pull_head: ${{ inputs.intent.publish.pull_head }}
          pull_request: ${{ inputs.intent.publish.pull_request }}
          ssh_execution: ${{ inputs.intent.publish.ssh_execution }}
        run_id: ${{ run.id }}
        execution_secrets: '${{ {"github_token": inputs.publish_secrets.github_token, "git_authorization": inputs.publish_secrets.git_authorization} }}'
