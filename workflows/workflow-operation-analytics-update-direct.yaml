id: 04baf3d5-926d-4d03-8157-e1302a08360c
name: operation-analytics-update-direct
description: Update the pinned Plausible image under one native Node scope.
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [analytics.update] }
  required: [operation_id, node_id, kind]
jobs:
  - name: node
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: { node: '${{ string(inputs.node_id) }}' }
    writes: true
    steps:
      - name: apply
        task:
          type: behavior
          behaviorType: "@nckrtl/analytics-update-direct"
          behaviorName: '${{ "analytics-runtime-node-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
