id: a7839446-4acb-4e72-b82f-d188f108a1fc
name: operation-route-caddy
description: Publish one full public Caddy snapshot as placed shell actions, retaining the actual composing parent identity.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_.-]+$
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        caddy_publication:
          type: object
      required:
      - caddy_publication
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
  labels: &id001
    node: ${{ string(inputs.intent.caddy_publication.node_id) }}
  steps:
  - name: input
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/caddy-public-input'
      behaviorName: ${{ "caddy-input-" + string(inputs.operation_id) }}
      methodName: prepare
      inputs:
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        publication: ${{ inputs.intent.caddy_publication }}
        target_node_id: ${{ inputs.intent.caddy_publication.node_id }}
- name: observation
  target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
  labels: *id001
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  steps:
  - name: observe-host
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-observe-host-" + string(inputs.intent.caddy_publication.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_OBSERVED,ORBIT_CADDY_OUTCOME /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import ipaddress
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          def service_state(action, inactive):
              reply = subprocess.run(
                  ["/usr/bin/systemctl", action, "--quiet", "caddy"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=35,
              )
              if reply.returncode not in (0, inactive) and not (reply.returncode == 4 and meta["unserved"] and not Path("/usr/bin/caddy").is_file()):
                  raise SystemExit("caddy.service_state_unavailable")
              return reply.returncode == 0


          live = root / "Caddyfile"
          prior_digest = hashlib.sha256(live.read_bytes()).hexdigest() if live.is_file() else None
          active = service_state("is-active", 3)
          enabled = service_state("is-enabled", 1)
          missing = not Path("/usr/bin/caddy").is_file()
          withdraw = meta["unserved"] and missing and not active
          if missing and not withdraw:
              raise SystemExit("caddy.release_missing")
          if not withdraw:
              reply = subprocess.run(
                  ["/usr/bin/caddy", "version"], check=False, capture_output=True, timeout=35
              )
              match = re.match(rb"v?(\d+)\.(\d+)\.(\d+)(?:[-+\s]|$)", reply.stdout)
              if (
                  reply.returncode != 0
                  or not match
                  or tuple(map(int, match.groups())) < (2, 9, 0)
              ):
                  raise SystemExit("caddy.release_invalid")
              reply = subprocess.run(
                  ["/usr/sbin/ip", "-o", "-4", "addr", "show"],
                  check=False,
                  capture_output=True,
                  timeout=35,
              )
              if reply.returncode:
                  raise SystemExit("caddy.addresses_unavailable")
              addresses = {
                  line.split()[3].split("/")[0]
                  for line in reply.stdout.decode().splitlines()
                  if len(line.split()) > 3
              }
              if any(
                  str(ipaddress.IPv4Address(address)) not in addresses
                  for address in meta["listen_addresses"]
              ):
                  raise SystemExit("caddy.address_missing")
          unchanged = prior_digest == meta["sha256"]
          print(
              json.dumps(
                  {
                      "prior_digest": prior_digest,
                      "unchanged": unchanged,
                      "publish": not withdraw and not unchanged,
                      "withdraw": withdraw,
                      "active": active,
                      "enabled": enabled,
                  }
              )
          )
          PYTHON
        env: &id005
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
  - name: observation
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    dependsOn:
    - step: observe-host
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/caddy-public-input'
      behaviorName: ${{ "caddy-observation-" + string(inputs.operation_id) }}
      methodName: observe
      inputs:
        stdout: ${{ steps["observe-host"].outputs.stdout }}
- name: publication
  target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
  labels: &id002
    node: ${{ string(inputs.intent.caddy_publication.node_id) }}
  steps:
  - name: prepare-candidate
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-prepare-candidate-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import grp
          import json
          import os
          import stat
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          gid = grp.getgrnam("caddy").gr_gid
          for directory in (root / ".orbit-staging", stage):
              directory.mkdir(mode=0o750, exist_ok=True)
              info = directory.lstat()
              if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0:
                  raise SystemExit("caddy.candidate_unsafe")
              os.chown(directory, 0, gid)
              directory.chmod(0o750)
          path = stage / "Caddyfile"
          try:
              descriptor = os.open(
                  path, os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_RDWR, 0o640
              )
          except FileExistsError:
              descriptor = os.open(path, os.O_NOFOLLOW | os.O_RDWR)
          with os.fdopen(descriptor, "r+b") as output:
              info = os.fstat(output.fileno())
              if not stat.S_ISREG(info.st_mode) or info.st_uid != 0:
                  raise SystemExit("caddy.candidate_unsafe")
              output.truncate(meta["content_bytes"])
              os.fchown(output.fileno(), 0, gid)
              os.fchmod(output.fileno(), 0o640)
          print('{"prepared":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
    guard: ${{ !steps.observation.outputs.publish }}
    dependsOn: []
  - name: write-chunk
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn:
    - step: prepare-candidate
      condition:
        type: succeeded
    forEach:
      item: chunk
      in: ${{ steps.input.outputs.chunks }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-write-chunk-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import base64
          import json
          import os
          import stat
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          chunk = json.loads(os.environ["ORBIT_CADDY_CHUNK"])
          value = base64.b64decode(chunk["data"], validate=True)
          if chunk["offset"] < 0 or chunk["offset"] + len(value) > meta["content_bytes"]:
              raise SystemExit("caddy.chunk_invalid")
          descriptor = os.open(stage / "Caddyfile", os.O_NOFOLLOW | os.O_RDWR)
          with os.fdopen(descriptor, "r+b") as output:
              info = os.fstat(output.fileno())
              if (
                  not stat.S_ISREG(info.st_mode)
                  or info.st_uid != 0
                  or info.st_size != meta["content_bytes"]
              ):
                  raise SystemExit("caddy.candidate_unsafe")
              output.seek(chunk["offset"])
              output.write(value)
              output.flush()
          print('{"written":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
          ORBIT_CADDY_CHUNK: ${{ self.chunk.json }}
    guard: ${{ !steps.observation.outputs.publish }}
  - name: inspect-candidate
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn:
    - step: write-chunk
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-inspect-candidate-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          content = (stage / "Caddyfile").read_bytes()
          if hashlib.sha256(content).hexdigest() != meta["sha256"]:
              raise SystemExit("caddy.candidate_changed")
          print('{"verified":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
    guard: ${{ !steps.observation.outputs.publish }}
  - name: validate-candidate
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn:
    - step: inspect-candidate
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-validate-candidate-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          reply = subprocess.run(
              [
                  "/usr/sbin/runuser",
                  "-u",
                  "caddy",
                  "--",
                  "/usr/bin/caddy",
                  "validate",
                  "--config",
                  str(stage / "Caddyfile"),
                  "--adapter",
                  "caddyfile",
              ],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              timeout=35,
          )
          if reply.returncode:
              raise SystemExit("caddy.validation_failed")
          print('{"validated":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
    guard: ${{ !steps.observation.outputs.publish }}
  - name: activate-config
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn:
    - step: validate-candidate
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-activate-config-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import grp
          import hashlib
          import json
          import os
          import shutil
          import stat
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]

          observed = json.loads(os.environ["ORBIT_CADDY_OBSERVED"])
          live = root / "Caddyfile"
          current = hashlib.sha256(live.read_bytes()).hexdigest() if live.is_file() else None
          if current != observed["prior_digest"]:
              raise SystemExit("caddy.publication_stale")
          state_path = stage / "restore.json"
          prior = stage / "prior"
          if not state_path.is_file():
              existed = live.exists() or live.is_symlink()
              if existed:
                  if live.is_symlink():
                      prior.symlink_to(os.readlink(live))
                  elif stat.S_ISREG(live.lstat().st_mode):
                      shutil.copy2(live, prior)
                  else:
                      raise SystemExit("caddy.live_unsafe")
              state_path.write_text(
                  json.dumps(
                      {
                          "had_live": existed,
                          "previous_target": os.readlink(live) if live.is_symlink() else None,
                          "active": observed["active"],
                          "enabled": observed["enabled"],
                      }
                  )
              )
          gid = grp.getgrnam("caddy").gr_gid
          versions = root / "orbit-versions"
          versions.mkdir(mode=0o750, exist_ok=True)
          if not stat.S_ISDIR(versions.lstat().st_mode) or versions.lstat().st_uid != 0:
              raise SystemExit("caddy.versions_unsafe")
          os.chown(versions, 0, gid)
          versions.chmod(0o750)
          published = versions / (meta["version"] + "-" + meta["run_id"])
          published.mkdir(mode=0o750, exist_ok=True)
          if not stat.S_ISDIR(published.lstat().st_mode) or published.lstat().st_uid != 0:
              raise SystemExit("caddy.generation_unsafe")
          os.chown(published, 0, gid)
          published.chmod(0o750)
          path = published / "Caddyfile"
          if path.exists() or path.is_symlink():
              if (
                  path.is_symlink()
                  or not path.is_file()
                  or hashlib.sha256(path.read_bytes()).hexdigest() != meta["sha256"]
              ):
                  raise SystemExit("caddy.generation_changed")
          else:
              shutil.copy2(stage / "Caddyfile", path)
              os.chown(path, 0, gid)
              path.chmod(0o640)
          link = stage / "next"
          link.unlink(missing_ok=True)
          link.symlink_to(path)
          os.replace(link, live)
          print(json.dumps({"result": "published", "version": meta["version"]}))
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
          ORBIT_CADDY_OBSERVED: ${{ steps["observe-host"].outputs.stdout }}
    guard: ${{ !steps.observation.outputs.publish }}
  - name: enable-service
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn:
    - step: activate-config
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-enable-service-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          reply = subprocess.run(
              ["/usr/bin/systemctl", "enable", "--quiet", "caddy"],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              timeout=35,
          )
          if reply.returncode:
              raise SystemExit("caddy.enable_failed")
          print('{"enabled":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
    guard: ${{ !steps.observation.outputs.publish }}
  - name: reload-service
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn:
    - step: enable-service
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-reload-service-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          reply = subprocess.run(
              ["/usr/bin/systemctl", "reload-or-restart", "caddy"],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              timeout=35,
          )
          if reply.returncode:
              raise SystemExit("caddy.reload_failed")
          print('{"reloaded":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
    guard: ${{ !steps.observation.outputs.publish }}
  - name: withdraw-unserved
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    guard: ${{ !steps.observation.outputs.withdraw }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-withdraw-unserved-" + string(inputs.intent.caddy_publication.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_OBSERVED,ORBIT_CADDY_OUTCOME /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          observed = json.loads(os.environ["ORBIT_CADDY_OBSERVED"])
          live = root / "Caddyfile"
          current = hashlib.sha256(live.read_bytes()).hexdigest() if live.is_file() else None
          if current != observed["prior_digest"]:
              raise SystemExit("caddy.publication_stale")
          if (live.exists() or live.is_symlink()) and current != meta["sha256"]:
              backup = root / "orbit-backups" / meta["run_id"]
              backup.mkdir(mode=0o700, parents=True, exist_ok=False)
              live.rename(backup / "Caddyfile")
          print('{"result":"unchanged"}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
          ORBIT_CADDY_OBSERVED: ${{ steps["observe-host"].outputs.stdout }}
  - name: clean-published-candidates
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    dependsOn:
    - step: reload-service
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-cleanup-" + string(inputs.intent.caddy_publication.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import shutil
          import stat
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          if stage.is_dir():
              (stage / "complete.json").write_text('{"completed":true}')
          live = root / "Caddyfile"
          active = live.resolve() if live.is_file() else None
          versions = root / "orbit-versions"
          if versions.is_dir():
              entries = [
                  entry
                  for entry in versions.iterdir()
                  if not entry.is_symlink() and entry.is_dir() and (entry / "Caddyfile").is_file()
              ]
              entries.sort(key=lambda entry: entry.stat().st_mtime_ns, reverse=True)
              previous = [entry for entry in entries if active is None or active.parent != entry]
              for entry in previous[9:]:
                  content = entry / "Caddyfile"
                  if hashlib.sha256(content.read_bytes()).hexdigest()[:32] != entry.name[:32]:
                      backup = root / "orbit-backups" / ("edited-" + entry.name)
                      backup.parent.mkdir(mode=0o700, exist_ok=True)
                      if backup.exists():
                          raise SystemExit("caddy.backup_conflict")
                      entry.rename(backup)
                  else:
                      shutil.rmtree(entry)
          staging = root / ".orbit-staging"
          if staging.is_dir():
              completed = [
                  entry
                  for entry in staging.iterdir()
                  if not entry.is_symlink()
                  and entry.is_dir()
                  and (entry / "complete.json").is_file()
              ]
              completed.sort(key=lambda entry: entry.stat().st_mtime_ns, reverse=True)
              for entry in completed[10:]:
                  if entry == stage:
                      continue
                  if not stat.S_ISDIR(entry.lstat().st_mode) or entry.lstat().st_uid != 0:
                      raise SystemExit("caddy.cleanup_unsafe")
                  shutil.rmtree(entry)
          print('{"cleaned":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
  dependsOn:
  - job: observation
    condition:
      type: succeeded
- name: restore
  target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
  labels: &id003
    node: ${{ string(inputs.intent.caddy_publication.node_id) }}
  dependsOn:
  - job: publication
    condition:
      type: failed
  steps:
  - name: restore-config
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id003
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-restore-config-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_CHUNK,ORBIT_CADDY_OBSERVED /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import shutil
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]

          state_path = stage / "restore.json"
          if state_path.is_file():
              state = json.loads(state_path.read_text())
              live = root / "Caddyfile"
              if state["had_live"]:
                  prior = stage / "prior"
                  link = stage / "restore"
                  link.unlink(missing_ok=True)
                  if state["previous_target"] is not None:
                      link.symlink_to(state["previous_target"])
                  else:
                      shutil.copy2(prior, link)
                  os.replace(link, live)
              else:
                  live.unlink(missing_ok=True)
          print('{"restored":true}')
          PYTHON
        env: &id004
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
  - name: restore-service
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id003
    dependsOn:
    - step: restore-config
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-restore-service-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          state_path = stage / "restore.json"
          if state_path.is_file():
              state = json.loads(state_path.read_text())
              action = "reload-or-restart" if state["active"] else "stop"
              reply = subprocess.run(
                  ["/usr/bin/systemctl", action, "caddy"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=35,
              )
              if reply.returncode:
                  raise SystemExit("caddy.restore_failed")
          print('{"ready":true}')
          PYTHON
        env: *id004
  - name: restore-enable-state
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    dependsOn:
    - step: restore-service
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-restore-enable-state-" + string(inputs.intent.caddy_publication.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META,ORBIT_CADDY_OBSERVED,ORBIT_CADDY_OUTCOME /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          state_path = stage / "restore.json"
          if state_path.is_file():
              state = json.loads(state_path.read_text())
              reply = subprocess.run(
                  [
                      "/usr/bin/systemctl",
                      "enable" if state["enabled"] else "disable",
                      "--quiet",
                      "caddy",
                  ],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=35,
              )
              if reply.returncode:
                  raise SystemExit("caddy.restore_failed")
          print('{"ready":true}')
          PYTHON
        env: *id005
  - name: clean-restored-candidates
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id001
    dependsOn:
    - step: restore-enable-state
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-cleanup-" + string(inputs.intent.caddy_publication.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo --preserve-env=ORBIT_CADDY_META /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import shutil
          import stat
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]


          if stage.is_dir():
              (stage / "complete.json").write_text('{"completed":true}')
          live = root / "Caddyfile"
          active = live.resolve() if live.is_file() else None
          versions = root / "orbit-versions"
          if versions.is_dir():
              entries = [
                  entry
                  for entry in versions.iterdir()
                  if not entry.is_symlink() and entry.is_dir() and (entry / "Caddyfile").is_file()
              ]
              entries.sort(key=lambda entry: entry.stat().st_mtime_ns, reverse=True)
              previous = [entry for entry in entries if active is None or active.parent != entry]
              for entry in previous[9:]:
                  content = entry / "Caddyfile"
                  if hashlib.sha256(content.read_bytes()).hexdigest()[:32] != entry.name[:32]:
                      backup = root / "orbit-backups" / ("edited-" + entry.name)
                      backup.parent.mkdir(mode=0o700, exist_ok=True)
                      if backup.exists():
                          raise SystemExit("caddy.backup_conflict")
                      entry.rename(backup)
                  else:
                      shutil.rmtree(entry)
          staging = root / ".orbit-staging"
          if staging.is_dir():
              completed = [
                  entry
                  for entry in staging.iterdir()
                  if not entry.is_symlink()
                  and entry.is_dir()
                  and (entry / "complete.json").is_file()
              ]
              completed.sort(key=lambda entry: entry.stat().st_mtime_ns, reverse=True)
              for entry in completed[10:]:
                  if entry == stage:
                      continue
                  if not stat.S_ISDIR(entry.lstat().st_mode) or entry.lstat().st_uid != 0:
                      raise SystemExit("caddy.cleanup_unsafe")
                  shutil.rmtree(entry)
          print('{"cleaned":true}')
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
- name: completion
  target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
  labels: *id001
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.caddy_publication.node_id) }}
    labels: *id002
    dependsOn: []
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-result-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          meta = json.loads(os.environ["ORBIT_CADDY_META"])
          root = Path("/etc/caddy")
          stage = root / ".orbit-staging" / meta["run_id"]

          observed = json.loads(os.environ["ORBIT_CADDY_OBSERVED"])
          live = root / "Caddyfile"
          current = hashlib.sha256(live.read_bytes()).hexdigest() if live.is_file() else None
          if not observed["withdraw"] and current != meta["sha256"]:
              raise SystemExit("caddy.publication_not_active")
          if observed["withdraw"] and current not in (None, meta["sha256"]):
              raise SystemExit("caddy.publication_stale")
          print(
              json.dumps(
                  {
                      "ready": True,
                      "result": "published" if observed["publish"] else "unchanged",
                      "version": meta["version"],
                  }
              )
          )
          PYTHON
        env:
          ORBIT_CADDY_META: ${{ steps.input.outputs.metadata_json }}
          ORBIT_CADDY_OBSERVED: ${{ steps["observe-host"].outputs.stdout }}
