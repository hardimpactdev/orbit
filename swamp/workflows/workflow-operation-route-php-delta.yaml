id: 3ae539e4-bd32-4fbc-b50d-bd13e660ed30
name: operation-route-php-delta
description: Compose captured public sections and apply them with official file actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        user:
          type: string
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
            become:
              type: boolean
              const: true
            nodePort:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
          - become
          - nodePort
          additionalProperties: false
        before:
          type: object
        after:
          type: object
        direction:
          type: string
          enum:
          - forward
          - restore
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - node_id
      - user
      - control_node_id
      - connection
      - before
      - after
      - direction
      - host_keys
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: composition
  target: orbit-node-209
  labels:
    node: '209'
  steps:
  - name: plan
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "route-delta-plan-" + run.id }}
      methodName: phpPlan
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        control_node_id: ${{ inputs.intent.control_node_id }}
        connection: ${{ inputs.intent.connection }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
        host_keys: ${{ inputs.intent.host_keys }}
  - name: read-account
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-read-account-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_NODE_USER=' + string(inputs.intent.user) }}
        - /bin/sh
        - -c
        - |
          /usr/bin/python3 -B - <<'PYTHON'
          import grp
          import json
          import os
          import pwd

          account = pwd.getpwnam(os.environ["ORBIT_NODE_USER"])
          print(json.dumps({"user": account.pw_name, "home": account.pw_dir, "group": grp.getgrgid(account.pw_gid).gr_name}))
          PYTHON
    dependsOn:
    - step: plan
      condition:
        type: succeeded
  - name: read-current
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-read-current-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_PHP_VERSIONS=' + string(steps.plan.outputs.versions_json) }}
        - /bin/sh
        - -c
        - |
          sudo --preserve-env=ORBIT_PHP_VERSIONS /usr/bin/python3 -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          versions = json.loads(os.environ["ORBIT_PHP_VERSIONS"])
          paths = {version: Path(f"/etc/php/{version}/fpm/pool.d/orbit-scopes.conf") for version in versions}
          print(json.dumps({version: path.read_text() if path.is_file() else "" for version, path in paths.items()}))
          PYTHON
    dependsOn:
    - step: read-account
      condition:
        type: succeeded
  - name: compose
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "route-delta-compose-" + run.id }}
      methodName: php
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        control_node_id: ${{ inputs.intent.control_node_id }}
        connection: ${{ inputs.intent.connection }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
        current: ${{ steps["read-current"].outputs.stdout }}
        account: ${{ steps["read-account"].outputs.stdout }}
        host_keys: ${{ inputs.intent.host_keys }}
    dependsOn:
    - step: read-current
      condition:
        type: succeeded
- name: publication
  target: orbit-node-209
  labels:
    node: '209'
  steps:
  - name: apply-pool
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-apply-pool-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - |-
          set -eu
          if [ "$1" = absent ]; then /usr/bin/rm -f "$2"; else
            /usr/bin/install -m 0644 -o root -g root /dev/null "$2"
            /usr/bin/cat > "$2"
          fi
        - route-pool
        - ${{ self.pool.ensure }}
        - ${{ self.pool.path }}
        stdin: ${{ self.pool.content }}
        sudo: true
    forEach:
      item: pool
      in: ${{ steps.compose.outputs.files }}
  - name: validate
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-validate-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_PHP_VERSION=' + string(self.pool.version) }}
        - /bin/sh
        - -c
        - sudo "/usr/sbin/php-fpm$ORBIT_PHP_VERSION" -t
    dependsOn:
    - step: apply-pool
      condition:
        type: succeeded
    forEach:
      item: pool
      in: ${{ steps.compose.outputs.files }}
  - name: reload
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-reload-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_PHP_VERSION=' + string(self.pool.version) }}
        - /bin/sh
        - -c
        - sudo /usr/bin/systemctl reload "php$ORBIT_PHP_VERSION-fpm"
    dependsOn:
    - step: validate
      condition:
        type: succeeded
    forEach:
      item: pool
      in: ${{ steps.compose.outputs.files }}
  dependsOn:
  - job: composition
    condition:
      type: succeeded
- name: completion
  target: orbit-node-209
  labels:
    node: '209'
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '%s\n' '{"ready":true}'
