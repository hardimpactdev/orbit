name: Orbit Agent Release

# Publishes the agent delivery that main's CI built and tested (ADR 0225). It never rebuilds: it downloads the
# `agent-delivery` artifact of the CI run, tags the delivery's commit `agent-v<commit>`, and attaches the same
# binaries, SHA256SUMS, and a manifest with release URLs. The delivery commit is the last commit that changed
# apps/agent, so a Gateway release whose agent sources did not change keeps the existing delivery.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: The CI run on main whose agent-delivery artifact to publish again
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit-agent-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish agent delivery
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    # Only this environment holds the release App, the one identity the agent-v* tag ruleset lets create a tag.
    environment: agent-release
    steps:
      - name: Find the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")
          [ "$(jq -r .head_branch <<<"$run")" = main ] && [ "$(jq -r .conclusion <<<"$run")" = success ] || { echo "Run $RUN_ID is not a passing run on main" >&2; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head_sha <<<"$run")" >> "$GITHUB_OUTPUT"

      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.run.outputs.head }}
          fetch-depth: 0

      - name: Download the tested delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-delivery
          path: ${{ runner.temp }}/agent-delivery
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Validate the delivery and its tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.run.outputs.head }}
          DELIVERY: ${{ runner.temp }}/agent-delivery
        run: |
          set -euo pipefail
          commit=$(jq -r .commit "$DELIVERY/manifest.json")
          if gh release view "agent-v$commit" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "agent-v$commit is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apps/agent/scripts/check-release-tag.sh "agent-v$commit" "$REPOSITORY" "$DELIVERY/manifest.json" "$HEAD_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Add release URLs to the manifest
        if: steps.tag.outputs.skip == 'false'
        env:
          DELIVERY: ${{ runner.temp }}/agent-delivery
          BASE: https://github.com/${{ github.repository }}/releases/download/agent-v${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          jq --arg base "$BASE" '.artifacts |= with_entries(.value.url = ($base + "/" + .value.path))' "$DELIVERY/manifest.json" > "$DELIVERY/manifest.json.new"
          mv "$DELIVERY/manifest.json.new" "$DELIVERY/manifest.json"

      - name: Mint the release App token
        if: steps.tag.outputs.skip == 'false'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ORBIT_RELEASE_APP_ID }}
          private-key: ${{ secrets.ORBIT_RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the commit and publish the delivery
        if: steps.tag.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/agent-delivery
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          version=$(jq -r .version manifest.json)
          gh release create "agent-v$COMMIT" orbit-agent-linux-* SHA256SUMS manifest.json \
            --repo "$REPOSITORY" \
            --target "$COMMIT" \
            --title "orbit-agent $version ($COMMIT)" \
            --notes "Static Linux binaries for orbit-agent $version, built and tested by CI at $COMMIT."
