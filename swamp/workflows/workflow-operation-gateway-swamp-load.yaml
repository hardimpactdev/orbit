id: 04961808-4346-47a8-aa0e-6e44f1d0cf5a
name: operation-gateway-swamp-load
autoContinue: false
description: Check out a release, write Gateway-rendered grants with official file resources, and confirm serve loaded it.
queueTimeout: 120
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [gateway.swamp_load]}
    intent:
      type: object
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        force: {type: boolean}
        retained: {type: boolean}
        serving: {type: boolean}
        grants:
          type: object
          properties:
            grants/orbit-gateway.yaml: {type: string}
            grants/orbit-serve.yaml: {type: string}
          required: [grants/orbit-gateway.yaml, grants/orbit-serve.yaml]
          additionalProperties: false
        ssh: {type: object}
        gateway_ssh: {type: object}
      required: [sha, force, grants, ssh, gateway_ssh]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: load
    steps:
      - name: Check the release target
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "gateway-swamp-check-target-" + string(inputs.node_id) }}'
          methodName: exec
          globalArgs:
            name: '${{ "gateway-swamp-check-ssh-" + string(inputs.node_id) }}'
            transport:
              kind: ssh
              user: ${{ inputs.intent.gateway_ssh.target.user }}
              port: ${{ inputs.intent.gateway_ssh.target.port }}
              identityFile: ${{ inputs.intent.gateway_ssh.identity_file }}
            hosts:
              - name: target
                address: ${{ inputs.intent.gateway_ssh.target.host }}
                transport: {hostKeys: '${{ inputs.intent.gateway_ssh.target.host_keys }}'}
          inputs:
            hosts: name:target
            sudo: true
            timeoutSec: 165
            argv:
              - /usr/bin/timeout
              - '150'
              - /bin/sh
              - -c
              - 'if test "$4" = true; then exec /usr/local/libexec/orbit-gateway-release-phase reconcile-verify "$2" "$3"; fi; if test -f /home/orbit/.orbit/gateway-containers.json || test -e /var/lib/orbit/gateway-release-switch/operation; then exec /usr/local/libexec/orbit-gateway-release-phase "$1" "$2" "$3"; fi'
              - sh
              - check-load
              - '${{ inputs.intent.sha }}'
              - '${{ string(inputs.operation_id) }}'
              - '${{ string(has(inputs.intent.serving) && inputs.intent.serving) }}'
      # Forward only unless the release is forced, as a rollback is: the same rule as the release build, checked here too because a
      # release resumed at Load or a direct start does not pass the build again.
      - name: checkout
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: Check the release target, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "gateway-swamp-checkout" }}'
          methodName: execute
          inputs:
            env: {RELEASE_SHA: '${{ inputs.intent.sha }}', FORCE: '${{ string(inputs.intent.force) }}', RETAINED: '${{ string(has(inputs.intent.retained) && inputs.intent.retained) }}'}
            run: |
              set -eu
              cd /home/orbit/apps/orbit-monorepo-staging/checkout
              previous=$(git rev-parse HEAD)
              if [ "$RETAINED" = true ]; then
                git cat-file -e "$RELEASE_SHA^{commit}" || { echo 'gateway.release_retained_swamp_source_missing: local rollback commit is unavailable' >&2; exit 1; }
              else
                timeout 120 git fetch --quiet origin "$RELEASE_SHA"
              fi
              if [ "$FORCE" != true ] && ! git merge-base --is-ancestor "$previous" "$RELEASE_SHA"; then
                echo "gateway.release_downgrade: $RELEASE_SHA does not descend from the serve checkout $previous" >&2
                exit 1
              fi
              git checkout --quiet --detach "$RELEASE_SHA"
              test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
              printf '%s\n' "$previous"
      - name: grants
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: checkout, condition: {type: succeeded}}]
        forEach: {item: grant, in: '${{ ["gateway", "serve"] }}'}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("release-" + self.grant + "-grants-209").split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: '${{ inputs.intent.ssh.target.host }}'
            nodeUser: '${{ inputs.intent.ssh.target.user }}'
            nodePort: '${{ inputs.intent.ssh.target.port }}'
            nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}'
            become: true
            path: '${{ "/home/orbit/apps/orbit-monorepo-staging/checkout/swamp/grants/orbit-" + self.grant + ".yaml" }}'
            ensure: present
            content: '${{ inputs.intent.grants["grants/orbit-" + self.grant + ".yaml"] }}'
            owner: orbit
            group: orbit
            mode: '0640'
          inputs: {}
      # The workers run Ansible with the collections the swamp role installed from its pin. The load only compares: a release whose
      # requirements.yml differs from that pin warns, with the converge that installs them, and goes on. It installs nothing.
      - name: Check the Ansible collections
        labels: {role: swamp}
        dependsOn: [{step: checkout, condition: {type: succeeded}}]
        allowFailure: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "gateway-swamp-collections" }}'
          methodName: execute
          inputs:
            env:
              REQUIREMENTS: /home/orbit/apps/orbit-monorepo-staging/checkout/swamp/ansible/requirements.yml
              PIN: /opt/orbit/ansible/requirements.yml
              NODE_ID: '${{ string(inputs.node_id) }}'
            run: |
              cmp -s "$REQUIREMENTS" "$PIN" && { echo current; exit 0; }
              echo "The Ansible collections on Node $NODE_ID were installed from another requirements.yml; run: orbit node:role:add $NODE_ID swamp --converge" >&2
              exit 1
      - name: load
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: grants, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "gateway-swamp-load" }}'
          methodName: execute
          inputs:
            env:
              RELEASE_SHA: '${{ inputs.intent.sha }}'
              PREVIOUS_SHA: '${{ steps.checkout.outputs.stdout.trim() }}'
            # Reload workflows, extensions (with their additionalFiles) and grants, then compare served workflows with the
            # target commit.
            run: |
              set -euo pipefail
              export HOME=/home/orbit SWAMP_HOME=/home/orbit/.swamp SWAMP_CONFIG_DIR=/home/orbit/.config/swamp
              export SWAMP_API_KEY_FILE=/home/orbit/.config/swamp/api-key SWAMP_NO_UPDATE_CHECK=1 SWAMP_NO_TELEMETRY=1
              driver=/home/orbit/.config/swamp/serve-driver-token
              errors=$(mktemp)
              trap 'rm -f "$errors"' EXIT
              # swamp-env sources the Swamp Club credential env; without it a non-interactive swamp fails with auth_gate_blocked. The
              # swamp role installs it. Until the Swamp Node is converged, the load sources the env file itself, as before swamp-env.
              swamp_env=/usr/local/lib/orbit-swamp/swamp-env
              if [ ! -x "$swamp_env" ]; then
                echo "gateway.release_swamp_env_unconverged: $swamp_env is missing; converge the swamp role on the Swamp Node. Running swamp without it." >&2
                if [ -f "$HOME/.config/swamp/env.sh" ]; then
                  # shellcheck disable=SC1091
                  . "$HOME/.config/swamp/env.sh" >/dev/null 2>&1 || true
                fi
                swamp_env=env
              fi
              # Runs one swamp call and keeps its stderr. A failed call prints that stderr and its exit, never a bare jq exit 4 on
              # empty stdout. A refused token names the renewal that replaces it (serve-driver expired on 2026-11-21).
              swamp_call() {
                limit=$1
                shift
                status=0
                output=$(timeout "$limit" "$swamp_env" /usr/local/bin/swamp "$@" 2>"$errors") || status=$?
                if [ "$status" -ne 0 ]; then
                  if grep -qE 'auth_gate_blocked|swamp\.credential_env_' "$errors"; then
                    echo "gateway.release_swamp_auth_gate_blocked: swamp on the Swamp Node has no Swamp Club credential; check /home/orbit/.config/swamp/env.sh" >&2
                  elif grep -qiE 'unauthori[sz]ed|auth rejected|expired|revoked|invalid token|code 400[23]' "$errors"; then
                    echo "gateway.release_swamp_token_expired: serve-driver token $driver expired or revoked; run orbit-swamp-token-renewal (systemctl start orbit-swamp-token-renewal.service on the Swamp Node)" >&2
                  fi
                  echo "swamp $1 $2 failed with exit $status:" >&2
                  cat "$errors" >&2
                  exit "$status"
                fi
                printf '%s\n' "$output"
              }
              remote="--server ws://127.0.0.1:9418 --token-file $driver --json"
              cd /home/orbit/apps/orbit-monorepo-staging/checkout
              # shellcheck disable=SC2086
              reload=$(swamp_call 120 serve reload $remote)
              printf '%s' "$reload" | jq -e '.success == true and ((.errors // []) | length) == 0' >/dev/null \
                || { echo "swamp serve reload reported errors: $reload" >&2; exit 1; }
              # shellcheck disable=SC2086
              access=$(swamp_call 90 access reload $remote)
              printf '%s' "$access" | jq -e '.success == true' >/dev/null \
                || { echo "swamp access reload reported errors: $access" >&2; exit 1; }
              # The production Swamp Node's own schedules read this checkout. They have no built-in trigger, which every serve
              # would register: only this load sets them, as serve.yaml trigger overrides. A missing or empty file passes on purpose: a
              # rollback runs this load against an older checkout without it. A present file that jq cannot read fails the load.
              schedules=swamp/config/swamp-node-schedules.json
              entries=$(if [ -s "$schedules" ]; then jq -r 'to_entries[] | "\(.key) \(.value)"' "$schedules"; fi)
              printf '%s\n' "$entries" | while read -r name cron; do
                [ -n "$name" ] || continue
                # shellcheck disable=SC2086
                trigger=$(swamp_call 60 workflow trigger set "$name" --schedule "$cron" $remote </dev/null)
                printf '%s' "$trigger" | jq -e --arg name "$name" --arg cron "$cron" '.workflowName == $name and .entry.schedule == $cron' >/dev/null
              done
              # Schedules write their own schedule-<uuid> workflows into serve at any time; only the commit's are compared.
              tracked='[.results[] | select(.name | test("^schedule-[0-9a-f-]{36}$") | not) | [.id, .name]] | sort'
              disk=$(swamp_call 60 workflow list --repo-dir swamp --json | jq -ec "$tracked")
              # shellcheck disable=SC2086
              live=$(swamp_call 60 workflow list $remote | jq -ec "$tracked")
              test "$disk" = "$live"
              jq -cn --arg sha "$RELEASE_SHA" --arg previous "$PREVIOUS_SHA" --argjson workflows "$(printf '%s' "$live" | jq length)" \
                '{sha: $sha, previous: $previous, workflows: $workflows}'
