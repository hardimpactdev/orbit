id: 25077cab-eb44-4ac6-80c8-b9643b3ea44a
name: production-schedule-control
autoContinue: false
description: Manage a timer on the verified live AppProd release.
queueTimeout: 30
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [schedule.create, schedule.enable, schedule.destroy]}
    intent: {type: object, required: [target, ssh_execution, action, id]}
    execution_secrets:
      type: object
      required: [control]
      additionalProperties: false
      properties:
        control:
          type: object
          required: [vault, key]
          additionalProperties: false
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^schedule-control-operation-[1-9][0-9]*$'}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: schedule
  steps:
  - name: Check the Schedule owner
    labels: {role: swamp}
    task:
      type: assert
      expr: inputs.execution_secrets.control.key == "schedule-control-operation-" + string(inputs.operation_id) && inputs.intent.target.node_id == inputs.node_id && inputs.kind == "schedule." + inputs.intent.action
      message: The Schedule or target belongs to a different Operation.
      severity: high
  - name: Apply the live Schedule
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Check the Schedule owner, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "app-prod-schedule-" + string(inputs.operation_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "app-prod-schedule-ssh-" + string(inputs.node_id) }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts:
        - name: target
          address: '${{ inputs.intent.ssh_execution.target.host }}'
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: 960
        stdin: '${{ vault.get(inputs.execution_secrets.control.vault, inputs.execution_secrets.control.key) }}'
        argv: [/usr/bin/timeout, '930', /usr/local/libexec/orbit-instance-release-control, '${{ string(inputs.node_id) }}', '${{ string(inputs.intent.target.instance_id) }}', '${{ inputs.intent.target.release }}', schedule, '${{ inputs.intent.action }}', '${{ inputs.intent.id }}']
