id: c031ac7e-2e4f-471e-8d4f-22733dd014e0
name: project-detect
description: Scan an admitted Project snapshot and return downstream group requests.
vaults:
- orbit-control-inputs
inputs:
  type: object
  additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      enum:
      - 209
    kind:
      type: string
      enum:
      - project.detect
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^project-dependency-read-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
        git_authorization:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^project-dependency-auth-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      additionalProperties: false
      required:
      - github_token
      - git_authorization
reports:
  skip:
  - '@swamp/workflow-summary'
jobs:
- name: detect
  target: orbit-node-209
  steps:
  - name: input
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/project-maintenance-input'
      behaviorName: ${{ "project-input-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
  - name: begin
    target: orbit-node-209
    dependsOn:
    - step: input
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: begin_scan
      inputs:
        project: ${{ steps.input.outputs.project }}
        runId: ${{ run.id }}
  - name: checkout
    target: orbit-node-209
    dependsOn:
    - step: begin
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-checkout-" + run.id }}
      methodName: execute
      inputs:
        run: 'git clone --depth=1 --branch "$ORBIT_BRANCH" -- "$ORBIT_URL" "$ORBIT_SOURCE"

          '
        env:
          ORBIT_BRANCH: ${{ steps.input.outputs.project.defaultBranch }}
          ORBIT_URL: ${{ steps.input.outputs.clone_url }}
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key)
            }}
  - name: head
    target: orbit-node-209
    dependsOn:
    - step: checkout
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-head-" + run.id }}
      methodName: execute
      inputs:
        run: 'git -C "$ORBIT_SOURCE" rev-parse HEAD

          '
        env:
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
  - name: evidence
    target: orbit-node-209
    dependsOn:
    - step: input
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: project-dependency-evidence
      inputs:
        operation_id: ${{ inputs.operation_id }}
        project: ${{ steps.input.outputs.project }}
        groups: ${{ steps.input.outputs.groups }}
        pr_urls: ${{ steps.input.outputs.pr_urls }}
        previous_pr: ${{ steps.input.outputs.previous_pr }}
        execution_secrets:
          github_token: ${{ inputs.execution_secrets.github_token }}
  - name: scan
    target: orbit-node-209
    dependsOn:
    - step: head
      condition:
        type: succeeded
    - step: evidence
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: scan
      inputs:
        project: ${{ steps.input.outputs.project }}
        runId: ${{ run.id }}
        root: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
        commit: ${{ steps.head.outputs.stdout.trim() }}
        evidence: ${{ steps.evidence.outputs.evidence.evidence }}
  - name: head_now
    target: orbit-node-209
    dependsOn:
    - step: scan
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-head-now-" + run.id }}
      methodName: execute
      inputs:
        run: 'git ls-remote --exit-code -- "$ORBIT_URL" "$ORBIT_REF"

          '
        env:
          ORBIT_URL: ${{ steps.input.outputs.clone_url }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key)
            }}
          ORBIT_REF: ${{ steps.input.outputs.source_ref }}
  - name: verify_head
    target: orbit-node-209
    dependsOn:
    - step: head_now
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: assert_scan_head
      inputs:
        project: ${{ steps.input.outputs.project }}
        runId: ${{ run.id }}
        head: ${{ steps.head_now.outputs.stdout }}
        scan_succeeded: ${{ steps.scan.outputs.scan_succeeded }}
  - name: finalize
    target: orbit-node-209
    dependsOn:
    - step: checkout
      condition:
        type: always
    - step: evidence
      condition:
        type: always
    - step: scan
      condition:
        type: always
    - step: verify_head
      condition:
        type: always
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: finish_scan
      inputs:
        project: ${{ steps.input.outputs.project }}
        runId: ${{ run.id }}
        steps: ${{ steps }}
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: finalize
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-detect-result-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' "$ORBIT_RESULT"

          '
        env:
          ORBIT_RESULT: ${{ steps.finalize.outputs.result_json }}
  - name: outcome
    target: orbit-node-209
    dependsOn:
    - step: result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-scan-outcome-" + run.id }}
      methodName: execute
      inputs:
        run: test "$ORBIT_SCAN_SUCCEEDED" = true
        env:
          ORBIT_SCAN_SUCCEEDED: ${{ string(steps.finalize.outputs.scan_succeeded) }}
  - name: cleanup
    target: orbit-node-209
    dependsOn:
    - step: checkout
      condition:
        type: always
    - step: result
      condition:
        type: always
    - step: outcome
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-detect-cleanup-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_SOURCE"

          '
        env:
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
