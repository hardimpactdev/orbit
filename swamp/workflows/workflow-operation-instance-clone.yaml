id: 6c413eaa-2e25-43c8-b146-f6c8e103c00d
name: operation-instance-clone
description: Clone a candidate into a production Instance in the chart's steps, each a child workflow, and report one terminal result.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: instance.clone}
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        git_read:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        environment:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        git_credential:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - git_read
      - environment
      - git_credential
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: clone
  labels:
    role: swamp
  steps:
  - name: Check candidate source
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-candidate
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
  - name: Fetch the source
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-source
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: Check candidate source
      condition:
        type: succeeded
  - name: Write .env, prepare Vite+
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-environment
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: Fetch the source
      condition:
        type: succeeded
  - name: Snapshot the database
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-database-snapshot
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: Write .env, prepare Vite+
      condition:
        type: succeeded
    guard: ${{ inputs.intent.sqlite == null }}
  - name: Install the database
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-database-install
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
        digest: ${{ steps["Snapshot the database"].outputs.digest.stdout.split(" ")[0] }}
    dependsOn:
    - step: Snapshot the database
      condition:
        type: succeeded
    guard: ${{ inputs.intent.sqlite == null }}
  - name: Add Processes, Schedules
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-runtime
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: Write .env, prepare Vite+
      condition:
        type: succeeded
    - step: Snapshot the database
      condition: &id001
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: Install the database
      condition: *id001
    # The preview Route (route.create children): a Node-local key and CSR per leaf, kept on the Node.
  - name: Make a CSR on the Node
    labels:
      role: swamp
    writes: true
    forEach:
      item: leaf
      in: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes }}'
    task:
      type: workflow
      workflowIdOrName: route-create-csr
      inputs:
        intent: ${{ inputs.intent.route }}
        leaf: ${{ self.leaf }}
    dependsOn:
    - step: Add Processes, Schedules
      condition:
        type: succeeded
    guard: ${{ inputs.intent.route == null }}
    # The one step-to-Gateway call: the Orbit CA key stays in the Gateway.
  - name: Sign the CSR
    labels:
      role: swamp
    forEach:
      item: leaf
      in: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes }}'
    task:
      type: workflow
      workflowIdOrName: route-create-sign
      inputs:
        operation_id: ${{ inputs.operation_id }}
        parent_run_id: ${{ run.id }}
        leaf: ${{ inputs.intent.route.leaves[self.leaf] }}
        request: ${{ steps["Make a CSR on the Node-" + string(self.leaf)].outputs.csr.stdout }}
    dependsOn:
    - step: Make a CSR on the Node
      condition:
        type: succeeded
    guard: ${{ inputs.intent.route == null }}
    # Certificate, web root access and Caddy site on the clone Node, its only site Node (admission); private DNS answers its TLD.
  - name: Publish preview Route
    labels:
      role: swamp
    writes: true
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: ${{ inputs.intent.route }}
        node_id: ${{ inputs.node_id }}
        execution_secrets: ${{ inputs.execution_secrets }}
        signed: ${{ inputs.intent.route.leaf_indexes.map(i, steps["Sign the CSR-" + string(i)].outputs.sign.stdout) }}
    dependsOn:
    - step: Make a CSR on the Node
      condition:
        type: succeeded
    - step: Sign the CSR
      condition:
        type: succeeded
    guard: ${{ inputs.intent.route == null }}
  - name: Check the clone
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-check
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
        source: ${{ steps["Fetch the source"].outputs["source-result"] }}
    dependsOn:
    - step: Add Processes, Schedules
      condition:
        type: succeeded
    - step: Make a CSR on the Node
      condition: *id001
    - step: Sign the CSR
      condition: *id001
    - step: Publish preview Route
      condition: *id001
  - name: Remove the snapshot
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: instance-clone-database-cleanup
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: Snapshot the database
      condition:
        type: always
    - step: Install the database
      condition:
        type: always
    - step: Check the clone
      condition:
        type: always
    guard: ${{ inputs.intent.sqlite == null }}
    allowFailure: true
  - name: Report the result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "icl-36" }}
      methodName: cloneResult
      inputs:
        candidate: ${{ steps["Check candidate source"].outputs.candidate }}
        intent: ${{ inputs.intent }}
        source: ${{ steps["Fetch the source"].outputs["source-result"] }}
        vp: ${{ steps["Write .env, prepare Vite+"].outputs["clone-vp-result"] }}
    dependsOn:
    - step: Check the clone
      condition:
        type: succeeded
queueTimeout: 60
