# One workspace (ADR 0267 P10): the observer, its contract, the executor's core crate and the executor binary.
# The observer joins `[lints] workspace = true` in the last fix slice of B1, so CI stays green on the way.
[workspace]
members = [".", "crates/contract", "crates/executor-core", "crates/executor", "crates/power", "crates/firewall", "crates/route"]
resolver = "2"

# BeautifulRust's lints/lints.toml (ADR 0267 P9). Every executor crate sets `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"          # each unsafe op needs its own unsafe block
missing_debug_implementations = "warn"   # every public type implements Debug
missing_docs = "warn"                    # [lib] document every public item
unreachable_pub = "warn"                 # pub items that aren't actually exported
rust_2018_idioms = { level = "warn", priority = -1 } # 2018-edition idioms, e.g. Formatter<'_>

[workspace.lints.clippy]
# Groups first, at lower priority so the individual settings below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"                     # use ?, or expect("why this cannot fail")
expect_used = "allow"                    # expect with a reason is the sanctioned form
panic_in_result_fn = "warn"              # a fn returning Result shouldn't also panic
missing_panics_doc = "warn"              # [lib] document reachable panics under # Panics
missing_errors_doc = "warn"              # [lib] document failures under # Errors
missing_assert_message = "warn"          # assert! says what went wrong (quiet inside #[test])

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"                # prefer #[expect] over #[allow] (needs rust-version 1.81+)
allow_attributes_without_reason = "warn" # every suppression says why (needs rust-version 1.81+)

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"      # // SAFETY: comment on every unsafe block
multiple_unsafe_ops_per_block = "warn"   # one unsafe operation per block

# API shape.
fn_params_excessive_bools = "warn"       # bool parameters: use an enum or two methods
struct_excessive_bools = "warn"          # many bool fields: use an enum or bitflags
clone_on_ref_ptr = "warn"                # write Rc::clone(&x) so cheap clones are visible
redundant_clone = "warn"                 # a clone whose original is never used again
rc_buffer = "warn"                       # Rc<String> / Rc<Vec<T>>: use Rc<str> / Rc<[T]>

# Evolution.
exhaustive_enums = "warn"                # [lib] exported enums are #[non_exhaustive] (quiet in binaries)

# Idioms.
string_add = "warn"                      # build strings with format! or push_str, not +
wildcard_imports = "warn"                # no glob imports (use super::* in tests is allowed)

# Output and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"                    # [lib] libraries log, they don't print
print_stderr = "warn"                    # [lib] libraries log, they don't print

# Casts that silently lose information.
as_conversions = "warn"                  # prefer From / TryFrom
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Pedantic lints that are mostly noise in practice, or that the skill disagrees with.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"               # a leaf module named after its main item is fine
enum_glob_use = "allow"                  # use Enum::* inside a function that matches on it

[package]
name = "orbit-agent"
version = "0.17.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "orbit_agent"
path = "src/lib.rs"

[[bin]]
name = "orbit-agent"
path = "src/main.rs"

[dependencies]
schemars = "1.2"
orbit-agent-contract = { path = "crates/contract" }
orbit-documents-agent = { path = "../gateway/extensions/documents/agent" }
orbit-ai-router-agent = { path = "../gateway/extensions/ai-router/agent" }
bollard = "0.18"
futures-util = "0.3"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
http = "1"
libgit2-sys = "0.18"
libz-sys = { version = "1", default-features = false, features = ["libc", "static"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time", "sync", "test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
toml = "0.8"
zbus = { version = "5", features = ["tokio"] }
base64 = "0.22"
tar = "0.4"
flate2 = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
xz2 = { version = "0.1.7", features = ["static"] }
notify = "8.2.1"

# Redaction's shared cases should measure the rules, not unoptimized regex matching.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# Every command hashes its own binary, and a debug binary is large; the tests that run it should not wait on that.
[profile.dev.package.sha2]
opt-level = 3

# Every Node keeps two copies and every command hashes its own binary; symbols only add bytes to both.
[profile.release]
strip = "symbols"

[target.'cfg(target_os = "linux")'.dependencies]
# The executor mode (ADR 0271 N7): `orbit-agent execute`. Its socket, caller check and Incus calls are Linux-only.
orbit-executor = { path = "crates/executor" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
orbit-executor-core = { path = "crates/executor-core" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tempfile = "3"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
