name: Typed Orbit agent
on:
  pull_request:
    paths:
      - 'family/agent/**'
      - 'family/catalogue.json'
      - 'family/deno.lock'
      - 'bin/prepare-agent-ssh.ts'
      - 'extensions/models/upstream_extensions.json'
      - 'docs/typed-agent.md'
      - '.github/workflows/typed-agent.yml'
  push:
    branches: [main]
    paths:
      - 'family/agent/**'
      - 'family/catalogue.json'
      - 'family/deno.lock'
      - 'bin/prepare-agent-ssh.ts'
      - 'extensions/models/upstream_extensions.json'
      - 'docs/typed-agent.md'
      - '.github/workflows/typed-agent.yml'
permissions:
  contents: read
jobs:
  typed-agent:
    runs-on: [self-hosted, hardimpact]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.8
      - name: Prepare pinned SSH and verify typed transport
        shell: bash
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/swamp-club/swamp/releases/download/v20261028.205235.0-sha.1602a617/swamp-linux-x86_64 \
            --output "$RUNNER_TEMP/swamp-typed-agent"
          printf '%s  %s\n' 38b81986c7203f1e93806fc7b6d38e560a86456ea755a4369a89b17b64d4fbe3 "$RUNNER_TEMP/swamp-typed-agent" | sha256sum --check
          chmod +x "$RUNNER_TEMP/swamp-typed-agent"
          export SWAMP_BIN="$RUNNER_TEMP/swamp-typed-agent"
          export SWAMP_HOME="$RUNNER_TEMP/typed-agent-swamp-home"
          export SWAMP_CONFIG_DIR="$RUNNER_TEMP/typed-agent-swamp-config"
          "$SWAMP_BIN" extension pull @swamp/ssh@2026.10.23.1 --json
          # Test checkout only. Keep generic SSH out of the deployment lock.
          git restore -- extensions/models/upstream_extensions.json
          deno run --lock=family/deno.lock --frozen --allow-read bin/prepare-agent-ssh.ts
          deno fmt --check family/agent family/deno.lock bin/prepare-agent-ssh.ts docs/typed-agent.md
          deno lint family/agent bin/prepare-agent-ssh.ts
          deno check --lock=family/deno.lock --frozen family/agent/*_test.ts
          deno test --lock=family/deno.lock --frozen --allow-read --allow-write=/tmp --allow-run --allow-env family/agent
      - name: Clean isolated Swamp files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/swamp-typed-agent" "$RUNNER_TEMP/typed-agent-swamp-home" "$RUNNER_TEMP/typed-agent-swamp-config"
