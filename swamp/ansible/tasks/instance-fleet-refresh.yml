---
# Refresh the nested fleet of a default Instance after its workspace took a new commit, on a started fleet (instance-fleet-start.yml,
# which never waits for Doctor), doing only the parts whose inputs changed (docs/reference/development-containers.md#what-a-refresh-skips).
# The record `fleet_record` holds the digests of the parts the last passed refresh did; a part runs when its digest differs, and a
# missing or unreadable record makes every part run. `code` migrates and restarts the nested Gateway, `converge` waits for the three
# agents and converges the base of the three nested Nodes one by one. The converge is also due 7 days after the last one that ran. The agent delivery, the grants, the fleet files and one
# readiness wait run every time. `base` is retaken, with those containers stopped, only for the containers whose disks changed:
# the migrate applied a migration, a converge changed a task, a rule or file differed, a `base` is missing, or the record was. The record is
# removed before the first write to a nested disk and written again last, so a run that stops in the middle leaves none. Input: instance-fleet.yml. The order of the first build (inner-fleet step 8: `apply`,
# `ready`, `base`); the model is the task VM refresh (task-vm-fleet.yml), from the Node through the Instance container.
# The nested Gateway's Swamp runs only with the Club key file. Without it, the grants are not reloaded and the Swamp units are not checked.
- { name: Name the fleet commands, ansible.builtin.import_tasks: instance-fleet.yml }
- name: Look for the Club key
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['test', '-s', fleet_club_key] }}" }
  register: fleet_club
  changed_when: false
  failed_when: false

# The record and the digests. A read that fails, or a record that is not a flat map of digests, makes every part due; neither fails.
# `code` is the nested Gateway's code and the agent contract it reads from outside `apps/gateway` (`apps/agent/contract`, cached for
# the life of a Horizon worker). `converge` is made after the migrate, from what a base converge reads: the `swamp` files of
# `fleet-converge-inputs.json` (its cover test: swamp/tests/fleet_converge_inputs_test.ts), the nested Gateway's digest of each Node's
# base intent, and the fleet intent. The record also holds `converged`, the time of the last converge that ran.
- name: Read the list of converge inputs
  ansible.builtin.set_fact:
    fleet_converge_inputs: "{{ lookup('ansible.builtin.file', 'fleet-converge-inputs.json') | from_json }}"
- name: Read the refresh record
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['cat', fleet_record] }}" }
  register: fleet_record_read
  changed_when: false
  failed_when: false
- name: Read the digests of the checkout
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_outer + ['git', '-c', 'safe.directory=*', '-C', intent.container.workspace, 'rev-parse',
          'HEAD:apps/gateway', 'HEAD:apps/agent/contract'] + (fleet_converge_inputs.inputs | map('regex_replace', '^', 'HEAD:') | list) }}
  register: fleet_digests_read
  changed_when: false
  failed_when: false
- name: Work out which parts are due
  vars:
    fleet_record_valid: >-
      {{ fleet_record_read.rc == 0 and fleet_record_read.stdout | trim is match('^\{"[a-z]+": ?"[0-9a-f]+"(, ?"[a-z]+": ?"[0-9a-f]+")*\}$') }}
    fleet_ids: >-
      {{ fleet_digests_read.stdout_lines if fleet_digests_read.rc == 0
         and fleet_digests_read.stdout_lines | length == 2 + fleet_converge_inputs.inputs | length else [] }}
  ansible.builtin.set_fact:
    fleet_record_state: >-
      {{ 'present' if fleet_record_valid else 'missing' if fleet_record_read.rc != 0 and 'No such file' in fleet_record_read.stderr
         else 'unreadable' }}
    fleet_recorded: "{{ (fleet_record_read.stdout | trim | from_json) if fleet_record_valid else {} }}"
    fleet_now: "{{ {} if fleet_ids | length == 0 else {'code': (fleet_ids[0] ~ fleet_ids[1]) | hash('sha256')} }}"
    fleet_swamp_ids: "{{ fleet_ids[2:] }}"
    fleet_converge_changed: 0
    fleet_converge_changed_roles: []
    fleet_started_at: "{{ now(utc=true).timestamp() }}"
# The code is due when the checkout gives no digest for it, or the record holds another one. The converge is decided after the migrate.
- name: Name the due parts
  ansible.builtin.set_fact:
    fleet_due:
      code: "{{ 'code' not in fleet_now or fleet_recorded.code | default('') != fleet_now.code }}"

# The record goes before the first write to a nested disk and comes back as the last task. A run that stops in the middle (a failed
# step, a failed restore of the old seed, a run by hand) leaves no record, so the next refresh runs every part and retakes all three.
- name: Remove the refresh record until the refresh passes
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['rm', '-f', fleet_record] }}" }
  changed_when: fleet_record_read.rc == 0

# `.env`, `storage` and `bootstrap/cache` stay on each guest's own disk, bound over the checkout at boot, and so do the nested
# Gateway's Swamp state (`.swamp`, `vaults`, `grants`) when its Swamp runs. Right after a start a mount can still be `activating`, so
# the read waits until all are active: a write before its mount would land in the checkout, under the mount.
- name: Read the state mounts
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests[item.0], '--', 'systemctl', 'is-active'] + item.1 }}"
  loop:
    - [gateway, "{{ fleet_state_mounts + (fleet_swamp_state_mounts if fleet_club.rc == 0 else []) }}"]
    - [app-dev, "{{ fleet_state_mounts }}"]
  loop_control: { label: "{{ item.0 }}" }
  register: fleet_mounts
  changed_when: false
  failed_when: false
  until: fleet_mounts.stdout_lines == ['active'] * (item.1 | length)
  retries: "{{ ((fleet_boot_seconds | int) / ([fleet_ready_delay | int, 1] | max)) | round(0, 'ceil') | int }}"
  delay: "{{ fleet_ready_delay }}"
- name: Check the state mounts
  vars:
    fleet_mounts_down: >-
      {%- set out = [] -%}
      {%- for read in fleet_mounts.results -%}
      {%-   if read.stdout_lines != ['active'] * (read.item.1 | length) -%}
      {%-     set _ = out.append(intent.fleet.guests[read.item.0]) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.assert:
    that: fleet_mounts_down | length == 0
    fail_msg: "The state mounts are not active after {{ fleet_boot_seconds }} s in {{ fleet_mounts_down | join(', ') }}"
    quiet: true
# The nested Gateway gives its Nodes the agent of the checkout's pin, a byte copy of the published release manifest.
- name: Place the agent delivery
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--'] + fleet_as_app_user + ['install', '-D', '-m', '0444',
          intent.fleet.checkout.path ~ '/apps/gateway/resources/agent/frozen-manifest.json',
          intent.fleet.checkout.path ~ '/apps/agent/delivery/manifest.json'] }}
  changed_when: true
# Local grants mask the checkout's; the reload needs Swamp serve. The grants live on the nested Gateway's own disk (its state mount
# `swamp/grants`), so a reload that changed a file marks it for `base`: the inner play's recap says `changed=0` when nothing changed,
# and any other recap counts as a change.
- name: Reconcile the Swamp grants
  when: fleet_club.rc == 0
  register: fleet_grants
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '180'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'env',
          'ANSIBLE_CONFIG=' ~ intent.fleet.checkout.path ~ '/swamp/ansible/ansible.cfg', 'ANSIBLE_DISPLAY_FAILED_STDERR=true',
          '/opt/orbit/ansible/venv/bin/ansible-playbook', '-i', 'localhost,', '-e', '@/opt/orbit/bootstrap/control.yml', '--tags', 'grants',
          intent.fleet.checkout.path ~ '/swamp/ansible/gateway-bootstrap.yml'] }}
  changed_when: "fleet_grants.stdout is not search('changed=0 ')"
# The migrate runs whenever the code changed: `apps/gateway` holds its migrations and the Composer lock of the packages that ship
# migrations too. Only a migrate that applied one changed the nested Gateway's disk; any other output counts as applied.
- name: Migrate the nested Gateway
  when: fleet_due.code
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '120'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--cwd', intent.fleet.checkout.path ~ '/apps/gateway', '--']
         + fleet_as_app_user + ['php', 'artisan', 'migrate', '--force'] }}
  register: fleet_migrate
  changed_when: "'Nothing to migrate' not in fleet_migrate.stdout"
- name: Restart the services
  when: fleet_due.code
  ansible.builtin.command:
    argv: "{{ ['timeout', '120'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'systemctl', 'restart'] + fleet_gateway_services }}"
  changed_when: true
# One read per unit: `systemctl is-active` with several units succeeds when one of them is active.
- name: Read the services
  ansible.builtin.command:
    argv: "{{ ['timeout', '60'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'systemctl', 'is-active', '--quiet', item] }}"
  loop: "{{ fleet_gateway_services + (fleet_swamp_services if fleet_club.rc == 0 else []) }}"
  register: fleet_services
  changed_when: false
  failed_when: false
- name: Check the services
  vars:
    fleet_services_down: "{{ fleet_services.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
  ansible.builtin.assert:
    that: fleet_services_down | length == 0
    fail_msg: "{{ fleet_services_down | join(', ') }} not active in {{ intent.fleet.guests.gateway }}"
    quiet: true

# The nested Gateway, on its new code and schema, prints the digest of each Node's base converge intent (`orbit:node-converge-digest`): what
# the Gateway would send, with no Operation and no write. A read that fails makes the converge due, and its digest is not recorded.
- name: Read the base intent digests of the nested Nodes
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '60'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--cwd', intent.fleet.checkout.path ~ '/apps/gateway', '--']
         + fleet_as_app_user + ['php', 'artisan', 'orbit:node-converge-digest', '--base'] + fleet_roles }}
  register: fleet_intents_read
  changed_when: false
  failed_when: false
# The converge is due when the record is missing or unreadable, a digest cannot be read, the digest differs from the record, or the
# last converge that ran is older than `fleet_converge_max_age` seconds (7 days): a safety net for an input no digest covers.
- name: Work out whether the converge is due
  vars:
    fleet_intents: >-
      {%- set read = (fleet_intents_read.stdout_lines | default([]) | last | default('')) -%}
      {%- set out = read | from_json if fleet_intents_read.rc == 0 and read is match('^\{.*\}$') else {} -%}
      {{ out if out is mapping and out.keys() | sort == fleet_roles | sort
              and out.values() | select('match', '^[0-9a-f]{64}$') | list | length == fleet_roles | length else {} }}
    fleet_converge_now: >-
      {{ '' if fleet_swamp_ids | length == 0 or fleet_intents | length == 0 else
         (fleet_swamp_ids | join(' ') ~ ' ' ~ (fleet_roles | map('extract', fleet_intents) | join(' ')) ~ ' '
          ~ (intent.fleet | to_json(sort_keys=true))) | hash('sha256') }}
    fleet_converged_age: >-
      {{ (now().timestamp() | int) - (fleet_recorded.converged | int) if fleet_recorded.converged | default('') is match('^[0-9]+$') else none }}
  ansible.builtin.set_fact:
    fleet_now: "{{ fleet_now | combine({'converge': fleet_converge_now} if fleet_converge_now | length > 0 else {}) }}"
    fleet_converge_reason: >-
      {{ 'record' if fleet_record_state != 'present' else 'digest_unreadable' if fleet_converge_now | length == 0
         else 'changed' if fleet_recorded.converge | default('') != fleet_converge_now
         else 'stale' if fleet_converged_age | int(-1) < 0 or fleet_converged_age | int > fleet_converge_max_age | default(604800) | int
         else 'unchanged' }}
- name: Name the due converge
  ansible.builtin.set_fact:
    fleet_due: "{{ fleet_due | combine({'converge': fleet_converge_reason != 'unchanged'}) }}"

# The fleet rules and files, read on the running fleet every time. The base converge runs apt and downloads the agent through the egress
# proxy, so the fleet's files are written before it; the rules then find them in place with the fleet stopped. A rule or file that
# differed here changed the fleet, so `base` is due.
- { name: Read the fleet rules on the running fleet, ansible.builtin.include_tasks: instance-fleet-rules-read.yml }
- name: Keep what differed
  ansible.builtin.set_fact:
    fleet_drift_found: "{{ fleet_drift }}"
- { name: Write the fleet files that differ, ansible.builtin.import_tasks: instance-fleet-files.yml }
- name: Time the nested Gateway's part
  ansible.builtin.set_fact:
    fleet_gateway_at: "{{ now(utc=true).timestamp() }}"

# The base converge of each nested Node, so `base` holds the new agent and Orbit's files. It runs when the converge is due, and so
# does the wait for the agents: the readiness wait after it needs the agents anyway.
# The converge needs each Node's agent; after the restart the agents come back within seconds. The wait reads the Nodes every
# `fleet_ready_delay` seconds, `fleet_ready_seconds` (300 by default) worth of tries of at most 15 s each, and needs no Doctor.
- name: Wait for the agents of the nested Nodes
  when: fleet_due.converge
  ansible.builtin.command: { argv: "{{ ['timeout', '15'] + fleet_curl + ['--fail', fleet_api ~ '/nodes'] }}" }
  register: fleet_nodes_read
  changed_when: false
  failed_when: false
  vars:
    fleet_nodes_online: >-
      {{ ((fleet_nodes_read.stdout | from_json).data if fleet_nodes_read.rc | default(1) == 0 else [])
         | selectattr('agent', 'truthy') | selectattr('agent.state', 'eq', 'online') | map(attribute='name') | list }}
  until: fleet_nodes_read.rc == 0 and fleet_roles | difference(fleet_nodes_online) | length == 0
  retries: "{{ ((fleet_ready_seconds | default(300) | int) / ([fleet_ready_delay | int, 1] | max)) | round(0, 'ceil') | int }}"
  delay: "{{ fleet_ready_delay }}"
- name: Check the agents before the converge
  when: fleet_due.converge
  vars:
    fleet_nodes_online: >-
      {{ ((fleet_nodes_read.stdout | from_json).data if fleet_nodes_read.rc | default(1) == 0 else [])
         | selectattr('agent', 'truthy') | selectattr('agent.state', 'eq', 'online') | map(attribute='name') | list }}
  ansible.builtin.assert:
    that: fleet_nodes_read.rc == 0 and fleet_roles | difference(fleet_nodes_online) | length == 0
    fail_msg: >-
      {{ ('The nested Gateway did not list its Nodes within ' ~ (fleet_ready_seconds | default(300)) ~ ' s: '
          ~ (fleet_nodes_read.stderr | default('') | trim | truncate(400))) if fleet_nodes_read.rc != 0
         else ('The agent of ' ~ (fleet_roles | difference(fleet_nodes_online) | join(', ')) ~ ' was not online within '
          ~ (fleet_ready_seconds | default(300)) ~ ' s after the restart of the nested Gateway') }}
    quiet: true
- name: Select the nested Nodes in converge order
  when: fleet_due.converge
  vars:
    fleet_all: "{{ (fleet_nodes_read.stdout | from_json).data }}"
  ansible.builtin.set_fact:
    fleet_nodes: "{{ fleet_roles | map('extract', dict(fleet_all | map(attribute='name') | zip(fleet_all))) | select('defined') | list }}"
- name: Require the three nested Nodes
  when: fleet_due.converge
  ansible.builtin.assert:
    that: fleet_nodes | map(attribute='name') | list == fleet_roles
    fail_msg: "The nested Gateway must lead exactly the Nodes {{ fleet_roles | join(', ') }}; it has {{ fleet_nodes | map(attribute='name') | join(', ') }}"
    quiet: true
# Stop only the timers: an update transaction that already runs ends normally.
- name: Stop the update timers in the nested containers
  when: fleet_due.converge
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests[item], '--', 'systemctl', 'stop', 'apt-daily.timer', 'apt-daily-upgrade.timer'] }}"
  loop: "{{ fleet_roles }}"
  changed_when: true
- name: Wait for running updates to end
  when: fleet_due.converge
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '10'] + fleet_incus + ['exec', intent.fleet.guests[item], '--', 'systemctl', 'show', '--property=ActiveState', '--value',
          'apt-daily.service', 'apt-daily-upgrade.service'] }}
  register: fleet_updates
  vars:
    fleet_update_states: "{{ fleet_updates.stdout_lines | default([]) | reject('equalto', '') | list }}"
    fleet_updates_idle: "{{ fleet_update_states | length == 2 and fleet_update_states | difference(['inactive', 'failed']) | length == 0 }}"
  until: fleet_updates.rc != 0 or fleet_updates_idle
  retries: 29
  delay: "{{ fleet_ready_delay }}"
  failed_when: fleet_updates.rc != 0 or not fleet_updates_idle
  changed_when: false
  loop: "{{ fleet_roles }}"
# One Node after the other, and an include per Node stops at the first Node whose converge fails. They cannot run side by side: every
# step of the converge workflow has a fixed behavior name, so a second run waits for the first one's Swamp lock and fails after 60 s.
- name: Converge the base of each nested Node
  when: fleet_due.converge
  ansible.builtin.include_tasks: instance-fleet-converge-node.yml
  loop: "{{ fleet_nodes }}"
  loop_control: { loop_var: fleet_node, label: "{{ fleet_node.name }}" }

- name: Time the converge
  ansible.builtin.set_fact:
    fleet_converge_at: "{{ now(utc=true).timestamp() }}"

# One readiness wait every time, so the seed holds a ready fleet whether the fleet stops for `base` or keeps running.
- { name: Wait for readiness, ansible.builtin.import_tasks: instance-fleet-ready.yml }
- name: Time the readiness wait
  ansible.builtin.set_fact:
    fleet_ready_at: "{{ now(utc=true).timestamp() }}"

- name: Read the snapshots
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['query', '/1.0/instances/' ~ item ~ '/snapshots?recursion=1'] }}"
  loop: "{{ fleet_names }}"
  register: fleet_snapshots
  changed_when: false
# `base` is retaken only for the containers whose disk changed. A reset restores `base` of all three, so the set must stay consistent:
# - a step that writes a nested container's own disk and reported a change (`fleet_disk_writers`: the migrate and the grants of the
#   nested Gateway): that container's `base`;
# - a converge that changed a Node: that Node's `base` and the nested Gateway's, whose database records the converge;
# - a missing `base`: that container's;
# - a missing or unreadable record, or a fleet rule or file that differed: all three, with the rules applied on a stopped fleet.
# The other containers keep running. Their agents lose the nested Gateway while it stops and connect again after its start, as after
# the restart above; the start of the refreshed fleet starts what stopped and waits for readiness.
- name: Work out which base is due
  vars:
    fleet_base_missing: >-
      {%- set out = [] -%}
      {%- for read in fleet_snapshots.results -%}
      {%-   if 'base' not in (read.stdout | from_json | map(attribute='name') | list) -%}
      {%-     set _ = out.append(read.item) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    # Every step that writes to a nested container's own disk, with that container's role. A step that reported a change marks its
    # container for `base`. A new writer joins this list. The converges mark their Node and the nested Gateway, which records them.
    fleet_disk_writers: "{{ [['gateway', fleet_migrate], ['gateway', fleet_grants]] }}"
    fleet_changed_roles: >-
      {{ (fleet_disk_writers | selectattr('1', 'changed') | map('first') | list) + fleet_converge_changed_roles
         + (['gateway'] if fleet_converge_changed_roles | length > 0 else []) }}
  ansible.builtin.set_fact:
    fleet_base_targets: >-
      {{ fleet_names if fleet_record_state != 'present' or fleet_drift_found | length > 0
         else fleet_names | select('in', fleet_base_missing + (fleet_changed_roles | map('extract', intent.fleet.guests) | list)) | list }}

# A snapshot of a running container on a directory pool is a file copy, not a consistent state: each container stops first.
- name: Retake base
  when: fleet_base_targets | length > 0
  block:
    - name: Stop the nested containers
      ansible.builtin.command: { argv: "{{ ['timeout', '120'] + fleet_incus + ['stop', item, '--timeout', '90'] }}" }
      loop: "{{ fleet_base_targets }}"
      register: fleet_stop
      changed_when: true
      failed_when: false
    - name: Read the state of the stopped fleet
      ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_incus + ['list', '--format', 'csv', '--columns', 'ns'] }}" }
      register: fleet_stopped
      changed_when: false
    - name: Check that the nested containers stopped
      vars:
        fleet_still_running: >-
          {{ fleet_stopped.stdout_lines | reject('match', '^[^,]+,STOPPED$') | map('regex_replace', ',.*$', '') | select('in', fleet_base_targets) | list }}
      ansible.builtin.assert:
        that: fleet_still_running | length == 0
        fail_msg: >-
          {{ fleet_still_running | join(', ') }} did not stop:
          {{ fleet_stop.results | rejectattr('rc', 'eq', 0) | map(attribute='stderr') | join('; ') | truncate(400) }}
        quiet: true
    # With all three stopped the rules write what differed. With some stopped nothing differed when the refresh read them, so they only
    # compare: a write now would change a running container whose `base` stays.
    - name: Apply the fleet rules
      ansible.builtin.import_tasks: instance-fleet-rules.yml
      vars: { fleet_rules_apply: "{{ fleet_base_targets | length == fleet_names | length }}" }
    - name: Check that the rules still hold on a partly stopped fleet
      when: fleet_base_targets | length < fleet_names | length
      ansible.builtin.assert:
        that: fleet_drift | length == 0
        fail_msg: >-
          The nested fleet differs from its rules while only {{ fleet_base_targets | join(', ') }} stopped:
          {{ fleet_drift | map(attribute='container') | zip(fleet_drift | map(attribute='kind'), fleet_drift | map(attribute='name'))
             | map('join', ' ') | join(', ') }}
        quiet: true
    - name: Delete the old base
      ansible.builtin.command: { argv: "{{ ['timeout', '120'] + fleet_incus + ['snapshot', 'delete', item.item, 'base'] }}" }
      when: "item.item in fleet_base_targets and 'base' in (item.stdout | from_json | map(attribute='name') | list)"
      loop: "{{ fleet_snapshots.results }}"
      loop_control: { label: "{{ item.item }}" }
      changed_when: true
    - name: Take base
      ansible.builtin.command: { argv: "{{ ['timeout', '180'] + fleet_incus + ['snapshot', 'create', item, 'base'] }}" }
      loop: "{{ fleet_base_targets }}"
      changed_when: true

# The record goes last; it was removed before the first write, so a run that failed before this leaves none, and the next run does every
# part again and retakes all three. The result names what
# ran and what was skipped, with the seconds of each part.
- name: Name what the refresh did
  vars:
    fleet_done_at: "{{ now(utc=true).timestamp() }}"
  ansible.builtin.set_fact:
    fleet_refresh_result:
      migrate: "{{ 'skipped' if fleet_migrate is skipped else 'applied' if fleet_migrate is changed else 'nothing' }}"
      restart: "{{ 'yes' if fleet_due.code else 'no' }}"
      converge: "{{ 'ran' if fleet_due.converge else 'skipped' }}"
      # Why: `changed` (a digest differs), `record` (the record is missing or unreadable), `digest_unreadable`, `stale` (7 days), `unchanged`.
      converge_reason: "{{ fleet_converge_reason }}"
      changed: "{{ fleet_converge_changed | int }}"
      base: "{{ 'retaken' if fleet_base_targets | length > 0 else 'kept' }}"
      base_containers: "{{ fleet_base_targets }}"
      record: "{{ fleet_record_state }}"
      seconds:
        gateway: "{{ ((fleet_gateway_at | float) - (fleet_started_at | float)) | round | int }}"
        converge: "{{ ((fleet_converge_at | float) - (fleet_gateway_at | float)) | round | int }}"
        ready: "{{ ((fleet_ready_at | float) - (fleet_converge_at | float)) | round | int }}"
        base: "{{ ((fleet_done_at | float) - (fleet_ready_at | float)) | round | int }}"
# The container's id map is isolated: the Node's stdin pipe shows there as owned by nobody, mode 0600, so a command that opens
# /dev/stdin by path is refused. `cat` reads the open stream. It writes a file beside the record, and the rename makes the record
# whole or absent, never partial.
- name: Write the refresh record
  when: fleet_now | length > 0
  vars:
    fleet_record_write: >-
      mkdir -p "${1%/*}" && cat > "$1.tmp" && chown root:root "$1.tmp" && chmod 0644 "$1.tmp" && mv -f "$1.tmp" "$1"
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_outer + ['sh', '-c', fleet_record_write, 'sh', fleet_record] }}"
    stdin: >-
      {{ fleet_now | combine({'converged': (now().timestamp() | int | string) if fleet_due.converge
         else fleet_recorded.converged}) | to_json(sort_keys=true) }}
    stdin_add_newline: false
  changed_when: true
