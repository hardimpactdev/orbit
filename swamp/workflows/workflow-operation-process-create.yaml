id: 689cad3b-d90c-49fe-bf2f-5ed0974a32ec
name: operation-process-create
description: 'Rule 22 Process create: official cfgmgmt, SSH argv and a native end check.'
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [process.create, process.update]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^process-((create|update)-operation-[1-9][0-9]*|instance-operation-[1-9][0-9]*-member-[1-9][0-9]*|parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: process
  labels: {role: swamp}
  steps:
  - name: Check the account
    labels: {role: swamp}
    guard: ${{ inputs.intent.control.runtime == "docker" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-check-the-account-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-check-the-account-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', getent, passwd, '${{ has(inputs.intent.installation.account_user) ? inputs.intent.installation.account_user : inputs.intent.ssh_execution.target.user
            }}'], sudo: true, timeoutSec: 25}
  - name: Prepare the definition
    labels: {role: swamp}
    dependsOn: [{step: Check the account, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: ${{ "process-definition-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: lifecycle
      inputs: {control: '${{ inputs.intent.control }}', installation: '${{ inputs.intent.installation }}', account: '${{ inputs.intent.control.runtime == "systemd" ? steps["Check the
          account"].outputs.stdout : "" }}'}
  - name: Check the release
    labels: {role: swamp}
    dependsOn: [{step: Prepare the definition, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.installation.desired != "running" || !has(inputs.intent.control.directory) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-check-the-release-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-check-the-release-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', test, -d, '${{ has(inputs.intent.control.directory) ? inputs.intent.control.directory : "/" }}'], sudo: true, timeoutSec: 25}
  - name: Check required mounts
    labels: {role: swamp}
    dependsOn: [{step: Prepare the definition, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || inputs.intent.installation.desired != "running" || !has(inputs.intent.mounts) || size(inputs.intent.mounts) == 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-mounts-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-mounts-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: '${{ ["timeout", "20", "stat", "--"] + (has(inputs.intent.mounts) ? inputs.intent.mounts.map(mount, mount.path) : []) }}', sudo: true, timeoutSec: 25}
  - name: Remove the retired unit
    labels: {role: swamp}
    dependsOn: [{step: Prepare the definition, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the release, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}, {step: Check required mounts, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.installation.retired == null) }}
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent:
          control:
            process_id: ${{ inputs.intent.control.process_id }}
            runtime: '${{ inputs.intent.installation.retired != null ? inputs.intent.installation.retired.runtime : inputs.intent.control.runtime }}'
            name: '${{ inputs.intent.installation.retired != null ? inputs.intent.installation.retired.name : inputs.intent.control.name }}'
            on_demand: false
            vite: null
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
  - name: Write the environment
    labels: {role: swamp}
    dependsOn: [{step: Remove the retired unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the release, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}, {step: Check required mounts, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (!inputs.intent.installation.has_environment) }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-environment-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ inputs.intent.installation.environment_path }}', ensure: present, content: '${{
          vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}', owner: root, group: root, mode: '0600'}
      inputs: {}
  - name: Write the unit
    labels: {role: swamp}
    dependsOn: [{step: Remove the retired unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the release, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}, {step: Check required mounts, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Write the environment,
        condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-unit-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ "/etc/systemd/system/" + inputs.intent.control.name }}', ensure: present,
        content: '${{ steps["Prepare the definition"].outputs.unit }}', owner: root, group: root, mode: '0644'}
      inputs: {}
  - name: Reload systemd
    labels: {role: swamp}
    dependsOn: [{step: Write the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd" || !(size(data.latest("process-unit-" + string(inputs.node_id)
      + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.changes) > 0 || (has(inputs.intent.installation.activation_pending) && inputs.intent.installation.activation_pending)))
      }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-reload-systemd-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-reload-systemd-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', systemctl, daemon-reload], sudo: true, timeoutSec: 25}
  - name: Publish the dev route
    labels: {role: swamp}
    dependsOn: [{step: Write the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Reload systemd, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (!has(inputs.intent.vite_plan) || inputs.kind == "process.stop") }}
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-process-vite
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          vite_plan: '${{ has(inputs.intent.vite_plan) ? inputs.intent.vite_plan : {} }}'
          caddy_publication: '${{ has(inputs.intent.caddy_publication) ? inputs.intent.caddy_publication : {} }}'
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
  - name: Apply the unit state
    labels: {role: swamp}
    dependsOn: [{step: Write the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Reload systemd, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: Publish the dev route, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}', ensure: '${{ inputs.intent.installation.desired
          }}', enabled: '${{ (inputs.intent.installation.desired) == "running" && !inputs.intent.control.on_demand }}'}
      inputs: {}
  - name: Stop the unit
    labels: {role: swamp}
    dependsOn: [{step: Apply the unit state, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd" || inputs.intent.installation.desired != "stopped") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-stop-the-unit-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-stop-the-unit-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', systemctl, stop, '${{ inputs.intent.control.name }}'], sudo: true, timeoutSec: 25}
  - name: Restart if changed
    labels: {role: swamp}
    dependsOn: [{step: Apply the unit state, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd" || inputs.intent.installation.desired != "running" || !(size(data.latest("process-unit-"
      + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.changes) > 0 || (has(inputs.intent.installation.activation_pending)
      && inputs.intent.installation.activation_pending)) || data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.changes.exists(c,
      c == "start service")) }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-restart-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: restart
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}'}
      inputs: {}
  - name: Check the unit
    labels: {role: swamp}
    dependsOn: [{step: Apply the unit state, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Stop the unit, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: Restart if changed, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: check
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}', ensure: '${{ inputs.intent.installation.desired
          }}', enabled: '${{ (inputs.intent.installation.desired) == "running" && !inputs.intent.control.on_demand }}'}
      inputs: {}
  - name: Pull the image
    labels: {role: swamp}
    dependsOn: [{step: Remove the retired unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the release, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}, {step: Check required mounts, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "docker") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_image'
      behaviorName: ${{ "process-image-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, image: '${{ has(inputs.intent.installation.definition) ? inputs.intent.installation.definition.image
          : "unused" }}', ensure: present}
      inputs: {}
  - name: Read container spec
    labels: {role: swamp}
    dependsOn: [{step: Pull the image, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "docker" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-container-spec-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-container-spec-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', docker, container, ls, --all, --filter, '${{ "name=^/" + inputs.intent.control.name + "$" }}', --format, '{{.ID}} {{.Label "orbit.process.spec"}}'],
        sudo: true, timeoutSec: 25}
  - name: Remove the old container
    labels: {role: swamp}
    dependsOn: [{step: Read container spec, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || inputs.intent.control.runtime != "docker" || steps["Read container spec"].outputs.stdout == ""
      || steps["Read container spec"].outputs.stdout.endsWith(" " + inputs.intent.installation.spec + "\n") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_container'
      behaviorName: ${{ "process-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, name: '${{ inputs.intent.control.name }}', image: unused, ensure: absent}
      inputs: {}
    dataOutputOverrides: [{specName: state, vaultName: orbit-control-inputs}]
  - name: Create the container
    labels: {role: swamp}
    dependsOn: [{step: Remove the old container, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Write the environment, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || inputs.intent.control.runtime != "docker" || steps["Read container spec"].outputs.stdout.endsWith("
      " + inputs.intent.installation.spec + "\n") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-create-the-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-create-the-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: '${{ steps["Prepare the definition"].outputs.container_argv }}', sudo: true, timeoutSec: 25}
  - name: Remove staged env file
    labels: {role: swamp}
    dependsOn: [{step: Create the container, condition: {type: completed}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || !inputs.intent.installation.has_environment }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-environment-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ inputs.intent.installation.environment_path }}', ensure: absent}
      inputs: {}
  - name: Apply the container state
    labels: {role: swamp}
    dependsOn: [{step: Create the container, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Remove staged env file, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "docker") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-apply-the-container-state-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-apply-the-container-state-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', docker, container, '${{ inputs.intent.installation.desired == "running" ? "start" : "stop" }}', '${{ inputs.intent.control.name
            }}'], sudo: true, timeoutSec: 25}
  - name: Check the container
    labels: {role: swamp}
    dependsOn: [{step: Apply the container state, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "docker" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-check-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-check-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', docker, container, inspect, --format, '{{.State.Status}}', '${{ inputs.intent.control.name }}'], sudo: true, timeoutSec: 25}
  - name: Check the listener
    labels: {role: swamp}
    dependsOn: [{step: Check the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the container, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}]
    guard: ${{ !has(inputs.intent.vite_plan) || inputs.intent.installation.desired != "running" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-listener-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-listener-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', ss, -H, -ltn, '${{ "sport = :" + (has(inputs.intent.vite_plan) ? string(inputs.intent.vite_plan.listener.port) : "0") }}'], sudo: true,
        timeoutSec: 25}
  - name: Mark it awake
    labels: {role: swamp}
    dependsOn: [{step: Check the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the container, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: Check the listener, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (!has(inputs.intent.vite_plan) || inputs.intent.installation.desired != "running" || steps["Check the
      listener"].outputs.stdout == "") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-awake-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ has(inputs.intent.vite_plan) ? inputs.intent.vite_plan.awake.marker : "/unused"
          }}', ensure: present, owner: root, group: root, mode: '0644'}
      inputs: {}
  - name: Accept the Process
    labels: {role: swamp}
    dependsOn: [{step: Check the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the container, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: Mark it awake, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the listener, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}]
    task:
      type: assert
      expr: '(inputs.intent.control.runtime == "systemd" ? (data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.status
        == "compliant" && data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.current.loaded
        && data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.current.active
        == (inputs.intent.installation.desired == "running" ? "active" : "inactive")) : (inputs.intent.installation.desired == "running" ? steps["Check the container"].outputs.stdout
        == "running\n" : steps["Check the container"].outputs.stdout in ["created\n", "exited\n"])) && (!has(inputs.intent.vite_plan) || inputs.intent.installation.desired != "running"
        || steps["Check the listener"].outputs.stdout != "")'
      message: The Process must have its admitted runtime and boot state.
      severity: high
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) }}
