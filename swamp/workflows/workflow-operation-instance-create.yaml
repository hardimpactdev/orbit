id: c2c6c4a5-a667-4a81-9f5a-fae18fdf5d4a
name: operation-instance-create
description: One native Instance create root with placed source and environment steps.
writes: true
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [instance.create] }
  required: [operation_id, node_id, kind]
jobs:
  - name: provisioning
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: { node: "${{ string(inputs.node_id) }}" }
    steps:
      - name: prepare
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: prepare
      - name: resolve
        dependsOn:
          - step: prepare
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: resolve
      - name: profile
        dependsOn:
          - step: resolve
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: profile
            source: '${{ {"branch": steps.resolve.outputs.branch, "commit": steps.resolve.outputs.commit} }}'
      - name: template
        dependsOn:
          - step: profile
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: template
            source: '${{ {"branch": steps.resolve.outputs.branch, "commit": steps.resolve.outputs.commit} }}'
      - name: environment
        dependsOn:
          - step: template
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: environment
      - name: vp
        dependsOn:
          - step: environment
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: vp
      - name: setup
        dependsOn:
          - step: vp
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: stage
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            stage: setup
      - name: complete
        dependsOn:
          - step: setup
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: finish
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: failure_prepare
        dependsOn:
          - step: prepare
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: prepare
      - name: failure_resolve
        dependsOn:
          - step: resolve
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: resolve
      - name: failure_profile
        dependsOn:
          - step: profile
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: profile
      - name: failure_template
        dependsOn:
          - step: template
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: template
      - name: failure_environment
        dependsOn:
          - step: environment
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: environment
      - name: failure_vp
        dependsOn:
          - step: vp
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: vp
      - name: failure_setup
        dependsOn:
          - step: setup
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: setup
      - name: failure_complete
        dependsOn:
          - step: complete
            condition: { type: failed }
        task:
          type: behavior
          behaviorType: "@nckrtl/instance-create"
          behaviorName: '${{ "instance-create-" + run.id }}'
          methodName: fail
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            failed_step: complete
