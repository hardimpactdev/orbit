id: 4977fbb9-658c-4d9c-a984-d003f4dbe225
name: route-ingress-apply
description: Converge public ingress through the canonical pinned tuple child.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: firewall
    steps:
      - name: converge
        target: orbit-node-209
        task:
          type: workflow
          workflowIdOrName: route-lan-apply
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            execution_secrets: {}
            intent:
              control_node_id: 209
              connection: '${{ inputs.intent.connection }}'
              host_keys: '${{ inputs.intent.host_keys }}'
              rule:
                node_id: '${{ inputs.intent.rule.node_id }}'
                migrate: false
                rules: >-
                  ${{ inputs.intent.rule.rules.map(r, {"model_name": "public-" +
                  string(r.port), "port": r.port, "protocol": "tcp", "source":
                  "any", "ensure": r.ensure}) }}
      - name: result
        target: orbit-node-209
        dependsOn:
          - step: converge
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/route-update-result'
          behaviorName: route-ingress-result
          methodName: firewall
          inputs:
            ready: '${{ steps.converge.outputs.result.ready }}'
