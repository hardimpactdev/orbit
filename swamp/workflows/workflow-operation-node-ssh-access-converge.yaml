id: d672c246-33c1-4fc7-b8b4-ae37f4885b1e
name: operation-node-ssh-access-converge
description: Add Orbit's SSH keys to a Node's managed account with official cfgmgmt from 209; other keys stay.
queueTimeout: 30
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer}
    node_id: {type: integer}
    kind: {type: string, enum: [node.ssh_access_converge]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: ssh_access
  labels: {role: swamp}
  steps:
    # One official authorized_key per key Orbit owns; it adds a missing line and never touches another.
  - name: 'Add the Orbit keys'
    labels: {role: swamp}
    writes: true
    forEach: {item: key, in: '${{ inputs.intent.keys }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/authorized_key'
      behaviorName: ${{ "node-ssh-access-key-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs: {user: '${{ inputs.intent.target.user }}', key: '${{ self.key }}', ensure: present, nodeHost: '${{ inputs.intent.target.host }}',
        nodeUser: '${{ inputs.intent.target.user }}', nodePort: '${{ inputs.intent.target.port }}', nodeIdentityFile: '${{ inputs.intent.identity_file }}'}
      inputs: {}
    # The end check: a new session with the swamp role identity only.
  - name: 'Log in with Swamp identity'
    labels: {role: swamp}
    dependsOn: [{step: 'Add the Orbit keys', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-ssh-access-" + string(inputs.node_id) + "-own" }}
      methodName: exec
      globalArgs:
        name: ${{ "node-ssh-access-" + string(inputs.node_id) + "-own" }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.target.user }}
          port: ${{ inputs.intent.target.port }}
          hostKeys: ${{ inputs.intent.target.host_keys }}
          identityFile: ${{ inputs.intent.identity_file }}
          identitiesOnly: true
        hosts:
        - name: target
          address: ${{ inputs.intent.target.host }}
      inputs:
        hosts: name:target
        argv: [/usr/bin/true]
        timeoutSec: 30
