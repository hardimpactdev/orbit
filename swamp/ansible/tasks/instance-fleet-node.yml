---
# The first part of the container branch on an Instance fleet Node: `nested-app-dev` of a nested fleet, a third level below the host
# (docs/reference/development-containers.md#instance-host-in-the-fleet). The Gateway sends `instances.fleet_node` only for it, so a real
# app-dev or CI Node keeps the branch as it was. The Node has no Incus and no pool: this part installs Incus first, runs it without
# AppArmor, which cannot load a profile there, and creates the btrfs pool. The rest of the branch then finds both.
- name: Make the folder of the Incus drop-in
  ansible.builtin.file: { path: /etc/systemd/system/incus.service.d, state: directory, owner: root, group: root, mode: "0755" }
- name: Run the fleet Node's Incus without AppArmor
  ansible.builtin.copy:
    dest: /etc/systemd/system/incus.service.d/50-orbit-nested.conf
    content: |
      [Service]
      Environment=INCUS_SECURITY_APPARMOR=false
    owner: root
    group: root
    mode: "0644"
  register: fleet_node_apparmor

- name: Install Incus on the fleet Node
  ansible.builtin.include_tasks: incus-install.yml
  vars:
    container_host: { incus: "{{ instances.incus }}" }

# An Incus that started before the drop-in, such as one installed by hand, takes it now.
- name: Restart Incus with the drop-in # noqa: no-handler -- host bridge preparation needs the restarted daemon
  when: fleet_node_apparmor.changed
  ansible.builtin.systemd_service: { name: incus.service, daemon_reload: true, state: restarted }

# The Instance pool is btrfs on the Node's own btrfs root, so a copy is a subvolume snapshot, never a file copy. The Incus btrfs driver
# needs `btrfs-progs`. The release pool of a nested proof Node (production-release-host.yml) sets `instances.driver` to `dir`: it holds
# the release containers, so it is never replaced.
- name: Name the driver of the fleet Node's pool
  ansible.builtin.set_fact:
    fleet_node_driver: "{{ instances.driver | default('btrfs') }}"
- name: Find the btrfs tools on the fleet Node
  when: fleet_node_driver == 'btrfs'
  ansible.builtin.import_tasks: apt-missing.yml
  vars: { apt_wanted: [btrfs-progs] }
- name: Install the btrfs tools on the fleet Node
  when: fleet_node_driver == 'btrfs' and apt_missing | length > 0
  ansible.builtin.apt: { name: btrfs-progs, state: present, install_recommends: false, update_cache: true, cache_valid_time: 3600 }

- name: Read the Incus pools
  ansible.builtin.command: { argv: [incus, query, "--", "/1.0/storage-pools?recursion=1"] }
  register: fleet_node_pools
  changed_when: false

# A Node made before the btrfs pool has a directory pool. It holds nothing but the root device of the managed `default` profile of the
# Instance projects, which the profile step of the role writes again (task-container-host-prepare.yml). Any other user refuses before
# anything changes. A rerun after a break part way goes on: once the root device is gone the pool is unused and is deleted, and a
# deleted pool is created below.
- name: Replace a pool of another driver
  when: fleet_node_pool | length > 0 and (fleet_node_pool | first).driver != fleet_node_driver
  vars:
    fleet_node_pool: "{{ fleet_node_pools.stdout | from_json | selectattr('name', 'equalto', instances.pool) | list }}"
    fleet_node_managed_projects: "{{ [instances.project] + ([instances.nested.project] if instances.nested is defined else []) }}"
    # Every device on the pool in the profiles read below. A used_by entry names its project in `?project=`; without one it is the
    # default project.
    fleet_node_devices: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for read in fleet_node_profiles.results | default([]) -%}
        {%- set profile = read.stdout | from_json -%}
        {%- set project = read.item.split('project=')[1] if 'project=' in read.item else 'default' -%}
        {%- for device in profile.devices | dict2items if device.value.pool | default('') == instances.pool -%}
          {%- set ns.out = ns.out + [{'project': project, 'label': project ~ '/' ~ profile.name ~ ' ' ~ device.key,
                                      'managed': profile.name == 'default' and device.key == 'root'
                                                 and project in fleet_node_managed_projects}] -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.out }}
  block:
    - name: Read the profiles that use the pool
      ansible.builtin.command: { argv: [incus, query, "--", "{{ item }}"] }
      loop: "{{ (fleet_node_pool | first).used_by | select('match', '^/1.0/profiles/') | list }}"
      register: fleet_node_profiles
      changed_when: false
    - name: Refuse a pool that another user holds
      ansible.builtin.assert:
        that: fleet_node_held | length == 0
        fail_msg: >-
          instance.host_unavailable: the Incus pool {{ instances.pool }} uses the {{ (fleet_node_pool | first).driver }} driver and
          holds {{ fleet_node_held | join(', ') }}; the converge replaces it with a {{ fleet_node_driver }} pool only when nothing but the root device
          of the managed default profile uses it
        quiet: true
      vars:
        fleet_node_held: >-
          {{ (fleet_node_pool | first).used_by | reject('match', '^/1.0/profiles/') | list
             + fleet_node_devices | rejectattr('managed') | map(attribute='label') | list }}
    - name: Remove the managed root device on the pool
      ansible.builtin.command:
        argv: [incus, profile, device, remove, default, root, --project, "{{ item.project }}"]
      loop: "{{ fleet_node_devices | selectattr('managed') | list }}"
      loop_control: { label: "{{ item.label }}" }
      changed_when: true
    - name: Delete the pool of another driver
      ansible.builtin.command: { argv: [incus, storage, delete, "{{ instances.pool }}"] }
      changed_when: true

- name: Create the pool on the Node's root
  when: fleet_node_pool | length == 0 or (fleet_node_pool | first).driver != fleet_node_driver
  vars:
    fleet_node_pool: "{{ fleet_node_pools.stdout | from_json | selectattr('name', 'equalto', instances.pool) | list }}"
  ansible.builtin.command:
    argv: >-
      {{ ['incus', 'storage', 'create', instances.pool, fleet_node_driver]
         + (['source=/var/lib/incus/storage-pools/' ~ instances.pool] if fleet_node_driver == 'btrfs' else []) }}
  changed_when: true

# The power helper reads this marker and keeps the fast wake off for every Instance here, as for nested-fleet Instances (ADR 0261).
- name: Make the folder of the marker
  ansible.builtin.file: { path: /etc/orbit, state: directory, owner: root, group: root, mode: "0755" }
- name: Mark the Instance fleet Node
  ansible.builtin.copy:
    dest: /etc/orbit/instance-fleet-node
    content: "# Managed by Orbit: an Instance fleet Node; the fast wake stays off (docs/reference/development-containers.md#instance-host-in-the-fleet).\n"
    owner: root
    group: root
    mode: "0644"
