---
# The package cache of the task VM (docs/cli/tasks/vm-image-build.mmd): stock apt-cacher-ng, not in the recipe: it is not a pinned tool.
# It installs from the VM's own sources, as the first task of the software phase, so that the reads of the later phases fill it.
# The nested Nodes of the fleet read the Ubuntu snapshot indexes from it (docs/cli/tasks/vm-fleet-build.mmd).
# It keeps no .deb: an image carries the indexes, not the packages.
- name: Read installed packages
  ansible.builtin.package_facts: { manager: apt }
- name: Install the package cache
  when: "'apt-cacher-ng' not in ansible_facts.packages"
  ansible.builtin.apt: { name: apt-cacher-ng, state: present, update_cache: true, cache_valid_time: 3600, install_recommends: false }
  environment: { DEBIAN_FRONTEND: noninteractive, NEEDRESTART_MODE: l }
  register: apt_cache_install
  until: apt_cache_install is succeeded
  retries: "{{ apt_retries }}"
  delay: "{{ apt_delay }}"
# A snapshot never changes, so the cache serves what it holds and does not ask the snapshot service again: its answers to a
# revalidation fail now and then.
- name: Keep the packages out of the cache and the indexes in
  ansible.builtin.copy:
    dest: /etc/apt-cacher-ng/zz_orbit.conf
    content: |
      DontCacheRequested: \.deb$
      SPfilePatternEx: /ubuntu/[0-9]{8}T[0-9]{6}Z/
    owner: root
    group: root
    mode: "0644"
  register: apt_cache_config
- name: Run the package cache
  ansible.builtin.systemd:
    name: apt-cacher-ng.service
    enabled: true
    state: "{{ 'restarted' if apt_cache_config is changed else 'started' }}"
