cases = [
  "the rollout runs one tagged phase of the shipped playbook between the input and the result, and takes no secret",
  "every module that a Mac Node runs has a task timeout of at least 60 s",
  "the phase's deadline covers every Node's bounded worst case, so a run-level timeout never cuts a rollback",
  "a Mac canary checks, swaps the bundle on the same path, kickstarts in the gui domain and answers /health with the version",
  "a Linux withdrawal checks without stopping, then stops and unlinks or restores the old service after a failed stop",
  "Linux withdrawal resumes after the stop or unlink without restarting or sending the notice again",
  "managed Conn dry runs report observed health rather than the selected replacement",
  "a Mac Node with the wrong LaunchAgent label fails before staging, in a dry run too",
  "a zip whose SHA-256 differs fails the Node and installs nothing",
  "a bundle signed by another team, or with an invalid signature, fails the Node and installs nothing",
  "a changed designated requirement holds the canary, installs nothing and stops the run",
  "a failed health check restores the backup, kickstarts the old server, fails the canary and stops the run",
  "a same-identity swap answers the TCC prompt its start raises, leaves none unanswered, and /health names the version",
  "a server that still answers the old version fails the /health version check and is rolled back",
  "the expected Conn Server prompt is allowed; any other prompt fails the Node and rolls back",
  "a Linux Node whose new release fails its health check points current back at the old release",
  "a kickstart, Allow click or systemctl restart that exits non-zero restores the old version, which runs again",
  "a Linux Node whose /health names another server is not updated, as on a Mac",
  "a Linux Node whose unit or tarball differs from the assumed layout fails before any change, in a dry run too",
  "after the canary, the Linux Node moves current to a new release under systemd; a dry run only checks",
  "a Linux Node reads /health on its unit's --host, in the check, the start and the rollback",
  "a Linux unit without --host, or with a wildcard one, reads /health on 127.0.0.1",
  "a Linux Node whose running server does not answer 200 with its version fails before any change, in a dry run too",
  "a Mac Node whose running server answers 503 without a version fails before any change, in a dry run too",
  "Mac preflight rejects redirected, non-200 and malformed version responses",
  "Mac health bypasses the configured HTTP proxy before a swap and after each restart",
  "Mac restart and rollback each require a direct 200 with the intended version",
  "a Node set to notify posts the notice before its restart; with no target set, nothing is sent",
  "a move into the backup that renames the bundle and then fails restores the old bundle, which runs again",
  "a failed notice URL or command fails the Node with its code before any change, and appears in no output",
  "run as the workflow runs it, over ssh with no connection override, a Mac dry run writes its result from the worker",
  "over ssh, a Mac dry run whose first three modules each take 15 s to start still reaches checked",
  "a run with more Nodes than its deadline covers is refused before any Node is reached",
  "a Linux Node set up before this rollout, with no releases folder, gets the folder and is updated; a dry run makes none",
  "an existing release folder fails with backup_exists, and a releases folder that cannot be made fails with its own cause",
  "the release canary reads its thread before keeping the update and rolls back a wrong thread",
  "an SSH reset during the canary thread read rolls back the updated Mac",
  "an SSH reset during the Mac swap or Linux restart restores the original server",
]
file = "swamp/tests/workflow_conn_server_rollout_test.ts"
cost = 636
# Local runs in tasks 6221, 6232, 6236 and 6240: largest case time + 25%, rounded up + 1 s; ESTIMATES until a complete hosted run. CI balances the slices by the recorded case times.
