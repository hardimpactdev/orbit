---
- name: Prove bridge rule planning on fixed input
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    bridge_cidr: 10.253.0.0/24
    bridge_endpoints: [{host: 10.44.0.7, port: 3306}, {host: 10.44.0.7, port: 3306}]
    bridge_base_rules:
      egress: [{action: allow, destination: 10.253.0.1/32, protocol: tcp, destination_port: '3128', state: enabled}]
      ingress: [{action: allow, source: 10.253.0.1/32, protocol: tcp, destination_port: '1024-65535', state: enabled}]
    stale: {action: allow, source: 10.253.0.0/24, destination: 10.44.0.3/32, protocol: tcp, destination_port: '5434', state: enabled}
    bridge_current:
      egress:
        - "{{ stale }}"
        - {action: allow, source: 10.253.0.0/24, destination: 172.17.0.0/16, protocol: tcp, destination_port: '3306', state: enabled}
        - {action: allow, source: 10.253.0.1/32, destination: 10.44.0.3/32, protocol: tcp, destination_port: '5434', state: enabled}
        - {action: allow, destination: 10.253.0.1/32, protocol: tcp, destination_port: '3128', state: enabled}
  tasks:
    - name: Check host reconciliation and add-only lifecycle planning
      ansible.builtin.assert:
        that:
          - plan.changes | selectattr('action', 'equalto', 'remove') | map(attribute='rule') | list == ([stale] if bridge_reconcile else [])
          - plan.changes | selectattr('action', 'equalto', 'add') | list | length == 3
        quiet: true
      vars:
        bridge_reconcile: "{{ item }}"
        plan: "{{ lookup('ansible.builtin.template', '../../../../../ansible/templates/instance-bridge-rules.j2') | from_json }}"
      loop: [true, false]
