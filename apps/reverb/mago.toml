version = "1.41.0"
php-version = "8.5"

[source]
paths = ["bootstrap", "config", "routes"]
includes = ["../gateway/vendor"]
excludes = ["bootstrap/cache", "storage"]

[formatter]
preset = "laravel"

[analyzer]
baseline = "mago-analyzer-baseline.toml"

[linter]
baseline = "mago-linter-baseline.toml"
integrations = ["laravel"]
