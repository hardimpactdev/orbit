---
# The model key of one task VM on the model router (CLIProxyAPI), reached from the Swamp Node.
# One tagged part per Swamp phase: `anchor` first, then `issue` or `revoke`.
# `model_origin` comes from the admitted intent. The three keys come from the environment, never from argv.
# A call must not leave the origin it was made to: the management key would travel with it. So no redirect, no proxy, no netrc.
- name: Task VM model key
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      timeout: 5
      follow_redirects: none
      use_proxy: false
      use_netrc: false
      return_content: false
  vars:
    router: "{{ model_origin | regex_replace('/$', '') }}"
    model_key: "{{ lookup('ansible.builtin.env', 'ORBIT_MODEL_KEY') }}"
    model_management: "{{ lookup('ansible.builtin.env', 'ORBIT_MODEL_MANAGEMENT') }}"
    model_anchor: "{{ lookup('ansible.builtin.env', 'ORBIT_MODEL_ANCHOR') }}"
    management_headers:
      Authorization: "Bearer {{ model_management }}"
  tasks:
    - name: Check the inputs
      tags: [always]
      block:
        - name: Check the origin and the two keys
          no_log: true
          ansible.builtin.assert:
            that:
              - model_origin is match('^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$')
              - model_key is match('^[a-f0-9]{64}$')
              - model_anchor is match('^[a-f0-9]{64}$')
              - model_key != model_anchor
      rescue:
        - name: Report the failure
          ansible.builtin.fail:
            msg: task_vm.model_key_failed

    - name: Anchor
      tags: [anchor]
      block:
        - name: Read the keys
          ansible.builtin.import_tasks: tasks/model-key-list.yml
        - name: Remember the keys
          no_log: true
          ansible.builtin.set_fact:
            keys_before: "{{ router_keys }}"
        - name: Add the anchor key when it is missing
          no_log: true
          ansible.builtin.uri:
            url: "{{ router }}/v0/management/api-keys"
            method: PATCH
            headers: "{{ management_headers }}"
            body_format: json
            body: { old: "{{ model_anchor }}", new: "{{ model_anchor }}" }
          changed_when: true
          when: model_anchor not in keys_before and keys_before | length < 4096
        - name: Read the keys again
          ansible.builtin.import_tasks: tasks/model-key-list.yml
        - name: Check that only the anchor key was added
          no_log: true
          ansible.builtin.assert:
            that:
              - router_keys == (keys_before if model_anchor in keys_before else keys_before + [model_anchor])
        - name: Check that the anchor key works
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "{{ model_anchor }}", access_status: 200 }
        - name: Check that no key is refused
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "", access_status: 401 }
      rescue:
        - name: Report the failure
          ansible.builtin.fail:
            msg: task_vm.model_key_failed

    - name: Issue
      tags: [issue]
      block:
        - name: Read the keys
          ansible.builtin.import_tasks: tasks/model-key-list.yml
        - name: Remember the keys
          no_log: true
          ansible.builtin.set_fact:
            keys_before: "{{ router_keys }}"
        - name: Check that the anchor key is there
          no_log: true
          ansible.builtin.assert:
            that: model_anchor in keys_before
        - name: Add the model key
          no_log: true
          ansible.builtin.uri:
            url: "{{ router }}/v0/management/api-keys"
            method: PATCH
            headers: "{{ management_headers }}"
            body_format: json
            body: { old: "{{ model_key }}", new: "{{ model_key }}" }
          changed_when: true
          when: model_key not in keys_before and keys_before | length < 4096
        - name: Read the keys again
          ansible.builtin.import_tasks: tasks/model-key-list.yml
        - name: Check that only the model key was added
          no_log: true
          ansible.builtin.assert:
            that:
              - model_anchor in router_keys
              - router_keys == (keys_before if model_key in keys_before else keys_before + [model_key])
        - name: Check that the model key works
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "{{ model_key }}", access_status: 200 }
        - name: Check that the anchor key works
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "{{ model_anchor }}", access_status: 200 }
        - name: Check that no key is refused
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "", access_status: 401 }
      rescue:
        - name: Report the failure
          ansible.builtin.fail:
            msg: task_vm.model_key_failed

    - name: Revoke
      tags: [revoke]
      block:
        - name: Read the keys
          ansible.builtin.import_tasks: tasks/model-key-list.yml
        - name: Remember the keys
          no_log: true
          ansible.builtin.set_fact:
            keys_before: "{{ router_keys }}"
            keys_expected: "{{ router_keys | reject('equalto', model_key) | list }}"
        - name: Check that the anchor key is there
          no_log: true
          ansible.builtin.assert:
            that: model_anchor in keys_before
        - name: Remove the model key
          no_log: true
          ansible.builtin.uri:
            url: "{{ router }}/v0/management/api-keys"
            method: PUT
            headers: "{{ management_headers }}"
            body_format: json
            body: "{{ keys_expected | to_json }}"
          changed_when: true
          when: model_key in keys_before
        - name: Read the keys again
          ansible.builtin.import_tasks: tasks/model-key-list.yml
        - name: Check that only the model key was removed
          no_log: true
          ansible.builtin.assert:
            that:
              - model_anchor in router_keys
              - router_keys == keys_expected
        - name: Check that the model key is refused
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "{{ model_key }}", access_status: 401 }
        - name: Check that the anchor key works
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "{{ model_anchor }}", access_status: 200 }
        - name: Check that no key is refused
          ansible.builtin.import_tasks: tasks/model-key-access.yml
          vars: { access_token: "", access_status: 401 }
      rescue:
        - name: Report the failure
          ansible.builtin.fail:
            msg: task_vm.model_key_failed
