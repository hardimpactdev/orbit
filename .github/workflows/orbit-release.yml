name: Orbit Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hardimpactdev/orbit-gateway

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, sqlite3, curl, openssl, mbstring, tokenizer, ctype, filter, fileinfo, phar, zlib
          tools: composer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          version="${tag#v}"
          canonical_version="$(bin/orbit-version)"

          if [ "$tag" = "$version" ]; then
            echo "Release tag must start with v, got [$tag]." >&2
            exit 1
          fi

          if [ "$version" != "$canonical_version" ]; then
            echo "Release tag [$tag] does not match VERSION [$canonical_version]." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish split package repositories
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          SPLIT_PUSH_TOKEN: ${{ secrets.ORBIT_RELEASE_TOKEN || github.token }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail

          publish_split() {
            package="$1"
            repository="$2"
            output="$RUNNER_TEMP/orbit-splits/$package"

            rm -rf "$output"
            bin/orbit-prepare-release-package --package="$package" --version="$VERSION" --output="$output"

            git -C "$output" init
            git -C "$output" config user.name "github-actions[bot]"
            git -C "$output" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$output" add -A
            git -C "$output" commit -m "Release $TAG"
            git -C "$output" branch -M main
            git -C "$output" tag -f "$TAG"
            git -C "$output" remote add origin "https://x-access-token:${SPLIT_PUSH_TOKEN}@github.com/${repository}.git"
            git -C "$output" push --force origin HEAD:main
            git -C "$output" push --force origin "refs/tags/${TAG}"
          }

          publish_split core hardimpactdev/orbit-core
          publish_split cli hardimpactdev/orbit-cli
          publish_split gateway hardimpactdev/orbit-gateway

          if [ -n "${PACKAGIST_USERNAME:-}" ] && [ -n "${PACKAGIST_TOKEN:-}" ]; then
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"repository":{"url":"https://github.com/hardimpactdev/orbit-core"}}' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
          else
            echo "Packagist credentials not configured; skipping hardimpactdev/orbit-core API update."
          fi

      - name: Install CLI dependencies
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --optimize-autoloader

      - name: Build macOS arm64 binary
        run: bin/orbit-build-cli-binary mac arm "${{ steps.version.outputs.value }}"

      - name: Build Ubuntu x86_64 binary
        run: bin/orbit-build-cli-binary linux x64 "${{ steps.version.outputs.value }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push gateway image
        id: gateway_image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/orbit-gateway-image-metadata.json"
          image="${REGISTRY}/${IMAGE_NAME}"

          test -f docker/orbit-gateway/Dockerfile.dockerignore

          docker buildx build \
            --file docker/orbit-gateway/Dockerfile \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            --metadata-file "$metadata_file" \
            --push \
            .

          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"

          if [ -z "$digest" ]; then
            echo "Gateway image digest was not captured." >&2
            exit 1
          fi

          echo "image=${image}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify gateway image is publicly pullable
        env:
          GATEWAY_IMAGE: ${{ steps.gateway_image.outputs.image }}
          GATEWAY_DIGEST: ${{ steps.gateway_image.outputs.digest }}
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d)"
          trap 'rm -rf "$docker_config"' EXIT

          DOCKER_CONFIG="$docker_config" docker pull "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}"

      - name: Verify gateway image bakes the release version
        env:
          GATEWAY_IMAGE: ${{ steps.gateway_image.outputs.image }}
          GATEWAY_DIGEST: ${{ steps.gateway_image.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ref="${GATEWAY_IMAGE}@${GATEWAY_DIGEST}"

          # config('app.version') resolves dirname(__DIR__, 3)/VERSION, which is
          # /srv/orbit/VERSION inside the image. If the Dockerfile stops baking
          # that file the gateway falls back to reporting 0.0.0, so assert the
          # exact path the gateway config reads.
          baked="$(docker run --rm --entrypoint cat "$ref" /srv/orbit/VERSION || true)"
          if [ "$baked" != "$VERSION" ]; then
            echo "Gateway image /srv/orbit/VERSION is [$baked], expected [$VERSION] (gateway-version regression)." >&2
            exit 1
          fi

          echo "Gateway image bakes version ${VERSION} at /srv/orbit/VERSION."

      - name: Generate release manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASED_AT: ${{ github.event.release.published_at }}
          GATEWAY_IMAGE: ${{ steps.gateway_image.outputs.image }}
          GATEWAY_DIGEST: ${{ steps.gateway_image.outputs.digest }}
        run: |
          set -euo pipefail
          cp apps/cli/builds/dist/linux/linux-x64 orbit-linux-x64
          cp apps/cli/builds/dist/mac/mac-arm orbit-macos-arm64

          bin/orbit-release-manifest \
            --version="${VERSION}" \
            --released-at="${RELEASED_AT}" \
            --gateway-image="${GATEWAY_IMAGE}" \
            --gateway-digest="${GATEWAY_DIGEST}" \
            --repository="${GITHUB_REPOSITORY}" \
            --cli-artifact="linux-amd64=orbit-linux-x64=orbit-linux-x64" \
            --cli-artifact="darwin-arm64=orbit-macos-arm64=orbit-macos-arm64" \
            --role-image="orbit-caddy=caddy:2-alpine" \
            --role-image="orbit-websocket=ghcr.io/hardimpactdev/orbit-websocket:${VERSION}" \
            --output="orbit-release-manifest.json"

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            orbit-linux-x64 \
            orbit-macos-arm64 \
            orbit-release-manifest.json \
            --clobber
