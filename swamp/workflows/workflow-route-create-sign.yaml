id: 71347678-030a-595a-9509-d8309edc5420
name: route-create-sign
description: "route.create: 209 has one Node-made CSR signed by the Gateway."
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    parent_run_id: {type: string, minLength: 1}
    leaf: {type: object}
    request: {type: string, minLength: 1}
  required: [operation_id, parent_run_id, leaf, request]
  additionalProperties: false
jobs:
- name: create
  labels: {role: swamp}
  steps:
    # The one step that calls the Gateway: the signed leaf, then the Orbit root.
  - name: 'sign'
    labels: {role: swamp}
    dependsOn: []
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-sign'
      behaviorName: '${{ ("certificate-sign-" + string(inputs.leaf.node_id) + "-" + inputs.leaf.scope.split("/").join("-")).split(".").join("-") }}'
      methodName: sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        run_id: '${{ inputs.parent_run_id }}'
        node_id: '${{ inputs.leaf.node_id }}'
        scope: '${{ inputs.leaf.scope }}'
        request: '${{ inputs.request }}'
