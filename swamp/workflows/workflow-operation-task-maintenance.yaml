id: 005e43f4-02fc-4bca-b43a-5e2456cb4258
name: operation-task-maintenance
description: Run captured package/routine maintenance through official SSH from209,
  without a guest worker.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - tasks.maintenance
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  target: orbit-node-209
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
      behaviorName: ${{ "task-repository-assets-" + string(inputs.operation_id) }}
  - name: workspace
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: task-vm-workspace
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent:
          task_vm_id: ${{ inputs.intent.task_vm_id }}
          group_id: ${{ inputs.intent.group_id }}
          instance_id: ${{ inputs.intent.instance_id }}
          project_id: ${{ inputs.intent.project_id }}
          checkout_path: ${{ inputs.intent.checkout_path }}
          ssh_execution: ${{ inputs.intent.ssh_execution }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: prepare-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-task-repository-" + run.id }}
    dependsOn:
    - step: workspace
      condition:
        type: succeeded
  - name: copy-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs:
        name: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.assets }}
        dst: ${{ "/tmp/orbit-task-repository-" + run.id + "/" }}
        recursive: true
        direction: to
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
- name: paths
  target: orbit-node-209
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
  steps:
  - name: path-${{ self._index }}
    target: orbit-node-209
    forEach:
      item: item
      in: ${{ steps.assets.outputs.paths }}
    task:
      type: workflow
      workflowIdOrName: task-maintenance-path
      inputs:
        place: ${{ self.item }}
        place_json: ${{ self.item.input_json }}
        ssh_execution: ${{ inputs.intent.ssh_execution }}
        remote_assets: ${{ "/tmp/orbit-task-repository-"+run.id }}
    concurrency: 1
- name: maintenance
  target: orbit-node-209
  dependsOn:
  - job: paths
    condition:
      type: succeeded
  steps:
  - name: snapshot-after
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-task-repository-"+run.id+"/scripts/snapshot.py" }}
        stdin: ${{ steps.assets.outputs.input_json }}
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: snapshot-after
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "maintenance-result-"+run.id }}
      methodName: execute
      inputs:
        run: "python3 - <<'PYTHON'\nimport json\nimport os\n\nvalue = json.loads(os.environ[\"\
          INTENT\"])\nprint(\n    json.dumps(\n        {\n            \"group_id\"\
          : value[\"group_id\"],\n            \"instance_id\": value[\"instance_id\"\
          ],\n            \"project_id\": value[\"project_id\"],\n            \"subtask\"\
          : value[\"subtask\"],\n            \"outcome\": \"passed\",\n          \
          \  \"changed\": json.loads(os.environ[\"AFTER\"])[\"changed\"],\n      \
          \  }\n    )\n)\nPYTHON\n"
        env:
          INTENT: ${{ steps.assets.outputs.input_json }}
          AFTER: ${{ steps["snapshot-after"].outputs.stdout }}
  - name: cleanup-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-repository-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-repository-" + run.id }}
    allowFailure: true
    dependsOn:
    - step: result
      condition:
        type: succeeded
