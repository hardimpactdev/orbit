---
# The last step of `molecule test -s ufw-fault`, and a step to run by hand after a crashed run: end a lock if a holder runs, drop the shim state,
# and put the real ufw back on app-dev. converge.yml does the same for each case in an `always` section; this is the net below it.
# It is safe when nothing is installed.
- name: Put the real ufw back on app-dev
  hosts: nested-app-dev
  gather_facts: false
  vars:
    tcontainer: nested-app-dev
  tasks:
    - name: The real ufw takes its path back
      ansible.builtin.include_tasks: shim-remove.yml
