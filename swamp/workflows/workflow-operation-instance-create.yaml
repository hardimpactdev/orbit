id: c2c6c4a5-a667-4a81-9f5a-fae18fdf5d4a
name: operation-instance-create
description: Development Instance create from 209; the checkout with its .env and the Project setup steps are two Ansible phases, the database, Process and Route work are children.
vaults: [orbit-control-inputs]
queueTimeout: 10
labels: {role: swamp}
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: instance.create}
    intent: {type: object}
    # Names only: git_credential and environment, member_<Process id> for each development Process environment, and
    # server_database_create and server_database_check for an owned server database.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(?:instance-(?:git-(?:operation|credential)-|create-environment-(?:input|testing)-)[1-9][0-9]*|process-instance-operation-[1-9][0-9]*-member-[1-9][0-9]*|database-create-(?:intent|owner)-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: create
    steps:
      # Input: the admitted intent and the shipped playbooks, as the run folder that both Ansible phases read.
      - name: input
        labels: {role: swamp}
        writes: true
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ansible-input
          methodName: write
          inputs:
            intent: '${{ inputs.intent }}'
            path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
      # Checkout: refuse a branch another worktree holds, make the checkout (a seed worktree or a fresh repository), fetch with the
      # read token as a 0600 file that is removed after the fetch, check out the admitted branch (or keep a retained one) and print
      # its commit, then write .env (0640, group orbit-env) and, for an owned test database, .env.testing.
      - name: checkout
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: input, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-checkout-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 400 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags checkout "$ORBIT_ANSIBLE/operation-instance-create.yml"
            env: &ansible
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
              ORBIT_GIT_CREDENTIAL: '${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.execution_secrets.git_credential.key) }}'
              ORBIT_ENVIRONMENT: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'
              ORBIT_ENVIRONMENT_TESTING: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.environment_testing ? inputs.execution_secrets.environment_testing.key : inputs.execution_secrets.environment.key) }}'
      # Database: the default Instance's SQLite file, copied with the same children as instance:clone (ADR 0191).
      - name: database-snapshot
        labels: {role: swamp}
        dependsOn: [{step: checkout, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.database == null || steps.exists(k, steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: instance-clone-database-snapshot
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent.database }}'
            run_id: '${{ run.id }}'
      - name: database-install
        labels: {role: swamp}
        dependsOn: [{step: database-snapshot, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.database == null }}'
        task:
          type: workflow
          workflowIdOrName: instance-clone-database-install
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent.database }}'
            run_id: '${{ run.id }}'
            digest: '${{ steps["database-snapshot"].outputs.digest.stdout.split(" ")[0] }}'
      - name: database-cleanup
        labels: {role: swamp}
        dependsOn:
          - {step: database-snapshot, condition: {type: always}}
          - {step: database-install, condition: {type: always}}
        guard: '${{ inputs.intent.already_active || inputs.intent.database == null }}'
        task:
          type: workflow
          workflowIdOrName: instance-clone-database-cleanup
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent.database }}'
            run_id: '${{ run.id }}'
      # Server database: the Instance's own owner and databases on a Database server, with the child database:create runs.
      # Swamp evaluates a skipped step's inputs too, so every reference to an absent section falls back to a present one.
      - name: server-database
        labels: {role: swamp}
        dependsOn: [{step: checkout, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.server_database == null || steps.exists(k, steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: operation-database-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.intent.server_database == null ? inputs.node_id : inputs.intent.server_database.node_id }}'
            kind: database.create
            intent: '${{ inputs.intent.server_database == null ? {} : inputs.intent.server_database.intent }}'
            execution_secrets: '${{ inputs.intent.server_database == null ? {} : {"create": inputs.execution_secrets.server_database_create, "check": inputs.execution_secrets.server_database_check} }}'
      # The child keeps a refused batch as its own outcome, so the owner's login proves the database is usable.
      - name: server-database-check
        labels: {role: swamp}
        dependsOn: [{step: server-database, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.server_database == null }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-dbcheck-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("ic-dbcheck-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.server_database == null ? 22 : inputs.intent.server_database.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.identity_file }}'
              hostKeys: '${{ inputs.intent.server_database == null ? [] : inputs.intent.server_database.intent.ssh_execution.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host }}'}]
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "60"] + (inputs.intent.server_database == null ? [] : inputs.intent.server_database.intent.owner_client) }}'
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.server_database == null ? inputs.execution_secrets.environment.key : inputs.execution_secrets.server_database_check.key) }}'
            timeoutSec: 70
      # A MySQL default database is copied into the new one before setup migrates it (ADR 0191).
      - name: server-database-fill
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: server-database-check, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.server_database == null || inputs.intent.server_database.fill == null }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-dbfill-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("ic-dbfill-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.server_database == null ? 22 : inputs.intent.server_database.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.identity_file }}'
              hostKeys: '${{ inputs.intent.server_database == null ? [] : inputs.intent.server_database.intent.ssh_execution.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host }}'}]
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "600"] + (inputs.intent.server_database == null || inputs.intent.server_database.fill == null ? [] : inputs.intent.server_database.fill) }}'
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.server_database == null ? inputs.execution_secrets.environment.key : inputs.execution_secrets.server_database_create.key) }}'
            timeoutSec: 610
      # Setup: the Project setup list in order, one command per item as the account; the first failure stops it.
      - name: setup
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: checkout, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
          - {step: database-install, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
          - {step: server-database-check, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
          - {step: server-database-fill, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
        guard: '${{ inputs.intent.already_active || size(inputs.intent.setup_steps) == 0 || steps.exists(k, steps[k].status == "failed") }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-setup-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 600 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags setup "$ORBIT_ANSIBLE/operation-instance-create.yml"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
      # Processes: create and start the development Processes through the shared Process create workflow.
      - name: processes
        labels: {role: swamp}
        # A dependency on a forEach over an empty list resolves at once, so Processes also wait on the .env write.
        dependsOn:
          - {step: checkout, condition: {type: always}}
          - {step: setup, condition: {type: always}}
        guard: '${{ inputs.intent.already_active || steps.exists(k, steps[k].status == "failed") }}'
        forEach: {item: member, in: '${{ inputs.intent.processes }}'}
        task:
          type: workflow
          # A rerun starts an existing container instead of creating it again.
          workflowIdOrName: '${{ self.member.kind == "process.start" ? "operation-process-start" : "operation-process-create" }}'
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ self.member.kind }}'
            intent: '${{ self.member.intent }}'
            execution_secrets: '${{ "member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["member_" + string(self.member.id)]} : {} }}'
      # Route certificates: the Node-local key and CSR beside the checkout (same level as it), then the Gateway's signature beside the setup
      # steps (same depth as them). They touch only the certificate folder; the Route child below takes the signed certificates.
      - name: route-csr
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: input, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
        guard: '${{ inputs.intent.already_active || inputs.intent.route == null }}'
        forEach: {item: leaf, in: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes }}'}
        task:
          type: workflow
          workflowIdOrName: route-create-csr
          inputs:
            intent: '${{ inputs.intent.route }}'
            leaf: '${{ self.leaf }}'
      - name: route-sign
        labels: {role: swamp}
        dependsOn:
          - {step: route-csr, condition: {type: always}}
          - {step: checkout, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
          - {step: database-install, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
          - {step: server-database-check, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
          - {step: server-database-fill, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
        guard: '${{ inputs.intent.already_active || inputs.intent.route == null || steps.exists(k, steps[k].status == "failed") }}'
        forEach: {item: leaf, in: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes }}'}
        task:
          type: workflow
          workflowIdOrName: route-create-sign
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            parent_run_id: '${{ run.id }}'
            leaf: '${{ inputs.intent.route.leaves[self.leaf] }}'
            request: '${{ steps["route-csr-" + string(self.leaf)].outputs.csr.stdout }}'
      # Route: a web-serving Project's Route, through the same child that route:create runs, after setup and Processes.
      - name: route
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: checkout, condition: {type: always}}
          - {step: setup, condition: {type: always}}
          - {step: processes, condition: {type: always}}
          - {step: route-sign, condition: {type: always}}
        guard: '${{ inputs.intent.already_active || inputs.intent.route == null || steps.exists(k, steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: operation-route-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            parent_run_id: '${{ run.id }}'
            kind: route.create
            intent: '${{ inputs.intent.route }}'
            execution_secrets: '${{ inputs.intent.route_secrets }}'
            signed: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes.map(i, ("route-sign-" + string(i)) in steps && steps["route-sign-" + string(i)].status == "succeeded" ? steps["route-sign-" + string(i)].outputs.sign.stdout : "") }}'
      # Finish: map the first phase that did not finish to the public receipt. The cleanup of the run folder runs beside it.
      - name: finish
        labels: {role: swamp}
        dependsOn:
          - {step: checkout, condition: {type: always}}
          - {step: database-cleanup, condition: {type: always}}
          - {step: server-database, condition: {type: always}}
          - {step: server-database-check, condition: {type: always}}
          - {step: server-database-fill, condition: {type: always}}
          - {step: setup, condition: {type: always}}
          - {step: processes, condition: {type: always}}
          - {step: route, condition: {type: always}}
          - {step: route-csr, condition: {type: always}}
          - {step: route-sign, condition: {type: always}}
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "ic-finish" }}'
          methodName: create_result
          inputs:
            intent: '${{ inputs.intent }}'
            checkout: '${{ "checkout" in steps ? steps.checkout : null }}'
            database: '${{ inputs.intent.server_database == null ? ("database-install" in steps ? steps["database-install"].status : "skipped") : (inputs.intent.server_database.fill != null ? ("server-database-fill" in steps ? steps["server-database-fill"].status : "skipped") : ("server-database-check" in steps ? steps["server-database-check"].status : "skipped")) }}'
            setup: '${{ "setup" in steps ? steps.setup.status : "skipped" }}'
            processes: '${{ inputs.intent.processes.map(p, ("processes-" + string(p.index)) in steps ? steps["processes-" + string(p.index)].status : "skipped") }}'
            route: '${{ "route" in steps ? steps.route.status : "skipped" }}'
            certificates: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes.map(i, ("route-csr-" + string(i)) in steps ? steps["route-csr-" + string(i)].status : "skipped") + inputs.intent.route.leaf_indexes.map(i, ("route-sign-" + string(i)) in steps ? steps["route-sign-" + string(i)].status : "skipped") }}'
      - name: accepted
        labels: {role: swamp}
        dependsOn: [{step: finish, condition: {type: succeeded}}]
        task: {type: assert, expr: 'steps.finish.outputs.ready == true', severity: high, message: The development Instance create did not complete.}
      # Cleanup: the run folder of the phases, also after a failure. It sits at the depth of finish, so the two run side by side.
      - name: cleanup
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: input, condition: {type: always}}
          - {step: checkout, condition: {type: always}}
          - {step: setup, condition: {type: always}}
          - {step: processes, condition: {type: always}}
          - {step: route, condition: {type: always}}
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-cleanup-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 30 rm -rf -- "$ORBIT_RUN"
            env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
