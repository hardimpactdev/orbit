---
# The task VM role, in the phases of a Node converge: software, tools, check.
# One playbook, two callers: the Incus base refresh runs it on the builder, a converge runs it on a running task VM.
# Versions come from intent.recipe, the recipe.json of the release; this file names none.
- name: Task VM role
  hosts: task_vm
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.apt: { lock_timeout: 300 }
  vars:
    recipe: "{{ intent.recipe }}"
    profile: "{{ intent.profile | default('base') }}"
    # The proof Swamp Club key: the refresh writes it here on the base VM (task-vm-host.yml); the nested Gateway reads it through a disk
    # device, and the fleet build's local bootstrap run reads it.
    fleet_club_key: /etc/orbit/swamp-club-api-key
    orbit_user: orbit
    orbit_home: "/home/orbit"
    vp_home: "/home/orbit/.local/share/vite-plus"
    apt_directory: /var/tmp/orbit-image-apt
    # One file per converged part, holding the digest it converged to (task-vm-recipe.yml).
    converge_stamps_dir: /var/lib/orbit/converge
    # The parts of the checkout that the converge tracks, each with the Git object it compares (task-vm-checkout.yml).
    checkout_projects: >-
      {%- set out = [{'manager': 'code', 'dir': 'apps/gateway', 'stamp': 'code', 'object': 'HEAD:apps/gateway'},
                     {'manager': 'agent', 'dir': 'apps/gateway', 'stamp': 'agent', 'object': 'HEAD:apps/gateway/resources/agent/frozen-manifest.json'},
                     {'manager': 'migrations', 'dir': 'apps/gateway', 'stamp': 'migrations', 'object': 'HEAD:apps/gateway/database/migrations'}] -%}
      {%- for manager, lock in [['composer', 'composer.lock'], ['bun', 'bun.lock']] -%}
      {%- for dir in (intent.checkout | default({}))[manager] | default([]) -%}
      {%- set _ = out.append({'manager': manager, 'dir': dir, 'stamp': manager ~ '-' ~ (dir | replace('/', '_')),
                              'object': 'HEAD:' ~ (lock if dir == '.' else dir ~ '/' ~ lock)}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
    # Package downloads retry on a transient error of the snapshot service: four retries, 30 seconds apart (swamp-shape rule 6).
    apt_retries: 4
    apt_delay: 30
    apt_environment:
      APT_CONFIG: /var/tmp/orbit-image-apt/apt.conf
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
    # The index read goes through the package cache of the VM; the packages stay a direct download (task-vm-apt-config.yml).
    apt_index_environment:
      APT_CONFIG: /var/tmp/orbit-image-apt/apt-cache.conf
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
  tasks:
    - { name: Wait for a new server, ansible.builtin.import_tasks: tasks/task-vm-ready.yml, tags: [always] }
    - { name: Resolve the recipe, ansible.builtin.import_tasks: tasks/task-vm-recipe.yml, tags: [always] }
    # A phase runs only when its digest changed; it records the new one when it ends. A phase is a dynamic include, so one that is not due is one
    # skipped task: a static import would evaluate the condition on each of its ~140 tasks, which costs about 3 s of every start.
    - name: Software
      ansible.builtin.include_tasks: { file: tasks/task-vm-software.yml, apply: { tags: [software] } }
      tags: [software]
      when: converge_due.software
    - name: Record the software
      ansible.builtin.include_tasks: { file: tasks/task-vm-stamp.yml, apply: { tags: [software] } }
      vars: { stamp: software }
      tags: [software]
      when: converge_due.software
    - name: Tools
      ansible.builtin.include_tasks: { file: tasks/task-vm-tools.yml, apply: { tags: [tools] } }
      tags: [tools]
      when: converge_due.tools
    - name: Record the tools
      ansible.builtin.include_tasks: { file: tasks/task-vm-stamp.yml, apply: { tags: [tools] } }
      vars: { stamp: tools }
      tags: [tools]
      when: converge_due.tools
    - name: Boot
      ansible.builtin.include_tasks: { file: tasks/task-vm-boot.yml, apply: { tags: [boot] } }
      tags: [boot]
      when: converge_due.boot
    - name: Record the boot
      ansible.builtin.include_tasks: { file: tasks/task-vm-stamp.yml, apply: { tags: [boot] } }
      vars: { stamp: boot }
      tags: [boot]
      when: converge_due.boot
    - { name: Checkout, ansible.builtin.import_tasks: tasks/task-vm-checkout.yml, tags: [checkout] }
    - { name: Branch, ansible.builtin.import_tasks: tasks/task-vm-branch.yml, tags: [branch] }
    - { name: Fleet, ansible.builtin.import_tasks: tasks/task-vm-fleet.yml, tags: [fleet] }
    - name: Check
      ansible.builtin.include_tasks: { file: tasks/task-vm-check.yml, apply: { tags: [check] } }
      tags: [check]
      when: converge_due.check
    - name: Record the check
      ansible.builtin.include_tasks: { file: tasks/task-vm-stamp.yml, apply: { tags: [check] } }
      vars: { stamp: check }
      tags: [check]
      when: converge_due.check

    - name: Converge nested Node bases for the image
      ansible.builtin.include_tasks:
        file: tasks/task-vm-fleet-base.yml
        apply: { tags: [fleet] }
      tags: [fleet]
      when: not (intent.direct | default(false))

# A refresh converges the nested Node bases before these snapshots. A task start leaves both to the refreshed image.
- name: Task VM image
  hosts: task_vm
  become: true
  gather_facts: false
  vars:
    orbit_user: orbit
    orbit_home: "/home/orbit"
  tasks:
    # `base` is the state a proof restores the containers to: plain container snapshots, no memory. The refresh owns them and retakes them
    # when the fleet changed; a task start (a direct converge) leaves them as the base holds them.
    - name: Take the base snapshots
      tags: [fleet]
      when: >-
        not (intent.direct | default(false)) and
        (fleet_new | length > 0 or "code" not in checkout_current or converge_due.operator or converge_due.tokens or fleet_grants.changed or
         (fleet_base_converged | default(false)) or
         fleet_grants_snapshot_digest != (converge_stamps['grants-snapshot'] | default('')))
      ansible.builtin.command: { argv: [timeout, "180", incus, snapshot, create, --reuse, "{{ item }}", base] }
      loop: "{{ intent.fleet.guests.values() | list }}"
      register: fleet_snapshots
      changed_when: true
    - name: Record the snapshotted grants
      tags: [fleet]
      when: fleet_snapshots is succeeded and fleet_snapshots is not skipped
      ansible.builtin.copy:
        dest: "{{ fleet_grants_snapshot_stamp }}"
        content: "{{ fleet_grants_snapshot_digest }}"
        mode: "0644"
