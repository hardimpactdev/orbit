id: 9c42bead-f036-4bf8-a1ef-e883129af28f
name: operation-task-park
description: Park the admitted Task VM; the shared subscriber reads native provider completion.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.park]}
    intent:
      type: object
    execution_secrets: {type: object, additionalProperties: false}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: park
  labels: {role: swamp}
  steps:
  - name: eligible
    labels: {role: swamp}
    task:
      type: assert
      expr: inputs.intent.eligible == true
      message: The captured VM is not eligible for this transition
  - name: provider
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: ${{ inputs.execution_secrets }}
        action: stop
    dependsOn:
    - step: eligible
      condition:
        type: succeeded
queueTimeout: 30
