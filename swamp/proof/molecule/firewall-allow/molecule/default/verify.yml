---
# The state asserts of eight firewall:allow cases. converge.yml has run the CLI and checked the answers and receipts; this play only reads:
# the facts converge cached, traffic from the Nodes, the UFW table of app-dev and the nested Gateway's records. One host per case: the
# independent cases check as many at a time as ANSIBLE_FORKS allows, the exclusive ones alone after them. The chart paths each case
# covers are in swamp/proof/firewall/allow.cases.yaml.
- ansible.builtin.import_playbook: facts.yml

- name: Verify the independent cases
  hosts: independent_cases
  gather_facts: false
  strategy: free
  # A limit of 1 means one case after the other; a larger limit is the forks of Ansible (ANSIBLE_FORKS), all hosts at once.
  serial: "{{ 1 if (lookup('ansible.builtin.env', 'ANSIBLE_FORKS') | default('1', true) | int) == 1 else 0 }}"
  vars_files: [cases.yml]
  tasks:
    - ansible.builtin.import_tasks: verify-state.yml
    - ansible.builtin.include_tasks: "verify-{{ inventory_hostname }}.yml"

- name: Verify the cases that check global state, alone
  hosts: exclusive_cases
  gather_facts: false
  serial: 1
  vars_files: [cases.yml]
  tasks:
    - ansible.builtin.import_tasks: verify-state.yml
    - ansible.builtin.include_tasks: "verify-{{ inventory_hostname }}.yml"

- name: Verdicts
  hosts: localhost
  gather_facts: false
  vars:
    all_cases: "{{ groups['independent_cases'] + groups['exclusive_cases'] }}"
  tasks:
    - name: Verdict of each case (command seconds, case seconds in converge, the window of its CLI call, asks while the Node was busy)
      ansible.builtin.debug:
        msg: >-
          {{ item }}: {{ ('failed | ' ~ (hostvars[item].failures | default(hostvars[item].verify_failures | default('the checks did not end')))) if (hostvars[item].failures is defined or hostvars[item].verify_failures is defined or not (hostvars[item].verified | default(false))) else 'passed' }}
          (command {{ hostvars[item].cmd_secs }} s, case {{ hostvars[item].case_secs }} s, casewin {{ hostvars[item].case_start | float | round(2) }} {{ hostvars[item].case_end | float | round(2) }}, cli {{ hostvars[item].cli_start | float | round(1) }} {{ hostvars[item].cli_end | float | round(1) }}, busy {{ hostvars[item].busy_retries }})
      loop: "{{ all_cases }}"

    - name: Collect the failed cases
      ansible.builtin.set_fact:
        failed_cases: "{{ failed_cases | default([]) + [item] }}"
      loop: "{{ all_cases }}"
      when: hostvars[item].failures is defined or hostvars[item].verify_failures is defined or not (hostvars[item].verified | default(false))

    - name: Fail when a case failed
      ansible.builtin.assert:
        that: failed_cases | default([]) | length == 0
        fail_msg: "failed: {{ failed_cases | default([]) | join(', ') }}"
        quiet: true
