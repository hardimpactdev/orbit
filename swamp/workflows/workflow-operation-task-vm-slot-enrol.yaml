id: 7d0f2c6e-3b4a-4f1e-9c58-2a6e1b9d4f30
name: operation-task-vm-slot-enrol
description: >-
  Enrol one task VM slot identity (docs/cli/tasks/vm-slot-enrol.mmd) from full inputs on 209: the identity's peer file goes on the
  WireGuard hub once. A slot is only an identity; no VM exists until a task start. No step calls the Gateway.
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.slot_enrol}
    intent:
      type: object
      properties:
        hub: {type: object}
        hub_ssh_execution: {type: object}
        public_key: {type: string, minLength: 44, maxLength: 44}
        guest_node_id: {type: integer, minimum: 1}
      required: [hub, hub_ssh_execution, public_key, guest_node_id]
      additionalProperties: false
    # The enrol writes no secret; the identity's keys go onto each VM at its task start.
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: enrol
  labels: {role: swamp}
  steps:
  - name: Add the hub peer
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-hub-peer
      inputs: {hub: '${{ inputs.intent.hub }}', hub_ssh_execution: '${{ inputs.intent.hub_ssh_execution }}', public_key: '${{ inputs.intent.public_key }}',
        guest_node_id: '${{ inputs.intent.guest_node_id }}'}
