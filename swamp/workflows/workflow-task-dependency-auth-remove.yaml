id: dc32f69a-523e-5c03-b850-1c03af924afa
name: task-dependency-auth-remove
description: Delete the Composer and npm configuration of the task account that the write workflow created, then revoke the token it held.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    user:
      type: string
      minLength: 1
    ssh_execution:
      type: object
    dependency_auth:
      type: object
  required: [user, ssh_execution, dependency_auth]
  additionalProperties: false
jobs:
- name: remove
  labels: {role: swamp}
  steps:
  - name: Remove
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ inputs.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ inputs.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.ssh_execution.target.port }}
          user: ${{ inputs.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - rm
        - -f
        - --
        - ${{ "/home/" + inputs.user + "/.config/composer/auth.json" }}
        - ${{ "/home/" + inputs.user + "/.npmrc" }}
  # The token is revoked as soon as the files are gone. It expires within the hour either way, but a failed command can echo it into its output.
  # A run that minted no token revokes a placeholder: GitHub refuses, and the step is allowed to fail.
  - name: Revoke
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "tp-deps-revoke" }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method DELETE installation/token >/dev/null 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.dependency_auth.token.vault, inputs.dependency_auth.token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-deps-revoke-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    dependsOn:
    - step: Remove
      condition:
        type: always
    writes: true
    allowFailure: true
  - name: Remove CLI config
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "tp-deps-revoke-cleanup" }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_GH_DIRECTORY"
        env:
          ORBIT_GH_DIRECTORY: ${{ "/tmp/orbit-deps-revoke-" + run.id + "-gh" }}
    dependsOn:
    - step: Revoke
      condition:
        type: always
    writes: true
    allowFailure: true
