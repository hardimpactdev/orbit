---
- name: Protect the hub folder
  ansible.builtin.file: { path: /etc/wireguard/orbit-peers.d, state: directory, owner: root, group: root, mode: "0700" }
- name: Reconcile the hub files
  vars: { hub_forwarding: "net.ipv4.ip_forward = 1\n" }
  block:
    # The hub runs twice in a peer's converge, so each file costs one module call only when it differs.
    - name: Check the hub files
      ansible.builtin.import_tasks: managed-files-check.yml
      vars:
        managed_files: >-
          {{ [['/etc/wireguard/orbit.conf', hub_plan.config, '0600']]
             + hub_plan.peers | map(attribute='file') | zip(hub_plan.peers | map(attribute='content'), ['0600'] * (hub_plan.peers | length)) | list
             + [['/etc/sysctl.d/99-orbit-forwarding.conf', hub_forwarding, '0644']] }}
    - name: Reconcile the recorded hub configuration
      when: "'/etc/wireguard/orbit.conf' in managed_files_repair"
      ansible.builtin.copy: { dest: /etc/wireguard/orbit.conf, content: "{{ hub_plan.config }}", owner: root, group: root, mode: "0600" }
    - name: Reconcile recorded peer files
      ansible.builtin.copy: { dest: "{{ item.file }}", content: "{{ item.content }}", owner: root, group: root, mode: "0600" }
      loop: "{{ hub_plan.peers | selectattr('file', 'in', managed_files_repair) | list }}"
      loop_control: { label: "{{ item.node_id }}" }
    - name: Prune only removed peers
      ansible.builtin.import_tasks: node-converge-hub-prune.yml
    - name: Remove the task VM hub filter
      ansible.builtin.import_tasks: node-converge-hub-filter-absent.yml
    - name: Ensure persistent hub forwarding
      when: "'/etc/sysctl.d/99-orbit-forwarding.conf' in managed_files_repair"
      ansible.builtin.copy: { dest: /etc/sysctl.d/99-orbit-forwarding.conf, content: "{{ hub_forwarding }}", owner: root, group: root, mode: "0644" }
- name: Read live hub forwarding
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: forwarding
  changed_when: false
- name: Repair live hub forwarding
  when: forwarding.stdout | trim != '1'
  ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
  changed_when: true
- name: Start the hub without restarting a matching tunnel
  ansible.builtin.systemd: { name: wg-quick@orbit.service, enabled: true, state: started }
- name: Reconcile live hub peers and port without copying its private key
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      before=$(wg showconf orbit | sha256sum)
      # The key line ends once, with or without a final newline in the key file. `wg` prints a value it refuses, which may be
      # the key: `cut` drops it.
      wg syncconf orbit <(
        printf '[Interface]\nPrivateKey = %s\n%s' "$(cat /etc/wireguard/orbit.key)" {{ hub_plan.interface | quote }}
        for f in /etc/wireguard/orbit-peers.d/*.conf; do [ ! -f "$f" ] || cat "$f"; done
      ) 2> >(cut -d'`' -f1 >&2)
      [ "$before" = "$(wg showconf orbit | sha256sum)" ] || echo changed
  register: hub_sync
  changed_when: hub_sync.stdout is search('changed')
- name: Apply the hub's source unit and LAN SSH
  ansible.builtin.include_tasks: node-hub-source.yml
  vars: { hub_source: "{{ hub_plan.source }}", hub_source_owner: "{{ hub_plan.source_owner }}", hub_lan_ssh_argv: "{{ hub_plan.lan_ssh_argv }}",
          hub_peer_forwarding_argv: "{{ hub_plan.peer_forwarding_argv }}" }
- name: Read the hub key
  ansible.builtin.command: wg show orbit public-key
  register: hub_key
  changed_when: false
- name: Require the recorded hub identity
  ansible.builtin.assert: { that: hub_key.stdout | trim == hub_plan.public_key, quiet: true }
- name: Repair the hub interface address
  ansible.builtin.include_tasks: node-converge-address.yml
  vars:
    tunnel_address: "{{ hub_plan.config | regex_findall('(?m)^Address = (.+)$') | first }}"
