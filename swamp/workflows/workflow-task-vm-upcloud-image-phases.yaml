id: 93d5048a-7b68-4f4f-94be-62e8fa86a807
name: task-vm-upcloud-image-phases
description: Run the recipe phases on the UpCloud builder in order over pinned official SSH from 209; a failed phase stops the chain.
version: 1
queueTimeout: 60
vaults: []
inputs:
  type: object
  properties:
    intent: {type: object}
    address: {type: string}
    phases: {type: object}
  required: [intent, address, phases]
  additionalProperties: false
jobs:
- name: phases
  writes: true
  steps:
  - name: apt-source-start
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: &guest
        name: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
        transport:
          kind: ssh
          user: orbit
          port: 22
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.address }}
          transport:
            hostKeys: ${{ [inputs.intent.host_key] }}
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.start-phase]
        timeoutSec: 180
        stdin: ${{ inputs.phases.start["apt-source"] }}
  - name: apt-source-start-reply
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-start, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["apt-source-start"].outputs.stdout }}
        expect: started
        boot_id: ${{ inputs.phases.boot_id }}
  - name: apt-source-pid
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-start-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/systemctl, show, --property=MainPID, --value, --, '${{ inputs.intent.units["apt-source"] }}']
        timeoutSec: 90
  - name: apt-source-wait
    labels: {role: swamp}
    guard: ${{ steps["apt-source-pid"].outputs.stdout.trim() == "0" }}
    dependsOn:
    - {step: apt-source-pid, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '1500', /usr/bin/tail, '${{ "--pid=" + steps["apt-source-pid"].outputs.stdout.trim() }}', -f, /dev/null]
        timeoutSec: 1530
        okExitCodes: any
  - name: apt-source-inspect
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-pid, condition: {type: succeeded}}
    - step: apt-source-wait
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.inspect-phase]
        timeoutSec: 90
        stdin: ${{ inputs.phases.inspect["apt-source"] }}
  - name: apt-source-inspect-reply
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-inspect, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["apt-source-inspect"].outputs.stdout }}
        expect: complete
        boot_id: ${{ inputs.phases.boot_id }}
  - name: packages-start
