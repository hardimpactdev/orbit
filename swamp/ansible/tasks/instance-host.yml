---
# The container branch of the app-dev role on a Node of the build list (docs/reference/compute-drivers.md#prepare-an-instance-container-host).
# The Gateway sends `instances` only for such a Node, so every other Node runs none of this. It shares the kernel, Incus and container
# side with a task container host, then installs the two shared folders and builds the image. It creates no Instance.
# The Node provides the Incus pool: ZFS, where a copy is a clone, or a directory pool on a nested proof Node, where a copy is a full copy.
- name: Read the Instance pool
  ansible.builtin.command: { argv: [incus, query, "--", "/1.0/storage-pools/{{ instances.pool }}"] }
  register: instance_pool_read
  changed_when: false
  failed_when: false

- name: Require the Instance pool
  ansible.builtin.assert:
    that:
      - instance_pool_read.rc == 0
      - (instance_pool_read.stdout | from_json).driver in ['zfs', 'dir']
    fail_msg: "instance.host_unavailable: the Node needs the Incus storage pool {{ instances.pool }}, of driver zfs or dir"
    quiet: true

# The Gateway gives each Node a unique /24 of 10.253.0.0/16, but it does not see the bridges an operator made, such as a CI bridge.
# A range that another interface of the Node holds already refuses before any change.
- name: Read the Node's IPv4 addresses
  ansible.builtin.command: { argv: [ip, "-4", -o, addr, show] }
  register: instance_node_addresses
  changed_when: false

- name: Refuse an Instance bridge range that another interface holds
  ansible.builtin.assert:
    that: instance_overlaps | length == 0
    fail_msg: "instance.host_unavailable: the Instance bridge range {{ instances.cidr }} overlaps {{ instance_overlaps | join(', ') }}"
    quiet: true
  vars:
    instance_overlaps: >-
      {%- set ns = namespace(out=[]) -%}
      {%- set c = instances.cidr.split('/') -%}{%- set o = c[0].split('.') | map('int') | list -%}
      {%- set first = ((o[0] * 256 + o[1]) * 256 + o[2]) * 256 + o[3] -%}{%- set last = first + 2 ** (32 - (c[1] | int)) - 1 -%}
      {%- for line in instance_node_addresses.stdout_lines -%}
        {%- set f = line.split() -%}
        {%- if f | length > 3 and f[2] == 'inet' and f[1] != instances.network -%}
          {#- A point-to-point address, `inet A peer B/len`, is the one address A: its peer is no range of this Node. -#}
          {%- set a = (f[3] if '/' in f[3] else f[3] ~ '/32').split('/') -%}{%- set q = a[0].split('.') | map('int') | list -%}
          {%- set size = 2 ** (32 - (a[1] | int)) -%}{%- set ip = ((q[0] * 256 + q[1]) * 256 + q[2]) * 256 + q[3] -%}
          {%- set start = ip - ip % size -%}
          {%- if start <= last and first <= start + size - 1 -%}{%- set ns.out = ns.out + [f[1] ~ ' ' ~ f[3]] -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

# A switched-on Node checks root's subordinate IDs before any nesting change to the host: the converge never enlarges them.
- name: Require the subordinate IDs before nested-fleet preparation
  when: instances.nested is defined
  ansible.builtin.include_tasks: task-container-host-ids.yml
  vars:
    container_host: { fail: instance.host_unavailable, ids: "{{ instances.ids }}" }

- name: Prepare the kernel and Incus for Instance containers
  ansible.builtin.include_tasks: task-container-host-system.yml
  vars:
    container_host: &instance_host
      kind: instances
      fail: instance.host_unavailable
      incus: "{{ instances.incus }}"
      ids: "{{ instances.ids }}"
      # An Instance container runs no WireGuard or Docker; a nested-fleet container runs both. No br_netfilter: it is host-wide and
      # would send every host bridge's traffic through the host's FORWARD chain, and the nested fleet does not need it.
      modules: "{{ ['wireguard', 'overlay'] if instances.nested is defined else [] }}"
      project: "{{ instances.project }}"
      network: "{{ instances.network }}"
      address: "{{ instances.address }}"
      alias: "{{ instances.stock }}"
      pool: "{{ instances.pool }}"
      probe: "{{ (instance_pool_read.stdout | from_json).driver == 'zfs' }}"
    container_sysctls:
      fs.inotify.max_queued_events: 1048576
      fs.inotify.max_user_instances: 1048576
      fs.inotify.max_user_watches: 1048576
      kernel.keys.maxkeys: 2000
      kernel.keys.maxbytes: 2000000
      vm.max_map_count: 262144

# The cap the system part sized from memory, never above the cap the Node already runs. A task VM host keeps the ARC its task side
# sets (`instances.arc` is false there), so the Instance side never changes a cap that the host's task VMs run with.
- name: Keep the ZFS ARC within the Node's budget
  when: (instance_pool_read.stdout | from_json).driver == 'zfs' and instances.arc | default(true) | bool
  block:
    - name: Keep the ARC cap after reboot
      ansible.builtin.copy:
        dest: /etc/modprobe.d/orbit-instances-zfs.conf
        content: "# Orbit Instance container host: reserve RAM for host services.\noptions zfs zfs_arc_max={{ container_arc_max }}\n"
        owner: root
        group: root
        mode: "0644"
    - name: Read the running ARC cap
      ansible.builtin.slurp: { src: /sys/module/zfs/parameters/zfs_arc_max }
      register: instance_arc
    - name: Apply the ARC cap now
      when: (instance_arc.content | b64decode | trim) != (container_arc_max | string)
      ansible.builtin.command:
        argv: [tee, /sys/module/zfs/parameters/zfs_arc_max]
        stdin: "{{ container_arc_max }}"
      changed_when: true

- name: Install the shared folders
  ansible.builtin.include_tasks: instance-folder.yml
  loop: [runtime, agent]
  loop_control: { loop_var: folder_name }
  vars:
    folder: "{{ instances.folders[folder_name] }}"

# The project lets containers mount host folders read-only and idmapped, and publish T3 with a proxy device. Every container gets
# an isolated ID map and a default-reject NIC policy; each Instance's target paths come with its create flow. Incus refuses
# `shift` on a disk whose source falls under `restricted.devices.disk.paths`, so the project sets no path list: the profile is
# the one place that names the two folders, and the create flow's device list is the only guard on host paths.
# Containers get no DNS: the egress proxy resolves every name.
- name: Read the common NIC ACL
  ansible.builtin.command: { argv: [incus, query, --, "/1.0/network-acls?project=default&recursion=1"] }
  register: instance_proxy_acls
  changed_when: false

- name: Create the common NIC ACL
  when: instances.nic_acl not in (instance_proxy_acls.stdout | from_json | map(attribute='name') | list)
  ansible.builtin.command: { argv: [incus, network, acl, create, "{{ instances.nic_acl }}", --project, default] }
  changed_when: true

- name: Converge the common NIC ACL
  vars:
    proxy_rules:
      description: Orbit Instance proxy boundary
      egress:
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.forwarder_port | string }}"
          state: enabled
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.egress.port | string }}"
          state: enabled
      ingress: "{{ instances.ingress }}"
    proxy_now: "{{ instance_proxy_acls.stdout | from_json | selectattr('name', 'equalto', instances.nic_acl) | first | default({}) }}"
  when: proxy_now.get('egress', []) != proxy_rules.egress or proxy_now.get('ingress', []) != proxy_rules.ingress
  ansible.builtin.command:
    argv: [incus, network, acl, edit, "{{ instances.nic_acl }}", --project, default]
    stdin: "{{ proxy_rules | to_json }}"
  changed_when: true

# A switched-on Node prepares the nested-fleet project too, on the same bridge, ACLs, pool and profile devices. Its probe starts
# only after the nested guard checks it against the exact profile devices.
- name: Prepare the Instance bridge, project and profile
  ansible.builtin.include_tasks: task-container-host-prepare.yml
  loop: "{{ [instances.project] + ([instances.nested.project] if instances.nested is defined else []) }}"
  loop_control: { loop_var: instance_project }
  vars:
    instance_host: *instance_host
    container_host: "{{ instance_host | combine({'project': instance_project}) }}"
    instance_nested_project: "{{ instances.nested is defined and instance_project == instances.nested.project }}"
    container_probe_devices: "{{ container_devices if instance_nested_project | bool else {} }}"
    container_acl_name: "{{ instances.network }}-egress"
    container_dns: false
    # Endpoint mutations use ETags; never replace the existing shared list with an admission-time snapshot.
    container_acl_preserve: true
    # Network-only baseline. Endpoint rules are merged below; NICs use the separate proxy ACL.
    container_acl_rules:
      description: Orbit Instance boundary
      egress:
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.forwarder_port | string }}"
          state: enabled
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.egress.port | string }}"
          state: enabled
      # Incus checks the bridge ACL before a container's own, and its default rejects what the Node sends or forwards to the bridge.
      # So it admits what a container's ACL may admit: the Node's Caddy to FrankenPHP and the development ports, and T3's clients.
      ingress: "{{ instances.ingress }}"
    container_network_config:
      ipv4.dhcp.ranges: "{{ instances.dhcp_range }}"
      ipv4.nat: 'true'
      ipv6.address: none
      # Incus admits DNS to the bridge address ahead of the ACL, and dnsmasq would answer there, fleet names too. `port=0` turns its
      # DNS off, whatever the Node's input rules admit; it still serves DHCP.
      raw.dnsmasq: port=0
      security.acls: "{{ instances.network }}-egress"
      security.acls.default.ingress.action: reject
      security.acls.default.egress.action: reject
    container_network_args: >-
      {{ container_network_config | dict2items | map(attribute='key') | zip(container_network_config.values()) | map('join', '=') | list }}
    # Every process in a container gets the runtime folder's environment and the egress proxy: `incus exec` sessions, units and login
    # shells alike.
    container_profile_config: "{{ instances.profile_config }}"
    container_devices:
      root: { type: disk, path: /, pool: "{{ instances.pool }}" }
      eth0:
        type: nic
        name: eth0
        network: "{{ instances.network }}"
        security.port_isolation: 'true'
        security.acls: "{{ instances.nic_acl }}"
        security.acls.default.egress.action: reject
        security.acls.default.ingress.action: reject
      orbit-runtime:
        { type: disk, source: "{{ instances.folders.runtime.path }}", path: "{{ instances.folders.runtime.path }}", readonly: 'true', shift: 'true' }
      orbit-agent:
        { type: disk, source: "{{ instances.folders.agent.path }}", path: "{{ instances.folders.agent.path }}", readonly: 'true', shift: 'true' }
    container_restrictions: >-
      {{ instance_restrictions | combine({'restricted.containers.nesting': 'allow', 'restricted.containers.interception': 'allow',
         'restricted.containers.lowlevel': 'allow'} if instance_nested_project | bool else {}) }}
    instance_restrictions:
      restricted: 'true'
      restricted.networks.access: "{{ instances.network }}"
      restricted.containers.privilege: isolated
      restricted.devices.disk: allow
      restricted.devices.proxy: allow
      restricted.snapshots: allow
      limits.virtual-machines: '0'
    container_restrictions_unset: [restricted.devices.disk.paths]

# Move whole local NIC definitions only after the proxy ACL exists, retaining the effective reject defaults.
- name: Move existing NICs off the bridge union ACL
  ansible.builtin.include_tasks: instance-network-move.yml

- name: Reconcile the bridge endpoint union from Gateway intent
  ansible.builtin.include_tasks: instance-bridge-rules.yml
  vars:
    bridge_network: "{{ instances.network }}"
    bridge_cidr: "{{ instances.cidr }}"
    bridge_endpoints: "{{ instances.bridge_endpoints }}"
    bridge_admitted_at: "{{ instances.bridge_admitted_at }}"
    bridge_reconcile: true
    bridge_baseline:
      egress:
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.forwarder_port | string }}"
          state: enabled
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.egress.port | string }}"
          state: enabled
      ingress: "{{ instances.ingress }}"

- name: Keep endpoint mappings current after Docker restarts
  ansible.builtin.include_tasks: instance-bridge-refresh.yml

# After the shared folders and the projects: a new Node has no project before its prepare above.
- name: Bring the existing containers to the image's shared files
  ansible.builtin.include_tasks: instance-container-files.yml

- name: Run the egress proxy
  ansible.builtin.include_tasks: instance-egress.yml

# Agent development servers of the clones (docs/reference/development-containers.md#agent-development-servers): new TCP connections from
# WireGuard peers to a free port of the development range on the Node's WireGuard address go to Caddy's development listener, which
# routes them by host name to the same port in a clone. The table binds nothing, so a port in use on the Node keeps its program.
- name: Redirect agent development ports to Caddy
  vars:
    dev_ports_file: /etc/orbit/instance-dev-ports.nft
  block:
    - name: Make the folder of the table
      ansible.builtin.file: { path: /etc/orbit, state: directory, owner: root, group: root, mode: "0755" }
    - name: Write the table
      ansible.builtin.copy:
        dest: "{{ dev_ports_file }}"
        content: "{{ instances.dev_ports.ruleset }}"
        owner: root
        group: root
        mode: "0644"
        validate: nft --check --file %s
      register: dev_ports_ruleset
    # The table loads after `nftables.service`, whose `/etc/nftables.conf` may start with `flush ruleset`. Stopping the unit deletes it.
    - name: Write the unit of the table
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ instances.dev_ports.unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Orbit Instance containers: agent development ports to Caddy
          DefaultDependencies=no
          After=local-fs.target nftables.service
          Before=network-pre.target wg-quick@orbit.service docker.service incus.service
          Wants=network-pre.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft --file {{ dev_ports_file }}
          ExecReload=/usr/sbin/nft --file {{ dev_ports_file }}
          ExecStop=/usr/sbin/nft delete table inet {{ instances.dev_ports.table }}

          [Install]
          WantedBy=sysinit.target
      register: dev_ports_unit
    - name: Load the table
      ansible.builtin.systemd_service:
        name: "{{ instances.dev_ports.unit }}"
        daemon_reload: "{{ dev_ports_unit.changed }}"
        enabled: true
        state: started
      register: dev_ports_started
    # A table deleted by hand while its unit stays active comes back too.
    - name: Read the live table
      ansible.builtin.command: { argv: [nft, list, table, inet, "{{ instances.dev_ports.table }}"] }
      register: dev_ports_live
      changed_when: false
      failed_when: false
    # The file replaces the table in one transaction, so a changed table never leaves a gap.
    - name: Load a changed or missing table in place
      ansible.builtin.command: { argv: [nft, --file, "{{ dev_ports_file }}"] }
      when: (dev_ports_ruleset.changed or dev_ports_live.rc != 0) and not dev_ports_started.changed
      changed_when: true

# The fast wake of a frozen container (docs/reference/development-containers.md#the-node-resumes-a-frozen-container): the Gateway's
# wake request in /dev/shm/orbit/hibernation (root:caddy 0755, so only root writes there) starts the fixed script below. It runs as
# root with no capabilities: the Incus socket and the container's cgroup file belong to root, and `incus-admin` is root's equal.
# The files only add a unit: a converge that changes them restarts nothing that runs.
- name: Install the wake of frozen Instance containers
  block:
    - name: Make the folder of the wake script
      ansible.builtin.file: { path: /usr/local/libexec, state: directory, owner: root, group: root, mode: "0755" }
    - name: Write the wake script
      ansible.builtin.copy: { src: files/instance-container-wake.sh, dest: /usr/local/libexec/orbit-instance-wake, owner: root, group: root, mode: "0755" }
    - name: Write the wake service
      ansible.builtin.copy:
        dest: /etc/systemd/system/orbit-instance-wake.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Orbit Instance containers: resume a frozen container on a wake request

          [Service]
          Type=oneshot
          ExecStart=/usr/local/libexec/orbit-instance-wake
          TimeoutStartSec=30
          CapabilityBoundingSet=
          AmbientCapabilities=
          NoNewPrivileges=yes
          PrivateTmp=yes
          PrivateNetwork=no
          ProtectSystem=strict
          ProtectHome=yes
          ReadWritePaths=-/dev/shm/orbit/hibernation -/data/caddy/orbit/hibernation /sys/fs/cgroup
          RuntimeDirectory=orbit-instance-wake
          Environment=INCUS_CONF=/run/orbit-instance-wake
      register: wake_service
    - name: Write the wake request watch
      ansible.builtin.copy:
        dest: /etc/systemd/system/orbit-instance-wake.path
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Orbit Instance containers: wake requests

          [Path]
          PathExistsGlob=/dev/shm/orbit/hibernation/app-instance-*.wake
          Unit=orbit-instance-wake.service

          [Install]
          WantedBy=paths.target
      register: wake_path
    - name: Watch for wake requests
      ansible.builtin.systemd_service:
        name: orbit-instance-wake.path
        daemon_reload: "{{ wake_service.changed or wake_path.changed }}"
        enabled: true
        state: started

- name: Build the Instance image
  ansible.builtin.include_tasks: instance-image.yml
  vars:
    instance_variant: { project: "{{ instances.project }}", image: "{{ instances.image }}", stable_alias: orbit-instance }

# Only a switched-on Node gets the nested-fleet image, in its nested-fleet project (docs/reference/node-settings.md#nested-fleet-instance-hosting).
# A failed nested build fails only the nested project: the role goes on for normal Instances, and the record below makes a nested
# create refuse with instance.nested_fleet_image_unavailable until a later converge builds the image. The normal build above has
# no rescue: its failure still fails the role.
- name: Build the nested-fleet Instance image
  when: instances.nested is defined and instances.nested.image is defined
  block:
    - name: Build the nested-fleet image
      ansible.builtin.include_tasks: instance-image.yml
      vars:
        instance_variant: { project: "{{ instances.nested.project }}", image: "{{ instances.nested.image }}", stable_alias: orbit-instance-nested }
    - name: Clear the record of a failed nested-fleet image build
      ansible.builtin.file: { path: /var/lib/orbit/instance-nested-image.json, state: absent }
  rescue:
    - name: Record the failed nested-fleet image build
      ansible.builtin.copy:
        dest: /var/lib/orbit/instance-nested-image.json
        content: "{{ {'error': 'nested image build failed', 'alias': instances.nested.image.alias, 'task': ansible_failed_task.name | default('')} | to_json }}\n"
        owner: root
        group: root
        mode: "0644"
    - name: Report the failed nested-fleet image build
      ansible.builtin.debug:
        msg: "nested image build failed: {{ ansible_failed_task.name | default('') }}; nested-fleet creates refuse until a converge builds {{ instances.nested.image.alias }}"

# Read-only end check: a later regression on any NIC fails convergence instead of silently opening an Instance.
- name: Check every Instance bridge NIC at the end of the role
  ansible.builtin.include_tasks: instance-network-check.yml

- name: Require bridge default reject and unchanged ingress isolation
  ansible.builtin.assert:
    that:
      - (instance_network_check.stdout | from_json).config['security.acls.default.egress.action'] == 'reject'
      - (instance_network_check.stdout | from_json).config['security.acls.default.ingress.action'] == 'reject'
    fail_msg: instance.host_unavailable
    quiet: true

- name: Read the endpoint refresh timer and health
  ansible.builtin.command: {argv: [systemctl, is-active, orbit-instance-bridge-refresh.timer]}
  changed_when: false

- name: Require the endpoint refresh timer at boot
  ansible.builtin.command: {argv: [systemctl, is-enabled, orbit-instance-bridge-refresh.timer]}
  changed_when: false

- name: Read the bridge endpoint refresh health
  ansible.builtin.slurp: {src: /var/lib/orbit/instance-bridge/health.json}
  register: instance_bridge_health

- name: Require a healthy bridge endpoint refresh
  ansible.builtin.assert:
    that: (instance_bridge_health.content | b64decode | from_json).error_code is none
    fail_msg: instance.container_endpoint_unresolved
    quiet: true
