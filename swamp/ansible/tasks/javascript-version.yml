---
# One read of the JavaScript tool versions and the Vite+ runtime. A caller adds its own read-only commands
# (`javascript_read_commands`) to the same call, or sets `javascript_read: false` to read only those.
- name: Read the JavaScript tool versions and the Vite+ runtime
  ansible.builtin.import_tasks: check-read.yml
  vars:
    check_read_paths: "{{ [vp_runtime_package] if javascript_read | default(true) else [] }}"
    check_read_commands: >-
      {{ javascript_read_commands | default({}) | combine({'node': ['/usr/local/bin/node', '--version'],
      'pnpm': ['/usr/local/bin/pnpm', '--version'], 'bun': ['/usr/local/bin/bun', '--version'],
      'vp': ['/usr/local/bin/vp', '--version']} if javascript_read | default(true) else {}) }}
- name: Find the JavaScript tools that miss their pin
  when: javascript_read | default(true)
  vars:
    out: "{{ check_read.commands }}"
  ansible.builtin.set_fact:
    js_current: >-
      {{ out.node.stdout | trim == 'v' ~ recipe.tools.node.version
      and out.pnpm.stdout | trim == recipe.tools.pnpm.version
      and out.bun.stdout | trim == recipe.tools.bun.version
      and recipe.tools['vp-cli'].version in out.vp.stdout
      and check_read.paths[vp_runtime_package].exists }}
