        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: worker-ready
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) + (has(steps.prepare_network) && has(steps.prepare_network.outputs)
          ? [steps.prepare_network.outputs] : []) + (has(steps.publish_hub) && has(steps.publish_hub.outputs)
          && steps.publish_hub.outputs.status == "succeeded" ? [{"stage": "publish-hub",
          "ok": true, "output": {"hub_configured": true}, "error_code": null}] : [])
          + (has(steps.publish_network) && has(steps.publish_network.outputs) ? [steps.publish_network.outputs]
          : []) + (has(steps.issue_worker) && has(steps.issue_worker.outputs) ? [steps.issue_worker.outputs]
          : []) + (has(steps.configure_worker) && has(steps.configure_worker.outputs)
          ? [steps.configure_worker.outputs] : []) }}'
  - name: worker_ready_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: worker_ready
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.worker_ready.outputs.ok
      message: The Task VM worker-ready stage did not complete
      severity: high
- name: issue-model
  dependsOn:
  - job: worker-ready
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(steps.admit.outputs.input.gateway_node_id) }}
