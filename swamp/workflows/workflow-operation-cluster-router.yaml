        type: always
    - step: forward_dns
      condition:
        type: always
    - step: forward_cleanup
      condition:
        type: always
    - step: forward_retire_lan
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: forward-result
      methodName: result
      inputs:
        stage: ${{ self.stage }}
        mode: forward
        required:
