id: 8e7a8caf-625c-422e-8b08-3ff8d2de4e3b
name: operation-integrations
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "7 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-integrations-discovery
          methodName: discover
          inputs:
            family: operation-integrations
            kinds: ["metrics.node_exporter_converge", "metrics.node_exporter_remove", "metrics.cadvisor_converge", "metrics.cadvisor_remove", "vault.setup", "vault.sync", "vault.teardown", "websocket.app_rotate", "conn.pairing_create", "conn.pairing_revoke", "ai_router.setup", "ai_router.teardown", "ai_router.collector_converge", "metrics.enable", "metrics.disable", "metrics.reconcile", "metrics.exporter_enable", "metrics.exporter_disable", "metrics.node_exporter_snapshot", "metrics.node_exporter_restore", "metrics.cadvisor_snapshot", "metrics.cadvisor_restore", "metrics.service_snapshot", "metrics.service_converge", "metrics.service_restore", "metrics.runtime_converge", "metrics.runtime_remove", "metrics.runtime_verify", "metrics.certificate_publish", "metrics.certificate_remove", "metrics.publication_firewall", "metrics.credentials_reset", "conn.gateway_sessions_revoke", "metrics.retire", "metrics.role_converge", "metrics.role_remove", "analytics.role_converge", "analytics.role_remove", "websocket.role_converge", "websocket.role_remove", "metrics.service_caddy_restore"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-integrations'
          behaviorName: '${{ "operation-integrations-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
