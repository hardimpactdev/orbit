- name: tmpfiles_job
  dependsOn:
  - job: php_runtime_verify_job
    condition:
      type: succeeded
  steps:
  - name: tmpfiles
    writes: true
    guard: ${{ !(inputs.intent.artifacts.exists(a, a.name == "tmpfiles" && a.required)) }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-converge-action-" + string(inputs.node_id) + "-tmpfiles" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          exec /usr/bin/sudo -n -- /usr/bin/python3 -I - "${{ steps.prepare.outputs.intent_file }}" <<'ORBIT_PY'
          import json
          import os
          import stat
          import sys
          import tempfile
          from pathlib import Path

          with open(sys.argv[1], encoding="utf-8") as source:
              text = source.read(16777217)
          if len(text) > 16777216:
              raise ValueError("public intent exceeds limit")
          intent = json.loads(text)
          ROOT = Path("/var/lib/orbit/private-dns/releases")
          SERVICE = Path("/etc/systemd/system/orbit-private-dns.service")
          SOCKET = Path("/etc/systemd/system/orbit-private-dns.socket")
          TMPFILES = Path("/etc/tmpfiles.d/orbit.conf")
          UID, GID = (0, 0)


          class Invalid(Exception):
              pass


          def current(path, data):
              try:
                  m = path.lstat()
                  return (
                      stat.S_ISREG(m.st_mode)
                      and (m.st_uid, m.st_gid, m.st_mode & 4095) == (UID, GID, 420)
                      and (path.read_bytes() == data)
                  )
              except FileNotFoundError:
                  return False


          def replace(path, data, mode=420):
              fd, candidate = tempfile.mkstemp(prefix=".orbit-footprint-", dir=path.parent)
              try:
                  with os.fdopen(fd, "wb") as stream:
                      stream.write(data)
                      stream.flush()
                      os.fsync(stream.fileno())
                      os.fchmod(stream.fileno(), mode)
                      os.fchown(stream.fileno(), UID, GID)
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)


          def tmpfiles(payload):
              if not isinstance(payload, dict) or set(payload) != {"rule"}:
                  raise Invalid()
              rule = payload["rule"]
              if (
                  not isinstance(rule, str)
                  or not rule
                  or "\x00" in rule
                  or any(
                      (
                          line
                          and (not line.startswith(("#", "e /tmp/orbit-", "e /dev/shm/orbit-")))
                          for line in rule.splitlines()
                      )
                  )
              ):
                  raise Invalid()
              data = rule.encode()
              if current(TMPFILES, data):
                  return {"changed": False}
              replace(TMPFILES, data)
              return {"changed": True}


          try:
              output = tmpfiles(intent["payloads"]["tmpfiles"])
              output["ok"] = "error_code" not in output
          except Exception:
              output = {"ok": False, "error_code": "node.tmpfiles_failed"}
          print(json.dumps(output, separators=(",", ":")))
          ORBIT_PY
  - name: tmpfiles_ready
    dependsOn:
    - step: tmpfiles
      condition:
        type: always
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/node-converge-native'
      behaviorName: ${{ "node-converge-native-" + string(inputs.node_id) }}
      methodName: verify
      inputs:
        required: ${{ inputs.intent.artifacts.exists(a, a.name == "tmpfiles" && a.required) }}
        names:
        - tmpfiles
        steps: ${{ steps }}
    writes: true
- name: agent_configure_job
  dependsOn:
  - job: tmpfiles_job
    condition:
      type: succeeded
  steps:
  - name: agent_configure
    writes: true
    guard: ${{ !(inputs.intent.artifacts.exists(a, a.name == "agent" && a.required)) }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-converge-action-" + string(inputs.node_id) + "-agent_configure" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          exec /usr/bin/sudo -n --preserve-env=ORBIT_AGENT_HASH,ORBIT_OBSERVER_RESULT -- /usr/bin/python3 -I - "${{ steps.prepare.outputs.intent_file }}" <<'ORBIT_PY'
          import fcntl
          import hashlib
          import json
          import os
          import secrets
          import stat
          import subprocess
          import sys
          import tempfile
          import tomllib

          with open(sys.argv[1], encoding="utf-8") as source:
              text = source.read(16777217)
          if len(text) > 16777216:
              raise ValueError("public intent exceeds limit")
          intent = json.loads(text)
          ROOT = "/"
          UID = 0


          class Refusal(Exception):
              def __init__(self, code):
                  self.code = code


          def refuse(code="agent.configure_failed"):
              raise Refusal(code)


          def path(p):
              return os.path.join(ROOT, p.lstrip("/"))


          def metadata(p, mode=None, directory=False):
              try:
                  m = os.lstat(path(p))
              except FileNotFoundError:
                  return None
              if (
                  stat.S_ISLNK(m.st_mode)
                  or m.st_uid != UID
                  or (stat.S_ISDIR(m.st_mode) if directory else stat.S_ISREG(m.st_mode))
                  is not True
              ):
                  refuse()
              if mode is not None and stat.S_IMODE(m.st_mode) != mode:
                  refuse()
              return m


          def parents(p):
              current = ""
              for part in os.path.dirname(p).split("/"):
                  if not part:
                      continue
                  current += "/" + part
                  m = metadata(current, directory=True)
                  if m is None or (
                      m.st_mode & 18
                      and (not (current == "/run/lock" and stat.S_IMODE(m.st_mode) == 1023))
                  ):
                      refuse()


          def read(p):
              parents(p)
              m = metadata(p)
              if m is None:
                  return None
              with open(path(p), "rb") as f:
                  return f.read()


          def publish(p, text, mode):
              parents(p)
              metadata(p)
              data = text.encode()
              if read(p) == data:
                  os.chmod(path(p), mode)
                  return False
              fd, candidate = tempfile.mkstemp(
                  prefix=".orbit-candidate-", dir=os.path.dirname(path(p))
              )
              try:
                  os.fchmod(fd, mode)
                  with os.fdopen(fd, "wb") as f:
                      f.write(data)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(candidate, path(p))
                  d = os.open(os.path.dirname(path(p)), os.O_RDONLY | os.O_DIRECTORY)
                  try:
                      os.fsync(d)
                  finally:
                      os.close(d)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
              return True


          def system(args):
              if ROOT != "/":
                  return
              if subprocess.run(
                  args,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=120,
              ).returncode:
                  refuse()


          def pin(expected):
              p = "/usr/local/bin/orbit-agent"
              parents(p)
              if metadata(p, 493) is None:
                  refuse("agent.version_mismatch")
              with open(path(p), "rb") as f:
                  digest = hashlib.file_digest(f, "sha256").hexdigest()
              if digest != expected:
                  refuse("agent.version_mismatch")


          def configure(i):
              pin(i["agent_sha256"])
              lock = "/run/lock/orbit-self-update.lock"
              lockrefusal = (
                  "node.agent_rekey_unavailable"
                  if i.get("auth_only")
                  else "agent.configure_failed"
              )
              try:
                  parents(lock)
                  fd = os.open(path(lock), os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 384)
              except Exception:
                  refuse(lockrefusal)
              with os.fdopen(fd, "r+b") as held:
                  m = os.fstat(held.fileno())
                  if not stat.S_ISREG(m.st_mode) or m.st_uid != UID or m.st_mode & 18:
                      refuse(lockrefusal)
                  fcntl.flock(held, fcntl.LOCK_EX)
                  pin(i["agent_sha256"])
                  try:
                      cfg = tomllib.loads(i["configuration"])
                      worker = cfg.get("swamp_worker")
                  except Exception:
                      refuse(lockrefusal)
                  if worker is not None:
                      if (
                          not isinstance(worker, dict)
                          or type(worker.get("node_id")) is not int
                          or worker["node_id"] < 1
                          or (not isinstance(worker.get("user"), str))
                      ):
                          refuse()
                      available = [
                          line.split()
                          for line in read("/proc/meminfo").decode().splitlines()
                          if line.startswith("MemAvailable:")
                      ]
                      if (
                          len(available) != 1
                          or len(available[0]) != 3
                          or available[0][2] != "kB"
                          or (int(available[0][1]) * 1024 < 403378168 + 256 * 1024 * 1024)
                      ):
                          refuse("swamp.node_worker_memory_low")
                      if i.get("worker_credentials") is None:
                          try:
                              if metadata("/etc/orbit/swamp-worker", 448, True) is None:
                                  refuse("swamp.node_worker_not_ready")
                              for name in ["enrollment.token", "server.token"]:
                                  if metadata("/etc/orbit/swamp-worker/" + name, 384) is None:
                                      refuse("swamp.node_worker_not_ready")
                          except Refusal:
                              refuse("swamp.node_worker_not_ready")
                  if i.get("auth_only"):
                      try:
                          if (
                              i.get("allow_secret_rotation") is not True
                              or i.get("worker_credentials") is not None
                              or type(i.get("node_id")) is not int
                          ):
                              refuse()
                          installedcfg = read("/etc/orbit/agent/config.toml")
                          if (
                              installedcfg is None
                              or metadata("/etc/orbit/agent/config.toml", 420) is None
                          ):
                              refuse()
                          current = tomllib.loads(installedcfg.decode()).get("swamp_worker")
                          if (
                              not isinstance(current, dict)
                              or not isinstance(worker, dict)
                              or type(current.get("node_id")) is not int
                              or (current.get("node_id") != i["node_id"])
                              or (current != worker)
                          ):
                              refuse()
                          for file in [
                              "/etc/orbit/agent/ca.pem",
                              "/etc/systemd/system/orbit-agent.service",
                          ]:
                              if metadata(file, 420) is None:
                                  refuse()
                          if (
                              metadata("/etc/orbit/agent", 448, True) is None
                              or metadata("/etc/orbit/agent/secret", 384) is None
                          ):
                              refuse()
                      except Exception:
                          refuse("node.agent_rekey_unavailable")
                  installed = read("/etc/orbit/agent/secret")
                  keep = (
                      installed is not None
                      and i["secret_hash"] is not None
                      and (hashlib.sha256(installed).hexdigest() == i["secret_hash"])
                  )
                  if not i["allow_secret_rotation"] and (not keep):
                      refuse("agent.secret_mismatch")
                  parents("/etc/orbit/agent")
                  if metadata("/etc/orbit/agent", directory=True) is None:
                      os.mkdir(path("/etc/orbit/agent"), 448)
                  os.chmod(path("/etc/orbit/agent"), 448)
                  if keep:
                      metadata("/etc/orbit/agent/secret", 384)
                      digest = i["secret_hash"]
                  else:
                      secret = secrets.token_hex(32)
                      publish("/etc/orbit/agent/secret", secret, 384)
                      digest = hashlib.sha256(secret.encode()).hexdigest()
                  if i.get("auth_only"):
                      system(["systemctl", "restart", "--no-block", "orbit-agent.service"])
                      return {
                          "configured": True,
                          "secret_hash": digest,
                          "restarted": True,
                          "unclosed": [],
                      }
                  changed = not keep or i["binary_changed"]
                  for p, key in [
                      ("/etc/orbit/agent/config.toml", "configuration"),
                      ("/etc/orbit/agent/ca.pem", "certificate"),
                      ("/etc/systemd/system/orbit-agent.service", "unit"),
                  ]:
                      changed = publish(p, i[key], 420) or changed
                  unclosed = []
                  for checkout in i["checkouts"]:
                      if os.path.realpath(path(checkout)) != path(checkout) or not os.path.isdir(
                          path(checkout)
                      ):
                          continue
                      env = os.path.join(path(checkout), ".env")
                      try:
                          m = os.lstat(env)
                          if stat.S_ISREG(m.st_mode):
                              os.chmod(env, stat.S_IMODE(m.st_mode) & ~7, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      except OSError:
                          unclosed.append(checkout)
                  system(["systemctl", "daemon-reload"])
                  system(["systemctl", "enable", "--now", "orbit-agent.service"])
                  if changed:
                      system(["systemctl", "restart", "--no-block", "orbit-agent.service"])
                  return {
                      "configured": True,
                      "secret_hash": digest,
                      "restarted": changed,
                      "unclosed": unclosed,
                  }


          try:
              payload = dict(intent["payloads"]["agent"])
              import pwd

              account = pwd.getpwnam(payload.pop("user"))
              root = payload.pop("apps_root") or account.pw_dir + "/apps"
              if not root.startswith("/") or any(
                  (part in (".", "..") for part in root.split("/"))
              ):
                  raise ValueError()
              payload["checkouts"] = [
                  path for path in payload["checkouts"] if path.startswith(root + "/")
              ]
              payload["unit"] = payload["unit"].replace(
                  "ProtectHome=yes\n",
                  "ProtectHome=tmpfs\n"
                  + (
                      "BindReadOnlyPaths=-" + root + "\n"
                      if root.startswith(("/home/", "/root/"))
                      else ""
                  ),
              )
              payload.pop("url", None)
              payload.update(
                  agent_sha256=intent["agent_sha256"],
                  secret_hash=json.loads(os.environ.pop("ORBIT_AGENT_HASH")),
                  allow_secret_rotation=False,
                  binary_changed=json.loads(os.environ.pop("ORBIT_OBSERVER_RESULT")).get(
                      "changed"
                  )
                  is True,
              )
              output = configure(payload)
              output.pop("secret_hash", None)
              output["ok"] = output.get("configured") is True
          except Refusal as error:
              output = {"ok": False, "error_code": error.code}
          except Exception:
              output = {"ok": False, "error_code": "agent.configure_failed"}
          print(json.dumps(output, separators=(",", ":")))
          ORBIT_PY
        env:
          ORBIT_AGENT_HASH: ${{ vault.get(inputs.execution_secrets.secret_hash.vault, inputs.execution_secrets.secret_hash.key) }}
          ORBIT_OBSERVER_RESULT: ${{ steps.agent_install.outputs.stdout }}
  - name: agent_configure_ready
    dependsOn:
    - step: agent_configure
      condition:
        type: always
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/node-converge-native'
      behaviorName: ${{ "node-converge-native-" + string(inputs.node_id) }}
      methodName: verify
      inputs:
        required: ${{ inputs.intent.artifacts.exists(a, a.name == "agent" && a.required) }}
        names:
        - agent_configure
        steps: ${{ steps }}
    writes: true
- name: worker_configure_job
  dependsOn:
  - job: agent_configure_job
    condition:
      type: succeeded
  steps:
  - name: worker_configure
    writes: true
    guard: ${{ !(inputs.intent.artifacts.exists(a, a.name == "agent" && a.required)) }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-converge-action-" + string(inputs.node_id) + "-worker_configure" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          printf '%s\n' '{"ok":false,"error_code":"operation.kind_unavailable"}'
          exit 1
- name: projection
  dependsOn:
  - job: public_intent
    condition:
      type: always
  - job: public_parts
    condition:
      type: always
  - job: public_payload
    condition:
      type: always
  - job: agent_install_job
    condition:
      type: always
  - job: caddy_package_job
    condition:
      type: always
  - job: caddy_job
    condition:
      type: always
  - job: peer_dns_job
    condition:
      type: always
  - job: dns_listener_job
    condition:
      type: always
  - job: dns_publish_job
    condition:
      type: always
  - job: dns_verify_job
    condition:
      type: always
  - job: residue_complete_job
    condition:
      type: always
  - job: php_runtime_job
    condition:
      type: always
  - job: php_runtime_verify_job
    condition:
      type: always
  - job: tmpfiles_job
    condition:
      type: always
  - job: agent_configure_job
    condition:
      type: always
  - job: worker_configure_job
    condition:
      type: always
  steps:
  - name: summary
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/node-converge-native'
      behaviorName: ${{ "node-converge-native-" + string(inputs.node_id) }}
      methodName: summarize
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        steps: ${{ steps }}
        run_id: ${{ run.id }}
  - name: result
    dependsOn:
    - step: summary
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-converge-result-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          printf '%s\n' "${{ steps.summary.outputs.json }}"
  - name: cleanup_public_input
    guard: ${{ !steps.summary.outputs.proven }}
    dependsOn:
    - step: result
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-converge-input-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          exec /usr/bin/python3 -I - "${{ run.id }}" <<'ORBIT_PY'
          import os
          import shutil
          import stat
          import sys
          import uuid

          root = "/tmp/orbit-node-converge-" + str(uuid.UUID(sys.argv[1]))
          info = os.lstat(root)
          if (
              not stat.S_ISDIR(info.st_mode)
              or info.st_uid != os.geteuid()
              or stat.S_IMODE(info.st_mode) != 448
          ):
              raise ValueError("Public input directory custody changed")
          shutil.rmtree(root)
          print('{"cleaned":true}')
          ORBIT_PY
  - name: complete
    dependsOn:
    - step: result
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: assert
      expr: steps.summary.outputs.proven
      message: The native footprint did not converge
      severity: high
