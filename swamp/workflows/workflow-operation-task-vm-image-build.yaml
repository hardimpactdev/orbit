- name: cleanup
  writes: true
  dependsOn:
  - {job: admission, condition: {type: succeeded}}
  - {job: build, condition: {type: always}}
  steps:
  - name: cleanup-builder
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '930', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, incus.vm]
        timeoutSec: 960
        stdin: ${{ steps.plan.outputs.reset_builder }}
  - name: cleanup-builder-reply
    labels: {role: swamp}
    dependsOn:
    - {step: cleanup-builder, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["cleanup-builder"].outputs.stdout }}
        expect: ready
  - name: cleanup-smoke
    labels: {role: swamp}
    dependsOn:
    - {step: cleanup-builder-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '930', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, incus.vm]
        timeoutSec: 960
        stdin: ${{ steps.plan.outputs.reset_smoke }}
  - name: cleanup-smoke-reply
    labels: {role: swamp}
    dependsOn:
    - {step: cleanup-smoke, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["cleanup-smoke"].outputs.stdout }}
        expect: ready
  - name: cleanup-pi-host
    labels: {role: swamp}
    guard: ${{ inputs.intent.pi_artifact == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '30', /usr/bin/rm, -f, --, '${{ "/tmp/orbit-image-pi-" + run.id + ".bin" }}']
        timeoutSec: 60
  - name: cleanup-pi-local
    labels: {role: swamp}
    guard: ${{ inputs.intent.pi_artifact == null }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "image-build-local" }}
      methodName: execute
      inputs:
        run: rm -f -- "$ORBIT_STAGE"
        env:
          ORBIT_STAGE: ${{ "/tmp/orbit-image-pi-" + run.id + ".bin" }}
