---
# One Node's part of a Route: certificate, web root access, PHP-FPM pools, Caddy site, APP_URL lines and awake markers.
# One tagged part per Swamp phase: `site`. The Gateway's admitted intent is in the run folder, read by a file lookup so
# that text with `{{` (a Caddyfile, a pool) reaches the Node unchanged. The signed certificates come in the environment of
# the phase, joined by `|||`. The lists of the intent hold the work of every Node; each task takes this Node's items.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    route_input: >-
      {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_INTENT_PATH')
         | default(lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json', true)) | from_json }}
    intent: "{{ route_input.route if lookup('ansible.builtin.env', 'ORBIT_INTENT_FIELD') == 'route' else route_input }}"
    node: "{{ intent.nodes[lookup('ansible.builtin.env', 'ORBIT_NODE_ID')] }}"
    address_target: "{{ node }}"
    address_identity: "{{ node.identity_file }}"
    address_group: route_node
  tasks:
    - name: Create the site child scratch folder when reusing admitted input
      when:
        - lookup('ansible.builtin.env', 'ORBIT_INTENT_PATH') | length > 0
        - lookup('ansible.builtin.env', 'ORBIT_INTENT_PATH') != run ~ '/intent.json'
      ansible.builtin.file:
        path: "{{ run }}"
        state: directory
        mode: '0700'
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Install the certificate and publish the site
  hosts: route_node
  become: true
  gather_facts: false
  tags: [site]
  vars:
    route_input: >-
      {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_INTENT_PATH')
         | default(lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json', true)) | from_json }}
    intent: "{{ route_input.route if lookup('ansible.builtin.env', 'ORBIT_INTENT_FIELD') == 'route' else route_input }}"
    node_id: "{{ lookup('ansible.builtin.env', 'ORBIT_NODE_ID') | int }}"
    node_ids: "{{ [node_id | int, node_id | string] }}"
    node: "{{ intent.nodes[node_id | string] }}"
    prepared: "{{ lookup('ansible.builtin.env', 'ORBIT_PREPARED') == (node_id | string) }}"
    account_gid: "{{ getent_passwd[node.account][2] }}"
    account_home: "{{ getent_passwd[node.account][4] }}"
    signed: "{{ lookup('ansible.builtin.env', 'ORBIT_SIGNED').split('|||') }}"
  tasks:
    # The account passwd line: its gid and home (play variables) go into the pools and the certificate copy.
    - name: Read the account
      ansible.builtin.getent:
        database: passwd
        key: "{{ node.account }}"
    # Caddy access by ACL, in order: deny the checkout, open the path, grant the served roots (one command for each kind of path).
    # An Instance create (its checkout phase) and a task provision (its workspace step) have done this on their own Node, before the
    # setup commands write into the tree.
    - name: Set the Route access on this Node
      ansible.builtin.import_tasks: tasks/route-access.yml
      vars:
        access: "{{ intent }}"
      when: not prepared
    - name: Link the shared environment files
      ansible.builtin.file:
        src: "{{ item.target }}"
        dest: "{{ item.path }}"
        owner: "{{ item.owner }}"
        state: link
        force: true
        follow: false
      loop: "{{ intent.links | default([]) | selectattr('node_id', 'in', node_ids) | list }}"
      loop_control:
        label: "{{ item.path }}"
    - name: Write the PHP-FPM pool files
      ansible.builtin.copy:
        content: "{{ item.content | replace('__ORBIT_NODE_GROUP__', account_gid) | replace('/__ORBIT_NODE_HOME__', account_home) }}"
        dest: "{{ item.path }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ intent.php_files | default([]) | selectattr('node_id', 'in', node_ids) | list }}"
      loop_control:
        label: "{{ item.path }}"
    - name: Test the PHP-FPM configuration
      ansible.builtin.command:
        argv: "{{ ['timeout', '30'] + item.argv }}"
      loop: "{{ intent.php_tests | default([]) | selectattr('node_id', 'in', node_ids) | list }}"
      loop_control:
        label: "{{ item.argv[0] }}"
      changed_when: false
    # A reload keeps open requests. A task VM image keeps PHP-FPM off and disabled, so a stopped unit starts and stays enabled.
    - name: Reload PHP-FPM
      ansible.builtin.systemd:
        name: "{{ item.unit }}"
        state: reloaded
        enabled: true
      loop: "{{ intent.php_reloads | default([]) | selectattr('node_id', 'in', node_ids) | list }}"
      loop_control:
        label: "{{ item.unit }}"
    # One Node call keeps private keys local, then validates and reloads in the existing order.
    - name: Converge certificate links trust and Caddy files
      orbit_route_site:
        intent: "{{ intent }}"
        node_id: "{{ node_id }}"
        signed: "{{ signed }}"
    # The last task: a success leaves no run folder, so the workflow cleans up only after a failure.
    - name: Remove the run folder
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
        state: absent
      delegate_to: localhost
      become: false
      check_mode: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
