id: 6d0b7f4e-3c51-4a8e-9b1f-2e8c5d7a4f10
name: operation-process-container
description: One Process of an Instance container through `incus exec` on its Node, the `process` tag of instance-container.yml. A child of process start, stop and restart, the status observation process.inspect, and the Gateway's log read.
vaults:
- orbit-control-inputs
queueTimeout: 30
labels: {role: swamp}
inputs:
  type: object
  properties:
    # 0 for the Gateway's log read, which records no Operation.
    operation_id: {type: integer, minimum: 0}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [process.start, process.stop, process.restart, process.inspect]}
    intent:
      type: object
      properties:
        control:
          type: object
          properties:
            process_id: {type: integer, minimum: 1}
            name: {type: string, pattern: '^orbit-process-[1-9][0-9]*-[a-z0-9-]+\.service$'}
          required: [process_id, name]
        container:
          type: object
          properties:
            instance_id: {type: integer, minimum: 1}
            project: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
            name: {type: string, pattern: '^instance-[1-9][0-9]*$'}
          required: [instance_id, project, name]
          additionalProperties: false
        ssh_execution: {type: object}
        # A read: status or logs, its line count, and the request id that names its vault key.
        read:
          type: object
          properties:
            action: {type: string, enum: [status, logs]}
            lines: {type: integer, minimum: 1, maximum: 1000}
            request: {type: string, format: uuid}
          required: [action, lines, request]
          additionalProperties: false
      required: [control, container, ssh_execution]
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: process
  labels: {role: swamp}
  steps:
  - name: input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs:
        intent: '${{ inputs.intent }}'
        path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
  # Start, stop or restart the unit and check its state; or read its state and journal into the run folder on the worker.
  - name: Act on the Process
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: input, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "process-in-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}'
      methodName: execute
      inputs:
        run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags process "$ORBIT_ANSIBLE/instance-container.yml"
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
          ORBIT_RUN_ID: '${{ run.id }}'
          ORBIT_ANSIBLE: '${{ steps.input.outputs.assets }}'
          ANSIBLE_CONFIG: '${{ steps.input.outputs.assets + "/ansible.cfg" }}'
          ANSIBLE_SSH_ARGS: '${{ "-o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          ORBIT_PROCESS_ACTION: '${{ inputs.kind == "process.inspect" ? inputs.intent.read.action : inputs.kind.split(".")[1] }}'
  # A read keeps its journal lines in the vault and publishes only the state and the vault key.
  - name: Read Process result
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Act on the Process, condition: {type: succeeded}}]
    guard: '${{ inputs.kind != "process.inspect" }}'
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: '${{ "process-inspection-" + string(inputs.intent.control.process_id) }}'
      methodName: inspection
      inputs:
        directory: '${{ "/tmp/orbit-ansible-" + run.id }}'
        request: '${{ inputs.intent.read.request }}'
  - name: cleanup
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: input, condition: {type: always}}
    - {step: Act on the Process, condition: {type: always}}
    - {step: Read Process result, condition: {type: always}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "process-in-container-cleanup-" + string(inputs.node_id) }}'
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_RUN"
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
