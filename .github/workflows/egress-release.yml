name: Egress proxy release

# Builds orbit-egress, the Instance egress proxy (docs/decisions/0254-inject-external-secrets-at-the-node-egress-proxy.md), and on
# main, from a push or a manual run, publishes a build of a source that has no release yet. The release tag names the Git tree of
# apps/egress, so the same source never builds twice. Go is pinned and the build is reproducible, so the SHA-256 is known before the
# release exists; a reviewed commit pins it, as for the static PHP build.
on:
  push:
    branches: [main]
    paths:
      - apps/egress/**
      - .github/workflows/egress-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egress-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish orbit-egress
    if: github.ref == 'refs/heads/main' && github.repository == 'hardimpactdev/orbit'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the release after the source tree
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="orbit-egress-$(git rev-parse HEAD:apps/egress | cut -c1-12)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if answer="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} exists; nothing to build."
          else
            grep -qx 'release not found' <<< "$answer" || { echo "::error::Cannot read release ${tag}: ${answer}"; exit 1; }
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.missing == 'true'
        with:
          go-version: 1.27.3
          cache: false

      - name: Test and build the static Linux binary
        if: steps.tag.outputs.missing == 'true'
        working-directory: apps/egress
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          mkdir -p "$RUNNER_TEMP/release"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' \
            -o "$RUNNER_TEMP/release/orbit-egress-linux-x86_64" ./cmd/orbit-egress
          cd "$RUNNER_TEMP/release" && sha256sum orbit-egress-linux-x86_64 > SHA256SUMS && cat SHA256SUMS

      # A published build is never replaced: its SHA-256 may already be pinned.
      - name: Publish the release
        if: steps.tag.outputs.missing == 'true'
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "orbit-egress (${TAG})" \
            --notes "The Instance egress proxy, built from ${GITHUB_SHA}. See docs/decisions/0254-inject-external-secrets-at-the-node-egress-proxy.md." \
            ./*
