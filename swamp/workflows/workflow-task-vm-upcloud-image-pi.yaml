id: ce4e2665-113f-44ba-bf99-1b336d4ac89b
name: task-vm-upcloud-image-pi
description: Stage the pinned Pi build from the Gateway Node to the UpCloud builder's cache through 209 over pinned official SSH; 209 checks its digest.
version: 1
queueTimeout: 60
vaults: []
inputs:
  type: object
  properties:
    intent: {type: object}
    address: {type: string}
  required: [intent, address]
  additionalProperties: false
jobs:
- name: pi
  writes: true
  steps:
  - name: fetch
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-pi-source-" + string(inputs.intent.pi_source.target.host)).split(".").join("-") }}
      methodName: copy
      globalArgs:
        name: ${{ ("image-pi-source-" + string(inputs.intent.pi_source.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.pi_source.target.user }}
          port: ${{ inputs.intent.pi_source.target.port }}
          identityFile: ${{ inputs.intent.pi_source.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.pi_source.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.pi_source.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ inputs.intent.pi_artifact.path }}
        dst: ${{ "/tmp/orbit-image-pi-" + run.id + ".bin" }}
        direction: from
        timeoutSec: 300
  - name: check
    labels: {role: swamp}
    dependsOn:
    - {step: fetch, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "image-build-local" }}
      methodName: execute
      inputs:
        run: printf '%s  %s\n' "$ORBIT_SHA" "$ORBIT_STAGE" | sha256sum -c --quiet
        env:
          ORBIT_SHA: ${{ inputs.intent.pi_artifact.sha256 }}
          ORBIT_STAGE: ${{ "/tmp/orbit-image-pi-" + run.id + ".bin" }}
  - name: copy
    labels: {role: swamp}
    dependsOn:
    - {step: check, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: copy
      globalArgs: &guest
        name: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
        transport:
          kind: ssh
          user: orbit
          port: 22
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.address }}
          transport:
            hostKeys: ${{ [inputs.intent.host_key] }}
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-image-pi-" + run.id + ".bin" }}
        dst: ${{ "/tmp/orbit-image-pi-" + inputs.intent.pi_artifact.sha256 + ".bin" }}
        direction: to
        atomic: true
        mode: '0600'
        verifySha256: true
        timeoutSec: 300
  - name: install
    # The Pi phase accepts only a root-owned cache file; /tmp on the builder clears at the next boot.
    labels: {role: swamp}
    dependsOn:
    - {step: copy, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/sudo, -n, --, /usr/bin/install, -D, -m, '0600', -o, root, -g, root, --, '${{ "/tmp/orbit-image-pi-" + inputs.intent.pi_artifact.sha256
            + ".bin" }}', '${{ "/var/cache/orbit/pi/" + inputs.intent.pi_artifact.sha256 + ".bin" }}']
        timeoutSec: 90
  - name: cleanup-local
    labels: {role: swamp}
    dependsOn:
    - {step: install, condition: {type: always}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "image-build-local" }}
      methodName: execute
      inputs:
        run: rm -f -- "$ORBIT_STAGE"
        env:
          ORBIT_STAGE: ${{ "/tmp/orbit-image-pi-" + run.id + ".bin" }}
