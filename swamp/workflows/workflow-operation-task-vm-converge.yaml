id: f17a264f-7f41-4ee2-a97d-9ac7f6d789e2
name: operation-task-vm-converge
description: Bring a running task VM to the pins of the release with the task VM role phases of Ansible, from 209; each phase is one call of the shared child task-vm-role-run.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.converge]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: software
  labels: {role: swamp}
  steps:
  - name: Install the software
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-role-run
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ''
        address: ''
        host_key: ''
        tags: software
        with_pi: true
- name: tools
  labels: {role: swamp}
  dependsOn:
  - {job: software, condition: {type: succeeded}}
  steps:
  - name: Install the tools
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-role-run
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ''
        address: ''
        host_key: ''
        tags: tools
        with_pi: false
- name: check
  labels: {role: swamp}
  dependsOn:
  - {job: tools, condition: {type: succeeded}}
  steps:
  - name: Check the task VM role
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-role-run
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ''
        address: ''
        host_key: ''
        tags: check
        with_pi: false
