id: b14d2aa1-9248-43ef-a2f1-233044ec7cb6
name: route-lan-apply
description: Converge captured shared Route LAN tuples with the official firewall model.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
      properties:
        rule:
          type: object
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - rule
      - control_node_id
      - connection
      - host_keys
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: lan
  steps:
  - name: input
    target: orbit-node-209
    labels: &id001
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: route-lan-input
      methodName: lan
      inputs:
        intent: ${{ inputs.intent.rule }}
  - name: apply
    target: orbit-node-209
    labels: *id001
    forEach:
      item: rule
      in: ${{ inputs.intent.rule.rules }}
    dependsOn:
    - step: input
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/firewall'
      behaviorName: ${{ "route-lan-" + run.id + "-" + self.rule.model_name }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodePort: ${{ inputs.intent.connection.nodePort }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        port: ${{ self.rule.port }}
        protocol: ${{ self.rule.protocol }}
        source: ${{ self.rule.source }}
        ensure: ${{ self.rule.ensure }}
        action: allow
        direction: in
      inputs: {}
  - name: verify-tuples
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: input
      condition:
        type: succeeded
    - step: apply
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: route-lan-applied
      methodName: lanApplied
      inputs:
        plan: ${{ steps.input.outputs }}
        outcomes: ${{ steps }}
  - name: migrate
    target: orbit-node-209
    labels: *id001
    forEach:
      item: plan
      in: '${{ inputs.intent.rule.migrate ? [inputs.intent] : [] }}'
    dependsOn:
    - step: input
      condition:
        type: succeeded
    - step: verify-tuples
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: route-lan-migrate
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: ${{ inputs.execution_secrets }}
        intent: ${{ self.plan }}
  - name: result
    target: orbit-node-209
    labels: *id001
    dependsOn:
    - step: input
      condition:
        type: succeeded
    - step: apply
      condition:
        type: always
    - step: migrate
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: route-lan-result
      methodName: lanResult
      inputs:
        plan: ${{ steps.input.outputs }}
        outcomes: ${{ steps }}
