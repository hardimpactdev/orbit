---
# Internal workspace phases. Only this trusted program runs in the guest, as agent.
# Git snapshots and bounded receipts have no built-in Ansible module.
- name: Validate the recorded workspace target
  ansible.builtin.assert:
    that:
      - intent.runtime is defined
      - intent.runtime.project | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
      - intent.runtime.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
      - intent.snapshot_id | default('') is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
      - intent.branch | default('') | length > 0
      - workspace_phase in workspace_check_phases + workspace_base_phases + ['base-merge']
        or intent.head | default('') is match('^[0-9a-f]{40}([0-9a-f]{24})?$')
      - workspace_phase in ['preflight', 'before', 'after', 'receipt', 'export', 'discard', 'scan', 'base-merge']
        + workspace_check_phases + workspace_base_phases
      - workspace_phase not in ['check', 'commit'] or intent.check | default(none) is mapping
      - workspace_phase != 'commit-ref' or intent.candidate_commit | default('') | length in [40, 64]
      # A publication's content check also takes the copy's .env, by its path under the fixed workspace root.
      - intent.worker_environment is not defined or (intent.environment_path | default('') is match('^[^/]')
        and '..' not in intent.environment_path.split('/'))
      # Its proposed pull request body: the task branch's own file, by the path the publish names.
      - intent.worker_proposed_body is not defined or intent.proposed_body_path | default('') is match('^\.git/orbit/proposed-pr-bodies/task-[1-9][0-9]*\.md$')
      # task:sync of a copy: one default branch, the Project's repository and two Node mirrors by their full paths.
      - workspace_phase not in ['base', 'base-merge'] or (intent.default_branch | default('') is match('^[A-Za-z0-9][A-Za-z0-9._/-]*$')
        and '..' not in intent.default_branch and not intent.default_branch.endswith(('/', '.lock')))
      - workspace_phase != 'base' or intent.repository | default('') is match('^https://[^\\s]+$')
      # The default's mirror makes a missing one of the copy; empty when the default is gone, and then only a present mirror works.
      - workspace_phase != 'base' or (intent.mirror | default('') is match('^/[^ ]+/[1-9][0-9]*[.]git$')
        and intent.source_mirror | default('') is match('^(/[^ ]+/[1-9][0-9]*[.]git)?$')
        and '..' not in (intent.mirror ~ '/' ~ intent.source_mirror | default('')).split('/'))
      - intent.start is not defined or intent.start is match('^[0-9a-f]{40}([0-9a-f]{24})?$')
      # The content read of a copy's base: the commits the group's publishes pushed, and its latest approved commit.
      - intent.published | default([]) | reject('match', '^[0-9a-f]{40}([0-9a-f]{24})?$') | list | length == 0
      - intent.approved | default('') is match('^([0-9a-f]{40}([0-9a-f]{24})?)?$')
      # The copy's scratch is named by its Instance, so the next sync of the copy finds what a cancelled one left.
      - workspace_phase not in workspace_base_phases or (intent.instance_id | default(0) is integer and intent.instance_id | default(0) > 0)
      # The copy check of a publication reads the range from the copy's recorded start.
      - workspace_phase != 'scan' or intent.start | default('') is match('^[0-9a-f]{40}([0-9a-f]{24})?$')
      # The handoff check of a copy merges the default head it brought in; uncommitted work goes first, with the check's message.
      - workspace_phase != 'base-merge' or intent.message | default(none) is string
    fail_msg: tasks.workspace_target_invalid
  vars:
    workspace_check_phases: [check, commit, commit-ref]
    workspace_base_phases: [base, base-cleanup]

- name: Name the guest boundary
  ansible.builtin.set_fact:
    workspace_base_phases: [base, base-cleanup]
    # Root in the copy, for the bundle folder that agent may read and never change.
    base_root_exec: "{{ ['incus', '--project', intent.runtime.project, 'exec', '--disable-stdin', intent.runtime.name, '--'] }}"
    workspace_exec: >-
      {{ ['incus', '--project', intent.runtime.project, 'exec', '--disable-stdin', '--cwd', '/srv/workspace',
          intent.runtime.name, '--', '/usr/sbin/runuser', '-u', 'agent', '--', '/usr/bin/env', '-i', 'HOME=/home/agent',
          'PATH=/usr/local/bin:/usr/bin:/bin', '/usr/bin/python3', '-I', '-c'] }}
    workspace_guest_program: |
      # The gap: Git has no module for temporary-index evidence or bound receipts.
      # This program is visible in the Ansible phase and runs only as agent, never on the Node.
      import hashlib
      import json
      import math
      import shutil
      import os
      import stat
      import subprocess
      import sys
      import tempfile
      from pathlib import Path

      os.umask(0o077)
      request = json.loads(sys.argv[2])
      phase = sys.argv[1]
      root = Path.cwd()
      scratch = Path('/tmp/orbit-task-workspace-' + request['snapshot_id'])
      env = {'HOME': '/home/agent', 'PATH': '/usr/local/bin:/usr/bin:/bin',
             'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_CONFIG_NOSYSTEM': '1', 'GIT_TERMINAL_PROMPT': '0'}
      git_argv = ['/usr/bin/git', '--literal-pathspecs', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false',
                  '-c', 'core.untrackedCache=false', '-c', 'core.quotePath=false', '-c', 'safe.directory=' + str(root)]


      def refuse(code):
          raise ValueError('tasks.workspace_' + code)


      def git(*args, index=None, data=None):
          local_env = {**env, **({'GIT_INDEX_FILE': str(index)} if index else {})}
          return subprocess.run(git_argv + list(args), input=data, capture_output=True,
                                env=local_env, check=True, timeout=60).stdout


      def text(*args):
          return git(*args).decode().strip()


      def digest(value):
          return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()


      def read(name):
          with (scratch / name).open() as stream:
              return json.load(stream)


      def write(name, value):
          # Immutable evidence: never recapture a snapshot after a replay or replace the original.
          with (scratch / name).open('x') as stream:
              json.dump(value, stream, sort_keys=True)


      def capture():
          descriptor, path = tempfile.mkstemp(prefix='index-', dir=scratch)
          os.close(descriptor)
          index = Path(path)
          try:
              index.unlink()
              real_index = Path(text('rev-parse', '--git-path', 'index'))
              raw = real_index.read_bytes() if real_index.exists() else b''
              if raw:
                  index.write_bytes(raw)
              else:
                  git('read-tree', '--empty', index=index)
              index_tree = git('write-tree', index=index).decode().strip()
              # Seed from the real index so force-added ignored paths remain tracked.
              git('add', '--all', '--', '.', index=index)
              tree = git('write-tree', index=index).decode().strip()
              return {'head': text('rev-parse', 'HEAD'), 'tree': tree, 'index_tree': index_tree,
                      'index_sha256': hashlib.sha256(raw).hexdigest()}
          finally:
              index.unlink(missing_ok=True)
              Path(str(index) + '.lock').unlink(missing_ok=True)


      def check_env(check):
          # The task check variables of every Project command, with the agent's own HOME and login shell.
          values = {'HOME': '/home/agent', 'USER': 'agent', 'LOGNAME': 'agent', 'PATH': env['PATH'],
                    'COMPOSER_NO_INTERACTION': '1', 'ORBIT_CHECK_PROCESSES': '1',
                    'COMPOSER_CACHE_DIR': '/home/agent/.cache/composer', 'ORBIT_SEED_PATH': '', 'ORBIT_SEED_COMMIT': ''}
          if check['ssr_port'] is not None:
              values.update({'INERTIA_SSR_PORT': str(check['ssr_port']),
                             'INERTIA_SSR_URL': 'http://127.0.0.1:' + str(check['ssr_port'])})
          return values


      def within(base, directory):
          return base if directory in ['', '.'] else base / directory


      def discard(path):
          # A receipt path holds a file, a link or, by mistake, a folder: each goes, and none fails the check.
          if path.is_dir() and not path.is_symlink():
              shutil.rmtree(path, ignore_errors=True)
          else:
              path.unlink(missing_ok=True)


      def receipt_parts(path):
          # The part table of the receipt at PATH: a non-empty list of parts with a name, a known result and finite seconds,
          # field by field; None for anything else. No other field of the file leaves the guest.
          try:
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 65536:
                  return None
              parts = json.loads(path.read_text())['parts']
              table = [{'name': part['name'], 'result': part['result'], 'seconds': part['seconds']} for part in parts]
          except (OSError, ValueError, KeyError, TypeError):
              return None
          valid = isinstance(parts, list) and table and all(
              isinstance(part['name'], str) and 0 < len(part['name']) <= 200
              and part['result'] in ('passed', 'FAILED', 'skipped', 'not selected')
              and isinstance(part['seconds'], (int, float)) and not isinstance(part['seconds'], bool)
              and math.isfinite(part['seconds']) and part['seconds'] >= 0 for part in table)
          return table if valid else None


      def check_phase(check):
          import shutil
          if scratch.exists():
              # A resumed check starts again; this directory holds only this admitted check's scratch.
              shutil.rmtree(scratch)
          scratch.mkdir(mode=0o700)
          outputs = scratch / 'output'
          outputs.mkdir(mode=0o700)
          steps, names = {}, []
          command_env = check_env(check)

          def record(name, code, stdout=None):
              steps[name] = {'outputs': {'exitCode': code, **({} if stdout is None else {'stdout': stdout})}}

          def captured(name, directory, source, limit):
              # Output goes to a private guest file, never to Ansible or native history.
              names.append(name)
              with (outputs / name).open('xb') as stream:
                  process = subprocess.Popen(['/bin/bash', '-lc', source], cwd=directory, env=command_env,
                                             stdin=subprocess.DEVNULL, stdout=stream, stderr=subprocess.STDOUT,
                                             start_new_session=True)
                  try:
                      code = process.wait(timeout=limit)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, 9)
                      process.wait()
                      refuse('phase_failed')
              record(name, code)
              return code

          def tool(argv, directory, limit=600, ok=False):
              done = subprocess.run(argv, cwd=directory, env=env, stdin=subprocess.DEVNULL, capture_output=True,
                                    timeout=limit, check=False)
              if not ok and done.returncode != 0:
                  refuse('phase_failed')
              return done.returncode

          def dependencies(tree, directory):
              # Installed links define the local-package closure. Keep package source from the base archive, not HEAD.
              pending, copied, links = [within(root, directory)], set(), {}
              visited = set()
              while pending:
                  project = pending.pop()
                  if project in visited or any(parent in copied for parent in [project, *project.parents]):
                      continue
                  visited.add(project)
                  installations = []
                  # Linked ignored payloads are installed artifacts, not candidate package source.
                  # check-ignore takes literal filenames itself and rejects Git's global literal-pathspecs flag.
                  ignored = tool(git_argv + ['--no-literal-pathspecs', 'check-ignore', '--quiet', '--',
                                            str(project.relative_to(root))], root, ok=True)
                  if ignored not in [0, 1]:
                      refuse('phase_failed')
                  if ignored == 0:
                      installations.append(project)
                  for parent in [project, *project.parents]:
                      if not parent.is_relative_to(root):
                          break
                      for name in ['vendor', 'node_modules']:
                          dependency = parent / name
                          if dependency.is_dir():
                              installations.append(dependency)
                  for dependency in installations:
                      if dependency in copied:
                          continue
                      if not dependency.resolve().is_relative_to(root):
                          refuse('phase_failed')
                      copied.add(dependency)
                      # A dependency root may itself be a link to a checkout-local installation cache.
                      if dependency.is_symlink():
                          copied.add(dependency.resolve())
                      for folder, directories, files in os.walk(dependency.resolve()):
                          for entry in directories + files:
                              link = Path(folder) / entry
                              if not link.is_symlink():
                                  continue
                              target = link.resolve()
                              if not target.is_relative_to(root):
                                  refuse('phase_failed')
                              links[link.relative_to(root)] = target.relative_to(root)
                              pending.append(target)
                      if dependency.is_symlink():
                          links[dependency.relative_to(root)] = dependency.resolve().relative_to(root)
              if copied:
                  paths = sorted(str(path.relative_to(root)) for path in copied
                                 if not any(parent in copied for parent in path.parents))
                  tool(['cp', '-a', '--reflink=auto', '--parents', '-t', str(tree), '--', *paths], root)
              for link, target in links.items():
                  destination = tree / link
                  destination.unlink()
                  destination.symlink_to(os.path.relpath(tree / target, destination.parent))

          record('original', 0, text('rev-parse', 'HEAD') + '\n')
          base = check['base']
          if base != '' and request.get('default_commit', ''):
              # HEAD holds the default head after the base-merge, whether this check merged it or it was there already: the start
              # with that head merged in is the base, so the default branch's changes are never the subtask's work. A conflict of
              # the two keeps Git's tree, with its markers.
              merged = subprocess.run(git_argv + ['merge-tree', '--write-tree', '--no-messages', base, request['default_commit']],
                                      capture_output=True, env=env, check=False, timeout=600)
              if merged.returncode not in [0, 1]:
                  refuse('phase_failed')
              base = merged.stdout.decode().splitlines()[0].strip()
          # The work as the implementer handed it off, before any command runs: without a base-merge, the tree its delivery
          # receipt must name.
          record('handed-tree', 0, capture()['tree'] + '\n')
          setup_passed = True
          for index, step in enumerate(check['setup']):
              if captured(f'setup-{index}', root, step['command'], step['timeout_seconds']) != 0:
                  setup_passed = False
                  break
          # The delivery receipt that the Project check writes (docs/reference/tasks.md#handoffs): only this run's counts. The check
          # keeps only its validated part table, and removes every receipt, also one a deliverable wrote, so no turn hands it off.
          receipt = Path(text('rev-parse', '--path-format=absolute', '--git-path', 'orbit-handoff/delivery.json'))
          discard(receipt)
          project = 0
          if setup_passed and check['command'] is not None:
              project = captured('project', root, check['command'], 3600)
          parts = receipt_parts(receipt)
          if parts is not None:
              record('parts', 0, json.dumps(parts))
          discard(receipt)
          before = capture()
          record('snapshot-before-head', 0, before['head'] + '\n')
          record('snapshot-before-tree', 0, before['tree'] + '\n')
          if base != '':
              record('diff', 0, git('diff-tree', '-r', '--no-renames', '--name-status', '-z', base,
                                    before['tree']).decode(errors='replace'))
          runnable = setup_passed and project == 0
          commands = [item for item in check['deliverables'] if item['type'] == 'command']
          for index, item in enumerate(commands):
              directory = item.get('directory', '.')
              if runnable and item.get('fails_on_base', False):
                  source = scratch / 'base'
                  if not source.exists():
                      archive = scratch / 'base.tar'
                      git('archive', '--format=tar', '--prefix=base/', '--output=' + str(archive), base)
                      tool(['tar', '-x', '-f', str(archive), '-C', str(scratch)], root)
                      archive.unlink()
                  tree = scratch / f'base-{index}'
                  tool(['cp', '-a', '--reflink=auto', '--', str(source), str(tree)], root)
                  dependencies(tree, directory)
                  paths = item.get('paths', [])
                  overlay = tool(['cp', '-p', '--parents', '-t', str(tree), '--', *paths], root, ok=True) if paths else 0
                  record(f'base_overlay-{index}', overlay)
                  if overlay == 0:
                      present = 0 if within(tree, directory).is_dir() else 1
                      record(f'base_directory-{index}', present)
                      if present == 0:
                          captured(f'base-{index}', within(tree, directory), item['command'], 600)
                  shutil.rmtree(tree)
              if runnable:
                  captured(f'deliverable-{index}', within(root, directory), item['command'], 3600)
          discard(receipt)
          after = capture()
          record('snapshot-after-head', 0, after['head'] + '\n')
          record('snapshot-after-tree', 0, after['tree'] + '\n')
          record('changed', 0, git('diff-tree', '-r', '--no-renames', '--name-status', '-z', before['tree'],
                                   after['tree']).decode(errors='replace'))
          for path in scratch.iterdir():
              if path != outputs:
                  shutil.rmtree(path) if path.is_dir() and not path.is_symlink() else path.unlink()
          return {'check': {'steps': steps}, 'outputs': names, 'changed': False}


      def commit_phase(check):
          identity = {'GIT_AUTHOR_NAME': 'Orbit', 'GIT_AUTHOR_EMAIL': 'orbit@users.noreply.github.com',
                      'GIT_COMMITTER_NAME': 'Orbit', 'GIT_COMMITTER_EMAIL': 'orbit@users.noreply.github.com'}
          git('add', '--all')
          # A clean tree whose HEAD an earlier check already recorded makes no commit: its candidate is that HEAD, and an
          # empty commit on it would be unpublished work. Any other tree gets a fresh commit with the Gateway's cleaned
          # message, so a candidate never carries the implementer's message.
          clean = subprocess.run(git_argv + ['diff', '--cached', '--quiet', 'HEAD'], capture_output=True, env=env,
                                 check=False, timeout=60).returncode == 0
          committed = not (clean and text('for-each-ref', '--points-at', 'HEAD', 'refs/orbit/check-operations/'))
          if committed:
              subprocess.run(git_argv + ['-c', 'commit.gpgSign=false', 'commit', '--allow-empty', '--allow-empty-message',
                                         '--cleanup=verbatim', '--quiet', '--file=-'], input=check['message'].encode(),
                             capture_output=True, env={**env, **identity}, check=True, timeout=60)
          read = subprocess.run(git_argv + ['rev-parse', 'HEAD', 'HEAD^{tree}'] + (['HEAD^'] if committed else []),
                                capture_output=True, env=env, check=False, timeout=60)
          return {'commit_read': {'exitCode': read.returncode, 'stdout': read.stdout.decode(errors='replace')},
                  'changed': committed}


      def candidate_matches(before):
          if request.get('candidate') != {'head': before['head'], 'tree': before['tree']}:
              refuse('snapshot_mismatch')


      def base_phase(head):
          # Only refs/remotes/origin/<default> moves: HEAD, the tree, the index and the local branches stay as they are.
          ref = 'refs/remotes/origin/' + request['default_branch']
          if phase == 'base-read':
              origin = subprocess.run(git_argv + ['rev-parse', '--verify', '--quiet', ref + '^{commit}'], capture_output=True,
                                      env=env, check=False, timeout=60).stdout.decode().strip()
              return {'branch_commit': head, 'origin': origin, 'gid': os.getgid(), 'changed': False}
          target, before = request['base_head'], text('for-each-ref', '--format=%(objectname)', ref)
          if request['bundled']:
              # The bundle the Node pushed in, in a folder root made and owns; agent only reads it.
              bundle = Path(request['base_guest']) / 'base.bundle'
              git('bundle', 'verify', '--quiet', str(bundle))
              git('-c', 'gc.auto=0', '-c', 'maintenance.auto=false', 'fetch', '--quiet', '--no-tags', '--no-write-fetch-head',
                  str(bundle), '+refs/heads/' + request['default_branch'] + ':' + ref)
          else:
              # The copy holds the head already: point the ref at it.
              git('cat-file', '-e', target + '^{commit}')
              git('update-ref', ref, target)
          if text('rev-parse', ref) != target:
              refuse('phase_failed')
          start = request.get('start')
          if start is not None:
              git('cat-file', '-e', start + '^{commit}')
          return {'default_branch': request['default_branch'], 'default_commit': target, 'branch': request['branch'],
                  'branch_commit': head, 'behind_by': int(text('rev-list', '--count', head + '..' + ref)), 'start': start,
                  'bundled': request['bundled'], 'changed': before != target}


      def work_phase(head):
          # The one content rule (docs/reference/tasks.md#published-work-of-a-copy), on the default head the base just brought in:
          # every path HEAD changed since its merge base with it must hold the same content on it, or in a commit a publish pushed.
          # Trees are compared, never commit ids, so a squash merge, a hand-carry or an empty commit adds nothing.
          default = text('rev-parse', '--verify', 'refs/remotes/origin/' + request['default_branch'] + '^{commit}')

          def paths(source):
              return set(git('diff-tree', '-r', '--no-renames', '--name-only', '-z', source, head).split(b'\0')) - {b''}

          changed = paths(text('merge-base', head, default))
          differ = changed & paths(default)
          for commit in request.get('published', []):
              if differ and subprocess.run(git_argv + ['cat-file', '-e', commit + '^{commit}'], capture_output=True, env=env,
                                           check=False, timeout=60).returncode == 0:
                  differ &= paths(commit)
          # Uncommitted, untracked and stashed work is never published. No optional lock: the read writes no index.
          entries, modified, untracked = iter(git('--no-optional-locks', 'status', '--porcelain=v1', '-z', '--untracked-files=all')
                                              .split(b'\0')), 0, 0
          for entry in entries:
              if entry[:2] == b'??':
                  untracked += 1
              elif entry:
                  modified += 1
                  if entry[:1] in b'RC':
                      next(entries, None)
          stashes = len(text('reflog', 'show', '--format=%H', 'refs/stash').split()) if text(
              'for-each-ref', '--format=%(refname)', 'refs/stash') else 0
          approved = request.get('approved') or None
          held = None if approved is None else subprocess.run(git_argv + ['merge-base', '--is-ancestor', approved, head],
                                                               capture_output=True, env=env, check=False, timeout=60).returncode == 0
          names = sorted(name.decode(errors='replace') for name in differ)[:5]
          return {'state': 'dirty' if differ or modified or untracked or stashes else 'clean', 'head': head, 'default_commit': default,
                  'empty': not changed, 'paths': {'count': len(differ), 'names': names}, 'uncommitted': modified,
                  'untracked': untracked, 'stashes': stashes, 'approved_held': held}


      def merge_phase(head):
          # The handoff check of a copy judges the tree that publish pushes: the default head it brought in, merged when clean.
          ref = 'refs/remotes/origin/' + request['default_branch']
          target = text('rev-parse', '--verify', ref + '^{commit}')
          held = subprocess.run(git_argv + ['merge-base', '--is-ancestor', target, head], capture_output=True, env=env,
                                check=False, timeout=60).returncode == 0
          identity = {**env, 'GIT_AUTHOR_NAME': 'Orbit', 'GIT_AUTHOR_EMAIL': 'orbit@users.noreply.github.com',
                      'GIT_COMMITTER_NAME': 'Orbit', 'GIT_COMMITTER_EMAIL': 'orbit@users.noreply.github.com'}
          # The work as it stands, uncommitted files too, as a commit object that no ref names yet: a conflict leaves the
          # workspace exactly as it was.
          with tempfile.TemporaryDirectory(prefix='orbit-merge-') as folder:
              index = Path(folder) / 'index'
              real_index = Path(text('rev-parse', '--git-path', 'index'))
              if real_index.exists():
                  index.write_bytes(real_index.read_bytes())
              else:
                  git('read-tree', '--empty', index=index)
              git('add', '--all', '--', '.', index=index)
              tree = git('write-tree', index=index).decode().strip()
              # The work as the implementer handed it off, uncommitted work included: the tree its delivery receipt must name
              # (docs/reference/tasks.md#handoffs).
              if held:
                  return {'handed_tree': tree, 'default_commit': target, 'merged_default': None, 'changed': False}
              work = head
              if tree != text('rev-parse', 'HEAD^{tree}'):
                  work = subprocess.run(git_argv + ['commit-tree', tree, '-p', head], input=request['message'].encode(),
                                        capture_output=True, env=identity, check=True, timeout=60).stdout.decode().strip()
              merged = subprocess.run(git_argv + ['merge-tree', '--write-tree', '--name-only', '--no-messages', '-z', work, target],
                                      capture_output=True, env=env, check=False, timeout=600)
              if merged.returncode == 1:
                  # The same bounds as a conflict at publish: at most 100 paths whose quoted list fits 3,000 bytes.
                  names = list(dict.fromkeys(name for name in merged.stdout.decode(errors='replace').split('\0')[1:] if name))
                  shown, used = [], 2
                  for name in names:
                      size = len(json.dumps(name).encode()) + (0 if not shown else 2)
                      if len(shown) == 100 or used + size > 3000:
                          break
                      shown.append(name)
                      used += size
                  return {'error_code': 'tasks.check_conflict', 'handed_tree': tree, 'default_commit': target, 'conflicting_paths': shown,
                          'conflicting_more': len(names) - len(shown), 'changed': False}
              if merged.returncode != 0:
                  refuse('phase_failed')
              merged_tree = merged.stdout.decode().split('\0')[0].strip()
              message = 'Merge ' + request['default_branch'] + ' ' + target + ' before the check'
              commit = subprocess.run(git_argv + ['commit-tree', merged_tree, '-p', work, '-p', target], input=message.encode(),
                                      capture_output=True, env=identity, check=True, timeout=60).stdout.decode().strip()
              # A path the merge adds where an untracked or ignored file lies refuses: Git's read-tree would overwrite it.
              added = git('diff-tree', '-r', '--no-renames', '--name-only', '-z', '--diff-filter=A', work, commit).decode()
              if any(os.path.lexists(root / name) for name in added.split('\0') if name):
                  refuse('phase_failed')
              # One update of the working tree, on the private index, which checks every path before it writes one; then the
              # real index and the branch, so a refusal leaves the workspace as it was.
              if subprocess.run(git_argv + ['read-tree', '-m', '-u', work, commit], capture_output=True,
                                env={**env, 'GIT_INDEX_FILE': str(index)}, check=False, timeout=600).returncode != 0:
                  refuse('phase_failed')
              # Then the index, which already matches the merge, and last the branch.
              staged = real_index.with_name('index.orbit-merge')
              staged.write_bytes(index.read_bytes())
              os.replace(staged, real_index)
          git('update-ref', 'HEAD', commit, head)
          return {'handed_tree': tree, 'default_commit': target, 'merged_default': target, 'commit': commit, 'changed': True}


      def main():
          if phase == 'check-cleanup':
              import shutil
              shutil.rmtree(scratch, ignore_errors=True)
              return {'changed': False}
          git_dir = Path(text('rev-parse', '--absolute-git-dir'))
          if Path(text('rev-parse', '--show-toplevel')).resolve() != root.resolve():
              refuse('identity_changed')
          root_stat, git_stat = root.stat(), git_dir.stat()
          identity = {'root_device': root_stat.st_dev, 'root_inode': root_stat.st_ino,
                      'git_device': git_stat.st_dev, 'git_inode': git_stat.st_ino,
                      'branch': text('symbolic-ref', '--quiet', '--short', 'HEAD')}
          if identity['branch'] != request['branch']:
              refuse('identity_changed')
          head = text('rev-parse', 'HEAD')
          if phase in ['base-read', 'base-import']:
              return base_phase(head)
          if phase == 'base-work':
              return work_phase(head)
          if phase == 'base-merge':
              return merge_phase(head)
          # Check phases are bound by the fixed root and recorded branch; the admitted checkout_path is never used.
          if phase == 'check':
              return check_phase(request['check'])
          if phase == 'commit':
              return commit_phase(request['check'])
          if phase == 'commit-ref':
              ref = 'refs/orbit/check-operations/' + str(int(request['operation_id']))
              git('update-ref', ref, request['candidate_commit'])
              return {'ref': ref, 'commit': text('rev-parse', ref), 'changed': True}
          if phase == 'preflight':
              if head != request['head']:
                  refuse('identity_changed')
              return {'checkout_fingerprint': identity, 'head': head, 'branch': identity['branch'], 'changed': False}
          if request.get('checkout_fingerprint') != identity:
              refuse('identity_changed')
          binding = {'runtime': request['runtime'], 'snapshot_id': request['snapshot_id'], 'checkout_fingerprint': identity}
          if scratch.exists():
              if read('binding.json') != binding:
                  refuse('snapshot_mismatch')
          elif phase not in ['discard', 'export-cleanup']:
              scratch.mkdir(mode=0o700)
              write('binding.json', binding)
          if phase == 'discard':
              if scratch.exists():
                  # This directory contains only our own scratch, never the checkout or a user-selected path.
                  import shutil
                  shutil.rmtree(scratch)
              return {'discarded': True, 'changed': False}
          if phase in ['export', 'export-cleanup']:
              bundle = scratch / 'export.bundle'
              if phase == 'export-cleanup':
                  bundle.unlink(missing_ok=True)
                  return {'changed': False}
              bundle.unlink(missing_ok=True)
              candidate = request.get('candidate', {})
              if candidate != {'head': head, 'tree': text('rev-parse', 'HEAD^{tree}')}:
                  refuse('snapshot_mismatch')
              try:
                  git('bundle', 'create', str(bundle), 'refs/heads/' + request['branch'])
                  git('bundle', 'verify', str(bundle))
                  expected = (candidate['head'] + ' refs/heads/' + request['branch'] + '\n').encode()
                  if git('bundle', 'list-heads', str(bundle)) != expected:
                      refuse('snapshot_mismatch')
                  with bundle.open('rb') as stream:
                      checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              except (OSError, ValueError, subprocess.SubprocessError):
                  bundle.unlink(missing_ok=True)
                  raise
              return {'head': head, 'tree': candidate['tree'], 'guest_bundle': str(bundle), 'sha256': checksum, 'changed': False}
          if phase == 'before':
              if head != request['head']:
                  refuse('identity_changed')
              if not (scratch / 'before.json').exists():
                  write('before.json', {**binding, **capture()})
              original = read('before.json')
              if any(original.get(key) != value for key, value in binding.items()):
                  refuse('snapshot_mismatch')
              return {**original, 'digest': digest(original), 'changed': False}
          before = read('before.json')
          if any(before.get(key) != value for key, value in binding.items()) or request.get('before_digest') != digest(before):
              refuse('snapshot_mismatch')
          if phase == 'after':
              if not (scratch / 'after.json').exists():
                  write('after.json', {**binding, 'before_digest': digest(before), **capture()})
              after = read('after.json')
              if any(after.get(key) != value for key, value in binding.items()) or after['before_digest'] != digest(before):
                  refuse('snapshot_mismatch')
              return {**after, 'digest': digest(after), 'changed': False}
          candidate_matches(before)
          if phase == 'receipt':
              try:
                  descriptor = os.open(scratch / 'receipt.json', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, 'rb') as stream:
                      if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                          refuse('receipt_invalid')
                      raw = stream.read(65537)
                  if len(raw) > 65536:
                      refuse('receipt_invalid')
                  envelope = json.loads(raw.decode('utf-8'))
                  if (envelope['snapshot_id'] != request['snapshot_id'] or envelope['candidate'] != request['candidate']
                          or not isinstance(envelope['receipt'], dict)):
                      refuse('receipt_invalid')
                  return {'receipt': envelope['receipt'], 'bytes': len(raw), 'changed': False}
              except (OSError, ValueError, KeyError, TypeError):
                  refuse('receipt_invalid')


      try:
          print(json.dumps(main()))
      except (OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError) as error:
          code = str(error)
          print(json.dumps({'error_code': code if code.startswith('tasks.workspace_') and '\n' not in code
                            else 'tasks.workspace_phase_failed'}))
          sys.exit(1)

- name: Run the workspace phase as agent
  when: workspace_phase not in workspace_base_phases + ['scan']
  ansible.builtin.command:
    argv: "{{ workspace_exec + [workspace_guest_program, workspace_phase, intent | to_json] }}"
    expand_argument_vars: false
    stdin: ''
    stdin_add_newline: false
  register: workspace_guest
  changed_when: (workspace_guest.stdout | from_json).changed | default(false)
  failed_when: false
  no_log: true

- name: Remove the failed check scratch as agent
  when: workspace_phase == 'check' and workspace_guest.rc != 0
  ansible.builtin.command:
    argv: "{{ workspace_exec + [workspace_guest_program, 'check-cleanup', intent | to_json] }}"
    expand_argument_vars: false
    stdin: ''
    stdin_add_newline: false
  changed_when: false
  failed_when: false
  no_log: true

- name: Check the workspace phase
  when: workspace_phase not in workspace_base_phases + ['scan']
  ansible.builtin.assert:
    that: workspace_guest.rc == 0
    fail_msg: "{{ (workspace_guest.stdout | from_json).error_code | default('tasks.workspace_phase_failed') }}"

- name: Keep the workspace evidence
  when: workspace_phase not in workspace_base_phases + ['scan']
  ansible.builtin.set_fact:
    workspace_result: "{{ workspace_guest.stdout | from_json }}"
  no_log: true

- name: Export only the verified branch bundle
  when: workspace_phase == 'export'
  block:
    - name: Create Node-controlled export scratch
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: orbit-task-export-
      register: workspace_export
      changed_when: false
    - name: Copy the agent's bundle to the Node
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull,
               "{{ intent.runtime.name }}{{ workspace_result.guest_bundle }}", "{{ workspace_export.path }}/branch.bundle"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: false
    - name: Check the transferred bytes on the Node
      ansible.builtin.stat:
        path: "{{ workspace_export.path }}/branch.bundle"
        checksum_algorithm: sha256
      register: workspace_bundle_stat
    - name: Verify the transferred bundle checksum
      ansible.builtin.assert:
        that: workspace_bundle_stat.stat.checksum == workspace_result.sha256
        fail_msg: tasks.workspace_phase_failed
    # The publish checks the candidate against the copy's .env on the worker. Its bytes never enter a result or a log.
    - name: Copy the copy's .env to the Node
      when: intent.worker_environment is defined
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull,
               "{{ intent.runtime.name }}/srv/workspace/{{ intent.environment_path }}", "{{ workspace_export.path }}/environment"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: false
    - name: Read the copied .env on the Node
      when: intent.worker_environment is defined
      ansible.builtin.stat:
        path: "{{ workspace_export.path }}/environment"
        follow: false
        get_checksum: false
      register: workspace_environment_stat
    - name: Require a regular .env file
      when: intent.worker_environment is defined
      ansible.builtin.assert:
        that: workspace_environment_stat.stat.isreg | default(false)
        fail_msg: tasks.publish_secret_unchecked
    - name: Fetch the .env to the worker
      when: intent.worker_environment is defined
      ansible.builtin.fetch:
        src: "{{ workspace_export.path }}/environment"
        dest: "{{ intent.worker_environment }}"
        flat: true
        fail_on_missing: true
        validate_checksum: true
      changed_when: false
      no_log: true
    # The copy's proposed pull request body for the task branch is data: the publish appends its waiver lines to the body, and the
    # .env content check reads the result. A copy without the file, or with no regular file there, publishes the caller's body.
    - name: Copy the proposed body to the Node
      when: intent.worker_proposed_body is defined
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull,
               "{{ intent.runtime.name }}/srv/workspace/{{ intent.proposed_body_path }}", "{{ workspace_export.path }}/proposed-body"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: workspace_proposed_pull
      failed_when: false
      changed_when: false
    - name: Read the copied proposed body on the Node
      when: intent.worker_proposed_body is defined
      ansible.builtin.stat:
        path: "{{ workspace_export.path }}/proposed-body"
        follow: false
        get_checksum: false
      register: workspace_proposed_stat
    - name: Fetch the proposed body to the worker
      when: >-
        intent.worker_proposed_body is defined and workspace_proposed_pull.rc == 0
        and workspace_proposed_stat.stat.isreg | default(false) and workspace_proposed_stat.stat.size <= 65536
      ansible.builtin.fetch:
        src: "{{ workspace_export.path }}/proposed-body"
        dest: "{{ intent.worker_proposed_body }}"
        flat: true
        fail_on_missing: true
        validate_checksum: true
      changed_when: false
      no_log: true
    - name: Return the Node export path
      when: intent.worker_bundle is not defined
      ansible.builtin.set_fact:
        workspace_result: >-
          {{ workspace_result | combine({'node_scratch': workspace_export.path, 'bundle': workspace_export.path ~ '/branch.bundle'}) }}
    # A publication takes the bundle to the worker, which pushes it; the Node keeps nothing.
    - name: Fetch the bundle to the worker
      when: intent.worker_bundle is defined
      ansible.builtin.fetch:
        src: "{{ workspace_export.path }}/branch.bundle"
        dest: "{{ intent.worker_bundle }}"
        flat: true
        fail_on_missing: true
        validate_checksum: true
      changed_when: false
    - name: Remove the Node export after the fetch
      when: intent.worker_bundle is defined
      ansible.builtin.file: { path: "{{ workspace_export.path }}", state: absent }
      changed_when: false
    - name: Return the worker bundle path
      when: intent.worker_bundle is defined
      ansible.builtin.set_fact:
        workspace_result: "{{ workspace_result | combine({'bundle': intent.worker_bundle}) }}"
  rescue:
    - name: Remove the incomplete Node export
      when: workspace_export.path is defined
      ansible.builtin.file:
        path: "{{ workspace_export.path }}"
        state: absent
      changed_when: false
    - name: Refuse the incomplete export
      ansible.builtin.fail:
        msg: tasks.workspace_phase_failed
  always:
    - name: Remove only the guest export bundle as agent
      ansible.builtin.command:
        argv: "{{ workspace_exec + [workspace_guest_program, 'export-cleanup', intent | to_json] }}"
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: workspace_export_cleanup
      changed_when: false
      failed_when: false
      no_log: true
    - name: Remove the Node export when guest cleanup fails
      when:
        - workspace_export.path is defined
        - workspace_export_cleanup.rc | default(1) != 0
      ansible.builtin.file:
        path: "{{ workspace_export.path }}"
        state: absent
      changed_when: false
    - name: Require guest export cleanup before handing off Node scratch
      ansible.builtin.assert:
        that: workspace_export_cleanup.rc | default(1) == 0
        fail_msg: tasks.workspace_phase_failed

# task:sync of a copy: the copy's Node scratch holds the bundle, never a credential. The group lock lets one sync of a copy run at a
# time.
- name: Name the copy's base scratch by its Instance
  when: workspace_phase in workspace_base_phases
  ansible.builtin.import_tasks: task-copy-base-names.yml
  vars:
    task_base_instance: "{{ intent.instance_id }}"

# task:sync of a copy. Git runs on the Node, in the copy's own mirror. The read credential is a Git header that reaches the one fetch
# only through the stdin of a pipelined task, which Ansible keeps in memory: never argv, a file or a stored output, so a killed run
# leaves none behind. The copy receives only a bundle of what it lacks, in a folder root owns, and agent imports it into
# refs/remotes/origin/<default>.
- name: Bring the default branch into the copy
  when: workspace_phase == 'base'
  vars:
    base_bundle: "{{ base_node }}/base.bundle"
    base_ref: "refs/heads/{{ intent.default_branch | default('') }}"
    base_mirror_git: [/usr/bin/git, -c, core.hooksPath=/dev/null, -c, core.fsmonitor=false, -C, "{{ intent.mirror | default('') }}"]
    ansible_pipelining: true
    ansible_ssh_pipelining: true
  block:
    - name: Read the copy's refs as agent
      ansible.builtin.command:
        argv: "{{ workspace_exec + [workspace_guest_program, 'base-read', intent | to_json] }}"
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: base_read
      changed_when: false
      failed_when: false
      no_log: true
    - name: Check the copy's refs
      ansible.builtin.assert:
        that: base_read.rc == 0
        fail_msg: "{{ (base_read.stdout | from_json).error_code | default('tasks.workspace_phase_failed') }}"
    - name: Keep the copy's refs
      ansible.builtin.set_fact:
        base_copy: "{{ base_read.stdout | from_json }}"
    # What an earlier, cancelled sync of this copy left goes first; none of it holds a credential.
    - name: Remove the copy's earlier Node scratch
      ansible.builtin.file: { path: "{{ base_node }}", state: absent }
      changed_when: false
    - name: Make the copy's Node scratch
      ansible.builtin.file: { path: "{{ base_node }}", state: directory, mode: "0700" }
      changed_when: false
    - name: Read the copy's mirror
      ansible.builtin.stat: { path: "{{ intent.mirror }}/HEAD" }
      register: base_mirror
    # A copy made before its mirror existed starts it from the default's mirror, which holds the seed's commit.
    - name: Refuse a missing mirror without the default's
      ansible.builtin.assert:
        that: base_mirror.stat.exists or intent.source_mirror | default('') != ''
        fail_msg: tasks.workspace_phase_failed
    - name: Make the copy's mirror from the default's mirror
      when: not base_mirror.stat.exists
      ansible.builtin.command: { argv: "{{ item }}" }
      loop:
        - [/usr/bin/git, init, --quiet, --bare, "{{ intent.mirror }}"]
        - "{{ base_mirror_git + ['fetch', '--quiet', '--no-tags', '--', intent.source_mirror, '+refs/heads/*:refs/seed/*'] }}"
      changed_when: true
    # The block sets pipelining; the transport must be ssh, which pipelines, and no setting may keep the module files. Only the local
    # test harness sets task_base_local_transport, to run the same tasks without an SSH server.
    - name: Refuse a transfer that writes the module arguments on the Node
      ansible.builtin.assert:
        that:
          - not (lookup('ansible.builtin.config', 'DEFAULT_KEEP_REMOTE_FILES') | bool)
          - >-
            (ansible_connection | default(lookup('ansible.builtin.config', 'DEFAULT_TRANSPORT'))) in ['ssh', 'ansible.builtin.ssh']
            or (task_base_local_transport | default(false) | bool and ansible_connection | default('') == 'local')
        fail_msg: tasks.workspace_phase_failed
        quiet: true
    # The header, scoped to the Project's repository, is the environment of this one git command, as the publish's push sends it.
    - name: Fetch the default branch into the mirror
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - |
            IFS= read -r header || true
            export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.$2.extraheader" GIT_CONFIG_VALUE_0="$header"
            exec /usr/bin/timeout 300 /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$1" -c credential.helper= \
              -c protocol.allow=never -c protocol.https.allow=always -c http.followRedirects=false \
              fetch --quiet --no-tags -- "$2" "$3"
          - sh
          - "{{ intent.mirror }}"
          - "{{ intent.repository }}"
          - "+{{ base_ref }}:{{ base_ref }}"
        stdin: "{{ lookup('ansible.builtin.env', 'ORBIT_GIT_AUTHORIZATION') }}"
        stdin_add_newline: true
      no_log: true
      register: base_fetch
      failed_when: false
      changed_when: false
    - name: Check the fetch
      ansible.builtin.assert:
        that: base_fetch.rc == 0
        fail_msg: tasks.workspace_phase_failed
    - name: Read the default head in the mirror
      ansible.builtin.command: { argv: "{{ base_mirror_git + ['rev-parse', '--verify', base_ref ~ '^{commit}'] }}" }
      register: base_head
      changed_when: false
    - name: Read which of the copy's commits the mirror holds
      ansible.builtin.command: { argv: "{{ base_mirror_git + ['cat-file', '-e', item ~ '^{commit}'] }}" }
      loop: "{{ [base_copy.origin, base_copy.branch_commit] | select | unique | list }}"
      register: base_held
      changed_when: false
      failed_when: false
    - name: Name what the copy holds
      ansible.builtin.set_fact:
        base_prerequisites: "{{ base_held.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    - name: Count the commits the copy lacks
      ansible.builtin.command:
        argv: "{{ base_mirror_git + ['rev-list', '--count', base_head.stdout | trim] + (base_prerequisites | map('regex_replace', '^', '^') | list) }}"
      register: base_new
      changed_when: false
    # A bundle cannot be empty: when the copy holds the head, the import only points the ref at it.
    - name: Bundle only what the copy lacks
      when: base_new.stdout | int > 0
      ansible.builtin.command:
        argv: "{{ base_mirror_git + ['bundle', 'create', '--quiet', base_bundle, base_ref] + (base_prerequisites | map('regex_replace', '^', '^') | list) }}"
      changed_when: true
    # Root makes the folder fresh and owns it and the bundle: agent reads the bundle and cannot swap it for a link.
    - name: Make the copy's bundle folder as root
      when: base_new.stdout | int > 0
      ansible.builtin.command: { argv: "{{ base_root_exec + item }}", stdin: '', stdin_add_newline: false }
      loop:
        - [/bin/rm, -rf, --, "{{ base_guest }}"]
        - [/bin/mkdir, -m, '0755', --, "{{ base_guest }}"]
      changed_when: true
    - name: Push the bundle into the copy for agent to read
      when: base_new.stdout | int > 0
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, push, --uid, '0', --gid, "{{ base_copy.gid }}",
               --mode, "0640", "{{ base_bundle }}", "{{ intent.runtime.name }}{{ base_guest }}/base.bundle"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: true
    - name: Import the default branch as agent
      ansible.builtin.command:
        argv: >-
          {{ workspace_exec + [workspace_guest_program, 'base-import',
             intent | combine({'base_head': base_head.stdout | trim, 'bundled': base_new.stdout | int > 0, 'base_guest': base_guest}) | to_json] }}
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: base_import
      changed_when: (base_import.stdout | from_json).changed | default(false)
      failed_when: false
      no_log: true
    - name: Check the import
      ansible.builtin.assert:
        that: base_import.rc == 0
        fail_msg: "{{ (base_import.stdout | from_json).error_code | default('tasks.workspace_phase_failed') }}"
    # The content read decides whether the copy's work is published; task:cancel and task:complete read it from this result.
    - name: Read the copy's work as agent
      ansible.builtin.command:
        argv: "{{ workspace_exec + [workspace_guest_program, 'base-work', intent | to_json] }}"
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: base_work
      changed_when: false
      failed_when: false
      no_log: true
    - name: Check the work read
      ansible.builtin.assert:
        that: base_work.rc == 0
        fail_msg: "{{ (base_work.stdout | from_json).error_code | default('tasks.workspace_phase_failed') }}"
    - name: Keep the base
      ansible.builtin.set_fact:
        workspace_result: "{{ base_import.stdout | from_json | combine({'work': base_work.stdout | from_json}) }}"
  always:
    - name: Remove the copy's Node scratch
      ansible.builtin.file: { path: "{{ base_node }}", state: absent }
      changed_when: false
    - name: Remove the bundle folder in the copy as root
      ansible.builtin.command: { argv: "{{ base_root_exec + ['/bin/rm', '-rf', '--', base_guest] }}", stdin: '', stdin_add_newline: false }
      register: base_guest_cleanup
      changed_when: false
      failed_when: false
    - name: Require the copy's cleanup
      ansible.builtin.assert:
        that: base_guest_cleanup.rc | default(1) == 0
        fail_msg: tasks.workspace_phase_failed

# A cancelled sync stops before the base phase's `always`, and may skip its cleanup job: this phase, the next base of the copy and
# the copy's destroy remove what it left. None of it holds a credential.
- name: Remove what a base phase left
  when: workspace_phase == 'base-cleanup'
  block:
    - name: Remove the copy's Node scratch
      ansible.builtin.file: { path: "{{ base_node }}", state: absent }
      changed_when: false
    - name: Remove the bundle folder in the copy as root
      ansible.builtin.command: { argv: "{{ base_root_exec + ['/bin/rm', '-rf', '--', base_guest] }}", stdin: '', stdin_add_newline: false }
      register: base_cleanup
      changed_when: false
      failed_when: false
    - name: Require the copy's cleanup
      ansible.builtin.assert:
        that: base_cleanup.rc | default(1) == 0
        fail_msg: tasks.workspace_phase_failed
    - name: Keep the cleanup result
      ansible.builtin.set_fact:
        workspace_result: {cleaned: true, changed: false}

- name: Collect the check output in the private run folder
  when: workspace_phase == 'check'
  block:
    - name: Create Node-controlled output scratch
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: orbit-task-check-
      register: workspace_check_scratch
      changed_when: false
    - name: Copy the agent's output folder to the Node
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull, --recursive,
               "{{ intent.runtime.name }}/tmp/orbit-task-workspace-{{ intent.snapshot_id }}/output", "{{ workspace_check_scratch.path }}"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: false
    - name: Fetch each command output to the worker
      ansible.builtin.fetch:
        src: "{{ workspace_check_scratch.path }}/output/{{ item }}"
        dest: "{{ workspace_result_path | dirname }}/output/{{ item }}"
        flat: true
        fail_on_missing: true
      loop: "{{ workspace_result.outputs }}"
      changed_when: false
      no_log: true
    - name: Keep only exit codes and Git evidence
      ansible.builtin.set_fact:
        workspace_result: "{{ {'check': workspace_result.check, 'changed': false} }}"
      no_log: true
  rescue:
    - name: Refuse the incomplete check output
      ansible.builtin.fail:
        msg: tasks.workspace_phase_failed
  always:
    - name: Remove the Node output scratch
      when: workspace_check_scratch.path is defined
      ansible.builtin.file:
        path: "{{ workspace_check_scratch.path }}"
        state: absent
      changed_when: false
    - name: Remove the check scratch as agent
      ansible.builtin.command:
        argv: "{{ workspace_exec + [workspace_guest_program, 'check-cleanup', intent | to_json] }}"
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: workspace_check_cleanup
      changed_when: false
      failed_when: false
      no_log: true
    - name: Require guest check cleanup
      ansible.builtin.assert:
        that: workspace_check_cleanup.rc | default(1) == 0
        fail_msg: tasks.workspace_phase_failed

# The copy check of a publication (docs/reference/tasks.md#the-copy-check): root in the copy reads the copy's secrets and compares the
# range against them; Git runs as agent. The program prints one JSON line that names paths, lines and secret names, never a value, so
# the result is the evidence as it stands. Its own refusal is evidence too: the publish reads it and refuses before any token exists.
- name: Check the copy before its publication
  when: workspace_phase == 'scan'
  block:
    - name: Run the copy check as root
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '300', 'incus', '--project', intent.runtime.project, 'exec', '--disable-stdin', intent.runtime.name, '--',
              '/usr/bin/env', '-i', 'PATH=/usr/local/bin:/usr/bin:/bin', '/usr/bin/python3', '-I', '-c',
              lookup('ansible.builtin.file', playbook_dir ~ '/task_copy_scan.py'),
              {'head': intent.head, 'start': intent.start, 'branch': intent.branch, 'nested': intent.nested | default(false),
               'proposed_body_path': intent.proposed_body_path | default('')} | to_json] }}
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: workspace_scan
      changed_when: false
      failed_when: false
      no_log: true
    - name: Keep the copy check
      ansible.builtin.set_fact:
        workspace_result: >-
          {{ workspace_scan.stdout | from_json if workspace_scan.rc in [0, 1] else {'error_code': 'tasks.publish_secret_unchecked'} }}
      no_log: true

- name: Record the private workspace result
  ansible.builtin.copy:
    content: "{{ workspace_result | to_json }}"
    dest: "{{ workspace_result_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
