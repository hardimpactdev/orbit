id: 7b12830f-6b39-516c-85bf-13dc5726cd61
name: operation-task-vm-fleet-build
description: >-
  Build the nested fleet of a task VM from stock Ubuntu with Orbit's own steps (docs/cli/tasks/vm-fleet-build.mmd): the nested network and three VMs, a Gateway with its own Swamp prepared by one local run of `gateway-bootstrap`, its own Node, role and websocket converges, app-dev and app-prod added through its own Orbit, and a Doctor check. Each step is one command over official SSH to the task VM.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.fleet_build}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^swamp-proof-club-api-key$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: network
  labels: {role: swamp}
  steps:
  - name: 'Look for the network'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-look-for-the-network").split(".").join("-") }}', methodName: exec,
      globalArgs: &vm {name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-look-for-the-network").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['incus', 'network', 'list', '--format', 'csv', '--columns', 'n'], timeoutSec: 50}}
  - name: 'Create the nested network'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Look for the network"].outputs.stdout.split("\n").exists(l, l == inputs.intent.fleet.network) }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-create-the-network").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-create-the-network").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'network', 'create', '${{ inputs.intent.fleet.network }}', '${{ "ipv4.address=" + inputs.intent.fleet.bridge }}', 'ipv4.nat=true', 'ipv6.address=none'], timeoutSec: 80}}
    dependsOn: [{step: 'Look for the network', condition: {type: succeeded}}]
- name: machines
  labels: {role: swamp}
  dependsOn: [{job: network, condition: {type: succeeded}}]
  steps:
  # A rerun starts from nothing: the earlier VMs of a failed or an old fleet go first, and none being there is no error.
  - name: 'Remove the earlier fleet'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-remove-the-earlier-fleet").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-remove-the-earlier-fleet").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '180', 'incus', 'delete', '--force', '${{ inputs.intent.fleet.guests.gateway }}', '${{ inputs.intent.fleet.guests["app-dev"] }}', '${{ inputs.intent.fleet.guests["app-prod"] }}'], okExitCodes: any, timeoutSec: 200}}
  # The earlier Gateway had another host key at the same address; the bootstrap's cfgmgmt steps trust the operator's known_hosts on first use, so the operator forgets it. A VM without known_hosts exits 255.
  - name: 'Forget the earlier host key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-forget-the-earlier-host-key").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-forget-the-earlier-host-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '20', 'ssh-keygen', '-f', '${{ "/home/" + inputs.intent.ssh_execution.target.user + "/.ssh/known_hosts" }}', '-R', '${{ inputs.intent.fleet.layout["gateway"].address }}'], okExitCodes: [0, 255], timeoutSec: 30}}
    dependsOn: [{step: 'Remove the earlier fleet', condition: {type: succeeded}}]
  # A fresh task VM has no SSH key. The key is the operator key that reaches the nested VMs; an existing key stays.
  - name: 'Make the operator key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-make-the-operator-key").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-make-the-operator-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['sh', '-c', 'mkdir -p -m 0700 "$1" && { [ -e "$1/id_ed25519.pub" ] || ssh-keygen -q -t ed25519 -N "" -f "$1/id_ed25519"; }', 'sh', '${{ "/home/" + inputs.intent.ssh_execution.target.user + "/.ssh" }}'], timeoutSec: 30}}
    dependsOn: [{step: 'Forget the earlier host key', condition: {type: succeeded}}]
  - name: 'Read the operator key'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-operator-key").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-operator-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['cat', '${{ "/home/" + inputs.intent.ssh_execution.target.user + "/.ssh/id_ed25519.pub" }}'], timeoutSec: 30}}
    dependsOn: [{step: 'Make the operator key', condition: {type: succeeded}}]
  # Stock Ubuntu with cloud-init: the orbit account and the key of this VM. Stateful, with the state disk the memory needs, as the ready copies require. One at a time: parallel `incus init` calls of one remote image race on the client's image cache.
  - name: 'Create the VMs'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    concurrency: 1
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-create-the-vms" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-create-the-vms" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'incus', 'init', 'images:ubuntu/resolute/cloud', '${{ inputs.intent.fleet.guests[self.role] }}', '--vm', '--storage', 'topology-seed', '--network', '${{ inputs.intent.fleet.network }}', '-c', 'limits.cpu=2', '-c', '${{ "limits.memory=" + inputs.intent.fleet.layout[self.role].memory }}', '-c', 'migration.stateful=true', '-d', 'root,size=20GiB', '-d', '${{ "root,size.state=" + inputs.intent.fleet.layout[self.role].memory }}', '-c', '${{ "cloud-init.user-data=#cloud-config\npackage_update: true\npackages: [openssh-server]\nusers:\n  - name: orbit\n    sudo: ALL=(ALL) NOPASSWD:ALL\n    shell: /bin/bash\n    ssh_authorized_keys:\n      - " + steps["Read the operator key"].outputs.stdout.split("\n")[0] + "\n" }}'], timeoutSec: 610}}
    dependsOn: [{step: 'Read the operator key', condition: {type: succeeded}}]
  - name: 'Set the addresses'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-set-the-addresses" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-set-the-addresses" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'device', 'set', '${{ inputs.intent.fleet.guests[self.role] }}', 'eth0', '${{ "ipv4.address=" + inputs.intent.fleet.layout[self.role].address }}', '${{ "hwaddr=" + inputs.intent.fleet.layout[self.role].hwaddr }}'], timeoutSec: 50}}
    dependsOn: [{step: 'Create the VMs', condition: {type: succeeded}}]
  - name: 'Start the VMs'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-start-the-vms").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-start-the-vms").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '300', 'incus', 'start', '${{ inputs.intent.fleet.guests.gateway }}', '${{ inputs.intent.fleet.guests["app-dev"] }}', '${{ inputs.intent.fleet.guests["app-prod"] }}'], timeoutSec: 320}}
    dependsOn: [{step: 'Set the addresses', condition: {type: succeeded}}]
  - name: 'Wait for the guest agent'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-guest-agent" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-guest-agent" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '200', 'incus', 'wait', '${{ inputs.intent.fleet.guests[self.role] }}', 'agent', '--timeout', '180'], timeoutSec: 210}}
    dependsOn: [{step: 'Start the VMs', condition: {type: succeeded}}]
  # cloud-init exits 2 when it finished with a recoverable warning; both are a finished boot.
  - name: 'Wait for cloud-init'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-cloud-init" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-cloud-init" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '400', 'incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--', 'cloud-init', 'status', '--wait'], okExitCodes: [0, 2], timeoutSec: 410}}
    dependsOn: [{step: 'Wait for the guest agent', condition: {type: succeeded}}]
- name: bootstrap
  labels: {role: swamp}
  dependsOn: [{job: machines, condition: {type: succeeded}}]
  steps:
  - name: 'Read the release commit'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-release-commit").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-release-commit").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['git', '-C', '${{ inputs.intent.operator_checkout }}', 'rev-parse', 'HEAD'], timeoutSec: 30}}
  - name: 'Read the release address'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-release-address").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-release-address").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['git', '-C', '${{ inputs.intent.operator_checkout }}', 'remote', 'get-url', 'origin'], timeoutSec: 30}}
    dependsOn: [{step: 'Read the release commit', condition: {type: succeeded}}]
  - name: 'Read the Gateway host key'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-gateway-host-key").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-gateway-host-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'ssh-keyscan', '-t', 'ed25519', '${{ inputs.intent.fleet.layout["gateway"].address }}'], timeoutSec: 80}}
    dependsOn: [{step: 'Read the release address', condition: {type: succeeded}}]
  # The Swamp key reaches the machine through stdin, as a file of its account in its owner's folder; it is in no copy.
  - name: 'Push the Swamp key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-push-the-swamp-key").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-push-the-swamp-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'file', 'push', '-', '${{ inputs.intent.fleet.guests.gateway + "/home/orbit/.config/swamp/api-key" }}', '--create-dirs', '--mode', '0600', '--uid', '1000', '--gid', '1000'], stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}', timeoutSec: 50}}
    dependsOn: [{step: 'Read the Gateway host key', condition: {type: succeeded}}]
  # One local run: its steps request no worker, so the Swamp binary of this VM runs them itself, over SSH on the machine. The Gateway sends everything it knows as the fragment of the input; the run adds the machine, its host key and the release.
  - name: 'Prepare the Gateway'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-prepare-the-gateway").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-prepare-the-gateway").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '1500', 'env', 'SWAMP_API_KEY_FILE=/home/orbit/.config/swamp/club-api-key', 'swamp', 'workflow', 'run', 'gateway-bootstrap', '--repo-dir', '${{ inputs.intent.operator_checkout + "/swamp" }}', '--input', '${{ "{\"intent\":{" + inputs.intent.bootstrap.fragment + ",\"ssh\":{\"host\":\"" + inputs.intent.fleet.layout["gateway"].address + "\",\"port\":22,\"user\":\"orbit\",\"identity_file\":\"/home/orbit/.ssh/id_ed25519\",\"host_keys\":[\"" + steps["Read the Gateway host key"].outputs.stdout.split("\n").filter(l, l.contains("ssh-ed25519"))[0].split(" ")[1] + " " + steps["Read the Gateway host key"].outputs.stdout.split("\n").filter(l, l.contains("ssh-ed25519"))[0].split(" ")[2] + "\"]},\"release\":{\"repository\":\"" + steps["Read the release address"].outputs.stdout.split("\n")[0] + "\",\"commit\":\"" + steps["Read the release commit"].outputs.stdout.split("\n")[0] + "\"}}}" }}'], timeoutSec: 1510}}
    dependsOn: [{step: 'Push the Swamp key', condition: {type: succeeded}}]
- name: fleet
  labels: {role: swamp}
  dependsOn: [{job: bootstrap, condition: {type: succeeded}}]
  steps:
  - name: 'Admit the Gateway Node'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-the-gateway-node").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-the-gateway-node").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--user', '1000', '--env', 'HOME=/home/orbit', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'orbit:node-converge', 'gateway'], timeoutSec: 130}}
  # The nested Gateway records the end of the run its own Swamp made; this waits for that record, at a fixed interval, inside a literal timeout.
  - name: 'Wait for the Gateway Node'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-gateway-node").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-gateway-node").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '900', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'until s=$(sqlite3 /home/orbit/.orbit/gateway.sqlite "select status from operations where id = $0"); [ -n "$s" ] && [ "$s" != running ]; do sleep 5; done; echo "$s"', '${{ steps["Admit the Gateway Node"].outputs.stdout.split("#")[1].split(" ")[0] }}'], timeoutSec: 910}}
    dependsOn: [{step: 'Admit the Gateway Node', condition: {type: succeeded}}]
  - name: 'Check the Gateway Node'
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Wait for the Gateway Node"].outputs.stdout.split("\n")[0] == "succeeded"', severity: high, message: The converge of the Gateway Node did not succeed}
    dependsOn: [{step: 'Wait for the Gateway Node', condition: {type: succeeded}}]
  - name: 'Admit the Gateway role'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-the-gateway-role").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-the-gateway-role").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--user', '1000', '--env', 'HOME=/home/orbit', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'orbit:role-add', 'gateway', 'gateway', '--converge'], timeoutSec: 130}}
    dependsOn: [{step: 'Check the Gateway Node', condition: {type: succeeded}}]
  # The nested Gateway records the end of the run its own Swamp made; this waits for that record, at a fixed interval, inside a literal timeout.
  - name: 'Wait for the Gateway role'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-gateway-role").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-gateway-role").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'until s=$(sqlite3 /home/orbit/.orbit/gateway.sqlite "select status from operations where id = $0"); [ -n "$s" ] && [ "$s" != running ]; do sleep 5; done; echo "$s"', '${{ steps["Admit the Gateway role"].outputs.stdout.split("#")[1].split(" ")[0] }}'], timeoutSec: 610}}
    dependsOn: [{step: 'Admit the Gateway role', condition: {type: succeeded}}]
  - name: 'Check the Gateway role'
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Wait for the Gateway role"].outputs.stdout.split("\n")[0] == "succeeded"', severity: high, message: The first converge of the Gateway role did not succeed}
    dependsOn: [{step: 'Wait for the Gateway role', condition: {type: succeeded}}]
  - name: 'Admit the websocket role'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-the-websocket-role").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-the-websocket-role").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--user', '1000', '--env', 'HOME=/home/orbit', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'orbit:role-add', 'gateway', 'websocket'], timeoutSec: 130}}
    dependsOn: [{step: 'Check the Gateway role', condition: {type: succeeded}}]
  # The nested Gateway records the end of the run its own Swamp made; this waits for that record, at a fixed interval, inside a literal timeout.
  - name: 'Wait for the websocket role'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-websocket-role").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-the-websocket-role").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '900', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'until s=$(sqlite3 /home/orbit/.orbit/gateway.sqlite "select status from operations where id = $0"); [ -n "$s" ] && [ "$s" != running ]; do sleep 5; done; echo "$s"', '${{ steps["Admit the websocket role"].outputs.stdout.split("#")[1].split(" ")[0] }}'], timeoutSec: 910}}
    dependsOn: [{step: 'Admit the websocket role', condition: {type: succeeded}}]
  - name: 'Check the websocket role'
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Wait for the websocket role"].outputs.stdout.split("\n")[0] == "succeeded"', severity: high, message: The websocket role did not converge}
    dependsOn: [{step: 'Wait for the websocket role', condition: {type: succeeded}}]
  # The Gateway reaches the Nodes with its own key, which they accept before they are added; their host keys are pinned by fingerprint.
  - name: 'Read the Gateway key'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-gateway-key").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-gateway-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'cat', '/home/orbit/.orbit/ssh/id_ed25519.pub'], timeoutSec: 30}}
    dependsOn: [{step: 'Check the websocket role', condition: {type: succeeded}}]
  - name: 'Let the Gateway in'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-let-the-gateway-in" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-let-the-gateway-in" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--user', '1000', '--', 'sh', '-c', 'printf "%s\n" "$0" >> /home/orbit/.ssh/authorized_keys', '${{ steps["Read the Gateway key"].outputs.stdout.split("\n")[0] }}'], timeoutSec: 40}}
    dependsOn: [{step: 'Read the Gateway key', condition: {type: succeeded}}]
  - name: 'Read the Node host keys'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-node-host-keys" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-read-the-node-host-keys" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--', 'ssh-keygen', '-lf', '/etc/ssh/ssh_host_ed25519_key.pub'], timeoutSec: 40}}
    dependsOn: [{step: 'Let the Gateway in', condition: {type: succeeded}}]
  - name: 'Admit app-dev'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-app-dev").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-app-dev").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--user', '1000', '--env', 'HOME=/home/orbit', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'orbit:node-add', '${{ inputs.intent.fleet.guests["app-dev"] }}', '${{ inputs.intent.fleet.layout["app-dev"].address }}', '${{ "--role=app-dev" }}', '${{ "--wireguard-ip=" + inputs.intent.fleet.layout["app-dev"].wireguard }}', '${{ "--tld=" + inputs.intent.fleet.layout["app-dev"].tld }}', '${{ "--host-key-fingerprint=" + steps["Read the Node host keys-app-dev"].outputs.stdout.split(" ")[1] }}'], timeoutSec: 130}}
    dependsOn: [{step: 'Read the Node host keys', condition: {type: succeeded}}]
  # The nested Gateway records the end of the run its own Swamp made; this waits for that record, at a fixed interval, inside a literal timeout.
  - name: 'Wait for app-dev'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-app-dev").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-app-dev").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '1200', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'until s=$(sqlite3 /home/orbit/.orbit/gateway.sqlite "select status from operations where id = $0"); [ -n "$s" ] && [ "$s" != running ]; do sleep 5; done; echo "$s"', '${{ steps["Admit app-dev"].outputs.stdout.split("#")[1].split(" ")[0] }}'], timeoutSec: 1210}}
    dependsOn: [{step: 'Admit app-dev', condition: {type: succeeded}}]
  - name: 'Check app-dev'
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Wait for app-dev"].outputs.stdout.split("\n")[0] == "succeeded"', severity: high, message: app-dev was not added}
    dependsOn: [{step: 'Wait for app-dev', condition: {type: succeeded}}]
  - name: 'Admit app-prod'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-app-prod").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-admit-app-prod").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--user', '1000', '--env', 'HOME=/home/orbit', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'orbit:node-add', '${{ inputs.intent.fleet.guests["app-prod"] }}', '${{ inputs.intent.fleet.layout["app-prod"].address }}', '${{ "--role=app-prod" }}', '${{ "--wireguard-ip=" + inputs.intent.fleet.layout["app-prod"].wireguard }}', '${{ "--tld=" + inputs.intent.fleet.layout["app-prod"].tld }}', '${{ "--host-key-fingerprint=" + steps["Read the Node host keys-app-prod"].outputs.stdout.split(" ")[1] }}'], timeoutSec: 130}}
    dependsOn: [{step: 'Check app-dev', condition: {type: succeeded}}]
  # The nested Gateway records the end of the run its own Swamp made; this waits for that record, at a fixed interval, inside a literal timeout.
  - name: 'Wait for app-prod'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-app-prod").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-app-prod").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '1200', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'until s=$(sqlite3 /home/orbit/.orbit/gateway.sqlite "select status from operations where id = $0"); [ -n "$s" ] && [ "$s" != running ]; do sleep 5; done; echo "$s"', '${{ steps["Admit app-prod"].outputs.stdout.split("#")[1].split(" ")[0] }}'], timeoutSec: 1210}}
    dependsOn: [{step: 'Admit app-prod', condition: {type: succeeded}}]
  - name: 'Check app-prod'
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Wait for app-prod"].outputs.stdout.split("\n")[0] == "succeeded"', severity: high, message: app-prod was not added}
    dependsOn: [{step: 'Wait for app-prod', condition: {type: succeeded}}]
- name: checkout
  labels: {role: swamp}
  dependsOn: [{job: fleet, condition: {type: succeeded}}]
  steps:
  # The services of the Gateway guest hold files of the checkout it built, so they stop before the state moves.
  - name: 'Stop the Gateway services'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-stop-the-gateway-services").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-stop-the-gateway-services").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'systemctl', 'stop', 'orbit-gateway-horizon.service', 'orbit-gateway-schedule.service', 'orbit-agent-view.service', 'orbit-swamp-worker@a.service', 'orbit-swamp-worker@b.service', 'orbit-swamp-serve.service', 'caddy.service', 'php8.5-fpm.service'], timeoutSec: 140}}
  # The state stays on the guest disk (`.env`, `storage`, `bootstrap/cache`, and the Swamp repository state), and the checkout the guest built goes: the shared one replaces it.
  - name: 'Move the state'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-move-the-state").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-move-the-state").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '300', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'set -eu; s=$0; c=$1; mkdir -p "$s/apps/gateway/bootstrap" "$s/swamp"; mv "$c/apps/gateway/.env" "$s/apps/gateway/.env"; mv "$c/apps/gateway/storage" "$s/apps/gateway/storage"; mv "$c/apps/gateway/bootstrap/cache" "$s/apps/gateway/bootstrap/cache"; for d in .swamp vaults grants; do mv "$c/swamp/$d" "$s/swamp/$d"; done; chown -R orbit:orbit "$s"; rm -rf "$c"; install -d -o orbit -g orbit "$c"', '${{ inputs.intent.fleet.checkout.state }}', '${{ inputs.intent.fleet.checkout.path }}'], timeoutSec: 320}}
    dependsOn: [{step: 'Stop the Gateway services', condition: {type: succeeded}}]
  - name: 'Make the state'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-make-the-state").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-make-the-state").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'exec', '${{ inputs.intent.fleet.guests["app-dev"] }}', '--', 'sh', '-c', 'set -eu; s=$0; mkdir -p "$s/apps/gateway/storage" "$s/apps/gateway/bootstrap/cache"; : > "$s/apps/gateway/.env"; chown -R orbit:orbit "$s"; install -d -o orbit -g orbit "$1"', '${{ inputs.intent.fleet.checkout.state }}', '${{ inputs.intent.fleet.checkout.path }}'], timeoutSec: 80}}
    dependsOn: [{step: 'Stop the Gateway services', condition: {type: succeeded}}]
  - name: 'Write the mount units'
    labels: {role: swamp}
    writes: true
    forEach: {item: unit, in: '${{ inputs.intent.fleet.checkout.units }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-write-the-mount-units" + "-" + string(self._index)).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-write-the-mount-units" + "-" + string(self._index)).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'file', 'push', '-', '${{ self.unit.guest + "/etc/systemd/system/" + self.unit.name }}', '--mode', '0644'], stdin: '${{ self.unit.content }}', timeoutSec: 40}}
    dependsOn: [{step: 'Move the state', condition: {type: succeeded}}, {step: 'Make the state', condition: {type: succeeded}}]
  - name: 'Load the mount units'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-load-the-mount-units" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-load-the-mount-units" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--', 'systemctl', 'daemon-reload'], timeoutSec: 70}}
    dependsOn: [{step: 'Write the mount units', condition: {type: succeeded}}]
  - name: 'Enable the mounts'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-enable-the-mounts" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-enable-the-mounts" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: '${{ ["timeout", "120", "incus", "exec", inputs.intent.fleet.guests[self.role], "--", "systemctl", "enable", "home-orbit-orbit.mount"] + inputs.intent.fleet.checkout.binds[self.role] }}', timeoutSec: 140}}
    dependsOn: [{step: 'Load the mount units', condition: {type: succeeded}}]
  - name: 'Mount the checkout'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-mount-the-checkout" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-mount-the-checkout" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '180', 'incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--', 'systemctl', 'start', 'home-orbit-orbit.mount'], timeoutSec: 200}}
    dependsOn: [{step: 'Enable the mounts', condition: {type: succeeded}}]
  # The mount points of the state are in the shared checkout; the ones it lacks are made as the orbit user, whose NFS identity can write there.
  - name: 'Make the mount points'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-make-the-mount-points" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-make-the-mount-points" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--user', '1000', '--', 'sh', '-c', 'set -eu; cd "$0"; touch apps/gateway/.env; if [ "$1" = gateway ]; then mkdir -p swamp/.swamp swamp/vaults swamp/grants; fi', '${{ inputs.intent.fleet.checkout.path }}', '${{ self.role }}'], timeoutSec: 140}}
    dependsOn: [{step: 'Mount the checkout', condition: {type: succeeded}}]
  - name: 'Mount the state'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-mount-the-state" + "-" + self.role).split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-mount-the-state" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: '${{ ["timeout", "120", "incus", "exec", inputs.intent.fleet.guests[self.role], "--", "systemctl", "start"] + inputs.intent.fleet.checkout.binds[self.role] }}', timeoutSec: 140}}
    dependsOn: [{step: 'Make the mount points', condition: {type: succeeded}}]
  - name: 'Start the Gateway services'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-start-the-gateway-services").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-start-the-gateway-services").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '180', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'systemctl', 'start', 'php8.5-fpm.service', 'caddy.service', 'orbit-swamp-serve.service', 'orbit-swamp-worker@a.service', 'orbit-swamp-worker@b.service', 'orbit-gateway-horizon.service', 'orbit-gateway-schedule.service', 'orbit-agent-view.service'], timeoutSec: 200}}
    dependsOn: [{step: 'Mount the state', condition: {type: succeeded}}]
- name: end
  labels: {role: swamp}
  dependsOn: [{job: checkout, condition: {type: succeeded}}]
  steps:
  # The same check as stage 2: every agent online, the Swamp workers enrolled, Doctor without a finding. The agents report a few minutes after they start.
  - name: 'Wait for Doctor'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-doctor").split(".").join("-") }}', methodName: exec,
      globalArgs: {<<: *vm, name: '${{ ("fleet-build-" + string(inputs.intent.guest_node_id) + "-wait-for-doctor").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '900', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sh', '-c', 'until curl -sk -m 100 -X POST https://10.45.0.1/api/v1/doctor -H "Host: gateway.orbit" -H "Accept: application/json" -H "Content-Type: application/json" -d "{}" > /tmp/doctor.json; grep -q "\"healthy\":true" /tmp/doctor.json; do sleep 15; done; cat /tmp/doctor.json'], timeoutSec: 910}}
  - name: 'Check the nested fleet'
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Wait for Doctor"].outputs.stdout.startsWith("{\"data\":{\"healthy\":true")', severity: high, message: Doctor of the nested fleet has a finding}
    dependsOn: [{step: 'Wait for Doctor', condition: {type: succeeded}}]
