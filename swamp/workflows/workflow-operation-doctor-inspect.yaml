id: d195304a-0be0-4f02-91b2-4f7f99f76976
name: operation-doctor-inspect
description: Read native host facts through official SSH from209; compare once against public registry intent.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - doctor.inspect
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - node_id
  - intent
  additionalProperties: false
jobs:
- name: plan
  labels: {role: swamp}
  steps:
  - name: plan
    writes: false
    task:
      type: behavior
      behaviorType: '@nckrtl/doctor'
      behaviorName: ${{ "doctor-plan-" + run.id }}
      methodName: plan
      inputs:
        intent: ${{ inputs.intent }}
- name: reads
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition:
      type: succeeded
  steps:
  - name: ${{ self.read.key }}
    writes: false
    allowFailure: true
    forEach:
      item: read
      in: ${{ steps.plan.outputs.reads }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "doctor-read-" + run.id + "-" + string(self._index) }}
      globalArgs:
        name: ${{ "doctor-read-" + run.id + "-" + string(self._index) }}
        # F8: a stopped or stalled Node fails this read within its bound.
        defaultTimeoutSec: 60
        transport:
          kind: ssh
          user: ${{ self.read.ssh.user }}
          port: ${{ self.read.ssh.port }}
          connectTimeoutSec: 10
          identityFile: /etc/orbit/swamp-role-worker/ssh-identity
        hosts:
        - name: target
          address: ${{ self.read.ssh.host }}
          transport:
            hostKeys: ${{ self.read.ssh.host_keys }}
      methodName: exec
      inputs:
        hosts: name:target
        argv: ${{ self.read.argv }}
        sudo: ${{ self.read.sudo }}
        okExitCodes:
        - 0
        - 1
- name: logs
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition:
      type: succeeded
  steps:
  - name: logs
    writes: false
    allowFailure: true
    forEach:
      item: node
      in: ${{ inputs.intent.nodes.filter(n, n.id == inputs.node_id && n.managed && !n.parked && inputs.intent.collect_problems) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "doctor-logs-" + run.id + "-" + string(self._index) }}
      methodName: script
      globalArgs:
        name: ${{ "doctor-logs-" + run.id + "-" + string(self._index) }}
        # F8: a stopped or stalled Node fails this read within its bound.
        defaultTimeoutSec: 60
        transport:
          kind: ssh
          user: ${{ self.node.ssh.user }}
          port: ${{ self.node.ssh.port }}
          connectTimeoutSec: 10
          identityFile: /etc/orbit/swamp-role-worker/ssh-identity
        hosts:
        - name: target
          address: ${{ self.node.ssh.host }}
          transport:
            hostKeys: ${{ self.node.ssh.host_keys }}
      inputs:
        hosts: name:target
        interpreter: python3
        sudo: false
        script: ${{ steps.plan.outputs.log_script }}
- name: report
  labels: {role: swamp}
  dependsOn:
  - job: reads
    condition:
      type: always
  - job: logs
    condition:
      type: always
  - job: plan
    condition:
      type: succeeded
  steps:
  - name: result
    writes: false
    task:
      type: behavior
      behaviorType: '@nckrtl/doctor'
      behaviorName: ${{ "doctor-result-" + run.id }}
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        results: ${{ steps }}
queueTimeout: 60
