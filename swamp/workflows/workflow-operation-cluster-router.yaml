    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: forward_prepare_caddy
      condition:
        type: always
    - step: forward_urls
      condition:
        type: always
    - step: forward_prepare_dns
      condition:
        type: always
    - step: forward_dns_grace
      condition:
        type: always
    - step: forward_withdraw_caddy
      condition:
        type: always
    - step: forward_live_certificates
      condition:
        type: always
    - step: prepare
      condition:
        type: always
