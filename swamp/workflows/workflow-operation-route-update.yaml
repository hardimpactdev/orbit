        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        requests: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.node_ids.map(node,
          data.latest("certificate-node-" + string(node), "requests-" + run.id).attributes.requests) }}
        leaves: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.update.cleanup.certificates
          }}
        native_stdout: ${{ steps["cleanup-certificate-sign-http"].outputs.stdout }}
    guard: ${{ !(data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
