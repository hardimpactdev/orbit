    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-retire-restored-before-image" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" <<'PYTHON'
          import json
          import os
          import stat
          import sys
          import tempfile
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          def publish(path, value):
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-network-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
          saved = json.loads(private_read(journal))
          if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
              raise SystemExit("wireguard.peer_recovery_pending")
          journal.unlink()
          print('{"peer_restored":true}')
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.restoration_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
    dependsOn:
    - step: verify_peer_restoration
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !steps.restore_view.outputs.present }}
  dependsOn:
  - job: peer_resolver
    condition:
      type: or
      conditions:
      - type: succeeded
      - type: skipped
