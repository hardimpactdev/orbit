    writes: true
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    guard: ${{ steps.inventory.outputs.noop }}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router'
      behaviorName: ${{ "cluster-router-node-" + string(inputs.node_id) }}
      methodName: checkpoint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        checkpoint: old-router-withdrawn
  dependsOn:
  - job: old-dns-expiry
    condition:
      type: succeeded
- name: old-caddy
  steps:
  - name: old-caddy-${{ self.member.node_id }}
    writes: true
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member.node_id) }}
      methodName: publishCaddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
    forEach:
      item: member
      in: ${{ steps.inventory.outputs.old_nodes }}
  dependsOn:
  - job: old-withdrawal
    condition:
      type: succeeded
- name: old-certificates
  steps:
  - name: old-certificates-${{ self.member.node_id }}
    writes: true
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router'
      behaviorName: ${{ "cluster-router-node-" + string(self.member.node_id) }}
      methodName: certificates
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
        node: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.inventory.outputs.old_nodes }}
  dependsOn:
  - job: old-caddy
    condition:
      type: succeeded
- name: old-workload-lan
  steps:
  - name: old-workload-lan-${{ self.member.node_id }}-${{ self.member.route_id }}-${{
      self.member.retire_router_id }}
    writes: true
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router'
      behaviorName: ${{ "cluster-router-node-" + string(self.member.node_id) }}
      methodName: retireLan
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
        node: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.inventory.outputs.workloads }}
    guard: ${{ !has(self.member.retire_firewall) }}
  dependsOn:
  - job: old-certificates
    condition:
      type: succeeded
- name: old-firewall
  steps:
  - name: old-firewall-${{ self.member.node_id }}
    writes: true
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router'
      behaviorName: ${{ "cluster-router-node-" + string(self.member.node_id) }}
      methodName: firewall
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
        node: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.inventory.outputs.old_nodes }}
  dependsOn:
  - job: old-workload-lan
    condition:
      type: succeeded
- name: old-router-lan
  steps:
  - name: old-router-lan-${{ self.member.node_id }}
    writes: true
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router'
      behaviorName: ${{ "cluster-router-node-" + string(self.member.node_id) }}
      methodName: routerLan
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
        node: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.inventory.outputs.old_nodes }}
  dependsOn:
  - job: old-firewall
    condition:
      type: succeeded
- name: completion
  steps:
  - name: complete
    writes: true
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router'
      behaviorName: ${{ "cluster-router-node-" + string(inputs.node_id) }}
      methodName: finish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  dependsOn:
  - job: old-router-lan
    condition:
      type: succeeded
- name: terminal-failure
  dependsOn:
  - job: completion
    condition:
      type: or
      conditions:
      - type: failed
      - type: skipped
  steps:
  - name: report-native-failure
    writes: true
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: certificate-cluster-failure
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
