id: eabb9794-3ff8-4ee9-a7bb-52172837668b
name: operation-certificate-remove
description: One admitted local leaf, visible command actions, and terminal public presence.
writes: true
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - certificate.remove
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        scope:
          type: string
          pattern: ^(app-instance-[1-9][0-9]*(-hostname-change)?|route-[1-9][0-9]*(-router(-hostname-change)?|-ingress)?)$
        user:
          type: string
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        home:
          type: string
        agent_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        in_use:
          type: boolean
          const: false
      required:
      - node_id
      - scope
      - user
      - agent_sha256
      - in_use
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
      maxProperties: 0
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
  - name: remove
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-remove-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: sudo -n --preserve-env=ORBIT_CERTIFICATE_INPUT /usr/bin/python3 "${{ steps.assets.outputs.remove_script }}"
        env:
          ORBIT_CERTIFICATE_INPUT: ${{ steps.assets.outputs.input_json }}
  - name: inspect
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    dependsOn:
    - step: remove
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-inspect-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: sudo -n --preserve-env=ORBIT_CERTIFICATE_INPUT,ORBIT_CERTIFICATE_EXPECT_PRESENT /usr/bin/python3 "${{ steps.assets.outputs.inspect_script
          }}"
        env:
          ORBIT_CERTIFICATE_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_CERTIFICATE_EXPECT_PRESENT: 'false'
