---
# The tasks of a sleep and of a wake's end. `power` is `asleep` (instance-container-power.yml: the marker, before the freeze),
# `freeze` (instance-container-power.yml: the freeze after the marker) or `awake` (the end of a wake's `start` part of
# instance-container.yml, which includes this file when its intent names the marker).

# Caddy's site of a container Instance checks the marker only once a publish of the Node's sites rendered the check. A marker without
# the check would leave the Route proxying to a stopped container, so the sleep refuses before it changes anything.
- name: Read Caddy's loaded configuration
  when: power == 'asleep'
  ansible.builtin.uri:
    url: "{{ caddy_admin }}/config/"
    return_content: true
    timeout: 5
  register: caddy_config
  changed_when: false
  failed_when: false

- name: Refuse a sleep while the site has no asleep check
  when: power == 'asleep'
  ansible.builtin.assert:
    that:
      - caddy_config.status | default(0) == 200
      - ('/' ~ (marker | basename)) in caddy_config.content | default('')
    fail_msg: instance.sleep_route_unready
    quiet: true

# Before the stop: a request during the stop gets the wake page. The directory is the app-dev role's hibernation directory.
- name: Write the asleep marker
  when: power == 'asleep'
  ansible.builtin.copy:
    content: ""
    dest: "{{ marker }}"
    owner: "{{ marker_owner }}"
    group: "{{ marker_group }}"
    mode: "0644"

# The freeze keeps every process and its memory: a wake resumes it in a fraction of a second. Incus writes `memory.swap.max = 0`
# from `limits.memory`; the sleep opens swap for this cgroup only, freezes, then reclaims, so no frozen process pulls a page back.
# A wake writes 0 again; a stop drops the cgroup with its setting. A container that is already Frozen or Stopped stays so.
- name: Read the container before the freeze
  when: power == 'freeze'
  ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
  register: freeze_read
  changed_when: false

- name: Name the container's cgroup
  when: power == 'freeze'
  ansible.builtin.set_fact:
    container_cgroup: "{{ cgroup_root | default('/sys/fs/cgroup') }}/lxc.payload.{{ container.project }}_{{ container.name }}"

- name: Freeze the container
  when: power == 'freeze' and (freeze_read.stdout | from_json).status == 'Running'
  block:
    - name: Let the container's memory go to swap
      ansible.builtin.command: { argv: [tee, "{{ container_cgroup }}/memory.swap.max"], stdin: "max", stdin_add_newline: false }
      changed_when: true
    - name: Pause the container
      ansible.builtin.command: { argv: [incus, --project, "{{ container.project }}", pause, "{{ container.name }}"] }
      changed_when: true
  rescue:
    # A failed swap write or pause leaves the container running: it serves again as before, without the marker.
    - name: Close swap again after the failed freeze
      ansible.builtin.command: { argv: [tee, "{{ container_cgroup }}/memory.swap.max"], stdin: "0", stdin_add_newline: false }
      changed_when: true
      failed_when: false
    - name: Remove the marker after the failed freeze
      ansible.builtin.file: { path: "{{ marker }}", state: absent }
    - name: Refuse the failed freeze
      ansible.builtin.fail: { msg: instance.container_freeze_failed }

# The reclaim asks for the container's whole memory; the kernel ends it with EAGAIN once nothing more can go, which is normal. An
# unreadable count leaves the container frozen with its marker: asleep, with its memory where the kernel left it.
- name: Push the frozen memory to swap
  when: power == 'freeze' and (freeze_read.stdout | from_json).status == 'Running'
  block:
    - name: Read the frozen container's memory
      ansible.builtin.slurp: { src: "{{ container_cgroup }}/memory.current" }
      register: freeze_current
    - name: Reclaim the frozen memory
      ansible.builtin.command:
        argv: [tee, "{{ container_cgroup }}/memory.reclaim"]
        stdin: "{{ freeze_current.content | b64decode | trim }}"
        stdin_add_newline: false
      changed_when: true
      failed_when: false
    - name: Read the memory left in RAM
      ansible.builtin.slurp: { src: "{{ container_cgroup }}/memory.stat" }
      register: freeze_stat
  rescue:
    - name: Keep the container frozen without a reclaim
      ansible.builtin.set_fact: { freeze_stat: { skipped: true } }

# Swap that cannot take the memory (it is full) leaves the app in RAM. A frozen container would then hold that RAM, which a sleep
# exists to free, so the sleep stops the container instead: its next wake is a boot behind the same marker. A clean stop of a frozen
# container times out, so it resumes first. A failed resume fails the sleep with the container frozen behind its marker: asleep.
- name: Note whether the memory stayed in RAM
  when: power == 'freeze'
  ansible.builtin.set_fact:
    freeze_held: >-
      {{ freeze_stat is not skipped
         and (freeze_stat.content | b64decode | regex_findall('(?m)^anon ([0-9]+)$') | first | default(0) | int) > intent.freeze.resident_anon_mib * 1048576 }}

- name: Resume the container for a clean stop
  when: power == 'freeze' and freeze_held | bool
  ansible.builtin.command: { argv: [incus, --project, "{{ container.project }}", resume, "{{ container.name }}"] }
  changed_when: true

- name: Stop the container whose memory stayed in RAM
  when: power == 'freeze' and freeze_held | bool
  block:
    - name: Stop the container
      ansible.builtin.command: { argv: [incus, --project, "{{ container.project }}", stop, --timeout, "30", "{{ container.name }}"] }
      register: freeze_stopped
      changed_when: true
  rescue:
    # The resumed container runs: as after a failed freeze, it serves again without the marker and swaps no more.
    - name: Close swap again after the failed stop
      ansible.builtin.command: { argv: [tee, "{{ container_cgroup }}/memory.swap.max"], stdin: "0", stdin_add_newline: false }
      changed_when: true
      failed_when: false
    - name: Remove the marker after the failed stop
      ansible.builtin.file: { path: "{{ marker }}", state: absent }
    - name: Refuse the failed stop
      ansible.builtin.fail: { msg: instance.container_freeze_failed }

- name: Note how the container sleeps
  when: power == 'freeze'
  ansible.builtin.set_fact:
    power_result:
      sleep: >-
        {{ 'stopped' if freeze_stopped is defined and freeze_stopped is not skipped
           else 'frozen' if (freeze_read.stdout | from_json).status in ['Running', 'Frozen'] else 'stopped' }}

# A wake's start (instance-container.yml, `start` with the marker in the intent) waited for every desired-running unit. FrankenPHP
# then answers once it listens: `intent.web.ready_seconds` tries 1 s apart, each bounded by curl's own 2 s. Only no answer at all
# refuses the wake. A Project without a web unit has nothing to wait for.
- name: Wait for the web unit to answer
  when: power == 'awake' and container.web_config | default(none) is not none
  ansible.builtin.command:
    argv: &web_probe >-
      {{ ['incus', 'exec', '--project', container.project, container.name, '--',
          'curl', '--silent', '--output', '/dev/null', '--write-out', '%{http_code}', '--max-time', '2',
          'http://127.0.0.1:' ~ intent.web.port ~ '/'] }}
  register: web_ready
  until: web_ready.rc == 0 and web_ready.stdout | int > 0
  retries: "{{ intent.web.ready_seconds }}"
  delay: 1
  changed_when: false
  failed_when: false

- name: Refuse a wake whose web unit did not answer
  when: power == 'awake' and container.web_config | default(none) is not none
  ansible.builtin.assert:
    that: [web_ready.rc == 0, web_ready.stdout | int > 0]
    fail_msg: instance.web_unready
    quiet: true

# A web unit that listens before the app is ready answers 5xx for a moment: the visitor keeps the waiting page through it, up to
# `intent.web.settle_seconds`. An app that answers 5xx by itself (maintenance mode, an error on `/`) is then served as it is.
- name: Wait for the app behind the web unit
  when: power == 'awake' and container.web_config | default(none) is not none and web_ready.stdout | int >= 500
  ansible.builtin.command:
    argv: *web_probe
  register: app_ready
  until: app_ready.rc == 0 and app_ready.stdout | int > 0 and app_ready.stdout | int < 500
  retries: "{{ intent.web.settle_seconds }}"
  delay: 1
  changed_when: false
  failed_when: false

# Caddy sends the next request to the app. The visitor does not wait for T3.
- name: Remove the asleep marker
  when: power == 'awake'
  ansible.builtin.file:
    path: "{{ marker }}"
    state: absent

# A converge cannot exec in a frozen container, so one that slept through it may wake with a library cache that lacks the shared
# runtime libraries. After the marker went, so the visitor does not wait: one exec, `ldconfig -X` only when the cache lacks a soname of
# the runtime folder's `lib` at that path (the converge's own rule, instance_container_files.py).
# The Node's wake script (files/instance-container-wake.sh) runs the same check after its resume.
- name: Refresh a stale library cache after the wake
  when: power == 'awake'
  ansible.builtin.command:
    argv: ['incus', 'exec', '--project', '{{ container.project }}', '{{ container.name }}', '--', 'sh', '-c', 'd=/opt/orbit-runtime/current/lib; c=$(ldconfig -p) || exit 0; for f in "$d"/lib*.so*; do n=${f##*/}; case "$n" in *.so|*.so.[0-9]|*.so.[0-9][0-9]|*.so.[0-9][0-9][0-9]) ;; *) continue;; esac; [ -e "$f" ] || continue; printf "%s\n" "$c" | sed -n "s/.* => //p" | grep -qxF "$d/$n" || { ldconfig -X && echo rebuilt; exit 0; }; done']
  register: wake_library_cache
  changed_when: "'rebuilt' in wake_library_cache.stdout"
  failed_when: false

# T3 gates only the end of the wake: a clone whose T3 stays silent ends failed while its site already serves.
- name: Wait for T3
  when: power == 'awake' and container.clone | default(none) is not none
  ansible.builtin.command:
    argv: >-
      {{ ['incus', 'exec', '--project', container.project, '--cwd', '/home/agent', '--env', 'HOME=/home/agent', container.name,
          '--', 'runuser', '-u', 'agent', '--',
          'curl', '--fail', '--silent', '--max-time', '2',
          'http://127.0.0.1:' ~ container.clone.t3.internal_port ~ '/.well-known/t3/environment'] }}
  register: t3_ready
  until: t3_ready.rc == 0
  retries: "{{ container.clone.t3.ready_seconds }}"
  delay: 1
  changed_when: false
  failed_when: false

- name: Refuse a wake whose T3 did not answer
  when: power == 'awake' and container.clone | default(none) is not none
  ansible.builtin.assert:
    that: [t3_ready.rc == 0]
    fail_msg: instance.t3_unready
    quiet: true
