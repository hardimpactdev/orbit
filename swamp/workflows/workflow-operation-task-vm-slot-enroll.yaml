id: 10502a90-602f-4d5d-8b2b-e4862260968d
name: operation-task-vm-slot-enroll
description: Enrol one task VM slot. Issue its model key, write its identity volume, add its hub peer, prove it with a VM, and check the result. Private keys stay on the host.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.slot_enroll}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(task-vm-(model-key|pi-token)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: model
  steps:
  - name: Issue the model key
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-model-issue
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          task_vm_id: '${{ inputs.intent.task_vm_id }}'
          gateway_node_id: '${{ inputs.intent.gateway_node_id }}'
          model_router_node_id: '${{ inputs.intent.model_router_node_id }}'
          model_origin: '${{ inputs.intent.model_origin }}'
        execution_secrets:
          model_key: '${{ inputs.execution_secrets.model_key }}'
          model_router_management: '${{ inputs.execution_secrets.model_router_management }}'
          model_router_anchor: '${{ inputs.execution_secrets.model_router_anchor }}'
- name: identity
  dependsOn: [{job: model, condition: {type: succeeded}}]
  steps:
  - name: Create the identity
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-slot-identity
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent: '${{ inputs.intent }}'
        execution_secrets:
          pi_token: '${{ inputs.execution_secrets.pi_token }}'
          model_key: '${{ inputs.execution_secrets.model_key }}'
- name: hub
  dependsOn: [{job: identity, condition: {type: succeeded}}]
  steps:
  - name: Add the hub peer
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-hub-" + string(inputs.intent.hub.hub_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("task-vm-slot-hub-" + string(inputs.intent.hub.hub_id)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.hub.ssh.target.user }}', port: '${{ inputs.intent.hub.ssh.target.port }}', identityFile: '${{ inputs.intent.hub.ssh.identity_file }}'}
        hosts: [{name: hub, address: '${{ inputs.intent.hub.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.hub.ssh.target.host_keys }}'}}]
      # One action. The peer file is written only when it differs; `wg addconf` is idempotent, so a rerun reloads the same peer.
      # The peer list is the read-back for the end check.
      inputs:
        hosts: name:hub
        sudo: true
        argv:
        - timeout
        - '60'
        - sh
        - -c
        - |
          set -eu
          if [ "$(cat "$1" 2>/dev/null || true)" != "$2" ]; then
            printf '%s' "$2" | install -D -m 0600 -o root -g root /dev/stdin "$1"
          fi
          wg addconf orbit "$1"
          wg show orbit peers
        - sh
        - '${{ inputs.intent.hub.file }}'
        - '${{ inputs.intent.hub.section.split("@KEY@").join(steps["Create the identity"].outputs.result.wireguard_public_key) }}'
        timeoutSec: 70
- name: vm
  dependsOn: [{job: hub, condition: {type: succeeded}}]
  steps:
  - name: Start a proof VM
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-slot-boot
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent: '${{ inputs.intent }}'
  - name: Check the slot VM
    labels: {role: swamp}
    dependsOn: [{step: Start a proof VM, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-guest-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: exec
      # The guest pins the host key that the identity phase made. Its address and key are the slot's for life.
      globalArgs:
        name: '${{ ("task-vm-slot-guest-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.guest.user }}', port: 22, identityFile: '${{ inputs.intent.guest.identity_file }}', connectTimeoutSec: 10, extraOptions: [ConnectionAttempts=12]}
        hosts: [{name: slot, address: '${{ inputs.intent.guest.address }}', transport: {hostKeys: ['${{ steps["Create the identity"].outputs.result.ssh_host_key }}']}}]
      # The unit installs the identity before ssh starts, so a connection means it finished; the first line proves it did not fail.
      # The last line is the report that the Gateway records: public key, host key and observer digest, as the guest runs them.
      inputs:
        hosts: name:slot
        sudo: true
        argv:
        - timeout
        - '120'
        - bash
        - -c
        - |
          set -eu
          systemctl is-active --quiet orbit-slot-identity.service
          printf '%s  %s\n%s  %s\n' "$1" /usr/local/bin/orbit-agent "$2" /home/orbit/.local/bin/pi-server | sha256sum -c --quiet
          systemctl is-active --quiet orbit-agent.service
          curl -fsS -o /dev/null --max-time 10 -H @<(printf 'Authorization: Bearer %s' "$(cat /home/orbit/.pi/agent/orbit-token)") "$3/capabilities"
          key=$(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)
          [ "$key" = "$4" ]
          printf '{"wireguard_public_key":"%s","ssh_host_key":"%s","observer_digest":"%s"}\n' "$(wg pubkey < /etc/wireguard/orbit.key)" "$key" "$(sha256sum /etc/orbit/agent/secret | cut -d' ' -f1)"
        - bash
        - '${{ inputs.intent.guest.agent_sha256 }}'
        - '${{ inputs.intent.guest.pi_sha256 }}'
        - '${{ inputs.intent.guest.pi_url }}'
        - '${{ steps["Create the identity"].outputs.result.ssh_host_key }}'
        timeoutSec: 130
  - name: Delete the proof VM
    labels: {role: swamp}
    writes: true
    # It runs after a failed check or a failed boot too, so a failed run leaves no proof VM and no seed clone behind.
    dependsOn:
    - {step: Start a proof VM, condition: {type: completed}}
    - {step: Check the slot VM, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("task-vm-slot-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.host_ssh_execution.target.user }}', port: '${{ inputs.intent.host_ssh_execution.target.port }}', identityFile: '${{ inputs.intent.host_ssh_execution.identity_file }}'}
        hosts: [{name: host, address: '${{ inputs.intent.host_ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.host_ssh_execution.target.host_keys }}'}}]
      # Exact names, and each only when it exists. The identity volume stays. The listings are the read-back for the end check.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '120'
        - sh
        - -c
        - |
          set -eu
          if incus --project "$1" info "$3" >/dev/null 2>&1; then incus --project "$1" delete --force "$3"; fi
          if incus --project "$1" storage volume show "$2" "$4" >/dev/null 2>&1; then incus --project "$1" storage volume delete "$2" "$4"; fi
          incus --project "$1" list --format csv --columns n
          incus --project "$1" storage volume list "$2" --format csv --columns tn
        - sh
        - '${{ inputs.intent.vm.project }}'
        - '${{ inputs.intent.vm.pool }}'
        - '${{ inputs.intent.vm.name }}'
        - '${{ inputs.intent.vm.seed_clone }}'
        timeoutSec: 130
- name: check
  dependsOn: [{job: vm, condition: {type: succeeded}}]
  steps:
  - name: Check the slot
    labels: {role: swamp}
    task:
      type: assert
      # The volume holds the admitted REVISION, the hub lists the peer, the proof VM passed, and the VM and its seed clone are gone.
      expr: 'steps["Create the identity"].outputs.result.revision == inputs.intent.identity.revision && steps["Add the hub peer"].outputs.stdout.split("\n").exists(line, line == steps["Create the identity"].outputs.result.wireguard_public_key) && steps["Check the slot VM"].outputs.exitCode == 0 && steps["Delete the proof VM"].outputs.exitCode == 0 && !steps["Delete the proof VM"].outputs.stdout.split("\n").exists(line, line == inputs.intent.vm.name || line == "custom," + inputs.intent.vm.seed_clone)'
      severity: high
      message: The slot is not enrolled; the volume, the hub peer, the proof VM or its cleanup is not as admitted.
