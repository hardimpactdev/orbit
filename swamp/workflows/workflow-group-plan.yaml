id: fc3ba349-1ed7-408a-8109-ec246ac097e8
name: group-plan
description: >-
  Record the operator's complete typed plan for a task group parked at the plan stage,
  with exact consent for that plan. Serve runs remote-only; this is the placed call.
queueTimeout: 60
inputs:
  type: object
  properties:
    workItem: { type: string, pattern: '^tg-[1-9][0-9]*$' }
    plan: { type: object }
    actor: { type: string, minLength: 1 }
  required: [workItem, plan, actor]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: group
    steps:
      - name: plan
        labels: {role: swamp}
        task:
          type: model_method
          modelIdOrName: orbit-driver-groups
          methodName: plan
          inputs:
            workItem: '${{ inputs.workItem }}'
            plan: '${{ inputs.plan }}'
            actor: '${{ inputs.actor }}'
      # Wake the group's parked run so it applies the consent now.
      - name: wake
        dependsOn: [{ step: plan, condition: { type: succeeded } }]
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@nckrtl/orbit-group-run'
          behaviorName: '${{ "orbit-group-" + inputs.workItem }}'
          methodName: wake
          globalArgs:
            factory: orbit-groups
            assistanceModel: orbit-gateway
            preapprovalModel: orbit-driver-groups
          inputs:
            workItem: '${{ inputs.workItem }}'
