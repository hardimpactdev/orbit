id: 04baf3d5-926d-4d03-8157-e1302a08360c
name: operation-analytics-update-direct
description: Update Plausible through native initialization and shared Process workflows on209.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: analytics.update
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        environment:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^process-create-operation-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - environment
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: update
  steps:
  - name: plan
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-runtime'
      behaviorName: ${{ "analytics-runtime" }}
      methodName: plan
      inputs:
        intent: ${{ inputs.intent }}
        run_id: ${{ run.id }}
    dependsOn: []
  - name: inspect
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &id001
        name: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        name: inspect
        hosts:
        - target
        argv:
        - /usr/bin/docker
        - --host=unix:///var/run/docker.sock
        - container
        - inspect
        - --format
        - '{{ index .Config.Labels "orbit.managed" }}{{ printf "\n" }}{{ index .Config.Labels "orbit.container.kind" }}{{ printf "\n" }}{{ index
          .Config.Labels "orbit.process.id" }}{{ printf "\n" }}{{ index .Config.Labels "orbit.process.spec" }}{{ printf "\n" }}{{.State.Status}}'
        - ${{ inputs.intent.before.container }}
        sudo: true
    dependsOn:
    - step: plan
      condition:
        type: succeeded
  - name: observation
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-runtime'
      behaviorName: ${{ "analytics-runtime" }}
      methodName: observe
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.inspect.outputs.stdout }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
  - name: createdb
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        name: createdb
        hosts:
        - target
        argv: ${{ steps.plan.outputs.createdb_argv }}
        sudo: true
        stdin: ${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}
    dependsOn:
    - step: observation
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: succeeded
    guard: ${{ !steps.observation.outputs.replace }}
  - name: migrate
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        name: migrate
        hosts:
        - target
        argv: ${{ steps.plan.outputs.migrate_argv }}
        sudo: true
        stdin: ${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}
    dependsOn:
    - step: createdb
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: succeeded
    guard: ${{ !steps.observation.outputs.replace }}
  - name: reinspect
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        name: reinspect
        hosts:
        - target
        argv:
        - /usr/bin/docker
        - --host=unix:///var/run/docker.sock
        - container
        - inspect
        - --format
        - '{{ index .Config.Labels "orbit.managed" }}{{ printf "\n" }}{{ index .Config.Labels "orbit.container.kind" }}{{ printf "\n" }}{{ index
          .Config.Labels "orbit.process.id" }}{{ printf "\n" }}{{ index .Config.Labels "orbit.process.spec" }}{{ printf "\n" }}{{.State.Status}}'
        - ${{ inputs.intent.before.container }}
        sudo: true
    dependsOn:
    - step: migrate
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: succeeded
  - name: recheck
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-runtime'
      behaviorName: ${{ "analytics-runtime" }}
      methodName: observe
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.reinspect.outputs.stdout }}
    dependsOn:
    - step: reinspect
      condition:
        type: succeeded
  - name: remove
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent:
          control: ${{ steps.plan.outputs.control }}
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
    dependsOn:
    - step: recheck
      condition:
        type: succeeded
    guard: ${{ !steps.recheck.outputs.replace }}
  - name: install
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.create
        intent: ${{ steps.plan.outputs.after }}
        execution_secrets: ${{ inputs.execution_secrets }}
    dependsOn:
    - step: remove
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: succeeded
    guard: ${{ !steps.recheck.outputs.replace }}
  - name: health
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("analytics-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        name: health
        hosts:
        - target
        # Q-WAIT: one bounded wait; a replaced Plausible refuses connections until it has started.
        argv:
        - timeout
        - '60'
        - curl
        - --fail
        - --silent
        - --retry
        - '30'
        - --retry-connrefused
        - --retry-delay
        - '2'
        - --output
        - /dev/null
        - ${{ inputs.intent.health_url }}
        sudo: true
        timeoutSec: 70
    dependsOn:
    - step: install
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: observation
      condition:
        type: succeeded
  - name: recover-remove
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent:
          control: ${{ steps.plan.outputs.control }}
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
    dependsOn:
    - step: health
      condition:
        type: always
    - step: install
      condition:
        type: always
    - step: remove
      condition:
        type: always
    guard: ${{ !("recheck" in steps && steps.recheck.status == "succeeded" && steps.recheck.outputs.replace && (("remove" in steps && steps.remove.status
      == "failed") || ("install" in steps && steps.install.status == "failed") || ("health" in steps && steps.health.status == "failed"))) }}
  - name: recover-install
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.create
        intent: ${{ steps.plan.outputs.before }}
        execution_secrets: ${{ inputs.execution_secrets }}
    dependsOn:
    - step: recover-remove
      condition:
        type: succeeded
  - name: result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-result" }}
      methodName: execute
      inputs:
        run: printf '%s\n' "$ORBIT_ANALYTICS_RESULT"
        env:
          ORBIT_ANALYTICS_RESULT: '${{ ("health" in steps && steps.health.status == "succeeded") ? "{\"ready\":true,\"version\":\"" + inputs.intent.version
            + "\",\"previous_version\":\"" + inputs.intent.previous_version + "\"}" : "{\"error_code\":\"analytics.update_failed\",\"rolled_back\":"
            + string((!("remove" in steps) || steps.remove.status == "skipped" || ("recover-install" in steps && steps["recover-install"].status
            == "succeeded"))) + "}" }}'
    dependsOn:
    - step: health
      condition:
        type: always
    - step: recover-install
      condition:
        type: always
  - name: status
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-status" }}
      methodName: execute
      inputs:
        run: test "$ORBIT_ANALYTICS_READY" = true
        env:
          ORBIT_ANALYTICS_READY: ${{ string(("health" in steps && steps.health.status == "succeeded")) }}
    dependsOn:
    - step: result
      condition:
        type: succeeded
