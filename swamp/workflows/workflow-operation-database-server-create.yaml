id: f497279b-80cd-4dc8-82bb-1a6622d977e4
name: operation-database-server-create
description: Provision and scrub a recorded database server through official SSH from 209; project native terminal output.
writes: true
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - database_server.create
    intent:
      type: object
      properties:
        driver:
          type: string
        process_id:
          type: integer
        container:
          type: string
        container_input:
          type: object
        spec:
          type: string
        scrub_spec:
          type: string
        initialize:
          type: boolean
        validate_existing:
          type: boolean
        was_active:
          type: boolean
        default_open:
          type: boolean
        host:
          type: string
        port:
          type: integer
        ssh:
          type: object
      required:
      - driver
      - process_id
      - container
      - container_input
      - spec
      - scrub_spec
      - initialize
      - validate_existing
      - was_active
      - default_open
      - host
      - port
      - ssh
      additionalProperties: true
    execution_secrets:
      type: object
      properties:
        server_create:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^database-server-create-intent-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - server_create
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: server
  target: orbit-node-209
  labels:
    node: '209'
  steps:
  - name: prepare_database_assets
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    task:
      type: behavior
      behaviorType: '@nckrtl/database-server-command-assets'
      behaviorName: ${{ "database-server-assets-" + run.id }}
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
    dependsOn: []
  - name: prepare_process_assets
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: ${{ "db-process-assets-" + run.id }}
      methodName: read
      inputs:
        control:
          process_id: ${{ inputs.intent.process_id }}
          runtime: docker
          name: ${{ inputs.intent.container }}
          vite: null
          on_demand: false
    dependsOn: []
  - name: prepare_prepare_directory
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "database-server-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.user }}
          identityFile: /run/credentials/orbit-node-worker.service/proxy-ssh-identity
        hosts:
        - name: server
          address: ${{ inputs.intent.ssh.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh.host_keys }}
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/mkdir
        - -p
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) }}
        okExitCodes:
        - 0
        - 1
    allowFailure: true
    dependsOn: []
  - name: prepare_copy_process
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    dependsOn:
    - step: prepare_process_assets
      condition:
        type: always
    - step: prepare_prepare_directory
      condition:
        type: always
    guard: ${{ !((has(steps.prepare_prepare_directory) && has(steps.prepare_prepare_directory.outputs) && has(steps.prepare_prepare_directory.outputs.exitCode)
      && steps.prepare_prepare_directory.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:server
        src: ${{ steps.prepare_process_assets.outputs.scripts_directory + "/." }}
        dst: ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        direction: to
        recursive: true
    allowFailure: true
  - name: prepare_copy_database
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    dependsOn:
    - step: prepare_database_assets
      condition:
        type: always
    - step: prepare_prepare_directory
      condition:
        type: always
    guard: ${{ !((has(steps.prepare_prepare_directory) && has(steps.prepare_prepare_directory.outputs) && has(steps.prepare_prepare_directory.outputs.exitCode)
      && steps.prepare_prepare_directory.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:server
        src: ${{ steps.prepare_database_assets.outputs.directory + "/." }}
        dst: ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database" }}
        direction: to
        recursive: true
    allowFailure: true
  - name: prepare_prepared
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    dependsOn:
    - step: prepare_copy_process
      condition:
        type: always
    - step: prepare_copy_database
      condition:
        type: always
    task:
      type: assert
      expr: 'steps.prepare_prepare_directory.outputs.exitCode == 0 && (has(steps.prepare_copy_process) ? steps.prepare_copy_process.status
        : "skipped") == "succeeded" && (has(steps.prepare_copy_database) ? steps.prepare_copy_database.status : "skipped")
        == "succeeded"'
      severity: high
      message: Database server action did not complete successfully.
  - name: policy_inspect_policy
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - -c
        - |-
          import runpy,sys
          sys.path.insert(0,sys.argv.pop(1))
          runpy.run_path(sys.argv.pop(1),run_name="__main__")
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database" }}
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/inspect_policy.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.server_create.vault, inputs.execution_secrets.server_create.key) }}
    allowFailure: true
    dependsOn:
    - step: prepare_prepared
      condition:
        type: succeeded
  - name: policy_policy_checked
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    dependsOn:
    - step: policy_inspect_policy
      condition:
        type: always
    - step: prepare_prepared
      condition:
        type: succeeded
    task:
      type: assert
      expr: (has(steps.policy_inspect_policy) && has(steps.policy_inspect_policy.outputs) && has(steps.policy_inspect_policy.outputs.exitCode)
        && steps.policy_inspect_policy.outputs.exitCode == 0)
      severity: high
      message: Database server action did not complete successfully.
  - name: policy_write_acl
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: policy_policy_checked
      condition:
        type: always
    - step: prepare_prepared
      condition:
        type: succeeded
    guard: '${{ !((has(steps.policy_policy_checked) ? steps.policy_policy_checked.status : "skipped") == "succeeded" && inputs.intent.driver
      == "redis" && steps.policy_inspect_policy.outputs.stdout == ''{"rebuild": true}\n'') }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - -c
        - |-
          import runpy,sys
          sys.path.insert(0,sys.argv.pop(1))
          runpy.run_path(sys.argv.pop(1),run_name="__main__")
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database" }}
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/write_acl.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.server_create.vault, inputs.execution_secrets.server_create.key) }}
    allowFailure: true
  - name: policy_acl_written
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    dependsOn:
    - step: policy_write_acl
      condition:
        type: always
    - step: prepare_prepared
      condition:
        type: succeeded
    task:
      type: assert
      expr: '(has(steps.policy_policy_checked) ? steps.policy_policy_checked.status : "skipped") == "succeeded" && ((has(steps.policy_write_acl)
        ? steps.policy_write_acl.status : "skipped") == "skipped" || (has(steps.policy_write_acl) && has(steps.policy_write_acl.outputs)
        && has(steps.policy_write_acl.outputs.exitCode) && steps.policy_write_acl.outputs.exitCode == 0))'
      severity: high
      message: Database server action did not complete successfully.
  - name: initial_inspect
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    guard: ${{ !(true) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - canonical
        - ''
        - inspect.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - canonical
        - running
        - 'false'
        - 'false'
        okExitCodes:
        - 0
        - 1
    allowFailure: true
    dependsOn:
    - step: policy_acl_written
      condition:
        type: succeeded
  - name: initial_plan
    target: orbit-node-209
    labels:
      node: '209'
    writes: false
    dependsOn:
    - step: initial_inspect
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/database-server-command-assets'
      behaviorName: ${{ "database-server-assets-" + run.id }}
      methodName: plan
      inputs:
        stdout: '${{ has(steps.initial_inspect.outputs) && has(steps.initial_inspect.outputs.stdout) ? steps.initial_inspect.outputs.stdout
          : "" }}'
        spec: ${{ inputs.intent.spec }}
  - name: initial_pull
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_plan
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && (steps.initial_plan.outputs.replace || !steps.initial_plan.outputs.present)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - canonical
        - ${{ inputs.intent.spec }}
        - pull_image.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - canonical
        - running
        - 'true'
        - 'false'
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.server_create.vault, inputs.execution_secrets.server_create.key) }}
    allowFailure: true
  - name: initial_create_candidate
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_pull
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && steps.initial_plan.outputs.replace && (has(steps.initial_pull) && has(steps.initial_pull.outputs)
      && has(steps.initial_pull.outputs.exitCode) && steps.initial_pull.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - candidate
        - ${{ inputs.intent.spec }}
        - create_container.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - canonical
        - running
        - 'true'
        - 'false'
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.server_create.vault, inputs.execution_secrets.server_create.key) }}
    allowFailure: true
  - name: initial_create_canonical
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_pull
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && !steps.initial_plan.outputs.present && (has(steps.initial_pull) && has(steps.initial_pull.outputs)
      && has(steps.initial_pull.outputs.exitCode) && steps.initial_pull.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - canonical
        - ${{ inputs.intent.spec }}
        - create_container.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - canonical
        - running
        - 'true'
        - 'false'
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.server_create.vault, inputs.execution_secrets.server_create.key) }}
    allowFailure: true
  - name: initial_retire_original
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_create_candidate
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && steps.initial_plan.outputs.replace && (has(steps.initial_create_candidate) && has(steps.initial_create_candidate.outputs)
      && has(steps.initial_create_candidate.outputs.exitCode) && steps.initial_create_candidate.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - canonical
        - '${{ has(steps.initial_plan.outputs) && has(steps.initial_plan.outputs.spec) ? steps.initial_plan.outputs.spec :
          "" }}'
        - rename_container.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - '${{ has(steps.initial_plan.outputs) ? steps.initial_plan.outputs.rollback_slot : "rollback-stopped" }}'
        - running
        - 'false'
        - 'false'
        okExitCodes:
        - 0
        - 1
    allowFailure: true
  - name: initial_stop_original
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_retire_original
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && steps.initial_plan.outputs.replace && (has(steps.initial_retire_original) && has(steps.initial_retire_original.outputs)
      && has(steps.initial_retire_original.outputs.exitCode) && steps.initial_retire_original.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - '${{ has(steps.initial_plan.outputs) ? steps.initial_plan.outputs.rollback_slot : "rollback-stopped" }}'
        - '${{ has(steps.initial_plan.outputs) && has(steps.initial_plan.outputs.spec) ? steps.initial_plan.outputs.spec :
          "" }}'
        - control.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - stop
        - canonical
        - running
        - 'false'
        - 'false'
        okExitCodes:
        - 0
        - 1
    allowFailure: true
  - name: initial_promote_candidate
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_stop_original
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && steps.initial_plan.outputs.replace && (has(steps.initial_stop_original) && has(steps.initial_stop_original.outputs)
      && has(steps.initial_stop_original.outputs.exitCode) && steps.initial_stop_original.outputs.exitCode == 0)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - candidate
        - ${{ inputs.intent.spec }}
        - rename_container.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - canonical
        - running
        - 'false'
        - 'false'
        okExitCodes:
        - 0
        - 1
    allowFailure: true
  - name: initial_start
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_plan
      condition:
        type: always
    - step: initial_create_canonical
      condition:
        type: always
    - step: initial_promote_candidate
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: ${{ !(true && ((steps.initial_plan.outputs.present && !steps.initial_plan.outputs.replace) || (has(steps.initial_create_canonical)
      && has(steps.initial_create_canonical.outputs) && has(steps.initial_create_canonical.outputs.exitCode) && steps.initial_create_canonical.outputs.exitCode
      == 0) || (has(steps.initial_promote_candidate) && has(steps.initial_promote_candidate.outputs) && has(steps.initial_promote_candidate.outputs.exitCode)
      && steps.initial_promote_candidate.outputs.exitCode == 0))) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - canonical
        - ${{ inputs.intent.spec }}
        - control.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - start
        - canonical
        - running
        - 'false'
        - 'false'
        okExitCodes:
        - 0
        - 1
    allowFailure: true
  - name: initial_restart_acl
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_start
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: '${{ !(true && (has(steps.initial_start) && has(steps.initial_start.outputs) && has(steps.initial_start.outputs.exitCode)
      && steps.initial_start.outputs.exitCode == 0) && inputs.intent.driver == "redis" && inputs.intent.was_active && !steps.initial_plan.outputs.replace
      && steps.policy_inspect_policy.outputs.stdout == ''{"rebuild": true}\n'') }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/database/process.py" }}
        - ${{ steps.prepare_database_assets.outputs.intent_json }}
        - canonical
        - ${{ inputs.intent.spec }}
        - control.py
        - ${{ "/tmp/orbit-database-server-" + string(inputs.operation_id) + "/process" }}
        - restart
        - canonical
        - running
        - 'false'
        - 'false'
        okExitCodes:
        - 0
        - 1
    allowFailure: true
  - name: initial_verify
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: initial_restart_acl
      condition:
        type: always
    - step: policy_acl_written
      condition:
        type: succeeded
    guard: '${{ !(true && (has(steps.initial_start) && has(steps.initial_start.outputs) && has(steps.initial_start.outputs.exitCode)
      && steps.initial_start.outputs.exitCode == 0) && ((has(steps.initial_restart_acl) ? steps.initial_restart_acl.status
      : "skipped") == "skipped" || (has(steps.initial_restart_acl) && has(steps.initial_restart_acl.outputs) && has(steps.initial_restart_acl.outputs.exitCode)
      && steps.initial_restart_acl.outputs.exitCode == 0))) }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-" + string(inputs.operation_id) }}
