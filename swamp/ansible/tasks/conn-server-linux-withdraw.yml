---
- name: Read the existing unit enablement
  ansible.builtin.command: { argv: [timeout, "20", systemctl, is-enabled, --, "{{ server.service }}"] }
  become: true
  changed_when: false
  failed_when: false
  register: withdrawal_enabled

- name: Refuse an enablement state that withdrawal cannot restore
  ansible.builtin.assert:
    that: (withdrawal_enabled.rc == 0 and withdrawal_enabled.stdout == 'enabled') or (withdrawal_enabled.rc == 1 and withdrawal_enabled.stdout == 'disabled')
    fail_msg: conn_server.withdraw_enablement_unsupported
    quiet: true

- name: Withdraw the service and its active release pointer
  when: not intent.dry_run
  block:
    - name: Send the notice before stopping the service
      when: server.notify_before_restart
      ansible.builtin.include_tasks: conn-server-notice.yml

    - name: Stop and unlink the verified service
      block:
        - name: Disable the unit before stopping it
          ansible.builtin.command: { argv: [systemctl, disable, --, "{{ server.service }}"] }
          when: withdrawal_enabled.stdout == 'enabled'
          changed_when: true
          become: true
          timeout: 60
        - name: Stop the disabled unit
          ansible.builtin.command: { argv: [systemctl, stop, --, "{{ server.service }}"] }
          changed_when: true
          become: true
          timeout: 120
        - name: Remove the active release link but keep the release as a backup
          ansible.builtin.command: { argv: [unlink, --, "{{ server.path }}"] }
          changed_when: true
          become: true
          timeout: 20
        - name: Verify that the unit is now inactive
          ansible.builtin.command: { argv: [timeout, "20", systemctl, is-active, --, "{{ server.service }}"] }
          become: true
          changed_when: false
          register: withdrawal_active
          failed_when: withdrawal_active.rc != 3 or withdrawal_active.stdout != 'inactive'
        - name: Verify that the old service no longer answers
          ansible.builtin.uri: { url: "{{ linux_health_url }}", use_proxy: false, return_content: true, timeout: 5 }
          register: withdrawn_health
          failed_when: (withdrawn_health.status | default(-1) | int) == 200 or withdrawn_health.json.server | default('') == 'conn-server'
          timeout: 20
        - name: Record the withdrawn Node and recovery release
          ansible.builtin.set_fact:
            node_result: { node_id: "{{ node_id | int }}", outcome: withdrawn, previous_version: "{{ linux_before.json.version }}" }
      rescue:
        - name: Restore the old health and enablement
          block:
            - name: Restore the old release and restart its unit
              ansible.builtin.include_tasks: conn-server-linux-start.yml
              vars:
                linux_target: "{{ linux_current.stat.lnk_source }}"
                expected_version: "{{ linux_before.json.version }}"
            - name: Restore the old unit enablement
              ansible.builtin.command: { argv: [systemctl, enable, --, "{{ server.service }}"] }
              when: withdrawal_enabled.stdout == 'enabled'
              changed_when: true
              become: true
              timeout: 20
            - name: Note whether the old server answers again
              ansible.builtin.set_fact:
                rolled_back: "{{ linux_health.json.version | default('') == linux_before.json.version }}"
          rescue:
            - name: Note failed withdrawal recovery
              ansible.builtin.set_fact: { rolled_back: false }
        - name: Report failure even if withdrawal recovery succeeded
          ansible.builtin.fail: { msg: conn_server.withdraw_failed }
