  - name: preflight_proven
    guard: ${{ !steps.admit.outputs.ready }}
    dependsOn:
    - step: preflight
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.preflight.outputs.ok
      message: The preflight recipe checkpoint refused its intent
      severity: high
