# Format: docs/reference/verification-cases.
# These cases run on the proof fleet as it is. The cases that move an Instance need a proof Node with the Instance pool and the
# container image, which the proof fleet does not build yet (docs/solutions/development-container-runtime.md, PR 4). Until then
# the Pest, Deno and Ansible fixture tests cover the move, and the live check on a build-list Node proves it.
# Retirement fixture coverage (ansible_instance_migrate_test.ts): dirty tracked/staged/deleted/renamed files refuse before
# downtime; all untracked files pass, copy into the container and report the count of untracked files that Git does not ignore (selected nested repository leaves included, no paths/content).
# Late ignored and non-ignored files do not refuse the move and remain in the retained checkout; submodule changes still refuse.
# Counts include archived untracked leaves inside nested repositories; directories do not count.
# Linked and detached worktrees refuse and name their paths.
# Target probes run in the container phase before quiesce; an unreachable SQL or Redis target leaves the awake marker,
# checkout and host Process states untouched. Restore deletes the failed container and its exact target rules only.
# Process fixtures stop and disable host units before copying, install private Process environments in the container,
# retire host files after cutover and restore recorded desired states only after removing a failed container.
# Preset fixture coverage: running/stopped vp-dev uses the same Process phases; rollback restores the host only after
# container removal. Pest covers preset identity/path/port projection, pre-downtime refusals, scoped ingress, deployment
# re-rendering and post-move controls. Live vp execution, HTTP/HMR and container networking remain unproved here.
# Schedule fixtures cover enabled/paused registered timers, current/agent/direct source units, exact observed activation
# rollback after container removal, and replacing only the admitted checkout-dependent services after cutover. The same UUID
# host timer remains as a Gateway trigger; real timer firing, Incus command execution and journald retention need fleet proof.
# Unpushed local branches and detached HEADs refuse with every name and commit count; stashes refuse with their count.
# Tag-only commits, an expired stash reflog, submodules/nested repositories and a worktree added after the final listing
# retain their Git data after retirement. Retirement atomically moves the whole checkout and never deletes metadata.
# Both path lists are bounded to 20 entries with total counts. New changes or worktrees after preflight refuse final retirement,
# keep every source intact, and leave the container serving. Late additions after the final listing are retained. A retained checkout (retire: []) is not deleted or checked.
# Source fixtures use real Git to prove a never-pushed branch at a pushed commit passes retirement and copies locally;
# the remote probe reads the Project default branch. gh_cli skips the App preflight and keeps the local-copy path.
command: instance:migrate
chart: instance/migrate
target: app-dev
sources: [gateway]
baseline: [operations]

uncovered:
  "code:source.github_app_denied": "Pest covers missing installation, excluded repository and no vault copy; Ansible covers later Git authentication refusal with the same safe App/repository message and no raw diagnostics."
  "code:source.github_unavailable": "Faked HTTP tests distinguish GitHub 5xx and timeout from missing installation; no live credential faults are injected."
  "code:source.read_timed_out": "One unprivileged Ansible fixture fakes timeout exit 124 with no sleep, proves the 30-second command bound and credential removal before any checkout change."
  "code:source.head_unavailable": "Ansible fixture covers a failed remote branch read before downtime."
  development-mail: "Real-Ansible fixtures execute the shared exact-line task after a fixture copy. Result fixtures prove a failed mail attempt records a warning without changing moved, ready or restored; the workflow orders both application starts after its bounded allowFailure phase."
  "code:instance.migrate_env_service_unreachable": "Environment policy fixtures cover loopback, stale addresses, exact attached targets, driver skips, prefixes, IPv6, quoted values, nested files and redaction. Ansible fixtures prove refusal before Process stop or marker removal; live migration requires the Instance pool/image."

  "code:schedule.container_trigger_unsupported": "Pest covers fixed native workflow refusal before reservation; migration live proof needs the Instance pool/image."
  "code:schedule.container_state_unsupported": "Pest covers inactive, removing, misplaced and busy Schedules before downtime."
  "code:schedule.container_account_unsupported": "Pest covers missing and unsupported container accounts before reservation."
  "code:schedule.container_shell_unsupported": "Pest covers unsupported shell before reservation."
  "code:schedule.container_path_unsupported": "Pest covers external or dot-segment working directories before reservation."
  "code:schedule.container_command_unsupported": "Pest covers external command paths and commands that cannot be mapped literally."
  "code:schedule.container_artifact_unsupported": "Ansible fixtures cover missing, foreign and changed units and unstable timer/service states before downtime."
  "code:process.container_preset_unsupported": "Pest covers unknown presets, versions and options before runtime reservation; the proof fleet lacks the Instance pool/image for migration cases."
  "code:process.container_command_unsupported": "Pest covers custom commands beside the preset, including the bypass regression before runtime reservation; the proof fleet lacks the Instance pool/image for migration cases."
  "code:process.container_path_unsupported": "Pest covers external cwd, environment files and absolute environment values, including traversal before runtime reservation; the proof fleet lacks the Instance pool/image for migration cases."
  "code:process.container_port_conflict": "Pest covers missing/reserved ports, duplicate presets and recorded Process port conflicts before runtime reservation; the proof fleet lacks the Instance pool/image for migration cases."
  "code:instance.migrate_symlink_unsupported": "The proof fleet lacks the Instance pool/image. Python and Ansible fixtures cover absolute in-checkout rewrites, exact relative-link preservation, dependency package links, unchanged installed package contents, non-UTF-8 names and targets, and named external/broken-link refusals before downtime and after archive-time changes without changing the source."
  "code:instance.migrate_retirement_blocked": "The proof fleet lacks the Instance pool/image. Ansible fixtures cover dirty tracked files, linked/detached and same-batch worktrees, bounded named errors, and blockers added after preflight. Live proof uses owned clean fixtures and separate blocker fixtures when the pool is available."

  "code:instance.migrate_unpushed_commits": "Ansible fixtures cover every local branch and a detached HEAD, counts against all local remote-tracking refs, and source preservation. Live proof needs the Instance pool/image."
  "code:instance.migrate_stashes_present": "Ansible fixtures cover multiple stash entries, their count and source preservation. Live proof needs the Instance pool/image."

cases:
  - id: invalid-id
    batch: fresh-fleet
    covers: []
    summary: A nonpositive or noninteger Instance ID is refused locally, before any request.
    variants:
      - {name: zero, value: "0"}
      - {name: name, value: default}
      - {name: fractional, value: "1.5"}
    act:
      - cli:
          run: [instance:migrate, "${value}", --force]
          forms: [json, human]
          expect: {exit: 1, code: instance.id_invalid, request: none}
    expect:
      - unchanged: {since: act, what: [operations]}

  - id: unknown-instance
    batch: fresh-fleet
    covers: []
    summary: An unknown Instance ID is refused without creating an Operation.
    act:
      - cli:
          run: [instance:migrate, "2147483647", --force]
          forms: [json, human]
          expect: {exit: 1, code: http.404, request: none}
    expect:
      - unchanged: {since: act, what: [operations]}
