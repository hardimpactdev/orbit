id: 1aa9bc3f-6c22-4b27-8742-e0a8620da06b
name: operation-instance-environment
description: Write one Instance's Gateway-rendered .env (0640, group orbit-env) and .env.testing from the vault with the official file behavior, check them, and refresh a production runtime.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [instance.sync_environment]}
    intent:
      type: object
      properties:
        # The public plan: account, directory, key names and the sha256 of each rendered file.
        environment:
          type: object
          properties:
            instance_id: {type: integer, minimum: 1}
            environment: {type: string, enum: [development, production]}
            base: {type: string, pattern: '^/'}
            user: {type: string, pattern: '^[a-z_][a-z0-9_-]{0,31}$'}
            keys: {type: array, items: {type: string}}
            owned_keys: {type: array, items: {type: string}}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            testing: {default: null}  # null, or the sha256 of .env.testing and its test database
          required: [instance_id, environment, base, user, keys, owned_keys, sha256, testing]
          additionalProperties: false
        # Production only: the config cache, the PHP-FPM service and the Processes to restart.
        runtime: {default: null}
        ssh_execution: {type: object}
      required: [environment, runtime, ssh_execution]
      additionalProperties: false
    # environment always; testing when the Gateway rendered .env.testing.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^instance-environment-(?:testing-)?[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: environment
  labels: {role: swamp}
  steps:
    # The .env is group orbit-env, so the Node agent can report its key names; Swamp checks for foreign keys no more,
    # because admission did from those names.
  - name: 'Create the orbit-env group'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/group'
      behaviorName: ${{ "instance-environment-group-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {groupname: orbit-env, ensure: present, system: true, nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}',
        nodePort: '${{ inputs.intent.ssh_execution.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true}
      inputs: {}
    # .env always; .env.testing when the Gateway rendered one: Git does not track it. The account writes each 0640 in
    # its own directory, so no root write follows a link the account placed.
  - name: 'Write .env, .env.testing'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Create the orbit-env group', condition: {type: succeeded}}]
    forEach:
      item: file
      in: '${{ [{"name": ".env", "secret": inputs.execution_secrets.environment}] + ("testing" in inputs.execution_secrets ? [{"name": ".env.testing", "secret": inputs.execution_secrets.testing}] : []) }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "instance-environment-file-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.environment.user }}
        path: ${{ inputs.intent.environment.base + "/" + self.file.name }}
        ensure: present
        mode: '0640'
        content: ${{ vault.get(self.file.secret.vault, self.file.secret.key) }}
      inputs: {}
    # Root changes only the group, and -h never follows a link, so the Node agent's orbit-env group may read the key names.
  - name: 'Set the group orbit-env'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Write .env, .env.testing', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-environment-group-file-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-environment-group-file-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: '${{ ["/usr/bin/sudo", "-n", "--", "/usr/bin/timeout", "30", "/usr/bin/chgrp", "-h", "orbit-env", "--", inputs.intent.environment.base + "/.env"] + ("testing" in inputs.execution_secrets ? [inputs.intent.environment.base + "/.env.testing"] : []) }}'
        timeoutSec: 40
  - name: 'Check the written file'
    labels: {role: swamp}
    dependsOn: [{step: 'Set the group orbit-env', condition: {type: succeeded}}]
    task:
      type: assert
      expr: 'data.latest("instance-environment-file-" + string(inputs.node_id) + "-0", inputs.intent.ssh_execution.target.host).attributes.current.contentSha256 == inputs.intent.environment.sha256 && (inputs.intent.environment.testing == null || data.latest("instance-environment-file-" + string(inputs.node_id) + "-1", inputs.intent.ssh_execution.target.host).attributes.current.contentSha256 == inputs.intent.environment.testing.sha256)'
      message: A written file differs from the rendered one.
      severity: high
    # Production only, in order: the config cache when the release has one, the PHP-FPM reload, then each Process that restarts on deploy.
    # An uncached release stays uncached; without a current release the cache is skipped.
  - name: 'Refresh the runtime'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Check the written file', condition: {type: succeeded}}]
    forEach:
      item: action
      in: '${{ inputs.intent.runtime == null ? [] : (inputs.intent.runtime.config == null ? [] : [["/usr/bin/sudo", "-n", "--user", inputs.intent.runtime.config.user, "--", "/usr/bin/timeout", "120", "/bin/sh", "-c", "cd -- \"$1\" 2>/dev/null || exit 0; [ ! -f bootstrap/cache/config.php ] || exec \"$2\" artisan config:cache --no-interaction", "sh", inputs.intent.runtime.config.application, "/usr/bin/php" + inputs.intent.runtime.config.version]]) + (inputs.intent.runtime.fpm_service == null ? [] : [["/usr/bin/sudo", "-n", "--", "/usr/bin/timeout", "60", "/usr/bin/systemctl", "reload", inputs.intent.runtime.fpm_service]]) + inputs.intent.runtime.processes.map(p, p.runtime == "docker" ? ["/usr/bin/sudo", "-n", "--", "/usr/bin/timeout", "120", "/usr/bin/docker", "restart", p.name] : ["/usr/bin/sudo", "-n", "--", "/usr/bin/timeout", "120", "/usr/bin/systemctl", "restart", p.name]) }}'
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-environment-refresh-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-environment-refresh-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: ${{ self.action }}
        timeoutSec: 150
