id: b5f10569-2322-44e2-8c42-312374dc2b1d
name: node-role-websocket
vaults:
  - orbit-control-inputs
inputs:
  type: object
  properties:
    runtime:
      type: object
    ssh:
      type: object
    material:
      type: object
      properties: {vault: {type: string, enum: [orbit-control-inputs]}, key: {type: string}}
      required: [vault, key]
      additionalProperties: false
  required:
    - runtime
    - ssh
    - material
  additionalProperties: false
jobs:
  - name: runtime
    steps:
      - {name: assets, task: {type: behavior, behaviorType: '@nckrtl/node-role-runtime-assets', behaviorName: '${{ "websocket-assets-"+run.id }}', methodName: bundle, inputs: {runtime: '${{ inputs.runtime }}', run_id: '${{ run.id }}'}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: prepare_assets, dependsOn: [{step: assets, condition: {type: succeeded}}], writes: true, task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: &ref_0 {name: '${{ "websocket-"+run.id }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}', transport: {hostKeys: '${{ inputs.ssh.target.host_keys }}'}}]}, inputs: {hosts: 'name:target', argv: [/usr/bin/timeout, '30', /usr/bin/mkdir, '-p', '${{ "/tmp/orbit-websocket-"+run.id }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: copy_assets, dependsOn: [{step: prepare_assets, condition: {type: succeeded}}], writes: true, task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: copy, globalArgs: *ref_0, inputs: {hosts: 'name:target', src: '${{ steps.assets.outputs.scripts_directory+"/." }}', dst: '${{ "/tmp/orbit-websocket-"+run.id }}', direction: to, recursive: true}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: account, writes: true, dependsOn: [{step: copy_assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '30', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_account.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: checkout, writes: true, dependsOn: [{step: account, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '120', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_checkout.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: dependencies, writes: true, dependsOn: [{step: checkout, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '300', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_dependencies.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: environment, writes: true, dependsOn: [{step: dependencies, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '60', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_environment.py" }}'], stdin: '${{ vault.get(inputs.material.vault,inputs.material.key) }}'}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: unit, writes: true, dependsOn: [{step: environment, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '30', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_unit.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: activation, writes: true, dependsOn: [{step: unit, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '45', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_activation.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: verify, writes: true, dependsOn: [{step: activation, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '15', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_verify.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: restore, writes: true, dependsOn: [{step: activation, condition: {type: always}}, {step: verify, condition: {type: always}}], guard: '${{ ("account" in steps ? steps["account"].status : "skipped") != "succeeded" || !(("activation" in steps ? steps["activation"].status : "skipped") in ["failed","cancelled"] || ("verify" in steps ? steps["verify"].status : "skipped") in ["failed","cancelled"]) }}', task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '60', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_restore.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: cleanup, writes: true, dependsOn: [{step: account, condition: {type: always}}, {step: checkout, condition: {type: always}}, {step: dependencies, condition: {type: always}}, {step: environment, condition: {type: always}}, {step: unit, condition: {type: always}}, {step: activation, condition: {type: always}}, {step: verify, condition: {type: always}}, {step: restore, condition: {type: always}}], guard: '${{ ("account" in steps ? steps["account"].status : "skipped") != "succeeded" }}', task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "websocket-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/timeout, '30', /usr/bin/env, '${{ "ORBIT_ROLE_INPUT="+steps.assets.outputs.input_json }}', '${{ "ORBIT_ROLE_ACCOUNT="+steps.account.outputs.stdout }}', '${{ "ORBIT_ROLE_RETAIN_CANDIDATE="+string(("activation" in steps ? steps["activation"].status : "skipped") in ["succeeded","failed","cancelled"]) }}', /usr/bin/python3, '-B', '${{ "/tmp/orbit-websocket-"+run.id+"/phase_cleanup.py" }}']}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: result, dependsOn: [{step: assets, condition: {type: always}}, {step: prepare_assets, condition: {type: always}}, {step: copy_assets, condition: {type: always}}, {step: account, condition: {type: always}}, {step: checkout, condition: {type: always}}, {step: dependencies, condition: {type: always}}, {step: environment, condition: {type: always}}, {step: unit, condition: {type: always}}, {step: activation, condition: {type: always}}, {step: verify, condition: {type: always}}, {step: restore, condition: {type: always}}, {step: cleanup, condition: {type: always}}], task: {type: behavior, behaviorType: '@nckrtl/node-role-runtime-assets', behaviorName: '${{ "websocket-result-"+run.id }}', methodName: complete, inputs: {node_id: '${{ inputs.runtime.node_id }}', assignment_id: '${{ inputs.runtime.assignment_id }}', statuses: {account: '${{ ("account" in steps ? steps["account"].status : "skipped") }}', checkout: '${{ ("checkout" in steps ? steps["checkout"].status : "skipped") }}', dependencies: '${{ ("dependencies" in steps ? steps["dependencies"].status : "skipped") }}', environment: '${{ ("environment" in steps ? steps["environment"].status : "skipped") }}', unit: '${{ ("unit" in steps ? steps["unit"].status : "skipped") }}', activation: '${{ ("activation" in steps ? steps["activation"].status : "skipped") }}', verify: '${{ ("verify" in steps ? steps["verify"].status : "skipped") }}', restore: '${{ ("restore" in steps ? steps["restore"].status : "skipped") }}', cleanup: '${{ ("cleanup" in steps ? steps["cleanup"].status : "skipped") }}'}}}, target: orbit-node-209, queueTimeout: 30, allowFailure: true}
      - {name: proven, dependsOn: [{step: result, condition: {type: succeeded}}], task: {type: assert, expr: steps.result.outputs.completed, severity: high, message: Every required WebSocket phase must complete}, target: orbit-node-209, queueTimeout: 30}
