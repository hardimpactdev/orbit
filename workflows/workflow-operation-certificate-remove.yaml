id: eabb9794-3ff8-4ee9-a7bb-52172837668b
name: operation-certificate-remove
description: Remove an admitted certificate with native local steps.
writes: true
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - certificate.remove
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: certificate
  steps:
  - name: admit
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificate-node-" + string(inputs.node_id) }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  - name: remove
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: admit
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificate-node-" + string(inputs.node_id) }}
      methodName: remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaf: ${{ steps.admit.outputs.intent.leaf }}
        cancelled: ${{ steps.admit.outputs.intent.cancelled }}
  - name: inspect
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: remove
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificate-node-" + string(inputs.node_id) }}
      methodName: inspect
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaf:
          node_id: ${{ steps.admit.outputs.intent.leaf.node_id }}
          scope: ${{ steps.admit.outputs.intent.leaf.scope }}
          user: ${{ steps.admit.outputs.intent.leaf.user }}
          agent_sha256: ${{ steps.admit.outputs.intent.leaf.agent_sha256 }}
        previous: ${{ steps.remove.outputs.applied }}
  - name: project
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificate-node-" + string(inputs.node_id) }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        presence: ${{ steps.inspect.outputs.presence }}
- name: terminal-failure
  dependsOn:
  - job: certificate
    condition:
      type: or
      conditions:
      - type: failed
      - type: skipped
  steps:
  - name: report-native-failure
    writes: true
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: certificate-cluster-failure
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
