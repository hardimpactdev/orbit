id: a3b12de3-0faa-4465-8843-1b9af60794a2
name: operation-proof-run
description: >-
  Prove assigned whole batches of a commit on a task VM slot of its own, from full inputs on 209: the claim of the slot, the cases of the
  command through proof-fleet-verify, and the release of the slot, always. No step calls the Gateway.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: proof.command}
    intent:
      type: object
      properties:
        provision: {type: object}
        verify: {type: object}
        verifications: {type: array, minItems: 1, items: {type: object}}
        cancel:
          type: object
          properties:
            node_id: {type: integer, minimum: 1}
            intent: {type: object}
            execution_secrets: {type: object, additionalProperties: false}
          required: [node_id, intent, execution_secrets]
          additionalProperties: false
      required: [provision, verify, verifications, cancel]
      additionalProperties: false
    execution_secrets:
      type: object
      # The slot's identity, which the start writes onto the new VM; and the claim: the Pi token and the models file with the
      # fixed model key.
      properties:
        wireguard: &secret
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^(task-vm-slot-(wireguard|ssh-host|agent)-[1-9][0-9]*)$'}
          required: [vault, key]
          additionalProperties: false
        ssh_host: *secret
        agent_secret: *secret
        claim:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-pi-claim-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [wireguard, ssh_host, agent_secret, claim]
      additionalProperties: false
    # `proof:run --keep-failed`: a run that did not succeed in every part, a failed setup included, keeps its VM (the Gateway destroys it 60 minutes later).
    keep_failed: {type: boolean}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prove
  labels: {role: swamp}
  steps:
  # Stage 2: the same claim every task uses. Its input is the one the Gateway captured at admission.
  - name: Claim a slot
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: operation-task-provision
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: tasks.provision
        intent: ${{ inputs.intent.provision }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: Read the workspace commit
    labels: {role: swamp}
    dependsOn:
    - step: Claim a slot
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-run-workspace-" + string(inputs.intent.verify.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("proof-run-workspace-" + string(inputs.intent.verify.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.verify.ssh_execution.target.user }}'
          port: '${{ inputs.intent.verify.ssh_execution.target.port }}'
          identityFile: '${{ inputs.intent.verify.ssh_execution.identity_file }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.verify.ssh_execution.target.host }}'
          transport:
            hostKeys: '${{ inputs.intent.verify.ssh_execution.target.host_keys }}'
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 30
        argv:
        - timeout
        - '20'
        - git
        - -C
        - '${{ inputs.intent.verify.checkout_path }}'
        - rev-parse
        - HEAD
  # The Gateway records the failure of this step as `proof.workspace_commit_mismatch`, with the commit that the read printed.
  - name: Check the workspace commit
    labels: {role: swamp}
    dependsOn:
    - step: Read the workspace commit
      condition:
        type: succeeded
    task:
      type: assert
      expr: 'steps["Read the workspace commit"].outputs.stdout.trim() == inputs.intent.verify.head'
      severity: high
      message: The workspace of the proof VM is not at the commit under proof
  # Stage 3: the cases of this one command, in batches. The child succeeds whatever the verdicts are; the report holds them.
  - name: Prove assigned batches
    forEach: {item: verify, in: '${{ inputs.intent.verifications }}'}
    concurrency: 1
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: Check the workspace commit
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: proof-fleet-verify
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: '${{ inputs.intent.verify.node_id }}'
        kind: proof.verify
        intent: '${{ self.verify }}'
        execution_secrets: {}
  # Always, also after a failure: the VM is deleted. The Gateway captured this input with the claim.
  # A guard that is true SKIPS the step (Swamp: "a truthy result skips the step"). With `keep_failed`, a run that did not succeed in every part (claim, cases,
  # every verdict) skips it; the Gateway keeps the group and cancels it after 60 minutes.
  - name: Release the slot
    labels: {role: swamp}
    writes: true
    guard: '${{ inputs.?keep_failed.orValue(false) && !(steps[?"Claim a slot"].?status.orValue("") == "succeeded" && inputs.intent.verifications.all(v, v.step in steps && steps[v.step].status == "succeeded" && steps[v.step].?outputs.?report.?stdout.orValue("").trim() != "" && steps[v.step].outputs.report.stdout.trim().split("\n").filter(l, l != "").all(l, l.contains("\"verdict\": \"passed\"")))) }}'
    dependsOn:
    - step: Claim a slot
      condition: &always
        type: always
    - step: Prove assigned batches
      condition: *always
    task:
      type: workflow
      workflowIdOrName: operation-task-cancel
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.intent.cancel.node_id }}
        kind: tasks.cancel
        intent: ${{ inputs.intent.cancel.intent }}
        execution_secrets: ${{ inputs.intent.cancel.execution_secrets }}
  # The verdict lines of the command, one JSON object a line. The Gateway reads this step once, when the run ends.
  - name: Report
    labels: {role: swamp}
    dependsOn:
    - step: Release the slot
      condition: *always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "proof-run-report-" + string(inputs.intent.verify.node_id) }}'
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$LINES"
        env:
          LINES: '${{ inputs.intent.verifications.map(v, v.step in steps ? steps[v.step].?outputs.?report.?stdout.orValue("").trim().split("\n").filter(l, l != "").map(l, v.command + "\t" + v.file + "\t" + v.batch + "\t" + l).join("\n") : "").filter(l, l != "").join("\n") }}'
