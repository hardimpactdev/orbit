id: 8e4d2b71-3c59-4a0e-b6d8-7f1a93c05e22
name: proof-fleet-verify-batch
description: One batch of proof cases on the task VM or in a task copy. The restore of `base` (a VM) or the reset of the copy's inner fleet, the batch setup, then one runner step for all its cases (several at a time, the ones that run alone last), then one report of the verdict lines.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    ssh_execution:
      type: object
    checkout_path:
      type: string
    group_id:
      type: integer
      minimum: 1
    file:
      type: string
    # Empty on a task VM. In a task copy: `incus exec` into the copy and `runuser -u agent`, run as root on the copy's Node.
    runner_prefix:
      type: array
      items:
        type: string
    # The name of the SSH behavior that runs the setup and the batch. Swamp locks a behavior by name for the whole step, and a
    # second run waits 60 s for it and then fails. On a task VM the fleet is the host's one fleet, so the name is the Node's. In a
    # task copy the steps act only inside that copy, so the name is the copy's and proofs in two copies on one Node run side by side.
    ssh_name:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    batch:
      type: string
    setup:
      type: boolean
    restore:
      type: boolean
    # In a task copy whose intent sets `restore_first`: {container, fleet, ssh_execution} for the reset of its inner fleet. Empty
    # otherwise.
    reset:
      type: object
    cases:
      type: array
      items:
        type: string
      minItems: 1
  required:
  - ssh_execution
  - checkout_path
  - group_id
  - file
  - runner_prefix
  - ssh_name
  - batch
  - setup
  - reset
  - cases
  additionalProperties: false
jobs:
- name: start
  labels: {role: swamp}
  steps:
  # On a task VM each batch but the first starts from the `base` snapshot of the fleet: restore, then apply the checkout, then the batch setup. A restore that fails stops the batch.
  - name: restore
    labels: {role: swamp}
    # A task copy resets its fleet in `reset` instead.
    guard: '${{ !(has(inputs.restore) && inputs.restore) || size(inputs.runner_prefix) > 0 }}'
    allowFailure: true
    writes: true
    task:
      type: workflow
      workflowIdOrName: proof-fleet-restore
      inputs:
        ssh_execution: ${{ inputs.ssh_execution }}
  # In a task copy every batch, the first included, starts from `base`: the reset of the copy's inner fleet, from its Node. A reset that fails stops the batch.
  - name: reset
    labels: {role: swamp}
    guard: '${{ !(has(inputs.restore) && inputs.restore) || size(inputs.reset) == 0 }}'
    allowFailure: true
    writes: true
    task:
      type: workflow
      workflowIdOrName: proof-copy-fleet-reset
      inputs:
        intent: ${{ inputs.reset }}
  # A copy batch that asks for a start from `base` but has no reset (a run that an older Gateway admitted) does not start: its start state is unknown, so its cases are unrun.
  - name: setup
    labels: {role: swamp}
    guard: '${{ has(inputs.restore) && inputs.restore && size(inputs.runner_prefix) > 0 && size(inputs.reset) == 0 }}'
    allowFailure: true
    dependsOn:
    - step: restore
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: reset
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh_name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh_name }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 480
        sudo: '${{ size(inputs.runner_prefix) > 0 }}'
        argv: '${{ inputs.runner_prefix + ["python3", inputs.checkout_path + "/swamp/proof/runner/runner.py", "setup", inputs.batch, "--file", inputs.checkout_path + "/" + inputs.file, "--evidence", inputs.checkout_path + "/.orbit-artifacts/" + string(inputs.group_id) + "/verify"] }}'
- name: cases
  labels: {role: swamp}
  dependsOn:
  - job: start
    condition: {type: completed}
  steps:
  # One step runs the batch: the runner reads the fleet once, runs the cases that share the fleet several at a time (the cases file sets how many), then the
  # cases that run alone. It prints one verdict line a case, the ones that did not pass first. A failed restore, reset or setup (this batch's start) skips it.
  # A case that did not pass triggers no restore: cases use their own resources, and the next batch restores anyway.
  - name: batch
    labels: {role: swamp}
    guard: '${{ steps.?restore.?status.orValue("") == "failed" || steps.?reset.?status.orValue("") == "failed" || !steps.?setup.?outputs.?stdout.orValue("").contains("\"setup\": \"ok\"") }}'
    allowFailure: true
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh_name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh_name }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 3600
        sudo: '${{ size(inputs.runner_prefix) > 0 }}'
        argv: '${{ inputs.runner_prefix + ["python3", inputs.checkout_path + "/swamp/proof/runner/runner.py", "batch", inputs.batch, "--file", inputs.checkout_path + "/" + inputs.file, "--evidence", inputs.checkout_path + "/.orbit-artifacts/" + string(inputs.group_id) + "/verify", "--only", inputs.cases.join(" ")] }}'
- name: report
  labels: {role: swamp}
  dependsOn:
  - job: cases
    condition: {type: completed}
  steps:
  # The verdict lines of the batch. A case with no line gets one of its own, so every case has one: unrun when the batch step printed nothing (the batch was
  # stopped before it), failed when it printed lines but none for the case (the runner stopped, or the output was cut).
  # When the reset of a copy's fleet failed, the line says so with the reset's reason (its `reason=` line: safe to show, at most 300
  # characters, no quote or backslash), so the author sees why the batch did not run.
  - name: report
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "proof-verify-batch-report" }}
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$LINES"
        env:
          LINES: '${{ [steps.?batch.?outputs.?stdout.orValue("").split("\n").map(l, l.trim()).filter(l, l.contains("\"verdict\""))].map(got, (got.join("\n") + inputs.cases.filter(c, !got.exists(l, l.contains("\"id\": \"" + c + "\""))).map(c, "\n{\"id\": \"" + c + "\", \"verdict\": \"" + (size(got) == 0 ? "unrun" : "failed") + "\", \"cause\": \"infrastructure\", \"secs\": 0, \"failed\": [\"" + (size(got) == 0 ? (steps.?reset.?status.orValue("") == "failed" ? "run stopped: the fleet reset failed" + [steps.?reset.?outputs.?result.?stdout.orValue("").split("\n").filter(l, l.startsWith("reason="))].map(r, size(r) > 0 ? ": " + r[0].split("reason=", 2)[1] : "")[0] : "run stopped: the batch setup did not succeed") : "the case printed no verdict") + "\"]}").join("")).trim())[0] }}'
