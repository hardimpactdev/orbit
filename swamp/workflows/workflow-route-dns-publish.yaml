id: 3aca13ae-e8bb-40b4-bc14-072b4c7e435d
name: route-dns-publish
queueTimeout: 30
description: Apply a full public Route DNS snapshot with official file and service
  actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: dns
  steps:
  - name: read-records
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-read-records-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-dns-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - sudo
        - /usr/bin/cat
        - /etc/dnsmasq.d/orbit-records.conf
  - name: read-catalog
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-read-catalog-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - sudo
        - /usr/bin/cat
        - /var/lib/orbit/private-dns/catalog.json
    dependsOn:
    - step: read-records
      condition:
        type: succeeded
  - name: compose
    labels: {role: swamp}
    dependsOn:
    - step: read-catalog
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: ${{ "route-dns-compose-" + run.id }}
      methodName: dns
      inputs:
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        alternatives: ${{ inputs.intent.alternatives }}
        current:
          records: ${{ steps["read-records"].outputs.stdout }}
          catalog: ${{ steps["read-catalog"].outputs.stdout }}
  - name: catalog-directory
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-catalog-directory-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/mkdir
        - -p
        - -m
        - '0755'
        - /var/lib/orbit/private-dns
        sudo: true
    dependsOn:
    - step: compose
      condition:
        type: succeeded
  - name: records
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-records-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - 'set -eu

          /usr/bin/install -m 0644 -o root -g root /dev/null "$1"

          /usr/bin/cat > "$1"'
        - route-file
        - /etc/dnsmasq.d/orbit-records.conf
        stdin: ${{ steps.compose.outputs.records }}
        sudo: true
    dependsOn:
    - step: catalog-directory
      condition:
        type: succeeded
  - name: catalog
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-catalog-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - 'set -eu

          /usr/bin/install -m 0644 -o root -g root /dev/null "$1"

          /usr/bin/cat > "$1"'
        - route-file
        - /var/lib/orbit/private-dns/catalog.json
        stdin: ${{ steps.compose.outputs.catalog }}
        sudo: true
    dependsOn:
    - step: records
      condition:
        type: succeeded
  - name: validate
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-validate-" + run.id }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - sudo
        - /usr/sbin/dnsmasq
        - --test
      globalArgs: *id001
    dependsOn:
    - step: catalog
      condition:
        type: succeeded
  - name: restart-backend
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-restart-backend-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - restart
        - dnsmasq
        sudo: true
    dependsOn:
    - step: validate
      condition:
        type: succeeded
  - name: listener
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-listener-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - enable
        - --now
        - orbit-private-dns.socket
        sudo: true
    dependsOn:
    - step: restart-backend
      condition:
        type: succeeded
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-dns-result-" + run.id }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' ''{"ready":true}''

          '
    dependsOn:
    - step: listener
      condition:
        type: succeeded
