id: 21853e24-9096-4770-90e9-31c385c71e51
name: operation-task-check
autoContinue: false
description: Run the check in the group's task copy through its Instance workspace phases.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: tasks.check}
    intent:
      type: object
      required: [workspace]
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: check
  labels: {role: swamp}
  steps:
  - name: Check in the Instance
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-instance-check
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        run_id: ${{ run.id }}
  - name: Read the result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-turn-data'
      behaviorName: '${{ ("task-check-read-result-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: checked
      inputs:
        result_json: '${{ "Check in the Instance" in steps && "outputs" in steps["Check in the Instance"] && "finish" in steps["Check in the Instance"].outputs ? steps["Check in the Instance"].outputs.finish.result_json : "" }}'
    dependsOn:
    - step: Check in the Instance
      condition:
        type: always
  - name: Check the result
    labels: {role: swamp}
    task:
      type: assert
      expr: '"Check in the Instance" in steps && "outputs" in steps["Check in the Instance"] && "finish" in steps["Check in the Instance"].outputs && !("error_code" in steps["Check in the Instance"].outputs.finish.result)'
      message: The task check could not complete its repository work.
      severity: high
    dependsOn:
    - step: Read the result
      condition:
        type: always
