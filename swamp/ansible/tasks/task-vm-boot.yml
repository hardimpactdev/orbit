---
# How the base VM and every task VM copied from it boot (docs/cli/tasks/vm-image-refresh.mmd). A task start boots a copy of the base
# snapshot, so the boot does no first-boot work: cloud-init is off, the orbit account keeps the key of the Swamp control Node, and sshd
# makes its host keys only when none exist. A task start puts its identity on an identity volume, which orbit-identity applies at boot
# before sshd starts (docs/cli/tasks/provision.mmd).
- name: Turn cloud-init off
  ansible.builtin.copy: { dest: /etc/cloud/cloud-init.disabled, content: "", mode: "0644" }
- name: Make the SSH folder of orbit
  ansible.builtin.file: { path: "{{ orbit_home }}/.ssh", state: directory, owner: "{{ orbit_user }}", group: "{{ orbit_user }}", mode: "0700" }
- name: Keep the key of the Swamp control Node
  ansible.builtin.copy:
    dest: "{{ orbit_home }}/.ssh/authorized_keys"
    content: "{{ intent.boot.authorized_key }}\n"
    owner: "{{ orbit_user }}"
    group: "{{ orbit_user }}"
    mode: "0600"
# Every copy of the base has the base's machine-id, from which networkd makes its DHCP client ID, so copies started at once got one address
# (provision 12863). Incus gives each copy its own MAC, so the client ID is the MAC. It takes effect at the next boot, which is how copies start.
- name: Make the folder of the network drop-ins
  ansible.builtin.file: { path: /etc/systemd/network/00-orbit-task-vm.network.d, state: directory, mode: "0755" }
- name: Ask for an address by the MAC
  ansible.builtin.copy:
    dest: /etc/systemd/network/00-orbit-task-vm.network.d/orbit-client-id.conf
    mode: "0644"
    content: |
      [DHCPv4]
      ClientIdentifier=mac
- name: Make the folder of the sshd drop-ins
  ansible.builtin.file: { path: /etc/systemd/system/ssh.service.d, state: directory, mode: "0755" }
# The unit runs `sshd -t` before it starts; with no host key that check fails, so the keys are made first.
- name: Make missing SSH host keys before sshd starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/orbit-host-keys.conf
    mode: "0644"
    content: |
      [Service]
      ExecStartPre=
      ExecStartPre=/usr/bin/ssh-keygen -A
      ExecStartPre=/usr/sbin/sshd -t
# A task start puts the VM's identity on an identity volume, which the Incus agent mounts at /run/orbit-identity (task-vm-host.yml). This
# unit applies it at boot, before sshd, WireGuard and the agent start, so the start never writes into a running VM. The base VM has no
# identity volume; the agent's mount list says so, and the unit ends at once.
- name: Make the group of the environment files
  ansible.builtin.group: { name: orbit-env, system: true }
- name: Install the identity script
  ansible.builtin.copy:
    dest: /usr/local/sbin/orbit-identity
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      # A VM applies its identity once; a parked VM that starts again keeps what it has.
      applied=/var/lib/orbit/identity-applied
      [ -e "$applied" ] && exit 0
      mounts=/run/incus_agent/agent-mounts.json
      for i in $(seq 300); do [ -e "$mounts" ] && break; sleep 0.1; done
      grep -q '"/run/orbit-identity"' "$mounts" 2>/dev/null || exit 0
      for i in $(seq 300); do mountpoint -q /run/orbit-identity && break; sleep 0.1; done
      mountpoint -q /run/orbit-identity
      install -d -m 0700 -o orbit -g orbit /home/orbit/.pi /home/orbit/.pi/agent
      # Files keep the owner and mode the start gave them; directories that exist keep theirs.
      tar -C /run/orbit-identity -cf - . | tar -C / -xpf - --no-overwrite-dir --numeric-owner
      umount /run/orbit-identity
      . /etc/orbit/identity.env
      hostname "$ORBIT_HOSTNAME"
      update-ca-certificates > /dev/null
      # SSH over WireGuard answers only the Swamp Node; Pi answers it and the Gateway; a served workspace answers on 443.
      ufw prepend deny in on orbit proto tcp to any port 22 comment orbit:task-vm-ssh-only > /dev/null
      ufw prepend allow in on orbit proto tcp from "$ORBIT_CONTROL_IP" to any port 22 comment orbit:task-vm-ssh-209 > /dev/null
      ufw allow in on orbit proto tcp from "$ORBIT_CONTROL_IP" to any port "$ORBIT_PI_PORT" comment orbit:task-vm-pi-209 > /dev/null
      ufw allow in on orbit proto tcp from "$ORBIT_GATEWAY_IP" to any port "$ORBIT_PI_PORT" comment orbit:task-vm-pi-gateway > /dev/null
      ufw allow in on orbit proto tcp to any port 443 comment orbit:task-vm-site > /dev/null
      systemctl daemon-reload
      # They are ordered after this unit, so they start when it ends.
      systemctl --no-block enable --now wg-quick@orbit.service orbit-agent.service "$ORBIT_PI_UNIT"
      install -D -m 0644 /dev/null "$applied"
- name: Install the identity unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/orbit-identity.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apply the task VM identity of its start
      # Early boot: before ssh.socket, which sockets.target and basic.target need, so no default dependency on basic.target.
      DefaultDependencies=no
      After=sysinit.target local-fs.target ufw.service incus-agent.service
      Before=ssh.socket ssh.service wg-quick@orbit.service orbit-agent.service shutdown.target
      Conflicts=shutdown.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/orbit-identity
      TimeoutStartSec=90

      [Install]
      WantedBy=multi-user.target
# An ordering cycle would make systemd drop a unit at boot without a word; the refresh fails here instead.
- name: Check the identity unit
  ansible.builtin.command: { argv: [systemd-analyze, verify, /etc/systemd/system/orbit-identity.service] }
  changed_when: false
- name: Run the identity unit at every boot
  ansible.builtin.systemd: { name: orbit-identity.service, enabled: true, daemon_reload: true }
- name: Read the units again
  ansible.builtin.systemd: { daemon_reload: true }
# The agent a task VM runs; a task start writes its unit and secret (docs/cli/tasks/provision.mmd).
- name: Install the agent
  ansible.builtin.get_url:
    url: "{{ intent.boot.agent.url }}"
    checksum: "sha256:{{ intent.boot.agent.sha256 }}"
    dest: /usr/local/bin/orbit-agent
    mode: "0755"
