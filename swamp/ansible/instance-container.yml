---
# The container of a development Instance on its app-dev Node (docs/reference/development-containers.md#lifecycle): a Project's
# default Instance, its first build (instance:create) and its development deployments (instance:deploy), and every other Instance,
# a clone of the default's seed snapshot with T3. One tagged part per Swamp phase.
#   create of the default: `container`, `workspace`, `processes`, `seed`, and `stop` after a failure.
#   create of a clone: `clone`, `workspace`, `agent`, `processes`, `t3`, `register`, and `stop` after a failure. A clone of a
#     nested-fleet default (its intent has `fleet`) runs `fleet_check` and `fleet_resume` after its start.
#   deploy: `start`, `fetch`, `checkout`, `processes`, `seed`, `check`. A nested-fleet default (its intent has `fleet`) adds
#     `seed` right after `start`, `fleet_start` and `fleet_refresh` before the last `seed`, and after a failure `fleet_restore`,
#     then `start` again.
#   process: `process`, for one Process's start, stop, restart, status or logs (ORBIT_PROCESS_ACTION).
# The Project's deploy commands are not here: Swamp runs each one in the container from its vault copy, as `orbit`.
# Git runs on the Node with a read token in a 0600 file; the container gets the branch as a bundle and never a token. The intent is
# the Gateway's admitted intent in the run folder; `intent.container` names the container, its paths, its ACL and its units.
# Every phase writes `result.json` in the run folder: the commit it left checked out, or the public error code of the refusal.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: container_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run one phase of the default Instance's container
  hosts: container_node
  gather_facts: false
  become: true
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    container: "{{ intent.container }}"
    run_id: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN_ID') }}"
  tasks:
    - name: Run the phase
      block:
        # Select the phase by tags before evaluating task conditions. Unrelated phases never enter the task queue.
        - name: Run the phase's tasks
          ansible.builtin.include_tasks:
            file: "tasks/{{ 'instance-container-process.yml' if ansible_run_tags | first == 'process' else 'instance-container-phase.yml' }}"
            apply:
              tags: "{{ ['always'] if ansible_run_tags | first == 'process' else [] }}"
          tags: [always]
          vars:
            phase: "{{ ansible_run_tags | first }}"
        # A Process read's result holds journal lines: it goes only to the run folder, never to the run's output.
        - name: Write the result
          tags: [always]
          ansible.builtin.copy:
            content: >-
              {{ ({'node_services': node_services_result} if node_services_result is defined else
                  (mail_result if mail_result is defined else
                  (process_result if process_result is defined else
                   (node_runtime_result if node_runtime_result is defined and ansible_run_tags | first in ['node-store', 'node-runtime']
                    else {'commit': container_commit | default(none)})))) | combine(club_key_carried)
                 | combine(wake_result | default({})) | combine(fleet_refresh_carried) | to_json }}
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          no_log: true
          delegate_to: localhost
          become: false
          # The result file lives in the run folder on the worker: no change to the Node.
          changed_when: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            # A nested-fleet container's result names what a start of this run did with its Club key: the delivery script's word,
            # `changed`, `changed_serve_pending` or `unchanged`. Each phase writes the result file again, so a later phase keeps an
            # earlier phase's word. Any other container's result never names it. The failure below uses the same two values.
            club_key_result_file: &club_key_result_file "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/result.json' }}"
            club_key_carried: &club_key_carried >-
              {{ {} if container.club_key is not defined
                 else {'club_key': club_key_written} if club_key_written is defined
                 else {'club_key': (lookup('ansible.builtin.file', club_key_result_file) | from_json).club_key}
                   if club_key_result_file is file and (lookup('ansible.builtin.file', club_key_result_file) | from_json).club_key | default('') in ['changed', 'changed_serve_pending', 'unchanged']
                 else {} }}
            # What the refresh of a nested fleet did, part by part (tasks/instance-fleet-refresh.yml): its phase sets it, and each later
            # phase of the run keeps it from the result file, as the Club key's word.
            fleet_refresh_carried: &fleet_refresh_carried >-
              {{ {'fleet_refresh': fleet_refresh_result} if fleet_refresh_result is defined
                 else {'fleet_refresh': (lookup('ansible.builtin.file', club_key_result_file) | from_json).fleet_refresh}
                   if intent.fleet is defined and club_key_result_file is file
                      and (lookup('ansible.builtin.file', club_key_result_file) | from_json).fleet_refresh | default(none) is mapping
                 else {} }}
      rescue:
        # The code of a refusal is the fail_msg of its assert; anything else is the phase's own failure. A swamp step that exits
        # nonzero keeps no output, so a failed fleet phase also writes why into the result: `detail`, the failed task and its
        # message (a command's stderr tail with it). The fleet's messages are written to be safe to show; the Gateway redacts them
        # again. A fleet start after the refresh (`fleet_resume` without failed.json) keeps the commit the seed took and says that
        # the new seed stays; after a restore it keeps the first failure's result and adds `restore_failure`. A clone's `fleet_resume`
        # (a create intent, no `deployment`) took no seed, so its failure says only why the fleet it copied did not start.
        - name: Write the failure
          tags: [always]
          ansible.builtin.copy:
            content: >-
              {{ (((lookup('ansible.builtin.file', failure_restored) | from_json)
                   | combine({'restore_failure': 'The inner fleet of the restored seed did not start: ' ~ failure_reason}))
                  if failure_phase == 'fleet_resume' and intent.deployment is defined and failure_restored is file
                  else ({'error_code': failure_code}
                  | combine(migrate_process_failure | default({})) | combine(node_runtime_failure | default({}))
                  | combine(fleet_drift_failure if (fleet_drift_failure | default({})).fleet_drift | default([]) else {})
                  | combine(failure_unit_detail) | combine(failure_fleet_detail) | combine(club_key_carried)
                  | combine(wake_result | default({})) | combine(fleet_refresh_carried))) | to_json }}
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            club_key_result_file: *club_key_result_file
            club_key_carried: *club_key_carried
            fleet_refresh_carried: *fleet_refresh_carried
            failure_phase: "{{ ansible_run_tags | first }}"
            failure_code: >-
              {{ ansible_failed_result.msg
                 if (ansible_failed_result.msg | default('') is match('^[a-z]+\.[a-z0-9_]+$'))
                 else 'process.' ~ process_action ~ '_failed'
                 if failure_phase == 'process' and process_action in ['start', 'restart']
                 else 'instance.container_' ~ failure_phase ~ '_failed' }}
            failure_restored: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/failed.json' }}"
            failure_message: "{{ ansible_failed_result.msg | default('The task failed.') | string | trim }}"
            failure_stderr: "{{ (ansible_failed_result.stderr | default('') | string | trim)[-400:] }}"
            failure_reason: >-
              {{ ansible_failed_task.name | default('A fleet task') }}: {{ failure_message
                 }}{{ (': ' ~ failure_stderr) if failure_message == 'non-zero return code' and failure_stderr != '' else '' }}
            # A unit that did not become active is named, so the failure says which Process did not start; the Gateway records the
            # named units' Processes as failed and keeps the others as they run.
            failure_inactive_units: >-
              {{ ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list if ansible_failed_task.name | default('') == 'Wait for each running unit' else [] }}
            failure_unit_detail: >-
              {{ {'detail': 'Not active: ' ~ failure_inactive_units | join(', '), 'units_inactive': failure_inactive_units}
                 if failure_inactive_units | length > 0 else {} }}
            failure_fleet_detail: >-
              {{ {} if failure_phase not in ['fleet_check', 'fleet_start', 'fleet_refresh', 'fleet_resume'] or failure_code == failure_message
                 else {'detail': 'The new seed and base stay; the inner fleet on the new commit did not start: ' ~ failure_reason,
                       'commit': (lookup('ansible.builtin.file', club_key_result_file) | from_json).commit | default(none)}
                 if failure_phase == 'fleet_resume' and intent.deployment is defined and club_key_result_file is file
                 else {'detail': failure_reason} }}
        - name: Fail the phase
          tags: [always]
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The container phase failed.') }}"

  handlers:
    - name: Load the shared container handlers
      ansible.builtin.import_tasks: tasks/instance-container-handlers.yml
