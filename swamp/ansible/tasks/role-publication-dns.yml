---
- name: Publish composed private DNS
  when: plans.publications[inventory_hostname].dns is not none
  block:
    - name: Create the private DNS catalog folder
      ansible.builtin.file: { path: /var/lib/orbit/private-dns, state: directory, owner: root, group: root, mode: '0755' }
    - name: Write composed DNS records
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/orbit-records.conf
        content: "{{ plans.publications[inventory_hostname].dns.records }}"
        owner: root
        group: root
        mode: '0644'
    - name: Write composed DNS catalog
      ansible.builtin.copy:
        dest: /var/lib/orbit/private-dns/catalog.json
        content: "{{ plans.publications[inventory_hostname].dns.catalog }}"
        owner: root
        group: root
        mode: '0644'
    - name: Validate private DNS
      ansible.builtin.command: { argv: [timeout, '30', dnsmasq, --test] }
      changed_when: false
    - name: Reload private DNS
      ansible.builtin.systemd: { name: dnsmasq, state: reloaded }
