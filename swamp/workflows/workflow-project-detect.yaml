id: c031ac7e-2e4f-471e-8d4f-22733dd014e0
name: project-detect
description: Scan an admitted Project snapshot and return downstream group requests.
vaults:
- orbit-control-inputs
inputs:
  type: object
  additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      enum:
      - 209
    kind: {type: string, const: project.detect}
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^project-dependency-read-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
        git_authorization:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^project-dependency-auth-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      additionalProperties: false
      required:
      - github_token
      - git_authorization
reports:
  skip:
  - '@swamp/workflow-summary'
jobs:
- name: detect
  labels: {role: swamp}
  steps:
  - name: Read the admitted input
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/project-maintenance-input'
      behaviorName: ${{ "project-input-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
  - name: Begin the scan
    labels: {role: swamp}
    dependsOn:
    - step: Read the admitted input
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: begin_scan
      inputs:
        project: ${{ steps["Read the admitted input"].outputs.project }}
        runId: ${{ run.id }}
  - name: Clone the default branch
    labels: {role: swamp}
    dependsOn:
    - step: Begin the scan
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-checkout-" + run.id }}
      methodName: execute
      inputs:
        run: 'git clone --quiet --depth=1 --branch "$ORBIT_BRANCH" -- "$ORBIT_URL" "$ORBIT_SOURCE" && git -C "$ORBIT_SOURCE" rev-parse HEAD

          '
        env:
          ORBIT_BRANCH: ${{ steps["Read the admitted input"].outputs.project.defaultBranch }}
          ORBIT_URL: ${{ steps["Read the admitted input"].outputs.clone_url }}
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key)
            }}
  - name: Read open maintenance PRs
    labels: {role: swamp}
    dependsOn:
    - step: Read the admitted input
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: project-dependency-evidence
      inputs:
        operation_id: ${{ inputs.operation_id }}
        project: ${{ steps["Read the admitted input"].outputs.project }}
        groups: ${{ steps["Read the admitted input"].outputs.groups }}
        pr_urls: ${{ steps["Read the admitted input"].outputs.pr_urls }}
        previous_pr: ${{ steps["Read the admitted input"].outputs.previous_pr }}
        execution_secrets:
          github_token: ${{ inputs.execution_secrets.github_token }}
  - name: Scan the lockfiles
    labels: {role: swamp}
    dependsOn:
    - step: Clone the default branch
      condition:
        type: succeeded
    - step: Read open maintenance PRs
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: scan
      inputs:
        project: ${{ steps["Read the admitted input"].outputs.project }}
        runId: ${{ run.id }}
        root: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
        commit: ${{ steps["Clone the default branch"].outputs.stdout.trim() }}
        evidence: ${{ steps["Read open maintenance PRs"].outputs.evidence.evidence }}
  - name: Read the branch head
    labels: {role: swamp}
    dependsOn:
    - step: Scan the lockfiles
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-head-now-" + run.id }}
      methodName: execute
      inputs:
        run: 'git ls-remote --exit-code -- "$ORBIT_URL" "$ORBIT_REF"

          '
        env:
          ORBIT_URL: ${{ steps["Read the admitted input"].outputs.clone_url }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key)
            }}
          ORBIT_REF: ${{ steps["Read the admitted input"].outputs.source_ref }}
  - name: Check head is unchanged
    labels: {role: swamp}
    dependsOn:
    - step: Read the branch head
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: assert_scan_head
      inputs:
        project: ${{ steps["Read the admitted input"].outputs.project }}
        runId: ${{ run.id }}
        head: ${{ steps["Read the branch head"].outputs.stdout }}
        scan_succeeded: ${{ steps["Scan the lockfiles"].outputs.scan_succeeded }}
  - name: Finish the scan
    labels: {role: swamp}
    dependsOn:
    - step: Clone the default branch
      condition:
        type: always
    - step: Read open maintenance PRs
      condition:
        type: always
    - step: Scan the lockfiles
      condition:
        type: always
    - step: Check head is unchanged
      condition:
        type: always
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: finish_scan
      inputs:
        project: ${{ steps["Read the admitted input"].outputs.project }}
        runId: ${{ run.id }}
        steps: ${{ steps }}
  - name: Report the result
    labels: {role: swamp}
    dependsOn:
    - step: Finish the scan
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-detect-result-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' "$ORBIT_RESULT"

          '
        env:
          ORBIT_RESULT: ${{ steps["Finish the scan"].outputs.result_json }}
  - name: Fail on an error
    labels: {role: swamp}
    dependsOn:
    - step: Report the result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-scan-outcome-" + run.id }}
      methodName: execute
      inputs:
        run: test "$ORBIT_SCAN_SUCCEEDED" = true
        env:
          ORBIT_SCAN_SUCCEEDED: ${{ string(steps["Finish the scan"].outputs.scan_succeeded) }}
  - name: Remove the clone
    labels: {role: swamp}
    dependsOn:
    - step: Clone the default branch
      condition:
        type: always
    - step: Report the result
      condition:
        type: always
    - step: Fail on an error
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "project-detect-cleanup-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_SOURCE"

          '
        env:
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-dependency-scans/" + run.id }}
