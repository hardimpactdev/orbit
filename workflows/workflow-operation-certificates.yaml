id: 0eef618f-3b0c-464e-919a-ebb793d6aa9e
name: operation-certificates
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "0,30 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-certificates-discovery
          methodName: discover
          inputs:
            family: operation-certificates
            kinds: ["certificate.converge", "certificate.remove"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-certificates'
          behaviorName: '${{ "operation-certificates-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
