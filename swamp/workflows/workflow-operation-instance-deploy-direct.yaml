      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv: '${{ ["/usr/bin/flock", "--nonblock", "--conflict-exit-code", "73", "-o", inputs.intent.deployment.home] + ["/usr/bin/env", "-i", "-C", inputs.intent.deployment.home, "HOME=" + inputs.intent.account_home,
          "USER=" + inputs.intent.deployment.node_user, "LOGNAME=" + inputs.intent.deployment.node_user, ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime
          : null) == null ? "PATH=/usr/local/bin:/usr/bin:/bin" : "PATH=" + ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime
          : null).store + "/bin:/usr/local/bin:/usr/bin:/bin", ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime : null)
          == null ? "VP_HOME=" : "VP_HOME=" + ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime : null).store, "ORBIT_SEED_PATH="
          + inputs.intent.deployment.home, "ORBIT_SEED_COMMIT=" + steps["Resolve the commit"].outputs.stdout.trim()] + (("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded"
          ? steps["dev-vp-requirements"].outputs.runtime : null) == null ? [] : [("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime
          : null).store + "/bin/vp", "env", "exec", "--node", ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime : null).node_version,
          "--package-manager", ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime : null).package_manager + "@" + ("dev-vp-requirements"
          in steps && steps["dev-vp-requirements"].status == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime : null).package_manager_version + (("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status
          == "succeeded" ? steps["dev-vp-requirements"].outputs.runtime : null).package_manager_hash == null ? "" : "+" + ("dev-vp-requirements" in steps && steps["dev-vp-requirements"].status == "succeeded"
          ? steps["dev-vp-requirements"].outputs.runtime : null).package_manager_hash), "--"]) + ["/bin/sh", "-c", self.step.required ? "s=$(cat) && exec timeout \"$1\" /bin/bash --noprofile --norc -eu
          -c \"$s\" </dev/null >/dev/null 2>&1" : "s=$(cat) || exit 1; timeout \"$1\" /bin/bash --noprofile --norc -eu -c \"$s\" </dev/null >/dev/null 2>&1; echo \"$?\"", "sh", string(self.step.timeout_seconds)]
          }}'
        timeoutSec: ${{ self.step.timeout_seconds + 10 }}
        stdin: ${{ vault.get(inputs.execution_secrets["step_" + string(self._index)].vault, inputs.execution_secrets["step_" + string(self._index)].key) }}
    forEach:
      item: step
