    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: forward_prepare_caddy
      condition:
        type: always
    - step: forward_urls
      condition:
        type: always
    - step: forward_prepare_dns
      condition:
        type: always
    - step: forward_dns_grace
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.part.node_id }}
          user: ${{ self.part.user }}
          host_keys: ${{ self.part.host_keys }}
          control_node_id: ${{ self.part.control_node_id }}
          connection: ${{ self.part.connection }}
          before: ${{ self.part.prepared.caddy }}
          after: ${{ self.part.withdrawn.caddy }}
          direction: forward
          retain_removed: false
          alternatives: ${{ [self.part.before.caddy,self.part.prepared.caddy,self.part.withdrawn.caddy,self.part.after.caddy]
            }}
        execution_secrets: {}
  - name: forward_live_certificates
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.certificates }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: forward_prepare_caddy
      condition:
        type: always
    - step: forward_urls
      condition:
        type: always
    - step: forward_prepare_dns
      condition:
        type: always
    - step: forward_dns_grace
      condition:
        type: always
    - step: forward_withdraw_caddy
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-certificate-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          leaf: ${{ self.part }}
          control_node_id: 209
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection
            }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys
            }}
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
        restoring: false
