[package]
name = "orbit-ai-router-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
orbit-agent-contract = { path = "../../../../agent/crates/contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time", "sync"] }
axum = "0.8"
rand = "0.8"
