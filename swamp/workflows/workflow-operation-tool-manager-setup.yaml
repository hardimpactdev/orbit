  - {"name":"Install pinned prerequisites","labels":{"role":"swamp"},"dependsOn":[{"step":"Install prerequisites","condition":{"type":"or","conditions":[{"type":"succeeded"},{"type":"skipped"}]}},{"step":"Read the pinned installer","condition":{"type":"or","conditions":[{"type":"succeeded"},{"type":"skipped"}]}}],"writes":true,"task":{"type":"behavior","behaviorType":"@swamp/ssh","behaviorName":"${{ \"tm-command-\" + string(inputs.node_id) }}","methodName":"exec","globalArgs":{"name":"${{ \"tm-command-\" + string(inputs.node_id) }}","transport":{"kind":"ssh","user":"${{ inputs.ssh.target.user }}","port":"${{ inputs.ssh.target.port }}","identityFile":"${{ inputs.ssh.identity_file }}","hostKeys":"${{ inputs.ssh.target.host_keys }}","identitiesOnly":true},"hosts":[{"name":"target","address":"${{ inputs.ssh.target.host }}"}]},"inputs":{"hosts":"name:target","sudo":true,"argv":["timeout","900","/usr/bin/python3","-I","-c","${{ steps[\"Read the pinned installer\"].outputs.apt_body }}"],"timeoutSec":905}},"guard":"${{ steps[\"Read manager version\"].outputs.exitCode != 127 || !(\"setup\" in inputs.intent) || inputs.intent.setup == null || inputs.intent.platform != \"linux\" || steps[\"Read the pinned installer\"].outputs.apt_body == null || steps.exists(k, steps[k].status in [\"failed\", \"cancelled\"]) }}"}
  - {"name":"Install the pinned manager","labels":{"role":"swamp"},"dependsOn":[{"step":"Install pinned prerequisites","condition":{"type":"or","conditions":[{"type":"succeeded"},{"type":"skipped"}]}},{"step":"Read the pinned installer","condition":{"type":"or","conditions":[{"type":"succeeded"},{"type":"skipped"}]}}],"writes":true,"task":{"type":"behavior","behaviorType":"@swamp/ssh","behaviorName":"${{ \"tm-command-\" + string(inputs.node_id) }}","methodName":"exec","globalArgs":{"name":"${{ \"tm-command-\" + string(inputs.node_id) }}","transport":{"kind":"ssh","user":"${{ inputs.ssh.target.user }}","port":"${{ inputs.ssh.target.port }}","identityFile":"${{ inputs.ssh.identity_file }}","hostKeys":"${{ inputs.ssh.target.host_keys }}","identitiesOnly":true},"hosts":[{"name":"target","address":"${{ inputs.ssh.target.host }}"}]},"inputs":{"hosts":"name:target","sudo":true,"argv":["timeout","900","/usr/bin/python3","-I","-c","${{ steps[\"Read the pinned installer\"].outputs.manager_body }}"],"timeoutSec":905}},"guard":"${{ steps[\"Read manager version\"].outputs.exitCode != 127 || !(\"setup\" in inputs.intent) || inputs.intent.setup == null || inputs.intent.platform != \"linux\" || steps.exists(k, steps[k].status in [\"failed\", \"cancelled\"]) }}"}
  - {"name":"Check the Tool Manager","labels":{"role":"swamp"},"dependsOn":[{"step":"Install the pinned manager","condition":{"type":"or","conditions":[{"type":"succeeded"},{"type":"skipped"}]}}],"task":{"type":"behavior","behaviorType":"@swamp/ssh","behaviorName":"${{ \"tm-command-\" + string(inputs.node_id) }}","methodName":"exec","globalArgs":{"name":"${{ \"tm-command-\" + string(inputs.node_id) }}","transport":{"kind":"ssh","user":"${{ inputs.ssh.target.user }}","port":"${{ inputs.ssh.target.port }}","identityFile":"${{ inputs.ssh.identity_file }}","hostKeys":"${{ inputs.ssh.target.host_keys }}","identitiesOnly":true},"hosts":[{"name":"target","address":"${{ inputs.ssh.target.host }}"}]},"inputs":{"hosts":"name:target","sudo":false,"argv":"${{ [\"timeout\", \"60\"] + steps[\"Prepare manager commands\"].outputs.version }}","timeoutSec":905,"okExitCodes":"any"}},"guard":"${{ !(\"Install the pinned manager\" in steps) || steps[\"Install the pinned manager\"].status != \"succeeded\" }}"}
  - {"name":"Assert manager readiness","labels":{"role":"swamp"},"dependsOn":[{"step":"Read manager version","condition":{"type":"completed"}},{"step":"Read the pinned installer","condition":{"type":"completed"}},{"step":"Refresh prerequisites","condition":{"type":"completed"}},{"step":"Install prerequisites","condition":{"type":"completed"}},{"step":"Install pinned prerequisites","condition":{"type":"completed"}},{"step":"Install the pinned manager","condition":{"type":"completed"}},{"step":"Check the Tool Manager","condition":{"type":"completed"}}],"task":{"type":"assert","expr":"(\"report\" in inputs && inputs.report) || steps[\"Read manager version\"].outputs.exitCode == 0 || (\"Check the Tool Manager\" in steps && steps[\"Check the Tool Manager\"].status == \"succeeded\" && steps[\"Check the Tool Manager\"].outputs.exitCode == 0)","severity":"high","message":"The Tool Manager must answer its native version command."}}
