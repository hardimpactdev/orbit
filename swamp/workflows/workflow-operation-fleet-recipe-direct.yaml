  steps:
  - name: project
    writes: true
    guard: ${{ !has(steps.admit) || !has(steps.admit.outputs) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-direct'
      behaviorName: ${{ "fleet-recipe-" + string(inputs.node_id) }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        outcomes: '${{ (has(steps.preflight) && has(steps.preflight.outputs) ? [steps.preflight.outputs] : []) +
          (has(steps.recipe_apply) && has(steps.recipe_apply.outputs) ? [steps.recipe_apply.outputs] : []) + (has(steps.php_build)
          && has(steps.php_build.outputs) ? [steps.php_build.outputs] : []) + (has(steps.agent_install) && has(steps.agent_install.outputs)
          ? [steps.agent_install.outputs] : []) + (has(steps.caddy_package) && has(steps.caddy_package.outputs)
          ? [steps.caddy_package.outputs] : []) + (has(steps.caddy) && has(steps.caddy.outputs) ? [steps.caddy.outputs]
          : []) + (has(steps.peer_dns) && has(steps.peer_dns.outputs) ? [steps.peer_dns.outputs] : []) + (has(steps.private_dns)
          && has(steps.private_dns.outputs) ? [steps.private_dns.outputs] : []) + (has(steps.route_residue) && has(steps.route_residue.outputs)
          ? [steps.route_residue.outputs] : []) + (has(steps.php_runtime) && has(steps.php_runtime.outputs) ? [steps.php_runtime.outputs]
          : []) + (has(steps.tmpfiles) && has(steps.tmpfiles.outputs) ? [steps.tmpfiles.outputs] : []) + (has(steps.agent)
          && has(steps.agent.outputs) ? [steps.agent.outputs] : []) + (has(steps.cli) && has(steps.cli.outputs)
          ? [steps.cli.outputs] : []) + (has(steps.delivery) && has(steps.delivery.outputs) ? [steps.delivery.outputs] : []) }}'
