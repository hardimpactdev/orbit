id: d83a5174-05bf-41ab-8468-f36d5fe30b03
name: groups-driver
description: Discover every active group and reconcile independent owning runs.
trigger:
  # Croner's native seconds field; validated by the installed Swamp schema.
  schedule: "*/5 * * * * *"
jobs:
  - name: groups
    steps:
      - name: discover
        task:
          type: behavior
          behavior: orbit-group-runs
          methodName: discover
      - name: fanout
        dependsOn: [{ step: discover, condition: { type: succeeded } }]
        task:
          type: workflow
          workflowIdOrName: group-fanout
          inputs:
            groups: '${{ steps.discover.outputs.groups }}'
            conflicts: '${{ steps.discover.outputs.conflicts }}'
