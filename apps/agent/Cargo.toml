[package]
name = "orbit-agent"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "orbit_agent"
path = "src/lib.rs"

[[bin]]
name = "orbit-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
toml = "0.8"
ureq = { version = "2", features = ["native-certs"] }
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
