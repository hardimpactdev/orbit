id: d3021397-57b1-4756-b47e-e9521d27ccde
name: operation-database-mysql-clone
description: Reset and copy the admitted managed MySQL clone on its exact server Node.
target: '${{ "orbit-node-" + string(inputs.node_id) }}'
labels: { node: "${{ string(inputs.node_id) }}" }
writes: true
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [database.mysql_clone] }
  required: [operation_id, node_id, kind]
jobs:
  - name: server
    steps:
      - name: apply
        dataOutputOverrides:
          - specName: outcome
            vary: [run_id]
        task:
          type: behavior
          behaviorType: "@nckrtl/database-mysql-clone"
          behaviorName: '${{ "database-mysql-clone-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: project
        dependsOn:
          - step: apply
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/database-mysql-clone"
          behaviorName: '${{ "database-mysql-clone-" + string(inputs.node_id) }}'
          methodName: project
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            outcome: "${{ steps.apply.outputs.outcome }}"
