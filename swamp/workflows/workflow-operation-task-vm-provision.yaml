  steps:
  - name: confirm_runtime
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: confirm-runtime
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) + (has(steps.prepare_network) && has(steps.prepare_network.outputs)
