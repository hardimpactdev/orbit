id: 878a384f-8b8a-4066-bd17-dcad8eac3e86
name: operation-task-vm-image-build
description: Build the task image of an Incus host from a stock Ubuntu VM with the task VM role phases of Ansible, smoke it, promote it and remove the builders, from 209 over official SSH.
version: 2
queueTimeout: 60
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.image_build]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: reset
  labels: {role: swamp}
  steps:
    # A missing instance is fine: exit 1 of `incus delete` for an unknown name.
  - name: Remove earlier attempts
    labels: {role: swamp}
    writes: true
    forEach:
      item: name
      in: '${{ [inputs.intent.builder, inputs.intent.smoke] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-reset-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs: &host
        name: ${{ "task-vm-image-reset-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '300', incus, delete, --force, --project, '${{ inputs.intent.project }}', '--', '${{ self.name }}']
        timeoutSec: 320
- name: launch
  labels: {role: swamp}
  dependsOn:
  - {job: reset, condition: {type: succeeded}}
  steps:
    # `incus init` reads the instance config (the cloud-init key for the orbit account and its drive) from stdin, then the VM starts.
  - name: Launch the builder
    labels: {role: swamp}
    writes: true
    concurrency: 1
    forEach:
      item: change
      in: '${{ [{"argv": ["incus", "init", "--vm", "--project", inputs.intent.project, "--config", "limits.cpu=" + string(inputs.intent.cpus), "--config", "limits.memory=" + inputs.intent.memory, "--device", "root,size=" + inputs.intent.disk, "--device", "eth0,network=" + inputs.intent.network, "--device", "eth0,security.port_isolation=true", "--", inputs.intent.source, inputs.intent.builder], "stdin": inputs.intent.launch_config}, {"argv": ["incus", "start", "--project", inputs.intent.project, "--", inputs.intent.builder], "stdin": ""}] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-launch-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-launch-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: '${{ ["timeout", "180"] + self.change.argv }}'
        stdin: ${{ self.change.stdin }}
        timeoutSec: 200
- name: wait
  labels: {role: swamp}
  dependsOn:
  - {job: launch, condition: {type: succeeded}}
  steps:
    # The Incus agent answers first; cloud-init has made the orbit account when its status ends.
  - name: Wait for the builder
    labels: {role: swamp}
    concurrency: 1
    forEach:
      item: wait
      in: '${{ [["incus", "wait", "--project", inputs.intent.project, "--timeout", "600", "--", inputs.intent.builder, "agent"], ["incus", "exec", "--project", inputs.intent.project, "--", inputs.intent.builder, "cloud-init", "status", "--wait"]] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-wait-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-wait-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: '${{ ["timeout", "660"] + self.wait }}'
        timeoutSec: 700
- name: phases
  labels: {role: swamp}
  dependsOn:
  - {job: wait, condition: {type: succeeded}}
  steps:
  - name: Run the task image phases
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ${{ inputs.intent.builder }}
        tags: software,tools,check
        with_pi: true
- name: clean
  labels: {role: swamp}
  dependsOn:
  - {job: phases, condition: {type: succeeded}}
  steps:
    # The clone makes its own cloud-init state, machine id and host keys at its first boot.
    # No `}}` inside the expression below: the closing braces of the map and of the expression are apart.
  - name: Clean and stop
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-image-clean
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: '${{ {"host_ssh_execution": inputs.intent.jump, "vm": {"name": inputs.intent.builder, "project": inputs.intent.project} } }}'
- name: publish
  labels: {role: swamp}
  dependsOn:
  - {job: clean, condition: {type: succeeded}}
  steps:
    # The output names the fingerprint; the Gateway reads it from this step. `--quiet` drops the progress lines, because a result keeps only the first 4 KB.
  - name: Publish the candidate
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-publish-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-publish-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '900', incus, publish, --quiet, --project, '${{ inputs.intent.project }}', --compression, none, --alias, '${{ inputs.intent.candidate_alias }}', '--', '${{ inputs.intent.builder }}', '${{ "orbit.recipe=" + inputs.intent.identity }}', orbit.profile=base]
        timeoutSec: 920
- name: smoke
  labels: {role: swamp}
  dependsOn:
  - {job: publish, condition: {type: succeeded}}
  steps:
  - name: Smoke the candidate
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-image-smoke
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
- name: promote
  labels: {role: swamp}
  dependsOn:
  - {job: smoke, condition: {type: succeeded}}
  steps:
    # The build never promotes an image without a seed for it: the stage 6 refresh promotes the image together with its seed.
    # The seed is `orbit-topology-seed-` and the first 12 hex characters of the fingerprint; `-previous` and `-new` volumes do not count.
  - name: Check the seed
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-seed-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-seed-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '60', incus, storage, volume, list, --project, '${{ inputs.intent.project }}', --format, csv, --columns, n, '--', '${{ inputs.intent.pool }}']
        timeoutSec: 80
    # The Operation holds the host's lock key, so no other host Operation runs while the alias moves. An alias takes a fingerprint, not another alias; `incus publish` printed it.
    # Without the seed this step is skipped and the run still succeeds: the candidate stays, and the Gateway records it without a promotion.
  - name: Promote the image
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Check the seed, condition: {type: succeeded}}
    guard: '${{ !steps["Check the seed"].outputs.stdout.split("\n").exists(n, n.startsWith("orbit-topology-seed-") && steps["Publish the candidate"].outputs.stdout.split("fingerprint: ")[1].trim().startsWith(n.split("orbit-topology-seed-")[1])) }}'
    task:
      type: workflow
      workflowIdOrName: task-vm-image-promote
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        fingerprint: '${{ steps["Publish the candidate"].outputs.stdout.split("fingerprint: ")[1].trim() }}'
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: reset, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: launch, condition: *settled}
  - {job: wait, condition: *settled}
  - {job: phases, condition: *settled}
  - {job: clean, condition: *settled}
  - {job: publish, condition: *settled}
  - {job: smoke, condition: *settled}
  - {job: promote, condition: *settled}
  steps:
    # A removal that fails leaves a stray VM; the next attempt removes it first and the host sweep reports it.
  - name: Remove builder and smoke
    labels: {role: swamp}
    writes: true
    allowFailure: true
    forEach:
      item: name
      in: '${{ [inputs.intent.builder, inputs.intent.smoke] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '300', incus, delete, --force, --project, '${{ inputs.intent.project }}', '--', '${{ self.name }}']
        timeoutSec: 320
