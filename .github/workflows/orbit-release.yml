name: Orbit Release

# Drafts do not fire release created/edited/deleted. prereleased is public.
# Drafts also do not create a git tag. The operator must push v<VERSION>
# before creating the draft so checkout of inputs.tag can resolve.
# This workflow has no tag-push trigger; the push alone starts nothing.
# workflow_dispatch verifies a draft and publishes only on success.
# release published is a safety net; failure converts it back to a draft.
# Publishing with GITHUB_TOKEN does not re-enter this workflow.
# The GHCR :VERSION tag moves only here: every image check resolves the
# accepted digest directly, and the tag is promoted after those checks and
# the split publish, right before the release goes public. A failed run
# therefore never points the public version tag at an unverified candidate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify and publish
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: orbit-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hardimpactdev/orbit-gateway

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, sqlite3, curl, openssl, mbstring, tokenizer, ctype, filter, fileinfo, phar, zlib
          tools: composer

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          version="${tag#v}"
          canonical_version="$(bin/orbit-version)"

          if [ "$tag" = "$version" ]; then
            echo "Release tag must start with v, got [$tag]." >&2
            exit 1
          fi

          if [ "$version" != "$canonical_version" ]; then
            echo "Release tag [$tag] does not match VERSION [$canonical_version]." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Download prebuilt release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/orbit-release-assets"
          mkdir -p "$asset_dir"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern orbit-linux-x64 \
            --pattern orbit-macos-arm64 \
            --pattern orbit-reverb-linux-amd64.tar \
            --pattern orbit-release-manifest.json \
            --dir "$asset_dir"

          test -s "$asset_dir/orbit-linux-x64"
          test -s "$asset_dir/orbit-macos-arm64"
          test -s "$asset_dir/orbit-reverb-linux-amd64.tar"
          test -s "$asset_dir/orbit-release-manifest.json"

          echo "dir=${asset_dir}" >> "$GITHUB_OUTPUT"

      - name: Verify promoted release manifest
        id: manifest
        env:
          ASSET_DIR: ${{ steps.assets.outputs.dir }}
          VERSION: ${{ steps.version.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $assetDir = getenv('ASSET_DIR') ?: '';
          $version = getenv('VERSION') ?: '';
          $repository = getenv('GITHUB_REPOSITORY') ?: '';
          $manifestPath = "{$assetDir}/orbit-release-manifest.json";

          $manifest = json_decode((string) file_get_contents($manifestPath), true, flags: JSON_THROW_ON_ERROR);

          if (! is_array($manifest)) {
              fail('Release manifest must be a JSON object.');
          }

          if (($manifest['version'] ?? null) !== $version) {
              fail("Release manifest version does not match {$version}.");
          }

          if (($manifest['source'] ?? null) !== 'github-release') {
              fail('Release manifest source must be github-release after promotion.');
          }

          $gateway = $manifest['images']['gateway'] ?? null;
          $gatewayPrefix = "ghcr.io/hardimpactdev/orbit-gateway:{$version}@sha256:";
          $gatewayDigest = is_string($gateway) ? substr($gateway, strlen($gatewayPrefix)) : '';

          if (
              ! is_string($gateway)
              || ! str_starts_with($gateway, $gatewayPrefix)
              || preg_match('/^[0-9a-f]{64}$/D', $gatewayDigest) !== 1
          ) {
              fail('Release manifest gateway image must be the promoted digest-pinned ghcr.io/hardimpactdev/orbit-gateway image.');
          }

          $expectedArtifacts = [
              'linux-amd64' => 'orbit-linux-x64',
              'darwin-arm64' => 'orbit-macos-arm64',
          ];

          foreach ($expectedArtifacts as $platform => $asset) {
              $artifact = $manifest['cli_artifacts'][$platform] ?? null;

              if (! is_array($artifact)) {
                  fail("Release manifest missing CLI artifact {$platform}.");
              }

              $expectedUrl = "https://github.com/{$repository}/releases/download/v{$version}/{$asset}";

              if (($artifact['url'] ?? null) !== $expectedUrl) {
                  fail("Release manifest {$platform} URL must point at {$expectedUrl}.");
              }

              $actualHash = hash_file('sha256', "{$assetDir}/{$asset}");

              if (! is_string($actualHash) || ($artifact['sha256'] ?? null) !== $actualHash) {
                  fail("Release manifest {$platform} sha256 does not match the promoted asset.");
              }
          }

          $websocketArtifact = $manifest['role_image_artifacts']['orbit-websocket'] ?? null;

          if (! is_array($websocketArtifact)) {
              fail('Release manifest must publish role_image_artifacts.orbit-websocket for credential-free websocket role acquisition.');
          }

          $reverbAsset = 'orbit-reverb-linux-amd64.tar';
          $expectedReverbUrl = "https://github.com/{$repository}/releases/download/v{$version}/{$reverbAsset}";

          if (($websocketArtifact['url'] ?? null) !== $expectedReverbUrl) {
              fail("Release manifest role_image_artifacts.orbit-websocket URL must point at {$expectedReverbUrl}.");
          }

          $reverbPath = "{$assetDir}/{$reverbAsset}";

          if (! is_file($reverbPath)) {
              fail("Release manifest websocket role image archive {$reverbAsset} was not published with the release.");
          }

          $reverbHash = hash_file('sha256', $reverbPath);

          if (! is_string($reverbHash) || ($websocketArtifact['sha256'] ?? null) !== $reverbHash) {
              fail('Release manifest role_image_artifacts.orbit-websocket sha256 does not match the promoted archive.');
          }

          $websocketImage = $manifest['role_images']['orbit-websocket'] ?? null;
          $reverbPrefix = "ghcr.io/hardimpactdev/orbit-reverb:{$version}@sha256:";
          $reverbDigest = is_string($websocketImage) ? substr($websocketImage, strlen($reverbPrefix)) : '';

          if (
              ! is_string($websocketImage)
              || ! str_starts_with($websocketImage, $reverbPrefix)
              || preg_match('/^[0-9a-f]{64}$/D', $reverbDigest) !== 1
          ) {
              fail('Release manifest websocket image must be the promoted digest-pinned ghcr.io/hardimpactdev/orbit-reverb image.');
          }

          $frankenphpImage = $manifest['role_images']['orbit-frankenphp'] ?? null;
          $frankenphpPrefix = 'ghcr.io/hardimpactdev/orbit-frankenphp:2-php8.5-bookworm@sha256:';
          $frankenphpDigest = is_string($frankenphpImage) ? substr($frankenphpImage, strlen($frankenphpPrefix)) : '';

          if (
              ! is_string($frankenphpImage)
              || ! str_starts_with($frankenphpImage, $frankenphpPrefix)
              || preg_match('/^[0-9a-f]{64}$/D', $frankenphpDigest) !== 1
          ) {
              fail('Release manifest FrankenPHP image must be the digest-pinned ghcr.io/hardimpactdev/orbit-frankenphp:2-php8.5-bookworm image.');
          }

          file_put_contents(
              getenv('GITHUB_OUTPUT'),
              "gateway_digest=sha256:{$gatewayDigest}\nreverb_digest=sha256:{$reverbDigest}\nfrankenphp_digest=sha256:{$frankenphpDigest}\n",
              FILE_APPEND,
          );

          function fail(string $message): never
          {
              fwrite(STDERR, "{$message}\n");

              exit(1);
          }
          PHP

      - name: Verify accepted gateway image is pullable
        env:
          GATEWAY_DIGEST: ${{ steps.manifest.outputs.gateway_digest }}
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d)"
          trap 'rm -rf "$docker_config"' EXIT

          DOCKER_CONFIG="$docker_config" docker pull "${REGISTRY}/${IMAGE_NAME}@${GATEWAY_DIGEST}"

      - name: Verify accepted gateway image bakes the release version
        env:
          GATEWAY_DIGEST: ${{ steps.manifest.outputs.gateway_digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          accepted_ref="${REGISTRY}/${IMAGE_NAME}@${GATEWAY_DIGEST}"
          baked="$(docker run --rm --entrypoint cat "$accepted_ref" /srv/orbit/VERSION || true)"
          if [ "$baked" != "$VERSION" ]; then
            echo "Gateway image /srv/orbit/VERSION is [$baked], expected [$VERSION] (gateway-version regression)." >&2
            exit 1
          fi

          echo "Gateway image bakes version ${VERSION} at /srv/orbit/VERSION."

      - name: Publish split package repositories
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          SPLIT_PUSH_TOKEN: ${{ secrets.ORBIT_RELEASE_TOKEN || github.token }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail

          publish_split() {
            package="$1"
            repository="$2"
            output="$RUNNER_TEMP/orbit-splits/$package"

            rm -rf "$output"
            bin/orbit-prepare-release-package --package="$package" --version="$VERSION" --output="$output"

            # Never ship install trees into split repositories.
            rm -rf "$output/node_modules" "$output/coverage"

            git -C "$output" init
            git -C "$output" config user.name "github-actions[bot]"
            git -C "$output" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$output" add -A
            if git -C "$output" ls-files --error-unmatch node_modules >/dev/null 2>&1; then
              echo "Refusing to publish split package with node_modules tracked." >&2
              exit 1
            fi
            git -C "$output" commit -m "Release $TAG"
            git -C "$output" branch -M main
            git -C "$output" tag -f "$TAG"
            git -C "$output" remote add origin "https://x-access-token:${SPLIT_PUSH_TOKEN}@github.com/${repository}.git"
            git -C "$output" push --force origin HEAD:main
            git -C "$output" push --force origin "refs/tags/${TAG}"
          }

          # TypeScript SDK (@hardimpactdev/orbit-sdk-typescript) is independently
          # versioned and published from hardimpactdev/orbit-sdk-typescript via
          # its own OIDC release workflow. Root orbit-release.yml must not
          # prepare, split-tag, or npm-publish that package.

          publish_split core hardimpactdev/orbit-core
          publish_split sdk hardimpactdev/orbit-sdk-laravel
          publish_split cli hardimpactdev/orbit-cli
          publish_split gateway hardimpactdev/orbit-gateway

          if [ -n "${PACKAGIST_USERNAME:-}" ] && [ -n "${PACKAGIST_TOKEN:-}" ]; then
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"repository":{"url":"https://github.com/hardimpactdev/orbit-core"}}' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"repository":{"url":"https://github.com/hardimpactdev/orbit-sdk-laravel"}}' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
          else
            echo "Packagist credentials not configured; skipping hardimpactdev/orbit-core and hardimpactdev/orbit-sdk-laravel API updates."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Promote canonical gateway image version tag
        env:
          GATEWAY_DIGEST: ${{ steps.manifest.outputs.gateway_digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          accepted_ref="${REGISTRY}/${IMAGE_NAME}@${GATEWAY_DIGEST}"
          promoted_ref="${REGISTRY}/${IMAGE_NAME}:${VERSION}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$promoted_ref" \
            "$accepted_ref"

          inspect_output="$(docker buildx imagetools inspect "$promoted_ref")"
          actual_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspect_output")"

          if [ "$actual_digest" != "$GATEWAY_DIGEST" ]; then
            echo "Promoted gateway digest is [${actual_digest:-missing}], expected [$GATEWAY_DIGEST]." >&2
            exit 1
          fi

          echo "Promoted gateway digest ${GATEWAY_DIGEST} to ${promoted_ref}."

      - name: Promote canonical reverb image version tag
        env:
          REVERB_DIGEST: ${{ steps.manifest.outputs.reverb_digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          accepted_ref="ghcr.io/hardimpactdev/orbit-reverb@${REVERB_DIGEST}"
          promoted_ref="ghcr.io/hardimpactdev/orbit-reverb:${VERSION}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$promoted_ref" \
            "$accepted_ref"

          inspect_output="$(docker buildx imagetools inspect "$promoted_ref")"
          actual_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspect_output")"

          if [ "$actual_digest" != "$REVERB_DIGEST" ]; then
            echo "Promoted reverb digest is [${actual_digest:-missing}], expected [$REVERB_DIGEST]." >&2
            exit 1
          fi

          echo "Promoted reverb digest ${REVERB_DIGEST} to ${promoted_ref}."

      - name: Promote canonical FrankenPHP image version tag
        env:
          FRANKENPHP_DIGEST: ${{ steps.manifest.outputs.frankenphp_digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          accepted_ref="ghcr.io/hardimpactdev/orbit-frankenphp@${FRANKENPHP_DIGEST}"
          promoted_ref="ghcr.io/hardimpactdev/orbit-frankenphp:${VERSION}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$promoted_ref" \
            "$accepted_ref"

          inspect_output="$(docker buildx imagetools inspect "$promoted_ref")"
          actual_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspect_output")"

          if [ "$actual_digest" != "$FRANKENPHP_DIGEST" ]; then
            echo "Promoted FrankenPHP digest is [${actual_digest:-missing}], expected [$FRANKENPHP_DIGEST]." >&2
            exit 1
          fi

          echo "Promoted FrankenPHP digest ${FRANKENPHP_DIGEST} to ${promoted_ref}."

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" = "true" ]; then
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            echo "Published verified GitHub release ${TAG}."
          else
            echo "GitHub release ${TAG} is already published."
          fi

      - name: Keep failed release unpublished
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag || inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "${TAG:-}" ]; then
            echo "Release tag was not resolved; cannot convert the release to a draft." >&2
            exit 0
          fi

          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" = "false" ]; then
            gh release edit "$TAG" --draft --repo "$GITHUB_REPOSITORY"
            echo "Converted ${TAG} back to a draft after a failed verification or promotion step."
          else
            echo "GitHub release ${TAG} remains unpublished."
          fi
