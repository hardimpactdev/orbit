id: c12932c9-046f-54ef-b078-45a48969c3c9
name: task-dependency-auth-write
description: Mint the read token of the dependency install and write the Composer and npm configuration of the task account from it, mode 0600. The remove workflow deletes both files.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    run_id:
      type: string
      pattern: ^[a-f0-9-]{36}$
    user:
      type: string
      minLength: 1
    ssh_execution:
      type: object
    dependency_auth:
      type: object
  required: [operation_id, run_id, user, ssh_execution, dependency_auth]
  additionalProperties: false
jobs:
- name: write
  labels: {role: swamp}
  steps:
  - name: Mint
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        purpose: dependencies
  - name: Clear
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ inputs.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ inputs.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.ssh_execution.target.port }}
          user: ${{ inputs.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - rm
        - -f
        - --
        - ${{ "/home/" + inputs.user + "/.config/composer/auth.json" }}
        - ${{ "/home/" + inputs.user + "/.npmrc" }}
    dependsOn:
    - step: Mint
      condition:
        type: succeeded
  - name: Write composer
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ inputs.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ inputs.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.ssh_execution.target.port }}
          user: ${{ inputs.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - install
        - -D
        - -m
        - '0600'
        - /dev/stdin
        - ${{ "/home/" + inputs.user + "/.config/composer/auth.json" }}
        stdin: ${{ vault.get(inputs.dependency_auth.composer.vault, inputs.dependency_auth.composer.key) }}
    dependsOn:
    - step: Clear
      condition:
        type: succeeded
  - name: Write npm
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ inputs.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ inputs.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.ssh_execution.target.port }}
          user: ${{ inputs.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - install
        - -m
        - '0600'
        - /dev/stdin
        - ${{ "/home/" + inputs.user + "/.npmrc" }}
        stdin: ${{ vault.get(inputs.dependency_auth.npm.vault, inputs.dependency_auth.npm.key) }}
    dependsOn:
    - step: Write composer
      condition:
        type: succeeded
