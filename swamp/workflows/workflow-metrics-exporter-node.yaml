id: d84434b2-1b78-4a5c-ab38-9bc9c96db387
name: metrics-exporter-node
description: Apply the exporter Node part of one metrics.exporter_enable or metrics.exporter_disable intent with official behaviors.
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
jobs:
- name: node
  steps:
  - name: package
    <<: &effect
      labels: {role: swamp}
      writes: true
      guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    guard: '${{ !inputs.intent.enabled || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      <<: &apply {type: behavior, methodName: apply, inputs: {}}
      behaviorType: '@swamp/cfgmgmt/apt'
      behaviorName: '${{ ("metrics-package-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs:
        <<: &target
          nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
          nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
          nodePort: ${{ inputs.intent.ssh_execution.target.port }}
          nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          become: true
        packages: [prometheus-node-exporter]
        ensure: present
  - name: downloads
    <<: *effect
    forEach: {item: download, in: '${{ inputs.intent.service.downloads }}'}
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/fetch'
      behaviorName: '${{ ("metrics-download-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs:
        <<: *target
        url: ${{ self.download.url }}
        path: ${{ self.download.path }}
        checksum: ${{ self.download.checksum }}
        owner: ${{ self.download.owner }}
        group: ${{ self.download.group }}
        mode: ${{ self.download.mode }}
  - name: stopped
    dependsOn: [{step: package, condition: &done {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    <<: *effect
    forEach: {item: unit, in: '${{ inputs.intent.service.units.filter(u, !u.enabled) }}'}
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("metrics-stop-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs:
        <<: *target
        service: ${{ self.unit.service }}
        ensure: ${{ self.unit.ensure }}
        enabled: ${{ self.unit.enabled }}
  - name: directories
    dependsOn: [{step: stopped, condition: {type: always}}]
    <<: *effect
    forEach: {item: directory, in: '${{ ["/etc/systemd/system/prometheus-node-exporter.service.d", "/etc/orbit/service-metrics"] }}'}
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("metrics-directory-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs: {<<: *target, path: '${{ self.directory }}', ensure: present, owner: root, group: root, mode: '0755'}
  - name: files
    dependsOn: [{step: directories, condition: *done}, {step: downloads, condition: {type: always}}]
    <<: *effect
    forEach: {item: file, in: '${{ inputs.intent.service.files }}'}
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("metrics-file-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs:
        <<: *target
        path: ${{ self.file.path }}
        ensure: ${{ self.file.ensure }}
        owner: ${{ self.file.owner }}
        group: ${{ self.file.group }}
        mode: ${{ self.file.mode }}
        content: '${{ "content" in self.file ? self.file.content : "" }}'
  - name: reload_units
    dependsOn: [{step: files, condition: *done}]
    <<: *effect
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-reload-units-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs:
        name: '${{ ("metrics-reload-units-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]
      inputs: {hosts: 'name:target', argv: [/usr/bin/systemctl, daemon-reload], sudo: true}
  - name: started
    dependsOn: [{step: reload_units, condition: *done}]
    <<: *effect
    forEach: {item: unit, in: '${{ inputs.intent.service.units.filter(u, u.enabled) }}'}
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("metrics-start-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs:
        <<: *target
        service: ${{ self.unit.service }}
        ensure: ${{ self.unit.ensure }}
        enabled: ${{ self.unit.enabled }}
  - name: restarted
    dependsOn: [{step: started, condition: {type: always}}]
    <<: *effect
    forEach: {item: unit, in: '${{ inputs.intent.service.units.filter(u, u.enabled) }}'}
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("metrics-restart-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: restart
      globalArgs:
        <<: *target
        service: ${{ self.unit.service }}
        ensure: ${{ self.unit.ensure }}
        enabled: ${{ self.unit.enabled }}
  - name: pools
    dependsOn: [{step: restarted, condition: {type: always}}]
    <<: *effect
    forEach: {item: pool, in: '${{ inputs.intent.service.pools }}'}
    task:
      type: workflow
      workflowIdOrName: operation-php-monitor
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ self.pool }}', execution_secrets: {}}
  - name: caddy
    dependsOn: [{step: pools, condition: {type: always}}]
    <<: *effect
    guard: '${{ inputs.intent.service.caddy == null || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: {caddy_publication: '${{ inputs.intent.service.caddy == null ? {} : inputs.intent.service.caddy }}'}, execution_secrets: {}}
  - name: package_removed
    dependsOn: [{step: reload_units, condition: {type: succeeded}}, {step: caddy, condition: *done}]
    <<: *effect
    guard: '${{ inputs.intent.enabled || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/apt'
      behaviorName: '${{ ("metrics-package-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: {<<: *target, packages: [prometheus-node-exporter], ensure: absent}
