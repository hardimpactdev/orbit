---
- name: Make the overlap credential folder
  ansible.builtin.file:
    path: "{{ renewal_credentials_dir }}"
    state: directory
    owner: "{{ renewal_credential_owner }}"
    group: "{{ renewal_credential_group }}"
    mode: '0750'
# Finish each credential, including its private file, before minting the next.
- name: Prepare each overlap credential independently
  ansible.builtin.include_tasks: swamp-worker-overlap-credential.yml
  loop: [enrollment, server]
  loop_control: {loop_var: renewal_credential_kind}
