command: instance:wake
chart: instance/wake
target: app-dev
sources: [gateway]
baseline: [operations]
uncovered:
  main: "The proof fleet lacks Instance containers. Pest covers admission, the projection of power_state and the Caddy rule; real-Ansible fixtures cover the wake's start with the marker, the web wait and the T3 wait; the live proof runs on a fixture clone."
  "executor:swap-backed-proof": "Subtask 5768 ran 30 signed wakes of real T3/Vite clone 4: Node-to-HTTP-200 p50/p95/max ms 417.586/458.040/599.969, restore 384.604/424.331/567.185, Incus unfreeze API 5.944/11.747/12.300. All were partial/instance.restore_read_failed. A three-clone burst reached the apps at 737.429/1335.262/1702.093 ms. SIGKILL during restore recovered Operation 377; HTTP 200 at 2444.060 ms, signed repeat returned its journaled result. Evidence: .orbit-artifacts/5753/live-proof-5768/summary.json, burst.json and crash-*.jsonl. The executor path remains separate from this production command; CI lacks the clone fixture and the fleet-reset runner was not rerun."
  # Gateway publish-to-result p50/p95/max: 433.813/472.584/613.803 ms; Node timing excludes that transport.
  # Incus cost sums PUT/unfreeze + operation wait connect-to-close; state reads and thaw polling are separate.
  # Wake totals include strace overhead. Every wake restored swap.max=0 and removed the marker.
  # Complete restoration is unproven: a separate diagnostic saw short process_vm_readv reads and madvise EPERM.
  # Crash injection delayed the first restore read by 1 s. Recovery retained one done record; repeat=true.
  failed: "A wake that fails before the app answers keeps power_state; one whose T3 stays silent records running; Pest covers both projections."
cases:
  - id: invalid-id
    batch: fresh-fleet
    covers: []
    summary: Reject a nonnumeric Instance locally.
    act:
      - cli:
          run: [instance:wake, invalid]
          forms: [json, human]
          expect: {exit: 1, code: instance.id_invalid, request: none}
    expect:
      - unchanged: {since: act, what: [operations]}
