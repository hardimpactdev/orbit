---
# Readiness of the nested fleet, the proof's own check (task-nested-ready), from the Instance container over `wg-nested`: what a start
# promises (instance-fleet-reach.yml), then Doctor of the nested Gateway is healthy, the three agents are online and the Gateway knows
# the operator with its key. It runs only on a fleet whose nested Gateway runs the schema of its checkout: at the end of the refresh,
# after its migrate and restart, and in the start of a refreshed or restored fleet (instance-fleet-resume.yml). Input: instance-fleet.yml.
# The Doctor wait is the tool's own `until` and `retries`, every 5 s, bounded by `fleet_ready_seconds` (300 by default), each check by
# its own `timeout`. A failure names the check, and the nested containers or Nodes it found.
- { name: Check what the start promises, ansible.builtin.import_tasks: instance-fleet-reach.yml }

# curl writes the status code on a last line of its own; `000` when no response came. The failure says what the last poll got: the
# status and the first 300 characters of the body, or curl's error when no response came. Doctor's body holds no secret.
- name: Wait for Doctor of the nested Gateway
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '90'] + fleet_curl + ['-w', '\nHTTP %{http_code}', '-X', 'POST', fleet_api ~ '/doctor', '-H', 'Content-Type: application/json',
          '-d', '{}'] }}
  register: fleet_ready_doctor
  changed_when: false
  failed_when: false
  until: fleet_ready_doctor.stdout is match('\{"data":\{"healthy":true')
  retries: "{{ ((fleet_ready_seconds | default(300) | int) / ([fleet_ready_delay | int, 1] | max)) | round(0, 'ceil') | int }}"
  delay: "{{ fleet_ready_delay }}"
- name: Check Doctor
  vars:
    fleet_doctor_lines: "{{ fleet_ready_doctor.stdout_lines | default([]) }}"
    fleet_doctor_last: "{{ fleet_doctor_lines | last | default('') }}"
    fleet_doctor_status: "{{ fleet_doctor_last[5:] if fleet_doctor_last is match('HTTP [0-9]{3}$') else '000' }}"
    fleet_doctor_body: "{{ fleet_doctor_lines[:-1] | join(' ') | trim }}"
    fleet_doctor_error: "{{ fleet_ready_doctor.stderr | default('', true) | trim or ('exit ' ~ fleet_ready_doctor.rc | default('none')) }}"
  ansible.builtin.assert:
    that: fleet_ready_doctor.stdout is match('\{"data":\{"healthy":true')
    fail_msg: >-
      Readiness check 'doctor' failed after {{ fleet_ready_seconds | default(300) }} s:
      {{ ('no response: ' ~ fleet_doctor_error) if fleet_doctor_status == '000'
         else ('HTTP ' ~ fleet_doctor_status ~ ': ' ~ (fleet_doctor_body or '(empty body)')[:300]) }}
    quiet: true

- name: Read the Nodes of the nested Gateway
  ansible.builtin.command: { argv: "{{ ['timeout', '90'] + fleet_curl + ['--fail', fleet_api ~ '/nodes'] }}" }
  register: fleet_ready_nodes
  changed_when: false
- name: Check the agents
  vars:
    fleet_online: >-
      {{ (fleet_ready_nodes.stdout | from_json).data | selectattr('agent', 'truthy') | selectattr('agent.state', 'eq', 'online')
         | map(attribute='name') | list }}
  ansible.builtin.assert:
    that: fleet_roles | difference(fleet_online) | length == 0
    fail_msg: "Readiness check 'agents' failed: the agent of {{ fleet_roles | difference(fleet_online) | join(', ') }} is not online"
    quiet: true
- name: Check the operator
  vars:
    fleet_operator: "{{ (fleet_ready_nodes.stdout | from_json).data | selectattr('name', 'eq', 'operator') | list }}"
  ansible.builtin.assert:
    that: fleet_operator | length == 1 and fleet_operator[0].wireguard_public_key | default(none) is not none
    fail_msg: "Readiness check 'operator' failed: the nested Gateway does not know the operator and its key"
    quiet: true
