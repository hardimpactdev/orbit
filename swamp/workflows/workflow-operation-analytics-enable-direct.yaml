id: 38e1a160-f17b-4d31-b77c-36dfd78ed570
name: operation-analytics-enable-direct
description: "Analytics enable in the chart's steps; Node work through official cfgmgmt and SSH behaviors (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: analytics.enable}
    intent: {type: object}
    execution_secrets:
      type: object
      properties:
        plausible_credentials:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^analytics-plausible-[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$'}
          required: [vault, key]
          additionalProperties: false
      required: [plausible_credentials]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: analytics
  labels: {role: swamp}
  steps:
    # The Plausible site, goals and settings through its API; the credentials come from the vault.
  - name: 'Converge the site'
    labels: {role: swamp}
    dependsOn: []
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-site'
      behaviorName: analytics-plausible-site
      methodName: site
      inputs:
        base_url: '${{ inputs.intent.base_url }}'
        site: '${{ inputs.intent.site }}'
        env:
          ORBIT_ANALYTICS_CREDENTIALS: '${{ vault.get(inputs.execution_secrets.plausible_credentials.vault, inputs.execution_secrets.plausible_credentials.key) }}'
    # Per tracking leaf on its Router: a Node-local key and its public CSR (route-create-csr).
  - name: 'Request the certificate'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Converge the site', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-csr
      inputs:
        intent: '${{ inputs.intent }}'
        leaf: '${{ self.leaf }}'
    # Per leaf: 209 has the CSR signed; the one Gateway call (route-create-sign).
  - name: 'Sign the CSR'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Converge the site', condition: {type: always}}
    - {step: 'Request the certificate', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        parent_run_id: '${{ run.id }}'
        leaf: '${{ inputs.intent.leaves[self.leaf] }}'
        request: '${{ steps["Request the certificate-" + string(self.leaf)].outputs.csr.stdout }}'
    # Each Router and Ingress: certificates, the whole Caddyfile with the tracking sites, then old scopes (route-target-retire).
  - name: 'Publish Caddy, reload'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Converge the site', condition: {type: always}}
    - {step: 'Request the certificate', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-retire
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ run.id }}'
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSR-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: {}
    # From 209 to the Router on 443 with the tracking host as SNI; a failed chain fails the step.
  - name: 'Probe the tracking host'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Converge the site', condition: {type: always}}
    - {step: 'Request the certificate', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Publish Caddy, reload', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: probe, in: '${{ inputs.intent.probes }}'}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("analytics-probe-" + string(self.probe.node_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: "timeout 20 openssl s_client -connect \"$ORBIT_PROBE_ADDRESS:443\" -servername \"$ORBIT_PROBE_DOMAIN\" -verify_hostname \"$ORBIT_PROBE_DOMAIN\" -verify_return_error -CAfile /usr/local/share/ca-certificates/orbit-managed-root-ca.crt </dev/null"
        env:
          ORBIT_PROBE_ADDRESS: '${{ self.probe.address }}'
          ORBIT_PROBE_DOMAIN: '${{ self.probe.domain }}'
    # Only outside the TLD: the whole private DNS, written by the dns-publish phase.
  - name: 'Publish private DNS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Converge the site', condition: {type: always}}
    - {step: 'Request the certificate', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Publish Caddy, reload', condition: {type: always}}
    - {step: 'Probe the tracking host', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: vpn, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: dns-publish
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ self.vpn.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          node_id: '${{ self.vpn.node_id }}'
          connection:
            nodeHost: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host }}'
            nodeUser: '${{ inputs.intent.nodes[string(self.vpn.node_id)].user }}'
            nodePort: '${{ inputs.intent.nodes[string(self.vpn.node_id)].port }}'
            nodeIdentityFile: '${{ inputs.intent.nodes[string(self.vpn.node_id)].identity_file }}'
            become: true
          host_keys: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host_keys }}'
          dns: '${{ self.vpn.dns }}'
        execution_secrets: {}
