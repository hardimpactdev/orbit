          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: stage
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            admission: ${{ steps.admit.outputs }}
            stage: agent
            binary_changed: "${{ has(steps.agent_install) && has(steps.agent_install.outputs) ? steps.agent_install.outputs.binary_changed
              : false }}"
            cancellation: ${{ steps.agent_cancellation.outputs }}
        guard: ${{ !steps.admit.outputs.ready }}
        dependsOn:
          - step: agent_cancellation
            condition:
