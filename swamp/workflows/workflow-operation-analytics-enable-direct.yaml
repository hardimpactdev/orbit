id: 38e1a160-f17b-4d31-b77c-36dfd78ed570
name: operation-analytics-enable-direct
description: Converge Plausible and tracking Routes through one native placed DAG.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - analytics.enable
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: prepare
  writes: true
  steps:
  - name: begin
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: begin
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: site
  writes: true
  steps:
  - name: site
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: site
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
- name: requests
  writes: true
  steps:
  - name: request
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-certificate'
      behaviorName: ${{ "analytics-cert-node-" + string(self.item.node_id) }}
      methodName: request
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item.node_id }}
        leaf: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.certificates }}
  dependsOn:
  - job: site
    condition:
      type: succeeded
- name: sign
  writes: true
  steps:
  - name: sign
    target: orbit-node-209
    labels:
      node: "209"
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: orbit-certificate-signing
      methodName: signBatch
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaves: '${{ steps.begin.outputs.tracking.certificates.map(leaf, {"node_id": leaf.node_id, "scope": leaf.scope, "agent_sha256": leaf.agent_sha256, "domain": leaf.domain, "version": leaf.version, "root_hash": leaf.root_hash, "user": leaf.user}) }}'
        target_node_id: 209
        requests: ${{ steps.filter(name, name.startsWith("request-")).map(name, [steps[name].outputs]) }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: requests
    condition:
      type: succeeded
- name: certificates
  writes: true
  steps:
  - name: certificate
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-certificate'
      behaviorName: ${{ "analytics-cert-node-" + string(self.item.node_id) }}
      methodName: publish
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item.node_id }}
        leaf: ${{ self.item }}
        signed: ${{ steps.sign.outputs.certificates.filter(c, c.node_id == self.item.node_id && c.scope
          == self.item.scope) }}
        requests: ${{ steps.filter(name, name.startsWith("request-")).map(name, steps[name].outputs) }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.certificates }}
  dependsOn:
  - job: sign
    condition:
      type: succeeded
- name: records
  writes: true
  steps:
  - name: publish_records
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: publishRecords
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: certificates
    condition:
      type: succeeded
- name: router
  writes: true
  steps:
  - name: router_caddy
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.item) }}
      methodName: publishCaddy
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.router_node_ids }}
  dependsOn:
  - job: records
    condition:
      type: succeeded
- name: verify
  writes: true
  steps:
  - name: verify_public
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-certificate'
      behaviorName: ${{ "analytics-cert-node-" + string(self.item) }}
      methodName: verifyPublic
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.public_verify_node_ids }}
  dependsOn:
  - job: router
    condition:
      type: succeeded
- name: activate
  writes: true
  steps:
  - name: public_verified
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: publicVerified
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: verify
    condition:
      type: succeeded
- name: ingress
  writes: true
  steps:
  - name: ingress_caddy
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.item) }}
      methodName: publishCaddy
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.ingress_node_ids }}
  dependsOn:
  - job: activate
    condition:
      type: succeeded
- name: firewall
  writes: true
  steps:
  - name: ingress_firewall
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.item) }}
      methodName: publishFirewall
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.firewall_node_ids }}
  dependsOn:
  - job: ingress
    condition:
      type: succeeded
- name: dns
  writes: true
  steps:
  - name: dns
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.item) }}
      methodName: publishDns
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.dns_node_ids }}
  dependsOn:
  - job: firewall
    condition:
      type: succeeded
- name: grace
  writes: true
  steps:
  - name: dns_grace
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: dnsGrace
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: dns
    condition:
      type: succeeded
- name: retire
  writes: true
  steps:
  - name: placement_cleanup
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: placementCleanup
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: grace
    condition:
      type: succeeded
- name: retired_hosts
  writes: true
  steps:
  - name: retired_caddy
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.item) }}
      methodName: publishCaddy
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.cleanup_caddy_node_ids }}
  dependsOn:
  - job: retire
    condition:
      type: succeeded
- name: retired_dns
  writes: true
  steps:
  - name: retired_dns
    target: ${{ "orbit-node-" + string(self.item) }}
    labels:
      node: ${{ string(self.item) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.item) }}
      methodName: publishDns
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.dns_node_ids }}
  dependsOn:
  - job: retired_hosts
    condition:
      type: succeeded
- name: cleanup
  writes: true
  steps:
  - name: cleanup
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-certificate'
      behaviorName: ${{ "analytics-cert-node-" + string(self.item.node_id) }}
      methodName: remove
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item.node_id }}
        leaf: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.cleanup }}
  dependsOn:
  - job: retired_dns
    condition:
      type: succeeded
- name: finish
  dependsOn:
  - job: prepare
    condition:
      type: always
  - job: site
    condition:
      type: always
  - job: requests
    condition:
      type: always
  - job: sign
    condition:
      type: always
  - job: certificates
    condition:
      type: always
  - job: records
    condition:
      type: always
  - job: router
    condition:
      type: always
  - job: verify
    condition:
      type: always
  - job: activate
    condition:
      type: always
  - job: ingress
    condition:
      type: always
  - job: firewall
    condition:
      type: always
  - job: dns
    condition:
      type: always
  - job: grace
    condition:
      type: always
  - job: retire
    condition:
      type: always
  - job: retired_hosts
    condition:
      type: always
  - job: retired_dns
    condition:
      type: always
  - job: cleanup
    condition:
      type: always
  writes: true
  steps:
  - name: finish
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: finish
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        successful: ${{ steps.all(name, name == "finish" || steps[name].status == "succeeded") }}
