name: Orbit CLI Binary

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      changed-only:
        description: Skip packaging when this CI commit has no changed CLI inputs.
        type: boolean
        default: false
      commit:
        description: Full commit SHA to build.
        required: true
        type: string
      version:
        description: Version the binaries report, 0.N.0.
        required: true
        type: string

permissions:
  contents: read

# Only PR runs share a group. Release calls and manual builds must not cancel each other.
concurrency:
  group: cli-binary-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'

jobs:
  # Every target is built on Linux amd64. PHPacker does not compile: it appends the PHAR to a prebuilt static PHP for the
  # target, so the host only needs PHP and Composer.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.value }}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
            platform: linux
            architecture: x64
            artifact: orbit-linux-x64
            path: apps/cli/builds/dist/linux/linux-x64
          - target: macos-arm64
            runner: ubuntu-26.04
            platform: mac
            architecture: arm
            artifact: orbit-macos-arm64
            path: apps/cli/builds/dist/mac/mac-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}

      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          job: cli
          enabled: ${{ inputs.changed-only && 'true' || 'false' }}

      # The recipe's exact PHP build and pinned Composer (ADR 0216), as in every other PHP job. It only builds the
      # PHAR; the binary runs PHPacker's static PHP.
      - name: Set up PHP
        if: steps.scope.outputs.selected == 'true'
        uses: ./.github/actions/php
        with:
          coverage: none

      - name: Read build version
        if: steps.scope.outputs.selected == 'true'
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION:-$(bin/orbit-version)}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache CLI build dependencies
        if: steps.scope.outputs.selected == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/cli/vendor
            apps/cli/phpacker/vendor
          key: cli-build-${{ runner.os }}-8.5-${{ hashFiles('apps/cli/composer.lock', 'apps/cli/phpacker/composer.lock', 'packages/php-sdk/composer.json') }}

      - name: Install CLI dependencies
        if: steps.scope.outputs.selected == 'true'
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --optimize-autoloader

      - name: Install isolated PHPacker
        if: steps.scope.outputs.selected == 'true'
        run: composer install --working-dir=apps/cli/phpacker --no-interaction --prefer-dist

      - name: Build binary
        if: steps.scope.outputs.selected == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: bin/orbit-build-cli-binary "${{ matrix.platform }}" "${{ matrix.architecture }}" "$VERSION"

      - name: Upload binary
        if: steps.scope.outputs.selected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
