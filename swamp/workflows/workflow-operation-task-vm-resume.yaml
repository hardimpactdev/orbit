id: de1b2603-fc9c-4054-91ec-3f51474109bb
name: operation-task-vm-resume
description: Start one task VM from 209 over pinned SSH, converge 209's SSH access when it was ready, and assert its agent and Pi answer.
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [task_vm.resume]}
    intent:
      type: object
    execution_secrets: {type: object, additionalProperties: false}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: start
  steps:
    # Guards compare with the other value: on pinned e459 a root step guard of the form `x != "y"` that is false is refused at run start.
    # Incus: a VM that already runs makes `incus start` exit 1 and counts as started; the agent wait proves it.
  - name: Start the VM
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-resume-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-resume-" + string(inputs.node_id) }}
        transport: &host_transport
          kind: ssh
          user: "${{ inputs.intent.provider_input.host_ssh_execution.target.user }}"
          port: "${{ inputs.intent.provider_input.host_ssh_execution.target.port }}"
          identityFile: "${{ inputs.intent.provider_input.host_ssh_execution.identity_file }}"
        hosts: &host
        - name: target
          address: "${{ inputs.intent.provider_input.host_ssh_execution.target.host }}"
          transport:
            hostKeys: "${{ inputs.intent.provider_input.host_ssh_execution.target.host_keys }}"
      inputs:
        hosts: name:target
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '60', incus, start, --project, "${{ inputs.intent.provider_input.vm.project }}", --, '${{ inputs.intent.name }}']
  - name: Wait for the guest agent
    labels: {role: swamp}
    dependsOn:
    - step: Start the VM
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-resume-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-resume-" + string(inputs.node_id) }}
        transport: *host_transport
        hosts: *host
      inputs:
        hosts: name:target
        sudo: true
        # Q-WAIT: Incus's own bounded wait for the guest agent.
        argv: [timeout, '130', incus, wait, --project, "${{ inputs.intent.provider_input.vm.project }}", --timeout, '120', --interval, '1', --, '${{ inputs.intent.name }}', agent]
- name: converge
  dependsOn:
  - job: start
    condition: {type: succeeded}
  steps:
    # A ready VM may have lost 209's access, so Incus reaches it through `incus exec` on the host, not its own SSH.
  - name: Converge 209 SSH access
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.mode == "resume" }}
    forEach:
      item: change
      in: '${{ [{"argv": ["/usr/bin/install", "-D", "-m", "0600", "-o", inputs.intent.user, "-g", inputs.intent.user, "/dev/stdin", "/home/" + inputs.intent.user + "/.ssh/authorized_keys2"], "stdin": inputs.intent.ssh_identity.public_key + "\n"}, {"argv": ["/bin/sh", "-c", "ufw --force delete allow in on orbit proto tcp from 10.44.0.15 to any port 22 comment orbit:task-vm-ssh-209 && ufw --force delete deny in proto tcp to any port 22 comment orbit:task-vm-ssh-only && ufw prepend deny in proto tcp to any port 22 comment orbit:task-vm-ssh-only && ufw prepend allow in on orbit proto tcp from 10.44.0.15 to any port 22 comment orbit:task-vm-ssh-209 && ufw allow in on orbit proto tcp from 10.44.0.15 to any port 3774 comment orbit:task-vm-pi-209 && ufw allow in on orbit proto tcp from 10.44.0.2 to any port 3774 comment orbit:task-vm-pi-gateway && ufw allow in on orbit proto tcp to any port 443 comment orbit:task-vm-site && ufw --force enable"], "stdin": ""}, {"argv": ["/usr/bin/systemctl", "enable", "--now", "ssh.service"], "stdin": ""}] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-resume-converge-" + string(inputs.intent.guest_node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-resume-converge-" + string(inputs.intent.guest_node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: "${{ (inputs.intent.provider_input.host_ssh_execution).target.user }}"
          port: "${{ (inputs.intent.provider_input.host_ssh_execution).target.port }}"
          identityFile: "${{ (inputs.intent.provider_input.host_ssh_execution).identity_file }}"
        hosts:
        - name: target
          address: "${{ (inputs.intent.provider_input.host_ssh_execution).target.host }}"
          transport:
            hostKeys: "${{ (inputs.intent.provider_input.host_ssh_execution).target.host_keys }}"
      inputs:
        hosts: name:target
        sudo: false
        argv: "${{ ([\"/usr/bin/sudo\", \"-n\", \"--\", \"/usr/bin/incus\", \"--project\", inputs.intent.provider_input.vm.project, \"exec\", \"--mode=non-interactive\", \"--user\", \"0\", \"--group\", \"0\", \"--\", inputs.intent.name]) + self.change.argv }}"
        stdin: ${{ self.change.stdin }}
        timeoutSec: 180
- name: check
  dependsOn:
  - job: converge
    condition: {type: succeeded}
  steps:
  - name: Read the guest state
    labels: {role: swamp}
    forEach:
      item: read
      in: '${{ ["agent", "pi"] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-resume-read-" + string(inputs.intent.guest_node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-resume-read-" + string(inputs.intent.guest_node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: 22
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        # The Pi token stays in its guest file; only the capability answer's status leaves the VM.
        argv: '${{ self.read == "agent" ? ["/usr/bin/systemctl", "is-active", "orbit-agent.service"] : ["/usr/bin/python3", "-B", "-c", "import json\nimport sys\nimport urllib.request\nfrom pathlib import Path\nvalue=json.load(sys.stdin)\ntoken=Path(\"/home/orbit/.pi/agent/orbit-token\").read_text().strip()\nrequest=urllib.request.Request(value[\"pi_url\"].rstrip(\"/\")+\"/capabilities\",headers={\"Authorization\":\"Bearer \"+token})\ntry:\n    with urllib.request.urlopen(request,timeout=10) as response:\n        if response.status!=200:raise ValueError(\"not ready\")\nexcept Exception:\n    print(\"task_vm.resume_failed\",file=sys.stderr)\n    raise SystemExit(1)\nprint(json.dumps({\"pi_ready\":True}))\n"] }}'
        stdin: '${{ self.read == "pi" ? inputs.intent.runtime_json : "" }}'
        timeoutSec: 30
  - name: Check the guest is ready
    labels: {role: swamp}
    dependsOn:
    - step: Read the guest state
      condition: {type: succeeded}
    task:
      type: assert
      expr: 'steps["Read the guest state-agent"].outputs.stdout.startsWith("active") && steps["Read the guest state-pi"].outputs.stdout.contains("\"pi_ready\": true")'
      severity: high
      message: task_vm.resume_failed
