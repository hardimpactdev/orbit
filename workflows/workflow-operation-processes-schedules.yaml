id: 957148f7-6f7a-4f69-923c-636e1289b34d
name: operation-processes-schedules
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "9,39 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-processes-schedules-discovery
          methodName: discover
          inputs:
            family: operation-processes-schedules
            kinds: ["process.create", "process.update", "schedule.create", "process.install_instance_definitions", "schedule.install_instance_definitions", "process.restart_instance"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-processes-schedules"
          behaviorName: '${{ "operation-processes-schedules-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: "${{ self.work.kind }}"
            worker: '${{ self.work.worker }}'
