---
# Both the role add and the converge start token renewal once its units are written and reloaded, and fail unless it runs
# (Operation 32394 left it disabled and inactive). Token renewal restarts no worker: it mints, switches files and revokes an old
# generation only after its worker reconnected.
- name: Start token renewal
  ansible.builtin.systemd: { name: orbit-swamp-token-renewal.timer, state: started, enabled: true }
- name: Check token renewal is active and enabled
  ansible.builtin.command: { argv: [systemctl, "{{ item }}", orbit-swamp-token-renewal.timer] }
  loop: [is-active, is-enabled]
  changed_when: false
