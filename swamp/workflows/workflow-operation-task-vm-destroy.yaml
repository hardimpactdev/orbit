id: 3d11d920-5ae2-4a1f-8d47-19bddfe0ccbe
name: operation-task-vm-destroy
description: Destroy one task VM through the shared task-vm-destroy child; the Gateway reads the run's step statuses.
queueTimeout: 60
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [task_vm.destroy]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-pi-token-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: destroy
  steps:
  - name: Destroy the task VM
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
