# Spec for node:converge. Format: docs/reference/verification-cases.
# A planned case uses only implemented runner steps; uncovered entries request missing capabilities.
command: node:converge
chart: node/converge
target: app-dev
sources: [gateway, app-prod]
baseline: [ufw, firewall_records, operations, listeners]
parallel: 1

uncovered:
  "cli:caller-only": "Need CLI release publication fault control and managed-file fixtures to prove no-caller convergence succeeds with release_missing, removes the managed link, versioned binaries and root profile, and changes nothing on repeat; a ci-runner Node still requires its pin. Gateway admission tests and swamp/tests/node_converge_cli_test.ts cover these boundaries locally. Task VM proof retains the checkout source CLI."
  "phases:ordered-desired-state": "Need ordered Operation-phase and Ansible-result assertions to prove input, agent, software, roles, tools, network, check on every run, with recipe.json pins held and an unchanged phase skipped by its digest. Current code uses a digest-selected artifact plan and lacks this phase pipeline, the CLI installation and general role/software/Tool application."
  "case:drift-repair": "Need a managed-artifact damage fixture plus content, permissions and Instance/role snapshot assertions to prove default converge repairs a damaged Orbit-owned file while Instance files, Instance records and role assignments remain unchanged. A default converge whose phases are unchanged does not see that drift; the check phase or --full must find it."
  "scope:base": "Need a multi-role Node fixture and before/after artifact, package and Tool snapshots to prove --base changes only the agent, the Node’s CLI state, Orbit-owned files and units, leaving role-owned state and Instances untouched. The base-scope case checks flag admission and the end phase; current code has no scope flag."
  "scope:selected-roles": "Need a multi-role Node fixture and scoped state snapshots to prove --roles=a,b repairs only the base and those recorded roles, never another role, an Instance or an assignment. The selected-roles case checks flag admission and the end phase; current code has no role selection."
  "path:unassigned-role": "Need a fixture with a known but unassigned role to prove the unassigned-role path returns validation.failed without assigning it, starting an Operation or touching the Node. Empty, unknown and conflicting scope inputs have executable cases below."
  "case:keyed-retry-identity": "Need captured Operation-ID equality and native-run-count assertions to complete keyed-retry: the same --idempotency-key returns the same Operation and starts nothing. The executable case already proves the retry creates no Operation; current keyed admission is implemented."
  "case:failure-after-partial-change": "Need phase-boundary fault injection and managed-state snapshots to fail after a real change, retain the changed state, and prove a fresh default attempt repairs the remainder from input without changing Instances or assignments. The firewall-only fault step cannot inject this failure reliably."
  "path:unsupported-node": "Need recorded inactive, unmanaged and non-Linux target fixtures to prove node.converge_unsupported before an Operation or Node contact. The eligibility refusal exists in StartNodeConvergeAction."
  "path:target-busy": "Need a held node.converge Operation on either the target or a different peer sharing its hub to prove operation.target_busy and no new Operation. busy_node only holds firewall writes; the converge reservation exists in NodeNetworkReservation."
  "network:ordering-and-handshake": "Need network drift fixtures, hub/peer mutation-order assertions and handshake observations to prove hub-first repair, waiting for the handshake and no reload on matching state. The existing network workflow has live comparison and a handshake check but not the required shared Ansible phase."
  "network:prune-keeps-newer-nodes": "Need a hub peer-file fixture and a Node created between admission and the network phase to prove the prune deletes only the files of gone or removing Nodes and keeps the new Node's file and live peer. swamp/tests/ansible_hub_prune_test.py proves the prune task on fixed files."
  "path:no-recorded-network": "Need no-network and peerless-hub fixtures plus phase-result assertions to prove the network phase makes no change without a recorded network in scope and applies a target hub once without a handshake if it has no peers. Every run still visits the phase."
  "tools:isolated-failure": "Need recorded Tool fixtures, a Tool-only install fault and per-Tool result assertions to prove other Tools continue, held role packages stay pinned and the Operation succeeds when only one Tool fails. Current node convergence does not apply recorded Tools."
  "path:cleanup": "Need private-run-file existence checks and cleanup/interruption fault injection to prove run-owned files are removed after work stops, completed changes remain and incomplete cleanup preserves the original failure. Current convergence has no private Ansible run directory or cleanup step."
  "admission:recorded-only": "Need request-time contact tracing to prove admission uses recorded state and never contacts the Node before starting the Operation, including with missing or stale agent facts. A missing agent report is not an additional eligibility refusal."

cases:
  - id: default-scope
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: One default converge is the main path; a full repeat runs every phase and changes nothing within 120 seconds; a keyed retry creates no Operation.
    stages:
      # Required arguments alone apply the default scope and reach the final phase.
      - act:
          - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
        expect: []
      # An intentional repeat is a new Operation. With --full every phase runs on matching intent, with zero target changes within 120 seconds.
      - act:
          - cli:
              run: [node:converge, "${app-dev.id}", --full, --idempotency-key=proof-node-converge-retry]
              expect:
                exit: 0
                status: succeeded
                steps: {name: Check the Node, count: 1}
                json:
                  - {path: result.changed, equals: 0}
                  - {path: result.elapsed_seconds, at_most: 120}
        expect: []
      # The same request and key again returns the Operation of the repeat and starts nothing.
      - act:
          - cli: {run: [node:converge, "${app-dev.id}", --full, --idempotency-key=proof-node-converge-retry], expect: {exit: 0, status: succeeded, request: none}}
        expect:
          - unchanged: {since: act, what: [operations]}

  - id: base-scope
    batch: fresh-fleet
    covers: [main, admitted, base-scope, succeeded]
    summary: The base flag admits a converge limited to Orbit's own layer; --full runs its phases again.
    stages:
      - act:
          - cli: {run: [node:converge, "${app-dev.id}", --base], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
        expect: []
      - act:
          - cli: {run: [node:converge, "${app-dev.id}", --base, --full], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}, json: [{path: result.changed, equals: 0}]}}
        expect: []

  - id: selected-roles
    batch: fresh-fleet
    covers: [main, admitted, selected-roles, succeeded]
    summary: A recorded role can be selected with the base without adding a role.
    act:
      - cli: {run: [node:converge, "${app-dev.id}", --roles=app-dev], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
    expect: []

  - id: executor-installed
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: A converge of an app-dev Node installs the pinned executor and leaves its plain service running (ADR 0266 slice 1).
    fails_today: Until the pinned delivery carries executor-linux-x86_64 and the Gateway pins a key, the converge skips the install with its reason.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-relay-noop
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: With the proof key pinned, a converge installs the executor, and a signed proof.noop order through the relay runs once; a replay and a repeat return its result.
    fails_today: Until the pinned delivery carries executor-linux-x86_64, the converge skips the install with executor.release_missing.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
      - executor_order: {on: app-dev, operation: proof-relay-noop, save: first_nonce, expect: {status: done, repeat: false, operation: proof-relay-noop}}
      - executor_order: {on: app-dev, operation: proof-relay-noop, nonce: first_nonce, expect: {status: refused, reason: replayed_nonce}}
      - executor_order: {on: app-dev, operation: proof-relay-noop, expect: {status: done, repeat: true}}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-caller-refusals
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: The executor refuses another user at the socket, and root outside the observer's unit and the relay user running another program with no reply and a logged code.
    fails_today: Until the pinned delivery carries executor-linux-x86_64, the converge skips the install with executor.release_missing.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
      - executor_order: {on: app-dev, operation: proof-refusal-user, as: other_user, expect: {connect: denied}}
      - executor_order: {on: app-dev, operation: proof-refusal-root, as: root_outside_observer, expect: {refused_caller: caller_outside_observer_unit}}
      - executor_order: {on: app-dev, operation: proof-refusal-program, as: relay_other_program, expect: {refused_caller: caller_relay_other_program}}
      - executor_order: {on: app-dev, operation: proof-refusal-relay, expect: {status: done, repeat: false}}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-order-security
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: Orders published as executor-order reach the executor only through the observer's pass-through; a bad signature, a changed action or target, an expired, replayed, unknown-action or wrong-Node order is refused and logged with its own code (ADR 0266 slice 2).
    fails_today: Until the pinned delivery carries executor-linux-x86_64 and an observer release with the executor-order pass-through, the converge skips the install with executor.release_missing and no order reaches the executor.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
      - executor_publish: {on: app-dev, operation: proof-ws-replay, replay: true, expect: {done: true, refused: replayed_nonce}}
      - executor_publish: {on: app-dev, operation: proof-ws-bad-signature, tamper: bad_signature, expect: {refused: bad_signature}}
      - executor_publish: {on: app-dev, operation: proof-ws-changed-action, tamper: changed_action, expect: {refused: bad_signature}}
      - executor_publish: {on: app-dev, operation: proof-ws-changed-target, tamper: changed_target, expect: {refused: bad_signature}}
      - executor_publish: {on: app-dev, operation: proof-ws-expired, tamper: expired, expect: {refused: expired}}
      - executor_publish: {on: app-dev, operation: proof-ws-unknown-action, tamper: unknown_action, expect: {refused: unknown_action}}
      - executor_publish: {on: app-dev, operation: proof-ws-wrong-node, tamper: wrong_node, expect: {refused: wrong_node}}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-websocket-burst
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: 50 signed proof.noop orders published one after another over the observer's WebSocket each get a done result; the latency from the Gateway's publish to the executor's result is saved as evidence (ADR 0266 slice 2).
    fails_today: Until the pinned delivery carries executor-linux-x86_64 and an observer release with the executor-order pass-through, the converge skips the install with executor.release_missing and no order reaches the executor.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
      - executor_publish: {on: app-dev, operation: proof-ws-burst, count: 50, expect: {done: true}}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-round-trip
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: 50 executor.proof Operations, one after another, each publish a signed proof.noop as executor-order and get a done result in a waiting request through the listener and Valkey; each result is recorded on its Operation, each action runs once, and the latency from publish to the waiting request is saved as p50, p95 and max (ADR 0266 slice 3).
    fails_today: Until the pinned delivery carries executor-linux-x86_64 and an observer release with the executor-order pass-through, the converge skips the install with executor.release_missing and no result reaches the waiting request.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
      - executor_round_trip: {on: app-dev, operation: proof-round-trip, count: 50}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-lost-result
    batch: fresh-fleet
    covers: [main, admitted, succeeded]
    summary: An executor.proof Operation whose first result is recorded but whose hand-off to Valkey is dropped leaves a new waiting request with a timeout; a new signed order with a new nonce for the same Operation is answered as a repeat with the first result, which reaches the waiting request, and the executor's journal shows one run (ADR 0266 slice 3).
    fails_today: Until the pinned delivery carries executor-linux-x86_64 and an observer release with the executor-order pass-through, the converge skips the install with executor.release_missing and no result reaches the waiting request.
    setup:
      - executor_key: {}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded, steps: {name: Check the Node, count: 1}}}
      - executor_lost_result: {on: app-dev, operation: proof-lost-result}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: executor-whole-container-sleep
    batch: fresh-fleet
    exclusive: true
    covers: []
    summary: A signed sleep of the real executor-sleep-clone with T3 and Vite records a durable power proof Operation, a complete whole-container plan, swap limits and the asleep marker.
    # Live evidence, subtask 5768 run 2: .orbit-artifacts/5753/live-proof-5768/run-2/summary.json,
    # samples.csv, rust-samples.jsonl, python-samples.jsonl, durable-operations.json and journal-audit.json.
    # Fixed executor SHA-256 6c133c9cdf3d719b802791f23b7b46674548736d9cf6e06b2f671aafa985ce50.
    # Clone 4 runs T3 0.1.7 + Vite 7.2.2 (port 8080). Every plan includes all 15 subtree processes.
    # 30 signed sleep/wake pairs: every Operation succeeded, every wake done, every failed-page count 0.
    # Sleep p50/p95/max ms: 452.304/543.592/551.332; reclaim 398.938/492.065/494.284.
    # RAM after each sleep: 14544896..16154624 bytes; swap 378744832..379793408, nonzero every time.
    # Swap limits open 0 -> max -> 0. Every sample's RAM/swap and pages read are in samples.csv.
    # Wake to HTTP 200 p50/p95/max ms: 147.840/494.080/517.545; restore 122.675/417.062/478.530.
    # Incus PUT/unfreeze + wait: 9.471/18.734/19.041 ms (connect-to-close; strace overhead included).
    # Pages read per wake: 91932..92180, p50/p95/max 92127/92177/92180; zero failed pages.
    # Diagnosis: 39 lightweight guards inside 16 readable anonymous VMAs set pagemap bits 58 and 62.
    # Capture excludes guard markers; short reads skip/count failed pages and continue the item.
    # Linux 7.0 remote process_madvise checks CAP_SYS_NICE in the initial user namespace: nested EPERM.
    # Post-fix diagnostic: 129 EPERM hints, 129 successful readv batches, zero failures, done.
    # Same-clone Python sleep: 509.563/5644.503/5822.532 ms; reclaim 293/500/511.
    # Python RAM: 14553088..14766080 bytes; swap 380137472..381841408.
    # All 30 Python captures skipped/placement_unproven: timings do not cover the same work; not like for like.
    # Three real clones woke done at 238.297/402.372/484.466 ms; zero failed pages (burst.json).
    # SIGKILL during a delayed read recovered Operation 447: HTTP 200 after 2352.641 ms;
    # restored 92311 pages, zero failures, signed repeat done/repeat=true (4.774 ms).
    # Fresh Gateway/Node audit: Operations 380-439, 443-445 and 447 all succeeded;
    # exactly one journal completion each, all outcomes done, matching action/target/outcome, zero mismatches.
    # journal-audit.json holds each completion and counts; compaction removed expired open/seen records.
    # Manual existing-helper proof; shared fleet-reset runner, converge and production flows not rerun.
    fails_today: CI proof remains disabled; its fresh fleet does not create the real T3/Vite clone fixture. Live swap-backed manual proof returned done for all single, burst and recovered wakes.
    setup:
      - executor_key: {}
    act:
      - executor_power: {on: app-dev, instance: executor-sleep-clone, operation: whole-container-sleep}
    expect:
      - service: {on: app-dev, name: orbit-executor.service, state: active}

  - id: unknown-node
    batch: fresh-fleet
    read_only: true
    covers: [main, unknown-node]
    summary: An unknown numeric Node ID is refused without an Operation.
    act:
      - cli: {run: [node:converge, "2147483647"], expect: {exit: 1, code: http.404, request: none}}
    expect:
      - unchanged: {since: act}

  - id: invalid-node-id
    batch: fresh-fleet
    read_only: true
    covers: []
    summary: Zero, negative and option-like IDs are refused locally without an Operation.
    variants:
      - {name: zero, id: "0"}
      - {name: negative, id: "-1"}
      - {name: option-like, id: "--not-a-node"}
    fails_today: Option-like IDs are currently treated as Node names rather than invalid numeric IDs.
    act:
      - cli: {run: [node:converge, --, "${id}"], forms: [human], expect: {exit: 1, code: node.id_invalid, request: none}}
    expect:
      - unchanged: {since: act}

  - id: nonnumeric-node-id
    batch: fresh-fleet
    read_only: true
    covers: []
    summary: A nonnumeric Node selector is invalid rather than a name lookup.
    fails_today: NodeCommand currently accepts names and reports node.not_found for an unknown name.
    act:
      - cli: {run: [node:converge, not-a-node-id], expect: {exit: 1, code: node.id_invalid, request: none}}
    expect:
      - unchanged: {since: act}

  - id: missing-node-id
    batch: fresh-fleet
    read_only: true
    covers: []
    summary: Missing required input in machine mode returns the command's invalid-ID error without an Operation.
    fails_today: The required framework argument currently refuses before node.id_invalid can be rendered.
    act:
      - cli: {run: [node:converge], expect: {exit: 1, code: node.id_invalid, request: none}}
    expect:
      - unchanged: {since: act}

  - id: conflicting-scope
    batch: fresh-fleet
    read_only: true
    covers: []
    summary: The two incompatible scope flags are refused before an Operation.
    fails_today: The CLI has neither scope option nor their validation.
    act:
      - cli: {run: [node:converge, "${app-dev.id}", --base, --roles=app-dev], expect: {exit: 1, code: validation.failed, request: none}}
    expect:
      - unchanged: {since: act}

  - id: invalid-role-selection
    batch: fresh-fleet
    read_only: true
    covers: []
    summary: Empty and unknown role selections are refused without an Operation.
    variants:
      - {name: empty, roles: ""}
      - {name: unknown, roles: not-a-role}
    fails_today: The CLI has no --roles option or selection validation.
    act:
      - cli: {run: [node:converge, "${app-dev.id}", "--roles=${roles}"], expect: {exit: 1, code: validation.failed, request: none}}
    expect:
      - unchanged: {since: act}

  - id: no-force-option
    batch: fresh-fleet
    read_only: true
    covers: []
    summary: The removed force option cannot start a converge.
    fails_today: The CLI still accepts --force and starts an artifact converge.
    act:
      - cli: {run: [node:converge, "${app-dev.id}", --force], expect: {exit: 1, request: none}}
    expect:
      - unchanged: {since: act}

  - id: caller-refused
    batch: no-grant
    covers: [main, caller-refused]
    summary: A caller with neither Gateway authority nor a target grant is refused without an Operation.
    setup:
      - node_access_remove: {consumer: app-prod, serving: gateway}
    act:
      - cli: {as: app-prod, run: [node:converge, "${app-dev.id}"], expect: {exit: 1, code: node_access.required, request: none}}
    expect:
      - unchanged: {since: act}

  - id: gateway-authority-without-target-grant
    batch: no-grant
    covers: [main, admitted, succeeded]
    summary: A caller granted Gateway access can converge the target without a direct target grant.
    setup:
      - node_access_remove: {consumer: app-prod, serving: app-dev}
      - cli: {run: [node:access:add, "${app-prod.id}", "${gateway.id}"], expect: {exit: 0}}
    act:
      - cli: {as: app-prod, run: [node:converge, "${app-dev.id}"], expect: {exit: 0, status: succeeded}}
    expect: []

  - id: node-unreachable
    batch: node-down
    covers: [main, admitted, phase-failed]
    summary: An unreachable Node fails its Operation instead of being refused by a live admission check.
    setup:
      - node_down: {node: app-dev}
    act:
      - cli: {run: [node:converge, "${app-dev.id}"], expect: {exit: 1, status: failed, code: operation.native_failed}}
    expect: []
