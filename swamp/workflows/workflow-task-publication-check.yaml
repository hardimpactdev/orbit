id: 4b0f7f8a-2f6c-4f53-9a51-3c2f0f6c1a01
name: task-publication-check
description: Check that HEAD and the whole working tree of the task VM still equal the checked candidate; the real index is
  untouched.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
    scratch:
      type: string
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - scratch
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: prepare
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publication-prepare" }}
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        node_id: ${{ inputs.node_id }}
  - name: snapshot-index
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=" + inputs.scratch + ".index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - read-tree
        - HEAD
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    allowFailure: true
  - name: snapshot-add
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=" + inputs.scratch + ".index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
    dependsOn:
    - step: snapshot-index
      condition:
        type: succeeded
    allowFailure: true
  - name: snapshot-tree
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=" + inputs.scratch + ".index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
    dependsOn:
    - step: snapshot-add
      condition:
        type: succeeded
    allowFailure: true
  - name: snapshot-head
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
    dependsOn:
    - step: snapshot-tree
      condition:
        type: succeeded
    allowFailure: true
  - name: verify
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publication-verify" }}
      methodName: verify
      inputs:
        input: ${{ inputs.intent }}
        steps: ${{ steps }}
    dependsOn:
    - step: snapshot-head
      condition:
        type: always
  - name: remove-index
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - rm
        - -f
        - --
        - ${{ inputs.scratch + ".index" }}
    allowFailure: true
    dependsOn:
    - step: verify
      condition:
        type: always
queueTimeout: 60
