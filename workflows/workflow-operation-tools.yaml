id: 774d24db-4bb9-4a5c-811d-ef19d16a3888
name: operation-tools
description: Claim and execute a Tool kind within one placed worker invocation.
labels: { pool: migration }
queueTimeout: 300
autoResume: true
inputs:
  type: object
  properties:
    kind: {
      type: string,
      enum: [
        tool.install,
        tool.update,
        tool.remove,
        tool.adopt,
        tool.manager_converge,
      ],
    }
    worker: { type: string }
  required: [kind, worker]
jobs:
  - name: tools
    steps:
      - name: execute
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-tools"
          behaviorName: '${{ "operation-tools-" + {"tool.install":"install", "tool.update":"update", "tool.remove":"remove", "tool.adopt":"adopt", "tool.manager_converge":"manager-converge"}[inputs.kind] }}'
          methodName: execute
          inputs:
            kind: "${{ inputs.kind }}"
            worker: "${{ inputs.worker }}"
