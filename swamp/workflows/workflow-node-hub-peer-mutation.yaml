id: a06a254a-6dd2-4f2e-af76-7b432101e89f
name: node-hub-peer-mutation
description: Mutate one admitted peer in an existing hub; preserve unrelated fresh
  peers.
inputs:
  type: object
  properties:
    intent:
      type: object
    mode:
      type: string
      enum:
      - publish
      - remove
      - restore-publish
      - restore-remove
    prepared_peer:
      type: object
  required:
  - intent
  - mode
jobs:
- name: hub
  steps:
  - name: assets
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-assets-" + string(inputs.intent.hub_id) }}
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
        mode: ${{ inputs.mode }}
        prepared_peer: '${{ has(inputs.prepared_peer) ? inputs.prepared_peer : null
          }}'
  - name: mutate
    writes: true
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "wireguard-hub-" + string(inputs.intent.hub_id) }}
      methodName: script
      inputs:
        hosts: hub
        interpreter: python3
        sudo: true
        script: ${{ steps.assets.outputs.script_body }}
