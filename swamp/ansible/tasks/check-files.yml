---
# One read of every role file, folder and private file, and of `check_units` (default none). The stat-shaped results keep
# the asserts below, their loops and labels, so each failure names the same item as a stat per item did. The same read
# covers the Prometheus file and the Swamp start cache that metrics.yml and swamp-start-cache.yml check afterwards.
- name: Read role file, folder and private file metadata
  ansible.builtin.import_tasks: check-read.yml
  vars:
    check_read_paths: >-
      {{ (intent.files + intent.runtime.files + intent.directories + intent.runtime.directories + intent.runtime.secret_files)
      | map(attribute='path') | list + (['/etc/orbit/metrics/prometheus.yml'] if intent.runtime.metrics is not none else [])
      + (['/tmp/deno-compile-swamp.cache'] if intent.runtime.swamp is not none else []) }}
    check_read_units: "{{ check_units | default([]) | map(attribute='name') | list }}"
    # The checksums of private files stay out of the run's output, as their stat calls did.
    check_read_private: "{{ intent.runtime.secret_files | map(attribute='path') | list }}"
- name: Check role services
  ansible.builtin.assert:
    that: check_read.units[item.name].rc == 0
    fail_msg: "{{ item.name }} is {{ check_read.units[item.name].state }}, not active."
    quiet: true
  loop: "{{ check_units | default([]) }}"
  loop_control: { label: "{{ item.name }}" }
- name: Pair role paths with their metadata
  vars:
    pair: >-
      {%- set out = {'files': [], 'folders': [], 'private': []} -%}
      {%- for group, items in [('files', intent.files + intent.runtime.files),
                               ('folders', intent.directories + intent.runtime.directories),
                               ('private', intent.runtime.secret_files)] -%}
      {%- for item in items -%}{%- set _ = out[group].append({'item': item, 'stat': check_read.paths[item.path]}) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.set_fact:
    role_files: { results: "{{ pair.files }}" }
    role_folders: { results: "{{ pair.folders }}" }
    role_private: { results: "{{ pair.private }}" }
  no_log: "{{ intent.runtime.secret_files | length > 0 }}"
- name: Check role files
  ansible.builtin.assert:
    that:
      - (item.item.ensure | default('present') == 'absent' and not item.stat.exists) or (item.item.ensure | default('present') == 'present' and item.stat.exists
        and item.stat.checksum == item.item.content | hash('sha256') and item.stat.mode == item.item.mode and item.stat.pw_name == item.item.owner and
        item.stat.gr_name == item.item.group)
    quiet: true
  loop: "{{ role_files.results }}"
  loop_control: { label: "{{ item.item.path }}" }
  when: kind != 'node.role_converge' or item.item.path != '/etc/orbit/metrics/prometheus.yml'
- name: Check role folders
  ansible.builtin.assert:
    that: [item.stat.isdir, item.stat.pw_name == item.item.owner, item.stat.gr_name == item.item.group, item.stat.mode == item.item.mode]
    quiet: true
  loop: "{{ role_folders.results }}"
  loop_control: { label: "{{ item.item.path }}" }
- name: Check private files
  ansible.builtin.assert:
    that:
      - item.stat.checksum == secrets[item.item.secret] | hash('sha256')
      - item.stat.mode == '0600'
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
    quiet: true
  loop: "{{ role_private.results }}"
  no_log: true
