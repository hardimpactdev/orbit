id: 7df4d92e-034f-4a2e-bd17-8265aec18b11
name: operation-route-lan-remove
description: Withdraw the exact destination-scoped Route LAN allowance under the UFW host lock.
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.lan_remove
    intent:
      type: object
      additionalProperties: false
      properties:
        route_id:
          type: integer
          minimum: 1
        node_id:
          type: integer
          minimum: 1
        destination:
          type: string
          format: ipv4
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - route_id
      - node_id
      - destination
      - control_node_id
      - connection
      - host_keys
    execution_secrets:
      type: object
      additionalProperties: false
      properties: {}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
jobs:
- name: withdrawal
  steps:
  - name: remove-lan
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent:
          control_node_id: 209
          connection: ${{ inputs.intent.connection }}
          host_keys: ${{ inputs.intent.host_keys }}
          rule:
            node_id: ${{ inputs.intent.node_id }}
            route_id: ${{ inputs.intent.route_id }}
            destination: ${{ inputs.intent.destination }}
            operation: retire
            keep: []
