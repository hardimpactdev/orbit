id: 92c89a8c-6487-42f5-a70e-d67be3921b28
name: operation-dependency-merge
description: Claim a bounded batch of this family on its placed workers.
autoResume: true
trigger:
  schedule: "2 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-dependency-merge-discovery
          methodName: discover
          inputs:
            family: operation-dependency-merge
            kinds: ["tasks.dependency_merge"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-dependency-merge'
          behaviorName: '${{ "operation-dependency-merge-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
