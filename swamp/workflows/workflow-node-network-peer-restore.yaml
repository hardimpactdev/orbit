id: 7d1771e4-0f12-55e2-8d80-88b35948d25c
name: node-network-peer-restore
description: Restore only the exact peer before-image as visible actions; the parent separately restores the canonical
  hub.
inputs:
  properties:
    node_id:
      type: integer
      minimum: 1
    operation_id:
      type: integer
      minimum: 1
    transaction_id:
      type: string
    intent:
      type: object
  required:
  - node_id
  - operation_id
  - transaction_id
  - intent
jobs:
- name: restoration_metadata
  steps:
  - name: restoration_intent
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: &id001
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-network-command-inputs'
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-restore-intent" }}
      methodName: prepare
      inputs:
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
  - name: inspect_before_image
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-inspect-before-image" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" <<'PYTHON'
          import json
          import os
          import stat
          import sys
          import tempfile
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          def publish(path, value):
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-network-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
          if not os.path.lexists(journal):
              print('{"present":false}')
          else:
              saved = json.loads(private_read(journal))
              if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
                  raise SystemExit("wireguard.peer_recovery_pending")
              settings = [{"link": link, "property": name, "value": value.split()}
                          for link, properties in saved["resolver_settings"].items()
                          for name, value in properties.items()]
              print(json.dumps({"present": True, "active": saved["active"], "enabled": saved["enabled"],
                                "settings": settings}, separators=(",", ":")))
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.restoration_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
    dependsOn:
    - step: restoration_intent
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: restore_view
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/node-network-command-inputs'
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-restore-view" }}
      methodName: restoration
      inputs:
        stdout: ${{ steps.inspect_before_image.outputs.stdout }}
    dependsOn:
    - step: inspect_before_image
      condition:
        type: succeeded
- name: peer_files_and_service
  steps:
  - name: stop_pending_peer
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-stop-pending-peer" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" <<'PYTHON'
          import json
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          def publish(path, value):
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-network-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
          saved = json.loads(private_read(journal))
          if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
              raise SystemExit("wireguard.peer_recovery_pending")
          subprocess.run(['/usr/bin/systemctl', 'stop', 'wg-quick@orbit'], check=True, capture_output=True, timeout=30)
          print('{"applied":true}')
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.restoration_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
    guard: ${{ !steps.restore_view.outputs.present }}
  - name: restore_peer_configuration
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-restore-peer-configuration" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" <<'PYTHON'
          import json
          import os
          import stat
          import sys
          import tempfile
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          def publish(path, value):
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-network-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
          saved = json.loads(private_read(journal))
          if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
              raise SystemExit("wireguard.peer_recovery_pending")
          target = root / 'orbit.conf'
          private_read(target, True)
          if saved['config'] is None:
              if os.path.lexists(target):
                  target.unlink()
          else:
              publish(target, saved['config'])
          print('{"restored":true}')
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.restoration_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
    dependsOn:
    - step: stop_pending_peer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !steps.restore_view.outputs.present }}
