command: route:destroy
chart: route/engine/destroy
target: app-dev
sources: [gateway]
baseline: [operations]
cases:
  - id: signed-route-withdrawal
    batch: fresh-fleet
    covers: ["path:admitted", "path:dns", "path:grace", "path:withdraw", "path:sibling", "path:lost-receipt", "path:failed", "path:retry", "path:swamp"]
    summary: Withdraw additional web-root sites (the only Routes route:destroy removes from a live Instance) on the signed executor, with the 31 s grace, a dropped withdrawal receipt, a withdrawal refused after the DNS answers were withdrawn and its forward retry, and a Swamp fallback when the VPN Node lacks the host primitives; a sibling Route on the same Node answers throughout.
    exclusive: true
    fails_on_base: true
    timeout: 1700
    setup:
      - route_fixture: {repository: "https://github.com/laravel/prompts.git", branch: main}
    act:
      - clone_create: {name: sibling, via: engine}
      - clone_create: {name: target, via: engine}
      - route_create: {name: neighbour, clone: sibling}
      - route_create: {name: own, clone: target}
      - route_create: {name: signed, clone: target, web_root: tests}
      - route_destroy: {name: signed, via: engine, sibling: neighbour}
      - route_create: {name: interrupted, clone: target, web_root: tests}
      - route_destroy: {name: interrupted, via: engine, sibling: neighbour, fault: receipt}
      - route_create: {name: retry, clone: target, web_root: tests}
      - route_destroy: {name: retry, via: engine, sibling: neighbour, fault: partial}
      - route_create: {name: fallback, clone: target, web_root: tests}
      - route_destroy: {name: fallback, via: swamp, sibling: neighbour}
      - route_create: {name: nofeature, clone: target, web_root: tests}
      - route_destroy: {name: nofeature, via: swamp, sibling: neighbour, fault: feature}
    expect:
      - route_compare: {engine: signed, swamp: fallback}
      - clone_cleanup: {}
  - id: resumable-dns-grace
    batch: fresh-fleet
    covers: ["path:admitted", "path:dns", "path:grace", "path:withdraw", "path:sibling"]
    summary: The 31 s DNS grace survives a restart of orbit-gateway-engine 12 s in, and the site is withdrawn once at ~31 s after the DNS receipt, not from zero; a cancel 10 s into the grace ends the removal cancelled with the site still served and never withdrawn, and the same command then removes it. A sibling Route on the same Node answers throughout, and every other name the VPN Node serves answers the same with `dig +short` before and after.
    exclusive: true
    fails_on_base: true
    timeout: 1200
    setup:
      - route_fixture: {repository: "https://github.com/laravel/prompts.git", branch: main}
    act:
      - clone_create: {name: sibling, via: engine}
      - clone_create: {name: target, via: engine}
      - route_create: {name: neighbour, clone: sibling}
      - route_create: {name: own, clone: target}
      - route_create: {name: restarted, clone: target, web_root: tests}
      - route_destroy: {name: restarted, via: engine, sibling: neighbour, fault: restart}
      - route_create: {name: cancelled, clone: target, web_root: tests}
      - route_destroy: {name: cancelled, via: engine, sibling: neighbour, fault: cancel}
    expect:
      - clone_cleanup: {}
  - id: active-app-secondary-route
    batch: fresh-fleet
    covers: ["path:admitted", "path:dns", "path:grace", "path:withdraw", "path:sibling", "path:failed"]
    summary: >-
      The live shape of ORB-6339. A laravel-app clone is active with its own Route, and a second Route of it with `--web-root=public`
      is withdrawn on the engine. Its record goes without `routes_active_target_delete` refusing the delete, nothing is redelivered,
      the clone's own Route still serves, a sibling's Route answers, and the VPN Node answers its other names unchanged. Then a
      third such Route is withdrawn while a database trigger refuses its delete: the Operation fails once, after three projection
      attempts, with `engine.projection_failed` at the step `projection`, its lock goes, and laravel.log stays quiet after.
    exclusive: true
    fails_on_base: true
    timeout: 1500
    setup:
      - route_fixture: {repository: "https://github.com/laravel/react-starter-kit.git", branch: main, project_type: laravel-app, root: public}
    act:
      - clone_create: {name: sibling, via: engine}
      - clone_create: {name: target, via: engine}
      - route_create: {name: neighbour, clone: sibling, web_root: public}
      - route_create: {name: secondary, clone: target, web_root: public}
      - route_create: {name: faulted, clone: target, web_root: public}
      - route_main_serves: {clone: target}
      - route_destroy: {name: secondary, via: engine, sibling: neighbour}
      - route_main_serves: {clone: target}
      - route_destroy: {name: faulted, via: engine, sibling: neighbour, fault: projection}
      - route_main_serves: {clone: target}
    expect:
      - clone_cleanup: {}
uncovered:
  "path:withdraw": "One Route Node. A Route served by two Nodes, a leaf-only Node, and a shared PHP-FPM pool kept for another Route are not covered."
  "path:dns": "One VPN Node, which is the Gateway in the nested fleet. Two VPN Nodes and a domain inside the TLD (no DNS step) are not covered."
  "path:failed": "The partial failure is a refused Caddy withdrawal (owned_revision_conflict) after the DNS step applied. A Caddy or PHP-FPM reload failure after a write is not covered."
  "path:swamp": "Fallback is shown for a VPN Node without dns.publish_records, and for one that reports it without the host family (file.read, file.ensure, config.apply), as an executor before the primitives."
  "path:refused": "Public Routes, Process proxies, --offline, LAN rules and an Ingress edge take Swamp at admission; their refusals are covered by Gateway tests only."
