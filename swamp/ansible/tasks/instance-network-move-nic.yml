---
# A single update replaces the ACL reference and retains both reject defaults. A failed update leaves the old gate intact.
- name: Replace the bridge union ACL on an effective NIC without opening it
  when: >-
    item.value.get('type', '') == 'nic'
    and (item.value.get('network', '') == instances.network or item.value.get('parent', '') == instances.network)
    and instances.network ~ '-egress' in item.value.get('security.acls', '').split(',') | map('trim') | list
  ansible.builtin.command:
    argv: >-
      {{ ['incus', '--project', move_container.project, 'config', 'device',
          ('set' if item.key in (move_container.devices | default({})) else 'override'), move_container.name, item.key,
          'security.acls=' ~ (item.value['security.acls'].split(',') | map('trim')
            | map('regex_replace', '^' ~ instances.network ~ '-egress$', instances.nic_acl) | join(',')),
          'security.acls.default.egress.action=reject', 'security.acls.default.ingress.action=reject'] }}
  loop: "{{ move_container.expanded_devices | dict2items }}"
  loop_control: { label: "{{ move_container.name }}/{{ item.key }}" }
  register: move_nic
  changed_when: true
  failed_when: false

# A removal is admitted beside a role converge, so a container listed above can be deleted before its turn: Incus confirms it is gone,
# and it is already removed. A failed update of a container that still exists fails the converge.
- name: Ask Incus again for a container whose NIC update failed
  when: move_nic.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list | length > 0
  ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances/{{ move_container.name }}?project={{ move_container.project }}"] }
  register: move_still
  changed_when: false
  failed_when: false

- name: Refuse a failed NIC update on a container that still exists
  when: move_still is not skipped
  ansible.builtin.assert:
    that: move_still.rc != 0 and (move_still.stderr | trim) == move_gone
    fail_msg: >-
      instance.host_unavailable: {{ move_container.project }}/{{ move_container.name }}:
      {{ (move_nic.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | first).stderr | default('') | trim }}
    quiet: true
  vars:
    # Incus's own answer for a container that does not exist; any other failed read is no proof.
    move_gone: >-
      {{ 'Error: Failed to fetch instance "' ~ move_container.name ~ '" in project "' ~ move_container.project ~ '": Instance not found' }}
