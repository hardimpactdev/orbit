id: 738a2f9d-dc6c-4754-92c3-f51de9cb91f9
name: operation-instance-deploy-direct
description: Development deploy through official SSH from 209; retained production deploy on its admitted worker.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - instance.deploy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*|development-deploy-operation-[1-9][0-9]*-commands)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: development
  target: orbit-node-209
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/deployment-phases'
      behaviorName: ${{ "assets-"+run.id }}
      methodName: assets
      inputs:
        intent: ${{ inputs.intent }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
    guard: ${{ !(inputs.intent.deployment.variant == "development") }}
  - name: source
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "source-"+run.id }}
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - /usr/bin/sudo
        - -n
        - -u
        - ${{ inputs.intent.deployment.node_user }}
        - --
        - /usr/bin/timeout
        - 300s
        - /usr/bin/python3
        - -I
        - -c
        - ${{ steps.assets.outputs.source }}
        - ${{ steps.assets.outputs.request }}
        timeoutSec: 310
        okExitCodes:
        - 0
        - 1
      globalArgs: &id001
        name: ${{ "deploy-"+run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    guard: ${{ !(inputs.intent.deployment.variant == "development") }}
  - name: dev_manager
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: source
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: operation-tool-write-209
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: tool.manager_converge
        intent: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.manager : null }}'
        ssh: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution : {} }}'
        execution_secrets: {}
    target: orbit-node-209
  - name: dev_vp_project
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_manager
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dev_vp_project-" + run.id }}
      methodName: exec
      globalArgs:
        name: ${{ "dev_vp_project-" + run.id }}
        transport:
          kind: ssh
          user: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.user : "" }}'
          identityFile: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.identity_file
            : "" }}'
          port: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.port : 22 }}'
          hostKeys: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.host_keys
            : [] }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.host : "" }}'
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -c
        - ${{ steps.assets.outputs.vp }}
        - vp-project
        - ${{ steps.assets.outputs.request }}
        - ''
        - 'null'
        - '-1'
        timeoutSec: 600
    target: orbit-node-209
  - name: dev_vp_project_check
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_vp_project
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev_vp_project_check-" + run.id }}
      methodName: check
      inputs:
        observation: ${{ steps.dev_vp_project.outputs }}
    target: orbit-node-209
  - name: dev_vp_resolve
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_vp_project_check
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev_vp_resolve-" + run.id }}
      methodName: runtime
      inputs:
        observation: ${{ steps.dev_vp_project.outputs }}
    target: orbit-node-209
  - name: dev_vp_install
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_vp_resolve
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dev_vp_install-" + run.id }}
      methodName: exec
      globalArgs:
        name: ${{ "dev_vp_install-" + run.id }}
        transport:
          kind: ssh
          user: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.user : "" }}'
          identityFile: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.identity_file
            : "" }}'
          port: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.port : 22 }}'
          hostKeys: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.host_keys
            : [] }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.host : "" }}'
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -c
        - ${{ steps.assets.outputs.vp }}
        - vp-install
        - ${{ steps.assets.outputs.request }}
        - ''
        - '${{ (inputs.intent.deployment.needs_vp && has(steps.dev_vp_resolve) && steps.dev_vp_resolve.status == "succeeded")
          ? steps.dev_vp_resolve.outputs.runtime_json : "null" }}'
        - '-1'
        timeoutSec: 600
    target: orbit-node-209
  - name: dev_vp_install_check
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_vp_install
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev_vp_install_check-" + run.id }}
      methodName: check
      inputs:
        observation: ${{ steps.dev_vp_install.outputs }}
    target: orbit-node-209
  - name: dev_vp_verify
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_vp_install_check
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "dev_vp_verify-" + run.id }}
      methodName: exec
      globalArgs:
        name: ${{ "dev_vp_verify-" + run.id }}
        transport:
          kind: ssh
          user: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.user : "" }}'
          identityFile: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.identity_file
            : "" }}'
          port: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.port : 22 }}'
          hostKeys: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.host_keys
            : [] }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.deployment.variant == "development" ? inputs.intent.ssh_execution.target.host : "" }}'
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -c
        - ${{ steps.assets.outputs.vp }}
        - vp-verify
        - ${{ steps.assets.outputs.request }}
        - ''
        - '${{ (inputs.intent.deployment.needs_vp && has(steps.dev_vp_resolve) && steps.dev_vp_resolve.status == "succeeded")
          ? steps.dev_vp_resolve.outputs.runtime_json : "null" }}'
        - '-1'
        timeoutSec: 600
    target: orbit-node-209
  - name: dev_vp_verify_check
    guard: ${{ !(inputs.intent.deployment.variant == "development") || !inputs.intent.deployment.needs_vp || steps.source.outputs.exitCode
      != 0 }}
    dependsOn:
    - step: dev_vp_verify
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev_vp_verify_check-" + run.id }}
      methodName: check
      inputs:
        observation: ${{ steps.dev_vp_verify.outputs }}
    target: orbit-node-209
  - name: commands
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "commands-"+run.id }}
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - /usr/bin/sudo
        - -n
        - -u
        - ${{ inputs.intent.deployment.node_user }}
        - --
        - /usr/bin/timeout
        - ${{ string(inputs.intent.command_timeout_seconds)+"s" }}
        - /usr/bin/python3
        - -I
        - -c
        - ${{ steps.assets.outputs.commands }}
        - ${{ steps.assets.outputs.request }}
        - before_activation
        - ${{ steps.source.outputs.stdout }}
        - '${{ inputs.intent.deployment.needs_vp ? steps.dev_vp_resolve.outputs.runtime_json : "null" }}'
        stdin: ${{ vault.get(inputs.execution_secrets.commands.vault, inputs.execution_secrets.commands.key) }}
        timeoutSec: ${{ inputs.intent.command_timeout_seconds + 10 }}
        okExitCodes:
        - 0
        - 1
      globalArgs: *id001
    dependsOn:
    - step: source
      condition:
        type: succeeded
    - step: dev_vp_verify_check
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.intent.deployment.variant == "development") || steps.source.outputs.exitCode != 0 || inputs.intent.deployment.steps.size()
      == 0 }}
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/deployment-phases'
      behaviorName: ${{ "result-"+run.id }}
      methodName: result
      inputs:
        source: '${{ "source" in steps ? steps.source : null }}'
        commands: '${{ "commands" in steps ? steps.commands : null }}'
        commands_required: ${{ inputs.intent.deployment.steps.size() > 0 }}
        verified: '${{ "dev_vp_verify" in steps ? steps.dev_vp_verify : null }}'
        runtime: '${{ "dev_vp_resolve" in steps && steps.dev_vp_resolve.status == "succeeded" ? steps.dev_vp_resolve.outputs.runtime : null }}'
    guard: ${{ !(inputs.intent.deployment.variant == "development") }}
    dependsOn:
    - step: commands
      condition:
        type: always
    - step: source
      condition:
        type: always
  - name: accepted
    target: orbit-node-209
    guard: ${{ !(inputs.intent.deployment.variant == "development") }}
    dependsOn:
    - step: result
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.result.outputs.ready
      severity: high
      message: Development deployment did not complete.
- name: deploy
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  writes: true
  steps:
  - guard: ${{ inputs.intent.deployment.variant != "production" }}
    name: prepare-production
    task:
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      behaviorType: '@nckrtl/instance-deploy-direct'
      inputs:
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
      methodName: prepareProduction
      type: behavior
  - name: install-processes
    target: orbit-node-209
    forEach:
      item: member
      in: '${{ inputs.intent.deployment.variant == "production" ? inputs.intent.process_members : [] }}'
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ self.member.node_id }}
        kind: process.create
        intent: ${{ self.member.intent }}
        execution_secrets: '${{ "node_" + string(self.member.node_id) + "_member_" + string(self.member.id) in inputs.execution_secrets
          ? {"environment": inputs.execution_secrets["node_" + string(self.member.node_id) + "_member_" + string(self.member.id)]}
          : {} }}'
    dependsOn:
    - step: prepare-production
      condition:
        type: succeeded
  - guard: ${{ inputs.intent.deployment.variant != "production" }}
    name: finish-production
    task:
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      behaviorType: '@nckrtl/instance-deploy-direct'
      inputs:
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
      methodName: finishProduction
      type: behavior
    dependsOn:
    - step: install-processes
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: prepare-production
      condition:
        type: succeeded
- name: failure
  dependsOn:
  - job: deploy
    condition:
      type: failed
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  writes: true
  steps:
  - name: report
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-deploy-direct'
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      methodName: failure
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ inputs.intent.deployment.variant != "production" }}
queueTimeout: 10
