---
# One agent turn in a task copy (docs/cli/task/copy-turn.mmd). T3's own CLI starts a thread with the admitted prompt, or sends it to
# the role's thread to continue it, waits for its run and reads the thread back. The CLI issues its T3 session inside the container
# and revokes it at exit, so no credential reaches the Node, Swamp or the Gateway. The title names the Orbit thread, so a run cut by
# its bound is still found, and a continued turn finds its thread. A reviewer works on the checked candidate, detached, and the task
# branch is checked out again at its tip after its turn. A run that waits for an answer has its question stored, and only then is it
# stopped, by `t3_copy_rpc.mjs` through the stock T3 server's own RPC: the answer comes as the next turn, which first resolves exactly
# those stored requests. The same helper stops a run cut
# by the turn's bound, and the run of an earlier turn that is over in Orbit but still runs in the copy. Ansible keeps the raw replies out
# of its log and writes them to the run folder only; `@nckrtl/task-copy-turn` bounds and redacts them. Each T3 read and each helper call
# is bounded at 60 s, each Git command at 20 s.
- name: Address the recorded copy Node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: task_copy_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run the turn in the copy
  hosts: task_copy_node
  gather_facts: false
  become: true
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    # Non-login, as agent with its groups: `incus exec --user` would drop the `work` group that owns the checkout's Git folder.
    copy_exec: >-
      {{ ['incus', '--project', intent.runtime.project, 'exec', '--cwd', '/srv/workspace', intent.runtime.name, '--',
          '/usr/sbin/runuser', '-u', 'agent', '--', '/usr/bin/env', '-i', 'HOME=/home/agent', 'PATH=/usr/local/bin:/usr/bin:/bin'] }}
    copy_git: "{{ copy_exec + ['/usr/bin/timeout', '20', 'git', '-C', '/srv/workspace'] }}"
    reviewer: "{{ intent.turn.candidate | default(none) is not none }}"
  tasks:
    - name: Validate the admitted turn
      ansible.builtin.assert:
        that:
          - intent.runtime.project | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
          - intent.runtime.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
          # The program of the copy's container server (docs/reference/development-containers.md#container-server).
          - intent.turn.t3 | default('') is match('^/opt/orbit-agent/current/agent/bin/(t3|conn-server)$')
          - intent.turn.node | default('') is match('^/opt/orbit-runtime/current/bin/node$')
          - intent.turn.thread | default('') in ['new', 'continue']
          - intent.turn.thread != 'new' or intent.turn.provider | default('', true) is match('^[A-Za-z][A-Za-z0-9]{0,63}$')
          - intent.turn.thread != 'new' or intent.turn.model | default('', true) is match('^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$')
          # A new thread's model options (InstanceContainer::providerOptions): T3 runs its every turn with them.
          - intent.turn.thread != 'new' or (intent.turn.options is defined and intent.turn.options is sequence and intent.turn.options is not string)
          - intent.turn.thread != 'new' or intent.turn.options | rejectattr('id', 'match', '^[A-Za-z][A-Za-z0-9]{0,63}$') | list | length == 0
          - intent.turn.thread != 'new' or intent.turn.options | rejectattr('value', 'match', '^[a-z][a-z0-9_-]{0,31}$') | list | length == 0
          - intent.turn.candidate | default(none) is none or intent.turn.candidate is match('^[0-9a-f]{40}$')
          - intent.turn.title | default('') is match('^Orbit task [1-9][0-9]* thread [1-9][0-9]*$')
          - intent.turn.seconds | default(0) | int >= 60 and intent.turn.seconds | int <= 3600
          - intent.turn.prompt | default('') | length > 0
          - intent.turn.settle is defined and intent.turn.settle is sequence and intent.turn.settle is not string
          - intent.turn.settle | rejectattr('operation_id', 'integer') | list | length == 0
          - intent.turn.settle | map(attribute='title') | reject('match', '^Orbit task [1-9][0-9]* thread [1-9][0-9]*$') | list | length == 0
          - intent.turn.settle | map(attribute='branch') | select('string') | reject('match', '^task-[1-9][0-9]*$') | list | length == 0
          - intent.turn.answered | default([]) is sequence and intent.turn.answered | default([]) is not string
          - intent.turn.answered | default([]) | reject('string') | list | length == 0
          - intent.turn.answered | default([]) | select('equalto', '') | list | length == 0
          - intent.turn.thread == 'continue' or intent.turn.answered | default([]) | length == 0
        fail_msg: tasks.copy_turn_invalid
    # A copy the phase cannot reach fails here, before the launch mark: no turn can run there, so its group stays free.
    - name: Reach the copy as agent
      ansible.builtin.command:
        argv: "{{ copy_exec + ['/usr/bin/true'] }}"
      changed_when: false
    # Stock T3 leaves model validation to the run. Check its cached catalog first, then ask the Codex provider when its catalog
    # does not confirm the slug. Do this before any checkout or launch.
    - name: Check the new thread's model
      when: intent.turn.thread == 'new'
      vars:
        catalog_match: >-
          {{ model_entries is not none
             and intent.turn.model in (model_entries | map(attribute='slug') | list
                 + (model_entries | map(attribute='aliases', default=[]) | flatten)) }}
        codex_model: "{{ model_driver | default(intent.turn.provider) == 'codex' }}"
        probe_exit: "{{ model_probe.rc | default(none) }}"
        model_accepted: "{{ catalog_match or (probe_exit == 0 if codex_model else model_entries is none) }}"
      block:
        - name: Read T3's provider instances
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '20', '/usr/bin/cat', '/home/agent/.t3/userdata/settings.json'] }}"
          register: model_settings
          failed_when: false
          changed_when: false
          no_log: true
        - name: Read T3's model catalog
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '20', '/usr/bin/cat', '/home/agent/.t3/userdata/model-manifest.json'] }}"
          register: model_catalog
          failed_when: false
          changed_when: false
          no_log: true
        - name: Name the instance's driver
          ansible.builtin.set_fact:
            model_driver: >-
              {{ (model_settings.stdout | from_json).get('providerInstances', {}).get(intent.turn.provider, {}).get('driver', intent.turn.provider)
                 if model_settings.rc == 0 else intent.turn.provider }}
          no_log: true
        - name: Read the driver's model list
          ansible.builtin.set_fact:
            model_listed: >-
              {{ (model_catalog.stdout | from_json).get('manifest', {}).get('providers', {}).get(model_driver, {}).get('models')
                 if model_catalog.rc == 0 else none }}
          no_log: true
        # A list with at least one entry that has a slug is a catalog.
        - name: Keep the entries with a slug
          ansible.builtin.set_fact:
            model_valid: >-
              {{ model_listed | select('mapping') | selectattr('slug', 'defined') | selectattr('slug', 'string') | list
                 if model_listed is iterable and model_listed is not string and model_listed is not mapping else [] }}
          no_log: true
        - name: Name the models T3 lists for it
          ansible.builtin.set_fact:
            model_entries: "{{ model_valid if model_valid | length > 0 else none }}"
          no_log: true
      rescue:
        - name: List no models
          ansible.builtin.set_fact:
            model_entries: null
      always:
        - name: Confirm the uncatalogued Codex model with its provider
          when: codex_model and not catalog_match
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '25', '/usr/bin/python3', '-', intent.turn.model] }}"
            stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/task_copy_codex_model.py') }}"
          register: model_probe
          failed_when: false
          changed_when: false
          no_log: true
        - name: Write the model evidence
          ansible.builtin.copy:
            content: >-
              {{ {'model': intent.turn.model,
                  'offered': none if model_entries is none else model_entries | map(attribute='slug') | list,
                  'accepted': model_accepted}
                  | combine({} if probe_exit is none else {'probe': {0: 'confirmed', 2: 'rejected'}.get(probe_exit, 'unavailable')})
                  | to_json }}
            dest: "{{ run }}/model.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require an offered or provider-verified model
          ansible.builtin.assert:
            that: model_accepted
            fail_msg: "{{ 'tasks.copy_turn_model_unverified' if codex_model and probe_exit != 2 else 'tasks.copy_turn_model_unoffered' }}"
    # An earlier turn that may still run is settled before any launch, by one rule: T3 lists its thread in no active state, or none of its title, and
    # a reviewer's detach is undone. Every such turn is over in Orbit (cut by its bound, cancelled or lost), so a thread T3 still shows
    # active has its run stopped first, by the helper's `stop`, once per thread; a run the stop ended, or a thread it found with no active
    # run, has ended. The copy's ref `refs/orbit/review-detach` marks a detach in effect, at the tip the branch had: only with it, and once
    # no earlier run can still write, is the checkout restored as after a reviewer's turn. Without it nothing in the tree is touched.
    # While a run goes on because its stop failed, nothing is touched or launched, and the work in the copy stays.
    - name: Settle the earlier turns
      when: intent.turn.settle | length > 0
      vars:
        settle_listed: "{{ settle_threads.stdout | from_json if settle_threads.rc | default(1) == 0 else none }}"
        settle_active: ['preparing', 'queued', 'starting', 'running', 'waiting']
        settle_reviewer: "{{ intent.turn.settle | selectattr('branch', 'string') | list }}"
      block:
        - name: List the threads to settle
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
          register: settle_threads
          failed_when: false
          changed_when: false
          no_log: true
        - name: Name the threads that still run
          ansible.builtin.set_fact:
            settle_running: >-
              {% set running = [] %}{% for entry in intent.turn.settle if settle_listed is not none %}{% set mine = settle_listed
              | selectattr('title', 'equalto', entry.title) | list %}{% if mine | length == 1 and mine[0].status in settle_active
              and mine[0].threadId not in running %}{% set _ = running.append(mine[0].threadId) %}{% endif %}{% endfor %}{{ running }}
          no_log: true
        - name: Stop the earlier runs
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', intent.turn.t3, 'stop', item] }}"
            stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
          loop: "{{ settle_running }}"
          register: settle_stops
          failed_when: false
          changed_when: true
          no_log: true
        # A stop that failed, or whose answer is no JSON, ends nothing: its turn stays open.
        - name: Name the threads whose run ended
          ansible.builtin.set_fact:
            settle_ended: >-
              {% set ended = {} %}{% for stop in settle_stops.results | default([]) if stop.rc == 0 %}{% set answer = stop.stdout
              | from_json %}{% if answer.stopped or answer.run is none %}{% set _ = ended.update({stop.item: answer.run}) %}{% endif
              %}{% endfor %}{{ ended }}
          no_log: true
        - name: Name the turns whose run is over
          ansible.builtin.set_fact:
            settle_over: >-
              {% set over = [] %}{% for entry in intent.turn.settle if settle_listed is not none %}{% set mine = settle_listed
              | selectattr('title', 'equalto', entry.title) | list %}{% if mine | length == 0 or (mine | length == 1
              and (mine[0].status not in settle_active or mine[0].threadId in settle_ended)) %}{% set _ = over.append(entry.operation_id)
              %}{% endif %}{% endfor %}{{ over }}
            settle_stopped: >-
              {% set stopped = [] %}{% for entry in intent.turn.settle if settle_listed is not none %}{% set mine = settle_listed
              | selectattr('title', 'equalto', entry.title) | list %}{% if mine | length == 1 and settle_ended.get(mine[0].threadId) is string
              %}{% set _ = stopped.append({'operation_id': entry.operation_id, 'run': settle_ended[mine[0].threadId]}) %}{% endif
              %}{% endfor %}{{ stopped }}
          no_log: true
        - name: Undo a reviewer's detach
          when: settle_reviewer | length > 0 and settle_over | length == intent.turn.settle | length
          block:
            - name: Read the detach mark
              ansible.builtin.command:
                argv: "{{ copy_git + ['rev-parse', '--verify', '--quiet', 'refs/orbit/review-detach'] }}"
              register: settle_mark
              failed_when: false
              changed_when: false
            - name: Read whether the checkout is on a branch
              ansible.builtin.command:
                argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
              register: settle_head
              failed_when: false
              changed_when: false
            - name: Restore the checkout the reviewer left detached
              when: settle_mark.rc == 0 and settle_head.rc != 0
              block:
                - name: Discard what the reviewer changed
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['reset', '--quiet', '--hard'] }}"
                  changed_when: true
                - name: Remove the reviewer's new files
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['clean', '--quiet', '-fd'] }}"
                  changed_when: true
                - name: Check the task branch out again
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['checkout', '--quiet', (settle_reviewer | first).branch] }}"
                  changed_when: true
            - name: Verify the restore and clear the mark
              when: settle_mark.rc == 0
              block:
                - name: Read the restored changes
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['status', '--porcelain'] }}"
                  register: settle_status
                  changed_when: false
                - name: Read the restored branch
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
                  register: settle_branch
                  failed_when: false
                  changed_when: false
                - name: Read the restored tip
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['rev-parse', '--verify', 'HEAD'] }}"
                  register: settle_tip
                  changed_when: false
                - name: Clear the detach mark
                  when: settle_status.stdout == '' and settle_branch.stdout == (settle_reviewer | first).branch and settle_tip.stdout == settle_mark.stdout
                  ansible.builtin.command:
                    argv: "{{ copy_git + ['update-ref', '-d', 'refs/orbit/review-detach'] }}"
                  register: settle_cleared
                  changed_when: true
        - name: Name the settled turns
          ansible.builtin.set_fact:
            settle_done: >-
              {% set undone = settle_mark.rc is defined and (settle_mark.rc != 0 or settle_cleared.rc | default(1) == 0) %}{% set done = [] %}{%
              for entry in intent.turn.settle if entry.operation_id in settle_over %}{% if entry.branch is none or undone %}{%
              set _ = done.append(entry.operation_id) %}{% endif %}{% endfor %}{{ done }}
          no_log: true
      rescue:
        # A list that is not JSON, or a checkout Git cannot restore, settles nothing.
        - name: Settle nothing
          ansible.builtin.set_fact:
            settle_done: []
      always:
        - name: Write the settle evidence
          ansible.builtin.copy:
            content: >-
              {{ {'list_exit': settle_threads.rc | default(none), 'settled': settle_done | default([]),
                  'open': intent.turn.settle | map(attribute='operation_id') | reject('in', settle_done | default([])) | list,
                  'stopped': settle_stopped | default([])} | to_json }}
            dest: "{{ run }}/settle.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require every earlier turn settled
          ansible.builtin.assert:
            that: intent.turn.settle | map(attribute='operation_id') | reject('in', settle_done | default([])) | list | length == 0
            fail_msg: tasks.copy_turn_unended
    # A continued turn sends to the T3 thread whose title names the Orbit thread. Without exactly one, nothing is launched. A list that
    # fails or is not JSON names no exit code: that is T3 failing, not a missing thread.
    - name: Find the thread to continue
      when: intent.turn.thread == 'continue'
      block:
        - name: List the threads
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
          register: turn_threads
          failed_when: false
          changed_when: false
          no_log: true
        - name: Name the thread to continue
          ansible.builtin.set_fact:
            turn_resumed: >-
              {{ ((turn_threads.stdout | from_json) if turn_threads.rc == 0 else [])
                 | selectattr('title', 'equalto', intent.turn.title) | map(attribute='threadId') | list }}
          no_log: true
      rescue:
        - name: Name no thread
          ansible.builtin.set_fact:
            turn_resumed: []
            turn_threads_unreadable: true
      always:
        - name: Write the thread evidence
          ansible.builtin.copy:
            content: >-
              {{ {'list_exit': none if turn_threads_unreadable | default(false) else turn_threads.rc | default(none),
                  'found': turn_resumed | default([]) | length} | to_json }}
            dest: "{{ run }}/continue.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require one thread to continue
          ansible.builtin.assert:
            that: turn_resumed | default([]) | length == 1
            fail_msg: >-
              {{ 'tasks.copy_thread_missing' if not turn_threads_unreadable | default(false) and turn_threads.rc | default(1) == 0
                 else 'tasks.copy_turn_failed' }}
    # A stopped run may leave a message-capability question pending in T3. Resolve only the admitted stored requests before the
    # answer's send, in one helper session. A refused or unreadable resolution launches nothing, and changes no reviewer checkout.
    - name: Resolve the stored answered questions
      when: intent.turn.thread == 'continue' and intent.turn.answered | default([]) | length > 0
      block:
        - name: Resolve the requests in T3
          ansible.builtin.command:
            argv: >-
              {{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', intent.turn.t3, 'answered', turn_resumed | first]
                 + intent.turn.answered }}
            stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
          register: turn_answered
          failed_when: false
          changed_when: true
          no_log: true
        - name: Confirm the stored requests are no longer pending
          ansible.builtin.set_fact:
            answered_resolved: "{{ turn_answered.rc == 0 and (turn_answered.stdout | from_json).resolved == true }}"
          no_log: true
      rescue:
        - name: Confirm no resolution
          ansible.builtin.set_fact:
            answered_resolved: false
      always:
        - name: Write the answered evidence
          ansible.builtin.copy:
            content: "{{ {'answered_exit': turn_answered.rc | default(none), 'answered': turn_answered.stdout | default('')} | to_json }}"
            dest: "{{ run }}/answered.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require the stored requests resolved before launch
          ansible.builtin.assert:
            that: answered_resolved | default(false)
            fail_msg: tasks.copy_question_unresolved
    # A reviewer works on the checked candidate. A checkout with changes or without a branch is the implementer's work in progress:
    # nothing is launched, and nothing in it is touched.
    - name: Put the reviewer on the candidate
      when: reviewer
      block:
        - name: Read the checkout's changes
          ansible.builtin.command:
            argv: "{{ copy_git + ['status', '--porcelain'] }}"
          register: review_status
          changed_when: false
        - name: Read the checkout's branch
          ansible.builtin.command:
            argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
          register: review_branch
          failed_when: false
          changed_when: false
        - name: Require a clean checkout on a branch
          ansible.builtin.assert:
            that:
              - review_status.stdout == ''
              - review_branch.rc == 0 and review_branch.stdout | length > 0
            fail_msg: tasks.copy_tree_dirty
        # The restore requires the branch at this commit again: a reviewer that commits on it or moves it leaves it unrestored.
        - name: Read the branch's tip
          ansible.builtin.command:
            argv: "{{ copy_git + ['rev-parse', '--verify', 'HEAD'] }}"
          register: review_tip
          changed_when: false
        # Named before the mark, so a set mark is always followed by the restore that clears it.
        - name: Name the branch to restore
          ansible.builtin.set_fact:
            review_restore: "{{ review_branch.stdout }}"
        # The copy keeps the mark until a verified restore clears it: a later turn restores the checkout only while it is set.
        - name: Mark the detach in the copy
          ansible.builtin.command:
            argv: "{{ copy_git + ['update-ref', 'refs/orbit/review-detach', review_tip.stdout] }}"
          changed_when: true
        - name: Check the candidate out
          ansible.builtin.command:
            argv: "{{ copy_git + ['checkout', '--quiet', '--detach', intent.turn.candidate] }}"
          changed_when: true
        # From here the checkout is the reviewer's until `restore.json` says it is restored: a phase cut before that holds the group.
        - name: Mark the checkout as detached
          ansible.builtin.copy:
            content: "{}"
            dest: "{{ run }}/detach.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue:
        - name: Name the refusal
          ansible.builtin.set_fact:
            review_error: "{{ 'tasks.copy_tree_dirty' if ansible_failed_result.msg | default('') == 'tasks.copy_tree_dirty' else 'tasks.copy_turn_failed' }}"
      always:
        - name: Write the review evidence
          ansible.builtin.copy:
            content: "{{ {'ready': review_error is not defined, 'error_code': review_error | default(none)} | to_json }}"
            dest: "{{ run }}/review.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require the reviewer's checkout
          ansible.builtin.assert:
            that: review_error is not defined
            fail_msg: "{{ review_error | default('') }}"
    # The run and its read; the reviewer's restore follows whatever happened in them.
    - name: Run the turn and read it back
      block:
        # Each evidence file is written as soon as its command ends, so a phase that the outer bound or a cancel cuts still tells
        # whether a turn was launched and how far it came.
        - name: Mark the turn as launched
          ansible.builtin.copy:
            content: "{}"
            dest: "{{ run }}/launch.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        # A new thread is made first, through T3's own RPC, with its title, provider instance, model and model options: stock T3's
        # `thread start` takes no model options. Its first turn is then a send, as a continued thread's turn is.
        - name: Create the new thread
          when: intent.turn.thread == 'new'
          ansible.builtin.command:
            argv: >-
              {{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', intent.turn.t3, 'create', intent.turn.title, intent.turn.provider,
                 intent.turn.model, intent.turn.options | to_json] }}
            stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
          register: turn_create
          failed_when: false
          changed_when: true
          no_log: true
        # The helper prints one JSON object whenever it exits 0; any other exit made no thread, and its stderr says why.
        - name: Name the thread of the run
          ansible.builtin.set_fact:
            turn_created: "{{ (turn_create.stdout | from_json) if intent.turn.thread == 'new' and turn_create.rc == 0 else {} }}"
          no_log: true
        - name: Name the thread of the run and why a create made none
          ansible.builtin.set_fact:
            turn_target: "{{ (turn_created.thread_id | default(none)) if intent.turn.thread == 'new' else turn_resumed | first }}"
            turn_create_error: >-
              {{ (turn_created.error | default(none) or (turn_create.stderr | default(''))[-4096:] or 'The thread create printed nothing.')
                 if intent.turn.thread == 'new' else '' }}
          no_log: true
        - name: Run the thread's turn and wait for its run
          when: turn_target | default(none, true) is not none
          ansible.builtin.command:
            argv: >-
              {{ copy_exec + ['/usr/bin/timeout', '--kill-after=30', intent.turn.seconds | string, intent.turn.t3, 'thread', 'send', '--wait', '--json',
                 turn_target, '-'] }}
            stdin: "{{ intent.turn.prompt }}"
            stdin_add_newline: false
          register: turn_send
          failed_when: false
          changed_when: true
          no_log: true
        # A create that made no thread is a start T3 refused: nothing ran, and the start evidence carries T3's own message.
        - name: Take the run's start
          ansible.builtin.set_fact:
            turn_start: >-
              {{ turn_send if turn_target | default(none, true) is not none
                 else {'rc': 1, 'stdout': '', 'stderr': 'T3 could not create the thread: ' ~ turn_create_error} }}
          no_log: true
        - name: Write the start evidence
          ansible.builtin.copy:
            # T3 prints a refused start, such as an instance it does not know, on stderr only. Only a failed start's stderr is kept, and
            # only its last 4096 characters, so a chatty run cannot push the file past its bound.
            content: >-
              {{ {'start_exit': turn_start.rc, 'start': turn_start.stdout | default(''),
                  'error': (turn_start.stderr | default(''))[-4096:] if turn_start.rc != 0 else ''} | to_json }}
            dest: "{{ run }}/start.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        # A wait that the bound cut leaves T3's run going. It is stopped here, before the read back and a reviewer's restore, on the
        # thread found by its title: the start printed nothing. The answer is written as soon as the stop ends.
        - name: Stop the run cut by its bound
          when: turn_start.rc in [124, 137]
          block:
            - name: Find the cut thread by its title
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
              register: turn_cut_list
              failed_when: false
              changed_when: false
              no_log: true
            - name: Name the cut thread
              ansible.builtin.set_fact:
                turn_cut: >-
                  {{ ((turn_cut_list.stdout | from_json) if turn_cut_list.rc == 0 else [])
                     | selectattr('title', 'equalto', intent.turn.title) | list }}
              no_log: true
            - name: Stop the cut run
              when: turn_cut | length == 1
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', intent.turn.t3, 'stop', (turn_cut | first).threadId] }}"
                stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
              register: turn_stop
              failed_when: false
              changed_when: true
              no_log: true
          rescue:
            # A list that is not JSON finds no thread to stop: the result reads the turn as one that may still run.
            - name: Stop no cut run
              ansible.builtin.meta: noop
          always:
            - name: Write the stop evidence
              when: turn_stop.rc is defined
              ansible.builtin.copy:
                content: "{{ {'stop_exit': turn_stop.rc, 'stop': turn_stop.stdout | default('')} | to_json }}"
                dest: "{{ run }}/stop.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
        # `--wait` exits 2 when the run waits for an answer. The question is stored first; the run is stopped only after its evidence is
        # written, so a stopped run's question is never lost. The helper reads its session from `t3 auth session issue` itself and keeps it
        # in its memory only; the phase passes it nothing.
        - name: End the turn at its question
          when: turn_start.rc == 2
          block:
            - name: Name the waiting run
              ansible.builtin.set_fact:
                turn_waiting: "{{ turn_start.stdout | from_json }}"
              no_log: true
            - name: Read the question
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', intent.turn.t3, 'read', turn_waiting.threadId] }}"
                stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
              register: turn_ask
              failed_when: false
              changed_when: false
              no_log: true
            - name: Write the question evidence
              ansible.builtin.copy:
                content: "{{ {'ask_exit': turn_ask.rc, 'ask': turn_ask.stdout | default('')} | to_json }}"
                dest: "{{ run }}/ask.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
            - name: Stop the run that asks
              # Only on a read the result step stores whole: questions only, no approval. The helper stops the run only while it waits
              # for exactly these requests.
              when: turn_ask.rc == 0 and (turn_ask.stdout | from_json).stoppable
              ansible.builtin.command:
                argv: >-
                  {{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', intent.turn.t3, 'interrupt', turn_waiting.threadId, turn_waiting.runId,
                     (turn_ask.stdout | from_json).requests | map(attribute='request_id') | join('\n')] }}
                stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
              register: turn_interrupt
              failed_when: false
              changed_when: true
              no_log: true
          rescue:
            # A start or a question that is not JSON stops nothing: the result reads the question as unread.
            - name: Stop nothing
              ansible.builtin.meta: noop
          always:
            - name: Write the interrupt evidence
              when: turn_interrupt.rc is defined
              ansible.builtin.copy:
                content: "{{ {'interrupt_exit': turn_interrupt.rc, 'interrupt': turn_interrupt.stdout | default('')} | to_json }}"
                dest: "{{ run }}/interrupt.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Read the thread back
          block:
            - name: Find the thread by its title
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
              register: turn_list
              failed_when: false
              changed_when: false
              no_log: true
            - name: Name the thread of this turn
              ansible.builtin.set_fact:
                turn_found: >-
                  {{ ((turn_list.stdout | from_json) if turn_list.rc == 0 else [])
                     | selectattr('title', 'equalto', intent.turn.title) | list }}
              no_log: true
            - name: Show the thread
              when: turn_found | length == 1
              ansible.builtin.command:
                argv: >-
                  {{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'show', '--messages', '200', '--json',
                     (turn_found | first).threadId] }}
              register: turn_show
              failed_when: false
              changed_when: false
              no_log: true
          rescue:
            # A list that is not JSON reads as no thread found: the start evidence above still decides the turn.
            - name: Read no thread
              ansible.builtin.set_fact:
                turn_found: []
                turn_list_unreadable: true
          always:
            - name: Write the read evidence
              ansible.builtin.copy:
                content: >-
                  {{ {'list_exit': none if turn_list_unreadable | default(false) else turn_list.rc | default(none),
                      'found': turn_found | default([]) | length,
                      'status': ((turn_found | first).status | default(none)) if turn_found | default([]) | length == 1 else none,
                      'show_exit': turn_show.rc | default(none), 'show': turn_show.stdout | default('')} | to_json }}
                dest: "{{ run }}/read.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
      always:
        # After a reviewer turn, also a failed or cut one: what the reviewer changed goes, and the task branch is checked out again at
        # the tip it had. A checkout that is not clean on that branch and tip, or a run that still goes on and may change it again, holds
        # its group until task:cancel destroys the copy.
        - name: Restore the checkout after the reviewer
          when: review_restore is defined
          block:
            - name: Discard the reviewer's changes
              ansible.builtin.command:
                argv: "{{ copy_git + ['reset', '--quiet', '--hard'] }}"
              changed_when: true
            - name: Remove the reviewer's new files
              ansible.builtin.command:
                argv: "{{ copy_git + ['clean', '--quiet', '-fd'] }}"
              changed_when: true
            - name: Check the task branch out again
              ansible.builtin.command:
                argv: "{{ copy_git + ['checkout', '--quiet', review_restore] }}"
              changed_when: true
            - name: Read the restored changes
              ansible.builtin.command:
                argv: "{{ copy_git + ['status', '--porcelain'] }}"
              register: restored_status
              changed_when: false
            - name: Read the restored branch
              ansible.builtin.command:
                argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
              register: restored_branch
              changed_when: false
            - name: Read the restored tip
              ansible.builtin.command:
                argv: "{{ copy_git + ['rev-parse', '--verify', 'HEAD'] }}"
              register: restored_tip
              changed_when: false
            - name: Clear the detach mark of a verified restore
              when: restored_status.stdout == '' and restored_branch.stdout == review_restore and restored_tip.stdout == review_tip.stdout
              ansible.builtin.command:
                argv: "{{ copy_git + ['update-ref', '-d', 'refs/orbit/review-detach'] }}"
              register: restored_cleared
              changed_when: true
          rescue:
            - name: Name the failed restore
              ansible.builtin.set_fact:
                review_unrestored: true
          always:
            - name: Write the restore evidence
              ansible.builtin.copy:
                content: >-
                  {{ {'restored': not review_unrestored | default(false) and restored_cleared.rc | default(1) == 0} | to_json }}
                dest: "{{ run }}/restore.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
