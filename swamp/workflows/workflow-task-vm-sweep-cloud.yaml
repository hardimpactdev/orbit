id: e7de7f6f-f9ef-48f7-91d7-05a05deec696
name: task-vm-sweep-cloud
description: Sweep the captured cloud inventory in one bounded provider phase.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.sweep_host
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: sweep
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: ${{ "swp-assets-"+run.id }}
      methodName: assets
      inputs:
        intent: ${{ inputs.intent }}
  - name: api
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-lifecycle-input'
      behaviorName: ${{ "swp-api-"+run.id }}
      methodName: api_assets
      inputs: {}
  - name: sweep
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "swp-sweep-"+run.id }}
      methodName: execute
      inputs:
        run: 'exec timeout --signal=TERM --kill-after=5s 220s python3 -B "$SCRIPT"

          '
        ignoreExitCode: true
        env:
          SCRIPT: ${{ steps.assets.outputs.cloud_script }}
          PYTHONPATH: ${{ steps.api.outputs.directory }}
          ORBIT_SWEEP_INTENT: ${{ steps.assets.outputs.input_json }}
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    - step: api
      condition:
        type: succeeded
queueTimeout: 10
