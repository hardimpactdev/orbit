id: 5343cf76-d595-4d65-a0db-c22ca1962b28
name: task-vm-provider-power
description: One Incus power action and one postcondition over pinned SSH from 209.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets: {type: object, additionalProperties: false}
    action:
      type: string
      enum:
      - start
      - stop
      - delete
      - inspect
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - action
  additionalProperties: false
jobs:
- name: provider
  labels: {role: swamp}
  steps:
  - name: input
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-lifecycle-input'
      behaviorName: '${{ "vm-lifecycle" }}'
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
        action: ${{ inputs.action }}
  - name: incus-before
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-provider-" + inputs.intent.host_ssh_execution.target.host).split(".").join("-") }}'
      methodName: exec
      globalArgs: &id001
        name: '${{ ("vm-provider-" + inputs.intent.host_ssh_execution.target.host).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.host_ssh_execution.target.user }}
          port: ${{ inputs.intent.host_ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.host_ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.host_ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.host_ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ steps.input.outputs.observe_argv }}
        timeoutSec: 180
    dependsOn:
    - step: input
      condition:
        type: succeeded
  - name: before
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-lifecycle-input'
      behaviorName: '${{ "vm-lifecycle" }}'
      methodName: observe
      inputs:
        intent: ${{ inputs.intent }}
        action: ${{ inputs.action }}
        stdout: ${{ steps["incus-before"].outputs.stdout }}
    dependsOn:
    - step: input
      condition:
        type: succeeded
    - step: incus-before
      condition:
        type: always
  - name: incus-action
    writes: true
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-provider-" + inputs.intent.host_ssh_execution.target.host).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: ${{ steps.input.outputs.action_argv }}
        timeoutSec: 180
    dependsOn:
    - step: before
      condition:
        type: succeeded
    guard: ${{ !steps.before.outputs.change }}
    allowFailure: true
  - name: incus-after
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-provider-" + inputs.intent.host_ssh_execution.target.host).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        # Q-WAIT: Incus's own bounded wait for the guest agent, so the next step can run commands in it; then one observation.
        argv: '${{ inputs.action == "start" ? ["timeout", "130", "/bin/sh", "-c", "/usr/bin/sudo -n -- /usr/bin/incus --project \"$1\" wait \"$2\" agent --timeout 120 --interval 1 && exec /usr/bin/sudo -n -- /usr/bin/incus --project \"$1\" list --format json -- \"$2\"", "sh", inputs.intent.vm.project, inputs.intent.name] : steps.input.outputs.observe_argv }}'
        timeoutSec: 180
    queueTimeout: 10
    dependsOn:
    - step: before
      condition:
        type: succeeded
    - step: incus-action
      condition:
        type: always
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-lifecycle-input'
      behaviorName: '${{ "vm-lifecycle" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        action: ${{ inputs.action }}
        stdout: ${{ steps["incus-after"].outputs.stdout }}
    dependsOn:
    - step: before
      condition:
        type: succeeded
    - step: incus-after
      condition:
        type: always
