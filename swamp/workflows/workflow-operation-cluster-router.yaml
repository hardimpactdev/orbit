id: 30f3bb33-0431-4fdf-9cd5-b54c5da45354
name: operation-cluster-router
description: One immutable Router transition on209 through shared native publication children.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: router
  steps:
  - name: prepare
    target: orbit-node-209
    guard: ${{ inputs.intent.cluster_router.noop || inputs.intent.cluster_router.candidate == null }}
    task:
      type: workflow
      workflowIdOrName: cluster-router-prepare
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent: ${{ inputs.intent.cluster_router.candidate }}
  - name: forward
    target: orbit-node-209
    dependsOn:
    - {step: prepare, condition: {type: always}}
    guard: ${{ inputs.intent.cluster_router.noop || steps.exists(key, key == "prepare" && steps[key].status == "failed")
      }}
    task:
      type: workflow
      workflowIdOrName: cluster-router-forward
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent: ${{ inputs.intent }}
        parent_run_id: ${{ run.id }}
  - name: restore
    target: orbit-node-209
    dependsOn:
    - {step: forward, condition: {type: always}}
    guard: ${{ !("forward" in steps) || steps.forward.status != "succeeded" || steps.forward.outputs.result.ready
      }}
    task:
      type: workflow
      workflowIdOrName: cluster-router-restore
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent: ${{ inputs.intent }}
        parent_run_id: ${{ run.id }}
  - name: retire
    target: orbit-node-209
    dependsOn:
    - {step: forward, condition: {type: always}}
    forEach:
      item: old
      in: ${{ inputs.intent.cluster_router.old_nodes }}
    guard: ${{ !("forward" in steps) || steps.forward.status != "succeeded" || !steps.forward.outputs.result.ready
      }}
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent:
          rule: ${{ self.old.firewall }}
          control_node_id: 209
          connection: ${{ self.old.connection }}
          host_keys: ${{ self.old.host_keys }}
  - name: result
    target: orbit-node-209
    dependsOn:
    - {step: prepare, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    - {step: restore, condition: {type: always}}
    - {step: retire, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router-result'
      behaviorName: ${{ "cluster-router-result-" + run.id }}
      methodName: read
      inputs:
        noop: ${{ inputs.intent.cluster_router.noop }}
        old_count: ${{ size(inputs.intent.cluster_router.old_nodes) }}
        steps: ${{ steps }}
  - name: complete
    target: orbit-node-209
    dependsOn:
    - {step: result, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/cluster-router-result'
      behaviorName: ${{ "cluster-router-complete-" + run.id }}
      methodName: complete
      inputs:
        stdout: ${{ steps.result.outputs.stdout }}
