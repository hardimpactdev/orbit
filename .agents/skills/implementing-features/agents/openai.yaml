interface:
  display_name: "Implementing Features"
  short_description: "Own an Orbit feature from frame through land."
  default_prompt: "Own FRAME through LAND; use the feature tmux session. Dispatch substantive BUILD edits to Grok workers, point Grok workers at the exact feature worktree without a model override, then point one independent Claude general reviewer at that worktree with --model opus and reuse it for the review cycle. Consume bin/orbit-feature-proof-receipt instead of repeating the terminal gate. Run every deterministic check, complete the diff-derived proof venue, and involve the user only for remaining human judgment. Preserve unrelated tmux sessions and files."
