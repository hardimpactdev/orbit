name: Docs site

# Mintlify deploys the docs-site branch: main's tree plus the docs build outputs that Git ignores on main
# (docs/docs.json, docs/openapi.json, docs/flows-data.js). Each green CI run on main rebuilds that branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: false

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'

jobs:
  publish:
    name: Publish docs-site
    if: github.repository == 'hardimpactdev/orbit' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      # A slower run for an older commit must not replace a newer build.
      - name: Skip a commit older than the published one
        id: fresh
        run: |
          published=$(gh api "repos/${{ github.repository }}/commits/docs-site" --jq '.parents[0].sha' 2>/dev/null || true)
          if [ -n "$published" ] && [ "$(gh api "repos/${{ github.repository }}/compare/$published...$SOURCE" --jq .status)" = behind ]; then
            echo "docs-site already holds a newer main commit, $published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/php
        if: steps.fresh.outputs.publish == 'true'
        with:
          coverage: none
      - name: Install generator dependencies
        if: steps.fresh.outputs.publish == 'true'
        run: |
          cp apps/gateway/.env.example apps/gateway/.env
          composer install --working-dir=apps/gateway --no-interaction --prefer-dist --no-dev
          composer install --working-dir=apps/docs --no-interaction --prefer-dist --no-dev
      - name: Build the docs
        if: steps.fresh.outputs.publish == 'true'
        run: |
          bin/docs-openapi
          composer docs-build
      - name: Push docs-site
        if: steps.fresh.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/docs.json docs/openapi.json docs/flows-data.js
          git commit -q -m "docs-site: build of $SOURCE"
          # Only this step holds the write token; the build steps above run without it.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/docs-site
