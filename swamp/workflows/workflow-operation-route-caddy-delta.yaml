id: 2c1fb8bb-5e46-4f5e-b742-99e7801684d9
name: operation-route-caddy-delta
queueTimeout: 30
description: Compose captured public sections and apply them with official file actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        user:
          type: string
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
            become:
              type: boolean
              const: true
            nodePort:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
          - become
          - nodePort
          additionalProperties: false
        before:
          type: object
        after:
          type: object
        alternatives:
          type: array
          items:
            type: object
        direction:
          type: string
          enum:
          - forward
          - restore
        retain_removed:
          type: boolean
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - node_id
      - user
      - control_node_id
      - connection
      - before
      - after
      - direction
      - host_keys
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: publication
  target: orbit-node-209
  steps:
  - name: read-current
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-read-current-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - env
        - /bin/sh
        - -c
        - |-
          set -eu
          if sudo /usr/bin/test -f /etc/caddy/Caddyfile; then sudo /usr/bin/cat /etc/caddy/Caddyfile; fi
  - name: compose
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "route-delta-compose-" + run.id }}
      methodName: caddy
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        control_node_id: ${{ inputs.intent.control_node_id }}
        connection: ${{ inputs.intent.connection }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
        current: ${{ steps["read-current"].outputs.stdout }}
        alternatives: '${{ "alternatives" in inputs.intent ? inputs.intent.alternatives : [] }}'
        retain_removed: '${{ "retain_removed" in inputs.intent ? inputs.intent.retain_removed : false }}'
        host_keys: ${{ inputs.intent.host_keys }}
    dependsOn:
    - step: read-current
      condition:
        type: succeeded
  - name: apply-config
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-apply-config-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - |-
          set -eu
          /usr/bin/install -m 0640 -o root -g caddy /dev/null "$1"
          /usr/bin/cat > "$1"
        - route-file
        - /etc/caddy/Caddyfile
        stdin: ${{ steps.compose.outputs.caddy.content }}
        sudo: true
    dependsOn:
    - step: compose
      condition:
        type: succeeded
  - name: validate
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-validate-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - /bin/sh
        - -c
        - sudo -u caddy /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    dependsOn:
    - step: apply-config
      condition:
        type: succeeded
  - name: reload
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-reload-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - /bin/sh
        - -c
        - sudo /usr/bin/systemctl reload caddy
    dependsOn:
    - step: validate
      condition:
        type: succeeded
- name: completion
  target: orbit-node-209
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '{"ready":true,"version":"%s"}\n' "$ORBIT_VERSION"
        env:
          ORBIT_VERSION: ${{ steps.compose.outputs.caddy.version }}
