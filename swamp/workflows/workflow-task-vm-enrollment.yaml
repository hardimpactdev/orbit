          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/install","-D","-m","0644","/dev/stdin","/etc/orbit/agent/config.toml"] : ["/usr/bin/install","-D","-m","0644","/dev/stdin","/etc/orbit/agent/config.toml"] }}'
        stdin: ${{ inputs.intent.agent.configuration }}
        sudo: ${{ inputs.intent.provider != "incus" }}
    dependsOn:
    - step: observer-identity-proven
      condition:
        type: succeeded
  - name: observer-ca
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
