id: a7839446-4acb-4e72-b82f-d188f108a1fc
name: operation-route-caddy
description: Official file application, validation and reload with complete public intent.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        caddy_publication:
          type: object
          properties:
            node_id:
              type: integer
              minimum: 1
            user:
              type: string
            caddy:
              type: object
            control_node_id:
              type: integer
              const: 209
            connection:
              type: object
              properties:
                nodeHost:
                  type: string
                nodeUser:
                  type: string
                nodeIdentityFile:
                  type: string
                become:
                  type: boolean
                  const: true
                nodePort:
                  type: integer
                  minimum: 1
                  maximum: 65535
              required:
              - nodeHost
              - nodeUser
              - nodeIdentityFile
              - become
              - nodePort
              additionalProperties: false
            host_keys:
              type: array
              items:
                type: string
              minItems: 1
          required:
          - node_id
          - user
          - caddy
          - control_node_id
          - connection
          - host_keys
          additionalProperties: false
      required:
      - caddy_publication
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: publication
  labels: {role: swamp}
  steps:
  - name: Read the input
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/caddy-public-input'
      behaviorName: input-caddy-public-input
      methodName: prepare
      inputs: {publication: '${{ inputs.intent.caddy_publication }}'}
  - name: Check the connection
    labels: {role: swamp}
    dependsOn: [{step: Read the input, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("caddy-pin-" + string(inputs.intent.caddy_publication.connection.nodeHost)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ ("caddy-pub-" + string(inputs.intent.caddy_publication.connection.nodeHost)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.caddy_publication.connection.nodeUser }}'
          identityFile: '${{ inputs.intent.caddy_publication.connection.nodeIdentityFile }}'
          port: '${{ inputs.intent.caddy_publication.connection.nodePort }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.caddy_publication.connection.nodeHost }}'
          transport: {hostKeys: '${{ inputs.intent.caddy_publication.host_keys }}'}
      inputs: {hosts: 'name:target', argv: ["true"]}
  - name: Write the Caddyfile
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Check the connection, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("caddy-stage-" + string(inputs.intent.caddy_publication.connection.nodeHost)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - /bin/sh
        - -eu
        - -c
        - |-
          umask 077
          /usr/bin/install -m 0640 -o root -g caddy /dev/null "$1"
          /usr/bin/cat > "$1"
        - orbit-caddy-stage
        - '${{ "/etc/caddy/.orbit-candidate-" + run.id }}'
        stdin: '${{ steps["Read the input"].outputs.caddy.content }}'
  - name: Validate the Caddyfile
    writes: true
    labels: {role: swamp}
    dependsOn: [{step: Write the Caddyfile, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("caddy-test-" + string(inputs.intent.caddy_publication.connection.nodeHost)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: 'name:target'
        sudo: true
        argv:
        - timeout
        - '70'
        - /bin/sh
        - -eu
        - -c
        - |-
          trap 'rm -f -- "$1"' EXIT
          timeout 60 runuser -u caddy -- /usr/bin/caddy validate --config "$1" --adapter caddyfile
          mv -Tf -- "$1" "$2"
        - orbit-caddy
        - '${{ "/etc/caddy/.orbit-candidate-" + run.id }}'
        - /etc/caddy/Caddyfile
  - name: Reload Caddy
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Validate the Caddyfile, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("caddy-reload-" + string(inputs.intent.caddy_publication.connection.nodeHost)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: 'name:target'
        argv: [timeout, '60', /usr/bin/systemctl, reload, caddy]
        sudo: true
  - name: Check the Caddyfile
    labels: {role: swamp}
    dependsOn: [{step: Reload Caddy, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("caddy-file-" + string(inputs.intent.caddy_publication.connection.nodeHost)).split(".").join("-") }}'
      methodName: check
      globalArgs:
        nodeHost: '${{ inputs.intent.caddy_publication.connection.nodeHost }}'
        nodeUser: '${{ inputs.intent.caddy_publication.connection.nodeUser }}'
        nodePort: '${{ inputs.intent.caddy_publication.connection.nodePort }}'
        nodeIdentityFile: '${{ inputs.intent.caddy_publication.connection.nodeIdentityFile }}'
        become: true
        path: /etc/caddy/Caddyfile
        ensure: present
        content: '${{ steps["Read the input"].outputs.caddy.content }}'
        owner: root
        group: caddy
        mode: '0640'
      inputs: {}
  - name: Check the publication
    labels: {role: swamp}
    dependsOn: [{step: Check the Caddyfile, condition: {type: succeeded}}]
    task:
      type: assert
      expr: 'steps["Check the Caddyfile"].outputs.status == "compliant"'
      message: Caddy configuration differs after publication.
