name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A nightly run on main tests every project in full and refreshes each Pest TIA graph, as a manual dispatch does.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Pushes to main share one group: a running main run always
# finishes, and a newer push replaces only the waiting one, so after a burst of merges the newest commit
# is tested next. Its affected tests cover every change since the last tested main commit. Scheduled and
# manual runs get a group per commit, so a push never cancels a full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main-push' || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'

jobs:
  project:
    name: ${{ matrix.name }}
    # The main test selection reads the newest full runs on main.
    permissions:
      actions: read
      contents: read
    # The Gateway suite runs on the self-hosted runner on Sabre when ORBIT_SABRE_RUNNER is true. Its subprocess group
    # runs on a GitHub-hosted runner, so each Gateway run takes one Sabre runner.
    # Pull requests from forks always use a GitHub-hosted runner, so outside code never runs on Sabre. A pull request
    # with a large Gateway selection also runs up to three Gateway shards, each on its own orbit-shard runner.
    runs-on: ${{ matrix.directory == 'apps/gateway' && matrix.part != 'subprocess' && vars.ORBIT_SABRE_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "sabre"]') || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            directory: apps/cli
          - name: Docs
            directory: apps/docs
          - name: Gateway
            directory: apps/gateway
            part: tests
          - name: E2E
            directory: apps/e2e
            part: tests
          - name: PHP SDK
            directory: packages/php-sdk
          # The subprocess groups of the two largest suites run in their own jobs, beside the rest of the suite. A
          # project without a part runs everything in one job. New entries go last, so each job keeps its job index.
          - name: Gateway subprocess
            directory: apps/gateway
            part: subprocess
          - name: E2E subprocess
            directory: apps/e2e
            part: subprocess

    env:
      ORBIT_TIA_DIRECTORY: .orbit-tia

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # A pull request tests its merge ref, the tree that would land on main. Its commit descends from the main
          # commit that the restored main graph records, so TIA selects only the tests that the pull request affects.
          # Pest reads the graph on that detached HEAD and does not write it.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
          repository: ${{ github.repository }}

      # The checkout above names the branch, and a later push can move it before this job starts. A running main run
      # is never cancelled, so it must test exactly its own commit: its Required checks result releases that commit.
      - name: Pin the run's commit
        if: github.event_name != 'pull_request'
        working-directory: .
        run: git reset --hard "$GITHUB_SHA"

      # The recipe's exact PHP build (ADR 0216). A hosted runner installs it; Sabre only verifies it, because a job never
      # installs software on a self-hosted runner.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: pcov

      # Sabre's own node shim lives in a home directory the runner user cannot read. GitHub-hosted runners ship Node.
      - name: Set up Node
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun for package cache and generated merge tests
        if: matrix.directory == 'apps/gateway' || matrix.directory == 'apps/docs'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Homebrew
        if: matrix.directory == 'apps/gateway' && runner.environment == 'github-hosted'
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install Gateway system dependencies
        if: matrix.directory == 'apps/gateway' && runner.environment == 'github-hosted'
        timeout-minutes: 10
        env:
          # A mirror that stops answering fails the request after 30 seconds and is retried, instead of hanging the job.
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          id -u caddy >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Prepare application environment
        if: matrix.directory == 'apps/docs' || matrix.directory == 'apps/gateway' || matrix.directory == 'apps/e2e'
        run: cp .env.example .env

      - name: Install dependencies
        if: matrix.directory != 'apps/e2e'
        run: composer install --no-interaction --prefer-dist

      # The Docs merge proof regenerates Gateway OpenAPI and web types in disposable clones.
      - name: Install generated merge proof dependencies
        if: matrix.directory == 'apps/docs'
        working-directory: .
        run: |
          (cd apps/gateway && cp .env.example .env && composer install --no-interaction --prefer-dist)
          (cd apps/web && bun install --frozen-lockfile)

      - name: Install all project dependencies for E2E integration tests
        if: matrix.directory == 'apps/e2e'
        working-directory: .
        run: bin/bootstrap --skip-checks

      - name: Validate Composer metadata
        if: matrix.part != 'subprocess'
        run: composer validate --strict

      # A pull request restores the quality caches only from main and saves none, as it does the Pest TIA graph below.
      - name: Compute PHPStan result cache prefix
        if: matrix.part != 'subprocess'
        id: orbit-phpstan-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-phpstan-php8.5-${{ matrix.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.directory), format('{0}/phpstan.neon', matrix.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore PHPStan result cache
        if: matrix.part != 'subprocess'
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.directory }}/vendor/phpstan/cache/resultCache.php
          key: ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ github.event_name != 'pull_request' && format('{0}-{1}-', steps.orbit-phpstan-key.outputs.prefix, github.ref_name) || '' }}
            ${{ steps.orbit-phpstan-key.outputs.prefix }}-main-
            ${{ github.event_name != 'pull_request' && format('orbit-phpstan-php8.5-{0}-', matrix.directory) || '' }}

      - name: Compute Pint cache prefix
        if: matrix.part != 'subprocess'
        id: orbit-lint-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-lint-php8.5-${{ matrix.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.directory), format('{0}/pint.json', matrix.directory), format('{0}/rector.php', matrix.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore Pint cache
        if: matrix.part != 'subprocess'
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.directory }}/vendor/pint.cache
          key: ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ github.event_name != 'pull_request' && format('{0}-{1}-', steps.orbit-lint-key.outputs.prefix, github.ref_name) || '' }}
            ${{ steps.orbit-lint-key.outputs.prefix }}-main-
            ${{ github.event_name != 'pull_request' && format('orbit-lint-php8.5-{0}-', matrix.directory) || '' }}

      - name: Run project quality checks
        if: matrix.part != 'subprocess'
        env:
          ORBIT_CHECK_PROCESSES: ${{ runner.environment == 'self-hosted' && 6 || 4 }}
        run: composer check

      - name: Check classification fakes
        if: matrix.part != 'subprocess'
        run: php ../../bin/check-classification-fakes tests

      - name: Save PHPStan result cache
        if: success() && matrix.part != 'subprocess' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.directory }}/vendor/phpstan/cache/resultCache.php
          key: ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Save Pint cache
        if: success() && matrix.part != 'subprocess' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.directory }}/vendor/pint.cache
          key: ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Compute Pest TIA cache prefix
        id: orbit-tia-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-tia-php8.5-${{ matrix.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.directory), format('{0}/tests/Pest.php', matrix.directory), format('{0}/phpunit.xml', matrix.directory), format('{0}/phpunit.xml.dist', matrix.directory)) }}" >> "$GITHUB_OUTPUT"

      # Each run on main saves its graph under its own key, so a full run on an already tested commit still refreshes
      # the cache. A pull request restores only a main graph, first the one for its base commit, and saves none:
      # actions/cache tries every restore key in the pull request's own scope before main's, and an older graph of the
      # pull request would count every main change since it as changed.
      - name: Restore Pest TIA graph
        id: orbit-tia-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.directory }}/.orbit-tia
          key: ${{ steps.orbit-tia-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.event_name != 'pull_request' && format('{0}-{1}-', steps.orbit-tia-key.outputs.prefix, github.ref_name) || '' }}
            ${{ github.event_name == 'pull_request' && format('{0}-main-{1}-', steps.orbit-tia-key.outputs.prefix, github.event.pull_request.base.sha) || '' }}
            ${{ steps.orbit-tia-key.outputs.prefix }}-main-
            ${{ github.event_name != 'pull_request' && format('orbit-tia-php8.5-{0}-', matrix.directory) || '' }}

      # The Gateway plan job lists the Gateway tests of a pull request at the same time as this job's quality checks.
      # This job reads the plan when it needs it, so the other projects do not wait for the plan. A partial re-run
      # copies the finished plan job and its artifact, so it reads the same plan. API errors are retried for a minute.
      - name: Read the Gateway test plan
        id: gateway-plan
        if: matrix.directory == 'apps/gateway' && matrix.part != 'subprocess' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errors=0
          for _ in $(seq 120); do
            if ! job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "Gateway plan") | "\(.status) \(.conclusion)"'); then
              errors=$((errors + 1))
              if [ "$errors" -ge 12 ]; then
                echo '::error::The Actions API did not answer 12 times in a row.'
                exit 1
              fi
              sleep 5
              continue
            fi
            errors=0
            read -r status conclusion <<< "$job" || true
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                echo "::error::The Gateway plan job ended with $conclusion."
                exit 1
              fi
              for attempt in 1 2 3; do
                rm -rf "$RUNNER_TEMP/gateway-plan"
                gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n gateway-plan -D "$RUNNER_TEMP/gateway-plan" && break
                [ "$attempt" = 3 ] && exit 1
                sleep 5
              done
              plan="$RUNNER_TEMP/gateway-plan/gateway-plan.json"
              if [ "$(jq -r .commit "$plan")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::The Gateway plan describes $(jq -r .commit "$plan"), not $(git rev-parse HEAD): refs/pull/N/merge moved since the plan ran. Re-run all jobs, not only the failed ones."
                exit 1
              fi
              printf 'sharded=%s\nfilter=%s\n' "$(jq -r '.shards > 1' "$plan")" "$(jq -r '.filters[0] // ""' "$plan")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo '::error::The Gateway plan job did not finish within 10 minutes.'
          exit 1

      - name: Run affected tests
        if: matrix.part != 'subprocess' && github.event_name == 'pull_request' && steps.gateway-plan.outputs.sharded != 'true'
        run: vendor/bin/pest --parallel --processes=${{ runner.environment == 'self-hosted' && 6 || 4 }} --tia --compact

      # A filter turns TIA off, so the shard runs exactly the test classes that the plan gave it. The plan leaves out
      # the privileged group, which the Gateway privileged job runs.
      - name: Run Gateway shard 1
        if: matrix.part != 'subprocess' && steps.gateway-plan.outputs.sharded == 'true'
        env:
          FILTER: ${{ steps.gateway-plan.outputs.filter }}
        run: vendor/bin/pest --parallel --processes=${{ runner.environment == 'self-hosted' && 6 || 4 }} --no-tia --exclude-group=privileged --compact --filter "$FILTER"

      # A push to main tests the changes since the commit its restored main graph describes. It runs the full suite when
      # that graph is unusable, the changes include files that Pest cannot link to tests, or the newest nightly or manual
      # run failed. Those runs are always full.
      - name: Choose the main test selection
        id: orbit-tia-plan
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.orbit-tia-key.outputs.prefix }}
          RESTORED_KEY: ${{ steps.orbit-tia-restore.outputs.cache-matched-key }}
        run: ../../bin/ci-tia plan --event "$EVENT" --prefix "$PREFIX" --restored-key "$RESTORED_KEY" --repository "$GITHUB_REPOSITORY"

      - name: Run tests affected since the main graph
        if: matrix.part != 'subprocess' && steps.orbit-tia-plan.outputs.mode == 'affected'
        shell: bash
        run: vendor/bin/pest --parallel --processes=${{ runner.environment == 'self-hosted' && 6 || 4 }} --tia --compact | tee "$RUNNER_TEMP/orbit-tia-pest.log"

      - name: Run full test suite and refresh Pest TIA graph
        if: matrix.part != 'subprocess' && steps.orbit-tia-plan.outputs.mode == 'full'
        run: vendor/bin/pest --parallel --processes=${{ runner.environment == 'self-hosted' && 6 || 4 }} --tia --fresh --compact

      # TIA does not link these contracts to the files they read, so every affected run also runs them.
      - name: Run architecture tests
        if: always() && matrix.part != 'subprocess' && (github.event_name == 'pull_request' || steps.orbit-tia-plan.outputs.mode == 'affected')
        env:
          PROJECT: ${{ matrix.directory }}
        run: |
          case "$PROJECT" in
            apps/cli) architecture_tests='tests/Feature/CommandSurfaceTest.php tests/Feature/CliBinaryBuildContractTest.php' ;;
            apps/gateway) architecture_tests='tests/Unit/Architecture tests/Feature/Infrastructure/Instances/ConfiguredOriginReadTest.php tests/Feature/Infrastructure/Caddy/CaddyPublicationLockTest.php' ;;
            apps/e2e) architecture_tests='tests/Unit/E2E/Value/TopologyNodeCatalogTest.php tests/Feature/Configuration/ComposerConfigurationTest.php tests/Feature/Configuration/SubprocessTestGroupTest.php tests/Feature/Configuration/DocsMergeRefWorkflowTest.php' ;;
            packages/php-sdk) architecture_tests='tests/Unit/SuccessRequestIdBoundaryTest.php tests/Unit/RepositoryGuidanceTest.php tests/Unit/Requests/Workspaces/WorkspaceRequestsTest.php tests/Unit/Requests/Deployments/DeploymentRequestsTest.php' ;;
            *) exit 0 ;;
          esac
          for architecture_test in $architecture_tests; do
            vendor/bin/pest --parallel --processes=${{ runner.environment == 'self-hosted' && 6 || 4 }} --compact "$architecture_test"
          done

      # TIA does not link code that a test runs in a PHP subprocess to that test, so a run that is not full also runs
      # them when a change since the pull request base, or since the commit of the main graph, reaches the project.
      # Gateway and E2E run them in their subprocess jobs; a full run in the tests job runs them with the whole suite.
      - name: Choose whether to run subprocess tests
        id: orbit-subprocess
        if: always() && matrix.part != 'tests' && (github.event_name == 'pull_request' || steps.orbit-tia-plan.outputs.mode == 'affected')
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.orbit-tia-plan.outputs.base }}
        run: ../../bin/ci-tia subprocess --base "$BASE"

      # The PHP SDK has no subprocess tests. Every other project's group must find tests.
      - name: Run subprocess tests
        if: always() && matrix.part != 'tests' && steps.orbit-subprocess.outputs.run == 'true'
        run: vendor/bin/pest --parallel --processes=${{ runner.environment == 'self-hosted' && 6 || 4 }} --no-tia --group=subprocess --compact${{ matrix.directory == 'packages/php-sdk' && ' --do-not-fail-on-empty-test-suite' || '' }}

      - name: Require the Pest TIA graph to describe this commit
        if: matrix.part != 'subprocess' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MODE: ${{ steps.orbit-tia-plan.outputs.mode }}
          BASE: ${{ steps.orbit-tia-plan.outputs.base }}
        run: ../../bin/ci-tia finish --mode "$MODE" --base "$BASE" --log "$RUNNER_TEMP/orbit-tia-pest.log"

      - name: Save Pest TIA graph
        if: success() && matrix.part != 'subprocess' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.directory }}/.orbit-tia
          key: ${{ steps.orbit-tia-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A full run records this commit in the graph, and the step that requires it records it after an affected run.
      # Stage the same-run exports for the cache-ref publisher and the background main cache store.
      - name: Export main caches
        if: success() && matrix.part != 'subprocess' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PROJECT: ${{ matrix.directory }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          graph = Path('.orbit-tia/graph.json')
          data = json.loads(graph.read_text())
          baseline = data['baselines']['main']
          if data.get('schema') != 1 or baseline.get('sha') != os.environ['GITHUB_SHA'] or not baseline.get('results'):
              raise SystemExit('The main graph must describe this tested commit.')
          quality = {}
          Path('.orbit-tia/quality').mkdir(exist_ok=True)
          for tool, source in (('pint', 'vendor/pint.cache'), ('phpstan', 'vendor/phpstan/cache/resultCache.php')):
              if Path(source).is_file() and Path(source).stat().st_size:
                  shutil.copyfile(source, f'.orbit-tia/quality/{tool}')
                  quality[tool] = hashlib.sha256(Path(source).read_bytes()).hexdigest()
          files = ['composer.lock', 'tests/Pest.php', 'phpunit.xml', 'phpunit.xml.dist']
          manifest = {
              'schema': 2,
              'project': os.environ['PROJECT'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'configurations': {tool: hashlib.sha256(Path(config).read_bytes()).hexdigest()
                                 for tool, config in (('pint', 'pint.json'), ('phpstan', 'phpstan.neon')) if tool in quality},
              'graph_sha256': hashlib.sha256(graph.read_bytes()).hexdigest(),
              'inputs': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files if Path(name).is_file()},
              'php': subprocess.run(['php', '-r', 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;'],
                                    check=True, capture_output=True, text=True).stdout,
              'quality': quality,
          }
          Path('.orbit-tia/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Publish main caches
        if: success() && matrix.part != 'subprocess' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-tia-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            ${{ matrix.directory }}/.orbit-tia/graph.json
            ${{ matrix.directory }}/.orbit-tia/manifest.json
            ${{ matrix.directory }}/.orbit-tia/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # A pull request lists its Gateway test selection here. When it has more than 200 test classes, the Gateway job
  # runs the first of up to four shards and the Gateway shards job runs the others, each on its own runner. Runs on main
  # keep one Gateway job, because the full run there writes the whole Pest TIA graph.
  gateway-plan:
    name: Gateway plan
    if: github.event_name == 'pull_request'
    # A hosted runner keeps every Sabre runner for tests. Pest's graph fingerprint holds only the PHP minor version.
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      shards: ${{ steps.plan.outputs.shards }}
      sharded: ${{ steps.plan.outputs.sharded }}
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      ORBIT_TIA_DIRECTORY: .orbit-tia
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      # The Gateway job checks out the same merge ref and refuses a plan for another commit.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}

      # Without a coverage driver, Pest selects the full suite for a PHP change.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: pcov

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist

      - name: Compute Pest TIA cache prefix
        id: orbit-tia-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-tia-php8.5-apps/gateway-${{ hashFiles('apps/gateway/composer.lock', 'apps/gateway/tests/Pest.php', 'apps/gateway/phpunit.xml', 'apps/gateway/phpunit.xml.dist') }}" >> "$GITHUB_OUTPUT"

      # The same main graph that the Gateway job restores for a pull request.
      - name: Restore Pest TIA graph
        uses: actions/cache/restore@v6
        with:
          path: apps/gateway/.orbit-tia
          key: ${{ steps.orbit-tia-key.outputs.prefix }}-${{ github.head_ref }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ format('{0}-main-{1}-', steps.orbit-tia-key.outputs.prefix, github.event.pull_request.base.sha) }}
            ${{ steps.orbit-tia-key.outputs.prefix }}-main-

      - name: Choose one Gateway test job or shards
        id: plan
        run: ../../bin/ci-tia shards --plan "$RUNNER_TEMP/gateway-plan.json"

      # One name for every attempt: a partial re-run copies this job and reads its artifact, and a full re-run replaces
      # it. GitHub allows re-runs for 30 days.
      - name: Publish the Gateway test plan
        uses: actions/upload-artifact@v7
        with:
          name: gateway-plan
          path: ${{ runner.temp }}/gateway-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  gateway-shards:
    name: Gateway shards
    needs: gateway-plan
    if: needs.gateway-plan.outputs.sharded == 'true'
    # The orbit-shard runner containers on Beast and Shark serve this repository's pull requests under the same
    # condition as the Gateway job on Sabre. A fork's pull request uses a hosted runner.
    runs-on: ${{ vars.ORBIT_SABRE_RUNNER == 'true' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted", "orbit-shard"]') || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.gateway-plan.outputs.matrix || '[2]') }}
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.gateway-plan.outputs.commit }}

      # A shard container only verifies the recipe build; tools/ci-runners/setup.sh installs it.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: pcov

      - name: Set up Node
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun for package cache tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Sabre's PHP CLI sets this in 99-github-actions.ini, and the PHP action sets it on a hosted runner. The shard runner
      # containers keep their PHP CLI default, so the job sets it only for its own processes and Pest's workers.
      - name: Keep exception arguments in traces
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/php"
          echo 'zend.exception_ignore_args=0' > "$RUNNER_TEMP/php/99-orbit-ci.ini"
          echo "PHP_INI_SCAN_DIR=:$RUNNER_TEMP/php" >> "$GITHUB_ENV"

      - name: Set up Homebrew
        if: runner.environment == 'github-hosted'
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install Gateway system dependencies
        if: runner.environment == 'github-hosted'
        timeout-minutes: 10
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          id -u caddy >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist

      - name: Download the Gateway test plan
        uses: actions/download-artifact@v8
        with:
          name: gateway-plan
          path: ${{ runner.temp }}/gateway-plan

      # A filter turns TIA off, so the shard runs exactly the test classes that the plan gave it. Each orbit-shard runner
      # shares its host, so a shard runs at most 4 Pest processes, as on a hosted runner. The runner user has no sudo,
      # so the shard never runs the privileged group.
      - name: Run Gateway shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          plan="$RUNNER_TEMP/gateway-plan/gateway-plan.json"
          test "$(jq -r .commit "$plan")" = "$(git rev-parse HEAD)"
          filter=$(jq -r --argjson shard "$SHARD" '.filters[$shard - 1]' "$plan")
          vendor/bin/pest --parallel --processes=4 --no-tia --exclude-group=privileged --compact --filter "$filter"

  privileged:
    name: Gateway privileged
    # A GitHub-hosted runner gives every run a fresh machine with passwordless sudo and leaves Sabre to the Gateway suite.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none
      - uses: actions/setup-node@v7
        if: runner.environment == 'self-hosted'
        with:
          node-version: '24'
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
        if: runner.environment == 'github-hosted'
      - name: Install hosted runner prerequisites
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          id -u caddy >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install Gateway dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
      # ORBIT_TEST_DOCKER runs the Valkey Database server tests against a real valkey/valkey:8.1 in Docker.
      - name: Pull the current Valkey test image
        run: |
          docker pull valkey/valkey:8.1
          docker run --rm valkey/valkey:8.1 valkey-server --version
      - name: Run every privileged test
        env:
          ORBIT_TEST_DOCKER: '1'
        run: vendor/bin/pest --parallel --processes=4 --no-tia --group=privileged --fail-on-empty-test-suite --compact --colors=never
      # A privileged test that writes into the checkout as root leaves files the runner user cannot delete, and
      # every later checkout on that Sabre runner then fails. Remove anything root owns in the workspace.
      - name: Remove root-owned files from the workspace
        if: always() && runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: sudo -n find . -xdev -user root -prune -exec rm -rf --one-file-system -- {} +

  # The programs that the Gateway runs on Nodes: shellcheck, ruff, and their direct tests (docs/reference/remote-programs.md).
  remote-programs:
    name: Remote programs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse Gateway script growth
        env:
          NODE_SCRIPTS_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'HEAD^1' }}
        run: |
          python3 -m unittest discover -s tools -p test_node_scripts_ratchet.py
          bin/node-scripts-ratchet --base "$NODE_SCRIPTS_BASE"
      # The recipe's exact PHP build (ADR 0216), as in every other PHP job.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install shellcheck and ruff
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends --yes shellcheck
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install --quiet ruff==0.17.0
          echo "$RUNNER_TEMP/ruff/bin" >> "$GITHUB_PATH"
      # ORBIT_TEST_DOCKER also starts Valkey from a bootstrapped ACL file in Docker.
      - name: Pull the current Valkey test image
        run: |
          docker pull valkey/valkey:8.1
          docker run --rm valkey/valkey:8.1 valkey-server --version
      - name: Lint and test the remote programs
        env:
          ORBIT_TEST_DOCKER: '1'
        run: bin/remote-programs-check

  docs-merge-ref:
    name: Docs (merge ref)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - name: Check out PR merge ref
        id: merge-checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Require PR merge ref
        if: steps.merge-checkout.outcome != 'success'
        working-directory: .
        run: |
          echo '::error title=Docs merge ref unavailable::Cannot check the PR merge result (the PR may conflict with main); not checking the PR head.'
          exit 1

      - name: Log merge commit
        working-directory: .
        run: git show --no-patch --format=fuller HEAD

      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Docs quality checks
        env:
          ORBIT_CHECK_PROCESSES: 4
        run: composer check

  api-reference:
    name: API reference
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The recipe's exact PHP build (ADR 0216), with PCOV loaded and disabled.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none

      - name: Reject App-domain names
        run: php bin/project-vocabulary

      - name: Check that every environment variable is documented
        run: php bin/env-docs

      - name: Check that the projects share their tooling baseline
        run: php bin/tooling-baseline
      - name: Check that every docs page is in the site navigation
        run: php bin/docs-nav

      - name: Install Gateway and CLI dependencies
        run: |
          for project in apps/gateway apps/cli; do
            (cd "$project" && { [ -e .env ] || [ ! -f .env.example ] || cp .env.example .env; } && composer install --no-interaction --prefer-dist)
          done

      - name: Check that the API reference matches the Gateway routes
        run: bin/docs-openapi --check

      - name: Check that the MCP tool manifest matches the API reference
        run: bin/mcp-tools --check

  web:
    name: Web
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the API types match the API reference
        run: bun run types && git diff --exit-code src/api/schema.d.ts

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Install the test browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run tests
        run: bun run test

      # Open pages compare their build with version.json, so the published build must hold it beside index.html.
      - name: Build
        run: bun run build && test -s dist/index.html && test -s dist/version.json

      # Automatic Gateway releases (ADR 0201) install this build for the same commit, so the Gateway needs no Node or Bun.
      # Every run on main publishes it, a manual dispatch too, so each successful Required checks result on main has one.
      - name: Publish web build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  pi-server:
    name: Pi server
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: apps/pi-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  agent:
    name: Rust agent
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request that changes neither the agent nor this workflow cannot change the agent build.
      # Pushes to main and manual runs always build it.
      - name: Detect agent changes
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/agent/|\.github/workflows/ci\.yml$)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
            echo "The pull request does not change apps/agent or ci.yml; skipping the agent build."
          fi
      - name: Install Rust toolchain
        if: steps.changes.outputs.agent == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: clippy,rustfmt
      - name: Restore Rust caches
        if: steps.changes.outputs.agent == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent
      - name: Install cross compiler
        if: steps.changes.outputs.agent == 'true'
        run: command -v cross >/dev/null || cargo install cross --locked
      - name: Check formatting
        if: steps.changes.outputs.agent == 'true'
        run: cargo fmt --all -- --check
      - name: Run clippy
        if: steps.changes.outputs.agent == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        if: steps.changes.outputs.agent == 'true'
        run: cargo test --locked
      - name: Build static x86_64 binary
        if: steps.changes.outputs.agent == 'true'
        run: cross build --locked --release --target x86_64-unknown-linux-musl
      - name: Build static aarch64 binary
        if: steps.changes.outputs.agent == 'true'
        run: cross build --locked --release --target aarch64-unknown-linux-musl

      # Keep this after the builds so a version bump can prove its binaries before tagging.
      # Always check delivery, including recipe-only pull requests that skip the Rust build.
      - name: Check agent release delivery
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tools -p 'test_check_agent_release.py'
          python3 tools/check_agent_release.py

  desktop:
    name: Desktop app
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request that changes neither the desktop app nor this workflow cannot change its build.
      # Pushes to main and manual runs always check it.
      - name: Detect desktop changes
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/desktop/|\.github/workflows/ci\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "The pull request does not change apps/desktop or ci.yml; skipping the desktop checks."
          fi
      - name: Set up Bun
        if: steps.changes.outputs.desktop == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        if: steps.changes.outputs.desktop == 'true'
        run: bun install --frozen-lockfile
      # Tauri links WebKitGTK on Linux; https://v2.tauri.app/start/prerequisites/ lists these packages.
      - name: Install the Tauri system libraries
        if: steps.changes.outputs.desktop == 'true'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Install Rust toolchain
        if: steps.changes.outputs.desktop == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Restore Rust caches
        if: steps.changes.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Check formatting
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Run clippy
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  publish-ci-cache:
    name: Publish CI cache ref
    needs: [required]
    # Required checks accepts skipped PR-only jobs; override the implicit success() for that needs chain.
    if: ${{ !cancelled() && needs.required.result == 'success' && github.repository == 'nckrtl/orbit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: sandbox-tia-*-${{ github.sha }}
          path: ${{ runner.temp }}/ci-cache-exports
      - name: Publish immutable tested-SHA ref and prune old cache refs
        run: python3 bin/ci-cache-ref publish --commit "$GITHUB_SHA" --exports "$RUNNER_TEMP/ci-cache-exports"

  required:
    name: Required checks
    if: always()
    needs: [project, gateway-plan, gateway-shards, privileged, remote-programs, docs-merge-ref, api-reference, web, pi-server, agent, desktop]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every project to pass
        env:
          EVENT: ${{ github.event_name }}
          DOCS_MERGE_REF_RESULT: ${{ needs.docs-merge-ref.result }}
          PROJECT_RESULT: ${{ needs.project.result }}
          GATEWAY_PLAN_RESULT: ${{ needs.gateway-plan.result }}
          GATEWAY_SHARDED: ${{ needs.gateway-plan.outputs.sharded }}
          GATEWAY_SHARDS_RESULT: ${{ needs.gateway-shards.result }}
          PRIVILEGED_RESULT: ${{ needs.privileged.result }}
          REMOTE_PROGRAMS_RESULT: ${{ needs.remote-programs.result }}
          API_REFERENCE_RESULT: ${{ needs.api-reference.result }}
          WEB_RESULT: ${{ needs.web.result }}
          PI_SERVER_RESULT: ${{ needs.pi-server.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$PROJECT_RESULT" = success && test "$PRIVILEGED_RESULT" = success && test "$REMOTE_PROGRAMS_RESULT" = success && test "$API_REFERENCE_RESULT" = success && test "$WEB_RESULT" = success && test "$PI_SERVER_RESULT" = success && test "$AGENT_RESULT" = success && test "$DESKTOP_RESULT" = success && {
            if [ "$EVENT" = pull_request ]; then
              test "$DOCS_MERGE_REF_RESULT" = success && test "$GATEWAY_PLAN_RESULT" = success && {
                # The shards run exactly when the plan chose them.
                if [ "$GATEWAY_SHARDED" = true ]; then
                  test "$GATEWAY_SHARDS_RESULT" = success
                else
                  test "$GATEWAY_SHARDED" = false && test "$GATEWAY_SHARDS_RESULT" = skipped
                fi
              }
            else
              test "$DOCS_MERGE_REF_RESULT" = skipped && test "$GATEWAY_PLAN_RESULT" = skipped && test "$GATEWAY_SHARDS_RESULT" = skipped
            fi
          }
