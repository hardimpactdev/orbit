id: be0fb735-5420-4c04-aa82-b33a8a9ce8fa
name: operation-node-wireguard-hub-converge
description: Publish the peer list on the VPN Node's WireGuard hub over official SSH from 209; the hub keeps its own key.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: node.wireguard_hub_converge}
    intent:
      type: object
      properties:
        hub_id: {type: integer, minimum: 1}
        ssh: {type: object}
        action_json: {type: string, maxLength: 1048576}
      required: [hub_id, ssh, action_json]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: hub
  steps:
  - name: Resolve the hub script
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: '${{ "node-hub-publish" }}'
      methodName: publish
      inputs: {}
  - name: Apply the hub config
    # One script on the hub: new peer list under its own Interface, rollback copy, live sync, peer check, restore on failure.
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Resolve the hub script, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("wireguard-hub-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("wireguard-hub-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
        hosts: [{name: hub, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]
      inputs:
        hosts: 'name:hub'
        sudo: true
        argv: [timeout, '120', python3, -I, -c, '${{ steps["Resolve the hub script"].outputs.script }}', '${{ inputs.intent.action_json }}']
        okExitCodes: [0, 1]
  - name: Confirm the outcome
    labels: {role: swamp}
    dependsOn: [{step: Apply the hub config, condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Apply the hub config"].outputs.exitCode == 0', severity: high, message: The hub did not take the new peer list.}
