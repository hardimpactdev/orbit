id: 2c16b6c3-e9db-48ec-af98-05cb1a473782
name: route-certificate-remove
queueTimeout: 30
description: "One Node: a withdrawn scope's certificate folders, removed by official steps."
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    parent_run_id: {type: string}
    restoring: {type: boolean}
    intent:
      type: object
      properties:
        # Null only for older plans: execution is placed by role, not by this metadata.
        control_node_id: {type: [integer, 'null'], minimum: 1}
        connection: {type: object}
        host_keys: {type: array, items: {type: string}, minItems: 1}
        leaf: {type: object}
      required: [leaf, control_node_id, connection, host_keys]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, parent_run_id, restoring, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: certificate
  steps:
    # The account's passwd line: its home places the account copy.
  - name: 'Read the account'
    labels: {role: swamp}
    dependsOn: []
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("route-cert-account-" + string(inputs.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("route-cert-account-" + string(inputs.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.connection.nodeUser }}'
          port: '${{ inputs.intent.connection.nodePort }}'
          identityFile: '${{ inputs.intent.connection.nodeIdentityFile }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.connection.nodeHost }}'
          transport: {hostKeys: '${{ inputs.intent.host_keys }}'}
      inputs:
        hosts: name:target
        argv: '${{ ["timeout", "10", "getent", "passwd", inputs.intent.leaf.user] }}'
        timeoutSec: 20
    # The scope's Caddy folder, gone.
  - name: 'Remove the Caddy pair'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the account', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("route-cert-remove-" + string(inputs.node_id) + "-" + inputs.intent.leaf.scope).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ "/etc/caddy/orbit-certificates/" + inputs.intent.leaf.scope }}', ensure: absent,
        nodeHost: '${{ inputs.intent.connection.nodeHost }}', nodeUser: '${{ inputs.intent.connection.nodeUser }}', nodePort: '${{ inputs.intent.connection.nodePort }}',
        nodeIdentityFile: '${{ inputs.intent.connection.nodeIdentityFile }}', become: true}
      inputs: {}
    # The scope's account copy, gone.
  - name: 'Remove the account pair'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the Caddy pair', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("route-cert-remove-copy-" + string(inputs.node_id) + "-" + inputs.intent.leaf.scope).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ steps["Read the account"].outputs.stdout.split(":")[5] + "/.orbit/certificates/" + inputs.intent.leaf.scope }}', ensure: absent,
        nodeHost: '${{ inputs.intent.connection.nodeHost }}', nodeUser: '${{ inputs.intent.connection.nodeUser }}', nodePort: '${{ inputs.intent.connection.nodePort }}',
        nodeIdentityFile: '${{ inputs.intent.connection.nodeIdentityFile }}', become: true}
      inputs: {}
