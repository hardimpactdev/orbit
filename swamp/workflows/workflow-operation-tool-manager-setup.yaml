id: 2a25f8bb-82b0-4bcb-93d2-cd0ce9fcb4af
name: operation-tool-manager-setup
description: The shared Tool Manager setup that tool.install runs on first use and the development deploy runs for Vite+.
vaults: []
queueTimeout: 60
inputs:
  type: object
  # report: print the facts instead of failing, so tool.install keeps a conflicting scope's own code.
  properties: {operation_id: {type: integer, minimum: 1}, node_id: {type: integer, minimum: 1}, intent: {type: object}, ssh: {type: object}, report: {type: boolean}}
  required: [operation_id, node_id, intent, ssh]
  additionalProperties: false
jobs:
- name: setup
  steps:
  - name: assets
    target: orbit-node-209
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tm-assets-" + run.id }}', methodName: manager_assets, inputs: {input: '${{ inputs.intent }}'}}
  - name: setup_assets
    target: orbit-node-209
    guard: '${{ !("setup" in inputs.intent) || inputs.intent.setup == null }}'
    task: {type: behavior, behaviorType: '@nckrtl/node-tool-setup-assets', behaviorName: '${{ "tm-setup-assets-" + run.id }}', methodName: read, inputs: {setup: '${{ inputs.intent.setup }}'}}
  # Read the manager; on a Linux first use install it at its pinned version, then read it again.
  - name: Set up the Tool Manager
    target: orbit-node-209
    dependsOn: [{step: assets, condition: {type: succeeded}}, {step: setup_assets, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tm-setup-" + run.id }}'
      methodName: exec
      globalArgs: {name: '${{ "tm-ssh-" + run.id }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', identitiesOnly: true, hostKeys: '${{ inputs.ssh.target.host_keys }}'}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 905
        argv: [timeout, '900', python3, -I, -c, '${{ steps.assets.outputs.driver }}', setup]
        # The bundle, then the installers; the Vite+ installer exceeds one exec argument.
        stdin: '${{ steps.assets.outputs.bundle + ("setup_assets" in steps && steps.setup_assets.status == "succeeded" ? "\x1e" + steps.setup_assets.outputs.manager_body + "\x1e" + (steps.setup_assets.outputs.apt_body == null ? "" : steps.setup_assets.outputs.apt_body) : "") }}'
  - name: ready
    target: orbit-node-209
    dependsOn: [{step: Set up the Tool Manager, condition: {type: succeeded}}]
    task: {type: assert, expr: '("report" in inputs && inputs.report) || steps["Set up the Tool Manager"].outputs.exitCode == 0', severity: high, message: The Tool Manager is not ready.}
