---
# What only a template has: the firewall is on, denies incoming connections by default and has the public SSH recovery rule. It changes nothing.
- name: Read the firewall
  ansible.builtin.command: { argv: [ufw, status, verbose] }
  register: template_firewall
  changed_when: false
- name: Check the firewall
  ansible.builtin.assert:
    that:
      - "'Status: active' in template_firewall.stdout"
      - "'Default: deny (incoming)' in template_firewall.stdout"
      - "'orbit:public-ssh-recovery' in template_firewall.stdout"
    fail_msg: The firewall of the template is not on, with deny by default and the public SSH recovery rule.
    quiet: true
