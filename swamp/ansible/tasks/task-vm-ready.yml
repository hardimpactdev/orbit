---
# An Incus converge can reach a VM that has just booted: wait until SSH answers and cloud-init has finished.
# Exit 2 of cloud-init is done with recoverable errors; the server is usable and the check phase judges it.
- name: Wait for a new server
  when: intent.image
  block:
    # A task start reaches its Incus guest over WireGuard after the host wrote its identity and hub peer.
    - name: Wait until SSH answers
      ansible.builtin.wait_for_connection: { timeout: "{{ 60 if intent.direct | default(false) else 300 }}", sleep: 1 }
    - name: Wait for cloud-init
      ansible.builtin.command: { argv: [timeout, "900", cloud-init, status, --wait, --long] }
      register: ready_cloud_init
      changed_when: false
      failed_when: ready_cloud_init.rc not in [0, 2]
    - name: Show what cloud-init reported
      when: ready_cloud_init.rc == 2
      ansible.builtin.debug: { msg: "{{ ready_cloud_init.stdout_lines }}" }
