id: 8474afdb-4aba-485e-9c39-8a1e63cf1d61
name: observation-maintenance
description: Run the bounded Orbit observation maintenance pass.
autoResume: true
concurrency: 1
trigger:
  schedule: "25 */5 * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: observation
    steps:
      - name: maintain
        target: orbit-node-209
        labels: { node: "209" }
        task:
          type: behavior
          behaviorType: "@nckrtl/observation"
          behaviorName: observation-maintenance
          methodName: maintain
          inputs:
            runId: "${{ run.id }}"
