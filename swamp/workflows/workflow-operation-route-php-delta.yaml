id: 3ae539e4-bd32-4fbc-b50d-bd13e660ed30
name: operation-route-php-delta
description: Compose captured public sections and apply them with official file actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
          not:
            enum:
            - 1
            - 18
        user:
          type: string
        control_node_id:
          type: integer
          minimum: 1
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
            become:
              type: boolean
              const: true
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
          - become
          additionalProperties: false
        before:
          type: object
        after:
          type: object
        direction:
          type: string
          enum:
          - forward
          - restore
      required:
      - node_id
      - user
      - control_node_id
      - connection
      - before
      - after
      - direction
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: composition
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels: &id001
    node: ${{ string(inputs.intent.node_id) }}
  steps:
  - name: plan
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "route-delta-plan-" + run.id }}
      methodName: phpPlan
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        control_node_id: ${{ inputs.intent.control_node_id }}
        connection: ${{ inputs.intent.connection }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
  - name: read-account
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-read-account-" + run.id }}
      methodName: execute
      inputs:
        run: |
          /usr/bin/python3 - <<'PYTHON'
          import grp
          import json
          import os
          import pwd

          account = pwd.getpwnam(os.environ["ORBIT_NODE_USER"])
          print(json.dumps({"user": account.pw_name, "home": account.pw_dir, "group": grp.getgrgid(account.pw_gid).gr_name}))
          PYTHON
        env:
          ORBIT_NODE_USER: ${{ inputs.intent.user }}
    dependsOn:
    - step: plan
      condition:
        type: succeeded
  - name: read-current
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-read-current-" + run.id }}
      methodName: execute
      inputs:
        run: |
          sudo --preserve-env=ORBIT_PHP_VERSIONS /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          versions = json.loads(os.environ["ORBIT_PHP_VERSIONS"])
          paths = {version: Path(f"/etc/php/{version}/fpm/pool.d/orbit-scopes.conf") for version in versions}
          print(json.dumps({version: path.read_text() if path.is_file() else "" for version, path in paths.items()}))
          PYTHON
        env:
          ORBIT_PHP_VERSIONS: ${{ steps.plan.outputs.versions_json }}
    dependsOn:
    - step: read-account
      condition:
        type: succeeded
  - name: compose
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "route-delta-compose-" + run.id }}
      methodName: php
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        control_node_id: ${{ inputs.intent.control_node_id }}
        connection: ${{ inputs.intent.connection }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
        current: ${{ steps["read-current"].outputs.stdout }}
        account: ${{ steps["read-account"].outputs.stdout }}
    dependsOn:
    - step: read-current
      condition:
        type: succeeded
- name: publication
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels: *id001
  steps:
  - name: apply-pool
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels:
      node: ${{ string(inputs.intent.control_node_id) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "route-delta-apply-pool-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        path: ${{ self.pool.path }}
        ensure: ${{ self.pool.ensure }}
        content: ${{ self.pool.content }}
        owner: root
        group: root
        mode: '0644'
    forEach:
      item: pool
      in: ${{ steps.compose.outputs.files }}
  - name: validate
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-validate-" + run.id }}
      methodName: execute
      inputs:
        run: sudo "/usr/sbin/php-fpm$ORBIT_PHP_VERSION" -t
        env:
          ORBIT_PHP_VERSION: ${{ self.pool.version }}
    dependsOn:
    - step: apply-pool
      condition:
        type: succeeded
    forEach:
      item: pool
      in: ${{ steps.compose.outputs.files }}
  - name: reload
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-reload-" + run.id }}
      methodName: execute
      inputs:
        run: sudo /usr/bin/systemctl reload "php$ORBIT_PHP_VERSION-fpm"
        env:
          ORBIT_PHP_VERSION: ${{ self.pool.version }}
    dependsOn:
    - step: validate
      condition:
        type: succeeded
    forEach:
      item: pool
      in: ${{ steps.compose.outputs.files }}
  dependsOn:
  - job: composition
    condition:
      type: succeeded
- name: completion
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels:
    node: ${{ string(inputs.intent.node_id) }}
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '%s\n' '{"ready":true}'
