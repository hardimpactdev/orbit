---
# The task VM role, in the phases of a Node converge: software, tools, check.
# One playbook, two callers: the image build runs it on the builder VM, a converge runs it on a running task VM.
# Versions come from intent.recipe, the recipe.json of the release; this file names none.
- name: Task VM role
  hosts: task_vm
  become: true
  gather_facts: false
  vars:
    recipe: "{{ intent.recipe }}"
    profile: "{{ intent.profile | default('base') }}"
    orbit_user: orbit
    orbit_home: "/home/orbit"
    vp_home: "/home/orbit/.local/share/vite-plus"
    apt_directory: /var/tmp/orbit-image-apt
    apt_environment:
      APT_CONFIG: /var/tmp/orbit-image-apt/apt.conf
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
  handlers:
    - name: Reload exports
      ansible.builtin.command: exportfs -ra
      changed_when: true
  tasks:
    - { name: Resolve the recipe, ansible.builtin.import_tasks: tasks/task-vm-recipe.yml, tags: [always] }
    - { name: Software, ansible.builtin.import_tasks: tasks/task-vm-software.yml, tags: [software] }
    - { name: Tools, ansible.builtin.import_tasks: tasks/task-vm-tools.yml, tags: [tools] }
    - { name: Check, ansible.builtin.import_tasks: tasks/task-vm-check.yml, tags: [check] }
