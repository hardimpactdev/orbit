id: ecc09a4a-9791-5928-b24f-45f1f94e4119
name: operation-database-sqlite-export
description: Run database.sqlite_export as one native placed DAG.
writes: true
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - database.sqlite_export
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: read
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: failure-admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: admission
    condition:
      type: failed
  steps:
  - name: report
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: ${{ "database-failure-" + string(inputs.operation_id) }}
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: snapshot
  target: ${{ "orbit-node-" + string(data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id) }}
  labels:
    node: ${{ string(data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id) }}
  steps:
  - name: export
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: export
      inputs:
        source: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.source }}
        run_id: ${{ run.id }}
        selected_node_id: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
- name: cleanup
  target: ${{ "orbit-node-" + string(data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id) }}
  labels:
    node: ${{ string(data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id) }}
  steps:
  - name: cleanupSource
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: cleanupSource
      inputs:
        source: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.source }}
        run_id: ${{ run.id }}
        selected_node_id: ${{ data.latest("database-sqlite-" + run.id, "intent").attributes.source.node_id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  - job: snapshot
    condition:
      type: always
- name: projection
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: project
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite'
      behaviorName: ${{ "database-sqlite-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  - job: snapshot
    condition:
      type: always
  - job: cleanup
    condition:
      type: always
