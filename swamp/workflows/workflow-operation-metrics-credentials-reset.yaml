id: 77fef03c-7ee9-4b75-a41c-e52c77a37ed7
name: operation-metrics-credentials-reset
description: Check, change and verify the admitted Grafana password through pinned official SSH from209.
vaults: [orbit-control-inputs]
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: metrics.credentials_reset}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: {type: object, properties: {vault: {type: string, enum: [orbit-control-inputs]}, key: {type: string, pattern: '^metrics-credentials-operation-[1-9][0-9]*$'}}, required: [vault, key], additionalProperties: false}}
  required: [operation_id, node_id, kind, intent, execution_secrets]
jobs:
- name: credentials
  steps:
  - name: assets
    target: orbit-node-209
    task: {type: behavior, behaviorType: '@nckrtl/metrics-credentials-assets', behaviorName: '${{ "metrics-credential-assets-" + run.id }}', methodName: read, inputs: {}}
  - name: probe
    target: orbit-node-209
    dependsOn: [{step: assets, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "metrics-credential-probe-" + run.id }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ "metrics-credential-" + run.id }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]
      inputs:
        hosts: name:target
        argv: [/usr/bin/python3, '-c', '${{ steps.assets.outputs.script }}', probe, '${{ inputs.intent.address }}']
        stdin: '${{ vault.get(inputs.execution_secrets.credentials.vault, inputs.execution_secrets.credentials.key) }}'
  - name: apply
    target: orbit-node-209
    dependsOn: [{step: probe, condition: {type: succeeded}}]
    guard: '${{ steps.probe.outputs.stdout.trim() == "{\"verified\":true}" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "metrics-credential-apply-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        argv: [/usr/bin/python3, '-c', '${{ steps.assets.outputs.script }}', apply, '${{ inputs.intent.address }}']
        stdin: '${{ vault.get(inputs.execution_secrets.credentials.vault, inputs.execution_secrets.credentials.key) }}'
  - name: confirm
    target: orbit-node-209
    dependsOn: [{step: apply, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "metrics-credential-confirm-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        argv: [/usr/bin/python3, '-c', '${{ steps.assets.outputs.script }}', confirm, '${{ inputs.intent.address }}']
        stdin: '${{ vault.get(inputs.execution_secrets.credentials.vault, inputs.execution_secrets.credentials.key) }}'
  - name: result
    target: orbit-node-209
    dependsOn: [{step: confirm, condition: {type: succeeded}}]
    task: {type: behavior, behaviorType: command/shell, behaviorName: '${{ "metrics-credential-result-" + run.id }}', methodName: execute, inputs: {run: "printf '%s\\n' '{\"reset\":true}'"}}
