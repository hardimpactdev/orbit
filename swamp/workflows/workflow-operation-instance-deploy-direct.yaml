- name: deploy
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  writes: true
  steps:
  - guard: ${{ inputs.intent.deployment.variant != "production" }}
    name: prepare-production
    task:
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      behaviorType: '@nckrtl/instance-deploy-direct'
      inputs:
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
      methodName: prepareProduction
      type: behavior
  - name: install-processes
    target: orbit-node-209
    forEach:
      item: member
      in: '${{ inputs.intent.deployment.variant == "production" ? inputs.intent.process_members : [] }}'
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ self.member.node_id }}
        kind: process.create
        intent: ${{ self.member.intent }}
        execution_secrets: '${{ "node_" + string(self.member.node_id) + "_member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["node_" + string(self.member.node_id) + "_member_" + string(self.member.id)]} : {} }}'
    dependsOn:
    - step: prepare-production
      condition:
        type: succeeded
  - guard: ${{ inputs.intent.deployment.variant != "production" }}
    name: finish-production
    task:
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      behaviorType: '@nckrtl/instance-deploy-direct'
      inputs:
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ run.id }}
      methodName: finishProduction
      type: behavior
    dependsOn:
    - step: install-processes
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: prepare-production
      condition:
        type: succeeded
- name: failure
  dependsOn:
  - job: deploy
    condition:
      type: failed
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  writes: true
  steps:
  - name: report
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-deploy-direct'
      behaviorName: ${{ "instance-deploy-node-" + string(inputs.node_id) }}
      methodName: failure
