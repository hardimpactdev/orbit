id: 11b7c12d-2dfb-4516-a025-31cd8f1b0010
name: operation-database
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
queueTimeout: 60
autoResume: true
trigger:
  schedule: "1 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-database-discovery
          methodName: discover
          inputs:
            family: operation-database
            kinds: ["database_server.create", "database_server.destroy", "database_server.close", "database.create", "database.destroy", "database_user.create", "database.write", "database.clone", "database.destroy_owned", "database.sqlite_export", "database.sqlite_cleanup", "database.sqlite_seed", "database.sqlite_seed_abandon"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-database'
          behaviorName: '${{ "operation-database-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
