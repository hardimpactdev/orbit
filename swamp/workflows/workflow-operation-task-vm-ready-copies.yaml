  - name: Wait for gateway
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '130'
        - incus
        - wait
        - ready-check-gateway
        - agent
        - '--timeout'
        - '120'
        timeoutSec: 140
    dependsOn:
    - step: Start gateway to check
      condition: {type: succeeded}
  - name: Wait for app-dev
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '130'
        - incus
        - wait
