id: ea09deaa-6bb5-4728-8ff5-7cc21159170c
name: task-vm-upcloud-image-server
description: Launch one UpCloud server from 209 with inline curl and wait for it to boot over pinned official SSH; TypeScript shapes bodies and reads answers only.
version: 1
queueTimeout: 60
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(task-vm-upcloud-token|task-vm-image-bootstrap-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
      propertyNames: {enum: [upcloud, bootstrap]}
    slot: {type: string, enum: [builder, smoke]}
    source: {type: string}
  required: [intent, execution_secrets, slot, source]
  additionalProperties: false
jobs:
- name: server
  writes: true
  steps:
  - name: plans
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --header 'Accept: application/json' https://api.upcloud.com/1.3/plan
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: request
    labels: {role: swamp}
    dependsOn:
    - {step: plans, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: request
      inputs:
        intent: ${{ inputs.intent }}
        slot: ${{ inputs.slot }}
        source: ${{ inputs.source }}
        plans_stdout: ${{ steps.plans.outputs.stdout }}
  - name: create
    # UpCloud refuses a clone of a template it still prepares and changes nothing; curl's bounded retry is the wait (Q-WAIT).
    labels: {role: swamp}
    dependsOn:
    - {step: request, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          timeout 660 curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --variable %ORBIT_HOST_PRIVATE_KEY --request POST --header 'Content-Type: application/json' \
            --expand-data "$ORBIT_CREATE_DATA" https://api.upcloud.com/1.3/server
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_HOST_PRIVATE_KEY: ${{ vault.get(inputs.execution_secrets.bootstrap.vault, inputs.execution_secrets.bootstrap.key) }}
          ORBIT_CREATE_DATA: ${{ steps.request.outputs.create_data }}
  - name: server
    labels: {role: swamp}
    dependsOn:
    - {step: create, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: server
      inputs:
        intent: ${{ inputs.intent }}
        slot: ${{ inputs.slot }}
        stdout: ${{ steps.create.outputs.stdout }}
  - name: boot
    # OpenSSH retries the connection while the server boots; one literal timeout bounds the boot and cloud-init.
    labels: {role: swamp}
    dependsOn:
    - {step: server, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-boot-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("image-upcloud-boot-" + steps.server.outputs.address).split(".").join("-") }}
        transport:
          kind: ssh
          user: orbit
          port: 22
          identityFile: ${{ inputs.intent.ssh.identity_file }}
          connectTimeoutSec: 10
          extraOptions: [ConnectionAttempts=90]
          controlMaster: {enabled: false}
        hosts:
        - name: target
          address: ${{ steps.server.outputs.address }}
          transport:
            hostKeys: ${{ [inputs.intent.host_key] }}
      inputs:
        hosts: name:target
        # Exit 2 is cloud-init done with recoverable errors; the server is usable and the check phase judges it. `--long` puts the detail in the output.
        okExitCodes: [0, 2]
        argv: [timeout, '900', /usr/bin/sudo, -n, --, /usr/bin/cloud-init, status, --wait, --long]
        timeoutSec: 1200
