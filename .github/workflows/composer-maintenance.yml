name: Composer maintenance

on:
  pull_request:
    paths:
      - 'extensions/behaviors/composer-maintenance/**'
      - 'extensions/behaviors/_lib/maintenance/**'
      - 'tests/batch_maintenance_test.ts'
      - '.github/workflows/composer-maintenance.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/behaviors/composer-maintenance/**'
      - 'extensions/behaviors/_lib/maintenance/**'
      - 'tests/batch_maintenance_test.ts'
      - '.github/workflows/composer-maintenance.yml'

permissions:
  contents: read

jobs:
  composer-maintenance:
    runs-on: [self-hosted, hardimpact]
    steps:
      - uses: actions/checkout@v4
      # Shared runners have no sudo. PHP is provided by the runner image.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Check formatting
        run: deno fmt --check extensions/behaviors/composer-maintenance extensions/behaviors/_lib/maintenance
      - name: Lint extension
        run: deno lint extensions/behaviors/composer-maintenance extensions/behaviors/_lib/maintenance
      - name: Check extension types
        run: deno check extensions/behaviors/composer-maintenance/mod.ts
