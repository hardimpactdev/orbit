id: 005e43f4-02fc-4bca-b43a-5e2456cb4258
name: operation-task-maintenance
# Each SSH step is limited to 3900 s, the run budget of the largest Operation that calls it (OperationBudgetTable::SecondsByKind).
description: Run captured package/routine maintenance as official SSH exec argv from
  Node 209, without a guest worker or shipped scripts.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.maintenance]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  labels: {role: swamp}
  steps:
  - name: read
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
  - name: workspace
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-workspace
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent:
          task_vm_id: ${{ inputs.intent.task_vm_id }}
          group_id: ${{ inputs.intent.group_id }}
          instance_id: ${{ inputs.intent.instance_id }}
          project_id: ${{ inputs.intent.project_id }}
          checkout_path: ${{ inputs.intent.checkout_path }}
          ssh_execution: ${{ inputs.intent.ssh_execution }}
    dependsOn:
    - step: read
      condition:
        type: succeeded
- name: paths
  labels: {role: swamp}
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
  steps:
  - name: path-${{ self._index }}
    labels: {role: swamp}
    forEach:
      item: item
      in: ${{ steps.read.outputs.paths }}
    task:
      type: workflow
      workflowIdOrName: task-maintenance-path
      inputs:
        place: ${{ self.item }}
        ssh_execution: ${{ inputs.intent.ssh_execution }}
    concurrency: 1
- name: maintenance
  labels: {role: swamp}
  dependsOn:
  - job: paths
    condition:
      type: succeeded
  steps:
    # Tracked changes against the provision base; exit 1 means changed.
  - name: snapshot-tracked
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh_args
        name: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout_path }}
        - diff
        - --quiet
        - ${{ inputs.intent.base }}
        - --
    # New files that .gitignore does not exclude.
  - name: snapshot-untracked
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout_path }}
        - ls-files
        - --others
        - --exclude-standard
        - -z
    dependsOn:
    - step: snapshot-tracked
      condition:
        type: succeeded
  - name: shape
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        steps: ${{ steps }}
    dependsOn:
    - step: snapshot-untracked
      condition:
        type: succeeded
  - name: Check the result
    labels: {role: swamp}
    task:
      type: assert
      expr: 'steps.shape.status == "succeeded" && "result_json" in steps.shape.outputs && steps.shape.outputs.result_json != ""'
      message: The maintenance producer did not confirm its observation.
      severity: high
    dependsOn:
    - step: shape
      condition:
        type: succeeded
queueTimeout: 30
