---
# Start the nested fleet of an Instance container: check the fleet rules, start the three nested containers, link the Club key and bring
# up the operator tunnel `wg-nested` with the hub's resolver for the fleet's TLDs. The start of a stopped clone also keeps the fleet off the egress proxy (instance-fleet-proxy.yml).
# It ends with what a start can promise (instance-fleet-reach.yml): the containers run and the tunnel reaches the hub. It never waits for Doctor: in a deployment the checkout has just moved under a running nested Gateway, whose
# schema and processes the refresh brings to the checkout first (docs/cli/instance/container/fleet-refresh.mmd). The deployment and the
# reset use it; instance-fleet-resume.yml adds the readiness. Input: instance-fleet.yml.
# The tunnel is made with `ip` and `wg`, never `wg-quick`, which segfaults in the Instance container. Its key is the operator key that the
# container holds, its peer the nested Gateway's hub key. The tunnel does not outlive a stop of the container; the next start makes it.
# Without the Club key the nested Gateway's Swamp stays down and the fleet still starts: the `club-key` device is not required.
- { name: Name the fleet commands, ansible.builtin.import_tasks: instance-fleet.yml }
# A deployment's one fleet check (only it sets `fleet_room_check`) first reads whether a refresh fits on the container's disk.
- name: Check the room for a refresh
  when: fleet_room_check | default(false) | bool
  ansible.builtin.include_tasks: instance-fleet-room.yml
# A deployment's one fleet check is this start, and the container may have just started: the inner Incus starts by socket then, and a
# read before it is ready is not a drift.
- name: Wait for the inner Incus
  ansible.builtin.command: { argv: "{{ ['timeout', '90'] + fleet_incus + ['admin', 'waitready', '--timeout', '80'] }}" }
  changed_when: false
# Deployment admits absent build rules at its initial start and when it resumes the restored seed after failure.
# Refresh installs them with the fleet stopped; rollback leaves them for the next deployment. A proof reset or standalone
# start must already have them. Never admit a conflicting map.
- name: Check the fleet rules
  ansible.builtin.import_tasks: instance-fleet-rules.yml
  vars:
    fleet_rules_apply: false
    fleet_rules_allow_missing_build: "{{ fleet_deploy_allow_missing_build | default(false) | bool }}"

- name: Read the state of the nested containers
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_incus + ['list', '--format', 'csv', '--columns', 'ns'] }}" }
  register: fleet_start_list
  changed_when: false
# One by one, so one that fails names itself. The reset (`fleet_start_together`) starts the stopped ones in one call: Incus boots them in
# parallel, 0.44 s for the three against one boot after the other.
- name: Start the nested containers
  when: not (fleet_start_together | default(false) | bool)
  ansible.builtin.command: { argv: "{{ ['timeout', '120'] + fleet_incus + ['start', item] }}" }
  loop: "{{ fleet_names | reject('in', fleet_start_list.stdout_lines | select('match', '^[^,]+,RUNNING$') | map('regex_replace', ',.*$', '') | list) | list }}"
  register: fleet_start
  changed_when: fleet_start.rc == 0
  failed_when: false
- name: Start the nested containers together
  vars:
    fleet_start_stopped: "{{ fleet_names | reject('in', fleet_start_list.stdout_lines | select('match', '^[^,]+,RUNNING$') | map('regex_replace', ',.*$', '') | list) | list }}"
  when: fleet_start_together | default(false) | bool and fleet_start_stopped | length > 0
  ansible.builtin.command: { argv: "{{ ['timeout', '120'] + fleet_incus + ['start'] + fleet_start_stopped }}" }
  register: fleet_start_one
  changed_when: fleet_start_one.rc == 0
  failed_when: false
- name: Check that the nested containers started
  vars:
    # The one call of the reset names all the containers it started.
    fleet_start_failed: >-
      {{ (([fleet_start_one | combine({'item': fleet_start_one.cmd[(fleet_incus | length) + 3:] | join(', ')})] if fleet_start_one.rc is defined else [])
          + (fleet_start.results | default([]) | selectattr('rc', 'defined') | list)) | rejectattr('rc', 'eq', 0) | list }}
  ansible.builtin.assert:
    that: fleet_start_failed | length == 0
    fail_msg: >-
      {{ fleet_start_failed | map(attribute='item') | join(', ') }} did not start:
      {{ fleet_start_failed | map(attribute='stderr') | map('trim') | join('; ') | truncate(400) }}
    quiet: true

# The fleet builds these Nodes itself. Direct Gateway reads run Incus as the managed user; the Instance host marker
# identifies every Node that needs socket access. The account already has passwordless sudo. Repair each copy at start.
- name: Read which nested Nodes are Instance hosts
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', item, '--', 'test', '-f', '/etc/orbit/instance-fleet-node'] }}"
  loop: "{{ fleet_names }}"
  register: fleet_instance_hosts
  changed_when: false
  failed_when: fleet_instance_hosts.rc not in [0, 1]
- name: Read the managed user's groups on nested Instance hosts
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', item, '--', 'id', '-nG', fleet_as_app_user[2]] }}"
  loop: "{{ fleet_instance_hosts.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
  register: fleet_instance_host_groups
  changed_when: false
- name: Give nested Instance hosts' managed users Incus socket access
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', item.item, '--', 'usermod', '--append', '--groups', 'incus-admin', fleet_as_app_user[2]] }}"
  loop: "{{ fleet_instance_host_groups.results }}"
  when: "'incus-admin' not in item.stdout.split()"
  register: fleet_instance_host_membership
  changed_when: fleet_instance_host_membership.rc == 0
# A nested Instance host heals its network pid files before each start of its Incus (files/incus-network-pid-heal.py,
# docs/reference/development-containers.md#no-stale-network-pid-file). A guest of a copied seed or a `base` made before the heal booted
# without it, maybe with an empty pid file and its bridge down. So each start, for a guest that ran already as for one it just
# started, places the heal and its drop-in, heals, and restarts that guest's Incus when it removed a file. It never fails the start.
- name: Heal the network pid files of nested Instance hosts
  vars:
    fleet_heal: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/incus-network-pid-heal.py') }}"
  ansible.builtin.command:
    argv: "{{ ['timeout', '120'] + fleet_incus + ['exec', item, '--', 'python3', '-I', '-c', fleet_heal, 'ensure'] }}"
    stdin: "{{ fleet_heal }}"
    stdin_add_newline: false
  loop: "{{ fleet_instance_hosts.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"
  register: fleet_heal_run
  changed_when: >-
    fleet_heal_run.rc == 0 and fleet_heal_run.stdout_lines | length > 0
    and ((fleet_heal_run.stdout_lines | last | from_json).placed or (fleet_heal_run.stdout_lines | last | from_json).removed | length > 0)
  failed_when: false

- { name: Restore the nested Gateway SSH trust, ansible.builtin.import_tasks: instance-fleet-known-hosts.yml }

# The nested Swamp reads its key file `api-key` as a link into the folder that the `club-key` device shows. The link is in the nested
# Gateway's own disk, so `base` keeps it; a start sets it only when it differs.
- name: Read the Club key link of the nested Gateway
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'readlink', fleet_club_link] }}"
  register: fleet_club_link_read
  changed_when: false
  failed_when: false
- name: Link the Club key of the nested Gateway
  when: fleet_club_link_read.stdout | trim != fleet_club_target
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'ln', '-sfnT', fleet_club_target, fleet_club_link] }}"
  changed_when: true

- name: Look for the operator key
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['test', '-s', fleet_operator_key] }}" }
  register: fleet_key
  changed_when: false
  failed_when: false
- name: Check the operator key
  ansible.builtin.assert:
    that: fleet_key.rc == 0
    fail_msg: "The Instance container has no operator key at {{ fleet_operator_key }}"
    quiet: true
# The hub comes up with the nested Gateway's own wg-quick unit, a few seconds after its start. wg-quick makes the interface before it
# sets its private key; in between, `wg show` prints `(none)` with exit 0. So only a WireGuard key counts as read.
- name: Read the hub key when it is a key
  vars:
    # A WireGuard public key: 32 bytes in base64.
    fleet_wireguard_key: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$'
  block:
    - name: Read the hub key
      ansible.builtin.command:
        argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'wg', 'show', 'orbit', 'public-key'] }}"
      register: fleet_hub_key
      changed_when: false
      failed_when: false
      until: fleet_hub_key.rc == 0 and fleet_hub_key.stdout | trim is match(fleet_wireguard_key)
      retries: "{{ ((fleet_boot_seconds | int) / ([fleet_ready_delay | int, 1] | max)) | round(0, 'ceil') | int }}"
      delay: "{{ fleet_ready_delay }}"
    - name: Check the hub key
      ansible.builtin.assert:
        that: fleet_hub_key.rc == 0 and fleet_hub_key.stdout | trim is match(fleet_wireguard_key)
        fail_msg: >-
          The nested Gateway's WireGuard key was not ready after {{ fleet_boot_seconds }} s; the last read got
          {{ (fleet_hub_key.stdout | trim or fleet_hub_key.stderr | default('', true) | trim or ('exit ' ~ fleet_hub_key.rc)) | truncate(200) }}
        quiet: true
- name: Read the operator tunnel
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['wg', 'show', fleet_tunnel] }}" }
  register: fleet_tunnel_read
  changed_when: false
  failed_when: false
- name: Make the operator tunnel
  when: fleet_tunnel_read.rc != 0
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['ip', 'link', 'add', fleet_tunnel, 'type', 'wireguard'] }}" }
  changed_when: true
- name: Set the key and the peer of the operator tunnel
  vars:
    fleet_peer: >-
      {{ fleet_tunnel_read.rc == 0 and ('private key: (hidden)' in fleet_tunnel_read.stdout)
         and ('listening port: ' ~ fleet_tunnel_port) in fleet_tunnel_read.stdout
         and ('peer: ' ~ (fleet_hub_key.stdout | trim)) in fleet_tunnel_read.stdout
         and ('endpoint: ' ~ intent.fleet.layout.gateway.address ~ ':' ~ fleet_hub_port) in fleet_tunnel_read.stdout
         and ('allowed ips: ' ~ intent.fleet.operator.network) in fleet_tunnel_read.stdout }}
  when: not fleet_peer
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_outer + ['wg', 'set', fleet_tunnel, 'private-key', fleet_operator_key, 'listen-port', fleet_tunnel_port,
          'peer', fleet_hub_key.stdout | trim, 'endpoint', intent.fleet.layout.gateway.address ~ ':' ~ fleet_hub_port,
          'allowed-ips', intent.fleet.operator.network, 'persistent-keepalive', '25'] }}
  changed_when: true
- name: Read the address of the operator tunnel
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['ip', '-j', 'addr', 'show', 'dev', fleet_tunnel] }}" }
  register: fleet_tunnel_address
  changed_when: false
- name: Give the operator tunnel its address
  vars:
    fleet_addresses: "{{ (fleet_tunnel_address.stdout | from_json | first).addr_info | default([]) | map(attribute='local') | list }}"
  when: intent.fleet.operator.address not in fleet_addresses
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_outer + ['ip', 'addr', 'add', intent.fleet.operator.address ~ '/' ~ intent.fleet.operator.network.split('/')[1],
          'dev', fleet_tunnel] }}
  changed_when: true
- name: Bring up the operator tunnel
  when: "'UP' not in (fleet_tunnel_address.stdout | from_json | first).flags"
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['ip', 'link', 'set', fleet_tunnel, 'up'] }}" }
  changed_when: true
# The operator reaches the fleet's sites by name: on `wg-nested` the hub's resolver answers the TLDs of the fleet's app Nodes
# (docs/reference/development-containers.md#the-fleet-step). Never `~orbit`: the container keeps its own `gateway.orbit`. `resolvectl`
# prints `Link <index> (wg-nested): <values>`; a start sets only what differs.
- name: Read the resolver of the operator tunnel
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['resolvectl', 'dns', fleet_tunnel] }}" }
  register: fleet_tunnel_dns
  changed_when: false
- name: Give the operator tunnel the hub's resolver
  when: (fleet_tunnel_dns.stdout.split('):', 1) | last).split() != [intent.fleet.operator.hub]
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['resolvectl', 'dns', fleet_tunnel, intent.fleet.operator.hub] }}" }
  changed_when: true
- name: Read the routing domains of the operator tunnel
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['resolvectl', 'domain', fleet_tunnel] }}" }
  register: fleet_tunnel_domains
  changed_when: false
- name: Route the fleet's TLDs to the hub's resolver
  vars:
    fleet_domains: "{{ ['~'] | product(intent.fleet.operator.domains) | map('join') | list }}"
  when: (fleet_tunnel_domains.stdout.split('):', 1) | last).split() | sort != fleet_domains | sort
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['resolvectl', 'domain', fleet_tunnel] + fleet_domains }}" }
  changed_when: true

# Only the start of a stopped nested-fleet clone writes the copy's proxy bypass and restarts T3 (instance-fleet-proxy.yml).
- name: Keep the inner fleet off the egress proxy in a started copy
  when: fleet_proxy_restart_t3 | default(false) | bool
  ansible.builtin.include_tasks: instance-fleet-proxy.yml

- { name: Check what the start promises, ansible.builtin.import_tasks: instance-fleet-reach.yml }
