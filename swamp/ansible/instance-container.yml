---
# The container of a development Instance on its app-dev Node (docs/reference/development-containers.md#lifecycle): a Project's
# default Instance, its first build (instance:create) and its development deployments (instance:deploy), and every other Instance,
# a clone of the default's seed snapshot with T3. One tagged part per Swamp phase.
#   create of the default: `container`, `workspace`, `processes`, `seed`, and `stop` after a failure.
#   create of a clone: `clone`, `workspace`, `agent`, `processes`, `t3`, `register`, and `stop` after a failure. A clone of a
#     nested-fleet default (its intent has `fleet`) runs `fleet_check` and `fleet_resume` after its start.
#   deploy: `start`, `fetch`, `checkout`, `processes`, `seed`, `check`. A nested-fleet default (its intent has `fleet`) adds
#     `fleet_start` (its one fleet check) and `seed` right after `start`, `fleet_refresh` before the last `seed`, and after a failure
#     `fleet_restore`, then `start` and `fleet_resume`. One run holds the phases that share their failure handling: `phases`, a
#     comma-separated list in order with the same tags, such as `-e phases=start,fetch --tags start,fetch`.
#   process: `process`, for one Process's start, stop, restart, status or logs (ORBIT_PROCESS_ACTION).
#   proof of a task copy: `fleet_reset`, before each batch: the copy's nested fleet back on `base` (tasks/instance-fleet-reset.yml).
#   proof:run in a copy: `proof_checkout`, the commit under proof into the copy's workspace and the deploy steps it makes due
#     (tasks/instance-proof-checkout.yml).
#   `container` (a create, and a move's container phase) writes the presented machine name after the first start, and `start`
#     before it boots a stopped container (tasks/instance-machine-name.yml); a clone gets `/etc/machine-info` as a
#     boot file before its first start, so T3 shows the name from its first start, and the rest right after that start (instance_clone.py).
# The Project's deploy commands are not here: Swamp runs each one in the container from its vault copy, as `orbit`.
# Git runs on the Node with a read token in a 0600 file; the container gets the branch as a bundle and never a token. The intent is
# the Gateway's admitted intent in the run folder; `intent.container` names the container, its paths, its ACL and its units.
# Every run writes `result.json` in the run folder: the commit it left checked out, or the public error code of the refusal.
# Without `phases` a run is the one phase of its first tag.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: container_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run the phases of the default Instance's container
  hosts: container_node
  gather_facts: false
  become: true
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    container: "{{ intent.container }}"
    run_id: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN_ID') }}"
    # The wake's readiness check (docs/reference/prepared-restore.md#wake): one bounded request from the Node to the container's
    # recorded address and web port; an answer below 500 is ready. The Node's fast worker (files/instance-container-wake.sh) sends the
    # same request.
    web_probe: >-
      {{ ['curl', '--silent', '--output', '/dev/null', '--write-out', '%{http_code}', '--max-time', '1.5',
          'http://' ~ container.address ~ ':' ~ container.web_port ~ '/'] }}
    container_phases: "{{ (phases | default(ansible_run_tags | first)).split(',') }}"
    # The phase that runs now; tasks/instance-container-run-phase.yml sets it as each phase starts.
    container_phase_running: "{{ container_phases | first }}"
    # The phases of this run that ended; tasks/instance-container-run-phase.yml adds each one, and a run of several phases names them in
    # its result, so a play that is killed later still says which phases passed.
    container_phases_passed: []
    # A nested-fleet container's result names what a start of this run did with its Club key: the delivery script's word, `changed`,
    # `changed_serve_pending` or `unchanged`. Each phase writes the result file again, so a later phase keeps an earlier phase's word.
    # Any other container's result never names it. The result and the failure use the same two values.
    club_key_result_file: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/result.json' }}"
    club_key_carried: >-
      {{ {} if container.club_key is not defined
         else {'club_key': club_key_written} if club_key_written is defined
         else {'club_key': (lookup('ansible.builtin.file', club_key_result_file) | from_json).club_key}
           if club_key_result_file is file and (lookup('ansible.builtin.file', club_key_result_file) | from_json).club_key | default('') in ['changed', 'changed_serve_pending', 'unchanged']
         else {} }}
    # What the refresh of a nested fleet did, part by part (tasks/instance-fleet-refresh.yml): its phase sets it, and each later phase
    # of the run keeps it from the result file, as the Club key's word.
    fleet_refresh_carried: >-
      {{ {'fleet_refresh': fleet_refresh_result} if fleet_refresh_result is defined
         else {'fleet_refresh': (lookup('ansible.builtin.file', club_key_result_file) | from_json).fleet_refresh}
           if intent.fleet is defined and club_key_result_file is file
              and (lookup('ansible.builtin.file', club_key_result_file) | from_json).fleet_refresh | default(none) is mapping
         else {} }}
    # What a deployment's checkout removed from the default's tree (instance_default_clean.py): names only, kept by each later phase.
    workspace_clean_carried: >-
      {{ {'workspace_cleaned': default_clean.stdout | from_json} if default_clean.stdout is defined
         else {'workspace_cleaned': (lookup('ansible.builtin.file', club_key_result_file) | from_json).workspace_cleaned}
           if club_key_result_file is file and (lookup('ansible.builtin.file', club_key_result_file) | from_json).workspace_cleaned | default(none) is mapping
         else {} }}
    executor_carried: >-
      {{ {} if not intent.signed_power | default(false) | bool
         else {'executor': executor_receipt, 'wake': wake_result.wake | default(none)} if executor_receipt is defined
         else ((lookup('ansible.builtin.file', club_key_result_file) | from_json) | dict2items
               | selectattr('key', 'in', ['executor', 'wake']) | items2dict)
           if club_key_result_file is file and (lookup('ansible.builtin.file', club_key_result_file) | from_json).executor | default(none) is mapping
         else {} }}
  tasks:
    - name: Run the phases
      block:
        - name: Run each phase in order
          tags: [always]
          ansible.builtin.include_tasks:
            file: tasks/instance-container-run-phase.yml
          loop: "{{ container_phases }}"
          loop_control:
            loop_var: container_phase
      rescue:
        # The code of a refusal is the fail_msg of its assert; anything else is the phase's own failure. A swamp step that exits
        # nonzero keeps no output, so a failed fleet phase also writes why into the result: `detail`, the failed task and its
        # message (a command's stderr tail with it). The fleet's messages are written to be safe to show; the Gateway redacts them
        # again. A deployment starts its fleet with `fleet_resume` only after a restore: it keeps the first failure's result and adds
        # `restore_failure`. A clone's `fleet_resume` (a create intent, no `deployment`) took no seed, so its failure says only why the
        # fleet it copied did not start. The code names the phase that ran; a run of several phases adds it as `failed_phase`, with the
        # phases that passed before it.
        - name: Write the failure
          tags: [always]
          ansible.builtin.copy:
            content: >-
              {{ (((lookup('ansible.builtin.file', failure_restored) | from_json)
                   | combine({'restore_failure': 'The inner fleet of the restored seed did not start: ' ~ failure_reason}))
                  if failure_phase == 'fleet_resume' and intent.deployment is defined and failure_restored is file
                  else ({'error_code': failure_code}
                  | combine(migrate_process_failure | default({})) | combine(node_runtime_failure | default({}))
                  | combine(fleet_drift_failure if (fleet_drift_failure | default({})).fleet_drift | default([]) else {})
                  | combine(failure_unit_detail) | combine(failure_fleet_detail) | combine(failure_checkout_detail) | combine(failure_container_detail) | combine(seed_failure | default({})) | combine(fleet_room_failure | default({})) | combine(club_key_carried)
                  | combine(wake_result | default({})) | combine(fleet_refresh_carried)
                  | combine(executor_carried) | combine(workspace_clean_carried | default({}))
                  | combine({'failed_phase': failure_phase, 'phases_passed': container_phases_passed}
                            if phases is defined else {}))) | to_json }}
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            failure_phase: "{{ container_phase_running }}"
            failure_code: >-
              {{ ansible_failed_result.msg
                 if (ansible_failed_result.msg | default('') is match('^[a-z]+\.[a-z0-9_]+$'))
                 else 'process.' ~ process_action ~ '_failed'
                 if failure_phase == 'process' and process_action in ['start', 'restart']
                 else 'instance.container_' ~ failure_phase ~ '_failed' }}
            failure_restored: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/failed.json' }}"
            failure_message: "{{ ansible_failed_result.msg | default('The task failed.') | string | trim }}"
            failure_stderr: "{{ (ansible_failed_result.stderr | default('') | string | trim)[-400:] }}"
            failure_reason: >-
              {{ ansible_failed_task.name | default('A fleet task') }}: {{ failure_message
                 }}{{ (': ' ~ failure_stderr) if failure_message == 'non-zero return code' and failure_stderr != '' else '' }}
            # A unit that did not become active is named, so the failure says which Process did not start; the Gateway records the
            # named units' Processes as failed and keeps the others as they run.
            failure_inactive_units: >-
              {{ ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item') | list if ansible_failed_task.name | default('') == 'Wait for each running unit' else [] }}
            failure_unit_detail: >-
              {{ {'detail': 'Not active: ' ~ failure_inactive_units | join(', '), 'units_inactive': failure_inactive_units}
                 if failure_inactive_units | length > 0 else {} }}
            failure_fleet_detail: >-
              {{ {} if failure_phase not in ['fleet_check', 'fleet_start', 'fleet_refresh', 'fleet_resume', 'fleet_reset'] or failure_code == failure_message
                 else {'detail': failure_reason} }}
            # A start or checkout that fails other than by a refusal names its task and the end of its stderr, at most 4096
            # characters in all. Private tasks retain only the public phase code, never their command output.
            failure_checkout_head: "{{ ansible_failed_task.name | default('A checkout task') }}: {{ failure_message }}"
            failure_checkout_stderr: "{{ ansible_failed_result.stderr | default('') | string | trim }}"
            failure_checkout_budget: "{{ 4094 - failure_checkout_head | length }}"
            failure_checkout_detail: >-
              {{ {} if failure_phase not in ['start', 'checkout', 'proof_checkout'] or failure_code == failure_message
                       or failure_inactive_units | length > 0
                       or ansible_failed_result._ansible_no_log | default(false) | bool
                       or ansible_failed_task.no_log | default(false) | bool
                 else {'detail': (failure_checkout_head ~ ': ' ~ failure_checkout_stderr[-(failure_checkout_budget | int):])
                                 if failure_checkout_stderr != '' and failure_checkout_budget | int > 0 else failure_checkout_head} }}
            # A create's container phase names its failed task and keeps its phase code in every failure, as the Operation's detail
            # (docs/reference/development-containers.md#create): the task's name, then its message (a refusal's code) bounded to 1000
            # characters, then the end of its stderr, at most 4096 characters in all, so the head survives. A private task gives only
            # its name, never its arguments or output.
            failure_container_private: >-
              {{ ansible_failed_result._ansible_no_log | default(false) | bool or ansible_failed_task.no_log | default(false) | bool }}
            failure_container_head: >-
              {{ ansible_failed_task.name | default('A container task')
                 if failure_container_private | bool
                 else (ansible_failed_task.name | default('A container task')) ~ ': ' ~ failure_message[:1000] }}
            failure_container_budget: "{{ 4094 - failure_container_head | length }}"
            failure_container_detail: >-
              {{ {} if failure_phase != 'container' or failure_inactive_units | length > 0
                 else {'detail': (failure_container_head ~ ': ' ~ failure_checkout_stderr[-(failure_container_budget | int):])
                                 if not failure_container_private | bool and failure_checkout_stderr != ''
                                    and failure_container_budget | int > 0 else failure_container_head} }}
        - name: Fail the phase
          tags: [always]
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The container phase failed.') }}"

  handlers:
    - name: Load the shared container handlers
      ansible.builtin.import_tasks: tasks/instance-container-handlers.yml
