id: 04dac56c-8670-44b3-a29c-f337710ebdc4
name: operation-node
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
queueTimeout: 60
autoResume: true
trigger:
  schedule: "8,38 * * * * *"
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-node-discovery
          methodName: discover
          inputs:
            family: operation-node
            kinds: ["node.prepare_php_packages", "node.settings", "node.converge", "node.bootstrap_probe", "node.bootstrap_install", "node.add", "node.remove", "node.removal_begin", "node.removal_restore", "node.network_projection", "node.bootstrap_host", "node.bootstrap_verify", "node.macos_inspect", "node.enrollment_begin", "node.enrollment_activate", "node.enrollment_commit", "node.enrollment_restore", "node.enrollment_settings", "node.role_add", "node.role_converge", "node.role_remove", "node.role_relocate", "node.role_relocate_source", "node.role_relocate_target", "node.network_converge", "node.network_rollback", "node.wireguard_hub_converge"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ steps.discover.outputs.work }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-node"
          behaviorName: '${{ "operation-node-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: "${{ self.work.kind }}"
            worker: '${{ self.work.worker }}'
