id: be0fb735-5420-4c04-aa82-b33a8a9ce8fa
name: node-network-hub
description: Write the Gateway-rendered hub file and one file per peer with cfgmgmt, delete the removed Node's peer file and load them with wg syncconf over official SSH from 209; the hub private key never leaves the Node.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent:
      type: object
      properties:
        hub_id: {type: integer, minimum: 1}
        ssh: {type: object}
        config: {type: string, maxLength: 65536}
        port: {type: integer, minimum: 1, maximum: 65535}
        peers: {type: array, items: {type: object, properties: {node_id: {type: integer, minimum: 1}, file: {type: string}, content: {type: string, maxLength: 4096}}, required: [node_id, file, content], additionalProperties: false}}
        prune_argv: {type: array, items: {type: string}}
        peer_keys: {type: array, items: {type: string, pattern: '^[A-Za-z0-9+/]{43}=$'}}
      required: [hub_id, ssh, config, port, peers, prune_argv, peer_keys]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: files
  steps:
  - name: Keep the key in a file
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: '${{ ("wireguard-hub-key-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
      methodName: apply
      globalArgs:
        nodeHost: '${{ inputs.intent.ssh.target.host }}'
        nodeUser: '${{ inputs.intent.ssh.target.user }}'
        nodePort: '${{ inputs.intent.ssh.target.port }}'
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}'
        become: true
        # Once per hub: the running key moves to the file the hub file's PostUp reads; it never leaves the Node.
        command: umask 077 && wg show orbit private-key > /etc/wireguard/orbit.key
        notIf: test -s /etc/wireguard/orbit.key
      inputs: {}
  - name: Write the hub config
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Keep the key in a file, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("wireguard-hub-config-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
      methodName: apply
      globalArgs:
        nodeHost: '${{ inputs.intent.ssh.target.host }}'
        nodeUser: '${{ inputs.intent.ssh.target.user }}'
        nodePort: '${{ inputs.intent.ssh.target.port }}'
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}'
        become: true
        path: /etc/wireguard/orbit.conf
        ensure: present
        content: '${{ inputs.intent.config }}'
        owner: root
        group: root
        mode: '0600'
      inputs: {}
  - name: Write the peer files
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Keep the key in a file, condition: {type: succeeded}}]
    forEach: {item: peer, in: '${{ inputs.intent.peers }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("wireguard-hub-peer-" + string(inputs.intent.hub_id) + "-" + string(self.peer.node_id)).split(".").join("-") }}'
      methodName: apply
      globalArgs:
        nodeHost: '${{ inputs.intent.ssh.target.host }}'
        nodeUser: '${{ inputs.intent.ssh.target.user }}'
        nodePort: '${{ inputs.intent.ssh.target.port }}'
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}'
        become: true
        path: '${{ self.peer.file }}'
        ensure: present
        content: '${{ self.peer.content }}'
        owner: root
        group: root
        mode: '0600'
      inputs: {}
  - name: Remove stale peer files
    labels: {role: swamp}
    writes: true
    # Not after the peer files: a removal writes none, a forEach over no peer leaves no step to wait for, and a step that waits for a missing step is skipped.
    # The prune keeps every file a rewrite writes, so it needs no order with the writes.
    dependsOn: [{step: Write the hub config, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("wireguard-hub-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("wireguard-hub-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
        hosts: [{name: hub, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]
      # Only node:remove runs this workflow: it deletes its own Node's file and no other, so a Node that joins meanwhile keeps its peer.
      inputs: {hosts: 'name:hub', sudo: true, argv: '${{ inputs.intent.prune_argv }}'}
- name: apply
  dependsOn: [{job: files, condition: {type: succeeded}}]
  steps:
  - name: Apply the peers
    labels: {role: swamp}
    writes: true
    task: &ssh
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("wireguard-hub-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("wireguard-hub-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
        hosts: [{name: hub, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]
      # The Node composes the full syncconf input at apply time: its own key file, the port, then every peer file.
      # syncconf drops the interface key when its input has none, and the key never leaves the Node.
      inputs:
        hosts: 'name:hub'
        sudo: true
        argv: [timeout, '30', bash, -c, 'wg syncconf orbit <(printf "[Interface]\nPrivateKey = %s\nListenPort = %s\n\n" "$(cat "$1")" "$2"; cat /etc/wireguard/orbit-peers.d/*.conf)', bash, /etc/wireguard/orbit.key, '${{ string(inputs.intent.port) }}']
- name: check
  dependsOn: [{job: apply, condition: {type: succeeded}}]
  steps:
  - name: Check the hub service
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("wireguard-hub-service-" + string(inputs.intent.hub_id)).split(".").join("-") }}'
      methodName: check
      globalArgs:
        nodeHost: '${{ inputs.intent.ssh.target.host }}'
        nodeUser: '${{ inputs.intent.ssh.target.user }}'
        nodePort: '${{ inputs.intent.ssh.target.port }}'
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}'
        become: true
        service: wg-quick@orbit
        ensure: running
        enabled: true
      inputs: {}
  - name: Read the peers again
    labels: {role: swamp}
    task:
      <<: *ssh
      inputs: {hosts: 'name:hub', sudo: true, argv: [timeout, '15', wg, show, orbit, peers]}
  - name: Confirm the hub
    labels: {role: swamp}
    dependsOn: [{step: Check the hub service, condition: {type: succeeded}}, {step: Read the peers again, condition: {type: succeeded}}]
    task:
      type: assert
      severity: high
      message: The hub does not run every admitted peer.
      expr: >-
        data.latest(("wireguard-hub-service-" + string(inputs.intent.hub_id)).split(".").join("-"), inputs.intent.ssh.target.host).attributes.status == "compliant"
        && inputs.intent.peer_keys.all(k, k in steps["Read the peers again"].outputs.stdout.split("\n"))
