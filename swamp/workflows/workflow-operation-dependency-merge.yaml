id: 92c89a8c-6487-42f5-a70e-d67be3921b28
name: operation-dependency-merge
description: Squash one admitted dependency batch on the admitted Swamp configuration Node.
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [tasks.dependency_merge] }
  required: [operation_id, node_id, kind]
vaults: []
jobs:
  - name: squash
    labels: {node: '${{ string(inputs.node_id) }}'}
    steps:
      - name: squash
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-dependency-merge"
          behaviorName: operation-dependency-merge
          methodName: execute
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
