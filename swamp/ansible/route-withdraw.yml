---
# One Node's part of a Route withdrawal (instance.destroy): one tagged part, `apply`. Swamp validated the captured states and
# wrote the merge plan, `plan.json`, into the run folder. On the Node, orbit_route_withdraw reads, merges, checks, keeps the
# previous generation, tests and applies under the Node lock (docs/reference/routes.md#coordinate-publication). The intent (the
# connection) and the plan are read by a file lookup so that text with `{{` reaches the Node unchanged.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.node }}"
    address_identity: "{{ intent.node.identity_file }}"
    address_group: route_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Apply the withdrawal on the Node
  hosts: route_node
  become: true
  gather_facts: false
  tags: [apply]
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    plan: "{{ lookup('ansible.builtin.file', run ~ '/plan.json') | from_json }}"
  tasks:
    - name: Withdraw
      block:
        # Pools, Caddyfile and private DNS files in one Node-local transaction: the other Routes' sections stay byte for byte, the
        # previous generation stays in /var/lib/orbit/route-previous, and a failed reload puts it back.
        - name: Withdraw the Route from the shared files
          orbit_route_withdraw:
            plan: "{{ plan }}"
        # The scopes no site names any more: the Caddy folder, and the account copy under the account's home.
        - name: Read the accounts of the withdrawn scopes
          ansible.builtin.command:
            argv: [timeout, "10", getent, passwd, "{{ item }}"]
          register: cleanup_accounts
          loop: "{{ plan.cleanup | map(attribute='user') | unique | list }}"
          changed_when: false
          check_mode: false
        # One command for every folder: each remote task costs about 0.4 s. The scope names are validated by the composition.
        - name: Remove the certificate folders
          ansible.builtin.command:
            argv: "{{ ['rm', '-rf', '--'] + caddy_folders + account_folders }}"
          vars:
            scopes: "{{ plan.cleanup | map(attribute='scope') | list }}"
            passwd: "{{ cleanup_accounts.results | default([]) | items2dict(key_name='item', value_name='stdout') }}"
            homes: "{{ plan.cleanup | map(attribute='user') | map('extract', passwd) | map('regex_replace', '^(?:[^:]*:){5}([^:]*):.*$', '\\1') | list }}"
            caddy_folders: "{{ scopes | map('regex_replace', '^', '/etc/caddy/orbit-certificates/') | list }}"
            account_folders: "{{ homes | zip(scopes) | map('join', '/.orbit/certificates/') | list }}"
          changed_when: true
          when: plan.cleanup | length > 0
      rescue:
        # Swamp keeps no stderr of a failed command step, so the refusal of the Node transaction (its WithdrawFailure code and message)
        # goes to failure.json, which the node workflow's `failure` step prints and the withdrawal's result carries to the Gateway.
        - name: Write the withdrawal refusal
          ansible.builtin.copy:
            content: >-
              {{ {'error_code': ansible_failed_result.error_code
                   if ansible_failed_result.error_code | default('') is match('^[a-z_]+\.[a-z0-9_]+$') else 'route.withdraw_failed',
                  'detail': ((ansible_failed_task.name | default('A withdrawal task')) ~ ': '
                             ~ (ansible_failed_result.msg | default('The task failed.') | string | trim))[:1800]} | to_json }}
            dest: "{{ run }}/failure.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          check_mode: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Fail with the refusal
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The withdrawal failed.') }}"
      always:
        # After a refusal the node workflow reads failure.json first; its cleanup step removes the folder then.
        - name: Remove the run folder
          when: ansible_failed_task is not defined
          ansible.builtin.file:
            path: "{{ run }}"
            state: absent
          delegate_to: localhost
          become: false
          check_mode: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
