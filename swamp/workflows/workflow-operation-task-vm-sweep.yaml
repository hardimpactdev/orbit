id: aa946b88-1dfe-4010-a85d-bd9ddfe9110a
name: operation-task-vm-sweep
description: Sweep one host's admitted ownership scope from 209 over pinned official SSH or UpCloud HTTPS; only the admitted provider's steps run.
# Only the admitted provider's steps run: a guard skips the other provider's first step and its dependents.
# The whole workflow is evaluated at run start, so an expression that only one provider's intent fills reads it optionally.
queueTimeout: 60
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [task_vm.sweep_host]}
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        provider:
          type: string
          enum:
          - incus
          - upcloud
        ci_runner:
          type: boolean
        stray_vm_ids: &id002
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 4096
        image_cutoff:
          type: integer
        running_stamps:
          type: array
          items:
            type: string
        scope:
          type: object
          properties:
            live_names:
              type: array
              items: &id001
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,253}$
              maxItems: 4096
            max_task_vm_id:
              type: integer
              minimum: 0
            project: *id001
            pool: *id001
            operator_owned:
              type: array
              items:
                type: string
              maxItems: 4096
            max_build_id:
              type: integer
              minimum: 0
            recorded_build_ids: *id002
            retired_build_ids: *id002
            protected_build_ids: *id002
          required:
          - live_names
          - max_task_vm_id
          additionalProperties: false
        ssh_execution:
          type: object
      required:
      - node_id
      - provider
      - ci_runner
      - stray_vm_ids
      - image_cutoff
      - running_stamps
      - scope
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: inventory
  steps:
  - name: Read the inventory
    labels: {role: swamp}
    guard: ${{ inputs.intent.provider == "upcloud" }}
    forEach:
      item: read
      in: '${{ ["instances", "volumes", "images"] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-read-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-sweep-read-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: &transport
          kind: ssh
          user: ${{ inputs.intent.?ssh_execution.?target.?user.orValue("") }}
          port: ${{ inputs.intent.?ssh_execution.?target.?port.orValue(22) }}
          identityFile: ${{ inputs.intent.?ssh_execution.?identity_file.orValue("") }}
        hosts: &hosts
        - name: target
          address: ${{ inputs.intent.?ssh_execution.?target.?host.orValue("") }}
          transport:
            hostKeys: ${{ inputs.intent.?ssh_execution.?target.?host_keys.orValue([]) }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - '${{ {"instances": "/1.0/instances?all-projects=true", "volumes": "/1.0/storage-pools/" + inputs.intent.scope.pool + "/volumes/custom?all-projects=true", "images": "/1.0/images?project=" + inputs.intent.scope.project}[self.read] }}'
  - name: Plan the removals
    labels: {role: swamp}
    dependsOn:
    - step: Read the inventory
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: '${{ "task-vm-sweep-plan" }}'
      methodName: incus_plan
      inputs:
        intent: ${{ inputs.intent }}
        instances: ${{ steps["Read the inventory-instances"].outputs.stdout }}
        volumes: ${{ steps["Read the inventory-volumes"].outputs.stdout }}
        images: ${{ steps["Read the inventory-images"].outputs.stdout }}
  - name: List servers, templates
    labels: {role: swamp}
    guard: ${{ inputs.intent.provider != "upcloud" }}
    task: &cloud_inventory
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-read" }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          upcloud() {
            curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
              --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
              --header 'Accept: application/json' "https://api.upcloud.com/1.3/$1"
          }
          vms=$(upcloud 'server?label=orbit-task-vm')
          images=$(upcloud 'server?label=orbit-task-image')
          templates=$(upcloud storage/template)
          printf '{"vms":%s,"images":%s,"templates":%s}\n' "$vms" "$images" "$templates"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: Plan the cloud removals
    labels: {role: swamp}
    dependsOn:
    - step: List servers, templates
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: '${{ "task-vm-sweep-plan" }}'
      methodName: cloud_plan
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps["List servers, templates"].outputs.stdout }}
- name: first
  dependsOn:
  - job: inventory
    condition: {type: succeeded}
  steps:
  - name: Remove orphaned VMs
    labels: {role: swamp}
    writes: true
    forEach:
      item: instance
      in: ${{ steps[?"Plan the removals"].?outputs.?instances.orValue([]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs: &remove_args
        name: ${{ "task-vm-sweep-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '180', incus, delete, --force, --project, '${{ inputs.intent.scope.?project.orValue("") }}', --, '${{ self.instance }}']
  - name: Stop started servers
    labels: {role: swamp}
    writes: true
    forEach:
      item: server
      in: ${{ steps[?"Plan the cloud removals"].?outputs.?stops.orValue([]) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-stop-" + string(self._index) }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request POST --header 'Content-Type: application/json' --data '{"stop_server":{"stop_type":"hard"}}' \
            "https://api.upcloud.com/1.3/server/$ORBIT_UUID/stop"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ self.server.uuid }}
- name: second
  dependsOn:
  - job: first
    condition: {type: succeeded}
  steps:
  - name: Remove orphaned volumes
    labels: {role: swamp}
    writes: true
    forEach:
      item: volume
      in: ${{ steps[?"Plan the removals"].?outputs.?volumes.orValue([]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs: *remove_args
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '180', incus, storage, volume, delete, --project, '${{ inputs.intent.scope.?project.orValue("") }}', --, '${{ inputs.intent.scope.?pool.orValue("") }}', '${{ self.volume }}']
  - name: Delete servers, templates
    labels: {role: swamp}
    writes: true
    forEach:
      item: resource
      in: ${{ steps[?"Plan the cloud removals"].?outputs.?deletes.orValue([]) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-delete-" + string(self._index) }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request DELETE "https://api.upcloud.com/1.3/$ORBIT_PATH"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_PATH: ${{ self.resource.path }}
- name: check
  dependsOn:
  - job: second
    condition: {type: succeeded}
  steps:
  - name: Read the project again
    labels: {role: swamp}
    guard: ${{ inputs.intent.provider == "upcloud" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', incus, query, '${{ "/1.0/instances?project=" + inputs.intent.scope.?project.orValue("") }}']
  - name: Check the VMs are gone
    labels: {role: swamp}
    dependsOn:
    - step: Read the project again
      condition: {type: succeeded}
    task:
      type: assert
      # `incus query` lists `/1.0/instances/<name>?project=<p>`; names hold no character it encodes.
      expr: 'steps["Plan the removals"].outputs.instances.all(n, !steps["Read the project again"].outputs.stdout.contains("/1.0/instances/" + n + "?") && !steps["Read the project again"].outputs.stdout.contains("/1.0/instances/" + n + "\""))'
      severity: high
      message: task_vm.host_command_failed
  - name: List again
    labels: {role: swamp}
    guard: ${{ inputs.intent.provider != "upcloud" }}
    task: *cloud_inventory
  - name: Check the cloud removals
    labels: {role: swamp}
    dependsOn:
    - step: List again
      condition: {type: succeeded}
    task:
      type: assert
      expr: 'steps["Plan the cloud removals"].outputs.deletes.all(r, !steps["List again"].outputs.stdout.contains(r.uuid))'
      severity: high
      message: task_vm.host_command_failed
