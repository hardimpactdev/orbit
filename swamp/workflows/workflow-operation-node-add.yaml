id: 22e84308-c7ae-4c33-90c6-32dfeb970870
name: operation-node-add
description: Enroll a Node through official resources, public host observations and frozen role plans.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [node.add]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key:
            type: string
            pattern: ^(bootstrap-identity-node-[1-9][0-9]*|agent-secret-node-[1-9][0-9]*|node-role-operation-[1-9][0-9]*-[a-z-]+|process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: phase_0
  labels:
    role: swamp
  steps:
  - name: Read the host key
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-host-key-"+string(inputs.node_id) }}', methodName: collect-host-public-key, globalArgs: {name: '${{
          "node-add-bootstrap-"+string(inputs.node_id) }}', transport: {kind: ssh, hostKeyPolicy: insecure, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port }}', identityContent: '${{
            vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host }}'}]}, inputs: {
        hosts: 'name:target', timeoutSec: 30}}
- name: phase_1
  labels:
    role: swamp
  steps:
  - name: Require approved host key
    labels:
      role: swamp
    task: {type: assert, expr: 'steps["Read the host key"].outputs.fingerprint == inputs.intent.bootstrap.fingerprint', severity: high, message: The observed host key must match the
        approved fingerprint.}
  dependsOn:
  - {job: phase_0, condition: {type: succeeded}}
- name: phase_2
  labels:
    role: swamp
  steps:
  - name: Read the platform
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-platform-"+string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "node-add-platform-"+string(inputs.node_id)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key)
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {
        hosts: 'name:target', argv: [uname, -sm], sudo: false, timeoutSec: 30}}
  dependsOn:
  - {job: phase_1, condition: {type: succeeded}}
- name: bootstrap_account
  labels:
    role: swamp
  steps:
  - name: Read the bootstrap account
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-bootstrap-account-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-bootstrap-account-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: '${{ ["getent","passwd",inputs.intent.bootstrap.user]
          }}', sudo: false, timeoutSec: 30}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_2, condition: {type: succeeded}}
- name: phase_3
  labels:
    role: swamp
  steps:
  - name: Bind the Node identity
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@nckrtl/node-enrollment-plan', behaviorName: '${{ "node-add-resources-"+string(inputs.node_id) }}', methodName: bind, inputs: {platform: '${{
          inputs.intent.platform }}', expected_architecture: '${{ inputs.intent.expected_architecture }}', observation: '${{ steps["Read the platform"].outputs }}', host_key: '${{ steps["Read
          the host key"].outputs }}', roles: '${{ inputs.intent.roles }}', cli: '${{ inputs.intent.cli }}', bootstrap_user: '${{ inputs.intent.bootstrap.user }}', bootstrap_account: '${{
          inputs.intent.platform == "linux" ? steps["Read the bootstrap account-0"].outputs : null }}', dns: '${{ inputs.intent.dns }}', private_dns: '${{ inputs.intent.private_dns }}'}}
  dependsOn:
  - {job: bootstrap_account, condition: {type: succeeded}}
- name: phase_4
  labels:
    role: swamp
  steps:
  - name: Read bootstrap keys
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-bootstrap-keys-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-bootstrap-keys-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: '${{ ["grep","-qxF",inputs.intent.identity.public_key,steps["Bind
          the Node identity"].outputs.bootstrap_authorized_keys] }}', sudo: false, timeoutSec: 30, okExitCodes: [0, 1]}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_3, condition: {type: succeeded}}
- name: phase_5
  labels:
    role: swamp
  steps:
  - name: Authorize the control key
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-authorize-control-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-authorize-control-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: '${{ ["timeout","20","tee","-a",steps["Bind
          the Node identity"].outputs.bootstrap_authorized_keys] }}', sudo: false, timeoutSec: 65, stdin: '${{ inputs.intent.identity.public_key+"\n" }}'}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
    # A true guard skips an already authorized key; grep exit 1 must append it.
    guard: ${{ steps["Read bootstrap keys-0"].outputs.exitCode == 0 }}
  dependsOn:
  - {job: phase_4, condition: {type: succeeded}}
- name: known_hosts_remove
  labels:
    role: swamp
  steps:
  - name: Remove an old host pin
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-control-pins-209"+"-"+string(self._index) }}', methodName: exec, globalArgs: {name: '${{ "node-add-control-pins-209"+"-"+string(self._index)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.control_ssh.target.user }}', port: '${{ inputs.intent.control_ssh.target.port }}', identityFile: '${{ inputs.intent.control_ssh.identity_file
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.control_ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.control_ssh.target.host_keys }}'}}]}, inputs: {
        hosts: 'name:target', argv: '${{ ["timeout","20","ssh-keygen","-R",self.host,"-f",inputs.intent.known_hosts_path] }}', sudo: false, timeoutSec: 65}}
    writes: true
    forEach:
      item: host
      in: '${{ inputs.intent.platform == "linux" ? [(inputs.intent.bootstrap.port == 22 ? inputs.intent.bootstrap.host : "["+inputs.intent.bootstrap.host+"]:"+string(inputs.intent.bootstrap.port)),
        inputs.intent.address] : [] }}'
    concurrency: 1
  dependsOn:
  - {job: phase_5, condition: {type: succeeded}}
- name: known_hosts_add
  labels:
    role: swamp
  steps:
  - name: Pin the bootstrap host
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-control-pins-209"+"-"+string(self._index) }}', methodName: exec, globalArgs: {name: '${{ "node-add-control-pins-209"+"-"+string(self._index)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.control_ssh.target.user }}', port: '${{ inputs.intent.control_ssh.target.port }}', identityFile: '${{ inputs.intent.control_ssh.identity_file
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.control_ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.control_ssh.target.host_keys }}'}}]}, inputs: {
        hosts: 'name:target', argv: '${{ ["timeout","20","tee","-a",inputs.intent.known_hosts_path] }}', sudo: false, timeoutSec: 65, stdin: '${{ (inputs.intent.bootstrap.port == 22
          ? inputs.intent.bootstrap.host : "["+inputs.intent.bootstrap.host+"]:"+string(inputs.intent.bootstrap.port))+" "+steps["Read the host key"].outputs.publicKey+"\n"+inputs.intent.address+"
          "+steps["Read the host key"].outputs.publicKey+"\n" }}'}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: known_hosts_remove, condition: {type: succeeded}}
- name: phase_6
  labels:
    role: swamp
  steps:
  - name: Refresh base packages
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/apt', behaviorName: '${{ "node-add-base-refresh-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: refresh, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}'}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: known_hosts_add, condition: {type: succeeded}}
- name: phase_7
  labels:
    role: swamp
  steps:
  - name: Install base packages
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/apt', behaviorName: '${{ "node-add-base-packages-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', packages: '${{ inputs.intent.packages }}', ensure: present}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_6, condition: {type: succeeded}}
- name: phase_8
  labels:
    role: swamp
  steps:
  - name: Create the managed account
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/user', behaviorName: '${{ "node-add-account-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', username: '${{ inputs.intent.managed_user }}', shell: /bin/bash, managehome: true, ensure: present}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_7, condition: {type: succeeded}}
- name: phase_9
  labels:
    role: swamp
  steps:
  - name: Stage the sudo rule
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "node-add-sudo-candidate-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', path: '${{ inputs.intent.sudo.candidate }}', content: '${{ inputs.intent.sudo.content }}', owner: root, group: root,
        mode: '0440', ensure: present}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_8, condition: {type: succeeded}}
- name: phase_10
  labels:
    role: swamp
  steps:
  - name: Validate the sudo rule
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-sudo-validate-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-sudo-validate-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: '${{ ["timeout","30","visudo","-cf",inputs.intent.sudo.candidate]
          }}', sudo: true, timeoutSec: 30}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_9, condition: {type: succeeded}}
- name: phase_11
  labels:
    role: swamp
  steps:
  - name: Publish the sudo rule
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "node-add-sudo-rule-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', path: '${{ inputs.intent.sudo.path }}', content: '${{ inputs.intent.sudo.content }}', owner: root, group: root,
        mode: '0440', ensure: present}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_10, condition: {type: succeeded}}
- name: phase_12
  labels:
    role: swamp
  steps:
  - name: Write the Orbit keys
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/authorized_key', behaviorName: '${{ "node-add-access-key-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{
          inputs.intent.identity.identity_file }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', user: '${{ inputs.intent.managed_user }}', key: '${{ self.key }}', ensure: present},
      inputs: {}}
    writes: true
    forEach:
      item: key
      in: '${{ inputs.intent.platform == "linux" ? inputs.intent.authorized_keys : [] }}'
  dependsOn:
  - {job: phase_11, condition: {type: succeeded}}
- name: phase_13
  labels:
    role: swamp
  steps:
  - name: Open public recovery SSH
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-public-recovery-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-public-recovery-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: '${{ inputs.intent.public_ssh_argv }}', sudo: true,
        timeoutSec: 65}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_12, condition: {type: succeeded}}
- name: phase_14
  labels:
    role: swamp
  steps:
  - name: Enable the firewall
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-firewall-enable-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-firewall-enable-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: [timeout, '60', ufw, --force, enable], sudo: true,
        timeoutSec: 65}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_13, condition: {type: succeeded}}
- name: phase_15
  labels:
    role: swamp
  steps:
  - name: Install the Node agent
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/fetch', behaviorName: '${{ "node-add-agent-binary-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', url: '${{ inputs.intent.agent.url }}', path: /usr/local/bin/orbit-agent, checksum: '${{ "sha256:"+inputs.intent.agent.sha256
          }}', owner: root, group: root, mode: '0755'}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_14, condition: {type: succeeded}}
- name: phase_16
  labels:
    role: swamp
  steps:
  - name: Create WireGuard folder
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/directory', behaviorName: '${{ "node-add-wireguard-folder-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{
          inputs.intent.identity.identity_file }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', path: /etc/wireguard, owner: root, group: root, mode: '0700', ensure: present},
      inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_15, condition: {type: succeeded}}
- name: phase_17
  labels:
    role: swamp
  steps:
  - name: Prepare the WireGuard key
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/exec', behaviorName: '${{ "node-add-wireguard-key-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', command: umask 077; wg genkey > /etc/wireguard/orbit.key, notIf: test -s /etc/wireguard/orbit.key}, inputs: {}}
    writes: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_16, condition: {type: succeeded}}
- name: phase_18
  labels:
    role: swamp
  steps:
  - name: Read WireGuard public key
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/debug_exec', behaviorName: '${{ "node-add-wireguard-public-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: run,
      globalArgs: {nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{
          inputs.intent.identity.identity_file }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', command: wg pubkey < /etc/wireguard/orbit.key}, inputs: {}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_17, condition: {type: succeeded}}
- name: tunnel_key_check
  labels:
    role: swamp
  dependsOn:
  - {job: phase_18, condition: {type: succeeded}}
  steps:
  - name: Require unique tunnel key
    labels:
      role: swamp
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
    task: {type: assert, expr: 'steps["Read WireGuard public key-0"].outputs.stdout.trim().matches("^[A-Za-z0-9+/]{43}=$") && !(steps["Read WireGuard public key-0"].outputs.stdout.trim()
        in inputs.intent.network.other_public_keys) && (inputs.intent.network.required_public_key == null || steps["Read WireGuard public key-0"].outputs.stdout.trim() == inputs.intent.network.required_public_key)',
      severity: high, message: 'The tunnel key must belong to this Node, and an existing hub must retain its peer-facing key.'}
- name: phase_19
  labels:
    role: swamp
  steps:
  - name: Write the tunnel files
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "node-add-tunnel-file-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.bootstrap.host }}', nodeUser: '${{ inputs.intent.bootstrap.user }}', nodePort: '${{ inputs.intent.bootstrap.port }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: '${{ inputs.intent.bootstrap.user != "root" }}', path: '${{ self.file.path }}', content: '${{ self.file.content }}', owner: root, group: root, mode: '0600', ensure: present},
      inputs: {}}
    writes: true
    forEach:
      item: file
      in: '${{ inputs.intent.platform == "linux" ? inputs.intent.network.files : [] }}'
  dependsOn:
  - {job: tunnel_key_check, condition: {type: succeeded}}
- name: hub_forwarding
  labels:
    role: swamp
  steps:
  - name: Enable hub forwarding
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/sysctl', behaviorName: '${{ "node-add-hub-forwarding-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply,
