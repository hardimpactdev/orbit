id: 2c8195ba-b28b-4bb1-9c65-abda5b48a477
name: operation-database-user-create
description: Create an admitted SQL login and replace exact database grants using shipped scripts over official SSH from209.
writes: true
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - database_user.create
    intent:
      type: object
      properties:
        driver:
          type: string
          enum:
          - mysql
          - pgsql
        container:
          type: string
        username:
          type: string
        replication:
          type: boolean
        known_user:
          type: boolean
        ssh:
          type: object
        database:
          type: string
        owner_username:
          type: string
        read_only:
          type: boolean
      required:
      - driver
      - container
      - username
      - replication
      - known_user
      - ssh
      - database
      - owner_username
      - read_only
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        user_create:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^database-user-create-intent-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - user_create
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: user
  target: orbit-node-209
  steps:
  - name: assets
    target: orbit-node-209
    writes: false
    task:
      type: behavior
      behaviorType: '@nckrtl/database-server-command-assets'
      behaviorName: ${{ "database-user-assets-" + run.id }}
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
  - name: directory
    target: orbit-node-209
    writes: false
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-" + string(inputs.operation_id) }}
      globalArgs: &id002
        name: ${{ "database-user-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.user }}
          identityFile: /run/credentials/orbit-node-worker.service/proxy-ssh-identity
        hosts:
        - name: server
          address: ${{ inputs.intent.ssh.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh.host_keys }}
      methodName: exec
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/mkdir
        - -p
        - ${{ "/tmp/orbit-database-user-" + string(inputs.operation_id) }}
        okExitCodes:
        - 0
        - 1
  - name: copy
    target: orbit-node-209
    writes: false
    allowFailure: true
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    - step: directory
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-" + string(inputs.operation_id) }}
      globalArgs: *id002
      methodName: copy
      inputs:
        hosts: name:server
        src: ${{ steps.assets.outputs.directory + "/." }}
        dst: ${{ "/tmp/orbit-database-user-" + string(inputs.operation_id) }}
        direction: to
        recursive: true
  - name: prepared
    target: orbit-node-209
    writes: false
    dependsOn:
    - step: copy
      condition:
        type: always
    task:
      type: assert
      expr: steps.directory.outputs.exitCode == 0 && steps.copy.status == "succeeded"
      severity: high
      message: SQL user command files unavailable.
  - name: wal
    target: orbit-node-209
    guard: ${{ !(inputs.intent.driver == "pgsql" && inputs.intent.replication) }}
    writes: false
    allowFailure: true
    dependsOn:
    - step: prepared
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-" + string(inputs.operation_id) }}
      globalArgs: *id002
      methodName: exec
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-user-" + string(inputs.operation_id) + "/user_wal.py" }}
        - ${{ steps.assets.outputs.intent_json }}
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.user_create.vault, inputs.execution_secrets.user_create.key) }}
  - name: wal_checked
    target: orbit-node-209
    writes: false
    dependsOn:
    - step: wal
      condition:
        type: always
    - step: prepared
      condition:
        type: succeeded
    task:
      type: assert
      expr: '!(inputs.intent.driver == "pgsql" && inputs.intent.replication) || (has(steps.wal) && has(steps.wal.outputs)
        && steps.wal.outputs.exitCode == 0)'
      severity: high
      message: Replication user WAL check refused.
  - name: apply
    target: orbit-node-209
    writes: true
    allowFailure: true
    dependsOn:
    - step: wal_checked
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-" + string(inputs.operation_id) }}
      globalArgs: *id002
      methodName: exec
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-user-" + string(inputs.operation_id) + "/user_apply.py" }}
        - ${{ steps.assets.outputs.intent_json }}
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.user_create.vault, inputs.execution_secrets.user_create.key) }}
  - name: grant
    target: orbit-node-209
    writes: true
    allowFailure: true
    dependsOn:
    - step: apply
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-" + string(inputs.operation_id) }}
      globalArgs:
        name: ${{ "database-user-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.user }}
          identityFile: /run/credentials/orbit-node-worker.service/proxy-ssh-identity
        hosts:
        - name: server
          address: ${{ inputs.intent.ssh.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh.host_keys }}
      methodName: exec
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/sudo
        - -n
        - --
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-database-user-" + string(inputs.operation_id) + "/user_grant.py" }}
        - ${{ steps.assets.outputs.intent_json }}
        okExitCodes:
        - 0
        - 1
        stdin: ${{ vault.get(inputs.execution_secrets.user_create.vault, inputs.execution_secrets.user_create.key) }}
    guard: ${{ !has(steps.apply.outputs) || steps.apply.outputs.exitCode != 0 }}
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: assets
      condition:
        type: always
    - step: directory
      condition:
        type: always
    - step: copy
      condition:
        type: always
    - step: prepared
      condition:
        type: always
    - step: wal
      condition:
        type: always
    - step: wal_checked
      condition:
        type: always
    - step: apply
      condition:
        type: always
    - step: grant
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/database-server-command-assets'
      behaviorName: ${{ "database-user-assets-" + run.id }}
      methodName: result
      inputs:
        completed: ${{ has(steps.grant) && has(steps.grant.outputs) && steps.grant.outputs.exitCode == 0 }}
        failure_code: database.user_create_outcome_unknown
        steps: ${{ steps }}
  - name: cleanup
    target: orbit-node-209
    allowFailure: true
    writes: true
    dependsOn:
    - step: result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-" + string(inputs.operation_id) }}
      globalArgs: *id002
      methodName: exec
      inputs:
        hosts: name:server
        argv:
        - /usr/bin/rm
        - -rf
        - --
        - ${{ "/tmp/orbit-database-user-" + string(inputs.operation_id) }}
        okExitCodes:
        - 0
        - 1
    guard: ${{ steps.result.outputs.exitCode != 0 }}
  - name: accept_result
    target: orbit-node-209
    dependsOn:
    - step: result
      condition:
        type: succeeded
    - step: cleanup
      condition:
        type: always
    writes: false
    task:
      type: assert
      expr: steps.result.outputs.exitCode == 0
      severity: high
      message: SQL user creation did not complete.
