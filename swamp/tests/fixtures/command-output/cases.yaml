  ufw-numbered-hub:
    hub_task_vm_rules:
      stdout: "Status: active\n\n     To                         Action      From\n     --                         ------      ----\n[ 1] Anywhere on orbit          ALLOW IN    10.44.0.0/24               # orbit:wireguard-members\n[ 2] 10.44.0.128/25 22/tcp on orbit ALLOW FWD   10.44.0.15 on orbit        # orbit:task-vm-control-ssh\n[ 3] 10.44.0.128/25 80/tcp      ALLOW FWD   10.44.0.7                  # orbit:task-vm-router-web-10-44-0-7-80\n[ 4] 10.252.10.1 53/udp on orbittask0 ALLOW IN    Anywhere                   # orbit:task-vms-dns-udp\n[ 5] 10.44.0.128/25 3774/tcp    ALLOW FWD   10.44.0.15                 # orbit:task-vm-swamp-pi\n[ 6] 10.44.0.128/25 9000/tcp    ALLOW FWD   10.44.0.20\n\n"
  ufw-numbered:
    firewall_numbered: &id001
      stdout: '[ 1] 8318/tcp ALLOW IN 10.0.0.9 # orbit:allow-node-9

        [ 2] 8318/tcp ALLOW IN 10.0.0.0/24 # orbit:allow

        [ 3] 8318/tcp DENY IN Anywhere # orbit:deny

        [ 4] Anywhere ALLOW IN 10.0.0.0/24 # orbit:trust

        '
    rule:
    - ufw
    - insert
    - '1'
    - deny
    - orbit:deny
    firewall_commands: &id002
    - - ufw
      - insert
      - '1'
      - deny
      - orbit:deny
    - - ufw
      - allow
      - orbit:allow
    firewall_index: 0
    intent: &id003
      firewall:
        desired:
        - - ufw
          - allow
          - orbit:trust
    firewall_retire:
    - orbit:allow
    - orbit:deny
  ufw-removed:
    firewall_numbered: *id001
    rule:
    - ufw
    - --force
    - delete
    - allow
    - orbit:allow
    firewall_commands: *id002
    firewall_index: 0
    intent: *id003
    firewall_retire: []
