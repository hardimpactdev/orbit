id: ae3bff71-8b73-4cad-8ef4-e8f206492c43
name: route-certificate-publish
description: Canonical leaf request, parent-bound sign, publish, trust and inspect as native actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    parent_run_id:
      type: string
    restoring:
      type: boolean
    intent:
      type: object
      properties:
        leaf:
          type: object
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - leaf
      - control_node_id
      - connection
      - host_keys
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - parent_run_id
  - restoring
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "route-cert-assets-" + run.id }}
      methodName: read
      inputs:
        node_id: ${{ inputs.intent.leaf.node_id }}
        intent: ${{ inputs.intent.leaf }}
  - name: prepare-assets
    target: orbit-node-209
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-prepare-assets-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/mkdir
        - -p
        - -m
        - '0700'
        - ${{ "/tmp/orbit-route-" + run.id }}
  - name: copy-assets
    target: orbit-node-209
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-copy-assets-" + run.id }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-route-" + run.id + "/" }}
        direction: to
        recursive: true
  - name: request
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-request-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_CERTIFICATE_INPUT=' + string(steps.assets.outputs.input_json) }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/request.py" }}
        sudo: true
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
  - name: request-info
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "route-cert-request-info-" + run.id }}
      methodName: decodeRequest
      inputs:
        leaf: ${{ inputs.intent.leaf }}
        stdout: ${{ steps.request.outputs.stdout }}
    dependsOn:
    - step: request
      condition:
        type: succeeded
  - name: sign
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "certificate-sign-" + run.id }}'
      methodName: execute
      inputs:
        run: '/usr/bin/python3 -B "$ORBIT_CERTIFICATE_SIGN_SCRIPT"'
        env:
          ORBIT_CERTIFICATE_SIGN_SCRIPT: '${{ steps.assets.outputs.scripts_directory + "/sign.py" }}'
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ inputs.parent_run_id }}
          ORBIT_CERTIFICATE_MODE: single
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["request-info"].outputs.request_json }}
          ORBIT_CERTIFICATE_LEAF: ${{ steps.assets.outputs.input_json }}
          ORBIT_CERTIFICATE_RESTORING: ${{ string(inputs.restoring) }}
    dependsOn:
    - step: request-info
      condition:
        type: succeeded
  - name: signature
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "route-cert-signature-" + run.id }}
      methodName: decodeSigned
      inputs:
        leaf: ${{ inputs.intent.leaf }}
        request: ${{ steps["request-info"].outputs.request }}
        stdout: ${{ steps.sign.outputs.stdout }}
    dependsOn:
    - step: sign
      condition:
        type: succeeded
  - name: publish
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-publish-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_CERTIFICATE_INPUT=' + string(steps.assets.outputs.input_json) }}
        - ${{ 'ORBIT_CERTIFICATE_SIGNED=' + string(steps.signature.outputs.signed_json) }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/publish.py" }}
        sudo: true
    dependsOn:
    - step: signature
      condition:
        type: succeeded
  - name: trust
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-trust-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_CERTIFICATE_INPUT=' + string(steps.assets.outputs.input_json) }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/trust.py" }}
        sudo: true
    dependsOn:
    - step: publish
      condition:
        type: succeeded
  - name: inspect
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-inspect-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ 'ORBIT_CERTIFICATE_EXPECT_PRESENT=' + string('true') }}
        - ${{ 'ORBIT_CERTIFICATE_INPUT=' + string(steps.assets.outputs.input_json) }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/inspect.py" }}
        sudo: true
    dependsOn:
    - step: trust
      condition:
        type: succeeded
  - name: cleanup-assets
    target: orbit-node-209
    dependsOn:
    - step: inspect
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-cleanup-assets-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -rf
        - ${{ "/tmp/orbit-route-" + run.id }}
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: ${{ "route-cert-result-" + run.id }}
      methodName: certificateResult
      inputs:
        leaf: ${{ inputs.intent.leaf }}
        stdout: ${{ steps.inspect.outputs.stdout }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: cleanup-assets
      condition:
        type: succeeded
