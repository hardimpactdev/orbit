---
# One call of the power helper as its Instance's unit orbit-instance-power-<id>.service, the Instance's lock
# (docs/reference/prepared-restore.md#the-power-helper). `power_call` is the command and its arguments; `power_call_intent` says
# whether the helper reads the run's intent on stdin: the recorded runtime, and the web port only when the container has a web unit.
# The Operation is the run's ORBIT_OPERATION_ID. A busy lock is only systemd's UnitExists refusal with nothing on stdout: it is tried 40 times in
# all, 0.25 s apart (`retries` counts the tries after the first), then fails `instance.power_helper_busy`. Any other nonzero end is
# a crash: it fails `instance.power_helper_failed` and is never tried again. Each failure leaves the asleep marker as it is.
# `power_called` is the helper's one JSON result.
- name: Call the power helper
  ansible.builtin.command:
    argv: >-
      {{ ['systemd-run', '--unit=orbit-instance-power-' ~ container.instance_id, '--wait', '--pipe', '--collect', '--quiet',
          '/usr/local/libexec/orbit-instance-power'] + power_call }}
    stdin: "{{ (power_intent | to_json) if power_call_intent | default(false) else '' }}"
    stdin_add_newline: false
  register: power_call_run
  until: power_call_run.rc == 0 or power_call_run.stdout != '' or power_busy not in power_call_run.stderr
  retries: 39
  delay: 0.25
  # Every command changes the container's state except a `discard` that found nothing.
  changed_when: power_call_run.rc != 0 or (power_call_run.stdout | from_json).removed | default(true)
  failed_when: false
  vars:
    power_busy: already loaded or has a fragment file
    power_intent:
      schema_version: 1
      instance_id: "{{ container.instance_id | int }}"
      operation_id: "{{ lookup('ansible.builtin.env', 'ORBIT_OPERATION_ID') | int }}"
      incus_project: "{{ container.project }}"
      incus_name: "{{ container.name }}"
      web: "{{ none if container.web_port | default(none) is none else {'address': container.address, 'port': container.web_port | int} }}"

- name: Refuse a call whose lock stayed busy
  when: power_call_run.rc != 0 and power_call_run.stdout == '' and 'already loaded or has a fragment file' in power_call_run.stderr
  ansible.builtin.fail: { msg: instance.power_helper_busy }

- name: Refuse a call that crashed
  when: power_call_run.rc != 0
  ansible.builtin.fail: { msg: instance.power_helper_failed }

- name: Read the helper's result
  ansible.builtin.set_fact:
    power_called: "{{ power_call_run.stdout | from_json }}"
