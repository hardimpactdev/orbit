id: c2c6c4a5-a667-4a81-9f5a-fae18fdf5d4a
name: operation-instance-create
description: Development Instance create from209 through separately placed official SSH actions.
vaults:
  - orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: instance.create
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
              - orbit-control-inputs
          key:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{0,254}$'
        required:
          - vault
          - key
        additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: prepare
    target: orbit-node-209
    steps:
      - name: prepare-admitted
        target: orbit-node-209
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: assert
          expr: 'true'
          severity: high
          message: The Instance is already active.
      - name: create-local-directory
        target: orbit-node-209
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-local-" + run.id }}'
          methodName: execute
          inputs:
            run: umask 077; mkdir -p -- "$ORBIT_DIRECTORY"
            env:
              ORBIT_DIRECTORY: '${{ "/tmp/orbit-instance-" + run.id }}'
        dependsOn:
          - step: prepare-admitted
            condition:
              type: succeeded
      - name: create-mint-assets
        target: orbit-node-209
        dependsOn:
          - step: create-local-directory
            condition:
              type: succeeded
          - step: prepare-admitted
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "idm-create-1-" + run.id }}'
          methodName: paths
          inputs:
            intent: '${{ inputs.intent }}'
      - name: create-mint
        target: orbit-node-209
        dependsOn:
          - step: create-mint-assets
            condition:
              type: succeeded
          - step: prepare-admitted
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-mint-" + run.id }}'
          methodName: execute
          inputs:
            run: python3 -B "$ORBIT_MINT_FILE"
            env:
              ORBIT_MINT_FILE: '${{ steps["create-mint-assets"].outputs.directory + "/mint.py" }}'
              ORBIT_OPERATION_ID: '${{ string(inputs.operation_id) }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_GIT_REFERENCES: '${{ inputs.intent.execution_references_json }}'
      - name: source-worktrees
        target: orbit-node-209
        guard: >-
          ${{ steps.exists(key, steps[key].status == "failed") || (!(inputs.intent.source.seed_repository != null && inputs.intent.resolve.seed_commit != null)
          || (inputs.intent.retained_source != null)) }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-0-" + run.id }}'
          methodName: exec
          globalArgs: &ref_2
            name: '${{ "source-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.ssh_execution.target.host }}'
                transport:
                  hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-C'
              - '${{ inputs.intent.source.seed_repository == null ? inputs.intent.source.checkout : inputs.intent.source.seed_repository }}'
              - worktree
              - list
              - '--porcelain'
        dependsOn:
          - step: create-mint
            condition:
              type: succeeded
          - step: prepare-admitted
            condition:
              type: succeeded
      - name: source-branch-available
        target: orbit-node-209
        dependsOn:
          - step: source-worktrees
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-1-" + run.id }}'
          methodName: branchAvailable
          inputs:
            resolve: '${{ inputs.intent.resolve }}'
            checkout: '${{ inputs.intent.source.checkout }}'
            worktrees: >-
              ${{ inputs.intent.source.seed_repository != null && inputs.intent.resolve.seed_commit != null && !(inputs.intent.retained_source != null) ?
              steps["source-worktrees"].outputs : {"stdout":""} }}
      - name: source-branch-accepted
        target: orbit-node-209
        dependsOn:
          - step: source-branch-available
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: assert
          expr: 'steps["source-branch-available"].outputs.available'
          severity: high
          message: instance.branch_in_use
      - name: source-prepare-assets
        target: orbit-node-209
        dependsOn:
          - step: source-branch-accepted
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-3-" + run.id }}'
          methodName: read
          inputs:
            action: prepare_directory
            input: '${{ inputs.intent }}'
      - name: source-prepare-read
        target: orbit-node-209
        dependsOn:
          - step: source-prepare-assets
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-4-" + run.id }}'
          methodName: script
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["source-prepare-assets"].outputs.script_body }}'
      - name: source-prepared
        target: orbit-node-209
        dependsOn:
          - step: source-prepare-read
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-5-" + run.id }}'
          methodName: decode
          inputs:
            observation: '${{ steps["source-prepare-read"].outputs }}'
      - name: source-init
        target: orbit-node-209
        dependsOn:
          - step: source-prepared
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: >-
          ${{ steps.exists(key, steps[key].status == "failed") || (!steps["source-prepared"].outputs.created || (inputs.intent.source.seed_repository != null &&
          inputs.intent.resolve.seed_commit != null)) }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-6-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.checkout }}'
              - init
              - '--quiet'
      - name: source-worktree
        target: orbit-node-209
        dependsOn:
          - step: source-init
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: >-
          ${{ steps.exists(key, steps[key].status == "failed") || (!steps["source-prepared"].outputs.created || !(inputs.intent.source.seed_repository != null
          && inputs.intent.resolve.seed_commit != null)) }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-7-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-C'
              - '${{ inputs.intent.source.seed_repository == null ? inputs.intent.source.checkout : inputs.intent.source.seed_repository }}'
              - worktree
              - add
              - '--no-checkout'
              - '--detach'
              - '--'
              - '${{ inputs.intent.source.checkout }}'
              - '${{ inputs.intent.resolve.seed_commit == null ? "HEAD" : inputs.intent.resolve.seed_commit }}'
      - name: source-origin-assets
        target: orbit-node-209
        dependsOn:
          - step: source-worktree
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-8-" + run.id }}'
          methodName: read
          inputs:
            action: origin
            input:
              checkout: '${{ inputs.intent.source.checkout }}'
              allow_empty: '${{ steps["source-prepared"].outputs.owned }}'
      - name: source-origin-read
        target: orbit-node-209
        dependsOn:
          - step: source-origin-assets
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-9-" + run.id }}'
          methodName: script
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["source-origin-assets"].outputs.script_body }}'
      - name: source-origin-proof
        target: orbit-node-209
        dependsOn:
          - step: source-origin-read
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-10-" + run.id }}'
          methodName: origin
          inputs:
            expected: '${{ inputs.intent.source.repository }}'
            observation: '${{ steps["source-origin-read"].outputs }}'
            allow_empty: '${{ steps["source-prepared"].outputs.owned }}'
      - name: source-origin-configure
        target: orbit-node-209
        dependsOn:
          - step: source-origin-proof
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") || (steps["source-origin-read"].outputs.stdout != "") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-11-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.checkout }}'
              - config
              - remote.origin.url
              - '${{ inputs.intent.source.repository }}'
      - name: source-git-directory
        target: orbit-node-209
        dependsOn:
          - step: source-origin-configure
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-12-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.checkout }}'
              - rev-parse
              - '--absolute-git-dir'
      - name: source-marker-assets
        target: orbit-node-209
        dependsOn:
          - step: source-git-directory
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-13-" + run.id }}'
          methodName: read
          inputs:
            action: mark_source
            input:
              checkout: '${{ inputs.intent.source.checkout }}'
              prepare_id: '${{ inputs.intent.source.prepare_id }}'
              git_directory: '${{ steps["source-git-directory"].outputs.stdout }}'
      - name: source-marker-read
        target: orbit-node-209
        dependsOn:
          - step: source-marker-assets
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-14-" + run.id }}'
          methodName: script
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["source-marker-assets"].outputs.script_body }}'
      - name: source-paths
        target: orbit-node-209
        dependsOn:
          - step: source-marker-read
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-15-" + run.id }}'
          methodName: paths
          inputs:
            intent: '${{ inputs.intent }}'
      - name: source-scripts-directory
        target: orbit-node-209
        dependsOn:
          - step: source-paths
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-16-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/mkdir
              - '-p'
              - '${{ "/tmp/orbit-source-" + run.id + "-source" }}'
      - name: source-scripts-copy
        target: orbit-node-209
        dependsOn:
          - step: source-scripts-directory
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "source-copy-" + run.id }}'
          methodName: copy
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            src: '${{ steps["source-paths"].outputs.directory }}'
            dst: '${{ "/tmp/orbit-source-" + run.id + "-source/" }}'
            recursive: true
            direction: to
      - name: source-fetch
        target: orbit-node-209
        dependsOn:
          - step: source-scripts-copy
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") || (!inputs.intent.resolve.network || (inputs.intent.retained_source != null)) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-18-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/python3
              - '-B'
              - '${{ "/tmp/orbit-source-" + run.id + "-source/scripts/fetch.py" }}'
              - '${{ inputs.intent.source.checkout }}'
              - '${{ inputs.intent.source.repository }}'
            stdin: '${{ vault.get(inputs.execution_secrets.git_read.vault,inputs.execution_secrets.git_read.key) }}'
      - name: source-refs
        target: orbit-node-209
        dependsOn:
          - step: source-fetch
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-19-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.checkout }}'
              - for-each-ref
              - '--format=%(refname)'
              - refs/heads
              - refs/remotes/origin
      - name: source-selected
        target: orbit-node-209
        dependsOn:
          - step: source-refs
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-20-" + run.id }}'
          methodName: select
          inputs:
            resolve: '${{ inputs.intent.resolve }}'
            refs: '${{ steps["source-refs"].outputs }}'
      - name: source-checkout
        target: orbit-node-209
        dependsOn:
          - step: source-selected
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") || (inputs.intent.retained_source != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-21-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.checkout }}'
              - checkout
              - '--quiet'
              - '--no-track'
              - '-B'
              - '${{ steps["source-selected"].outputs.branch }}'
              - '${{ steps["source-selected"].outputs.reference }}'
      - name: source-commit
        target: orbit-node-209
        dependsOn:
          - step: source-checkout
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-22-" + run.id }}'
          methodName: exec
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.checkout }}'
              - rev-parse
              - '--verify'
              - 'HEAD^{commit}'
      - name: source-profile-assets
        target: orbit-node-209
        dependsOn:
          - step: source-commit
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-23-" + run.id }}'
          methodName: read
          inputs:
            action: profile
            input: '${{ inputs.intent }}'
      - name: source-profile-read
        target: orbit-node-209
        dependsOn:
          - step: source-profile-assets
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "src-24-" + run.id }}'
          methodName: script
          globalArgs: *ref_2
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["source-profile-assets"].outputs.script_body }}'
      - name: source-result
        target: orbit-node-209
        dependsOn:
          - step: source-profile-read
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: prepare-admitted
            condition:
              type: succeeded
        guard: '${{ steps.exists(key, steps[key].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "src-25-" + run.id }}'
          methodName: provisioningResult
          inputs:
            intent: '${{ inputs.intent }}'
            profile: '${{ steps["source-profile-read"].outputs }}'
            branch: '${{ steps["source-selected"].outputs.branch }}'
            commit: '${{ steps["source-commit"].outputs }}'
      - name: env-template-asset
        target: orbit-node-209
        dependsOn:
          - step: source-result
            condition:
              type: succeeded
          - step: prepare-admitted
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-env-0-" + run.id }}'
          methodName: read
          inputs:
            action: template
            input:
              application: '${{ inputs.intent.application }}'
              destination: '${{ "/tmp/orbit-instance-" + run.id + "/template" }}'
      - name: env-template
        target: orbit-node-209
        dependsOn:
          - step: env-template-asset
            condition:
              type: succeeded
          - step: prepare-admitted
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-env-1-" + run.id }}'
          methodName: script
          globalArgs: &ref_3
            name: '${{ "id-env-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.ssh_execution.target.host }}'
                transport:
                  hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["env-template-asset"].outputs.script_body }}'
      - name: env-copy
