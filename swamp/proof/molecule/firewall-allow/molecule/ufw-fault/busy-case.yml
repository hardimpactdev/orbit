---
# busy-target, for its own host (`d` is its definition, cases.yml). The runner's `busy_node` step and its act:
#   1. the shim goes in place and a lock holder starts: a process in its own process group takes `flock -x` on shim_dir/stall and sleeps,
#      and the shim makes every ufw write wait on that lock
#   2. a real firewall:allow of a spare port starts in the background (async, poll 0); it waits behind the lock with its Operation admitted
#   3. the Gateway has admitted it when its Operation exists (the runner waits for the first line of the CLI, which comes after admission)
#   4. the second firewall:allow must be refused with operation.target_busy, without a new Operation, and UFW and the records must not change
#   5. always, even after a failed check: the lock ends, the held write finishes and its Operation ends, so that no Operation runs on
#      when the case is over (steps.py cleanup). converge.yml then puts the real ufw back.
- name: "{{ inventory_hostname }}: the case"
  block:
    - name: "{{ inventory_hostname }}: the shim goes in place"
      ansible.builtin.include_tasks: shim-install.yml

    - name: "{{ inventory_hostname }}: the Operations before the held write"
      ansible.builtin.include_tasks: snapshot.yml
      vars: {snap: h0}

    - name: "{{ inventory_hostname }}: hold the lock (the holder leads its own process group; its pid is kept for the release)"
      ansible.builtin.shell: |
        touch {{ shim_dir }}/stall
        setsid nohup flock -x {{ shim_dir }}/stall sleep {{ busy_seconds }} >/dev/null 2>&1 </dev/null &
        echo $! > {{ shim_dir }}/holder.pid
      delegate_to: "{{ tcontainer }}"
      changed_when: true

    - name: "{{ inventory_hostname }}: start the held write in the background"
      ansible.builtin.command:
        argv: "{{ orbit + d.hold + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      async: "{{ busy_seconds | int + 60 }}"
      poll: 0
      register: held_job
      changed_when: false

    - name: "{{ inventory_hostname }}: wait until the Gateway admitted the held write (its Operation exists)"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: admitted
      until: (admitted.json.data | default([]) | map(attribute='id') | list | difference(snaps.h0.ops)) | length > 0
      retries: 30
      delay: "{{ poll_delay | int }}"

    # The task vars have their own names: a set_fact of converge.yml (held_id: '') would outrank task vars of the same name.
    - name: "{{ inventory_hostname }}: keep the id of the held Operation"
      vars:
        new_id: "{{ admitted.json.data | map(attribute='id') | list | difference(snaps.h0.ops) | first }}"
      ansible.builtin.set_fact:
        held_id: "{{ new_id }}"
        cacheable: true

    # An Operation that is still queued may not hold the Node yet: the snapshots and the second write wait until it runs.
    - name: "{{ inventory_hostname }}: wait until the held Operation runs, so it holds the Node"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: running
      until: >-
        (running.json | default({})).data | default([]) | selectattr('id', 'in', [held_id | int, held_id | string])
        | map(attribute='status') | first | default('?') == 'running'
      retries: 30
      delay: "{{ poll_delay | int }}"

    - name: "{{ inventory_hostname }}: snapshot before the second write"
      ansible.builtin.include_tasks: snapshot.yml
      vars: {snap: s0}

    # No retry: the runner expects the refusal on the first try (the other scenario's CLI calls ask again while the Node is busy).
    - name: "{{ inventory_hostname }}: the second write, while the first holds the Node"
      ansible.builtin.command:
        argv: "{{ orbit + d.argv + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      register: ran
      failed_when: false
      changed_when: false

    - name: "{{ inventory_hostname }}: read the answer"
      ansible.builtin.set_fact:
        answer: "{{ (ran.stdout | from_json) if (ran.stdout is search('^\\s*[{\\[]')) else {} }}"
        cmd_secs: "{{ (cmd_secs | default(0) | float) + ((ran.end | to_datetime('%Y-%m-%d %H:%M:%S.%f')) - (ran.start | to_datetime('%Y-%m-%d %H:%M:%S.%f'))).total_seconds() }}"
        cacheable: true

    - name: "{{ inventory_hostname }}: the second write is refused as busy"
      vars:
        code: "{{ answer.error_code | default(answer.error.code | default('')) }}"
      ansible.builtin.assert:
        that:
          - ran.rc == 1
          - code == 'operation.target_busy'
        fail_msg: "exit {{ ran.rc }}, code {{ code }}; expected exit 1 and operation.target_busy"
        quiet: true

    - name: "{{ inventory_hostname }}: snapshot after the second write (the lock is still held)"
      ansible.builtin.include_tasks: snapshot.yml
      vars: {snap: s1}
  always:
    - name: "{{ inventory_hostname }}: release the lock, the held write goes on"
      ansible.builtin.shell: kill -- -$(cat {{ shim_dir }}/holder.pid)
      delegate_to: "{{ tcontainer }}"
      changed_when: false
      failed_when: false

    - name: "{{ inventory_hostname }}: wait for the CLI of the held write to end"
      ansible.builtin.async_status:
        jid: "{{ held_job.ansible_job_id }}"
      register: held_done
      until: held_done.finished
      retries: 30
      delay: "{{ poll_delay | int }}"
      failed_when: false
      when: held_job.ansible_job_id is defined

    - name: "{{ inventory_hostname }}: wait for the held Operation to end"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations/{{ held_id }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: held_receipt
      until: ((held_receipt.json | default({})).data | default(held_receipt.json | default({}))).status | default('') in ['succeeded', 'failed', 'cancelled']
      retries: 30
      delay: 2
      failed_when: false
      when: held_id | default('') != ''

    - name: "{{ inventory_hostname }}: keep how the held write ended"
      ansible.builtin.set_fact:
        held_end: "{{ (((held_receipt.json | default({})).data | default(held_receipt.json | default({}))).status | default('unknown')) }}"
        cacheable: true
