name: Orbit Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hardimpactdev/orbit-gateway

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, sqlite3, curl, openssl, mbstring, tokenizer, ctype, filter, fileinfo, phar, zlib
          tools: composer

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME:-}}"
          version="${tag#v}"
          canonical_version="$(bin/orbit-version)"

          if [ "$tag" = "$version" ]; then
            echo "Release tag must start with v, got [$tag]." >&2
            exit 1
          fi

          if [ "$version" != "$canonical_version" ]; then
            echo "Release tag [$tag] does not match VERSION [$canonical_version]." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Download prebuilt release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/orbit-release-assets"
          mkdir -p "$asset_dir"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern orbit-linux-x64 \
            --pattern orbit-macos-arm64 \
            --pattern orbit-release-manifest.json \
            --dir "$asset_dir"

          test -s "$asset_dir/orbit-linux-x64"
          test -s "$asset_dir/orbit-macos-arm64"
          test -s "$asset_dir/orbit-release-manifest.json"

          echo "dir=${asset_dir}" >> "$GITHUB_OUTPUT"

      - name: Verify promoted release manifest
        id: manifest
        env:
          ASSET_DIR: ${{ steps.assets.outputs.dir }}
          VERSION: ${{ steps.version.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $assetDir = getenv('ASSET_DIR') ?: '';
          $version = getenv('VERSION') ?: '';
          $repository = getenv('GITHUB_REPOSITORY') ?: '';
          $manifestPath = "{$assetDir}/orbit-release-manifest.json";

          $manifest = json_decode((string) file_get_contents($manifestPath), true, flags: JSON_THROW_ON_ERROR);

          if (! is_array($manifest)) {
              fail('Release manifest must be a JSON object.');
          }

          if (($manifest['version'] ?? null) !== $version) {
              fail("Release manifest version does not match {$version}.");
          }

          if (($manifest['source'] ?? null) !== 'github-release') {
              fail('Release manifest source must be github-release after promotion.');
          }

          $gateway = $manifest['images']['gateway'] ?? null;

          if (! is_string($gateway) || ! str_starts_with($gateway, "ghcr.io/hardimpactdev/orbit-gateway:{$version}@sha256:")) {
              fail('Release manifest gateway image must be the promoted digest-pinned ghcr.io/hardimpactdev/orbit-gateway image.');
          }

          $expectedArtifacts = [
              'linux-amd64' => 'orbit-linux-x64',
              'darwin-arm64' => 'orbit-macos-arm64',
          ];

          foreach ($expectedArtifacts as $platform => $asset) {
              $artifact = $manifest['cli_artifacts'][$platform] ?? null;

              if (! is_array($artifact)) {
                  fail("Release manifest missing CLI artifact {$platform}.");
              }

              $expectedUrl = "https://github.com/{$repository}/releases/download/v{$version}/{$asset}";

              if (($artifact['url'] ?? null) !== $expectedUrl) {
                  fail("Release manifest {$platform} URL must point at {$expectedUrl}.");
              }

              $actualHash = hash_file('sha256', "{$assetDir}/{$asset}");

              if (! is_string($actualHash) || ($artifact['sha256'] ?? null) !== $actualHash) {
                  fail("Release manifest {$platform} sha256 does not match the promoted asset.");
              }
          }

          file_put_contents(getenv('GITHUB_OUTPUT'), "gateway_ref={$gateway}\n", FILE_APPEND);

          function fail(string $message): never
          {
              fwrite(STDERR, "{$message}\n");

              exit(1);
          }
          PHP

      - name: Verify promoted gateway image is pullable
        env:
          GATEWAY_REF: ${{ steps.manifest.outputs.gateway_ref }}
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d)"
          trap 'rm -rf "$docker_config"' EXIT

          DOCKER_CONFIG="$docker_config" docker pull "$GATEWAY_REF"

      - name: Verify promoted gateway image bakes the release version
        env:
          GATEWAY_REF: ${{ steps.manifest.outputs.gateway_ref }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          baked="$(docker run --rm --entrypoint cat "$GATEWAY_REF" /srv/orbit/VERSION || true)"
          if [ "$baked" != "$VERSION" ]; then
            echo "Gateway image /srv/orbit/VERSION is [$baked], expected [$VERSION] (gateway-version regression)." >&2
            exit 1
          fi

          echo "Gateway image bakes version ${VERSION} at /srv/orbit/VERSION."

      - name: Set up Node.js for TypeScript SDK release
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node >= 22.14 / npm >= 11.5.1.
          # Pin current GitHub-hosted Node 24 with cache disabled for deterministic installs.
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Publish split package repositories
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          SPLIT_PUSH_TOKEN: ${{ secrets.ORBIT_RELEASE_TOKEN || github.token }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          publish_split() {
            package="$1"
            repository="$2"
            output="$RUNNER_TEMP/orbit-splits/$package"

            rm -rf "$output"
            bin/orbit-prepare-release-package --package="$package" --version="$VERSION" --output="$output"

            # Never ship install trees into split repositories.
            rm -rf "$output/node_modules" "$output/coverage"

            git -C "$output" init
            git -C "$output" config user.name "github-actions[bot]"
            git -C "$output" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$output" add -A
            if git -C "$output" ls-files --error-unmatch node_modules >/dev/null 2>&1; then
              echo "Refusing to publish split package with node_modules tracked." >&2
              exit 1
            fi
            git -C "$output" commit -m "Release $TAG"
            git -C "$output" branch -M main
            git -C "$output" tag -f "$TAG"
            git -C "$output" remote add origin "https://x-access-token:${SPLIT_PUSH_TOKEN}@github.com/${repository}.git"
            git -C "$output" push --force origin HEAD:main
            git -C "$output" push --force origin "refs/tags/${TAG}"
          }

          prepare_and_verify_sdk_typescript() {
            output="$RUNNER_TEMP/orbit-splits/sdk-typescript"
            rm -rf "$output"
            bin/orbit-prepare-release-package --package=sdk-typescript --version="$VERSION" --output="$output"

            test -f "$output/package.json"
            test -f "$output/package-lock.json"
            test ! -d "$output/node_modules"

            name="$(node -p "require('${output}/package.json').name")"
            private_flag="$(node -p "String(require('${output}/package.json').private)")"
            prepared_version="$(node -p "require('${output}/package.json').version")"
            lock_name="$(node -p "require('${output}/package-lock.json').name")"
            lock_version="$(node -p "require('${output}/package-lock.json').version")"
            lock_root_name="$(node -p "require('${output}/package-lock.json').packages[''].name")"
            lock_root_version="$(node -p "require('${output}/package-lock.json').packages[''].version")"

            if [ "$name" != "@hardimpactdev/orbit-sdk-typescript" ]; then
              echo "Prepared sdk-typescript package name is [$name], expected @hardimpactdev/orbit-sdk-typescript." >&2
              exit 1
            fi

            if [ "$private_flag" != "false" ]; then
              echo "Prepared sdk-typescript package must set private=false for npm publication." >&2
              exit 1
            fi

            if [ "$prepared_version" != "$VERSION" ]; then
              echo "Prepared sdk-typescript version [$prepared_version] does not match release VERSION [$VERSION]." >&2
              exit 1
            fi

            if [ "$lock_name" != "@hardimpactdev/orbit-sdk-typescript" ] || [ "$lock_root_name" != "@hardimpactdev/orbit-sdk-typescript" ]; then
              echo "Prepared sdk-typescript package-lock name mismatch." >&2
              exit 1
            fi

            if [ "$lock_version" != "$VERSION" ] || [ "$lock_root_version" != "$VERSION" ]; then
              echo "Prepared sdk-typescript package-lock version [$lock_version/$lock_root_version] does not match release VERSION [$VERSION]." >&2
              exit 1
            fi

            (
              cd "$output"
              npm ci
              npm test
              npm run build
              test -f dist/index.js
              test -f dist/index.d.ts
              # Deterministic JSON listing (not human npm notices).
              pack_json_file="$RUNNER_TEMP/sdk-typescript-pack.json"
              npm pack --dry-run --json > "$pack_json_file"
              PACK_JSON_FILE="$pack_json_file" node --input-type=module <<'NODE'
                import { readFileSync } from 'node:fs';
                import process from 'node:process';

                const data = JSON.parse(readFileSync(process.env.PACK_JSON_FILE, 'utf8'));
                const entry = Array.isArray(data) ? data[0] : data;
                const files = (entry?.files ?? []).map((file) => file.path);
                const required = [
                  'dist/index.js',
                  'dist/index.d.ts',
                  'openapi/public-gateway-openapi.json',
                  'package.json',
                  'README.md',
                ];

                for (const path of required) {
                  if (! files.includes(path)) {
                    console.error(`Prepared sdk-typescript pack missing ${path}`);
                    process.exit(1);
                  }
                }

                if (files.some((path) => path === 'node_modules' || path.startsWith('node_modules/'))) {
                  console.error('Prepared sdk-typescript pack listing must not include node_modules.');
                  process.exit(1);
                }
              NODE
            )
          }

          publish_sdk_typescript_split() {
            output="$RUNNER_TEMP/orbit-splits/sdk-typescript"
            repository="hardimpactdev/orbit-sdk-typescript"

            # Ensure the generated distribution repo/tag exists before npm
            # publication. Package repository/provenance metadata still points at
            # canonical hardimpactdev/orbit + packages/sdk-typescript.
            # Never commit install trees.
            rm -rf "$output/node_modules" "$output/coverage"

            git -C "$output" init
            git -C "$output" config user.name "github-actions[bot]"
            git -C "$output" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$output" add -A
            if git -C "$output" ls-files --error-unmatch node_modules >/dev/null 2>&1; then
              echo "Refusing to publish sdk-typescript split with node_modules tracked." >&2
              exit 1
            fi
            git -C "$output" commit -m "Release $TAG"
            git -C "$output" branch -M main
            git -C "$output" tag -f "$TAG"
            git -C "$output" remote add origin "https://x-access-token:${SPLIT_PUSH_TOKEN}@github.com/${repository}.git"
            git -C "$output" push --force origin HEAD:main
            git -C "$output" push --force origin "refs/tags/${TAG}"
          }

          publish_sdk_typescript_npm() {
            output="$RUNNER_TEMP/orbit-splits/sdk-typescript"

            # First publication may use NPM_TOKEN. After the package exists on npm,
            # configure Trusted Publisher for hardimpactdev/orbit / orbit-release.yml
            # and prefer OIDC (id-token) without a long-lived token.
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              echo "Publishing @hardimpactdev/orbit-sdk-typescript with NPM_TOKEN (first-publication credential boundary)."
            else
              echo "NPM_TOKEN unset; attempting OIDC Trusted Publisher publish for @hardimpactdev/orbit-sdk-typescript."
              echo "If this is the package's first npm release, set NPM_TOKEN once, then migrate to Trusted Publisher and remove the long-lived token."
            fi

            (
              cd "$output"
              # Publish already-built prepared bytes (dist present; monorepo generate scripts stripped).
              npm publish --access public --provenance
            )
          }

          publish_split core hardimpactdev/orbit-core
          publish_split sdk hardimpactdev/orbit-sdk-laravel
          publish_split cli hardimpactdev/orbit-cli
          publish_split gateway hardimpactdev/orbit-gateway

          # TypeScript SDK order is intentional: prepare/verify -> push generated
          # split repository/tag -> npm publish. Root VERSION/tag is the only stream.
          prepare_and_verify_sdk_typescript
          publish_sdk_typescript_split
          publish_sdk_typescript_npm

          if [ -n "${PACKAGIST_USERNAME:-}" ] && [ -n "${PACKAGIST_TOKEN:-}" ]; then
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"repository":{"url":"https://github.com/hardimpactdev/orbit-core"}}' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"repository":{"url":"https://github.com/hardimpactdev/orbit-sdk-laravel"}}' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
          else
            echo "Packagist credentials not configured; skipping hardimpactdev/orbit-core and hardimpactdev/orbit-sdk-laravel API updates."
          fi
