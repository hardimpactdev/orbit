id: b861e576-9871-42aa-bd9e-6f57ecf54184
name: task-vm-ssh-prepare
description: Converge guest SSH through the trusted provider, then verify209 with the observed full host pin.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  additionalProperties: false
jobs:
- name: ssh
  labels:
    role: swamp
  steps:
  - name: available
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &id001
        name: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/true"] : ["/usr/bin/true"] }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
        timeoutSec: 180
    dependsOn: []
  - name: package
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/env", "DEBIAN_FRONTEND=noninteractive", "/usr/bin/apt-get", "install", "-y", "--no-install-recommends", "openssh-server"] : ["/usr/bin/env", "DEBIAN_FRONTEND=noninteractive", "/usr/bin/apt-get", "install", "-y", "--no-install-recommends", "openssh-server"] }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
        timeoutSec: 180
    dependsOn:
    - step: available
      condition:
        type: succeeded
  - name: host-keys
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/ssh-keygen", "-A"] : ["/usr/bin/ssh-keygen", "-A"] }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
        timeoutSec: 180
    dependsOn:
    - step: package
      condition:
        type: succeeded
  - name: authorize
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/install","-D","-m","0600","-o",inputs.intent.user,"-g",inputs.intent.user,"/dev/stdin","/home/" + inputs.intent.user + "/.ssh/authorized_keys2"] : ["/usr/bin/install","-D","-m","0600","-o",inputs.intent.user,"-g",inputs.intent.user,"/dev/stdin","/home/" + inputs.intent.user + "/.ssh/authorized_keys2"] }}'
        stdin: ${{ inputs.intent.ssh_identity.public_key + "\n" }}
    dependsOn:
    - step: host-keys
      condition:
        type: succeeded
  - name: firewall
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/bin/sh","-c","ufw --force delete allow in on orbit proto tcp from 10.44.0.15 to any port 22 comment orbit:task-vm-ssh-209 && ufw --force delete deny in proto tcp to any port 22 comment orbit:task-vm-ssh-only && ufw prepend deny in proto tcp to any port 22 comment orbit:task-vm-ssh-only && ufw prepend allow in on orbit proto tcp from 10.44.0.15 to any port 22 comment orbit:task-vm-ssh-209 && ufw allow in on orbit proto tcp from 10.44.0.15 to any port 3774 comment orbit:task-vm-pi-209 && ufw allow in on orbit proto tcp from 10.44.0.2 to any port 3774 comment orbit:task-vm-pi-gateway && ufw allow in on orbit proto tcp to any port 443 comment orbit:task-vm-site && ufw --force enable"] : ["/bin/sh","-c","ufw --force delete allow in on orbit proto tcp from 10.44.0.15 to any port 22 comment orbit:task-vm-ssh-209 && ufw --force delete deny in proto tcp to any port 22 comment orbit:task-vm-ssh-only && ufw prepend deny in proto tcp to any port 22 comment orbit:task-vm-ssh-only && ufw prepend allow in on orbit proto tcp from 10.44.0.15 to any port 22 comment orbit:task-vm-ssh-209 && ufw allow in on orbit proto tcp from 10.44.0.15 to any port 3774 comment orbit:task-vm-pi-209 && ufw allow in on orbit proto tcp from 10.44.0.2 to any port 3774 comment orbit:task-vm-pi-gateway && ufw allow in on orbit proto tcp to any port 443 comment orbit:task-vm-site && ufw --force enable"] }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
        timeoutSec: 180
    dependsOn:
    - step: authorize
      condition:
        type: succeeded
  - name: sshd
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/systemctl", "enable", "--now", "ssh.service"] : ["/usr/bin/systemctl", "enable", "--now", "ssh.service"] }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
        timeoutSec: 180
    dependsOn:
    - step: firewall
      condition:
        type: succeeded
  - name: host-key
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-ssh-bootstrap-" + string((inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution : inputs.intent.ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.provider_input.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/cat", "/etc/ssh/ssh_host_ed25519_key.pub"] : ["/usr/bin/cat", "/etc/ssh/ssh_host_ed25519_key.pub"] }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
        timeoutSec: 180
    dependsOn:
    - step: sshd
      condition:
        type: succeeded
  - name: guest
    labels:
      role: swamp
    task: &id002
      type: behavior
      behaviorType: '@nckrtl/task-vm-ssh-input'
      behaviorName: ${{ "vm-ssh-guest" }}
      methodName: observe
      inputs:
        intent: ${{ inputs.intent }}
        public_key: ${{ steps["host-key"].outputs.stdout }}
    dependsOn:
    - step: host-key
      condition:
        type: succeeded
  - name: verify
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("vm-ssh-verify-" + string(steps.guest.outputs.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("vm-ssh-verify-" + string(steps.guest.outputs.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ steps.guest.outputs.ssh_execution.target.user }}
          port: 22
          identityFile: ${{ steps.guest.outputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ steps.guest.outputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ steps.guest.outputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/true
        timeoutSec: 30
    dependsOn:
    - step: guest
      condition:
        type: succeeded
  - name: result
    labels:
      role: swamp
    task: *id002
    dependsOn:
    - step: verify
      condition:
        type: succeeded
