---
# A release folder is named by its repository and ref, so a release that verifies is the one wanted: its checkout at the ref with no
# tracked change, and the Composer install of its lock file (each locked package at its locked version, without dev packages). One read
# replaces Git's checkout check and Composer's install on every converge; any other state checks out and installs again.
- name: Read the Reverb release
  become: true
  become_user: "{{ rt.websocket.user }}"
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        cd "$1" 2>/dev/null && [ "$(git rev-parse HEAD 2>/dev/null)" = "$2" ] && git diff --quiet HEAD -- 2>/dev/null \
          && [ -f vendor/autoload.php ] && php -r '
            $lock = json_decode((string) @file_get_contents("composer.lock"), true);
            $installed = json_decode((string) @file_get_contents("vendor/composer/installed.json"), true);
            if (! is_array($lock) || ! is_array($installed) || ($installed["dev"] ?? true) !== false) { exit(1); }
            $wanted = array_column($lock["packages"] ?? [], "version", "name");
            $have = array_column($installed["packages"] ?? [], "version", "name");
            ksort($wanted);
            ksort($have);
            exit($wanted === $have ? 0 : 1);' && echo verified || echo install
      - reverb
      - "{{ rt.websocket.release }}"
      - "{{ rt.websocket.ref }}"
  register: reverb_release
  check_mode: false
  changed_when: false
- name: Check out Reverb
  when: reverb_release.stdout != 'verified'
  become: true
  become_user: "{{ rt.websocket.user }}"
  ansible.builtin.git: { repo: "{{ rt.websocket.repository }}", dest: "{{ rt.websocket.release }}", version: "{{ rt.websocket.ref }}", force: true }
  register: reverb_checkout
- name: Install Reverb packages
  when: reverb_release.stdout != 'verified'
  become: true
  become_user: "{{ rt.websocket.user }}"
  community.general.composer: { command: install, working_dir: "{{ rt.websocket.release }}", no_dev: true, optimize_autoloader: true }
- name: Publish the Reverb release
  ansible.builtin.file:
    src: "{{ rt.websocket.release }}"
    dest: "{{ rt.websocket.path }}"
    owner: "{{ rt.websocket.user }}"
    state: link
    force: true
  register: reverb_link
