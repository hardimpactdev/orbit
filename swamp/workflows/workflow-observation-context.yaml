id: c3848c68-b3f3-45ed-bb0f-1d61eb65175e
name: observation-context
description: Capture public metadata for native fleet and Horizon observation schedules.
inputs:
  type: object
  properties:
    channel: {type: string, enum: [fleet, horizon]}
    revision: {type: integer, minimum: 1}
    expectations: {type: string}
    captured_at: {type: string}
    node_id: {type: integer, minimum: 1}
    intent: {type: object}
  required: [channel, revision, expectations, captured_at, node_id, intent]
  additionalProperties: false
jobs:
- name: context
  target: orbit-node-209
  steps:
  - name: capture
    # One stable record per channel; a late older revision never replaces a newer one.
    guard: ${{ data.latest("observation-context-" + inputs.channel, "context").?attributes.?revision.orValue(0) >= inputs.revision }}
    task:
      type: behavior
      behaviorType: '@nckrtl/observation-schedule'
      behaviorName: ${{ "observation-context-" + inputs.channel }}
      methodName: capture
      inputs:
        channel: ${{ inputs.channel }}
        revision: ${{ inputs.revision }}
        expectations: ${{ inputs.expectations }}
        captured_at: ${{ inputs.captured_at }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
