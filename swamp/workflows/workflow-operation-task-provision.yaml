id: 11b8ed3f-1814-4165-80c9-8af59fe94c22
name: operation-task-provision
description: Compose canonical VM provision, source checkout and ordered setup from full inputs on209;
  no guest worker or Gateway step callbacks.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: tasks.provision}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models|provider-bootstrap)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: provision
  labels: {role: swamp}
  steps:
  - name: Create and prepare the VM
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provision
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: Set up the workspace
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-workspace-source
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        vm: ${{ steps["Create and prepare the VM"].outputs.result }}
    dependsOn:
    - step: Create and prepare the VM
      condition:
        type: succeeded
  - name: Check the workspace
    labels: {role: swamp}
    # Prints the receipt and fails on its error code. A failed step keeps no stdout, so the Gateway
    # then reads the same receipt from the workspace step, which always ends with it.
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-result" }}'
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$ORBIT_RESULT"
          python3 -c 'import json,os,sys; sys.exit(1 if "error_code" in json.loads(os.environ["ORBIT_RESULT"]) else 0)'
        env:
          ORBIT_RESULT: '${{ "Set up the workspace" in steps && "outputs" in steps["Set up the workspace"] && "result" in steps["Set up the workspace"].outputs ? steps["Set up the workspace"].outputs.result.result_json : "{\"error_code\":\"tasks.provision_failed\",\"failed_step\":\"vm\"}" }}'
    dependsOn:
    - step: Create and prepare the VM
      condition:
        type: always
    - step: Set up the workspace
      condition:
        type: always
