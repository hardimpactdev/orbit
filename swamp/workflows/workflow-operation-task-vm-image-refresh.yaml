id: 17bf7d13-d591-4dc7-a735-5396d311994f
name: operation-task-vm-image-refresh
description: >-
  Refresh the task image of one task VM host (docs/cli/tasks/vm-image-refresh.mmd) from full inputs on 209: one VM from the current
  image, one Ansible run that converges everything, then the image and its seed are published and promoted with `-previous` kept.
  No step calls the Gateway.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.image_refresh}
    intent:
      type: object
      properties:
        host: {type: object}
        vm: {type: object}
        converge: {type: object}
      required: [host, vm, converge]
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        club:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: ^swamp-proof-club-api-key$}
          required: [vault, key]
          additionalProperties: false
      required: [club]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: refresh
  labels: {role: swamp}
  steps:
  - name: Start the refresh VM
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{ inputs.execution_secrets }}', tags: refresh-vm}
  # The outer VM, the warm checkout and each container, then their `base` snapshots and the clean before the publication.
  - name: Converge everything
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Start the refresh VM, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent.converge }}
        guest: ${{ inputs.intent.vm.name }}
        tags: software,tools,boot,checkout,fleet,check,clean
        with_pi: true
  - name: Publish the image
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Converge everything, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{ inputs.execution_secrets }}', tags: publish}
  - name: Promote
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Publish the image, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{ inputs.execution_secrets }}', tags: promote, read_aliases: true}
# A failed refresh leaves the host as it was: the refresh VM, its seed clone and a candidate that was not promoted go.
- name: discard
  labels: {role: swamp}
  dependsOn: [{job: refresh, condition: {type: failed}}]
  steps:
  - name: Discard the candidate
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{ inputs.execution_secrets }}', tags: discard}
