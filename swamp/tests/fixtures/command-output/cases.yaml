  # Recorded on Beast with Incus 7.0.2: neither INCUS_DIR nor INCUS_SOCKET
  # exists in /proc/<server_pid>/environ. Omit every unrelated variable;
  # the allowlisted projection is empty, base64-encoded as slurp returns it.
  image-daemon-defaults:
    container_image_environment:
      content: ''
  # Constructed from the documented NUL-separated /proc environ format,
  # not recorded on a host: INCUS_DIR=/srv/incus-fixture\0 followed by
  # INCUS_SOCKET=/run/incus-fixture.socket\0, base64-encoded for slurp.
  image-daemon-overrides:
    container_image_environment:
      content: SU5DVVNfRElSPS9zcnYvaW5jdXMtZml4dHVyZQBJTkNVU19TT0NLRVQ9L3J1bi9pbmN1cy1maXh0dXJlLnNvY2tldAA=
