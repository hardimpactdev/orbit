id: f17a264f-7f41-4ee2-a97d-9ac7f6d789e2
name: operation-task-vm-converge
description: Bring a running task VM to the pins of the release with the task VM role phases of Ansible, from 209.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.converge]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
    # The Pi server is an internal artifact on the Gateway host; the playbook copies it from 209 to the VM when the VM's copy differs from the pin.
  - name: Fetch the Pi server
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-converge-pi-" + string(inputs.node_id) }}
      methodName: copy
      globalArgs:
        name: ${{ "task-vm-converge-pi-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.pi.source.ssh.target.user }}
          port: ${{ inputs.intent.pi.source.ssh.target.port }}
          identityFile: ${{ inputs.intent.pi.source.ssh.identity_file }}
        hosts:
        - name: source
          address: ${{ inputs.intent.pi.source.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.pi.source.ssh.target.host_keys }}'}
      inputs:
        hosts: name:source
        src: ${{ inputs.intent.pi.source.path }}
        dst: ${{ "/tmp/orbit-ansible-" + run.id + "/pi-server" }}
        direction: from
        timeoutSec: 300
  - name: Check the Pi server
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Fetch the Pi server, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-converge-pi-check-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: printf '%s  %s\n' "$ORBIT_SHA" "$ORBIT_RUN/pi-server" | timeout 60 sha256sum -c --quiet
        env:
          ORBIT_SHA: ${{ inputs.intent.pi.sha256 }}
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Check the Pi server, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-converge-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ORBIT_KIND: ${{ inputs.kind }}
- name: software
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: {type: succeeded}}
  steps:
  - name: Install the software
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-converge-software-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 1800 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "pi_path=$ORBIT_RUN/pi-server" --tags software "$ORBIT_ANSIBLE/task-vm-role.yml"
        env: &ansible
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
- name: tools
  labels: {role: swamp}
  dependsOn:
  - {job: software, condition: {type: succeeded}}
  steps:
  - name: Install the tools
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-converge-tools-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags tools "$ORBIT_ANSIBLE/task-vm-role.yml"
        env: *ansible
- name: check
  labels: {role: swamp}
  dependsOn:
  - {job: tools, condition: {type: succeeded}}
  steps:
  - name: Check the task VM role
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-converge-check-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags check "$ORBIT_ANSIBLE/task-vm-role.yml"
        env: *ansible
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: software, condition: *settled}
  - {job: tools, condition: *settled}
  - {job: check, condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-converge-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
