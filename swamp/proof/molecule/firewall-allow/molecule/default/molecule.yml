# SPIKE (molecule-verify-spike). Molecule with the delegated driver ("default" with managed: false in Molecule 6+).
# No instance is created or destroyed: the inventory is the nested fleet that `tasks:provision` already built.
# Run from the parent directory (firewall-allow/), in the task VM. Swamp runs this as ONE step after it has restored `base`:
#   molecule test                   # prepare (fixtures) -> converge (the CLI, answers, receipts) -> verify (state)
# Independent cases run as many at a time as ANSIBLE_FORKS allows (1 is serial); exclusive cases run alone afterwards.
# The spike runs it through scripts/molecule-verify-spike (`tasks:script`).
driver:
  name: default
  options:
    managed: false

# Molecule needs a platform list even when it manages none; these are the existing Nodes.
platforms:
  - name: nested-gateway
  - name: nested-app-dev
  - name: nested-app-prod

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: ansible.builtin.default
      callbacks_enabled: ansible.posix.profile_tasks
      gathering: explicit
      interpreter_python: auto_silent
      # converge.yml leaves its results as cacheable facts; verify.yml reads them in the next ansible-playbook run.
      fact_caching: jsonfile
      fact_caching_connection: /tmp/molecule-firewall-allow-facts
      fact_caching_timeout: 3600
  inventory:
    hosts:
      all:
        vars:
          # The nested Gateway, as the outer VM reaches it. The caller is identified by its WireGuard address, so no token is needed.
          gateway_url: https://10.45.0.1/api/v1
          gateway_ca: /home/orbit/.orbit/nested-ca.pem
          # One port pair per case: a case uses its own resources, as in the runner. A rerun on a fleet that was not restored sets another
          # PROOF_PORT_BASE, so the leftovers of the first run touch nothing.
          # The CLI under test, as the outer VM runs it: the checkout of the VM, the nested profile in ORBIT_HOME.
          checkout: "{{ lookup('ansible.builtin.env', 'ORBIT_CHECKOUT') | default('/home/orbit/apps/orbit/workspace', true) }}"
          orbit: [php, "{{ checkout }}/apps/cli/orbit"]
          cli_env: {PATH: /usr/local/bin:/usr/bin:/bin, HOME: /home/orbit, ORBIT_HOME: /home/orbit/.orbit}
          # Stages of the parallel spike, read from the environment of scripts/molecule-verify-spike:
          #   PROOF_SPREAD=1  spread the cases over the containers of PROOF_TARGETS (default app-dev,app-prod,gateway); else all go to app-dev
          #   PROOF_FAST=1    poll async jobs every 1 s instead of 5 s, read the facts once and share them, start the listeners with one exec
          # ANSIBLE_FORKS is the limit: cases that run at a time, and probes that run at a time.
          parallel_limit: "{{ lookup('ansible.builtin.env', 'ANSIBLE_FORKS') | default('1', true) | int }}"
          spread: "{{ lookup('ansible.builtin.env', 'PROOF_SPREAD') | default('0', true) == '1' }}"
          fast: "{{ lookup('ansible.builtin.env', 'PROOF_FAST') | default('0', true) == '1' }}"
          poll_delay: "{{ 1 if fast else 5 }}"
          spread_nodes: "{{ (lookup('ansible.builtin.env', 'PROOF_TARGETS') | default('app-dev,app-prod,gateway', true)).split(',') if spread else ['app-dev'] }}"
          # The Node that every other Node is judged against: the one source an allow admits, and the one that stays blocked.
          allowed_of: {app-dev: gateway, app-prod: gateway, gateway: app-dev}
          blocked_of: {app-dev: app-prod, app-prod: app-dev, gateway: app-prod}
          port_base: "{{ lookup('ansible.builtin.env', 'PROOF_PORT_BASE') | default(47100, true) | int }}"
          cases:
            new_restricted_allow: {port: "{{ port_base | int + 1 }}", control: "{{ port_base | int + 11 }}"}
            already_applied:      {port: "{{ port_base | int + 2 }}", control: "{{ port_base | int + 12 }}"}
            partial_application:  {port: "{{ port_base | int + 3 }}", control: "{{ port_base | int + 13 }}"}
            conflict:             {port: "{{ port_base | int + 4 }}", control: "{{ port_base | int + 14 }}"}
            protocols_tcp:        {port: "{{ port_base | int + 5 }}", control: "{{ port_base | int + 15 }}"}
            # A range of five ports, one port outside it, and one control port for the traffic probes.
            port_range:           {lo: "{{ port_base | int + 20 }}", mid: "{{ port_base | int + 22 }}", hi: "{{ port_base | int + 24 }}", spec: "{{ port_base | int + 20 }}:{{ port_base | int + 24 }}", outside: "{{ port_base | int + 30 }}"}
          # The container each case works on, by the number of firewall writes it makes: the writes of one Node queue on its lock, so they are
          # spread over the Nodes. Without PROOF_SPREAD every case goes to app-dev, as before.
          case_target:
            new_restricted_allow: "{{ spread_nodes[0 % (spread_nodes | length)] }}"
            already_applied:      "{{ spread_nodes[0 % (spread_nodes | length)] }}"
            partial_application:  "{{ spread_nodes[1 % (spread_nodes | length)] }}"
            conflict:             "{{ spread_nodes[1 % (spread_nodes | length)] }}"
            protected_port:       "{{ spread_nodes[1 % (spread_nodes | length)] }}"
            failure_code:         "{{ spread_nodes[0 % (spread_nodes | length)] }}"
            protocols_tcp:        "{{ spread_nodes[2 % (spread_nodes | length)] }}"
            port_range:           "{{ spread_nodes[2 % (spread_nodes | length)] }}"
          # Every port that gets a listener, and every test deny (TCP unless `udp`) placed above the proof-network allowance, by case.
          case_ports:
            new_restricted_allow: ["{{ cases.new_restricted_allow.port }}", "{{ cases.new_restricted_allow.control }}"]
            already_applied: ["{{ cases.already_applied.port }}", "{{ cases.already_applied.control }}"]
            partial_application: ["{{ cases.partial_application.port }}", "{{ cases.partial_application.control }}"]
            conflict: ["{{ cases.conflict.port }}", "{{ cases.conflict.control }}"]
            protocols_tcp: ["{{ cases.protocols_tcp.port }}", "{{ cases.protocols_tcp.control }}"]
            port_range: "{{ (range(cases.port_range.lo | int, (cases.port_range.hi | int) + 1) | list) + [cases.port_range.outside] }}"
            protected_port: []
            failure_code: []
          case_denies:
            new_restricted_allow: [{name: new_restricted_allow, port: "{{ cases.new_restricted_allow.port }}"}]
            already_applied: [{name: already_applied, port: "{{ cases.already_applied.port }}"}]
            partial_application:
              - {name: partial_application, port: "{{ cases.partial_application.port }}"}
              - {name: partial_application_udp, port: "{{ cases.partial_application.port }}", proto: udp}
            conflict: [{name: conflict, port: "{{ cases.conflict.port }}"}]
            protocols_tcp: [{name: protocols_tcp, port: "{{ cases.protocols_tcp.port }}"}]
            port_range:
              - {name: port_range, port: "{{ cases.port_range.spec }}"}
              - {name: port_range_outside, port: "{{ cases.port_range.outside }}"}
            protected_port: []
            failure_code: []
        children:
          control:
            hosts:
              localhost:
                ansible_connection: local
          # One host per case, so Ansible's own `forks` setting is the limit of cases that run at a time (`ANSIBLE_FORKS`; the script sets it).
          # A case with its own ports, listeners and denies is independent. A case that compares global state (the whole UFW table, the
          # Operation list, Doctor) is exclusive: it runs alone, after the independent ones.
          case_hosts:
            vars:
              ansible_connection: local
            children:
              independent_cases:
                hosts:
                  already_applied: {}
                  partial_application: {}
                  protocols_tcp: {}
                  port_range: {}
                  protected_port: {}
              exclusive_cases:
                hosts:
                  new_restricted_allow: {}
                  conflict: {}
                  failure_code: {}
          # Not a command case: Doctor, which verify runs beside the other checks so that the wait for the agent's report overlaps them.
          verify_extras:
            vars:
              ansible_connection: local
            hosts:
              doctor_check: {}
          nodes:
            vars:
              ansible_connection: community.general.incus
            hosts:
              nested-gateway:  {ansible_incus_host: nested-gateway}
              nested-app-dev:  {ansible_incus_host: nested-app-dev}
              nested-app-prod: {ansible_incus_host: nested-app-prod}

scenario:
  test_sequence:
    - prepare
    - converge
    - verify
