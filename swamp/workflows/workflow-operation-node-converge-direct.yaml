id: daace7ba-223f-47b6-9452-7c0da7cf384e
name: operation-node-converge
autoContinue: false
description: 'Inspect and reconcile recorded Node state in ordered Ansible phases; always remove private input.'
vaults:
  - orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
        - node.converge
    intent:
      type: object
      properties:
        # The bound of the roles phase: 1800 on an Instance fleet Node's app-dev converge (NodeDesiredConvergeInput), else absent.
        roles_seconds:
          type: integer
          minimum: 900
          maximum: 1800
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
              - orbit-control-inputs
          key:
            type: string
            pattern: '^(node-converge-operation-[1-9][0-9]*-agent-verifier|node-role-operation-[1-9][0-9]*-[a-z-]+)$'
        required:
          - vault
          - key
        additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  -
    name: intent
    labels:
      role: swamp
    steps:
      -
        name: 'Write the intent'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ${{ "ansible-input" }}
          methodName: write
          inputs:
            intent: '${{ inputs.intent }}'
            path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
  -
    name: private-agent_verifier
    labels:
      role: swamp
    dependsOn:
      -
        job: intent
        condition:
          type: succeeded
    steps:
      -
        name: 'Write agent_verifier'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-write-agent_verifier" }}
          methodName: execute
          inputs:
            run: "umask 077\nprintf %s \"$ORBIT_VALUE\" > \"$ORBIT_FILE\""
            env:
              ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-agent_verifier" }}'
              ORBIT_VALUE: '${{ vault.get("orbit-control-inputs", inputs.execution_secrets.agent_verifier.key) }}'
        guard: '${{ !("agent_verifier" in inputs.execution_secrets) }}'
  -
    name: private-metrics_password
    labels:
      role: swamp
    dependsOn:
      -
        job: private-agent_verifier
        condition:
          type: succeeded
    steps:
      -
        name: 'Write metrics_password'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-write-metrics_password" }}
          methodName: execute
          inputs:
            run: "umask 077\nprintf %s \"$ORBIT_VALUE\" > \"$ORBIT_FILE\""
            env:
              ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-metrics_password" }}'
              ORBIT_VALUE: '${{ vault.get("orbit-control-inputs", inputs.execution_secrets.metrics_password.key) }}'
        guard: '${{ !("metrics_password" in inputs.execution_secrets) }}'
  -
    name: private-websocket_environment
    labels:
      role: swamp
    dependsOn:
      -
        job: private-metrics_password
        condition:
          type: succeeded
    steps:
      -
        name: 'Write websocket_environment'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-write-websocket_environment" }}
          methodName: execute
          inputs:
            run: "umask 077\nprintf %s \"$ORBIT_VALUE\" > \"$ORBIT_FILE\""
            env:
              ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-websocket_environment" }}'
              ORBIT_VALUE: '${{ vault.get("orbit-control-inputs", inputs.execution_secrets.websocket_environment.key) }}'
        guard: '${{ !("websocket_environment" in inputs.execution_secrets) }}'
  -
    name: private-analytics_environment
    labels:
      role: swamp
    dependsOn:
      -
        job: private-websocket_environment
        condition:
          type: succeeded
    steps:
      -
        name: 'Write analytics_environment'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-write-analytics_environment" }}
          methodName: execute
          inputs:
            run: "umask 077\nprintf %s \"$ORBIT_VALUE\" > \"$ORBIT_FILE\""
            env:
              ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-analytics_environment" }}'
              ORBIT_VALUE: '${{ vault.get("orbit-control-inputs", inputs.execution_secrets.analytics_environment.key) }}'
        guard: '${{ !("analytics_environment" in inputs.execution_secrets) }}'
  -
    name: prepare
    labels:
      role: swamp
    dependsOn:
      -
        job: private-analytics_environment
        condition:
          type: succeeded
    steps:
      -
        name: 'Prepare private input'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ${{ "ansible-input" }}
          methodName: convergeInput
          inputs:
            folder: '${{ "/tmp/orbit-ansible-" + run.id }}'
            operation_id: ${{ inputs.operation_id }}
  -
    name: input
    labels:
      role: swamp
    dependsOn:
      -
        job: prepare
        condition:
          type: succeeded
    steps:
      -
        name: 'Converge input'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-input-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            run: "umask 077\nexport ANSIBLE_CONFIG=\"$ORBIT_ANSIBLE/ansible.cfg\"\nexport ANSIBLE_SSH_ARGS=\"-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s\"\nexport ANSIBLE_STDOUT_CALLBACK=ansible.posix.json\nstarted=$(date +%s)\ncode=0\ntimeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.json\" -e \"@$ORBIT_RUN/vars.yml\" -e \"orbit_run=$ORBIT_RUN\" --tags input \"$ORBIT_ANSIBLE/operation-node-converge.yml\" > \"$ORBIT_RUN/input.json\" || code=$?\nprintf '{\"exit_code\":%s,\"elapsed_seconds\":%s}\\n' \"$code\" \"$(( $(date +%s) - started ))\" > \"$ORBIT_RUN/input-meta.json\"\nexit \"$code\""
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: agent
    labels:
      role: swamp
    dependsOn:
      -
        job: input
        condition:
          type: succeeded
    steps:
      -
        name: 'Converge agent'
        labels:
          role: swamp
        writes: true
        # Skipped when its digest equals the Node's record (docs/reference/node-provisioning.md#skip-a-phase-whose-input-did-not-change).
        guard: '${{ "agent" in steps["Prepare private input"].outputs.unchanged }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-agent-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            run: "umask 077\nexport ANSIBLE_CONFIG=\"$ORBIT_ANSIBLE/ansible.cfg\"\nexport ANSIBLE_SSH_ARGS=\"-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s\"\nexport ANSIBLE_STDOUT_CALLBACK=ansible.posix.json\nstarted=$(date +%s)\ncode=0\ntimeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.json\" -e \"@$ORBIT_RUN/vars.yml\" -e \"orbit_run=$ORBIT_RUN\" --tags agent \"$ORBIT_ANSIBLE/operation-node-converge.yml\" > \"$ORBIT_RUN/agent.json\" || code=$?\nprintf '{\"exit_code\":%s,\"elapsed_seconds\":%s}\\n' \"$code\" \"$(( $(date +%s) - started ))\" > \"$ORBIT_RUN/agent-meta.json\"\nexit \"$code\""
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: software
    labels:
      role: swamp
    dependsOn:
      -
        job: agent
        condition:
          type: succeeded
    steps:
      -
        name: 'Converge software'
        labels:
          role: swamp
        writes: true
        # Skipped when its digest equals the Node's record (docs/reference/node-provisioning.md#skip-a-phase-whose-input-did-not-change).
        guard: '${{ "software" in steps["Prepare private input"].outputs.unchanged }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-software-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            run: "umask 077\nexport ANSIBLE_CONFIG=\"$ORBIT_ANSIBLE/ansible.cfg\"\nexport ANSIBLE_SSH_ARGS=\"-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s\"\nexport ANSIBLE_STDOUT_CALLBACK=ansible.posix.json\nstarted=$(date +%s)\ncode=0\ntimeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.json\" -e \"@$ORBIT_RUN/vars.yml\" -e \"orbit_run=$ORBIT_RUN\" --tags software \"$ORBIT_ANSIBLE/operation-node-converge.yml\" > \"$ORBIT_RUN/software.json\" || code=$?\nprintf '{\"exit_code\":%s,\"elapsed_seconds\":%s}\\n' \"$code\" \"$(( $(date +%s) - started ))\" > \"$ORBIT_RUN/software-meta.json\"\nexit \"$code\""
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: roles
    labels:
      role: swamp
    dependsOn:
      -
        job: software
        condition:
          type: succeeded
    steps:
      -
        name: 'Converge roles'
        labels:
          role: swamp
        writes: true
        # Skipped when its digest equals the Node's record (docs/reference/node-provisioning.md#skip-a-phase-whose-input-did-not-change).
        guard: '${{ "roles" in steps["Prepare private input"].outputs.unchanged }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-roles-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            run: "umask 077\nexport ANSIBLE_CONFIG=\"$ORBIT_ANSIBLE/ansible.cfg\"\nexport ANSIBLE_SSH_ARGS=\"-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s\"\nexport ANSIBLE_STDOUT_CALLBACK=ansible.posix.json\nstarted=$(date +%s)\ncode=0\ncase \"$ORBIT_ROLES_SECONDS\" in 9[0-9][0-9]|1[0-7][0-9][0-9]|1800) ;; *) echo \"roles_seconds must be 900 to 1800\" >&2; exit 2 ;; esac\ntimeout \"$ORBIT_ROLES_SECONDS\" /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.json\" -e \"@$ORBIT_RUN/vars.yml\" -e \"orbit_run=$ORBIT_RUN\" --tags roles \"$ORBIT_ANSIBLE/$ORBIT_PLAYBOOK\" > \"$ORBIT_RUN/roles.json\" || code=$?\nprintf '{\"exit_code\":%s,\"elapsed_seconds\":%s}\\n' \"$code\" \"$(( $(date +%s) - started ))\" > \"$ORBIT_RUN/roles-meta.json\"\nexit \"$code\""
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ORBIT_PLAYBOOK: '${{ "playbook" in inputs.intent ? inputs.intent.playbook : "operation-node-converge.yml" }}'
              ORBIT_ROLES_SECONDS: '${{ "roles_seconds" in inputs.intent ? string(inputs.intent.roles_seconds) : "900" }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: tools
    labels:
      role: swamp
    dependsOn:
      -
        job: roles
        condition:
          type: succeeded
    steps:
      -
        name: 'Converge tools'
        labels:
          role: swamp
        writes: true
        # Skipped when its digest equals the Node's record (docs/reference/node-provisioning.md#skip-a-phase-whose-input-did-not-change).
        guard: '${{ "tools" in steps["Prepare private input"].outputs.unchanged }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-tools-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            timeout: 180010000
            run: |
              umask 077
              export ANSIBLE_CONFIG="$ORBIT_ANSIBLE/ansible.cfg"
              export ANSIBLE_SSH_ARGS="-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s"
              export ANSIBLE_STDOUT_CALLBACK=ansible.posix.json
              started=$(date +%s)
              code=0
              case "$ORBIT_TOOLS_SECONDS" in ''|*[!0-9]*) exit 2 ;; esac
              [ "$ORBIT_TOOLS_SECONDS" -ge 500 ] && [ "$ORBIT_TOOLS_SECONDS" -le 180000 ] || exit 2
              timeout "$ORBIT_TOOLS_SECONDS" /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.json" -e "@$ORBIT_RUN/vars.yml" -e "orbit_run=$ORBIT_RUN" --tags tools "$ORBIT_ANSIBLE/operation-node-converge.yml" > "$ORBIT_RUN/tools.json" || code=$?
              printf '{"exit_code":%s,"elapsed_seconds":%s}\n' "$code" "$(( $(date +%s) - started ))" > "$ORBIT_RUN/tools-meta.json"
              exit "$code"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ORBIT_TOOLS_SECONDS: '${{ "tools_seconds" in inputs.intent ? string(inputs.intent.tools_seconds) : "6800" }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: network
    labels:
      role: swamp
    dependsOn:
      -
        job: tools
        condition:
          type: succeeded
    steps:
      -
        name: 'Converge network'
        labels:
          role: swamp
        writes: true
        # Skipped when its digest equals the Node's record (docs/reference/node-provisioning.md#skip-a-phase-whose-input-did-not-change).
        guard: '${{ "network" in steps["Prepare private input"].outputs.unchanged }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-network-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            run: "umask 077\nexport ANSIBLE_CONFIG=\"$ORBIT_ANSIBLE/ansible.cfg\"\nexport ANSIBLE_SSH_ARGS=\"-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s\"\nexport ANSIBLE_STDOUT_CALLBACK=ansible.posix.json\nstarted=$(date +%s)\ncode=0\ntimeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.json\" -e \"@$ORBIT_RUN/vars.yml\" -e \"orbit_run=$ORBIT_RUN\" --tags network \"$ORBIT_ANSIBLE/operation-node-converge.yml\" > \"$ORBIT_RUN/network.json\" || code=$?\nprintf '{\"exit_code\":%s,\"elapsed_seconds\":%s}\\n' \"$code\" \"$(( $(date +%s) - started ))\" > \"$ORBIT_RUN/network-meta.json\"\nexit \"$code\""
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: check
    labels:
      role: swamp
    dependsOn:
      -
        job: network
        condition:
          type: succeeded
    steps:
      -
        name: 'Check the Node'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "node-converge-converge-check-" + string(inputs.node_id) }}
          methodName: execute
          inputs:
            run: "umask 077\nexport ANSIBLE_CONFIG=\"$ORBIT_ANSIBLE/ansible.cfg\"\nexport ANSIBLE_SSH_ARGS=\"-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$ORBIT_RUN/known_hosts -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s\"\nexport ANSIBLE_STDOUT_CALLBACK=ansible.posix.json\nstarted=$(date +%s)\ncode=0\ntimeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i \"$ORBIT_RUN/inventory.json\" -e \"@$ORBIT_RUN/vars.yml\" -e \"orbit_run=$ORBIT_RUN\" --tags check \"$ORBIT_ANSIBLE/operation-node-converge.yml\" > \"$ORBIT_RUN/check.json\" || code=$?\nprintf '{\"exit_code\":%s,\"elapsed_seconds\":%s}\\n' \"$code\" \"$(( $(date +%s) - started ))\" > \"$ORBIT_RUN/check-meta.json\"\nexit \"$code\""
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps["Prepare private input"].outputs.assets }}'
              ANSIBLE_COLLECTIONS_PATH: /opt/orbit/ansible/collections
  -
    name: converge
    labels:
      role: swamp
    dependsOn:
      -
        job: check
        condition:
          type: always
    steps:
      -
        name: 'Report Node converge'
        labels:
          role: swamp
        writes: true
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ${{ "node-converge-result" }}
          methodName: convergeResult
          inputs:
            folder: '${{ "/tmp/orbit-ansible-" + run.id }}'
