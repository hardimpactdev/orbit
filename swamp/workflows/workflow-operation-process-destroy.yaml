id: 2662a4c2-54ed-43a6-ae0a-adbdd8f2e424
name: operation-process-destroy
queueTimeout: 30
description: Converge one Process through official cfgmgmt and SSH on209.
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [process.destroy]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: process
  target: orbit-node-209
  steps:
  - name: 'Resolve check assets'
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: ${{ "process-assets-" + run.id }}
      methodName: lifecycle
      inputs: {control: '${{ inputs.intent.control }}'}
  - name: 'Make the asset directory'
    target: orbit-node-209
    dependsOn: [{step: 'Resolve check assets', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: &id001 {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{
            inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: &id002 [{name: target, address: '${{
              inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {name: prepare, hosts: [target], argv: [/usr/bin/mkdir, -m, '0700', -p, '${{ "/tmp/orbit-process-" + run.id }}'], sudo: false}
  - name: 'Copy check assets'
    target: orbit-node-209
    dependsOn: [{step: 'Make the asset directory', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: copy
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: scripts, direction: to, hosts: [target], src: '${{ steps["Resolve check assets"].outputs.scripts_directory }}', dst: '${{ "/tmp/orbit-process-" + run.id }}',
        recursive: true}
  - name: 'Inspect the Process'
    target: orbit-node-209
    dependsOn: [{step: 'Copy check assets', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: inspect, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3, '${{
            "/tmp/orbit-process-" + run.id + "/scripts" + "/inspect.py" }}'], sudo: true}
  - name: 'Read the observation'
    target: orbit-node-209
    dependsOn: [{step: 'Inspect the Process', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: ${{ "process-observation-" + run.id }}
      methodName: decode
      inputs: {stdout: '${{ steps["Inspect the Process"].outputs.stdout }}'}
  - name: 'Disable it'
    target: orbit-node-209
    dependsOn: [{step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || !steps["Read the observation"].outputs.present }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-boot-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}', enabled: false}
      inputs: {}
  - name: 'Stop it'
    target: orbit-node-209
    dependsOn: [{step: 'Disable it', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || !steps["Read the observation"].outputs.present }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-stop-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "systemctl stop " + inputs.intent.control.name }}'}
      inputs: {}
  - name: 'Clear failures'
    target: orbit-node-209
    dependsOn: [{step: 'Stop it', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || steps["Read the observation"].outputs.state != "failed" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-reset-failed-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "systemctl reset-failed " + inputs.intent.control.name
          }}'}
      inputs: {}
  - name: 'Remove the unit'
    target: orbit-node-209
    dependsOn: [{step: 'Stop it', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Clear failures', condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-unit-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ "/etc/systemd/system/" + inputs.intent.control.name
          }}', ensure: absent}
      inputs: {}
  - name: 'Remove env files'
    target: orbit-node-209
    dependsOn: [{step: 'Remove the unit', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ "process-environments-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ "/etc/orbit/processes/" + string(inputs.intent.control.process_id)
          }}', ensure: absent}
      inputs: {}
  - name: 'Remove the dev environment'
    target: orbit-node-209
    dependsOn: [{step: 'Remove the unit', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.vite == null }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-vite-environment-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ inputs.intent.control.vite != null ? inputs.intent.control.vite.path
          : "/unused" }}', ensure: absent}
      inputs: {}
  - name: 'Reload systemd'
    target: orbit-node-209
    dependsOn: [{step: 'Remove the unit', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-reload-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: systemctl daemon-reload}
      inputs: {}
  - name: 'Stop the container'
    target: orbit-node-209
    dependsOn: [{step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || !steps["Read the observation"].outputs.present }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-container-stop-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "docker --host=unix:///var/run/docker.sock container
          stop " + inputs.intent.control.name }}'}
      inputs: {}
  - name: 'Remove the container'
    target: orbit-node-209
    dependsOn: [{step: 'Stop the container', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "docker" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-container-remove-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "docker --host=unix:///var/run/docker.sock container
          rm " + inputs.intent.control.name }}'}
      inputs: {}
  - name: 'Clean up'
    target: orbit-node-209
    dependsOn: [{step: 'Reload systemd', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Remove env files', condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}, {step: 'Remove the dev environment', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Remove the container',
        condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: cleanup, hosts: [target], argv: [/usr/bin/rm, -rf, --, '${{ "/tmp/orbit-process-" + run.id }}'], sudo: true}
  - name: 'Report the result'
    target: orbit-node-209
    dependsOn: [{step: 'Clean up', condition: {type: succeeded}}]
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "process-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '%s\n' '{"ready":true}'
