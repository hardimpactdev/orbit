id: e845a696-f34b-55d0-b8c1-e1fc26f83820
name: route-target-retire
description: "route.target_set and route.update: one Node drops the sites, LAN rules and certificates no Route needs."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    kind: {type: string}
    parent_run_id: {type: string, minLength: 1}
    intent: {type: object}
    node_id: {type: integer, minimum: 1}
    signed: {type: array, items: {type: string}}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, kind, parent_run_id, intent, node_id, signed, execution_secrets]
  additionalProperties: false
jobs:
- name: retire
  labels: {role: swamp}
  steps:
    # The Node's whole desired Caddyfile, pools and APP_URL (route-create-site).
  - name: 'site'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire.site_nodes.filter(n, string(n) == string(inputs.node_id)).map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.retire }}'
        node_id: '${{ inputs.node_id }}'
        signed: '${{ inputs.signed }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
    # A LAN rule no Route needs any more.
  - name: 'lan'
    labels: {role: swamp}
    dependsOn:
    - {step: 'site', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: rule, in: '${{ inputs.intent.lan_absent.filter(r, string(r.node_id) == string(inputs.node_id)) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/firewall'
      behaviorName: '${{ ("route-lan-retire-" + string(self.rule.node_id) + "-" + string(self.rule.port) + "-" + self.rule.source.split("/").join("-")).split(".").join("-") }}'
      methodName: apply
      globalArgs: {port: '${{ self.rule.port }}', protocol: '${{ self.rule.protocol }}', action: allow, ensure: absent, source: '${{ self.rule.source }}',
        nodeHost: '${{ inputs.intent.nodes[string(self.rule.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(self.rule.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(self.rule.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(self.rule.node_id)].identity_file }}', become: true}
      inputs: {}
    # A temporary or detached scope: its Caddy and account folders (route-certificate-remove).
  - name: 'certificates'
    labels: {role: swamp}
    dependsOn:
    - {step: 'site', condition: {type: always}}
    - {step: 'lan', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: part, in: '${{ inputs.intent.cleanup.filter(c, string(c.node_id) == string(inputs.node_id)) }}'}
    task:
      type: workflow
      workflowIdOrName: route-certificate-remove
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ inputs.parent_run_id }}'
        restoring: false
        execution_secrets: {}
        intent:
          # No control-Node read: old plans omit it, and this child only needs the captured SSH connection.
          leaf: '${{ self.part.leaf }}'
          host_keys: '${{ inputs.intent.nodes[string(inputs.node_id)].host_keys }}'
          connection: {nodeHost: '${{ inputs.intent.nodes[string(inputs.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(inputs.node_id)].user }}',
            nodePort: '${{ inputs.intent.nodes[string(inputs.node_id)].port }}', nodeIdentityFile: '${{ inputs.intent.nodes[string(inputs.node_id)].identity_file }}'}
