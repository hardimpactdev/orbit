id: 22e84308-c7ae-4c33-90c6-32dfeb970870
name: operation-node-add
description: Enroll a Node with native host observations, Ansible phases for the Node state and frozen role plans.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [node.add]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key:
            type: string
            pattern: ^(bootstrap-identity-node-[1-9][0-9]*|agent-secret-node-[1-9][0-9]*|node-role-operation-[1-9][0-9]*-[a-z-]+|process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: host_key
  labels: {role: swamp}
  steps:
  - name: Read the host key
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-host-key-"+string(inputs.node_id) }}', methodName: collect-host-public-key, globalArgs: {name: '${{
          "node-add-bootstrap-"+string(inputs.node_id) }}', transport: {kind: ssh, hostKeyPolicy: insecure, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port }}', identityContent: '${{
            vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host }}'}]}, inputs: {
        hosts: 'name:target', timeoutSec: 30}}
- name: approval
  labels: {role: swamp}
  steps:
  - name: Require approved host key
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Read the host key"].outputs.fingerprint == inputs.intent.bootstrap.fingerprint', severity: high, message: The observed host key must match the
        approved fingerprint.}
  dependsOn:
  - {job: host_key, condition: {type: succeeded}}
- name: platform
  labels: {role: swamp}
  steps:
  - name: Read the platform
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-platform-"+string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "node-add-platform-"+string(inputs.node_id)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key)
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {
        hosts: 'name:target', argv: [uname, -sm], sudo: false, timeoutSec: 30}}
  dependsOn:
  - {job: approval, condition: {type: succeeded}}
- name: bootstrap_account
  labels: {role: swamp}
  steps:
  - name: Read the bootstrap account
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-bootstrap-account-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-bootstrap-account-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityContent: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets.bootstrap_identity.key) }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host
              }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: '${{ ["getent","passwd",inputs.intent.bootstrap.user]
          }}', sudo: false, timeoutSec: 30}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: platform, condition: {type: succeeded}}
- name: identity
  labels: {role: swamp}
  steps:
  - name: Bind the Node identity
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@nckrtl/node-enrollment-plan', behaviorName: '${{ "node-add-resources-"+string(inputs.node_id) }}', methodName: bind, inputs: {platform: '${{
          inputs.intent.platform }}', expected_architecture: '${{ inputs.intent.expected_architecture }}', observation: '${{ steps["Read the platform"].outputs }}', host_key: '${{ steps["Read
          the host key"].outputs }}', roles: '${{ inputs.intent.roles }}', cli: '${{ inputs.intent.cli }}', bootstrap_user: '${{ inputs.intent.bootstrap.user }}', bootstrap_account: '${{
          inputs.intent.platform == "linux" ? steps["Read the bootstrap account-0"].outputs : null }}', dns: '${{ inputs.intent.dns }}', private_dns: '${{ inputs.intent.private_dns }}'}}
  dependsOn:
  - {job: bootstrap_account, condition: {type: succeeded}}
- name: intent
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
  dependsOn:
  - {job: identity, condition: {type: succeeded}}
- name: private
  labels: {role: swamp}
  steps:
  - name: Write the private input
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-private-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_SSH_FILE"]).write_text(os.environ["ORBIT_SSH_VALUE"].rstrip("\n") + "\n"); pathlib.Path(os.environ["ORBIT_AGENT_FILE"]).write_text(os.environ["ORBIT_AGENT_VALUE"])'' '
        env: {ORBIT_SSH_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/bootstrap-identity" }}', ORBIT_AGENT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-agent_secret" }}',
          ORBIT_SSH_VALUE: '${{ vault.get("orbit-control-inputs", inputs.execution_secrets.bootstrap_identity.key) }}', ORBIT_AGENT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.agent_secret.key) }}'}
  dependsOn:
  - {job: intent, condition: {type: succeeded}}
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ORBIT_KIND: '${{ inputs.kind }}',
          ORBIT_HOST_KEY: '${{ steps["Read the host key"].outputs.publicKey }}', ORBIT_BOOTSTRAP_AUTHORIZED_KEYS: '${{ steps["Bind the Node identity"].outputs.bootstrap_authorized_keys
            }}'}
  dependsOn:
  - {job: private, condition: {type: succeeded}}
- name: baseline
  labels: {role: swamp}
  steps:
  - name: Set up the machine
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-baseline-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags baseline "$ORBIT_ANSIBLE/operation-node-add.yml"
        env: &ansible {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{
            steps["Write the intent"].outputs.assets + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null
              -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}', ANSIBLE_FORCE_COLOR: '0'}
  dependsOn:
  - {job: input, condition: {type: succeeded}}
- name: tunnel
  labels: {role: swamp}
  steps:
  - name: Set up the tunnel
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-tunnel-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags tunnel "$ORBIT_ANSIBLE/operation-node-add.yml"
        env: *ansible
  dependsOn:
  - {job: baseline, condition: {type: succeeded}}
- name: tunnel_key
  labels: {role: swamp}
  steps:
  - name: Read WireGuard public key
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-tunnel-public-key-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "node-add-tunnel-public-key-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.bootstrap.user }}', port: '${{ inputs.intent.bootstrap.port
            }}', identityFile: '${{ inputs.intent.identity.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.bootstrap.host }}', transport: {hostKeys: '${{ [steps["Read
              the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: [wg, show, orbit, public-key], sudo: true, timeoutSec: 30}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: tunnel, condition: {type: succeeded}}
- name: hub
  labels: {role: swamp}
  steps:
  - name: Add the peer
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" || inputs.intent.network.hubs.size() == 0 }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-hub-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "node_public_key=$ORBIT_NODE_PUBLIC_KEY" --tags hub "$ORBIT_ANSIBLE/operation-node-add.yml"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{ steps["Write the intent"].outputs.assets
            + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-"
            + run.id + "/known_hosts" }}', ANSIBLE_FORCE_COLOR: '0', ORBIT_NODE_PUBLIC_KEY: '${{ steps["Read WireGuard public key-0"].outputs.stdout.trim() }}'}
  dependsOn:
  - {job: tunnel_key, condition: {type: succeeded}}
- name: agent
  labels: {role: swamp}
  steps:
  - name: Install the Node agent
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-agent-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags agent "$ORBIT_ANSIBLE/operation-node-add.yml"
        env: *ansible
  dependsOn:
  - {job: hub, condition: {type: succeeded}}
- name: managed
  labels: {role: swamp}
  steps:
  - name: Verify managed access
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-managed-access-"+string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "node-add-managed-access-"+string(inputs.node_id)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.managed_user }}', port: 22, identityFile: '${{ inputs.intent.identity.identity_file }}'}, hosts: [{name: target, address: '${{
              inputs.intent.address }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target', argv: [uname, -sm], sudo: '${{
          inputs.intent.platform == "linux" }}', timeoutSec: 30}}
  dependsOn:
  - {job: agent, condition: {type: succeeded}}
- name: cli
  labels: {role: swamp}
  steps:
  - name: Publish the Orbit CLI
    labels: {role: swamp}
    writes: true
    allowFailure: true
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" && inputs.intent.cli != null && inputs.intent.cli.cli.skip_reason == null && inputs.intent.cli.cli.plan_error == null ? [0] : [] }}'
    task: {type: workflow, workflowIdOrName: node-cli-install, inputs: {node_id: '${{ inputs.node_id }}', intent: '${{ steps["Bind the Node identity"].outputs.cli }}'}}
  dependsOn:
  - {job: managed, condition: {type: succeeded}}
- name: roles
  labels: {role: swamp}
  steps:
  - name: Converge each role
    labels: {role: swamp}
    task: {type: workflow, workflowIdOrName: operation-node-role-add, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ self.role.kind
          }}', intent: '${{ self.role.intent }}', execution_secrets: '${{ self.role.execution_secrets }}', parent_run_id: '${{ run.id }}'}}
    writes: true
    forEach:
      item: role
      in: ${{ steps["Bind the Node identity"].outputs.roles }}
    concurrency: 1
  dependsOn:
  - {job: cli, condition: {type: completed}}
- name: dns_backend
  labels: {role: swamp}
  steps:
  - name: Configure DNS backend
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" || inputs.intent.private_dns.size() == 0 }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-dns-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags dns "$ORBIT_ANSIBLE/operation-node-add.yml"
        env: *ansible
  dependsOn:
  - {job: roles, condition: {type: succeeded}}
- name: dns_listener
  labels: {role: swamp}
  dependsOn:
  - {job: dns_backend, condition: {type: succeeded}}
  steps:
  - name: Install DNS listener
    labels: {role: swamp}
    writes: true
    forEach:
      item: dns
      in: ${{ steps["Bind the Node identity"].outputs.private_dns }}
    task: {type: workflow, workflowIdOrName: node-private-dns, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ self.dns.node_id }}', kind: '${{ inputs.kind }}', intent: '${{
          self.dns }}'}}
- name: dns_publish
  labels: {role: swamp}
  steps:
  - name: Publish private DNS
    labels: {role: swamp}
    task: {type: workflow, workflowIdOrName: route-dns-publish, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{
          self.publication }}', execution_secrets: {}}}
    writes: true
    forEach:
      item: publication
      in: ${{ steps["Bind the Node identity"].outputs.dns }}
  dependsOn:
  - {job: dns_listener, condition: {type: succeeded}}
- name: mac
  labels: {role: swamp}
  steps:
  - name: Inspect the Mac tunnel
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-mac-tunnel-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {name: '${{
          "node-add-mac-tunnel-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.managed_user }}', port: 22, identityFile: '${{ inputs.intent.identity.identity_file
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.address }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target',
        argv: [ifconfig], sudo: false, timeoutSec: 30}}
    forEach:
      item: mac
      in: '${{ inputs.intent.platform == "macos" ? [0] : [] }}'
  dependsOn:
  - {job: dns_publish, condition: {type: succeeded}}
- name: state
  labels: {role: swamp}
  steps:
  - name: Check the Node state
    labels: {role: swamp}
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-check-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags check "$ORBIT_ANSIBLE/operation-node-add.yml"
        env: *ansible
  dependsOn:
  - {job: mac, condition: {type: succeeded}}
- name: node
  labels: {role: swamp}
  steps:
  - name: Check the Node
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Verify managed access"].outputs.stdout.trim() == steps["Read the platform"].outputs.stdout.trim() && (inputs.intent.platform != "macos" || steps["Inspect the Mac tunnel-0"].outputs.stdout.contains("inet
        "+inputs.intent.address+" "))', severity: high, message: 'Managed access, architecture and the admitted platform resources must match.'}
  dependsOn:
  - {job: state, condition: {type: succeeded}}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: host_key, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: approval, condition: *settled}
  - {job: platform, condition: *settled}
  - {job: bootstrap_account, condition: *settled}
  - {job: identity, condition: *settled}
  - {job: intent, condition: *settled}
  - {job: private, condition: *settled}
  - {job: input, condition: *settled}
  - {job: baseline, condition: *settled}
  - {job: tunnel, condition: *settled}
  - {job: tunnel_key, condition: *settled}
  - {job: hub, condition: *settled}
  - {job: agent, condition: *settled}
  - {job: managed, condition: *settled}
  - {job: cli, condition: *settled}
  - {job: roles, condition: *settled}
  - {job: dns_backend, condition: *settled}
  - {job: dns_listener, condition: *settled}
  - {job: dns_publish, condition: *settled}
  - {job: mac, condition: *settled}
  - {job: state, condition: *settled}
  - {job: node, condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.platform != "linux" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-node-add-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
