id: 09fb7a5a-6b19-4fb6-8f14-16382563f822
name: observation-horizon
description: Run the bounded Orbit observation horizon pass.
autoResume: true
concurrency: 1
trigger:
  schedule: "45 */10 * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: observation
    steps:
      - name: health
        target: orbit-node-209
        labels: { node: "209" }
        task:
          type: behavior
          behaviorType: "@nckrtl/observation"
          behaviorName: observation-horizon
          methodName: health
          inputs:
            runId: "${{ run.id }}"
