id: 2c8195ba-b28b-4bb1-9c65-abda5b48a477
name: operation-database-user-create
queueTimeout: 30
description: database:user:create from 209, one docker exec -i per batch; each login reads its password from the vault as the first stdin line.
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database_user.create}
    intent: {type: object}
    # Names only: apply (the admin password line and the batch) and check (the user's password line and its check),
    # each one whole value.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-user-create-(apply|check)-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: user
  labels: {role: swamp}
  steps:
    # One batch: the checks, the login, then the exact grants. A non-logical WAL level for a replication login or a
    # foreign PostgreSQL role stops it before any change and prints its code for the Gateway.
  - name: 'Apply login and grants'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-user-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "120"] + inputs.intent.admin_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.apply.vault, inputs.execution_secrets.apply.key) }}
        okExitCodes: [0, 1, 3]
        timeoutSec: 130
    # The user logs in over TCP with its own password; only then is it recorded.
  - name: 'Check the user'
    labels: {role: swamp}
    dependsOn: [{step: 'Apply login and grants', condition: {type: succeeded}}]
    guard: '${{ steps["Apply login and grants"].outputs.exitCode != 0 }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-user-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60"] + inputs.intent.user_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.check.vault, inputs.execution_secrets.check.key) }}
        okExitCodes: [0, 1, 2]
        timeoutSec: 70
