---
# The outer VM is the operator of its nested fleet, at `intent.fleet.operator.address`, and the candidate CLI talks to the nested Gateway
# through the profile `nested`. The key belongs to the nested network only and stays in the image: every VM from it has its own fleet, so
# the key reaches nothing else. The tunnel is a wg-quick unit, so it comes up at every boot. Runs when the fleet intent or the role changed.
- name: Look for the operator key
  ansible.builtin.stat: { path: /etc/wireguard/wg-nested.key }
  register: fleet_operator_key
- name: Make the operator key
  when: not fleet_operator_key.stat.exists
  ansible.builtin.command: { argv: [wg, genkey] }
  register: fleet_operator_new
  no_log: true
  changed_when: true
- name: Store the operator key
  when: not fleet_operator_key.stat.exists
  ansible.builtin.copy: { dest: /etc/wireguard/wg-nested.key, content: "{{ fleet_operator_new.stdout }}\n", mode: "0600" }
  no_log: true
- name: Read the operator key
  ansible.builtin.slurp: { src: /etc/wireguard/wg-nested.key }
  register: fleet_operator_private
  no_log: true
- name: Read the operator public key
  ansible.builtin.command: { argv: [wg, pubkey], stdin: "{{ fleet_operator_private.content | b64decode | trim }}" }
  register: fleet_operator_public
  no_log: true
  changed_when: false
- name: Read the database of the nested Gateway
  ansible.builtin.command:
    argv: [incus, exec, "{{ fleet_guests.gateway }}", --, grep, -m1, "^DB_DATABASE=", /var/lib/orbit-checkout-state/apps/gateway/.env]
  register: fleet_database
  changed_when: false
- name: Record the operator key in the nested Gateway
  ansible.builtin.command:
    argv: [incus, exec, "{{ fleet_guests.gateway }}", --, sqlite3, "{{ fleet_database.stdout.split('=', 1)[1] | trim }}",
           "update nodes set wireguard_public_key = '{{ fleet_operator_public.stdout | trim }}' where name = 'operator';
           select id from nodes where name = 'operator'"]
  register: fleet_operator_id
  changed_when: true
- name: Write the operator peer on the nested hub
  ansible.builtin.command:
    argv: [incus, file, push, --mode, "0600", "-", "{{ fleet_guests.gateway }}/etc/wireguard/orbit-peers.d/{{ fleet_operator_id.stdout | trim }}.conf"]
    stdin: "[Peer]\n# operator\nPublicKey = {{ fleet_operator_public.stdout | trim }}\nAllowedIPs = {{ intent.fleet.operator.address }}/32\n"
  changed_when: true
- name: Restart the nested hub
  ansible.builtin.command: { argv: [timeout, "120", incus, exec, "{{ fleet_guests.gateway }}", --, systemctl, restart, wg-quick@orbit] }
  changed_when: true
- name: Read the nested hub key
  ansible.builtin.command: { argv: [incus, exec, "{{ fleet_guests.gateway }}", --, wg, show, orbit, public-key] }
  register: fleet_hub_key
  changed_when: false
- name: Write the operator tunnel
  ansible.builtin.copy:
    dest: /etc/wireguard/wg-nested.conf
    mode: "0600"
    content: |
      [Interface]
      PostUp = wg set %i private-key /etc/wireguard/wg-nested.key
      Address = {{ intent.fleet.operator.address }}/{{ intent.fleet.operator.network.split('/')[1] }}
      ListenPort = 51821

      [Peer]
      PublicKey = {{ fleet_hub_key.stdout | trim }}
      Endpoint = {{ fleet_ready_gateway_ipv4 }}:51820
      AllowedIPs = {{ intent.fleet.operator.network }}
      PersistentKeepalive = 25
  vars:
    fleet_ready_gateway_ipv4: "{{ (fleet_now | selectattr('name', 'eq', fleet_guests.gateway) | first).expanded_devices.eth0['ipv4.address'] }}"
- name: Bring up the operator tunnel
  ansible.builtin.systemd: { name: wg-quick@wg-nested.service, enabled: true, state: restarted }
- name: Check the operator tunnel
  ansible.builtin.command: { argv: [timeout, "30", ping, -c, "1", -w, "20", "{{ intent.fleet.operator.hub }}"] }
  changed_when: false
# The candidate CLI on the outer VM talks to the nested Gateway as the operator, through the profile `nested`.
- name: Make the CLI home
  ansible.builtin.file: { path: "{{ orbit_home }}/.orbit", state: directory, owner: "{{ orbit_user }}", group: "{{ orbit_user }}", mode: "0700" }
- name: Read the nested CA
  ansible.builtin.command: { argv: [incus, exec, "{{ fleet_guests.gateway }}", --, cat, /home/orbit/.orbit/ca/root.pem] }
  register: fleet_ca
  changed_when: false
  failed_when: "'BEGIN CERTIFICATE' not in fleet_ca.stdout"
- name: Pin the nested CA
  ansible.builtin.copy:
    dest: "{{ orbit_home }}/.orbit/nested-ca.pem"
    content: "{{ fleet_ca.stdout }}\n"
    owner: "{{ orbit_user }}"
    group: "{{ orbit_user }}"
    mode: "0644"
- name: Add the CLI profile
  become: true
  become_user: "{{ orbit_user }}"
  ansible.builtin.command:
    argv:
      [timeout, "120", php, "{{ intent.checkout.path }}/apps/cli/orbit", gateway:add, "{{ intent.fleet.operator.hub }}", --name=nested, --use,
       --accept-ca-change, "--ca={{ orbit_home }}/.orbit/nested-ca.pem", --json]
  environment: { HOME: "{{ orbit_home }}", ORBIT_HOME: "{{ orbit_home }}/.orbit" }
  changed_when: true
- { name: Record the operator, ansible.builtin.import_tasks: task-vm-stamp.yml, vars: { stamp: operator } }
