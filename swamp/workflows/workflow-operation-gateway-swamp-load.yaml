id: 04961808-4346-47a8-aa0e-6e44f1d0cf5a
name: operation-gateway-swamp-load
description: Check out a release, write Gateway-rendered grants with official file resources, and confirm serve loaded it.
queueTimeout: 120
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [gateway.swamp_load]}
    intent:
      type: object
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        restore: {type: boolean}
        grants:
          type: object
          properties:
            grants/orbit-gateway.yaml: {type: string}
            grants/orbit-serve.yaml: {type: string}
          required: [grants/orbit-gateway.yaml, grants/orbit-serve.yaml]
          additionalProperties: false
        ssh: {type: object}
      required: [sha, grants, ssh]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: load
    steps:
      - name: checkout
        labels: {role: swamp}
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "gateway-swamp-checkout" }}'
          methodName: execute
          inputs:
            env: {RELEASE_SHA: '${{ inputs.intent.sha }}', RESTORE: '${{ has(inputs.intent.restore) && inputs.intent.restore ? "true" : "false" }}'}
            run: |
              set -eu
              cd /home/orbit/apps/orbit-monorepo-staging/checkout
              previous=$(git rev-parse HEAD)
              timeout 120 git fetch --quiet origin "$RELEASE_SHA"
              # A restore puts an older commit back, so only a load moves forward.
              [ "$RESTORE" = true ] || git merge-base --is-ancestor "$previous" "$RELEASE_SHA"
              git checkout --quiet --detach "$RELEASE_SHA"
              test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
              printf '%s\n' "$previous"
      - name: grants
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: checkout, condition: {type: succeeded}}]
        forEach: {item: grant, in: '${{ ["gateway", "serve"] }}'}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("release-" + self.grant + "-grants-209").split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: '${{ inputs.intent.ssh.target.host }}'
            nodeUser: '${{ inputs.intent.ssh.target.user }}'
            nodePort: '${{ inputs.intent.ssh.target.port }}'
            nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}'
            become: true
            path: '${{ "/home/orbit/apps/orbit-monorepo-staging/checkout/swamp/grants/orbit-" + self.grant + ".yaml" }}'
            ensure: present
            content: '${{ inputs.intent.grants["grants/orbit-" + self.grant + ".yaml"] }}'
            owner: orbit
            group: orbit
            mode: '0640'
          inputs: {}
      - name: load
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: grants, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "gateway-swamp-load" }}'
          methodName: execute
          inputs:
            env:
              RELEASE_SHA: '${{ inputs.intent.sha }}'
              PREVIOUS_SHA: '${{ steps.checkout.outputs.stdout.trim() }}'
            # Reload workflows, extensions (with their additionalFiles) and grants, then compare served workflows with the
            # target commit.
            run: |
              set -eu
              export HOME=/home/orbit SWAMP_HOME=/home/orbit/.swamp SWAMP_CONFIG_DIR=/home/orbit/.config/swamp
              export SWAMP_API_KEY_FILE=/home/orbit/.config/swamp/api-key SWAMP_NO_UPDATE_CHECK=1 SWAMP_NO_TELEMETRY=1
              cd /home/orbit/apps/orbit-monorepo-staging/checkout
              timeout 120 /usr/local/bin/swamp serve reload --server ws://127.0.0.1:9418 \
                --token-file /home/orbit/.config/swamp/serve-driver-token --json \
                | jq -e '.success == true and ((.errors // []) | length) == 0' >/dev/null
              timeout 90 /usr/local/bin/swamp access reload --server ws://127.0.0.1:9418 \
                --token-file /home/orbit/.config/swamp/serve-driver-token --json | jq -e '.success == true' >/dev/null
              # Schedules write their own schedule-<uuid> workflows into serve at any time; only the commit's are compared.
              tracked='[.results[] | select(.name | test("^schedule-[0-9a-f-]{36}$") | not) | [.id, .name]] | sort'
              disk=$(timeout 60 /usr/local/bin/swamp workflow list --repo-dir swamp --json | jq -ec "$tracked")
              live=$(timeout 60 /usr/local/bin/swamp workflow list --server ws://127.0.0.1:9418 \
                --token-file /home/orbit/.config/swamp/serve-driver-token --json | jq -ec "$tracked")
              test "$disk" = "$live"
              jq -cn --arg sha "$RELEASE_SHA" --arg previous "$PREVIOUS_SHA" --argjson workflows "$(printf '%s' "$live" | jq length)" \
                '{sha: $sha, previous: $previous, workflows: $workflows}'
