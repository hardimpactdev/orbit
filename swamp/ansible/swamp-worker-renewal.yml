---
- name: Renew one of three persistent Swamp workers
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    renewal_swamp_binary: /usr/local/bin/swamp
    renewal_accepting: [idle, busy]
    renewal_session_seconds: 28800
    renewal_round_seconds: 5400
    renewal_due_seconds: 10800
    renewal_slots: [a, b, c]
    renewal_capacity: "{{ ansible_processor_vcpus }}"
  tasks:
    - name: Read the CPU count used by auto concurrency
      ansible.builtin.setup:
        gather_subset: ["!all", "!min", hardware]
        filter: ansible_processor_vcpus
    - name: Find the worker account home
      ansible.builtin.getent:
        database: passwd
        key: "{{ orbit_user }}"
    - name: Set the official CLI environment
      ansible.builtin.set_fact:
        renewal_home: "{{ ansible_facts.getent_passwd[orbit_user][4] }}"
    - name: Use the existing worker account credentials
      ansible.builtin.set_fact:
        renewal_remote:
          - --server
          - http://127.0.0.1:9418
          - --token-file
          - "{{ renewal_home }}/.config/swamp/serve-driver-token"
          - --json
        renewal_environment:
          HOME: "{{ renewal_home }}"
          SWAMP_HOME: "{{ renewal_home }}/.swamp"
          SWAMP_CONFIG_DIR: "{{ renewal_home }}/.config/swamp"
          SWAMP_API_KEY_FILE: "{{ renewal_home }}/.config/swamp/api-key"
          SWAMP_NO_UPDATE_CHECK: '1'
          SWAMP_NO_TELEMETRY: '1'
    # Bootstrap and remint use different token names. The units carry only file paths.
    - name: Read the latest enrollment receipt of each worker unit
      ansible.builtin.command:
        argv:
          - timeout
          - '10'
          - journalctl
          - "--unit=orbit-swamp-worker@{{ item }}.service"
          - '--grep=Enrolled as '
          - --lines=1
          - --output=cat
          - --no-pager
          - --quiet
      loop: "{{ renewal_slots }}"
      register: renewal_receipts
      changed_when: false
      failed_when: false
      no_log: true
    - name: Resolve the real pool names from the enrollment receipts
      ansible.builtin.set_fact:
        renewal_names: >-
          {{ renewal_names | default({}) | combine({item.item:
            (item.stdout | default('') | regex_replace('\x1b\[[0-9;]*m', '')
            | regex_findall('Enrolled as "?([^"\s]+)"?') | first | default(''))
            if item.rc | default(-1) in [0, 1] else ''}) }}
      loop: "{{ renewal_receipts.results }}"
      loop_control: {label: "{{ item.item }}"}
    - name: Require three distinct enrollment names before maintenance
      ansible.builtin.assert:
        that:
          - renewal_names.values() | reject('equalto', '') | unique | length == 3
        fail_msg: >-
          Worker renewal stopped: cannot resolve all three unit names from enrollment journals.
          The eight-hour session cap can still abort active dispatches.
          No worker was drained; retry in five minutes
    - name: Read the three permanent workers
      ansible.builtin.command:
        argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_list
      changed_when: false
      no_log: true
    - name: Select the permanent pool
      ansible.builtin.set_fact:
        renewal_pool: >-
          {{ (renewal_list.stdout | from_json).workers
          | selectattr('name', 'in', renewal_names.values() | list) | list }}
    - name: Require all three workers to be connected before renewal
      ansible.builtin.assert:
        that:
          - renewal_pool | length == 3
          - renewal_pool | selectattr('status', 'in', renewal_accepting) | selectattr('instanceUuid') | list | length == 3
        fail_msg: >-
          Worker renewal stopped: all three permanent workers must be connected before maintenance.
          No worker was drained; the eight-hour cap risk remains, retry in five minutes
    - name: Select the oldest worker and its unit
      ansible.builtin.set_fact:
        renewal_current: "{{ renewal_pool | sort(attribute='enrolledAt') | first }}"
    - name: Resolve the target and its two peers
      ansible.builtin.set_fact:
        renewal_slot: "{{ (renewal_names | dict2items | selectattr('value', 'equalto', renewal_current.name) | first).key }}"
        renewal_peers: "{{ renewal_pool | rejectattr('name', 'equalto', renewal_current.name) | list }}"
    - name: Read the current time
      ansible.builtin.setup:
        gather_subset: ["!all", "!min", date_time]
        filter: ansible_date_time
    - name: Renew the oldest due worker only
      ansible.builtin.include_tasks: tasks/swamp-worker-renew-slot.yml
      when: >-
        ((ansible_date_time.epoch | int) -
        (renewal_current.enrolledAt | regex_replace('Z$', '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).timestamp()) >= renewal_due_seconds
