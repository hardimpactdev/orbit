id: 2727d715-8ff0-48b3-b1ac-57656432fcf4
name: node-removal-retirement
description: Retire one admitted observer and worker over the existing off-worker pinned SSH boundary.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    executor_node_id:
      type: integer
      minimum: 1
    target:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        user:
          type: string
        fingerprint:
          type: string
      required:
      - node_id
      - host
      - port
      - user
      - fingerprint
      additionalProperties: false
    host_key:
      type: string
    execution_secrets:
      type: object
      properties:
        bootstrap_identity:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^bootstrap-identity-node-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - bootstrap_identity
      additionalProperties: false
  required:
  - operation_id
  - executor_node_id
  - target
  - host_key
  - execution_secrets
  additionalProperties: false
jobs:
- name: retirement
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-removal-retirement-assets'
      behaviorName: ${{ "remove-assets-" + string(inputs.operation_id) }}
      methodName: read
      inputs: {}
  - name: verify-admitted-target
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "remove-" + string(inputs.operation_id) + "-verify-target" }}
      methodName: execute
      inputs:
        run: |
          exec /usr/bin/python3 "${{ steps.assets.outputs.verify_admitted_target }}"
        env:
          ORBIT_EXECUTOR_NODE: ${{ string(inputs.executor_node_id) }}
          ORBIT_TARGET_HOST: ${{ inputs.target.host }}
          ORBIT_TARGET_PORT: ${{ string(inputs.target.port) }}
          ORBIT_TARGET_USER: ${{ inputs.target.user }}
          ORBIT_TARGET_NODE: ${{ string(inputs.target.node_id) }}
          ORBIT_TARGET_KEY: ${{ inputs.host_key }}
          ORBIT_TARGET_FINGERPRINT: ${{ inputs.target.fingerprint }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: verify-node-identity
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "remove-" + string(inputs.operation_id) + "-verify-node-identity" }}
      methodName: execute
      inputs:
        run: |
          exec /usr/bin/python3 "${{ steps.assets.outputs.verify_node_identity }}"
        timeout: 120000
        env:
          ORBIT_EXECUTOR_NODE: ${{ string(inputs.executor_node_id) }}
          ORBIT_TARGET_HOST: ${{ inputs.target.host }}
          ORBIT_TARGET_PORT: ${{ string(inputs.target.port) }}
          ORBIT_TARGET_USER: ${{ inputs.target.user }}
          ORBIT_TARGET_NODE: ${{ string(inputs.target.node_id) }}
          ORBIT_TARGET_KEY: ${{ inputs.host_key }}
          ORBIT_TARGET_FINGERPRINT: ${{ inputs.target.fingerprint }}
          ORBIT_SSH_IDENTITY: ${{ vault.get(inputs.execution_secrets.bootstrap_identity.vault, inputs.execution_secrets.bootstrap_identity.key)
            }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    - step: verify-admitted-target
      condition:
        type: succeeded
  - name: retirement-view
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    dependsOn:
    - step: verify-node-identity
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/node-removal-retirement-view'
      behaviorName: ${{ "remove-view-" + string(inputs.operation_id) }}
      methodName: decode
      inputs:
        stdout: ${{ steps["verify-node-identity"].outputs.stdout }}
  - name: disable-worker
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "remove-" + string(inputs.operation_id) + "-disable-worker" }}
      methodName: execute
      inputs:
        run: |
          exec /usr/bin/python3 "${{ steps.assets.outputs.disable_worker }}"
        timeout: 120000
        env:
          ORBIT_EXECUTOR_NODE: ${{ string(inputs.executor_node_id) }}
          ORBIT_TARGET_HOST: ${{ inputs.target.host }}
          ORBIT_TARGET_PORT: ${{ string(inputs.target.port) }}
          ORBIT_TARGET_USER: ${{ inputs.target.user }}
          ORBIT_TARGET_NODE: ${{ string(inputs.target.node_id) }}
          ORBIT_TARGET_KEY: ${{ inputs.host_key }}
          ORBIT_TARGET_FINGERPRINT: ${{ inputs.target.fingerprint }}
          ORBIT_SSH_IDENTITY: ${{ vault.get(inputs.execution_secrets.bootstrap_identity.vault, inputs.execution_secrets.bootstrap_identity.key)
            }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    - step: verify-admitted-target
      condition:
        type: succeeded
    - step: verify-node-identity
      condition:
        type: succeeded
    - step: retirement-view
      condition:
        type: succeeded
    guard: ${{ !steps["retirement-view"].outputs.worker_present }}
  - name: stop-worker
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "remove-" + string(inputs.operation_id) + "-stop-worker" }}
      methodName: execute
      inputs:
        run: |
          exec /usr/bin/python3 "${{ steps.assets.outputs.stop_worker }}"
        timeout: 120000
