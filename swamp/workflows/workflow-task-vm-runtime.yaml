id: ecba7071-63ee-4dbf-a293-b2d60c476a2e
name: task-vm-runtime
description: Install the pinned Pi artifact, the Orbit root, Pi credentials and its Process in the guest with pinned official SSH from 209; no script reaches the guest.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: runtime
  labels: {role: swamp}
  steps:
  - name: Fetch the Pi build
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-pi-source-" + string(inputs.intent.pi_artifact.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        name: '${{ ("vm-pi-source-" + string(inputs.intent.pi_artifact.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.pi_artifact.ssh_execution.target.user }}
          port: ${{ inputs.intent.pi_artifact.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.pi_artifact.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.pi_artifact.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.pi_artifact.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ inputs.intent.pi_artifact.path }}
        dst: ${{ "/tmp/orbit-pi-" + run.id + ".bin" }}
        direction: from
  - name: Check the Pi build
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "vm-runtime-local" }}'
      methodName: execute
      inputs:
        # The pinned digest, checked on 209 before anything reaches the guest.
        run: printf '%s  %s\n' "$ORBIT_SHA" "$ORBIT_STAGE" | sha256sum -c --quiet
        env:
          ORBIT_SHA: ${{ inputs.intent.pi_artifact.sha256 }}
          ORBIT_STAGE: ${{ "/tmp/orbit-pi-" + run.id + ".bin" }}
    dependsOn:
    - step: Fetch the Pi build
      condition:
        type: succeeded
  - name: Copy the Pi build
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: copy
      globalArgs: &guest
        name: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-pi-" + run.id + ".bin" }}
        dst: ${{ "/tmp/orbit-pi-" + run.id + ".bin" }}
        direction: to
    dependsOn:
    - step: Check the Pi build
      condition:
        type: succeeded
    writes: true
  - name: Install the Pi server
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        # The guest checks the same digest before it installs the build for the managed account.
        argv: '${{ ["sh", "-c", "printf \"%s  %s\\n\" \"$1\" \"$2\" | sha256sum -c --quiet && install -d -m 0755 -o orbit -g orbit /home/orbit/.local /home/orbit/.local/bin && install -m 0755 -o orbit -g orbit \"$2\" /home/orbit/.local/bin/pi-server; s=$?; rm -f -- \"$2\"; exit $s", "sh", inputs.intent.pi_artifact.sha256, "/tmp/orbit-pi-" + run.id + ".bin"] }}'
    dependsOn:
    - step: Copy the Pi build
      condition:
        type: succeeded
    writes: true
  - name: Trust the Orbit root
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        argv: [sh, -c, 'install -D -m 0644 -o root -g root /dev/stdin /usr/local/share/ca-certificates/orbit-root.crt && timeout 45 update-ca-certificates']
        stdin: ${{ inputs.intent.certificate }}
    dependsOn:
    - step: Install the Pi server
      condition:
        type: succeeded
    writes: true
  - name: Write the Pi models
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        # The Gateway renders the whole file, with the VM's model key, as one vault value.
        argv: [sh, -c, 'install -d -m 0700 -o orbit -g orbit /home/orbit/.pi /home/orbit/.pi/agent && install -m 0600 -o orbit -g orbit /dev/stdin /home/orbit/.pi/agent/models.json']
        stdin: ${{ vault.get(inputs.execution_secrets.pi_models.vault, inputs.execution_secrets.pi_models.key) }}
    dependsOn:
    - step: Trust the Orbit root
      condition:
        type: succeeded
    writes: true
  - name: Write the Pi token
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        argv: [install, -m, '0600', -o, orbit, -g, orbit, /dev/stdin, /home/orbit/.pi/agent/orbit-token]
        stdin: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
    dependsOn:
    - step: Write the Pi models
      condition:
        type: succeeded
    writes: true
  - name: Install the Pi service
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        argv: [install, -D, -m, '0644', -o, root, -g, root, /dev/stdin, '${{ inputs.intent.runtime.process.unit_path }}']
        stdin: ${{ inputs.intent.process_unit }}
    dependsOn:
    - step: Write the Pi token
      condition:
        type: succeeded
    writes: true
  - name: Restart the Pi server
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        argv: [sh, -c, 'systemctl daemon-reload && systemctl enable "$1" && systemctl restart "$1"', sh, '${{ inputs.intent.runtime.process.unit_name }}']
    dependsOn:
    - step: Install the Pi service
      condition:
        type: succeeded
    writes: true
  - name: Check the Pi service
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        argv: [systemctl, is-active, --quiet, '${{ inputs.intent.runtime.process.unit_name }}']
    dependsOn:
    - step: Restart the Pi server
      condition:
        type: succeeded
  - name: Probe the Pi server
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-runtime-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        sudo: true
        # The bearer goes to curl as a header file on a pipe; it never appears in an argument.
        argv: [timeout, '30', bash, -c, 'curl -fsS -o /dev/null --max-time 10 -H @<(printf "Authorization: Bearer %s" "$(cat /home/orbit/.pi/agent/orbit-token)") "$1/capabilities"', bash, '${{ inputs.intent.pi_url }}']
    dependsOn:
    - step: Check the Pi service
      condition:
        type: succeeded
  - name: Remove the staged build
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "vm-runtime-local" }}'
      methodName: execute
      inputs:
        run: rm -f -- "$ORBIT_STAGE"
        env:
          ORBIT_STAGE: ${{ "/tmp/orbit-pi-" + run.id + ".bin" }}
    # Runs after the last step that ran, whatever its outcome, so a refused build leaves nothing on 209.
    dependsOn:
    - step: Probe the Pi server
      condition:
        type: always
    - step: Fetch the Pi build
      condition:
        type: completed
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "vm-runtime-local" }}'
      methodName: execute
      inputs:
        run: printf '{"task_vm_id":%s,"guest_node_id":%s,"process_id":%s,"ready":true}\n' "$ORBIT_VM_ID" "$ORBIT_GUEST_ID" "$ORBIT_PROCESS_ID"
        env:
          ORBIT_VM_ID: ${{ string(inputs.intent.task_vm_id) }}
          ORBIT_GUEST_ID: ${{ string(inputs.intent.guest_node_id) }}
          ORBIT_PROCESS_ID: ${{ string(inputs.intent.runtime.process.process_id) }}
    dependsOn:
    - step: Probe the Pi server
      condition:
        type: succeeded
