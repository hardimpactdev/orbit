id: 3effe849-5048-45ba-8a9a-6bc62ef70c57
name: gateway-release-activate
description: Switch the Gateway to a built release, verify it and resume its cleanups; the release run starts it from the new commit's definition.
# A failed check switches back to the previous release; migrations are expand and contract, so it runs on the new
# schema (docs/reference/gateway-recovery.md#release-as-a-swamp-run).
queueTimeout: 120
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: gateway.release}
    intent:
      type: object
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        id: {type: string, pattern: '^[a-f0-9]{12}$'}
        previous: {type: string, pattern: '^[a-f0-9]{12}$'}
        horizon_unit: {type: string, pattern: '^$|^[A-Za-z0-9@_.-]+\.service$'}
        horizon_drain_seconds: {type: integer, minimum: 1, maximum: 3600}
        keep: {type: integer, minimum: 2, maximum: 20}
        ssh: {type: object}
      required: [sha, id, previous, horizon_unit, horizon_drain_seconds, keep, ssh]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: activate
  labels: {role: swamp}
  steps:
    # Horizon's running jobs finish on the release they started on. The unit stops the master with SIGTERM, never sends SIGKILL and
    # waits as long as the drain allows (GatewayHorizon::stopDirectives), so the stop returns when the unit's whole control group
    # is empty. A unit without that policy would kill a running job, so the step refuses it. When the drain runs out, systemd
    # times out twice and leaves the unit failed, so the step allows twice the drain and then checks that the unit is inactive.
  - name: Drain Horizon
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.horizon_unit == "" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-horizon-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ "gateway-release-ssh-" + string(inputs.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: ${{ inputs.intent.horizon_drain_seconds + inputs.intent.horizon_drain_seconds + 60 }}
        argv:
        - /bin/sh
        - -c
        - |
          set -u
          [ "$(systemctl show -p KillMode -p SendSIGKILL "$1" | sort | tr '\n' ' ')" = 'KillMode=mixed SendSIGKILL=no ' ] \
            || { echo "gateway.release_horizon_unit_stale: $1 lacks the stop policy; update the Horizon Process" >&2; exit 1; }
          systemctl stop "$1" || :
          [ "$(systemctl show -p ActiveState --value "$1")" = inactive ] || { echo "gateway.release_horizon_not_drained: $1 is not stopped" >&2; exit 1; }
        - sh
        - ${{ inputs.intent.horizon_unit }}
    # The release's own switch script, as an operator's rollback uses it: the links, a PHP-FPM reload and a restart of
    # the running services under the application, such as the scheduler and agent-view. Horizon starts after its drain.
    # A scheduler start pauses the release cleanups, so it first prints their generations for the cleanup step.
  - name: Switch the release
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Drain Horizon, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-switch-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: 180
        argv:
        - /usr/bin/timeout
        - '150'
        - /bin/sh
        - -c
        - |
          set -eu
          release=/home/orbit/releases/$1
          [ "$(cat "$release/REVISION" 2>/dev/null)" = "$2" ] || { echo "gateway.release_not_prepared: release $1 is not sealed" >&2; exit 1; }
          generations=$(runuser -u orbit -- php8.5 "$release/apps/gateway/artisan" gateway:release:cleanup --no-interaction | jq -ce .generations) \
            || { echo "gateway.release_cleanup_unreadable: the release cleanup generations cannot be read" >&2; exit 1; }
          "$release/bin/gateway-rollback" "$1" >&2
          [ -z "$3" ] || systemctl start "$3"
          printf '%s\n' "$generations"
        - sh
        - ${{ inputs.intent.id }}
        - ${{ inputs.intent.sha }}
        - ${{ inputs.intent.horizon_unit }}
    # A failed check fails no run by itself: the switch-back after it does, so its marker reaches the Gateway.
  - name: Verify the Gateway
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: Switch the release, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-verify-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 180
        argv:
        - /usr/bin/timeout
        - '150'
        - /bin/sh
        - -c
        - |
          set -eu
          get() { curl -fsS --cacert /etc/caddy/orbit-cert-current/root-ca.pem --max-time 15 --retry 5 --retry-delay 4 --retry-all-errors "https://gateway.orbit$1"; }
          get /up >/dev/null || { echo "gateway.release_verify_failed: /up does not answer" >&2; exit 1; }
          get /api/v1/gateway/status | jq -e --arg sha "$1" '(.data // .) | .status == "ok" and (.version == $sha or .version == $sha[0:12])' >/dev/null \
            || { echo "gateway.release_verify_failed: status is not ok on $1" >&2; exit 1; }
        - sh
        - ${{ inputs.intent.sha }}
    # After a failed check, the same script from the new release puts the previous release back: links, PHP-FPM and
    # running services. It then fails the run with its marker; a switch-back that fails reports its own error instead.
  - name: Switch back
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Verify the Gateway, condition: {type: failed}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-back-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: 180
        argv:
        - /usr/bin/timeout
        - '150'
        - /bin/sh
        - -c
        - |
          "/home/orbit/releases/$1/bin/gateway-rollback" "$2" >&2 \
            && echo "gateway.release_switched_back: the check failed; release $2 is current again" >&2
          exit 1
        - sh
        - ${{ inputs.intent.id }}
        - ${{ inputs.intent.previous }}
    # Always, also after a failed drain, switch or check: the drain stopped Horizon, so every end of the run starts it again, on
    # the release that is live. Starting a running unit changes nothing.
  - name: Start Horizon
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.horizon_unit == "" }}
    dependsOn:
    - {step: Drain Horizon, condition: &always {type: always}}
    - {step: Switch the release, condition: *always}
    - {step: Verify the Gateway, condition: *always}
    - {step: Switch back, condition: *always}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-start-horizon-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: 60
        argv: [/usr/bin/systemctl, start, '${{ inputs.intent.horizon_unit }}']
    # Best effort: the scheduler restart paused the release cleanups; they resume once a reconciliation finds no
    # differences. One that stays paused fails this step and keeps its own status; the release stays live.
  - name: Resume document cleanup
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn:
    - {step: Verify the Gateway, condition: {type: or, conditions: [{type: succeeded}, {type: failed}]}}
    - {step: Switch back, condition: {type: always}}
    - {step: Start Horizon, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-cleanup-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 360
        argv: [/usr/bin/timeout, '300', php8.5, /home/orbit/orbit/apps/gateway/artisan, gateway:release:cleanup, --no-interaction,
          '${{ "--before=" + steps["Switch the release"].outputs.stdout }}']
    # Best effort: keep the newest sealed releases, the current and the previous one; a later release retries.
  - name: Prune old releases
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: Verify the Gateway, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-prune-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 360
        argv:
        - /usr/bin/timeout
        - '300'
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          base=/home/orbit keep=$1 current=$2 previous=$3
          live=$(readlink "$base/orbit"); live=${live#releases/}
          web=$(readlink "$base/web/current" || true); web=${web#releases/}
          kept=$(ls -1t "$base"/releases/*/REVISION | head -n "$keep" | xargs -r -n1 dirname | xargs -r -n1 basename)
          for dir in "$base"/releases/*/; do
            id=$(basename "$dir")
            case " $live $current $previous $web $(echo $kept) " in *" $id "*) continue ;; esac
            # An unsealed directory is a stopped build; it goes after an hour.
            [ -f "$dir/REVISION" ] || [ -n "$(find "$dir" -maxdepth 0 -mmin +60)" ] || continue
            chmod -R u+w "$dir" && rm -rf "$dir"
            rm -rf "$base/web/releases/$id"
          done
          git -C "$base/shared/orbit.git" worktree prune
          # A web build whose release is gone, such as one a failed build left, goes too; the served one stays.
          for dir in "$base"/web/releases/*/; do
            id=$(basename "$dir")
            [ -d "$base/releases/$id" ] || [ "$id" = "$web" ] || rm -rf "$dir"
          done
        - bash
        - ${{ string(inputs.intent.keep) }}
        - ${{ inputs.intent.id }}
        - ${{ inputs.intent.previous }}
