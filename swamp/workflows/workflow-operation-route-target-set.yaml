id: ca5ceca0-f7da-4338-a1dd-196e06c64cd7
name: operation-route-target-set
description: Immutable Route workload mutation and restoration through official209 publication children.
vaults:
  - orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
        - route.target_set
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        properties:
          vault:
            type: string
            enum:
              - orbit-control-inputs
          key:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'
        required:
          - vault
          - key
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: update
    steps:
      - name: prepare
        target: orbit-node-209
        forEach:
          item: workload
          in: '${{ inputs.intent.workloads }}'
        dependsOn: []
        task:
          type: workflow
          workflowIdOrName: instance-route-workload
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent:
              node_id: '${{ self.workload.node_id }}'
              instance_id: '${{ self.workload.instance_id }}'
              connection: '${{ self.workload.connection }}'
              host_keys: '${{ self.workload.host_keys }}'
              plan: '${{ self.workload.prepare }}'
            execution_secrets: {}
      - name: prepare-certificates
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
        forEach:
          item: part
          in: "${{ inputs.intent.effectful ? inputs.intent.preparation.certificates.filter(item,inputs.intent.preparation.certificates.filter(first,first.node_id == item.node_id)[0].scope == item.scope) : [] }}"
        guard: '${{ steps.exists(k,k.startsWith("prepare-") && steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: route-certificate-publish
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent:
              {"leaves":"${{ inputs.intent.preparation.certificates.filter(leaf,leaf.node_id == self.part.node_id) }}","control_node_id":209,"connection":"${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection }}","host_keys":"${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys }}","node_id":"${{ self.part.node_id }}"}
            execution_secrets: {}
            parent_run_id: '${{ run.id }}'
            restoring: false
      - name: prepare-lan
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
        forEach:
          item: part
          in: '${{ inputs.intent.effectful ? inputs.intent.preparation.lan : [] }}'
        guard: '${{ steps.exists(k,k.startsWith("prepare-") && steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: route-lan-apply
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent:
              rule: '${{ self.part }}'
              control_node_id: 209
              connection: >-
                ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id ==
                self.part.node_id)[0].connection }}
              host_keys: >-
                ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id ==
                self.part.node_id)[0].host_keys }}
            execution_secrets: {}
      - name: prepare-caddy
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
        forEach:
          item: part
          in: '${{ inputs.intent.effectful ? inputs.intent.preparation.publications : [] }}'
        guard: '${{ steps.exists(k,k.startsWith("prepare-") && steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: operation-route-caddy-delta
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ self.part }}'
            execution_secrets: {}
      - name: prepare-probe
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
          - step: prepare-caddy
            condition:
              type: always
        forEach:
          item: part
          in: '${{ inputs.intent.effectful ? inputs.intent.preparation.probes : [] }}'
        guard: '${{ steps.exists(k,k.startsWith("prepare-") && steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: cluster-router-probe
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ self.part }}'
            execution_secrets: {}
      - name: forward
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
          - step: prepare-caddy
            condition:
              type: always
          - step: prepare-probe
            condition:
              type: always
        guard: '${{ !inputs.intent.effectful || steps.exists(k,k.startsWith("prepare-") && steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: route-mutation-forward
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent }}'
            execution_secrets: '${{ inputs.execution_secrets }}'
            parent_run_id: '${{ run.id }}'
      - name: retire
        target: orbit-node-209
        forEach:
          item: workload
          in: '${{ inputs.intent.workloads }}'
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
          - step: prepare-caddy
            condition:
              type: always
          - step: prepare-probe
            condition:
              type: always
          - step: forward
            condition:
              type: always
        guard: '${{ !("forward" in steps) || steps.forward.status != "succeeded" || !steps.forward.outputs.result.ready }}'
        task:
          type: workflow
          workflowIdOrName: instance-route-workload
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent:
              node_id: '${{ self.workload.node_id }}'
              instance_id: '${{ self.workload.instance_id }}'
              connection: '${{ self.workload.connection }}'
              host_keys: '${{ self.workload.host_keys }}'
              plan: '${{ self.workload.selected }}'
            execution_secrets: {}
      - name: restore-workload
        target: orbit-node-209
        forEach:
          item: workload
          in: '${{ inputs.intent.workloads }}'
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
          - step: prepare-caddy
            condition:
              type: always
          - step: prepare-probe
            condition:
              type: always
          - step: forward
            condition:
              type: always
          - step: retire
            condition:
              type: always
        guard: >-
          ${{ !(inputs.intent.effectful && (!("forward" in steps) || steps.forward.status != "succeeded" ||
          !steps.forward.outputs.result.ready || steps.exists(k,k.startsWith("retire-") && steps[k].status ==
          "failed"))) }}
        task:
          type: workflow
          workflowIdOrName: instance-route-workload
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent:
              node_id: '${{ self.workload.node_id }}'
              instance_id: '${{ self.workload.instance_id }}'
              connection: '${{ self.workload.connection }}'
              host_keys: '${{ self.workload.host_keys }}'
              plan: '${{ self.workload.restore }}'
            execution_secrets: {}
      - name: restore
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
          - step: prepare-caddy
            condition:
              type: always
          - step: prepare-probe
            condition:
              type: always
          - step: forward
            condition:
              type: always
          - step: retire
            condition:
              type: always
          - step: restore-workload
            condition:
              type: always
        guard: >-
          ${{ !(inputs.intent.effectful && (!("forward" in steps) || steps.forward.status != "succeeded" ||
          !steps.forward.outputs.result.ready || steps.exists(k,k.startsWith("retire-") && steps[k].status ==
          "failed"))) }}
        task:
          type: workflow
          workflowIdOrName: route-mutation-restore
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent }}'
            execution_secrets: '${{ inputs.execution_secrets }}'
            parent_run_id: '${{ run.id }}'
      - name: result
        target: orbit-node-209
        dependsOn:
          - step: prepare
            condition:
              type: always
          - step: prepare-certificates
            condition:
              type: always
          - step: prepare-lan
            condition:
              type: always
          - step: prepare-caddy
            condition:
              type: always
          - step: prepare-probe
            condition:
              type: always
          - step: forward
            condition:
              type: always
          - step: retire
            condition:
              type: always
          - step: restore-workload
            condition:
              type: always
          - step: restore
            condition:
              type: always
        task:
          type: behavior
          behaviorType: '@nckrtl/route-update-result'
          behaviorName: route-update-result
          methodName: read
          inputs:
            effectful: '${{ inputs.intent.effectful }}'
            failure_code: route.target_set_failed
            preparation_counts: "${{ inputs.intent.effectful ? {\"prepare-certificates\": size(inputs.intent.preparation.certificates.filter(item,inputs.intent.preparation.certificates.filter(first,first.node_id == item.node_id)[0].scope == item.scope)), \"prepare-lan\": size(inputs.intent.preparation.lan), \"prepare-caddy\": size(inputs.intent.preparation.publications), \"prepare-probe\": size(inputs.intent.preparation.probes)} : {} }}"
            route_id: '${{ inputs.intent.route_id }}'
            result_route_id: '${{ inputs.intent.result_route_id }}'
            workload_count: '${{ size(inputs.intent.workloads) }}'
            steps: '${{ steps }}'
      - name: complete
        target: orbit-node-209
        dependsOn:
          - step: result
            condition:
              type: always
        task:
          type: behavior
          behaviorType: '@nckrtl/route-update-result'
          behaviorName: route-update-complete
          methodName: complete
          inputs:
            stdout: '${{ steps.result.outputs.stdout }}'
