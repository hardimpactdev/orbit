id: 77fef03c-7ee9-4b75-a41c-e52c77a37ed7
name: operation-metrics-credentials-reset
description: Reset Grafana through one bounded curl argv per action; credentials reach curl configuration on stdin.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: metrics.credentials_reset}
    intent: {type: object}
    execution_secrets:
      type: object
      required: [probe, apply, confirm]
      properties:
        probe: &credential {type: object, properties: {vault: {type: string, enum: [orbit-control-inputs]}, key: {type: string, pattern: '^metrics-credentials-operation-[1-9][0-9]*-(probe|apply|confirm)$'}}, required: [vault, key], additionalProperties: false}
        apply: *credential
        confirm: *credential
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: credentials
  steps:
  - name: Check the pending one
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("metrics-credential-probe-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ ("metrics-credential-probe-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]
      inputs:
        hosts: name:target
        timeoutSec: 65
        argv: [timeout, '60', /usr/bin/curl, --disable, --silent, --show-error, --connect-timeout, '10', --max-time, '55', --noproxy, '*', --output, /dev/null, --write-out, '%{http_code}', --url, '${{ "http://" + inputs.intent.address + ":3000/api/user" }}', --config, '-']
        stdin: ${{ vault.get(inputs.execution_secrets.probe.vault, inputs.execution_secrets.probe.key) }}
  - name: Change the password
    labels: {role: swamp}
    dependsOn: [{step: Check the pending one, condition: {type: succeeded}}]
    guard: ${{ steps["Check the pending one"].outputs.stdout.trim() != "401" }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("metrics-credential-apply-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        <<: *ssh
        name: ${{ ("metrics-credential-apply-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      inputs:
        hosts: name:target
        timeoutSec: 65
        argv: [timeout, '60', /usr/bin/curl, --disable, --silent, --show-error, --fail, --connect-timeout, '10', --max-time, '55', --noproxy, '*', --output, /dev/null, --write-out, '%{http_code}', --url, '${{ "http://" + inputs.intent.address + ":3000/api/user" + "/password" }}', --config, '-']
        stdin: ${{ vault.get(inputs.execution_secrets.apply.vault, inputs.execution_secrets.apply.key) }}
  - name: Confirm the new login
    labels: {role: swamp}
    dependsOn: [{step: Change the password, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("metrics-credential-confirm-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        <<: *ssh
        name: ${{ ("metrics-credential-confirm-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      inputs:
        hosts: name:target
        timeoutSec: 65
        argv: [timeout, '60', /usr/bin/curl, --disable, --silent, --show-error, --fail, --connect-timeout, '10', --max-time, '55', --noproxy, '*', --output, /dev/null, --write-out, '%{http_code}', --url, '${{ "http://" + inputs.intent.address + ":3000/api/user" }}', --config, '-']
        stdin: ${{ vault.get(inputs.execution_secrets.confirm.vault, inputs.execution_secrets.confirm.key) }}
  - name: Assert the new login
    labels: {role: swamp}
    dependsOn: [{step: Confirm the new login, condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Confirm the new login"].outputs.stdout.trim() == "200"', severity: high, message: Grafana must accept the pending password with HTTP 200.}
