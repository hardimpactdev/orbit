          methodName: project
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            admission: ${{ steps.admit.outputs }}
            outcomes: "${{ (has(steps.agent_install) && has(steps.agent_install.outputs) ? [steps.agent_install.outputs]
              : []) + (has(steps.caddy_package) && has(steps.caddy_package.outputs) ? [steps.caddy_package.outputs]
              : []) + (has(steps.caddy) && has(steps.caddy.outputs) ? [steps.caddy.outputs] : []) + (has(steps.peer_dns)
              && has(steps.peer_dns.outputs) ? [steps.peer_dns.outputs] : []) + (has(steps.private_dns) && has(steps.private_dns.outputs)
