id: 39d6e292-f81d-437f-9225-5f959b261432
name: group-start
description: >-
  Start one Orbit task group (tg-<group id>) in the orbit-groups factory. Serve runs
  remote-only, so a bare CLI method run has no placement, and serve cannot evaluate the
  factory's templated stages before dispatch; the driver starts it on the worker.
  groups-driver discovers the active work item on its next tick.
queueTimeout: 60
inputs:
  type: object
  properties:
    workItem: { type: string, pattern: '^tg-[1-9][0-9]*$' }
  required: [workItem]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: group
    steps:
      - name: start
        labels: {role: swamp}
        task:
          type: model_method
          modelIdOrName: orbit-driver-groups
          methodName: start
          inputs:
            workItem: '${{ inputs.workItem }}'
      # Supervise at once: the first generation starts now, not at the next reconcile.
      - name: supervise
        dependsOn: [{ step: start, condition: { type: succeeded } }]
        labels: {role: swamp}
        task:
          type: workflow
          workflowIdOrName: group-supervise
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: orbit-groups
            preapprovalModel: orbit-driver-groups
