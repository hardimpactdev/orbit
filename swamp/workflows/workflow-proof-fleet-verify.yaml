id: c3f7a915-2d84-4e1b-8a60-b5d9e4f18a33
name: proof-fleet-verify
description: Run the proof cases of one command on the task VM, in batches, from Orbit's own Swamp over official SSH. One child per batch, one child per case, one report of the verdict lines.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum: [proof.verify]
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: plan
  labels: {role: swamp}
  steps:
  # A previous batch's flagged-case check can leave the checkout at the merge base.
  - name: Restore the head checkout
    labels: {role: swamp}
    writes: true
    guard: '${{ inputs.intent.?head.orValue("") == "" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-restore-head-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("proof-restore-head-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]
      inputs:
        hosts: name:target
        timeoutSec: 70
        argv: ['timeout', '60', 'git', '-C', '${{ inputs.intent.checkout_path }}', 'checkout', '--force', '--detach', '${{ inputs.intent.?head.orValue("") }}']
  # `runner plan --lines` prints one line a batch: `BATCH SETUP CASE...`. Keep that original interface for older heads.
  - name: Read the runner plan
    dependsOn: [{step: Restore the head checkout, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-verify-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("proof-verify-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        # A task copy: root on its Node runs `incus exec` into the copy and the runner as `agent` (docs/cli/proof/proof.mdx#the-run). A task VM: the SSH user runs it.
        sudo: '${{ "copy" in inputs.intent }}'
        argv: '${{ ("copy" in inputs.intent ? ["incus", "--project", inputs.intent.copy.project, "exec", "--disable-stdin", "--cwd", "/srv/workspace", inputs.intent.copy.name, "--", "/usr/sbin/runuser", "-u", "agent", "--"] : []) + ["python3", inputs.intent.checkout_path + "/swamp/proof/runner/runner.py", "plan", "--lines", "--file", inputs.intent.checkout_path + "/" + inputs.intent.file] }}'
  # Every later consumer reads this scoped plan, including flagged-case checks and missing-verdict reporting.
  - name: plan
    dependsOn: [{step: Read the runner plan, condition: {type: succeeded}}]
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "proof-verify-assigned-plan" }}
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$PLAN"
        env:
          PLAN: '${{ steps["Read the runner plan"].outputs.stdout.trim().split("\n").filter(l, inputs.intent.?batch.orValue("") == "" || l.startsWith(inputs.intent.?batch.orValue("") + " ")).map(l, l.split(" ", 3)).map(p, [p[0], p[1], p[2].split(" ").filter(c, !has(inputs.intent.case_ids) || c in inputs.intent.case_ids).join(" ")]).filter(p, p[2] != "").map(p, p.join(" ")).join("\n") }}'
# Before the first batch (3-proof.mmd): the fleet is made ready for the cases. A step that fails stops the run, and every case is unrun with cause infrastructure.
- name: prepare
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  steps:
  # The author's fleet may have moved since the last proof (3-proof.mmd, first restore): it starts from `base`, as every batch does. The Gateway sets `restore_first` for `orbit proof`; the VM of a proof in CI has just taken `base`.
  - name: 'Restore the base snapshot'
    labels: {role: swamp}
    writes: true
    guard: '${{ !(has(inputs.intent.restore_first) && inputs.intent.restore_first) || "copy" in inputs.intent }}'
    task: {type: workflow, workflowIdOrName: proof-fleet-restore, inputs: {ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
  # `base` holds the Swamp tokens of its nested Gateway; the file that the provision and the re-mint write is the witness of their age. `find` prints the path only when the file is older than 20 days (28,800 minutes), so no output means the tokens are fresh.
  - name: 'Read the token age'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-the-token-age").split(".").join("-") }}', methodName: exec, globalArgs: {name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-the-token-age").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', sudo: '${{ "copy" in inputs.intent }}', argv: '${{ ("copy" in inputs.intent ? ["incus", "--project", inputs.intent.copy.project, "exec", "--disable-stdin", "--cwd", "/srv/workspace", inputs.intent.copy.name, "--", "/usr/sbin/runuser", "-u", "agent", "--"] : []) + ["timeout", "60", "incus", "exec", "nested-gateway", "--", "find", "/home/orbit/.config/swamp/serve-driver-token", "-mmin", "+28800"] }}', timeoutSec: 70}}
    dependsOn: [{step: 'Restore the base snapshot', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  # The step of the provision, not a copy: the child `task-nested-apply` with `remint` set runs its step `Re-mint the Swamp tokens`, between its mounts and its migrations and restart, so the services run with the new tokens.
  - name: 'Re-mint the Swamp tokens'
    labels: {role: swamp}
    writes: true
    guard: '${{ "copy" in inputs.intent || steps["Read the token age"].outputs.stdout.trim() == "" }}'
    task: {type: workflow, workflowIdOrName: task-nested-apply, inputs: {guest_node_id: '${{ inputs.intent.ssh_execution.target.node_id }}', ssh_execution: '${{ inputs.intent.ssh_execution }}', fleet: '${{ {"guests": {"gateway": "nested-gateway", "app-dev": "nested-app-dev", "app-prod": "nested-app-prod"}, "network": "oe-nested"} }}', club: '${{ true }}', remint: '${{ true }}'}}
    dependsOn: [{step: 'Read the token age', condition: {type: succeeded}}]
  # The fleet that `base` keeps must be ready: the apply that the re-mint runs has just restarted the services.
  - name: 'Check readiness'
    labels: {role: swamp}
    writes: true
    guard: '${{ "copy" in inputs.intent || steps["Read the token age"].outputs.stdout.trim() == "" }}'
    task: {type: workflow, workflowIdOrName: task-nested-ready, inputs: {guest_node_id: '${{ inputs.intent.ssh_execution.target.node_id }}', ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
    dependsOn: [{step: 'Re-mint the Swamp tokens', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the token age', condition: {type: succeeded}}]
  # `--reuse` replaces the old `base`. Skipped with the re-mint: the code needs no new `base`.
  - name: 'Take base again'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    guard: '${{ "copy" in inputs.intent || steps["Read the token age"].outputs.stdout.trim() == "" }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-take-base-again" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-take-base-again" + "-" + self.role).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '180', 'incus', 'snapshot', 'create', '${{ "nested-" + self.role }}', 'base', '--reuse'], timeoutSec: 190}}
    dependsOn: [{step: 'Check readiness', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the token age', condition: {type: succeeded}}]
- name: batches
  labels: {role: swamp}
  concurrency: 1
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  - job: prepare
    condition: {type: succeeded}
  steps:
  # One child per batch, one at a time, in plan order. A batch that stopped on its setup stops the run.
  - name: batch-${{ self._index }}
    labels: {role: swamp}
    forEach:
      item: batch
      in: '${{ steps.plan.outputs.stdout.trim().split("\n").map(l, {"batch": l.split(" ", 3)[0], "setup": l.split(" ", 3)[1] == "1", "cases": l.split(" ", 3)[2].split(" ")}) }}'
    guard: '${{ steps.exists(k, k.startsWith("batch-") && steps[k].?outputs.?report.?stdout.orValue("").contains("run stopped")) }}'
    allowFailure: true
    task:
      type: workflow
      workflowIdOrName: proof-fleet-verify-batch
      inputs:
        ssh_execution: ${{ inputs.intent.ssh_execution }}
        checkout_path: ${{ inputs.intent.checkout_path }}
        group_id: ${{ inputs.intent.group_id }}
        file: ${{ inputs.intent.file }}
        runner_prefix: '${{ ("copy" in inputs.intent ? ["incus", "--project", inputs.intent.copy.project, "exec", "--disable-stdin", "--cwd", "/srv/workspace", inputs.intent.copy.name, "--", "/usr/sbin/runuser", "-u", "agent", "--"] : []) }}'
        batch: ${{ self.batch.batch }}
        setup: ${{ self.batch.setup }}
        restore: ${{ self._index > 0 }}
        cases: ${{ self.batch.cases }}
# Only an added or changed case with fails_on_base: true must fail on the merge base (3-proof.mmd, `Select replay cases`). Only a proof in CI sets `base` and `head` in the intent; `orbit proof` leaves them out, because the switch would replace the author's own checkout. With no selected flagged case no step changes anything.
- name: can-fail
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  - job: batches
    condition: {type: completed}
  steps:
  # A flagged case is replayed only in CI (the intent of `proof:run` holds `merge_base` and `head`) and only when every case of the plan passed.
  - name: 'Check the main verdicts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "proof-verify-main-verdicts" }}
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$JUDGED"
        env:
          JUDGED: '${{ (inputs.intent.?merge_base.orValue("") != "" && inputs.intent.?head.orValue("") != "" && steps.plan.outputs.stdout.trim().split("\n").map(l, l.split(" ", 3)[2]).join(" ").split(" ").all(c, steps.exists(k, k.startsWith("batch-") && steps[k].?outputs.?report.?stdout.orValue("").contains("\"id\": \"" + c + "\", \"verdict\": \"passed\"")))) ? "yes" : "no" }}'
  # Released workflows also run older PR heads. Discover replay support through their existing help interface.
  - name: 'Read runner capabilities'
    labels: {role: swamp}
    guard: '${{ steps["Check the main verdicts"].outputs.stdout.trim() != "yes" }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-runner-capabilities").split(".").join("-") }}', methodName: exec, globalArgs: &vm {name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-runner-capabilities").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'python3', '${{ inputs.intent.checkout_path + "/swamp/proof/runner/runner.py" }}', '--help'], timeoutSec: 70}}
    dependsOn: [{step: 'Check the main verdicts', condition: {type: succeeded}}]
  # A second checkout of the merge base, for its plan only: it is not mounted in the fleet.
  - name: 'Check out the merge base'
    labels: {role: swamp}
    writes: true
    guard: '${{ !steps[?"Read runner capabilities"].?outputs.?stdout.orValue("").split("\n").exists(l, l.trim().startsWith("replay ")) }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-check-out-the-merge-base").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-check-out-the-merge-base").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'git', '-C', '${{ inputs.intent.checkout_path }}', 'worktree', 'add', '--detach', '${{ inputs.intent.checkout_path + ".base" }}', '${{ inputs.intent.?merge_base.orValue("") }}'], timeoutSec: 70}}
    dependsOn: [{step: 'Read runner capabilities', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  # The head runner uses the case-level comparison, then filters fails_on_base. Code/tooling whole-file selection never makes unchanged cases eligible.
  - name: 'Select replay cases'
    labels: {role: swamp}
    guard: '${{ !steps[?"Read runner capabilities"].?outputs.?stdout.orValue("").split("\n").exists(l, l.trim().startsWith("replay ")) }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-select-replay-cases").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-select-replay-cases").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'python3', '${{ inputs.intent.checkout_path + "/swamp/proof/runner/runner.py" }}', 'replay', '--file', '${{ inputs.intent.checkout_path + "/" + inputs.intent.file }}', '--base-file', '${{ inputs.intent.checkout_path + ".base/" + inputs.intent.file }}', '--base-batches', '${{ inputs.intent.checkout_path + ".base/swamp/proof/batches.yaml" }}'], timeoutSec: 70}}
    dependsOn: [{step: 'Check out the merge base', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  - name: 'Remove the merge base checkout'
    labels: {role: swamp}
    writes: true
    guard: '${{ !steps[?"Read runner capabilities"].?outputs.?stdout.orValue("").split("\n").exists(l, l.trim().startsWith("replay ")) }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-remove-the-merge-base-checkout").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-remove-the-merge-base-checkout").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'git', '-C', '${{ inputs.intent.checkout_path }}', 'worktree', 'remove', '--force', '${{ inputs.intent.checkout_path + ".base" }}'], timeoutSec: 70}}
    dependsOn: [{step: 'Select replay cases', condition: {type: always}}]
  # Restrict the changed flagged ids to this shard/batch, on one line.
  - name: 'Name replay cases'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "proof-verify-flagged-cases" }}
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$IDS"
        env:
          IDS: '${{ steps[?"Select replay cases"].?outputs.?stdout.orValue("").trim().split(" ").filter(c, steps.plan.outputs.stdout.trim().split("\n").map(l, l.split(" ", 3)[2]).join(" ").split(" ").exists(p, p == c)).join(" ") }}'
    dependsOn: [{step: 'Remove the merge base checkout', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  # The one checkout switches to the merge base, with the head cases, batches and spec loader (which accepts fails_on_base). The base runner and steps stay. The nested containers have it as a disk device, so they see the switch at once.
  - name: 'Switch the checkout to the merge base'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Name replay cases"].outputs.stdout.trim() == "" }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-switch-the-checkout-to-the-merge-base").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-switch-the-checkout-to-the-merge-base").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'git', '-C', '${{ inputs.intent.checkout_path }}', 'checkout', '--force', '--detach', '${{ inputs.intent.?merge_base.orValue("") }}'], timeoutSec: 70}}
    dependsOn: [{step: 'Name replay cases', condition: {type: succeeded}}]
  # The nested Gateway reads the checkout as a disk device: it must show the merge base before the apply.
  - name: 'Read the nested checkout'
    labels: {role: swamp}
    guard: '${{ steps["Name replay cases"].outputs.stdout.trim() == "" }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-the-nested-checkout").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-the-nested-checkout").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'exec', 'nested-gateway', '--user', '1000', '--', 'git', '-C', '/home/orbit/orbit', 'rev-parse', 'HEAD'], timeoutSec: 70}}
    dependsOn: [{step: 'Switch the checkout to the merge base', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  - name: 'Check the nested checkout'
    labels: {role: swamp}
    guard: '${{ steps["Name replay cases"].outputs.stdout.trim() == "" }}'
    task: {type: assert, expr: 'steps["Read the nested checkout"].outputs.stdout.trim() == inputs.intent.?merge_base.orValue("")', severity: high, message: The nested Gateway does not show the merge base after the switch of the checkout}
    dependsOn: [{step: 'Read the nested checkout', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  - name: 'Take the cases of the head'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Name replay cases"].outputs.stdout.trim() == "" }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-take-the-cases-of-the-head").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-take-the-cases-of-the-head").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'git', '-C', '${{ inputs.intent.checkout_path }}', 'checkout', '${{ inputs.intent.?head.orValue("") }}', '--', '${{ inputs.intent.file }}', 'swamp/proof/batches.yaml', 'swamp/proof/runner/spec.py'], timeoutSec: 70}}
    dependsOn: [{step: 'Check the nested checkout', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  # Restore `base` and apply the checkout, which is now the merge base.
  - name: 'Restore the base snapshot'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Name replay cases"].outputs.stdout.trim() == "" }}'
    task: {type: workflow, workflowIdOrName: proof-fleet-restore, inputs: {ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
    dependsOn: [{step: 'Take the cases of the head', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
# Only the selected flagged cases, in their batches. The first batch starts from the restore above; each later batch restores `base` itself.
- name: can-fail-batches
  labels: {role: swamp}
  concurrency: 1
  dependsOn:
  - job: can-fail
    condition: {type: succeeded}
  steps:
  - name: fail-batch-${{ self._index }}
    labels: {role: swamp}
    forEach:
      item: batch
      in: '${{ steps.plan.outputs.stdout.trim().split("\n").map(l, {"batch": l.split(" ", 3)[0], "setup": l.split(" ", 3)[1] == "1", "cases": l.split(" ", 3)[2].split(" ").filter(c, c in steps["Name replay cases"].outputs.stdout.trim().split(" "))}).filter(b, size(b.cases) > 0) }}'
    guard: '${{ steps.exists(k, k.startsWith("fail-batch-") && steps[k].?outputs.?report.?stdout.orValue("").contains("run stopped")) }}'
    allowFailure: true
    task:
      type: workflow
      workflowIdOrName: proof-fleet-verify-batch
      inputs:
        ssh_execution: ${{ inputs.intent.ssh_execution }}
        checkout_path: ${{ inputs.intent.checkout_path }}
        group_id: ${{ inputs.intent.group_id }}
        file: ${{ inputs.intent.file }}
        runner_prefix: '${{ ("copy" in inputs.intent ? ["incus", "--project", inputs.intent.copy.project, "exec", "--disable-stdin", "--cwd", "/srv/workspace", inputs.intent.copy.name, "--", "/usr/sbin/runuser", "-u", "agent", "--"] : []) }}'
        batch: ${{ self.batch.batch }}
        setup: ${{ self.batch.setup }}
        restore: ${{ self._index > 0 }}
        cases: ${{ self.batch.cases }}
# Final restore for the author's command (3-proof.mmd): the intent sets `final_restore`; CI leaves it unset. It also runs after batches that failed.
- name: finish
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  - job: prepare
    condition: &always {type: always}
  - job: batches
    condition: *always
  steps:
  - name: 'Restore the clean fleet'
    labels: {role: swamp}
    writes: true
    guard: '${{ !(has(inputs.intent.final_restore) && inputs.intent.final_restore) || "copy" in inputs.intent }}'
    task: {type: workflow, workflowIdOrName: proof-fleet-restore, inputs: {ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
- name: report
  labels: {role: swamp}
  dependsOn:
  - job: prepare
    condition: {type: always}
  - job: batches
    condition: {type: always}
  - job: can-fail
    condition: {type: always}
  - job: can-fail-batches
    condition: {type: always}
  - job: finish
    condition: *always
  steps:
  # The Gateway reads this step once, at the end of the run. Every planned case has a line: a case of a batch that did not run is unrun, cause infrastructure.
  - name: report
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "proof-verify-report" }}
      methodName: execute
      inputs:
        run: |
          printf '%s\n%s\n' "$LINES" "$BASE_LINES"
        env:
          # One line for each selected flagged case, `CASE@merge-base`: passed when the case failed with cause assertion on the merge base, failed when it passed, ended otherwise or printed no line.
          BASE_LINES: '${{ [steps.filter(k, k.startsWith("fail-batch-")).map(k, steps[k].?outputs.?report.?stdout.orValue("")).join("\n")].map(all, steps[?"Name replay cases"].?outputs.?stdout.orValue("").trim().split(" ").filter(c, c != "").map(c, [all.split("\n").filter(l, l.contains("\"id\": \"" + c + "\""))].map(f, (size(f) > 0 && f[0].contains("\"verdict\": \"failed\"") && f[0].contains("\"cause\": \"assertion\"")) ? "{\"id\": \"" + c + "@merge-base\", \"verdict\": \"passed\", \"secs\": 0}" : "{\"id\": \"" + c + "@merge-base\", \"verdict\": \"failed\", \"cause\": \"assertion\", \"secs\": 0, \"failed\": [\"the flagged case did not fail with cause assertion on the merge base\"]}")[0]).join("\n"))[0] }}'
          LINES: '${{ [steps.filter(k, k.startsWith("batch-")).map(k, steps[k].?outputs.?report.?stdout.orValue("").trim()).filter(x, x != "")].map(x, (x + [x.join("\n")].map(e, steps.plan.outputs.stdout.trim().split("\n").map(l, l.split(" ", 3)[2]).join(" ").split(" ").filter(c, !e.contains("\"id\": \"" + c + "\"")).map(c, "{\"id\": \"" + c + "\", \"verdict\": \"unrun\", \"cause\": \"infrastructure\", \"secs\": 0, \"failed\": [\"run stopped: the fleet or the batch setup did not succeed\"]}"))[0]).join("\n"))[0] }}'
