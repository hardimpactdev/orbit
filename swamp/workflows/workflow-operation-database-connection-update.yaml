id: 22d37697-fc3f-4df0-9e26-ad6d0f78c431
name: operation-database-connection-update
queueTimeout: 30
description: A new index on a managed Valkey server, checked from 209 with one valkey-cli call; AUTH comes from the vault on stdin.
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database.update}
    intent: {type: object}
    # Name only: auth holds the AUTH line and the CONFIG GET command, one whole value.
    execution_secrets:
      type: object
      properties:
        auth:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^database-update-intent-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [auth]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: update
  labels: {role: swamp}
  steps:
    # Read only: the Gateway compares the index with the live count from this step's output.
  - name: 'Check the index fits'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-update-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "database-update-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: ['timeout', '30', 'docker', 'exec', '-i', '${{ inputs.intent.container }}', 'valkey-cli', '--no-auth-warning']
        stdin: ${{ vault.get(inputs.execution_secrets.auth.vault, inputs.execution_secrets.auth.key) }}
        timeoutSec: 40
