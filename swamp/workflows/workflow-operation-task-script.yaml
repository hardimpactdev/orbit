id: 71e40e98-b4dc-4ce1-b4cb-8c328e581a78
name: operation-task-script
description: Run the admitted repository script on Node 209 as official SSH exec argv in the owned task VM workspace.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.script]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: script
  labels: {role: swamp}
  steps:
  - name: prepare
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-repository-program'
      behaviorName: '${{ ("task-repository-program-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: prepare
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        root: ${{ "/tmp/orbit-task-repository-" + run.id }}
  - name: output-local
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-repository-output-local-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          umask 077
          mkdir -p -- "$ORBIT_LOCAL"
        env:
          ORBIT_LOCAL: ${{ "/tmp/orbit-task-repository-" + run.id + "-local" }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
  - name: inspect
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh_args
        name: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        okExitCodes: any
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - ls-tree
        - HEAD
        - --
        - ${{ inputs.intent.script }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
  - name: snapshot-before-index
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-index-" + run.id }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - read-tree
        - HEAD
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
  - name: snapshot-before-add
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-index-" + run.id }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
    dependsOn:
    - step: snapshot-before-index
      condition:
        type: succeeded
  - name: snapshot-before-tree
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-index-" + run.id }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
    dependsOn:
    - step: snapshot-before-add
      condition:
        type: succeeded
  - name: snapshot-before-head
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
    dependsOn:
    - step: snapshot-before-tree
      condition:
        type: succeeded
  - name: gate
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-repository-program'
      behaviorName: '${{ ("task-repository-program-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: gate
      inputs:
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        entrypoint: ${{ steps.prepare.outputs.entrypoint }}
        steps: ${{ steps }}
    dependsOn:
    - step: snapshot-before-head
      condition:
        type: succeeded
  - name: execute
    labels: {role: swamp}
    guard: '${{ steps.gate.outputs.error_code != "" }}'
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv: ${{ steps.prepare.outputs.argv }}
    dependsOn:
    - step: gate
      condition:
        type: succeeded
  - name: output-copy
    labels: {role: swamp}
    guard: '${{ steps.gate.outputs.error_code != "" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        direction: from
        src: ${{ "/tmp/orbit-task-repository-" + run.id + "/output" }}
        dst: ${{ "/tmp/orbit-task-repository-" + run.id + "-local/output" }}
        timeoutSec: 60
    dependsOn:
    - step: execute
      condition:
        type: succeeded
    - step: output-local
      condition:
        type: succeeded
  - name: snapshot-after-index
    labels: {role: swamp}
    guard: '${{ steps.gate.outputs.error_code != "" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-index-" + run.id }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - read-tree
        - HEAD
    dependsOn:
    - step: execute
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: snapshot-after-add
    labels: {role: swamp}
    guard: '${{ steps.gate.outputs.error_code != "" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-index-" + run.id }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
    dependsOn:
    - step: snapshot-after-index
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: snapshot-after-tree
    labels: {role: swamp}
    guard: '${{ steps.gate.outputs.error_code != "" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-index-" + run.id }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
    dependsOn:
    - step: snapshot-after-add
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: snapshot-after-head
    labels: {role: swamp}
    guard: '${{ steps.gate.outputs.error_code != "" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
    dependsOn:
    - step: snapshot-after-tree
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: shape
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-repository-program'
      behaviorName: '${{ ("task-repository-program-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: result
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        gate: ${{ steps.gate.outputs }}
        execution_id: ${{ steps.prepare.outputs.execution_id }}
        steps: ${{ steps }}
        local: ${{ "/tmp/orbit-task-repository-" + run.id + "-local" }}
    dependsOn:
    - step: snapshot-after-head
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: output-copy
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: cleanup-index
    labels: {role: swamp}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-repository-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-index-" + run.id }}
        - ${{ "/tmp/orbit-task-repository-" + run.id }}
    dependsOn:
    - step: shape
      condition:
        type: always
  - name: cleanup-local
    labels: {role: swamp}
    allowFailure: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-repository-cleanup-local-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          rm -rf -- "$ORBIT_LOCAL"
        env:
          ORBIT_LOCAL: ${{ "/tmp/orbit-task-repository-" + run.id + "-local" }}
    dependsOn:
    - step: shape
      condition:
        type: always
  - name: outcome
    labels: {role: swamp}
    task:
      type: assert
      expr: '!steps.shape.outputs.failed'
      message: The repository script was refused or failed.
      severity: high
    dependsOn:
    - step: shape
      condition:
        type: succeeded
