---
# What each case runs and what its answer must be. Loaded by converge.yml and verify.yml for every case host: `inventory_hostname` is the
# case, `d` its definition and `c` its ports (molecule.yml). Values that only the live fleet knows are templated when the case runs.
app_dev_id: "{{ hostvars['localhost'].node_ids['app-dev'] }}"
src: "{{ hostvars['nested-gateway'].gateway_src }}"
app_dev_ip: "{{ hostvars['nested-app-dev'].app_dev_ip }}"
row_pattern: '^\[ *([0-9]+)\].*$'
d: "{{ case_defs[inventory_hostname] }}"
c: "{{ cases[inventory_hostname] | default({}) }}"
case_defs:
  new_restricted_allow:
    argv: [firewall:allow, "{{ cases.new_restricted_allow.port }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    expect: {rc: 0, status: succeeded}
  already_applied:
    setup:
      - [firewall:allow, "{{ cases.already_applied.port }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    argv: [firewall:allow, "{{ cases.already_applied.port }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    expect: {rc: 0, status: succeeded, skipped: firewall.rule_exists}
  partial_application:
    argv: [firewall:allow, "{{ cases.partial_application.port }}", "--node={{ app_dev_id }}", "--from={{ src }}"]
    expect: {rc: 0, status: succeeded}
  conflict:
    setup:
      - [firewall:deny, "{{ cases.conflict.port }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    argv: [firewall:allow, "{{ cases.conflict.port }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    expect: {rc: 1, code: firewall.rule_conflict, request: false}
  failure_code:
    argv: [firewall:allow, "{{ cases.new_restricted_allow.port }}"]
    expect: {rc: 1, code: firewall.node_id_invalid, request: false}
  protocols_tcp:
    argv: [firewall:allow, "{{ cases.protocols_tcp.port }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    expect: {rc: 0, status: succeeded}
  port_range:
    argv: [firewall:allow, "{{ cases.port_range.spec }}", "--node={{ app_dev_id }}", "--from={{ src }}", "--protocol=tcp"]
    expect: {rc: 0, status: succeeded}
  protected_port:
    argv: [firewall:allow, "22", "--node={{ app_dev_id }}"]
    expect: {rc: 0, status: succeeded, skipped: firewall.rule_exists}
