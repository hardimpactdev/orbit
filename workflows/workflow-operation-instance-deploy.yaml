id: 7dfea1f8-75c3-48b1-8987-271d3f590d27
name: operation-instance-deploy
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "5,35 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-instance-deploy-discovery
          methodName: discover
          inputs:
            family: operation-instance-deploy
            kinds: ["instance.deploy", "instance.rollback", "instance.sync_environment", "instance.prepare_vp_environment", "instance.prepare_php_runtime", "instance.prepare_served_web_roots", "instance.synchronize_environment"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-instance-deploy'
          behaviorName: '${{ "operation-instance-deploy-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
