---
# The task branch of a task start (docs/cli/task/start.mmd), on the warm checkout at the converged commit. A rerun on the branch
# changes nothing.
- name: Start the task branch
  when: intent.checkout.branch is defined
  block:
    - name: Read the checked out branch
      become: true
      become_user: "{{ orbit_user }}"
      ansible.builtin.command: { argv: [git, -C, "{{ intent.checkout.path }}", branch, --show-current] }
      register: branch_current
      changed_when: false
    - name: Make the task branch at the commit
      when: branch_current.stdout | trim != intent.checkout.branch
      become: true
      become_user: "{{ orbit_user }}"
      ansible.builtin.command:
        argv: [git, -C, "{{ intent.checkout.path }}", switch, --force-create, "{{ intent.checkout.branch }}", "{{ intent.checkout.commit }}"]
      changed_when: true
