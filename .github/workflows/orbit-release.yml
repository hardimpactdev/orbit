name: Orbit Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hardimpactdev/orbit-gateway

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, sqlite3, curl, openssl, mbstring, tokenizer, ctype, filter, fileinfo, phar
          tools: composer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Install CLI dependencies
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --optimize-autoloader

      - name: Build CLI PHAR
        env:
          COMPOSER_MIRROR_PATH_REPOS: "1"
        run: |
          set -euo pipefail
          rm -rf apps/cli/vendor/hardimpactdev/orbit-core
          mkdir -p apps/cli/vendor/hardimpactdev/orbit-core
          cp -r packages/core/src packages/core/composer.json apps/cli/vendor/hardimpactdev/orbit-core/
          cd apps/cli
          php orbit app:build orbit.phar \
            --build-version=${{ steps.version.outputs.value }} \
            --no-interaction \
            --timeout=0

      - name: Bundle macOS arm64 binary
        run: |
          cd apps/cli
          vendor/bin/phpacker build mac arm \
            --src=./builds/orbit.phar \
            --php=8.5 \
            --no-interaction

      - name: Bundle Ubuntu x86_64 binary
        run: |
          cd apps/cli
          vendor/bin/phpacker build linux x64 \
            --src=./builds/orbit.phar \
            --php=8.5 \
            --no-interaction

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push gateway image
        id: gateway_image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/orbit-gateway-image-metadata.json"
          image="${REGISTRY}/${IMAGE_NAME}"

          test -f docker/orbit-gateway/Dockerfile.dockerignore

          docker buildx build \
            --file docker/orbit-gateway/Dockerfile \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            --metadata-file "$metadata_file" \
            --push \
            .

          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"

          if [ -z "$digest" ]; then
            echo "Gateway image digest was not captured." >&2
            exit 1
          fi

          echo "image=${image}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GATEWAY_IMAGE: ${{ steps.gateway_image.outputs.image }}
          GATEWAY_DIGEST: ${{ steps.gateway_image.outputs.digest }}
        run: |
          set -euo pipefail

          bin/orbit-release-manifest \
            --version="${VERSION}" \
            --gateway-image="${GATEWAY_IMAGE}" \
            --gateway-digest="${GATEWAY_DIGEST}" \
            --repository="${GITHUB_REPOSITORY}" \
            --cli-artifact="linux-amd64=orbit-linux-x64=apps/cli/builds/dist/linux/linux-x64" \
            --cli-artifact="darwin-arm64=orbit-macos-arm64=apps/cli/builds/dist/mac/mac-arm" \
            --role-image="orbit-caddy=caddy:2-alpine" \
            --role-image="orbit-websocket=ghcr.io/hardimpactdev/orbit-websocket:${VERSION}" \
            --output="orbit-release-manifest.json"

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            apps/cli/builds/dist/linux/linux-x64#orbit-linux-x64 \
            apps/cli/builds/dist/mac/mac-arm#orbit-macos-arm64 \
            orbit-release-manifest.json \
            --clobber
