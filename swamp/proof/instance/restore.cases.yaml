# Establish the active logical slot BEFORE destroy; no admission barrier on current main.
command: instance:restore
chart: instance/restore
target: app-dev
sources:
- gateway
baseline:
- operations
cases:
- id: restore-slot-blocked-removal
  batch: fresh-fleet
  exclusive: true
  timeout: 900
  covers:
  - main
  - restored
  - already-restored
  summary: Restore an intact removal blocked by an active logical replication slot, repeat, then capture a fresh removal.
  setup:
  - instance_removal:
      'on': app-dev
      as: fixture
      phase: setup
  stages:
  - act:
    - cli:
        run:
        - instance:restore
        - ${fixture.instance}
        expect:
          exit: 0
          status: succeeded
    expect:
    - instance_removal:
        'on': app-dev
        as: fixture
        phase: restored
  - act:
    - cli:
        run:
        - instance:restore
        - ${fixture.instance}
        expect:
          exit: 0
          status: succeeded
          skipped: instance.already_restored
    expect:
    - instance_removal:
        'on': app-dev
        as: fixture
        phase: restored
  - act:
    - cli:
        run:
        - instance:destroy
        - ${fixture.instance}
        - --yes
        - --force
        expect:
          exit: 1
          status: failed
    expect:
    - instance_removal:
        'on': app-dev
        as: fixture
        phase: new-removal
- id: invalid-id
  batch: fresh-fleet
  covers: []
  summary: Reject an invalid Instance ID before contacting the Gateway.
  act:
  - cli:
      run:
      - instance:restore
      - invalid
      forms:
      - json
      - human
      expect:
        exit: 1
        code: instance.id_invalid
        request: none
  expect:
  - unchanged:
      since: act
      what:
      - operations
uncovered:
  path:refused: Gateway admission tests cover the four refusal groups. Machine survivor faults need a separate damaged fixture.
  path:failed: Gateway projection and Ansible fixtures cover failed publication, holds and marker compensation. The orchestrator
    injects TLS/DNS and withdrawal failure on the release fixture.
  option:--idempotency-key: The shared Operation-start contract has existing CLI tests.
  instance.restore_state_invalid: Gateway tests cover wrong state, unsettled runs and changed source identity.
  instance.restore_already_removed: Gateway tests cover each irreversible resource loss and teardown.
  instance.restore_database_changed: Gateway tests cover missing evidence and database identity/admission drift.
  instance.restore_busy: Gateway tests cover queued, running and waiting work.
  instance.restore_publication_failed: Publication failure injection remains a release proof obligation.
  instance.restore_compensation_failed: Withdrawal failure injection remains a release proof obligation.
  http.404: Shared Instance resource binding owns unknown IDs.
  node_access.required: Shared Node access middleware owns authorization.
