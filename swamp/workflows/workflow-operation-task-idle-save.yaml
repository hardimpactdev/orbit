id: 7c508e3a-5d66-4335-9630-78b38e482861
name: operation-task-idle-save
description: >-
  Save the workspace of an idle task group to origin before its VM is released (docs/cli/task/idle-save.mmd): commit uncommitted
  changes in the workspace, bundle HEAD, copy the bundle to Node 209, and push it with a token minted when the push runs to the save
  branch task-<id>-idle, overwriting the previous save. Task VM work is official SSH exec argv; 209 work is inline git. No credential
  reaches the VM.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: tasks.idle_save}
    # The root run of the Operation, which the Gateway checks when it mints.
    run_id: {type: string, pattern: '^[a-f0-9-]{36}$'}
    intent:
      type: object
      properties:
        group_id: {type: integer, minimum: 1}
        instance_id: {type: integer, minimum: 1}
        task_vm_id: {type: integer, minimum: 1}
        node_id: {type: integer, minimum: 1}
        checkout_path: {type: string, pattern: '^/'}
        repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
        remote: {type: string, pattern: '^https://github\.com/'}
        save_branch: {type: string, pattern: '^task-[1-9][0-9]*-idle$'}
        refspec: {type: string, pattern: '^\+refs/heads/candidate:refs/heads/task-[1-9][0-9]*-idle$'}
        object_format: {type: string, enum: [sha1, sha256]}
        ssh_execution: {type: object}
      required: [group_id, instance_id, task_vm_id, node_id, checkout_path, repository, remote, save_branch, refspec, object_format, ssh_execution]
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-publish-token-[a-f0-9-]{36}$'}
          required: [vault, key]
          additionalProperties: false
        git_authorization:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-publish-token-[a-f0-9-]{36}$'}
          required: [vault, key]
          additionalProperties: false
      required: [github_token, git_authorization]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: save
  labels: {role: swamp}
  steps:
  - name: Create save scratch
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-scratch-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 5 mktemp -d /tmp/orbit-task-idle-save-XXXXXXXX
    writes: true
  - name: Read the status
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Create save scratch
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - status
        - --porcelain
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
  - name: Add workspace files
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Read the status
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    guard: ${{ steps["Read the status"].outputs.stdout.trim() == "" }}
    writes: true
  - name: Commit the workspace
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Add workspace files
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - env
        - GIT_AUTHOR_NAME=Orbit
        - GIT_AUTHOR_EMAIL=orbit@users.noreply.github.com
        - GIT_COMMITTER_NAME=Orbit
        - GIT_COMMITTER_EMAIL=orbit@users.noreply.github.com
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - -c
        - core.hooksPath=/dev/null
        - -c
        - commit.gpgSign=false
        - commit
        - --quiet
        - --no-verify
        - --message
        - 'Save the idle workspace'
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    guard: ${{ steps["Read the status"].outputs.stdout.trim() == "" }}
    writes: true
  - name: Export the head
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Commit the workspace
      condition:
        type: or
        conditions: [{type: succeeded}, {type: skipped}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '60'
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - bundle
        - create
        - ${{ "/tmp/orbit-task-idle-save-" + run.id + ".bundle" }}
        - HEAD
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    # A dirty workspace whose commit did not pass saves nothing: pushing HEAD alone would drop its changes.
    guard: '${{ steps["Read the status"].outputs.stdout.trim() != "" && steps["Commit the workspace"].status != "succeeded" }}'
    writes: true
  - name: Copy the bundle
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Export the head
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
      methodName: copy
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-task-idle-save-" + run.id + ".bundle" }}
        dst: ${{ steps["Create save scratch"].outputs.stdout.trim() + "/save.bundle" }}
        direction: from
      globalArgs:
        name: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
  - name: Init the bare repo
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Copy the bundle
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-init-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 git init --quiet --bare --template= --object-format="$ORBIT_OBJECT_FORMAT" "$ORBIT_REPOSITORY"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_OBJECT_FORMAT: ${{ inputs.intent.object_format }}
          ORBIT_REPOSITORY: ${{ steps["Create save scratch"].outputs.stdout.trim() + "/repository.git" }}
    writes: true
  - name: Import the bundle
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Init the bare repo
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-import-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 60 git -C "$ORBIT_REPOSITORY" fetch --quiet --no-tags "$ORBIT_BUNDLE" HEAD:refs/heads/candidate
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_BUNDLE: ${{ steps["Create save scratch"].outputs.stdout.trim() + "/save.bundle" }}
          ORBIT_REPOSITORY: ${{ steps["Create save scratch"].outputs.stdout.trim() + "/repository.git" }}
    writes: true
  - name: Read the saved commit
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Import the bundle
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-read-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 git -C "$ORBIT_REPOSITORY" rev-parse --verify refs/heads/candidate
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create save scratch"].outputs.stdout.trim() + "/repository.git" }}
  - name: Mint the push token
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Read the saved commit
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: '${{ has(inputs.run_id) ? inputs.run_id : run.id }}'
        purpose: publish
  - name: Push the save branch
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Mint the push token
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-push-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        # The save branch belongs to this group alone and holds only the latest save, so the push replaces it.
        run: timeout 60 git -C "$ORBIT_REPOSITORY" push --quiet -- "$ORBIT_REMOTE" "$ORBIT_REFSPEC"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ALLOW_PROTOCOL: https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: core.hooksPath
          GIT_CONFIG_VALUE_1: /dev/null
          GIT_CONFIG_KEY_2: http.followRedirects
          GIT_CONFIG_VALUE_2: 'false'
          GIT_CONFIG_KEY_3: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_3: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key) }}
          ORBIT_REPOSITORY: ${{ steps["Create save scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_REMOTE: ${{ inputs.intent.remote }}
          ORBIT_REFSPEC: ${{ inputs.intent.refspec }}
    writes: true
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - job: save
    condition:
      type: completed
  steps:
  - name: Revoke the token
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-revoke-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method DELETE installation/token 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-idle-save-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    guard: ${{ !("Mint the push token" in steps && steps["Mint the push token"].status == "succeeded") }}
    allowFailure: true
    writes: true
  - name: Remove remote scratch
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
      methodName: exec
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '10'
        - rm
        - -f
        - --
        - ${{ "/tmp/orbit-task-idle-save-" + run.id + ".bundle" }}
        timeoutSec: 70
      globalArgs:
        name: ${{ "task-idle-save-ssh-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    allowFailure: true
    writes: true
  - name: Remove local scratch
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-idle-save-local-cleanup-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_DIRECTORY" "$ORBIT_GH_DIRECTORY"
        env:
          ORBIT_DIRECTORY: '${{ "Create save scratch" in steps && steps["Create save scratch"].status == "succeeded" ? steps["Create save scratch"].outputs.stdout.trim() : "" }}'
          ORBIT_GH_DIRECTORY: ${{ "/tmp/orbit-task-idle-save-" + run.id + "-gh" }}
    writes: true
  - name: Confirm the save
    labels: {role: swamp}
    queueTimeout: 30
    dependsOn:
    - step: Revoke the token
      condition:
        type: completed
    - step: Remove remote scratch
      condition:
        type: completed
    - step: Remove local scratch
      condition:
        type: completed
    task:
      type: assert
      expr: '"Push the save branch" in steps && steps["Push the save branch"].status == "succeeded" && steps["Remove local scratch"].status == "succeeded"'
      message: tasks.idle_save_failed
      severity: high
