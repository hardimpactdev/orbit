---
# The seed copy of the proof default to one CI Node (docs/cli/instance/seed-copy.mmd,
# docs/reference/development-containers.md#the-seed-on-each-ci-node). The workflow runs one tag per step for each target, named by
# ORBIT_TARGET:
#   certificate: on the CI Node, read the Incus server certificate and check that Incus listens where the converge put it.
#   copy: on the default's Node, as root, add the remote of the CI Node when it is missing, check its certificate, then push the inner
#         volume and the container with `--refresh --mode=push`.
#   check: on the CI Node, the holder and its volume hold the seed snapshot that the run was admitted for.
#   release: on the default's Node, once for the run, delete the default's base when the intent allows it, every target passed and the
#            default still holds a seed with the name that the run was admitted for.
#   result: on the Swamp Node, the outcome of every target in `result.json`, a list of `{node_id, status, ...}`.
# Each target writes `target-<id>.json` in the run folder: `{"status": "succeeded"}` after its check, or `{"status": "failed",
# "detail": ...}` at its first failed phase. A later phase of a failed target does nothing.
- name: Pin the two Nodes and address them
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [certificate, copy, check, release]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    target: "{{ intent.targets | selectattr('node_id', 'equalto', lookup('ansible.builtin.env', 'ORBIT_TARGET') | int) | first }}"
    nodes:
      - {name: seed_source, ssh: "{{ intent.source.ssh_execution }}"}
      - {name: seed_target, ssh: "{{ target.ssh_execution }}"}
  tasks:
    # A target that failed in an earlier phase gets no hosts, so the later plays of this run do nothing for it.
    - name: Read the outcome so far
      ansible.builtin.stat: { path: "{{ run }}/target-{{ target.node_id }}.json" }
      register: seed_outcome
    - name: Skip a target that failed in an earlier phase
      ansible.builtin.meta: end_play
      when: seed_outcome.stat.exists and 'release' not in ansible_run_tags
    # A phase that loses its Node in the middle of a task ends without an outcome: Ansible runs no rescue for an unreachable host.
    # Each phase leaves its product in the run folder: the certificate phase the certificate, the copy phase the file `copied-<id>`.
    # With neither product nor outcome, the target failed in that phase. The later phases must not run: a copy would report an
    # error of its own, and a check could pass on a seed of the same name that an earlier copy left.
    - name: Look for what the earlier phases left
      ansible.builtin.stat: { path: "{{ run }}/{{ item.file }}" }
      register: seed_products
      when: item.before in ansible_run_tags
      loop:
        - { phase: certificate, file: "certificate-{{ target.node_id }}.pem", before: copy }
        - { phase: certificate, file: "certificate-{{ target.node_id }}.pem", before: check }
        - { phase: copy, file: "copied-{{ target.node_id }}", before: check }
      loop_control: { label: "{{ item.file }}" }
    - name: Name the first phase that left nothing
      ansible.builtin.set_fact:
        seed_lost: "{{ seed_products.results | selectattr('stat', 'defined') | rejectattr('stat.exists') | map(attribute='item.phase') | first | default('') }}"
    - name: Fail a target whose earlier phase ended without a result
      ansible.builtin.copy:
        content: "{{ {'status': 'failed', 'failed_phase': seed_lost,
          'detail': 'The ' ~ seed_lost ~ ' phase ended without a result: the Node was unreachable, or the phase was cut'} | to_json }}"
        dest: "{{ run }}/target-{{ target.node_id }}.json"
        mode: "0600"
      when: seed_lost != ''
    - name: Skip that target
      ansible.builtin.meta: end_play
      when: seed_lost != ''
    - name: Pin the host keys of both Nodes
      ansible.builtin.known_hosts:
        path: "{{ run }}/known_hosts"
        name: "{{ item.0.ssh.target.host if item.0.ssh.target.port == 22 else '[' ~ item.0.ssh.target.host ~ ']:' ~ item.0.ssh.target.port }}"
        key: >-
          {{ item.0.ssh.target.host if item.0.ssh.target.port == 22 else '[' ~ item.0.ssh.target.host ~ ']:' ~ item.0.ssh.target.port }}
          {{ item.1 }}
        state: present
      check_mode: false
      loop: "{{ nodes | subelements('ssh.target.host_keys') }}"
      loop_control: { label: "{{ item.0.name }}" }
    - name: Address both Nodes
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: ["{{ item.name }}"]
        ansible_host: "{{ item.ssh.target.host }}"
        ansible_user: "{{ item.ssh.target.user }}"
        ansible_port: "{{ item.ssh.target.port }}"
        ansible_ssh_private_key_file: "{{ item.ssh.identity_file }}"
        seed_intent: "{{ intent }}"
        seed_target: "{{ target }}"
      loop: "{{ nodes }}"
      loop_control: { label: "{{ item.name }}" }

- name: Read the certificate of the CI Node
  hosts: seed_target
  gather_facts: false
  become: true
  tags: [certificate]
  vars: &phase
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    outcome: "{{ run }}/target-{{ seed_target.node_id }}.json"
  tasks:
    - name: Read the certificate
      block:
        # Ansible does not rescue an unreachable host: the phase would end with no outcome, and the next phase would run and
        # report its own, misleading error. So the reach is a task: an unreachable Node fails the phase with the SSH error.
        - &reach
          name: Reach the Node
          ansible.builtin.ping:
          register: seed_reach
          ignore_unreachable: true
        - &reached
          name: Require the Node
          ansible.builtin.fail: { msg: "The Node is unreachable: {{ seed_reach.msg | default('no detail') }}" }
          when: seed_reach.unreachable | default(false)
        - name: Read the Incus listener
          ansible.builtin.command: { argv: [incus, config, get, core.https_address] }
          register: seed_listener
          changed_when: false
        - name: Require the listener of the seed
          ansible.builtin.assert:
            that: seed_listener.stdout | trim == seed_target.listen
            fail_msg: "Incus does not listen on {{ seed_target.listen }}: a ci-runner converge of the Node adds the listener and the trust"
            quiet: true
        - name: Read the server certificate
          ansible.builtin.slurp: { src: /var/lib/incus/server.crt }
          register: seed_server
        - name: Keep it in the run folder
          ansible.builtin.copy:
            content: "{{ seed_server.content | b64decode }}"
            dest: "{{ run }}/certificate-{{ seed_target.node_id }}.pem"
            mode: "0600"
          delegate_to: localhost
          become: false
          vars: &local
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue: &failed
        - name: Record the failed phase
          ansible.builtin.copy:
            content: "{{ {'status': 'failed', 'failed_phase': ansible_run_tags | first,
              'detail': ansible_failed_result.msg | default('') ~ ' ' ~ ansible_failed_result.stderr | default('')} | to_json }}"
            dest: "{{ outcome }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          vars: *local
        - name: Fail the phase
          ansible.builtin.fail: { msg: "{{ ansible_failed_result.msg | default('the phase failed') }}" }

- name: Push the seed from the default's Node
  hosts: seed_source
  gather_facts: false
  become: true
  tags: [copy]
  vars:
    <<: *phase
    project_args: [--project, "{{ seed_intent.project }}", --target-project, "{{ seed_intent.project }}"]
    remote: "{{ seed_target.remote }}"
    # Root's Incus client keeps all its remotes in one file, and `incus remote add` rewrites it without a lock: two adds side by side
    # both pass, but one remote is lost. The copies of a run add theirs one at a time under this lock.
    seed_remote_lock: /run/lock/orbit-proof-seed-remotes.lock
  tasks:
    - name: Push the seed
      block:
        - *reach
        - *reached
        - name: Read the remotes of root
          ansible.builtin.command: { argv: [incus, remote, list, --format, json] }
          register: seed_remotes
          changed_when: false
        - name: Add the remote of the CI Node
          when: remote not in (seed_remotes.stdout | from_json)
          ansible.builtin.command:
            argv: >-
              {{ ['flock', seed_remote_lock, 'incus', 'remote', 'add', remote, 'https://' ~ seed_target.listen, '--accept-certificate', '--auth-type', 'tls'] }}
          changed_when: true
        - name: Read the certificate that root stored for the remote
          ansible.builtin.slurp: { src: "/root/.config/incus/servercerts/{{ remote }}.crt" }
          register: seed_stored
        - name: Require the certificate read on the CI Node
          ansible.builtin.assert:
            that: (seed_stored.content | b64decode | trim) == (lookup('ansible.builtin.file', run ~ '/certificate-' ~ seed_target.node_id ~ '.pem') | trim)
            fail_msg: "The remote {{ remote }} has another server certificate than the CI Node"
            quiet: true
        # `--refresh` sends from the newest snapshot that both sides share, by name and creation time. The default keeps the seed that
        # this Node holds as `base-<commit>` (docs/reference/development-containers.md#how-the-seed-moves), so the holder's pair takes
        # that name too. A rename keeps the creation time. A holder without that seed, or no holder, gets the whole pair.
        - name: Read the default's base
          ansible.builtin.command:
            argv: [incus, query, "--", "/1.0/instances/{{ seed_intent.source.container }}/snapshots?project={{ seed_intent.project }}&recursion=1"]
          register: seed_source_snapshots
          changed_when: false
        - name: Name the base
          ansible.builtin.set_fact:
            seed_base: "{{ seed_source_snapshots.stdout | from_json | map(attribute='name') | select('match', '^base-') | first | default('') }}"
        - name: Read the holder's snapshots
          when: seed_base != ''
          ansible.builtin.command:
            argv: [incus, query, "--", "{{ remote }}:/1.0/instances/{{ seed_intent.holder }}/snapshots?project={{ seed_intent.project }}&recursion=1"]
          register: seed_holder_snapshots
          changed_when: false
          failed_when: false
        - name: Read the holder volume's snapshots
          when: seed_base != '' and seed_intent.source.inner_volume is not none
          ansible.builtin.command:
            argv: >-
              {{ ['incus', 'query', '--', remote ~ ':/1.0/storage-pools/' ~ seed_intent.pool ~ '/volumes/custom/' ~ seed_intent.holder_volume
                  ~ '/snapshots?project=' ~ seed_intent.project ~ '&recursion=1'] }}
          register: seed_holder_volume_snapshots
          changed_when: false
          failed_when: false
        - name: Name the holder's seeds
          when: seed_base != ''
          ansible.builtin.set_fact:
            seed_holder_names: >-
              {{ (seed_holder_snapshots.stdout | from_json | map(attribute='name') | list) if seed_holder_snapshots.rc == 0 else [] }}
            # Incus names a volume snapshot `<volume>/<snapshot>`; the seed name is the last part.
            seed_holder_volume_names: >-
              {{ (seed_holder_volume_snapshots.stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | list)
                 if seed_intent.source.inner_volume is not none and seed_holder_volume_snapshots.rc == 0 else [] }}
        - name: Give the holder's seed the base's name
          when: >-
            seed_base != '' and seed_base not in seed_holder_names
            and seed_base | regex_replace('^base-', 'seed-') in seed_holder_names
          ansible.builtin.command:
            argv: >-
              {{ ['incus', 'snapshot', 'rename', remote ~ ':' ~ seed_intent.holder, seed_base | regex_replace('^base-', 'seed-'), seed_base,
                  '--project', seed_intent.project] }}
          changed_when: true
        - name: Give the holder volume's seed the base's name
          when: >-
            seed_base != '' and seed_intent.source.inner_volume is not none and seed_base not in seed_holder_volume_names
            and seed_base | regex_replace('^base-', 'seed-') in seed_holder_volume_names
          ansible.builtin.command:
            argv: >-
              {{ ['incus', 'storage', 'volume', 'snapshot', 'rename', remote ~ ':' ~ seed_intent.pool, seed_intent.holder_volume,
                  seed_base | regex_replace('^base-', 'seed-'), seed_base, '--project', seed_intent.project] }}
          changed_when: true
        # An instance copy does not take its attached custom volumes, so the inner volume goes first, and the container's disk names it.
        # Each push stops after ProofSeeds::PushSeconds: a first full copy is a few GB over WireGuard; a refresh is small.
        # The targets' copies run side by side. Each push of the mounted, block-backed inner volume first syncs it with a freeze and an
        # immediate thaw (Incus zfs MigrateVolume), before it sends anything; a freeze while another push holds its own fails with
        # `Device or resource busy`. Only that failure is tried again: the other push thaws within a moment.
        - name: Push the inner volume
          when: seed_intent.source.inner_volume is not none
          ansible.builtin.command:
            argv: >-
              {{ ['timeout', '1200', 'incus', 'storage', 'volume', 'copy',
                  seed_intent.pool ~ '/' ~ seed_intent.source.inner_volume, remote ~ ':' ~ seed_intent.pool ~ '/' ~ seed_intent.holder_volume,
                  '--refresh', '--mode=push'] + project_args }}
          register: seed_volume_push
          until: seed_volume_push.rc == 0 or 'Failed freezing filesystem' not in seed_volume_push.stderr
          retries: 5
          delay: 2
          changed_when: true
        - name: Push the container
          ansible.builtin.command:
            argv: >-
              {{ ['timeout', '1200', 'incus', 'copy', seed_intent.source.container, remote ~ ':' ~ seed_intent.holder,
                  '--refresh', '--mode=push', '--device', 'eth0,ipv4.address=', '--device', 'eth0,security.acls=' ~ seed_intent.holder_nic_acl]
                 + (['--device', 'inner-pool,source=' ~ seed_intent.holder_volume] if seed_intent.source.inner_volume is not none else [])
                 + project_args }}
          changed_when: true
        # The check trusts only a copy of this run that ran to its end.
        - name: Record the finished copy
          ansible.builtin.copy: { content: "", dest: "{{ run }}/copied-{{ seed_target.node_id }}", mode: "0600" }
          delegate_to: localhost
          become: false
          vars: *local
      rescue: *failed

- name: Check the holder on the CI Node
  hosts: seed_target
  gather_facts: false
  become: true
  tags: [check]
  vars: *phase
  tasks:
    - name: Check the holder
      block:
        - *reach
        - *reached
        - name: Read the holder's snapshots
          ansible.builtin.command:
            argv: [incus, query, "--", "/1.0/instances/{{ seed_intent.holder }}/snapshots?project={{ seed_intent.project }}&recursion=1"]
          register: seed_holder
          changed_when: false
        - name: Read the volume's snapshots
          when: seed_intent.source.inner_volume is not none
          ansible.builtin.command:
            argv: >-
              {{ ['incus', 'query', '--', '/1.0/storage-pools/' ~ seed_intent.pool ~ '/volumes/custom/' ~ seed_intent.holder_volume
                  ~ '/snapshots?project=' ~ seed_intent.project ~ '&recursion=1'] }}
          register: seed_volume
          changed_when: false
        # Incus names a volume snapshot `<volume>/<snapshot>`; the seed name is the last part.
        - name: Require the seed snapshot in both halves
          ansible.builtin.assert:
            that:
              - seed_intent.snapshot in (seed_holder.stdout | from_json | map(attribute='name') | list)
              - >-
                seed_intent.source.inner_volume is none
                or seed_intent.snapshot in (seed_volume.stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | list)
            fail_msg: "The holder does not hold {{ seed_intent.snapshot }}"
            quiet: true
        - name: Record the passed target
          ansible.builtin.copy: { content: '{"status": "succeeded"}', dest: "{{ outcome }}", mode: "0600" }
          delegate_to: localhost
          become: false
          vars: *local
      rescue: *failed

# The base serves only the Nodes behind the seed. When the run targeted all of them and each passed, none needs it. A seed with a new
# name belongs to a retake to a new commit during the run, which keeps or deletes the base itself, so the release then does nothing.
# The check is by name only: after a retake at the same commit, the release deletes the base that the retake kept, and the next copy
# sends the whole pair (docs/reference/development-containers.md#how-the-seed-moves).
- name: Release the default's base
  hosts: seed_source
  gather_facts: false
  become: true
  tags: [release]
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
  tasks:
    # A lookup reads the run folder on the Swamp Node.
    - name: Read every target's outcome
      ansible.builtin.set_fact:
        passed: >-
          {{ passed | default(true) | bool and ((lookup('ansible.builtin.file', run ~ '/target-' ~ item.node_id ~ '.json', errors='ignore')
             or '{}') | from_json).status | default('') == 'succeeded' }}
      loop: "{{ seed_intent.targets }}"
      loop_control: { label: "{{ item.node_id }}" }
    - name: Read the default's snapshots
      when: seed_intent.release_base and passed | bool
      ansible.builtin.command:
        argv: [incus, query, "--", "/1.0/instances/{{ seed_intent.source.container }}/snapshots?project={{ seed_intent.project }}&recursion=1"]
      register: release_snapshots
      changed_when: false
    - name: Read the inner volume's snapshots
      when: seed_intent.release_base and passed | bool and seed_intent.source.inner_volume is not none
      ansible.builtin.command:
        argv: >-
          {{ ['incus', 'query', '--', '/1.0/storage-pools/' ~ seed_intent.pool ~ '/volumes/custom/' ~ seed_intent.source.inner_volume
              ~ '/snapshots?project=' ~ seed_intent.project ~ '&recursion=1'] }}
      register: release_volume_snapshots
      changed_when: false
    - name: Name the bases
      when: seed_intent.release_base and passed | bool
      ansible.builtin.set_fact:
        release_names: "{{ release_snapshots.stdout | from_json | map(attribute='name') | list }}"
        release_volume_names: >-
          {{ (release_volume_snapshots.stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | list)
             if seed_intent.source.inner_volume is not none else [] }}
    - name: Delete the default's base
      when: seed_intent.release_base and passed | bool and seed_intent.snapshot in release_names
      ansible.builtin.command: { argv: "{{ ['incus', 'snapshot', 'delete', seed_intent.source.container, item, '--project', seed_intent.project] }}" }
      loop: "{{ release_names | select('match', '^base-') | list }}"
      changed_when: true
    - name: Delete the inner volume's base
      when: seed_intent.release_base and passed | bool and seed_intent.snapshot in release_names and seed_intent.source.inner_volume is not none
      ansible.builtin.command:
        argv: >-
          {{ ['incus', 'storage', 'volume', 'snapshot', 'delete', seed_intent.pool, seed_intent.source.inner_volume, item,
              '--project', seed_intent.project] }}
      loop: "{{ release_volume_names | select('match', '^base-') | list }}"
      changed_when: true

- name: Report every target
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [result]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
  tasks:
    - name: Read each target's outcome
      ansible.builtin.set_fact:
        seed_targets: >-
          {{ seed_targets | default([]) + [{'node_id': item.node_id} | combine((lookup('ansible.builtin.file',
             run ~ '/target-' ~ item.node_id ~ '.json', errors='ignore') or '{"status": "failed", "detail": "The target did not finish"}') | from_json)] }}
      loop: "{{ intent.targets }}"
      loop_control: { label: "{{ item.node_id }}" }
    - name: Write the result
      ansible.builtin.copy: { content: "{{ {'targets': seed_targets | default([])} | to_json }}", dest: "{{ run }}/result.json", mode: "0600" }
