id: eefb6690-519c-4416-a89c-c43c1c34ec97
name: project-routine
description: Select a routine from admitted Gateway state and return its group request.
inputs:
  type: object
  additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      enum:
      - 209
    kind: {type: string, const: project.routine}
    intent:
      type: object
    execution_secrets:
      type: object
      properties: {}
      additionalProperties: false
reports:
  skip:
  - '@swamp/workflow-summary'
jobs:
- name: routine
  labels: {role: swamp}
  steps:
  - name: Read the admitted input
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/project-maintenance-input'
      behaviorName: project-input
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
  - name: Select this week's routine
    labels: {role: swamp}
    dependsOn:
    - step: Read the admitted input
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: schedule_project
      inputs:
        project: ${{ steps["Read the admitted input"].outputs.project }}
        groups: ${{ inputs.intent.groups }}
        admitted_at: ${{ inputs.intent.admitted_at }}
  - name: Report the result
    labels: {role: swamp}
    dependsOn:
    - step: Select this week's routine
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: project-routine-result
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' "$ORBIT_RESULT"

          '
        env:
          ORBIT_RESULT: ${{ steps["Select this week's routine"].outputs.result_json }}
