id: 393024cd-986d-46f7-bf26-2a500281d492
name: swamp-credential-monitor
description: Hourly native expiry check of Swamp-side credentials on Node 209; renews the orbit-node-209 worker pair under 6 h from another 209 worker.
trigger:
  schedule: '0 7 * * * *'
reports:
  skip: ["@swamp/workflow-summary"]
vaults: []
queueTimeout: 120
jobs:
  - name: monitor
    steps:
      - name: assets
        target: swamp209-services
        queueTimeout: 120
        task:
          type: behavior
          behaviorType: '@nckrtl/node-worker-assets'
          behaviorName: credential-monitor-assets
          methodName: credential_scripts
          inputs: {node_id: 209}
      - name: check
        target: swamp209-services
        queueTimeout: 120
        dependsOn:
          - step: assets
            condition: {type: succeeded}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: credential-monitor-check
          methodName: execute
          inputs:
            run: timeout 150 sudo -n /usr/bin/python3 -I '${{ steps.assets.outputs.check_path }}'
      - name: renew
        target: swamp209-services
        queueTimeout: 120
        writes: true
        dependsOn:
          - step: check
            condition: {type: succeeded}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: credential-monitor-renew
          methodName: execute
          inputs:
            run: timeout 420 sudo -n --preserve-env=ORBIT_EXPIRY_REPORT /usr/bin/python3 -I '${{ steps.assets.outputs.renew_path }}'
            env:
              ORBIT_EXPIRY_REPORT: '${{ steps.check.outputs.stdout }}'
