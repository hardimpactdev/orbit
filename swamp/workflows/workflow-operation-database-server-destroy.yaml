id: 2fb743f6-7bd7-4d0a-8a61-168d30da8a44
name: operation-database-server-destroy
description: Database server removal from 209, docker rm and one inspect end check over official SSH; the data volume stays.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database_server.destroy}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: server
  labels: {role: swamp}
  steps:
    # One that is already gone counts as removed (exit 0 or 1); the volume stays. cfgmgmt docker_container would store
    # its env as sensitive output in a vault the swamp role cannot write, so one docker command runs as exec argv.
  - name: 'Remove the container'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '90', docker, rm, --force, '${{ inputs.intent.container }}']
        timeoutSec: 100
    # The end check: inspect must find no such container (exit 1); a container still present fails the run.
  - name: 'Check it is gone'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the container', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', docker, container, inspect, --format, '{{.Id}}', '${{ inputs.intent.container }}']
        okExitCodes: [1]
        timeoutSec: 40
