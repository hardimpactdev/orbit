---
# The base converge of the due nested Nodes (`fleet_converge_nodes`) for the refresh (instance-fleet-refresh.yml), through the nested
# Gateway's API as the operator: the base places the agent of the checkout's delivery pin, Orbit's files and units. All due Nodes are
# admitted first and run side by side: two base converges never share the hub's reservation (NodeNetworkReservation), and the
# converge workflow's Node plays lock a behavior per Node. Then every Operation is read every `fleet_ready_delay` seconds, 900 s at
# most, until each has ended, so no run is still going when a failure fails the refresh and the run restores the old seed. The
# refresh fails when any Node's converge did not succeed, and names each such Node. The task VM refresh does the same with
# `node:converge <id> --base` (task-vm-fleet-base-node.yml). The count of tasks each converge changed (`result.changed`) adds to
# `fleet_converge_changed`, and a Node with a change joins `fleet_converge_changed_roles`; a result without a count counts as a change.
# When the refresh's `host` part is due, nested-app-dev converges its base and its `app-dev` role instead: the container branch of an
# Instance fleet Node (docs/reference/development-containers.md#instance-host-in-the-fleet).
- name: Admit the base converge of each due nested Node
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '90'] + fleet_curl + ['--fail', '-X', 'POST', fleet_api ~ '/nodes/' ~ item.id ~ '/converge',
          '-H', 'Content-Type: application/json', '-d',
          '{"roles":["app-dev"]}' if item.name == 'app-dev' and fleet_due.host | default(false) | bool else '{"base":true}'] }}
  loop: "{{ fleet_converge_nodes }}"
  loop_control: { label: "{{ item.name }}" }
  register: fleet_converge
  changed_when: true
  # A refused admission fails the refresh only after the admitted converges have ended (the check below).
  failed_when: false
- name: Wait for the base converge of each due nested Node
  ansible.builtin.command:
    argv: "{{ ['timeout', '90'] + fleet_curl + ['--fail', fleet_api ~ '/operations/' ~ (item.stdout | from_json).data.id] }}"
  loop: "{{ fleet_converge.results | selectattr('rc', 'eq', 0) | list }}"
  loop_control: { label: "{{ item.item.name }}" }
  register: fleet_converge_wait
  changed_when: false
  failed_when: false
  until: >-
    ((fleet_converge_wait.stdout | default('{}', true) | from_json).data | default({})).status | default('')
    in ['succeeded', 'failed', 'cancelled', 'interrupted']
  # 900 s; 1800 s while nested-app-dev builds its first Instance host (no `host` in the record): the stock and Instance images too.
  retries: "{{ 360 if fleet_due.host | default(false) | bool and fleet_recorded.host is not defined else 180 }}"
  delay: "{{ fleet_ready_delay }}"
- name: Read the base converges of the nested Nodes
  ansible.builtin.set_fact:
    # One row per due Node: its name, its Operation and the Operation as last read.
    fleet_converge_ops: >-
      {%- set rows = [] -%}
      {%- for wait in fleet_converge_wait.results -%}
      {%- set _ = rows.append({'name': wait.item.item.name, 'id': (wait.item.stdout | from_json).data.id,
            'data': (wait.stdout | default('{}', true) | from_json).data | default({})}) -%}
      {%- endfor -%}
      {{ rows }}
- name: Check the base converges of the nested Nodes
  vars:
    fleet_converge_refused: "{{ fleet_converge.results | rejectattr('rc', 'eq', 0) | list }}"
    fleet_converge_failed: "{{ fleet_converge_ops | rejectattr('data.status', 'defined') | list
      + (fleet_converge_ops | selectattr('data.status', 'defined') | rejectattr('data.status', 'eq', 'succeeded') | list) }}"
  ansible.builtin.assert:
    that: fleet_converge_refused | length == 0 and fleet_converge_failed | length == 0
    fail_msg: >-
      The base converge of the nested fleet failed. {% for row in fleet_converge_refused %}The nested Gateway did not admit the base converge of {{ row.item.name }}:
      {{ row.stderr | default('') | trim | truncate(300) }}. {% endfor %}{% for row in fleet_converge_failed %}The base converge of the
      nested Node {{ row.name }} (Operation {{ row.id }}) ended {{ row.data.status | default('with no status') }}{{ (' with '
      ~ row.data.error_code) if row.data.error_code | default(none) else '' }}. {% endfor %}
    quiet: true
- name: Count the tasks the base converges changed
  vars:
    fleet_operation_changed: "{{ (item.data.result | default({}, true)).changed | default(none) }}"
  ansible.builtin.set_fact:
    fleet_converge_changed: "{{ fleet_converge_changed | int + (fleet_operation_changed | int if fleet_operation_changed is number else 1) }}"
    # The Nodes whose disk the converge changed: their `base` is retaken, with the nested Gateway's.
    fleet_converge_changed_roles: >-
      {{ fleet_converge_changed_roles + ([item.name] if fleet_operation_changed is not number or fleet_operation_changed | int > 0 else []) }}
  loop: "{{ fleet_converge_ops }}"
  loop_control: { label: "{{ item.name }}" }
