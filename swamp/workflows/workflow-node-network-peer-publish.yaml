        - type: skipped
    guard: ${{ inputs.intent.peer.operator_dns == null }}
  - name: verify_peer_publication
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" <<'PYTHON'
          import json
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          saved = json.loads(private_read(journal))
          if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
              raise SystemExit("wireguard.peer_recovery_pending")
          subprocess.run(["/usr/bin/systemctl", "is-active", "--quiet", "wg-quick@orbit"], check=True, capture_output=True, timeout=10)
          public = subprocess.run(["/usr/bin/wg", "show", "orbit", "public-key"], check=True, capture_output=True, text=True, timeout=10).stdout.strip()
          if public != intent["public_key"]:
              raise SystemExit("vpn.peer_key_mismatch")
          checks = [] if intent["peer"]["operator_dns"] is not None else (("dns", intent["peer"]["dns_server"]), ("domain", " ".join("~" + domain for domain in intent["peer"]["domains"])), ("default-route", "no"))
          for property_name, expected in checks:
              observed = subprocess.run(["/usr/bin/resolvectl", property_name, "orbit"], check=True, capture_output=True, text=True, timeout=10).stdout.split(":", 1)[-1].strip()
              if observed != expected:
                  raise SystemExit("wireguard.peer_config_failed")
          if intent["peer"]["operator_dns"] is not None and os.path.lexists(root / "orbit.dns-link"):
              raise SystemExit("wireguard.peer_config_failed")
          print(json.dumps({"peer_published": True, "public_key": public, "retained": intent["peer"]["retain"]}, separators=(",", ":")))
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.publication_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-verify-peer-publication" }}
    dependsOn:
    - step: withdraw_operator_dns_metadata
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
