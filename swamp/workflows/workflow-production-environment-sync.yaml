id: e42acb3a-75fc-42ee-a45d-c43b810ca751
name: production-environment-sync
autoContinue: false
description: Apply the stored environment to the verified live AppProd release.
queueTimeout: 30
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {const: instance.sync_environment}
    intent: {type: object, required: [target, ssh_execution]}
    execution_secrets:
      type: object
      required: [environment]
      additionalProperties: false
      properties:
        environment:
          type: object
          required: [vault, key]
          additionalProperties: false
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^instance-environment-[1-9][0-9]*$'}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: environment
  steps:
  - name: Check the environment owner
    labels: {role: swamp}
    task:
      type: assert
      expr: inputs.execution_secrets.environment.key == "instance-environment-" + string(inputs.operation_id) && inputs.intent.target.node_id == inputs.node_id
      message: The environment or target belongs to a different Operation.
      severity: high
  - name: Apply the live environment
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Check the environment owner, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("app-prod-environment-" + string(inputs.intent.target.instance_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ "app-prod-environment-ssh-" + string(inputs.node_id) }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts:
        - name: target
          address: '${{ inputs.intent.ssh_execution.target.host }}'
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: 960
        stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'
        argv: [/usr/bin/timeout, '930', /usr/local/libexec/orbit-instance-release-control, '${{ string(inputs.node_id) }}', '${{ string(inputs.intent.target.instance_id) }}', '${{ inputs.intent.target.release }}', environment]
