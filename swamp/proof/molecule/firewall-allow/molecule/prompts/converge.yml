---
# The commands of the three cases, run on the task VM (the operator side) with the real CLI against the nested Gateway. One host per case
# (molecule.yml, cases.yml), one after the other: two cases assert that the Gateway created no Operation at all, so nothing else may write
# firewall rules while they run.
- ansible.builtin.import_playbook: target.yml

- name: Run the cases
  hosts: case_hosts
  gather_facts: false
  serial: 1
  vars_files: [cases.yml]
  tasks:
    - ansible.builtin.import_tasks: act.yml
