# These jobs are inserted into the one Instance removal DAG, never a child run.
jobs:
  - name: stop_schedules
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: {node: '${{ string(inputs.node_id) }}'}
    dependsOn: [{job: check_publication, condition: {type: succeeded}}]
    steps:
      - name: stop-schedule-${{ self.schedule.id }}
        target: '${{ "orbit-node-" + string(inputs.node_id) }}'
        labels: {node: '${{ string(inputs.node_id) }}'}
        forEach: {item: schedule, in: '${{ inputs.intent.direct_destroy.runtime.schedules }}'}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "irm-r-1-" + run.id + "-" + string(self._index) }}'
          methodName: execute
          inputs:
            run: |
              set -eu
              /usr/bin/python3 - <<'PY'
              import json
              import os
              import re
              import subprocess
              import sys

              schedule = os.environ['ORBIT_SCHEDULE_ID']
              if re.fullmatch(r'[a-f0-9-]{36}', schedule) is None:
                  sys.exit(1)
              unit = 'orbit-schedule-' + schedule + '.timer'
              exists = subprocess.run(['systemctl', 'show', '--property=LoadState', '--value', unit],
                                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
              if exists.returncode != 0:
                  sys.exit(1)
              if exists.stdout.strip() != b'not-found':
                  subprocess.run(['sudo', '-n', 'systemctl', 'disable', '--now', '--', unit], check=True,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              print(json.dumps({'schedule_id': schedule, 'stopped': True}))
              PY
            env: {ORBIT_SCHEDULE_ID: '${{ self.schedule.id }}'}
  - name: stop_processes
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: {node: '${{ string(inputs.node_id) }}'}
    dependsOn: [{job: stop_schedules, condition: {type: succeeded}}]
    steps:
      - name: stop-process-${{ self.process.process_id }}
        target: '${{ "orbit-node-" + string(inputs.node_id) }}'
        labels: {node: '${{ string(inputs.node_id) }}'}
        forEach: {item: process, in: '${{ inputs.intent.direct_destroy.runtime.processes }}'}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "irm-r-2-" + run.id + "-" + string(self._index) }}'
          methodName: execute
          inputs:
            run: |
              set -eu
              /usr/bin/python3 - <<'PY'
              import json
              import os
              import re
              import subprocess
              import sys

              process_id, name = int(os.environ['ORBIT_PROCESS_ID']), os.environ['ORBIT_PROCESS_NAME']
              if re.fullmatch(r'orbit-process-' + str(process_id) + r'-[a-z0-9-]+(?:\.service)?', name) is None:
                  sys.exit(1)
              if os.environ['ORBIT_RUNTIME'] == 'systemd':
                  unit = name if name.endswith('.service') else name + '.service'
                  exists = subprocess.run(['systemctl', 'show', '--property=LoadState', '--value', unit],
                                          stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
                  if exists.returncode != 0:
                      sys.exit(1)
                  if exists.stdout.strip() != b'not-found':
                      subprocess.run(['sudo', '-n', 'systemctl', 'stop', '--', unit], check=True,
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              elif os.environ['ORBIT_RUNTIME'] == 'docker':
                  observed = subprocess.run(['sudo', '-n', 'docker', 'container', 'ls', '-a',
                                             '--filter', 'name=^/' + name + '$', '--format', '{{.Names}}'],
                                            stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
                  if observed.returncode != 0:
                      sys.exit(1)
                  if observed.stdout.strip():
                      if observed.stdout.strip().decode() != name:
                          sys.exit(1)
                      subprocess.run(['sudo', '-n', 'docker', 'stop', '--', name], check=True,
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              else:
                  sys.exit(1)
              print(json.dumps({'process_id': process_id, 'stopped': True}))
              PY
            env:
              ORBIT_PROCESS_ID: '${{ string(self.process.process_id) }}'
              ORBIT_PROCESS_NAME: '${{ self.process.name }}'
              ORBIT_RUNTIME: '${{ self.process.runtime }}'
  - name: teardown
    concurrency: 1
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: {node: '${{ string(inputs.node_id) }}'}
    dependsOn: [{job: stop_processes, condition: {type: succeeded}}]
    steps:
      - name: teardown-${{ self.program.instance_id }}-${{ self.program.index }}
        target: '${{ "orbit-node-" + string(inputs.node_id) }}'
        labels: {node: '${{ string(inputs.node_id) }}'}
        forEach: {item: program, in: '${{ steps["captured-inputs"].outputs.teardown }}'}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "irm-r-3-" + run.id + "-" + string(self._index) }}'
          methodName: execute
          inputs:
            run: |
              set -eu
              if [ "$ORBIT_ENVIRONMENT" = production ]; then
                set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_TEARDOWN_INPUT,ORBIT_TEARDOWN_COMMAND,ORBIT_ENVIRONMENT
              else
                set --
              fi
              "$@" /usr/bin/python3 - <<'PY'
              import hashlib
              import json
              import os
              import subprocess
              import sys
              import tempfile

              from identity import Refusal, account, directory, environment_file, require

              try:
                  program = json.loads(os.environ['ORBIT_TEARDOWN_INPUT'])
                  script = os.environ.pop('ORBIT_TEARDOWN_COMMAND')
                  require(hashlib.sha256(script.encode()).hexdigest() == program['step']['sha256'])
                  production = os.environ['ORBIT_ENVIRONMENT'] == 'production'
                  owner = account(program, production)
                  require(owner is not None)
                  directory(program['checkout'], owner.pw_uid, owner.pw_gid)
                  environment = environment_file(program['environment_file'], owner, production)
                  environment.update(PATH='/usr/local/bin:/usr/bin:/bin', HOME=owner.pw_dir,
                                     USER=owner.pw_name, LOGNAME=owner.pw_name)
                  # The private script is a protected file, never sh -c argv.
                  with tempfile.TemporaryDirectory(prefix='orbit-teardown-') as temporary:
                      os.chmod(temporary, 0o700)
                      path = temporary + '/step.sh'
                      descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                      with os.fdopen(descriptor, 'w') as output:
                          output.write(script)
                      if owner.pw_uid != os.geteuid():
                          os.chown(temporary, owner.pw_uid, owner.pw_gid)
                          os.chown(path, owner.pw_uid, owner.pw_gid)
                          command = ['/usr/sbin/runuser', '-u', program['user'], '--', '/bin/sh', path]
                      else:
                          command = ['/bin/sh', path]
                      result = subprocess.run(command, cwd=program['checkout'], stdin=subprocess.DEVNULL,
                                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                              env=environment,
                                              timeout=program['step']['timeout_seconds'], check=False)
                      require(result.returncode == 0, 'instance.teardown_failed')
                  print(json.dumps({'instance_id': program['instance_id'], 'step_name': program['step']['name'], 'outcome': 'succeeded'}))
              except (Refusal, OSError, KeyError, ValueError, subprocess.SubprocessError) as error:
                  print(json.dumps({'error_code': getattr(error, 'code', 'instance.teardown_failed')}))
                  sys.exit(1)
              PY
            env:
              PYTHONPATH: '${{ steps["public-inputs"].outputs.library }}'
              ORBIT_TEARDOWN_INPUT: '${{ self.program.input_json }}'
              ORBIT_ENVIRONMENT: '${{ inputs.intent.environment }}'
              ORBIT_TEARDOWN_COMMAND: '${{ vault.get(inputs.execution_secrets[self.program.secret_field].vault, inputs.execution_secrets[self.program.secret_field].key) }}'
  - name: verify_sources
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: {node: '${{ string(inputs.node_id) }}'}
    dependsOn: [{job: teardown, condition: {type: succeeded}}]
    steps:
      - name: verify-source-${{ self.member.instance_id }}
        target: '${{ "orbit-node-" + string(inputs.node_id) }}'
        labels: {node: '${{ string(inputs.node_id) }}'}
        forEach: {item: member, in: '${{ steps["captured-inputs"].outputs.members }}'}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "irm-r-4-" + run.id + "-" + string(self._index) }}'
          methodName: execute
          inputs:
            run: |
              set -eu
              if [ "$ORBIT_ENVIRONMENT" = production ]; then
                set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER
              else
                set --
              fi
              "$@" /usr/bin/python3 - <<'PY'
              import json
              import os
              import sys

              from identity import Refusal, verify_source

              try:
                  value = json.loads(os.environ['ORBIT_REMOVAL_MEMBER'])
                  result = verify_source(value['member'], value['capture'], value['intent'], allow_quarantine=True)
                  print(json.dumps(result))
              except (Refusal, OSError, KeyError, ValueError) as error:
                  print(json.dumps({'error_code': getattr(error, 'code', 'instance.unsafe_content')}))
                  sys.exit(1)
              PY
            env:
              PYTHONPATH: '${{ steps["public-inputs"].outputs.library }}'
              ORBIT_REMOVAL_MEMBER: '${{ self.member.input_json }}'
              ORBIT_ENVIRONMENT: '${{ inputs.intent.environment }}'
