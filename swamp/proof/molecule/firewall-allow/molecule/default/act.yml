---
# One case, run for its own host: setup commands, the snapshots before, `orbit ... --json`, the assert on the answer, the wait on the
# Operation receipt, the snapshots after. The product refuses a firewall write while another one holds the Node (`operation.target_busy`),
# so every CLI call asks again until it is admitted; the number of asks is kept as `busy_retries`. A failed check is recorded, not raised,
# so one verdict per case survives. Results stay as cacheable facts of the case host (the fact cache of molecule.yml) for verify.yml.
- name: "{{ inventory_hostname }}"
  block:
    - name: "{{ inventory_hostname }}: start the clock"
      ansible.builtin.set_fact:
        case_t0: "{{ now().timestamp() }}"

    - name: "{{ inventory_hostname }}: setup commands"
      ansible.builtin.command:
        argv: "{{ orbit + item + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      loop: "{{ d.setup | default([]) }}"
      register: setup_run
      until: setup_run.rc == 0 or (setup_run.stdout ~ setup_run.stderr) is not search('operation.target_busy')
      retries: 60
      delay: 1
      changed_when: false

    - name: "{{ inventory_hostname }}: UFW table of app-dev before"
      ansible.builtin.command: ufw status numbered
      delegate_to: nested-app-dev
      register: ufw_pre
      changed_when: false

    - name: "{{ inventory_hostname }}: Operations before"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: ops_pre

    - name: "{{ inventory_hostname }}: firewall records of app-dev before"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules?node={{ app_dev_id }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: rec_pre

    - name: "{{ inventory_hostname }}: run the command"
      ansible.builtin.command:
        argv: "{{ orbit + d.argv + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      register: ran
      failed_when: false
      changed_when: false
      until: ran.rc == 0 or (ran.stdout ~ ran.stderr) is not search('operation.target_busy')
      retries: 60
      delay: 1

    - name: "{{ inventory_hostname }}: read the answer"
      ansible.builtin.set_fact:
        answer: "{{ (ran.stdout | from_json) if (ran.stdout is search('^\\s*[{\\[]')) else {} }}"

    - name: "{{ inventory_hostname }}: the answer is the one the contract promises"
      vars:
        code: "{{ answer.error_code | default(answer.error.code | default('')) }}"
      ansible.builtin.assert:
        that:
          - ran.rc == d.expect.rc
          - (d.expect.status | default('')) == '' or answer.status == d.expect.status
          - (d.expect.code | default('')) == '' or code == d.expect.code
          - (d.expect.skipped | default('')) == '' or d.expect.skipped in (answer | to_json)
        fail_msg: "exit {{ ran.rc }}, status {{ answer.status | default('-') }}, code {{ code }}; expected {{ d.expect }}"
        quiet: true

    - name: "{{ inventory_hostname }}: wait for the Operation receipt"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations/{{ answer.id | default(answer.operation.id | default('')) }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: receipt
      until: (receipt.json.data | default(receipt.json)).status in ['succeeded', 'failed', 'cancelled']
      retries: 30
      delay: 2
      when: d.expect.request | default(true)

    - name: "{{ inventory_hostname }}: the receipt agrees with the answer"
      ansible.builtin.assert:
        that: (receipt.json.data | default(receipt.json)).status == d.expect.status
        fail_msg: "receipt status {{ (receipt.json.data | default(receipt.json)).status }}, expected {{ d.expect.status }}"
        quiet: true
      when: d.expect.request | default(true)

    - name: "{{ inventory_hostname }}: UFW table of app-dev after"
      ansible.builtin.command: ufw status numbered
      delegate_to: nested-app-dev
      register: ufw_post
      changed_when: false

    - name: "{{ inventory_hostname }}: firewall records of app-dev after"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules?node={{ app_dev_id }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: rec_post

    - name: "{{ inventory_hostname }}: Operations after"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: ops_post
  rescue:
    - name: "{{ inventory_hostname }}: record the failed check"
      ansible.builtin.set_fact:
        failures: "{{ 'converge | ' ~ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.msg | default('?')) }}"
        cacheable: true
  always:
    - name: "{{ inventory_hostname }}: keep the evidence for verify"
      ansible.builtin.set_fact:
        ufw_before: "{{ ufw_pre.stdout | default('') }}"
        ufw_after: "{{ ufw_post.stdout | default('') }}"
        ops_before: "{{ ((ops_pre.json | default({})).data | default([])) | map(attribute='id') | sort | list }}"
        ops_after: "{{ ((ops_post.json | default({})).data | default([])) | map(attribute='id') | sort | list }}"
        records_before: "{{ (rec_pre.json | default({})).data | default([]) }}"
        records_after: "{{ (rec_post.json | default({})).data | default([]) }}"
        case_secs: "{{ ((now().timestamp() - case_t0 | float) | round(1)) }}"
        case_start: "{{ case_t0 | float }}"
        case_end: "{{ now().timestamp() }}"
        cmd_secs: "{{ ((ran.delta | default('0:00:00')).split(':')[0] | int * 3600 + (ran.delta | default('0:00:00')).split(':')[1] | int * 60 + (ran.delta | default('0:00:00')).split(':')[2] | float) | round(1) }}"
        cli_start: "{{ ((ran.start | default('1970-01-01 00:00:00.000000')) | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp() }}"
        cli_end: "{{ ((ran.end | default('1970-01-01 00:00:00.000000')) | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp() }}"
        busy_retries: "{{ ((ran.attempts | default(1) | int) - 1) + ((setup_run.results | default([]) | map(attribute='attempts') | map('int') | sum) - (setup_run.results | default([]) | length)) }}"
        cacheable: true
