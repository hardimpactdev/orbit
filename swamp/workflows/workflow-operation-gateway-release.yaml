id: 1e788227-08e7-4c2a-b926-94a77a0edafa
name: operation-gateway-release
autoContinue: false
description: Build, migrate and load one Gateway release on the Gateway Node, then hand over to it from the new commit's own definition.
# Chart: docs/cli/gateway/release-deploy.mmd. The legacy runner's sequence (docs/reference/gateway-recovery.md#deploy-a-release):
# prepare, guard, configuration, snapshot, migrate, swamp, then the promoter in the child run.
queueTimeout: 120
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: gateway.release}
    intent:
      type: object
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        id: {type: string, pattern: '^[a-f0-9]{12}$'}
        force: {type: boolean}
        previous: {type: string, pattern: '^[a-f0-9]{12}$'}
        repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
        retained: {type: boolean}
        manifest: {type: string, minLength: 2}
        web:
          type: object
          properties:
            artifact_id: {type: integer, minimum: 1}
            size: {type: integer, minimum: 1}
            digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
          required: [artifact_id, size, digest]
          additionalProperties: false
        horizon_unit: {type: string, pattern: '^$|^[A-Za-z0-9@_.-]+\.service$'}
        horizon_drain_seconds: {type: integer, minimum: 1, maximum: 3600}
        keep: {type: integer, minimum: 2, maximum: 20}
        ssh: {type: object}
        swamp_ssh: {type: object}
      required: [sha, id, force, previous, repository, horizon_unit, horizon_drain_seconds, keep, ssh, swamp_ssh]
      additionalProperties: false
    # Names only: one scoped GitHub token (contents and actions read) the Gateway minted at run start.
    execution_secrets:
      type: object
      propertyNames: {enum: [github_token]}
      maxProperties: 1
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^gateway-release-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: release
  labels: {role: swamp}
  steps:
    # Fetches the commit into the shared repository when it is not there yet. The GitHub token arrives on stdin and reaches git only in its
    # environment, never in argv.
  - name: Fetch the commit
    guard: '${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (has(inputs.intent.retained) && inputs.intent.retained) }}'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-fetch-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ "gateway-release-ssh-" + string(inputs.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        timeoutSec: 360
        stdin: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
        argv:
        - /usr/bin/timeout
        - '330'
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          sha=$1 repo=/home/orbit/shared/orbit.git
          fail() { echo "$1: $2" >&2; exit 1; }
          basic=$(printf 'x-access-token:%s' "$(cat)" | base64 -w0)
          if ! git -C "$repo" cat-file -e "$sha^{commit}" 2>/dev/null; then
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraHeader \
              GIT_CONFIG_VALUE_0="Authorization: Basic $basic" \
              timeout 300 git -C "$repo" fetch --quiet --no-tags origin "$sha" || fail gateway.release_fetch_failed "git fetch of $sha failed"
            git -C "$repo" cat-file -e "$sha^{commit}" || fail gateway.release_commit_unknown "$sha is not in origin"
          fi
        - bash
        - ${{ inputs.intent.sha }}
    # Resolves the current release, adds the worktree of the fetched commit, links shared env and storage, installs dependencies, writes the agent
    # manifest and seals the release with REVISION and a cached configuration. A sealed release of the same commit is reused. Its script is read
    # from the commit being released (a commit from before the scripts has none: gateway.release_script_missing), so a release never runs the scripts of another. Prints the release's rendered Swamp grants.
    # The installed container helper checks the release protocol before this run can load the target's workflows.
  - name: Build the release
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Fetch the commit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-build-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 2460
        argv:
        - '/usr/bin/timeout'
        - '2400'
        - '/bin/bash'
        - '-c'
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "${@:1:6}"; fi; shift 6; exec "$@"'
        - 'bash'
        - 'build-checked'
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
        - '${{ string(inputs.intent.force) }}'
        - '${{ has(inputs.intent.manifest) ? inputs.intent.manifest : "" }}'
        - '${{ string(has(inputs.intent.retained) && inputs.intent.retained) }}'
        - '/bin/bash'
        - '-c'
        - 'git -C "$1" cat-file -e "$2:swamp/scripts/gateway-release-build.sh" || { echo "gateway.release_script_missing: $2 has no release build script; roll back to it with bin/gateway-rollback" >&2; exit 1; }; bash <(git -C "$1" show "$2:swamp/scripts/gateway-release-build.sh") "$2" "$3" "$4"'
        - 'bash'
        - '/home/orbit/shared/orbit.git'
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.intent.force) }}'
        - '${{ has(inputs.intent.manifest) ? inputs.intent.manifest : "" }}'
  - name: Install the web build
    guard: '${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (has(inputs.intent.retained) && inputs.intent.retained) }}'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Build the release, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-web-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        # As the agent's install: root gives the build the web root's owner and the caddy group.
        sudo: true
        timeoutSec: 960
        stdin: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
        argv:
        - '/usr/bin/timeout'
        - '900'
        - '/bin/bash'
        - '-c'
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "${@:1:7}"; fi; shift 7; exec "$@"'
        - 'bash'
        - 'web'
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
        - '${{ inputs.intent.repository }}'
        - '${{ has(inputs.intent.web) ? string(inputs.intent.web.artifact_id) : "" }}'
        - '${{ has(inputs.intent.web) ? string(inputs.intent.web.size) : "" }}'
        - '${{ has(inputs.intent.web) ? inputs.intent.web.digest : "" }}'
        - '/bin/bash'
        - '/home/orbit/releases/${{ inputs.intent.id }}/swamp/scripts/gateway-release-web.sh'
        - '${{ inputs.intent.id }}'
        - '${{ inputs.intent.repository }}'
        - '${{ has(inputs.intent.web) ? string(inputs.intent.web.artifact_id) : "" }}'
        - '${{ has(inputs.intent.web) ? string(inputs.intent.web.size) : "" }}'
        - '${{ has(inputs.intent.web) ? inputs.intent.web.digest : "" }}'
    # VACUUM INTO a private copy before any migration above the disk floor; the newest two stay, and the one a pause names.
  - name: Clone the prepared release
    guard: '${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (has(inputs.intent.retained) && inputs.intent.retained) }}'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Install the web build, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-clone-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 240
        argv:
        - /usr/bin/timeout
        - '225'
        - /bin/bash
        - -c
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "$@"; fi'
        - bash
        - clone
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
        - '${{ has(inputs.intent.web) ? inputs.intent.web.digest : "" }}'
  - name: Snapshot the database
    labels: {role: swamp}
    writes: true
    # Only retained releases have a previously sealed web build and container.
    dependsOn:
    - {step: Build the release, condition: {type: succeeded}}
    - {step: Install the web build, condition: &built_or_retained {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    - {step: Clone the prepared release, condition: *built_or_retained}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-snapshot-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 960
        argv:
        - '/usr/bin/timeout'
        - '900'
        - '/bin/bash'
        - '-c'
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "${@:1:3}"; fi; shift 3; exec "$@"'
        - 'bash'
        - 'snapshot'
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
        - '/bin/bash'
        - '/home/orbit/releases/${{ inputs.intent.id }}/swamp/scripts/gateway-release-snapshot.sh'
        - '${{ inputs.intent.id }}'
    # Always runs, as the legacy runner; from here a failure pauses automatic releases with the old release live.
  - name: Sleep preparation
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Clone the prepared release, condition: {type: always}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-park-preparation-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 180
        argv:
        - /usr/bin/timeout
        - '165'
        - /bin/bash
        - -c
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "$@"; fi'
        - bash
        - park-preparation
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
  - name: Migrate
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Snapshot the database, condition: {type: succeeded}}, {step: Sleep preparation, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-migrate-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 960
        # The output and the exit code are the step's stdout: a failed exec keeps no output, so the check below decides and the record shows why.
        argv:
        - '/usr/bin/timeout'
        - '900'
        - '/bin/bash'
        - '-c'
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "${@:1:3}"; fi; shift 3; exec "$@"'
        - 'bash'
        - 'migrate'
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
        - '/bin/sh'
        - '-c'
        - 'out=$(cd "/home/orbit/releases/$1/apps/gateway" && php8.5 artisan migrate --force --isolated --no-interaction 2>&1); code=$?; printf "%s\n" "$out" | tail -c 1500; echo "migrate-exit=$code"'
        - 'sh'
        - '${{ inputs.intent.id }}'
  - name: Check the migration
    labels: {role: swamp}
    dependsOn: [{step: Migrate, condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Migrate"].outputs.stdout.trim().endsWith("migrate-exit=0")', severity: high, message: The migration failed; the release record shows its output.}
    # This DB-only guard leaves the old workers running while protected Operations finish. Force never skips it.
  - name: Wait for active Operations
    labels: {role: swamp}
    dependsOn: [{step: Check the migration, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-idle-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 660
        argv:
        - '/usr/bin/timeout'
        - '630'
        - '/bin/bash'
        - '-c'
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "${@:1:3}"; fi; shift 3; exec "$@"'
        - 'bash'
        - 'wait-idle'
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
        - 'php8.5'
        - '/home/orbit/releases/${{ inputs.intent.id }}/apps/gateway/artisan'
        - 'gateway:release:wait-idle'
        - '--no-interaction'
  - name: Check the candidate
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Wait for active Operations, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-ready-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 180
        argv:
        - /usr/bin/timeout
        - '165'
        - /bin/bash
        - -c
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "$@"; fi'
        - bash
        - ready
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
  - name: Load Swamp on Node 209
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Check the candidate, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: operation-gateway-swamp-load
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: 209
        kind: gateway.swamp_load
        intent:
          sha: ${{ inputs.intent.sha }}
          force: ${{ inputs.intent.force }}
          retained: ${{ has(inputs.intent.retained) && inputs.intent.retained }}
          grants:
            grants/orbit-gateway.yaml: '${{ steps["Build the release"].outputs.stdout.split("---\n")[0] }}'
            grants/orbit-serve.yaml: '${{ steps["Build the release"].outputs.stdout.split("---\n")[1] }}'
          ssh: ${{ inputs.intent.swamp_ssh }}
          gateway_ssh: ${{ inputs.intent.ssh }}
        execution_secrets: {}
    # The child runs the new commit's handoff, including the new Horizon start.
  - name: Hand over the release
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Load Swamp on Node 209, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: gateway-release-activate
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: gateway.release
        intent:
          sha: ${{ inputs.intent.sha }}
          id: ${{ inputs.intent.id }}
          previous: ${{ inputs.intent.previous }}
          horizon_unit: ${{ inputs.intent.horizon_unit }}
          horizon_drain_seconds: ${{ inputs.intent.horizon_drain_seconds }}
          keep: ${{ inputs.intent.keep }}
          ssh: ${{ inputs.intent.ssh }}
  - name: Release unused candidate
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Hand over the release, condition: {type: always}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-release-unused-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 180
        argv:
        - /usr/bin/timeout
        - '165'
        - /bin/bash
        - -c
        - 'if test -f /home/orbit/.orbit/gateway-containers.json; then exec sudo -n /usr/local/libexec/orbit-gateway-release-phase "$@"; fi'
        - bash
        - release-unused
        - '${{ inputs.intent.sha }}'
        - '${{ string(inputs.operation_id) }}'
