id: 062968ec-af49-433b-aaf4-16fa41efa4c9
name: operation-process-update
description: Install one admitted Process update on its exact Node worker.
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, const: process.update }
  required: [operation_id, node_id, kind]
jobs:
  - name: node
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: { node: "${{ string(inputs.node_id) }}" }
    writes: true
    steps:
      - name: prepare-create
        task:
          type: behavior
          behaviorType: "@nckrtl/process-control"
          behaviorName: '${{ "process-control-node-" + string(inputs.node_id) }}'
          methodName: prepareCreate
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: creation_caddy
        guard: '${{ !data.latest("process-control-node-" + string(inputs.node_id), "creation-" + run.id).attributes.vite || !data.latest("process-control-node-" + string(inputs.node_id), "creation-" + run.id).attributes.proceed }}'
        dependsOn: [{ step: prepare-create, condition: { type: succeeded } }]
        task:
          type: behavior
          behaviorType: "@nckrtl/route-publication"
          behaviorName: '${{ "route-publication-node-" + string(inputs.node_id) }}'
          methodName: publishCaddy
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: install-create
        dependsOn:
          - step: prepare-create
            condition: { type: succeeded }
          - step: creation_caddy
            condition: {
              type: or,
              conditions: [
                { type: succeeded },
                { type: failed },
                { type: skipped },
              ],
            }
        task:
          type: behavior
          behaviorType: "@nckrtl/process-control"
          behaviorName: '${{ "process-control-node-" + string(inputs.node_id) }}'
          methodName: installCreate
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            preparation: '${{ data.latest("process-control-node-" + string(inputs.node_id), "creation-" + run.id).attributes }}'
            publication_status: '${{ has(steps.creation_caddy) ? steps.creation_caddy.status : "skipped" }}'
