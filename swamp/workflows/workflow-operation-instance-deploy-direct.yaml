            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["/usr/bin/timeout", "60", "/usr/bin/find", "/proc", "-mindepth", "2", "-maxdepth", "2", "(", "-name", "cwd", "-o", "-name", "root", "-o", "-name", "exe", ")", "(", "-lname", self.release.path,
          "-o", "-lname", self.release.path + "/*", ")", "-print", "-quit"] }}
        sudo: true
        timeoutSec: 70
        okExitCodes:
        - 0
        - 1
  - name: Clean up releases
    labels:
      role: swamp
    dependsOn:
    - step: Refresh PHP cache
      condition:
        type: always
    - step: Install Process definitions
      condition:
        type: always
    - step: Restart Processes
      condition:
        type: always
    - step: Run after steps
      condition:
        type: always
    - step: Remove the deploy steps
      condition:
        type: always
    - step: Find releases in use
      condition:
        type: always
    writes: true
    allowFailure: true
    forEach:
      item: release
      in: ${{ inputs.intent.production.cleanup }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"] && !k.startsWith("Find releases in use") && !k.startsWith("Clean up releases"))
      || !(("Find releases in use-" + string(self._index)) in steps && steps["Find releases in use-" + string(self._index)].status == "succeeded" && steps["Find releases in use-" + string(self._index)].outputs.stdout.trim()
      == "") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-release-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-release-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '300'
        - /usr/bin/rm
        - -rf
        - --one-file-system
        - --
        - ${{ self.release.path }}
        sudo: true
        timeoutSec: 310
  - name: Read current back
    labels:
      role: swamp
    dependsOn:
    - step: Refresh PHP cache
      condition:
        type: always
    - step: Install Process definitions
      condition:
        type: always
    - step: Restart Processes
      condition:
        type: always
    - step: Run after steps
      condition:
        type: always
    - step: Remove the deploy steps
      condition:
        type: always
    - step: Find releases in use
      condition:
        type: always
    - step: Clean up releases
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"] && !k.startsWith("Find releases in use") && !k.startsWith("Clean up releases"))
      }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-current-read-" + string(inputs.intent.production.instance_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-current-read-" + string(inputs.intent.production.instance_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '10'
        - /usr/bin/readlink
        - --
        - ${{ inputs.intent.production.home + "/current" }}
        sudo: true
        timeoutSec: 20
  - name: Check the deployment
    labels:
      role: swamp
    dependsOn:
    - step: Read current back
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"] && !k.startsWith("Find releases in use") && !k.startsWith("Clean up releases"))
      }}
    task:
      type: assert
      severity: high
      message: current must select the new release.
      expr: steps["Read current back"].outputs.stdout in ["releases/" + inputs.intent.production.release, "releases/" + inputs.intent.production.release + "\n"]
