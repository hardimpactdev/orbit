id: b77987fa-6c2a-4ba7-9b35-c1739ef369b1
name: operation-database-create
description: Create the admitted managed databases or Valkey ACL user on its exact Node.
target: '${{ "orbit-node-" + string(inputs.node_id) }}'
labels: { node: "${{ string(inputs.node_id) }}" }
writes: true
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [database.create] }
  required: [operation_id, node_id, kind]
jobs:
  - name: server
    steps:
      - name: apply
        dataOutputOverrides:
          - specName: outcome
            vary: [run_id]
        task:
          type: behavior
          behaviorType: "@nckrtl/database-create"
          behaviorName: '${{ "database-create-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: project
        dependsOn:
          - step: apply
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/database-create"
          behaviorName: '${{ "database-create-" + string(inputs.node_id) }}'
          methodName: project
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            outcome: "${{ steps.apply.outputs.outcome }}"
