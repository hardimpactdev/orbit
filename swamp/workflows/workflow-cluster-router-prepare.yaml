id: 19bf171c-cf2a-4509-beb7-3373c29f19af
name: cluster-router-prepare
description: 'Canonical Router prerequisites, Caddy package and owned firewall policy through official SSH.'
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: prepare
    steps:
      - name: account_command
        labels: &ref_0
          role: swamp
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("cluster-router-ssh-" + string(inputs.intent.connection.nodeHost)).split(".").join("-") }}'
          methodName: exec
          globalArgs: &ref_1
            name: '${{ ("cluster-router-ssh-" + string(inputs.intent.connection.nodeHost)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.connection.nodeUser }}'
              identityFile: '${{ inputs.intent.connection.nodeIdentityFile }}'
              port: '${{ inputs.intent.connection.nodePort }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.connection.nodeHost }}'
                transport:
                  hostKeys: '${{ inputs.intent.host_keys }}'
          inputs:
            hosts: 'name:target'
            sudo: false
            argv: '${{ ["getent", "passwd", inputs.intent.user] }}'
            timeoutSec: 30
      - name: account_group
        labels: *ref_0
        dependsOn:
          - step: account_command
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("cluster-router-ssh-" + string(inputs.intent.connection.nodeHost)).split(".").join("-") }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            sudo: false
            argv: '${{ ["id", "-gn", inputs.intent.user] }}'
            timeoutSec: 30
      - name: account
        labels: *ref_0
        dependsOn:
          - step: account_group
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/node-role-command'
          behaviorName: ${{ "account-result" }}
          methodName: account
          inputs:
            passwd: '${{ steps["account_command"].outputs.stdout }}'
            group: '${{ steps["account_group"].outputs.stdout }}'
      - name: packages_release
        labels: *ref_0
        writes: false
        dependsOn:
          - step: account
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("cluster-router-ssh-" + string(inputs.intent.connection.nodeHost)).split(".").join("-") }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            sudo: true
            argv: '${{ ["/usr/bin/grep", "-qxE", "VERSION_CODENAME=(" + inputs.intent.prerequisites.releases.join("|") + ")", "/etc/os-release"] }}'
      - name: packages_lists
        labels: *ref_0
        writes: true
        dependsOn:
          - step: packages_release
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("cluster-router-ssh-" + string(inputs.intent.connection.nodeHost)).split(".").join("-") }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            sudo: true
            argv: '${{ ["/usr/bin/env", "LC_ALL=C", "DEBIAN_FRONTEND=noninteractive", "NEEDRESTART_MODE=l", "/usr/bin/apt-get", "-o", "APT::Update::Error-Mode=any", "update"] }}'
      - name: packages
        labels: *ref_0
        writes: true
        dependsOn:
          - step: packages_lists
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("cluster-router-ssh-" + string(inputs.intent.connection.nodeHost)).split(".").join("-") }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            sudo: true
            argv: '${{ ["/usr/bin/env", "LC_ALL=C", "DEBIAN_FRONTEND=noninteractive", "NEEDRESTART_MODE=l", "/usr/bin/apt-get", "--no-remove", "install", "--yes", "--no-install-recommends", "--"] + inputs.intent.prerequisites.packages }}'
      - name: caddy
        labels: *ref_0
        writes: true
        dependsOn:
          - step: packages
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: node-caddy-package
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ {"package": inputs.intent.caddy_package, "ssh": {"target": {"host": inputs.intent.connection.nodeHost, "user": inputs.intent.connection.nodeUser, "port": inputs.intent.connection.nodePort, "host_keys": inputs.intent.host_keys}, "identity_file": inputs.intent.connection.nodeIdentityFile} } }}'
      - name: firewall
        labels:
          role: swamp
        dependsOn:
          - step: caddy
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: route-lan-apply
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            execution_secrets: {}
            intent:
              rule: '${{ inputs.intent.firewall }}'
              control_node_id: '${{ inputs.intent.control_node_id }}'
              connection: '${{ inputs.intent.connection }}'
              host_keys: '${{ inputs.intent.host_keys }}'

