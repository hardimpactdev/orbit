id: 2a25f8bb-82b0-4bcb-93d2-cd0ce9fcb4af
name: operation-tool-manager-setup
description: The shared Tool Manager setup that tool.install runs on first use and the development deploy runs for Vite+.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    ssh:
      type: object
    report:
      type: boolean
    converge:
      type: boolean
      default: false
  required:
    - operation_id
    - node_id
    - intent
    - ssh
  additionalProperties: false
jobs:
  - name: prepare
    steps:
      - name: Prepare manager commands
        labels: {role: swamp}
        task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ ("tm-argv-" + string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}', methodName: manager_assets, inputs: {input: '${{ inputs.intent }}'}}
  - name: inspect
    dependsOn:
      - job: prepare
        condition: {type: succeeded}
    steps:
      - name: Read manager version
        labels: {role: swamp}
        task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("tm-command-" + string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}', methodName: exec, globalArgs: {name: '${{ ("tm-command-" + string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', sudo: false, argv: '${{ ["timeout", "60"] + steps["Prepare manager commands"].outputs.version }}', timeoutSec: 905, okExitCodes: any}}
      - name: Read the account home
        labels: {role: swamp}
        guard: '${{ !("setup" in inputs.intent && inputs.intent.setup != null && inputs.intent.platform == "linux") }}'
        task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("tm-read-the-account-home-"+string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}', methodName: exec, globalArgs: {name: '${{ ("tm-native-"+string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}'}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', sudo: true, argv: [getent, passwd, '${{ inputs.intent.user }}'], timeoutSec: 905}}
  - name: plan
    dependsOn:
      - job: inspect
        condition: {type: succeeded}
    steps:
      - name: Plan pinned manager
        labels: {role: swamp}
        guard: &no_setup '${{ !((steps["Read manager version"].outputs.exitCode == 127 || (has(inputs.converge) && inputs.converge)) && "setup" in inputs.intent && inputs.intent.setup != null && inputs.intent.platform == "linux") }}'
        task: {type: behavior, behaviorType: '@nckrtl/node-tool-setup-assets', behaviorName: '${{ ("tm-public-plan-"+string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}', methodName: plan, inputs: {setup: '${{ inputs.intent.setup }}', home: '${{ steps["Read the account home"].outputs.stdout.trim().split(":")[5] }}'}}
  - name: intent
    dependsOn:
      - job: plan
        condition: {type: succeeded}
    steps:
      - name: Write the intent
        labels: {role: swamp}
        writes: true
        guard: *no_setup
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ${{ ("ansible-tm-input-" + string(inputs.node_id) + "-" + inputs.intent.manager).split(".").join("-") }}
          methodName: write
          inputs:
            intent:
              ssh: ${{ inputs.ssh }}
              version: ${{ steps["Prepare manager commands"].outputs.version }}
              packages: ${{ steps["Prepare manager commands"].outputs.packages }}
              plan: ${{ steps["Plan pinned manager"].outputs }}
            path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
  - name: input
    dependsOn:
      - job: intent
        condition: {type: succeeded}
    steps:
      - name: Write the playbook input
        labels: {role: swamp}
        writes: true
        guard: *no_setup
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ ("ansible-tm-" + inputs.intent.manager + "-input-" + string(inputs.node_id)).split(".").join("-") }}
          methodName: execute
          inputs:
            run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" tool.manager_setup
            env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}'}
  - name: manager
    dependsOn:
      - job: input
        condition: {type: succeeded}
    steps:
      - name: Set up the Tool Manager
        labels: {role: swamp}
        writes: true
        guard: *no_setup
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ ("ansible-tm-" + inputs.intent.manager + "-manager-" + string(inputs.node_id)).split(".").join("-") }}
          methodName: execute
          inputs:
            run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" --tags manager "$ORBIT_ANSIBLE/operation-tool-manager-setup.yml"
            env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}', ANSIBLE_FORCE_COLOR: '0'}
  - name: setup
    dependsOn:
      - job: manager
        condition: {type: succeeded}
    steps:
      - name: Assert manager readiness
        labels: {role: swamp}
        task: {type: assert, expr: 'steps["Read manager version"].outputs.exitCode == 0 || ((steps["Read manager version"].outputs.exitCode == 127 || (has(inputs.converge) && inputs.converge)) && "setup" in inputs.intent && inputs.intent.setup != null && inputs.intent.platform == "linux")', message: The pinned Tool Manager must be ready., severity: high}
  - name: cleanup
    dependsOn:
      - {job: prepare, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
      - {job: inspect, condition: *settled}
      - {job: plan, condition: *settled}
      - {job: intent, condition: *settled}
      - {job: input, condition: *settled}
      - {job: manager, condition: *settled}
      - {job: setup, condition: *settled}
    steps:
      - name: Remove the playbook input
        labels: {role: swamp}
        writes: true
        guard: '${{ !("setup" in inputs.intent && inputs.intent.setup != null && inputs.intent.platform == "linux") }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ ("ansible-tm-" + inputs.intent.manager + "-cleanup-" + string(inputs.node_id)).split(".").join("-") }}
          methodName: execute
          inputs:
            run: timeout 30 rm -rf -- "$ORBIT_RUN"
            env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
