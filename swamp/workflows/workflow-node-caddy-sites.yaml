id: 43470da1-3f88-4eb7-bc9c-c1c5e8f4c4a4
name: node-caddy-sites
description: Write the rendered Caddyfile as a candidate, validate it as the caddy user and publish it with the Routes Caddy step.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: caddy-sites
  labels: {role: swamp}
  steps:
  - name: 'Write the Caddyfile candidate'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-caddy-candidate-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: '${{ "/etc/caddy/.orbit-converge-" + run.id }}', ensure: present, content: '${{ inputs.intent.caddy.content }}', owner: root, group: caddy, mode: '0640',
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Validate the Caddyfile'
    labels: {role: swamp}
    dependsOn: [{step: 'Write the Caddyfile candidate', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-caddy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "node-caddy-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/bin/sudo, -u, caddy, /usr/bin/caddy, validate, --config, '${{ "/etc/caddy/.orbit-converge-" + run.id }}', --adapter, caddyfile]
        timeoutSec: 40
  - name: 'Publish the Caddyfile'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Validate the Caddyfile', condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          caddy_publication:
            control_node_id: '${{ inputs.intent.ssh.control_node_id }}'
            connection: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
              nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
            host_keys: '${{ inputs.intent.ssh.target.host_keys }}'
            node_id: '${{ inputs.node_id }}'
            user: '${{ inputs.intent.user }}'
            caddy: '${{ inputs.intent.caddy }}'
        execution_secrets: {}
  - name: 'Remove the Caddyfile candidate'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Publish the Caddyfile', condition: {type: always}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-caddy-candidate-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: '${{ "/etc/caddy/.orbit-converge-" + run.id }}', ensure: absent, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
