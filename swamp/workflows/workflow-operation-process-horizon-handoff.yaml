id: 2c2668b7-1864-48aa-966b-9705870cf69d
name: operation-process-horizon-handoff
description: 'Rule 22 Horizon handoff: cfgmgmt systemd and one graceful SSH command.'
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [process.horizon_handoff]}
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        process_id:
          type: integer
          minimum: 1
        unit:
          type: string
          pattern: ^orbit-process-[1-9][0-9]*-[a-z0-9-]+\.service$
        content:
          type: string
          maxLength: 65536
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        command:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
        directory:
          type: string
          pattern: ^/
        user:
          type: string
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        created:
          type: boolean
        ssh_execution:
          type: object
      required:
      - process_id
      - unit
      - content
      - content_hash
      - command
      - directory
      - user
      - created
      - ssh_execution
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: horizon
  labels: {role: swamp}
  steps:
  - name: Publish, reload, enable
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "horizon-service-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.unit }}', enabled: true, unitFile: '${{ inputs.intent.content
          }}'}
      inputs: {}
    writes: true
    dependsOn: []
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) }}
  - name: Hand off to new release
    labels: {role: swamp}
    dependsOn: [{step: 'Publish, reload, enable', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || data.latest("horizon-service-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id), inputs.intent.ssh_execution.target.host).attributes.current.active
      != "active" }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "horizon-handoff-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "horizon-handoff-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '60', sudo, -n, --user, '${{ inputs.intent.user }}', --, env, '${{ "--chdir=" + inputs.intent.directory }}', '${{ inputs.intent.command[0]
            }}', artisan, 'horizon:terminate'], sudo: true, timeoutSec: 65}
  - name: Start Horizon
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "horizon-start-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.unit }}', enabled: true, ensure: running}
      inputs: {}
    writes: true
    dependsOn: [{step: 'Publish, reload, enable', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) || data.latest("horizon-service-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id), inputs.intent.ssh_execution.target.host).attributes.current.active
      == "active" }}
  - name: Read Horizon state
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "horizon-start-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id) }}
      methodName: check
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.unit }}', enabled: true, ensure: running}
      inputs: {}
    dependsOn: [{step: Hand off to new release, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Start Horizon, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}]
  - name: Check Horizon runs
    labels: {role: swamp}
    dependsOn: [{step: Hand off to new release, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Read Horizon state, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) }}
    task:
      type: assert
      expr: data.latest("horizon-start-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id), inputs.intent.ssh_execution.target.host).attributes.status == "compliant"
        && data.latest("horizon-start-" + string(inputs.node_id) + "-" + string(inputs.intent.process_id), inputs.intent.ssh_execution.target.host).attributes.current.active == "active"
      message: Horizon must run from its enabled unit after the handoff or start.
      severity: high
queueTimeout: 30
