---
# The state asserts of the three ufw-fault cases. converge.yml ran the CLI, checked the answers and receipts, and kept a snapshot of UFW, the
# Operations and the records at each stage; this playbook only reads. It reads the final UFW table of app-dev and the firewall records of every
# Node once, runs the probes of every case (in waves of as many as the limit allows, as async jobs), and then each case checks its snapshots
# and the final state. One verdict line per case; the play fails when a case failed.
- ansible.builtin.import_playbook: ../default/facts.yml

- name: Read the final UFW table of app-dev
  hosts: nested-app-dev
  gather_facts: false
  tasks:
    - name: Read the UFW table
      ansible.builtin.command: ufw status numbered
      register: ufw_now
      changed_when: false

- name: Each case lists its probes
  hosts: case_hosts
  gather_facts: false
  vars_files: [cases.yml]
  tasks:
    - name: Keep the probes of the case
      ansible.builtin.set_fact:
        probes_of_case: "{{ probe_list }}"

- name: Read the records and run the probes
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the firewall records of every Node
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: records

    - name: Keep the rules by Node
      ansible.builtin.set_fact:
        rules_by_node: "{{ dict(records.json.data | map(attribute='node') | zip(records.json.data | map(attribute='rules'))) }}"

    - name: Collect the probes of every case
      ansible.builtin.set_fact:
        all_probes: "{{ groups['case_hosts'] | map('extract', hostvars, 'probes_of_case') | flatten | list }}"

    - name: Run the probes, one wave at a time
      ansible.builtin.include_tasks: probe-wave.yml
      loop: "{{ all_probes | batch(parallel_limit | int) | list }}"
      loop_control: {loop_var: wave, label: "{{ wave | length }} probes"}

- name: Check each case against the snapshots and what was read
  hosts: case_hosts
  gather_facts: false
  vars_files: [cases.yml]
  tasks:
    - name: Forget the checks of an earlier run, and read the final state of the case
      ansible.builtin.set_fact:
        verified: false
        verify_failures: ''
        rows: "{{ hostvars[tcontainer].ufw_now.stdout_lines | select('search', '^\\[') | reject('search', '\\(v6\\)') | list }}"
        rules: "{{ hostvars['localhost'].rules_by_node[tnode] | default([]) }}"

    - name: Every probe of the case saw what was expected
      vars:
        mine: "{{ hostvars['localhost'].probe_obs | default([]) | selectattr('case', 'equalto', inventory_hostname) | list }}"
        wrong: "{{ mine | rejectattr('ok') | list }}"
      ansible.builtin.assert:
        that:
          - wrong | length == 0
          - mine | length == (d.probes | default([]) | length)
        fail_msg: "probes: {{ wrong | map(attribute='text') | join('; ') }}"
        quiet: true
      ignore_errors: true
      register: probes_checked

    - name: The probes failed
      ansible.builtin.set_fact:
        verify_failures: "Every probe of the case saw what was expected | {{ probes_checked.msg }}"
      when: probes_checked is failed

    - name: The checks of the case (a failed check sets verify_failures, and the checks go on)
      ansible.builtin.include_tasks: "verify-{{ inventory_hostname }}.yml"

- name: Verdicts
  hosts: localhost
  gather_facts: false
  vars:
    all_cases: "{{ groups['case_hosts'] }}"
  tasks:
    - name: Verdict of each case (command seconds are the CLI calls under test, case seconds the whole case in converge)
      vars:
        problem: "{{ (hostvars[item].failures | default('')) or (hostvars[item].verify_failures | default('')) }}"
        ok: "{{ not problem and (hostvars[item].verified | default(false)) }}"
      ansible.builtin.debug:
        msg: >-
          {{ item }}: {{ 'passed' if ok else ('failed | ' ~ (problem or 'the checks did not end')) }}
          (command {{ hostvars[item].cmd_secs }} s, case {{ hostvars[item].case_secs }} s, on {{ hostvars[item].tnode }})
      loop: "{{ all_cases }}"

    - name: Collect the failed cases
      ansible.builtin.set_fact:
        failed_cases: "{{ failed_cases | default([]) + [item] }}"
      loop: "{{ all_cases }}"
      when: (hostvars[item].failures | default('')) or (hostvars[item].verify_failures | default('')) or not (hostvars[item].verified | default(false))

    - name: Fail when a case failed
      ansible.builtin.assert:
        that: failed_cases | default([]) | length == 0
        fail_msg: "failed: {{ failed_cases | default([]) | join(', ') }}"
        quiet: true
