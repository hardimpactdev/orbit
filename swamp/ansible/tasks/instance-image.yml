---
# The Instance image (docs/reference/development-containers.md#inside-a-container). Its alias is a digest of the whole definition the
# Gateway sends, so a host builds each definition once. A build container from the stock image installs the OS packages, sets up the
# users, the workspace and the firewall, and is published under the alias; the stable alias `orbit-instance` then names it, and the
# images it replaced remain for separately authorized operator cleanup. The build container reaches the internet as every container
# does, through the egress proxy that the profile names for `incus exec` (tasks/instance-egress.yml), and it takes the bridge's last
# address, which no Instance gets.
#
# `instance_variant` names the image to build: the normal one in `instances.project`, or on a switched-on Node the nested-fleet one in
# its own project (docs/reference/development-containers.md#the-nested-fleet-image), which adds the pinned inner Incus and the
# exact sudo grant of `agent`.
- name: Forget the normal build container before the nested-fleet build
  when: instance_variant.project != instances.project
  ansible.builtin.set_fact:
    image_created: { rc: 1 }

- name: Read the Instance images
  environment: &image_local
    INCUS_REMOTE: local
    INCUS_SOCKET: "{{ container_image_socket }}"
  ansible.builtin.command: { argv: [incus, --project, "{{ instance_variant.project }}", image, list, --format, json] }
  register: image_list
  changed_when: false

- name: Build the image
  environment: *image_local
  when: instance_variant.image.alias not in (image_list.stdout | from_json | map(attribute='aliases') | flatten | map(attribute='name') | list)
  vars:
    build: orbit-instance-build
    in_build: [incus, exec, --project, "{{ instance_variant.project }}", orbit-instance-build, --env, DEBIAN_FRONTEND=noninteractive, --]
    # The Orbit root CA that the Node's base converge writes for its agent (InstanceHostIntent::TrustSource).
    instance_trust_source: /etc/orbit/agent/ca.pem
  block:
    - name: Read existing prepared-image builders
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances?project={{ instance_variant.project }}&recursion=1"] }
      register: image_leftover
      changed_when: false
    - name: Refuse a prior prepared-image builder
      ansible.builtin.assert:
        that: build not in (image_leftover.stdout | from_json | map(attribute='name') | list)
        fail_msg: >-
          instance.host_unavailable: instance {{ instance_variant.project }}/{{ build }} requires an operator;
          see /solutions/incus-shared-image-refresh#operator-cleanup
    # Its fixed address lets it carry the address filters of an Instance NIC (instance_network.py's FILTERS); the profile's eth0 has
    # no address, so the profile does not set them.
    - name: Create the build container
      ansible.builtin.command:
        argv: [incus, --project, "{{ instance_variant.project }}", init, "{{ instances.stock }}", "{{ build }}",
               --config, security.idmap.isolated=true, --device, "eth0,ipv4.address={{ instances.build_address }}",
               --device, "eth0,security.ipv4_filtering=true", --device, "eth0,security.mac_filtering=true"]
      register: image_created
      changed_when: true
    - name: Read the build container's effective devices
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances/{{ build }}?project={{ instance_variant.project }}"] }
      register: image_nic_read
      changed_when: false
    - name: Check every effective build container NIC before starting
      ansible.builtin.include_tasks: instance-network-nic-check.yml
      vars:
        network_container: "{{ image_nic_read.stdout | from_json }}"
        network_name: "{{ instances.network }}"
        network_failure: instance.container_network_unsafe
        expected_network_device: eth0
    - name: Start the build container
      ansible.builtin.command: { argv: [incus, --project, "{{ instance_variant.project }}", start, "{{ build }}"] }
      changed_when: true
    # Cloud-init's first boot makes the stock `ubuntu` user and its sudo grant; the setup script removes them only after it.
    # A container has no guest agent, so `cloud-init status --wait` blocks from the first moment of the boot. It exits 2 when
    # cloud-init finished with a recoverable warning; both are a finished boot.
    - name: Let cloud-init finish
      ansible.builtin.command: { argv: [incus, exec, --project, "{{ instance_variant.project }}", "{{ build }}", --, cloud-init, status, --wait] }
      timeout: 400
      register: image_cloud_init
      changed_when: false
      failed_when: image_cloud_init.rc not in [0, 2]
    # The stock image starts its network a moment after the container. apt goes through the proxy, which resolves the names.
    - name: Read the package index
      ansible.builtin.command: { argv: "{{ in_build + ['apt-get', 'update'] }}" }
      register: image_index
      until: image_index.rc == 0
      retries: 30
      delay: 2
      changed_when: true
    - name: Install the OS packages
      ansible.builtin.command: { argv: "{{ in_build + ['apt-get', 'install', '--yes', '--no-install-recommends', '--'] + instance_variant.image.packages }}" }
      changed_when: true
    # The verified packages go from the Node's artifact cache into the build container. A `policy-rc.d` file keeps their scripts
    # from starting the inner Incus in the build container; it goes before the image is published.
    - name: Install the pinned inner Incus packages
      when: instance_variant.image.incus is defined
      vars:
        inner_debs: "{{ instance_variant.image.incus | map(attribute='name') | map('regex_replace', '^', '/tmp/') | map('regex_replace', '$', '.deb') | list }}"
      block:
        - name: Create the package cache
          ansible.builtin.file: { path: /var/cache/orbit/debs, state: directory, owner: root, group: root, mode: "0755" }
        - name: Fetch the pinned inner Incus packages
          ansible.builtin.include_tasks: artifact-fetch.yml
          vars:
            artifact:
              urls: "{{ inner_package.urls }}"
              path: "/var/cache/orbit/debs/{{ inner_package.name }}_{{ inner_package.sha256 }}.deb"
              sha256: "{{ inner_package.sha256 }}"
          loop: "{{ instance_variant.image.incus }}"
          loop_control: { loop_var: inner_package, label: "{{ inner_package.name }}" }
        - name: Copy the pinned packages into the build container
          ansible.builtin.command:
            argv: [incus, file, push, --project, "{{ instance_variant.project }}",
                   "/var/cache/orbit/debs/{{ item.name }}_{{ item.sha256 }}.deb", "{{ build }}/tmp/{{ item.name }}.deb"]
          loop: "{{ instance_variant.image.incus }}"
          loop_control: { label: "{{ item.name }}" }
          changed_when: true
        - name: Keep the package scripts from starting services
          ansible.builtin.command:
            argv: [incus, file, push, --project, "{{ instance_variant.project }}", --uid, "0", --gid, "0", --mode, "0755", "-", "{{ build }}/usr/sbin/policy-rc.d"]
            stdin: "#!/bin/sh\nexit 101\n"
            stdin_add_newline: false
          changed_when: true
        - name: Install the inner Incus and its dependencies through the proxy
          ansible.builtin.command: { argv: "{{ in_build + ['apt-get', 'install', '--yes', '--no-install-recommends', '--'] + inner_debs }}" }
          changed_when: true
        - name: Remove the copied packages and the service block
          ansible.builtin.command: { argv: "{{ in_build + ['rm', '--', '/usr/sbin/policy-rc.d'] + inner_debs }}" }
          changed_when: true
    - name: Set up the users, the workspace and no sudo
      ansible.builtin.command: { argv: "{{ in_build + ['sh', '-c', instance_variant.image.prepare] }}" }
      changed_when: true
    - name: Write the image files
      ansible.builtin.command:
        argv: [incus, file, push, --project, "{{ instance_variant.project }}", --create-dirs, --uid, "{{ item.uid }}", --gid, "{{ item.gid }}",
               --mode, "{{ item.mode }}", "-", "{{ build }}{{ item.path }}"]
        stdin: "{{ item.content }}"
        stdin_add_newline: false
      loop: "{{ instance_variant.image.files }}"
      loop_control: { label: "{{ item.path }}" }
      changed_when: true
    # The Orbit root CA that the Node's base converge writes for its agent, as a local CA file. The definition's finish runs
    # `update-ca-certificates`, which makes the bundle and the links (docs/reference/development-containers.md#trust). A later root on
    # the Node reaches every container, this image's too, through the Node converge.
    - name: Trust the Orbit root CA in the image
      ansible.builtin.command:
        argv: [incus, file, push, --project, "{{ instance_variant.project }}", --create-dirs, --uid, "0", --gid, "0", --mode, "0644",
               "{{ instance_trust_source }}", "{{ build }}/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"]
      changed_when: true
    - name: Enable the units and clean up
      ansible.builtin.command: { argv: "{{ in_build + item }}" }
      loop: "{{ instance_variant.image.finish }}"
      changed_when: true
    # Nothing may publish an image with a sudo path: no `ubuntu` user, nothing in sudoers.d but its README, and no member of the
    # groups `sudo` or `admin`. The nested-fleet image has one more path, which the audit requires exactly: `agent`'s grant and
    # `agent` alone in `incus-admin`; `orbit` stays without sudo.
    # visudo is judged by its exit code alone: visudo-rs ignores -q and prints "parsed OK" on stdout for a clean file.
    - name: Read the sudo paths of the image
      ansible.builtin.command:
        argv: "{{ in_build + ['sh', '-c', image_nested_audit if instance_variant.image.incus is defined else image_audit] }}"
      vars:
        image_nested_audit: >-
          getent passwd ubuntu >/dev/null && echo user:ubuntu;
          for f in /etc/sudoers.d/*; do [ "$f" = /etc/sudoers.d/README ] || [ "$f" = /etc/sudoers.d/orbit-agent ] || [ ! -e "$f" ] || echo "sudoers:$f"; done;
          getent group sudo admin | cut -d: -f4 | tr , '\n' | sed '/^$/d; s/^/member:/';
          getent group incus-admin | grep -qx 'incus-admin:[^:]*:[0-9]*:agent' || echo incus-admin:unexpected;
          test "$(cat /etc/sudoers.d/orbit-agent)" = 'agent ALL=(ALL:ALL) NOPASSWD: ALL' || echo agent:grant;
          visudo -cqf /etc/sudoers.d/orbit-agent >/dev/null || echo agent:syntax;
          runuser -u agent -- sudo -n true || echo agent:sudo;
          runuser -u orbit -- sudo -n true 2>/dev/null && echo orbit:sudo; true
        image_audit: >-
          getent passwd ubuntu >/dev/null && echo user:ubuntu;
          for f in /etc/sudoers.d/*; do [ "$f" = /etc/sudoers.d/README ] || [ ! -e "$f" ] || echo "sudoers:$f"; done;
          getent group sudo admin | cut -d: -f4 | tr , '\n' | sed '/^$/d; s/^/member:/'; true
      register: image_sudo
      changed_when: false
    - name: Require an image without a sudo path
      ansible.builtin.assert:
        that: image_sudo.stdout | trim == ''
        fail_msg: "instance.host_unavailable: the image keeps a sudo path: {{ image_sudo.stdout_lines | join(', ') }}"
        quiet: true
    - name: Stop and publish the build container
      ansible.builtin.command: { argv: "{{ ['incus', '--project', instance_variant.project] + item }}" }
      loop:
        - [stop, "{{ build }}"]
        - [publish, "{{ build }}", --alias, "{{ instance_variant.image.alias }}", user.orbit.stock-build=]
      changed_when: true
  always:
    - name: Remove the build container
      when: image_created is defined and image_created.rc == 0
      ansible.builtin.command: { argv: [incus, --project, "{{ instance_variant.project }}", delete, --force, "--", "{{ build }}"] }
      register: image_removed
      changed_when: false
      failed_when: image_removed.rc != 0 and 'not found' not in image_removed.stderr

- name: Read the Instance images after the build
  environment: *image_local
  ansible.builtin.command: { argv: [incus, --project, "{{ instance_variant.project }}", image, list, --format, json] }
  register: image_built
  changed_when: false

- name: Select the image and the image of the stable alias
  ansible.builtin.set_fact:
    image_current: "{{ image_of[instance_variant.image.alias] }}"
    image_stable: "{{ image_of[instance_variant.stable_alias] | default('') }}"
  vars:
    image_of: >-
      {%- set out = {} -%}
      {%- for image in image_built.stdout | from_json -%}
        {%- for alias in image.aliases -%}{%- set _ = out.update({alias.name: image.fingerprint}) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Point the stable alias at the image
  environment: *image_local
  when: image_stable != image_current
  ansible.builtin.command:
    argv: [incus, query, --request, "{{ 'PUT' if image_stable != '' else 'POST' }}", --data,
           "{{ ({'target': image_current} if image_stable != '' else {'name': instance_variant.stable_alias, 'target': image_current}) | to_json }}",
           --, "/1.0/images/aliases{{ '/' ~ instance_variant.stable_alias if image_stable != '' else '' }}?project={{ instance_variant.project }}"]
  changed_when: true
