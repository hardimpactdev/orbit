id: 4b0f7f8a-2f6c-4f53-9a51-3c2f0f6c1a03
name: task-publication-import
description: Fetch the bundle into a scratch bare repository on 209 and compare it to the checked candidate.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
    scratch:
      type: string
    prepared:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - scratch
  - prepared
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: import
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publication-import" }}
      methodName: execute
      inputs:
        run: 'set -eu

          git init --quiet --bare --template= --object-format="$ORBIT_OBJECT_FORMAT" "$ORBIT_REPOSITORY"

          git -C "$ORBIT_REPOSITORY" fetch --quiet --no-tags "$ORBIT_BUNDLE" HEAD:refs/heads/candidate

          git -C "$ORBIT_REPOSITORY" rev-parse refs/heads/candidate ''refs/heads/candidate^{tree}''

          '
        ignoreExitCode: true
        timeout: 60000
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_OBJECT_FORMAT: ${{ inputs.prepared.object_format }}
          ORBIT_BUNDLE: ${{ inputs.scratch + "-candidate.bundle" }}
          ORBIT_REPOSITORY: ${{ inputs.scratch + ".git" }}
  - name: import_result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publication-import_result" }}
      methodName: imported
      inputs:
        input: ${{ inputs.intent }}
        steps: ${{ steps }}
    dependsOn:
    - step: import
      condition:
        type: succeeded
queueTimeout: 60
