---
# Move a Node's tunnel to its new hub endpoint in one detached job on the Node (ADR 0251). Swamp reaches the Node through this
# tunnel, so the move must not depend on the SSH session: Ansible's async job keeps running when the session drops, and later
# polls reconnect through whichever tunnel the job left. The job installs the staged files, ends the old session, waits for a
# handshake at or after the move and, without one, puts the previous files back and sets the live configuration it saved.
# Then it exits 3. When `wg` does not load the new files, it goes back the same way at once, without the wait. Either way it
# records the outcome in `orbit.move-result`, which the converge reads after it reaches the Node again, so a lost connection
# still reports node.hub_switch_no_handshake or node.hub_switch_load_failed. Previous files that an aborted move left are
# kept, and the converge decides the next move from them.
# While it moves, the Node takes WireGuard packets only from the new endpoint's address. The hub still sends to the Node's
# old address until it hears from the new one, and may start a handshake there; the Node then roams back, and both ends stay
# on the old path (Operation 15254). The pin goes when the job ends; a reboot drops it too.
- name: Move the tunnel to the new hub endpoint, or back
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      umask 077
      d={{ hub_move.dir | quote }}; key={{ hub_move.key | quote }}
      rm -f "$d/orbit.move-result"
      # By line number, last first: `iptables -S` may quote a comment, so a rule spec it prints is not read back.
      unpin() {
        iptables -w -n -L INPUT --line-numbers | awk '/\/\* orbit-hub-move \*\// { print $1 }' | sort -rn | while read -r n; do
          iptables -w -D INPUT "$n"
        done
      }
      unpin
      ep={{ hub_move.endpoint | quote }}
      case "$ep" in
        *[!0-9.:]*) ;;
        *)
          if ! iptables -w -I INPUT 1 -p udp --dport "$(wg show orbit listen-port)" ! -s "${ep%:*}" -m comment --comment orbit-hub-move -j DROP; then
            echo unpinned > "$d/orbit.move-result"; exit 3
          fi
          trap unpin EXIT
          ;;
      esac
      # Keep what runs now before anything changes: the previous files, unless an aborted move left them, and the live
      # configuration, which also covers a Node whose previous files were missing.
      # After a cut-off move the live tunnel may already run the new files, so its rollback loads the previous files instead.
      cut_off=no; if [ -f "$d/orbit.peers.previous" ]; then cut_off=yes; fi
      for f in orbit.conf orbit.peers; do
        if [ -f "$d/$f" ] && [ ! -f "$d/$f.previous" ]; then cp -p "$d/$f" "$d/$f.previous"; fi
      done
      wg showconf orbit > "$d/orbit.live.previous"
      for f in orbit.conf orbit.peers; do mv "$d/$f.next" "$d/$f"; done
      load() {
        wg set orbit peer "$key" remove || true
        # A file node:add wrote holds its own [Interface] section; only the peers are loaded. The key line ends once, with or
        # without a final newline in the key file. `wg` prints a value it refuses, which may be the key: `cut` drops it.
        wg syncconf orbit <(
          printf '[Interface]\nPrivateKey = %s\n' "$(cat "$d/orbit.key")"
          awk '/^\[/ { skip = ($0 == "[Interface]") } !skip' "$d/orbit.peers"
        ) 2> >(cut -d'`' -f1 >&2)
      }
      restore() {
        # A file without a previous copy goes too, so the next converge sees no endpoint and decides a move again.
        for f in orbit.conf orbit.peers; do
          if [ -f "$d/$f.previous" ]; then mv "$d/$f.previous" "$d/$f"; else rm -f "$d/$f"; fi
        done
        if [ "$cut_off" = yes ]; then load; else wg set orbit peer "$key" remove || true; wg setconf orbit "$d/orbit.live.previous"; fi
        rm -f "$d/orbit.live.previous"
      }
      moved=$(date +%s)
      # Without a loaded configuration the hub peer is gone and no handshake can come: go back at once.
      if ! load; then restore; echo load_failed > "$d/orbit.move-result"; exit 3; fi
      for _ in $(seq 1 30); do
        seen=$(wg show orbit latest-handshakes | awk -v k="$key" '$1 == k { print $2 }')
        # A handshake the hub started to an old address would also be new; only one through the new endpoint counts. A
        # hostname endpoint shows resolved, so it is compared only when the endpoint is an address.
        live=$(wg show orbit endpoints | awk -v k="$key" '$1 == k { print $2 }')
        case {{ hub_move.endpoint | quote }} in *[!0-9.:]*) live={{ hub_move.endpoint | quote }} ;; esac
        if [ "${seen:-0}" -ge "$moved" ] && [ "$live" = {{ hub_move.endpoint | quote }} ]; then
          rm -f "$d/orbit.conf.previous" "$d/orbit.peers.previous" "$d/orbit.live.previous"; echo moved > "$d/orbit.move-result"; exit 0
        fi
        ping -c 1 -W 1 {{ hub_move.probe_ip | quote }} > /dev/null 2>&1 || true
        sleep {{ hub_move.interval | default(2) }}
      done
      restore
      echo restored > "$d/orbit.move-result"
      exit 3
  async: 180
  poll: 5
  register: hub_move_result
  changed_when: true
  failed_when: false
  # A poll that runs while the old tunnel is down comes back unreachable; the job goes on, and its outcome is on the Node.
  ignore_unreachable: true
- name: Reach the Node again through the tunnel the move left
  ansible.builtin.wait_for_connection: { timeout: 240 }
- name: Wait for the move to record its outcome
  ansible.builtin.wait_for: { path: "{{ hub_move.dir }}/orbit.move-result", timeout: 240 }
- name: Read the outcome of the move
  ansible.builtin.command: { argv: [cat, "{{ hub_move.dir }}/orbit.move-result"] }
  register: hub_move_outcome
  changed_when: false
- name: Remove the recorded outcome
  ansible.builtin.file: { path: "{{ hub_move.dir }}/orbit.move-result", state: absent }
- name: Require the pin to the new hub endpoint
  ansible.builtin.assert:
    that: hub_move_outcome.stdout | trim != 'unpinned'
    fail_msg: node.hub_switch_unpinned
    quiet: true
- name: Require the new hub configuration to load
  ansible.builtin.assert:
    that: hub_move_outcome.stdout | trim != 'load_failed'
    fail_msg: node.hub_switch_load_failed
    quiet: true
- name: Require a handshake through the new hub endpoint
  ansible.builtin.assert:
    that: hub_move_outcome.stdout | trim == 'moved'
    fail_msg: node.hub_switch_no_handshake
    quiet: true
