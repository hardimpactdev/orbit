[package]
name = "orbit-agent"
version = "0.5.0"
edition = "2021"

[lib]
name = "orbit_agent"
path = "src/lib.rs"

[[bin]]
name = "orbit-agent"
path = "src/main.rs"

[dependencies]
orbit-agent-contract = { path = "crates/contract" }
orbit-documents-agent = { path = "../gateway/extensions/documents/agent" }
orbit-ai-router-agent = { path = "../gateway/extensions/ai-router/agent" }
bollard = "0.18"
futures-util = "0.3"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
http = "1"
libgit2-sys = "0.18"
libz-sys = { version = "1", default-features = false, features = ["libc", "static"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time", "sync", "test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
toml = "0.8"
zbus = { version = "5", features = ["tokio"] }
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
sha1 = "0.10"
tar = "0.4"
flate2 = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
xz2 = { version = "0.1.7", features = ["static"] }

# Redaction's shared cases should measure the rules, not unoptimized regex matching.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# Every command hashes its own binary, and a debug binary is large; the tests that run it should not wait on that.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
