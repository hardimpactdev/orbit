cases = [
  "the upgrade runs one tagged phase per step, switches back only after a failure from the switch on, and takes no secret",
  "an upgrade unpacks the checked release, switches the relative link, restarts once and keeps only the release before",
  "a current that is not a relative link to a release fails with process.artifact_layout_invalid before any change",
  "a download whose checksum or binary does not match fails before the switch and leaves current alone",
  "a release that restarts after the switch is switched back to the release before and fails with process.upgrade_rolled_back",
  "a switch back whose release does not run either fails with process.rollback_failed",
  "an upgrade to the installed release changes nothing and ends unchanged",
]
file = "swamp/tests/workflow_process_upgrade_test.ts"
cost = 95
# ESTIMATES from one local run in a task copy (12, 5, 21, 14, 14, 7 s for the Ansible cases) + 25%, rounded up; no hosted receipt yet.
slices = 2
inputs = [
  "bin/swamp-shape-gate",
  "swamp/ansible/ansible.cfg",
  "swamp/ansible/operation-process-upgrade.yml",
  "swamp/ansible/requirements.txt",
  "swamp/ansible/requirements.yml",
  "swamp/ansible/shape-gate-requirements.txt",
  "swamp/ansible/tasks/address-node.yml",
  "swamp/ansible/tasks/process-upgrade-verify.yml",
  "swamp/workflows/workflow-operation-process-upgrade.yaml",
]

[case_costs]
  "the upgrade runs one tagged phase per step, switches back only after a failure from the switch on, and takes no secret" = 2
  "an upgrade unpacks the checked release, switches the relative link, restarts once and keeps only the release before" = 15
  "a current that is not a relative link to a release fails with process.artifact_layout_invalid before any change" = 7
  "a download whose checksum or binary does not match fails before the switch and leaves current alone" = 27
  "a release that restarts after the switch is switched back to the release before and fails with process.upgrade_rolled_back" = 18
  "a switch back whose release does not run either fails with process.rollback_failed" = 18
  "an upgrade to the installed release changes nothing and ends unchanged" = 8
