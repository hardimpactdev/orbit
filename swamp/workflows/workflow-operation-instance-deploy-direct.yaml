id: 738a2f9d-dc6c-4754-92c3-f51de9cb91f9
name: operation-instance-deploy-direct
description: 'Development deploy as official SSH argv from 209, and the production release deploy of docs/cli/instance/deploy.mmd: official SSH argv and cfgmgmt from 209, as the Instance account.'
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [instance.deploy]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*|(development|instance)-deploy-operation-[1-9][0-9]*-(step-([0-9]|[12][0-9]|3[01])|credential|processes)|instance-environment-(testing-)?[1-9][0-9]*|nested-fleet-club-api-key)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: development-source
  labels:
    role: swamp
  steps:
  - name: Write the fetch credential
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: &id001
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts: &id002
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - umask 077 && exec cat > "$1"
        - sh
        - ${{ "/tmp/orbit-git-credential-" + run.id }}
        timeoutSec: 60
        stdin: ${{ vault.get(inputs.execution_secrets.credential.vault, inputs.execution_secrets.credential.key) }}
  - name: Fetch the branch
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Write the fetch credential
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '300'
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -c
        - credential.helper=
        - -c
        - ${{ "credential.helper=store --file=/tmp/orbit-git-credential-" + run.id }}
        - -c
        - protocol.allow=never
        - -c
        - protocol.https.allow=always
        - -c
        - http.followRedirects=false
        - -c
        - 'url.https://github.com/.insteadOf=git@github.com:'
        - -c
        - url.https://github.com/.insteadOf=ssh://git@github.com/
        - -C
        - ${{ inputs.intent.deployment.home }}
        - fetch
        - --quiet
        - --no-tags
        - --
        - ${{ inputs.intent.deployment.repository }}
        - ${{ "+refs/heads/" + inputs.intent.deployment.branch + ":refs/remotes/origin/" + inputs.intent.deployment.branch }}
        timeoutSec: 310
  - name: Remove fetch credential
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Fetch the branch
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -f
        - --
        - ${{ "/tmp/orbit-git-credential-" + run.id }}
        timeoutSec: 60
  - name: Check tracked changes
    labels:
      role: swamp
    dependsOn:
    - step: Fetch the branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - diff
        - --quiet
        - HEAD
        - --
        timeoutSec: 60
  - name: Resolve the commit
    labels:
      role: swamp
    dependsOn:
    - step: Check tracked changes
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - --end-of-options
        - '${{ (inputs.intent.commit == null ? "refs/remotes/origin/" + inputs.intent.deployment.branch : inputs.intent.commit) + "^{commit}" }}'
        timeoutSec: 60
  - name: Count commits after it
    labels:
      role: swamp
    dependsOn:
    - step: Resolve the commit
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" || inputs.intent.commit == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-list
        - --first-parent
        - --count
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() + "..refs/remotes/origin/" + inputs.intent.deployment.branch }}
        timeoutSec: 60
  - name: Read the branch ancestor
    labels:
      role: swamp
    dependsOn:
    - step: Count commits after it
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" || inputs.intent.commit == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - --end-of-options
        - ${{ "refs/remotes/origin/" + inputs.intent.deployment.branch + "~" + steps["Count commits after it"].outputs.stdout.trim() + "^{commit}" }}
        timeoutSec: 60
  - name: Check it is on the branch
    dependsOn:
    - step: Read the branch ancestor
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" || inputs.intent.commit == null }}
    task:
      type: assert
      severity: high
      message: The commit is not on the branch.
      expr: steps["Read the branch ancestor"].outputs.stdout.trim() == steps["Resolve the commit"].outputs.stdout.trim()
  - name: Read the local branch
    labels:
      role: swamp
    dependsOn:
    - step: Resolve the commit
      condition:
        type: succeeded
    # Without a pinned commit the branch membership checks are skipped.
    - step: Count commits after it
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: Read the branch ancestor
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: Check it is on the branch
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - for-each-ref
        - --format=%(objectname)
        - ${{ "refs/heads/" + inputs.intent.deployment.branch }}
        timeoutSec: 60
  - name: Check the local branch
    labels:
      role: swamp
    dependsOn:
    - step: Read the local branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" || steps["Read the local branch"].outputs.stdout.trim() == "" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - merge-base
        - --is-ancestor
        - ${{ "refs/heads/" + inputs.intent.deployment.branch }}
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 60
  - name: List untracked entries
    labels:
      role: swamp
    dependsOn:
    - step: Read the local branch
      condition:
        type: succeeded
    - step: Check the local branch
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - ls-files
        - -z
        - --others
        - --directory
        timeoutSec: 60
  - name: List target directories
    labels:
      role: swamp
    dependsOn:
    - step: List untracked entries
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - ls-tree
        - -d
        - -r
        - -z
        - --name-only
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 60
  - name: Plan the cleanup
    labels:
      role: swamp
    dependsOn:
    - step: List target directories
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev-cleanup-plan" }}
      methodName: cleanup
      inputs:
        home: ${{ inputs.intent.deployment.home }}
        untracked: ${{ steps["List untracked entries"].outputs.stdout }}
        directories: ${{ steps["List target directories"].outputs.stdout }}
- name: development-checkout
  labels:
    role: swamp
  dependsOn:
  - job: development-source
    condition:
      type: succeeded
  steps:
  - name: Check the checkout lock
    labels:
      role: swamp
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/flock
        - --nonblock
        - --conflict-exit-code
        - '73'
        - ${{ inputs.intent.deployment.home }}
        - /bin/true
        timeoutSec: 60
  - name: Clean stale directories
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check the checkout lock
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv: ${{ self.action }}
        timeoutSec: 300
    forEach:
      item: action
      in: '${{ inputs.intent.deployment.variant != "development" ? [] : steps["Plan the cleanup"].outputs.actions }}'
    concurrency: 1
  - name: Check out the commit
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check the checkout lock
      condition:
        type: succeeded
    - step: Clean stale directories
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" || steps.exists(k, k.startsWith("Clean stale directories") && steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-dev-" + string(inputs.node_id)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/flock
        - --nonblock
        - --conflict-exit-code
        - '73'
        - ${{ inputs.intent.deployment.home }}
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - checkout
        - --quiet
        - --no-track
        - -B
        - ${{ inputs.intent.deployment.branch }}
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 300
- name: production-release
  labels:
    role: swamp
  steps:
  - name: Write release credential
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-deploy-write-release-credential-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.production.user }}
        path: ${{ inputs.intent.production.credential }}
        ensure: present
        mode: '0600'
        content: ${{ vault.get(inputs.execution_secrets.credential.vault, inputs.execution_secrets.credential.key) }}
      inputs: {}
  - name: Prepare the release
    labels:
      role: swamp
    dependsOn:
    - step: Write release credential
      condition:
        type: always
    writes: true
    forEach:
      item: action
      in: ${{ inputs.intent.production.prepare }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-prepare-the-release-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-prepare-the-release-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["/usr/bin/timeout", "900", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "/usr/bin/env", "-C", inputs.intent.production.home] + self.action.argv }}
        okExitCodes: ${{ self.action.ok }}
        timeoutSec: 910
  - name: Remove release credential
    labels:
      role: swamp
    dependsOn:
    - step: Write release credential
      condition:
        type: always
    - step: Prepare the release
      condition:
        type: always
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-deploy-remove-release-credential-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.production.user }}
        path: ${{ inputs.intent.production.credential }}
        ensure: absent
      inputs: {}
  - name: Prepare shared paths
    labels:
      role: swamp
    dependsOn:
    - step: Check the branch commit
      condition:
        type: always
    writes: true
    forEach:
      item: action
      in: ${{ inputs.intent.production.shared }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) || ("empty" in self.action && steps["Prepare shared paths-" + string(self.action.empty)].outputs.stdout.trim()
      != "") || ("source" in self.action && steps["Prepare shared paths-" + string(self.action.source)].outputs.exitCode != 0) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-prepare-shared-paths-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-prepare-shared-paths-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["/usr/bin/timeout", "900", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "/usr/bin/env", "-C", inputs.intent.production.home] + self.action.argv }}
        okExitCodes: ${{ self.action.ok }}
        timeoutSec: 910
  - name: Link the release
    labels:
      role: swamp
    dependsOn:
    - step: Prepare shared paths
      condition:
        type: always
    writes: true
    forEach:
      item: link
      in: ${{ inputs.intent.production.links }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/link'
      behaviorName: ${{ ("instance-deploy-link-the-release-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        path: ${{ self.link.path }}
        ensure: present
        target: ${{ self.link.target }}
        owner: ${{ inputs.intent.production.user }}
        group: ${{ inputs.intent.production.user }}
      inputs: {}
  - name: Read the release commit
    labels:
      role: swamp
    dependsOn:
    - step: Remove release credential
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-read-the-release-commit-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-read-the-release-commit-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["/usr/bin/timeout", "30", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "/usr/bin/env", "-C", inputs.intent.production.home] + ["/usr/bin/env", "GIT_CONFIG_NOSYSTEM=1", "GIT_CONFIG_GLOBAL=/dev/null",
          "/usr/bin/git", "-c", "core.hooksPath=/dev/null", "-C", inputs.intent.production.release_path] + ["rev-parse", "--verify", "HEAD"] }}
        timeoutSec: 40
  - name: Read first-parent chain
    labels:
      role: swamp
    dependsOn:
    - step: Read the release commit
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || inputs.intent.production.commit == null || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-read-first-parent-chain-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-read-first-parent-chain-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: '${{ ["/usr/bin/timeout", "60", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "/usr/bin/env", "-C", inputs.intent.production.home] + ["/usr/bin/env", "GIT_CONFIG_NOSYSTEM=1", "GIT_CONFIG_GLOBAL=/dev/null",
          "/usr/bin/git", "-c", "core.hooksPath=/dev/null", "-C", inputs.intent.production.release_path] + ["rev-list", "--first-parent", "refs/remotes/origin/" + inputs.intent.production.branch, "--not", (inputs.intent.production.commit
          == null ? "" : inputs.intent.production.commit) + "^@"] }}'
        timeoutSec: 70
  - name: Check the branch commit
    labels:
      role: swamp
    dependsOn:
    - step: Read first-parent chain
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || inputs.intent.production.commit == null || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: assert
      severity: high
      message: The commit is not on the branch's first-parent chain.
      expr: steps["Read first-parent chain"].outputs.stdout.trim().split("\n")[size(steps["Read first-parent chain"].outputs.stdout.trim().split("\n")) - 1] == inputs.intent.production.commit && steps["Read the release commit"].outputs.stdout.trim()
        == inputs.intent.production.commit
  - name: Read the key names
    labels:
      role: swamp
    dependsOn:
    - step: Link the release
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-read-the-key-names-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-read-the-key-names-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '30'
        - /usr/bin/sed
        - -n
        - -E
        - s/^[ \t]*(export[ \t]+)?([A-Za-z_][A-Za-z0-9_.]*)[ \t]*=.*/\2/p
        - --
        - ${{ inputs.intent.production.home + "/.env" }}
        sudo: true
        timeoutSec: 40
  - name: Check for foreign keys
    labels:
      role: swamp
    dependsOn:
    - step: Read the key names
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: assert
      severity: high
      message: The .env holds keys Orbit does not manage; the deploy would drop them.
      expr: '!steps["Read the key names"].outputs.stdout.split("\n").exists(k, k != "" && !(k in inputs.intent.environment.keys) && !(k in inputs.intent.environment.owned_keys))'
    # The .env is group orbit-env, so the Node agent can report its key names.
  - name: Create the orbit-env group
    labels:
      role: swamp
    dependsOn:
    - step: Check for foreign keys
      condition:
        type: always
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/group'
      behaviorName: ${{ ("instance-deploy-env-group-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        groupname: orbit-env
        ensure: present
        system: true
        become: true
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
      inputs: {}
  - name: Write .env
    labels:
      role: swamp
    dependsOn:
    - step: Create the orbit-env group
      condition:
        type: always
    writes: true
    forEach:
      item: file
      in: '${{ inputs.intent.deployment.variant != "production" ? [] : [{"name": ".env", "secret": inputs.execution_secrets.environment}] + ("testing" in inputs.execution_secrets ? [{"name": ".env.testing", "secret": inputs.execution_secrets.testing}]
        : []) }}'
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-deploy-write-env-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.production.user }}
        path: ${{ inputs.intent.production.home + "/" + self.file.name }}
        ensure: present
        mode: '0640'
        content: ${{ vault.get(self.file.secret.vault, self.file.secret.key) }}
      inputs: {}
  - name: Set the group orbit-env
    labels:
      role: swamp
    dependsOn:
    - step: Write .env
      condition:
        type: succeeded
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-env-group-file-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-env-group-file-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        # Root changes only the group, and -h never follows a link the Instance account placed.
        argv: '${{ ["/usr/bin/sudo", "-n", "--", "/usr/bin/timeout", "30", "/usr/bin/chgrp", "-h", "orbit-env", "--", inputs.intent.production.home + "/.env"] + ("testing" in inputs.execution_secrets ? [inputs.intent.production.home + "/.env.testing"] : []) }}'
        timeoutSec: 40
- name: dev-vp-capture
  labels:
    role: swamp
  dependsOn:
  - job: development-checkout
    condition:
      type: succeeded
  - job: production-release
    condition:
      type: succeeded
  steps:
  - name: dev-vp-read-package
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", "package.json", "-exec", "cat", "--", "{}", "+"] }}
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-pnpm_lock
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-package
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-1-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", "pnpm-lock.yaml", "-exec", "cat", "--", "{}", "+"] }}
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-npm_lock
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-pnpm_lock
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-2-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", "package-lock.json", "-exec", "cat", "--", "{}", "+"] }}
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-node_version
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-npm_lock
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-3-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", ".node-version", "-exec", "cat", "--", "{}", "+"] }}
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-nvmrc
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-node_version
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-4-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", ".nvmrc", "-exec", "cat", "--", "{}", "+"] }}
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-home
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-nvmrc
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-5-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - realpath
        - -s
        - --
        - '${{ inputs.intent.deployment.variant == "production" ? inputs.intent.production.home : "." }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-store
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-home
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-6-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - find
        - /opt
        - .
        - -type
        - f
        - (
        - -path
        - /opt/orbit/vite-plus/bin/vp
        - -o
        - -path
        - ./.vite-plus/bin/vp
        - -o
        - -path
        - ./.local/share/vite-plus/bin/vp
        - )
        - -exec
        - realpath
        - -s
        - --
        - '{}'
        - +
        - -o
        - (
        - -path
        - .
        - -o
        - -path
        - /opt
        - -o
        - -path
        - /opt/orbit
        - -o
        - -path
        - /opt/orbit/vite-plus
        - -o
        - -path
        - /opt/orbit/vite-plus/bin
        - -o
        - -path
        - ./.vite-plus
        - -o
        - -path
        - ./.vite-plus/bin
        - -o
        - -path
        - ./.local
        - -o
        - -path
        - ./.local/share
        - -o
        - -path
        - ./.local/share/vite-plus
        - -o
        - -path
        - ./.local/share/vite-plus/bin
        - )
        - -o
        - -prune
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-links
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-store
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-vp-requirements'
      behaviorName: ${{ "idm-dev-vp-7" }}
      methodName: links
      inputs:
        application: ${{ inputs.intent.application }}
        package: ${{ steps["dev-vp-read-package"].outputs.stdout }}
        pnpm_lock: ${{ steps["dev-vp-read-pnpm_lock"].outputs.stdout }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
- name: dev-vp-workspaces
  labels:
    role: swamp
  dependsOn:
  - job: dev-vp-capture
    condition:
      type: succeeded
  steps:
  - name: dev-vp-read-workspace
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-0-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", self.link.directory, "-maxdepth", "1", "-type", "f", "-name", "package.json", "-exec", "cat", "--", "{}", "+"] }}
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
    forEach:
      item: link
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-links"].outputs.links) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-requirements
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-workspace
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-vp-requirements'
      behaviorName: ${{ "idm-dev-vp-1" }}
      methodName: capture
      inputs:
        package: ${{ steps["dev-vp-read-package"].outputs.stdout }}
        pnpm_lock: ${{ steps["dev-vp-read-pnpm_lock"].outputs.stdout }}
        npm_lock: ${{ steps["dev-vp-read-npm_lock"].outputs.stdout }}
        node_version: ${{ steps["dev-vp-read-node_version"].outputs.stdout }}
        nvmrc: ${{ steps["dev-vp-read-nvmrc"].outputs.stdout }}
        home: ${{ steps["dev-vp-home"].outputs.stdout }}
        store: ${{ steps["dev-vp-store"].outputs.stdout }}
        links: ${{ steps["dev-vp-links"].outputs.links }}
        workspaces: '${{ steps.filter(k, k.startsWith("dev-vp-read-workspace-")).map(k, {"step": k, "stdout": steps[k].outputs.stdout}) }}'
        production: ${{ inputs.intent.deployment.variant == "production" }}
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: Read Vite manager home
    guard: ${{ inputs.intent.deployment.variant != "production" || !inputs.intent.deployment.needs_vp || steps["dev-vp-requirements"].outputs.runtime == null }}
    labels:
      role: swamp
    task:
      behaviorName: ${{ "id-vp-home-" + string(inputs.node_id) }}
      behaviorType: '@swamp/ssh'
      globalArgs:
        hosts:
        - address: ${{ inputs.intent.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
        name: ${{ "id-vp-home-" + string(inputs.node_id) }}
        transport:
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.intent.ssh_execution.target.port }}
          user: ${{ inputs.intent.ssh_execution.target.user }}
      inputs:
        argv:
        - timeout
        - '10'
        - getent
        - passwd
        - ${{ inputs.intent.ssh_execution.target.user }}
        hosts: name:target
        sudo: true
        timeoutSec: 20
      methodName: exec
      type: behavior
    dependsOn:
    - step: dev-vp-requirements
      condition:
        type: succeeded
  - name: Read Vite manager CLI
    labels:
      role: swamp
    guard: ${{ inputs.intent.deployment.variant != "production" || !inputs.intent.deployment.needs_vp || steps["dev-vp-requirements"].outputs.runtime == null }}
    dependsOn:
    - step: Read Vite manager home
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "id-vp-source-" + string(inputs.node_id) }}
      methodName: check
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        path: ${{ steps["Read Vite manager home"].outputs.stdout.trim().split(":")[5] + "/.local/share/vite-plus/bin/vp" }}
        ensure: present
      inputs: {}
- name: dev-vp-install
  labels:
    role: swamp
  dependsOn:
  - job: dev-vp-workspaces
    condition:
      type: succeeded
  steps:
  - name: dev-vp-manager
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: operation-tool-manager-setup
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        ssh: ${{ inputs.intent.ssh_execution }}
        intent:
          manager: vp
          user: '${{ inputs.intent.vp_setup == null ? "" : inputs.intent.vp_setup.input.user }}'
          platform: linux
          architecture: x86_64
          setup: ${{ inputs.intent.vp_setup }}
        converge: ${{ inputs.intent.deployment.variant == "production" && !steps["Read Vite manager CLI"].outputs.current.exists }}
    forEach:
      item: runtime
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : ((steps["dev-vp-requirements"].outputs.manager_required || (inputs.intent.deployment.variant == "production" && !steps["Read
        Vite manager CLI"].outputs.current.exists)) ? [steps["dev-vp-requirements"].outputs.runtime] : [])) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-manager-ready
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-manager
      condition:
        type: always
    task:
      type: assert
      expr: 'steps["dev-vp-requirements"].outputs.runtime == null || !(steps["dev-vp-requirements"].outputs.manager_required || (inputs.intent.deployment.variant == "production" && !steps["Read Vite manager CLI"].outputs.current.exists)) || ("dev-vp-manager-0" in steps && steps["dev-vp-manager-0"].status == "succeeded")'
      severity: high
      message: The admitted VP manager was not prepared.
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: Prepare Vite cache
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" || !inputs.intent.deployment.needs_vp }}
    dependsOn:
    - step: dev-vp-manager-ready
      condition:
        type: succeeded
    forEach:
      item: directory
      in: '${{ inputs.intent.deployment.variant != "production" || !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : [inputs.intent.production.home + "/.local", inputs.intent.production.home
        + "/.local/share", steps["dev-vp-requirements"].outputs.runtime.store]) }}'
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ ("instance-deploy-vp-cache-" + string(inputs.intent.production.instance_id) + "-" + string(self._index) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        path: ${{ self.directory }}
        owner: ${{ inputs.intent.production.user }}
        group: ${{ inputs.intent.production.user }}
        mode: '0700'
        ensure: present
      inputs: {}
  - name: Publish public Vite CLI
    guard: ${{ inputs.intent.deployment.variant != "production" || !inputs.intent.deployment.needs_vp || steps["dev-vp-requirements"].outputs.runtime == null || steps.exists(k,steps[k].status in ["failed","cancelled"]) }}
    labels:
      role: swamp
    task:
      behaviorName: ${{ "id-vp-publish-" + string(inputs.node_id) }}
      behaviorType: '@swamp/ssh'
      globalArgs:
        hosts:
        - address: ${{ inputs.intent.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
        name: ${{ "id-vp-publish-" + string(inputs.node_id) }}
        transport:
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.intent.ssh_execution.target.port }}
          user: ${{ inputs.intent.ssh_execution.target.user }}
      inputs:
        argv:
        - timeout
        - '30'
        - install
        - --compare
        - -D
        - -m
        - '0755'
        - -o
        - root
        - -g
        - root
        - --
        - ${{ steps["Read Vite manager home"].outputs.stdout.trim().split(":")[5] + "/.local/share/vite-plus/bin/vp" }}
        - /opt/orbit/vite-plus/bin/vp
        hosts: name:target
        sudo: true
        timeoutSec: 40
      methodName: exec
      type: behavior
    dependsOn:
    - step: dev-vp-manager-ready
      condition:
        type: succeeded
    writes: true
  - name: dev-vp-cli
    writes: true
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-manager-ready
      condition:
        type: succeeded
    - step: Prepare Vite cache
      condition:
        type: always
    - step: Publish public Vite CLI
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-2-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: '${{ (inputs.intent.deployment.variant == "production" ? ["timeout", "60", "sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "env", "-C", inputs.intent.production.home, "VP_HOME=" + self.runtime.store] : ["timeout",
          "900", "env", "VP_HOME=" + self.runtime.store]) + ["binary" in self.runtime ? self.runtime.binary : self.runtime.store + "/bin/vp", "--version"] }}'
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
        timeoutSec: 70
    forEach:
      item: runtime
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : [steps["dev-vp-requirements"].outputs.runtime]) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-cli-ready
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-cli
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-vp-requirements'
      behaviorName: ${{ "idm-dev-vp-3" + "-" + string(self._index) }}
      methodName: cli
      inputs:
        runtime: ${{ self.runtime }}
        observation: ${{ steps["dev-vp-cli-0"].outputs }}
    forEach:
      item: runtime
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : [steps["dev-vp-requirements"].outputs.runtime]) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-install
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-cli-ready
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-4-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: '${{ (inputs.intent.deployment.variant == "production" ? ["timeout", "900", "sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "env", "-C", inputs.intent.production.home, "VP_HOME=" + self.runtime.store] :
          ["env", "VP_HOME=" + self.runtime.store]) + ["binary" in self.runtime ? self.runtime.binary : self.runtime.store + "/bin/vp", "-C", inputs.intent.deployment.variant == "production" ? inputs.intent.account_home : inputs.intent.application,
          "env", "install", "node@"+self.runtime.node_version, self.runtime.package_manager+"@"+self.runtime.package_manager_version+(self.runtime.package_manager_hash==null?"":"+"+self.runtime.package_manager_hash)] }}'
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
        timeoutSec: 910
    forEach:
      item: runtime
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : [steps["dev-vp-requirements"].outputs.runtime]) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
    writes: true
  - name: dev-vp-inventory
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-install
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-5-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: '${{ (inputs.intent.deployment.variant == "production" ? ["timeout", "900", "sudo", "-n", "-H", "-u", inputs.intent.production.user, "--", "env", "-C", inputs.intent.production.home, "VP_HOME=" + self.runtime.store] :
          ["env", "VP_HOME=" + self.runtime.store]) + ["binary" in self.runtime ? self.runtime.binary : self.runtime.store + "/bin/vp", "-C", inputs.intent.deployment.variant == "production" ? inputs.intent.account_home : inputs.intent.application,
          "env", "list", "--json"] }}'
        sudo: ${{ inputs.intent.deployment.variant == "production" }}
        timeoutSec: 70
    forEach:
      item: runtime
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : [steps["dev-vp-requirements"].outputs.runtime]) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-verify
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-inventory
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-vp-requirements'
      behaviorName: ${{ "idm-dev-vp-6" + "-" + string(self._index) }}
      methodName: verify
      inputs:
        runtime: ${{ self.runtime }}
        inventory: ${{ steps["dev-vp-inventory-0"].outputs }}
    forEach:
      item: runtime
      in: '${{ !inputs.intent.deployment.needs_vp ? [] : (steps["dev-vp-requirements"].outputs.runtime == null ? [] : [steps["dev-vp-requirements"].outputs.runtime]) }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-result
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-manager
      condition:
        type: always
    - step: dev-vp-manager-ready
      condition:
        type: always
    - step: dev-vp-cli
      condition:
        type: always
    - step: dev-vp-cli-ready
      condition:
        type: always
    - step: dev-vp-install
      condition:
        type: always
    - step: dev-vp-inventory
      condition:
        type: always
    - step: dev-vp-verify
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-vp-requirements'
      behaviorName: ${{ "idm-dev-vp-7" }}
      methodName: result
      inputs:
        name: dev-vp
        steps: '${{ {"dev-vp-requirements": steps["dev-vp-requirements"], "dev-vp-verify-0": ("dev-vp-verify-0" in steps ? steps["dev-vp-verify-0"] : {"status":"skipped"})} }}'
    guard: ${{ !inputs.intent.deployment.needs_vp }}
- name: production-schedule-intent
  labels:
    role: swamp
  steps:
  - name: Read Schedule group
    guard: ${{ inputs.intent.deployment.variant != "production" || size(inputs.intent.runtime_definitions.schedules) == 0 }}
    labels:
      role: swamp
    task:
      behaviorName: ${{ "id-sgroup-" + string(inputs.node_id) }}
      behaviorType: '@swamp/ssh'
      globalArgs:
        hosts:
        - address: ${{ inputs.intent.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
        name: ${{ "id-sgroup-" + string(inputs.node_id) }}
        transport:
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ inputs.intent.ssh_execution.target.port }}
          user: ${{ inputs.intent.ssh_execution.target.user }}
      inputs:
        argv:
        - timeout
        - '30'
        - id
        - -gn
        - --
        - ${{ inputs.intent.production.user }}
        hosts: name:target
        sudo: true
        timeoutSec: 40
      methodName: exec
      type: behavior
  - name: Render Schedules
    labels:
      role: swamp
    dependsOn:
    - step: Read Schedule group
      condition:
        type: always
    forEach:
      item: schedule
      in: ${{ inputs.intent.runtime_definitions.schedules }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k,steps[k].status in ["failed","cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/schedule-run-assets'
      behaviorName: ${{ ("id-schedules-" + self.schedule.id + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: lifecycle
      inputs:
        schedule:
          id: ${{ self.schedule.id }}
          command_hash: ${{ self.schedule.command_hash }}
          user: ${{ self.schedule.user }}
          home: ${{ self.schedule.home }}
          working_directory: ${{ self.schedule.working_directory }}
          shell: ${{ self.schedule.shell }}
          login_shell: ${{ self.schedule.login_shell }}
          calendar: ${{ self.schedule.calendar }}
          timeout_seconds: ${{ self.schedule.timeout_seconds }}
          desired: ${{ self.schedule.desired }}
          group: ${{ steps["Read Schedule group"].outputs.stdout.trim() }}
- name: deploy
  labels:
    role: swamp
  dependsOn:
  - job: dev-vp-install
    condition:
      type: succeeded
  - job: production-schedule-intent
    condition:
      type: succeeded
  steps:
  - name: Write the container intent
    # A default Instance in a container deploys in it (docs/cli/instance/container/deploy-default.mmd). Each machine phase is a tag of
    # instance-container.yml; the Project's commands run in the container as `orbit`, each from its own vault copy.
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "container" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ "ansible-input" }}
      methodName: write
      inputs:
        intent: ${{ inputs.intent }}
        path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
  - name: Start the container
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Write the container intent
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "container" || steps.exists(k, steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "instance-deploy-container-start-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags start "$ORBIT_ANSIBLE/instance-container.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_RUN_ID: ${{ run.id }}
          ORBIT_ANSIBLE: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets : "" }}'
          ANSIBLE_CONFIG: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets + "/ansible.cfg" : "" }}'
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          # Only a nested-fleet container's start gets its Club key, from its one vault copy; Ansible passes it on stdin. Any other run
          # names a key it always has, which Ansible never delivers (docs/reference/swamp-command-steps.md#secret-inputs).
          ORBIT_CLUB_KEY: '${{ vault.get(inputs.execution_secrets.credential.vault, inputs.intent.deployment.variant == "container" && inputs.intent.container.project == "orbit-instances-nested" && inputs.intent.container.club_key.available ? inputs.execution_secrets.club_key.key : inputs.execution_secrets.credential.key) }}'
  - name: Fetch into the mirror
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Start the container
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "container" || steps.exists(k, steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "instance-deploy-container-fetch-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 400 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags fetch "$ORBIT_ANSIBLE/instance-container.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_RUN_ID: ${{ run.id }}
          ORBIT_ANSIBLE: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets : "" }}'
          ANSIBLE_CONFIG: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets + "/ansible.cfg" : "" }}'
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          ORBIT_GIT_CREDENTIAL: ${{ vault.get(inputs.execution_secrets.credential.vault, inputs.execution_secrets.credential.key) }}
  - name: Check out in the container
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Fetch into the mirror
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "container" || steps.exists(k, steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "instance-deploy-container-checkout-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags checkout "$ORBIT_ANSIBLE/instance-container.yml"
        env: &container_ansible
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_RUN_ID: ${{ run.id }}
          ORBIT_ANSIBLE: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets : "" }}'
          ANSIBLE_CONFIG: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets + "/ansible.cfg" : "" }}'
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
  - name: Run dev deploy steps
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check out in the container
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "container" || steps.exists(k, k.startsWith("Run dev deploy steps") && steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-container-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-container-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["incus", "exec", "--project", inputs.intent.container.project, "--cwd", inputs.intent.container.workspace, inputs.intent.container.name, "--", "runuser", "-u", "orbit", "--", "/usr/bin/env", "-i"] + inputs.intent.container.environment + ["/bin/sh", "-c", self.step.required ? "s=$(cat) && exec timeout \"$1\" /bin/bash --noprofile --norc -eu -c \"$s\" </dev/null >/dev/null 2>&1" : "s=$(cat) || exit 1; timeout \"$1\" /bin/bash --noprofile --norc -eu -c \"$s\" </dev/null >/dev/null 2>&1; echo \"$?\"", "sh", string(self.step.timeout_seconds)] }}'
        timeoutSec: ${{ self.step.timeout_seconds + 10 }}
        stdin: ${{ vault.get(inputs.execution_secrets["step_" + string(self._index)].vault, inputs.execution_secrets["step_" + string(self._index)].key) }}
    forEach:
      item: step
      in: '${{ inputs.intent.deployment.variant != "container" ? [] : inputs.intent.deployment.steps }}'
    concurrency: 1
  - name: Install the Processes
    # The Project's development Processes: changed units and environment files go in and restart, and a moved commit restarts the
    # Processes that restart on deploy. Each environment file comes from the vault.
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check out in the container
      condition:
        type: succeeded
    - step: Run dev deploy steps
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "container" || steps.exists(k, steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "instance-deploy-container-processes-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags processes "$ORBIT_ANSIBLE/instance-container.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_RUN_ID: ${{ run.id }}
          ORBIT_ANSIBLE: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets : "" }}'
          ANSIBLE_CONFIG: '${{ "Write the container intent" in steps && steps["Write the container intent"].status == "succeeded" ? steps["Write the container intent"].outputs.assets + "/ansible.cfg" : "" }}'
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          ORBIT_PROCESS_ENVIRONMENTS: '${{ vault.get(inputs.execution_secrets.credential.vault, inputs.intent.deployment.variant == "container" ? inputs.execution_secrets.process_environments.key : inputs.execution_secrets.credential.key) }}'
  - name: Start the inner fleet
