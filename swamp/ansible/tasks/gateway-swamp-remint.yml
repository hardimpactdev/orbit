---
# The Swamp tokens of a Gateway's own control plane, renewed on the machine that holds them (docs/reference/pipeline/2-development-environment.mmd,
# "Re-mint the Swamp tokens"). A task VM runs this on the nested Gateway of its fleet after it mounts the checkout, and the refresh of a
# nested-fleet default runs it when the tokens are old or one is missing (instance-fleet-refresh.yml), so the tokens never decide how long a
# fleet lives. It needs the Swamp Club key on the machine, which a proof run pushes. The tokens are the ones `gateway-swamp.yml` mints, by the same names and into the same files;
# the Swamp CLI renews them: `access token rotate` revokes a token and mints a replacement with its name and principal, and a worker
# enrollment token is minted again under a new name. Nothing is written to output, and no run input or output holds a token.
# The shell tasks print no token: every token goes to a file or a variable, so a failure shows its command and its error. The copy
# of the worker tokens keeps `no_log`.
- name: Name the paths of the control plane
  ansible.builtin.set_fact:
    swamp_user: "{{ control.user }}"
    swamp_home: "/home/{{ control.user }}"
    swamp_repository: "{{ control.repository }}"
    swamp_app: "{{ control.repository | dirname }}/apps/gateway"
    swamp_credentials: /etc/orbit/swamp-role-worker
    swamp_driver_token: "/home/{{ control.user }}/.config/swamp/serve-driver-token"
- name: Name how the Swamp CLI runs here
  ansible.builtin.set_fact:
    swamp_cli:
      HOME: "{{ swamp_home }}"
      SWAMP_HOME: "{{ swamp_home }}/.swamp"
      SWAMP_CONFIG_DIR: "{{ swamp_home }}/.config/swamp"
      SWAMP_API_KEY_FILE: "{{ swamp_home }}/.config/swamp/api-key"
      SWAMP_NO_UPDATE_CHECK: "1"
      SWAMP_NO_TELEMETRY: "1"
- name: Require the Swamp key
  ansible.builtin.stat:
    path: "{{ swamp_cli.SWAMP_API_KEY_FILE }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: swamp_key
  failed_when: not swamp_key.stat.exists
# An older fleet has only workers a and b: c has no token files, and the remint makes it after serve stops. A c that has one file, an
# empty one, or files with other names is refused before any service stops.
- name: Check worker c credentials before stopping the control plane
  ansible.builtin.stat:
    path: "{{ swamp_credentials }}/c/{{ item }}.token"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: [enrollment, server]
  register: swamp_remint_c
- name: Name whether worker c is still to be made
  ansible.builtin.set_fact:
    swamp_remint_c_absent: "{{ swamp_remint_c.results | selectattr('stat.exists') | list | length == 0 }}"
- name: Require both worker c token files or neither
  when: not swamp_remint_c_absent
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) | int > 0
    fail_msg: >-
      Swamp remint stopped before stopping any service: worker c has only part of its enrollment and server token files.
      Remove both files, and the remint makes worker c
  loop: "{{ swamp_remint_c.results }}"
  loop_control: {label: "{{ item.item }}"}
- name: Read worker c credentials privately for format validation
  when: not swamp_remint_c_absent
  ansible.builtin.slurp:
    src: "{{ swamp_credentials }}/c/{{ item }}.token"
  loop: [enrollment, server]
  register: swamp_remint_c_contents
  no_log: true
- name: Validate worker c token names and secret parts privately
  when: not swamp_remint_c_absent
  ansible.builtin.set_fact:
    swamp_remint_c_valid: >-
      {{ (swamp_remint_c_contents.results[0].content | b64decode | trim
      is match('^orbit-worker-c(-[0-9]+)?\.[^\s.]+$')) and
      (swamp_remint_c_contents.results[1].content | b64decode | trim
      is match('^orbit-worker-c-access\.[^\s.]+$')) }}
  no_log: true
- name: Require complete worker c credentials with the expected names
  when: not swamp_remint_c_absent
  ansible.builtin.assert:
    that: swamp_remint_c_valid
    fail_msg: >-
      Swamp remint stopped before stopping any service: worker c needs full name.secret tokens
      named orbit-worker-c (optionally timestamped) and orbit-worker-c-access
# Serve and the workers hold the token store open, so they stop while the tokens change.
- name: Stop the workers
  ansible.builtin.systemd: { name: "orbit-swamp-worker@{{ item }}.service", state: stopped }
  loop: [a, b, c]
- name: Stop serve
  ansible.builtin.systemd: { name: orbit-swamp-serve.service, state: stopped }
- name: Make the worker set whole
  ansible.builtin.import_tasks: gateway-swamp-workers.yml
# The rotation is its own task with a short command, so a failure shows the CLI's error in the few hundred characters that the run keeps.
- name: Rotate the serve driver token
  ansible.builtin.shell:
    cmd: umask 077 && swamp access token rotate serve-driver --duration 30d --json >/dev/null
    chdir: "{{ swamp_repository }}"
    executable: /bin/bash
  become_user: "{{ swamp_user }}"
  environment: "{{ swamp_cli }}"
  changed_when: true
- name: Write the serve driver token
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      swamp access token reveal serve-driver --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' > {{ swamp_driver_token }}
    chdir: "{{ swamp_repository }}"
    executable: /bin/bash
  become_user: "{{ swamp_user }}"
  environment: "{{ swamp_cli }}"
  changed_when: true
- name: Renew the worker tokens
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      stage={{ swamp_home }}/.config/swamp/worker-{{ item }}
      swamp worker token create orbit-worker-{{ item }}-$(date +%s) --duration 30d --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' > "$stage.enrollment"
      swamp access token rotate orbit-worker-{{ item }}-access --duration 30d --json >/dev/null
      swamp access token reveal orbit-worker-{{ item }}-access --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' > "$stage.server"
    chdir: "{{ swamp_repository }}"
    executable: /bin/bash
  become_user: "{{ swamp_user }}"
  environment: "{{ swamp_cli }}"
  loop: [a, b, c]
  changed_when: true
- name: Place the worker tokens
  ansible.builtin.copy:
    src: "{{ swamp_home }}/.config/swamp/worker-{{ item.worker }}.{{ item.kind }}"
    remote_src: true
    dest: "{{ swamp_credentials }}/{{ item.worker }}/{{ item.token }}.token"
    owner: root
    group: "{{ swamp_user }}"
    mode: "0640"
  loop:
    - { worker: a, kind: enrollment, token: enrollment }
    - { worker: a, kind: server, token: server }
    - { worker: b, kind: enrollment, token: enrollment }
    - { worker: b, kind: server, token: server }
    - { worker: c, kind: enrollment, token: enrollment }
    - { worker: c, kind: server, token: server }
  loop_control: { label: "{{ item.worker }} {{ item.kind }}" }
  no_log: true
- name: Remove the staged worker tokens
  ansible.builtin.file: { path: "{{ swamp_home }}/.config/swamp/worker-{{ item.0 }}.{{ item.1 }}", state: absent }
  loop: "{{ ['a', 'b', 'c'] | product(['enrollment', 'server']) | list }}"
  loop_control: { label: "{{ item.0 }} {{ item.1 }}" }
# The Gateway starts runs with its run and read tokens.
- name: Renew the Gateway tokens
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      env_file={{ swamp_app }}/.env
      swamp access token rotate orbit-gateway-run --duration 30d --json >/dev/null
      swamp access token rotate orbit-gateway-read --duration 30d --json >/dev/null
      run_token=$(swamp access token reveal orbit-gateway-run --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
      read_token=$(swamp access token reveal orbit-gateway-read --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
      # `.env` is a bind mount of the guest's own file: it is rewritten in place, not replaced.
      kept=$(mktemp)
      grep -v '^ORBIT_SWAMP_\(RUN_TOKEN\|READ_TOKEN\)=' "$env_file" > "$kept" || true
      printf 'ORBIT_SWAMP_RUN_TOKEN=%s\nORBIT_SWAMP_READ_TOKEN=%s\n' "$run_token" "$read_token" >> "$kept"
      cat "$kept" > "$env_file"
      rm -f "$kept"
    chdir: "{{ swamp_repository }}"
    executable: /bin/bash
  become_user: "{{ swamp_user }}"
  environment: "{{ swamp_cli }}"
  changed_when: true
- name: Clear the configuration of the Gateway
  ansible.builtin.command: { argv: [php, "{{ swamp_app }}/artisan", config:clear] }
  become_user: "{{ swamp_user }}"
  changed_when: true
# Serve and the workers read their tokens when they start.
- name: Start serve
  ansible.builtin.systemd: { name: orbit-swamp-serve.service, state: started }
- name: Wait for serve
  ansible.builtin.wait_for: { host: 127.0.0.1, port: 9418, timeout: 90 }
- name: Start the workers
  ansible.builtin.systemd: { name: "orbit-swamp-worker@{{ item }}.service", state: started, enabled: true }
  loop: [a, b, c]
# The run that called the remint goes on only when Swamp serves again: serve and the three workers are active.
- name: Wait for serve and the workers
  ansible.builtin.command: { argv: [systemctl, is-active, orbit-swamp-serve.service, orbit-swamp-worker@a.service, orbit-swamp-worker@b.service, orbit-swamp-worker@c.service] }
  register: swamp_remint_active
  until: swamp_remint_active.stdout_lines == ['active', 'active', 'active', 'active']
  retries: 15
  delay: 2
  changed_when: false
