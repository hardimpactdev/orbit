id: 25c04899-994c-4f6c-a297-129b033a8568
name: operation-proof-run
description: Prove the selected cases of one commit on a claimed proof slot, with the existing proof path, as official SSH exec argv.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [proof.run]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prove
  labels: {role: swamp}
  steps:
  - name: Read the checkout head
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-run-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh_args
        name: '${{ ("proof-run-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.slot.checkout_path }}
        - rev-parse
        - HEAD
  - name: Read the checkout state
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-run-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.slot.checkout_path }}
        - status
        - --porcelain
  - name: Check the checkout
    labels: {role: swamp}
    task:
      type: assert
      # The slot holds code and no credential: its checkout is clean at the exact commit, or nothing runs.
      expr: 'steps["Read the checkout head"].outputs.stdout.trim() == inputs.intent.commit && steps["Read the checkout state"].outputs.stdout.trim() == ""'
      message: The slot checkout is not clean at the admitted commit.
      severity: high
    dependsOn:
    - step: Read the checkout head
      condition:
        type: succeeded
    - step: Read the checkout state
      condition:
        type: succeeded
  # The existing proof path: one test fleet reset, then each selected case in order, one verdict for each.
  - name: Run the cases
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-run-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 2400
        argv: ${{ ["env", "-C", inputs.intent.slot.checkout_path, "PROOF_BUDGET_SECONDS=1800", "bin/proof-fleet", "verify", string(inputs.operation_id)] + inputs.intent.cases.map(c, c.program) }}
    dependsOn:
    - step: Check the checkout
      condition:
        type: succeeded
  - name: Release the fleet
    labels: {role: swamp}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-run-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 600
        argv:
        - env
        - -C
        - ${{ inputs.intent.slot.checkout_path }}
        - bin/proof-fleet
        - release
        - ${{ string(inputs.operation_id) }}
    dependsOn:
    - step: Run the cases
      condition:
        type: always
  - name: Check the verdicts
    labels: {role: swamp}
    task:
      type: assert
      expr: '"Run the cases" in steps && "outputs" in steps["Run the cases"] && steps["Run the cases"].outputs.exitCode == 0'
      message: A selected case failed or did not run.
      severity: high
    dependsOn:
    - step: Release the fleet
      condition:
        type: always
