id: 07491a2f-25a8-4458-92dd-e58e467ac28c
name: operation-task-vm-hub-converge
description: Check, write and load the Gateway-rendered task VM filter on the WireGuard hub, allow 209 SSH, 209's TLS probe and Router web through UFW, and assert the exact live rules, over pinned official SSH from 209.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.hub_converge}
    intent:
      type: object
      properties:
        node_id: {type: integer, minimum: 1}
        ssh: {type: object}
        nft: {type: string, maxLength: 65536}
        unit: {type: string, maxLength: 4096}
        live_rules: {type: array, minItems: 1, items: {type: string}}
        control_rule: {type: array, items: {type: string}}
        router_rules: {type: array, items: {type: array, items: {type: string}}}
      required: [node_id, ssh, nft, unit, live_rules, control_rule, router_rules]
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: hub
  steps:
  - name: Check the new ruleset
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "task-vm-hub-check-" + string(inputs.intent.node_id) }}'
      methodName: exec
      globalArgs: &hub
        name: '${{ "task-vm-hub-check-" + string(inputs.intent.node_id) }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.ssh.target.user }}'
          port: '${{ inputs.intent.ssh.target.port }}'
          identityFile: '${{ inputs.intent.ssh.identity_file }}'
        hosts: [{name: hub, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]
      # Parses the whole file with the hub's own nft and changes nothing.
      inputs: {hosts: 'name:hub', sudo: true, argv: [timeout, '60', /usr/sbin/nft, --check, --file, '-'], stdin: '${{ inputs.intent.nft }}', timeoutSec: 70}
  - name: Write and load the filter
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Check the new ruleset, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "task-vm-hub-load-" + string(inputs.intent.node_id) }}'
      methodName: exec
      globalArgs:
        <<: *hub
        name: '${{ "task-vm-hub-load-" + string(inputs.intent.node_id) }}'
      # One action: the file from stdin, the unit, then the unit's own `nft -f` replaces the table in one transaction.
      # The listing of the live chain is the read-back for the end check.
      inputs:
        hosts: 'name:hub'
        sudo: true
        argv: [timeout, '60', sh, -c, 'install -D -m 0600 -o root -g root /dev/stdin /etc/orbit/task-vms/hub.nft && printf %s "$1" | install -D -m 0644 -o root -g root /dev/stdin /etc/systemd/system/orbit-task-vms-hub.service && systemctl daemon-reload && systemctl enable orbit-task-vms-hub.service && systemctl restart orbit-task-vms-hub.service && nft list chain inet orbit_task_vms forward', sh, '${{ inputs.intent.unit }}']
        stdin: '${{ inputs.intent.nft }}'
        timeoutSec: 70
  - name: Allow 209 SSH, Router web
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Write and load the filter, condition: {type: succeeded}}]
    forEach: {item: rule, in: '${{ [inputs.intent.control_rule] + inputs.intent.router_rules }}'}
    # One rule at a time, so UFW never runs twice at once; each rule keeps its own name per hub and index.
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "task-vm-hub-ufw-" + string(inputs.intent.node_id) + "-" + string(self._index) }}'
      methodName: exec
      globalArgs:
        <<: *hub
        name: '${{ "task-vm-hub-ufw-" + string(inputs.intent.node_id) + "-" + string(self._index) }}'
      inputs: {hosts: 'name:hub', sudo: true, argv: '${{ ["timeout", "60"] + self.rule }}', timeoutSec: 70}
  - name: Confirm the filter
    labels: {role: swamp}
    dependsOn: [{step: Write and load the filter, condition: {type: succeeded}}, {step: 'Allow 209 SSH, Router web', condition: {type: succeeded}}]
    task:
      type: assert
      severity: high
      message: The hub does not run every admitted control and Router rule.
      expr: >-
        inputs.intent.live_rules.all(r, steps["Write and load the filter"].outputs.stdout.contains("\t\t" + r + "\n"))
