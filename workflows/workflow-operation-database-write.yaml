id: e947ab58-40c6-405d-9c74-2c14210e4511
name: operation-database-write
description: Apply one admitted private SQL write and project only its row count.
target: '${{ "orbit-node-" + string(inputs.node_id) }}'
labels: { node: "${{ string(inputs.node_id) }}" }
writes: true
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [database.write] }
  required: [operation_id, node_id, kind]
jobs:
  - name: server
    steps:
      - name: apply
        dataOutputOverrides:
          - specName: outcome
            vary: [run_id]
        task:
          type: behavior
          behaviorType: "@nckrtl/database-write"
          behaviorName: '${{ "database-write-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: project
        dependsOn:
          - step: apply
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/database-write"
          behaviorName: '${{ "database-write-" + string(inputs.node_id) }}'
          methodName: project
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            outcome: "${{ steps.apply.outputs.outcome }}"
