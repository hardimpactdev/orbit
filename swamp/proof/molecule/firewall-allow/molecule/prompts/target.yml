---
# The Node that the cases work on. The Node prompt of the CLI is a select list (Laravel Prompts SelectPrompt) of the active Linux Nodes in the
# order of GET /nodes, and `ansible.builtin.expect` can only press Enter on it, which takes the FIRST entry (see cases.yml). So the target is
# not fixed to app-dev as in the runner: it is whatever the Gateway lists first, read here before every playbook.
- ansible.builtin.import_playbook: ../default/facts.yml

- name: The Node that the Node prompt lists first
  hosts: localhost
  gather_facts: false
  tasks:
    - name: List the Nodes, in the order of the API (the order of the menu)
      ansible.builtin.uri:
        url: "{{ gateway_url }}/nodes"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: menu_nodes

    - name: The menu is the active Linux Nodes, as StoreFirewallRuleCommand::askForNode builds it
      ansible.builtin.set_fact:
        menu: "{{ menu_nodes.json.data | selectattr('status', 'equalto', 'active') | selectattr('platform', 'equalto', 'linux') | map(attribute='name') | list }}"
        cacheable: true

    - name: The first entry is the target
      ansible.builtin.set_fact:
        target_node: "{{ menu | first | default('') }}"
        cacheable: true

    - name: The target is one of the nested containers
      ansible.builtin.assert:
        that:
          - target_node != ''
          - ('nested-' ~ target_node) in groups['nodes']
        fail_msg: "the Node prompt lists {{ menu }}; its first entry is not a container of this scenario ({{ groups['nodes'] }})"
        quiet: true
