---
# The container side of a host (docs/reference/compute-drivers.md#the-container-side): its bridge, ACL, project, profile, stock image
# and input rules on a pool that exists already. A task container host runs it after its VM side, which made the shared ZFS pool; an
# Instance container host runs it on the Node's own pool (tasks/instance-host.yml). `container_host` names the resources, the error
# code, the comment prefix of the input rules and whether the pool must prove that a copy is a clone. Read incompatible resources
# before any change.
- name: Read the container resources
  ansible.builtin.command:
    argv: [incus, query, "--", "/1.0/{{ item }}?project=default&recursion=1"]
  loop: [projects, networks, network-acls]
  register: container_read
  changed_when: false

- name: Select the container resources
  ansible.builtin.set_fact:
    container_project: "{{ (container_read.results[0].stdout | from_json | selectattr('name', 'equalto', container_host.project) | first) | default({}) }}"
    container_network: "{{ (container_read.results[1].stdout | from_json | selectattr('name', 'equalto', container_host.network) | first) | default({}) }}"
    container_acl: "{{ (container_read.results[2].stdout | from_json | selectattr('name', 'equalto', container_acl_name) | first) | default({}) }}"

- name: Refuse incompatible container resources
  ansible.builtin.assert:
    that:
      - container_project == {} or container_project.config.get('features.networks', 'true') == 'false'
      - container_project == {} or container_project.config.get('features.profiles', 'true') == 'true'
      - container_project == {} or container_project.config.get('features.images', 'true') == 'true'
      - >-
        container_network == {} or (container_network.type == 'bridge' and container_network.managed
        and container_network.config['ipv4.address'] == container_host.address)
    fail_msg: "{{ container_host.fail }}"

- name: Create the container project
  when: container_project == {}
  ansible.builtin.command:
    argv: [incus, project, create, "{{ container_host.project }}", -c, features.images=true, -c, features.profiles=true, -c, features.networks=false]
  changed_when: true

- name: Create the container egress ACL
  when: container_acl == {}
  ansible.builtin.command:
    argv: [incus, network, acl, create, "{{ container_acl_name }}", --project, default]
  changed_when: true

- name: Converge the container egress ACL
  when: >-
    (not (container_acl_preserve | default(false) | bool) or container_acl == {})
    and (container_acl.get('egress', []) != container_acl_rules.egress or container_acl.get('ingress', []) != container_acl_rules.ingress)
  ansible.builtin.command:
    argv: [incus, network, acl, edit, "{{ container_acl_name }}", --project, default]
    stdin: "{{ container_acl_rules | to_json }}"
  changed_when: true

- name: Create the container bridge with its ACL attached
  when: container_network == {}
  ansible.builtin.command:
    argv: "{{ ['incus', 'network', 'create', container_host.network, '--project', 'default', '--type=bridge', 'ipv4.address=' ~ container_host.address]
              + container_network_args }}"
  changed_when: true

- name: Converge the existing container bridge
  when: container_network != {} and container_network.config.get(item.key) != item.value
  ansible.builtin.command:
    argv: [incus, network, set, "{{ container_host.network }}", --project, default, "{{ item.key }}={{ item.value }}"]
  loop: "{{ container_network_config | dict2items }}"
  changed_when: true

- name: Read the container profile
  ansible.builtin.command:
    argv: [incus, query, "--", "/1.0/profiles/default?project={{ container_host.project }}"]
  register: container_profile
  changed_when: false

- name: Refuse incompatible container profile devices
  ansible.builtin.assert:
    that:
      - "(container_profile.stdout | from_json).devices.get('root', {}).get('type', 'disk') == 'disk'"
      - "(container_profile.stdout | from_json).devices.get('eth0', {}).get('type', 'nic') == 'nic'"
    fail_msg: "{{ container_host.fail }}"

# `container_profile_config` adds or changes profile keys, such as the environment of every process in a container; it never
# removes one. A task host sets none.
- name: Converge the container profile
  vars:
    container_profile_now: "{{ container_profile.stdout | from_json }}"
    container_profile_want: >-
      {{ container_profile_now | combine({'devices': container_profile_now.devices | combine(container_devices, recursive=true),
                                          'config': container_profile_now.config | combine(container_profile_config | default({}))}) }}
  when: container_profile_now != container_profile_want
  ansible.builtin.command:
    argv: [incus, profile, edit, default, --project, "{{ container_host.project }}"]
    stdin: "{{ container_profile_want | to_json }}"
  changed_when: true

- name: Read the container project restrictions
  ansible.builtin.command:
    argv: [incus, query, "--", "/1.0/projects/{{ container_host.project }}"]
  register: container_project_after
  changed_when: false

# One call: Incus checks every profile against all restrictions at each change, with defaults for the keys not set yet, so an
# Instance host's folder disks would fail a change that sets `restricted` before `restricted.devices.disk`.
- name: Converge the container project restrictions
  when: container_restrictions_changed | length > 0
  ansible.builtin.command:
    argv: "{{ ['incus', 'project', 'set', container_host.project] + container_restrictions_changed }}"
  vars:
    container_restrictions_changed: >-
      {%- set out = [] -%}
      {%- for key, value in container_restrictions.items() -%}
        {%- if (container_project_after.stdout | from_json).config.get(key) != value -%}{%- set _ = out.append(key ~ '=' ~ value) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  changed_when: true

# `container_restrictions_unset` names keys that must stay unset, because a value would break the profile.
- name: Unset the container project restrictions that must stay unset
  when: container_restrictions_set | length > 0
  ansible.builtin.command:
    argv: "{{ ['incus', 'project', 'unset', container_host.project] + container_restrictions_set }}"
  vars:
    container_restrictions_set: >-
      {{ container_restrictions_unset | default([]) | select('in', (container_project_after.stdout | from_json).config) | list }}
  changed_when: true

# The container bridge has its own catalog names: the withdrawal of a bridge's rules deletes them by comment.
- name: Allow container DHCP requests to the host
  community.general.ufw:
    rule: allow
    interface_in: "{{ container_host.network }}"
    proto: udp
    from_port: '68'
    to_port: '67'
    comment: "orbit:{{ container_host.kind }}-dhcp"

- name: Allow container DNS to the bridge address
  when: container_dns | default(true)
  community.general.ufw:
    rule: allow
    interface_in: "{{ container_host.network }}"
    proto: "{{ item }}"
    to_ip: "{{ container_host.address.split('/')[0] }}"
    to_port: '53'
    comment: "orbit:{{ container_host.kind }}-dns-{{ item }}"
  loop: [udp, tcp]

# An Instance host sets `container_dns` to false: its containers get no DNS, and the egress proxy resolves every name.
- name: Remove container DNS to the bridge address
  when: not (container_dns | default(true))
  community.general.ufw:
    rule: allow
    interface_in: "{{ container_host.network }}"
    proto: "{{ item }}"
    to_ip: "{{ container_host.address.split('/')[0] }}"
    to_port: '53'
    comment: "orbit:{{ container_host.kind }}-dns-{{ item }}"
    delete: true
  loop: [udp, tcp]

- name: Read the image daemon identity
  ansible.builtin.command:
    argv: [incus, query, /1.0]
  environment:
    INCUS_REMOTE: local
  register: container_image_daemon
  changed_when: false

- name: Require the image daemon PID
  ansible.builtin.assert:
    that: (container_image_daemon.stdout | from_json).environment.server_pid | int > 0
    fail_msg: "{{ container_host.fail }}: cannot identify the image daemon"

- name: Read the image daemon environment
  ansible.builtin.slurp:
    src: "/proc/{{ (container_image_daemon.stdout | from_json).environment.server_pid }}/environ"
  register: container_image_environment
  no_log: true

- name: Select the image daemon directory and socket
  ansible.builtin.set_fact:
    container_image_directory: "{{ daemon_directory }}"
    container_image_socket: >-
      {{ (daemon_environment | regex_findall('(?:^|\x00)INCUS_SOCKET=([^\x00]*)') | first) | default(daemon_directory ~ '/unix.socket', true) }}
  vars:
    daemon_environment: "{{ container_image_environment.content | b64decode }}"
    daemon_directory: >-
      {{ (daemon_environment | regex_findall('(?:^|\x00)INCUS_DIR=([^\x00]*)') | first) | default('/var/lib/incus', true) }}
  no_log: true

- name: Require absolute image daemon paths
  ansible.builtin.assert:
    that:
      - container_image_directory is match('^/')
      - container_image_socket is match('^/')
    fail_msg: "{{ container_host.fail }}: cannot locate the image daemon"

- name: Read the image daemon through its local socket
  ansible.builtin.uri:
    url: http://localhost/1.0
    unix_socket: "{{ container_image_socket }}"
    return_content: true
    timeout: 10
  register: container_image_local_daemon

- name: Require the same image daemon
  ansible.builtin.assert:
    that: >-
      container_image_local_daemon.json.metadata.environment.server_pid | int ==
      (container_image_daemon.stdout | from_json).environment.server_pid | int
    fail_msg: "{{ container_host.fail }}: image daemon directory mismatch"

- name: Reconcile the independent stock container image
  orbit_incus_images:
    project: "{{ container_host.project }}"
    alias: "{{ container_host.alias }}"
    archive_directory: "{{ container_image_directory }}/images"
    socket: "{{ container_image_socket }}"
    failure_code: "{{ container_host.fail }}"

# On a ZFS pool, a copy must be a clone that Incus never shifts: without idmapped mounts it would rewrite every file of a copy at its
# first start, with its own isolated ID range. Incus 7 reports empty `kernel_features`, so the phase measures it: a copy of a small
# isolated container, started once, must have written under 8 MiB. The probe leaves nothing behind, so it reports no change.
- name: Prove that a copy is a clone
  when: container_host.probe
  environment:
    INCUS_REMOTE: local
    INCUS_SOCKET: "{{ container_image_socket }}"
  vars:
    probe: [incus, --project, "{{ container_host.project }}"]
    probe_names: [orbit-clone-probe, orbit-clone-probe-copy]
  block:
    - name: Read existing clone probes
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances?project={{ container_host.project }}&recursion=1"] }
      register: container_probe_existing
      changed_when: false
    - name: Refuse a prior clone probe
      ansible.builtin.assert:
        that: item not in (container_probe_existing.stdout | from_json | map(attribute='name') | list)
        fail_msg: >-
          {{ container_host.fail }}: instance {{ container_host.project }}/{{ item }} requires an operator;
          see /solutions/incus-shared-image-refresh#operator-cleanup
      loop: "{{ probe_names }}"
    - name: Make the clone probe and its copy
      ansible.builtin.command: { argv: "{{ probe + item }}" }
      register: container_probe_created
      loop:
        - [init, "{{ container_host.alias }}", orbit-clone-probe, --config, security.idmap.isolated=true]
        - [copy, orbit-clone-probe, orbit-clone-probe-copy]
      changed_when: false
    - name: Guard the Instance clone probe before starting it
      when: container_host.kind == 'instances'
      block:
        - name: Read the clone probe's effective devices
          ansible.builtin.command:
            argv: [incus, query, --, "/1.0/instances/orbit-clone-probe-copy?project={{ container_host.project }}"]
          register: probe_nic_read
          changed_when: false
        - name: Check every effective Instance clone probe NIC
          ansible.builtin.include_tasks: instance-network-nic-check.yml
          vars:
            network_container: "{{ probe_nic_read.stdout | from_json }}"
            network_name: "{{ container_host.network }}"
            network_failure: instance.container_network_unsafe
            expected_network_device: eth0
            network_allowed_devices: "{{ container_probe_devices | default({}) }}"
            # The probe's init writes only this key.
            network_allowed_config: {security.idmap.isolated: 'true'}
    - name: Start and stop the clone probe copy once
      ansible.builtin.command: { argv: "{{ probe + item }}" }
      loop:
        - [start, orbit-clone-probe-copy]
        - [stop, --force, orbit-clone-probe-copy]
      changed_when: false
    - name: Read the dataset root of the pool
      ansible.builtin.command: { argv: [incus, storage, get, "{{ container_host.pool }}", zfs.pool_name] }
      register: container_probe_root
      changed_when: false
    - name: Read what the copy wrote
      ansible.builtin.command:
        argv: [zfs, get, -Hp, -o, value, written, "{{ container_probe_root.stdout | trim }}/containers/{{ container_host.project }}_orbit-clone-probe-copy"]
      register: container_probe_written
      changed_when: false
    - name: Require that the copy is a clone
      ansible.builtin.assert:
        that: container_probe_written.stdout | trim | int < 8388608
        fail_msg: "{{ container_host.fail }}"
  always:
    - name: Remove the clone probe
      ansible.builtin.command: { argv: "{{ probe + ['delete', '--force', '--', item] }}" }
      loop: >-
        {{ (container_probe_created.results | default([])) | selectattr('rc', 'defined') |
           selectattr('rc', 'equalto', 0) | map(attribute='item.2') | reverse | list }}
      register: container_probe_removed
      changed_when: false
      failed_when: container_probe_removed.rc != 0 and 'not found' not in container_probe_removed.stderr

- name: Check the container bridge and project
  ansible.builtin.command:
    argv: [incus, query, "--", "/1.0/{{ item }}"]
  loop: ["networks/{{ container_host.network }}?project=default", "projects/{{ container_host.project }}"]
  register: container_check
  changed_when: false

- name: Confirm the container side
  ansible.builtin.assert:
    that:
      - (container_check.results[0].stdout | from_json).config['ipv4.address'] == container_host.address
      - (container_check.results[0].stdout | from_json).config['security.acls'] == container_acl_name
      - (container_check.results[0].stdout | from_json).config['ipv6.address'] == 'none'
      - >-
        (container_check.results[1].stdout | from_json).config | dict2items | selectattr('key', 'in', container_restrictions) | items2dict
        == container_restrictions
      - container_restrictions_unset | default([]) | select('in', (container_check.results[1].stdout | from_json).config) | list == []
    fail_msg: "{{ container_host.fail }}"
