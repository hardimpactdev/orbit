---
# The start of a stopped nested-fleet clone (instance.start, which alone sets `fleet_proxy_restart_t3`): the copy's proxy bypass for
# units and login shells, then one restart of T3 when it changed (docs/reference/development-containers.md#a-stopped-nested-fleet-clone-starts).
# The value is the intent's own `environment.NO_PROXY` (InstanceNodeServiceTargets::proxyEnvironment, the one builder).
# instance_node_services.py `proxy` is the one writer of the drop-ins and of systemd's manager environment. T3 booted before this run,
# so a copy whose drop-ins lacked the value gets T3 restarted once; nobody works in a stopped copy. Every other fleet start skips this
# file.
# Follow-up: when the start phase writes the composed proxy environment itself (the realtime change's step "Write the composed proxy
# environment"), this write becomes redundant and only the T3 restart, keyed on that step's result, stays.
- name: Write the drop-ins and the manager environment
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_outer + ['python3', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_node_services.py'), 'proxy'] }}"
    stdin: >-
      {{ {'proxy_environment': {'NO_PROXY': intent.container.config['environment.NO_PROXY'],
                                'no_proxy': intent.container.config['environment.no_proxy']}} | to_json }}
  register: fleet_proxy_write
  changed_when: (fleet_proxy_write.stdout | from_json).changed

- name: Restart T3 so that it reads the new value
  when: fleet_proxy_write is changed
  ansible.builtin.command: { argv: "{{ ['timeout', '60'] + fleet_outer + ['systemctl', 'try-restart', '--', intent.container.clone.t3.unit] }}" }
  changed_when: true
