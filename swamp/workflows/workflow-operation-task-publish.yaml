id: dd1ccba6-5339-44da-8040-616a905706a4
name: operation-task-publish
autoContinue: false
description: Publish the admitted checked commit exported from the group's task copy; worker work is inline git and gh api.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.publish]}
    # The root run of the Operation, which the Gateway checks when it mints. A parent run passes its own; a run started by the Gateway is the root.
    run_id: {type: string, pattern: '^[a-f0-9-]{36}$'}
    intent:
      type: object
      properties:
        group_id:
          type: integer
          minimum: 1
        instance_id:
          type: integer
          minimum: 1
        node_id:
          type: integer
          minimum: 1
        check:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        checkout_path:
          type: string
          minLength: 1
        base:
          type: string
          minLength: 1
        remote:
          type: string
          minLength: 1
        refspec:
          type: string
          minLength: 1
        pull_head:
          type: string
          minLength: 1
        commit:
          type: string
          pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
        tree:
          type: string
          pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        branch:
          type: string
          pattern: ^task-[1-9][0-9]*$
        object_format:
          type: string
          enum:
          - sha1
          - sha256
        # A task copy: its recorded container, its start commit and the path of the .env Orbit wrote (docs/reference/tasks.md#task-copy).
        workspace:
          type: object
          properties:
            runtime:
              type: object
              properties:
                project: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'}
                name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'}
              required: [project, name]
              additionalProperties: false
            branch: {type: string, minLength: 1}
            snapshot_id: {type: string, format: uuid}
            start: {type: string, pattern: '^(?:[a-f0-9]{40}|[a-f0-9]{64})$'}
            environment_path: {type: string, minLength: 1, pattern: '^[^/]'}
            # A nested-fleet copy holds the Club key; its run names it in execution_secrets.club_key.
            club_key: {type: boolean}
          required: [runtime, branch, snapshot_id, start, environment_path]
          additionalProperties: false
        pull_request:
          default: null
          anyOf:
          - type: 'null'
          - type: object
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 256
              body:
                type: string
                maxLength: 65536
              draft:
                type: boolean
            required:
            - title
            - body
            additionalProperties: false
        ssh_execution:
          type: object
          properties:
            target:
              type: object
              properties:
                node_id:
                  type: integer
                  minimum: 1
                host:
                  type: string
                  minLength: 1
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                user:
                  type: string
                  minLength: 1
                host_keys:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                name:
                  type: string
                  enum:
                  - target
              required:
              - host
              - port
              - user
              - host_keys
              - name
              additionalProperties: false
            control_node_id:
              type: integer
              enum:
              - 209
            public_key:
              type: string
              minLength: 1
          required:
          - identity_file
          - target
          - control_node_id
          - public_key
          additionalProperties: true
      required:
      - group_id
      - instance_id
      - node_id
      - check
      - checkout_path
      - base
      - remote
      - refspec
      - pull_head
      - commit
      - tree
      - repository
      - branch
      - object_format
      - pull_request
      - ssh_execution
      - workspace
      additionalProperties: false
    # Vault references only. A task copy's run also names the .env Orbit renders for the Instance (docs/reference/tasks.md#task-copy).
    execution_secrets:
      type: object
      propertyNames: {enum: [github_token, git_authorization, environment, club_key]}
      maxProperties: 4
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(?:task-publish-(?:token-[a-f0-9-]{36}|environment-[1-9][0-9]*)|nested-fleet-club-api-key)$'}
        required: [vault, key]
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: Create publication scratch
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-scratch-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 5 mktemp -d /tmp/orbit-task-publish-XXXXXXXX
    writes: true
  - name: Preflight the copy
    # The checkout is read as agent through its Node, and the bundle comes to this worker.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        group_id: ${{ inputs.intent.group_id }}
        phase: preflight
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution} }}'
    dependsOn:
    - step: Create publication scratch
      condition:
        type: succeeded
  - name: Export the copy
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        group_id: ${{ inputs.intent.group_id }}
        phase: export
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution, "checkout_fingerprint": steps["Preflight the copy"].outputs.evidence.evidence.checkout_fingerprint, "candidate": {"head": inputs.intent.commit, "tree": inputs.intent.tree}, "worker_bundle": steps["Create publication scratch"].outputs.stdout.trim() + "/candidate.bundle", "environment_path": inputs.intent.workspace.environment_path, "worker_environment": steps["Create publication scratch"].outputs.stdout.trim() + "/environment", "proposed_body_path": ".git/orbit/proposed-pr-bodies/" + inputs.intent.branch + ".md", "worker_proposed_body": steps["Create publication scratch"].outputs.stdout.trim() + "/proposed-body"} }}'
    dependsOn:
    - step: Preflight the copy
      condition:
        type: succeeded
  - name: Check the copy
    # The copy check (docs/reference/tasks.md#the-copy-check), IN the copy where the values are: root reads the copy's secrets, Git runs
    # as agent, and the evidence names paths, lines and secret names, never a value. Workflow changes are judged by "Read the base",
    # against the real default head. The export ended first, so the check reads the branch the bundle holds.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        group_id: ${{ inputs.intent.group_id }}
        phase: scan
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution, "start": inputs.intent.workspace.start, "nested": has(inputs.intent.workspace.club_key) && inputs.intent.workspace.club_key, "proposed_body_path": ".git/orbit/proposed-pr-bodies/" + inputs.intent.branch + ".md"} }}'
    dependsOn:
    - step: Export the copy
      condition:
        type: succeeded
  - name: Read the copy check
    # A secret value refuses with tasks.publish_secret_value, an error of the check with tasks.publish_secret_unchecked; each before any
    # token exists.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-copy-check-" + string(inputs.intent.node_id) }}
      methodName: scan
      inputs:
        evidence: '${{ "Check the copy" in steps && steps["Check the copy"].status == "succeeded" ? steps["Check the copy"].outputs.evidence : {} }}'
    dependsOn:
    - step: Check the copy
      condition:
        type: succeeded
  - name: Init the bare repo
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-init-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 git init --quiet --bare --template= --object-format="$ORBIT_OBJECT_FORMAT" "$ORBIT_REPOSITORY"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_OBJECT_FORMAT: ${{ inputs.intent.object_format }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
    dependsOn:
    - step: Export the copy
      condition: {type: succeeded}
    writes: true
  - name: Import the bundle
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-publish-import-" + string(inputs.intent.node_id) + "-" + string(inputs.intent.group_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: timeout 60 git -C "$ORBIT_REPOSITORY" fetch --quiet --no-tags "$ORBIT_BUNDLE" "$ORBIT_REF:refs/heads/candidate"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REF: '${{ "refs/heads/" + inputs.intent.workspace.branch }}'
          ORBIT_BUNDLE: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/candidate.bundle" }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
    dependsOn:
    - step: Init the bare repo
      condition:
        type: succeeded
    writes: true
  - name: Read bundle contents
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-bundle-read-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 git -C "$ORBIT_REPOSITORY" rev-parse refs/heads/candidate 'refs/heads/candidate^{tree}'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
    dependsOn:
    - step: Import the bundle
      condition:
        type: succeeded
  - name: Check imported commit
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-imported-" + string(inputs.intent.node_id) }}
      methodName: imported
      inputs:
        input: ${{ inputs.intent }}
        "steps":
          import: ${{ steps["Read bundle contents"] }}
    dependsOn:
    - step: Read bundle contents
      condition:
        type: succeeded
  - name: Check the environment file
    # The .env Orbit wrote never leaves a copy: every commit from the copy's start to the candidate holds that path as the start does.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-environment-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: >-
          set -eu;
          base=$(git -C "$ORBIT_REPOSITORY" rev-parse -q --verify "$ORBIT_START:$ORBIT_PATH" || true);
          commits=$(timeout 30 git -C "$ORBIT_REPOSITORY" rev-list "$ORBIT_START..refs/heads/candidate" --);
          for commit in $commits; do
          held=$(git -C "$ORBIT_REPOSITORY" rev-parse -q --verify "$commit:$ORBIT_PATH" || true);
          if [ "$held" != "$base" ]; then echo tasks.publish_secret_path; exit 3; fi;
          done
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_START: '${{ inputs.intent.workspace.start }}'
          ORBIT_PATH: '${{ inputs.intent.workspace.environment_path }}'
    dependsOn:
    - step: Check imported commit
      condition:
        type: succeeded
  - name: Add the waiver lines
    # A copy's publish carries its proposed body's waiver lines (docs/reference/tasks.md#docs-impact-waivers-in-a-copy): the export
    # fetched that file beside the bundle, as data. Typed data writes the title and body the PR gets, which the .env content check
    # reads next, before any token exists. A copy without the file publishes the caller's text.
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ inputs.intent.pull_request == null }}'
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-waivers-" + string(inputs.intent.node_id) }}
      methodName: waivers
      inputs:
        input: ${{ inputs.intent }}
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
    dependsOn:
    - step: Check imported commit
      condition:
        type: succeeded
    writes: true
  - name: Check the .env content
    # The .env content leaves a copy under no name: neither the whole file nor one of its values of 8 bytes or more that the start
    # tree does not already hold, in any object new in the range or in the pull request text. Both references count: the copy's file,
    # which the agent can change, and the render of the Instance's stored values (docs/reference/tasks.md#task-copy). An error refuses
    # too. A refusal names a path only when the path holds no value. A nested-fleet copy's Club key is one more value. The cleanup
    # job's "Remove local scratch" removes these files after a failure too.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-publish-content-" + string(inputs.intent.node_id) + "-" + string(inputs.intent.group_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: |
          set -eu
          umask 077
          export LC_ALL=C
          work=$ORBIT_DIRECTORY/content
          mkdir "$work"
          range="$ORBIT_START..refs/heads/candidate"
          repo() { git -C "$ORBIT_REPOSITORY" "$@"; }
          # The refusal line goes to a file of the scratch: Swamp keeps no stderr of a command step, "Read the .env check" reads it.
          refuse() { printf 'tasks.publish_secret_content: %s\n' "$1" | tee "$ORBIT_DIRECTORY/content.result" >&2; exit 3; }
          # A path or folder is named only when it holds no checked value, also with its slashes removed.
          named() {
            if [ -s "$work/checked" ] && { printf '%s\n' "$1" | grep -q -F -f "$work/checked" || printf '%s\n' "$1" | tr -d / | grep -q -F -f "$work/checked"; }; then
              echo "a path that holds a value"
            else
              echo "'${1:-.}'"
            fi
          }
          first() {
            repo log -m -t --reverse --format=%H --find-object="$1" "$range" -- >"$work/first"
            repo log --reverse --format='%H %T' "$range" -- >>"$work/first"
            awk -v id="$1" 'NF == 1 { print; exit } $2 == id { print $1; exit }' "$work/first"
          }
          if [ ! -f "$ORBIT_FILE" ] || [ -L "$ORBIT_FILE" ]; then echo 'tasks.publish_secret_unchecked: the copy has no .env file' >&2; exit 1; fi
          printf '%s' "$ORBIT_ENVIRONMENT" >"$work/rendered"
          printf '%s\n' "$ORBIT_CLUB" >"$work/club"
          # The pull request text is the one the PR gets: "Add the waiver lines" wrote it, with the proposed body's waiver lines.
          : >"$work/pull"
          if [ -n "$ORBIT_PULL" ]; then
            if [ ! -f "$ORBIT_DIRECTORY/pull-title" ] || [ ! -f "$ORBIT_DIRECTORY/pull-body" ]; then echo 'tasks.publish_secret_unchecked: no pull request text' >&2; exit 1; fi
            { cat "$ORBIT_DIRECTORY/pull-title"; printf '\n'; cat "$ORBIT_DIRECTORY/pull-body"; printf '\n'; } >"$work/pull"
          fi
          # Each value as written and unescaped: KEY=VALUE also in a comment line, quotes and inline comments removed; other lines whole.
          awk -v quote="'" '
            function out(text, parts, count, i) { count = split(text, parts, /\\n/); for (i = 1; i <= count; i++) if (length(parts[i]) >= 8) print parts[i] }
            function value(text, opening, i, c, raw, plain) {
              opening = substr(text, 1, 1)
              if (opening == "\"") {
                raw = ""; plain = ""
                for (i = 2; i <= length(text); i++) {
                  c = substr(text, i, 1)
                  if (c == "\\" && i < length(text)) {
                    raw = raw c substr(text, i + 1, 1)
                    plain = plain (substr(text, i + 1, 1) == "n" ? "\\n" : substr(text, i + 1, 1)); i++; continue
                  }
                  if (c == "\"") break
                  raw = raw c; plain = plain c
                }
                out(raw); out(plain); return
              }
              if (opening == quote) { i = index(substr(text, 2), quote); out(i ? substr(text, 2, i - 1) : substr(text, 2)); return }
              sub(/[ \t]+#.*$/, "", text); out(text)
            }
            { sub(/\r$/, ""); line = $0; sub(/^[ \t]+/, "", line); sub(/[ \t]+$/, "", line) }
            line == "" { next }
            substr(line, 1, 1) == "#" { line = substr(line, 2); sub(/^[ \t]+/, "", line) }
            match(line, /^(export[ \t]+)?[A-Za-z_][A-Za-z0-9_.-]*[ \t]*=[ \t]*/) { value(substr(line, RLENGTH + 1)); next }
            { out(line); last = substr(line, length(line), 1); if (last == "\"" || last == quote) out(substr(line, 1, length(line) - 1)) }
          ' "$ORBIT_FILE" "$work/rendered" >"$work/all"
          sort -u "$work/all" >"$work/values"
          : >"$work/checked"
          if [ -s "$work/values" ]; then
            timeout 60 git -C "$ORBIT_REPOSITORY" grep -a -h -o -F -f "$work/values" "$ORBIT_START" -- >"$work/public" || [ $? -eq 1 ]
            grep -v -x -F -f "$work/public" "$work/values" >"$work/checked" || [ $? -eq 1 ]
          fi
          # The Club key of a nested-fleet copy counts as a value, also if the start tree holds it; a hit reads like any other.
          if [ -n "$ORBIT_NESTED" ]; then awk '{ sub(/\r$/, ""); gsub(/^[ \t]+|[ \t]+$/, "") } length($0) >= 8' "$work/club" >>"$work/checked"; fi
          timeout 60 git -C "$ORBIT_REPOSITORY" rev-list --objects "$range" -- >"$work/objects"
          # The copy check read the copy's own repository: its object set must be the one this bundle pushes.
          scanned=$(cut -d ' ' -f 1 "$work/objects" | sort -u | sha256sum | cut -d ' ' -f 1)
          if [ "$scanned" != "$ORBIT_SCANNED" ]; then echo 'tasks.publish_secret_unchecked: the copy check read another range' >&2; exit 1; fi
          for file in "$ORBIT_FILE" "$work/rendered"; do
            if [ -s "$file" ]; then
              id=$(repo hash-object --no-filters --stdin <"$file")
              match=$(awk -v id="$id" '$1 == id { print; exit }' "$work/objects")
              if [ -n "$match" ]; then refuse "the whole .env is the file $(named "${match#* }") ($id) in commit $(first "$id")"; fi
            fi
          done
          if [ ! -s "$work/checked" ]; then exit 0; fi
          if grep -q -a -F -f "$work/checked" "$work/pull"; then refuse "a value of the .env is in the pull request title or body"; fi
          cut -d ' ' -f 1 "$work/objects" >"$work/ids"
          { timeout 120 git -C "$ORBIT_REPOSITORY" cat-file --batch <"$work/ids"; echo $? >"$work/batch"; } | grep -c -a -F -f "$work/checked" >"$work/hits" || [ $? -eq 1 ]
          [ "$(cat "$work/batch")" = 0 ]
          if [ "$(cat "$work/hits")" = 0 ]; then exit 0; fi
          while read -r id path; do
            kind=$(repo cat-file -t "$id")
            if repo cat-file "$kind" "$id" | grep -q -a -F -f "$work/checked"; then
              case $kind in
                commit) refuse "a value of the .env is in the message or author of commit $id" ;;
                tree) refuse "a value of the .env is in a file name in folder $(named "$path") ($id) in commit $(first "$id")" ;;
                *) refuse "a value of the .env is in the file $(named "$path") ($id) in commit $(first "$id")" ;;
              esac
            fi
          done <"$work/objects"
          refuse "a value of the .env is in an object of the range"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_FILE: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/environment" }}
          ORBIT_START: '${{ inputs.intent.workspace.start }}'
          ORBIT_ENVIRONMENT: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'
          # Without a Club key the step reads the render again and ORBIT_NESTED is empty, so it adds nothing.
          ORBIT_NESTED: '${{ has(inputs.intent.workspace.club_key) && inputs.intent.workspace.club_key ? "1" : "" }}'
          ORBIT_CLUB: '${{ vault.get(inputs.execution_secrets.environment.vault, has(inputs.intent.workspace.club_key) && inputs.intent.workspace.club_key ? inputs.execution_secrets.club_key.key : inputs.execution_secrets.environment.key) }}'
          ORBIT_PULL: '${{ inputs.intent.pull_request == null ? "" : "1" }}'
          ORBIT_SCANNED: '${{ "Read the copy check" in steps && steps["Read the copy check"].status == "succeeded" ? steps["Check the copy"].outputs.evidence.evidence.scan.objects_sha256 : "" }}'
        ignoreExitCode: true
    dependsOn:
    - step: Check the environment file
      condition:
        type: succeeded
    - step: Read the copy check
      condition:
        type: succeeded
    - step: Add the waiver lines
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    writes: true
  - name: Read the .env check
    # Exit 0 passes; exit 3 fails with the refusal line, which names a file and a commit only when they hold no value; any other
    # exit fails with tasks.publish_secret_unchecked.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-content-read-" + string(inputs.intent.node_id) }}
      methodName: content
      inputs:
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Check the .env content"].outputs.exitCode }}
    dependsOn:
    - step: Check the .env content
      condition:
        type: succeeded
  - name: Mint the push token
    labels:
      role: swamp
    queueTimeout: 30
    # A copy mints only after its content check and its copy check passed; a skip of either is never a pass.
    guard: '${{ !("Read the .env check" in steps && steps["Read the .env check"].status == "succeeded" && "Read the copy check" in steps && steps["Read the copy check"].status == "succeeded") }}'
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: '${{ has(inputs.run_id) ? inputs.run_id : run.id }}'
        purpose: publish
    dependsOn:
    - step: Check imported commit
      condition:
        type: succeeded
    - step: Check the environment file
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Check the .env content
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Read the .env check
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Read the copy check
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
  - name: Read the base
    # A task copy states the base it publishes against: the default branch head at publish time, fetched into this run's scratch
    # repository with the push's own authorization, the merge base with the candidate, how far behind, the paths both sides changed
    # and a merge in the repository alone. Nothing reaches the copy. Exit 0: a clean merge; 3: a conflict; any other: an error.
    # It also lists the copy's own .github/workflows/ paths, changed since the merge base (git diff head...candidate): a commit the
    # head holds, synced or carried in by hand, is never a change of the copy. GitHub judges the pushed tree against the default
    # branch, so a copy only behind a workflow change gets a merge of the head at publish, which the push sends; a republish over an
    # earlier publish merge always gets one, with that merge as third parent (docs/reference/tasks.md#merge-main-at-publish).
    # The facts go to the private scratch, which "Remove local scratch" removes; Swamp keeps no stderr of a failed step.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-base-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          umask 077
          export LC_ALL=C
          work="$ORBIT_DIRECTORY/base"
          rm -rf -- "$work"
          mkdir -- "$work"
          repo() { timeout 60 git -C "$ORBIT_REPOSITORY" -c core.hooksPath=/dev/null "$@"; }
          # Exit 1 of a Git test is its answer "no"; anything above it is an error of the read.
          asks() { answer=0; repo "$@" || answer=$?; [ "$answer" -le 1 ] || exit 2; return "$answer"; }
          repo fetch --quiet --no-tags --no-write-fetch-head -- "$ORBIT_REMOTE" "+refs/heads/$ORBIT_BASE:refs/orbit/base" 2>/dev/null
          head=$(repo rev-parse --verify 'refs/orbit/base^{commit}')
          # The task branch's tip on origin, when it exists: exit 2 of ls-remote is no such branch. A tip of an earlier read goes first.
          repo update-ref -d refs/orbit/published
          found=0
          repo ls-remote --exit-code --heads -- "$ORBIT_REMOTE" "refs/heads/$ORBIT_BRANCH" >/dev/null 2>&1 || found=$?
          case $found in
            0) repo fetch --quiet --no-tags --no-write-fetch-head -- "$ORBIT_REMOTE" "+refs/heads/$ORBIT_BRANCH:refs/orbit/published" 2>/dev/null ;;
            2) ;;
            *) exit 2 ;;
          esac
          base=$(repo merge-base refs/heads/candidate "$head")
          candidate=$(repo rev-parse --verify 'refs/heads/candidate^{commit}')
          printf '%s\n' "$head" >"$work/head"
          printf '%s\n' "$base" >"$work/base"
          repo rev-list --count "$base..$head" >"$work/behind"
          repo diff --name-only --no-renames -z "$base" refs/heads/candidate | sort -z >"$work/ours"
          repo diff --name-only --no-renames -z "$base" "$head" | sort -z >"$work/theirs"
          comm -12 -z "$work/ours" "$work/theirs" >"$work/overlap"
          repo diff --name-only --no-renames -z "$base" refs/heads/candidate -- .github/workflows/ >"$work/workflows"
          sort -zu -o "$work/workflows" "$work/workflows"
          : >"$work/merged"
          code=0
          repo merge-tree --write-tree --name-only --no-messages -z refs/heads/candidate "$head" >"$work/merge" || code=$?
          case $code in
            0) ;;
            1) exit 3 ;;
            *) exit 2 ;;
          esac
          # An own workflow change refuses; no merge is made for it.
          if [ -s "$work/workflows" ]; then exit 0; fi
          tree=$(tr '\0' '\n' <"$work/merge" | sed -n 1p)
          message="Merge $ORBIT_BASE $head at publish"
          set -- -p "$candidate" -p "$head"
          if repo rev-parse -q --verify 'refs/orbit/published^{commit}' >/dev/null; then
            tip=$(repo rev-parse --verify 'refs/orbit/published^{commit}')
            if ! asks merge-base --is-ancestor "$tip" "$candidate"; then
              first=$(repo rev-parse -q --verify "$tip^1^{commit}" || true)
              second=$(repo rev-parse -q --verify "$tip^2^{commit}" || true)
              # An earlier publish merge of this branch; any other tip leaves the push to refuse it as not a fast-forward.
              if [ -n "$second" ] && [ "$(repo log -1 --format=%B "$tip")" = "Merge $ORBIT_BASE $second at publish" ] &&
                asks merge-base --is-ancestor "$first" "$candidate" && asks merge-base --is-ancestor "$second" "$head"; then
                if [ "$first" = "$candidate" ] && [ "$second" = "$head" ]; then
                  # This publish's own merge, pushed already: the push sends it again and pushes nothing.
                  printf '%s\n' "$tip" >"$work/merged"
                  exit 0
                fi
                repo commit-tree "$tree" "$@" -p "$tip" -m "$message" >"$work/merged"
                exit 0
              fi
            fi
          fi
          # Only behind a workflow change of the head: GitHub would refuse the candidate's tree, so the push sends a merge.
          if ! asks diff --quiet "$head" "$candidate" -- .github/workflows/; then
            repo commit-tree "$tree" "$@" -m "$message" >"$work/merged"
          fi
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ALLOW_PROTOCOL: https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: core.hooksPath
          GIT_CONFIG_VALUE_1: /dev/null
          GIT_CONFIG_KEY_2: http.followRedirects
          GIT_CONFIG_VALUE_2: 'false'
          GIT_CONFIG_KEY_3: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_3: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key) }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_REMOTE: ${{ inputs.intent.remote }}
          ORBIT_BASE: ${{ inputs.intent.base }}
          ORBIT_BRANCH: ${{ inputs.intent.branch }}
          # The fixed identity of a merge at publish.
          GIT_AUTHOR_NAME: Orbit
          GIT_AUTHOR_EMAIL: orbit@users.noreply.github.com
          GIT_COMMITTER_NAME: Orbit
          GIT_COMMITTER_EMAIL: orbit@users.noreply.github.com
        ignoreExitCode: true
    dependsOn:
    - step: Mint the push token
      condition:
        type: succeeded
    writes: true
  - name: Check the base
    # An own workflow path fails with tasks.publish_workflow_change and its paths, before the conflict: the token has no workflows
    # permission. Exit 0 passes the facts, each path list bounded, and the merge at publish or ""; exit 3 fails with
    # tasks.publish_conflict and the conflicting paths; any other exit fails with tasks.publish_failed. Being behind or overlapping
    # never refuses.
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-base-read-" + string(inputs.intent.node_id) }}
      methodName: base
      inputs:
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Read the base"].outputs.exitCode }}
    dependsOn:
    - step: Read the base
      condition:
        type: succeeded
  - name: Push the branch
    labels:
      role: swamp
    queueTimeout: 30
    # A copy pushes only after its base check passed; a skip of that check is never a pass.
    guard: '${{ !("Check the base" in steps && steps["Check the base"].status == "succeeded") }}'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-publish-push-" + string(inputs.intent.node_id) + "-" + string(inputs.intent.group_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: timeout 60 git -C "$ORBIT_REPOSITORY" push --porcelain -- "$ORBIT_REMOTE" "$ORBIT_REFSPEC" >"$ORBIT_DIRECTORY/push.stdout" 2>"$ORBIT_DIRECTORY/push.stderr"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ALLOW_PROTOCOL: https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: core.hooksPath
          GIT_CONFIG_VALUE_1: /dev/null
          GIT_CONFIG_KEY_2: http.followRedirects
          GIT_CONFIG_VALUE_2: 'false'
          GIT_CONFIG_KEY_3: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_3: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key) }}
          ORBIT_REPOSITORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() + "/repository.git" }}
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_REMOTE: ${{ inputs.intent.remote }}
          # A task copy's merge at publish goes instead of the checked candidate (docs/reference/tasks.md#merge-main-at-publish).
          ORBIT_REFSPEC: '${{ "Check the base" in steps && steps["Check the base"].status == "succeeded" && steps["Check the base"].outputs.merged != "" ? steps["Check the base"].outputs.merged + ":refs/heads/" + inputs.intent.branch : inputs.intent.refspec }}'
        ignoreExitCode: true
    dependsOn:
    - step: Mint the push token
      condition:
        type: succeeded
    - step: Check the base
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    writes: true
  - name: Read push result
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-pushed-" + string(inputs.intent.node_id) }}
      methodName: pushed
      inputs:
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Push the branch"].outputs.exitCode }}
    dependsOn:
    - step: Push the branch
      condition:
        type: succeeded
  - name: Read open PRs
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-pull-read-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method GET "$ORBIT_PATH" -f state=open -f head="$ORBIT_HEAD" -f per_page=100 >"$ORBIT_DIRECTORY/pulls.json" 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_PATH: ${{ "repos/" + inputs.intent.repository + "/pulls" }}
          ORBIT_HEAD: ${{ inputs.intent.pull_head }}
        ignoreExitCode: true
    dependsOn:
    - step: Read push result
      condition:
        type: succeeded
    guard: ${{ inputs.intent.pull_request == null }}
  - name: Plan the PR
    writes: true
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-pull-plan-" + string(inputs.intent.node_id) }}
      methodName: pull
      inputs:
        input: ${{ inputs.intent }}
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Read open PRs"].outputs.exitCode }}
        # The base statement becomes the body's fixed ## Base section.
        base: '${{ "Check the base" in steps && steps["Check the base"].status == "succeeded" ? steps["Check the base"].outputs.stdout : "" }}'
    dependsOn:
    - step: Read open PRs
      condition:
        type: succeeded
    guard: ${{ inputs.intent.pull_request == null }}
  - name: Write the PR
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-pull-write-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method "$ORBIT_METHOD" "$ORBIT_PATH" --input "$ORBIT_BODY_FILE" >"$ORBIT_DIRECTORY/pull.json" 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_DIRECTORY: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
          ORBIT_METHOD: ${{ steps["Plan the PR"].outputs.method }}
          ORBIT_PATH: ${{ steps["Plan the PR"].outputs.path }}
          ORBIT_BODY_FILE: ${{ steps["Plan the PR"].outputs.body_file }}
        ignoreExitCode: true
    dependsOn:
    - step: Plan the PR
      condition:
        type: succeeded
    writes: true
    guard: ${{ inputs.intent.pull_request == null }}
  - name: Read PR result
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publish-pull-result-" + string(inputs.intent.node_id) }}
      methodName: written
      inputs:
        input: ${{ inputs.intent }}
        directory: ${{ steps["Create publication scratch"].outputs.stdout.trim() }}
        exit_code: ${{ steps["Write the PR"].outputs.exitCode }}
        number: ${{ steps["Plan the PR"].outputs.number }}
    dependsOn:
    - step: Write the PR
      condition:
        type: succeeded
    guard: ${{ inputs.intent.pull_request == null }}
- name: cleanup
  labels:
    role: swamp
  dependsOn:
  - job: publish
    condition:
      type: completed
  steps:
  - name: Revoke the token
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-revoke-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method DELETE installation/token 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    guard: ${{ !("Mint the push token" in steps && steps["Mint the push token"].status == "succeeded") }}
    allowFailure: true
    writes: true
  - name: Discard the copy scratch
    labels:
      role: swamp
    queueTimeout: 30
    guard: '${{ !("Preflight the copy" in steps && steps["Preflight the copy"].status == "succeeded") }}'
    task:
      type: workflow
      workflowIdOrName: task-instance-workspace
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        group_id: ${{ inputs.intent.group_id }}
        phase: discard
        intent: '${{ {"runtime": inputs.intent.workspace.runtime, "branch": inputs.intent.workspace.branch, "head": inputs.intent.commit, "snapshot_id": inputs.intent.workspace.snapshot_id, "ssh_execution": inputs.intent.ssh_execution, "checkout_fingerprint": steps["Preflight the copy"].outputs.evidence.evidence.checkout_fingerprint} }}'
    allowFailure: true
  - name: Remove local scratch
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publish-local-cleanup-" + string(inputs.intent.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_DIRECTORY" "$ORBIT_GH_DIRECTORY"
        env:
          ORBIT_DIRECTORY: '${{ "Create publication scratch" in steps && steps["Create publication scratch"].status == "succeeded" ? steps["Create publication scratch"].outputs.stdout.trim()
            : "" }}'
          ORBIT_GH_DIRECTORY: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
    writes: true
  - name: Confirm publication
    labels:
      role: swamp
    queueTimeout: 30
    dependsOn:
    # The revoke is guarded off when no token was minted, and the discard when preflight failed;
    # a skipped dependency must still let the end check run.
    - step: Revoke the token
      condition: {type: or, conditions: [{type: completed}, {type: skipped}]}
    - step: Remove local scratch
      condition:
        type: completed
    - step: Discard the copy scratch
      condition: {type: or, conditions: [{type: completed}, {type: skipped}]}
    task:
      type: assert
      expr: '"Read push result" in steps && steps["Read push result"].status == "succeeded" && (inputs.intent.pull_request == null || ("Read PR result" in steps && steps["Read PR result"].status
        == "succeeded")) && steps["Remove local scratch"].status == "succeeded"'
      message: Task publication or scratch cleanup failed.
      severity: high
