id: 878a384f-8b8a-4066-bd17-dcad8eac3e86
name: operation-task-vm-image-build
description: Build, verify, seed and promote one image on its Incus host with pinned official SSH from 209; TypeScript shapes agent envelopes and replies only.
version: 1
queueTimeout: 30
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum: [task_vm.image_build]
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: admission
  steps:
  - name: plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: plan
      inputs:
        intent: ${{ inputs.intent }}
- name: build
  writes: true
  dependsOn:
  - {job: admission, condition: {type: succeeded}}
  steps:
  - name: reset-builder
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &id001
        name: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: [timeout, '930', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, incus.vm]
        timeoutSec: 960
        stdin: ${{ steps.plan.outputs.reset_builder }}
  - name: reset-builder-reply
    labels: {role: swamp}
    dependsOn:
    - {step: reset-builder, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["reset-builder"].outputs.stdout }}
        expect: ready
  - name: reset-smoke
    labels: {role: swamp}
    dependsOn:
    - {step: reset-builder-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '930', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, incus.vm]
        timeoutSec: 960
        stdin: ${{ steps.plan.outputs.reset_smoke }}
  - name: reset-smoke-reply
    labels: {role: swamp}
    dependsOn:
    - {step: reset-smoke, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["reset-smoke"].outputs.stdout }}
        expect: ready
  - name: launch
    labels: {role: swamp}
    dependsOn:
    - {step: reset-smoke-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '930', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, incus.vm]
        timeoutSec: 960
        stdin: ${{ steps.plan.outputs.launch }}
  - name: launch-reply
    labels: {role: swamp}
    dependsOn:
    - {step: launch, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["launch"].outputs.stdout }}
        expect: ready
  - name: boot-wait-agent
    labels: {role: swamp}
    dependsOn:
    - {step: launch-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '630', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', wait, --timeout, '600', --, '${{ inputs.intent.name
            }}', agent]
        timeoutSec: 660
  - name: boot-cloud-init
    labels: {role: swamp}
    dependsOn:
    - {step: boot-wait-agent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '630', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/bin/cloud-init, status, --wait]
        timeoutSec: 660
  - name: boot-push-agent
    labels: {role: swamp}
    dependsOn:
    - {step: boot-cloud-init, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '210', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', file, push, --mode, '0700', --uid, '0', --gid, '0',
          --, /usr/local/bin/orbit-agent, '${{ inputs.intent.name + steps.plan.outputs.candidate }}']
        timeoutSec: 240
  - name: boot-install-agent
    labels: {role: swamp}
    dependsOn:
    - {step: boot-push-agent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '210', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', '${{ steps.plan.outputs.candidate }}', command, agent.install]
        timeoutSec: 240
        stdin: ${{ steps.plan.outputs.install }}
  - name: boot-install-agent-reply
    labels: {role: swamp}
    dependsOn:
    - {step: boot-install-agent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["boot-install-agent"].outputs.stdout }}
        expect: installed
        pin: ${{ inputs.intent.agent_sha256 }}
  - name: boot-guest-cloud-init
    labels: {role: swamp}
    dependsOn:
    - {step: boot-install-agent-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '75', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/local/bin/orbit-agent, command, guest.cloud-init]
        timeoutSec: 105
        stdin: ${{ steps.plan.outputs.cloud_init }}
  - name: boot-guest-cloud-init-reply
    labels: {role: swamp}
    dependsOn:
    - {step: boot-guest-cloud-init, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["boot-guest-cloud-init"].outputs.stdout }}
        expect: ready
  - name: boot-inspect
    labels: {role: swamp}
    dependsOn:
    - {step: boot-guest-cloud-init-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/local/bin/orbit-agent, command, image.inspect-phase]
        timeoutSec: 90
        stdin: ${{ steps.plan.outputs.inspect_boot }}
  - name: boot-reply
    labels: {role: swamp}
    dependsOn:
    - {step: boot-inspect, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: boot
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps["boot-inspect"].outputs.stdout }}
  - name: apt-source-start
    labels: {role: swamp}
    dependsOn:
    - {step: boot-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/local/bin/orbit-agent, command, image.start-phase]
        timeoutSec: 180
        stdin: ${{ steps["boot-reply"].outputs.start["apt-source"] }}
  - name: apt-source-start-reply
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-start, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["apt-source-start"].outputs.stdout }}
        expect: started
        boot_id: ${{ steps["boot-reply"].outputs.boot_id }}
  - name: apt-source-pid
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-start-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/bin/systemctl, show, --property=MainPID, --value, --, '${{ steps.plan.outputs.units["apt-source"]
            }}']
        timeoutSec: 90
  - name: apt-source-wait
    labels: {role: swamp}
    guard: ${{ steps["apt-source-pid"].outputs.stdout.trim() == "0" }}
    dependsOn:
    - {step: apt-source-pid, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '1530', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/bin/timeout, '1500', /usr/bin/tail, '${{ "--pid=" + steps["apt-source-pid"].outputs.stdout.trim()
            }}', -f, /dev/null]
        timeoutSec: 1560
        okExitCodes: any
  - name: apt-source-inspect
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-pid, condition: {type: succeeded}}
    - step: apt-source-wait
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ inputs.intent.project }}', exec, --mode=non-interactive, --user, '0', --group,
          '0', --env, SUDO_USER=orbit, --, '${{ inputs.intent.name }}', /usr/local/bin/orbit-agent, command, image.inspect-phase]
        timeoutSec: 90
        stdin: ${{ steps["boot-reply"].outputs.inspect["apt-source"] }}
  - name: apt-source-inspect-reply
    labels: {role: swamp}
    dependsOn:
    - {step: apt-source-inspect, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-image-build'
      behaviorName: ${{ "task-vm-image-build-" + string(inputs.node_id) }}
      methodName: reply
      inputs:
        stdout: ${{ steps["apt-source-inspect"].outputs.stdout }}
        expect: complete
        boot_id: ${{ steps["boot-reply"].outputs.boot_id }}
  - name: packages-start
