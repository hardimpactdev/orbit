id: f497279b-80cd-4dc8-82bb-1a6622d977e4
name: operation-database-server-create
description: Database server create from 209, one official cfgmgmt behavior or one docker command per step.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database_server.create}
    intent: {type: object}
    # Names only: login (the admin password line and the check), start (the first-start env, or a blank line) and,
    # for Valkey, acl (the ACL file with password hashes); each one whole value.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-server-create-(intent|start|login)-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: server
  labels: {role: swamp}
  steps:
  - name: 'Pull the image'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_image'
      behaviorName: ${{ "database-server-image-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs:
        image: ${{ inputs.intent.container_input.image }}
        ensure: present
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
      inputs: {}
    # Valkey starts only from its ACL file, which holds only password hashes.
  - name: 'Write the ACL file'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Pull the image', condition: {type: succeeded}}]
    guard: '${{ inputs.intent.driver != "redis" }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "database-server-acl-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs:
        path: ${{ inputs.intent.commands.acl_path }}
        ensure: present
        content: ${{ vault.get(inputs.execution_secrets.acl.vault, inputs.execution_secrets.acl.key) }}
        owner: root
        group: root
        mode: '0600'
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
      inputs: {}
    # A first start reads the password variable from the vault on stdin (--env-file /dev/stdin), never from a file.
  - name: 'Start the container'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Pull the image', condition: {type: succeeded}}
    - {step: 'Write the ACL file', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ inputs.intent.commands.start }}'
        stdin: ${{ vault.get(inputs.execution_secrets.start.vault, inputs.execution_secrets.start.key) }}
        timeoutSec: 130
    # Q-WAIT: one bounded probe loop; MySQL and PostgreSQL accept TCP only after first-start initialization.
  - name: 'Wait until healthy'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Start the container', condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ inputs.intent.commands.wait }}'
        timeoutSec: 70
    # The admin password is the first stdin line; the Gateway checks the answer in the native result.
  - name: 'Check the admin login'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Wait until healthy', condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60"] + inputs.intent.commands.login_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.login.vault, inputs.execution_secrets.login.key) }}
        timeoutSec: 70
    # The final container runs without the password variable on the same volume; the step waits for it again.
  - name: 'Remove the first-start env'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Check the admin login', condition: {type: succeeded}}
    guard: '${{ inputs.intent.driver == "redis" || !inputs.intent.initialize }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ inputs.intent.commands.scrub }}'
        timeoutSec: 190
