---
# One command of the batch, as a user runs it: setup commands, a before snapshot, `orbit ... --json`, the assert on the answer, the wait on the
# Operation receipt, an after snapshot. Included once per case by converge.yml with `c` set. Everything is a stock module; the only state
# kept for verify.yml are cacheable facts (the fact cache of molecule.yml), so a failed check never stops the batch: it is recorded and
# verify.yml prints one verdict per case.
- name: "{{ c.id }}"
  block:
    - name: "{{ c.id }}: setup commands"
      ansible.builtin.command:
        argv: "{{ orbit + item + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      loop: "{{ c.setup | default([]) }}"
      changed_when: false

    - name: "{{ c.id }}: UFW table of app-dev before"
      ansible.builtin.command: ufw status numbered
      delegate_to: nested-app-dev
      register: ufw_pre
      changed_when: false

    - name: "{{ c.id }}: Operations before"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: ops_pre

    - name: "{{ c.id }}: run the command"
      ansible.builtin.command:
        argv: "{{ orbit + c.argv + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      register: ran
      failed_when: false
      changed_when: false

    - name: "{{ c.id }}: read the answer"
      ansible.builtin.set_fact:
        answer: "{{ (ran.stdout | from_json) if (ran.stdout is search('^\\s*[{\\[]')) else {} }}"

    - name: "{{ c.id }}: the answer is the one the contract promises"
      vars:
        code: "{{ answer.error_code | default(answer.error.code | default('')) }}"
      ansible.builtin.assert:
        that:
          - ran.rc == c.expect.rc
          - (c.expect.status | default('')) == '' or answer.status == c.expect.status
          - (c.expect.code | default('')) == '' or code == c.expect.code
          - (c.expect.skipped | default('')) == '' or c.expect.skipped in (answer | to_json)
        fail_msg: "exit {{ ran.rc }}, status {{ answer.status | default('-') }}, code {{ code }}; expected {{ c.expect }}"
        quiet: true

    - name: "{{ c.id }}: wait for the Operation receipt"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations/{{ answer.id | default(answer.operation.id | default('')) }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: receipt
      until: (receipt.json.data | default(receipt.json)).status in ['succeeded', 'failed', 'cancelled']
      retries: 30
      delay: 2
      when: c.expect.request | default(true)

    - name: "{{ c.id }}: the receipt agrees with the answer"
      ansible.builtin.assert:
        that: (receipt.json.data | default(receipt.json)).status == c.expect.status
        fail_msg: "receipt status {{ (receipt.json.data | default(receipt.json)).status }}, expected {{ c.expect.status }}"
        quiet: true
      when: c.expect.request | default(true)

    - name: "{{ c.id }}: UFW table of app-dev after"
      ansible.builtin.command: ufw status numbered
      delegate_to: nested-app-dev
      register: ufw_post
      changed_when: false

    - name: "{{ c.id }}: Operations after"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: ops_post
  rescue:
    - name: "{{ c.id }}: record the failed check"
      ansible.builtin.set_fact:
        failures: "{{ failures | default({}) | combine({c.id: ('converge | ' ~ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.msg | default('?')))}) }}"
        cacheable: true
  always:
    - name: "{{ c.id }}: keep the evidence for verify"
      ansible.builtin.set_fact:
        act: "{{ act | default({}) | combine({c.id: {'rc': ran.rc | default(-1), 'secs': ran.delta | default('0:00:00') , 'out': answer | default({})}}) }}"
        ufw_before: "{{ ufw_before | default({}) | combine({c.id: ufw_pre.stdout | default('')}) }}"
        ufw_after: "{{ ufw_after | default({}) | combine({c.id: ufw_post.stdout | default('')}) }}"
        ops_before: "{{ ops_before | default({}) | combine({c.id: ((ops_pre.json | default({})).data | default([])) | map(attribute='id') | sort | list}) }}"
        ops_after: "{{ ops_after | default({}) | combine({c.id: ((ops_post.json | default({})).data | default([])) | map(attribute='id') | sort | list}) }}"
        cacheable: true
