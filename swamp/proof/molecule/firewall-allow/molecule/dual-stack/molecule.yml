# SPIKE. Molecule scenario `dual-stack`: the case family-ipv6 of swamp/proof/firewall/allow.cases.yaml, which needs the batch `dual-stack` of
# swamp/proof/batches.yaml (setup step `ipv6_addresses`: every Node also has an IPv6 address on the proof bridge). Same driver, platforms and
# inventory as `default`; run on the task VM against the nested fleet that `task:start` already built, from the parent directory
# (firewall-allow/):
#   molecule test -s dual-stack     # prepare (IPv6 addresses, pings, listener, test deny, "blocked before" probes) -> converge (the CLI) -> verify
# The addresses are added in prepare and stay on the containers (as the batch step does); a rerun on a fleet that was not restored needs
# `molecule reset -s dual-stack` and another PROOF_PORT_BASE (see `default`).
driver:
  name: default
  options:
    managed: false

# Molecule needs a platform list even when it manages none; these are the existing Nodes.
platforms:
  - name: nested-gateway
  - name: nested-app-dev
  - name: nested-app-prod

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: ansible.builtin.default
      callbacks_enabled: ansible.posix.profile_tasks
      gathering: explicit
      interpreter_python: auto_silent
      # prepare and converge leave their results as cacheable facts (the IPv6 addresses, the answer of the CLI); the next ansible-playbook run
      # reads them. Its own directory: the scenarios `default` and `udp` keep their facts apart.
      fact_caching: jsonfile
      fact_caching_connection: /tmp/molecule-firewall-allow-dual-stack-facts
      fact_caching_timeout: 3600
  inventory:
    hosts:
      all:
        vars:
          # The nested Gateway, as the outer VM reaches it. The caller is identified by its WireGuard address, so no token is needed.
          gateway_url: https://10.45.0.1/api/v1
          gateway_ca: /home/orbit/.orbit/nested-ca.pem
          # The CLI under test, as the outer VM runs it: the checkout of the VM, the nested profile in ORBIT_HOME.
          checkout: "{{ lookup('ansible.builtin.env', 'ORBIT_CHECKOUT') | default('/home/orbit/apps/orbit/workspace', true) }}"
          orbit: [php, "{{ checkout }}/apps/cli/orbit"]
          cli_env: {PATH: /usr/local/bin:/usr/bin:/bin, HOME: /home/orbit, ORBIT_HOME: /home/orbit/.orbit}
          parallel_limit: "{{ lookup('ansible.builtin.env', 'ANSIBLE_FORKS') | default('1', true) | int }}"
          # PROOF_FAST=1: poll async jobs every 1 s instead of 5 s, and read the facts of `default/facts.yml` once.
          fast: "{{ lookup('ansible.builtin.env', 'PROOF_FAST') | default('0', true) == '1' }}"
          poll_delay: "{{ 1 if fast else 5 }}"
          # The runner's `target: app-dev` and `sources: [gateway, app-prod]`: the Node under test, the one source an allow admits, and the
          # one that stays blocked.
          target: app-dev
          allowed: gateway
          blocked: app-prod
          port_base: "{{ lookup('ansible.builtin.env', 'PROOF_PORT_BASE') | default(47100, true) | int }}"
          # A test port that nothing admits and a control port that works. The ports differ from `default` and `udp`.
          cases:
            family_ipv6: {port: "{{ port_base | int + 8 }}", control: "{{ port_base | int + 18 }}"}
          # The IPv6 network of the proof bridge (runner steps.py IPV6_PREFIX): a container gets this prefix and the last octet of its IPv4 address.
          ipv6_prefix: "fd42:232:2::"
        children:
          control:
            hosts:
              localhost:
                ansible_connection: local
          case_hosts:
            vars:
              ansible_connection: local
            hosts:
              family_ipv6: {}
          nodes:
            vars:
              ansible_connection: community.general.incus
            hosts:
              nested-gateway:  {ansible_incus_host: nested-gateway}
              nested-app-dev:  {ansible_incus_host: nested-app-dev}
              nested-app-prod: {ansible_incus_host: nested-app-prod}

scenario:
  test_sequence:
    - prepare
    - converge
    - verify
