# The composition of the Route withdrawal (swamp/ansible/templates/route-withdraw.j2), proved without a fleet: fixed Caddyfile and
# pool texts in, the files to write out. Same framework as the `default` scenario; it needs no Node, so it runs on any machine.
#   cd swamp/proof/molecule/instance-destroy && molecule test -s unit
driver:
  name: default
  options:
    managed: false

platforms:
  - name: localhost

provisioner:
  name: ansible
  config_options:
    defaults:
      gathering: explicit
      interpreter_python: auto_silent
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local

scenario:
  test_sequence:
    - converge
