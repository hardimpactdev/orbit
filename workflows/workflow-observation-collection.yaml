id: fb550568-ab07-4eb4-b5f4-db92e5780dc0
name: observation-collection
description: Run the bounded Orbit observation collection pass.
autoResume: true
concurrency: 1
trigger:
  schedule: "15 */10 * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: observation
    steps:
      - name: collect
        target: orbit-node-209
        labels: { node: "209" }
        task:
          type: behavior
          behaviorType: "@nckrtl/observation"
          behaviorName: observation-collection
          methodName: collect
          inputs:
            runId: "${{ run.id }}"
