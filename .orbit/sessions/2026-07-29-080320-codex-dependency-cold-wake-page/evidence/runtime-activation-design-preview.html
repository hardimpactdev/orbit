<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booting</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #000000;
            --text: #ffffff;
            --track: #27272a;
            --progress: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--background);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(100%, 158px);
        }

        .logo {
            width: 64px;
            height: 32px;
            display: block;
            margin: 0 auto 48px;
        }

        .progress {
            height: 4px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--track);
        }

        .progress::after {
            content: "";
            display: block;
            width: 50%;
            height: 100%;
            border-radius: inherit;
            background: var(--progress);
        }
    </style>
</head>
<body>
    <main>
        <svg class="logo" viewBox="0 25 100 50" fill="none" aria-label="Orbit">
            <path d="M50 25C77.6143 25 100 36.1929 100 50C99.9996 63.8069 77.614 75 50 75C22.386 75 0.000366987 63.8069 0 50C0 36.1929 22.3858 25 50 25ZM49.7764 32.0107C32.7857 32.0108 15.7344 38.9923 15.7344 46.9102C15.7346 54.8279 28.3485 61.2461 49.5654 61.2461C70.7823 61.2461 83.3962 54.8279 83.3965 46.9102C83.3965 38.9923 66.7672 32.0107 49.7764 32.0107Z" fill="currentColor"/>
        </svg>
        <div
            class="progress"
            role="progressbar"
            aria-label="Boot progress"
            aria-valuemin="0"
            aria-valuemax="4"
            aria-valuenow="2"
        ></div>
    </main>
</body>
</html>
