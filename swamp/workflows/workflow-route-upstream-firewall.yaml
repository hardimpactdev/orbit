id: d7eec9b6-54b9-47db-b509-6234b552fb35
name: route-upstream-firewall
description: Verify a captured public Process allowance with one pinned SSH UFW read
  and the shared firewall comparison.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: environment
  steps:
  - name: read
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "firewall-read-" + run.id }}
      methodName: exec
      globalArgs:
        name: ${{ "firewall-read-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          port: ${{ inputs.intent.connection.nodePort }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          hostKeys: ${{ inputs.intent.host_keys }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
      inputs:
        hosts: name:target
        argv:
        - /usr/sbin/ufw
        - status
        - numbered
        sudo: true
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: read
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/route-update-result'
      behaviorName: route-upstream-ready
      methodName: upstream
      inputs:
        stdout: ${{ steps.read.outputs.stdout }}
        expected: '${{ inputs.intent.expected.map(e, {"name": e.comment, "shape":
          e}) }}'
