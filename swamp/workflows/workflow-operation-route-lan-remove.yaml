id: 7df4d92e-034f-4a2e-bd17-8265aec18b11
name: operation-route-lan-remove
description: Withdraw only Route LAN tuples no published Route still needs, migrating legacy rules once.
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.lan_remove
    intent:
      type: object
      additionalProperties: false
      properties:
        route_id:
          type: integer
          minimum: 1
        node_id:
          type: integer
          minimum: 1
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
        rules:
          type: array
          items:
            type: object
        migrate:
          type: boolean
      required:
      - route_id
      - node_id
      - control_node_id
      - connection
      - host_keys
      - rules
      - migrate
    execution_secrets:
      type: object
      additionalProperties: false
      properties: {}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
jobs:
- name: withdrawal
  steps:
  - name: converge-lan
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent:
          control_node_id: 209
          connection: ${{ inputs.intent.connection }}
          host_keys: ${{ inputs.intent.host_keys }}
          rule:
            node_id: ${{ inputs.intent.node_id }}
            rules: ${{ inputs.intent.rules }}
            migrate: ${{ inputs.intent.migrate }}
  - name: remove-lan
    target: orbit-node-209
    dependsOn:
    - step: converge-lan
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: route-lan-terminal
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$ORBIT_ROUTE_LAN_RESULT"
        env:
          ORBIT_ROUTE_LAN_RESULT: ${{ steps["converge-lan"].outputs.result.result_json }}
