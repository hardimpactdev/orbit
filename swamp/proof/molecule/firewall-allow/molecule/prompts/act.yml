---
# One case, run for its own host: the snapshots before, the CLI runs of the case (run.yml, each one asserted), the wait on the receipt of every
# Operation the case created, the snapshots after. The product refuses a firewall write while another one holds the Node
# (`operation.target_busy`), so a run is asked again until it is admitted. A failed check is recorded, not raised, so one verdict per case
# survives. Results stay as cacheable facts of the case host (the fact cache of molecule.yml) for verify.yml.
- name: "{{ inventory_hostname }}"
  block:
    - name: "{{ inventory_hostname }}: forget the result of an earlier run"
      ansible.builtin.set_fact:
        failures: ""
        verify_failures: ""
        verified: false
        cacheable: true

    - name: "{{ inventory_hostname }}: start the clock"
      ansible.builtin.set_fact:
        case_t0: "{{ now().timestamp() }}"

    - name: "{{ inventory_hostname }}: UFW table of the target before"
      ansible.builtin.command: ufw status numbered
      delegate_to: "{{ tcontainer }}"
      register: ufw_pre
      changed_when: false

    - name: "{{ inventory_hostname }}: Operations before"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations?kind=firewall.allow"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: ops_pre

    - name: "{{ inventory_hostname }}: firewall records of the target before"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules?node={{ tid }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: rec_pre

    - name: "{{ inventory_hostname }}: the Operations that exist, and no run yet"
      ansible.builtin.set_fact:
        ops_start: "{{ ((ops_pre.json | default({})).data | default([])) | map(attribute='id') | sort | list }}"
        ops_prev: "{{ ((ops_pre.json | default({})).data | default([])) | map(attribute='id') | sort | list }}"
        cli_runs: []

    - name: "{{ inventory_hostname }}: the runs of the case"
      ansible.builtin.include_tasks: run.yml
      loop: "{{ d.runs }}"
      loop_control: {loop_var: run, label: "{{ run.argv | join(' ') }}"}

    - name: "{{ inventory_hostname }}: UFW table of the target after"
      ansible.builtin.command: ufw status numbered
      delegate_to: "{{ tcontainer }}"
      register: ufw_post
      changed_when: false

    - name: "{{ inventory_hostname }}: firewall records of the target after"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules?node={{ tid }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: rec_post

    - name: "{{ inventory_hostname }}: wait for the receipt of each Operation the case created"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations/{{ item }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      loop: "{{ ops_prev | difference(ops_start) }}"
      register: receipts
      until: (receipts.json.data | default(receipts.json)).status in ['succeeded', 'failed', 'cancelled']
      retries: 30
      delay: 2

    - name: "{{ inventory_hostname }}: each of them succeeded"
      ansible.builtin.assert:
        that: (item.json.data | default(item.json)).status == 'succeeded'
        fail_msg: "Operation {{ item.item }} ended {{ (item.json.data | default(item.json)).status }}"
        quiet: true
      loop: "{{ receipts.results }}"
      loop_control: {label: "operation {{ item.item }}"}
  rescue:
    - name: "{{ inventory_hostname }}: record the failed check"
      ansible.builtin.set_fact:
        failures: "converge | {{ ansible_failed_task.name }} | {{ ansible_failed_result.msg | default('?') }}"
        cacheable: true
  always:
    - name: "{{ inventory_hostname }}: keep the evidence for verify"
      ansible.builtin.set_fact:
        ufw_before: "{{ ufw_pre.stdout | default('') }}"
        ufw_after: "{{ ufw_post.stdout | default('') }}"
        ops_before: "{{ ops_start | default([]) }}"
        ops_after: "{{ ops_prev | default([]) }}"
        records_before: "{{ (rec_pre.json | default({})).data | default([]) }}"
        records_after: "{{ (rec_post.json | default({})).data | default([]) }}"
        tnode: "{{ tnode }}"
        case_secs: "{{ ((now().timestamp() - case_t0 | float) | round(1)) }}"
        case_start: "{{ case_t0 | float }}"
        case_end: "{{ now().timestamp() }}"
        cmd_secs: "{{ cli_runs | default([]) | map(attribute='secs') | map('float') | sum }}"
        cli_start: "{{ cli_runs | default([]) | map(attribute='start') | map('float') | list | first | default(0) }}"
        cli_end: "{{ cli_runs | default([]) | map(attribute='end') | map('float') | list | last | default(0) }}"
        busy_retries: "{{ cli_runs | default([]) | map(attribute='busy') | map('int') | sum }}"
        cacheable: true
