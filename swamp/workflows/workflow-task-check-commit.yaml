id: 40dc14cf-5ec7-50a2-942c-f62e658ea10c
name: task-check-commit
description: Commit a passed handoff candidate and pin it under the check-operations ref.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      propertyNames:
        enum:
        - github_token
        - checks_token
      maxProperties: 2
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-check-(write|read)-[a-f0-9-]{36}$
        required:
        - vault
        - key
        additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
    local:
      type: object
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  - local
  additionalProperties: false
jobs:
- name: commit
  labels:
    role: swamp
  steps:
  - name: commit_add
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
    guard: ${{ has(inputs.local.result.error_code) || inputs.local.result.outcome != "passed" || inputs.intent.phase != "handoff"
      }}
    writes: true
  - name: commit
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        stdin: ${{ inputs.intent.message }}
        argv:
        - env
        - GIT_AUTHOR_NAME=Orbit
        - GIT_AUTHOR_EMAIL=orbit@users.noreply.github.com
        - GIT_COMMITTER_NAME=Orbit
        - GIT_COMMITTER_EMAIL=orbit@users.noreply.github.com
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - -c
        - core.hooksPath=/dev/null
        - -c
        - commit.gpgSign=false
        - commit
        - --allow-empty
        - --allow-empty-message
        - --cleanup=verbatim
        - --quiet
        - --file=-
    dependsOn:
    - step: commit_add
      condition:
        type: succeeded
    guard: ${{ has(inputs.local.result.error_code) || inputs.local.result.outcome != "passed" || inputs.intent.phase != "handoff"
      }}
    writes: true
  - name: commit_read
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
        - HEAD^{tree}
        - HEAD^
    dependsOn:
    - step: commit
      condition:
        type: succeeded
    guard: ${{ has(inputs.local.result.error_code) || inputs.local.result.outcome != "passed" || inputs.intent.phase != "handoff"
      }}
  - name: candidate
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: ${{ "task-check-candidate" }}
      methodName: candidate
      inputs:
        intent: ${{ inputs.intent }}
        local: ${{ inputs.local.result }}
        steps: ${{ steps }}
    dependsOn:
    - step: commit_read
      condition:
        type: always
  - name: commit_ref
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - update-ref
        - ${{ "refs/orbit/check-operations/" + string(inputs.operation_id) }}
        - ${{ steps.candidate.outputs.result.commit }}
    dependsOn:
    - step: candidate
      condition:
        type: succeeded
    guard: ${{ has(steps.candidate.outputs.result.error_code) || steps.candidate.outputs.result.commit == null }}
    writes: true
queueTimeout: 30
