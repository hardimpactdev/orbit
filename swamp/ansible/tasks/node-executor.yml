---
# The executor install (ADR 0266 slice 1, ADR 0267 P10; docs/reference/executor.md). The Gateway's intent carries it only for a
# Node whose roles enable an action family. The binary is pinned by its SHA-256 from the agent delivery. systemd only starts the
# executor at boot and restarts it after a crash; the executor holds its own socket. A changed binary or file restarts it, and it
# finishes any open order from its journal at start-up.
#
# Rollout (docs/reference/executor.md#rollout): until the pinned delivery carries the executor and the Gateway pins a key, the intent
# names `skip` and the converge records that reason in its run and installs nothing. Nothing uses the executor before then.
- name: Skip the executor install until its release and key are pinned
  when: intent.executor.skip != None
  ansible.builtin.debug:
    msg: "executor install skipped: {{ intent.executor.skip }}"
- name: Install the executor
  when: intent.executor.skip == None
  block:
    - name: Require a planned executor release and pinned keys
      ansible.builtin.assert:
        that: [intent.executor.plan_error == None]
        fail_msg: "{{ intent.executor.plan_error | default('executor.release_invalid', true) }}"
        quiet: true
    - name: Ensure the relay user
      ansible.builtin.user:
        name: "{{ intent.executor.relay_user }}"
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        state: present
    - name: Ensure the executor directories
      ansible.builtin.file: { path: "{{ item }}", state: directory, owner: root, group: root, mode: "0755" }
      loop: [/usr/local/libexec, /etc/orbit/executor]
    - name: Reconcile the pinned executor binary
      ansible.builtin.import_tasks: node-converge-replace.yml
      vars:
        converge_replacement:
          path: "{{ intent.executor.path }}"
          url: "{{ intent.executor.url }}"
          sha256: "{{ intent.executor.sha256 }}"
    - name: Remember whether the executor binary changed
      ansible.builtin.set_fact:
        executor_binary_changed: "{{ converge_replacement_commit is changed or converge_replacement_metadata is changed }}"
    - name: Reconcile the executor's keys, Node id, allowlist, restore pool and unit
      ansible.builtin.copy: { dest: "{{ item.path }}", content: "{{ item.content }}", owner: root, group: root, mode: "0644" }
      loop:
        - { path: /etc/orbit/executor/gateway.pub, content: "{{ intent.executor.gateway_keys }}" }
        - { path: /etc/orbit/executor/node, content: "{{ intent.executor.node }}" }
        - { path: /etc/orbit/executor/enabled, content: "{{ intent.executor.enabled }}" }
        - { path: /etc/orbit/executor/restore-threads, content: "{{ intent.executor.restore_threads }}" }
        - { path: /etc/systemd/system/orbit-executor.service, content: "{{ intent.executor.unit }}" }
      loop_control: { label: "{{ item.path }}" }
      register: executor_files
    - name: Allow the Node user the one relay command
      ansible.builtin.copy:
        dest: /etc/sudoers.d/orbit-executor-relay
        content: "{{ intent.executor.sudoers }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
    - name: Start the executor and restart only for managed changes
      ansible.builtin.systemd:
        name: orbit-executor.service
        enabled: true
        daemon_reload: "{{ executor_files is changed }}"
        state: "{{ 'restarted' if executor_binary_changed or executor_files is changed else 'started' }}"
