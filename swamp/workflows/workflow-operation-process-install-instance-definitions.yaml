id: bc1df2c2-8453-4ea6-8858-46da046b337c
name: operation-process-install-instance-definitions
description: Converge captured Process definitions through native child workflows on 209.
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [process.install_instance_definitions]}
    intent:
      type: object
      properties:
        instance_id: {type: integer, minimum: 1}
        members:
          type: array
          maxItems: 4096
          items:
            type: object
            properties:
              id: {type: integer, minimum: 1}
              intent: {type: object}
            required: [id, intent]
            additionalProperties: false
      required: [instance_id, members]
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^process-instance-operation-[1-9][0-9]*-member-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: instance
    labels: {role: swamp}
    steps:
      - name: members
        labels: {role: swamp}
        forEach: {item: member, in: '${{ inputs.intent.members }}'}
        task:
          type: workflow
          workflowIdOrName: operation-process-create
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: process.create
            intent: ${{ self.member.intent }}
            execution_secrets: '${{ "member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["member_" + string(self.member.id)]} : {} }}'
      - name: result
        labels: {role: swamp}
        dependsOn: [{step: members, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "process-def-result-" + run.id }}
          methodName: execute
          inputs:
            run: |
              printf '%s\n' '{"ready":true}'
