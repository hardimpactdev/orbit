---
# The power helper of development containers (docs/reference/prepared-restore.md#the-power-helper). The app-dev convergence includes
# this file, and so will the sleep and wake phases, so a run never depends on when the role last converged. Every caller runs the
# helper as the transient unit orbit-instance-power-<id>.service; the drop-in below holds the unit's properties for every such name,
# so no caller repeats them. The capability probe runs when the helper changed or its manifest is missing; a primitive that fails
# means no plan, never a pretend install.
- name: Make the folders of the power helper
  ansible.builtin.file: { path: "{{ item.path }}", state: directory, owner: root, group: root, mode: "{{ item.mode }}" }
  loop:
    - { path: /usr/local/libexec, mode: "0755" }
    - { path: /var/lib/orbit/hibernation, mode: "0755" }
    - { path: /var/lib/orbit/hibernation/instances, mode: "0700" }
    - { path: /etc/systemd/system/orbit-instance-power-.service.d, mode: "0755" }
  loop_control: { label: "{{ item.path }}" }

- name: Write the power helper
  ansible.builtin.copy:
    src: files/instance-container-power.py
    dest: /usr/local/libexec/orbit-instance-power
    owner: root
    group: root
    mode: "0755"
  register: power_helper

# Root with only the capabilities the kernel requires: CAP_SYS_PTRACE for pagemap and process_vm_readv, CAP_SYS_NICE for
# process_madvise and CAP_DAC_OVERRIDE for cgroup files that the container's root owns.
- name: Write the properties of every power helper unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/orbit-instance-power-.service.d/orbit.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Type=exec
      User=root
      CapabilityBoundingSet=CAP_SYS_PTRACE CAP_SYS_NICE CAP_DAC_OVERRIDE
      AmbientCapabilities=
      NoNewPrivileges=yes
      # Two descriptors per target process (pidfd and stat) for up to 4,096 processes, with room for the rest.
      LimitNOFILE=16384
      PrivateTmp=yes
      ProtectSystem=strict
      ProtectHome=yes
      ReadWritePaths=-/var/lib/orbit/hibernation -/dev/shm/orbit/hibernation /sys/fs/cgroup
  register: power_helper_unit

- name: Load the power helper unit properties # noqa: no-handler -- the capability probe below needs the new properties
  ansible.builtin.systemd_service: { daemon_reload: true }
  when: power_helper_unit.changed

- name: Read the capability manifest
  ansible.builtin.stat: { path: /var/lib/orbit/hibernation/capabilities.json }
  register: power_capabilities_file

# The probe runs as the unit orbit-instance-power-probe, so it has the drop-in's properties and capabilities, the same as each restore,
# and it probes a process of another uid that systemd starts for it, as a container's processes are: the manifest states what the
# unit can really do.
- name: Probe the kernel primitives of the power helper
  ansible.builtin.command:
    argv: [systemd-run, --unit=orbit-instance-power-probe, --wait, --pipe, --collect, --quiet, /usr/local/libexec/orbit-instance-power, capabilities]
  when: power_helper.changed or not power_capabilities_file.stat.exists
  register: power_capabilities
  changed_when: true

- name: Report the power helper's primitives
  ansible.builtin.debug: { msg: "{{ (power_capabilities.stdout | from_json).capabilities }}" }
  when: power_capabilities is not skipped
