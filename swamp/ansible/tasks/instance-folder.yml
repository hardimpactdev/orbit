---
# One shared folder of an Instance container host (docs/reference/development-containers.md#shared-folders), `folder_name` runtime or
# agent. A version is a digest of the folder's whole content, so a version that exists is complete: it is built under a staging name
# and renamed last. `current` then flips to it, and each running container restarts what runs from the folder, one after another:
# T3 for the agent folder, its Orbit Processes for the runtime folder. A version that no process maps any more goes.
- name: Name the folder version of {{ folder_name }}
  ansible.builtin.set_fact:
    folder_root: "{{ folder.path }}/{{ folder.version }}"
    folder_stage: "{{ folder.path }}/.{{ folder.version }}.stage"
    # The agent's programs sit one level down, in `agent/`, which only gid 2750 opens; the notes beside it stay public.
    folder_parts: "{{ folder.path }}/.{{ folder.version }}.stage{{ '/agent' if folder_name == 'agent' else '' }}"

- name: Read the folder version of {{ folder_name }}
  ansible.builtin.stat: { path: "{{ folder_root }}", get_checksum: false, get_mime: false }
  register: folder_present

- name: Build the folder version of {{ folder_name }}
  when: not folder_present.stat.exists
  block:
    - name: Create the folder and the artifact cache
      ansible.builtin.file: { path: "{{ item }}", state: directory, owner: root, group: root, mode: "0755" }
      loop: ["{{ folder.path }}", /var/cache/orbit/instance-folders]
    - name: Remove a staging copy a failed run left
      ansible.builtin.file: { path: "{{ folder_stage }}", state: absent }
    - name: Create the staging folders
      ansible.builtin.file: { path: "{{ folder_parts }}/{{ item }}", state: directory, owner: root, group: root, mode: "0755" }
      loop: "{{ ['bin'] + folder.parts | map(attribute='name') | list }}"
    - name: Fetch the pinned artifacts
      orbit_artifact:
        urls: ["{{ item.url }}"]
        dest: "/var/cache/orbit/instance-folders/{{ item.sha256 | default(item.sha512) }}"
        sha256: "{{ item.sha256 | default(omit) }}"
        sha512: "{{ item.sha512 | default(omit) }}"
        transport_exit_codes: "{{ lookup('ansible.builtin.file', playbook_dir + '/transport-exit-codes.json') | from_json }}"
      loop: "{{ folder.parts }}"
      loop_control: { label: "{{ item.name }} {{ item.version }}" }
    - name: Unpack the artifacts
      ansible.builtin.command:
        argv: >-
          {{ (['tar', '-xf', cached, '-C', target, '--no-same-owner'] if item.archive == 'tar'
              else ['unzip', '-q', cached, '-d', target] if item.archive == 'zip'
              else ['install', '-m', '0755', cached, target ~ '/' ~ (item.url | urlsplit('path') | basename)]) }}
      vars:
        cached: "/var/cache/orbit/instance-folders/{{ item.sha256 | default(item.sha512) }}"
        target: "{{ folder_parts }}/{{ item.name }}"
      loop: "{{ folder.parts }}"
      loop_control: { label: "{{ item.name }}" }
      changed_when: true
    - name: Link each program to its path in its part
      ansible.builtin.file:
        path: "{{ folder_parts }}/bin/{{ item.program }}"
        src: "../{{ item.part }}/{{ item.path }}"
        state: link
        follow: false
      loop: >-
        {%- set links = [] -%}
        {%- for part in folder.parts -%}
          {%- for program, path in (part.bin or {}).items() -%}
            {%- set _ = links.append({'part': part.name, 'program': program, 'path': path}) -%}
          {%- endfor -%}
        {%- endfor -%}
        {{ links }}
      loop_control: { label: "{{ item.program }}" }
    - name: Read the linked programs
      ansible.builtin.stat: { path: "{{ folder_parts }}/bin/{{ item }}", follow: true, get_checksum: false, get_mime: false }
      loop: "{{ folder.parts | map(attribute='bin') | map('list') | flatten }}"
      register: folder_programs
    - name: Require that every program is an executable file
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isreg and item.stat.executable
        fail_msg: "instance.host_unavailable: {{ item.item }} is not an executable file in the {{ folder_name }} folder"
        quiet: true
      loop: "{{ folder_programs.results }}"
      loop_control: { label: "{{ item.item }}" }
    # A static PHP build's CLI and FrankenPHP must load exactly its recipe extensions (docs/reference/compute-drivers.md#static-php-build).
    - name: Check each static PHP build against its extensions
      orbit_static_php:
        php: "{{ folder_parts }}/{{ item.name }}/bin/php"
        frankenphp: "{{ folder_parts }}/{{ item.name }}/bin/frankenphp"
        php_version: "{{ item.static_php.php_version }}"
        extensions: "{{ item.static_php.extensions }}"
      loop: "{{ folder.parts | selectattr('static_php', 'defined') | list }}"
      loop_control: { label: "{{ item.name }}" }
    # The runtime folder's `vp` runs from the Vite+ home, which every version of the folder links as `vite-plus-home`.
    - name: Build the Vite+ home of the runtime folder
      when: folder.vite_plus is defined
      ansible.builtin.include_tasks: instance-vite-plus-home.yml
      vars: { vite_plus: "{{ folder.vite_plus }}" }
    - name: Link the Vite+ home and vp into the version
      when: folder.vite_plus is defined
      ansible.builtin.file: { src: "{{ item.src }}", dest: "{{ item.dest }}", state: link, follow: false }
      loop:
        - { src: "{{ folder.vite_plus.home }}", dest: "{{ folder_stage }}/vite-plus-home" }
        - { src: ../vite-plus-home/bin/vp, dest: "{{ folder_parts }}/bin/vp" }
      loop_control: { label: "{{ item.dest | basename }}" }
    - name: Write the environment notes
      when: folder_name == 'agent'
      block:
        - name: Create the notes folder
          ansible.builtin.file: { path: "{{ folder_stage }}/notes", state: directory, owner: root, group: root, mode: "0755" }
        - name: Write each note
          ansible.builtin.copy:
            dest: "{{ folder_stage }}/notes/{{ item.key }}.md"
            content: "{{ item.value }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ folder.notes | dict2items }}"
          loop_control: { label: "{{ item.key }}" }
    - name: Read the group of gid 2750
      when: folder_name == 'agent'
      ansible.builtin.command: { argv: [getent, group, "2750"] }
      register: folder_agent_group
      changed_when: false
      failed_when: folder_agent_group.rc not in [0, 2]
    - name: Require that no Node group holds gid 2750
      when: folder_name == 'agent'
      ansible.builtin.assert:
        that: folder_agent_group.rc == 2
        fail_msg: "instance.host_unavailable: the Node group {{ folder_agent_group.stdout | trim }} holds gid 2750, the gid of every container's agent"
        quiet: true
    # Everyone reads the runtime folder. Only root and gid 2750, the `agent` of every container, open the agent's programs: no Node
    # account holds that gid, and an idmapped mount keeps it 2750 in every container.
    - name: Set the folder owners and modes
      ansible.builtin.command:
        argv: "{{ item }}"
      loop: >-
        {{ [['chown', '-R', 'root:root', folder_stage], ['chmod', '-R', 'u+rwX,go+rX,go-w', folder_stage]]
           + ([['chown', '-R', 'root:' ~ instance_agent_gid, folder_parts], ['chmod', '-R', 'o-rwx', folder_parts]] if folder_name == 'agent' else []) }}
      vars: { instance_agent_gid: 2750 }
      changed_when: true
    - name: Make the version whole
      ansible.builtin.command: { argv: [mv, "{{ folder_stage }}", "{{ folder_root }}"] }
      changed_when: true

- name: Read the folder in use of {{ folder_name }}
  ansible.builtin.stat: { path: "{{ folder.path }}/current", get_checksum: false, get_mime: false }
  register: folder_current

# A run that fails between the flip and the last restart leaves this marker, so the next run restarts the containers again.
- name: Mark the restart of what runs from the folder of {{ folder_name }}
  when: folder_current.stat.exists and folder_current.stat.lnk_target != folder.version
  ansible.builtin.file: { path: "{{ folder.path }}/.restart", state: touch, mode: "0644" }

- name: Read the restart mark of {{ folder_name }}
  ansible.builtin.stat: { path: "{{ folder.path }}/.restart", get_checksum: false, get_mime: false }
  register: folder_restart

- name: Flip the folder to the version of {{ folder_name }}
  ansible.builtin.file: { path: "{{ folder.path }}/current", src: "{{ folder.version }}", state: link, force: true, owner: root, group: root }
  register: folder_flip

- name: Restart what runs from the folder in each running container of {{ folder_name }}
  when: folder_restart.stat.exists
  block:
    - name: Read the running containers
      ansible.builtin.command: { argv: [incus, list, --project, "{{ instances.project }}", --format, json, status=running] }
      register: folder_running
      changed_when: false
    - name: Restart them one after another
      ansible.builtin.command:
        argv: >-
          {{ ['incus', 'exec', '--project', instances.project, item, '--', 'systemctl', 'try-restart']
             + (['t3.service'] if folder_name == 'agent' else ['orbit-*.service']) }}
      loop: "{{ folder_running.stdout | from_json | map(attribute='name') | list }}"
      changed_when: true
    - name: Clear the restart mark
      ansible.builtin.file: { path: "{{ folder.path }}/.restart", state: absent }

# A process maps the files it runs, by their path inside its container, which is the path on the Node: a version that no process
# names in its maps is unused.
- name: Read the folder versions in use of {{ folder_name }}
  ansible.builtin.shell:
    cmd: set -o pipefail; cat /proc/[0-9]*/maps 2>/dev/null | grep -o "{{ folder.path }}/[0-9a-f]\{12\}/" | sort -u || true
    executable: /bin/bash
  register: folder_used
  changed_when: false

- name: Find the folder versions of {{ folder_name }}
  ansible.builtin.find: { paths: "{{ folder.path }}", file_type: directory, patterns: "^[0-9a-f]{12}$", use_regex: true }
  register: folder_versions

- name: Remove the unused folder versions of {{ folder_name }}
  ansible.builtin.file: { path: "{{ item.path }}", state: absent }
  loop: "{{ folder_versions.files }}"
  loop_control: { label: "{{ item.path | basename }}" }
  when:
    - item.path | basename != folder.version
    - (item.path ~ '/') not in folder_used.stdout_lines

# A Vite+ home goes once no folder version left links it and no process maps it. A process maps a home by its own path, not
# through a version's `vite-plus-home` link, so a running `vp` or its Node keeps its home after its version went.
- name: Read the Vite+ homes that a process maps
  when: folder_name == 'runtime'
  ansible.builtin.shell:
    cmd: set -o pipefail; cat /proc/[0-9]*/maps 2>/dev/null | grep -o "{{ folder.path }}/vite-plus/[0-9a-f]\{12\}/" | sort -u || true
    executable: /bin/bash
  register: vite_plus_mapped
  changed_when: false

- name: Read the Vite+ homes that a folder version links
  when: folder_name == 'runtime'
  ansible.builtin.shell:
    cmd: for link in {{ folder.path }}/[0-9a-f]*/vite-plus-home; do [ -L "$link" ] && readlink "$link"; done; true
    executable: /bin/bash
  register: vite_plus_linked
  changed_when: false

- name: Find the Vite+ homes
  when: folder_name == 'runtime'
  ansible.builtin.find: { paths: "{{ folder.path }}/vite-plus", file_type: directory, patterns: "^[0-9a-f]{12}$", use_regex: true }
  register: vite_plus_homes

- name: Remove the Vite+ homes no folder version links
  ansible.builtin.file: { path: "{{ item.path }}", state: absent }
  loop: "{{ vite_plus_homes.files }}"
  loop_control: { label: "{{ item.path | basename }}" }
  when:
    - folder_name == 'runtime'
    - item.path not in vite_plus_linked.stdout_lines
    - (item.path ~ '/') not in vite_plus_mapped.stdout_lines
