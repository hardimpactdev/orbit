---
# Clear the inner Incus's network pid files (each managed bridge's dnsmasq.pid) from the stopped nested containers that
# `fleet_runtime_names` names (instance_fleet_runtime.py). The refresh runs it before it takes `base`, so no `base` holds one: a stop
# keeps the file, and an empty one stopped `orbitinst0` on nested-app-dev. A container that is not stopped fails the step, and no
# `base` is taken. The Node's own heal (instance-fleet-node.yml) covers every boot of an older disk. Input: instance-fleet.yml.
- name: Clear the network pid files of the stopped nested containers
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '60'] + fleet_outer
         + ['python3', '-I', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_fleet_runtime.py'), fleet_inner_pools]
         + fleet_runtime_names }}
  register: fleet_runtime
  changed_when: (fleet_runtime.stdout_lines | last | from_json).removed | length > 0
  failed_when: fleet_runtime.rc != 0 or (fleet_runtime.stdout_lines | last | from_json).skipped | length > 0
