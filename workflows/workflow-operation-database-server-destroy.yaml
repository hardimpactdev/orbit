id: 2fb743f6-7bd7-4d0a-8a61-168d30da8a44
name: operation-database-server-destroy
description: Remove only the admitted database Process; preserve its data volume.
target: '${{ "orbit-node-" + string(inputs.node_id) }}'
labels: { node: "${{ string(inputs.node_id) }}" }
writes: true
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [database_server.destroy] }
  required: [operation_id, node_id, kind]
jobs:
  - name: server
    steps:
      - name: apply
        dataOutputOverrides:
          - specName: outcome
            vary: [run_id]
        task:
          type: behavior
          behaviorType: "@nckrtl/database-server-destroy"
          behaviorName: '${{ "database-server-destroy-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
      - name: project
        dependsOn:
          - step: apply
            condition: { type: succeeded }
        task:
          type: behavior
          behaviorType: "@nckrtl/database-server-destroy"
          behaviorName: '${{ "database-server-destroy-" + string(inputs.node_id) }}'
          methodName: project
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
            outcome: "${{ steps.apply.outputs.outcome }}"
