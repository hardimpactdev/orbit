id: 738a2f9d-dc6c-4754-92c3-f51de9cb91f9
name: operation-instance-deploy-direct
description: Development deploy as official SSH argv from 209; retained production deploy on its admitted worker.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - instance.deploy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*|development-deploy-operation-[1-9][0-9]*-(step-([0-9]|[12][0-9]|3[01])|credential))$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: development-source
  labels:
    role: swamp
  steps:
  - name: Write the fetch credential
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: &id001
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts: &id002
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - umask 077 && exec cat > "$1"
        - sh
        - ${{ "/tmp/orbit-git-credential-" + run.id }}
        timeoutSec: 60
        stdin: ${{ vault.get(inputs.execution_secrets.credential.vault, inputs.execution_secrets.credential.key) }}
  - name: Fetch the branch
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Write the fetch credential
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '300'
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -c
        - credential.helper=
        - -c
        - ${{ "credential.helper=store --file=/tmp/orbit-git-credential-" + run.id }}
        - -c
        - protocol.allow=never
        - -c
        - protocol.https.allow=always
        - -c
        - http.followRedirects=false
        - -c
        - 'url.https://github.com/.insteadOf=git@github.com:'
        - -c
        - url.https://github.com/.insteadOf=ssh://git@github.com/
        - -C
        - ${{ inputs.intent.deployment.home }}
        - fetch
        - --quiet
        - --no-tags
        - --
        - ${{ inputs.intent.deployment.repository }}
        - ${{ "+refs/heads/" + inputs.intent.deployment.branch + ":refs/remotes/origin/" + inputs.intent.deployment.branch }}
        timeoutSec: 310
  - name: Remove the fetch credential
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Fetch the branch
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -f
        - --
        - ${{ "/tmp/orbit-git-credential-" + run.id }}
        timeoutSec: 60
  - name: Check tracked changes
    labels:
      role: swamp
    dependsOn:
    - step: Fetch the branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - diff
        - --quiet
        - HEAD
        - --
        timeoutSec: 60
  - name: Resolve the commit
    labels:
      role: swamp
    dependsOn:
    - step: Check tracked changes
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - --end-of-options
        - '${{ (inputs.intent.commit == null ? "refs/remotes/origin/" + inputs.intent.deployment.branch : inputs.intent.commit) + "^{commit}" }}'
        timeoutSec: 60
  - name: Count commits after it
    labels:
      role: swamp
    dependsOn:
    - step: Resolve the commit
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-list
        - --first-parent
        - --count
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() + "..refs/remotes/origin/" + inputs.intent.deployment.branch }}
        timeoutSec: 60
  - name: Read the branch at that depth
    labels:
      role: swamp
    dependsOn:
    - step: Count commits after it
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - --end-of-options
        - ${{ "refs/remotes/origin/" + inputs.intent.deployment.branch + "~" + steps["Count commits after it"].outputs.stdout.trim() + "^{commit}" }}
        timeoutSec: 60
  - name: Check it is on the branch
    dependsOn:
    - step: Read the branch at that depth
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: assert
      severity: high
      message: The commit is not on the branch.
      expr: steps["Read the branch at that depth"].outputs.stdout.trim() == steps["Resolve the commit"].outputs.stdout.trim()
  - name: Read the local branch
    labels:
      role: swamp
    dependsOn:
    - step: Check it is on the branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - for-each-ref
        - --format=%(objectname)
        - ${{ "refs/heads/" + inputs.intent.deployment.branch }}
        timeoutSec: 60
  - name: Check the local branch
    labels:
      role: swamp
    dependsOn:
    - step: Read the local branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" || steps["Read the local branch"].outputs.stdout.trim() == "" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - merge-base
        - --is-ancestor
        - ${{ "refs/heads/" + inputs.intent.deployment.branch }}
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 60
  - name: List untracked entries
    labels:
      role: swamp
    dependsOn:
    - step: Read the local branch
      condition:
        type: succeeded
    - step: Check the local branch
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - ls-files
        - -z
        - --others
        - --directory
        timeoutSec: 60
  - name: List the target directories
    labels:
      role: swamp
    dependsOn:
    - step: List untracked entries
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - ls-tree
        - -d
        - -r
        - -z
        - --name-only
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 60
  - name: Plan the cleanup
    labels:
      role: swamp
    dependsOn:
    - step: List the target directories
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev-cleanup-plan" }}
      methodName: cleanup
      inputs:
        home: ${{ inputs.intent.deployment.home }}
        untracked: ${{ steps["List untracked entries"].outputs.stdout }}
        directories: ${{ steps["List the target directories"].outputs.stdout }}
- name: development-checkout
  labels:
    role: swamp
  dependsOn:
  - job: development-source
    condition:
      type: succeeded
  steps:
  - name: Check the checkout lock
    labels:
      role: swamp
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/flock
        - --nonblock
        - --conflict-exit-code
        - '73'
        - ${{ inputs.intent.deployment.home }}
        - /bin/true
        timeoutSec: 60
  - name: Clean stale directories
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check the checkout lock
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv: ${{ self.action }}
        timeoutSec: 300
    forEach:
      item: action
      in: '${{ inputs.intent.deployment.variant != "development" ? [] : steps["Plan the cleanup"].outputs.actions }}'
    concurrency: 1
  - name: Check out the commit
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check the checkout lock
      condition:
        type: succeeded
    - step: Clean stale directories
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" || steps.exists(k, k.startsWith("Clean stale directories") && steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/flock
        - --nonblock
        - --conflict-exit-code
        - '73'
        - ${{ inputs.intent.deployment.home }}
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - checkout
        - --quiet
        - --no-track
        - -B
        - ${{ inputs.intent.deployment.branch }}
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 300
- name: dev-vp-capture
  labels:
    role: swamp
  dependsOn:
  - job: development-checkout
    condition:
      type: succeeded
  steps:
  - name: dev-vp-read-package
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", "package.json", "-exec", "cat", "--", "{}", "+"] }}
    guard: ${{ inputs.intent.deployment.variant != "development" || !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-pnpm_lock
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-package
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-1-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", "pnpm-lock.yaml", "-exec", "cat", "--", "{}", "+"] }}
    guard: ${{ inputs.intent.deployment.variant != "development" || !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-npm_lock
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-pnpm_lock
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-2-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", "package-lock.json", "-exec", "cat", "--", "{}", "+"] }}
    guard: ${{ inputs.intent.deployment.variant != "development" || !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-node_version
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-npm_lock
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-3-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", ".node-version", "-exec", "cat", "--", "{}", "+"] }}
    guard: ${{ inputs.intent.deployment.variant != "development" || !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-read-nvmrc
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-node_version
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-4-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["find", inputs.intent.application, "-maxdepth", "1", "-type", "f", "-name", ".nvmrc", "-exec", "cat", "--", "{}", "+"] }}
    guard: ${{ inputs.intent.deployment.variant != "development" || !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-home
    labels:
      role: swamp
    dependsOn:
    - step: dev-vp-read-nvmrc
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("ids-dev-vp-5-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("id-dev-vp-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - realpath
        - -s
        - --
        - .
    guard: ${{ inputs.intent.deployment.variant != "development" || !inputs.intent.deployment.needs_vp }}
  - name: dev-vp-store
    labels:
      role: swamp
