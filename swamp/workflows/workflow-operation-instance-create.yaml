id: c2c6c4a5-a667-4a81-9f5a-fae18fdf5d4a
name: operation-instance-create
description: Development Instance create from 209 in the legacy phases, one shipped script per phase through official SSH.
vaults: [orbit-control-inputs]
queueTimeout: 10
target: orbit-node-209
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: instance.create}
    intent: {type: object}
    # Names only: git_read, environment and setup, plus member_<Process id> for each development Process environment.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(?:instance-(?:git-operation-|create-environment-input-|create-)[1-9][0-9]*|process-instance-operation-[1-9][0-9]*-member-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: create
    steps:
      - name: assets
        target: orbit-node-209
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "ic-assets-" + run.id }}'
          methodName: create_assets
          inputs: {intent: '${{ inputs.intent }}'}
      # Prepare: refusals before the first write (account, destination, branch in use, origin, ownership marker).
      - name: prepare
        target: orbit-node-209
        dependsOn: [{step: assets, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ic-prepare-" + run.id }}'
          methodName: exec
          globalArgs: &ssh
            name: '${{ "ic-ssh-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
              hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}'}]
          inputs:
            hosts: name:target
            okExitCodes: any
            timeoutSec: 15
            argv: [timeout, '10', python3, -I, -c, '${{ steps.assets.outputs.prepare }}', '${{ steps.assets.outputs.intent_json }}']
      # Source: worktree or fresh checkout, fetch, the admitted branch; prints only the checked-out commit.
      - name: source
        target: orbit-node-209
        dependsOn: [{step: prepare, condition: {type: succeeded}}]
        guard: '${{ steps.prepare.outputs.exitCode != 0 }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ic-source-" + run.id }}'
          methodName: exec
          globalArgs: *ssh
          inputs:
            hosts: name:target
            okExitCodes: any
            timeoutSec: 25
            argv: [timeout, '20', python3, -I, -c, '${{ steps.assets.outputs.source }}', '${{ steps.assets.outputs.intent_json }}']
            stdin: '${{ vault.get(inputs.execution_secrets.git_read.vault, inputs.execution_secrets.git_read.key) }}'
      # Environment: write the .env the Gateway rendered at admission, in the application directory.
      - name: environment
        target: orbit-node-209
        dependsOn: [{step: source, condition: {type: succeeded}}]
        guard: '${{ steps.source.outputs.exitCode != 0 }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ic-environment-" + run.id }}'
          methodName: exec
          globalArgs: *ssh
          inputs:
            hosts: name:target
            okExitCodes: any
            timeoutSec: 15
            argv: [timeout, '10', python3, -I, -c, '${{ steps.assets.outputs.environment }}']
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'
      # Setup: the ordered Project setup list at the checkout root, each command within its admitted timeout
      # (the list totals at most 540 s); the first failed command stops it.
      - name: setup
        target: orbit-node-209
        dependsOn: [{step: environment, condition: {type: succeeded}}]
        guard: '${{ steps.environment.outputs.exitCode != 0 }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ic-setup-" + run.id }}'
          methodName: exec
          globalArgs: *ssh
          inputs:
            hosts: name:target
            okExitCodes: any
            timeoutSec: 545
            argv: [timeout, '540', python3, -I, -c, '${{ steps.assets.outputs.setup }}', '${{ steps.assets.outputs.runner }}']
            stdin: '${{ vault.get(inputs.execution_secrets.setup.vault, inputs.execution_secrets.setup.key) }}'
      # Processes: create and start the development Processes through the shared Process create workflow.
      - name: processes
        target: orbit-node-209
        dependsOn: [{step: setup, condition: {type: succeeded}}]
        guard: '${{ steps.setup.outputs.exitCode != 0 }}'
        forEach: {item: member, in: '${{ inputs.intent.processes }}'}
        task:
          type: workflow
          workflowIdOrName: operation-process-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.create
            intent: '${{ self.member.intent }}'
            execution_secrets: '${{ "member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["member_" + string(self.member.id)]} : {} }}'
      # Finish: map the first phase that did not finish to the public receipt.
      - name: finish
        target: orbit-node-209
        dependsOn:
          - {step: assets, condition: {type: always}}
          - {step: prepare, condition: {type: always}}
          - {step: source, condition: {type: always}}
          - {step: environment, condition: {type: always}}
          - {step: setup, condition: {type: always}}
          - {step: processes, condition: {type: always}}
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "ic-finish-" + run.id }}'
          methodName: create_result
          inputs:
            intent: '${{ inputs.intent }}'
            prepare: '${{ "prepare" in steps ? steps.prepare : null }}'
            source: '${{ "source" in steps ? steps.source : null }}'
            environment: '${{ "environment" in steps ? steps.environment : null }}'
            setup: '${{ "setup" in steps ? steps.setup : null }}'
            processes: '${{ inputs.intent.processes.map(p, ("processes-" + string(p.index)) in steps ? steps["processes-" + string(p.index)].status : "skipped") }}'
      - name: accepted
        target: orbit-node-209
        dependsOn: [{step: finish, condition: {type: succeeded}}]
        task: {type: assert, expr: 'steps.finish.outputs.ready == true', severity: high, message: The development Instance create did not complete.}
