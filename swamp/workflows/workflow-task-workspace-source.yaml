description: Set up one captured Tasks workspace on the provisioned VM as official
  SSH exec argv from 209, and fold the provision receipt; no script reaches the VM.
id: 46a068b0-6512-4c23-8729-e5bdc43c136c
inputs:
  additionalProperties: false
  properties:
    intent:
      type: object
    kind:
      enum:
      - tasks.provision
      type: string
    node_id:
      minimum: 1
      type: integer
    operation_id:
      minimum: 1
      type: integer
    vm:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - vm
  type: object
jobs:
- name: source
  steps:
  # The workspace connection pins the host key the VM child observed at enrollment.
  - name: guest
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-guest" }}'
      methodName: guest
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
    # Every failure lands in the receipt; this workspace run itself always ends with it.
    allowFailure: true
  - name: prepare
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-prepare" }}'
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        root: ${{ "/tmp/orbit-task-provision-"+run.id }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
  - name: directory
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-workspace
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ steps.guest.outputs.workspace }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    allowFailure: true
  - name: control
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-control" }}'
      methodName: execute
      inputs:
        run: 'umask 077

          mkdir -p -- "$ORBIT_ROOT"

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    allowFailure: true
  - name: clone_private
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-clone-private" }}'
      methodName: execute
      inputs:
        run: 'git clone --branch "$ORBIT_BRANCH" -- "$ORBIT_REPOSITORY" "$ORBIT_SOURCE"

          '
        env:
          ORBIT_BRANCH: ${{ inputs.intent.workspace.default_branch }}
          ORBIT_REPOSITORY: ${{ inputs.intent.workspace.repository }}
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source"
            }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.intent.git_authorization.vault,
            inputs.intent.git_authorization.key) }}
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: 'git@github.com:'
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: ssh://git@github.com/
    dependsOn:
    - step: control
      condition:
        type: succeeded
    guard: ${{ inputs.intent.git_authorization == null }}
    allowFailure: true
  - name: clone_public
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-clone-public" }}'
      methodName: execute
      inputs:
        run: 'git clone --branch "$ORBIT_BRANCH" -- "$ORBIT_REPOSITORY" "$ORBIT_SOURCE"

          '
        env:
          ORBIT_BRANCH: ${{ inputs.intent.workspace.default_branch }}
          ORBIT_REPOSITORY: ${{ inputs.intent.workspace.repository }}
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source"
            }}
          GIT_TERMINAL_PROMPT: '0'
    dependsOn:
    - step: control
      condition:
        type: succeeded
    guard: ${{ inputs.intent.git_authorization != null }}
    allowFailure: true
  - name: bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-bundle" }}'
      methodName: execute
      inputs:
        run: 'git -C "$ORBIT_SOURCE" bundle create "$ORBIT_BUNDLE" --all

          '
        env:
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source"
            }}
          ORBIT_BUNDLE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.bundle"
            }}
    dependsOn:
    - step: clone_private
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: clone_public
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    allowFailure: true
  - name: prepare_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/mkdir
        - -p
        - -m
        - '0700'
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
    dependsOn:
    - step: directory
      condition:
        type: succeeded
    allowFailure: true
  - name: copy_bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        src: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.bundle"
          }}
        dst: ${{ "/tmp/orbit-task-provision-"+run.id+"/source.bundle" }}
        direction: to
    dependsOn:
    - step: bundle
      condition:
        type: succeeded
    - step: prepare_remote
      condition:
        type: succeeded
    allowFailure: true
  - name: import
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - clone
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id+"/source.bundle" }}
        - ${{ inputs.intent.workspace.checkout_path }}
    dependsOn:
    - step: directory
      condition:
        type: succeeded
    - step: copy_bundle
      condition:
        type: succeeded
    allowFailure: true
  - name: origin
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - remote
        - set-url
        - origin
        - ${{ inputs.intent.workspace.repository }}
    dependsOn:
    - step: import
      condition:
        type: succeeded
    allowFailure: true
  - name: branch
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - switch
        - -c
        - ${{ inputs.intent.workspace.branch }}
        - ${{ inputs.intent.workspace.start_commit }}
    dependsOn:
    - step: origin
      condition:
        type: succeeded
    allowFailure: true
  - name: identity
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - rev-parse
        - HEAD
        - --abbrev-ref
        - HEAD
    dependsOn:
    - step: branch
      condition:
        type: succeeded
    allowFailure: true
  - name: inspect
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        okExitCodes: any
        argv:
        - /usr/bin/env
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - stat
        - -c
        - '%n|%F|%s'
        - --
        - composer.json
        - ${{ inputs.intent.workspace.entry_point }}
    dependsOn:
    - step: identity
      condition:
        type: succeeded
    allowFailure: true
  - name: composer
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        src: ${{ inputs.intent.workspace.checkout_path + "/composer.json" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
        timeoutSec: 60
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: control
      condition:
        type: succeeded
    guard: ${{ inputs.intent.workspace.skip_profile || !steps.inspect.outputs.stdout.contains("composer.json|regular")
      }}
    allowFailure: true
  - name: profile
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-profile" }}'
      methodName: profile
      inputs:
        intent: ${{ inputs.intent }}
        identity: ${{ steps.identity.outputs.stdout }}
        files: ${{ steps.inspect.outputs.stdout }}
        composer: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
    dependsOn:
    - step: identity
      condition:
        type: succeeded
    - step: inspect
      condition:
        type: succeeded
    - step: composer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    allowFailure: true
  - name: setup-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv: ${{ steps.prepare.outputs.setup[self._index] }}
        timeoutSec: ${{ self.setup.timeout_seconds }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    forEach:
      item: setup
      in: ${{ inputs.intent.workspace.setup }}
    concurrency: 1
    guard: ${{ has(steps.profile.outputs.error_code) || (self._index > 0 && (!("setup-"+string(self._index-1)
      in steps) || steps["setup-"+string(self._index-1)].status != "succeeded")) }}
    allowFailure: true
  - name: setup_copy
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        recursive: true
        src: ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/" }}
        timeoutSec: 60
    dependsOn:
    - step: prepare_remote
      condition:
        type: succeeded
    - step: control
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    allowFailure: true
  - name: setup_output
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-setup-output" }}'
      methodName: setup_output
      inputs:
        intent: ${{ inputs.intent }}
        directory: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/output" }}
    dependsOn:
    - step: setup_copy
      condition:
        type: succeeded
    allowFailure: true
  # The proof club token's private directory, owned by orbit.
  - name: proof_club_directory
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -d
        - -m
        - '0700'
        - -o
        - orbit
        - -g
        - orbit
        - --
        - /home/orbit/.config/swamp
  # install cannot replace an existing file from stdin; drop any previous token or link first.
  - name: proof_club_previous
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_directory
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '30'
        - rm
        - -f
        - --
        - /home/orbit/.config/swamp/club-api-key
  # The token from the vault on SSH stdin, written 0600 for orbit; it never enters argv or history.
  - name: proof_club
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_previous
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -m
        - '0600'
        - -o
        - orbit
        - -g
        - orbit
        - /dev/stdin
        - /home/orbit/.config/swamp/club-api-key
        stdin: ${{ vault.get(inputs.intent.proof_club.vault, inputs.intent.proof_club.key) }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-result" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
        steps: ${{ steps }}
    dependsOn:
    - step: guest
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    - step: directory
      condition:
        type: always
    - step: control
      condition:
        type: always
    - step: clone_private
      condition:
        type: always
    - step: clone_public
      condition:
        type: always
    - step: bundle
