[package]
name = "orbit-spike-executor3"
version = "0.0.0"
edition = "2021"
publish = false

# SPIKE(signed-orders) round 3: executor with in-process sleep and wake. Its own workspace, outside apps/agent's lockfile.
[workspace]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[profile.release]
opt-level = 3
