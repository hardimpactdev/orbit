id: 00fd4b62-f72a-4795-9924-a48704608c88
name: operation-node-role-add
description: Apply role state in idempotent Ansible phases; keep signing, bootstrap and initialization native.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind:
      type: string
      enum: [node.role_add, node.role_converge]
    parent_run_id: {type: string}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum: [orbit-control-inputs]
          key: {type: string, pattern: '^(node-role-operation-[1-9][0-9]*-[a-z-]+|process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: intent
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
- name: private-metrics_password
  labels: {role: swamp}
  steps:
  - name: Write the private input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-private-metrics-password-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_FILE"]).write_text(os.environ["ORBIT_VALUE"])'' '
        env: {ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-metrics_password" }}', ORBIT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.metrics_password.key) }}'}
    guard: ${{ !has(inputs.execution_secrets.metrics_password) }}
  dependsOn:
  - job: intent
    condition: {type: succeeded}
- name: private-websocket_environment
  labels: {role: swamp}
  steps:
  - name: Write WebSocket input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-private-websocket-environment-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_FILE"]).write_text(os.environ["ORBIT_VALUE"])'' '
        env: {ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-websocket_environment" }}', ORBIT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.websocket_environment.key) }}'}
    guard: ${{ !has(inputs.execution_secrets.websocket_environment) }}
  dependsOn:
  - job: private-metrics_password
    condition: {type: succeeded}
- name: private-analytics_environment
  labels: {role: swamp}
  steps:
  - name: Write Analytics input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-private-analytics-environment-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'umask 077

          python3 -c ''import os,pathlib; pathlib.Path(os.environ["ORBIT_FILE"]).write_text(os.environ["ORBIT_VALUE"])'' '
        env: {ORBIT_FILE: '${{ "/tmp/orbit-ansible-" + run.id + "/secret-analytics_environment" }}', ORBIT_VALUE: '${{ vault.get("orbit-control-inputs",
            inputs.execution_secrets.analytics_environment.key) }}'}
    guard: ${{ !has(inputs.execution_secrets.analytics_environment) }}
  dependsOn:
  - job: private-websocket_environment
    condition: {type: succeeded}
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ORBIT_KIND: '${{
            inputs.kind }}'}
  dependsOn:
  - job: private-analytics_environment
    condition: {type: succeeded}
- name: phase_0
  labels: {role: swamp}
  steps:
  - name: Read the OS release
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-add-platform-"+string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-add-platform-"+string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: [cat, /etc/os-release]
        timeoutSec: 20
  dependsOn:
  - job: input
    condition: {type: succeeded}
- name: phase_1
  labels: {role: swamp}
  steps:
  - name: Require supported Ubuntu
    labels: {role: swamp}
    task: {type: assert, expr: 'steps["Read the OS release"].outputs.stdout.split("\n").exists(line,line in ["ID=ubuntu","ID=\"ubuntu\""]) &&
        inputs.intent.releases.exists(r,steps["Read the OS release"].outputs.stdout.split("\n").exists(line,line == "VERSION_CODENAME="+r || line
        == "VERSION_CODENAME=\""+r+"\""))', severity: high, message: The role requires an admitted Ubuntu release.}
  dependsOn:
  - job: phase_0
    condition: {type: succeeded}
- name: ansible
  labels: {role: swamp}
  steps:
  - name: Install Python venv
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-0-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-0-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout","900","apt-get","-o","DPkg::Lock::Timeout=300","install","--yes"] + inputs.intent.packages.filter(p, p != "caddy") }}'
        timeoutSec: 905
  - name: Create Ansible venv
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-1-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-1-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', python3, -m, venv, /opt/orbit/ansible/venv]
        timeoutSec: 905
    dependsOn:
    - step: Install Python venv
      condition: {type: succeeded}
  - name: Write Ansible pin
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    dependsOn:
    - step: Create Ansible venv
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "ansible-pins-requirements-txt-"+string(inputs.node_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true, path: /opt/orbit/ansible/requirements.txt, content: '${{
          steps["Write the intent"].outputs.requirements }}', owner: root, group: root, mode: '0644', ensure: present}
      inputs: {}
  - name: Write collection pins
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    dependsOn:
    - step: Write Ansible pin
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "ansible-pins-requirements-yml-"+string(inputs.node_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true, path: /opt/orbit/ansible/requirements.yml, content: '${{
          steps["Write the intent"].outputs.collections }}', owner: root, group: root, mode: '0644', ensure: present}
      inputs: {}
  - name: Install Ansible
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-2-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-2-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '900', /opt/orbit/ansible/venv/bin/pip, install, --disable-pip-version-check, -r, /opt/orbit/ansible/requirements.txt]
        timeoutSec: 905
    dependsOn:
    - step: Write collection pins
      condition: {type: succeeded}
  - name: Install collections
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.swamp == null }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "ansible-bootstrap-3-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "ansible-bootstrap-3-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{
            inputs.intent.ssh.identity_file }}'}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '900', /opt/orbit/ansible/venv/bin/ansible-galaxy, collection, install, -r, /opt/orbit/ansible/requirements.yml, -p, /opt/orbit/ansible/collections]
        timeoutSec: 905
    dependsOn:
    - step: Install Ansible
      condition: {type: succeeded}
  dependsOn:
  - job: phase_1
    condition: {type: succeeded}
- name: prerequisites
  labels: {role: swamp}
  steps:
  - name: Apply role prerequisites
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-prerequisites-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags prerequisites
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: &id001 {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{
            steps["Write the intent"].outputs.assets + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s
            -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}',
          ANSIBLE_FORCE_COLOR: '0'}
  dependsOn:
  - job: ansible
    condition: {type: succeeded}
- name: tools_read
  labels: {role: swamp}
  dependsOn: [{job: prerequisites, condition: {type: succeeded}}]
  steps:
  - name: Read Tool Manager accounts
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-tools_read-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags tools-read "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: tools_plan
  labels: {role: swamp}
  dependsOn: [{job: tools_read, condition: {type: succeeded}}]
  steps:
  - name: Compose tools resources
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ "ansible-role-compose-tools-" + string(inputs.node_id) }}
      methodName: composeRole
      inputs: {path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}', phase: tools}
  - name: Write literal tools variables
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Compose tools resources, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-vars-tools-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" node.role_add.composed
        env: *id001
- name: phase_13
  labels: {role: swamp}
  dependsOn: [{job: tools_plan, condition: {type: succeeded}}]
  steps:
  - name: Set up Tool Managers
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-phase_13-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags tools "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: node
  labels: {role: swamp}
  steps:
  - name: Apply the role on the Node
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-node-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags node "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: phase_13
    condition: {type: succeeded}
- name: analytics_storage
  labels: {role: swamp}
  dependsOn: [{job: node, condition: {type: succeeded}}]
  steps:
  - name: Open Analytics storage
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.runtime.analytics == null || inputs.intent.firewall.desired.filter(rule, "docker0" in rule).size() == 0 }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-storage-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags storage-firewall "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: analytics
  labels: {role: swamp}
  dependsOn: [{job: analytics_storage, condition: {type: succeeded}}]
  steps:
  - name: Apply Analytics runtime-0
    guard: ${{ inputs.kind == "node.role_converge" || inputs.intent.runtime.analytics == null }}
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-analytics-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 2100 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags analytics "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: readiness
  labels: {role: swamp}
  dependsOn: [{job: analytics, condition: {type: succeeded}}]
  steps:
  - name: Wait for Analytics
    labels: {role: swamp}
    guard: ${{ inputs.kind == "node.role_converge" || inputs.intent.runtime.analytics == null }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-ready-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags readiness "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: swamp_runtime_job
  labels: {role: swamp}
  dependsOn: [{job: readiness, condition: {type: succeeded}}]
  steps:
  - name: Install Swamp
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-swamp_runtime_job-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags swamp "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: phase_51
  labels: {role: swamp}
  steps:
  - name: Sign role certificates
    labels: {role: swamp}
    writes: true
    forEach: {item: leaf, in: '${{ inputs.intent.certificates.leaves }}'}
    task:
      type: workflow
      workflowIdOrName: node-role-certificate-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        parent_run_id: '${{ has(inputs.parent_run_id) && inputs.parent_run_id != "" ? inputs.parent_run_id : run.id }}'
        leaf: ${{ self.leaf }}
        ssh:
          name: ${{ "role-add-certificate-"+string(self.leaf.node_id)+"-"+self.leaf.scope }}
          transport: {kind: ssh, user: '${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.user
              }}', port: '${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.port }}', identityFile: '${{
              inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.identity_file }}'}
          hosts:
          - name: target
            address: ${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.host }}
            transport: {hostKeys: '${{ inputs.intent.certificates.connections.filter(c,c.node_id == self.leaf.node_id)[0].ssh.target.host_keys
                }}'}
  dependsOn:
  - job: swamp_runtime_job
    condition: {type: succeeded}
- name: publication_read
  labels: {role: swamp}
  dependsOn: [{job: phase_51, condition: {type: succeeded}}]
  steps:
  - name: Read role publications
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-publication_read-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags publication-read "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: publication_plan
  labels: {role: swamp}
  dependsOn: [{job: publication_read, condition: {type: succeeded}}]
  steps:
  - name: Compose publication resources
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ "ansible-role-compose-publication-" + string(inputs.node_id) }}
      methodName: composeRole
      inputs: {path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}', phase: publication}
  - name: Write literal publication variables
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Compose publication resources, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-vars-publication-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" node.role_add.composed
        env: *id001
- name: phase_52
  labels: {role: swamp}
  dependsOn: [{job: publication_plan, condition: {type: succeeded}}]
  steps:
  - name: Publish PHP pools
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-phase_52-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags php "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: publication
  labels: {role: swamp}
  steps:
  - name: Publish role sites
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-publication-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 180 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags publication
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: phase_52
    condition: {type: succeeded}
- name: firewall
  labels: {role: swamp}
  steps:
  - name: Open the firewall
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-firewall-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags firewall
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: publication
    condition: {type: succeeded}
- name: phase_56
  labels: {role: swamp}
  dependsOn: [{job: firewall, condition: {type: succeeded}}]
  steps:
  - name: Publish private DNS
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-phase_56-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 900 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" -e "run_folder=$ORBIT_RUN" --tags dns "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: exporters
  labels: {role: swamp}
  steps:
  - name: Add the exporters
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-exporters-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags exporters
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
    guard: ${{ inputs.intent.exporters.size() == 0 }}
  dependsOn:
  - job: phase_56
    condition: {type: succeeded}
- name: prometheus
  labels: {role: swamp}
  steps:
  - name: Publish Prometheus
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-prometheus-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags prometheus
          "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
    guard: ${{ inputs.intent.prometheus == null }}
  dependsOn:
  - job: exporters
    condition: {type: succeeded}
- name: role
  labels: {role: swamp}
  steps:
  - name: Check the role
    labels: {role: swamp}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-role-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 60 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags check "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
  dependsOn:
  - job: prometheus
    condition: {type: succeeded}
- name: analytics_cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: analytics, condition: &analytics_settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: readiness, condition: *analytics_settled}
  steps:
  - name: Remove init containers
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.kind == "node.role_converge" || inputs.intent.runtime.analytics == null }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-init-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "@$ORBIT_RUN/composed.yml" --tags cleanup "$ORBIT_ANSIBLE/operation-node-role-add.yml"
        env: *id001
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: "intent", condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: "private-metrics_password", condition: *settled}
  - {job: "private-websocket_environment", condition: *settled}
  - {job: "private-analytics_environment", condition: *settled}
  - {job: "input", condition: *settled}
  - {job: "phase_0", condition: *settled}
  - {job: "phase_1", condition: *settled}
  - {job: "ansible", condition: *settled}
  - {job: "prerequisites", condition: *settled}
  - {job: "tools_read", condition: *settled}
  - {job: "tools_plan", condition: *settled}
  - {job: "phase_13", condition: *settled}
  - {job: "node", condition: *settled}
  - {job: "analytics_storage", condition: *settled}
  - {job: "analytics", condition: *settled}
  - {job: "readiness", condition: *settled}
  - {job: "swamp_runtime_job", condition: *settled}
  - {job: "phase_51", condition: *settled}
  - {job: "publication_read", condition: *settled}
  - {job: "publication_plan", condition: *settled}
  - {job: "phase_52", condition: *settled}
  - {job: "publication", condition: *settled}
  - {job: "firewall", condition: *settled}
  - {job: "phase_56", condition: *settled}
  - {job: "exporters", condition: *settled}
  - {job: "prometheus", condition: *settled}
  - {job: "role", condition: *settled}
  - {job: "analytics_cleanup", condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-role-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
