---
# Incus on a task VM, initialised once: a directory storage pool, the default profile's root disk and, on a task VM, the nested
# network. intent.nested names the nested subnet and the bridge; it is null on an image, which gets the pool and
# the root disk only, because the subnet belongs to a task VM. The fleet phase builds the nested containers into this network.
# Incus first creates/truncates config.yml, then writes it. Prepare the SSH user's own config serially during provisioning, before proof
# restores or other parallel Incus calls. The root-owned config made by the rest of this phase does not protect that user.
- name: Prepare the Incus client config
  become: true
  become_user: "{{ orbit_user }}"
  ansible.builtin.command:
    argv: [incus, list, --project, default, --format, csv]
    creates: "{{ orbit_home }}/.config/incus/config.yml"
  environment: { HOME: "{{ orbit_home }}" }
- name: Read the Incus storage pools
  ansible.builtin.command: { argv: [incus, storage, list, --format, csv] }
  register: incus_pools
  changed_when: false
- name: Read the Incus networks
  ansible.builtin.command: { argv: [incus, network, list, --format, csv] }
  register: incus_networks
  changed_when: false
- name: Work out what is missing
  ansible.builtin.set_fact:
    incus_seed_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_incus_topology--seed
    incus_pool_missing: "{{ incus_pools.stdout_lines | select('match', '^default,') | list | length == 0 }}"
    incus_network_missing: >-
      {{ intent.nested is not none
         and (incus_networks.stdout_lines | select('match', '^' ~ intent.nested.interface ~ ',')
              | list | length == 0) }}
    # The bridge takes the first address of the nested subnet.
    incus_bridge: >-
      {{ (intent.nested.subnet.split('/')[0].split('.')[:3] + ['1']) | join('.') ~ '/' ~ intent.nested.subnet.split('/')[1]
         if intent.nested is not none else '' }}
- name: Initialise Incus
  when: incus_pool_missing or incus_network_missing
  ansible.builtin.command: { argv: [incus, admin, init, --preseed] }
  args:
    stdin: "{{ preseed | to_nice_yaml }}"
  vars:
    pool:
      - { name: default, driver: dir }
    root_disk:
      - { name: default, devices: { root: { path: /, pool: default, type: disk } } }
    network:
      - name: "{{ intent.nested.interface | default('') }}"
        type: bridge
        config: { ipv4.address: "{{ incus_bridge }}", ipv4.nat: "true", ipv6.address: none }
    preseed: >-
      {{ ({'storage_pools': pool, 'profiles': root_disk} if incus_pool_missing | bool else {})
         | combine({'networks': network} if incus_network_missing | bool else {}) }}
  changed_when: true
# The topology seed disk of a task VM holds the nested fleet (system containers) as Incus volumes on a btrfs file system, in the pool
# `topology-seed`. The base VM makes the pool once, on its blank seed volume, and keeps it in its Incus database; a task VM copied from the
# base has the pool in the database it copied, with a clone of the seed. `incus storage create` refuses to format a disk that holds a file
# system, so this never overwrites a seed. A disk with a file system that the database of this VM does not know is refused.
- name: Look for the topology seed disk
  when: intent.nested is not none
  ansible.builtin.stat: { path: "{{ incus_seed_disk }}" }
  register: incus_seed
- name: Work out whether the topology seed pool is missing
  ansible.builtin.set_fact:
    incus_seed_attach: >-
      {{ intent.nested is not none and incus_seed.stat.exists and (incus_pools.stdout_lines | select('match', '^topology-seed,') | list | length == 0) }}
- name: Read the file system of the topology seed disk
  when: incus_seed_attach | bool
  ansible.builtin.command: { argv: [timeout, "30", blkid, --output, value, --match-tag, TYPE, "{{ incus_seed_disk }}"] }
  register: incus_seed_fs
  changed_when: false
  failed_when: incus_seed_fs.rc not in [0, 2]
- name: Refuse a topology seed disk that holds an unknown file system
  when: (incus_seed_attach | bool) and incus_seed_fs.rc == 0
  ansible.builtin.fail: { msg: "The topology seed disk holds {{ incus_seed_fs.stdout }}, but the Incus of this VM knows no pool on it." }
- name: Create the topology seed pool on a blank disk
  when: (incus_seed_attach | bool) and incus_seed_fs.rc == 2
  ansible.builtin.command: { argv: [timeout, "120", incus, storage, create, topology-seed, btrfs, "source={{ incus_seed_disk }}"] }
  changed_when: true
