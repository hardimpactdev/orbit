id: 8882537c-e250-4b80-8690-ce8c0fa419b8
name: operation-route-create
description: "Route create in the chart's seven steps; Node work through official cfgmgmt and SSH behaviors (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    parent_run_id: {type: string}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: route.create}
    # The signed certificates, when the caller already made and signed the CSRs; none from a plain route:create.
    signed: {type: array, items: {type: string}}
    # The Node whose web-root access and APP_URL the caller has already set (an Instance create does it in its checkout phase).
    prepared: {type: string}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: create
  labels: {role: swamp}
  steps:
    # Per leaf: a Node-local key and its public CSR (route-create-csr).
  - name: 'Make a CSR on the Node'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: leaf, in: '${{ has(inputs.signed) ? [] : inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-csr
      inputs:
        intent: '${{ inputs.intent }}'
        leaf: '${{ self.leaf }}'
    # Per leaf: 209 has the CSR signed; the one Gateway call (route-create-sign).
  - name: 'Sign the CSR'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: leaf, in: '${{ has(inputs.signed) ? [] : inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        parent_run_id: '${{ has(inputs.parent_run_id) && inputs.parent_run_id != "" ? inputs.parent_run_id : run.id }}'
        leaf: '${{ inputs.intent.leaves[self.leaf] }}'
        request: '${{ steps["Make a CSR on the Node-" + string(self.leaf)].outputs.csr.stdout }}'
    # Cluster Route: the Router's LAN address may reach each workload on 443.
  - name: 'Allow the Router on LAN'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: rule, in: '${{ inputs.intent.lan }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/firewall'
      behaviorName: '${{ ("route-lan-" + string(self.rule.node_id) + "-" + string(self.rule.port) + "-" + self.rule.source.split("/").join("-")).split(".").join("-") }}'
      methodName: apply
      globalArgs: {port: '${{ self.rule.port }}', protocol: '${{ self.rule.protocol }}', action: allow, ensure: present, source: '${{ self.rule.source }}',
        nodeHost: '${{ inputs.intent.nodes[string(self.rule.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(self.rule.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(self.rule.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(self.rule.node_id)].identity_file }}', become: true}
      inputs: {}
    # Per Node: certificate, web root, pools, Caddyfile, APP_URL and .env (route-create-site).
  - name: 'Install cert, publish site'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Allow the Router on LAN', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.site_nodes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
        signed: '${{ has(inputs.signed) ? inputs.signed : inputs.intent.leaf_indexes.map(i, steps["Sign the CSR-" + string(i)].outputs.sign.stdout) }}'
        prepared: '${{ has(inputs.prepared) ? inputs.prepared : "" }}'
    # From 209 to each serving Node and the Router on 443 with the Route domain as SNI; a failed chain fails the step.
  - name: 'Probe the site over TLS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Allow the Router on LAN', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: probe, in: '${{ inputs.intent.probes }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "route-probe-209-" + string(self.probe.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "route-probe-209-" + string(self.probe.node_id) }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.probe_ssh.target.user }}'
          port: '${{ inputs.intent.probe_ssh.target.port }}'
          identityFile: '${{ inputs.intent.probe_ssh.identity_file }}'
        hosts:
        - name: control
          address: '${{ inputs.intent.probe_ssh.target.host }}'
          transport: {hostKeys: '${{ inputs.intent.probe_ssh.target.host_keys }}'}
      inputs:
        hosts: name:control
        argv: '${{ ["timeout", "20", "openssl", "s_client", "-no_ign_eof", "-connect", self.probe.address + ":443", "-servername", self.probe.domain, "-verify_hostname", self.probe.domain, "-verify_return_error", "-CAfile", "/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"] }}'
        timeoutSec: 30
    # Public Route: the Ingress site and its ports 80 and 443 (route-create-ingress).
  - name: 'Open the Ingress edge'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Allow the Router on LAN', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Probe the site over TLS', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: site, in: '${{ inputs.intent.ingress }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-ingress
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.site.node_id }}'
    # Only outside the TLD: records, catalog, then dnsmasq (route-create-dns). It needs only the signed certificate step, so it runs beside the site.
  - name: 'Publish private DNS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Allow the Router on LAN', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: vpn, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-dns
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.vpn.node_id }}'
