id: 38e1a160-f17b-4d31-b77c-36dfd78ed570
name: operation-analytics-enable-direct
description: Manage one Plausible site then publish captured tracking Routes through official SSH from209.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: analytics.enable
    intent:
      type: object
      properties:
        certificates:
          type: array
          items:
            type: object
        router:
          type: array
          items:
            type: object
        probes:
          type: array
          items:
            type: object
        ingress:
          type: array
          items:
            type: object
        dns:
          type: array
          items:
            type: object
        retire:
          type: array
          items:
            type: object
        cleanup:
          type: array
          items:
            type: object
        base_url:
          type: string
        site:
          type: object
        result_json:
          type: string
      required:
      - certificates
      - router
      - probes
      - ingress
      - dns
      - retire
      - cleanup
      - base_url
      - site
      - result_json
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        plausible_credentials:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^analytics-plausible-[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - plausible_credentials
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-site'
      behaviorName: ${{ "analytics-assets-" + run.id }}
      methodName: assets
      inputs:
        base_url: ${{ inputs.intent.base_url }}
        site: ${{ inputs.intent.site }}
  - name: workspace
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-workspace-" + run.id }}
      methodName: execute
      inputs:
        run: 'umask 077

          mktemp -d'
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: login_form
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-login_form-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.login_form }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
    dependsOn:
    - step: workspace
      condition:
        type: succeeded
  - name: login
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-login-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.login }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
          ORBIT_ANALYTICS_CREDENTIALS: ${{ vault.get(inputs.execution_secrets.plausible_credentials.vault, inputs.execution_secrets.plausible_credentials.key)
            }}
    dependsOn:
    - step: login_form
      condition:
        type: succeeded
  - name: site_form
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-site_form-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.site_form }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
    dependsOn:
    - step: login
      condition:
        type: succeeded
  - name: inspect
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-inspect-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.inspect }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
    dependsOn:
    - step: site_form
      condition:
        type: succeeded
  - name: decide
    target: orbit-node-209
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-site'
      behaviorName: ${{ "analytics-decision-" + run.id }}
      methodName: decide
      inputs:
        stdout: ${{ steps.inspect.outputs.stdout }}
- name: site
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
  steps:
  - name: create
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-create-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.create }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
    guard: ${{ steps.decide.outputs.action != "create" }}
  - name: update
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-update-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.update }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
          ORBIT_ANALYTICS_CURRENT_DOMAIN: ${{ steps.decide.outputs.current_domain }}
    guard: ${{ steps.decide.outputs.action != "update" }}
- name: goals
  dependsOn:
  - job: site
    condition:
      type: succeeded
  steps:
  - name: goals
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-goals-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.goals }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
          ORBIT_ANALYTICS_CREDENTIALS: ${{ vault.get(inputs.execution_secrets.plausible_credentials.vault, inputs.execution_secrets.plausible_credentials.key)
            }}
          ORBIT_ANALYTICS_GOALS: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.assets.outputs.goal_batches }}
- name: verify
  dependsOn:
  - job: goals
    condition:
      type: succeeded
  steps:
  - name: verify
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-verify-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.verify }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
  - name: stats
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-stats-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.stats }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
          ORBIT_ANALYTICS_CREDENTIALS: ${{ vault.get(inputs.execution_secrets.plausible_credentials.vault, inputs.execution_secrets.plausible_credentials.key)
            }}
    dependsOn:
    - step: verify
      condition:
        type: succeeded
- name: session-cleanup
  dependsOn:
  - job: verify
    condition:
      type: always
  steps:
  - name: logout
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-logout-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 -B "${{ steps.assets.outputs.logout }}"'
        env:
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
    guard: ${{ !("workspace" in steps) || steps.workspace.status != "succeeded" }}
  - name: remove-session
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-remove-session-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          rm -rf -- "$ORBIT_ANALYTICS_SESSION"'
        env:
          ORBIT_ANALYTICS_SESSION: ${{ steps.workspace.outputs.stdout.trim() }}
    guard: ${{ !("workspace" in steps) || steps.workspace.status != "succeeded" }}
    dependsOn:
    - step: logout
      condition:
        type: always
- name: certificates
  dependsOn:
  - job: session-cleanup
    condition:
      type: succeeded
  - job: verify
    condition:
      type: succeeded
  steps:
  - name: certificates
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-certificate-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.item.leaf.node_id }}
          leaves: ${{ inputs.intent.certificates.filter(cert,cert.leaf.node_id == self.item.leaf.node_id).map(cert,cert.leaf) }}
          control_node_id: 209
          connection: ${{ self.item.connection }}
          host_keys: ${{ self.item.host_keys }}
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
        restoring: false
    forEach:
      item: item
      in: ${{ inputs.intent.certificates.filter(item,inputs.intent.certificates.filter(first,first.leaf.node_id == item.leaf.node_id)[0].leaf.scope == item.leaf.scope) }}
- name: router
  dependsOn:
  - job: certificates
    condition:
      type: succeeded
  steps:
  - name: router
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.router }}
- name: probes
  dependsOn:
  - job: router
    condition:
      type: succeeded
  steps:
  - name: probes
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: cluster-router-probe
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.probes }}
- name: ingress
  dependsOn:
  - job: probes
    condition:
      type: succeeded
  steps:
  - name: ingress
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.ingress }}
- name: dns
  dependsOn:
  - job: ingress
    condition:
      type: succeeded
  steps:
  - name: dns
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.dns }}
- name: grace
  dependsOn:
  - job: dns
    condition:
      type: succeeded
  steps:
  - name: grace
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-dns-grace
      inputs: {}
    guard: ${{ inputs.intent.dns.size() == 0 }}
- name: retire
  dependsOn:
  - job: grace
    condition:
      type: succeeded
  steps:
  - name: retire
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.retire }}
- name: cleanup
  dependsOn:
  - job: retire
    condition:
      type: succeeded
  steps:
  - name: cleanup
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-certificate-remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
        restoring: false
    forEach:
      item: item
      in: ${{ inputs.intent.cleanup }}
- name: finish
  dependsOn:
  - job: cleanup
    condition:
      type: succeeded
  steps:
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '%s\n' "$ORBIT_ANALYTICS_RESULT"
        env:
          ORBIT_ANALYTICS_RESULT: ${{ inputs.intent.result_json }}
