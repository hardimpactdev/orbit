name: Orbit CLI Binary

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'packages/php-sdk/**'
      - 'apps/gateway/resources/machine-software/**'
      - 'apps/gateway/resources/remote/php/**'
      - 'apps/gateway/resources/remote/lib/**'
      - 'apps/gateway/resources/remote/bootstrap.py'
      - '.github/actions/php/**'
      - 'bin/php-build'
      - 'bin/orbit-build-cli-binary'
      - 'bin/orbit-version'
      - '.github/workflows/orbit-cli-binary.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Full commit SHA to build.
        required: true
        type: string
      version:
        description: Version the binaries report, 0.N.0.
        required: true
        type: string

permissions:
  contents: read

# Only PR runs share a group. Release calls and manual builds must not cancel each other.
concurrency:
  group: cli-binary-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'

jobs:
  # Every target is built on Linux. PHPacker does not compile: it appends the PHAR to a prebuilt static PHP for the
  # target, so the host only needs PHP and Composer. The macOS binary is then run on a hosted Mac that needs no PHP.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
            platform: linux
            architecture: x64
            artifact: orbit-linux-x64
            path: apps/cli/builds/dist/linux/linux-x64
            native: true
          - target: linux-arm64
            runner: ubuntu-26.04-arm
            platform: linux
            architecture: arm
            artifact: orbit-linux-arm64
            path: apps/cli/builds/dist/linux/linux-arm
            native: true
          - target: macos-arm64
            runner: ubuntu-26.04
            platform: mac
            architecture: arm
            artifact: orbit-macos-arm64
            path: apps/cli/builds/dist/mac/mac-arm
            native: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # The recipe's exact PHP build and pinned Composer (ADR 0216), as in every other PHP job. It only builds the
      # PHAR; the binary runs PHPacker's static PHP.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none

      - name: Read build version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION:-$(bin/orbit-version)}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install CLI dependencies
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --optimize-autoloader

      - name: Install isolated PHPacker
        run: composer install --working-dir=apps/cli/phpacker --no-interaction --prefer-dist

      - name: Build binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: bin/orbit-build-cli-binary "${{ matrix.platform }}" "${{ matrix.architecture }}" "$VERSION"

      - name: Run the binary on its own platform
        if: matrix.native
        env:
          BINARY: ${{ matrix.path }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          reported="$(env -i HOME="$home" PATH=/usr/bin:/bin "$BINARY" --version)"
          echo "$reported"
          test "$reported" = "Orbit ${VERSION}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # The release waits for this job too, so a macOS binary that does not start is never published.
  run-macos:
    name: Run macos-arm64
    needs: build
    runs-on: macos-26
    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: orbit-macos-arm64
          path: binary

      - name: Run the binary on its own platform
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          chmod 0755 binary/mac-arm
          home="$(mktemp -d)"
          reported="$(env -i HOME="$home" PATH=/usr/bin:/bin binary/mac-arm --version)"
          echo "$reported"
          test "$reported" = "Orbit ${VERSION}"
