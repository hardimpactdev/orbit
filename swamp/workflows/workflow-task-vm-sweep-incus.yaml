id: bf32f147-daa5-451f-af8c-2ae4eb680071
name: task-vm-sweep-incus
description: Sweep the captured incus inventory in one bounded provider phase.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.sweep_host
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: sweep
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: ${{ "swp-assets-"+run.id }}
      methodName: assets
      inputs:
        intent: ${{ inputs.intent }}
  - name: sweep
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "swp-sweep-"+run.id }}
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - --signal=TERM
        - --kill-after=5s
        - 220s
        - python3
        - -I
        - -c
        - ${{ steps.assets.outputs.script_body }}
        stdin: ${{ steps.assets.outputs.input_json }}
        okExitCodes:
        - 0
        - 1
      globalArgs:
        name: ${{ "swp-sweep-"+run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
queueTimeout: 10
