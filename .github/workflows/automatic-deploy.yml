name: Automatic deployment policy
on:
  pull_request:
    paths:
      - 'extensions/behaviors/automatic-deploy/**'
      - 'tests/automatic_deploy_test.ts'
      - 'tests/_support/automatic_deploy.ts'
      - 'workflows/workflow-automatic-production-deploy.yaml'
      - 'docs/automatic-deploy.md'
      - '.github/workflows/automatic-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/behaviors/automatic-deploy/**'
      - 'tests/automatic_deploy_test.ts'
      - 'tests/_support/automatic_deploy.ts'
      - 'workflows/workflow-automatic-production-deploy.yaml'
      - 'docs/automatic-deploy.md'
      - '.github/workflows/automatic-deploy.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: [self-hosted, hardimpact]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Check extension and tests
        run: |
          deno fmt --check extensions/behaviors/automatic-deploy tests/automatic_deploy_test.ts tests/_support/automatic_deploy.ts
          deno lint extensions/behaviors/automatic-deploy tests/automatic_deploy_test.ts tests/_support/automatic_deploy.ts
          deno check extensions/behaviors/automatic-deploy/mod.ts extensions/behaviors/automatic-deploy/mod_test.ts extensions/behaviors/automatic-deploy/gateway_test.ts tests/automatic_deploy_test.ts
