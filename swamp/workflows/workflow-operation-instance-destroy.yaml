id: 10c1e646-19cd-4527-8be5-01f524976346
name: operation-instance-destroy
description: Development Instance destroy from 209 in the chart's phases, one shipped script per Node phase through official SSH.
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: instance.destroy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^[a-z][a-z0-9_.-]{0,254}$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: destroy
  labels:
    role: swamp
  steps:
  - name: Prepare container removal
    writes: true
    labels: &id004
      role: swamp
    guard: ${{ !("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ "id-input-" + string(inputs.node_id) }}
      methodName: write
      inputs:
        intent: ${{ inputs.intent }}
        path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
  - name: Write the git credential
    labels:
      role: swamp
    writes: true
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (size(inputs.intent.push_check_paths) == 0) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "instance-destroy-credential-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs:
        path: ${{ "/tmp/orbit-git-credential-" + run.id }}
        ensure: present
        mode: '0600'
        content: ${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.execution_secrets.git_credential.key) }}
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
      inputs: {}
    dependsOn:
    - step: Prepare container removal
      condition:
        type: always
  - name: Check work is pushed
    labels:
      role: swamp
    dependsOn:
    - step: Write the git credential
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (size(inputs.intent.push_check_paths) == 0 || steps.exists(k, steps[k].status == "failed"))
      }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &id003
        name: ${{ "instance-destroy-ssh-" + string(inputs.node_id) }}
        transport: &id001
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts: &id002
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 160
        argv: '${{ ["/usr/bin/timeout", "150", "/bin/sh", "-c", "c=\"$1\"; shift; for p; do GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git -c core.hooksPath=/dev/null
          -c core.fsmonitor=false -c credential.helper= -c \"credential.helper=store --file=$c\" -c http.followRedirects=false -c url.https://github.com/.insteadOf=git@github.com: -c
          url.https://github.com/.insteadOf=ssh://git@github.com/ -C \"$p\" fetch --quiet --no-tags origin || { echo instance.remove_refused >&2; exit 3; }; [ -z \"$(/usr/bin/git -c
          core.hooksPath=/dev/null -c core.fsmonitor=false -C \"$p\" status --porcelain -- . \":!.env\" \":!*/.env\" \":!.env.testing\" \":!*/.env.testing\")\" ] && [ -n \"$(/usr/bin/git
          -c core.hooksPath=/dev/null -c core.fsmonitor=false -C \"$p\" branch -r --contains HEAD)\" ] || { echo \"instance.remove_refused: $p has work that is not pushed\" >&2; exit
          3; }; done", "sh"] + ["/tmp/orbit-git-credential-" + run.id] + inputs.intent.push_check_paths }}'
  - name: Remove the git credential
    labels:
      role: swamp
    writes: true
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (size(inputs.intent.push_check_paths) == 0) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "instance-destroy-credential-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs:
        path: ${{ "/tmp/orbit-git-credential-" + run.id }}
        ensure: absent
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
      inputs: {}
    dependsOn:
    - step: Check work is pushed
      condition:
        type: always
  - name: Withdraw the Route
    labels:
      role: swamp
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Prepare container removal
      condition:
        type: always
    guard: '${{ steps.exists(k, steps[k].status == "failed") || (("route_mutations" in inputs.intent && "restore" in inputs.intent.route_mutations && "routes" in inputs.intent.route_mutations.restore) ? size(inputs.intent.route_mutations.restore.routes) == 0 : (inputs.intent.members.all(m, m.route_id == null) && (!has(inputs.intent.additional_route_ids) || size(inputs.intent.additional_route_ids) == 0))) }}'
    task:
      type: workflow
      workflowIdOrName: ${{ "route-withdraw" }}
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        side: forward
        intent: ${{ inputs.intent }}
        execution_secrets: {}
  - name: Stop, remove Processes
    labels:
      role: swamp
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps &&
      steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready)) }}
    forEach:
      item: process
      in: ${{ inputs.intent.native_runtime.processes }}
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent:
          control: ${{ self.process }}
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
  - name: Run teardown steps
    labels:
      role: swamp
    writes: true
    forEach:
      item: step
      in: ${{ inputs.intent.teardown_steps }}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-destroy-teardown-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-destroy-teardown-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - --user
        - ${{ inputs.intent.direct_destroy.node_user }}
        - --
        - /usr/bin/timeout
        - ${{ string(self.step.timeout_seconds) }}
        - /usr/bin/env
        - -C
        - ${{ self.step.directory }}
        - ${{ "ORBIT_INSTANCE_ID=" + string(self.step.instance_id) }}
        - ${{ "ORBIT_INSTANCE_NAME=" + self.step.instance_name }}
        - ORBIT_SEED_PATH=
        - ORBIT_SEED_COMMIT=
        - /bin/sh
        - -c
        - exec /bin/bash -eu -c "$1" >/dev/null
        - sh
        - ${{ self.step.command }}
        timeoutSec: ${{ self.step.timeout_seconds + 5 }}
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    - step: Stop, remove Processes
      condition:
        type: always
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps &&
      steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready)) }}
  - name: Remove SQLite files
    labels:
      role: swamp
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    - step: Stop, remove Processes
      condition:
        type: always
    - step: Run teardown steps
      condition:
        type: always
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps &&
      steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready)) }}
    writes: true
    forEach:
      item: database
      in: ${{ inputs.intent.direct_destroy.database.sqlite }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-destroy-sqlite-" + string(self.database.connection_id)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        path: ${{ self.database.path }}
        ensure: absent
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: false
      inputs: {}
  - name: Drop owned databases
    labels:
      role: swamp
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    - step: Stop, remove Processes
      condition:
        type: always
    - step: Run teardown steps
      condition:
        type: always
    - step: Remove SQLite files
      condition:
        type: always
    guard: ${{ steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps && steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready)
      }}
    forEach:
      item: server
      in: ${{ inputs.intent.direct_destroy.database.servers }}
    task:
      type: workflow
      workflowIdOrName: operation-database-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ self.server.node_id }}
        kind: database.destroy
        intent: ${{ self.server.intent }}
        execution_secrets:
          fence: ${{ inputs.execution_secrets["server_" + string(self.server.server_id) + "_fence"] }}
          drop: ${{ inputs.execution_secrets["server_" + string(self.server.server_id) + "_drop"] }}
          gone: ${{ inputs.execution_secrets["server_" + string(self.server.server_id) + "_gone"] }}
          restore: ${{ inputs.execution_secrets["server_" + string(self.server.server_id) + "_restore"] }}
  - name: Remove hibernation files
    labels:
      role: swamp
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    - step: Stop, remove Processes
      condition:
        type: always
    - step: Run teardown steps
      condition:
        type: always
    guard: ${{ steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps && steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready)
      }}
    writes: true
    forEach:
      item: file
      in: ${{ inputs.intent.direct_destroy.hibernation }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-destroy-hibernation-" + string(self.file.instance_id) + "-" + string(self._index)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        path: ${{ self.file.path }}
        ensure: absent
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
      inputs: {}
  - name: Remove the source
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    - step: Stop, remove Processes
      condition:
        type: always
    - step: Run teardown steps
      condition:
        type: always
    - step: Remove SQLite files
      condition:
        type: always
    - step: Drop owned databases
      condition:
        type: always
    - step: Remove hibernation files
      condition:
        type: always
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps &&
      steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *id003
      inputs:
        hosts: name:target
        timeoutSec: 310
        argv: ${{ ["/usr/bin/timeout", "300", "/bin/sh", "-c", "for p; do if [ -f \"$p/.git\" ]; then /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C \"$p\" worktree
          remove --force \"$p\" 2>/dev/null || rm -rf -- \"$p\"; else rm -rf -- \"$p\"; fi; done", "sh"] + inputs.intent.source_paths }}
  - name: Check it is gone
    labels:
      role: swamp
    dependsOn:
    - step: Remove the source
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *id003
      inputs:
        hosts: name:target
        timeoutSec: 70
        argv: ${{ ["/usr/bin/timeout", "60", "/bin/sh", "-c", "for p; do [ ! -e \"$p\" ] || { echo \"$p still exists\" >&2; exit 1; }; done", "sh"] + inputs.intent.source_paths }}
    guard: ${{ ("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || (false) }}
  - name: Delete the container
    labels: *id004
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "id-delete-the-container-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 180 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags remove "$ORBIT_ANSIBLE/instance-container-destroy.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_RUN_ID: ${{ run.id }}
          ORBIT_ANSIBLE: ${{ steps["Prepare container removal"].outputs.assets }}
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          ANSIBLE_SSH_ARGS: ${{ "-o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts -o StrictHostKeyChecking=yes" }}
    guard: ${{ !("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) || steps.exists(k, steps[k].status == "failed") || ("Withdraw the Route" in steps &&
      steps["Withdraw the Route"].status == "succeeded" && !steps["Withdraw the Route"].outputs.result.ready) }}
    dependsOn:
    - step: Drop owned databases
      condition:
        type: always
    - step: Remove hibernation files
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    writes: true
  - name: Read container removal
    labels: *id004
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "id-read-container-removal-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 cat "$ORBIT_RUN/remove.json"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
    guard: ${{ !("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) }}
    dependsOn:
    - step: Delete the container
      condition:
        type: always
  - name: Clean container files
    labels: *id004
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "id-clean-container-removal-files-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_RUN"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
    guard: ${{ !("container_destroy" in inputs.intent && inputs.intent.container_destroy != null) }}
    dependsOn:
    - step: Prepare container removal
      condition:
        type: always
    - step: Write the git credential
      condition:
        type: always
    - step: Check work is pushed
      condition:
        type: always
    - step: Remove the git credential
      condition:
        type: always
    - step: Withdraw the Route
      condition:
        type: always
    - step: Stop, remove Processes
      condition:
        type: always
    - step: Run teardown steps
      condition:
        type: always
    - step: Remove SQLite files
      condition:
        type: always
    - step: Drop owned databases
      condition:
        type: always
    - step: Remove hibernation files
      condition:
        type: always
    - step: Remove the source
      condition:
        type: always
    - step: Check it is gone
      condition:
        type: always
    - step: Delete the container
      condition:
        type: always
    - step: Read container removal
      condition:
        type: always
    writes: true
