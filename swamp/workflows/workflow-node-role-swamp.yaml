id: c68d404e-7c2e-41b4-8cf2-967b2314b356
name: node-role-swamp
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    intent:
      type: object
    ssh:
      type: object
  required:
    - intent
    - ssh
  additionalProperties: false
jobs:
  - name: role
    steps:
      - {name: worker_assets, target: orbit-node-209, queueTimeout: 30, task: {type: behavior, behaviorType: '@nckrtl/node-worker-assets', methodName: read, inputs: {node_id: 209, user: orbit}, behaviorName: '${{ "swamp-role-worker_assets-"+run.id }}'}}
      - {name: assets, target: orbit-node-209, queueTimeout: 30, dependsOn: [{step: worker_assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@nckrtl/node-swamp-role-assets', methodName: bundle, inputs: {intent: '${{ inputs.intent }}', worker: '${{ steps["worker_assets"].outputs }}'}, behaviorName: '${{ "swamp-role-assets-"+run.id }}'}}
      - {name: prepare_assets, target: orbit-node-209, queueTimeout: 30, dependsOn: [{step: assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: &ref_0 {name: '${{ "swamp-role-"+run.id }}', transport: {kind: ssh, user: '${{ inputs.ssh.transport.user }}', port: '${{ inputs.ssh.transport.port }}', identityFile: '${{ inputs.ssh.transport.identityFile }}'}, hosts: '${{ inputs.ssh.hosts }}'}, inputs: {hosts: 'name:target', argv: [/usr/bin/timeout, '30', /usr/bin/mkdir, '-p', '${{ "/tmp/orbit-swamp-role-"+run.id }}'], timeoutSec: 40}, behaviorName: '${{ "swamp-role-prepare_assets-"+run.id }}'}}
      - {name: copy_assets, target: orbit-node-209, queueTimeout: 30, dependsOn: [{step: prepare_assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: copy, globalArgs: *ref_0, inputs: {hosts: 'name:target', src: '${{ steps["assets"].outputs.directory+"/." }}', dst: '${{ "/tmp/orbit-swamp-role-"+run.id }}', direction: to, recursive: true}, behaviorName: '${{ "swamp-role-copy_assets-"+run.id }}'}}
      - {name: account, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: copy_assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 40, argv: [/usr/bin/timeout, '30', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/account.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}']}, behaviorName: '${{ "swamp-role-account-"+run.id }}'}}
      - {name: install, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: account, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 340, argv: [/usr/bin/timeout, '330', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/install.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}'], stdin: '${{ steps["assets"].outputs.install_json }}'}, behaviorName: '${{ "swamp-role-install-"+run.id }}'}}
      - {name: checkout, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: install, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 40, argv: [/usr/bin/timeout, '30', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/checkout.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}']}, behaviorName: '${{ "swamp-role-checkout-"+run.id }}'}}
      - {name: configuration, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: checkout, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 40, argv: [/usr/bin/timeout, '30', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/configuration.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}']}, behaviorName: '${{ "swamp-role-configuration-"+run.id }}'}}
      - {name: release_load, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: configuration, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 100, argv: [/usr/bin/timeout, '90', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/release_load.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}']}, behaviorName: '${{ "swamp-role-release_load-"+run.id }}'}}
      - {name: units, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: release_load, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 40, argv: [/usr/bin/timeout, '30', /usr/bin/systemctl, daemon-reload]}, behaviorName: '${{ "swamp-role-units-"+run.id }}'}}
      - {name: firewall, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: units, condition: {type: succeeded}}], guard: '${{ !inputs.intent.activate }}', task: {type: behavior, behaviorType: '@swamp/cfgmgmt/firewall', methodName: apply, inputs: {}, globalArgs: {nodeHost: '${{ inputs.intent.address }}', nodeUser: '${{ inputs.ssh.transport.user }}', nodePort: '${{ inputs.ssh.transport.port }}', nodeIdentityFile: '${{ inputs.ssh.transport.identityFile }}', become: true, port: 9417, action: allow, ensure: present, source: '${{ inputs.intent.services_proxy_source }}'}, behaviorName: '${{ "swamp-role-firewall-"+run.id }}'}}
      - {name: activation, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: firewall, condition: {type: succeeded}}], guard: '${{ !inputs.intent.activate }}', task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 130, argv: [/usr/bin/timeout, '120', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/activation.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}']}, behaviorName: '${{ "swamp-role-activation-"+run.id }}'}}
      - {name: verify, target: orbit-node-209, queueTimeout: 30, writes: true, allowFailure: true, dependsOn: [{step: activation, condition: {type: succeeded}}], guard: '${{ !inputs.intent.activate }}', task: {type: behavior, behaviorType: '@swamp/ssh', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, timeoutSec: 40, argv: [/usr/bin/timeout, '30', /usr/bin/python3, '-B', '${{ "/tmp/orbit-swamp-role-"+run.id+"/verify.py" }}', '${{ "/tmp/orbit-swamp-role-"+run.id }}']}, behaviorName: '${{ "swamp-role-verify-"+run.id }}'}}
      - {name: role_result, target: orbit-node-209, queueTimeout: 30, dependsOn: [{step: worker_assets, condition: {type: always}}, {step: assets, condition: {type: always}}, {step: prepare_assets, condition: {type: always}}, {step: copy_assets, condition: {type: always}}, {step: account, condition: {type: always}}, {step: install, condition: {type: always}}, {step: checkout, condition: {type: always}}, {step: configuration, condition: {type: always}}, {step: release_load, condition: {type: always}}, {step: units, condition: {type: always}}, {step: firewall, condition: {type: always}}, {step: activation, condition: {type: always}}, {step: verify, condition: {type: always}}], task: {type: behavior, behaviorType: '@nckrtl/node-swamp-role-assets', methodName: complete, inputs: {intent: '${{ inputs.intent }}', statuses: {account: '${{ "account" in steps ? steps["account"].status : "skipped" }}', install: '${{ "install" in steps ? steps["install"].status : "skipped" }}', checkout: '${{ "checkout" in steps ? steps["checkout"].status : "skipped" }}', configuration: '${{ "configuration" in steps ? steps["configuration"].status : "skipped" }}', release_load: '${{ "release_load" in steps ? steps["release_load"].status : "skipped" }}', units: '${{ "units" in steps ? steps["units"].status : "skipped" }}', firewall: '${{ "firewall" in steps ? steps["firewall"].status : "skipped" }}', activation: '${{ "activation" in steps ? steps["activation"].status : "skipped" }}', verify: '${{ "verify" in steps ? steps["verify"].status : "skipped" }}'}}, behaviorName: '${{ "swamp-role-role_result-"+run.id }}'}}
      - {name: accepted, target: orbit-node-209, queueTimeout: 30, dependsOn: [{step: role_result, condition: {type: succeeded}}], task: {type: assert, expr: 'steps["role_result"].outputs.prepared && (!inputs.intent.activate || steps["role_result"].outputs.role_proven)', severity: high, message: Swamp role contribution failed; see named phase status and stderr}}
