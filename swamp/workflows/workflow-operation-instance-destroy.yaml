- name: failure_cleanup
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: failure_cleanup
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-destroy'
      behaviorName: ${{ "instance-destroy-" + run.id }}
      methodName: fail
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed_step: cleanup
  dependsOn:
  - job: cleanup
    condition:
      type: failed
- name: failure_finalize_sources
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: failure_finalize_sources
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-destroy'
      behaviorName: ${{ "instance-destroy-" + run.id }}
      methodName: fail
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed_step: finalize_sources
  dependsOn:
