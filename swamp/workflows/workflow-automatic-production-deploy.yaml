id: 78efdd30-08ce-4ffb-a8eb-c7259c96ad24
name: automatic-production-deploy
description: Run production and development automatic deployment policy after their Gateway cutovers.
labels: {role: swamp}
trigger:
  schedule: 30 * * * * *
inputs:
  properties:
    instances:
      type: array
      items: { type: integer, minimum: 1 }
      uniqueItems: true
      default: []
      description: Optional narrower filter. Empty discovers every enabled production Instance from the Gateway.
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: policy
    steps:
      - name: tick
        task:
          type: model_method
          modelType: "@nckrtl/automatic-deploy"
          modelName: automatic-production-deploy
          methodName: tick
          inputs:
            instances: "${{ inputs.instances }}"
      - name: result
        dependsOn: [{step: tick, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: automatic-deploy-result
          methodName: execute
          inputs:
            run: 'printf "%s\n" "$ORBIT_FIRE"'
            env:
              ORBIT_FIRE: "${{ steps.tick.outputs.fire_json }}"
      - name: failures
        dependsOn: [{step: result, condition: {type: succeeded}}]
        task:
          type: assert
          expr: steps.tick.outputs.failure_count == 0
          severity: high
          message: An Instance's automatic deploy tick failed; the Gateway recorded it from the result.
