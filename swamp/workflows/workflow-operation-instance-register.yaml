id: c0791777-2696-430c-a78e-97b9289a655f
name: operation-instance-register
description: Read the admitted development checkout over official SSH from 209 and protect its .env; the Gateway checks the facts.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: instance.register}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: source
  labels:
    role: swamp
  steps:
  - name: 'Read the checkout files'
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-filesystem-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &id001
        name: ${{ ("reg-filesystem-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - cd -- "$1" || exit 1; { find . -path ./.git -prune -o -printf "%P %m %y %l\n" | LC_ALL=C sort; find . -path ./.git -prune -o -type f
          -print0 | LC_ALL=C sort -z | xargs -0r sha256sum; } | sha256sum | cut -c1-64; [ "$3" = monorepo ] && exit 0; if [ -L "$2/artisan" ];
          then echo unsafe; elif [ -f "$2/artisan" ]; then echo regular; else echo absent; fi; [ ! -f "$2/composer.json" ] || head -c 1048577
          -- "$2/composer.json"
        - sh
        - ${{ inputs.intent.checkout }}
        - ${{ inputs.intent.application }}
        - ${{ inputs.intent.project_type }}
  - name: 'Read the Git top level'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the checkout files'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-top-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout }}
        - rev-parse
        - --show-toplevel
  - name: 'Read the Git common dir'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the Git top level'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-common-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout }}
        - rev-parse
        - --path-format=absolute
        - --git-common-dir
  - name: 'List the worktrees'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the Git common dir'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-worktrees-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout }}
        - worktree
        - list
        - --porcelain
  - name: 'Read the origin'
    labels:
      role: swamp
    dependsOn:
    - step: 'List the worktrees'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-origin-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$1" config --get remote.origin.url | sed -E "s#^([a-z+]+://)[^/@]*:[^/@]*@#\1REDACTED@#;
          s#^(https?://)[^/@]+@#\1REDACTED@#"
        - sh
        - ${{ inputs.intent.checkout }}
  - name: 'Read the branch'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the origin'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-branch-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout }}
        - branch
        - --show-current
  - name: 'Read the commit'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the branch'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-commit-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout }}
        - rev-parse
        - --verify
        - HEAD^{commit}
  - name: 'Read the default branch'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the commit'
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-default-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.checkout }}
        - for-each-ref
        - --format=%(symref)
        - refs/remotes/origin/HEAD
  - name: 'Protect the .env file'
    labels:
      role: swamp
    dependsOn:
    - step: 'Read the default branch'
      condition:
        type: succeeded
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("reg-protect-environment-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - '[ ! -f "$1/.env" ] || [ -L "$1/.env" ] || chmod go-rwx -- "$1/.env"'
        - sh
        - ${{ inputs.intent.application }}
