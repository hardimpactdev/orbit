---
# Validate beside the live file so relative imports use exactly the live directory.
- name: Allocate the Caddy candidate beside the live file
  ansible.builtin.tempfile:
    state: file
    path: /etc/caddy
    prefix: .orbit-candidate-
  register: caddy_candidate
- name: Validate and publish the Caddy candidate
  block:
    - name: Write the restricted Caddy candidate
      ansible.builtin.copy:
        dest: "{{ caddy_candidate.path }}"
        content: "{{ caddy_content }}"
        owner: root
        group: "{{ caddy_group | default('caddy') }}"
        mode: "{{ caddy_mode | default('0640') }}"
      register: caddy_written
    - name: Validate the Caddy candidate
      ansible.builtin.command:
        argv: [timeout, "60", runuser, -u, caddy, --, caddy, validate, --config, "{{ caddy_candidate.path }}", --adapter, caddyfile]
      changed_when: false
    - name: Read the current Caddyfile identity
      ansible.builtin.stat:
        path: /etc/caddy/Caddyfile
        follow: false
      register: caddy_current
    # Rename the validated inode itself: no live-path ownership repair follows publication.
    - name: Atomically publish the validated Caddyfile
      ansible.builtin.command:
        argv: [mv, -Tf, --, "{{ caddy_candidate.path }}", /etc/caddy/Caddyfile]
      when: >-
        not caddy_current.stat.exists or not (caddy_current.stat.isreg | default(false))
        or caddy_current.stat.checksum != caddy_written.checksum
        or caddy_current.stat.uid != caddy_written.uid
        or caddy_current.stat.gid != caddy_written.gid
        or caddy_current.stat.mode != caddy_written.mode
      changed_when: true
      notify: "{{ caddy_notify | default([]) }}"
  always:
    - name: Remove this Caddy candidate
      ansible.builtin.file:
        path: "{{ caddy_candidate.path }}"
        state: absent
