  - name: router-caddy
    target: ${{ "orbit-node-" + string(data.latest("route-convergence-node-" + string(inputs.node_id), "admission-"
      + run.id).attributes.intent.router_node_id) }}
    labels:
      node: ${{ string(data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.router_node_id)
        }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(data.latest("route-convergence-node-" + string(inputs.node_id),
        "admission-" + run.id).attributes.intent.router_node_id) }}
      methodName: publishCaddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.router_node_id
          }}
    guard: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "state_only" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "replace_pending" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "publication" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode
      == "web_root" || data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.router_node_id
