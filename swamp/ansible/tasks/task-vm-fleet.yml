---
# The nested fleet of a task VM (docs/cli/tasks/vm-image-refresh.mmd): the Gateway with Swamp, app-dev and app-prod as Incus system
# containers on the seed pool, with the checkout as their disk device, migrated and running, and the outer VM joined as operator. The
# containers live in the seed and start with the VM. Each part checks its state first: the fleet is built from stock Ubuntu only when a
# container of it is missing (task-vm-fleet-build.yml), and the operator, the tokens, the code and the migrations are applied only when
# their digest changed, so a converge on a current base changes nothing and restarts nothing. The refresh retakes the `base` snapshots
# when the fleet changed; a task start leaves them.
- name: Read the nested containers
  ansible.builtin.command: { argv: [incus, list, --format, json] }
  register: fleet_list
  changed_when: false
- name: Work out the fleet
  ansible.builtin.set_fact:
    fleet_guests: "{{ intent.fleet.guests }}"
    fleet_present: "{{ fleet_list.stdout | from_json | map(attribute='name') | list }}"
    fleet_new: "{{ intent.fleet.guests.values() | reject('in', fleet_list.stdout | from_json | map(attribute='name') | list) | list }}"
- name: Build the fleet from stock Ubuntu
  ansible.builtin.import_tasks: task-vm-fleet-build.yml
  when: fleet_new | length > 0
  vars:
    # A command of the nested Gateway's Orbit, as its orbit user in its own checkout.
    fleet_artisan: [timeout, "120", incus, exec, "{{ fleet_guests.gateway }}", --user, "1000", --env, HOME=/home/orbit, --cwd,
                    /home/orbit/orbit/apps/gateway, --, php, artisan]
    # The services of the nested Gateway, in the order they start.
    fleet_gateway_services: [php8.5-fpm.service, caddy.service, orbit-swamp-serve.service, orbit-swamp-worker@a.service, orbit-swamp-worker@b.service,
                             orbit-gateway-horizon.service, orbit-gateway-schedule.service, orbit-agent-view.service]
    # The waits ask Doctor of the nested Gateway at its address in the fleet's network.
    wait_hub: "{{ intent.fleet.operator.hub }}"
- name: Read the nested containers again
  when: fleet_new | length > 0
  ansible.builtin.command: { argv: [incus, list, --format, json] }
  register: fleet_again
  changed_when: false
- name: Work out the containers
  ansible.builtin.set_fact:
    fleet_now: "{{ (fleet_again.stdout | default(fleet_list.stdout)) | from_json | selectattr('name', 'in', fleet_guests.values() | list) | list }}"
# The containers start with the VM; one that has not started yet starts here.
- name: Start the containers
  ansible.builtin.command: { argv: [timeout, "120", incus, start, "{{ item }}"] }
  loop: "{{ fleet_now | rejectattr('status', 'eq', 'Running') | map(attribute='name') | list }}"
  register: fleet_start
  # A container the VM's boot started since the read is running already.
  changed_when: fleet_start.rc == 0
  failed_when: fleet_start.rc != 0 and 'already running' not in fleet_start.stderr
- name: Join the outer VM as operator
  ansible.builtin.import_tasks: task-vm-fleet-operator.yml
  when: converge_due.operator or fleet_new | length > 0
- name: Renew the nested Swamp tokens
  ansible.builtin.import_tasks: task-vm-fleet-tokens.yml
  when: converge_due.tokens or fleet_new | length > 0

# The code of the nested Gateway (`apps/gateway` of the commit): a restart of the long-running services when it changed, and the agent
# delivery manifest only when the agent build it pins changed. A commit that changes neither restarts and places nothing.
- name: Take the new code
  when: "'code' not in checkout_current or fleet_new | length > 0"
  block:
    - name: Place the agent delivery
      when: "'agent' not in checkout_current or fleet_new | length > 0"
      ansible.builtin.command:
        argv: [incus, exec, "{{ fleet_guests.gateway }}", --user, "1000", --, install, -D, -m, "0444",
               /home/orbit/orbit/apps/gateway/resources/agent/frozen-manifest.json,
               /home/orbit/orbit/apps/agent/delivery/manifest.json]
      changed_when: true
    - name: Migrate the nested Gateway
      when: "'migrations' not in checkout_current or fleet_new | length > 0"
      ansible.builtin.command:
        argv: [timeout, "120", incus, exec, "{{ fleet_guests.gateway }}", --user, "1000", --cwd, /home/orbit/orbit/apps/gateway, --,
               php, artisan, migrate, --force]
      changed_when: true
    - name: Restart the long-running services
      ansible.builtin.command:
        argv:
          [timeout, "120", incus, exec, "{{ fleet_guests.gateway }}", --, systemctl, restart, orbit-gateway-horizon.service, orbit-gateway-schedule.service,
           orbit-agent-view.service]
      changed_when: true
    - name: Record the code, the agent build and the migrations
      ansible.builtin.command:
        argv: [install, -D, -m, "0644", /dev/stdin, "{{ converge_stamps_dir }}/{{ item }}"]
        stdin: "{{ checkout_now[item] }}"
        stdin_add_newline: false
      loop: "{{ ['code', 'agent', 'migrations'] | reject('in', checkout_current) | list }}"
      changed_when: true
