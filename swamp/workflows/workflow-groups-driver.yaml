id: d83a5174-05bf-41ab-8468-f36d5fe30b03
name: groups-driver
description: Discover every active group and reconcile independent owning runs.
trigger:
  # Reconciles software-factory owning runs; each run is long-lived, so discovery only
  # recovers a lost owner or starts a new work item. Ten minutes of latency is enough.
  schedule: "0 */10 * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: groups
    steps:
      - name: discover
        labels: {role: swamp}
        task:
          type: behavior
          behavior: orbit-group-runs
          methodName: discover
      - name: fanout
        dependsOn: [{ step: discover, condition: { type: succeeded } }]
        labels: {role: swamp}
        task:
          type: workflow
          workflowIdOrName: group-fanout
          inputs:
            groups: '${{ steps.discover.outputs.groups }}'
            conflicts: '${{ steps.discover.outputs.conflicts }}'
