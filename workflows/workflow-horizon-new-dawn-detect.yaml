id: 379393e1-64e7-444b-9d58-3870e28485f4
name: "@nckrtl/project-horizon-new-dawn-detect"
labels: { pool: migration, node: "209" }
queueTimeout: 300
description: Detect horizon-new-dawn (Project 57) parity on an enrolled group worker and create backlog tasks for Nick. No schedule or live task start.
inputs:
  properties:
    group: { type: integer, description: Existing open external horizon-new-dawn (Project 57) group with an enrolled worker }
    worker: { type: string, description: Exact enrollment-bound worker name from the group receipt }
    cwd: { type: string, description: Horizon package checkout inside that group VM }
  required: [group, worker, cwd]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: verify
    labels: {}
    steps:
      - name: enrolled
        task:
          type: model_method
          modelIdOrName: orbit-gateway
          methodName: horizon_worker
          inputs:
            group: '${{ inputs.group }}'
            worker: '${{ inputs.worker }}'
  - name: detect
    labels: {}
    target: '${{ inputs.worker }}'
    queueTimeout: 120
    dependsOn:
      - job: verify
        condition: { type: succeeded }
    steps:
      - name: upstream
        task:
          type: model_method
          modelType: '@nckrtl/project-horizon-new-dawn'
          modelName: '${{ "horizon-detect-" + run.id }}'
          methodName: detect
          inputs:
            cwd: '${{ inputs.cwd }}'
  - name: tasks
    labels: {}
    dependsOn:
      - job: detect
        condition: { type: succeeded }
    steps:
      - name: backlog
        task:
          type: model_method
          modelIdOrName: orbit-gateway
          methodName: horizon_tasks
          inputs:
            plan: '${{ data.latest("horizon-detect-" + run.id, "plan").attributes }}'
