id: 46c6bbed-b4ab-4bdc-9a5b-6251a1ddbe41
name: operation-analytics-disable-direct
description: Withdraw captured tracking hosts through canonical Route workflows over official SSH from209.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: analytics.disable
    intent:
      type: object
      properties:
        caddy:
          type: array
          items:
            type: object
        dns:
          type: array
          items:
            type: object
        cleanup:
          type: array
          items:
            type: object
        result_json:
          type: string
      required:
      - caddy
      - dns
      - cleanup
      - result_json
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: withdraw
  steps:
  - name: caddy
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: ${{ inputs.execution_secrets }}
    forEach:
      item: item
      in: ${{ inputs.intent.caddy }}
- name: dns
  dependsOn:
  - job: withdraw
    condition:
      type: succeeded
  steps:
  - name: dns
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: ${{ inputs.execution_secrets }}
    forEach:
      item: item
      in: ${{ inputs.intent.dns }}
- name: grace
  dependsOn:
  - job: dns
    condition:
      type: succeeded
  steps:
  - name: dns-grace
    target: orbit-node-209
    guard: ${{ inputs.intent.dns.size() == 0 }}
    task:
      type: workflow
      workflowIdOrName: route-dns-grace
      inputs: {}
- name: cleanup
  dependsOn:
  - job: grace
    condition:
      type: succeeded
  steps:
  - name: certificate
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-certificate-remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: ${{ inputs.execution_secrets }}
        parent_run_id: ${{ run.id }}
        restoring: false
    forEach:
      item: item
      in: ${{ inputs.intent.cleanup }}
- name: finish
  dependsOn:
  - job: cleanup
    condition:
      type: succeeded
  steps:
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-disable-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '%s\n' "$ORBIT_ANALYTICS_RESULT"
        env:
          ORBIT_ANALYTICS_RESULT: ${{ inputs.intent.result_json }}
vaults: []
