# Fixture input closure includes local imports, copied scripts and Ansible includes.
# Costs start with shape-full.log; hosted ci-unit-times artifacts own later measurements.
# Primary case costs use completed hosted evidence from runs 43000765953, 43002948719, 43005032403 and 43010311414.
# Unmeasured primary cases use their file's largest completed retained case; they remain estimates.
# The inventory binds these declarations to exact registered names. Startup is budgeted separately.
[budget]
shard_seconds = 150
shard_deadline_seconds = 190
shard_ceiling_seconds = 240
shard_workers = 4
unit_ceiling_seconds = 180
slice_seconds = 60
slice_startup_seconds = 6
pr_shards = 8
default_cost = 30

[fixtures]
default = ["swamp/tests/ansible_inputs_test.py"]

[all-checks]
# checks.toml is compared by entry at the merge base: individual checks select themselves; shared policy selects all.
# Changes to the check machinery run each check job once, without an agent delivery.
inputs = [".github/workflows/ci.yml", ".github/actions/**", ".github/ci/checks.toml", "bin/ci-build-plan", "bin/ci-registry"]

[ignored]
# These paths have intentionally paused checks, prose skips, or always-run plan tests.
inputs = ["bin/ci-units", "bin/ci-delivery", "bin/ci-tree-receipt", "bin/ci-proof-eligibility", "tools/test_ci_*", "tools/test_swamp_import_base*", "tools/test_frozen_agent_commands*", "apps/desktop/**", "apps/agent/**/*.md", "apps/agent/**/*.mdx", "apps/pi-server/**/*.md", "apps/pi-server/**/*.mdx"]

[check.php]
inputs = [
  "**/*.php",
  "**/*composer.json",
  "**/*composer.lock",
  "apps/gateway/resources/agent/**",
  "bin/check-frozen-agent-commands",
  "!swamp/**",
  "!.agents/**",
  "!.codex/**",
  "!.githooks/**",
]
cost = 24
ceiling = 120

