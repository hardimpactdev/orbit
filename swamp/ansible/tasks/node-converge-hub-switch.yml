---
# Decide whether a Node moves to another hub endpoint (ADR 0251). The files decide: the Endpoint of the previous `orbit.peers`
# against the rendered one. The live endpoint would not do: `wg` shows a hostname resolved, and a peer that roamed shows the
# address it roamed to.
- name: Decide whether the hub endpoint changes
  ansible.builtin.set_fact:
    hub_switch: >-
      {{ (hub_switch_previous | regex_search('(?m)^Endpoint = (\S+)$', '\1') or ['']) | first != hub_switch_endpoint }}
