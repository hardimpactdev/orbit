id: 00fd4b62-f72a-4795-9924-a48704608c88
name: operation-node-role-add
description: Apply role-owned resources from captured intent through Node 209. Node convergence owns the observer and CLI.
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [node.role_add]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key:
            type: string
            pattern: ^(node-role-operation-[1-9][0-9]*-[a-z-]+|process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: phase_0
  labels:
    role: swamp
  steps:
  - name: Read the OS release
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "role-add-platform-"+string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "role-add-platform-"+string(inputs.node_id)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{ inputs.intent.ssh.identity_file }}'},
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]}, inputs: {hosts: 'name:target',
        argv: [cat, /etc/os-release], timeoutSec: 20}}
- name: phase_1
  labels:
    role: swamp
  steps:
  - name: Require supported Ubuntu
    labels:
      role: swamp
    task: {type: assert, expr: 'steps["Read the OS release"].outputs.stdout.split("\n").exists(line,line in ["ID=ubuntu","ID=\"ubuntu\""]) && inputs.intent.releases.exists(r,steps["Read
        the OS release"].outputs.stdout.split("\n").exists(line,line == "VERSION_CODENAME="+r || line == "VERSION_CODENAME=\""+r+"\""))', severity: high, message: The role requires an
        admitted Ubuntu release.}
  dependsOn:
  - {job: phase_0, condition: {type: succeeded}}
- name: phase_2
  labels:
    role: swamp
  steps:
  - name: Install Caddy
    labels:
      role: swamp
    guard: ${{ inputs.intent.caddy_package == null }}
    writes: true
    task: {type: workflow, workflowIdOrName: node-caddy-package, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: {
          ssh: '${{ inputs.intent.ssh }}', package: '${{ inputs.intent.caddy_package }}'}}}
  dependsOn:
  - {job: phase_1, condition: {type: succeeded}}
- name: phase_3
  labels:
    role: swamp
  steps:
  - name: Refresh package lists
    labels:
      role: swamp
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/apt', behaviorName: '${{ "role-add-packages-"+string(inputs.node_id) }}', methodName: refresh, globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host
          }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true},
      inputs: {}}
  dependsOn:
  - {job: phase_2, condition: {type: succeeded}}
- name: phase_4
  labels:
    role: swamp
  steps:
  - name: Install prerequisites
    labels:
      role: swamp
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/apt', behaviorName: '${{ "role-add-packages-"+string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host
          }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true,
        packages: '${{ inputs.intent.packages }}', ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_3, condition: {type: succeeded}}
- name: phase_5
  labels:
    role: swamp
  steps:
  - name: Create role folders
    labels:
      role: swamp
    writes: true
    forEach:
      item: directory
      in: ${{ inputs.intent.directories }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/directory', behaviorName: '${{ "role-add-folder-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: '${{ self.directory.path }}', owner: '${{ self.directory.owner }}', group: '${{ self.directory.group }}', mode: '${{ self.directory.mode }}', ensure: present},
      inputs: {}}
  dependsOn:
  - {job: phase_4, condition: {type: succeeded}}
- name: phase_6
  labels:
    role: swamp
  steps:
  - name: Download Bun
    labels:
      role: swamp
    writes: true
    forEach:
      item: bun
      in: '${{ inputs.intent.bun == null ? [] : [inputs.intent.bun] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/fetch', behaviorName: '${{ "role-add-bun-fetch-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, url: '${{ self.bun.url }}', path: '${{ self.bun.path }}', checksum: '${{ self.bun.checksum }}', owner: root, group: root, mode: '0644'}, inputs: {}}
  dependsOn:
  - {job: phase_5, condition: {type: succeeded}}
- name: phase_7
  labels:
    role: swamp
  steps:
  - name: Extract Bun
    labels:
      role: swamp
    writes: true
    forEach:
      item: bun
      in: '${{ inputs.intent.bun == null ? [] : [inputs.intent.bun] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/archive', behaviorName: '${{ "role-add-bun-archive-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{
          inputs.intent.ssh.identity_file }}', become: true, source: '${{ self.bun.path }}', dest: '${{ self.bun.dest }}', format: zip, creates: '${{ self.bun.binary }}'}, inputs: {}}
  dependsOn:
  - {job: phase_6, condition: {type: succeeded}}
- name: phase_8
  labels:
    role: swamp
  steps:
  - name: Publish Bun
    labels:
      role: swamp
    writes: true
    forEach:
      item: bun
      in: '${{ inputs.intent.bun == null ? [] : [inputs.intent.bun] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/link', behaviorName: '${{ "role-add-bun-link-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: /opt/orbit/bun/bin/bun, target: '${{ self.bun.binary }}', ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_7, condition: {type: succeeded}}
- name: phase_9
  labels:
    role: swamp
  steps:
  - name: Publish the Bun command
    labels:
      role: swamp
    writes: true
    forEach:
      item: bun
      in: '${{ inputs.intent.bun == null ? [] : [inputs.intent.bun] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/link', behaviorName: '${{ "role-add-bun-launcher-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: /usr/local/bin/bun, target: /opt/orbit/bun/bin/bun, ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_8, condition: {type: succeeded}}
- name: phase_10
  labels:
    role: swamp
  steps:
  - name: Check Bun version
    labels:
      role: swamp
    forEach:
      item: bun
      in: '${{ inputs.intent.bun == null ? [] : [inputs.intent.bun] }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "role-add-bun-version-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "role-add-bun-version-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port
            }}', identityFile: '${{ inputs.intent.ssh.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys
                }}'}}]}, inputs: {hosts: 'name:target', sudo: true, argv: [timeout, '60', /usr/local/bin/bun, --version], timeoutSec: 905}}
  dependsOn:
  - {job: phase_9, condition: {type: succeeded}}
- name: phase_11
  labels:
    role: swamp
  steps:
  - name: Download PHP packages
    labels:
      role: swamp
    writes: true
    forEach:
      item: package
      in: ${{ inputs.intent.php_packages }}
    concurrency: 1
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/fetch', behaviorName: '${{ "role-add-php-download-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{
          inputs.intent.ssh.identity_file }}', become: true, url: '${{ self.package.url }}', path: '${{ self.package.path }}', checksum: '${{ "sha256:" + self.package.sha256 }}', owner: root,
        group: root, mode: '0644'}, inputs: {}}
  dependsOn:
  - {job: phase_10, condition: {type: succeeded}}
- name: phase_12
  labels:
    role: swamp
  steps:
  - name: Install PHP packages
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.php_packages.size() == 0 }}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "role-add-php-install-"+string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "role-add-php-install-"+string(inputs.node_id)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{ inputs.intent.ssh.identity_file }}'},
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]}, inputs: {hosts: 'name:target',
        sudo: true, argv: '${{ ["timeout","900","env","DEBIAN_FRONTEND=noninteractive","NEEDRESTART_MODE=l","apt-get","--no-remove","install","--yes","--no-install-recommends","-o","Dpkg::Options::=--force-confold"]
          + inputs.intent.php_packages.map(p,p.path) }}', timeoutSec: 910}}
  dependsOn:
  - {job: phase_11, condition: {type: succeeded}}
- name: phase_13
  labels:
    role: swamp
  steps:
  - name: Set up Tool Managers
    labels:
      role: swamp
    writes: true
    forEach:
      item: manager
      in: ${{ inputs.intent.managers }}
    concurrency: 1
    task: {type: workflow, workflowIdOrName: operation-tool-manager-setup, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', intent: '${{ self.manager
          }}', ssh: '${{ inputs.intent.ssh }}', report: false, converge: true}}
  dependsOn:
  - {job: phase_12, condition: {type: succeeded}}
- name: phase_14
  labels:
    role: swamp
  steps:
  - name: Configure PHP-FPM
    labels:
      role: swamp
    writes: true
    forEach:
      item: php
      in: ${{ inputs.intent.php }}
    task: {type: workflow, workflowIdOrName: node-php-runtime, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: {
          ssh: '${{ inputs.intent.ssh }}', php: '${{ self.php }}'}}}
  dependsOn:
  - {job: phase_13, condition: {type: succeeded}}
- name: phase_15
  labels:
    role: swamp
  steps:
  - name: Write role files
    labels:
      role: swamp
    writes: true
    forEach:
      item: file
      in: ${{ inputs.intent.files }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "role-add-file-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: '${{ self.file.path }}', content: '${{ self.file.content }}', owner: '${{ self.file.owner }}', group: '${{ self.file.group }}', mode: '${{ self.file.mode
          }}', ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_14, condition: {type: succeeded}}
- name: phase_16
  labels:
    role: swamp
  steps:
  - name: Reload role units
    labels:
      role: swamp
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "role-add-daemon-reload-"+string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "role-add-daemon-reload-"+string(inputs.node_id)
          }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{ inputs.intent.ssh.identity_file }}'},
        hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]}, inputs: {hosts: 'name:target',
        sudo: true, argv: [timeout, '60', systemctl, daemon-reload], timeoutSec: 70}}
  dependsOn:
  - {job: phase_15, condition: {type: succeeded}}
- name: phase_17
  labels:
    role: swamp
  steps:
  - name: Start role services
    labels:
      role: swamp
    writes: true
    forEach:
      item: service
      in: ${{ inputs.intent.services }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/systemd', behaviorName: '${{ "role-add-service-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, service: '${{ self.service.name }}', ensure: running, enabled: true}, inputs: {}}
  dependsOn:
  - {job: phase_16, condition: {type: succeeded}}
- name: phase_18
  labels:
    role: swamp
  steps:
  - name: Create runtime groups
    labels:
      role: swamp
    writes: true
    forEach:
      item: group
      in: ${{ inputs.intent.runtime.groups }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/group', behaviorName: '${{ "role-add-runtime-group-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{
          inputs.intent.ssh.identity_file }}', become: true, groupname: '${{ self.group.name }}', gid: '${{ self.group.gid }}', system: true, ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_17, condition: {type: succeeded}}
- name: phase_19
  labels:
    role: swamp
  steps:
  - name: Create runtime users
    labels:
      role: swamp
    writes: true
    forEach:
      item: user
      in: ${{ inputs.intent.runtime.users }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/user', behaviorName: '${{ "role-add-runtime-user-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, username: '${{ self.user.name }}', uid: '${{ self.user.uid }}', gid: '${{ self.user.gid }}', shell: /usr/sbin/nologin, system: true, ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_18, condition: {type: succeeded}}
- name: phase_20
  labels:
    role: swamp
  steps:
  - name: Create runtime folders
    labels:
      role: swamp
    writes: true
    forEach:
      item: directory
      in: ${{ inputs.intent.runtime.directories }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/directory', behaviorName: '${{ "role-add-runtime-folder-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{
          inputs.intent.ssh.identity_file }}', become: true, path: '${{ self.directory.path }}', owner: '${{ self.directory.owner }}', group: '${{ self.directory.group }}', mode: '${{
          self.directory.mode }}', ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_19, condition: {type: succeeded}}
- name: phase_21
  labels:
    role: swamp
  steps:
  - name: Check out Reverb
    labels:
      role: swamp
    writes: true
    forEach:
      item: web
      in: '${{ inputs.intent.runtime.websocket == null ? [] : [inputs.intent.runtime.websocket] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/git', behaviorName: '${{ "role-add-reverb-checkout-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{
          inputs.intent.ssh.identity_file }}', become: true, repo: '${{ self.web.repository }}', revision: '${{ self.web.ref }}', ensure: present, path: '${{ self.web.release }}', owner: '${{
          self.web.user }}'}, inputs: {}}
  dependsOn:
  - {job: phase_20, condition: {type: succeeded}}
- name: phase_22
  labels:
    role: swamp
  steps:
  - name: Install Reverb packages
    labels:
      role: swamp
    writes: true
    forEach:
      item: web
      in: '${{ inputs.intent.runtime.websocket == null ? [] : [inputs.intent.runtime.websocket] }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "role-add-reverb-composer-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {
        name: '${{ "role-add-reverb-composer-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port
            }}', identityFile: '${{ inputs.intent.ssh.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys
                }}'}}]}, inputs: {hosts: 'name:target', sudo: true, argv: '${{ ["timeout","300","sudo","-n","-H","-u",self.web.user,"--","env","COMPOSER_ALLOW_SUPERUSER=1","composer","install","--no-dev","--optimize-autoloader","--no-interaction","--no-progress","--working-dir="+self.web.release]
          }}', timeoutSec: 905}}
  dependsOn:
  - {job: phase_21, condition: {type: succeeded}}
- name: phase_23
  labels:
    role: swamp
  steps:
  - name: Write runtime files
    labels:
      role: swamp
    writes: true
    forEach:
      item: file
      in: ${{ inputs.intent.runtime.files }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "role-add-runtime-file-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: '${{ self.file.path }}', content: '${{ self.file.content }}', owner: '${{ self.file.owner }}', group: '${{ self.file.group }}', mode: '${{ self.file.mode
          }}', ensure: '${{ "ensure" in self.file ? self.file.ensure : "present" }}'}, inputs: {}}
  dependsOn:
  - {job: phase_22, condition: {type: succeeded}}
- name: phase_24
  labels:
    role: swamp
  steps:
  - name: Write private files
    labels:
      role: swamp
    writes: true
    forEach:
      item: file
      in: ${{ inputs.intent.runtime.secret_files }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "role-add-private-file-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: '${{ self.file.path }}', content: '${{ vault.get(''orbit-control-inputs'',inputs.execution_secrets[self.file.secret].key) }}', owner: '${{ self.file.owner
          }}', group: '${{ self.file.group }}', mode: '0600', ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_23, condition: {type: succeeded}}
- name: phase_25
  labels:
    role: swamp
  steps:
  - name: Publish the Reverb release
    labels:
      role: swamp
    writes: true
    forEach:
      item: web
      in: '${{ inputs.intent.runtime.websocket == null ? [] : [inputs.intent.runtime.websocket] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/link', behaviorName: '${{ "role-add-reverb-link-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply, globalArgs: {
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.ssh.identity_file
          }}', become: true, path: '${{ self.web.path }}', target: '${{ self.web.release }}', owner: '${{ self.web.user }}', ensure: present}, inputs: {}}
  dependsOn:
  - {job: phase_24, condition: {type: succeeded}}
- name: phase_26
  labels:
    role: swamp
  steps:
  - name: Apply Gateway DNS policy
    labels:
      role: swamp
    writes: true
    forEach:
      item: dns
      in: '${{ inputs.intent.runtime.gateway_dns == null ? [] : [inputs.intent.runtime.gateway_dns] }}'
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/systemd', behaviorName: '${{ "role-add-gateway-dns-unit-"+string(inputs.node_id) + "-"+string(self._index) }}', methodName: apply,
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}', nodeIdentityFile: '${{
          inputs.intent.ssh.identity_file }}', become: true, service: orbit-gateway-dns.service, unitFile: '${{ self.dns.unit }}', enabled: true}, inputs: {}}
  dependsOn:
  - {job: phase_25, condition: {type: succeeded}}
- name: phase_27
  labels:
    role: swamp
  steps:
  - name: Start Gateway DNS policy
    labels:
      role: swamp
    writes: true
    forEach:
      item: dns
