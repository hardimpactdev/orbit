id: 6e47270b-266c-463f-9fa8-d595e26e7150
name: task-workspace-teardown
description: Read the VM power, then run each captured workspace teardown command as
  one official SSH exec argv from 209 while the VM runs; no script reaches the VM.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - tasks.cancel
      - tasks.maintenance_finish
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-pi-token-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: teardown
  labels: {role: swamp}
  steps:
  - name: power
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: '${{ "provider_input" in inputs.intent ? inputs.intent.provider_input : {} }}'
        execution_secrets: '${{ "provider" in inputs.intent && inputs.intent.provider == "upcloud" ? {"upcloud":inputs.execution_secrets.upcloud} : {} }}'
        action: inspect
  - name: assets
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-repository-assets'
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        root: ${{ "/tmp/orbit-task-teardown-" + run.id }}
      behaviorName: '${{ "task-repository-assets-task-repository-assets" }}'
  - name: teardown-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-teardown-" + string(inputs.intent.ssh_execution.target.node_id) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("task-teardown-" + string(inputs.intent.ssh_execution.target.node_id) + "-" + string(self._index)).split(".").join("-") }}'
        transport: &transport
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts: &hosts
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ steps.assets.outputs.teardown[self._index] }}
        timeoutSec: ${{ self.item.timeout_seconds }}
    # A stopped VM skips guest teardown; the VM is destroyed next anyway.
    guard: ${{ !steps.power.outputs.result.running }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    - step: power
      condition:
        type: succeeded
    forEach:
      item: item
      in: ${{ inputs.intent.teardown }}
    concurrency: 1
  - name: output_local
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-teardown-output_local" }}'
      methodName: execute
      inputs:
        run: |
          umask 077
          mkdir -p -- "$ORBIT_OUTPUT"
        env:
          ORBIT_OUTPUT: ${{ "/tmp/orbit-task-teardown-" + run.id + "-output" }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    allowFailure: true
  - name: output_copy
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-teardown-output-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        name: '${{ ("task-teardown-output-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        direction: from
        recursive: true
        src: ${{ "/tmp/orbit-task-teardown-" + run.id }}
        dst: ${{ "/tmp/orbit-task-teardown-" + run.id + "-output/" }}
        timeoutSec: 60
    dependsOn:
    - step: teardown-${{ self._index }}
      condition:
        type: always
    - step: output_local
      condition:
        type: succeeded
    guard: ${{ size(inputs.intent.teardown) == 0 || !steps.power.outputs.result.running }}
    allowFailure: true
  - name: output
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-repository-assets'
      methodName: output
      inputs:
        intent: ${{ inputs.intent }}
        directory: ${{ "/tmp/orbit-task-teardown-" + run.id + "-output/orbit-task-teardown-" + run.id }}
      behaviorName: '${{ "task-repository-assets-task-repository-assets" }}'
    dependsOn:
    - step: output_copy
      condition:
        type: succeeded
    allowFailure: true
  - name: cleanup_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-teardown-output-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("task-teardown-output-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-teardown-" + run.id }}
        timeoutSec: 60
    dependsOn:
    - step: output_copy
      condition:
        type: always
    guard: ${{ size(inputs.intent.teardown) == 0 || !steps.power.outputs.result.running }}
    allowFailure: true
  - name: cleanup_local
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-teardown-cleanup_local" }}'
      methodName: execute
      inputs:
        run: |
          rm -rf -- "$ORBIT_OUTPUT"
        env:
          ORBIT_OUTPUT: ${{ "/tmp/orbit-task-teardown-" + run.id + "-output" }}
    dependsOn:
    - step: output
      condition:
        type: always
    allowFailure: true
