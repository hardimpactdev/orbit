---
# The Gateway release on the Gateway Node. Every remote task costs about 0.3 s, so each phase reads its state in one task and decides in Ansible.
# `intent` is the Gateway's admitted intent. `release_base` is the release folder on the Node (default /home/orbit); a test run points it elsewhere.
# `run_dir` is the run folder on the Swamp Node, where a phase leaves the value its Swamp step prints (the grants, the snapshot path, the previous grants).
# The GitHub token comes from the environment of the Swamp step and never touches a file. Every refusal starts with its `gateway.release_*:` code,
# which the Gateway reads from the step's stderr.
- name: Build the release
  hosts: gateway
  tags: [build]
  gather_facts: false
  vars: &release
    base: "{{ release_base | default('/home/orbit') }}"
    repo: "{{ release_base | default('/home/orbit') }}/shared/orbit.git"
    sha: "{{ intent.sha }}"
    id: "{{ intent.id }}"
    release: "{{ release_base | default('/home/orbit') }}/releases/{{ intent.id }}"
    app: "{{ release_base | default('/home/orbit') }}/releases/{{ intent.id }}/apps/gateway"
    token: "{{ lookup('env', 'ORBIT_GITHUB_TOKEN') }}"
  tasks:
    - name: Read the state of the release folder
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          live=$(basename "$(readlink "{{ base }}/orbit")")
          config="{{ base }}/releases/$live/apps/gateway/bootstrap/cache/config.php"
          database=$(php8.5 -r '$c = require $argv[1]; echo $c["database"]["connections"]["sqlite"]["database"];' "$config" 2>/dev/null)
          printf 'live=%s\n' "$live"
          printf 'live_revision=%s\n' "$(cat "{{ base }}/releases/$live/REVISION" 2>/dev/null)"
          printf 'known=%s\n' "$(git -C "{{ repo }}" cat-file -e "{{ sha }}^{commit}" 2>/dev/null && echo yes)"
          printf 'pinned=%s\n' "$(git -C "{{ repo }}" rev-parse -q --verify "refs/orbit/{{ sha }}" 2>/dev/null)"
          printf 'revision=%s\n' "$(cat "{{ release }}/REVISION" 2>/dev/null)"
          printf 'stopped=%s\n' "$(test -e "{{ release }}" && echo yes)"
          printf 'database_size=%s\n' "$(stat -c %s "$database" 2>/dev/null)"
          printf 'free=%s\n' "$(df --output=avail -B1 "{{ base }}" | tail -n 1)"
        executable: /bin/bash
      register: read
      changed_when: false
    - name: Name the state
      ansible.builtin.set_fact:
        state: "{{ dict(read.stdout_lines | map('split', '=', 1) | list) }}"
    - name: Require a release link
      ansible.builtin.fail:
        msg: "gateway.release_not_adopted: {{ base }}/orbit is no release link"
      when: state.live == ''
    - name: Require a sealed live release
      ansible.builtin.fail:
        msg: "gateway.release_current_incomplete: release {{ state.live }} has no REVISION"
      when: state.live_revision == ''
    - name: Fetch the commit
      when: state.known != 'yes'
      block:
        - name: Fetch the commit from GitHub
          ansible.builtin.shell:
            cmd: |
              set -e
              config=$(mktemp)
              trap 'rm -f "$config"' EXIT
              cat > "$config"
              GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL="$config" timeout 300 git -C "{{ repo }}" fetch --no-tags --quiet \
                "{{ fetch_url | default('https://github.com/' ~ intent.repository ~ '.git') }}" "+{{ sha }}:refs/orbit/{{ sha }}"
            stdin: "[http \"https://github.com/\"]\n\textraHeader = Authorization: Basic {{ ('x-access-token:' ~ token) | b64encode }}\n"
            executable: /bin/bash
          changed_when: true
          no_log: true
      rescue:
        - name: Report the failed fetch
          ansible.builtin.fail:
            msg: "gateway.release_fetch_failed: git fetch of {{ sha }} failed"
    - name: Pin the commit in the shared repository
      ansible.builtin.command: {argv: [git, -C, "{{ repo }}", update-ref, "refs/orbit/{{ sha }}", "{{ sha }}"]}
      changed_when: false
      when: state.known == 'yes' and state.pinned == ''
    - name: Check that the commit descends from the live release
      ansible.builtin.command: {argv: [git, -C, "{{ repo }}", merge-base, --is-ancestor, "{{ state.live_revision }}", "{{ sha }}"]}
      register: descends
      changed_when: false
      failed_when: false
      when: not intent.force | bool and sha != state.live_revision
    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: "gateway.release_downgrade: {{ sha }} does not descend from the current {{ state.live_revision }}"
      when: descends.rc | default(0) != 0
    - name: Name the build state
      ansible.builtin.set_fact:
        sealed: "{{ state.revision == sha }}"
    - name: Require space for the release and a snapshot
      ansible.builtin.fail:
        msg: "gateway.release_disk_low: less than {{ state.database_size | int + 1073741824 }} bytes free on {{ base }}"
      when: not sealed and state.free | int < state.database_size | int + 1073741824
    - name: Require another release than the live one
      ansible.builtin.fail:
        msg: "gateway.release_current_incomplete: the current release {{ id }} is not sealed"
      when: not sealed and state.live == id
    - name: Build the tree of the release
      when: not sealed
      block:
        - name: Make a stopped build writable
          ansible.builtin.file: {path: "{{ release }}", state: directory, recurse: true, follow: false, mode: "u+w"}
          when: state.stopped == 'yes'
        - name: Remove a stopped build
          ansible.builtin.file: {path: "{{ release }}", state: absent}
          when: state.stopped == 'yes'
        - name: Clone the commit from the shared repository
          ansible.builtin.git:
            repo: "file://{{ repo }}"
            dest: "{{ release }}"
            version: "{{ sha }}"
            refspec: "+refs/orbit/{{ sha }}:refs/orbit/{{ sha }}"
            reference: "{{ repo }}"
          register: cloned
          ignore_errors: true  # noqa: ignore-errors
        - name: Report a failed clone
          ansible.builtin.fail:
            msg: "gateway.release_worktree_failed: cloning {{ sha }} failed"
          when: cloned.failed | default(false)
        - name: Make the cached configuration folder private
          ansible.builtin.file: {path: "{{ app }}/bootstrap/cache", state: directory, mode: "0700"}
        - name: Make the shared storage folders
          ansible.builtin.command:
            argv:
              - install
              - -d
              - -m
              - "0750"
              - "{{ base }}/shared/gateway-storage/app/private"
              - "{{ base }}/shared/gateway-storage/app/public"
              - "{{ base }}/shared/gateway-storage/framework/cache/data"
              - "{{ base }}/shared/gateway-storage/framework/sessions"
              - "{{ base }}/shared/gateway-storage/framework/views"
              - "{{ base }}/shared/gateway-storage/logs"
          changed_when: false
        - name: Link the shared environment file
          ansible.builtin.file: {src: "{{ base }}/shared/gateway.env", dest: "{{ app }}/.env", state: link, force: true}
        - name: Keep the tracked storage files out of git status
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              git -C "{{ release }}" ls-files -z -- apps/gateway/storage | xargs -0 -r git -C "{{ release }}" update-index --skip-worktree --
            executable: /bin/bash
          changed_when: false
        - name: Remove the storage folder of the commit
          ansible.builtin.file: {path: "{{ app }}/storage", state: absent}
        - name: Keep the storage link out of git status
          ansible.builtin.lineinfile:
            path: "{{ release }}/.git/info/exclude"
            line: /apps/gateway/storage
            create: true
            mode: "0644"
        - name: Link the shared storage
          ansible.builtin.file: {src: "{{ base }}/shared/gateway-storage", dest: "{{ app }}/storage", state: link}
        - name: Install the dependencies
          community.general.composer:
            command: install
            working_dir: "{{ release }}/{{ item }}"
            no_dev: true
            prefer_dist: true
            optimize_autoloader: false
          loop: [apps/cli, apps/gateway]
          register: dependencies
          ignore_errors: true  # noqa: ignore-errors
        - name: Report failed dependencies
          ansible.builtin.fail:
            msg: "gateway.release_dependencies_failed: composer install failed in {{ item.item }}: {{ (item.msg | default('')).splitlines()[-1:] | join }}"
          when: item.failed | default(false)
          loop: "{{ dependencies.results }}"
          loop_control: {label: "{{ item.item }}"}
        - name: Check the platform requirements
          community.general.composer:
            command: check-platform-reqs
            working_dir: "{{ release }}/{{ item }}"
            arguments: --no-dev
          loop: [apps/cli, apps/gateway]
          register: platform
          changed_when: false
          ignore_errors: true  # noqa: ignore-errors
        - name: Report failed platform requirements
          ansible.builtin.fail:
            msg: "gateway.release_dependencies_failed: platform requirements failed in {{ item.item }}"
          when: item.failed | default(false)
          loop: "{{ platform.results }}"
          loop_control: {label: "{{ item.item }}"}
        - name: Write the agent delivery manifest
          ansible.builtin.command:
            argv: [install, -D, -m, "0444", /dev/stdin, "{{ release }}/apps/agent/delivery/manifest.json"]
            stdin: "{{ intent.manifest }}"
          changed_when: true
        - name: Give the web server the release folders
          ansible.builtin.file: {path: "{{ item }}", state: directory, group: caddy, mode: "0710"}
          loop: ["{{ base }}/releases", "{{ release }}", "{{ release }}/apps", "{{ app }}"]
        - name: Keep the shared environment file private
          ansible.builtin.file: {path: "{{ base }}/shared/gateway.env", mode: "0600"}
    - name: Cache the configuration of the release
      block:
        - name: Cache the configuration
          ansible.builtin.command:
            argv: [timeout, "120", php8.5, "{{ app }}/artisan", config:cache, --no-interaction, --quiet]
          environment:
            APP_CONFIG_CACHE: "{{ app }}/bootstrap/cache/config.next-{{ id }}.php"
            ORBIT_AGENT_DELIVERY: "{{ release }}/apps/agent/delivery/manifest.json"
          changed_when: false
        - name: Publish the cached configuration
          ansible.builtin.command: {argv: [mv, -T, "{{ app }}/bootstrap/cache/config.next-{{ id }}.php", "{{ app }}/bootstrap/cache/config.php"]}
          changed_when: true
      rescue:
        - name: Remove the candidate
          ansible.builtin.file: {path: "{{ app }}/bootstrap/cache/config.next-{{ id }}.php", state: absent}
        - name: Report the failed configuration
          ansible.builtin.fail:
            msg: "gateway.release_configuration_failed: config:cache failed"
    - name: Seal the release
      when: not sealed
      block:
        - name: Write the revision
          ansible.builtin.copy: {dest: "{{ release }}/REVISION", content: "{{ sha }}\n", mode: "0644"}
        - name: Take the write bit from the release
          ansible.builtin.command:
            argv:
              - find
              - "{{ release }}"
              - -path
              - "{{ app }}/bootstrap/cache"
              - -prune
              - -o
              - -path
              - "{{ release }}/apps/cli/storage"
              - -prune
              - -o
              - "("
              - -type
              - f
              - -o
              - -type
              - d
              - ")"
              - "!"
              - -type
              - l
              - -exec
              - chmod
              - a-w
              - "{}"
              - "+"
          changed_when: true
    - name: Render the grants of the new code
      ansible.builtin.command:
        argv:
          - php8.5
          - -r
          - 'require $argv[1]."/vendor/autoload.php";
            $g = (new App\Infrastructure\GatewayReleases\SwampGrantRenderer)->render($argv[2]);
            echo $g["grants/orbit-gateway.yaml"], "---\n", $g["grants/orbit-serve.yaml"];'
          - "{{ app }}"
          - "{{ release }}/swamp"
      register: grants
      changed_when: false
    - name: Leave the grants for the Swamp step
      ansible.builtin.copy: {dest: "{{ run_dir }}/grants", content: "{{ grants.stdout }}", mode: "0600"}
      delegate_to: swamp

- name: Install the web build
  hosts: gateway
  tags: [web]
  gather_facts: false
  become: true
  vars: *release
  tasks:
    - name: Read the web build and its folder
      ansible.builtin.shell:
        cmd: |
          printf 'built=%s\n' "$(test -e "{{ base }}/web/releases/{{ id }}/index.html" && echo yes)"
          printf 'owner=%s\n' "$(stat -c %U "{{ base }}/web")"
        executable: /bin/bash
      register: read
      changed_when: false
    - name: Name the state
      ansible.builtin.set_fact:
        web: "{{ dict(read.stdout_lines | map('split', '=', 1) | list) }}"
    - name: Install the web build
      when: web.built != 'yes'
      block:
        - name: Refuse an artifact above 128 MiB
          ansible.builtin.fail:
            msg: "gateway.release_web_build_invalid: artifact of {{ intent.web.size }} bytes is above 128 MiB"
          when: intent.web.size | int > 134217728
        - name: Install the artifact
          block:
            - name: Ask GitHub where the artifact is
              ansible.builtin.uri:
                url: "https://api.github.com/repos/{{ intent.repository }}/actions/artifacts/{{ intent.web.artifact_id }}/zip"
                headers: {Authorization: "Bearer {{ token }}"}
                follow_redirects: none
                status_code: 302
              register: location
              no_log: true
            - name: Download the artifact from its storage
              ansible.builtin.get_url:
                url: "{{ location.location }}"
                dest: "/tmp/orbit-web-{{ id }}.zip"
                mode: "0600"
              no_log: true
            - name: Read the digest of the artifact
              ansible.builtin.stat: {path: "/tmp/orbit-web-{{ id }}.zip", checksum_algorithm: sha256}
              register: downloaded
            - name: Refuse an artifact that does not match its digest
              ansible.builtin.fail:
                msg: "gateway.release_web_build_invalid: artifact {{ intent.web.artifact_id }} does not match its digest"
              when: downloaded.stat.checksum != intent.web.digest | regex_replace('^sha256:', '')
            - name: Make the web builds folder
              ansible.builtin.file:
                path: "{{ base }}/web/releases"
                state: directory
                owner: "{{ web.owner }}"
                group: caddy
                mode: "0750"
            - name: Publish the web build
              orbit_web_build:
                src: "/tmp/orbit-web-{{ id }}.zip"
                dest: "{{ base }}/web/releases/{{ id }}"
                owner: "{{ web.owner }}"
                group: caddy
          rescue:
            - name: Report the failed artifact
              ansible.builtin.fail:
                msg: >-
                  {{ ansible_failed_result.msg | default('')
                  if (ansible_failed_result.msg | default('')).startswith('gateway.release_')
                  else 'gateway.release_web_build_unavailable: artifact ' ~ intent.web.artifact_id
                  ~ ' could not be downloaded or does not match its digest' }}
          always:
            - name: Remove the download
              ansible.builtin.file: {path: "/tmp/orbit-web-{{ id }}.zip", state: absent}

- name: Snapshot the database
  hosts: gateway
  tags: [snapshot]
  gather_facts: false
  vars: *release
  tasks:
    - name: Make the backups folder
      ansible.builtin.file: {path: "{{ base }}/.orbit/backups", state: directory, mode: "0700"}
    - name: Name the snapshot
      ansible.builtin.set_fact:
        snapshot: "{{ base }}/.orbit/backups/pre-{{ id }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-{{ '%016x' | format((2**62) | random) }}.sqlite"
    - name: Copy the database into the snapshot
      block:
        - name: Write the snapshot
          ansible.builtin.command:
            argv:
              - php8.5
              - -r
              - '$c = require $argv[1];
                $db = new PDO("sqlite:".$c["database"]["connections"]["sqlite"]["database"], null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                $db->exec("VACUUM INTO ".$db->quote($argv[2]));'
              - "{{ app }}/bootstrap/cache/config.php"
              - "{{ snapshot }}.partial"
          changed_when: true
        - name: Publish the snapshot
          ansible.builtin.command: {argv: [mv, -T, "{{ snapshot }}.partial", "{{ snapshot }}"]}
          changed_when: true
      rescue:
        - name: Remove the partial snapshot
          ansible.builtin.file: {path: "{{ snapshot }}.partial", state: absent}
        - name: Report the failed snapshot
          ansible.builtin.fail:
            msg: "gateway.release_snapshot_failed: VACUUM INTO failed"
    - name: Read the snapshots
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          printf 'paused=%s\n' "$(cat "{{ base }}/.orbit/gateway-release.paused" 2>/dev/null | tr -d '\n')"
          ls -1t "{{ base }}"/.orbit/backups/pre-*.sqlite | sed 's/^/snapshot=/'
        executable: /bin/bash
      register: read
      changed_when: false
    - name: Name the snapshots beyond the newest three, except the one a pause names
      ansible.builtin.set_fact:
        old_snapshots: >-
          {{ (read.stdout_lines | select('match', '^snapshot=') | map('regex_replace', '^snapshot=', '') | list)[3:]
          | reject('equalto', pause_snapshot) | list }}
      vars:
        pause_snapshot: "{{ (((read.stdout_lines | first).split('=', 1)[1] or '{}') | from_json).snapshot | default('') }}"
    - name: Remove the old snapshots
      ansible.builtin.file: {path: "{{ item }}", state: absent}
      loop: "{{ old_snapshots }}"
    - name: Leave the snapshot path for the Swamp step
      ansible.builtin.copy: {dest: "{{ run_dir }}/snapshot", content: "{{ snapshot }}\n", mode: "0600"}
      delegate_to: swamp

- name: Switch the release
  hosts: gateway
  tags: [activate]
  gather_facts: false
  vars:
    <<: *release
    target: "{{ intent.id }}"
    unit: "{{ intent.horizon_unit }}"
    live_application: "{{ release_base | default('/home/orbit') }}/orbit/apps/gateway"
  tasks:
    - name: Drain, switch and check the release, and put the previous one back when the check fails
      block:
        - name: Drain Horizon
          when: unit != ''
          block:
            - name: Read the Horizon unit
              ansible.builtin.systemd: {name: "{{ unit }}"}
              become: true
              register: horizon
            - name: Refuse a unit that would kill a running job
              ansible.builtin.fail:
                msg: "gateway.release_horizon_unit_stale: {{ unit }} lacks the stop policy; update the Horizon Process"
              when: horizon.status.KillMode != 'mixed' or horizon.status.SendSIGKILL != 'no'
            - name: Stop Horizon and wait for its jobs
              ansible.builtin.systemd: {name: "{{ unit }}", state: stopped}
              become: true
              register: stopped
              failed_when: false
            - name: Report a unit that did not stop
              ansible.builtin.fail:
                msg: "gateway.release_horizon_not_drained: {{ unit }} is not stopped"
              when: stopped.status.ActiveState | default('unknown') != 'inactive'
        - name: Read the state of the release
          ansible.builtin.shell:
            cmd: |
              printf 'revision=%s\n' "$(cat "{{ base }}/releases/{{ target }}/REVISION" 2>/dev/null)"
              printf 'web=%s\n' "$(test -e "{{ base }}/web/releases/{{ target }}/index.html" && echo yes)"
            executable: /bin/bash
          register: read
          changed_when: false
        - name: Name the state
          ansible.builtin.set_fact:
            release_state: "{{ dict(read.stdout_lines | map('split', '=', 1) | list) }}"
        - name: Require a sealed release
          ansible.builtin.fail:
            msg: "gateway.release_not_prepared: release {{ target }} is not sealed"
          when: release_state.revision != intent.sha
        - name: Read the cleanup generations before the switch
          block:
            - name: Read the generations
              ansible.builtin.command:
                argv: [php8.5, "{{ base }}/releases/{{ target }}/apps/gateway/artisan", "gateway:release:cleanup", "--no-interaction"]
              register: cleanup
              changed_when: false
            - name: Name the generations
              ansible.builtin.set_fact:
                generations: "{{ (cleanup.stdout | from_json).generations | to_json(separators=(',', ':')) }}"
          rescue:
            - name: Report unreadable generations
              ansible.builtin.fail:
                msg: "gateway.release_cleanup_unreadable: the release cleanup generations could not be read"
        - name: Switch the links
          ansible.builtin.file: {src: "releases/{{ target }}", dest: "{{ item }}", state: link, force: true}
          loop: "{{ [base ~ '/orbit'] + ([base ~ '/web/current'] if release_state.web == 'yes' else []) }}"
        - name: Reload PHP-FPM
          ansible.builtin.systemd: {name: php8.5-fpm.service, state: reloaded}
          become: true
        - name: Read the working directory of each running service
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              systemctl list-units --type=service --state=active --plain --no-legend | awk '{print $1}' | while read -r unit; do
                printf '%s\t%s\n' "$unit" "$(systemctl show -p WorkingDirectory --value "$unit")"
              done
            executable: /bin/bash
          register: units
          changed_when: false
        - name: Name the services that run from the application
          ansible.builtin.set_fact:
            restart_units: >-
              {{ units.stdout_lines | select('search', '\t' ~ (live_application | regex_escape) ~ '(/.*)?$') | map('split', '\t') | map('first') | list }}
        - name: Restart the services that run from the application
          ansible.builtin.systemd: {name: "{{ item }}", state: restarted}
          become: true
          loop: "{{ restart_units }}"
        - name: Remember that the release is switched
          ansible.builtin.set_fact:
            switched: true
            verifying: true
        - name: Ask the Gateway whether it is up
          ansible.builtin.uri:
            url: https://gateway.orbit/up
            ca_path: /etc/caddy/orbit-cert-current/root-ca.pem
            timeout: 15
            return_content: false
          register: up
          until: up.status == 200
          retries: 5
          delay: 4
          failed_when: false
        - name: Require the Gateway to answer
          ansible.builtin.fail:
            msg: "gateway.release_verify_failed: /up does not answer"
          when: up.status | default(0) != 200
        - name: Ask the Gateway for its version
          ansible.builtin.uri:
            url: https://gateway.orbit/api/v1/gateway/status
            ca_path: /etc/caddy/orbit-cert-current/root-ca.pem
            timeout: 15
            return_content: true
          register: status
          until: status.status == 200
          retries: 5
          delay: 4
          failed_when: false
        - name: Require the released version
          ansible.builtin.fail:
            msg: "gateway.release_verify_failed: status is not ok on {{ intent.sha }}"
          when: >-
            status.status | default(0) != 200
            or (status.json.data | default(status.json)).status | default('') != 'ok'
            or (status.json.data | default(status.json)).version | default('') not in [intent.sha, intent.sha[0:12]]
      rescue:
        - name: Put the previous release back
          when: verifying | default(false)
          block:
            - name: Read the web build of the previous release
              ansible.builtin.shell:
                cmd: |
                  printf 'web=%s\n' "$(test -e "{{ base }}/web/releases/{{ intent.previous }}/index.html" && echo yes)"
                executable: /bin/bash
              register: back
              changed_when: false
            - name: Switch the links back
              ansible.builtin.file: {src: "releases/{{ intent.previous }}", dest: "{{ item }}", state: link, force: true}
              loop: "{{ [base ~ '/orbit'] + ([base ~ '/web/current'] if back.stdout == 'web=yes' else []) }}"
            - name: Reload PHP-FPM for the previous release
              ansible.builtin.systemd: {name: php8.5-fpm.service, state: reloaded}
              become: true
            - name: Restart the services for the previous release
              ansible.builtin.systemd: {name: "{{ item }}", state: restarted}
              become: true
              loop: "{{ restart_units }}"
        - name: Fail the run with the reason
          ansible.builtin.fail:
            msg: >-
              {{ ('gateway.release_switched_back: the check failed; release ' ~ intent.previous ~ ' is current again')
              if verifying | default(false) else (ansible_failed_result.msg | default('gateway.release_switch_failed: the switch failed')) }}
      always:
        - name: Start Horizon
          ansible.builtin.systemd: {name: "{{ unit }}", state: started}
          become: true
          when: unit != ''
        - name: Resume the release cleanups
          ansible.builtin.command:
            argv: [timeout, "300", php8.5, "{{ base }}/orbit/apps/gateway/artisan", "gateway:release:cleanup", "--no-interaction", "--before={{ generations }}"]
          changed_when: true
          ignore_errors: true  # noqa: ignore-errors
          when: switched | default(false)
    - name: Tidy up after a verified release
      block:
        - name: Read the releases
          ansible.builtin.shell:
            cmd: |
              printf 'now=%s\n' "$(date +%s)"
              printf 'live=%s\n' "$(basename "$(readlink "{{ base }}/orbit")")"
              printf 'web_live=%s\n' "$(basename "$(readlink "{{ base }}/web/current")")"
              stat -c 'sealed %n %Y' "{{ base }}"/releases/*/REVISION 2>/dev/null
              stat -c 'folder %n %Y' "{{ base }}"/releases/*/ 2>/dev/null
              stat -c 'web %n' "{{ base }}"/web/releases/*/ 2>/dev/null
              git -C "{{ repo }}" for-each-ref --format='pin %(refname)' refs/orbit
            executable: /bin/bash
          register: tidy
          changed_when: false
        - name: Name what to keep and what to remove
          ansible.builtin.set_fact:
            removable: "{{ stale_sealed + stale_unsealed }}"
            removable_web: "{{ web_ids | reject('equalto', tidy_web_live) | reject('in', remaining_ids) | list }}"
          vars:
            tidy_live: "{{ (tidy.stdout_lines | select('match', '^live=') | first).split('=', 1)[1] }}"
            tidy_web_live: "{{ (tidy.stdout_lines | select('match', '^web_live=') | first).split('=', 1)[1] }}"
            clock: "{{ (tidy.stdout_lines | select('match', '^now=') | first).split('=', 1)[1] | int }}"
            sealed_rows: "{{ tidy.stdout_lines | select('match', '^sealed ') | map('split', ' ') | list }}"
            newest: "{{ sealed_rows | sort(attribute='2', reverse=true) | list }}"
            kept: "{{ newest[: keep_count | int] | map(attribute='1') | map('dirname') | map('basename') | list }}"
            keep_count: "{{ intent.keep | int }}"
            folder_rows: "{{ tidy.stdout_lines | select('match', '^folder ') | map('split', ' ') | list }}"
            folder_ids: "{{ folder_rows | map(attribute='1') | map('regex_replace', '/$', '') | map('basename') | list }}"
            sealed_ids: "{{ sealed_rows | map(attribute='1') | map('dirname') | map('basename') | list }}"
            old_rows: "{{ folder_rows | selectattr('2', 'lt', ((clock | int) - 3600) | string) | list }}"
            old_ids: "{{ old_rows | map(attribute='1') | map('regex_replace', '/$', '') | map('basename') | list }}"
            protected: "{{ [tidy_live, id, intent.previous, tidy_web_live] + kept }}"
            stale: "{{ folder_ids | reject('in', protected) | list }}"
            stale_sealed: "{{ stale | select('in', sealed_ids) | list }}"
            stale_unsealed: "{{ stale | reject('in', sealed_ids) | select('in', old_ids) | list }}"
            web_ids: >-
              {{ tidy.stdout_lines | select('match', '^web ') | map('regex_replace', '^web ', '') | map('regex_replace', '/$', '')
              | map('basename') | list }}
            remaining_ids: "{{ folder_ids | reject('in', stale_sealed + stale_unsealed) | list }}"
        - name: Make the old releases writable
          ansible.builtin.file: {path: "{{ base }}/releases/{{ item }}", state: directory, recurse: true, follow: false, mode: "u+w"}
          loop: "{{ removable }}"
        - name: Remove the old releases
          ansible.builtin.file: {path: "{{ base }}/releases/{{ item }}", state: absent}
          loop: "{{ removable }}"
        - name: Remove the web builds whose release is gone
          ansible.builtin.file: {path: "{{ base }}/web/releases/{{ item }}", state: absent}
          loop: "{{ (removable + removable_web) | unique }}"
          when: item in web_ids_all
          vars:
            web_ids_all: >-
              {{ tidy.stdout_lines | select('match', '^web ') | map('regex_replace', '^web ', '') | map('regex_replace', '/$', '')
              | map('basename') | list }}
        - name: Forget the worktree records of removed releases
          ansible.builtin.command: {argv: [git, -C, "{{ repo }}", worktree, prune]}
          changed_when: false
          when: removable | length > 0
        - name: Remove the pins of removed releases
          ansible.builtin.command: {argv: [git, -C, "{{ repo }}", update-ref, -d, "{{ item }}"]}
          changed_when: true
          loop: >-
            {{ tidy.stdout_lines | select('match', '^pin refs/orbit/[0-9a-f]{40}$') | map('regex_replace', '^pin ', '') | list
            | select('search', '^refs/orbit/(' ~ (removable | select('match', '^[0-9a-f]{12}$') | list | join('|')) ~ ')')
            | list if (removable | select('match', '^[0-9a-f]{12}$') | list | length) > 0 else [] }}
        - name: Find the run folders of earlier releases on the Swamp Node
          ansible.builtin.find: {paths: /tmp, patterns: ["orbit-gateway-release-*"], file_type: directory, age: 2h}
          delegate_to: swamp
          register: run_folders
        - name: Remove the run folders of earlier releases
          ansible.builtin.file: {path: "{{ item.path }}", state: absent}
          delegate_to: swamp
          loop: "{{ run_folders.files }}"
          loop_control: {label: "{{ item.path }}"}
        - name: Read the start cache of Swamp
          ansible.builtin.stat: {path: /tmp/deno-compile-swamp.cache}
          delegate_to: swamp
          register: cache
        - name: Read the Swamp binary
          ansible.builtin.stat: {path: /usr/local/bin/swamp, follow: true}
          delegate_to: swamp
          register: binary
        - name: Remove a start cache older than the binary
          ansible.builtin.file: {path: /tmp/deno-compile-swamp.cache, state: absent}
          delegate_to: swamp
          become: true
          when: cache.stat.exists and binary.stat.exists and cache.stat.mtime < binary.stat.ctime
          notify: Seed the start cache as root
      rescue:
        - name: Leave the tidying for the next release
          ansible.builtin.debug:
            msg: "the tidying after the release failed; a later release retries"
  handlers:
    - name: Seed the start cache as root
      ansible.builtin.command: {argv: [/usr/local/bin/swamp, --version]}
      delegate_to: swamp
      become: true
      changed_when: true

- name: Render the grants of the previous release
  hosts: gateway
  tags: [previous]
  gather_facts: false
  vars: *release
  tasks:
    - name: Read the live release and the previous revision
      ansible.builtin.shell:
        cmd: |
          printf 'live=%s\n' "$(basename "$(readlink "{{ base }}/orbit")")"
          printf 'revision=%s\n' "$(cat "{{ base }}/releases/{{ intent.previous }}/REVISION" 2>/dev/null)"
        executable: /bin/bash
      register: read
      changed_when: false
    - name: Name the state
      ansible.builtin.set_fact:
        state: "{{ dict(read.stdout_lines | map('split', '=', 1) | list) }}"
    - name: Refuse to restore Swamp while the Gateway runs another release
      ansible.builtin.fail:
        msg: "gateway.release_restore_refused: the Gateway runs {{ state.live }}, not {{ intent.previous }}"
      when: state.live != intent.previous
    - name: Require a sealed previous release
      ansible.builtin.fail:
        msg: "gateway.release_previous_unavailable: release {{ intent.previous }} has no REVISION"
      when: state.revision == ''
    - name: Render the grants of the previous code
      ansible.builtin.command:
        argv:
          - php8.5
          - -r
          - 'require $argv[1]."/vendor/autoload.php";
            $g = (new App\Infrastructure\GatewayReleases\SwampGrantRenderer)->render($argv[2]);
            echo $g["grants/orbit-gateway.yaml"], "---\n", $g["grants/orbit-serve.yaml"];'
          - "{{ base }}/releases/{{ intent.previous }}/apps/gateway"
          - "{{ base }}/releases/{{ intent.previous }}/swamp"
      register: previous_grants
      changed_when: false
    - name: Leave the previous commit and its grants for the Swamp step
      ansible.builtin.copy:
        dest: "{{ run_dir }}/previous"
        content: "{{ state.revision }}---\n{{ previous_grants.stdout }}"
        mode: "0600"
      delegate_to: swamp
