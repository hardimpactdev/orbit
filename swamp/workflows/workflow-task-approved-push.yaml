id: 97cafe64-2c19-4eec-9087-b65fefa3a22c
name: task-approved-push
# Each SSH step is limited to 3900 s, the run budget of the largest Operation that calls it (OperationBudgetTable::SecondsByKind).
description: Push one approved task commit to its task branch without force; the VM bundles it, 209 pushes it with the admitted token.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    # The root run of the Operation, which the Gateway checks when it mints the push token.
    run_id:
      type: string
      pattern: ^[a-f0-9-]{36}$
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - run_id
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: push
  labels: {role: swamp}
  steps:
  - name: Mark the approved commit
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-approved-push-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh_args
        name: '${{ ("task-approved-push-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - update-ref
        - refs/orbit/approved
        - ${{ inputs.intent.commit }}
  - name: Bundle the approved commit
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-approved-push-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - bundle
        - create
        - ${{ "/tmp/orbit-task-approved-" + run.id + ".bundle" }}
        - refs/orbit/approved
    dependsOn:
    - step: Mark the approved commit
      condition:
        type: succeeded
  - name: Copy the bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-approved-push-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        src: ${{ "/tmp/orbit-task-approved-" + run.id + ".bundle" }}
        dst: ${{ "/tmp/orbit-task-approved-" + run.id + "-local.bundle" }}
        direction: from
    dependsOn:
    - step: Bundle the approved commit
      condition:
        type: succeeded
  - name: Mint the push token
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        purpose: publish
    dependsOn:
    - step: Copy the bundle
      condition:
        type: succeeded
  - name: Push the approved commit
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-approved-push" }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          git init --quiet --bare --template= --object-format="$ORBIT_OBJECT_FORMAT" "$ORBIT_REPOSITORY"
          git -C "$ORBIT_REPOSITORY" fetch --quiet --no-tags "$ORBIT_BUNDLE" refs/orbit/approved:refs/heads/approved
          test "$(git -C "$ORBIT_REPOSITORY" rev-parse refs/heads/approved)" = "$ORBIT_COMMIT"
          git -C "$ORBIT_REPOSITORY" push --porcelain -- "$ORBIT_REMOTE" "$ORBIT_REFSPEC"
        timeout: 120000
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_ALLOW_PROTOCOL: file:https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          GIT_CONFIG_KEY_2: core.hooksPath
          GIT_CONFIG_VALUE_2: /dev/null
          GIT_CONFIG_KEY_3: http.followRedirects
          GIT_CONFIG_VALUE_3: 'false'
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-approved-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_OBJECT_FORMAT: ${{ inputs.intent.object_format }}
          ORBIT_BUNDLE: ${{ "/tmp/orbit-task-approved-" + run.id + "-local.bundle" }}
          ORBIT_REPOSITORY: ${{ "/tmp/orbit-task-approved-" + run.id + ".git" }}
          ORBIT_COMMIT: ${{ inputs.intent.commit }}
          ORBIT_REMOTE: ${{ inputs.intent.remote }}
          ORBIT_REFSPEC: ${{ inputs.intent.refspec }}
    dependsOn:
    - step: Mint the push token
      condition:
        type: succeeded
  - name: Revoke the token
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-approved-push-revoke" }}'
      methodName: execute
      inputs:
        run: |
          gh api --method DELETE installation/token
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-approved-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    guard: ${{ !("Mint the push token" in steps && steps["Mint the push token"].status == "succeeded") }}
    allowFailure: true
    dependsOn:
    - step: Push the approved commit
      condition:
        type: always
  - name: Remove the guest bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-approved-push-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - rm
        - -f
        - --
        - ${{ "/tmp/orbit-task-approved-" + run.id + ".bundle" }}
    allowFailure: true
    dependsOn:
    - step: Push the approved commit
      condition:
        type: always
  - name: Remove the local copy
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-approved-push-cleanup" }}'
      methodName: execute
      inputs:
        run: |
          rm -rf -- "$ORBIT_BUNDLE" "$ORBIT_REPOSITORY" "$GH_CONFIG_DIR"
        env:
          ORBIT_BUNDLE: ${{ "/tmp/orbit-task-approved-" + run.id + "-local.bundle" }}
          ORBIT_REPOSITORY: ${{ "/tmp/orbit-task-approved-" + run.id + ".git" }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-approved-" + run.id + "-gh" }}
    allowFailure: true
    dependsOn:
    - step: Revoke the token
      condition:
        type: always
queueTimeout: 60
