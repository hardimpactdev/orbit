name: Orbit GHCR Maintenance

on:
  workflow_dispatch:
    inputs:
      package:
        description: Container package to delete
        required: true
        type: choice
        default: orbit-gateway
        options:
          - orbit-gateway
      confirm_delete:
        description: Confirm package deletion
        required: true
        type: boolean
        default: false

permissions:
  packages: write

jobs:
  delete-package:
    name: Delete GHCR package
    runs-on: ubuntu-latest

    steps:
      - name: Delete package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REPOSITORY}" != "hardimpactdev/orbit" ]; then
            echo "Refusing to delete packages outside hardimpactdev/orbit." >&2
            exit 1
          fi

          if [ "${CONFIRM_DELETE}" != "true" ]; then
            echo "Set confirm_delete=true to delete ${PACKAGE}." >&2
            exit 1
          fi

          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}"
