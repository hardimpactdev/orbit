# SPIKE. Molecule scenario `udp`: the cases protocols[udp] and protocols[both] of swamp/proof/firewall/allow.cases.yaml
# (protocols[tcp] is protocols_tcp of the scenario `default`). Same driver, platforms and inventory as `default`; run on the task VM
# against the nested fleet that `tasks:provision` already built, from the parent directory (firewall-allow/):
#   molecule test -s udp            # prepare (listeners, test denies, "blocked before" probes) -> converge (the CLI) -> verify (state)
# A second run on a fleet that was not restored needs `molecule reset -s udp` and another PROOF_PORT_BASE (see `default`).
# ANSIBLE_FORKS is the limit: cases that run at a time, and probes that run at a time.
driver:
  name: default
  options:
    managed: false

# Molecule needs a platform list even when it manages none; these are the existing Nodes.
platforms:
  - name: nested-gateway
  - name: nested-app-dev
  - name: nested-app-prod

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: ansible.builtin.default
      callbacks_enabled: ansible.posix.profile_tasks
      gathering: explicit
      interpreter_python: auto_silent
      # converge.yml leaves its results as cacheable facts; verify.yml reads them in the next ansible-playbook run.
      # Its own directory: the scenario `default` keeps its facts apart.
      fact_caching: jsonfile
      fact_caching_connection: /tmp/molecule-firewall-allow-udp-facts
      fact_caching_timeout: 3600
  inventory:
    hosts:
      all:
        vars:
          # The nested Gateway, as the outer VM reaches it. The caller is identified by its WireGuard address, so no token is needed.
          gateway_url: https://10.45.0.1/api/v1
          gateway_ca: /home/orbit/.orbit/nested-ca.pem
          # The CLI under test, as the outer VM runs it: the checkout of the VM, the nested profile in ORBIT_HOME.
          checkout: "{{ lookup('ansible.builtin.env', 'ORBIT_CHECKOUT') | default('/home/orbit/apps/orbit/workspace', true) }}"
          orbit: [php, "{{ checkout }}/apps/cli/orbit"]
          cli_env: {PATH: /usr/local/bin:/usr/bin:/bin, HOME: /home/orbit, ORBIT_HOME: /home/orbit/.orbit}
          parallel_limit: "{{ lookup('ansible.builtin.env', 'ANSIBLE_FORKS') | default('1', true) | int }}"
          # PROOF_FAST=1: poll async jobs every 1 s instead of 5 s, and read the facts of `default/facts.yml` once.
          fast: "{{ lookup('ansible.builtin.env', 'PROOF_FAST') | default('0', true) == '1' }}"
          poll_delay: "{{ 1 if fast else 5 }}"
          # The runner's `target: app-dev` and `sources: [gateway, app-prod]`: the Node under test, the one source an allow admits, and the
          # one that stays blocked.
          target: app-dev
          allowed: gateway
          blocked: app-prod
          port_base: "{{ lookup('ansible.builtin.env', 'PROOF_PORT_BASE') | default(47100, true) | int }}"
          # The variants of the case `protocols`: a test port that nothing admits and a control port that works, the protocols the rule is
          # judged over (`protos`), the `protocol` that the Gateway stores, and the flags of the command. The ports differ from `default`.
          cases:
            protocols_udp:  {port: "{{ port_base | int + 6 }}", control: "{{ port_base | int + 16 }}", protos: [udp], stored: udp, flags: ["--protocol=udp"]}
            protocols_both: {port: "{{ port_base | int + 7 }}", control: "{{ port_base | int + 17 }}", protos: [tcp, udp], stored: any, flags: []}
          # The programs that run inside a container, in one place. Python is on the VM and in the containers; nothing else is installed.
          # UDP echo listener, one process per port (runner/listener.py answers `ok` too): the first argument is the port.
          udp_echo: |
            import socket, sys
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            s.bind(('0.0.0.0', int(sys.argv[1])))
            while True:
                s.sendto(b'ok\n', s.recvfrom(16)[1])
          # UDP probe (runner/probe.py): send one datagram and wait for the echo. `timeout 3` (the runner's PROBE_SECONDS) ends the wait, so the exit code tells the result:
          # 0 the echo came, 124 nothing came (dropped: blocked), 1 an ICMP refusal (refused, which fits neither expectation).
          udp_probe: "import socket,sys; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.connect((sys.argv[1],int(sys.argv[2]))); s.send(b'p'); s.recv(9)"
          # The command of one probe; the dict `p` (tip, port, proto) is set by the task. TCP is a plain connect, as in `default`.
          probe_argv: >-
            {{ ['timeout', '3', 'bash', '-c', 'echo > /dev/tcp/' ~ p.tip ~ '/' ~ p.port] if p.proto == 'tcp'
               else ['timeout', '3', 'python3', '-c', udp_probe, p.tip, p.port | string] }}
        children:
          control:
            hosts:
              localhost:
                ansible_connection: local
          # One host per case, so Ansible's own `forks` setting is the limit of cases that run at a time. Both cases write to the firewall of
          # the one target Node; the product refuses a second write while one runs (operation.target_busy), and the CLI call asks again.
          case_hosts:
            vars:
              ansible_connection: local
            hosts:
              protocols_udp: {}
              protocols_both: {}
          nodes:
            vars:
              ansible_connection: community.general.incus
            hosts:
              nested-gateway:  {ansible_incus_host: nested-gateway}
              nested-app-dev:  {ansible_incus_host: nested-app-dev}
              nested-app-prod: {ansible_incus_host: nested-app-prod}

scenario:
  test_sequence:
    - prepare
    - converge
    - verify
