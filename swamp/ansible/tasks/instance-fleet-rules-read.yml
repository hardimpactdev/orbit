---
# Read the fleet rules of instance-fleet.yml from the inner Incus and set `fleet_drift`: one entry for each rule that a nested container
# lacks, with the container, the rule's name and its class. instance-fleet-rules.yml reads before it applies and again to check.
# Classes: `owned`, a rule Orbit writes on an existing fleet; `build`, a build rule whose key is absent; `foreign`, a build rule whose
# key holds another value, or a nested container or the inner bridge that cannot be read. Only `owned` and `build` are ever written.
# Every file rule is owned, so a comparison that only refuses (`fleet_rules_files` false: the check and the start) never reads the files.
- name: Read the nested containers
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_incus + ['query', '/1.0/instances/' ~ intent.fleet.guests[item]] }}" }
  loop: "{{ fleet_roles }}"
  register: fleet_rules_read
  changed_when: false
  failed_when: false
- name: Read the inner bridge
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_incus + ['query', '/1.0/networks/' ~ fleet_network] }}" }
  register: fleet_network_read
  changed_when: false
  failed_when: false
- name: Read the fleet files
  when: fleet_rules_files | default(true) | bool
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['file', 'pull', item.container ~ item.path, '-'] }}"
  loop: "{{ fleet_files }}"
  loop_control: { label: "{{ item.container }}{{ item.path }}" }
  register: fleet_files_read
  changed_when: false
  failed_when: false
- name: Work out the rules a nested container lacks
  ansible.builtin.set_fact:
    fleet_drift: >-
      {%- set out = [] -%}
      {%- for read in fleet_rules_read.results -%}
      {%-   set name = intent.fleet.guests[read.item] -%}
      {%-   if read.rc != 0 -%}
      {%-     set _ = out.append({'container': name, 'kind': 'container', 'name': name, 'class': 'foreign'}) -%}
      {%-   else -%}
      {%-     set have = read.stdout | from_json -%}
      {%-     for device, want in fleet_rules[read.item].devices.items() -%}
      {%-       set got = have.devices[device] | default(none) -%}
      {%-       if got is none or got | combine(want) != got -%}
      {%-         set _ = out.append({'container': name, 'kind': 'device', 'name': device, 'want': want, 'present': got is not none,
                                    'class': 'owned'}) -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-     for key, value in fleet_rules[read.item].config.items() -%}
      {%-       set got = have.config[key] | default(none) -%}
      {%-       if got != value -%}
      {%-         set rule_class = 'owned' if key not in fleet_build_rules else ('build' if got is none else 'foreign') -%}
      {%-         set _ = out.append({'container': name, 'kind': 'config', 'name': key, 'want': value, 'class': rule_class}) -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- if fleet_network_read.rc != 0 -%}
      {%-   set _ = out.append({'container': fleet_network, 'kind': 'network', 'name': fleet_network, 'class': 'foreign'}) -%}
      {%- else -%}
      {%-   set have = fleet_network_read.stdout | from_json -%}
      {%-   for key, value in fleet_network_rules.items() -%}
      {%-     if have.config[key] | default(none) != value -%}
      {%-       set _ = out.append({'container': fleet_network, 'kind': 'network', 'name': key, 'want': value, 'class': 'owned'}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- for read in fleet_files_read.results | default([]) | selectattr('rc', 'defined') -%}
      {%-   if read.rc != 0 or read.stdout | trim != read.item.content | trim -%}
      {%-     set _ = out.append({'container': read.item.container, 'kind': 'file', 'name': read.item.path, 'want': read.item.content,
                                'class': 'owned'}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
