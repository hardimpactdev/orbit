              type: succeeded
        task:
          type: assert
          expr: steps.agent.outputs.ok
          message: The agent stage refused its admitted footprint
          severity: high
  - name: projection
    dependsOn:
      - job: admission
        condition:
          type: always
      - job: agent_install_job
        condition:
          type: always
      - job: caddy_package_job
        condition:
          type: always
      - job: caddy_job
        condition:
          type: always
      - job: peer_dns_job
        condition:
          type: always
      - job: private_dns_job
        condition:
          type: always
      - job: route_residue_job
        condition:
