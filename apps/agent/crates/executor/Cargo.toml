[package]
name = "orbit-executor"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "The Orbit executor: runs Gateway-signed orders on a Node; a mode of orbit-agent (ADR 0266, ADR 0267, ADR 0271)"

[lib]
path = "src/lib.rs"

# Until the pinned delivery carries an `orbit-agent` with the `execute` mode (ADR 0271 N7); the next pull request removes it.
[[bin]]
name = "orbit-executor"
path = "src/main.rs"

[dependencies]
orbit-executor-core = { path = "../executor-core" }

orbit-executor-power = { path = "../power" }
serde_json = "1"

[lints]
workspace = true
