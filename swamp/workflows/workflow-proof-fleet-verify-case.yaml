id: 5a1c0f3e-8d2b-4f6a-9c47-1e3b7a9d2c11
name: proof-fleet-verify-case
description: One proof case on the task VM as official SSH exec argv. A verdict other than passed triggers the batch setup, unless it was the last case of the batch.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    ssh_execution:
      type: object
    checkout_path:
      type: string
    group_id:
      type: integer
      minimum: 1
    file:
      type: string
    batch:
      type: string
    case:
      type: string
    setup:
      type: boolean
    last:
      type: boolean
  required:
  - ssh_execution
  - checkout_path
  - group_id
  - file
  - batch
  - case
  - setup
  - last
  additionalProperties: false
jobs:
- name: case
  labels: {role: swamp}
  steps:
  # One case is one step: its steps share ports and the state `unchanged` compares. Exit 0, 1 and 2 are verdicts, so any exit code is accepted;
  # a case with no verdict line is a transport fault and the report counts it as failed.
  - name: case
    labels: {role: swamp}
    allowFailure: true
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-verify-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh_args
        name: '${{ ("proof-verify-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 900
        argv:
        - python3
        - ${{ inputs.checkout_path + "/swamp/proof/runner/runner.py" }}
        - case
        - ${{ inputs.case }}
        - --file
        - ${{ inputs.checkout_path + "/" + inputs.file }}
        - --evidence
        - ${{ inputs.checkout_path + "/.orbit-artifacts/" + string(inputs.group_id) + "/verify" }}
  # A case that did not pass leaves the fleet in a state it may not have had: restore `base` and apply the checkout before the batch setup.
  - name: restore
    labels: {role: swamp}
    dependsOn:
    - step: case
      condition: {type: completed}
    guard: '${{ inputs.last || steps.?case.?outputs.?stdout.orValue("").contains("\"verdict\": \"passed\"") }}'
    allowFailure: true
    writes: true
    task:
      type: workflow
      workflowIdOrName: proof-fleet-restore
      inputs:
        ssh_execution: ${{ inputs.ssh_execution }}
  # The batch reads this line: a case whose restore failed stops the rest of the batch, as a failed setup does.
  - name: restored
    labels: {role: swamp}
    dependsOn:
    - step: restore
      condition: {type: completed}
    guard: '${{ steps.?restore.?status.orValue("") != "failed" }}'
    allowFailure: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("proof-verify-restored-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          printf '{"restore": "failed"}\n'
  - name: setup
    labels: {role: swamp}
    dependsOn:
    - step: case
      condition: {type: completed}
    - step: restore
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    guard: '${{ inputs.last || !inputs.setup || steps.?case.?outputs.?stdout.orValue("").contains("\"verdict\": \"passed\"") }}'
    allowFailure: true
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-verify-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 180
        argv:
        - python3
        - ${{ inputs.checkout_path + "/swamp/proof/runner/runner.py" }}
        - setup
        - ${{ inputs.batch }}
        - --file
        - ${{ inputs.checkout_path + "/" + inputs.file }}
        - --evidence
        - ${{ inputs.checkout_path + "/.orbit-artifacts/" + string(inputs.group_id) + "/verify" }}
