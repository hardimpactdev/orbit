# One case, run for its own host: `orbit firewall:allow ... --json`, the assert on the answer, the wait on the Operation receipt. The product
# refuses a firewall write while another one holds the Node (`operation.target_busy`), so the CLI call asks again until it is admitted; the
# number of asks is kept as `busy_retries`. A failed check is recorded, not raised, so one verdict per case survives. Results stay as
# cacheable facts of the case host (the fact cache of molecule.yml) for verify.yml.
- name: "{{ inventory_hostname }}"
  block:
    # A result of an earlier run stays in the fact cache: start from an empty one.
    - name: "{{ inventory_hostname }}: start the clock"
      ansible.builtin.set_fact:
        case_t0: "{{ now().timestamp() }}"
        failures: ""
        cacheable: true

    - name: "{{ inventory_hostname }}: run the command"
      ansible.builtin.command:
        argv: "{{ orbit + argv + ['--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      register: ran
      failed_when: false
      changed_when: false
      until: ran.rc == 0 or (ran.stdout ~ ran.stderr) is not search('operation.target_busy')
      retries: 60
      delay: 1

    - name: "{{ inventory_hostname }}: read the answer"
      ansible.builtin.set_fact:
        answer: "{{ (ran.stdout | from_json) if (ran.stdout is search('^\\s*[{\\[]')) else {} }}"

    - name: "{{ inventory_hostname }}: the answer is the one the contract promises (exit 0, status succeeded)"
      ansible.builtin.assert:
        that:
          - ran.rc == 0
          - answer.status | default('') == 'succeeded'
        fail_msg: "exit {{ ran.rc }}, status {{ answer.status | default('-') }}, code {{ answer.error_code | default(answer.error.code | default('-')) }}"
        quiet: true

    - name: "{{ inventory_hostname }}: wait for the Operation receipt"
      ansible.builtin.uri:
        url: "{{ gateway_url }}/operations/{{ answer.id | default(answer.operation.id | default('')) }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: receipt
      until: (receipt.json.data | default(receipt.json)).status in ['succeeded', 'failed', 'cancelled']
      retries: 30
      delay: 2

    - name: "{{ inventory_hostname }}: the receipt agrees with the answer"
      ansible.builtin.assert:
        that: (receipt.json.data | default(receipt.json)).status == 'succeeded'
        fail_msg: "receipt status {{ (receipt.json.data | default(receipt.json)).status }}, expected succeeded"
        quiet: true
  rescue:
    - name: "{{ inventory_hostname }}: record the failed check"
      ansible.builtin.set_fact:
        failures: "{{ 'converge | ' ~ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.msg | default('?')) }}"
        cacheable: true
  always:
    - name: "{{ inventory_hostname }}: keep the evidence for verify"
      ansible.builtin.set_fact:
        case_secs: "{{ ((now().timestamp() - case_t0 | float) | round(1)) }}"
        case_start: "{{ case_t0 | float }}"
        case_end: "{{ now().timestamp() }}"
        cmd_secs: "{{ ((ran.delta | default('0:00:00')).split(':')[0] | int * 3600 + (ran.delta | default('0:00:00')).split(':')[1] | int * 60 + (ran.delta | default('0:00:00')).split(':')[2] | float) | round(1) }}"
        cli_start: "{{ ((ran.start | default('1970-01-01 00:00:00.000000')) | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp() }}"
        cli_end: "{{ ((ran.end | default('1970-01-01 00:00:00.000000')) | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp() }}"
        busy_retries: "{{ (ran.attempts | default(1) | int) - 1 }}"
        cacheable: true
