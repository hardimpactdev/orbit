---
# Seven ordered, ungated phases. A matching recorded digest never suppresses a live read or repair.
- name: Reconcile a distinct hub before its target peer
  hosts: hub
  any_errors_fatal: true
  become: true
  gather_facts: false
  tags: [network]
  vars:
    intent: "{{ converge_intent }}"
  tasks:
    - name: Reconcile the hub
      ansible.builtin.import_tasks: tasks/node-converge-hub.yml
      vars: { hub_plan: "{{ intent.network.hub }}" }
# The roles phase writes the seed listener's trust of a CI Node from the default Node's certificate, as the role add does
# (docs/reference/node-provisioning.md#the-seed-listener). Nothing else changes on that Node.
- name: Read the Incus client certificate of the default's Node
  hosts: proof_seed_sender
  become: true
  gather_facts: false
  tags: [roles]
  tasks:
    - { name: Read the client certificate, ansible.builtin.import_tasks: tasks/proof-seed-certificate.yml }
- name: Reconcile recorded Node state
  hosts: target
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.apt: { lock_timeout: 300 }
  vars:
    intent: "{{ converge_intent }}"
    secrets: "{{ converge_secrets }}"
    plans: "{{ converge_plans }}"
    recipe: "{{ converge_intent.recipe | from_json }}"
    orbit_user: "{{ converge_intent.user }}"
    orbit_home: "{{ '/root' if converge_intent.user == 'root' else '/home/' ~ converge_intent.user }}"
    vp_home: /opt/orbit/vite-plus
    vp_runtime_package: "{{ vp_home }}/recipe/vp-runtime-{{ recipe.tools.vp.lock_sha256 }}/node_modules/vite-plus/package.json"
    apt_directory: /var/tmp/orbit-converge-apt
    apt_retries: 4
    apt_delay: 30
    apt_environment: { APT_CONFIG: /var/tmp/orbit-converge-apt/apt.conf, DEBIAN_FRONTEND: noninteractive, NEEDRESTART_MODE: l }
    apt_index_environment: "{{ apt_environment }}"
  handlers:
    - name: Reload units
      ansible.builtin.systemd: { daemon_reload: true }
  tasks:
    - name: Read target platform
      ansible.builtin.setup: { gather_subset: [min] }
      tags: [input]
    - name: Require the pinned Linux platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == recipe.ubuntu.release
          - ansible_facts.architecture == 'x86_64'
          - intent.agent.url is string
          - intent.agent.sha256 is match('^[0-9a-f]{64}$')
          - secrets.agent_verifier is match('^[0-9a-f]{64}$')
        quiet: true
      tags: [input]
    - name: Refuse host-wide inputs in an automatic role converge
      when: intent.release_roles_only | default(false)
      ansible.builtin.assert:
        that:
          - intent.selected_roles | length > 0
          - intent.roles | map(attribute='role') | list | sort == intent.selected_roles | sort
          - intent.network == None
          - intent.tools | length == 0
        fail_msg: fleet.role_scope_invalid
        quiet: true
      tags: [input]
    - name: Require the recorded CLI pin only for a CLI caller
      when: intent.cli != None and not (intent.release_roles_only | default(false) or intent.automatic | default(false))
      ansible.builtin.assert:
        that:
          - intent.cli.skip_reason == None
          - intent.cli.plan_error == None
          - intent.cli.release.url is string
          - intent.cli.release.sha256 is match('^[0-9a-f]{64}$')
        quiet: true
      tags: [input]
    - name: Reconcile the base
      ansible.builtin.import_tasks: tasks/node-converge-base.yml
      tags: [agent]
    - name: Reconcile selected software
      ansible.builtin.include_tasks:
        file: tasks/node-converge-software.yml
        apply: { tags: [software] }
      when: intent.selected_roles | length > 0 or intent.tools | length > 0
      tags: [software]
    - name: Reconcile selected recorded roles
      ansible.builtin.include_tasks:
        file: tasks/node-converge-role.yml
        apply: { tags: [roles] }
      loop: "{{ intent.roles }}"
      loop_control: { loop_var: role_plan, label: "{{ role_plan.role }}" }
      tags: [roles]
    # Each Instance container that could not take Chromium's trust store, with its reason, for the Operation result
    # (docs/reference/development-containers.md#trust). Only an Instance container host lists any.
    - name: Record the containers without the browser trust store
      ansible.builtin.copy:
        dest: "{{ orbit_run }}/roles-result.json"
        content: >-
          {{ {'browser_trust': instance_browser_trust | default([]),
              't3_restart_deferred': instance_t3_restart_deferred | default([])} | to_json }}
        mode: "0600"
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [roles]
    - name: Apply admitted Tool membership
      ansible.builtin.import_tasks: tasks/node-converge-tools.yml
      tags: [tools]
    - name: Reconcile the network hub before the target
      ansible.builtin.include_tasks:
        file: tasks/node-converge-network.yml
        apply: { tags: [network] }
      when: intent.network != None
      tags: [network]
    # The one write of the check tag: an Instance host's presented machine names, which the roles digest leaves out.
    - name: Apply the presented machine names of the Instance containers
      ansible.builtin.include_tasks:
        file: tasks/instance-container-names.yml
        apply: { tags: [check] }
      vars: { instances: "{{ role_plan.runtime.instances | default(none) }}" }
      loop: "{{ intent.roles }}"
      loop_control: { loop_var: role_plan, label: "{{ role_plan.role }}" }
      tags: [check]
    # The selected CLI is read through its link in the same call.
    - name: Check the managed agent file and service and the selected CLI without changing the Node
      ansible.builtin.import_tasks: tasks/check-read.yml
      vars:
        check_read_paths: [/usr/local/bin/orbit-agent]
        check_read_units: [orbit-agent.service]
        check_read_followed: "{{ [] if cli_skip else ['/usr/local/bin/orbit'] }}"
        cli_skip: "{{ intent.cli == None or intent.release_roles_only | default(false) or intent.automatic | default(false) }}"
      tags: [check]
    - name: Require the recorded agent pin
      ansible.builtin.assert:
        that: "check_read.paths['/usr/local/bin/orbit-agent'].checksum | default('') == intent.agent.sha256"
        quiet: true
      tags: [check]
    - name: Require the active agent service
      ansible.builtin.assert:
        that: check_read.units['orbit-agent.service'].rc == 0
        fail_msg: "orbit-agent.service is {{ check_read.units['orbit-agent.service'].state }}, not active."
        quiet: true
      tags: [check]
    - name: Check the recorded CLI artifact
      when: intent.cli != None and not (intent.release_roles_only | default(false) or intent.automatic | default(false))
      tags: [check]
      block:
        - name: Require the selected CLI pin
          ansible.builtin.assert:
            that: check_read.followed['/usr/local/bin/orbit'].checksum | default('') == intent.cli.release.sha256
            quiet: true
    - name: Check the retired CLI files without changing the Node
      when: intent.cli == None and not (intent.release_roles_only | default(false) or intent.automatic | default(false))
      ansible.builtin.import_tasks: tasks/node-converge-cli-absent.yml
      vars: { cli_remove: false }
      tags: [check]
    - name: Check the selected software without writes
      ansible.builtin.include_tasks:
        file: tasks/node-converge-software-check.yml
        apply: { tags: [check] }
      when: intent.selected_roles | length > 0 or intent.tools | length > 0
      tags: [check]
    - name: Check the recorded peer tunnel without writes
      when: intent.network != None and intent.network.mode == 'peer'
      ansible.builtin.include_tasks:
        file: tasks/node-converge-handshake.yml
        apply: { tags: [check] }
      vars: { peer_key: "{{ intent.network.apply.peer.server_public_key }}" }
      tags: [check]
    # Without a change there is nothing to prove by a handshake; the check requires every recorded peer on the hub.
    - name: Check the recorded hub peers without writes
      when: intent.network != None and intent.network.mode == 'hub'
      ansible.builtin.include_tasks:
        file: tasks/node-converge-hub-peers.yml
        apply: { tags: [check] }
      vars: { hub_peer_keys: "{{ intent.network.hub.peer_keys }}", hub_live_keys: [] }
      tags: [check]
    - name: Check the selected role runtime
      ansible.builtin.include_tasks:
        file: tasks/node-converge-role-check.yml
        apply: { tags: [check] }
      loop: "{{ intent.roles }}"
      loop_control: { loop_var: role_plan, label: "{{ role_plan.role }}" }
      tags: [check]
