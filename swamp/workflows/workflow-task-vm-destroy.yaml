id: a5dc9328-9812-4f24-9055-d874830f9bb7
name: task-vm-destroy
description: Revoke same-VM model access, delete the Incus VM, then complete canonical Node cleanup on209.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.destroy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: destroy
  target: orbit-node-209
  steps:
  - name: plan
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: plan
      inputs:
        intent: ${{ inputs.intent }}
  - name: inspect
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: {}
        action: inspect
    dependsOn:
    - step: plan
      condition:
        type: succeeded
  - name: stop
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: {}
        action: stop
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    guard: ${{ !steps.inspect.outputs.result.running }}
  - name: model
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: task-vm-model-revoke
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.model_intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: stop
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !steps.plan.outputs.model_required }}
  - name: revoked
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: revocation
      inputs:
        intent: ${{ inputs.intent }}
        stdout: '${{ steps.plan.outputs.model_required ? steps.model.outputs.result.stdout : "" }}'
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: stop
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: model
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: delete
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: {}
        action: delete
    dependsOn:
    - step: revoked
      condition:
        type: succeeded
  - name: cleanup
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-node-remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.removal }}
        execution_secrets: {}
    dependsOn:
    - step: delete
      condition:
        type: succeeded
    guard: ${{ !steps.plan.outputs.node_present }}
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-destroy-input'
      behaviorName: ${{ "vm-destroy-input-"+run.id }}
      methodName: terminal
      inputs:
        intent: ${{ inputs.intent }}
        provider: ${{ steps.delete.outputs.result }}
        removal_stdout: '${{ steps.plan.outputs.node_present ? steps.cleanup.outputs.result.stdout : "" }}'
    dependsOn:
    - step: delete
      condition:
        type: succeeded
    - step: cleanup
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
