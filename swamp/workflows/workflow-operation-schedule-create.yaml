id: 2631be29-8b8d-40af-94d8-07f76f795c87
name: operation-schedule-create
description: Converge public Schedule units and timer intent through official cfgmgmt on 209.
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [schedule.create]}
    intent:
      type: object
      properties:
        schedule:
          type: object
          properties: {id: {type: string, format: uuid}}
          required: [id]
        cascade: {type: boolean}
        ssh_execution: {type: object}
      required: [schedule, cascade, ssh_execution]
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: schedule
    labels: {role: swamp}
    steps:
      - name: units
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@nckrtl/schedule-run-assets'
          behaviorName: '${{ "schedule-units" }}'
          methodName: lifecycle
          inputs: {schedule: '${{ inputs.intent.schedule }}'}
      - name: files
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: units, condition: {type: succeeded}}]
        forEach: {item: unit, in: '${{ ["service", "timer"] }}'}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("schedule-unit-" + string(inputs.intent.ssh_execution.target.host) + "-" + self.unit + "-" + string(self._index)).split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            path: ${{ "/etc/systemd/system/orbit-schedule-" + inputs.intent.schedule.id + "." + self.unit }}
            ensure: present
            content: ${{ steps.units.outputs[self.unit] }}
            owner: root
            group: root
            mode: "0644"
          inputs: {}
      - name: reload
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: files, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/exec'
          behaviorName: '${{ ("schedule-reload-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            command: systemctl daemon-reload
          inputs: {}
      - name: timer
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: reload, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("schedule-timer-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: apply
          globalArgs: &timer_args
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            service: ${{ "orbit-schedule-" + inputs.intent.schedule.id + ".timer" }}
            enabled: ${{ inputs.intent.schedule.desired == "enabled" }}
            ensure: '${{ inputs.intent.schedule.desired == "enabled" ? "running" : "stopped" }}'
          inputs: {}
      - name: remove_obsolete
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: timer, condition: {type: succeeded}}]
        forEach: {item: suffix, in: '${{ [".sh", ".complete"] }}'}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("schedule-remove_obsolete-" + string(inputs.intent.ssh_execution.target.host) + "-" + (self.suffix == ".sh" ? "script" : "complete") + "-" + string(self._index)).split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            path: ${{ "/etc/orbit/schedules/" + inputs.intent.schedule.id + self.suffix }}
            ensure: absent
          inputs: {}
      - name: check_files
        labels: {role: swamp}
        dependsOn: [{step: remove_obsolete, condition: {type: succeeded}}]
        forEach: {item: part, in: '${{ ["service", "timer", "script", "complete"] }}'}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("schedule-file-check-" + string(inputs.intent.ssh_execution.target.host) + "-" + self.part).split(".").join("-") }}'
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            path: '${{ self.part in ["service", "timer"] ? "/etc/systemd/system/orbit-schedule-" + inputs.intent.schedule.id + "." + self.part : "/etc/orbit/schedules/" + inputs.intent.schedule.id + (self.part == "script" ? ".sh" : ".complete") }}'
            ensure: '${{ self.part in ["service", "timer"] ? "present" : "absent" }}'
            content: '${{ self.part in ["service", "timer"] ? steps.units.outputs[self.part] : "" }}'
            owner: root
            group: root
            mode: "0644"
          inputs: {}
      - name: check_timer
        labels: {role: swamp}
        dependsOn: [{step: remove_obsolete, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("schedule-timer-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: check
          globalArgs: *timer_args
          inputs: {}
      - name: Check the installation
        labels: {role: swamp}
        dependsOn: [{step: check_files, condition: {type: succeeded}}, {step: check_timer, condition: {type: succeeded}}]
        task:
          type: assert
          expr: 'steps.filter(name, name.startsWith("check_files-")).size() == 4 && steps.filter(name, name.startsWith("check_files-")).all(name, steps[name].outputs.status == "compliant") && steps.check_timer.outputs.status == "compliant"'
          message: The Schedule files and timer must match the captured state.
          severity: high
queueTimeout: 30
