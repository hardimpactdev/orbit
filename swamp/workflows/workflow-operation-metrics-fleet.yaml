- name: publish-fpm-exporter-file
  dependsOn:
  - job: disable-fpm-exporter
    condition:
      type: succeeded
  steps:
  - name: publish-fpm-exporter-file${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-publish-fpm-exporter-file-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_SERVICE_FILE -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import stat
          import tempfile

          v = json.loads(os.environ["ORBIT_SERVICE_FILE"])
          root = pathlib.Path("/")
          p = root / v["path"].lstrip("/")
          base = root / "etc/orbit/service-metrics"
          marker = base / ".orbit-owner"
          for target in [p, marker]:
              for parent in [
                  *reversed([q for q in target.parents if q == root or root in q.parents]),
                  target,
              ]:
                  try:
                      st = parent.lstat()
                  except FileNotFoundError:
                      continue
                  if (
                      stat.S_ISLNK(st.st_mode)
                      or st.st_uid != 0
                      or st.st_mode & 0o022
                      or (parent != target and not stat.S_ISDIR(st.st_mode))
                  ):
                      raise SystemExit("metrics.service_ownership")
          if base.exists() and (
              base.stat().st_mode & 0o077
              or not marker.is_file()
              or marker.read_text() != "# Managed by Orbit: service-metrics\n"
          ):
              raise SystemExit("metrics.service_ownership")
          if p.exists() and (
              not p.is_file()
              or p.stat().st_size > 65536
              or not p.read_text().startswith("# Managed by Orbit: service-metrics\n")
          ):
              raise SystemExit("metrics.service_ownership")
          if v["content"] is None:
              p.unlink(missing_ok=True)
          else:
              if not v["content"].startswith("# Managed by Orbit: service-metrics\n"):
                  raise SystemExit("metrics.service_invalid")
              base.mkdir(parents=True, mode=0o700, exist_ok=True)
              if not marker.exists():
                  fd = os.open(
                      marker, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600
                  )
                  with os.fdopen(fd, "w") as out:
                      out.write("# Managed by Orbit: service-metrics\n")
              fd, temporary = tempfile.mkstemp(prefix=".orbit-fpm-", dir=p.parent)
              try:
                  with os.fdopen(fd, "w") as out:
                      out.write(v["content"])
                      os.fchmod(out.fileno(), v["mode"])
                      out.flush()
                      os.fsync(out.fileno())
                  os.replace(temporary, p)
              finally:
                  pathlib.Path(temporary).unlink(missing_ok=True)
          print('{"published":true}')
          PYTHON
        env:
          ORBIT_SERVICE_FILE: ${{ self.item.json }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.service_files }}
  concurrency: 1
- name: download-fpm-exporter
  dependsOn:
  - job: publish-fpm-exporter-file
    condition:
      type: succeeded
  steps:
  - name: download-fpm-exporter${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-download-fpm-exporter-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 - <<'PYTHON'
          import os
          import pathlib
          import stat
          import urllib.request

          root = pathlib.Path("/")
          op = os.environ["ORBIT_OPERATION_ID"]
          if not op.isdecimal():
              raise SystemExit("metrics.input_invalid")
          p = root / ("run/orbit-metrics-fpm-" + op)
          fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
          with (
              os.fdopen(fd, "wb") as out,
              urllib.request.urlopen(
                  "https://github.com/cboxdk/fpm-exporter/releases/download/v3.1.1/fpm-exporter-linux-amd64",
                  timeout=30,
              ) as response,
          ):
              st = os.fstat(out.fileno())
              if not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or st.st_mode & 0o077:
                  raise SystemExit("metrics.service_binary_ownership_drift")
              data = response.read(128 * 1024 * 1024 + 1)
              if len(data) > 128 * 1024 * 1024:
                  raise SystemExit("metrics.service_download_failed")
              out.write(data)
              out.flush()
              os.fsync(out.fileno())
          print('{"downloaded":true}')
          PYTHON
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
    guard: ${{ !inputs.intent.metrics_fleet.fleet.filter(n, n.node_id == self.item.node_id)[0].service.binary }}
- name: verify-fpm-exporter-digest
  dependsOn:
  - job: download-fpm-exporter
    condition:
      type: succeeded
  steps:
  - name: verify-fpm-exporter-digest${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-fpm-exporter-digest-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import os
          import pathlib

          op = os.environ["ORBIT_OPERATION_ID"]
          if not op.isdecimal():
              raise SystemExit("metrics.input_invalid")
          p = pathlib.Path("/run/orbit-metrics-fpm-" + op)
          with p.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if digest != "570d2b3d3284179c47acff8efd8f73ea650e42a2c6bd08c0a8e95cb4b0e3ca98":
              raise SystemExit("metrics.service_checksum_mismatch")
          print('{"verified":true}')
          PYTHON
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
    guard: ${{ !inputs.intent.metrics_fleet.fleet.filter(n, n.node_id == self.item.node_id)[0].service.binary }}
- name: publish-fpm-exporter-binary
  dependsOn:
  - job: verify-fpm-exporter-digest
    condition:
      type: succeeded
  steps:
  - name: publish-fpm-exporter-binary${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-publish-fpm-exporter-binary-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import os
          import pathlib
          import stat
          import tempfile

          root = pathlib.Path("/")
          op = os.environ["ORBIT_OPERATION_ID"]
          if not op.isdecimal():
              raise SystemExit("metrics.input_invalid")
          source = root / ("run/orbit-metrics-fpm-" + op)
          path = root / "usr/local/bin/orbit-fpm-exporter"
          for p in [*reversed([q for q in path.parents if q == root or root in q.parents]), path]:
              try:
                  st = p.lstat()
              except FileNotFoundError:
                  continue
              if (
                  stat.S_ISLNK(st.st_mode)
                  or st.st_uid != 0
                  or st.st_mode & 0o022
                  or (p != path and not stat.S_ISDIR(st.st_mode))
              ):
                  raise SystemExit("metrics.service_binary_ownership_drift")
          data = source.read_bytes()
          if (
              hashlib.sha256(data).hexdigest()
              != "570d2b3d3284179c47acff8efd8f73ea650e42a2c6bd08c0a8e95cb4b0e3ca98"
          ):
              raise SystemExit("metrics.service_checksum_mismatch")
          fd, temporary = tempfile.mkstemp(prefix=".orbit-fpm-", dir=path.parent)
          try:
              with os.fdopen(fd, "wb") as stream:
                  stream.write(data)
                  os.fchmod(stream.fileno(), 0o755)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary, path)
          finally:
              pathlib.Path(temporary).unlink(missing_ok=True)
          print('{"installed":true}')
          PYTHON
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
    guard: ${{ !inputs.intent.metrics_fleet.fleet.filter(n, n.node_id == self.item.node_id)[0].service.binary }}
