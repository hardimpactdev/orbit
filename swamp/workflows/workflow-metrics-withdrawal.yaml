id: 0c8b52b3-29cd-46d9-bffa-e2f9791605cd
name: metrics-withdrawal
description: Withdraw metrics.orbit from the Gateway Node, its private DNS name and its certificate.
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
jobs:
- name: withdrawal
  steps:
  - name: caddy
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.intent.caddy.node_id }}', kind: '${{ inputs.kind }}', intent: {caddy_publication: '${{ inputs.intent.caddy }}'}, execution_secrets: {}}
  - name: dns
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: caddy, condition: {type: succeeded}}]
    forEach: {item: dns, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: dns-publish
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ self.dns.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          node_id: '${{ self.dns.node_id }}'
          connection: '${{ self.dns.connection }}'
          host_keys: '${{ self.dns.host_keys }}'
          dns: '${{ self.dns.dns }}'
        execution_secrets: {}
  - name: certificate
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: caddy, condition: {type: succeeded}}, {step: dns, condition: {type: always}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("metrics-remove-certificate-" + string(inputs.intent.gateway_ssh.target.host)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs: {nodeHost: '${{ inputs.intent.gateway_ssh.target.host }}', nodeUser: '${{ inputs.intent.gateway_ssh.target.user }}', nodePort: '${{ inputs.intent.gateway_ssh.target.port }}', nodeIdentityFile: '${{ inputs.intent.gateway_ssh.identity_file }}', become: true, path: /etc/caddy/orbit-metrics-cert-current, ensure: absent}
