      enum:
      - instance.deploy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*|development-deploy-operation-[1-9][0-9]*-step-([0-9]|[12][0-9]|3[01]))$
