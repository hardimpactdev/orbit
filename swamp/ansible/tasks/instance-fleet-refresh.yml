---
# Refresh the nested fleet of a default Instance after its workspace took a new commit, on a started fleet (instance-fleet-start.yml,
# which never waits for Doctor), doing only the parts whose inputs changed (docs/reference/development-containers.md#what-a-refresh-skips).
# The record `fleet_record` holds the digests of the parts the last passed refresh did; a part runs when its digest differs, and a
# missing or unreadable record makes every part run. `code` migrates and restarts the nested Gateway and places the agent delivery,
# `grants` reloads the nested Swamp's grants, `tokens` reads the nested Swamp's tokens when the oldest may be due, `rules` reads the fleet
# files, and `converge` waits for the three agents and converges each nested Node whose own digest changed, one at a time. A
# Node's converge is also due 7 days after its last one. The fleet's devices and keys are read, and readiness is waited for once, every time. `base` is
# retaken, with those containers stopped and started again, only for the containers whose disks changed: the grants, a remint or a Swamp
# install changed the nested Gateway, a converge changed a task, a rule or file differed, a `base` is missing, or the record was. A migration
# does not: a reset migrates after its restore (instance-fleet-migrate.yml). The record is removed before the
# first write to a nested disk and written again last, so a run that stops in the middle leaves none. Input: instance-fleet.yml. The model
# is the task VM refresh (task-vm-fleet.yml), from the Node through the Instance container.
# The nested Gateway's Swamp runs only with the Club key file. Without it, the grants are not reloaded and the Swamp units are not checked.
- { name: Name the fleet commands, ansible.builtin.import_tasks: instance-fleet.yml }
- name: Look for the Club key
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['test', '-s', fleet_club_key] }}" }
  register: fleet_club
  changed_when: false
  failed_when: false

# The record and the digests. A read that fails, or a record that is not a flat map of digests, makes every part due; neither fails.
# `code` is the nested Gateway's code and the agent contract it reads from outside `apps/gateway` (`apps/agent/contract`, cached for
# the life of a Horizon worker). `grants` is `apps/gateway` and `swamp`: the nested Gateway renders its Swamp grants from the checkout
# with its own code (gateway-swamp-grants.yml). `rules` is the fleet files' content. `converge` is made after the migrate, from what a
# base converge reads: the `swamp` files of `fleet-converge-inputs.json` (its cover test: swamp/tests/fleet_converge_inputs_test.ts), the
# nested Gateway's digest of each Node's base intent, and the fleet intent, one digest per Node. The record also holds `converged_<role>`,
# the time of each Node's last converge, and `tokens`, the creation time of the oldest Swamp token of the nested Gateway (`YYYYMMDDHHMMSS`, UTC).
- name: Read the list of converge inputs
  ansible.builtin.set_fact:
    fleet_converge_inputs: "{{ lookup('ansible.builtin.file', 'fleet-converge-inputs.json') | from_json }}"
- name: Read the refresh record
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['cat', fleet_record] }}" }
  register: fleet_record_read
  changed_when: false
  failed_when: false
- name: Read the digests of the checkout
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_outer + ['git', '-c', 'safe.directory=*', '-C', intent.container.workspace, 'rev-parse',
          'HEAD:apps/gateway', 'HEAD:apps/agent/contract'] + (fleet_converge_inputs.inputs | map('regex_replace', '^', 'HEAD:') | list)
         + ['HEAD:swamp/ansible', 'HEAD:apps/gateway/resources/machine-software', 'HEAD:swamp'] }}
  register: fleet_digests_read
  changed_when: false
  failed_when: false
- name: Work out which parts are due
  vars:
    fleet_record_valid: >-
      {{ fleet_record_read.rc == 0 and fleet_record_read.stdout | trim is match('^\{"[a-z_]+": ?"[0-9a-f]+"(, ?"[a-z_]+": ?"[0-9a-f]+")*\}$') }}
    fleet_ids: >-
      {{ fleet_digests_read.stdout_lines if fleet_digests_read.rc == 0
         and fleet_digests_read.stdout_lines | length == 5 + fleet_converge_inputs.inputs | length else [] }}
  ansible.builtin.set_fact:
    fleet_record_state: >-
      {{ 'present' if fleet_record_valid else 'missing' if fleet_record_read.rc != 0 and 'No such file' in fleet_record_read.stderr
         else 'unreadable' }}
    fleet_recorded: "{{ (fleet_record_read.stdout | trim | from_json) if fleet_record_valid else {} }}"
    fleet_now: >-
      {{ {} if fleet_ids | length == 0 else {'code': (fleet_ids[0] ~ fleet_ids[1]) | hash('sha256'),
         'rules': fleet_files | to_json(sort_keys=true) | hash('sha256')}
         | combine({'grants': (fleet_ids[0] ~ ' ' ~ fleet_ids[-1]) | hash('sha256')} if fleet_club.rc == 0 else {}) }}
    fleet_swamp_ids: "{{ fleet_ids[2:-3] }}"
    # The Instance host's tree inputs: `swamp/ansible` and the machine-software recipe.
    fleet_host_ids: "{{ fleet_ids[-3:-1] }}"
    fleet_converge_changed: 0
    fleet_converge_changed_roles: []
    fleet_started_at: "{{ now(utc=true).timestamp() }}"
# A digest part is due when the checkout gives no digest for it, or the record holds another one. The tokens are read only with the Club
# key, and only when the record holds no creation time of the oldest token or that time is older than `fleet_token_max_age` (20 days).
# The converge is decided after the migrate.
- name: Name the due parts
  vars:
    fleet_token_cutoff_mark: "{{ '%Y%m%d%H%M%S' | strftime((now().timestamp() | int) - (fleet_token_max_age | default(1728000) | int), utc=true) }}"
    fleet_tokens_recorded: "{{ fleet_recorded.tokens | default('') is match('^[0-9]{14}$') and fleet_recorded.tokens >= fleet_token_cutoff_mark }}"
  ansible.builtin.set_fact:
    fleet_due:
      code: "{{ 'code' not in fleet_now or fleet_recorded.code | default('') != fleet_now.code }}"
      grants: "{{ fleet_club.rc == 0 and ('grants' not in fleet_now or fleet_recorded.grants | default('') != fleet_now.grants) }}"
      tokens: "{{ fleet_club.rc == 0 and not fleet_tokens_recorded | bool }}"
      rules: "{{ 'rules' not in fleet_now or fleet_recorded.rules | default('') != fleet_now.rules }}"
      # The Instance host is decided after the migrate, with the converge.
      host: false

# The record goes before the first write to a nested disk and comes back as the last task. A run that stops in the middle (a failed
# step, a failed restore of the old seed, a run by hand) leaves no record, so the next refresh runs every part and retakes all three.
- name: Remove the refresh record until the refresh passes
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['rm', '-f', fleet_record] }}" }
  changed_when: fleet_record_read.rc == 0

# The state mounts, once every run, before any part reads or writes them: the converge digest reads the nested Gateway's `.env`.
- { name: Wait for the state mounts, ansible.builtin.include_tasks: instance-fleet-mounts.yml }
# The nested Gateway gives its Nodes the agent of the checkout's pin, a byte copy of the published release manifest, which is in
# `apps/gateway`: it changes only with the code.
- name: Place the agent delivery
  when: fleet_due.code
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--'] + fleet_as_app_user + ['install', '-D', '-m', '0444',
          intent.fleet.checkout.path ~ '/apps/gateway/resources/agent/frozen-manifest.json',
          intent.fleet.checkout.path ~ '/apps/agent/delivery/manifest.json'] }}
  changed_when: true
# Local grants mask the checkout's; the reload needs Swamp serve. The grants live on the nested Gateway's own disk (its state mount
# `swamp/grants`), so a reload that changed a file marks it for `base`: the inner play's recap says `changed=0` when nothing changed,
# and any other recap counts as a change.
- name: Reconcile the Swamp grants
  when: fleet_due.grants
  register: fleet_grants
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '180'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'env',
          'ANSIBLE_CONFIG=' ~ intent.fleet.checkout.path ~ '/swamp/ansible/ansible.cfg', 'ANSIBLE_DISPLAY_FAILED_STDERR=true',
          '/opt/orbit/ansible/venv/bin/ansible-playbook', '-i', 'localhost,', '-e', '@/opt/orbit/bootstrap/control.yml', '--tags', 'grants',
          intent.fleet.checkout.path ~ '/swamp/ansible/gateway-bootstrap.yml'] }}
  changed_when: "fleet_grants.stdout is not search('changed=0 ')"
# The nested Gateway's Swamp tokens live 30 days, and a fleet lives longer. A run with the Club key whose record cannot vouch for the
# oldest token reads their names and dates (`swamp access token list`, which shows no secret). They are due when one of the six is
# missing or older than `fleet_token_max_age` seconds (20 days); then the `remint` play makes the worker set whole and renews all six. The
# remint stops serve and the workers, and it ends only when they are active again, so no other part of the refresh runs on them
# meanwhile. A list that cannot be read is due too: the remint then fails or renews. Without the Club key the nested Gateway's Swamp does
# not run, and the tokens are skipped.
- name: Read the Swamp tokens of the nested Gateway
  when: fleet_due.tokens
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '60'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--cwd', intent.fleet.checkout.path ~ '/swamp', '--']
         + fleet_as_app_user + ['env', 'HOME=/home/orbit', 'SWAMP_HOME=/home/orbit/.swamp', 'SWAMP_CONFIG_DIR=/home/orbit/.config/swamp',
           'SWAMP_API_KEY_FILE=/home/orbit/.config/swamp/api-key', 'SWAMP_NO_UPDATE_CHECK=1', 'SWAMP_NO_TELEMETRY=1',
           'swamp', 'access', 'token', 'list', '--json'] }}
  register: fleet_tokens_read
  changed_when: false
  failed_when: false
- name: Work out whether the tokens are due
  vars:
    fleet_token_list: >-
      {%- set read = fleet_tokens_read.stdout | default('') | trim -%}
      {{ (read | from_json) if fleet_tokens_read.rc | default(1) == 0 and read is match('(?s)^\[.*\]$') else none }}
    fleet_token_created: >-
      {{ dict((fleet_token_list or []) | selectattr('name', 'defined') | selectattr('createdAt', 'defined')
         | map(attribute='name') | zip((fleet_token_list or []) | selectattr('name', 'defined') | selectattr('createdAt', 'defined')
         | map(attribute='createdAt') | map('string') | map('truncate', 19, true, '', 0))) }}
    fleet_token_cutoff: "{{ '%Y-%m-%dT%H:%M:%S' | strftime((now().timestamp() | int) - (fleet_token_max_age | default(1728000) | int), utc=true) }}"
  ansible.builtin.set_fact:
    fleet_tokens_reason: >-
      {{ 'no_key' if fleet_club.rc != 0 else 'recorded' if not fleet_due.tokens else 'unreadable' if fleet_token_list is none
         else 'incomplete' if fleet_token_names | difference(fleet_token_created.keys() | list) | length > 0
         else 'age' if fleet_token_names | map('extract', fleet_token_created) | select('lt', fleet_token_cutoff) | list | length > 0
         else 'young' }}
    # The creation time of the oldest token for the record: kept from the record, read from the list, or now after a remint.
    fleet_tokens_mark: >-
      {{ none if fleet_club.rc != 0 else fleet_recorded.tokens if not fleet_due.tokens
         else ('%Y%m%d%H%M%S' | strftime(now().timestamp() | int, utc=true)) if fleet_token_names | difference(fleet_token_created.keys() | list) | length > 0
           or fleet_token_names | map('extract', fleet_token_created) | select('lt', fleet_token_cutoff) | list | length > 0 or fleet_token_list is none
         else fleet_token_names | map('extract', fleet_token_created) | map('regex_replace', '[^0-9]', '') | min }}
- name: Renew the inner Swamp tokens
  when: fleet_tokens_reason not in ['no_key', 'young', 'recorded']
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '600'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'env',
          'ANSIBLE_CONFIG=' ~ intent.fleet.checkout.path ~ '/swamp/ansible/ansible.cfg', 'ANSIBLE_DISPLAY_FAILED_STDERR=true',
          '/opt/orbit/ansible/venv/bin/ansible-playbook', '-i', 'localhost,', '-e', '@/opt/orbit/bootstrap/control.yml', '--tags', 'remint',
          intent.fleet.checkout.path ~ '/swamp/ansible/gateway-bootstrap.yml'] }}
  register: fleet_tokens
  changed_when: true
# The recipe's Swamp on the nested Gateway (docs/reference/development-containers.md#the-pinned-swamp). The fleet build installs Swamp once;
# a later pin in the checkout's recipe reaches the nested Gateway here. With the Club key, two reads give the recipe's release (its version
# and sha256) and the binary that serve runs. When serve does not run the binary at the fleet build's path for that sha256
# (`/usr/local/lib/orbit-swamp/<sha256>/swamp`), or a read fails, the `swamp-pin` play of the nested Gateway
# installs it by checksum through the egress proxy, restarts serve and the workers on it and checks them, and the nested Gateway's `base`
# is retaken. A play that fails fails the refresh, and the run restores the old seed, the old binary included. Without the Club key the
# nested Gateway's Swamp does not run, and the part is skipped.
- name: Read the recipe's Swamp release
  when: fleet_club.rc == 0
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'python3', '-c',
          'import json, sys; s = json.load(open(sys.argv[1]))["tools"]["swamp"]; print(s["version"]); print(s["artifacts"]["amd64"]["sha256"])',
          intent.fleet.checkout.path ~ '/apps/gateway/resources/machine-software/recipe.json'] }}
  register: fleet_swamp_pin_read
  changed_when: false
  failed_when: false
- name: Read the binary that serve runs
  when: fleet_club.rc == 0
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'sh', '-c',
          'readlink -f "/proc/$(systemctl show -p MainPID --value orbit-swamp-serve.service)/exe"'] }}
  register: fleet_swamp_read
  changed_when: false
  failed_when: false
- name: Work out whether the recipe's Swamp is due
  vars:
    # The recipe's version and sha256, or nothing when the read failed.
    fleet_swamp_pin_lines: "{{ fleet_swamp_pin_read.stdout_lines if fleet_swamp_pin_read.rc | default(1) == 0 and fleet_swamp_pin_read.stdout_lines | length == 2 else [] }}"
    fleet_swamp_serve_lines: "{{ fleet_swamp_read.stdout_lines if fleet_swamp_read.rc | default(1) == 0 and fleet_swamp_read.stdout_lines | length == 1 else [] }}"
  ansible.builtin.set_fact:
    # The recipe's release, or none when it could not be read.
    fleet_swamp_version: "{{ fleet_swamp_pin_lines[0] if fleet_swamp_pin_lines else none }}"
    # `no_key`, `pinned` (serve runs the recipe's release), `changed` (it runs another binary), `unreadable` (a read failed: the play
    # runs and installs or fails).
    fleet_swamp_reason: >-
      {{ 'no_key' if fleet_club.rc != 0 else 'unreadable' if not fleet_swamp_pin_lines or not fleet_swamp_serve_lines
         else 'pinned' if fleet_swamp_serve_lines[0] == '/usr/local/lib/orbit-swamp/' ~ fleet_swamp_pin_lines[1] ~ '/swamp' else 'changed' }}
- name: Install the recipe's Swamp on the nested Gateway
  when: fleet_swamp_reason in ['changed', 'unreadable']
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '900'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'env',
          'ANSIBLE_CONFIG=' ~ intent.fleet.checkout.path ~ '/swamp/ansible/ansible.cfg', 'ANSIBLE_DISPLAY_FAILED_STDERR=true']
         + (intent.fleet.proxy | dict2items | map(attribute='key') | zip(intent.fleet.proxy.values()) | map('join', '=') | list)
         + ['/opt/orbit/ansible/venv/bin/ansible-playbook', '-i', 'localhost,', '-e', '@/opt/orbit/bootstrap/control.yml', '--tags', 'swamp-pin',
            intent.fleet.checkout.path ~ '/swamp/ansible/gateway-bootstrap.yml'] }}
  register: fleet_swamp
  changed_when: true
# The migrate runs whenever the code changed: `apps/gateway` holds its migrations and the Composer lock of the packages that ship
# migrations too. The services restart when the code changed or the tokens were reminted. A migration does not retake `base`: a reset
# migrates after its restore (instance-fleet-migrate.yml).
- name: Migrate and restart the nested Gateway
  ansible.builtin.include_tasks: instance-fleet-migrate.yml
  vars:
    fleet_migrate_due: "{{ fleet_due.code }}"
    fleet_restart_due: "{{ fleet_due.code or fleet_tokens is changed }}"
- { name: Restore SSH trust on the refreshed checkout, ansible.builtin.import_tasks: instance-fleet-known-hosts.yml }
# One read of all the services, every run: `systemctl is-active` prints one state per unit, in order, and its exit says only that one of
# them is active, so each line is checked. With the Club key it covers Swamp serve and its three workers, which readiness does not.
- name: Read the services
  vars:
    fleet_services_all: "{{ fleet_gateway_services + (fleet_swamp_services if fleet_club.rc == 0 else []) }}"
  ansible.builtin.command:
    argv: "{{ ['timeout', '60'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--', 'systemctl', 'is-active'] + fleet_services_all }}"
  register: fleet_services
  changed_when: false
  failed_when: false
- name: Check the services
  vars:
    fleet_services_all: "{{ fleet_gateway_services + (fleet_swamp_services if fleet_club.rc == 0 else []) }}"
    fleet_services_down: >-
      {{ fleet_services_all | zip(fleet_services.stdout_lines + [''] * fleet_services_all | length)
         | rejectattr('1', 'eq', 'active') | map('first') | list }}
  ansible.builtin.assert:
    that: fleet_services_down | length == 0
    fail_msg: "{{ fleet_services_down | join(', ') }} not active in {{ intent.fleet.guests.gateway }}"
    quiet: true

# The nested Gateway, on its new code and schema, prints the digest of each Node's default converge intent (`orbit:node-converge-digest`,
# NodeDesiredConvergeInput::defaultDigest): what the Gateway would send, with no Operation and no write. A read that fails makes
# the converge due, and its digest is not recorded.
- name: Read the default intent digests of the nested Nodes
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '60'] + fleet_incus + ['exec', intent.fleet.guests.gateway, '--cwd', intent.fleet.checkout.path ~ '/apps/gateway', '--']
         + fleet_as_app_user + ['php', 'artisan', 'orbit:node-converge-digest', '--host', 'app-dev'] + fleet_roles }}
  register: fleet_intents_read
  changed_when: false
  failed_when: false
# The Instance host on nested-app-dev (docs/reference/development-containers.md#instance-host-in-the-fleet): its `app-dev` role converge
# runs the container branch when what that branch reads changed. That is the `swamp/ansible` tree, the machine-software recipe, and
# nested-app-dev's branch intent as the nested Gateway renders it (`host` of the read above: the image definition, the folders, Incus
# and the rest, without the admission time). A test, a workflow or other Gateway code rebuilds nothing. Only a default whose ID map
# leaves room for isolated Instances there (`intent.fleet.host`, 2,000,000 or more) builds it; below that nothing changes. A host intent
# that cannot be read, such as before nested-app-dev has its bridge, makes the host due, and no `host` is recorded.
- name: Name the due Instance host
  vars:
    fleet_host_read: >-
      {%- set read = (fleet_intents_read.stdout_lines | default([]) | last | default('')) -%}
      {%- set out = read | from_json if fleet_intents_read.rc == 0 and read is match('^\{.*\}$') else {} -%}
      {{ out.host if out is mapping and out.host | default('') is match('^[0-9a-f]{64}$') else '' }}
    fleet_host_now: >-
      {{ {'host': ('host ' ~ fleet_host_ids[0] ~ ' ' ~ fleet_host_ids[1] ~ ' ' ~ fleet_host_read) | hash('sha256')}
         if intent.fleet.host | default(false) | bool and fleet_host_ids | length == 2 and fleet_host_read | length > 0 else {} }}
  ansible.builtin.set_fact:
    fleet_now: "{{ fleet_now | combine(fleet_host_now) }}"
    fleet_due: >-
      {{ fleet_due | combine({'host': intent.fleet.host | default(false) | bool
         and ('host' not in fleet_host_now or fleet_recorded.host | default('') != fleet_host_now.host)}) }}
# Each nested Node has its own converge digest: the listed `swamp` files, that Node's base intent digest and the fleet intent; the record
# holds it as `converge_<role>` and the time of that Node's last converge as `converged_<role>` (`-` in a role is `_`). Each Node has its
# own reason, and the refresh only reports what this comparison found
# (docs/reference/development-containers.md#what-a-refresh-skips):
# - `digest_unreadable`, with `error`: its digest cannot be read (its intent cannot be built, the read failed, or the checkout gives no
#   tree id of the `swamp` files). It is due, and no digest is recorded for it.
# - `no_record`: the record is missing or unreadable, or holds no digest for it.
# - `digest_changed`: its digest differs from the record.
# - `stale`: its last converge is older than `fleet_converge_max_age` seconds (7 days): a safety net for an input no digest covers.
# - `host_due`: nested-app-dev only: its base digest is unchanged, but the Instance host part is due, so its `app-dev` role converges.
# - `unchanged`: none of these; it does not converge.
- name: Work out which nested Nodes the converge is due for
  vars:
    fleet_intents_line: "{{ fleet_intents_read.stdout_lines | default([]) | last | default('') }}"
    fleet_intents_all: >-
      {%- set all = fleet_intents_line | from_json if fleet_intents_read.rc == 0 and fleet_intents_line is match('^\{.*\}$') else {} -%}
      {{ all if all is mapping else {} }}
    fleet_intents_failure: >-
      {{ '' if fleet_intents_all | length > 0
         else 'the digest read failed: ' ~ ((fleet_intents_read.stderr | default('') | trim).split('\n') | last | default('') | truncate(300)) }}
    fleet_converge_now: >-
      {%- set digests = {} -%}
      {%- for role in fleet_roles -%}
      {%- set read = fleet_intents_all[role] | default('') -%}
      {%- if fleet_swamp_ids | length > 0 and read is string and read is match('^[0-9a-f]{64}$') -%}
      {%- set _ = digests.update({'converge_' ~ (role | replace('-', '_')): (fleet_swamp_ids | join(' ') ~ ' ' ~ read ~ ' '
             ~ (intent.fleet | to_json(sort_keys=true))) | hash('sha256')}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ digests }}
    fleet_now_seconds: "{{ now().timestamp() | int }}"
    fleet_converge_reasons: >-
      {%- set reasons = {} -%}
      {%- for role in fleet_roles -%}
      {%- set key = role | replace('-', '_') -%}
      {%- set read = fleet_intents_all[role] | default('') -%}
      {%- set at = fleet_recorded['converged_' ~ key] | default('') -%}
      {%- set age = (fleet_now_seconds | int) - (at | int) if at is match('^[0-9]+$') else -1 -%}
      {%- if ('converge_' ~ key) not in fleet_converge_now -%}
      {%- set error = fleet_intents_failure if fleet_intents_failure | length > 0
            else 'the checkout gives no tree id of the converge inputs' if fleet_swamp_ids | length == 0
            else (read.error | default('') | string | truncate(300)) if read is mapping
            else 'no digest was printed for ' ~ role -%}
      {%- set _ = reasons.update({role: {'reason': 'digest_unreadable', 'error': error}}) -%}
      {%- else -%}
      {%- set _ = reasons.update({role: {'reason': 'no_record' if fleet_record_state != 'present' or ('converge_' ~ key) not in fleet_recorded
            else 'digest_changed' if fleet_recorded['converge_' ~ key] != fleet_converge_now['converge_' ~ key]
            else 'stale' if age < 0 or age > fleet_converge_max_age | default(604800) | int
            else 'host_due' if role == 'app-dev' and fleet_due.host | default(false) | bool
            else 'unchanged'}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ reasons }}
  ansible.builtin.set_fact:
    fleet_now: "{{ fleet_now | combine(fleet_converge_now) }}"
    fleet_converge_reasons: "{{ fleet_converge_reasons }}"
    # The due Nodes, in converge order.
    fleet_converge_roles: >-
      {{ fleet_roles | select('in', fleet_converge_reasons | dict2items | rejectattr('value.reason', 'eq', 'unchanged') | map(attribute='key') | list) | list }}
    # The phases each converged Node ran, from its Operation's result (instance-fleet-converge-node.yml).
    fleet_converge_phases: {}
- name: Name the due converge
  ansible.builtin.set_fact:
    fleet_due: "{{ fleet_due | combine({'converge': fleet_converge_roles | length > 0}) }}"

# The fleet rules, read on the running fleet every time; the files only when `rules` is due or the converge is: the base converge runs
# apt and downloads the agent through the egress proxy, so the fleet's files are written before it, and the rules then find them in place
# with the fleet stopped. A rule or file that differed here changed the fleet, so `base` is due.
- name: Read the fleet rules on the running fleet
  ansible.builtin.include_tasks: instance-fleet-rules-read.yml
  vars: { fleet_rules_files: "{{ fleet_due.rules or fleet_due.converge }}" }
- name: Keep what differed
  ansible.builtin.set_fact:
    fleet_drift_found: "{{ fleet_drift }}"
- { name: Write the fleet files that differ, ansible.builtin.import_tasks: instance-fleet-files.yml }
- name: Time the nested Gateway's part
  ansible.builtin.set_fact:
    fleet_gateway_at: "{{ now(utc=true).timestamp() }}"

# The default converge of each due nested Node, so `base` holds the new agent, Orbit's files and the role state. It runs when the converge is due, and so
# does the wait for the agents: the readiness wait after it needs the agents anyway.
# The converge needs each Node's agent; after the restart the agents come back within seconds. The wait reads the Nodes every
# `fleet_ready_delay` seconds, `fleet_ready_seconds` (300 by default) worth of tries of at most 15 s each, and needs no Doctor.
- name: Wait for the agents of the nested Nodes
  when: fleet_due.converge
  ansible.builtin.command: { argv: "{{ ['timeout', '15'] + fleet_curl + ['--fail', fleet_api ~ '/nodes'] }}" }
  register: fleet_nodes_read
  changed_when: false
  failed_when: false
  vars:
    fleet_nodes_online: >-
      {{ ((fleet_nodes_read.stdout | from_json).data if fleet_nodes_read.rc | default(1) == 0 else [])
         | selectattr('agent', 'truthy') | selectattr('agent.state', 'eq', 'online') | map(attribute='name') | list }}
  until: fleet_nodes_read.rc == 0 and fleet_roles | difference(fleet_nodes_online) | length == 0
  retries: "{{ ((fleet_ready_seconds | default(300) | int) / ([fleet_ready_delay | int, 1] | max)) | round(0, 'ceil') | int }}"
  delay: "{{ fleet_ready_delay }}"
- name: Check the agents before the converge
  when: fleet_due.converge
  vars:
    fleet_nodes_online: >-
      {{ ((fleet_nodes_read.stdout | from_json).data if fleet_nodes_read.rc | default(1) == 0 else [])
         | selectattr('agent', 'truthy') | selectattr('agent.state', 'eq', 'online') | map(attribute='name') | list }}
  ansible.builtin.assert:
    that: fleet_nodes_read.rc == 0 and fleet_roles | difference(fleet_nodes_online) | length == 0
    fail_msg: >-
      {{ ('The nested Gateway did not list its Nodes within ' ~ (fleet_ready_seconds | default(300)) ~ ' s: '
          ~ (fleet_nodes_read.stderr | default('') | trim | truncate(400))) if fleet_nodes_read.rc != 0
         else ('The agent of ' ~ (fleet_roles | difference(fleet_nodes_online) | join(', ')) ~ ' was not online within '
          ~ (fleet_ready_seconds | default(300)) ~ ' s after the restart of the nested Gateway') }}
    quiet: true
- name: Select the nested Nodes in converge order
  when: fleet_due.converge
  vars:
    fleet_all: "{{ (fleet_nodes_read.stdout | from_json).data }}"
  ansible.builtin.set_fact:
    fleet_nodes: "{{ fleet_roles | map('extract', dict(fleet_all | map(attribute='name') | zip(fleet_all))) | select('defined') | list }}"
- name: Require the three nested Nodes
  when: fleet_due.converge
  ansible.builtin.assert:
    that: fleet_nodes | map(attribute='name') | list == fleet_roles
    fail_msg: "The nested Gateway must lead exactly the Nodes {{ fleet_roles | join(', ') }}; it has {{ fleet_nodes | map(attribute='name') | join(', ') }}"
    quiet: true
# Stop only the timers: an update transaction that already runs ends normally.
- name: Stop the update timers in the nested containers
  when: fleet_due.converge
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['exec', intent.fleet.guests[item], '--', 'systemctl', 'stop', 'apt-daily.timer', 'apt-daily-upgrade.timer'] }}"
  loop: "{{ fleet_converge_roles }}"
  changed_when: true
- name: Wait for running updates to end
  when: fleet_due.converge
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '10'] + fleet_incus + ['exec', intent.fleet.guests[item], '--', 'systemctl', 'show', '--property=ActiveState', '--value',
          'apt-daily.service', 'apt-daily-upgrade.service'] }}
  register: fleet_updates
  vars:
    fleet_update_states: "{{ fleet_updates.stdout_lines | default([]) | reject('equalto', '') | list }}"
    fleet_updates_idle: "{{ fleet_update_states | length == 2 and fleet_update_states | difference(['inactive', 'failed']) | length == 0 }}"
  until: fleet_updates.rc != 0 or fleet_updates_idle
  retries: 29
  delay: "{{ fleet_ready_delay }}"
  failed_when: fleet_updates.rc != 0 or not fleet_updates_idle
  changed_when: false
  loop: "{{ fleet_converge_roles }}"
# Each due nested Node converges with the default scope (base, software, recorded roles, Tools, network), one at a time: the nested
# Gateway, nested-app-prod, then nested-app-dev. A default converge has a network and holds the hub's reservation, so the nested Gateway
# refuses a second converge beside it. A failed or refused converge fails the refresh before the next is admitted
# (instance-fleet-converge-node.yml). So `base` holds Nodes converged at the seed's commit, and a proof's first converge after a reset
# finds each phase unchanged (docs/reference/development-containers.md#refresh-after-a-release). Below the 2,000,000 ID map
# (`intent.fleet.host` off), nested-app-dev keeps the base scope: its roles phase cannot build the Instance host there. Its default
# converge waits 1800 s, as its roles phase's bound (`roles_seconds`): it may build the stock and Instance images.
- name: Converge the due nested Nodes one at a time
  when: fleet_due.converge
  ansible.builtin.include_tasks: instance-fleet-converge-node.yml
  loop: "{{ ['gateway', 'app-prod', 'app-dev'] | select('in', fleet_converge_roles) | map('extract', dict(fleet_nodes | map(attribute='name') | zip(fleet_nodes))) | list }}"
  loop_control: { loop_var: fleet_converge_node, label: "{{ fleet_converge_node.name }}" }
  vars:
    fleet_converge_nodes: "{{ [fleet_converge_node] }}"
    fleet_converge_base: "{{ fleet_converge_node.name == 'app-dev' and not intent.fleet.host | default(false) | bool }}"
    fleet_converge_body: "{{ '{\"base\":true}' if fleet_converge_base | bool else '{\"base\":false}' }}"
    fleet_converge_seconds: "{{ 1800 if fleet_converge_node.name == 'app-dev' and not fleet_converge_base | bool else 900 }}"

- name: Time the converge
  ansible.builtin.set_fact:
    fleet_converge_at: "{{ now(utc=true).timestamp() }}"

- name: Read the snapshots
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_incus + ['query', '/1.0/instances/' ~ item ~ '/snapshots?recursion=1'] }}"
  loop: "{{ fleet_names }}"
  register: fleet_snapshots
  changed_when: false
# The nested containers' root disks stay small (docs/reference/development-containers.md#the-inner-machines-stay-small): the relink and
# the dedupe of instance_fleet_shrink.py run in the `base` window below when a package of a nested container changed since their last
# run, or no run is recorded. The check reads three dpkg status files: well under a second. A check that cannot read is not due.
- name: Read whether the nested root disks need shrinking
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30'] + fleet_outer + ['python3', '-I', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_fleet_shrink.py'),
          'check', fleet_shrink_record, fleet_inner_pools] + fleet_names }}
  register: fleet_shrink_read
  changed_when: false
  failed_when: false
- name: Read what the shrink check found
  vars:
    fleet_shrink_line: "{{ fleet_shrink_read.stdout_lines | default([]) | last | default('') }}"
  ansible.builtin.set_fact:
    fleet_shrink_check: >-
      {{ (fleet_shrink_line | from_json)
         if fleet_shrink_read.rc == 0 and fleet_shrink_line is match('^\{"due": ?(true|false), ?"reason": ?"(record|packages|current|unreadable)"\}$')
         else {'due': false, 'reason': 'unreadable'} }}

# `base` is retaken only for the containers whose disk changed. A reset restores `base` of all three, so the set must stay consistent:
# - a step that writes a nested container's own disk and reported a change (`fleet_disk_writers`: the grants, a remint and a Swamp
#   install of the nested Gateway): that container's `base`. A migration is no such writer: a reset migrates after its restore
#   (instance-fleet-migrate.yml), so `base` need not hold each schema;
# - a converge that changed a Node: that Node's `base` and the nested Gateway's, whose database records the converge;
# - a missing `base`: that container's;
# - a missing or unreadable record, or a fleet rule or file that differed: all three, with the rules applied on a stopped fleet;
# - a shrink that is due: all three, so the dedupe shares blocks across the three and every `base` holds the small form.
# The other containers keep running. Their agents lose the nested Gateway while it stops and connect again after its start, as after
# the restart above; the start after `base` starts what stopped and waits for readiness.
- name: Work out which base is due
  vars:
    fleet_base_missing: >-
      {%- set out = [] -%}
      {%- for read in fleet_snapshots.results -%}
      {%-   if 'base' not in (read.stdout | from_json | map(attribute='name') | list) -%}
      {%-     set _ = out.append(read.item) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    # Every step that writes to a nested container's own disk, with that container's role. A step that reported a change marks its
    # container for `base`. A new writer joins this list. The remint writes the tokens, `.env` and the Swamp state of the nested Gateway;
    # the Swamp install writes its binary and link. The converges mark their Node and the nested Gateway, which records them.
    fleet_disk_writers: "{{ [['gateway', fleet_grants], ['gateway', fleet_tokens], ['gateway', fleet_swamp]] }}"
    fleet_changed_roles: >-
      {{ (fleet_disk_writers | selectattr('1', 'changed') | map('first') | list) + fleet_converge_changed_roles
         + (['gateway'] if fleet_converge_changed_roles | length > 0 else []) }}
  ansible.builtin.set_fact:
    fleet_base_targets: >-
      {{ fleet_names if fleet_record_state != 'present' or fleet_drift_found | length > 0 or fleet_shrink_check.due
         else fleet_names | select('in', fleet_base_missing + (fleet_changed_roles | map('extract', intent.fleet.guests) | list)) | list }}

# A retake of `base` needs the fleet files compared, because a partly stopped fleet only compares its rules. A run that did not read the
# files reads them now, on the running fleet: a file that differs makes `base` due for all three, and is written first.
- name: Read the fleet files before base
  when: fleet_base_targets | length > 0 and not (fleet_due.rules or fleet_due.converge)
  ansible.builtin.include_tasks: instance-fleet-rules-read.yml
  vars: { fleet_rules_files: true }
- name: Retake base of all three for a file that differs
  when: fleet_base_targets | length > 0 and not (fleet_due.rules or fleet_due.converge) and fleet_drift | length > 0
  ansible.builtin.set_fact:
    fleet_base_targets: "{{ fleet_names }}"
- name: Write the fleet files that differ before base
  when: fleet_base_targets | length > 0 and not (fleet_due.rules or fleet_due.converge) and fleet_drift | length > 0
  ansible.builtin.include_tasks: instance-fleet-files.yml

# One readiness wait every time, so the seed holds a ready fleet: here when the fleet keeps running, and after the start that follows
# a retaken `base` otherwise.
- name: Wait for readiness
  when: fleet_base_targets | length == 0
  ansible.builtin.include_tasks: instance-fleet-ready.yml
- name: Time the readiness wait
  ansible.builtin.set_fact:
    fleet_ready_at: "{{ now(utc=true).timestamp() }}"

# A snapshot of a running container on a directory pool is a file copy, not a consistent state: each container stops first. They start
# again after `base` and the refresh waits for readiness, so the seed holds a running, ready fleet. A start that fails fails the refresh,
# and the run restores the old seed, `base` snapshots included: they live on the outer container's disk.
- name: Retake base
  when: fleet_base_targets | length > 0
  block:
    - name: Stop the nested containers
      ansible.builtin.command: { argv: "{{ ['timeout', '120'] + fleet_incus + ['stop', item, '--timeout', '90'] }}" }
      loop: "{{ fleet_base_targets }}"
      register: fleet_stop
      changed_when: true
      failed_when: false
    - name: Read the state of the stopped fleet
      ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_incus + ['list', '--format', 'csv', '--columns', 'ns'] }}" }
      register: fleet_stopped
      changed_when: false
    - name: Check that the nested containers stopped
      vars:
        fleet_still_running: >-
          {{ fleet_stopped.stdout_lines | reject('match', '^[^,]+,STOPPED$') | map('regex_replace', ',.*$', '') | select('in', fleet_base_targets) | list }}
      ansible.builtin.assert:
        that: fleet_still_running | length == 0
        fail_msg: >-
          {{ fleet_still_running | join(', ') }} did not stop:
          {{ fleet_stop.results | rejectattr('rc', 'eq', 0) | map(attribute='stderr') | join('; ') | truncate(400) }}
        quiet: true
    # With all three stopped the rules write what differed. With some stopped nothing differed when the refresh read them, so they only
    # compare: a write now would change a running container whose `base` stays.
    - name: Apply the fleet rules
      ansible.builtin.import_tasks: instance-fleet-rules.yml
      vars: { fleet_rules_apply: "{{ fleet_base_targets | length == fleet_names | length }}", fleet_rules_compare_files: true }
    - name: Check that the rules still hold on a partly stopped fleet
      when: fleet_base_targets | length < fleet_names | length
      ansible.builtin.assert:
        that: fleet_drift | length == 0
        fail_msg: >-
          The nested fleet differs from its rules while only {{ fleet_base_targets | join(', ') }} stopped:
          {{ fleet_drift | map(attribute='container') | zip(fleet_drift | map(attribute='kind'), fleet_drift | map(attribute='name'))
             | map('join', ' ') | join(', ') }}
        quiet: true
    - name: Delete the old base
      ansible.builtin.command: { argv: "{{ ['timeout', '120'] + fleet_incus + ['snapshot', 'delete', item.item, 'base'] }}" }
      when: "item.item in fleet_base_targets and 'base' in (item.stdout | from_json | map(attribute='name') | list)"
      loop: "{{ fleet_snapshots.results }}"
      loop_control: { label: "{{ item.item }}" }
      changed_when: true
    # With the three stopped and no `base` holding the old blocks: the relink, then the dedupe over the three root disks (36 s on a
    # copy of the first nested fleet: 11.8 GiB to 3.7 GiB of the inner pool). It never fails the refresh: a failed or partial run
    # writes no shrink record, so the next refresh runs it again.
    - name: Shrink the nested root disks
      when: fleet_shrink_check.due
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '600'] + fleet_outer + ['python3', '-I', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_fleet_shrink.py'),
              'run', fleet_shrink_record, fleet_inner_pools] + fleet_names }}
      register: fleet_shrink_run
      changed_when: fleet_shrink_run.rc == 0
      failed_when: false
    - name: Clear the network runtime files before base
      ansible.builtin.include_tasks: instance-fleet-runtime.yml
      vars: { fleet_runtime_names: "{{ fleet_base_targets }}" }
    - name: Take base
      ansible.builtin.command: { argv: "{{ ['timeout', '180'] + fleet_incus + ['snapshot', 'create', item, 'base'] }}" }
      loop: "{{ fleet_base_targets }}"
      changed_when: true
    - { name: Start the fleet again and wait for readiness, ansible.builtin.include_tasks: instance-fleet-resume.yml }

- name: Read what the shrink did
  vars:
    fleet_shrink_line: "{{ fleet_shrink_run.stdout_lines | default([]) | last | default('') }}"
  ansible.builtin.set_fact:
    fleet_shrink: >-
      {{ 'skipped' if fleet_shrink_run is skipped
         else (fleet_shrink_line | from_json).shrink
           if fleet_shrink_run.rc == 0
              and fleet_shrink_line is match('^\{"shrink": ?"(ran|relinked|failed)", ?"relinked": ?[0-9]+, ?"dedupe": ?"(ran|missing|not_btrfs|failed)"\}$')
         else 'failed' }}

# The pinned shape tools in the Instance container itself, so the seed that the phase after this one takes holds them for every copy
# (docs/reference/development-containers.md#the-pinned-shape-tools). instance_shape_tools.py names them with the workspace's own
# bin/swamp-shape-gate and only reads when they are complete, and keeps zip, unzip and jq for the fixture units. It never fails the refresh: a failed install is the result's
# `tools: failed` with the step in `tools_reason`, and the seed is taken without the tools.
- name: Time the base
  ansible.builtin.set_fact:
    fleet_base_at: "{{ now(utc=true).timestamp() }}"
- name: Keep the pinned shape tools in the container
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '600'] + fleet_outer + ['python3', '-I', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_shape_tools.py'),
          intent.container.workspace] }}
  register: fleet_tools_read
  changed_when: fleet_tools_read.rc == 0 and '"built"' in fleet_tools_read.stdout
  failed_when: false
- name: Read what the tools step did
  vars:
    fleet_tools_line: "{{ fleet_tools_read.stdout_lines | default([]) | last | default('') }}"
    fleet_tools_out: >-
      {{ (fleet_tools_line | from_json) if fleet_tools_read.rc == 0 and fleet_tools_line is match('^\{"tools": ?"[a-z]+", ?"reason": ?"[a-z]+"(, ?"[a-z]+": ?"[a-z0-9-]+")*\}$') else {} }}
  ansible.builtin.set_fact:
    fleet_tools: >-
      {{ {'tools': fleet_tools_out.tools, 'reason': fleet_tools_out.reason} if fleet_tools_out.tools | default('') in ['present', 'built', 'failed']
         else {'tools': 'failed', 'reason': 'timeout' if fleet_tools_read.rc == 124 else 'unreadable'} }}
    fleet_tools_at: "{{ now(utc=true).timestamp() }}"
# The step's programs write to its standard error, which an ok task does not print: a failure shows its end here.
- name: Report a failed tools step
  when: fleet_tools.tools == 'failed'
  ansible.builtin.debug:
    msg: "The pinned shape tools failed at {{ fleet_tools.reason }}: {{ (fleet_tools_read.stderr | default('') | trim)[-800:] }}"

# The record goes last; it was removed before the first write, so a run that failed before this leaves none, and the next run does every
# part again and retakes all three. The result names what
# ran and what was skipped, with the seconds of each part.
- name: Name what the refresh did
  ansible.builtin.set_fact:
    fleet_refresh_result:
      migrate: "{{ 'skipped' if fleet_migrate is skipped else 'applied' if fleet_migrate is changed else 'nothing' }}"
      restart: "{{ 'yes' if fleet_due.code or fleet_tokens is changed else 'no' }}"
      converge: "{{ 'ran' if fleet_due.converge else 'skipped' }}"
      # Why, for each Node: `reason` (`digest_unreadable` with `error`, `no_record`, `digest_changed`, `stale`, `unchanged`), and for a
      # converged Node the `phases` its converge ran: those whose phase digest moved, or every phase without a phase record.
      converge_reasons: >-
        {%- set out = {} -%}
        {%- for role in fleet_roles -%}
        {%- set _ = out.update({role: fleet_converge_reasons[role] | combine({'phases': fleet_converge_phases[role]} if role in fleet_converge_phases else {})}) -%}
        {%- endfor -%}
        {{ out }}
      # The nested Nodes the converge ran for, in converge order.
      converge_nodes: "{{ fleet_converge_roles }}"
      # `converged`: nested-app-dev's `app-dev` role converge ran the Instance host's container branch; `kept`: the seed's host stayed.
      # `skipped_idmap_small`: the default's ID map is below 2,000,000, so no isolated Instance fits on nested-app-dev and none is built.
      host: "{{ 'skipped_idmap_small' if not intent.fleet.host | default(false) | bool else 'converged' if fleet_due.host | bool else 'kept' }}"
      changed: "{{ fleet_converge_changed | int }}"
      tokens: "{{ 'skipped' if fleet_tokens_reason == 'no_key' else 'young' if fleet_tokens_reason in ['young', 'recorded'] else 'reminted' }}"
      # Why: `age` (one is older than `fleet_token_max_age`), `incomplete` (one is missing, such as worker c's), `unreadable`, `young`,
      # `recorded` (the record's oldest token is younger than the bound, so the list was not read), `no_key`.
      tokens_reason: "{{ fleet_tokens_reason }}"
      swamp: "{{ 'installed' if fleet_swamp is changed else 'skipped' if fleet_swamp_reason == 'no_key' else 'pinned' }}"
      # Why: `pinned` (serve runs the recipe's release), `changed`, `unreadable`, `no_key`.
      swamp_reason: "{{ fleet_swamp_reason }}"
      # The recipe's release that the nested Gateway runs after the refresh, or none without the Club key.
      swamp_version: "{{ fleet_swamp_version if fleet_swamp_reason != 'no_key' else none }}"
      base: "{{ 'retaken' if fleet_base_targets | length > 0 else 'kept' }}"
      base_containers: "{{ fleet_base_targets }}"
      record: "{{ fleet_record_state }}"
      tools: "{{ fleet_tools.tools }}"
      # Why: `current` (present), `missing` (built), or the step that failed: `names`, `package`, `venv`, `collections`, `cleanup`,
      # `timeout` (600 s), `unreadable` (no result line).
      tools_reason: "{{ fleet_tools.reason }}"
      # `ran` (relink and dedupe), `relinked` (no duperemove yet: due again), `failed` (due again), `skipped` (not due).
      shrink: "{{ fleet_shrink }}"
      shrink_reason: "{{ fleet_shrink_check.reason }}"
      seconds:
        gateway: "{{ ((fleet_gateway_at | float) - (fleet_started_at | float)) | round | int }}"
        converge: "{{ ((fleet_converge_at | float) - (fleet_gateway_at | float)) | round | int }}"
        ready: "{{ ((fleet_ready_at | float) - (fleet_converge_at | float)) | round | int }}"
        base: "{{ ((fleet_base_at | float) - (fleet_ready_at | float)) | round | int }}"
        tools: "{{ ((fleet_tools_at | float) - (fleet_base_at | float)) | round | int }}"
# The container's id map is isolated: the Node's stdin pipe shows there as owned by nobody, mode 0600, so a command that opens
# /dev/stdin by path is refused. `cat` reads the open stream. It writes a file beside the record, and the rename makes the record
# whole or absent, never partial.
- name: Write the refresh record
  when: fleet_now | length > 0
  vars:
    # The time of each Node's last converge: now for a Node that converged in this run, else the recorded one.
    fleet_converged_record: >-
      {%- set out = {} -%}
      {%- for role in fleet_roles -%}
      {%- set key = 'converged_' ~ (role | replace('-', '_')) -%}
      {%- if role in fleet_converge_roles -%}
      {%- set _ = out.update({key: now().timestamp() | int | string}) -%}
      {%- elif fleet_recorded[key] is defined -%}
      {%- set _ = out.update({key: fleet_recorded[key]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    fleet_record_write: >-
      mkdir -p "${1%/*}" && cat > "$1.tmp" && chown root:root "$1.tmp" && chmod 0644 "$1.tmp" && mv -f "$1.tmp" "$1"
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + fleet_outer + ['sh', '-c', fleet_record_write, 'sh', fleet_record] }}"
    stdin: >-
      {{ fleet_now | combine(fleet_converged_record)
         | combine({'tokens': fleet_tokens_mark} if fleet_tokens_mark is not none and fleet_tokens_mark | string is match('^[0-9]{14}$') else {})
         | to_json(sort_keys=true) }}
    stdin_add_newline: false
  changed_when: true
