id: dc0a6306-3b70-4500-8f1d-f4cefcd8e1b0
name: task-vm-bootstrap
description: Bootstrap one admitted guest as the enrollment does, with the steps of the enrollment itself - the managed account, its key, the sudoers file and the observer binary, each with its check. The enrollment and the check VM of the image refresh both call it.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.provision
      - tasks.provision
    intent:
      type: object
      properties:
        provider:
          type: string
          enum:
          - incus
          - upcloud
      required:
      - provider
    guest:
      type: object
    name:
      type: string
      minLength: 1
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - guest
  - name
  additionalProperties: false
jobs:
- name: bootstrap
  labels:
    role: swamp
  steps:
  - name: bootstrap-account
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/sbin/useradd","--create-home","--shell","/bin/bash","--",inputs.intent.user] : ["/usr/sbin/useradd","--create-home","--shell","/bin/bash","--",inputs.intent.user] }}'
        okExitCodes:
        - 0
        - 9
    dependsOn: []
  - name: bootstrap-authorized_key
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/bin/install","-D","-m","0600","-o",inputs.intent.user,"-g",inputs.intent.user,"/dev/stdin","/home/" + inputs.intent.user + "/.ssh/authorized_keys2"] : ["/usr/bin/install","-D","-m","0600","-o",inputs.intent.user,"-g",inputs.intent.user,"/dev/stdin","/home/" + inputs.intent.user + "/.ssh/authorized_keys2"] }}'
        stdin: ${{ inputs.intent.bootstrap.public_key + "\n" }}
    dependsOn:
    - step: bootstrap-account
      condition:
        type: succeeded
  - name: bootstrap-sudo
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/bin/sh","-c","rm -f \"$1\" && exec /usr/bin/install -m 0440 -o root -g root /dev/stdin \"$1\"","sh","/etc/sudoers.d/" + inputs.intent.user] : ["/bin/sh","-c","rm -f \"$1\" && exec /usr/bin/install -m 0440 -o root -g root /dev/stdin \"$1\"","sh","/etc/sudoers.d/" + inputs.intent.user] }}'
        stdin: ${{ inputs.intent.user + " ALL=(ALL) NOPASSWD:ALL\n" }}
    dependsOn:
    - step: bootstrap-authorized_key
      condition:
        type: succeeded
  - name: bootstrap-sudo-check
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/sbin/visudo","-cf","/etc/sudoers.d/" + inputs.intent.user] : ["/usr/sbin/visudo","-cf","/etc/sudoers.d/" + inputs.intent.user] }}'
    dependsOn:
    - step: bootstrap-sudo
      condition:
        type: succeeded
  - name: bootstrap-observer-download
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/bin/curl","--fail","--silent","--show-error","--location","--max-time","120","--proto","=https","--output","/usr/local/bin/.orbit-agent.download",inputs.intent.agent_artifact_url] : ["/usr/bin/curl","--fail","--silent","--show-error","--location","--max-time","120","--proto","=https","--output","/usr/local/bin/.orbit-agent.download",inputs.intent.agent_artifact_url] }}'
    dependsOn:
    - step: bootstrap-sudo-check
      condition:
        type: succeeded
  - name: bootstrap-observer-checksum
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/bin/sha256sum","--check","--strict","-"] : ["/usr/bin/sha256sum","--check","--strict","-"] }}'
        stdin: ${{ inputs.intent.agent_sha256 + "  /usr/local/bin/.orbit-agent.download\n" }}
    dependsOn:
    - step: bootstrap-observer-download
      condition:
        type: succeeded
  - name: bootstrap-observer
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/bin/install","-m","0755","-o","root","-g","root","/usr/local/bin/.orbit-agent.download","/usr/local/bin/orbit-agent"] : ["/usr/bin/install","-m","0755","-o","root","-g","root","/usr/local/bin/.orbit-agent.download","/usr/local/bin/orbit-agent"] }}'
    dependsOn:
    - step: bootstrap-observer-checksum
      condition:
        type: succeeded
  - name: bootstrap-verify-sudo
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.name] + ["/usr/bin/sudo","-n","-u",inputs.intent.user,"--","/usr/bin/sudo","-n","true"] : ["/usr/bin/sudo","-n","-u",inputs.intent.user,"--","/usr/bin/sudo","-n","true"] }}'
    dependsOn:
    - step: bootstrap-observer
      condition:
        type: succeeded
  - name: bootstrap-verify
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
