---
- name: Role resources on the Node
  hosts: role_node
  tags:
    - prerequisites
  become: true
  tasks:
    - name: Install the role prerequisites
      ansible.builtin.import_tasks: tasks/role-prerequisites.yml
- name: Role resources on the Node
  hosts: role_node
  tags:
    - node
  become: true
  vars: { rt: "{{ intent.runtime }}" }
  handlers:
    - name: Reload units
      ansible.builtin.systemd: { daemon_reload: true }
  tasks:
    - { name: Reconcile the role runtime, ansible.builtin.import_tasks: tasks/node-role-runtime.yml }
- name: ClickHouse configuration
  hosts: clickhouse_node
  tags:
    - node
  become: true
  tasks:
    - name: Create ClickHouse folders
      ansible.builtin.file: { path: "/etc/orbit/analytics/clickhouse/{{ item }}", state: directory, owner: root, group: root, mode: "0755" }
      loop:
        - ""
        - config.d
        - users.d
    - name: Write ClickHouse configuration
      ansible.builtin.copy:
        dest: /etc/orbit/analytics/clickhouse/{{ item.key }}
        content: "{{ item.value }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ plans.clickhouse | dict2items }}"
- name: Analytics readiness
  hosts: role_node
  tags: [readiness]
  vars: { analytics: "{{ intent.runtime.analytics }}" }
  tasks:
    - name: Wait for initial Analytics startup
      when: analytics is not none and analytics.initialize | length > 0
      ansible.builtin.uri: { url: "{{ analytics.health_url }}" }
      register: analytics_ready
      until: analytics_ready is succeeded
      retries: 60
      delay: 1
- name: Role publications
  hosts: publication_nodes
  tags:
    - publication
  become: true
  handlers:
    - name: Reload Caddy
      ansible.builtin.systemd: { name: caddy, state: reloaded }
  tasks:
    - name: Write the Caddyfile
      ansible.builtin.copy:
        dest: /etc/caddy/Caddyfile
        content: "{{ item.after.caddy.content }}"
        owner: root
        group: caddy
        mode: "0640"
        validate: caddy validate --config %s --adapter caddyfile
      loop: "{{ publications | rejectattr('after.caddy', 'none') | list }}"
      loop_control: { label: "{{ item.after.caddy.version }}" }
      notify: Reload Caddy
- name: Analytics local storage firewall
  hosts: role_node
  tags: [storage-firewall]
  become: true
  vars:
    local_storage_rules: "{{ intent.firewall.desired | select('contains', 'docker0') | list }}"
  tasks:
    - name: Read Analytics local storage rules
      when: local_storage_rules | length > 0
      ansible.builtin.command: ufw show added
      register: local_firewall
      changed_when: false
    - name: Replace Analytics local storage ports
      ansible.builtin.include_tasks: tasks/firewall-port.yml
      loop: "{{ local_storage_rules }}"
      loop_control: { loop_var: rule, label: "{{ rule[-1] }}" }
    - name: Open Analytics local storage ports
      ansible.builtin.command: { argv: "{{ item }}" }
      loop: "{{ local_storage_rules }}"
      register: local_ufw
      changed_when: local_ufw.stdout is not search('Skipping')
- name: Role firewall
  hosts: role_node
  tags: [firewall]
  become: true
  tasks:
    - name: Converge the role firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
      vars:
        firewall_commands: >-
          {{ (intent.firewall.desired | reject('contains', 'docker0') | list
          if intent.role == 'analytics' else intent.firewall.desired) + intent.firewall.remove }}
- name: Node exporters
  hosts: exporter_nodes
  tags:
    - exporters
  become: true
  vars: { exporter: "{{ exporters | first }}" }
  tasks:
    - name: Require one exporter per Node
      ansible.builtin.assert: { that: exporters | length == 1, quiet: true }
    - { name: Add the exporter, ansible.builtin.import_tasks: tasks/exporter.yml }
  handlers:
    - name: Reload exporter Caddy
      ansible.builtin.systemd: { name: caddy, state: reloaded }
- name: Prometheus
  hosts: prometheus_node
  tags:
    - prometheus
  become: true
  vars: { prom: "{{ intent.prometheus }}" }
  tasks:
    - name: Validate the Prometheus config
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - orbit-metrics-prometheus
          - /bin/promtool
          - check
          - config
          - /dev/stdin
        stdin: "{{ prom.configuration }}"
      changed_when: false
    - name: Read the published Prometheus checksum
      ansible.builtin.stat:
        path: /etc/orbit/metrics/prometheus.yml
        checksum_algorithm: sha256
      register: prometheus_file
    - name: Publish the Prometheus config
      register: published
      notify: Reload Prometheus
      ansible.builtin.command:
        argv:
          - dd
          - of=/etc/orbit/metrics/prometheus.yml
          - status=none
        stdin: "{{ prom.configuration }}"
        stdin_add_newline: false
      when: prometheus_file.stat.checksum | default('') != prom.configuration | hash('sha256')
      changed_when: true
    - { name: Reload Prometheus before checking, ansible.builtin.meta: flush_handlers }
    - name: Check Prometheus and every exporter endpoint
      ansible.builtin.uri: { url: "{{ item }}" }
      loop: "{{ ['http://127.0.0.1:9090/-/ready'] + prom.checks | map(attribute='url') | list }}"
      register: endpoint
      until: endpoint is succeeded
      retries: 60
      delay: 1
  handlers:
    - name: Reload Prometheus
      changed_when: true
      when: published is changed
      ansible.builtin.command: docker kill --signal HUP orbit-metrics-prometheus
- name: Check the role
  hosts: role_node
  tags:
    - check
  become: true
  tasks:
    - name: Read services
      ansible.builtin.command: { argv: [systemctl, is-active, "{{ item.name }}"] }
      loop: "{{ intent.services + rt.units }}"
      changed_when: false
    - name: Read Bun
      when: intent.bun is not none
      ansible.builtin.command: /usr/local/bin/bun --version
      register: bun
      changed_when: false
    - { name: Read installed packages, ansible.builtin.package_facts: !!null "" }
    - name: Check the role
      ansible.builtin.assert:
        that:
          - intent.bun is none or bun.stdout | trim == intent.bun.version
    - name: Check PHP package versions
      ansible.builtin.assert: { that: "item.version in ansible_facts.packages[item.name] | default([]) | map(attribute='version')", quiet: true }
      loop: "{{ intent.php_packages }}"
      loop_control: { label: "{{ item.name }}" }
    - name: Check prerequisites
      ansible.builtin.assert:
        that: >-
          item in ansible_facts.packages or (item == 'docker.io' and 'docker-ce' in ansible_facts.packages)
        quiet: true
      loop: "{{ intent.packages }}"
    - { name: Check role files and folders, ansible.builtin.import_tasks: tasks/check-files.yml }
    - name: Check runtime endpoints
      ansible.builtin.uri: { url: "{{ item.url }}", status_code: "{{ [200] if item.require_success else range(100, 600) | list }}" }
      loop: "{{ rt.probes }}"
    - name: Check Metrics containers and volumes
      when: rt.metrics is not none
      ansible.builtin.import_tasks: tasks/metrics.yml
      vars: { metrics_check_only: true, metrics_config_changed: false }
    - { name: Check runtime identities and units, ansible.builtin.import_tasks: tasks/check-runtime.yml }
    - name: Check the Swamp start cache
      when: rt.swamp is not none
      ansible.builtin.import_tasks: tasks/swamp-start-cache.yml
      vars: { swamp_start_cache: /tmp/deno-compile-swamp.cache, swamp_cache_check_only: true }
    - name: Check CI state
      when: rt.ci_host
      ansible.builtin.import_tasks: tasks/ci.yml
      vars: { ci_check_only: true }
    - name: Check the Incus service
      when: rt.ci_host
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - incus.service
      changed_when: false
  vars: { rt: "{{ intent.runtime }}" }

- name: Observe Tool Manager accounts
  hosts: role_node
  tags: [tools-read]
  become: true
  tasks:
    - name: Read the enrolled account
      ansible.builtin.getent: { database: passwd, key: "{{ intent.ssh.target.user }}" }
    - name: Capture the Tool Manager account
      ansible.builtin.copy:
        dest: "{{ run_folder }}/tools-account.json"
        content: "{{ ansible_facts.getent_passwd | to_json }}"
        mode: '0600'
      delegate_to: localhost
      become: false
- name: Set up Tool Managers
  hosts: role_node
  tags: [tools]
  become: true
  tasks:
    - name: Apply pinned Tool Managers
      ansible.builtin.include_tasks: tasks/role-tool-manager.yml
      loop: "{{ plans.managers }}"
      loop_control: { loop_var: manager }
- name: Initialize and run Analytics
  hosts: role_node
  tags: [analytics]
  become: true
  vars: { analytics: "{{ intent.runtime.analytics }}" }
  tasks:
    - name: Apply Analytics initialization and runtime
      when: analytics is not none and kind != 'node.role_converge'
      ansible.builtin.import_tasks: tasks/role-analytics.yml
- name: Run Swamp
  hosts: role_node
  tags: [swamp]
  become: true
  vars: { rt: "{{ intent.runtime }}" }
  tasks:
    - name: Apply the Swamp runtime
      when: rt.swamp is not none
      ansible.builtin.import_tasks: tasks/role-swamp.yml
  handlers:
    - name: Reload units
      ansible.builtin.systemd: { daemon_reload: true }
- name: Observe role publications
  hosts: publication_nodes
  tags: [publication-read]
  become: true
  tasks:
    - name: Read PHP and DNS state
      ansible.builtin.import_tasks: tasks/role-publication-read.yml
- name: Publish role PHP pools
  hosts: publication_nodes
  tags: [php]
  become: true
  tasks:
    - name: Apply composed PHP pools
      ansible.builtin.import_tasks: tasks/role-publication-php.yml
- name: Remove Analytics initialization containers
  hosts: role_node
  tags: [cleanup]
  become: true
  tasks:
    - name: Remove init containers
      community.docker.docker_container: { name: "{{ item.name }}", state: absent, force_kill: true }
      loop: "{{ (intent.runtime.analytics or {}).get('initialize', []) }}"
      loop_control: { label: "{{ item.name }}" }
      when: kind != 'node.role_converge'
