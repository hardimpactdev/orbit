id: c1f0a7d2-9b8e-4df1-8a21-43b8bfc50d74
name: operation-instance-policy-activity
description: Complete one admitted policy Activity for Gateway terminal projection.
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [instance.policy_event]}
    intent:
      type: object
      properties:
        instance_id: {type: integer, minimum: 1}
        event: {type: string, enum: [activity]}
        result: {type: string}
      required: [instance_id, event, result]
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: record
    steps:
      - name: record
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "instance-policy-activity-" + string(inputs.operation_id) }}'
          methodName: execute
          inputs:
            run: |
              printf '%s\n' '{"recorded":true}'
