[package]
name = "orbit-executor-power"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Whole-container sleep and discard for the Orbit executor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
orbit-executor-core = { path = "../executor-core" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

[lints]
workspace = true
