id: 4b0f7f8a-2f6c-4f53-9a51-3c2f0f6c1a02
name: task-publication-export
description: Bundle the checked HEAD on the task VM and copy the bundle to 209; the VM never gets a GitHub token.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
    scratch:
      type: string
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - scratch
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: export
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - bundle
        - create
        - ${{ inputs.scratch + ".bundle" }}
        - HEAD
    allowFailure: true
  - name: copy_bundle
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: copy
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ inputs.scratch + ".bundle" }}
        dst: ${{ inputs.scratch + "-candidate.bundle" }}
        direction: from
    dependsOn:
    - step: export
      condition:
        type: succeeded
    allowFailure: true
  - name: remove-bundle
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-publication-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - rm
        - -f
        - --
        - ${{ inputs.scratch + ".bundle" }}
    allowFailure: true
    dependsOn:
    - step: copy_bundle
      condition:
        type: always
queueTimeout: 60
