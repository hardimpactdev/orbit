id: fbef909e-eb12-4dbc-b854-7e896aa6f594
name: operation-runner
description: Discover claimable kinds without claiming; dispatch each family to its placed worker.
autoResume: true
trigger:
  schedule: "*/10 * * * * *"
jobs:
  - name: operations
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-runner"
          behaviorName: operation-runner
          methodName: discover
          inputs:
            worker: "${{ run.id }}"
      - name: dispatch
        dependsOn: [{ step: discover, condition: { type: succeeded } }]
        task:
          type: workflow
          workflowIdOrName: operation-dispatch
          inputs:
            work: "${{ steps.discover.outputs.work }}"
