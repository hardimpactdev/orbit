---
# The commands of the batch, run on the task VM (the operator side) with the real CLI against the nested Gateway. Swamp does not run them.
# One host per case (molecule.yml, cases.yml). The independent cases run as many at a time as ANSIBLE_FORKS allows, on the free strategy so a
# slow case holds none of the others; the exclusive ones, which compare global state, run one at a time after them.
- ansible.builtin.import_playbook: facts.yml

- name: Run the independent cases
  hosts: independent_cases
  gather_facts: false
  strategy: free
  # A limit of 1 means one case after the other; a larger limit is the forks of Ansible (ANSIBLE_FORKS), all hosts at once.
  serial: "{{ 1 if (lookup('ansible.builtin.env', 'ANSIBLE_FORKS') | default('1', true) | int) == 1 else 0 }}"
  vars_files: [cases.yml]
  tasks:
    - ansible.builtin.import_tasks: act.yml

- name: Run the cases that check global state, alone
  hosts: exclusive_cases
  gather_facts: false
  serial: 1
  vars_files: [cases.yml]
  tasks:
    - ansible.builtin.import_tasks: act.yml
