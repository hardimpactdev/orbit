  "swamp/ansible/tasks/conn-server-linux.yml",
  "swamp/ansible/tasks/conn-server-mac-health.yml",
  "swamp/ansible/tasks/conn-server-mac-round.yml",
  "swamp/ansible/tasks/conn-server-mac-start.yml",
