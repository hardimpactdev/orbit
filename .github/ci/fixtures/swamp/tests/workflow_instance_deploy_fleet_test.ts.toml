order = 1160
cases = [
  "a container deployment runs its phases in two steps, each one play of the phases that share their failure handling",
  "the playbook runs the phases of a merged step in order, and the handlers of one phase before the next phase",
  "a normal container deployment never restores, after success and after a failure",
  "a failed Prepare the container changes nothing in the workspace: every later step skips and no seed is restored",
  "a nested-fleet deployment that failed from its checkout on restores the old seed, starts through start and keeps the failed phase's result",
  "the result step waits for every step that writes the result file",
  "the deployment's one fleet check waits for no Doctor, and the refresh starts again what it stopped for base before the seed",
  "after a restore the restored fleet is started and waited for, and the first failure stays the run's result",
  "two deployments of different defaults on one Node never share a behavior lock for a long step",
  "only the proof default holds its seed, after the start and the probe, and a busy hold at its bound changes nothing",
  "a probe that finds the checkout already past the commit ends the run: no seed hold, fleet check, seed, bundle or restart, and nothing restores",
  "the restart after a restore keeps the failed phase's result and adds the receipt of the order it signed",
]
