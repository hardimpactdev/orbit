id: 3c44f7b0-9f87-4a6e-b899-6d0b4bb71292
name: operation-database-clone
description: One admitted database clone through placed native actions and official SSH from209.
writes: true
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [database.clone]}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-clone-intent-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: clone
  target: orbit-node-209
  steps:
  - name: intent
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/database-clone-command-assets'
      behaviorName: ${{ "dbcm-" + run.id }}
      methodName: read
      inputs: {intent: '${{ inputs.intent }}'}
  - name: mysql
    target: orbit-node-209
    dependsOn:
    - {step: intent, condition: {type: succeeded}}
    guard: ${{ steps.intent.status != "succeeded" || inputs.intent.variant != "mysql" }}
    task:
      type: workflow
      workflowIdOrName: database-clone-mysql
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{
          inputs.execution_secrets }}'}
  - name: sqlite
    target: orbit-node-209
    dependsOn:
    - {step: intent, condition: {type: succeeded}}
    guard: ${{ steps.intent.status != "succeeded" || inputs.intent.variant == "mysql" }}
    task:
      type: workflow
      workflowIdOrName: database-clone-sqlite
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{
          inputs.execution_secrets }}'}
- name: result
  target: orbit-node-209
  dependsOn:
  - {job: clone, condition: {type: always}}
  steps:
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/database-clone-command-assets'
      behaviorName: ${{ "dbcm-" + run.id }}
      methodName: result
      inputs: {expected: '${{ inputs.intent.variant == "mysql" ? ["mysql"] : ["sqlite"] }}', steps: '${{ steps }}'}
  - name: accept_result
    target: orbit-node-209
    dependsOn:
    - {step: result, condition: {type: succeeded}}
    task:
      type: assert
      expr: steps.result.outputs.exitCode == 0
      severity: high
      message: Database clone did not complete.
