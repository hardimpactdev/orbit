id: c3f7a915-2d84-4e1b-8a60-b5d9e4f18a33
name: proof-fleet-verify
description: Run the proof cases of one command on the task VM, in batches, from Orbit's own Swamp over official SSH. One child per batch, one child per case, one report of the verdict lines.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum: [proof.verify]
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: plan
  labels: {role: swamp}
  steps:
  # `runner plan --lines` prints one line a batch: `BATCH SETUP CASE...`. The forEach below reads it.
  - name: plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("proof-verify-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("proof-verify-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - python3
        - ${{ inputs.intent.checkout_path + "/swamp/proof/runner/runner.py" }}
        - plan
        - --lines
        - --file
        - ${{ inputs.intent.checkout_path + "/" + inputs.intent.file }}
# Before the first batch (3-proof.mmd): the fleet is made ready for the cases. A step that fails stops the run, and every case is unrun with cause infrastructure.
- name: prepare
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  steps:
  # The author's fleet may have moved since the last proof (3-proof.mmd, first restore): it starts from `base`, as every batch does. The Gateway sets `restore_first` for `orbit proof`; the VM of a proof in CI has just taken `base`.
  - name: 'Restore the base snapshot'
    labels: {role: swamp}
    writes: true
    guard: '${{ !(has(inputs.intent.restore_first) && inputs.intent.restore_first) }}'
    task: {type: workflow, workflowIdOrName: proof-fleet-restore, inputs: {ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
  # `base` holds the Swamp tokens of its nested Gateway; the file that the provision and the re-mint write is the witness of their age. `find` prints the path only when the file is older than 20 days (28,800 minutes), so no output means the tokens are fresh.
  - name: 'Read the token age'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-the-token-age").split(".").join("-") }}', methodName: exec, globalArgs: {name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-read-the-token-age").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'exec', 'nested-gateway', '--', 'find', '/home/orbit/.config/swamp/serve-driver-token', '-mmin', '+28800'], timeoutSec: 70}}
    dependsOn: [{step: 'Restore the base snapshot', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  # The step of the provision, not a copy: the child `task-nested-apply` with `remint` set runs its step `Re-mint the Swamp tokens`, between its mounts and its migrations and restart, so the services run with the new tokens.
  - name: 'Re-mint the Swamp tokens'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Read the token age"].outputs.stdout.trim() == "" }}'
    task: {type: workflow, workflowIdOrName: task-nested-apply, inputs: {guest_node_id: '${{ inputs.intent.ssh_execution.target.node_id }}', ssh_execution: '${{ inputs.intent.ssh_execution }}', fleet: '${{ {"guests": {"gateway": "nested-gateway", "app-dev": "nested-app-dev", "app-prod": "nested-app-prod"}, "network": "oe-nested"} }}', club: '${{ true }}', remint: '${{ true }}'}}
    dependsOn: [{step: 'Read the token age', condition: {type: succeeded}}]
  # The fleet that `base` keeps must be ready, as in the provision (`task-nested-fleet`): the apply that the re-mint runs has just restarted the services.
  - name: 'Check readiness'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Read the token age"].outputs.stdout.trim() == "" }}'
    task: {type: workflow, workflowIdOrName: task-nested-ready, inputs: {guest_node_id: '${{ inputs.intent.ssh_execution.target.node_id }}', ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
    dependsOn: [{step: 'Re-mint the Swamp tokens', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the token age', condition: {type: succeeded}}]
  # `--reuse` replaces the old `base`. Skipped with the re-mint: the code needs no new `base`.
  - name: 'Take base again'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    guard: '${{ steps["Read the token age"].outputs.stdout.trim() == "" }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-take-base-again" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {name: '${{ ("proof-verify-" + string(inputs.intent.ssh_execution.target.node_id) + "-take-base-again" + "-" + self.role).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '180', 'incus', 'snapshot', 'create', '${{ "nested-" + self.role }}', 'base', '--stateful', '--reuse'], timeoutSec: 190}}
    dependsOn: [{step: 'Check readiness', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the token age', condition: {type: succeeded}}]
- name: batches
  labels: {role: swamp}
  concurrency: 1
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  - job: prepare
    condition: {type: succeeded}
  steps:
  # One child per batch, one at a time, in plan order. A batch that stopped on its setup stops the run.
  - name: batch-${{ self._index }}
    labels: {role: swamp}
    forEach:
      item: batch
      in: '${{ steps.plan.outputs.stdout.trim().split("\n").map(l, {"batch": l.split(" ", 3)[0], "setup": l.split(" ", 3)[1] == "1", "cases": l.split(" ", 3)[2].split(" ")}) }}'
    guard: '${{ steps.exists(k, k.startsWith("batch-") && steps[k].?outputs.?report.?stdout.orValue("").contains("run stopped")) }}'
    allowFailure: true
    task:
      type: workflow
      workflowIdOrName: proof-fleet-verify-batch
      inputs:
        ssh_execution: ${{ inputs.intent.ssh_execution }}
        checkout_path: ${{ inputs.intent.checkout_path }}
        group_id: ${{ inputs.intent.group_id }}
        file: ${{ inputs.intent.file }}
        batch: ${{ self.batch.batch }}
        setup: ${{ self.batch.setup }}
        restore: ${{ self._index > 0 }}
        cases: ${{ self.batch.cases }}
# Final restore for the author's command (3-proof.mmd): the intent sets `final_restore`; CI leaves it unset. It also runs after batches that failed.
- name: finish
  labels: {role: swamp}
  dependsOn:
  - job: plan
    condition: {type: succeeded}
  - job: prepare
    condition: &always {type: always}
  - job: batches
    condition: *always
  steps:
  - name: 'Restore the clean fleet'
    labels: {role: swamp}
    writes: true
    guard: '${{ !(has(inputs.intent.final_restore) && inputs.intent.final_restore) }}'
    task: {type: workflow, workflowIdOrName: proof-fleet-restore, inputs: {ssh_execution: '${{ inputs.intent.ssh_execution }}'}}
- name: report
  labels: {role: swamp}
  dependsOn:
  - job: prepare
    condition: {type: completed}
  - job: batches
    condition: {type: completed}
  - job: finish
    condition: *always
  steps:
  # The Gateway reads this step once, at the end of the run. Every planned case has a line: a case of a batch that did not run is unrun, cause infrastructure.
  - name: report
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: proof-verify-report
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$LINES"
        env:
          LINES: '${{ [steps.filter(k, k.startsWith("batch-")).map(k, steps[k].?outputs.?report.?stdout.orValue("").trim()).filter(x, x != "")].map(x, (x + [x.join("\n")].map(e, steps.plan.outputs.stdout.trim().split("\n").map(l, l.split(" ", 3)[2]).join(" ").split(" ").filter(c, !e.contains("\"id\": \"" + c + "\"")).map(c, "{\"id\": \"" + c + "\", \"verdict\": \"unrun\", \"cause\": \"infrastructure\", \"secs\": 0, \"failed\": [\"run stopped: the fleet or the batch setup did not succeed\"]}"))[0]).join("\n"))[0] }}'
