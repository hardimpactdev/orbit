id: d321071e-bf48-44fc-84bc-a67939f587f8
name: operation-certificate-converge
description: One admitted local leaf, visible command actions, and terminal public presence.
writes: true
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - certificate.converge
    intent:
      type: object
      properties:
        leaf:
          type: object
          properties:
            node_id:
              type: integer
              minimum: 1
            scope:
              type: string
              pattern: ^(app-instance-[1-9][0-9]*(-hostname-change)?|route-[1-9][0-9]*(-router(-hostname-change)?|-ingress)?)$
            user:
              type: string
              pattern: ^[a-z_][a-z0-9_-]{0,31}$
            home:
              type: string
            agent_sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            domain:
              type: string
              minLength: 1
              maxLength: 253
            version:
              type: string
              pattern: ^[a-f0-9]{16}$
            root_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
          required:
          - node_id
          - scope
          - user
          - agent_sha256
          - domain
          - version
          - root_hash
          additionalProperties: false
        control_node_id:
          type: integer
          enum:
          - 209
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
            nodePort:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
          - nodePort
        host_keys:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - leaf
      - control_node_id
      - connection
      - host_keys
    execution_secrets:
      type: object
      additionalProperties: false
      maxProperties: 0
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        node_id: ${{ inputs.intent.leaf.node_id }}
        intent: ${{ inputs.intent.leaf }}
  - name: prepare-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-certificate-" + run.id }}
    target: orbit-node-209
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: copy-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-certificate-" + run.id + "/" }}
        direction: to
        recursive: true
    target: orbit-node-209
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
  - name: request
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/request.py" }}
        sudo: true
    target: orbit-node-209
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
  - name: request-result
    target: orbit-node-209
    writes: true
    dependsOn:
    - step: request
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: decodeRequest
      inputs:
        stdout: ${{ steps.request.outputs.stdout }}
        leaf: ${{ inputs.intent.leaf }}
  - name: sign-http
    target: orbit-node-209
    writes: true
    dependsOn:
    - step: request-result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-sign-" + run.id }}
      methodName: execute
      inputs:
        run: '/usr/bin/python3 -B "$ORBIT_CERTIFICATE_SIGN_SCRIPT"'
        env:
          ORBIT_CERTIFICATE_SIGN_SCRIPT: '${{ steps.assets.outputs.scripts_directory + "/sign.py" }}'
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ run.id }}
          ORBIT_CERTIFICATE_MODE: single
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["request-result"].outputs.request_json }}
          ORBIT_CERTIFICATE_LEAF: ${{ steps.assets.outputs.input_json }}
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: signed-result
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: decodeSigned
      inputs:
        leaf: ${{ inputs.intent.leaf }}
        request: ${{ steps["request-result"].outputs.request }}
        stdout: '${{ steps["request-result"].outputs.state == "current" ? ''{"certificates":[]}'' : steps["sign-http"].outputs.stdout
          }}'
    dependsOn:
    - step: sign-http
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: publish
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_SIGNED=" + steps["signed-result"].outputs.signed_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/publish.py" }}
        sudo: true
    target: orbit-node-209
    dependsOn:
    - step: signed-result
      condition:
        type: succeeded
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: trust
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/trust.py" }}
        sudo: true
    target: orbit-node-209
    dependsOn:
    - step: publish
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: reload
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - sh
        - -c
        - if systemctl is-active --quiet caddy; then systemctl reload caddy; fi
        sudo: true
    target: orbit-node-209
    dependsOn:
    - step: trust
      condition:
        type: succeeded
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: inspect
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_EXPECT_PRESENT=" + "true" }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/inspect.py" }}
        sudo: true
    target: orbit-node-209
    dependsOn:
    - step: reload
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: cleanup-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - ${{ "/tmp/orbit-certificate-" + run.id }}
    target: orbit-node-209
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    allowFailure: true
