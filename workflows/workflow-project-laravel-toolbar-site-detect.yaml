id: c2cd7bf6-c90f-49c5-88c9-9be337ea1a40
name: '@nckrtl/project-laravel-toolbar-site/detect'
description: laravel-toolbar-site detect through its private project extension.
trigger:
  schedule: 10 4 * * *
jobs:
- name: start
  steps:
  - name: detect
    task:
      type: model_method
      modelType: "@nckrtl/dependency-scanner"
      modelName: dependency-scanner
      methodName: scan
      inputs:
        projectId: 28
        runId: '${{ run.id }}'
