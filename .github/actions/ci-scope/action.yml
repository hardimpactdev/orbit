name: Select this build from changed inputs
description: Check scope before toolchain setup while independent builds start in parallel.
inputs:
  job:
    description: Build name in bin/ci-build-plan.
    required: true
  enabled:
    description: Select from changes, or run unconditionally for release builds.
    default: 'true'
  swamp-base:
    description: Resolve the retained Swamp comparison source with a full-history checkout.
    default: 'false'
outputs:
  selected:
    description: Whether this build has changed inputs.
    value: ${{ steps.scope.outputs.selected }}
  swamp-base-ref:
    description: Actual Orbit base or retained initial-import source.
    value: ${{ steps.scope.outputs.swamp-base-ref }}
runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SCOPE_JOB: ${{ inputs.job }}
        SWAMP_BASE: ${{ inputs.swamp-base }}
        SCOPE_ENABLED: ${{ inputs.enabled }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        EVENT_SHA: ${{ github.sha }}
        MAIN: ${{ github.ref == 'refs/heads/main' }}
      run: |
        if [ "$SCOPE_ENABLED" != true ]; then echo 'selected=true' >> "$GITHUB_OUTPUT"; exit 0; fi
        if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then git fetch --no-tags --deepen=1 origin "$EVENT_SHA"; fi
          BASE=HEAD^
        elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE"
        fi
        args=()
        if [ "$MAIN" = true ]; then args+=(--main); fi
        if [ "$SWAMP_BASE" = true ]; then args+=(--swamp-base); fi
        python3 bin/ci-build-plan --base "$BASE" "${args[@]}" | python3 -c 'import json,os,sys; plan=json.load(sys.stdin); print("selected=" + str(plan["jobs"][os.environ["SCOPE_JOB"]]).lower()); print("swamp-base-ref=" + plan.get("swamp_base_ref", ""))' >> "$GITHUB_OUTPUT"
