---
# The configurable notice before a Node's Conn Server restarts (conn-server-rollout.yml): a POST to the admitted URL or the admitted
# command, from the Swamp worker. With no target set, nothing is sent. A failed notice fails the Node with conn_server.notice_failed
# before anything changes. The URL or the command may hold a token, so no output of theirs is logged, on success or failure.
- name: Post the notice
  when: intent.notice.url | default(none) is not none
  delegate_to: localhost
  ansible.builtin.uri:
    url: "{{ intent.notice.url }}"
    method: POST
    body_format: json
    body: { node_id: "{{ node_id | int }}", version: "{{ notice_version | default(version) }}", event: "{{ notice_event | default('conn_server.restart') }}" }
    status_code: [200, 201, 202, 204]
    timeout: 20
  timeout: 30
  register: notice_post
  ignore_errors: true
  no_log: true
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Run the notice command
  when: intent.notice.command | default(none) is not none
  delegate_to: localhost
  ansible.builtin.command: { argv: "{{ intent.notice.command + [node_id | string, notice_version | default(version)] + ([notice_event] if notice_event is defined else []) }}" }
  changed_when: true
  timeout: 30
  register: notice_run
  ignore_errors: true
  no_log: true
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Fail a failed notice
  ansible.builtin.assert:
    that: notice_post is not failed and notice_run is not failed
    fail_msg: conn_server.notice_failed
    quiet: true
