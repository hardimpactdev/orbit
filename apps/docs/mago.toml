version = "1.40.1"
php-version = "8.5"

[source]
paths = ["app", "bootstrap", "config", "database", "routes", "tests"]
includes = ["vendor", "../../packages/core/src"]
excludes = ["bootstrap/cache", "build", "node_modules", "public/build", "storage"]

[formatter]
preset = "laravel"

[analyzer]
baseline = "mago-analyzer-baseline.toml"

[linter]
baseline = "mago-linter-baseline.toml"
integrations = ["laravel", "pest", "phpunit"]
