id: 2c34c217-ce35-4fde-87ca-1fe4fee45bc7
name: task-command-run
description: Run one Schedule command on its Node as a transient systemd unit of the Schedule's user, through official SSH from 209; the command arrives from the vault on stdin.
vaults:
- orbit-control-inputs
queueTimeout: 300
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    fire_run_id:
      type: string
      format: uuid
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [schedule.run]}
    intent:
      type: object
      properties:
        schedule:
          type: object
          properties:
            id:
              type: string
              format: uuid
            command_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
            user:
              type: string
              pattern: ^[a-z_][a-z0-9_-]{0,255}$
            working_directory:
              type: string
              pattern: ^(?:/[^\x00-\x1f\x7f]*)?$
              maxLength: 4096
            shell:
              type: string
              pattern: ^(?:/[^\x00-\x1f\x7f]*)?$
              maxLength: 4096
            login_shell:
              type: boolean
            timeout_seconds:
              type: integer
              minimum: 1
              maximum: 86400
          required:
          - id
          - command_hash
          - user
          - working_directory
          - shell
          - login_shell
          - timeout_seconds
          additionalProperties: false
        container:
          type: object
          properties:
            project: {type: string, enum: [orbit-instances, orbit-instances-nested]}
            name: {type: string, pattern: '^instance-[1-9][0-9]*$'}
          required: [project, name]
          additionalProperties: false
        ssh_execution:
          type: object
      required:
      - schedule
      - ssh_execution
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        command:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^schedule-(?:run-operation-[1-9][0-9]*|command-[0-9a-f-]{36})$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - command
      additionalProperties: false
  required:
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: run
  labels:
    role: swamp
  steps:
  - name: Run the command
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("schedule-run-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: {name: '${{ ("schedule-run-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs:
        hosts: 'name:target'
        # The Node's existing privileged systemd-run owns the lifetime and journal. The optional Incus path is the same
        # container boundary used by Process control; no helper or privileged socket is exposed inside the container.
        argv: '${{ ["/usr/bin/sudo", "-n", "--", "/usr/bin/systemd-run", "--quiet", "--wait", "--pipe", "--collect"] + ("container" in inputs.intent ? [] : ["--uid=" + inputs.intent.schedule.user]) + ["-p", "WorkingDirectory=" + ("container" in inputs.intent ? "/" : (inputs.intent.schedule.working_directory == "" ? "~" : inputs.intent.schedule.working_directory)), "-p", "RuntimeMaxSec=" + string(inputs.intent.schedule.timeout_seconds), "-p", "TimeoutStopSec=5", "/usr/bin/systemd-cat", "--identifier=orbit-schedule-" + inputs.intent.schedule.id] + ("container" in inputs.intent ? ["/usr/bin/incus", "exec", "--project", inputs.intent.container.project, inputs.intent.container.name, "--", "/usr/bin/systemd-run", "--quiet", "--wait", "--pipe", "--collect", "--uid=" + inputs.intent.schedule.user, "-p", "WorkingDirectory=" + inputs.intent.schedule.working_directory, "-p", "RuntimeMaxSec=" + string(inputs.intent.schedule.timeout_seconds), "-p", "TimeoutStopSec=5"] : []) + ["/bin/sh", "-c", "exec \"${1:-$SHELL}\" ${2:+--login} -s", "sh", inputs.intent.schedule.shell, inputs.intent.schedule.login_shell ? "1" : ""] }}'
        stdin: '${{ vault.get(inputs.execution_secrets.command.vault, inputs.execution_secrets.command.key) }}'
        timeoutSec: '${{ inputs.intent.schedule.timeout_seconds + 10 }}'
        captureOutput: false
