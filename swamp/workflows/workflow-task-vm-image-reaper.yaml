id: 39da727f-537c-4ff8-8955-ae713f91b20d
name: task-vm-image-reaper
description: Every thirty minutes remove image builders older than two hours that no active build on their host references, with pinned official SSH from 209; the Gateway publishes the hosts as inputs.
concurrency: 1
queueTimeout: 30
vaults: []
trigger:
  # The Gateway publishes this cadence with the task VM hosts as inputs (ImageReaper::Schedule).
  schedule: '0 */30 * * * *'
inputs:
  type: object
  required: [revision, hosts]
  additionalProperties: false
  properties:
    revision: {type: integer, minimum: 1}
    hosts: {type: array, items: {type: object}}
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: inventory
    steps:
      # A host whose list fails is reported unlisted by pick; other hosts continue.
      - name: list
        labels: {role: swamp}
        forEach:
          item: host
          in: '${{ inputs.hosts }}'
        allowFailure: true
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("image-ssh-" + string(self.host.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("image-ssh-" + string(self.host.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ self.host.user }}'
              port: '${{ self.host.port }}'
              identityFile: '${{ self.host.identity_file }}'
            hosts:
              - name: target
                address: '${{ self.host.host }}'
                transport:
                  hostKeys: '${{ self.host.host_keys }}'
          inputs:
            hosts: name:target
            timeoutSec: 150
            argv: [/usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ self.host.project }}', list, --format, json]
  - name: choose
    dependsOn: [{job: inventory, condition: {type: always}}]
    steps:
      - name: pick
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@nckrtl/task-vm-image-reaper'
          behaviorName: task-vm-image-reaper
          methodName: pick
          inputs:
            hosts: '${{ inputs.hosts }}'
            steps: '${{ steps }}'
  - name: delete
    dependsOn: [{job: choose, condition: {type: succeeded}}]
    steps:
      # One host's builders share its SSH behavior, so they run one at a time; a failed delete leaves the others.
      - name: delete
        labels: {role: swamp}
        writes: true
        forEach:
          item: vm
          in: '${{ steps.pick.outputs.deletions }}'
        concurrency: 1
        allowFailure: true
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("image-ssh-" + string(self.vm.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("image-ssh-" + string(self.vm.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ self.vm.user }}'
              port: '${{ self.vm.port }}'
              identityFile: '${{ self.vm.identity_file }}'
            hosts:
              - name: target
                address: '${{ self.vm.host }}'
                transport:
                  hostKeys: '${{ self.vm.host_keys }}'
          inputs:
            hosts: name:target
            timeoutSec: 180
            argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ self.vm.project }}', delete, --force, --, '${{ self.vm.vm }}']
  - name: storage
    dependsOn: [{job: delete, condition: {type: always}}, {job: choose, condition: {type: succeeded}}]
    steps:
      - name: volumes
        labels: {role: swamp}
        forEach:
          item: host
          in: '${{ steps.pick.outputs.hosts }}'
        allowFailure: true
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("image-ssh-" + string(self.host.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("image-ssh-" + string(self.host.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ self.host.user }}'
              port: '${{ self.host.port }}'
              identityFile: '${{ self.host.identity_file }}'
            hosts:
              - name: target
                address: '${{ self.host.host }}'
                transport:
                  hostKeys: '${{ self.host.host_keys }}'
          inputs:
            hosts: name:target
            timeoutSec: 150
            argv: [/usr/bin/sudo, -n, --, /usr/bin/incus, --project, '${{ self.host.project }}', storage, volume, list, '${{ self.host.pool }}', --format, json]
  - name: result
    dependsOn: [{job: storage, condition: {type: always}}, {job: choose, condition: {type: succeeded}}]
    steps:
      - name: check
        labels: {role: swamp}
        task:
          type: behavior
          behaviorType: '@nckrtl/task-vm-image-reaper'
          behaviorName: task-vm-image-reaper
          methodName: check
          inputs:
            pick: '${{ steps.pick.outputs }}'
            steps: '${{ steps }}'
