id: af65d004-1a56-4b0b-a75e-56b457e26918
name: operation-task-vm-cache-fill
description: Fill one task VM host's package cache from 209, one pinned official SSH call of the agent per batch; a native assert checks every batch reply.
version: 1
queueTimeout: 30
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.fill_package_cache]}
    intent:
      type: object
      properties:
        ssh_execution: {type: object}
        # Each batch's public agent request up to its github_token member; the step appends that member from the vault, then request_end.
        # The batch numbers name the fill steps (Fill the package cache-0, -1) that the Gateway reads.
        batches:
          type: array
          items: {type: integer, minimum: 0, maximum: 1}
          minItems: 1
          maxItems: 2
        requests:
          type: array
          items: {type: string}
          minItems: 1
          maxItems: 2
        request_end: {type: string, const: "}}\n"}
        conflicts: {type: object}
      required: [ssh_execution, batches, requests, request_end, conflicts]
    # Only the request's github_token member (the token or null): vault values stay small, because serve redacts each one.
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-cache-fill-github-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [github_token]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: fill
  steps:
  - name: Fill the package cache
    labels: {role: swamp}
    writes: true
    forEach: {item: batch, in: '${{ inputs.intent.batches }}'}
    # The agent holds one lock on the cache, so batches run one after another.
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "package-cache-fill-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "package-cache-fill-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: [timeout, '1530', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, package-cache.host]
        timeoutSec: 1560
        stdin: ${{ inputs.intent.requests[self.batch] + vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) + inputs.intent.request_end }}
  - name: Check every archive
    labels: {role: swamp}
    dependsOn:
    - step: Fill the package cache
      condition: {type: succeeded}
    task:
      type: assert
      # The pinned agent prints one compact line in field order: {"ok":true,"data":{"hashes":{…},"failures":{…}}}.
      expr: 'size(inputs.intent.conflicts) == 0 && size(steps.filter(k, k.startsWith("Fill the package cache-"))) == size(inputs.intent.batches)
        && steps.filter(k, k.startsWith("Fill the package cache-")).all(k, steps[k].outputs.stdout.startsWith("{\"ok\":true,") && steps[k].outputs.stdout.contains("\"failures\":{}}}"))'
      severity: high
      message: task_vm.package_cache_failed
