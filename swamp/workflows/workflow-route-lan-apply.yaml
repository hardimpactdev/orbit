id: b14d2aa1-9248-43ef-a2f1-233044ec7cb6
name: route-lan-apply
description: One destination-scoped UFW transaction under the canonical tool host
  lock.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: lan
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: &id001
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: ${{ "route-assets-" + run.id }}
      methodName: lan
      inputs:
        intent: ${{ inputs.intent }}
  - name: write
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-write-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          sudo --preserve-env=ORBIT_ROUTE_INPUT /usr/bin/python3 -B "${{ steps.assets.outputs.script
          }}"'
        env:
          ORBIT_ROUTE_INPUT: ${{ steps.assets.outputs.input_json }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
