id: 4b0f7f8a-2f6c-4f53-9a51-3c2f0f6c1a04
name: task-publication-push
description: Push the checked commit to the task branch without force, with the admitted token; map the reply to its outcome.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
    scratch:
      type: string
    prepared:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - scratch
  - prepared
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: push
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publication-push" }}
      methodName: execute
      inputs:
        run: 'git -C "$ORBIT_REPOSITORY" push --porcelain -- "$ORBIT_REMOTE" "$ORBIT_REFSPEC"

          '
        ignoreExitCode: true
        timeout: 60000
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_ALLOW_PROTOCOL: https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          GIT_CONFIG_KEY_2: core.hooksPath
          GIT_CONFIG_VALUE_2: /dev/null
          GIT_CONFIG_KEY_3: http.followRedirects
          GIT_CONFIG_VALUE_3: 'false'
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key)
            }}
          GH_CONFIG_DIR: ${{ inputs.scratch + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_REPOSITORY: ${{ inputs.scratch + ".git" }}
          ORBIT_REMOTE: ${{ inputs.prepared.remote }}
          ORBIT_REFSPEC: ${{ inputs.prepared.refspec }}
  - name: push_result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publication-push_result" }}
      methodName: pushed
      inputs:
        input: ${{ inputs.intent }}
        steps: ${{ steps }}
    dependsOn:
    - step: push
      condition:
        type: succeeded
queueTimeout: 60
