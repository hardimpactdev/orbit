id: 774d24db-4bb9-4a5c-811d-ef19d16a3888
name: operation-tools
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "2,32 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-tools-discovery
          methodName: discover
          inputs:
            family: operation-tools
            kinds: ["tool.install", "tool.update", "tool.remove", "tool.adopt", "tool.manager_converge"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-tools"
          behaviorName: '${{ "operation-tools-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: "${{ self.work.kind }}"
            worker: '${{ self.work.worker }}'
