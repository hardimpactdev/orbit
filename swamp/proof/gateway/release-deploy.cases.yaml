command: gateway:release:deploy
chart: gateway/release-deploy
target: gateway
sources: [gateway]
baseline: [operations]
uncovered:
  main: "Release two commits from the same preparation checkout with active Operations. Observe at most three containers. Verify private readiness, public traffic and new jobs on the selected release, and sleeping preparation."
  retry: "Interrupt preparation before sealing. Retry and verify that partial web assets cannot enter the release."
  recovery: "Hold a request and a Horizon job across cutover. Keep the outgoing container until both finish. Fail private readiness before switch and public verification after switch. Verify the selected SHA and repair forward."
cases:
  - id: invalid-commit
    batch: fresh-fleet
    covers: []
    summary: Reject an incomplete commit locally before admitting a release.
    act:
      - cli:
          run: [gateway:release:deploy, invalid]
          forms: [json, human]
          expect: {exit: 1, code: gateway.release_commit_invalid, request: none}
    expect:
      - unchanged: {since: act, what: [operations]}
