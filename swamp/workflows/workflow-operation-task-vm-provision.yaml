      severity: high
- name: projection
  dependsOn:
  - job: admission
    condition:
      type: always
  - job: provider
    condition:
      type: always
  - job: bootstrap
    condition:
      type: always
  - job: prepare-network
    condition:
      type: always
  - job: publish-hub
    condition:
      type: always
  - job: publish-network
    condition:
      type: always
  - job: issue-worker
    condition:
      type: always
  - job: configure-worker
    condition:
      type: always
  - job: worker-ready
    condition:
      type: always
  - job: issue-model
    condition:
      type: always
  - job: prepare-runtime
    condition:
      type: always
  - job: confirm-runtime
    condition:
      type: always
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: project
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: '${{ has(steps.admit) && has(steps.admit.outputs) ? steps.admit.outputs
          : null }}'
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) + (has(steps.prepare_network) && has(steps.prepare_network.outputs)
          ? [steps.prepare_network.outputs] : []) + (has(steps.publish_hub) && has(steps.publish_hub.outputs)
          && steps.publish_hub.outputs.status == "succeeded" ? [{"stage": "publish-hub",
          "ok": true, "output": {"hub_configured": true}, "error_code": null}] : [])
          + (has(steps.publish_network) && has(steps.publish_network.outputs) ? [steps.publish_network.outputs]
          : []) + (has(steps.issue_worker) && has(steps.issue_worker.outputs) ? [steps.issue_worker.outputs]
          : []) + (has(steps.configure_worker) && has(steps.configure_worker.outputs)
          ? [steps.configure_worker.outputs] : []) + (has(steps.worker_ready) && has(steps.worker_ready.outputs)
          ? [steps.worker_ready.outputs] : []) + (has(steps.issue_model) && has(steps.issue_model.outputs)
          ? [{"stage": "issue-model", "ok": true, "output": {"issued": steps.issue_model.outputs.issued},
          "error_code": null}] : []) + (has(steps.prepare_runtime) && has(steps.prepare_runtime.outputs)
          ? [steps.prepare_runtime.outputs] : []) + (has(steps.confirm_runtime) &&
          has(steps.confirm_runtime.outputs) ? [steps.confirm_runtime.outputs] : [])
          }}'
- name: failure
  dependsOn:
  - job: projection
    condition:
      type: failed
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: settle-failure
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: task-vm-provision-failure
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
