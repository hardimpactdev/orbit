name: Swamp shape
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      changed-only:
        type: boolean
        default: false
      base-ref:
        type: string
        default: ""
    secrets:
      SWAMP_API_KEY:
        required: true
      SWAMP_SIGNIN_TOKEN:
        required: true
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: swamp-shape-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shape:
    # CI calls this workflow for queue batches; suppress the duplicate direct trigger.
    if: github.event_name != 'merge_group' || github.workflow == 'CI'
    name: Swamp shape gate
    runs-on: [self-hosted, hardimpact]
    # The gate takes a few minutes; a hung step fails here instead of holding main for hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'swamp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.changed-only
        id: scope
        with:
          job: swamp
          swamp-base: 'true'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        with:
          deno-version: v2.9.8
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        with:
          python-version: "3.13"
      - name: Install pinned script linters
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/shape-tools"
          "$RUNNER_TEMP/shape-tools/bin/pip" install --disable-pip-version-check ruff==0.17.0 shellcheck-py==0.11.0.1 shfmt-py==4.2.0 ansible-lint==26.10.1 -r ansible/requirements.txt
          echo "$RUNNER_TEMP/shape-tools/bin" >> "$GITHUB_PATH"
      - name: Check Ansible phases
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"
          ansible-lint ansible/operation-node-role-add.yml
          python3 -I tests/ansible_inputs_test.py
          ruff check ansible/build_vars.py tests/ansible_inputs_test.py
      - name: Check shape regression fixtures
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        run: |
          deno test --allow-env --allow-read --allow-run --allow-write bin/check-swamp-shape_test.ts
          deno test --allow-read --allow-run bin/lint-behavior-names_test.ts
          deno test -A bin/swamp-liveness_test.ts
          deno test -A bin/source_test.ts
          deno test -A --ignore=tests/repository_analysis_producer_test.ts,tests/metrics_exporter_firewall_test.ts,tests/native_host_method_test.ts tests/
          deno test -A extensions/behaviors/automatic-deploy extensions/behaviors/composer-maintenance extensions/behaviors/js-maintenance extensions/behaviors/projects
          deno test --allow-env --allow-read --allow-run --allow-write bin/swamp-shape-python_test.ts
          deno test --allow-env --allow-read --allow-run --allow-write bin/validate-swamp-workflows_test.ts
          deno test --allow-env --allow-read --allow-run --allow-write bin/check-swamp-base-policy_test.ts
      - name: Reject new violations with current and base rules
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        env:
          SHAPE_BASE: ${{ steps.scope.outputs.swamp-base-ref || inputs.base-ref || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$SHAPE_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          deno run --allow-env --allow-read --allow-write="$RUNNER_TEMP/shape.json" --allow-run bin/check-swamp-shape.ts --base "$base" --report "$RUNNER_TEMP/shape.json"
          python3 bin/check-swamp-base-policy.py --base "$base"
          deno run --allow-read --allow-run bin/lint-behavior-names.ts --base "$base"
      - name: Check frozen agent command references
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        run: '"$GITHUB_WORKSPACE/bin/check-frozen-agent-commands" --root "$GITHUB_WORKSPACE"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && (!inputs.changed-only || steps.scope.outputs.selected == 'true') }}
        with:
          name: swamp-shape-metrics
          path: ${{ runner.temp }}/shape.json

  validate:
    # CI calls this workflow for queue batches; suppress the duplicate direct trigger.
    if: github.event_name != 'merge_group' || github.workflow == 'CI'
    name: Swamp workflow validate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'swamp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.changed-only
        id: scope
        with:
          job: swamp
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        with:
          deno-version: v2.9.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        with:
          path: ~/.cache/orbit-shape-runtime
          key: shape-runtime-${{ runner.os }}-${{ hashFiles('swamp/extensions/behaviors/node-worker/config.ts') }}
      - name: Native workflow validation with dedicated registry-read credentials
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        env:
          SWAMP_API_KEY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && secrets.SWAMP_API_KEY || '' }}
          SWAMP_SIGNIN_TOKEN: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && secrets.SWAMP_SIGNIN_TOKEN || '' }}
        run: python3 bin/validate-swamp-workflows.py --cache "$HOME/.cache/orbit-shape-runtime" --report "$RUNNER_TEMP/workflow-validation.json"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        with:
          php-version: "8.5"
          coverage: none
      - name: Validate release grants with pinned serve check-config
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        env:
          SWAMP_API_KEY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && secrets.SWAMP_API_KEY || '' }}
          SWAMP_SIGNIN_TOKEN: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && secrets.SWAMP_SIGNIN_TOKEN || '' }}
        run: |
          python3 bin/check-grant-patterns.py --cache "$HOME/.cache/orbit-shape-runtime" --report "$RUNNER_TEMP/grant-validation.json"
      - name: Check placement on every step
        if: ${{ always() && (!inputs.changed-only || steps.scope.outputs.selected == 'true') }}
        run: deno run --allow-read bin/lint-workflow-placement.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && (!inputs.changed-only || steps.scope.outputs.selected == 'true') }}
        with:
          name: swamp-workflow-validation
          path: |
            ${{ runner.temp }}/workflow-validation.json
            ${{ runner.temp }}/grant-validation.json

  tests:
    # CI calls this workflow for queue batches; suppress the duplicate direct trigger.
    if: github.event_name != 'merge_group' || github.workflow == 'CI'
    name: Swamp Deno tests
    runs-on: ${{ vars.ORBIT_SABRE_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","orbit-shard"]') || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'swamp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-scope
        if: inputs.changed-only
        id: scope
        with:
          job: swamp
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: ${{ runner.environment != 'self-hosted' && (!inputs.changed-only || steps.scope.outputs.selected == 'true') }}
        with:
          deno-version: v2.9.8
          cache: true
      - uses: ./.github/actions/php
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        with:
          coverage: none
      - name: Verify disposable effect prerequisites
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        run: |
          # shellcheck disable=SC2016
          php -r 'foreach (["mysql", "pgsql", "sqlite"] as $driver) { if (!in_array($driver, PDO::getAvailableDrivers(), true)) { exit(1); } }'
      - name: Run Operations unit tests
        if: ${{ !inputs.changed-only || steps.scope.outputs.selected == 'true' }}
        env:
          DENO_JOBS: "4"
        run: deno test --parallel -A extensions/behaviors/operations
