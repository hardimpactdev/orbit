id: 662587a5-f394-492c-8e7f-7eccbb124066
name: operation-metrics-disable
description: metrics.disable from captured intent. Withdraw metrics.orbit first, then the containers, the fleet exporters, the Grafana rules and the configuration; the volumes go only with purge.
vaults: [default, orbit-control-inputs]
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [metrics.disable]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: {type: object, properties: {vault: {type: string, enum: [orbit-control-inputs]}, key: {type: string, pattern: '^metrics-role-operation-[1-9][0-9]*$'}}, required: [vault, key], additionalProperties: false}}
  required: [operation_id, node_id, kind, intent, execution_secrets]
# The end check, Check it is gone, proves no Metrics container and no configuration remain on the Node.
jobs:
- name: role
  steps:
  - name: Withdraw metrics.orbit
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: metrics-withdrawal
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}'}
  - name: Remove the containers
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Withdraw metrics.orbit', condition: {type: succeeded}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      type: workflow
      workflowIdOrName: metrics-containers-remove
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}'}
  - name: Remove the fleet exporters
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Remove the containers', condition: {type: succeeded}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    # One member at a time: members share Caddy and Swamp worker capacity.
    concurrency: 1
    forEach: {item: exporter, in: '${{ inputs.intent.fleet }}'}
    task:
      type: workflow
      workflowIdOrName: metrics-exporter-node
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ self.exporter.exporter_node_id }}', kind: '${{ self.exporter.enabled ? "metrics.exporter_enable" : "metrics.exporter_disable" }}', intent: '${{ self.exporter }}'}
  - name: Remove the fleet allows
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Remove the fleet exporters', condition: {type: always}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    # One member at a time: members share Caddy and Swamp worker capacity.
    concurrency: 1
    forEach: {item: exporter, in: '${{ inputs.intent.fleet }}'}
    task:
      type: workflow
      workflowIdOrName: metrics-exporter-allows
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ self.exporter.exporter_node_id }}', kind: '${{ self.exporter.enabled ? "metrics.exporter_enable" : "metrics.exporter_disable" }}', intent: '${{ self.exporter }}'}
  - name: Remove the Grafana rules
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Remove the containers', condition: {type: succeeded}}, {step: 'Remove the fleet exporters', condition: {type: always}}, {step: 'Remove the fleet allows', condition: {type: always}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/firewall'
      behaviorName: '${{ ("metrics-port-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        port: '${{ inputs.intent.firewall.port }}'
        source: '${{ inputs.intent.firewall.source }}'
        action: allow
        ensure: '${{ inputs.intent.firewall.ensure }}'
  - name: Remove the configuration
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Remove the Grafana rules', condition: {type: succeeded}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("metrics-remove-config-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        path: /etc/orbit/metrics
        ensure: absent
  - name: Delete the volumes
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Remove the configuration', condition: {type: succeeded}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    forEach: {item: volume, in: '${{ inputs.intent.purge_volumes }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-purge-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs: &ssh
        name: '${{ ("metrics-disable-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]
      inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/docker, volume, rm, '${{ self.volume }}']}
  - name: Check it is gone
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the configuration', condition: {type: succeeded}}, {step: 'Delete the volumes', condition: {type: always}}]
    guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-gone-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: *ssh
      inputs: {hosts: 'name:target', sudo: true, argv: [sh, -c, '[ -z "$(docker ps --all --quiet --filter name=^orbit-metrics-)" ] && [ ! -e /etc/orbit/metrics ]']}
