id: 3f4a442f-a80b-4d66-9ef8-5b1f4c462f7f
name: operation-tool-write-209
description: Native Tool installation and update through cfgmgmt and bounded SSH argv.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [tool.install, tool.update]}
    intent: {type: object}
    ssh: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, ssh]
  additionalProperties: false
jobs:
- name: tools
  steps:
  - name: Prepare package commands
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tw-argv-" + string(inputs.node_id) }}', methodName: assets, inputs: {input: '${{ inputs.intent }}'}}
  - name: Fetch the signing key
    labels: {role: swamp}
    dependsOn: [{step: Prepare package commands, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: command/shell, behaviorName: '${{ "tool-key-fetch-the-signing-key-" + string(inputs.node_id) }}', methodName: execute, inputs: {run: timeout 60 curl --fail --silent --show-error --location --proto =https --proto-redir =https --max-time 60 --create-dirs --output "$ORBIT_KEY_FILE.asc" -- "$ORBIT_KEY_URL", timeout: 65000, env: {ORBIT_KEY_FILE: '${{ "/tmp/orbit-tool-keys/" + run.id }}', ORBIT_KEY_URL: '${{ steps["Prepare package commands"].outputs.repository.signing_key.url }}'}}}
  - name: Read the key fingerprint
    labels: {role: swamp}
    dependsOn: [{step: Fetch the signing key, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    task: {type: behavior, behaviorType: command/shell, behaviorName: '${{ "tool-key-read-the-key-fingerprint-" + string(inputs.node_id) }}', methodName: execute, inputs: {run: timeout 60 gpg --batch --with-colons --show-keys "$ORBIT_KEY_FILE.asc", timeout: 65000, env: {ORBIT_KEY_FILE: '${{ "/tmp/orbit-tool-keys/" + run.id }}'}}}
  - name: Assert the key fingerprint
    labels: {role: swamp}
    dependsOn: [{step: Read the key fingerprint, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    task: {type: assert, expr: 'steps["Read the key fingerprint"].outputs.stdout.split("\n").filter(row, row.startsWith("pub:")).size() == 1 && steps["Read the key fingerprint"].outputs.stdout.split("\n").filter(row, row.startsWith("fpr:"))[0].split(":")[9] == steps["Prepare package commands"].outputs.repository.signing_key.fingerprint', severity: high, message: tool.repository_key_mismatch}
  - name: Dearmor the signing key
    labels: {role: swamp}
    dependsOn: [{step: Assert the key fingerprint, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: command/shell, behaviorName: '${{ "tool-key-dearmor-the-signing-key-" + string(inputs.node_id) }}', methodName: execute, inputs: {run: timeout 60 gpg --batch --yes --dearmor --output "$ORBIT_KEY_FILE.gpg" "$ORBIT_KEY_FILE.asc", timeout: 65000, env: {ORBIT_KEY_FILE: '${{ "/tmp/orbit-tool-keys/" + run.id }}'}}}
  - name: Prepare apt keyrings
    labels: {role: swamp}
    dependsOn: [{step: Assert the key fingerprint, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/directory', behaviorName: '${{ "prepare-apt-keyrings-" + string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', become: true, path: /etc/apt/keyrings, mode: '0755', ensure: present}, inputs: {}}
  - name: Set up the Tool Manager
    labels: {role: swamp}
    dependsOn: [{step: Prepare package commands, condition: {type: succeeded}}, {step: Assert the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.kind == "tool.update" || !("setup" in inputs.intent) || inputs.intent.setup == null || ("manager_ready" in inputs.intent && inputs.intent.manager_ready) }}
    task: {type: workflow, workflowIdOrName: operation-tool-manager-setup, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', intent: '${{ inputs.intent }}', ssh: '${{ inputs.ssh }}', report: false}}
  - name: Publish the signing key
    labels: {role: swamp}
    dependsOn: [{step: Dearmor the signing key, condition: {type: succeeded}}, {step: Prepare apt keyrings, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/copy_file', behaviorName: '${{ "publish-the-signing-key-" + string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', become: true, path: '${{ "/etc/apt/keyrings/orbit-" + steps["Prepare package commands"].outputs.repository.name + ".gpg" }}', mode: '0644', ensure: present, source: '${{ "/tmp/orbit-tool-keys/" + run.id + ".gpg" }}', owner: root, group: root}, inputs: {}}
  - name: Pin repository packages
    labels: {role: swamp}
    dependsOn: [{step: Publish the signing key, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "pin-repository-packages-" + string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', become: true, path: '${{ "/etc/apt/preferences.d/orbit-" + steps["Prepare package commands"].outputs.repository.name + ".pref" }}', content: '${{ steps["Prepare package commands"].outputs.repository.uris.map(uri, uri.split("/")[2]).map(host, "Package: " + steps["Prepare package commands"].outputs.repository_packages.join(" ") + "\nPin: origin \"" + host + "\"\nPin-Priority: 990\n\nPackage: *\nPin: origin \"" + host + "\"\nPin-Priority: 1\n").join("\n") }}', mode: '0644', owner: root, ensure: present}, inputs: {}}
  - name: Write the apt source
    labels: {role: swamp}
    dependsOn: [{step: Pin repository packages, condition: {type: succeeded}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "add-the-signed-apt-source-" + string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', become: true, ensure: present, path: '${{ "/etc/apt/sources.list.d/orbit-" + steps["Prepare package commands"].outputs.repository.name + ".sources" }}', content: '${{ "Types: deb\nURIs: " + steps["Prepare package commands"].outputs.repository.uris.join(" ") + "\nSuites: " + steps["Prepare package commands"].outputs.repository.suites.join(" ") + "\nComponents: " + steps["Prepare package commands"].outputs.repository.components.join(" ") + "\nArchitectures: " + ("architectures" in steps["Prepare package commands"].outputs.repository ? steps["Prepare package commands"].outputs.repository.architectures : ["amd64"]).join(" ") + "\nSigned-By: /etc/apt/keyrings/orbit-" + steps["Prepare package commands"].outputs.repository.name + ".gpg\n" }}', owner: root, group: root, mode: '0644'}, inputs: {}}
  - name: Refresh apt source
    labels: {role: swamp}
    dependsOn: [{step: Dearmor the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Prepare apt keyrings, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Publish the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Assert the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Write the apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "refresh-apt-source-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "refresh-apt-source-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.refresh }}', sudo: true}}
    guard: ${{ inputs.intent.manager != "apt" || inputs.intent.repository == null }}
    writes: true
  - name: Remove the staged key
    labels: {role: swamp}
    dependsOn: [{step: Fetch the signing key, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}, {step: Read the key fingerprint, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}, {step: Assert the key fingerprint, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}, {step: Dearmor the signing key, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}, {step: Publish the signing key, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}]
    guard: ${{ !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}
    writes: true
    task: {type: behavior, behaviorType: command/shell, behaviorName: '${{ "tool-key-remove-the-staged-key-" + string(inputs.node_id) }}', methodName: execute, inputs: {run: timeout 60 rm --force -- "$ORBIT_KEY_FILE.asc" "$ORBIT_KEY_FILE.gpg", timeout: 65000, env: {ORBIT_KEY_FILE: '${{ "/tmp/orbit-tool-keys/" + run.id }}'}}}
    allowFailure: true
  - name: Read manager version
    labels: {role: swamp}
    dependsOn: [{step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Write the apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Prepare apt keyrings, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Fetch the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Read the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Assert the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Publish the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "read-manager-version-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "read-manager-version-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.version }}'}}
  - name: Read installed package
    labels: {role: swamp}
    dependsOn: [{step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Write the apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Prepare apt keyrings, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Fetch the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Read the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Assert the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Publish the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "read-installed-package-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "read-installed-package-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.inventory }}', okExitCodes: [0, 1]}}
  - name: Read macOS version
    labels: {role: swamp}
    dependsOn: [{step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Write the apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Prepare apt keyrings, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Fetch the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Read the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Assert the key fingerprint, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Publish the signing key, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.platform != "macos" || !inputs.intent.manager.startsWith("brew") }}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "read-macos-version-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "read-macos-version-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: [timeout, '60', /usr/bin/sw_vers, -productVersion]}}
  - name: Check the candidate
    labels: {role: swamp}
    dependsOn: [{step: Read manager version, condition: {type: succeeded}}, {step: Read installed package, condition: {type: succeeded}}, {step: Read macOS version, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "check-the-candidate-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "check-the-candidate-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.candidate }}'}}
  - name: Choose package action
    labels: {role: swamp}
    dependsOn: [{step: Check the candidate, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tw-decision-" + string(inputs.node_id) }}', methodName: decide, inputs: {input: '${{ inputs.intent }}', version: '${{ steps["Read manager version"] }}', query: '${{ steps["Read installed package"] }}', os: '${{ "Read macOS version" in steps ? steps["Read macOS version"] : null }}', check: '${{ "Check the candidate" in steps ? steps["Check the candidate"] : null }}'}}
    guard: ${{ !("Read manager version" in steps) || !("Read installed package" in steps) }}
  - name: Apply the package
    labels: {role: swamp}
    dependsOn: [{step: Choose package action, condition: {type: succeeded}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("tool-package-apply-" + inputs.intent.manager + "-" + string(inputs.node_id)).split(".").join("-") }}', methodName: exec, inputs: {hosts: 'name:target', timeoutSec: 905, argv: '${{ inputs.intent.manager == "apt" ? ["timeout","900","/usr/bin/env","LC_ALL=C","DEBIAN_FRONTEND=noninteractive","/usr/bin/apt-get","-o","DPkg::Lock::Timeout=300","install","--yes","--no-install-recommends","--no-remove","--",inputs.intent.package + "=" + steps["Choose package action"].outputs.version] : ["timeout","900"] + steps["Prepare package commands"].outputs.write }}', sudo: '${{ inputs.intent.manager == "apt" }}'}, globalArgs: {name: '${{ ("tool-package-apply-" + inputs.intent.manager + "-" + string(inputs.node_id)).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}}
  - name: Check apt package
    labels: {role: swamp}
    dependsOn: [{step: Apply the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate || inputs.intent.manager != "apt" }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/apt', behaviorName: '${{ "tool-apt-end-" + string(inputs.node_id) }}', methodName: check, inputs: {}, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', packages: ['${{ inputs.intent.package }}'], ensure: present}}
  - name: Check the package
    labels: {role: swamp}
    dependsOn: [{step: Apply the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate || inputs.intent.manager == "apt" }}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "tool-command-end-" + string(inputs.node_id) }}', methodName: exec, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout","60"] + steps["Prepare package commands"].outputs.inventory }}', okExitCodes: [0, 1]}, globalArgs: {name: '${{ "tool-command-end-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}}
  - name: Decode package state
    labels: {role: swamp}
    dependsOn: [{step: Check apt package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate }}
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tool-package-observation-" + string(inputs.node_id) }}', methodName: observe, inputs: {input: '${{ inputs.intent }}', after: '${{ !((inputs.intent.manager == "apt" ? "Check apt package" : "Check the package") in steps) || steps[(inputs.intent.manager == "apt" ? "Check apt package" : "Check the package")].status != "succeeded" ? null : inputs.intent.manager == "apt" ? data.latest("tool-apt-end-" + string(inputs.node_id), inputs.ssh.target.host).attributes : steps["Check the package"].outputs }}'}}
  - name: Assert package state
    labels: {role: swamp}
    dependsOn: [{step: Choose package action, condition: {type: always}}, {step: Check apt package, condition: {type: always}}, {step: Check the package, condition: {type: always}}, {step: Decode package state, condition: {type: always}}]
    task: {type: assert, expr: '"Choose package action" in steps && steps["Choose package action"].status == "succeeded" && steps["Choose package action"].outputs.ready && (!steps["Choose package action"].outputs.mutate || ("Decode package state" in steps && steps["Decode package state"].status == "succeeded" && steps["Decode package state"].outputs.compliant && steps["Decode package state"].outputs.present))', severity: high, message: The native package end check must match the admitted Tool intent.}
