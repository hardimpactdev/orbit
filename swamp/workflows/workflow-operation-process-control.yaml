id: fe404a82-4210-4047-b440-5f385b8e49c3
name: operation-process-control
description: 'Rule 22 Process control: official cfgmgmt, SSH argv and a native end check.'
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [process.restart]}
    intent:
      type: object
      properties:
        control:
          type: object
          properties:
            process_id:
              type: integer
              minimum: 1
            runtime:
              type: string
              enum:
              - systemd
              - docker
            name:
              type: string
              pattern: ^orbit-process-[1-9][0-9]*-[a-z0-9-]+(?:\.service)?$
            image:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._/:@-]*$
            on_demand:
              type: boolean
            directory:
              type: string
              pattern: ^/
            vite:
              default: null
          required:
          - process_id
          - runtime
          - name
          - on_demand
          - vite
          additionalProperties: false
        # A Process of an Instance container: its Incus project and container.
        container:
          type: object
        ssh_execution:
          type: object
        vite_plan:
          type: object
        caddy_publication:
          type: object
      required:
      - control
      - ssh_execution
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: runtime
  labels: {role: swamp}
  steps:
  - name: Act in the container
    # A Process of an Instance container is an `orbit` unit in it (docs/reference/development-containers.md#processes): the container
    # workflow changes and checks it through `incus exec` on the Node, and the Node steps below are skipped.
    labels: {role: swamp}
    guard: ${{ !has(inputs.intent.container) }}
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-process-container
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: '${{ {"control": {"process_id": inputs.intent.control.process_id, "name": inputs.intent.control.name}, "container": has(inputs.intent.container) ? inputs.intent.container : {}, "ssh_execution": inputs.intent.ssh_execution} }}'
        execution_secrets: {}
  - name: Publish the dev route
    labels: {role: swamp}
    dependsOn: []
    guard: ${{ has(inputs.intent.container) || steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (!has(inputs.intent.vite_plan) || inputs.kind == "process.stop") }}
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-process-vite
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          vite_plan: '${{ has(inputs.intent.vite_plan) ? inputs.intent.vite_plan : {} }}'
          caddy_publication: '${{ has(inputs.intent.caddy_publication) ? inputs.intent.caddy_publication : {} }}'
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
  - name: Set boot policy
    labels: {role: swamp}
    dependsOn: [{step: Publish the dev route, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}', enabled: '${{ (inputs.kind == "process.stop"
          ? "stopped" : "running") == "running" && !inputs.intent.control.on_demand }}'}
      inputs: {}
  - name: Restart the Process
    labels: {role: swamp}
    dependsOn: [{step: Set boot policy, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "systemd" || inputs.kind != "process.restart") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-restart-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: restart
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}'}
      inputs: {}
  - name: Check the unit
    labels: {role: swamp}
    dependsOn: [{step: Set boot policy, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Restart the Process, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || inputs.intent.control.runtime != "systemd" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: check
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}', ensure: '${{ inputs.kind == "process.stop"
          ? "stopped" : "running" }}', enabled: '${{ (inputs.kind == "process.stop" ? "stopped" : "running") == "running" && !inputs.intent.control.on_demand }}'}
      inputs: {}
  - name: Restart the container
    labels: {role: swamp}
    dependsOn: [{step: Publish the dev route, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (inputs.intent.control.runtime != "docker") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-control-the-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-control-the-container-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', docker, container, '${{ inputs.kind == "process.stop" ? "stop" : (inputs.kind == "process.start" ? "start" : "restart") }}', '${{
            inputs.intent.control.name }}'], sudo: true, timeoutSec: 25}
  - name: Check the container
    labels: {role: swamp}
    dependsOn: [{step: Restart the container, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || inputs.intent.control.runtime != "docker" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_container'
      behaviorName: ${{ "process-container-check-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: check
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, name: '${{ inputs.intent.control.name }}', image: '${{ inputs.intent.control.runtime
          == "docker" ? inputs.intent.control.image : "unused" }}', ensure: '${{ inputs.kind == "process.stop" ? "stopped" : "running" }}'}
      inputs: {}
    dataOutputOverrides: [{specName: state, vaultName: orbit-control-inputs}]
  - name: Check the listener
    labels: {role: swamp}
    dependsOn: [{step: Check the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the container, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || !has(inputs.intent.vite_plan) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-listener-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: exec
      globalArgs: {name: '${{ "process-listener-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user
            }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host
              }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {hosts: [target], argv: [timeout, '20', ss, -H, -ltn, '${{ "sport = :" + (has(inputs.intent.vite_plan) ? string(inputs.intent.vite_plan.listener.port) : "0") }}'], sudo: true,
        timeoutSec: 25}
  - name: Mark it awake
    labels: {role: swamp}
    dependsOn: [{step: Check the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the container, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: Check the listener, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ has(inputs.intent.container) || steps.exists(key, steps[key].status in ["failed", "cancelled"]) || (!has(inputs.intent.vite_plan) || inputs.kind != "process.restart" || steps["Check the listener"].outputs.stdout
      == "") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-awake-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id) }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ has(inputs.intent.vite_plan) ? inputs.intent.vite_plan.awake.marker : "/unused"
          }}', ensure: present, owner: root, group: root, mode: '0644'}
      inputs: {}
  - name: Verify the state
    labels: {role: swamp}
    dependsOn: [{step: Act in the container, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the unit, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the container, condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: Check the listener, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Mark it awake, condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}]
    task:
      type: assert
      expr: 'has(inputs.intent.container) || ((inputs.intent.control.runtime == "systemd" ? (data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.status
        == "compliant" && data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.current.loaded
        && data.latest("process-service-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id), inputs.intent.ssh_execution.target.host).attributes.current.active
        == (inputs.kind == "process.stop" ? "inactive" : "active")) : (data.latest("process-container-check-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id),
        inputs.intent.ssh_execution.target.host).attributes.status == "compliant" && data.latest("process-container-check-" + string(inputs.node_id) + "-" + string(inputs.intent.control.process_id),
        inputs.intent.ssh_execution.target.host).attributes.current.containerStatus == (inputs.kind != "process.stop" ? "running" : "exited"))) && (!has(inputs.intent.vite_plan) || steps["Check
        the listener"].outputs.stdout != ""))'
      message: The Process must have its admitted runtime and boot state.
      severity: high
    guard: ${{ steps.exists(key, steps[key].status in ["failed", "cancelled"]) }}
