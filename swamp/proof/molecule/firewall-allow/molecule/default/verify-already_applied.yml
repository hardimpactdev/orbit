---
# already-applied (already-applied, succeeded). Independent: what must not change is the rows and records of its own port.
- name: already-applied
  vars:
    allow_row: "{{ rows | select('search', c.port ~ '/tcp +ALLOW IN +' ~ src) | map('regex_replace', row_pattern, '\\1') | map('int') | list }}"
    deny_row: "{{ rows | select('search', 'proof:deny-already_applied$') | map('regex_replace', row_pattern, '\\1') | map('int') | list }}"
    matching: "{{ rules | selectattr('action', 'equalto', 'allow') | selectattr('port', 'in', [c.port | int, c.port | string]) | list }}"
    own_before: "{{ ufw_before.split('\n') | select('search', '^\\[') | map('regex_replace', '^\\[ *[0-9]+\\] *', '') | select('search', c.port | string) | list }}"
    own_after: "{{ ufw_after.split('\n') | select('search', '^\\[') | map('regex_replace', '^\\[ *[0-9]+\\] *', '') | select('search', c.port | string) | list }}"
    rec_before: "{{ records_before | selectattr('node', 'equalto', tnode) | map(attribute='rules') | first | default([]) | selectattr('port', 'in', [c.port | int, c.port | string]) | list }}"
    rec_after: "{{ records_after | selectattr('node', 'equalto', tnode) | map(attribute='rules') | first | default([]) | selectattr('port', 'in', [c.port | int, c.port | string]) | list }}"
  block:
    - name: One record, one allow line above the deny, and its own rows and record did not change
      ansible.builtin.assert:
        that:
          - matching | length == 1
          - allow_row | length == 1
          - deny_row | length > 0
          - allow_row | first < deny_row | first
          - own_before == own_after
          - rec_before == rec_after
        quiet: true
    - name: "{{ inventory_hostname }}: the checks of the case ended"
      ansible.builtin.set_fact:
        verified: true
  rescue:
    - name: "{{ inventory_hostname }}: record the failed check"
      ansible.builtin.set_fact:
        verify_failures: "{{ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.assertion | default(ansible_failed_result.msg | default('?'))) }}"
