id: db23a0cf-d815-42eb-b769-4323db8133fe
name: operation-task-vms
description: Claim and execute one task VM Operation on its placed worker.
labels: { pool: migration }
queueTimeout: 60
autoResume: true
trigger:
  schedule: "1,11,21,31,41,51 * * * * *"
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-task-vms-discovery
          methodName: discover
          inputs:
            family: operation-task-vms
            kinds: ["task_vm.incus_create", "task_vm.incus_start", "task_vm.incus_stop", "task_vm.incus_delete", "task_vm.model_issue", "task_vm.model_revoke", "task_vm.pi_upload", "task_vm.runtime_confirm", "task_vm.pi_install", "task_vm.configure_runtime", "task_vm.cache_initialize", "task_vm.cache_mount", "task_vm.cache_seed", "task_vm.upcloud_create", "task_vm.upcloud_start", "task_vm.upcloud_stop", "task_vm.upcloud_hard_stop", "task_vm.upcloud_delete", "task_vm.lifecycle_intent", "task_vm.prepare_enrollment", "task_vm.enroll_node", "task_vm.confirm_stopped", "task_vm.mark_destroying", "task_vm.forget_workspaces", "task_vm.destroy_records", "task_vm.stop_worker", "task_vm.guest_guest_cloud_init", "task_vm.guest_guest_fingerprint", "task_vm.guest_image_owner", "task_vm.guest_image_boot", "task_vm.guest_image_firewall", "task_vm.guest_image_check", "task_vm.guest_image_trust_ca", "task_vm.guest_image_clean", "task_vm.guest_image_recipe_marker", "task_vm.guest_image_inspect_phase", "task_vm.guest_image_start_phase", "task_vm.guest_image_restart_phase", "task_vm.guest_image_verify", "task_vm.fill_package_cache_batch", "task_vm.fill_package_cache", "task_vm.image_remove", "task_vm.image_launch", "task_vm.image_metadata", "task_vm.image_publish", "task_vm.image_seed", "task_vm.image_finish_seed", "task_vm.image_promote", "task_vm.image_prune", "task_vm.guest_install", "task_vm.guest_pi_upload", "task_vm.image_intent", "task_vm.image_phase_intent", "task_vm.image_phase_confirm", "task_vm.upcloud_image_prepare", "task_vm.upcloud_image_launch_builder", "task_vm.upcloud_image_launch_smoke", "task_vm.upcloud_image_stop", "task_vm.upcloud_image_hard_stop_builder", "task_vm.upcloud_image_hard_stop_smoke", "task_vm.upcloud_image_templatize", "task_vm.upcloud_image_delete_builder", "task_vm.upcloud_image_delete_smoke", "task_vm.upcloud_image_promote", "task_vm.upcloud_image_prune_template", "task_vm.upcloud_image_discard_template", "task_vm.upcloud_guest_guest_cloud_init", "task_vm.upcloud_guest_image_owner", "task_vm.upcloud_guest_image_boot", "task_vm.upcloud_guest_image_firewall", "task_vm.upcloud_guest_image_check", "task_vm.upcloud_guest_image_trust_ca", "task_vm.upcloud_guest_image_clean", "task_vm.upcloud_guest_image_recipe_marker", "task_vm.upcloud_guest_image_start_phase", "task_vm.upcloud_guest_image_verify", "task_vm.upcloud_guest_agent_install_guest", "task_vm.upcloud_guest_pi_upload_guest", "task_vm.sweep_delete", "task_vm.sweep_delete_upcloud", "task_vm.sweep_stop_upcloud", "task_vm.sweep_observe", "task_vm.prepare_package_cache", "task_vm.prepare_runtime", "task_vm.provision", "task_vm.enroll", "task_vm.resume", "task_vm.park", "task_vm.destroy", "task_vm.image_build", "task_vm.upcloud_image_build", "task_vm.sweep_host"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.kind }}
        forEach:
          item: kind
          in: "${{ steps.discover.outputs.work.map(item, item.kind) }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-task-vms'
          behaviorName: operation-task-vms
          methodName: execute
          inputs:
            kind: '${{ self.kind }}'
            worker: '${{ run.id + ":" + self.kind }}'
