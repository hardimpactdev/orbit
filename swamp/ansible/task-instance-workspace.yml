---
# One internal child phase on the recorded Node. The caller owns guest snapshot lifetime.
- name: Address the recorded workspace Node
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: task_workspace_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run the task Instance workspace phase
  hosts: task_workspace_node
  gather_facts: false
  become: true
  tags: [always]
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    workspace_phase: "{{ ansible_run_tags | first }}"
    workspace_result_path: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
  tasks:
    - name: Run one workspace phase
      block:
        - name: Run the workspace tasks
          ansible.builtin.import_tasks: tasks/task-instance-workspace-phase.yml
      rescue:
        # A check that failed after it collected its part table keeps the table (docs/reference/tasks.md#the-delivery-gate), whether the
        # guest or a later step failed.
        - name: Record the public workspace refusal
          ansible.builtin.copy:
            content: >-
              {{ {'error_code': ansible_failed_result.msg
                  if ansible_failed_result.msg | default('') is match('^tasks\.[a-z_]+$')
                  else 'tasks.workspace_phase_failed'}
                 | combine({'parts': guest_parts} if guest_parts is not none else {}) | to_json }}
            dest: "{{ workspace_result_path }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            # The guest prints one JSON object, as a refusal or as its result: anything else names no table.
            guest_result: >-
              {{ workspace_guest.stdout | from_json
                 if workspace_guest is defined and workspace_guest.stdout | default('') is match('^\{"')
                 else {} }}
            # The table of a guest that failed after it collected it, or of a guest that succeeded before a later transfer or
            # cleanup step failed: the check still fails, with its table.
            guest_parts: >-
              {{ guest_result.parts if guest_result.parts is defined
                 else (guest_result.check.steps.parts.outputs.stdout | from_json
                       if guest_result.check.steps.parts.outputs.stdout is defined else none) }}
        - name: Fail the workspace phase
          ansible.builtin.fail:
            msg: tasks.workspace_phase_failed
