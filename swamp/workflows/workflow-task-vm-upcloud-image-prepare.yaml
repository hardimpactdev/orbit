id: b680b081-b315-4b45-8f8d-8bdea054aa30
name: task-vm-upcloud-image-prepare
description: Ready the UpCloud builder for publication over pinned official SSH from 209, one agent call at a time; each reply is checked on 209.
version: 1
queueTimeout: 60
vaults: []
inputs:
  type: object
  properties:
    intent: {type: object}
    address: {type: string}
  required: [intent, address]
  additionalProperties: false
jobs:
- name: prepare
  writes: true
  steps:
  - name: marker
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: &guest
        name: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
        transport:
          kind: ssh
          user: orbit
          port: 22
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.address }}
          transport:
            hostKeys: ${{ [inputs.intent.host_key] }}
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.recipe-marker]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.marker }}
  - name: marker-reply
    labels: {role: swamp}
    dependsOn:
    - {step: marker, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["marker"].outputs.stdout }}
        expect: ready
  - name: verify
    labels: {role: swamp}
    dependsOn:
    - {step: marker-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.verify]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.verify }}
  - name: verify-reply
    labels: {role: swamp}
    dependsOn:
    - {step: verify, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["verify"].outputs.stdout }}
        expect: ready
  - name: boot
    labels: {role: swamp}
    dependsOn:
    - {step: verify-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.boot]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.boot }}
  - name: boot-reply
    labels: {role: swamp}
    dependsOn:
    - {step: boot, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["boot"].outputs.stdout }}
        expect: ready
  - name: firewall
    labels: {role: swamp}
    dependsOn:
    - {step: boot-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.firewall]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.firewall }}
  - name: firewall-reply
    labels: {role: swamp}
    dependsOn:
    - {step: firewall, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["firewall"].outputs.stdout }}
        expect: ready
  - name: clean
    labels: {role: swamp}
    dependsOn:
    - {step: firewall-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + inputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.clean]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.clean }}
  - name: clean-reply
    labels: {role: swamp}
    dependsOn:
    - {step: clean, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["clean"].outputs.stdout }}
        expect: ready
