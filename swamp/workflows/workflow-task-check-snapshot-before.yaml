id: 15cad0c6-2ad6-5fa8-a443-1efc2460486a
name: task-check-snapshot-before
description: Snapshot HEAD and the working tree on the run's own index.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      propertyNames:
        enum:
        - github_token
        - checks_token
        - git_authorization
      maxProperties: 3
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-check-(write|read|git)-[a-f0-9-]{36}$
        required:
        - vault
        - key
        additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  additionalProperties: false
jobs:
- name: snapshot-before
  labels:
    role: swamp
  steps:
  - name: snapshot-before-index
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-check-" + inputs.run_id + "/index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - read-tree
        - HEAD
  - name: snapshot-before-add
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-check-" + inputs.run_id + "/index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - add
        - --all
    dependsOn:
    - step: snapshot-before-index
      condition:
        type: succeeded
  - name: snapshot-before-tree
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=/tmp/orbit-task-check-" + inputs.run_id + "/index" }}
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - write-tree
    dependsOn:
    - step: snapshot-before-add
      condition:
        type: succeeded
  - name: snapshot-before-head
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
    dependsOn:
    - step: snapshot-before-tree
      condition:
        type: succeeded
  - name: before
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ ("task-check-before-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: snapshot
      inputs:
        phase: before
        steps: ${{ steps }}
    dependsOn:
    - step: snapshot-before-head
      condition:
        type: succeeded
queueTimeout: 30
