id: 855a0c69-2eab-4eea-8488-0b63b2312cb1
name: operation-route-removal
description: Withdraw admitted Routes in one native DAG before the parent deletes associations.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.withdraw
      - route.destroy
  required:
  - operation_id
  - node_id
  - kind
  additionalProperties: false
target: ${{ "orbit-node-" + string(inputs.node_id) }}
labels:
  node: ${{ string(inputs.node_id) }}
jobs:
- name: admission
  steps:
  - name: inventory
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(inputs.node_id) }}
      methodName: read
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: readiness
  steps:
  - name: ready-${{ self.member.node_id }}
    writes: false
    allowFailure: true
    forEach:
      item: member
      in: ${{ steps.inventory.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(self.member.node_id) }}
      methodName: ready
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
  dependsOn:
  - job: admission
    condition:
      type: succeeded
- name: selection
  steps:
  - name: selected
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(inputs.node_id) }}
      methodName: select
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        inventory: ${{ steps.inventory.outputs }}
        readiness: ${{ steps }}
  dependsOn:
  - job: readiness
    condition:
      type: completed
- name: dns
  steps:
  - name: dns-${{ self.member }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishDns
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.selected.outputs.dns_node_ids }}
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
  dependsOn:
  - job: selection
    condition:
      type: succeeded
- name: caddy
  steps:
  - name: caddy-${{ self.member.node_id }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member.node_id) }}
      methodName: publishCaddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
  dependsOn:
  - job: dns
    condition:
      type: succeeded
- name: php
  steps:
  - name: php-${{ self.member.node_id }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member.node_id) }}
      methodName: publishPhp
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    guard: ${{ !self.member.shared_php }}
  dependsOn:
  - job: caddy
    condition:
      type: succeeded
- name: runtime
  steps:
  - name: runtime-${{ self.member.node_id }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(self.member.node_id) }}
      methodName: prepareRuntime
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    guard: ${{ size(self.member.production_instance_ids) == 0 }}
  dependsOn:
  - job: php
    condition:
      type: succeeded
- name: environment
  steps:
  - name: environment-${{ self.member.node_id }}
    writes: true
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    guard: ${{ size(self.member.url_instance_ids) == 0 }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(self.member.node_id) }}
      methodName: synchronizeEnvironment
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
  dependsOn:
  - job: runtime
    condition:
      type: succeeded
- name: certificates
  steps:
  - name: certificates-${{ self.member.node_id }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(self.member.node_id) }}
      methodName: certificates
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
        node: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
  dependsOn:
  - job: environment
    condition:
      type: succeeded
- name: lan
  steps:
  - name: lan-${{ self.member.node_id }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(self.member.node_id) }}
      methodName: lan
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
        node: ${{ self.member }}
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
  dependsOn:
  - job: certificates
    condition:
      type: succeeded
- name: ingress-firewall
  steps:
  - name: ingress-firewall-${{ self.member.node_id }}
    writes: true
    forEach:
      item: member
      in: ${{ steps.selected.outputs.nodes }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    guard: ${{ !self.member.ingress_firewall }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(self.member.node_id) }}
      methodName: ingressFirewall
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member.node_id }}
  dependsOn:
  - job: lan
    condition:
      type: succeeded
- name: completion
  steps:
  - name: complete
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-removal'
      behaviorName: ${{ "route-removal-node-" + string(inputs.node_id) }}
      methodName: finish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        retained_on_nodes: ${{ steps.selected.outputs.retained_on_nodes }}
  dependsOn:
  - job: ingress-firewall
    condition:
      type: succeeded

- name: terminal-failure
  dependsOn:
  - job: completion
    condition:
      type: or
      conditions:
      - type: failed
      - type: skipped
  steps:
  - name: report-native-failure
    writes: true
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: route-removal-failure
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
