id: 38e1a160-f17b-4d31-b77c-36dfd78ed570
name: operation-analytics-enable-direct
queueTimeout: 30
description: Manage one Plausible site then publish captured tracking Routes through official SSH from209.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: analytics.enable
    intent:
      type: object
      properties:
        certificates: &id001
          type: array
          items:
            type: object
        router: *id001
        probes: *id001
        ingress: *id001
        dns: *id001
        retire: *id001
        cleanup: *id001
        base_url:
          type: string
        site:
          type: object
        result_json:
          type: string
      required:
      - certificates
      - router
      - probes
      - ingress
      - dns
      - retire
      - cleanup
      - base_url
      - site
      - result_json
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        plausible_credentials:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^analytics-plausible-[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - plausible_credentials
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-site'
      behaviorName: ${{ "analytics-assets-" + run.id }}
      methodName: assets
      inputs:
        base_url: ${{ inputs.intent.base_url }}
        site: ${{ inputs.intent.site }}
- name: site
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
  steps:
  - name: site
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "analytics-site-" + run.id }}
      methodName: execute
      inputs:
        run: /usr/bin/python3 -B "$ORBIT_ANALYTICS_SCRIPT"
        env:
          ORBIT_ANALYTICS_SCRIPT: ${{ steps.assets.outputs.site_script }}
          ORBIT_ANALYTICS_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_ANALYTICS_CREDENTIALS: ${{ vault.get(inputs.execution_secrets.plausible_credentials.vault, inputs.execution_secrets.plausible_credentials.key)
            }}
- name: certificates
  dependsOn:
  - job: site
    condition:
      type: succeeded
  steps:
  - name: certificates
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-certificate-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.item.leaf.node_id }}
          leaves: ${{ inputs.intent.certificates.filter(cert,cert.leaf.node_id == self.item.leaf.node_id).map(cert,cert.leaf)
            }}
          control_node_id: 209
          connection: ${{ self.item.connection }}
          host_keys: ${{ self.item.host_keys }}
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
        restoring: false
    forEach:
      item: item
      in: ${{ inputs.intent.certificates.filter(item,inputs.intent.certificates.filter(first,first.leaf.node_id == item.leaf.node_id)[0].leaf.scope
        == item.leaf.scope) }}
- name: router
  dependsOn:
  - job: certificates
    condition:
      type: succeeded
  steps:
  - name: router
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.router }}
- name: probes
  dependsOn:
  - job: router
    condition:
      type: succeeded
  steps:
  - name: probes
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: cluster-router-probe
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.probes }}
- name: ingress
  dependsOn:
  - job: probes
    condition:
      type: succeeded
  steps:
  - name: ingress
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.ingress }}
- name: dns
  dependsOn:
  - job: ingress
    condition:
      type: succeeded
  steps:
  - name: dns
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.dns }}
- name: grace
  dependsOn:
  - job: dns
    condition:
      type: succeeded
  steps:
  - name: grace
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-dns-grace
      inputs: {}
    guard: ${{ inputs.intent.dns.size() == 0 }}
- name: retire
  dependsOn:
  - job: grace
    condition:
      type: succeeded
  steps:
  - name: retire
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
    forEach:
      item: item
      in: ${{ inputs.intent.retire }}
- name: cleanup
  dependsOn:
  - job: retire
    condition:
      type: succeeded
  steps:
  - name: cleanup
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: route-certificate-remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.item }}
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
        restoring: false
    forEach:
      item: item
      in: ${{ inputs.intent.cleanup }}
- name: finish
  dependsOn:
  - job: cleanup
    condition:
      type: succeeded
  steps:
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-site'
      behaviorName: ${{ "analytics-enable-result-" + run.id }}
      methodName: result
      inputs:
        result_json: ${{ inputs.intent.result_json }}
