    writes: true
    forEach:
      item: dns
      in: ${{ steps["Bind the Node identity"].outputs.private_dns }}
    task: {type: workflow, workflowIdOrName: node-private-dns, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ self.dns.node_id }}', kind: '${{ inputs.kind }}', intent: '${{
          self.dns }}'}}
- name: phase_34
  labels:
    role: swamp
  steps:
  - name: Publish private DNS
    labels:
      role: swamp
    task: {type: workflow, workflowIdOrName: route-dns-publish, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{
          self.publication }}', execution_secrets: {}}}
    writes: true
    forEach:
      item: publication
      in: ${{ steps["Bind the Node identity"].outputs.dns }}
  dependsOn:
  - {job: dns_listener, condition: {type: succeeded}}
- name: phase_35
  labels:
    role: swamp
  steps:
  - name: Inspect the Mac tunnel
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-mac-tunnel-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {name: '${{
          "node-add-mac-tunnel-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.managed_user }}', port: 22, identityFile: '${{ inputs.intent.identity.identity_file
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.address }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target',
        argv: [ifconfig], sudo: false, timeoutSec: 30}}
    forEach:
      item: mac
      in: '${{ inputs.intent.platform == "macos" ? [0] : [] }}'
  dependsOn:
  - {job: phase_34, condition: {type: succeeded}}
- name: phase_36
  labels:
    role: swamp
  steps:
  - name: Check the Node agent
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/systemd', behaviorName: '${{ "node-add-observer-check-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: check,
      globalArgs: {nodeHost: '${{ inputs.intent.address }}', nodeUser: '${{ inputs.intent.managed_user }}', nodePort: '${{ 22 }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file
          }}', become: true, service: orbit-agent.service, ensure: running, enabled: true}, inputs: {}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_35, condition: {type: succeeded}}
- name: phase_37
  labels:
    role: swamp
  steps:
  - name: Check the agent binary
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/fetch', behaviorName: '${{ "node-add-agent-check-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: check, globalArgs: {
        nodeHost: '${{ inputs.intent.address }}', nodeUser: '${{ inputs.intent.managed_user }}', nodePort: '${{ 22 }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file }}',
        become: true, url: '${{ inputs.intent.agent.url }}', path: /usr/local/bin/orbit-agent, checksum: '${{ "sha256:"+inputs.intent.agent.sha256 }}', mode: '0755'}, inputs: {}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_36, condition: {type: succeeded}}
- name: phase_38
  labels:
    role: swamp
  steps:
  - name: Check the observer secret
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "node-add-secret-check-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: check, globalArgs: {
        nodeHost: '${{ inputs.intent.address }}', nodeUser: '${{ inputs.intent.managed_user }}', nodePort: '${{ 22 }}', nodeIdentityFile: '${{ inputs.intent.identity.identity_file }}',
        become: true, path: /etc/orbit/agent/secret, content: '${{ vault.get("orbit-control-inputs",self.credential.key) }}', owner: root, group: root, mode: '0600', ensure: present},
      inputs: {}}
    forEach:
      item: credential
      in: '${{ inputs.intent.platform == "linux" ? [inputs.execution_secrets.agent_secret] : [] }}'
  dependsOn:
  - {job: phase_37, condition: {type: succeeded}}
- name: phase_39
  labels:
    role: swamp
  steps:
  - name: Read tunnel handshakes
    labels:
      role: swamp
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "node-add-handshakes-"+string(inputs.node_id)+"-"+string(self._index) }}', methodName: exec, globalArgs: {name: '${{
          "node-add-handshakes-"+string(inputs.node_id)+"-"+string(self._index) }}', transport: {kind: ssh, user: '${{ inputs.intent.managed_user }}', port: 22, identityFile: '${{ inputs.intent.identity.identity_file
            }}'}, hosts: [{name: target, address: '${{ inputs.intent.address }}', transport: {hostKeys: '${{ [steps["Read the host key"].outputs.publicKey] }}'}}]}, inputs: {hosts: 'name:target',
        argv: [timeout, '20', wg, show, orbit, latest-handshakes], sudo: true, timeoutSec: 30}}
    forEach:
      item: linux
      in: '${{ inputs.intent.platform == "linux" ? [0] : [] }}'
  dependsOn:
  - {job: phase_38, condition: {type: succeeded}}
- name: node
  labels:
    role: swamp
  steps:
  - name: Check the Node
    labels:
      role: swamp
    task: {type: assert, expr: 'steps["Verify managed SSH"].outputs.stdout.trim() == steps["Read the platform"].outputs.stdout.trim() && (inputs.intent.platform != "linux" || (steps["Check
        the Node agent-0"].outputs.status == "compliant" && steps["Check the agent binary-0"].outputs.status == "compliant" && steps["Check the observer secret-0"].outputs.status ==
        "compliant" && (inputs.intent.network.is_hub || steps["Read tunnel handshakes-0"].outputs.stdout.split("\n").exists(line,line.split("\t").size() == 2 && line.split("\t")[1] !=
        "0")))) && (inputs.intent.platform != "macos" || steps["Inspect the Mac tunnel-0"].outputs.stdout.contains("inet "+inputs.intent.address+" "))', severity: high, message: 'Managed
        SSH, architecture and the admitted platform resources must match.'}
  dependsOn:
  - {job: phase_39, condition: {type: succeeded}}
- name: cleanup
