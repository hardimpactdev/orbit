id: 689cad3b-d90c-49fe-bf2f-5ed0974a32ec
name: operation-process-create
description: Create or update one Process through official cfgmgmt and SSH on209.
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [process.create, process.update]}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^process-((create|update)-operation-[1-9][0-9]*|instance-operation-[1-9][0-9]*-member-[1-9][0-9]*|parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: process
  labels: {role: swamp}
  steps:
  - name: 'Check the account'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: &id001 {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{
            inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: &id002 [{name: target, address: '${{
              inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]}
      inputs: {name: account, hosts: [target], argv: [/usr/bin/getent, passwd, '${{ has(inputs.intent.installation) && has(inputs.intent.installation.account_user)
            ? inputs.intent.installation.account_user : inputs.intent.ssh_execution.target.user }}'], sudo: false}
  - name: 'Resolve check assets'
    labels: {role: swamp}
    dependsOn: [{step: 'Check the account', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: ${{ "process-assets-" + run.id }}
      methodName: lifecycle
      inputs: {control: '${{ inputs.intent.control }}', account: '${{ steps["Check the account"].outputs.stdout }}', installation: '${{ inputs.intent.installation }}', marker: '${{
          has(inputs.intent.vite_plan) ? inputs.intent.vite_plan.awake.marker : "" }}'}
  - name: 'Make the asset directory'
    labels: {role: swamp}
    dependsOn: [{step: 'Resolve check assets', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: prepare, hosts: [target], argv: [/usr/bin/mkdir, -m, '0700', -p, '${{ "/tmp/orbit-process-" + run.id }}'], sudo: false}
  - name: 'Copy check assets'
    labels: {role: swamp}
    dependsOn: [{step: 'Make the asset directory', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: copy
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: scripts, direction: to, hosts: [target], src: '${{ steps["Resolve check assets"].outputs.scripts_directory }}', dst: '${{ "/tmp/orbit-process-" + run.id }}',
        recursive: true}
  - name: 'Write the intent file'
    labels: {role: swamp}
    dependsOn: [{step: 'Copy check assets', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-intent-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ "/tmp/orbit-process-" + run.id + "/intent.json" }}',
        ensure: present, content: '${{ steps["Resolve check assets"].outputs.intent_json }}', owner: root, group: root, mode: '0600'}
      inputs: {}
  - name: 'Inspect the Process'
    labels: {role: swamp}
    dependsOn: [{step: 'Write the intent file', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: inspect, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3, '${{
            "/tmp/orbit-process-" + run.id + "/scripts" + "/inspect.py" }}'], sudo: true}
  - name: 'Read the observation'
    labels: {role: swamp}
    dependsOn: [{step: 'Inspect the Process', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/process-command-assets'
      behaviorName: ${{ "process-observation-" + run.id }}
      methodName: decode
      inputs: {stdout: '${{ steps["Inspect the Process"].outputs.stdout }}'}
  - name: 'Check the release'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.installation.desired != "running" || !has(inputs.intent.control.directory) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: release, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3, '${{
            "/tmp/orbit-process-" + run.id + "/scripts" + "/check_release.py" }}'], sudo: true}
  - name: 'Check required mounts'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || inputs.intent.installation.desired != "running" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-mount-" + run.id + "-" + string(self.mount.index) }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: '${{ "mount-" + string(self.mount.index) }}', hosts: [target], argv: [/usr/bin/test, -e, '${{ self.mount.path }}'], sudo: true}
    forEach:
      item: mount
      in: '${{ has(inputs.intent.mounts) ? inputs.intent.mounts : [{"path":"/","index":0}] }}'
  - name: 'Remove the retired unit'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the observation', condition: {type: succeeded}}, {step: 'Check the release', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Check required mounts',
        condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.installation.retired == null }}
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent:
          control:
            process_id: ${{ inputs.intent.control.process_id }}
            runtime: '${{ inputs.intent.installation.retired != null ? inputs.intent.installation.retired.runtime : inputs.intent.control.runtime }}'
            name: '${{ inputs.intent.installation.retired != null ? inputs.intent.installation.retired.name : inputs.intent.control.name }}'
            on_demand: false
            vite: null
          ssh_execution: ${{ inputs.intent.ssh_execution }}
        execution_secrets: {}
  - name: 'Write the environment'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the retired unit', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Check the release', condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: 'Check required mounts', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || !inputs.intent.installation.has_environment || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: environment, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3, '${{
            "/tmp/orbit-process-" + run.id + "/scripts" + "/lifecycle_environment.py" }}', '${{ "/tmp/orbit-process-" + run.id + "/intent.json" }}'], sudo: true,
        stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'}
  - name: 'Write the unit'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the retired unit', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Check the release', condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: 'Check required mounts', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the observation', condition: {type: succeeded}},
      {step: 'Write the environment', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "process-unit-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, path: '${{ "/etc/systemd/system/" + inputs.intent.control.name
          }}', ensure: present, content: '${{ steps["Resolve check assets"].outputs.unit }}', owner: root, group: root, mode: '0644'}
      inputs: {}
  - name: 'Reload systemd'
    labels: {role: swamp}
    dependsOn: [{step: 'Write the unit', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-reload-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: systemctl daemon-reload}
      inputs: {}
  - name: 'Publish the dev route'
    labels: {role: swamp}
    dependsOn: [{step: 'Reload systemd', condition: {type: succeeded}}]
    guard: ${{ !has(inputs.intent.vite_plan) }}
    task:
      type: workflow
      workflowIdOrName: operation-process-vite
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: {vite_plan: '${{ has(inputs.intent.vite_plan)
              ? inputs.intent.vite_plan : {} }}', caddy_publication: '${{ has(inputs.intent.caddy_publication) ? inputs.intent.caddy_publication : {} }}', ssh_execution: '${{
              inputs.intent.ssh_execution }}'}, execution_secrets: {}}
  - name: 'Stop a transitioning unit'
    labels: {role: swamp}
    dependsOn: [{step: 'Reload systemd', condition: {type: succeeded}}, {step: 'Publish the dev route', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || inputs.intent.installation.desired != "stopped" || !(steps["Read the observation"].outputs.state in ["activating","deactivating","reloading"])
      || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-stop-transitioning-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "systemctl stop " + inputs.intent.control.name }}'}
      inputs: {}
  - name: 'Apply the unit state'
    labels: {role: swamp}
    dependsOn: [{step: 'Reload systemd', condition: {type: succeeded}}, {step: 'Publish the dev route', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Stop a transitioning unit',
        condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-service-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}', enabled: '${{ inputs.intent.installation.desired
          == "running" && !inputs.intent.control.on_demand }}', ensure: '${{ inputs.intent.installation.desired == "running" ? "running" : "stopped" }}'}
      inputs: {}
  - name: 'Restart if changed'
    labels: {role: swamp}
    dependsOn: [{step: 'Apply the unit state', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "systemd" || inputs.intent.installation.desired != "running" || !(steps["Read the observation"].outputs.state in ["active", "reloading"])
      || (!inputs.intent.installation.activation_pending && size(data.latest("process-unit-" + run.id, inputs.intent.ssh_execution.target.host).attributes.changes)
      == 0) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "process-restart-changed-" + run.id }}
      methodName: restart
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, service: '${{ inputs.intent.control.name }}'}
      inputs: {}
  - name: 'Pull the image'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the retired unit', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Check the release', condition: {type: or, conditions: [{type: succeeded},
            {type: skipped}]}}, {step: 'Check required mounts', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Read the observation', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-pull-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "docker --host=unix:///var/run/docker.sock image
          pull " + (has(inputs.intent.installation.definition) ? inputs.intent.installation.definition.image : "unused") }}', notIf: '${{ "docker --host=unix:///var/run/docker.sock
          image inspect " + (has(inputs.intent.installation.definition) ? inputs.intent.installation.definition.image : "unused") }}'}
      inputs: {}
  - name: 'Stop the old container'
    labels: {role: swamp}
    dependsOn: [{step: 'Pull the image', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || !steps["Read the observation"].outputs.present || steps["Read the observation"].outputs.spec == inputs.intent.installation.spec }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: stop-replaced, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', ORBIT_PROCESS_OPERATION=stop,
          /usr/bin/python3, '${{ "/tmp/orbit-process-" + run.id + "/scripts/control.py" }}'], sudo: true}
  - name: 'Remove the old container'
    labels: {role: swamp}
    dependsOn: [{step: 'Stop the old container', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.control.runtime != "docker" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: remove-replaced, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3,
          '${{ "/tmp/orbit-process-" + run.id + "/scripts/remove_container.py" }}'], sudo: true}
  - name: 'Create the container'
    labels: {role: swamp}
    dependsOn: [{step: 'Pull the image', condition: {type: succeeded}}, {step: 'Remove the old container', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || !inputs.intent.installation.has_environment }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: container, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3, '${{
            "/tmp/orbit-process-" + run.id + "/scripts" + "/lifecycle_container.py" }}', '${{ "/tmp/orbit-process-" + run.id + "/intent.json" }}'], sudo: true, stdin: '${{
          vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'}
  - name: 'Create container, no env'
    labels: {role: swamp}
    dependsOn: [{step: 'Pull the image', condition: {type: succeeded}}, {step: 'Remove the old container', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || inputs.intent.installation.has_environment }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: container-public, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', /usr/bin/python3,
          '${{ "/tmp/orbit-process-" + run.id + "/scripts" + "/lifecycle_container.py" }}', '${{ "/tmp/orbit-process-" + run.id + "/intent.json" }}'], sudo: true,
        stdin: '{}'}
  - name: 'Apply the container state'
    labels: {role: swamp}
    dependsOn: [{step: 'Create the container', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Create container, no env', condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.control.runtime != "docker" || steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/exec'
      behaviorName: ${{ "process-container-state-" + run.id }}
      methodName: apply
      globalArgs: {nodeHost: '${{ inputs.intent.ssh_execution.target.host }}', nodeUser: '${{ inputs.intent.ssh_execution.target.user }}', nodePort: '${{ inputs.intent.ssh_execution.target.port
          }}', nodeIdentityFile: '${{ inputs.intent.ssh_execution.identity_file }}', become: true, command: '${{ "docker --host=unix:///var/run/docker.sock container
          " + (inputs.intent.installation.desired == "running" ? "start " : "stop ") + inputs.intent.control.name }}'}
      inputs: {}
  - name: 'Verify it runs'
    labels: {role: swamp}
    dependsOn: [{step: 'Apply the unit state', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Restart if changed', condition: {type: or, conditions: [
            {type: succeeded}, {type: skipped}]}}, {step: 'Apply the container state', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: verify, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', '${{ "ORBIT_PROCESS_DESIRED="
            + inputs.intent.installation.desired }}', /usr/bin/python3, '${{ "/tmp/orbit-process-" + run.id + "/scripts" + "/verify.py" }}'], sudo: true}
  - name: 'Check the listener'
    labels: {role: swamp}
    dependsOn: [{step: 'Verify it runs', condition: {type: succeeded}}]
    guard: ${{ !has(inputs.intent.vite_plan) || inputs.intent.installation.desired != "running" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: listener, hosts: [target], argv: [/usr/bin/env, '${{ "ORBIT_PROCESS_CONTROL=" + steps["Resolve check assets"].outputs.control_json }}', '${{ has(inputs.intent.vite_plan)
            ? ("ORBIT_PROCESS_PORT=" + string(inputs.intent.vite_plan.listener.port)) : "" }}', /usr/bin/python3, '${{ "/tmp/orbit-process-" + run.id + "/scripts"
            + "/lifecycle_listener.py" }}'], sudo: true}
  - name: 'Prepare the awake marker'
    labels: {role: swamp}
    dependsOn: [{step: 'Verify it runs', condition: {type: succeeded}}, {step: 'Check the listener', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !has(inputs.intent.vite_plan) || inputs.intent.installation.desired != "running" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: awake-directory, hosts: [target], argv: [/usr/bin/mkdir, -p, '${{ steps["Resolve check assets"].outputs.marker_directory }}'], sudo: true}
  - name: 'Mark it awake'
    labels: {role: swamp}
    dependsOn: [{step: 'Prepare the awake marker', condition: {type: succeeded}}]
    guard: ${{ !has(inputs.intent.vite_plan) || inputs.intent.installation.desired != "running" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: awake, hosts: [target], argv: [/usr/bin/touch, '${{ has(inputs.intent.vite_plan) ? (inputs.intent.vite_plan.awake.marker) : "" }}'], sudo: true}
  - name: 'Clean up'
    labels: {role: swamp}
    dependsOn: [{step: 'Verify it runs', condition: {type: succeeded}}, {step: 'Mark it awake', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "process-ssh-" + run.id }}
      methodName: exec
      globalArgs: {name: '${{ "process-lifecycle-" + run.id }}', transport: *id001, hosts: *id002}
      inputs: {name: cleanup, hosts: [target], argv: [/usr/bin/rm, -rf, --, '${{ "/tmp/orbit-process-" + run.id }}'], sudo: true}
  - name: 'Report the result'
    labels: {role: swamp}
    dependsOn: [{step: 'Clean up', condition: {type: succeeded}}]
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "process-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '%s\n' '${{ steps["Verify it runs"].outputs.stdout }}'
