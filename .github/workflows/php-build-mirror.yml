name: Recipe artifact mirror

# Sury, the git-core PPA, and Zabbly can delete superseded builds. This workflow keeps every external pinned Debian file of the
# machine software recipe as an asset of the php-build-mirror release, named <package>_<digest>.deb. Installers
# try this mirror before the pin's own URL, so a rollback, a new Node, or CI still gets the exact build after
# an upstream source moves on. See ADR 0216, including Git artifacts and security updates.
on:
  push:
    branches: [main]
    paths:
      - apps/gateway/resources/machine-software/recipe.json
      - bin/php-build
      - tools/agent_command.py
      - .github/workflows/php-build-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-build-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror the recipe Debian artifacts
    if: github.repository == 'hardimpactdev/orbit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view php-build-mirror >/dev/null 2>&1; then
            gh release create php-build-mirror --prerelease --latest=false --title 'Recipe artifact mirror' \
              --notes 'External Debian artifacts of the machine software recipe. See ADR 0216 and docs/reference/compute-drivers.md.'
          fi
          gh release edit php-build-mirror --title 'Recipe artifact mirror'
          gh release view php-build-mirror --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published-assets"

      # Each new download is checked against its recipe digest before it is kept.
      - name: Download missing recipe artifacts
        run: python3 bin/php-build mirror --directory "$RUNNER_TEMP/php-build-mirror" --published "$RUNNER_TEMP/published-assets"

      - name: Publish the files that the release does not hold yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=php-build-mirror
          shopt -s nullglob
          for file in "$RUNNER_TEMP"/php-build-mirror/*.deb; do
            gh release upload "$release" "$file"
          done
