# The fixture `blocked-port` for each variant, on the target container: a listener of each protocol on the test and control ports, a test
# deny for each protocol above the proof-network allowance, and the proof that it holds ("blocked before"): the control port connects and the
# test port is blocked, from both sources. A precondition that does not hold ends prepare, so the run stops before any command (the runner's
# verdict `unrun`).
- ansible.builtin.import_playbook: ../default/facts.yml

- name: Fixtures on the target container
  hosts: nested-app-dev
  gather_facts: false
  vars:
    # One pair [case, protocol] for each protocol of each variant.
    pairs: "{{ cases | dict2items | subelements('value.protos') | list }}"
  tasks:
    # `setsid -f` detaches a listener from the exec session; the redirects let the task end while it runs.
    - name: Start the TCP listeners, a test and a control port for each variant
      ansible.builtin.shell: |
        for port in {{ item.0.value.port }} {{ item.0.value.control }}; do
          setsid -f python3 -m http.server "$port" --bind 0.0.0.0 --directory /tmp >/dev/null 2>&1 </dev/null
        done
      args:
        executable: /bin/bash
      loop: "{{ pairs }}"
      loop_control: {label: "{{ item.0.key }} {{ item.1 }}"}
      when: item.1 == 'tcp'
      changed_when: true

    - name: Start the UDP echo listeners
      ansible.builtin.shell: |
        for port in {{ item.0.value.port }} {{ item.0.value.control }}; do
          setsid -f python3 -c {{ udp_echo | quote }} "$port" >/dev/null 2>&1 </dev/null
        done
      args:
        executable: /bin/bash
      loop: "{{ pairs }}"
      loop_control: {label: "{{ item.0.key }} {{ item.1 }}"}
      when: item.1 == 'udp'
      changed_when: true

    # The listener binds a moment after its process starts. A datagram or a connection that is refused is asked again.
    - name: Each listener answers on the container itself
      vars:
        p: {tip: 127.0.0.1, port: "{{ item.0.0.value[item.1] }}", proto: "{{ item.0.1 }}"}
      ansible.builtin.command:
        argv: "{{ probe_argv }}"
      loop: "{{ pairs | product(['port', 'control']) | list }}"
      loop_control: {label: "{{ item.0.0.key }} {{ item.0.1 }} {{ item.1 }}"}
      register: listening
      until: listening.rc == 0
      retries: 10
      delay: 1
      changed_when: false

    - name: Read the UFW table
      ansible.builtin.command: ufw status numbered
      register: table
      changed_when: false

    # The row number is the text between `[` and `]`. The test deny goes in at the number of the proof-network allowance, so it sits above it.
    - name: Deny each test port above the proof-network allowance
      vars:
        anchor: "{{ table.stdout_lines | select('search', 'proof-network') | first | split(']') | first | replace('[', '') | trim | int }}"
      ansible.builtin.command:
        cmd: >-
          ufw insert {{ anchor }} deny proto {{ item.1 }} from any to any port {{ item.0.value.port }}
          comment 'proof:deny-{{ item.0.key }}'
      loop: "{{ pairs }}"
      loop_control: {label: "{{ item.0.key }} {{ item.1 }}"}
      changed_when: true

- name: Blocked before, the probes of the fixture
  ansible.builtin.import_playbook: probes.yml
  vars:
    probe_set: setup

- name: Every precondition holds
  hosts: localhost
  gather_facts: false
  vars:
    wrong: "{{ probe_obs | rejectattr('ok') | list }}"
    expected: "{{ groups['case_hosts'] | map('extract', hostvars, 'probes_of_case') | flatten | subelements('protos') | list | length }}"
  tasks:
    - name: The control port connects and the test port is blocked, from both sources
      ansible.builtin.assert:
        that:
          - wrong | length == 0
          - probe_obs | length == expected | int
        fail_msg: "precondition: {{ wrong | map(attribute='text') | join('; ') }} ({{ probe_obs | length }} of {{ expected }} probes ran)"
        quiet: true
