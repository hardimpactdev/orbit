id: d842de15-e892-48d2-aca0-acaefba9ce5f
name: operation-node-macos-inspect
description: Run the admitted node.macos_inspect intent in one native root.
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [node.macos_inspect] }
  required: [operation_id, node_id, kind]
jobs:
  - name: bootstrap
    labels: {node: '${{ string(inputs.node_id) }}'}
    steps:
      - name: apply
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-bootstrap-direct"
          behaviorName: '${{ "node-bootstrap-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
