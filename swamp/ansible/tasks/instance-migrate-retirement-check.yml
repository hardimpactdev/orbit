---
# Read-only retirement guard, shared by quiesce and retire. Never change or prune a worktree here.
- name: Name the Git command
  ansible.builtin.set_fact:
    retired_git: "{{ ['/usr/bin/git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', '-c', 'safe.directory=*'] }}"

# Classify the live Git topology, including gitfiles that name an owner repository.
- name: Read canonical Git identity and linked registration
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib
        import json
        import os
        import subprocess
        import sys
        from pathlib import Path

        source = Path(sys.argv[1])
        root = Path(sys.argv[2])
        def git(*args):
            result = subprocess.run(
                ['git', '-c', 'safe.directory=*', '-C', str(source), *args],
                env={**os.environ, 'GIT_OPTIONAL_LOCKS': '0'},
                check=True, capture_output=True, text=True)
            return result.stdout.strip()

        result = {'present': os.path.lexists(source / '.git'), 'valid': True}
        if result['present']:
            try:
                top = Path(git('rev-parse', '--show-toplevel')).resolve(strict=True)
                private = Path(git('rev-parse', '--absolute-git-dir')).resolve(strict=True)
                common = Path(git('rev-parse', '--path-format=absolute', '--git-common-dir')).resolve(strict=True)
                linked = private != common
                if top != source.resolve(strict=True):
                    raise ValueError('checkout root changed')
                if linked:
                    if private.parent != common / 'worktrees':
                        raise ValueError('unexpected worktree administration path')
                    if (private / 'gitdir').resolve(strict=True).read_text().strip() != str(source.resolve() / '.git'):
                        raise ValueError('worktree registration changed')
                descendants = [
                    token[9:] for token in git('worktree', 'list', '--porcelain', '-z').split('\0')
                    if token.startswith('worktree ') and Path(token[9:]).resolve() != top
                    and Path(token[9:]).resolve().is_relative_to(top)]
                result.update(git_dir=str(private), common_dir=str(common), linked=linked, descendants=descendants)
            except (OSError, ValueError, subprocess.CalledProcessError):
                result['valid'] = False
        else:
            # A retained identity receipt distinguishes a finished repeat from an interrupted unregister.
            evidence = root / (hashlib.sha256(os.fsencode(source)).hexdigest() + '.json')
            if evidence.exists():
                progress = json.loads(evidence.read_text())
                if progress['source'] != str(source) or progress['state'] != 'complete':
                    result.update(valid=False, error_code='instance.migrate_retire_failed',
                                  message='Incomplete linked retirement for ' + str(source)
                                  + '; inspect retained identity receipt ' + str(evidence))
        print(json.dumps(result))
      - "{{ retired.path }}"
      - "{{ migrate.checkout }}.orbit-retired-git"
  register: retirement_identity
  changed_when: false

- name: Explain a changed Git identity
  when: not (retirement_identity.stdout | from_json).valid
  ansible.builtin.set_fact:
    migrate_refusal_code: "{{ (retirement_identity.stdout | from_json).error_code | default('instance.migrate_retirement_blocked') }}"
    migrate_refusal_message: >-
      {{ (retirement_identity.stdout | from_json).message |
         default('Cannot retire checkout ' ~ (retired.path | to_json) ~ ': Git identity or worktree registration changed.') }}

- name: Require the checkout's Git identity
  ansible.builtin.assert:
    that: (retirement_identity.stdout | from_json).valid
    fail_msg: "{{ migrate_refusal_message | default('instance.migrate_retirement_blocked') }}"
    quiet: true

- name: Decide what goes
  ansible.builtin.set_fact:
    retired_worktree: "{{ (retirement_identity.stdout | from_json).present and (retirement_identity.stdout | from_json).linked }}"
    retired_repository: >-
      {{ (retirement_identity.stdout | from_json).present and not (retirement_identity.stdout | from_json).linked
         and (retired.common_of is not defined
              or migrate_common | default('') == (retirement_identity.stdout | from_json).common_dir) }}

- name: Keep the worktree's repository
  when: retired_worktree | bool
  ansible.builtin.set_fact:
    migrate_common: "{{ (retirement_identity.stdout | from_json).common_dir }}"

- name: Check a checkout before retirement
  when: retired_worktree | bool or retired_repository | bool
  block:
    - name: Read the checkout's canonical path
      ansible.builtin.command:
        argv: "{{ retired_git + ['-C', retired.path, 'rev-parse', '--show-toplevel'] }}"
      register: retirement_checkout
      changed_when: false
    - name: Read every registered worktree
      ansible.builtin.command:
        argv: "{{ retired_git + ['-C', retired.path, 'worktree', 'list', '--porcelain', '-z'] }}"
      register: retirement_worktrees
      changed_when: false
    - name: Read staged and unstaged tracked changes
      ansible.builtin.command:
        argv: "{{ retired_git + ['-C', retired.path, 'status', '--porcelain=v1', '--untracked-files=no', '--ignore-submodules=none'] }}"
      environment: { GIT_OPTIONAL_LOCKS: "0" }
      register: retirement_status
      changed_when: false
    - name: Name the blocking worktrees and files
      ansible.builtin.set_fact:
        retirement_other_worktrees: >-
          {{ (retirement_worktrees.stdout | regex_findall('(?:\A|\x00)worktree ([^\x00]+)')
              | reject('equalto', retirement_checkout.stdout | trim) | list) if retired_repository | bool
              else (retirement_identity.stdout | from_json).descendants }}
        retirement_changes: "{{ retirement_status.stdout_lines }}"
    - name: Explain a blocked retirement
      when: retirement_other_worktrees | length > 0 or retirement_changes | length > 0
      ansible.builtin.set_fact:
        migrate_refusal_code: instance.migrate_retirement_blocked
        migrate_refusal_message: >-
          Cannot retire checkout {{ retired.path | to_json }}.
          Other worktrees ({{ retirement_other_worktrees | length }} total; first 20): {{ retirement_other_worktrees[:20] | to_json }}.
          Changed files ({{ retirement_changes | length }} total; first 20): {{ retirement_changes[:20] | to_json }}.
          Submodule changes, including untracked files, cannot be preserved by the parent checkout archive.
    - name: Refuse a checkout with other worktrees or tracked changes
      ansible.builtin.assert:
        that: retirement_other_worktrees | length == 0 and retirement_changes | length == 0
        fail_msg: "{{ migrate_refusal_message | default('instance.migrate_retirement_blocked') }}"
        quiet: true
    - name: Read every local branch
      when: retired_repository | bool
      ansible.builtin.command:
        argv: "{{ retired_git + ['-C', retired.path, 'for-each-ref', '--format=%(refname)', 'refs/heads/'] }}"
      register: retirement_branches
      changed_when: false
    - name: Read whether HEAD is detached
      ansible.builtin.command:
        argv: "{{ retired_git + ['-C', retired.path, 'symbolic-ref', '--quiet', 'HEAD'] }}"
      register: retirement_head
      changed_when: false
      failed_when: retirement_head.rc not in [0, 1]
    - name: Count commits unreachable from every remote-tracking ref
      ansible.builtin.command:
        argv: "{{ retired_git + ['-C', retired.path, 'rev-list', '--count', item, '--not', '--remotes'] }}"
      loop: >-
        {{ (['HEAD'] if retirement_head.rc == 1 else [retirement_head.stdout | trim])
           if retired_worktree | bool
           else retirement_branches.stdout_lines + (['HEAD'] if retirement_head.rc == 1 else []) }}
      register: retirement_counts
      changed_when: false
    - name: Start the list of unpushed branches
      ansible.builtin.set_fact:
        retirement_unpushed: []
    - name: Name each unpushed branch and its commit count
      when: item.stdout | int > 0
      ansible.builtin.set_fact:
        retirement_unpushed: >-
          {{ retirement_unpushed + [{'branch': 'detached HEAD' if item.item == 'HEAD' else item.item[11:], 'commits': item.stdout | int}] }}
      loop: "{{ retirement_counts.results }}"
      loop_control: { label: "{{ item.item }}" }
    - name: Explain unpushed commits
      when: retirement_unpushed | length > 0
      ansible.builtin.set_fact:
        migrate_refusal_code: instance.migrate_unpushed_commits
        migrate_refusal_message: >-
          Cannot retire checkout {{ retired.path | to_json }}.
          Unpushed branches or detached HEAD ({{ retirement_unpushed | length }} total): {{ retirement_unpushed | to_json }}.
    - name: Refuse unpushed commits
      ansible.builtin.assert:
        that: retirement_unpushed | length == 0
        fail_msg: "{{ migrate_refusal_message | default('instance.migrate_unpushed_commits') }}"
        quiet: true
    # Linked worktrees leave the shared stash store with its owner.
    - name: Check stashes before retiring their owner
      when: retired_repository | bool
      block:
        - name: Read every stash entry
          ansible.builtin.command:
            argv: "{{ retired_git + ['-C', retired.path, 'stash', 'list', '--format=%H'] }}"
          register: retirement_stashes
          changed_when: false
        - name: Read the stash ref even when its reflog has expired
          ansible.builtin.command:
            argv: "{{ retired_git + ['-C', retired.path, 'rev-parse', '--verify', '--quiet', 'refs/stash'] }}"
          register: retirement_stash_ref
          changed_when: false
          failed_when: retirement_stash_ref.rc not in [0, 1]
        - name: Count every stash entry and any surviving stash ref
          ansible.builtin.set_fact:
            retirement_stash_count: "{{ [retirement_stashes.stdout_lines | length, 1 if retirement_stash_ref.rc == 0 else 0] | max }}"
        - name: Explain stashes
          when: retirement_stash_count | int > 0
          ansible.builtin.set_fact:
            migrate_refusal_code: instance.migrate_stashes_present
            migrate_refusal_message: >-
              Cannot retire checkout {{ retired.path | to_json }}.
              Stashes: {{ retirement_stash_count }}.
        - name: Refuse stashes
          ansible.builtin.assert:
            that: retirement_stash_count | int == 0
            fail_msg: "{{ migrate_refusal_message | default('instance.migrate_stashes_present') }}"
            quiet: true
