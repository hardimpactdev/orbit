version = "1.41.0"
php-version = "8.5"

[source]
paths = ["app", "bootstrap", "config", "tests"]
includes = ["vendor"]
excludes = ["build", "storage"]

[formatter]
preset = "laravel"

[analyzer]
baseline = "mago-analyzer-baseline.toml"

[linter]
baseline = "mago-linter-baseline.toml"
integrations = ["laravel", "pest", "phpunit"]
