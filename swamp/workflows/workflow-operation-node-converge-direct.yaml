  steps:
  - name: php_runtime-${{ self.configuration.version }}
    writes: true
    guard: ${{ !(inputs.intent.artifacts.exists(a, a.name == "php-runtime" && a.required)) }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-converge-action-" + string(inputs.node_id) + "-php_runtime" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          exec /usr/bin/sudo -n -- /usr/bin/python3 -I - "${{ steps.prepare.outputs.intent_file }}" "${{ self.configuration.version }}" <<'ORBIT_PY'
          import fcntl
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with open(sys.argv[1], encoding="utf-8") as source:
              text = source.read(16777217)
          if len(text) > 16777216:
              raise ValueError("public intent exceeds limit")
          intent = json.loads(text)
          ROOT = Path("/")
          UID, GID = (0, 0)


          def path(value):
              return ROOT / value.lstrip("/")


          class Refusal(Exception):
              def __init__(self, code):
                  self.code = code


          def fail(code):
              raise Refusal(code)


          def version(v):
              return isinstance(v, str) and re.fullmatch("[0-9]+\\.[0-9]+", v) is not None


          def metadata(p, directory=False, required=False):
              try:
                  m = p.lstat()
              except FileNotFoundError:
                  if required:
                      fail("php.shared_pool_unsafe")
                  return None
              if m.st_uid != UID or not (
                  stat.S_ISDIR(m.st_mode) if directory else stat.S_ISREG(m.st_mode)
              ):
                  fail("php.shared_pool_unsafe")
              return m


          def parents(p):
              if p == ROOT:
                  return
              parents(p.parent)
              if not p.exists():
                  p.mkdir(mode=493)
                  os.chown(p, UID, GID)
              metadata(p, True, True)


          def publish(p, data, mode=420, uid=None, gid=None):
              parents(p.parent)
              fd, candidate = tempfile.mkstemp(prefix=".orbit-php-", dir=p.parent)
              try:
                  with os.fdopen(fd, "wb") as f:
                      f.write(data.encode() if isinstance(data, str) else data)
                      f.flush()
                      os.fsync(f.fileno())
                      os.fchmod(f.fileno(), mode)
                      os.fchown(
                          f.fileno(), UID if uid is None else uid, GID if gid is None else gid
                      )
                  os.replace(candidate, p)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)


          def call(argv, required=True):
              p = subprocess.run(
                  argv,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
                  timeout=60,
              )
              if required and p.returncode != 0:
                  fail("php.shared_pool_failed")
              return (p.returncode, p.stdout.decode(errors="replace"))


          def size(v):
              m = re.fullmatch("([0-9]+)([KMG]?)", v)
              if not m:
                  return None
              n = int(m[1]) * {"": 1, "K": 1024, "M": 1024**2, "G": 1024**3}[m[2]]
              return n if 0 < n <= 1024**3 else None


          def settings(p):
              if (
                  not isinstance(p, dict)
                  or set(p) != {"version", "runtime_ini", "release"}
                  or (not version(p["version"]))
                  or (not isinstance(p["runtime_ini"], str))
                  or (len(p["runtime_ini"].encode()) > 8192)
              ):
                  fail("php.runtime_input_invalid")
              r = p["release"]
              if (
                  not isinstance(r, dict)
                  or set(r) != {"id", "codenames"}
                  or (not isinstance(r["id"], str))
                  or (not re.fullmatch("[a-z0-9][a-z0-9+.-]*", r["id"]))
                  or (not isinstance(r["codenames"], list))
                  or (not r["codenames"])
                  or any(
                      (
                          not isinstance(c, str) or not re.fullmatch("[a-z0-9][a-z0-9+.-]*", c)
                          for c in r["codenames"]
                      )
                  )
              ):
                  fail("php.runtime_input_invalid")
              result = {}
              for line in p["runtime_ini"].splitlines():
                  line = line.strip()
                  if not line or line.startswith(";"):
                      continue
                  if "=" not in line:
                      fail("php.runtime_input_invalid")
                  k, v = map(str.strip, line.split("=", 1))
                  valid = (
                      size(v) is not None
                      if k in ("post_max_size", "upload_max_filesize")
                      else v == "On"
                      if k == "opcache.enable"
                      else v == "disable"
                      if k == "opcache.jit"
                      else v == "0"
                      if k == "opcache.jit_buffer_size"
                      else bool(re.fullmatch("[0-9]+", v)) and 0 < int(v) <= 4294967295
                      if k
                      in (
                          "opcache.memory_consumption",
                          "opcache.interned_strings_buffer",
                          "opcache.max_accelerated_files",
                      )
                      else False
                  )
                  if not valid or k in result:
                      fail("php.runtime_input_invalid")
                  result[k] = v
              if len(result) != 8 or size(result["upload_max_filesize"]) > size(
                  result["post_max_size"]
              ):
                  fail("php.runtime_input_invalid")
              return result


          def fpm_configuration(text):
              has_global = any(
                  (input_line.strip() == "[global]" for input_line in text.splitlines())
              )
              out = "" if has_global else "[global]\nprocess_control_timeout = 30s\n"
              global_section = True
              emitted = not has_global
              for line in text.splitlines(keepends=True):
                  trimmed = line.strip()
                  if trimmed.startswith("["):
                      global_section = trimmed == "[global]"
                  if global_section and trimmed == "[global]" and (not emitted):
                      out += line + "process_control_timeout = 30s\n"
                      emitted = True
                      continue
                  if (
                      global_section
                      and "=" in trimmed
                      and (trimmed.split("=", 1)[0].strip() == "process_control_timeout")
                  ):
                      continue
                  out += line
              return out


          def fpm_units(v):
              shared = "php" + v + "-fpm.service"
              result = []
              if call(["/usr/bin/systemctl", "is-active", "--quiet", shared], False)[0] == 0:
                  result.append((shared, path("/etc/php/" + v + "/fpm/php-fpm.conf")))
              listed = call(
                  [
                      "/usr/bin/systemctl",
                      "list-units",
                      "--type=service",
                      "--state=active",
                      "--no-legend",
                      "--plain",
                      "orbit-*-php" + v + "-fpm.service",
                  ],
                  False,
              )[1]
              for line in listed.splitlines():
                  unit = line.split()[0] if line.split() else ""
                  if not re.fullmatch(
                      "orbit-[a-z0-9_-]+-php" + re.escape(v) + "-fpm\\.service", unit
                  ):
                      continue
                  start = call(
                      ["/usr/bin/systemctl", "show", "-p", "ExecStart", "--value", unit], False
                  )[1]
                  m = re.search("--fpm-config\\s+(\\S+)", start)
                  result.append(
                      (unit, path(m[1]) if m else path("/__missing_fpm_configuration__"))
                  )
              return result


          def configure(p):
              expected = settings(p)
              release = {}
              try:
                  for line in path("/etc/os-release").read_text().splitlines():
                      if "=" in line:
                          k, v = line.split("=", 1)
                          release[k] = v.strip("\"'")
              except OSError:
                  pass
              if (
                  release.get("ID") != p["release"]["id"]
                  or release.get("VERSION_CODENAME") not in p["release"]["codenames"]
              ):
                  fail("php.runtime_platform_unsupported")
              v = p["version"]
              binary = str(path("/usr/sbin/php-fpm" + v))
              if not Path(binary).exists():
                  return {"changed": False, "reloaded": False}
              available = path("/etc/php/" + v + "/mods-available/orbit-runtime.ini")
              enabled = path("/etc/php/" + v + "/fpm/conf.d/99-orbit-runtime.ini")
              shared = path("/etc/php/" + v + "/fpm/php-fpm.conf")
              unit = "php" + v + "-fpm.service"
              before_file = available.read_bytes() if available.exists() else None
              before_link = None
              if enabled.is_symlink():
                  before_link = os.readlink(enabled)
              elif enabled.exists():
                  fail("php.runtime_configuration_failed")
              metadata(shared, False, True)
              before_shared = shared.read_text()
              configuration = fpm_configuration(before_shared)
              correct = enabled.exists() and enabled.resolve() == available.resolve()
              changed = (
                  before_file != p["runtime_ini"].encode()
                  or not correct
                  or configuration != before_shared
              )
              touched = False
              masters = {}
              reloaded = []
              deferred = []
              try:
                  if changed:
                      touched = True
                      publish(available, p["runtime_ini"])
                      publish(shared, configuration)
                      if not correct:
                          enabled.unlink(missing_ok=True)
                          enabled.symlink_to("../../mods-available/orbit-runtime.ini")
                  info = call([binary, "-i"])[1]
                  if str(enabled) not in info or any(
                      (
                          k + " => " + val + " => " + val
                          not in [line.strip() for line in info.splitlines()]
                          for k, val in expected.items()
                      )
                  ):
                      fail("php.runtime_configuration_failed")
                  if changed:
                      for name, configuration_path in fpm_units(v):
                          if name != unit:
                              metadata(configuration_path, False, True)
                              previous = configuration_path.read_text()
                              n = fpm_configuration(previous)
                              if n != previous:
                                  masters[configuration_path] = previous
                                  publish(configuration_path, n)
                          args = [binary, "-t"] + (
                              [] if name == unit else ["--fpm-config", str(configuration_path)]
                          )
                          if call(args, False)[0] != 0:
                              deferred.append(name)
                              continue
                          reloaded.append((name, args))
                          call(["/usr/bin/systemctl", "reload", name])
                  call(["/usr/bin/systemctl", "enable", unit])
                  call([str(path("/usr/bin/php" + v)), "-v"])
                  call([binary, "-v"])
                  if "pcov" in [
                      line.strip().lower() for line in call([binary, "-m"])[1].splitlines()
                  ]:
                      fail("php.runtime_configuration_failed")
                  call(["/usr/bin/systemctl", "is-enabled", "--quiet", unit])
                  return {"changed": changed, "reloaded": bool(reloaded), "deferred": deferred}
              except Exception:
                  restored = True
                  if touched:
                      for file, data in [
                          (shared, before_shared),
                          *masters.items(),
                          (available, before_file),
                      ]:
                          try:
                              if data is None:
                                  file.unlink(missing_ok=True)
                              else:
                                  publish(file, data)
                          except Exception:
                              restored = False
                      try:
                          enabled.unlink(missing_ok=True)
                          if before_link is not None:
                              enabled.symlink_to(before_link)
                      except Exception:
                          restored = False
                      for name, args in reloaded:
                          try:
                              if (
                                  call(args, False)[0] != 0
                                  or call(["/usr/bin/systemctl", "reload", name], False)[0] != 0
                              ):
                                  restored = False
                          except Exception:
                              restored = False
                  return {
                      "changed": False,
                      "error_code": "php.runtime_configuration_failed",
                      "restored": restored,
                  }


          try:
              selected_version = sys.argv[2]
              configuration = next(
                  (
                      c
                      for c in intent["payloads"]["php-runtime"]["configurations"]
                      if c["version"] == selected_version
                  )
              )
              with open("/run/lock/orbit-php-runtime.lock", "a") as held:
                  fcntl.flock(held, fcntl.LOCK_EX)
                  output = configure(configuration)
              output["ok"] = "error_code" not in output
          except Refusal as error:
              output = {"ok": False, "error_code": error.code}
          except Exception:
              output = {"ok": False, "error_code": "php.runtime_configuration_failed"}
          print(json.dumps(output, separators=(",", ":")))
          ORBIT_PY
    forEach:
      item: configuration
      in: '${{ "php-runtime" in inputs.intent.payloads ? inputs.intent.payloads["php-runtime"].configurations : [] }}'
