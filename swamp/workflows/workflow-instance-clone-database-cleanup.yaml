id: 3f73b1d8-382f-558f-8439-148516e56543
name: instance-clone-database-cleanup
description: Remove the SQLite snapshot and transfer files on the candidate Node, 209 and the app-prod Node; best effort.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    kind:
      type: string
    run_id:
      type: string
  required:
  - operation_id
  - node_id
  - intent
  - kind
  - run_id
  additionalProperties: false
jobs:
- name: database
  labels:
    role: swamp
  steps:
  - name: candidate
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-db-rm-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-db-rm-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - -u
        - ${{ inputs.intent.sqlite.user }}
        - --
        - /usr/bin/rm
        - -f
        - --
        - ${{ inputs.intent.sqlite.snapshot }}
    allowFailure: true
  - name: target
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-db-rm-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-db-rm-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - /usr/bin/rm
        - -f
        - --
        - ${{ inputs.intent.sqlite.snapshot }}
    allowFailure: true
  - name: local
    labels:
      role: swamp
    allowFailure: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "icl-db-rm-local" }}
      methodName: execute
      inputs:
        run: 'rm -f -- "$ORBIT_SNAPSHOT"

          '
        env:
          ORBIT_SNAPSHOT: ${{ "/tmp/orbit-clone-sqlite-" + inputs.run_id + ".sqlite" }}
queueTimeout: 60
