id: eb09e3bd-26b1-4ea3-9452-039a79a45c98
name: operation-fleet-recipe-direct
description: One exact-Node native recipe DAG with local footprint and CLI checkpoints.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - fleet.recipe
  required:
  - operation_id
  - node_id
  - kind
  additionalProperties: false
target: ${{ "orbit-node-" + string(inputs.node_id) }}
labels:
  node: ${{ string(inputs.node_id) }}
jobs:
- name: admission
  steps:
  - name: admit
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-direct'
      behaviorName: ${{ "fleet-recipe-" + string(inputs.node_id) }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: agent_install_job
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  steps:
  - name: agent_install_cancellation
    writes: false
    guard: ${{ !steps.admit.outputs.ready }}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-direct'
      behaviorName: ${{ "fleet-recipe-" + string(inputs.node_id) }}
      methodName: observe
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        stage: agent-install
  - name: agent_install
    writes: true
    guard: ${{ !steps.admit.outputs.ready }}
    dependsOn:
    - step: agent_install_cancellation
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-direct'
      behaviorName: ${{ "fleet-recipe-" + string(inputs.node_id) }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: agent-install
        cancellation: ${{ steps.agent_install_cancellation.outputs }}
        binary_changed: false
  - name: agent_install_proven
    guard: ${{ !steps.admit.outputs.ready }}
    dependsOn:
    - step: agent_install
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.agent_install.outputs.ok
      message: The agent-install recipe checkpoint refused its intent
      severity: high
- name: preflight_job
  dependsOn:
  - job: agent_install_job
    condition:
      type: succeeded
  steps:
  - name: preflight_cancellation
    writes: false
    guard: ${{ !steps.admit.outputs.ready }}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-direct'
