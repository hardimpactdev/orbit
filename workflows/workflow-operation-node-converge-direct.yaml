        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: observe
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            stage: route-residue
      - name: route_residue
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: stage
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
