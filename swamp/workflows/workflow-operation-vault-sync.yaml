id: 8f61a312-2b19-4ef7-92d5-39dff3d42380
name: operation-vault-sync
description: Complete public intent, vault environment, one cipher action per native shell step.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [vault.sync]}
    intent:
      type: object
      properties:
        url:
          type: string
        client_id:
          type: string
        organization_id:
          type: string
        collection_id:
          type: string
        ca_file:
          type: string
        wanted:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              fingerprint:
                type: string
            required:
            - source
            - fingerprint
            additionalProperties: false
        ledger:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              cipher_id:
                type: string
              revision_date:
                type: string
              fingerprint:
                type: string
            required:
            - source
            - cipher_id
            - revision_date
            - fingerprint
            additionalProperties: false
      additionalProperties: false
      required:
      - url
      - client_id
      - organization_id
      - collection_id
      - ca_file
      - wanted
      - ledger
    execution_secrets:
      type: object
      properties:
        configuration:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^vault-sync-[a-f0-9-]+$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - configuration
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  steps:
  - name: Prepare public data
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        env:
          ORBIT_VAULT_CONFIGURATION: ${{ vault.get(inputs.execution_secrets.configuration.vault, inputs.execution_secrets.configuration.key) }}
      behaviorName: ${{ "vault-sync-inputs" }}
  - name: workspace
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 30 mktemp -d -t orbit-vault-sync.XXXXXX
      behaviorName: ${{ "vault-sync-workspace" }}
    dependsOn:
    - step: Prepare public data
      condition:
        type: succeeded
    writes: true
  - name: Prepare session file
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: workspace
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "vault-sync-session-file" }}
      methodName: execute
      inputs:
        run: timeout 30 install -m 0600 /dev/null "$BITWARDENCLI_APPDATA_DIR/session"
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
  - name: configure
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw config server "$ORBIT_VAULT_URL" >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          ORBIT_VAULT_URL: ${{ inputs.intent.url }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-configure" }}
    dependsOn:
    - step: Prepare session file
      condition:
        type: succeeded
    writes: true
  - name: login
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw login --apikey >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_CLIENTID: ${{ inputs.intent.client_id }}
          BW_CLIENTSECRET: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.client_secret_key) }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-login" }}
    dependsOn:
    - step: configure
      condition:
        type: succeeded
    writes: true
  - name: unlock
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw unlock --passwordenv BW_PASSWORD --raw >"$BITWARDENCLI_APPDATA_DIR/session"
          2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_PASSWORD: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.master_password_key) }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-unlock" }}
    dependsOn:
    - step: login
      condition:
        type: succeeded
    writes: true
  - name: Resolve the session
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: ${{ "vault-sync-session" }}
      methodName: session
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
    dependsOn:
    - step: unlock
      condition:
        type: succeeded
  - name: sync
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw sync >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-sync" }}
    dependsOn:
    - step: Resolve the session
      condition:
        type: succeeded
    writes: true
  - name: Read private inventory
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw list items --organizationid "$ORBIT_ORGANIZATION" --collectionid "$ORBIT_COLLECTION"
          >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_ORGANIZATION: ${{ inputs.intent.organization_id }}
          ORBIT_COLLECTION: ${{ inputs.intent.collection_id }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/inventory" }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-read-inventory" }}
    dependsOn:
    - step: sync
      condition:
        type: succeeded
  - name: inventory
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: ${{ "vault-sync-public-inventory" }}
      methodName: inventory
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        file: inventory
        intent: ${{ inputs.intent }}
    dependsOn:
    - step: Read private inventory
      condition:
        type: succeeded
  - name: Read private trash
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw list items --trash --organizationid "$ORBIT_ORGANIZATION" --collectionid
          "$ORBIT_COLLECTION" >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_ORGANIZATION: ${{ inputs.intent.organization_id }}
          ORBIT_COLLECTION: ${{ inputs.intent.collection_id }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/trash" }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-read-trash" }}
    dependsOn:
    - step: inventory
      condition:
        type: succeeded
  - name: trash
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: ${{ "vault-sync-public-trash" }}
      methodName: inventory
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        file: trash
        intent: ${{ inputs.intent }}
    dependsOn:
    - step: Read private trash
      condition:
        type: succeeded
  - name: plan
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      methodName: plan
      inputs:
        intent: ${{ inputs.intent }}
        inventory: ${{ steps.inventory.outputs.stdout }}
        trash: ${{ steps.trash.outputs.stdout }}
      behaviorName: ${{ "vault-sync-plan" }}
    dependsOn:
    - step: trash
      condition:
        type: succeeded
- name: deletions
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
  steps:
  - name: delete
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw delete item "$ORBIT_CIPHER_ID" --permanent >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_CIPHER_ID: ${{ self.item.id }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-delete-" + string(self._index) }}
    forEach:
      item: item
      in: ${{ steps.plan.outputs.deletes }}
    concurrency: 1
    writes: true
- name: payloads
  dependsOn:
  - job: deletions
    condition:
      type: completed
  steps:
  - name: encode
    writes: true
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: ${{ "vault-sync-encode-" + string(self._index) }}
      methodName: encode
      inputs:
        intent: ${{ inputs.intent }}
        item: ${{ self.item }}
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        index: ${{ self._index }}
        env:
          ORBIT_VAULT_CONFIGURATION: ${{ vault.get(inputs.execution_secrets.configuration.vault, inputs.execution_secrets.configuration.key) }}
    forEach:
      item: item
      in: ${{ steps.plan.outputs.writes }}
    concurrency: 1
    guard: ${{ !("plan" in steps) || steps.plan.status != "succeeded" }}
- name: writes
  dependsOn:
  - job: payloads
    condition:
      type: succeeded
  steps:
  - name: Apply cipher
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw "$ORBIT_ACTION" item ${ORBIT_CIPHER_ID:+"$ORBIT_CIPHER_ID"} <"$ORBIT_PAYLOAD_FILE"
          >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_ACTION: '${{ self.item.cipher_id == null ? "create" : "edit" }}'
          ORBIT_CIPHER_ID: '${{ self.item.cipher_id == null ? "" : self.item.cipher_id }}'
          ORBIT_PAYLOAD_FILE: ${{ steps["encode-" + string(self._index)].outputs.path }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/write-" + string(self._index) }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-apply-" + string(self._index) }}
    forEach:
      item: item
      in: ${{ steps.plan.outputs.writes }}
    concurrency: 1
    writes: true
  - name: write
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: ${{ "vault-sync-write-" + string(self._index) }}
      methodName: writeReceipt
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        index: ${{ self._index }}
        item: ${{ self.item }}
    dependsOn:
    - step: Apply cipher
      condition:
        type: succeeded
    forEach:
      item: item
      in: ${{ steps.plan.outputs.writes }}
    concurrency: 1
- name: cleanup
  dependsOn:
  - job: writes
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  steps:
  - name: logout
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw logout >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
        timeout: 60000
      behaviorName: ${{ "vault-sync-logout" }}
    guard: ${{ !("workspace" in steps) || !("stdout" in steps.workspace.outputs) }}
    writes: true
  - name: remove-cache
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_VAULT_DIRECTORY"
        env:
          ORBIT_VAULT_DIRECTORY: ${{ steps.workspace.outputs.stdout.trim() }}
      behaviorName: ${{ "vault-sync-remove-cache" }}
    dependsOn:
    - step: logout
      condition:
        type: completed
    guard: ${{ !("workspace" in steps) || !("stdout" in steps.workspace.outputs) }}
    writes: true
- name: sync
  dependsOn:
  - job: cleanup
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  steps:
  - name: result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      methodName: result
      inputs:
        plan: '${{ "plan" in steps && steps.plan.status == "succeeded" ? steps.plan.outputs : null }}'
        writes: ${{ steps.filter(name, name.startsWith("write-") && steps[name].status == "succeeded" && "outputs" in steps[name] && "stdout"
          in steps[name].outputs).map(name, steps[name].outputs.stdout) }}
        successful: ${{ "plan" in steps && steps.plan.status == "succeeded" && steps.all(name, steps[name].status != "failed" && steps[name].status
          != "cancelled") }}
      behaviorName: ${{ "vault-sync-result" }}
  - name: Confirm the sync
    labels:
      role: swamp
    dependsOn:
    - step: result
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.result.outputs.successful
      message: Vault synchronization failed.
      severity: high
queueTimeout: 30
