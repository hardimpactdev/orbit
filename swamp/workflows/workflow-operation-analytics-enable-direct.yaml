id: 38e1a160-f17b-4d31-b77c-36dfd78ed570
name: operation-analytics-enable-direct
description: Converge Plausible and tracking Routes through one native placed DAG.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - analytics.enable
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: prepare
  writes: true
  steps:
  - name: begin
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: begin
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
- name: site
  writes: true
  steps:
  - name: site
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-lifecycle'
      behaviorName: ${{ "analytics-parent-" + string(inputs.node_id) }}
      methodName: site
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ steps.begin.outputs.stopped }}
  dependsOn:
  - job: prepare
    condition:
      type: succeeded
- name: requests
  writes: true
  steps:
  - name: request
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-certificate'
      behaviorName: ${{ "analytics-cert-node-" + string(self.item.node_id) }}
      methodName: request
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item.node_id }}
        leaf: ${{ self.item }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.certificates }}
  dependsOn:
  - job: site
    condition:
      type: succeeded
- name: sign
  writes: true
  steps:
  - name: sign-http-input
    target: orbit-node-209
    labels:
      node: '209'
    guard: ${{ steps.begin.outputs.stopped }}
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: orbit-certificate-signing
      methodName: prepareSignBatch
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaves: '${{ steps.begin.outputs.tracking.certificates.map(leaf, {"node_id": leaf.node_id, "scope":
          leaf.scope, "agent_sha256": leaf.agent_sha256, "domain": leaf.domain, "version": leaf.version,
          "root_hash": leaf.root_hash, "user": leaf.user}) }}'
        target_node_id: 209
        requests: ${{ steps.filter(name, name.startsWith("request-")).map(name, [steps[name].outputs]) }}
  - name: sign-http
    target: orbit-node-209
    labels:
      node: '209'
    guard: ${{ steps.begin.outputs.stopped }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: orbit-certificate-signing-http
      methodName: execute
      inputs:
        run: |
          #!/bin/sh
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import re
          import ssl
          import sys
          import urllib.request


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          try:
              operation = os.environ["ORBIT_CERTIFICATE_OPERATION_ID"]
              run_id = os.environ["ORBIT_CERTIFICATE_RUN_ID"]
              if not re.fullmatch(r"[1-9][0-9]*", operation):
                  raise ValueError("Invalid operation")
              raw = json.loads(os.environ["ORBIT_CERTIFICATE_REQUESTS"])
              if os.environ["ORBIT_CERTIFICATE_MODE"] == "single":
                  leaf = json.loads(os.environ["ORBIT_CERTIFICATE_LEAF"])
                  raw = [dict(node_id=leaf["node_id"], scope=leaf["scope"], **raw)]
              else:
                  raw = [record for batch in raw for record in batch]
              if len(raw) > 256:
                  raise ValueError("Too many requests")
              requests = [record for record in raw if record.get("state") == "request"]
              if not requests:
                  print(json.dumps({"certificates": []}))
                  sys.exit(0)
              body = {"run_id": run_id, "requests": requests}
              if os.environ.get("ORBIT_CERTIFICATE_RESTORING") == "true":
                  body["restoring"] = True
              payload = json.dumps(body).encode()
              url = (
                  "https://gateway.orbit/api/v1/direct-operations/"
                  + operation
                  + "/certificates/sign"
              )
              request = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              context = ssl.create_default_context(
                  cafile="/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"
              )
              opener = urllib.request.build_opener(
                  NoRedirect(), urllib.request.HTTPSHandler(context=context)
              )
              with opener.open(request, timeout=60) as response:
                  raw_response = response.read(16_777_217)
                  if len(raw_response) > 16_777_216 or response.status != 200:
                      raise ValueError("Invalid signing response")
              result = json.loads(raw_response)["data"]
              print(json.dumps(result))
          except Exception:
              print(json.dumps({"error_code": "app-dev.certificate_sign_failed"}))
              sys.exit(1)
          PYTHON
        env:
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ run.id }}
          ORBIT_CERTIFICATE_MODE: batch
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["sign-http-input"].outputs.requests_json }}
    dependsOn:
    - step: sign-http-input
      condition:
        type: succeeded
  - name: sign
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: orbit-certificate-signing
      methodName: signBatch
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaves: '${{ steps.begin.outputs.tracking.certificates.map(leaf, {"node_id": leaf.node_id, "scope":
          leaf.scope, "agent_sha256": leaf.agent_sha256, "domain": leaf.domain, "version": leaf.version,
          "root_hash": leaf.root_hash, "user": leaf.user}) }}'
        target_node_id: 209
        requests: ${{ steps.filter(name, name.startsWith("request-")).map(name, [steps[name].outputs]) }}
        native_stdout: ${{ steps["sign-http"].outputs.stdout }}
    guard: ${{ steps.begin.outputs.stopped }}
    dependsOn:
    - step: sign-http
      condition:
        type: succeeded
  dependsOn:
  - job: requests
    condition:
      type: succeeded
- name: certificates
  writes: true
  steps:
  - name: certificate
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/analytics-certificate'
      behaviorName: ${{ "analytics-cert-node-" + string(self.item.node_id) }}
      methodName: publish
      globalArgs:
        caFile: /usr/local/share/ca-certificates/orbit-root.crt
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.item.node_id }}
        leaf: ${{ self.item }}
        signed: ${{ steps.sign.outputs.certificates.filter(c, c.node_id == self.item.node_id && c.scope
          == self.item.scope) }}
        requests: ${{ steps.filter(name, name.startsWith("request-")).map(name, steps[name].outputs) }}
    forEach:
      item: item
      in: ${{ steps.begin.outputs.tracking.certificates }}
  dependsOn:
  - job: sign
    condition:
      type: succeeded
- name: records
  writes: true
