id: 4b0f7f8a-2f6c-4f53-9a51-3c2f0f6c1a05
name: task-publication-pull-request
description: Open or update the pull request when asked, then shape the publication receipt from every step of the run.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
    scratch:
      type: string
    prepared:
      type: object
    pushed:
      type: boolean
    observed:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - scratch
  - prepared
  - pushed
  - observed
  additionalProperties: false
jobs:
- name: publish
  labels:
    role: swamp
  steps:
  - name: read_pull
    labels:
      role: swamp
    guard: ${{ inputs.intent.pull_request == null || !inputs.pushed }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publication-read_pull" }}
      methodName: execute
      inputs:
        run: 'gh api --method GET "$ORBIT_PATH" -f state=open -f head="$ORBIT_HEAD" -f per_page=100

          '
        ignoreExitCode: true
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key)
            }}
          GH_CONFIG_DIR: ${{ inputs.scratch + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_PATH: ${{ "repos/" + inputs.intent.repository + "/pulls" }}
          ORBIT_HEAD: ${{ inputs.prepared.pull_head }}
  - name: pull_plan
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publication-pull_plan" }}
      methodName: pull
      inputs:
        input: ${{ inputs.intent }}
        steps: ${{ steps }}
    dependsOn:
    - step: read_pull
      condition:
        type: succeeded
  - name: write_pull
    labels:
      role: swamp
    guard: ${{ steps.pull_plan.outputs.method == "" }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-publication-write_pull" }}
      methodName: execute
      inputs:
        run: 'printf ''%s'' "$ORBIT_BODY" | gh api --method "$ORBIT_METHOD" "$ORBIT_PATH" --input -

          '
        ignoreExitCode: true
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key)
            }}
          GH_CONFIG_DIR: ${{ inputs.scratch + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_METHOD: ${{ steps.pull_plan.outputs.method }}
          ORBIT_PATH: ${{ steps.pull_plan.outputs.path }}
          ORBIT_BODY: ${{ steps.pull_plan.outputs.body }}
    dependsOn:
    - step: pull_plan
      condition:
        type: succeeded
  - name: shape_result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-publication-data'
      behaviorName: ${{ "task-publication-shape_result" }}
      methodName: result
      inputs:
        input: ${{ inputs.intent }}
        steps: ${{ steps }}
        parent: ${{ inputs.observed }}
    dependsOn:
    - step: read_pull
      condition:
        type: always
    - step: pull_plan
      condition:
        type: always
    - step: write_pull
      condition:
        type: always
queueTimeout: 60
