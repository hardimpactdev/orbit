id: 3f4a442f-a80b-4d66-9ef8-5b1f4c462f7f
name: operation-tool-write-209
autoContinue: false
description: Native Tool installation and update through cfgmgmt and bounded SSH argv, from an apt repository its own add published.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [tool.install, tool.update]}
    intent: {type: object}
    ssh: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, ssh]
  additionalProperties: false
jobs:
- name: tools
  steps:
  - name: Prepare package commands
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tw-argv-" + string(inputs.node_id) }}', methodName: assets, inputs: {input: '${{ inputs.intent }}'}}
  - name: Set up the Tool Manager
    labels: {role: swamp}
    dependsOn: [{step: Prepare package commands, condition: {type: succeeded}}]
    guard: ${{ inputs.intent.kind == "tool.update" || !("setup" in inputs.intent) || inputs.intent.setup == null || ("manager_ready" in inputs.intent && inputs.intent.manager_ready) }}
    task: {type: workflow, workflowIdOrName: operation-tool-manager-setup, inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', intent: '${{ inputs.intent }}', ssh: '${{ inputs.ssh }}', report: false}}
  - name: Pin repository packages
    labels: {role: swamp}
    dependsOn: [{step: Prepare package commands, condition: {type: succeeded}}]
    guard: ${{ inputs.intent.repository == null }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "pin-repository-packages-" + string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', become: true, path: '${{ "/etc/apt/preferences.d/orbit-" + steps["Prepare package commands"].outputs.repository.name + ".pref" }}', content: '${{ steps["Prepare package commands"].outputs.repository_preferences_held }}', mode: '0644', owner: root, ensure: present}, inputs: {}}
  - name: Refresh apt source
    labels: {role: swamp}
    dependsOn: [{step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "refresh-apt-source-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "refresh-apt-source-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.refresh }}', sudo: true}}
    guard: ${{ inputs.intent.manager != "apt" || inputs.intent.repository == null }}
    writes: true
  - name: Read manager version
    labels: {role: swamp}
    dependsOn: [{step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "read-manager-version-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "read-manager-version-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.version }}'}}
  - name: Read installed package
    labels: {role: swamp}
    dependsOn: [{step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "read-installed-package-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "read-installed-package-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.inventory }}', okExitCodes: [0, 1]}}
  - name: Read macOS version
    labels: {role: swamp}
    dependsOn: [{step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Pin repository packages, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ inputs.intent.platform != "macos" || !inputs.intent.manager.startsWith("brew") }}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "read-macos-version-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "read-macos-version-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: [timeout, '60', /usr/bin/sw_vers, -productVersion]}}
  - name: Refresh the cask metadata
    labels: {role: swamp}
    dependsOn: [{step: Read manager version, condition: {type: succeeded}}, {step: Read installed package, condition: {type: succeeded}}]
    guard: ${{ inputs.intent.platform != "linux" || inputs.intent.manager != "brew-cask" }}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "refresh-cask-metadata-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "refresh-cask-metadata-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.refresh }}'}}
  - name: Check the candidate
    labels: {role: swamp}
    dependsOn: [{step: Read manager version, condition: {type: succeeded}}, {step: Read installed package, condition: {type: succeeded}}, {step: Read macOS version, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Refresh the cask metadata, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "check-the-candidate-" + string(inputs.node_id) }}', methodName: exec, globalArgs: {name: '${{ "check-the-candidate-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout", "60"] + steps["Prepare package commands"].outputs.candidate }}'}}
  - name: Choose package action
    labels: {role: swamp}
    dependsOn: [{step: Check the candidate, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tw-decision-" + string(inputs.node_id) }}', methodName: decide, inputs: {input: '${{ inputs.intent }}', version: '${{ steps["Read manager version"] }}', query: '${{ steps["Read installed package"] }}', os: '${{ "Read macOS version" in steps ? steps["Read macOS version"] : null }}', check: '${{ "Check the candidate" in steps ? steps["Check the candidate"] : null }}', refresh: '${{ "Refresh the cask metadata" in steps ? steps["Refresh the cask metadata"] : null }}'}}
    guard: ${{ !("Read manager version" in steps) || !("Read installed package" in steps) }}
  - name: Apply the package
    labels: {role: swamp}
    dependsOn: [{step: Choose package action, condition: {type: succeeded}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("tool-package-apply-" + inputs.intent.manager + "-" + string(inputs.node_id)).split(".").join("-") }}', methodName: exec, inputs: {hosts: 'name:target', timeoutSec: 905, argv: '${{ ["timeout","900"] + steps["Choose package action"].outputs.write }}', sudo: '${{ inputs.intent.manager == "apt" }}'}, globalArgs: {name: '${{ ("tool-package-apply-" + inputs.intent.manager + "-" + string(inputs.node_id)).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}}
  - name: Make the Homebrew prefix readable
    labels: {role: swamp}
    # Whatever the package step did: a failed one can leave files behind, and the run keeps its failure. The rule changes nothing twice.
    dependsOn: [{step: Apply the package, condition: {type: always}}]
    guard: ${{ !("Prepare package commands" in steps) || steps["Prepare package commands"].status != "succeeded" || steps["Prepare package commands"].outputs.readable == null }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "tool-brew-readable-" + string(inputs.node_id) }}', methodName: exec, inputs: {hosts: 'name:target', timeoutSec: 305, argv: '${{ ["timeout","300"] + steps["Prepare package commands"].outputs.readable }}'}, globalArgs: {name: '${{ "tool-brew-readable-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}}
  - name: Check apt package
    labels: {role: swamp}
    dependsOn: [{step: Apply the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate || inputs.intent.manager != "apt" }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/apt', behaviorName: '${{ "tool-apt-end-" + string(inputs.node_id) }}', methodName: check, inputs: {}, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', packages: ['${{ inputs.intent.package }}'], ensure: present}}
  - name: Check the package
    labels: {role: swamp}
    dependsOn: [{step: Apply the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate || inputs.intent.manager == "apt" }}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "tool-command-end-" + string(inputs.node_id) }}', methodName: exec, inputs: {hosts: 'name:target', timeoutSec: 65, argv: '${{ ["timeout","60"] + steps["Prepare package commands"].outputs.inventory }}', okExitCodes: [0, 1]}, globalArgs: {name: '${{ "tool-command-end-" + string(inputs.node_id) }}', transport: {kind: ssh, user: '${{ inputs.ssh.target.user }}', port: '${{ inputs.ssh.target.port }}', identityFile: '${{ inputs.ssh.identity_file }}', hostKeys: '${{ inputs.ssh.target.host_keys }}', identitiesOnly: true}, hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]}}
  - name: Decode package state
    labels: {role: swamp}
    dependsOn: [{step: Check apt package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Check the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps["Choose package action"].outputs.mutate }}
    task: {type: behavior, behaviorType: '@nckrtl/tool-write-command', behaviorName: '${{ "tool-package-observation-" + string(inputs.node_id) }}', methodName: observe, inputs: {input: '${{ inputs.intent }}', after: '${{ !((inputs.intent.manager == "apt" ? "Check apt package" : "Check the package") in steps) || steps[(inputs.intent.manager == "apt" ? "Check apt package" : "Check the package")].status != "succeeded" ? null : inputs.intent.manager == "apt" ? data.latest("tool-apt-end-" + string(inputs.node_id), inputs.ssh.target.host).attributes : steps["Check the package"].outputs }}'}}
  - name: Prefer the verified package
    labels: {role: swamp}
    dependsOn: [{step: Choose package action, condition: {type: always}}, {step: Decode package state, condition: {type: always}}]
    guard: ${{ inputs.intent.repository == null || !("Choose package action" in steps && steps["Choose package action"].status == "succeeded" && steps["Choose package action"].outputs.ready && (!steps["Choose package action"].outputs.mutate || ("Decode package state" in steps && steps["Decode package state"].status == "succeeded" && steps["Decode package state"].outputs.compliant && steps["Decode package state"].outputs.present))) }}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/file', behaviorName: '${{ "prefer-the-verified-package-" + string(inputs.node_id) }}', methodName: apply, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', become: true, path: '${{ "/etc/apt/preferences.d/orbit-" + steps["Prepare package commands"].outputs.repository.name + ".pref" }}', content: '${{ steps["Prepare package commands"].outputs.repository_preferences }}', mode: '0644', owner: root, ensure: present}, inputs: {}}
  - name: Assert package state
    labels: {role: swamp}
    dependsOn: [{step: Choose package action, condition: {type: always}}, {step: Check apt package, condition: {type: always}}, {step: Check the package, condition: {type: always}}, {step: Decode package state, condition: {type: always}}, {step: Prefer the verified package, condition: {type: always}}]
    task: {type: assert, expr: '"Choose package action" in steps && steps["Choose package action"].status == "succeeded" && steps["Choose package action"].outputs.ready && (!steps["Choose package action"].outputs.mutate || ("Decode package state" in steps && steps["Decode package state"].status == "succeeded" && steps["Decode package state"].outputs.compliant && steps["Decode package state"].outputs.present)) && (!("Prefer the verified package" in steps) || steps["Prefer the verified package"].status != "failed")', severity: high, message: The native package end check must match the admitted Tool intent.}
