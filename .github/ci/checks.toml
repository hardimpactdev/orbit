# CI check inputs. Includes are ORed; any !exclude wins, regardless of order.
# ** crosses directories; * and ? stay within one name (selection_regex).
# Costs are pull_request median wall seconds from ci-speed.md (2026-11-11).
# swamp and swamp-shape use the current static control median, not retired fixtures.
# Each executable check uses ceiling seconds rounded up to minutes as its job timeout.

[all-checks]
# Changes to the check machinery run each check job once, without an agent delivery.
inputs = [".github/workflows/ci.yml", ".github/actions/**", ".github/ci/checks.toml", "bin/ci-build-plan"]

[ignored]
# These paths have intentionally paused checks, prose skips, or always-run plan tests.
inputs = ["tools/test_ci_*", "tools/test_swamp_import_base*", "tools/test_frozen_agent_commands*", "apps/desktop/**", "apps/agent/**/*.md", "apps/agent/**/*.mdx", "apps/pi-server/**/*.md", "apps/pi-server/**/*.mdx"]

