id: 8ba8f6c9-0a5e-44da-9710-4bde40935894
name: operation-task-cancel
description: End one task group on 209 (docs/cli/tasks/cancel.mmd); release its task VM, which deletes the VM, its seed clone, its hub peer and its Node. Origin already has the approved work.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.cancel, tasks.maintenance_finish]}
    intent:
      type: object
    execution_secrets: {type: object, additionalProperties: false}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
queueTimeout: 60
jobs:
- name: cancel
  labels: {role: swamp}
  steps:
  # The VM and its seed clone are deleted and its hub peer is removed; the Gateway then deletes its Node.
  - name: Release the slot
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.release == null }}
    task:
      type: workflow
      workflowIdOrName: operation-task-vm-slot-release
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: tasks.cancel
        intent: '${{ inputs.intent.release == null ? {} : inputs.intent.release.intent }}'
        execution_secrets: {}
- name: check
  labels: {role: swamp}
  dependsOn: [{job: cancel, condition: {type: completed}}]
  steps:
  - name: Check the end
    labels: {role: swamp}
    task: {type: assert, expr: 'inputs.intent.release == null || steps["Release the slot"].status == "succeeded"',
      severity: high, message: The task VM was not released.}
