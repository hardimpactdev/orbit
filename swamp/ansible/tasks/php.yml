---
- name: Find PHP-FPM {{ php.version }}
  ansible.builtin.stat: { path: "/usr/sbin/php-fpm{{ php.version }}" }
  register: fpm
  failed_when: not fpm.stat.executable | default(false)
- name: Write the runtime settings
  ansible.builtin.copy:
    dest: "/etc/php/{{ php.version }}/mods-available/orbit-runtime.ini"
    content: "{{ php.runtime_ini }}"
    owner: root
    group: root
    mode: "0644"
  register: runtime_ini
- name: Enable the runtime settings
  ansible.builtin.file:
    src: ../../mods-available/orbit-runtime.ini
    dest: "/etc/php/{{ php.version }}/fpm/conf.d/99-orbit-runtime.ini"
    state: link
    force: true
  register: runtime_link
- name: Set the stop timeout
  ansible.builtin.lineinfile:
    path: "/etc/php/{{ php.version }}/fpm/php-fpm.conf"
    regexp: ^\s*process_control_timeout\s*=
    line: process_control_timeout = 30s
    insertafter: "^\\[global\\]"
  register: stop_timeout
- { name: Test PHP-FPM, ansible.builtin.command: "/usr/sbin/php-fpm{{ php.version }} -t", changed_when: false }
- name: Enable PHP-FPM
  ansible.builtin.systemd: { name: "php{{ php.version }}-fpm.service", enabled: true }
# A Node converge never restarts an Instance's dedicated PHP master.
- name: Reload PHP-FPM # noqa command-instead-of-module no-handler
  when: runtime_ini is changed or runtime_link is changed or stop_timeout is changed
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl', 'try-reload-or-restart', 'php' ~ php.version ~ '-fpm.service']
      + ([] if kind | default('') == 'node.converge' else ['orbit-*-php' ~ php.version ~ '-fpm.service']) }}
  changed_when: true
