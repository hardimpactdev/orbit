id: 5cbf1292-9922-444b-9225-fb2b682111f7
name: cluster-router-probe
description: >-
  Verify one admitted workload TLS endpoint from the candidate Router through
  official SSH.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
queueTimeout: 600
jobs:
  - name: probe
    steps:
      - name: probe
        target: orbit-node-209
        queueTimeout: 600
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "cluster-router-probe-" + run.id }}'
          methodName: exec
          globalArgs:
            name: '${{ "cluster-router-ssh-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.connection.nodeUser }}'
              identityFile: '${{ inputs.intent.connection.nodeIdentityFile }}'
              port: '${{ inputs.intent.connection.nodePort }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.connection.nodeHost }}'
                transport:
                  hostKeys: '${{ inputs.intent.host_keys }}'
          inputs:
            hosts: 'name:target'
            timeoutSec: 40
            argv: '${{ "protocol" in inputs.intent && inputs.intent.protocol == "http" ? ["/bin/sh","-c","#!/bin/sh\n# Keep the process bound in coreutils and identify an expired Router phase.\nphase=$1\nseconds=$2\nshift 2\n/usr/bin/timeout \"$seconds\" \"$@\"\nstatus=$?\nif [ \"$status\" -eq 124 ]; then\n    printf ''%s exceeded %s-second budget\\n'' \"$phase\" \"$seconds\" >&2\nfi\nexit \"$status\"\n","router-phase","Router HTTP probe","10","/usr/bin/curl","--head","--noproxy","*","--silent","--connect-timeout","10","--max-time","10","--output","/dev/null","--header","Host: " + inputs.intent.probe.domain,"http://" + inputs.intent.probe.address + ":" + string(inputs.intent.probe.port) + "/"] : ["/bin/sh","-c","#!/bin/sh\n# Keep the process bound in coreutils and identify an expired Router phase.\nphase=$1\nseconds=$2\nshift 2\n/usr/bin/timeout \"$seconds\" \"$@\"\nstatus=$?\nif [ \"$status\" -eq 124 ]; then\n    printf ''%s exceeded %s-second budget\\n'' \"$phase\" \"$seconds\" >&2\nfi\nexit \"$status\"\n","router-phase","Router TLS probe","10","/usr/bin/openssl","s_client","-quiet","-no_ign_eof","-connect",inputs.intent.probe.address + ":" + string(inputs.intent.probe.port),"-servername",inputs.intent.probe.domain,"-verify_hostname",inputs.intent.probe.domain,"-verify_return_error"] }}'
