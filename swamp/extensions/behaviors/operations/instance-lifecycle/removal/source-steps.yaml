# Composition source for one owning operation-instance-destroy workflow.
# Canonical publication/database/runtime cleanup precedes both finalization jobs.
jobs:
- name: capture_sources
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: public-inputs
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-removal-inputs'
      behaviorName: ${{ "irm-s-1-" + run.id }}
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
  - name: inspect-sources
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: public-inputs
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-s-2-" + run.id }}
      methodName: execute
      inputs:
        run: "set -eu\nif [ \"$ORBIT_ENVIRONMENT\" = production ]; then\n  set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_INTENT\n\
          else\n  set --\nfi\n\"$@\" /usr/bin/python3 \"${{ steps[\"public-inputs\"].outputs.scripts.inspect_sources }}\"\n"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_INTENT: ${{ steps["public-inputs"].outputs.intent_json }}
          ORBIT_ENVIRONMENT: ${{ inputs.intent.environment }}
  - name: captured-inputs
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    dependsOn:
    - step: inspect-sources
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-removal-inputs'
      behaviorName: ${{ "irm-s-3-" + run.id }}
      methodName: capture
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps["inspect-sources"].outputs.stdout }}
- name: finalize_worktrees
  concurrency: 1
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: cleanup
    condition:
      type: succeeded
  steps:
  - name: quarantine-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.worktrees }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-w-4-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: "set -eu\nif [ \"$ORBIT_ENVIRONMENT\" = production ]; then\n  set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER\n\
          else\n  set --\nfi\n\"$@\" /usr/bin/python3 \"${{ steps[\"public-inputs\"].outputs.scripts.quarantine }}\"\n"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
          ORBIT_ENVIRONMENT: ${{ inputs.intent.environment }}
  - name: delete-tree-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.worktrees }}
    dependsOn:
    - step: quarantine-${{ self.member.instance_id }}
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-w-5-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: "set -eu\nif [ \"$ORBIT_ENVIRONMENT\" = production ]; then\n  set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER\n\
          else\n  set --\nfi\n\"$@\" /usr/bin/python3 \"${{ steps[\"public-inputs\"].outputs.scripts.delete_tree }}\"\n"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
          ORBIT_ENVIRONMENT: ${{ inputs.intent.environment }}
  - name: delete-worktree-metadata-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.worktrees }}
    dependsOn:
    - step: delete-tree-${{ self.member.instance_id }}
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-w-6-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: 'set -eu

          /usr/bin/python3 "${{ steps["public-inputs"].outputs.scripts.delete_worktree_metadata }}"

          '
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
- name: finalize_sources
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: finalize_worktrees
    condition:
      type: succeeded
  steps:
  - name: quarantine-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.checkouts }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-s-4-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: "set -eu\nif [ \"$ORBIT_ENVIRONMENT\" = production ]; then\n  set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER\n\
          else\n  set --\nfi\n\"$@\" /usr/bin/python3 \"${{ steps[\"public-inputs\"].outputs.scripts.quarantine }}\"\n"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
          ORBIT_ENVIRONMENT: ${{ inputs.intent.environment }}
  - name: delete-tree-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.checkouts }}
    dependsOn:
    - step: quarantine-${{ self.member.instance_id }}
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-s-5-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: "set -eu\nif [ \"$ORBIT_ENVIRONMENT\" = production ]; then\n  set -- sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER\n\
          else\n  set --\nfi\n\"$@\" /usr/bin/python3 \"${{ steps[\"public-inputs\"].outputs.scripts.delete_tree }}\"\n"
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
          ORBIT_ENVIRONMENT: ${{ inputs.intent.environment }}
  - name: delete-account-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.checkouts }}
    guard: ${{ inputs.intent.environment != "production" }}
    dependsOn:
    - step: delete-tree-${{ self.member.instance_id }}
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-s-7-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: 'set -eu

          sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER /usr/bin/python3 "${{ steps["public-inputs"].outputs.scripts.delete_account
          }}"

          '
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
  - name: delete-marker-${{ self.member.instance_id }}
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    forEach:
      item: member
      in: ${{ steps["captured-inputs"].outputs.checkouts }}
    guard: ${{ inputs.intent.environment != "production" }}
    dependsOn:
    - step: delete-account-${{ self.member.instance_id }}
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "irm-s-8-" + run.id + "-" + string(self._index) }}
      methodName: execute
      inputs:
        run: 'set -eu

          sudo -n --preserve-env=PYTHONPATH,ORBIT_REMOVAL_MEMBER /usr/bin/python3 "${{ steps["public-inputs"].outputs.scripts.delete_marker
          }}"

          '
        env:
          PYTHONPATH: ${{ steps["public-inputs"].outputs.library }}
          ORBIT_REMOVAL_MEMBER: ${{ self.member.input_json }}
