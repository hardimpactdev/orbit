id: 8ba8f6c9-0a5e-44da-9710-4bde40935894
name: operation-task-cancel
description: End one task group on 209; push approved work, withdraw the Route, tear down, destroy the VM, and check it is gone.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.cancel, tasks.maintenance_finish]}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: cancel
  labels: {role: swamp}
  # A step that never ran reads as skipped, so each step names every earlier step it needs.
  steps:
  - name: Push approved work
    labels: {role: swamp}
    guard: ${{ inputs.intent.push == null }}
    task:
      type: workflow
      workflowIdOrName: task-approved-push
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        intent: '${{ inputs.intent.push == null ? {} : inputs.intent.push }}'
        execution_secrets: '${{ inputs.intent.push == null ? {} : {"github_token": inputs.intent.push.github_token} }}'
  - name: Withdraw the Route
    labels: {role: swamp}
    guard: ${{ size(inputs.intent.workspace_routes) == 0 }}
    task:
      type: workflow
      workflowIdOrName: route-mutation-withdraw
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: '${{ size(inputs.intent.workspace_routes) == 0 ? {} : inputs.intent.workspace_routes[0] }}'
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
    dependsOn:
    - step: Push approved work
      condition: &done
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: Run teardown steps
    labels: {role: swamp}
    # Teardown steps are admitted only while the VM is ready; a parked or stopped VM has none.
    guard: '${{ size(inputs.intent.teardown) == 0 || (size(inputs.intent.workspace_routes) > 0 && !steps["Withdraw the Route"].outputs.result.ready) }}'
    task:
      type: workflow
      workflowIdOrName: task-workspace-teardown
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
    dependsOn:
    - step: Push approved work
      condition: *done
    - step: Withdraw the Route
      condition: *done
  - name: Destroy the task VM
    labels: {role: swamp}
    guard: '${{ inputs.intent.task_vm_id == null || (size(inputs.intent.workspace_routes) > 0 && !steps["Withdraw the Route"].outputs.result.ready) }}'
    task:
      type: workflow
      workflowIdOrName: task-vm-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
    dependsOn:
    - step: Push approved work
      condition: *done
    - step: Withdraw the Route
      condition: *done
    - step: Run teardown steps
      condition: *done
  - name: Check the VM is gone
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-cancel-result" }}'
      methodName: execute
      inputs:
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          vm = json.loads(os.environ["VM"])
          gone = vm.get("destroyed") is True and vm.get("cleanup_complete") is True if os.environ["TASK_VM"] == "true" else True
          if os.environ["WITHDRAWN"] != "true" or not gone:
              sys.exit("The Route or the task VM is still there.")
          print(json.dumps({"group_id": int(os.environ["GROUP"]), "instance_id": json.loads(os.environ["INSTANCE"]), "cleanup_complete": True, "vm": vm}))
          PYTHON
        env:
          GROUP: ${{ string(inputs.intent.group_id) }}
          INSTANCE: '${{ inputs.intent.instance_id == null ? "null" : string(inputs.intent.instance_id) }}'
          WITHDRAWN: '${{ string(size(inputs.intent.workspace_routes) == 0 || steps["Withdraw the Route"].outputs.result.ready) }}'
          TASK_VM: ${{ string(inputs.intent.task_vm_id != null) }}
          # The destroy child prints no result: its success proves the VM gone, and the Gateway builds the receipt from the captured intent.
          # A destroy step its guard skipped has no entry in `steps`, so the guard's own test comes before the step is read.
          VM: '${{ inputs.intent.task_vm_id == null || (size(inputs.intent.workspace_routes) > 0 && !steps["Withdraw the Route"].outputs.result.ready) || steps["Destroy the task VM"].status != "succeeded" ? "{}" : "{\"destroyed\": true, \"cleanup_complete\": true}" }}'
    dependsOn:
    - step: Push approved work
      condition: *done
    - step: Withdraw the Route
      condition: *done
    - step: Run teardown steps
      condition: *done
    - step: Destroy the task VM
      condition: *done
queueTimeout: 60
