  - job: firewall
    condition:
      type: always
  - job: dns
    condition:
      type: always
  - job: grace
    condition:
      type: always
  - job: retire
    condition:
      type: always
  - job: retired_hosts
    condition:
      type: always
  - job: retired_dns
    condition:
      type: always
  - job: cleanup
