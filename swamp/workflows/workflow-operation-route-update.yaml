        run_id: ${{ run.id }}
        requests: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.intent.node_ids.map(node,
          data.latest("certificate-node-" + string(node), "requests-" + run.id).attributes.requests) }}
        leaves: ${{ data.latest("route-convergence-node-" + string(inputs.node_id), "admission-" + run.id).attributes.update.previous.certificates
          }}
        native_stdout: ${{ steps["restore-certificate-sign-http"].outputs.stdout }}
    guard: ${{ !(((steps.exists(name, steps[name].status == "failed")) && (data.latest("route-convergence-node-"
      + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode == "web_root" || (data.latest("route-convergence-node-"
      + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode == "publication" && !("public-state"
      in steps && steps["public-state"].status == "succeeded")) || (data.latest("route-convergence-node-"
      + string(inputs.node_id), "admission-" + run.id).attributes.intent.mode == "replace_domain" && !("cutover"
      in steps && steps["cutover"].status == "succeeded")))) && data.latest("route-convergence-node-" +
      string(inputs.node_id), "admission-" + run.id).attributes.intent.mode == "web_root") }}
    writes: true
    dependsOn:
    - step: restore-certificate-sign-http
      condition:
        type: succeeded
