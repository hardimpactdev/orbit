id: daace7ba-223f-47b6-9452-7c0da7cf384e
name: operation-node-converge-direct
description: One exact-Node native footprint DAG per admitted standalone worker-backed converge intent.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
        - node.converge
  required:
    - operation_id
    - node_id
    - kind
  additionalProperties: false
target: ${{ "orbit-node-" + string(inputs.node_id) }}
labels:
  node: ${{ string(inputs.node_id) }}
jobs:
  - name: admission
    steps:
      - name: admit
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: admit
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
  - name: agent_install_job
    dependsOn:
      - job: admission
        condition:
          type: succeeded
    steps:
      - name: agent_install_cancellation
        writes: false
        guard: ${{ !steps.admit.outputs.ready }}
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: observe
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            stage: agent-install
      - name: agent_install
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: stage
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            admission: ${{ steps.admit.outputs }}
            stage: agent-install
            binary_changed: false
            cancellation: ${{ steps.agent_install_cancellation.outputs }}
        guard: ${{ !steps.admit.outputs.ready }}
        dependsOn:
          - step: agent_install_cancellation
            condition:
              type: succeeded
      - name: agent_install_proven
        guard: ${{ !steps.admit.outputs.ready }}
        dependsOn:
          - step: agent_install
            condition:
              type: succeeded
        task:
          type: assert
          expr: steps.agent_install.outputs.ok
          message: The agent-install stage refused its admitted footprint
          severity: high
  - name: caddy_package_job
    dependsOn:
      - job: agent_install_job
        condition:
          type: succeeded
    steps:
      - name: caddy_package_cancellation
        writes: false
        guard: ${{ !steps.admit.outputs.ready }}
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: observe
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
            stage: caddy-package
      - name: caddy_package
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
          behaviorName: ${{ "node-converge-" + string(inputs.node_id) }}
          methodName: stage
          inputs:
            operation_id: ${{ inputs.operation_id }}
            node_id: ${{ inputs.node_id }}
            kind: ${{ inputs.kind }}
            run_id: ${{ run.id }}
