name: PHP build mirror

# Sury deletes a build from its pool when it publishes the next one. This workflow keeps every pinned PHP file of the
# machine software recipe as an asset of the php-build-mirror release, named <package>_<sha256>.deb. php.install-build
# tries this mirror before the pin's own Sury URL, so a rollback, a new Node, or CI still gets the exact build after
# Sury moves on. See ADR 0215.
on:
  push:
    branches: [main]
    paths:
      - apps/gateway/resources/machine-software/recipe.json
      - bin/php-build
      - .github/workflows/php-build-mirror.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: php-build-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror the pinned PHP files
    if: github.repository == 'nckrtl/orbit'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Each download is checked against its recipe SHA-256 digest before it is kept.
      - name: Download every pinned PHP file
        run: python3 bin/php-build mirror --directory "$RUNNER_TEMP/php-build-mirror"

      - name: Publish the files that the release does not hold yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=php-build-mirror
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --prerelease --latest=false --title 'PHP build mirror' \
              --notes 'The pinned Sury PHP packages of the machine software recipe, named <package>_<sha256>.deb. See ADR 0215.'
          fi
          present=$(gh release view "$release" --json assets --jq '.assets[].name')
          for file in "$RUNNER_TEMP"/php-build-mirror/*.deb; do
            if ! grep -qxF "$(basename "$file")" <<<"$present"; then
              gh release upload "$release" "$file"
            fi
          done
