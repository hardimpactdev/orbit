id: fe3065e0-fba6-4bf4-9a2e-2db2ca06b2db
name: operation-task-vm-ready-copies
description: >-
  Save the ready copies of the nested fleet that runs in a task VM (stage 6, "Save the new images") and boot-check them. The nested guests are system containers. The copies are self-contained, with their own state, no checkout device, no operator key and no Club key. Each step is one incus command over official SSH, once per nested container.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.ready_copies}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^swamp-proof-club-api-key$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: keys
  labels: {role: swamp}
  steps:
  # The Gateway database is the one its own `.env` names. The state is on the guest's own disk, so this does not need the checkout device.
  - name: 'Read the database path'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-database-path").split(".").join("-") }}', methodName: exec,
      globalArgs: &vm {name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-database-path").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}',
        identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}',
        transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'grep', '-m1', '^DB_DATABASE=', '/var/lib/orbit-checkout-state/apps/gateway/.env'], timeoutSec: 40}}
  # The copies hold no WireGuard key of the operator, so the key of the VM that made them works nowhere else (stage 2 makes a new one).
  # The Node record, then the peer on the Gateway hub, in its peer file (`orbit-peers.d`, which the hub loads at start). Both are end states.
  - name: 'Remove the operator key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-operator-key").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-operator-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sqlite3', '${{ steps["Read the database path"].outputs.stdout.split("\n")[0].split("=")[1] }}', 'update nodes set wireguard_public_key = null where name = ''operator'''], timeoutSec: 70}}
    dependsOn: [{step: 'Read the database path', condition: {type: succeeded}}]
  - name: 'Remove the operator peer'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-operator-peer").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-operator-peer").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'find', '/etc/wireguard', '-type', 'f', '-name', '*.conf', '-exec', 'perl', '-0pi', '-e', 's/\n?\[Peer\]\n(?:#[^\n]*\n)?PublicKey = [^\n]*\nAllowedIPs = 10\.45\.0\.10\/32\n?//', '{}', '+'], timeoutSec: 40}}
  # The proof Swamp Club key is in no copy. The Gateway is the only guest that holds it.
  - name: 'Delete the Club key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-delete-the-club-key").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-delete-the-club-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'rm', '-f', '/home/orbit/.config/swamp/api-key'], timeoutSec: 40}}
  # The key is searched by value in every file of each guest, with the key on standard input. grep exits 0 on a match and 1 on none, and `incus` exits 1
  # on its own errors too, so the shell prints grep's status and the end check requires `scan-exit=1`.
  - name: 'Scan for the Club key'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-scan-for-the-club-key" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-scan-for-the-club-key" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '900', 'incus', 'exec', '${{ inputs.intent.fleet.guests[self.role] }}', '--', 'sh', '-c', 'grep -rlF --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run -f - /; echo scan-exit=$?'], stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}', timeoutSec: 910}}
    dependsOn: [{step: 'Delete the Club key', condition: {type: succeeded}}]
- name: copy
  labels: {role: swamp}
  dependsOn: [{job: keys, condition: {type: succeeded}}]
  steps:
  # What the copies store about the nested network: its subnet, and each Node MAC and address. A task VM creates the network from them.
  - name: 'Read the subnet'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-subnet").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-subnet").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'network', 'get', '${{ inputs.intent.fleet.network }}', 'ipv4.address'], timeoutSec: 40}}
  - name: 'Read the MAC'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-mac" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-mac" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'device', 'get', '${{ inputs.intent.fleet.guests[self.role] }}', 'eth0', 'hwaddr'], timeoutSec: 40}}
  - name: 'Read the address'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-address" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-address" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'device', 'get', '${{ inputs.intent.fleet.guests[self.role] }}', 'eth0', 'ipv4.address'], timeoutSec: 40}}
  - name: 'Read the time'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-time").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-time").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['date', '-u', '+%Y-%m-%dT%H:%M:%SZ'], timeoutSec: 20}}
  # A clean stop, so a copy holds finished file systems.
  - name: 'Stop the nested containers'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-stop-the-nested-containers").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-stop-the-nested-containers").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '300', 'incus', 'stop', '${{ inputs.intent.fleet.guests.gateway }}', '${{ inputs.intent.fleet.guests["app-dev"] }}', '${{ inputs.intent.fleet.guests["app-prod"] }}'], timeoutSec: 310}}
  # The fleet started from the earlier copies, so they exist; the seed holds one set. A rerun after a failed copy finds some names gone, which is no error:
  # a copy step that finds a name left fails.
  - name: 'Remove the old copies'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-old-copies").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-old-copies").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'delete', '--force', 'fleet-ready-gateway', 'fleet-ready-app-dev', 'fleet-ready-app-prod'], okExitCodes: any, timeoutSec: 130}}
    dependsOn: [{step: 'Stop the nested containers', condition: {type: succeeded}}]
  # `--instance-only` leaves the `base` snapshot of the earlier fleet behind.
  - name: 'Copy the guests'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-copy-the-guests" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-copy-the-guests" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'incus', 'copy', '--instance-only', '${{ inputs.intent.fleet.guests[self.role] }}', '${{ "fleet-ready-" + self.role }}'], timeoutSec: 610}}
    dependsOn: [{step: 'Remove the old copies', condition: {type: succeeded}}]
  # A copy with a NIC would keep the network in use, and its MAC and address from a second VM.
  - name: 'Remove the NIC'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-nic" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-nic" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'config', 'device', 'remove', '${{ "fleet-ready-" + self.role }}', 'eth0'], timeoutSec: 40}}
    dependsOn: [{step: 'Copy the guests', condition: {type: succeeded}}]
  # A copy with the checkout device would name the checkout of this VM: a task VM attaches its own when it starts the copies.
  - name: 'Remove the checkout device'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-checkout-device" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-checkout-device" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'config', 'device', 'remove', '${{ "fleet-ready-" + self.role }}', 'checkout'], timeoutSec: 40}}
    dependsOn: [{step: 'Copy the guests', condition: {type: succeeded}}]
  # Keys on each copy: role, set identity, time, subnet, MAC and address.
  - name: 'Record the network'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-record-the-network" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-record-the-network" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'config', 'set', '${{ "fleet-ready-" + self.role }}', '${{ "user.ready.hwaddr=" + steps["Read the MAC-" + self.role].outputs.stdout.split("\n")[0] }}', '${{ "user.ready.ipv4=" + steps["Read the address-" + self.role].outputs.stdout.split("\n")[0] }}', '${{ "user.ready.subnet=" + steps["Read the subnet"].outputs.stdout.split("\n")[0] }}', '${{ "user.ready.role=" + self.role }}', '${{ "user.ready.set=" + steps["Read the time"].outputs.stdout.split("\n")[0] }}', '${{ "user.ready.made=" + steps["Read the time"].outputs.stdout.split("\n")[0] }}'], timeoutSec: 40}}
    dependsOn: [{step: 'Remove the NIC', condition: {type: succeeded}}, {step: 'Remove the checkout device', condition: {type: succeeded}}, {step: 'Read the MAC', condition: {type: succeeded}}, {step: 'Read the address', condition: {type: succeeded}}, {step: 'Read the subnet', condition: {type: succeeded}}, {step: 'Read the time', condition: {type: succeeded}}]
  # Written last, on every copy, after all three have their keys: a set without it is half made.
  - name: 'Complete the set'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-complete-the-set" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-complete-the-set" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'config', 'set', '${{ "fleet-ready-" + self.role }}', '${{ "user.ready.complete=" + steps["Read the time"].outputs.stdout.split("\n")[0] }}', '${{ "user.ready.format=" + inputs.intent.fleet.format }}'], timeoutSec: 40}}
    dependsOn: [{step: 'Record the network', condition: {type: succeeded}}]
- name: check
  labels: {role: swamp}
  dependsOn: [{job: copy, condition: {type: succeeded}}]
  steps:
  # Boot-check: a throwaway copy of each ready copy starts and is checked; the ready copy itself is never started.
  # A killed run leaves its throwaway copies; a copy of the same name would fail.
  - name: 'Remove stale check copies'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-stale-check-copies").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-stale-check-copies").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'delete', '--force', 'ready-check-gateway', 'ready-check-app-dev', 'ready-check-app-prod'], okExitCodes: any, timeoutSec: 130}}
  - name: 'Copy to check'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-copy-to-check" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-copy-to-check" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'incus', 'copy', '${{ "fleet-ready-" + self.role }}', '${{ "ready-check-" + self.role }}'], timeoutSec: 610}}
    dependsOn: [{step: 'Remove stale check copies', condition: {type: succeeded}}]
  - name: 'Start to check'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-start-to-check" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-start-to-check" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'start', '${{ "ready-check-" + self.role }}'], timeoutSec: 130}}
    dependsOn: [{step: 'Copy to check', condition: {type: succeeded}}]
  # A container has no guest agent: `cloud-init status --wait` blocks from the first moment of the boot (exit 2 is a finished boot with a recoverable warning).
  - name: 'Wait for cloud-init'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-wait-for-cloud-init" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-wait-for-cloud-init" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '130', 'incus', 'exec', '${{ "ready-check-" + self.role }}', '--', 'cloud-init', 'status', '--wait'], okExitCodes: [0, 2], timeoutSec: 140}}
    dependsOn: [{step: 'Start to check', condition: {type: succeeded}}]
  # The same scan as before the stop, on the stored copy: files the guest wrote while it stopped are searched too.
  - name: 'Search for the Club key'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-search-for-the-club-key" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-search-for-the-club-key" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '900', 'incus', 'exec', '${{ "ready-check-" + self.role }}', '--', 'sh', '-c', 'grep -rlF --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev --exclude-dir=run -f - /; echo scan-exit=$?'], stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}', timeoutSec: 910}}
    dependsOn: [{step: 'Wait for cloud-init', condition: {type: succeeded}}]
  # The copy holds no checkout: no file under /home/orbit/orbit but the log a booted guest writes there. The directories it makes (mount points, log directories) are no checkout.
  - name: 'Look for a checkout'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-look-for-a-checkout" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-look-for-a-checkout" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ "ready-check-" + self.role }}', '--', 'find', '/home/orbit/orbit', '-type', 'f', '-not', '-path', '*/storage/logs/*'], timeoutSec: 40}}
    dependsOn: [{step: 'Wait for cloud-init', condition: {type: succeeded}}]
  # The state stays on the guest's own disk; the apply step puts it over the checkout.
  - name: 'Look for the state'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-look-for-the-state" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-look-for-the-state" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ "ready-check-" + self.role }}', '--', 'stat', '-c', '%n', '/var/lib/orbit-checkout-state/apps/gateway/.env', '/var/lib/orbit-checkout-state/apps/gateway/storage', '/var/lib/orbit-checkout-state/apps/gateway/bootstrap/cache'], timeoutSec: 40}}
    dependsOn: [{step: 'Wait for cloud-init', condition: {type: succeeded}}]
  # The Gateway database is the one its own `.env` names, the one the key step updated.
  - name: 'Read the stored database path'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-stored-database-path").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-stored-database-path").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', 'ready-check-gateway', '--', 'grep', '-m1', '^DB_DATABASE=', '/var/lib/orbit-checkout-state/apps/gateway/.env'], timeoutSec: 40}}
    dependsOn: [{step: 'Wait for cloud-init', condition: {type: succeeded}}]
  - name: 'Read the operator keys'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-operator-keys").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-operator-keys").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', 'ready-check-gateway', '--', 'sqlite3', '${{ steps["Read the stored database path"].outputs.stdout.split("\n")[0].split("=")[1] }}', 'select count(*) from nodes where name = ''operator'' and wireguard_public_key is not null'], timeoutSec: 40}}
    dependsOn: [{step: 'Read the stored database path', condition: {type: succeeded}}]
  # The hub has no peer of the operator: grep finds nothing and exits 1. The shell prints the status, as for the scans.
  - name: 'Look for the operator peer'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-look-for-the-operator-peer").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-look-for-the-operator-peer").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', 'ready-check-gateway', '--', 'sh', '-c', 'grep -rq ''10\.45\.0\.10/32'' /etc/wireguard; echo peer-exit=$?'], timeoutSec: 40}}
    dependsOn: [{step: 'Wait for cloud-init', condition: {type: succeeded}}]
  - name: 'Read the devices'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-devices" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-devices" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'device', 'list', '${{ "fleet-ready-" + self.role }}'], timeoutSec: 40}}
  # A copy of the VM kind, or of an older format, is not usable by container steps: the end check requires containers of the current format.
  - name: 'Read the instance type'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-instance-type" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-instance-type" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'list', '${{ "fleet-ready-" + self.role }}', '--format', 'csv', '--columns', 't'], timeoutSec: 40}}
  - name: 'Read the format'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-format" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-read-the-format" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'get', '${{ "fleet-ready-" + self.role }}', 'user.ready.format'], timeoutSec: 40}}
- name: cleanup
  labels: {role: swamp}
  dependsOn: [{job: check, condition: {type: completed}}]
  steps:
  # Runs after success, failure and cancellation. A check copy that was never made is not an error.
  - name: 'Remove the check copies'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-check-copies").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("ready-copies-" + string(inputs.intent.guest_node_id) + "-remove-the-check-copies").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'delete', '--force', 'ready-check-gateway', 'ready-check-app-dev', 'ready-check-app-prod'], okExitCodes: any, timeoutSec: 130}}
- name: end
  labels: {role: swamp}
  dependsOn: [{job: check, condition: {type: succeeded}}, {job: cleanup, condition: {type: succeeded}}]
  steps:
  # No operator key in the record or on the hub, no Club key before and after the stop, containers of the current format, no NIC and no checkout device. The state check fails its own step.
  - name: Check the ready copies
    labels: {role: swamp}
    task:
      type: assert
      expr: 'steps["Read the operator keys"].outputs.stdout.split("\n")[0] == "0" && steps["Look for the operator peer"].outputs.stdout.startsWith("peer-exit=1") && [0, 1, 2].all(i, steps["Scan for the Club key-" + ["gateway", "app-dev", "app-prod"][i]].outputs.stdout.startsWith("scan-exit=1") && steps["Search for the Club key-" + ["gateway", "app-dev", "app-prod"][i]].outputs.stdout.startsWith("scan-exit=1") && !steps["Read the devices-" + ["gateway", "app-dev", "app-prod"][i]].outputs.stdout.contains("eth0") && !steps["Read the devices-" + ["gateway", "app-dev", "app-prod"][i]].outputs.stdout.contains("checkout") && steps["Read the instance type-" + ["gateway", "app-dev", "app-prod"][i]].outputs.stdout.split("\n")[0] == "CONTAINER" && steps["Read the format-" + ["gateway", "app-dev", "app-prod"][i]].outputs.stdout.split("\n")[0] == inputs.intent.fleet.format) && [0, 1].all(i, steps["Look for a checkout-" + ["gateway", "app-dev"][i]].outputs.stdout == "")'
      severity: high
      message: The ready copies are not self-contained.
