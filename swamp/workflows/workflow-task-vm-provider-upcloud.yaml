id: c45e0963-7699-4f7c-88d3-54fbe75a749e
name: task-vm-provider-upcloud
description: Create the exact admitted UpCloud VM from 209 with inline API requests; no guest worker or Gateway callback.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-upcloud-token|task-vm-provider-bootstrap-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: provider
  labels: {role: swamp}
  steps:
  - name: list
    labels: {role: swamp}
    task: &list
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "cloud" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --header 'Accept: application/json' 'https://api.upcloud.com/1.3/server?label=orbit-task-vm'
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: plans
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "cloud" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --header 'Accept: application/json' https://api.upcloud.com/1.3/plan
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: choose
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-cloud-input'
      behaviorName: '${{ "cloud-input" }}'
      methodName: choose
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.list.outputs.stdout }}
        plans_stdout: ${{ steps.plans.outputs.stdout }}
    dependsOn:
    - step: list
      condition:
        type: succeeded
    - step: plans
      condition:
        type: succeeded
  # The create answer is discarded; the label list below finds the server, also after a lost answer.
  - name: create
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "cloud" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --variable %ORBIT_BOOTSTRAP_PRIVATE_KEY --request POST --header 'Content-Type: application/json' \
            --expand-data "$ORBIT_CREATE_DATA" --output /dev/null https://api.upcloud.com/1.3/server
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_BOOTSTRAP_PRIVATE_KEY: ${{ vault.get(inputs.execution_secrets.bootstrap.vault, inputs.execution_secrets.bootstrap.key) }}
          ORBIT_CREATE_DATA: ${{ steps.choose.outputs.create_data }}
    dependsOn:
    - step: choose
      condition:
        type: succeeded
    guard: ${{ steps.choose.outputs.provider_id != null }}
    allowFailure: true
  - name: discover
    labels: {role: swamp}
    task: *list
    dependsOn:
    - step: create
      condition:
        type: always
    - step: choose
      condition:
        type: succeeded
  - name: selected
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-cloud-input'
      behaviorName: '${{ "cloud-input" }}'
      methodName: choose
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.discover.outputs.stdout }}
        plans_stdout: ${{ steps.plans.outputs.stdout }}
        existing: true
    dependsOn:
    - step: discover
      condition:
        type: succeeded
  - name: inspect
    labels: {role: swamp}
    task: &detail
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "cloud" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --header 'Accept: application/json' "https://api.upcloud.com/1.3/server/$ORBIT_UUID"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ steps.selected.outputs.provider_id }}
    dependsOn:
    - step: selected
      condition:
        type: succeeded
  - name: observed
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-cloud-input'
      behaviorName: '${{ "cloud-input" }}'
      methodName: observe
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.inspect.outputs.stdout }}
        provider_id: ${{ steps.selected.outputs.provider_id }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
  - name: start
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "cloud" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request POST --header 'Content-Type: application/json' --data '{"server":{}}' --output /dev/null "https://api.upcloud.com/1.3/server/$ORBIT_UUID/start"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ steps.selected.outputs.provider_id }}
    dependsOn:
    - step: observed
      condition:
        type: succeeded
    guard: ${{ steps.observed.outputs.state == "started" }}
    allowFailure: true
  - name: observe
    labels: {role: swamp}
    task: *detail
    dependsOn:
    - step: start
      condition:
        type: always
    - step: observed
      condition:
        type: succeeded
  - name: provider
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-cloud-input'
      behaviorName: '${{ "cloud-input" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.observe.outputs.stdout }}
        provider_id: ${{ steps.selected.outputs.provider_id }}
    dependsOn:
    - step: observe
      condition:
        type: succeeded
