id: f494f606-0050-446e-a025-25b6c160578c
name: operation-fleet
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "4 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-fleet-discovery
          methodName: discover
          inputs:
            family: operation-fleet
            kinds: [
              "fleet.recipe",
              "fleet.rollout",
              "fleet.cli_converge",
            ]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-fleet"
          behaviorName: '${{ "operation-fleet-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: "${{ self.work.kind }}"
            worker: "${{ self.work.worker }}"
