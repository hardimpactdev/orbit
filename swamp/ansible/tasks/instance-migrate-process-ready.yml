---
# Migration alone must catch a worker that starts and immediately exits before the Route can move. Five seconds spans an
# immediate exec failure and its restart, without extending readiness on deploy, create, inspection or direct process actions.
- name: Require the moved Process to stay running
  block:
    - name: Wait for the moved Process to finish starting
      ansible.builtin.command:
        argv: >-
          {{ as_root + ['timeout', '5', 'systemctl', 'show', '--property=ActiveState', '--property=Job',
              '--property=MainPID', '--property=NRestarts', '--', moved_process.name] }}
      register: moved_process_ready
      changed_when: false
      until: >-
        moved_process_ready.rc == 0 and 'ActiveState=active' in moved_process_ready.stdout_lines
        and 'Job=' in moved_process_ready.stdout_lines
        and moved_process_ready.stdout_lines | select('match', '^MainPID=[1-9][0-9]*$') | list | length == 1
        and moved_process_ready.stdout_lines | select('match', '^NRestarts=[0-9]+$') | list | length == 1
      retries: 10
      delay: 1

    - name: Let the moved Process settle before cutover
      ansible.builtin.pause:
        seconds: 5

    - name: Read the moved Process after settling
      ansible.builtin.command:
        argv: >-
          {{ as_root + ['timeout', '5', 'systemctl', 'show', '--property=ActiveState', '--property=Job',
              '--property=MainPID', '--property=NRestarts', '--', moved_process.name] }}
      register: moved_process_settled
      changed_when: false

    - name: Require the same running Process without a restart or pending job
      ansible.builtin.assert:
        that: moved_process_settled.stdout_lines | sort == moved_process_ready.stdout_lines | sort
        fail_msg: instance.migrate_processes_failed
        quiet: true
  rescue:
    - name: Name the Process that could not stay running
      ansible.builtin.set_fact:
        migrate_process_failure:
          error_code: instance.migrate_processes_failed
          error_message: "Process {{ moved_process.name }} did not stay active with the same MainPID and NRestarts and no pending job for 5 seconds."
    - name: Fail before migration cutover
      ansible.builtin.fail:
        msg: instance.migrate_processes_failed
