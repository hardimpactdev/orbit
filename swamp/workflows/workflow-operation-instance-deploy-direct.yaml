id: 738a2f9d-dc6c-4754-92c3-f51de9cb91f9
name: operation-instance-deploy-direct
description: 'Development deploy as official SSH argv from 209, and the production release deploy of docs/cli/instance/deploy.mmd: official SSH argv and cfgmgmt from 209, as the Instance account.'
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - instance.deploy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(process-parent-operation-[1-9][0-9]*-node-[1-9][0-9]*-member-[1-9][0-9]*|(development|instance)-deploy-operation-[1-9][0-9]*-(step-([0-9]|[12][0-9]|3[01])|credential)|instance-environment-(testing-)?[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: development-source
  labels:
    role: swamp
  steps:
  - name: Write the fetch credential
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: &id001
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts: &id002
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - umask 077 && exec cat > "$1"
        - sh
        - ${{ "/tmp/orbit-git-credential-" + run.id }}
        timeoutSec: 60
        stdin: ${{ vault.get(inputs.execution_secrets.credential.vault, inputs.execution_secrets.credential.key) }}
  - name: Fetch the branch
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Write the fetch credential
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '300'
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -c
        - credential.helper=
        - -c
        - ${{ "credential.helper=store --file=/tmp/orbit-git-credential-" + run.id }}
        - -c
        - protocol.allow=never
        - -c
        - protocol.https.allow=always
        - -c
        - http.followRedirects=false
        - -c
        - 'url.https://github.com/.insteadOf=git@github.com:'
        - -c
        - url.https://github.com/.insteadOf=ssh://git@github.com/
        - -C
        - ${{ inputs.intent.deployment.home }}
        - fetch
        - --quiet
        - --no-tags
        - --
        - ${{ inputs.intent.deployment.repository }}
        - ${{ "+refs/heads/" + inputs.intent.deployment.branch + ":refs/remotes/origin/" + inputs.intent.deployment.branch }}
        timeoutSec: 310
  - name: Remove the fetch credential
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Fetch the branch
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -f
        - --
        - ${{ "/tmp/orbit-git-credential-" + run.id }}
        timeoutSec: 60
  - name: Check tracked changes
    labels:
      role: swamp
    dependsOn:
    - step: Fetch the branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - diff
        - --quiet
        - HEAD
        - --
        timeoutSec: 60
  - name: Resolve the commit
    labels:
      role: swamp
    dependsOn:
    - step: Check tracked changes
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - --end-of-options
        - '${{ (inputs.intent.commit == null ? "refs/remotes/origin/" + inputs.intent.deployment.branch : inputs.intent.commit) + "^{commit}" }}'
        timeoutSec: 60
  - name: Count commits after it
    labels:
      role: swamp
    dependsOn:
    - step: Resolve the commit
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-list
        - --first-parent
        - --count
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() + "..refs/remotes/origin/" + inputs.intent.deployment.branch }}
        timeoutSec: 60
  - name: Read the branch at that depth
    labels:
      role: swamp
    dependsOn:
    - step: Count commits after it
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - rev-parse
        - --verify
        - --end-of-options
        - ${{ "refs/remotes/origin/" + inputs.intent.deployment.branch + "~" + steps["Count commits after it"].outputs.stdout.trim() + "^{commit}" }}
        timeoutSec: 60
  - name: Check it is on the branch
    dependsOn:
    - step: Read the branch at that depth
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: assert
      severity: high
      message: The commit is not on the branch.
      expr: steps["Read the branch at that depth"].outputs.stdout.trim() == steps["Resolve the commit"].outputs.stdout.trim()
  - name: Read the local branch
    labels:
      role: swamp
    dependsOn:
    - step: Check it is on the branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - for-each-ref
        - --format=%(objectname)
        - ${{ "refs/heads/" + inputs.intent.deployment.branch }}
        timeoutSec: 60
  - name: Check the local branch
    labels:
      role: swamp
    dependsOn:
    - step: Read the local branch
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" || steps["Read the local branch"].outputs.stdout.trim() == "" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - merge-base
        - --is-ancestor
        - ${{ "refs/heads/" + inputs.intent.deployment.branch }}
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 60
  - name: List untracked entries
    labels:
      role: swamp
    dependsOn:
    - step: Read the local branch
      condition:
        type: succeeded
    - step: Check the local branch
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - ls-files
        - -z
        - --others
        - --directory
        timeoutSec: 60
  - name: List the target directories
    labels:
      role: swamp
    dependsOn:
    - step: List untracked entries
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - ls-tree
        - -d
        - -r
        - -z
        - --name-only
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 60
  - name: Plan the cleanup
    labels:
      role: swamp
    dependsOn:
    - step: List the target directories
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/development-deploy'
      behaviorName: ${{ "dev-cleanup-plan" }}
      methodName: cleanup
      inputs:
        home: ${{ inputs.intent.deployment.home }}
        untracked: ${{ steps["List untracked entries"].outputs.stdout }}
        directories: ${{ steps["List the target directories"].outputs.stdout }}
- name: development-checkout
  labels:
    role: swamp
  dependsOn:
  - job: development-source
    condition:
      type: succeeded
  steps:
  - name: Check the checkout lock
    labels:
      role: swamp
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/flock
        - --nonblock
        - --conflict-exit-code
        - '73'
        - ${{ inputs.intent.deployment.home }}
        - /bin/true
        timeoutSec: 60
  - name: Clean stale directories
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check the checkout lock
      condition:
        type: succeeded
    guard: ${{ inputs.intent.deployment.variant != "development" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv: ${{ self.action }}
        timeoutSec: 300
    forEach:
      item: action
      in: '${{ inputs.intent.deployment.variant != "development" ? [] : steps["Plan the cleanup"].outputs.actions }}'
    concurrency: 1
  - name: Check out the commit
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Check the checkout lock
      condition:
        type: succeeded
    - step: Clean stale directories
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "development" || steps.exists(k, k.startsWith("Clean stale directories") && steps[k].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-dev-" + string(inputs.node_id) }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/flock
        - --nonblock
        - --conflict-exit-code
        - '73'
        - ${{ inputs.intent.deployment.home }}
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.deployment.home }}
        - checkout
        - --quiet
        - --no-track
        - -B
        - ${{ inputs.intent.deployment.branch }}
        - ${{ steps["Resolve the commit"].outputs.stdout.trim() }}
        timeoutSec: 300
- name: production-release
  labels:
    role: swamp
  steps:
  - name: Write the release credential
    labels:
      role: swamp
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "instance-deploy-credential-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.production.user }}
        path: ${{ inputs.intent.production.credential }}
        ensure: present
        mode: '0600'
        content: ${{ vault.get(inputs.execution_secrets.credential.vault, inputs.execution_secrets.credential.key) }}
      inputs: {}
  - name: Prepare the release
    labels:
      role: swamp
    dependsOn:
    - step: Write the release credential
      condition:
        type: always
    writes: true
    forEach:
      item: action
      in: ${{ inputs.intent.production.prepare }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-prepare-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-prepare-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["/usr/bin/timeout", "900", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--"] + self.action.argv }}
        okExitCodes: ${{ self.action.ok }}
        timeoutSec: 910
  - name: Remove the release credential
    labels:
      role: swamp
    dependsOn:
    - step: Write the release credential
      condition:
        type: always
    - step: Prepare the release
      condition:
        type: always
    writes: true
    guard: ${{ inputs.intent.deployment.variant != "production" }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "instance-deploy-credential-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.production.user }}
        path: ${{ inputs.intent.production.credential }}
        ensure: absent
      inputs: {}
  - name: Link the release
    labels:
      role: swamp
    dependsOn:
    - step: Remove the release credential
      condition:
        type: always
    writes: true
    forEach:
      item: link
      in: ${{ inputs.intent.production.links }}
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/link'
      behaviorName: ${{ "instance-deploy-link-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        path: ${{ self.link.path }}
        ensure: present
        target: ${{ self.link.target }}
        owner: ${{ inputs.intent.production.user }}
        group: ${{ inputs.intent.production.user }}
      inputs: {}
  - name: Read the release commit
    labels:
      role: swamp
    dependsOn:
    - step: Remove the release credential
      condition:
        type: always
    - step: Link the release
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-read-commit-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-read-commit-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: ${{ ["/usr/bin/timeout", "30", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--"] + ["/usr/bin/env", "GIT_CONFIG_NOSYSTEM=1", "GIT_CONFIG_GLOBAL=/dev/null", "/usr/bin/git",
          "-c", "core.hooksPath=/dev/null", "-C", inputs.intent.production.release_path] + ["rev-parse", "--verify", "HEAD"] }}
        timeoutSec: 40
  - name: Read the first-parent chain
    labels:
      role: swamp
    dependsOn:
    - step: Read the release commit
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || inputs.intent.production.commit == null || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-read-chain-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-read-chain-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv: '${{ ["/usr/bin/timeout", "60", "/usr/bin/sudo", "-n", "-H", "-u", inputs.intent.production.user, "--"] + ["/usr/bin/env", "GIT_CONFIG_NOSYSTEM=1", "GIT_CONFIG_GLOBAL=/dev/null", "/usr/bin/git",
          "-c", "core.hooksPath=/dev/null", "-C", inputs.intent.production.release_path] + ["rev-list", "--first-parent", "refs/remotes/origin/" + inputs.intent.production.branch, "--not", (inputs.intent.production.commit
          == null ? "" : inputs.intent.production.commit) + "^@"] }}'
        timeoutSec: 70
  - name: Check the commit is on the branch
    labels:
      role: swamp
    dependsOn:
    - step: Read the first-parent chain
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || inputs.intent.production.commit == null || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: assert
      severity: high
      message: The commit is not on the branch's first-parent chain.
      expr: steps["Read the first-parent chain"].outputs.stdout.trim().split("\n")[size(steps["Read the first-parent chain"].outputs.stdout.trim().split("\n")) - 1] == inputs.intent.production.commit &&
        steps["Read the release commit"].outputs.stdout.trim() == inputs.intent.production.commit
  - name: Read the key names
    labels:
      role: swamp
    dependsOn:
    - step: Check the commit is on the branch
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-deploy-env-keys-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-deploy-env-keys-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '30'
        - /usr/bin/sed
        - -n
        - -E
        - s/^[ \t]*(export[ \t]+)?([A-Za-z_][A-Za-z0-9_.]*)[ \t]*=.*/\2/p
        - --
        - ${{ inputs.intent.production.home + "/.env" }}
        sudo: true
        timeoutSec: 40
  - name: Check for foreign keys
    labels:
      role: swamp
    dependsOn:
    - step: Read the key names
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: assert
      severity: high
      message: The .env holds keys Orbit does not manage; the deploy would drop them.
      expr: '!steps["Read the key names"].outputs.stdout.split("\n").exists(k, k != "" && !(k in inputs.intent.environment.keys) && !(k in inputs.intent.environment.owned_keys))'
  - name: Write .env
    labels:
      role: swamp
    dependsOn:
    - step: Check for foreign keys
      condition:
        type: always
    writes: true
    forEach:
      item: file
      in: '${{ inputs.intent.deployment.variant != "production" ? [] : [{"name": ".env", "secret": inputs.execution_secrets.environment}] + ("testing" in inputs.execution_secrets ? [{"name": ".env.testing",
        "secret": inputs.execution_secrets.testing}] : []) }}'
    concurrency: 1
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "instance-deploy-env-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        becomeUser: ${{ inputs.intent.production.user }}
        path: ${{ inputs.intent.production.home + "/" + self.file.name }}
        ensure: present
        mode: '0600'
        content: ${{ vault.get(self.file.secret.vault, self.file.secret.key) }}
      inputs: {}
