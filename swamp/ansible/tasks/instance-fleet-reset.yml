---
# Reset the nested fleet of an Instance container to `base`, then start it (instance-fleet-start.yml, which checks the fleet rules) and
# wait for readiness (instance-fleet-ready.yml). `base` may hold an older schema than the checkout: a refresh does not retake it for a
# migration, so the reset migrates the nested Gateway forward and restarts it when one applied (instance-fleet-migrate.yml). Input: instance-fleet.yml. A restore takes
# 4 to 8 s on the directory pool; each has 45 s. The restores run one after the other: three parallel restores save a few seconds
# against the minute of readiness after them.
# A restore of a running container starts it again; a stopped one stays stopped, and the start starts it.
- { name: Name the fleet commands, ansible.builtin.import_tasks: instance-fleet.yml }
- name: Restore base
  ansible.builtin.command: { argv: "{{ ['timeout', '45'] + fleet_incus + ['snapshot', 'restore', item, 'base'] }}" }
  loop: "{{ fleet_names }}"
  register: fleet_restore
  changed_when: true
  failed_when: false
- name: Check the restores
  vars:
    fleet_restore_failed: "{{ fleet_restore.results | rejectattr('rc', 'eq', 0) | list }}"
  ansible.builtin.assert:
    that: fleet_restore_failed | length == 0
    fail_msg: >-
      {{ fleet_restore_failed | map(attribute='item') | join(', ') }} did not restore base:
      {{ fleet_restore_failed | map(attribute='stderr') | map('trim') | join('; ') | truncate(400) }}
    quiet: true
- { name: Start the fleet, ansible.builtin.import_tasks: instance-fleet-start.yml }
# The migrate reads `.env` and writes `storage` of the nested Gateway: their state mounts come up at boot, after the restore's start, so
# the reset waits for them first, as the refresh does (instance-fleet-mounts.yml), with the Swamp state when the Club key is there.
- name: Look for the Club key
  ansible.builtin.command: { argv: "{{ ['timeout', '30'] + fleet_outer + ['test', '-s', fleet_club_key] }}" }
  register: fleet_club
  changed_when: false
  failed_when: false
- { name: Wait for the state mounts, ansible.builtin.include_tasks: instance-fleet-mounts.yml }
- name: Migrate the nested Gateway to its checkout
  ansible.builtin.include_tasks: instance-fleet-migrate.yml
  vars: { fleet_migrate_due: true, fleet_restart_due: false }
- { name: Wait for readiness, ansible.builtin.import_tasks: instance-fleet-ready.yml }
