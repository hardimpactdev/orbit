---
# Each container gets an isolated ID map from root's range, which must hold `container_host.ids`; a smaller range changes nothing.
- name: Read the subordinate IDs
  ansible.builtin.slurp: { src: "{{ item }}" }
  loop: [/etc/subuid, /etc/subgid]
  register: container_subids

- name: Require a subordinate range for every container
  ansible.builtin.assert:
    that: have | int >= need | int
    fail_msg: "{{ container_host.fail }}: root needs {{ need }} subordinate IDs in {{ item.item }}, and its largest range has {{ have }}"
    quiet: true
  loop: "{{ container_subids.results }}"
  loop_control: { label: "{{ item.item }}" }
  vars:
    need: "{{ container_host.ids }}"
    have: >-
      {{ (item.content | b64decode).splitlines() | select('match', '^root:[0-9]+:[0-9]+$') | map('split', ':') | map('last') | map('int')
         | list | max | default(0) }}
