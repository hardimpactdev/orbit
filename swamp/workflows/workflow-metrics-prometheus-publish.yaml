id: fcc51ca8-6660-433c-9583-2eb1fbd86a59
name: metrics-prometheus-publish
description: Validate the captured Prometheus configuration, publish it, reload Prometheus without a restart and prove the exporter target.
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
# A reload keeps collection from every other Node running; only a Prometheus container change restarts it.
# Prometheus bind-mounts the single file, so publish copies the validated candidate over it in place: a rename would
# leave the container on the old inode and SIGHUP would reload stale configuration.
jobs:
- name: publish
  steps:
  - name: candidate
    <<: &effect
      labels: {role: swamp}
      writes: true
      guard: '${{ steps.exists(k, steps[k].status in ["failed", "cancelled"]) }}'
    task:
      <<: &apply {type: behavior, methodName: apply, inputs: {}}
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("metrics-candidate-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs:
        <<: &owner
          nodeHost: ${{ inputs.intent.runtime.ssh_execution.target.host }}
          nodeUser: ${{ inputs.intent.runtime.ssh_execution.target.user }}
          nodePort: ${{ inputs.intent.runtime.ssh_execution.target.port }}
          nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
          become: true
        path: '${{ "/etc/orbit/metrics/prometheus-" + run.id + ".yml" }}'
        ensure: present
        content: ${{ inputs.intent.runtime.configuration }}
        owner: root
        group: root
        mode: '0644'
  - name: validate
    dependsOn: [{step: candidate, condition: {type: succeeded}}]
    <<: *effect
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-validate-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: &ssh_owner
        name: '${{ ("metrics-validate-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.runtime.ssh_execution.target.user }}', port: '${{ inputs.intent.runtime.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.runtime.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.runtime.ssh_execution.target.host_keys }}'}}]
      inputs:
        hosts: 'name:target'
        sudo: true
        argv: [/usr/bin/docker, run, --rm, --entrypoint, /bin/promtool, --volume, '${{ "/etc/orbit/metrics/prometheus-" + run.id + ".yml:/etc/prometheus/prometheus.yml:ro" }}', 'prom/prometheus:v3.5.0', check, config, /etc/prometheus/prometheus.yml]
  - name: publish
    dependsOn: [{step: validate, condition: {type: succeeded}}]
    <<: *effect
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-publish-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: *ssh_owner
      inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/cp, --no-preserve=all, '${{ "/etc/orbit/metrics/prometheus-" + run.id + ".yml" }}', /etc/orbit/metrics/prometheus.yml]}
  - name: reload
    dependsOn: [{step: publish, condition: {type: succeeded}}]
    <<: *effect
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-reload-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: *ssh_owner
      inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/docker, kill, --signal=HUP, orbit-metrics-prometheus]}
  - name: targets
    dependsOn: [{step: reload, condition: {type: succeeded}}]
    <<: *effect
    writes: false
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-targets-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: *ssh_owner
      inputs: {hosts: 'name:target', argv: '${{ inputs.intent.scrape_wait }}', timeoutSec: 70}
  - name: Prove the scrape target
    dependsOn: [{step: targets, condition: {type: succeeded}}]
    labels: {role: swamp}
    task:
      type: assert
      severity: high
      expr: 'steps.targets.outputs.stdout.contains("\"" + inputs.intent.exporter_address + ":9100\"") == inputs.intent.enabled'
      message: Prometheus does not scrape the exporter Node as the intent says.
  - name: remove_candidate
    dependsOn: [{step: validate, condition: {type: always}}, {step: publish, condition: {type: always}}]
    labels: {role: swamp}
    writes: true
    task:
      <<: *apply
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("metrics-remove-candidate-" + string(inputs.intent.runtime.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: {<<: *owner, path: '${{ "/etc/orbit/metrics/prometheus-" + run.id + ".yml" }}', ensure: absent}
