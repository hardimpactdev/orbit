id: c113fc34-1056-4379-a51a-a3594a5b5378
name: operation-task-vm-provision
description: Allocate, enroll and prepare one Task VM in one native root.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.provision
    _hub_command:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - _hub_command
  additionalProperties: true
vaults: []
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: admit
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
- name: provider
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: provider
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: provider
        provider: null
        outcomes: []
  - name: provider_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: provider
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.provider.outputs.ok
      message: The Task VM provider stage did not complete
      severity: high
- name: bootstrap
  dependsOn:
  - job: provider
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: bootstrap
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: bootstrap
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) }}'
  - name: bootstrap_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: bootstrap
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.bootstrap.outputs.ok
      message: The Task VM bootstrap stage did not complete
      severity: high
- name: prepare-network
  dependsOn:
  - job: bootstrap
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: prepare_network
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: prepare-network
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) }}'
  - name: prepare_network_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: prepare_network
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.prepare_network.outputs.ok
      message: The Task VM prepare-network stage did not complete
      severity: high
- name: publish-hub
  dependsOn:
  - job: prepare-network
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(steps.admit.outputs.input.gateway_node_id) }}
  labels:
    node: ${{ string(steps.admit.outputs.input.gateway_node_id) }}
  steps:
  - name: publish_hub_assets
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-assets-" + string(inputs._hub_command.hub_id)
        }}
      methodName: read
      inputs:
        intent: ${{ inputs._hub_command }}
        mode: publish
        prepared_peer: '${{ {"node_id": inputs._hub_command.context_node_id, "public_key":
          steps.prepare_network.outputs.output.wireguard_public_key} }}'
    guard: ${{ !steps.admit.outputs.active }}
  - name: publish_hub_command
    writes: true
    dependsOn:
    - step: publish_hub_assets
      condition:
        type: succeeded
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "wireguard-hub-" + string(inputs._hub_command.hub_id) }}
      methodName: script
      inputs:
        hosts: hub
        interpreter: python3
        sudo: true
        script: ${{ steps["publish_hub_assets"].outputs.script_body }}
    guard: ${{ !steps.admit.outputs.active }}
  - name: publish_hub
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - step: publish_hub_command
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-result-" + string(inputs._hub_command.hub_id)
        }}
      methodName: result
      inputs:
        hub_id: ${{ inputs._hub_command.hub_id }}
        stdout: ${{ data.latest("wireguard-hub-" + string(inputs._hub_command.hub_id),
          "run-script-hub").attributes.stdout }}
    guard: ${{ !steps.admit.outputs.active }}
  - name: publish_hub_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: publish_hub
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.publish_hub.outputs.status == "succeeded"
      message: The Task VM publish-hub stage did not complete
      severity: high
- name: publish-network
  dependsOn:
  - job: publish-hub
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: publish_network
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: publish-network
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) + (has(steps.prepare_network) && has(steps.prepare_network.outputs)
          ? [steps.prepare_network.outputs] : []) + (has(steps.publish_hub) && has(steps.publish_hub.outputs)
          && steps.publish_hub.outputs.status == "succeeded" ? [{"stage": "publish-hub",
          "ok": true, "output": {"hub_configured": true}, "error_code": null}] : [])
          }}'
  - name: publish_network_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: publish_network
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.publish_network.outputs.ok
      message: The Task VM publish-network stage did not complete
      severity: high
- name: issue-worker
  dependsOn:
  - job: publish-network
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(steps.admit.outputs.input.issuer_node_id) }}
  labels:
    node: ${{ string(steps.admit.outputs.input.issuer_node_id) }}
  steps:
  - name: issue_worker
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: issue-worker
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) + (has(steps.prepare_network) && has(steps.prepare_network.outputs)
          ? [steps.prepare_network.outputs] : []) + (has(steps.publish_hub) && has(steps.publish_hub.outputs)
          && steps.publish_hub.outputs.status == "succeeded" ? [{"stage": "publish-hub",
          "ok": true, "output": {"hub_configured": true}, "error_code": null}] : [])
          + (has(steps.publish_network) && has(steps.publish_network.outputs) ? [steps.publish_network.outputs]
          : []) }}'
  - name: issue_worker_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: issue_worker
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.issue_worker.outputs.ok
      message: The Task VM issue-worker stage did not complete
      severity: high
- name: configure-worker
  dependsOn:
  - job: issue-worker
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: configure_worker
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-provision'
      behaviorName: ${{ "task-vm-provision-" + run.id }}
      methodName: stage
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        admission: ${{ steps.admit.outputs }}
        stage: configure-worker
        provider: ${{ steps.provider.outputs.output }}
        outcomes: '${{ (has(steps.provider) && has(steps.provider.outputs) ? [steps.provider.outputs]
          : []) + (has(steps.bootstrap) && has(steps.bootstrap.outputs) ? [steps.bootstrap.outputs]
          : []) + (has(steps.prepare_network) && has(steps.prepare_network.outputs)
          ? [steps.prepare_network.outputs] : []) + (has(steps.publish_hub) && has(steps.publish_hub.outputs)
          && steps.publish_hub.outputs.status == "succeeded" ? [{"stage": "publish-hub",
          "ok": true, "output": {"hub_configured": true}, "error_code": null}] : [])
          + (has(steps.publish_network) && has(steps.publish_network.outputs) ? [steps.publish_network.outputs]
          : []) + (has(steps.issue_worker) && has(steps.issue_worker.outputs) ? [steps.issue_worker.outputs]
          : []) }}'
  - name: configure_worker_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: configure_worker
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps.configure_worker.outputs.ok
      message: The Task VM configure-worker stage did not complete
      severity: high
- name: worker-ready
