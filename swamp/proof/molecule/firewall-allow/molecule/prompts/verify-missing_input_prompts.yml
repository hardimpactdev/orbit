---
# missing-input-prompts (main, succeeded). Two runs, so two firewall.allow Operations; the rules of both ports are active on the target.
# The Node was picked by Enter, so `tnode` is the first entry of the Node prompt (target.yml). An allow without --from and --protocol opens
# the port for every source, one line for each protocol (as the partial-application case of default sees it).
- name: missing-input-prompts
  vars:
    ports: ["{{ c.port }}", "{{ c.port2 }}"]
    created: "{{ ops_after | difference(ops_before) }}"
  block:
    - name: One Operation for each run, and they ended
      ansible.builtin.assert:
        that: created | length == 2
        fail_msg: "Operations created: {{ created }}"
        quiet: true

    - name: One active allow record for each port on the Node that was chosen in the menu
      ansible.builtin.assert:
        that: >-
          rules | selectattr('action', 'equalto', 'allow') | selectattr('status', 'equalto', 'active')
          | selectattr('port', 'in', [item | int, item | string]) | list | length == 1
        fail_msg: "records of port {{ item }} on {{ tnode }}: {{ rules | selectattr('port', 'in', [item | int, item | string]) | list }}"
        quiet: true
      loop: "{{ ports }}"

    - name: UFW has the TCP and the UDP allow line of each port, for any source, once
      ansible.builtin.assert:
        that: >-
          rows | select('search', '^ *\\[ *[0-9]+\\] +' ~ item.0 ~ '/' ~ item.1 ~ ' +ALLOW IN +Anywhere( +#.*)? *$') | list | length == 1
        fail_msg: "UFW rows of port {{ item.0 }}/{{ item.1 }} on {{ tnode }}: {{ rows | select('search', item.0 | string) | list }}"
        quiet: true
      loop: "{{ ports | product(['tcp', 'udp']) | list }}"
      loop_control: {label: "{{ item.0 }}/{{ item.1 }}"}

    - name: Nothing else changed in UFW (rows without the two ports, numbers removed)
      ansible.builtin.assert:
        that: >-
          (ufw_before.split('\n') | select('search', '^ *\\[') | map('regex_replace', '^ *\\[ *[0-9]+\\] *', '') | reject('search', ports | join('|')) | list)
          ==
          (ufw_after.split('\n') | select('search', '^ *\\[') | map('regex_replace', '^ *\\[ *[0-9]+\\] *', '') | reject('search', ports | join('|')) | list)
        quiet: true

    - name: "{{ inventory_hostname }}: the checks of the case ended"
      ansible.builtin.set_fact:
        verified: true
  rescue:
    - name: "{{ inventory_hostname }}: record the failed check"
      ansible.builtin.set_fact:
        verify_failures: "{{ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.assertion | default(ansible_failed_result.msg | default('?'))) }}"
