id: a316a21c-564c-4f25-bc20-713f6f987d20
name: operation-database-server-close
queueTimeout: 30
description: Give default the admin password on an adopted Valkey server with one valkey-cli call per step; AUTH comes from the vault on stdin.
vaults: [orbit-control-inputs]
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [database_server.close]}
    intent: {type: object}
    execution_secrets:
      type: object
      properties:
        check: {type: object, properties: {vault: {type: string, enum: [orbit-control-inputs]}, key: {type: string, pattern: '^database-server-close-intent-[1-9][0-9]*-(check|close)$'}}, required: [vault, key], additionalProperties: false}
        close: {type: object, properties: {vault: {type: string, enum: [orbit-control-inputs]}, key: {type: string, pattern: '^database-server-close-intent-[1-9][0-9]*-(check|close)$'}}, required: [vault, key], additionalProperties: false}
      required: [check, close]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: closure
  labels: {role: swamp}
  steps:
    # AUTH, then CLIENT LIST USER default: only this call's own connection may be logged in as default.
  - name: 'List default clients'
    labels: {role: swamp}
    guard: '${{ !inputs.intent.default_open }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-close-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "database-close-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.user }}
          identityFile: /etc/orbit/swamp-role-worker/ssh-identity
        hosts:
        - name: server
          address: ${{ inputs.intent.ssh.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.host_keys }}'}
      inputs:
        hosts: name:server
        sudo: true
        argv: [timeout, '30', /usr/bin/docker, run, --rm, -i, --network=host, 'valkey/valkey:8.1', valkey-cli, --no-auth-warning, -h, '${{ inputs.intent.host }}', -p, '${{ string(inputs.intent.port) }}']
        stdin: '${{ vault.get(inputs.execution_secrets.check.vault, inputs.execution_secrets.check.key) }}'
        timeoutSec: 40
  - name: 'Prove no other client'
    labels: {role: swamp}
    dependsOn: [{step: 'List default clients', condition: {type: succeeded}}]
    task: {type: assert, severity: high, message: Another client is logged in as default.,
      expr: 'steps["List default clients"].outputs.stdout.startsWith("OK") && steps["List default clients"].outputs.stdout.split("\n").filter(l, l.startsWith("id=")).size() == 1'}
    # AUTH, ACL SETUSER default resetpass #<sha256>, ACL SAVE, CLIENT KILL USER default SKIPME yes; no rollback.
  - name: 'Close default access'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Prove no other client', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-close-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "database-close-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.user }}
          identityFile: /etc/orbit/swamp-role-worker/ssh-identity
        hosts:
        - name: server
          address: ${{ inputs.intent.ssh.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.host_keys }}'}
      inputs:
        hosts: name:server
        sudo: true
        argv: [timeout, '30', /usr/bin/docker, run, --rm, -i, --network=host, 'valkey/valkey:8.1', valkey-cli, --no-auth-warning, -h, '${{ inputs.intent.host }}', -p, '${{ string(inputs.intent.port) }}']
        stdin: '${{ vault.get(inputs.execution_secrets.close.vault, inputs.execution_secrets.close.key) }}'
        timeoutSec: 40
  - name: 'Prove the ACL is saved'
    labels: {role: swamp}
    dependsOn: [{step: 'Close default access', condition: {type: succeeded}}]
    task: {type: assert, severity: high, message: The default user was not closed and saved.,
      expr: 'steps["Close default access"].outputs.stdout.startsWith("OK\nOK\nOK\n")'}
    # The end check: a client without a password gets NOAUTH.
  - name: 'Check default access'
    labels: {role: swamp}
    dependsOn: [{step: 'Prove the ACL is saved', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-close-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "database-close-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.user }}
          identityFile: /etc/orbit/swamp-role-worker/ssh-identity
        hosts:
        - name: server
          address: ${{ inputs.intent.ssh.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.host_keys }}'}
      inputs:
        hosts: name:server
        sudo: true
        argv: [timeout, '30', /usr/bin/docker, run, --rm, -i, --network=host, 'valkey/valkey:8.1', valkey-cli, --no-auth-warning, -h, '${{ inputs.intent.host }}', -p, '${{ string(inputs.intent.port) }}', PING]
        timeoutSec: 40
  - name: 'Prove default is closed'
    labels: {role: swamp}
    dependsOn: [{step: 'Check default access', condition: {type: succeeded}}]
    task: {type: assert, severity: high, message: A client without a password still has access.,
      expr: 'steps["Check default access"].outputs.stdout.startsWith("NOAUTH")'}
