id: e0784b8d-cf13-4d2d-a5b5-bc0d0046b9d3
name: instance-route-workload
description: Prepare one captured workload through official SSH, file actions and validate-before-reload.
vaults: []
inputs:
  type: object
  properties:
    intent:
      type: object
    operation_id:
      type: integer
    node_id:
      type: integer
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - intent
  - operation_id
  - node_id
  - kind
  - execution_secrets
  additionalProperties: false
jobs:
- name: workload
  steps:
  - name: links
    labels:
      role: swamp
    forEach:
      item: part
      in: ${{ inputs.intent.plan.links }}
    dependsOn: []
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/link'
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        nodePort: ${{ inputs.intent.connection.nodePort }}
        become: true
        path: ${{ self.part.path }}
        target: ${{ self.part.target }}
        owner: ${{ self.part.owner }}
        ensure: present
      inputs: {}
      behaviorName: ${{ ("irw-links-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
  - name: web-root
    labels:
      role: swamp
    forEach:
      item: part
      in: ${{ inputs.intent.plan.acl }}
    concurrency: 1
    writes: true
    dependsOn:
    - step: links
      condition:
        type: always
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv: ${{ ["timeout", "120"] + self.part.argv }}
        timeoutSec: 130
      globalArgs:
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
        name: ${{ ("irw-web-root-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
      behaviorName: ${{ ("irw-web-root-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
  - name: runtime-identity
    labels:
      role: swamp
    forEach:
      item: part
      in: '${{ inputs.intent.plan.runtime != null ? [inputs.intent.plan.runtime] : [] }}'
    dependsOn:
    - step: links
      condition:
        type: always
    - step: web-root
      condition:
        type: always
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - /usr/bin/cmp
        - ${{ "/etc/orbit/php-fpm/" + self.part.user + "/orbit.identity" }}
        - '-'
        stdin: ${{ self.part.marker }}
      globalArgs:
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
        name: ${{ ("irw-runtime-identity-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
      behaviorName: ${{ ("irw-runtime-identity-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
  - name: runtime-pool
    labels:
      role: swamp
    forEach:
      item: part
      in: '${{ inputs.intent.plan.runtime != null ? [inputs.intent.plan.runtime] : [] }}'
    dependsOn:
    - step: links
      condition:
        type: always
    - step: web-root
      condition:
        type: always
    - step: runtime-identity
      condition:
        type: always
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        nodePort: ${{ inputs.intent.connection.nodePort }}
        become: true
        path: ${{ "/etc/orbit/php-fpm/" + self.part.user + "/generated/pool.conf" }}
        ensure: present
        owner: root
        group: root
        mode: '0644'
        content: ${{ self.part.pool }}
      inputs: {}
      behaviorName: ${{ ("irw-runtime-pool-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
  - name: runtime-pool-proof
    labels:
      role: swamp
    forEach:
      item: part
      in: '${{ inputs.intent.plan.runtime != null ? [inputs.intent.plan.runtime] : [] }}'
    dependsOn:
    - step: links
      condition:
        type: always
    - step: web-root
      condition:
        type: always
    - step: runtime-identity
      condition:
        type: always
    - step: runtime-pool
      condition:
        type: always
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-route-workload'
      methodName: verifyPool
      inputs:
        expected: ${{ self.part.pool_sha256 }}
        state: ${{ steps["runtime-pool-0"].outputs }}
      behaviorName: ${{ "irw-runtime-pool-proof-" + string(self._index) }}
  - name: runtime-validate
    labels:
      role: swamp
    forEach:
      item: part
      in: '${{ inputs.intent.plan.runtime != null ? [inputs.intent.plan.runtime] : [] }}'
    dependsOn:
    - step: links
      condition:
        type: always
    - step: web-root
      condition:
        type: always
    - step: runtime-identity
      condition:
        type: always
    - step: runtime-pool
      condition:
        type: always
    - step: runtime-pool-proof
      condition:
        type: always
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - env
        - ${{ "PHP_INI_SCAN_DIR=/etc/php/" + self.part.version + "/fpm/conf.d:/etc/orbit/php-fpm/" + self.part.user + "/generated" }}
        - ${{ "/usr/sbin/php-fpm" + self.part.version }}
        - -t
        - --fpm-config
        - ${{ "/etc/orbit/php-fpm/" + self.part.user + "/generated/php-fpm.conf" }}
      globalArgs:
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
        name: ${{ ("irw-runtime-validate-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
      behaviorName: ${{ ("irw-runtime-validate-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
  - name: runtime-reload
    labels:
      role: swamp
    forEach:
      item: part
      in: '${{ inputs.intent.plan.runtime != null ? [inputs.intent.plan.runtime] : [] }}'
    dependsOn:
    - step: links
      condition:
        type: always
    - step: web-root
      condition:
        type: always
    - step: runtime-identity
      condition:
        type: always
    - step: runtime-pool
      condition:
        type: always
    - step: runtime-pool-proof
      condition:
        type: always
    - step: runtime-validate
      condition:
        type: always
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - /usr/bin/systemctl
        - reload
        - ${{ "orbit-" + self.part.user + "-php" + self.part.version + "-fpm.service" }}
      globalArgs:
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
        name: ${{ ("irw-runtime-reload-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
      behaviorName: ${{ ("irw-runtime-reload-" + string(inputs.intent.connection.nodeHost) + "-" + string(self._index)).split(".").join("-") }}
  - name: result
    labels:
      role: swamp
    dependsOn:
    - step: links
      condition:
        type: always
    - step: web-root
      condition:
        type: always
    - step: runtime-identity
      condition:
        type: always
    - step: runtime-pool
      condition:
        type: always
    - step: runtime-pool-proof
      condition:
        type: always
    - step: runtime-validate
      condition:
        type: always
    - step: runtime-reload
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-route-workload'
      behaviorName: ${{ "workload-prepared" }}
      methodName: prepared
      inputs:
        outcomes: ${{ steps }}
        required:
          links: ${{ size(inputs.intent.plan.links) }}
          web-root: ${{ size(inputs.intent.plan.acl) }}
          runtime-reload: '${{ size(inputs.intent.plan.runtime != null ? [inputs.intent.plan.runtime] : []) }}'
