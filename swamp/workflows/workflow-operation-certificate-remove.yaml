id: eabb9794-3ff8-4ee9-a7bb-52172837668b
name: operation-certificate-remove
description: One admitted local leaf, visible command actions, and terminal public presence.
writes: true
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - certificate.remove
    intent:
      type: object
      properties:
        leaf:
          type: object
          properties:
            node_id:
              type: integer
              minimum: 1
            scope:
              type: string
              pattern: ^(app-instance-[1-9][0-9]*(-hostname-change)?|route-[1-9][0-9]*(-router(-hostname-change)?|-ingress)?)$
            user:
              type: string
              pattern: ^[a-z_][a-z0-9_-]{0,31}$
            home:
              type: string
            agent_sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            in_use:
              type: boolean
              const: false
          required:
          - node_id
          - scope
          - user
          - agent_sha256
          - in_use
          additionalProperties: false
        control_node_id:
          type: integer
          minimum: 1
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
      required:
      - leaf
      - control_node_id
      - connection
    execution_secrets:
      type: object
      additionalProperties: false
      maxProperties: 0
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: &id001
      node: ${{ string(inputs.intent.control_node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.leaf }}
  - name: prepare-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id002
        name: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-certificate-" + run.id }}
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: copy-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id002
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-certificate-" + run.id + "/" }}
        direction: to
        recursive: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
  - name: reload-withdrawal
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    writes: true
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - sh
        - -c
        - if systemctl is-active --quiet caddy; then systemctl reload caddy; fi
        sudo: true
  - name: remove
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/remove.py" }}
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: reload-withdrawal
      condition:
        type: succeeded
  - name: inspect
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_EXPECT_PRESENT=" + "false" }}
        - /usr/bin/python3
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/inspect.py" }}
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: remove
      condition:
        type: succeeded
  - name: cleanup-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - ${{ "/tmp/orbit-certificate-" + run.id }}
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    allowFailure: true
