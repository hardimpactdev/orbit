description: Set up one captured Tasks workspace on the provisioned VM as official
  SSH exec argv from 209, and fold the provision receipt; no script reaches the VM.
id: 46a068b0-6512-4c23-8729-e5bdc43c136c
inputs:
  additionalProperties: false
  properties:
    intent:
      type: object
    kind:
      enum:
      - tasks.provision
      type: string
    node_id:
      minimum: 1
      type: integer
    operation_id:
      minimum: 1
      type: integer
    # The root run of the Operation, which the Gateway checks when it mints the clone credential.
    run_id:
      pattern: ^[a-f0-9-]{36}$
      type: string
    vm:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - run_id
  - vm
  type: object
jobs:
- name: source
  steps:
  # The workspace connection pins the host key the VM child observed at enrollment.
  - name: guest
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-guest" }}'
      methodName: guest
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
    # Every failure lands in the receipt; this workspace run itself always ends with it.
    allowFailure: true
  - name: prepare
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-prepare" }}'
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        root: ${{ "/tmp/orbit-task-provision-"+run.id }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
  - name: control
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-control" }}'
      methodName: execute
      inputs:
        run: 'umask 077

          mkdir -p -- "$ORBIT_ROOT"

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    allowFailure: true
  # The credential is minted here, minutes before the clone, because the VM step before it can wait for capacity for longer than an installation token lives.
  # It exists only in the vault and in the environment of the clone: the VM gets a bundle, never a credential.
  - name: mint_clone
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        purpose: clone
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    allowFailure: true
  # The commit of the default branch that the workspace already holds, such as one made ahead of a claim; empty for a new workspace.
  - name: read_base
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        okExitCodes: any
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - rev-parse
        - --verify
        - --quiet
        - ${{ "refs/remotes/origin/" + inputs.intent.workspace.default_branch + "^{commit}" }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    allowFailure: true
  # One action group on Node 209: clone the default branch with full history and bundle it. When the workspace already holds a commit of
  # that branch, the clone takes no file contents (partial clone) and the bundle holds only the commits after it; git fetches the
  # contents those commits need, with the same credential. A base that the branch no longer contains gets the whole branch.
  - name: fetch
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-fetch" }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          rm -rf -- "$ORBIT_SOURCE" "$ORBIT_BUNDLE"
          base=$(printf '%s\n' "$ORBIT_BASE" | head -n 1)
          case "$base" in ''|*[!0-9a-f]*) base= ;; esac
          set --
          if [ -n "$base" ]; then set -- --filter=blob:none; fi
          timeout 600 git clone --quiet --bare --single-branch --branch "$ORBIT_BRANCH" "$@" -- "$ORBIT_REPOSITORY" "$ORBIT_SOURCE"
          set --
          # A thin bundle needs the base in the branch and at least one commit after its parent; git refuses an empty bundle.
          if [ -n "$base" ] && git -C "$ORBIT_SOURCE" merge-base --is-ancestor "$base^" "refs/heads/$ORBIT_BRANCH" 2>/dev/null \
            && [ "$(git -C "$ORBIT_SOURCE" rev-list --count "$base^..refs/heads/$ORBIT_BRANCH")" -gt 0 ]; then
            set -- "^$base^"
          fi
          timeout 600 git -C "$ORBIT_SOURCE" bundle create --quiet "$ORBIT_BUNDLE" "refs/heads/$ORBIT_BRANCH" "$@"
        env:
          ORBIT_BASE: ${{ steps.read_base.outputs.stdout }}
          ORBIT_BRANCH: ${{ inputs.intent.workspace.default_branch }}
          ORBIT_REPOSITORY: ${{ inputs.intent.workspace.repository }}
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.git" }}
          ORBIT_BUNDLE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.bundle" }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.intent.git_authorization.vault,
            inputs.intent.git_authorization.key) }}
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: 'git@github.com:'
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: ssh://git@github.com/
    dependsOn:
    - step: control
      condition:
        type: succeeded
    - step: mint_clone
      condition:
        type: succeeded
    - step: read_base
      condition:
        type: succeeded
    allowFailure: true
  - name: prepare_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/mkdir
        - -p
        - -m
        - '0700'
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    allowFailure: true
  - name: copy_bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        src: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.bundle"
          }}
        dst: ${{ "/tmp/orbit-task-provision-"+run.id+"/source.bundle" }}
        direction: to
    dependsOn:
    - step: fetch
      condition:
        type: succeeded
    - step: prepare_remote
      condition:
        type: succeeded
    allowFailure: true
  # One action group on the VM: fetch the bundle into the workspace, name origin by its plain URL, start the task branch at its
  # commit and read HEAD and the branch back. A new workspace is created here; an existing one only gains the new commits.
  - name: checkout
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /bin/sh
        - -c
        - |
          set -eu
          # A 64-character commit names a SHA-256 repository; git init makes SHA-1 by default.
          if [ "${#6}" -eq 64 ]; then git init --quiet --object-format=sha256 -- "$1"; else git init --quiet -- "$1"; fi
          cd -- "$1"
          git config remote.origin.url "$2"
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch --quiet --no-tags -- "$3" "+refs/heads/$4:refs/remotes/origin/$4"
          git switch --quiet --force-create "$5" "$6"
          git rev-parse HEAD --abbrev-ref HEAD
        - orbit-checkout
        - ${{ inputs.intent.workspace.checkout_path }}
        - ${{ inputs.intent.workspace.repository }}
        - ${{ "/tmp/orbit-task-provision-"+run.id+"/source.bundle" }}
        - ${{ inputs.intent.workspace.default_branch }}
        - ${{ inputs.intent.workspace.branch }}
        - ${{ inputs.intent.workspace.start_commit }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    - step: copy_bundle
      condition:
        type: succeeded
    allowFailure: true
  - name: inspect
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - /usr/bin/env
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - stat
        - -c
        - '%n|%F|%s'
        - --
        - composer.json
        - ${{ inputs.intent.workspace.entry_point }}
    dependsOn:
    - step: checkout
      condition:
        type: succeeded
    allowFailure: true
  - name: composer
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        src: ${{ inputs.intent.workspace.checkout_path + "/composer.json" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
        timeoutSec: 60
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: control
      condition:
        type: succeeded
    guard: ${{ inputs.intent.workspace.skip_profile || !steps.inspect.outputs.stdout.contains("composer.json|regular")
      }}
    allowFailure: true
  - name: profile
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-profile" }}'
      methodName: profile
      inputs:
        intent: ${{ inputs.intent }}
        identity: ${{ steps.checkout.outputs.stdout }}
        files: ${{ steps.inspect.outputs.stdout }}
        composer: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
    dependsOn:
    - step: checkout
      condition:
        type: succeeded
    - step: inspect
      condition:
        type: succeeded
    - step: composer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    allowFailure: true
  # Private dependencies. The token is minted here, minutes before the setup steps, and lives in two 0600 files of the task account
  # for as long as they run: `deps_remove` deletes both whatever the setup steps did.
  - name: deps_write
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-dependency-auth-write
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        user: ${{ inputs.intent.workspace.user }}
        ssh_execution: ${{ steps.guest.outputs.workspace.ssh_execution }}
        dependency_auth: ${{ inputs.intent.dependency_auth }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    guard: ${{ has(steps.profile.outputs.error_code) || size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: setup-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv: ${{ steps.prepare.outputs.setup[self._index] }}
        timeoutSec: ${{ self.setup.timeout_seconds }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: deps_write
      condition:
        type: succeeded
    forEach:
      item: setup
      in: ${{ inputs.intent.workspace.setup }}
    concurrency: 1
    guard: ${{ has(steps.profile.outputs.error_code) || (self._index > 0 && (!("setup-"+string(self._index-1)
      in steps) || steps["setup-"+string(self._index-1)].status != "succeeded")) }}
    allowFailure: true
  - name: deps_remove
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-dependency-auth-remove
      inputs:
        user: ${{ inputs.intent.workspace.user }}
        ssh_execution: ${{ steps.guest.outputs.workspace.ssh_execution }}
        dependency_auth: ${{ inputs.intent.dependency_auth }}
    dependsOn:
    - step: deps_write
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    allowFailure: true
  - name: setup_copy
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        recursive: true
        src: ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/" }}
        timeoutSec: 60
    dependsOn:
    - step: prepare_remote
      condition:
        type: succeeded
    - step: control
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    allowFailure: true
  - name: setup_output
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-setup-output" }}'
      methodName: setup_output
      inputs:
        intent: ${{ inputs.intent }}
        directory: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/output" }}
    dependsOn:
    - step: setup_copy
      condition:
        type: succeeded
    allowFailure: true
  # The proof club token's private directory, owned by orbit.
  - name: proof_club_directory
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -d
        - -m
        - '0700'
        - -o
        - orbit
        - -g
        - orbit
        - --
        - /home/orbit/.config/swamp
  # install cannot replace an existing file from stdin; drop any previous token or link first.
  - name: proof_club_previous
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_directory
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - rm
        - -f
        - --
        - /home/orbit/.config/swamp/club-api-key
  # The token from the vault on SSH stdin, written 0600 for orbit; it never enters argv or history.
  - name: proof_club
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_previous
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -m
        - '0600'
        - -o
        - orbit
        - -g
        - orbit
        - /dev/stdin
        - /home/orbit/.config/swamp/club-api-key
        stdin: ${{ vault.get(inputs.intent.proof_club.vault, inputs.intent.proof_club.key) }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-result" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
        steps: ${{ steps }}
    dependsOn:
    - step: guest
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    - step: control
      condition:
        type: always
    - step: mint_clone
      condition:
        type: always
    - step: deps_write
      condition:
        type: always
    - step: deps_remove
      condition:
        type: always
    - step: prepare_remote
      condition:
        type: always
    - step: copy_bundle
      condition:
        type: always
    - step: read_base
      condition:
        type: always
    - step: fetch
      condition:
        type: always
    - step: checkout
      condition:
        type: always
    - step: inspect
      condition:
        type: always
    - step: composer
      condition:
        type: always
    - step: profile
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    - step: setup_output
      condition:
        type: always
    - step: proof_club_directory
      condition:
        type: always
    - step: proof_club_previous
      condition:
        type: always
    - step: proof_club
      condition:
        type: always
  - name: cleanup
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-cleanup" }}'
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_ROOT"

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
    dependsOn:
    - step: result
      condition:
        type: always
    allowFailure: true
  - name: cleanup_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id }}
    dependsOn:
    - step: result
      condition:
        type: always
    allowFailure: true
  labels: {role: swamp}
name: task-workspace-source
# Each SSH step is limited to 3900 s, the run budget of the largest Operation that calls it (OperationRunBudgets::SecondsByKind).
vaults:
- orbit-control-inputs
