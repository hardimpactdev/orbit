  steps:
  - name: publish-network
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        stage: publish-network
