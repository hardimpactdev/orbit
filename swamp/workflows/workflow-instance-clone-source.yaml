        - ${{ steps["source-selected"].outputs.reference }}
  - name: source-commit
    labels:
      role: swamp
    dependsOn:
    - step: source-checkout
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-22-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("src-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - -H
        - -u
        - ${{ inputs.intent.user }}
        - --
        - /usr/bin/env
        - -C
        - ${{ inputs.intent.home.path }}
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - rev-parse
        - --verify
        - HEAD^{commit}
    # The application .env links to the home .env; a tracked, unchanged .env gives way to the link (legacy resolve-production-source).
  - name: source-environment-link
    labels:
      role: swamp
    dependsOn:
    - step: source-commit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-23-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("src-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/sudo
        - -n
        - -H
        - -u
        - ${{ inputs.intent.user }}
        - --
        - /usr/bin/env
        - -C
        - ${{ inputs.intent.home.path }}
        - /usr/bin/timeout
        - '30'
        - /bin/sh
        - -c
        - cd -- "$1" || exit 1; if [ -L .env ]; then [ "$(readlink .env)" = "$2" ]; exit; fi; if [ -e .env ]; then git -c core.fsmonitor=false ls-files
          --error-unmatch -- .env >/dev/null 2>&1 && git -c core.fsmonitor=false diff --quiet HEAD -- .env || exit 1; rm -f -- .env; fi; ln -s -- "$2" .env
        - sh
        - ${{ inputs.intent.application }}
        - ${{ inputs.intent.home.environment_link }}
  - name: source-profile-read
    labels:
      role: swamp
    dependsOn:
    - step: source-environment-link
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-24-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("src-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
