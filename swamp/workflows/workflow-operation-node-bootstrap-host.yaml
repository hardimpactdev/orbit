id: b1f043f7-3d76-4f8b-a435-b4a6002ad7b1
name: operation-node-bootstrap-host
description: Run the admitted node.bootstrap_host intent in one native root.
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [node.bootstrap_host] }
  required: [operation_id, node_id, kind]
jobs:
  - name: bootstrap
    labels: {node: '${{ string(inputs.node_id) }}'}
    steps:
      - name: apply
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-bootstrap-direct"
          behaviorName: '${{ "node-bootstrap-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
