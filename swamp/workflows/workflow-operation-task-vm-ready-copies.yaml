- name: check
  labels: {role: swamp}
  steps:
  # A run that was killed leaves its throwaway copies; a copy of the same name would fail. Nothing to remove is no error.
  - name: Remove stale check copies
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '120'
        - incus
        - delete
        - '--force'
        - ready-check-gateway
        - ready-check-app-dev
        - ready-check-app-prod
        okExitCodes: any
        timeoutSec: 130
  # Boot-check: a throwaway copy of each ready copy starts and is checked; the ready copy itself is never started.
  - name: Copy gateway to check
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '600'
        - incus
        - copy
        - fleet-ready-gateway
        - ready-check-gateway
        timeoutSec: 610
    dependsOn:
    - step: Remove stale check copies
      condition: {type: succeeded}
  - name: Copy app-dev to check
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '600'
        - incus
        - copy
        - fleet-ready-app-dev
        - ready-check-app-dev
        timeoutSec: 610
    dependsOn:
    - step: Remove stale check copies
      condition: {type: succeeded}
  - name: Copy app-prod to check
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '600'
        - incus
        - copy
        - fleet-ready-app-prod
        - ready-check-app-prod
        timeoutSec: 610
    dependsOn:
    - step: Remove stale check copies
      condition: {type: succeeded}
  - name: Start gateway to check
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '120'
        - incus
        - start
        - ready-check-gateway
        timeoutSec: 130
    dependsOn:
    - step: Copy gateway to check
      condition: {type: succeeded}
  - name: Start app-dev to check
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("ready-copies-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *vm
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '120'
        - incus
        - start
