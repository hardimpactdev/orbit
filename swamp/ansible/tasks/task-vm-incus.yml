---
# Incus on a task VM, initialised once: a directory storage pool, the default profile's root disk and, on a task VM, the nested
# network. intent.nfs names the nested subnet and the bridge (see task-vm-nfs.yml); it is null on an image, which gets the pool and
# the root disk only, because the subnet belongs to a task VM. The nested VMs are launched by Swamp steps into this network.
- name: Read the Incus storage pools
  ansible.builtin.command: { argv: [incus, storage, list, --format, csv] }
  register: incus_pools
  changed_when: false
- name: Read the Incus networks
  ansible.builtin.command: { argv: [incus, network, list, --format, csv] }
  register: incus_networks
  changed_when: false
- name: Work out what is missing
  ansible.builtin.set_fact:
    incus_pool_missing: "{{ incus_pools.stdout_lines | select('match', '^default,') | list | length == 0 }}"
    incus_network_missing: >-
      {{ intent.nfs is not none and (incus_networks.stdout_lines | select('match', '^' ~ intent.nfs.interface ~ ',') | list | length == 0) }}
    # The bridge takes the first address of the nested subnet.
    incus_bridge: >-
      {{ (intent.nfs.subnet.split('/')[0].split('.')[:3] + ['1']) | join('.') ~ '/' ~ intent.nfs.subnet.split('/')[1] if intent.nfs is not none else '' }}
- name: Initialise Incus
  when: incus_pool_missing or incus_network_missing
  ansible.builtin.command: { argv: [incus, admin, init, --preseed] }
  args:
    stdin: "{{ preseed | to_nice_yaml }}"
  vars:
    pool:
      - { name: default, driver: dir }
    root_disk:
      - { name: default, devices: { root: { path: /, pool: default, type: disk } } }
    network:
      - name: "{{ intent.nfs.interface | default('') }}"
        type: bridge
        config: { ipv4.address: "{{ incus_bridge }}", ipv4.nat: "true", ipv6.address: none }
    preseed: >-
      {{ ({'storage_pools': pool, 'profiles': root_disk} if incus_pool_missing | bool else {})
         | combine({'networks': network} if incus_network_missing | bool else {}) }}
  changed_when: true
