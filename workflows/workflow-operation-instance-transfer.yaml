id: d58dd3f3-ed2f-44ad-bdce-128aa2399481
name: operation-instance-transfer
description: Transfer one Instance through native placed archive and Route steps.
writes: true
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - instance.transfer
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: archive
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: admission
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  - name: destination-ready
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: ready
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
    dependsOn:
    - step: admission
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
  - name: capture
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: capture
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: destination-ready
      condition:
        type: succeeded
  - name: materialize
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: materialize
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        captured: ${{ steps.capture.outputs }}
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
    dependsOn:
    - step: capture
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
- name: requests
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: cert-request
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificates-node-" + string(self.member.node_id) }}
      methodName: requestAll
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaves: ${{ self.member.leaves }}
        target_node_id: ${{ self.member.node_id }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.certificate_nodes }}
  dependsOn:
  - job: archive
    condition:
      type: succeeded
- name: sign
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: cert-sign
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: orbit-certificate-signing
      methodName: signBatch
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaves: ${{ steps.admission.outputs.certificates }}
        requests: ${{ steps.filter(n, n.startsWith("cert-request-")).map(n, steps[n].outputs.requests) }}
    target: ${{ "orbit-node-" + string(209) }}
    labels:
      node: ${{ string(209) }}
  dependsOn:
  - job: requests
    condition:
      type: succeeded
- name: certificates
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: cert-publish
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificates'
      behaviorName: ${{ "certificates-node-" + string(self.member.node_id) }}
      methodName: publishAll
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        leaves: ${{ self.member.leaves }}
        target_node_id: ${{ self.member.node_id }}
        requests: ${{ steps["cert-request-" + self.key].outputs.requests }}
        signed: ${{ steps["cert-sign"].outputs.certificates }}
    target: ${{ "orbit-node-" + string(self.member.node_id) }}
    labels:
      node: ${{ string(self.member.node_id) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.certificate_nodes }}
  dependsOn:
  - job: sign
    condition:
      type: succeeded
- name: placement
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: cutover
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: cutover
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  - name: prepare
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: route
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        phase: prepare
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
    dependsOn:
    - step: cutover
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
  - name: environment
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: route
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        phase: environment
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
  - name: lan
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: route
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        phase: lan
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
    dependsOn:
    - step: environment
      condition:
        type: succeeded
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
  dependsOn:
  - job: certificates
    condition:
      type: succeeded
- name: php
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: php
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishPhp
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.workload_node_ids }}
  dependsOn:
  - job: placement
    condition:
      type: succeeded
- name: caddy
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: caddy
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishCaddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.caddy_node_ids }}
  dependsOn:
  - job: php
    condition:
      type: succeeded
- name: dns
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: dns
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishDns
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.dns_node_ids }}
  dependsOn:
  - job: caddy
    condition:
      type: succeeded
- name: retirement
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: retire-artifacts
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: route
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        phase: retire
        target_node_id: ${{ self.member }}
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.caddy_node_ids }}
  dependsOn:
  - job: dns
    condition:
      type: succeeded
- name: completion
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: source-remove
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: removeSource
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        captured: ${{ steps.capture.outputs }}
  - name: retire
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: retire
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: source-remove
      condition:
        type: succeeded
  - name: finish
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: finish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed: false
    dependsOn:
    - step: retire
      condition:
        type: succeeded
  dependsOn:
  - job: retirement
    condition:
      type: succeeded
- name: recover-state
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: recovery
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: recover
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ "finish" in steps && steps.finish.status == "succeeded" }}
  - name: rollback
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: rollback
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        decision: ${{ steps.recovery.outputs }}
    dependsOn:
    - step: recovery
      condition:
        type: succeeded
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover) }}
  dependsOn:
  - job: completion
    condition:
      type: always
- name: recover-caddy
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: restore-caddy
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishCaddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs.caddy_node_ids : []
        }}'
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover) }}
  dependsOn:
  - job: recover-state
    condition:
      type: succeeded
- name: recover-dns
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: restore-dns
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishDns
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs.dns_node_ids : [] }}'
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover) }}
  dependsOn:
  - job: recover-caddy
    condition:
      type: succeeded
- name: recover-leaves
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: remove-candidate-certificates
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: removeCandidateCertificates
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        decision: ${{ steps.recovery.outputs }}
        target_node_id: ${{ self.member }}
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs.caddy_node_ids : []
        }}'
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover) }}
  dependsOn:
  - job: recover-dns
    condition:
      type: succeeded
- name: recover-cleanup
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: discard
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: discard
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        decision: ${{ steps.recovery.outputs }}
        target_node_id: ${{ steps.recovery.outputs.destination_node_id }}
    target: ${{ "orbit-node-" + string(steps.recovery.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.recovery.outputs.destination_node_id) }}
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover) }}
  - name: failed
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: finish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed: true
        decision: ${{ steps.recovery.outputs }}
    dependsOn:
    - step: discard
      condition:
        type: succeeded
  dependsOn:
  - job: recover-leaves
    condition:
      type: succeeded
- name: last-resort
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: recover-cleanup
    condition:
      type: always
  steps:
  - name: report-failure
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: ${{ "instance-transfer-failure-" + run.id }}
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
