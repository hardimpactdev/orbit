id: daace7ba-223f-47b6-9452-7c0da7cf384e
name: operation-node-converge-direct
description: Re-apply Orbit's own footprint on a Node with official cfgmgmt from 209, in the chart's steps.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [node.converge]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: converge
  labels: {role: swamp}
  steps:
    # The pinned release; a binary with the pinned SHA-256 is left alone.
  - name: 'Install the Node agent'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/fetch'
      behaviorName: ${{ "node-converge-binary-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {url: '${{ inputs.intent.agent.url }}', path: /usr/local/bin/orbit-agent, checksum: '${{ "sha256:" + inputs.intent.agent_sha256 }}',
        owner: root, group: root, mode: '0755', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # config.toml and ca.pem; the key is never written here.
  - name: 'Configure the Node agent'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Install the Node agent', condition: {type: succeeded}}]
    forEach: {item: file, in: '${{ inputs.intent.agent.files }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-converge-file-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs: {path: '${{ self.file.path }}', ensure: present, content: '${{ self.file.content }}', owner: root, group: root, mode: '0644',
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # The unit, enabled and running.
  - name: 'Start the Node agent'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Configure the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-converge-agent-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {service: orbit-agent.service, unitFile: '${{ inputs.intent.agent.unit }}', enabled: true, ensure: running, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # The agent reads its files only when it starts; this part only runs when it changed.
  - name: 'Restart the Node agent'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Start the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-converge-agent-" + string(inputs.node_id) }}
      methodName: restart
      globalArgs: {service: orbit-agent.service, unitFile: '${{ inputs.intent.agent.unit }}', enabled: true, ensure: running, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # Best effort, as before: an Instance .env loses its world bits.
  - name: 'Close Instance .env files'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Restart the Node agent', condition: {type: succeeded}}]
    guard: '${{ size(inputs.intent.agent.checkouts) == 0 }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60", "/usr/bin/find"] + inputs.intent.agent.checkouts + ["-maxdepth", "1", "-name", ".env", "-type", "f", "-perm", "/o=rwx", "-exec", "chmod", "o-rwx", "{}", "+"] }}'
        timeoutSec: 70
  - name: 'Apply private DNS policy'
    labels: {role: swamp}
    dependsOn: [{step: 'Restart the Node agent', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.network == null }}
    task:
      type: workflow
      workflowIdOrName: operation-fleet-peer-dns
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: fleet.peer_dns
        intent: '${{ inputs.intent.network == null ? {} : {"ssh": inputs.intent.ssh, "server": inputs.intent.network.peer_dns.dns_server,
          "dns_server": inputs.intent.network.peer_dns.dns_server, "public_key": inputs.intent.network.peer_dns.public_key, "domains": inputs.intent.network.peer_dns.domains,
          "dns_hook": inputs.intent.network.peer_dns.dns_hook, "probe": inputs.intent.network.peer_dns.probe}
          }}'
        execution_secrets: {}
    # Each role part runs beside the others; the Gateway reads each part's outcome from its step.
  - name: 'Install Caddy'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ inputs.intent.roles.caddy_package == null }}'
    task:
      type: workflow
      workflowIdOrName: node-caddy-package
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent: '${{ {"ssh": inputs.intent.ssh, "package": inputs.intent.roles.caddy_package} }}'
  - name: 'Publish Caddy sites'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    - {step: 'Install Caddy', condition: {type: always}}
    guard: '${{ inputs.intent.roles.caddy == null || ("Install Caddy" in steps && steps["Install Caddy"].status == "failed") }}'
    task:
      type: workflow
      workflowIdOrName: node-caddy-sites
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent: '${{ {"ssh": inputs.intent.ssh, "user": inputs.intent.roles.user, "caddy": inputs.intent.roles.caddy} }}'
  - name: 'Install private DNS'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ inputs.intent.roles.dns == null }}'
    task:
      type: workflow
      workflowIdOrName: node-private-dns
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent: '${{ {"ssh": inputs.intent.ssh, "dns": inputs.intent.roles.dns} }}'
  - name: 'Configure PHP-FPM'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    forEach: {item: version, in: '${{ inputs.intent.roles.php_versions }}'}
    task:
      type: workflow
      workflowIdOrName: node-php-runtime
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          ssh: '${{ inputs.intent.ssh }}'
          php: {version: '${{ self.version }}', runtime_ini: '${{ inputs.intent.roles.php[self.version] }}'}
  - name: 'Write the tmpfiles rule'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ inputs.intent.roles.tmpfiles == null }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-converge-tmpfiles-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: /etc/tmpfiles.d/orbit.conf, ensure: present, content: '${{ inputs.intent.roles.tmpfiles == null ? "" : inputs.intent.roles.tmpfiles }}', owner: root, group: root, mode: '0644',
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
    # Best effort: a failure is reported as skipped residue and retried on the next converge.
  - name: 'Clear Route residue'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ inputs.intent.roles.residue == null }}'
    task:
      type: workflow
      workflowIdOrName: node-route-residue
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent: '${{ {"ssh": inputs.intent.ssh, "user": inputs.intent.roles.user, "home": inputs.intent.roles.home, "agent_sha256": inputs.intent.agent_sha256, "residue": inputs.intent.roles.residue} }}'
    # The one end check: the pinned binary, the recorded key and the agent files hold the Gateway's hashes.
  - name: 'Check the footprint'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Restart the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/bin/sha256sum, --check, --strict, '-']
        stdin: '${{ inputs.intent.footprint_check }}'
        timeoutSec: 40
