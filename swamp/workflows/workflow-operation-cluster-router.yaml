id: 30f3bb33-0431-4fdf-9cd5-b54c5da45354
name: operation-cluster-router
description: One immutable Router transition on209 with official SSH children and terminal-only projection.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: router
  steps:
  - name: prepare
    target: orbit-node-209
    labels:
      node: '209'
    guard: ${{ inputs.intent.cluster_router.noop || inputs.intent.cluster_router.candidate == null }}
    task:
      type: workflow
      workflowIdOrName: cluster-router-prepare
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent: ${{ inputs.intent.cluster_router.candidate }}
  - name: forward_prepare_certificates
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.prepare_certificates }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-certificate-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          leaf: ${{ self.part }}
          control_node_id: 209
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection
            }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys
            }}
        execution_secrets: {}
        parent_run_id: ${{ run.id }}
        restoring: false
  - name: forward_php
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.serves_routes) }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: operation-route-php-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.part.node_id }}
          user: ${{ self.part.user }}
          host_keys: ${{ self.part.host_keys }}
          control_node_id: ${{ self.part.control_node_id }}
          connection: ${{ self.part.connection }}
          before: ${{ self.part.before.php }}
          after: ${{ self.part.after.php }}
          direction: forward
        execution_secrets: {}
  - name: forward_lan
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.lan }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          rule: ${{ self.part }}
          control_node_id: 209
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection
            }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys
            }}
        execution_secrets: {}
  - name: verify
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: probe
      in: '${{ (!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
        && steps[key].status == "failed") && inputs.intent.cluster_router.candidate != null) ? inputs.intent.cluster_router.candidate.probes
        : [] }}'
    dependsOn:
    - step: prepare
      condition:
        type: always
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    guard: ${{ steps.exists(key, (key.startsWith("forward_") || key == "prepare") && steps[key].status == "failed")
      }}
    task:
      type: workflow
      workflowIdOrName: cluster-router-probe
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent: ${{ self.probe }}
  - name: forward_prepare_caddy
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.serves_routes) }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    - step: verify
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy-delta
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.part.node_id }}
          user: ${{ self.part.user }}
          host_keys: ${{ self.part.host_keys }}
          control_node_id: ${{ self.part.control_node_id }}
          connection: ${{ self.part.connection }}
          before: ${{ self.part.before.caddy }}
          after: ${{ self.part.prepared.caddy }}
          direction: forward
          retain_removed: false
          alternatives: ${{ [self.part.before.caddy,self.part.prepared.caddy,self.part.withdrawn.caddy,self.part.after.caddy]
            }}
        execution_secrets: {}
  - name: forward_urls
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.url_writes }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: forward_prepare_caddy
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-environment-write
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          write: ${{ self.part }}
          control_node_id: 209
          connection: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].connection
            }}
          host_keys: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.node_id == self.part.node_id)[0].host_keys
            }}
        execution_secrets:
          material: ${{ inputs.execution_secrets[self.part.secret_field] }}
  - name: forward_prepare_dns
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.prepared.dns != null) }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: forward_prepare_caddy
      condition:
        type: always
    - step: forward_urls
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    - step: verify
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.part.node_id }}
          control_node_id: ${{ self.part.control_node_id }}
          connection: ${{ self.part.connection }}
          host_keys: ${{ self.part.host_keys }}
          before: ${{ self.part.before.dns }}
          after: ${{ self.part.prepared.dns }}
          alternatives: ${{ [self.part.before.dns,self.part.prepared.dns,self.part.withdrawn.dns,self.part.after.dns]
            }}
        execution_secrets: {}
  - name: forward_dns_grace
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: '${{ inputs.intent.route_mutations.forward.publications.exists(p,p.before.dns != null && p.before.dns.digest
        != p.after.dns.digest) ? [{}] : [] }}'
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
      && steps[key].status == "failed")) || steps.exists(key, key.startsWith("forward_") && steps[key].status
      == "failed") }}
    dependsOn:
    - step: forward_prepare_certificates
      condition:
        type: always
    - step: forward_php
      condition:
        type: always
    - step: forward_lan
      condition:
        type: always
    - step: forward_prepare_caddy
      condition:
        type: always
    - step: forward_urls
      condition:
        type: always
    - step: forward_prepare_dns
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-dns-grace
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: {}
        execution_secrets: {}
  - name: forward_withdraw_caddy
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: part
      in: ${{ inputs.intent.route_mutations.forward.publications.filter(p,p.serves_routes) }}
    guard: ${{ !(!inputs.intent.cluster_router.noop && !steps.exists(key, (key == "prepare" || key.startsWith("verify-"))
