command: instance:clone
chart: instance/clone
target: app-prod
sources: [gateway]
baseline: [operations]
uncovered:
  production-checkout-exception: "Gateway tests keep production checkout cloning, its retry identity and app-prod placement checks. The candidate remains a checkout. Task-copy end-to-end proof is owed and cannot run in the Amp orb."
cases:
  - id: invalid-candidate
    batch: fresh-fleet
    covers: []
    summary: Refuse a nonnumeric candidate before production admission.
    act:
      - cli:
          run: [instance:clone, invalid, "1", production, --preview-name=preview]
          expect: {exit: 1, code: instance.candidate_id_invalid, request: none}
    expect:
      - unchanged: {since: act, what: [operations]}
