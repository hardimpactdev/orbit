[package]
name = "orbit-executor-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Host-resource primitives of the Orbit executor: files, dotenv keys, access lists, trust, units, configuration sets and HTTP probes (ADR 0271 N3)"

[dependencies]
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# Raises the open-file limit for the large-tree test.
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"

[lints]
workspace = true
