# SPIKE. The scenario of the three firewall:allow cases that change a state all cases share: the ufw program of a Node.
#   interrupted-reorder, failure-after-partial-change   a fault makes ufw fail in the middle of the apply, then a retry finishes it
#   busy-target                                          a held write keeps the Node busy, so a second write is refused
# In the runner these cases are the batch `ufw-fault` (swamp/proof/batches.yaml): they run one after the other, on app-dev, after Swamp restored
# `base`. Run it alone from the parent directory (firewall-allow/), in the task VM:   molecule test -s ufw-fault
#   prepare (listeners, test denies, the misplaced row) -> converge (the shim, the CLI, the snapshots) -> verify (state, records, probes) -> cleanup
# Same convention as ../default: the VM is the operator side (ansible_connection local), the three nested containers are reached with
# community.general.incus, the real `orbit` CLI runs on the VM, and results are cacheable facts between the playbooks of one `molecule test`.
driver:
  name: default
  options:
    managed: false

platforms:
  - name: nested-gateway
  - name: nested-app-dev
  - name: nested-app-prod

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: ansible.builtin.default
      callbacks_enabled: ansible.posix.profile_tasks
      gathering: explicit
      interpreter_python: auto_silent
      # converge.yml leaves its results as cacheable facts; verify.yml reads them in the next ansible-playbook run. Its own directory: the
      # default scenario must not read these facts.
      fact_caching: jsonfile
      fact_caching_connection: /tmp/molecule-ufw-fault-facts
      fact_caching_timeout: 3600
  inventory:
    hosts:
      all:
        vars:
          # The nested Gateway, as the outer VM reaches it. The caller is identified by its WireGuard address, so no token is needed.
          gateway_url: https://10.45.0.1/api/v1
          gateway_ca: /home/orbit/.orbit/nested-ca.pem
          # The CLI under test, as the outer VM runs it: the checkout of the VM, the nested profile in ORBIT_HOME. The checkout also holds
          # the ufw shim (tools/swamp-proof-guest/ufw-shim.sh) that converge copies to the container.
          checkout: "{{ lookup('ansible.builtin.env', 'ORBIT_CHECKOUT') | default('/home/orbit/apps/orbit/workspace', true) }}"
          orbit: [php, "{{ checkout }}/apps/cli/orbit"]
          cli_env: {PATH: /usr/local/bin:/usr/bin:/bin, HOME: /home/orbit, ORBIT_HOME: /home/orbit/.orbit}
          # ANSIBLE_FORKS is the limit of probes that run at a time. The cases themselves always run one at a time (serial: 1).
          # PROOF_FAST=1 polls every 1 s instead of 5 s and lets facts.yml read the facts once.
          parallel_limit: "{{ lookup('ansible.builtin.env', 'ANSIBLE_FORKS') | default('1', true) | int }}"
          fast: "{{ lookup('ansible.builtin.env', 'PROOF_FAST') | default('0', true) == '1' }}"
          poll_delay: "{{ 1 if fast else 5 }}"
          # The Node that every other Node is judged against: the one source an allow admits, and the one that stays blocked.
          allowed_of: {app-dev: gateway, app-prod: gateway, gateway: app-dev}
          blocked_of: {app-dev: app-prod, app-prod: app-dev, gateway: app-prod}
          # The state of the shim on the container (the directory the shim reads by default) and the seconds the busy-target lock may last.
          shim_dir: /var/tmp/proof-ufw
          busy_seconds: 120
          # One port pair per case, as in the runner. The numbers differ from ../default (+1..+30), so both scenarios can run on one VM.
          port_base: "{{ lookup('ansible.builtin.env', 'PROOF_PORT_BASE') | default(47100, true) | int }}"
          cases:
            interrupted_reorder:          {port: "{{ port_base | int + 41 }}", control: "{{ port_base | int + 51 }}"}
            failure_after_partial_change: {port: "{{ port_base | int + 42 }}", control: "{{ port_base | int + 52 }}"}
            # `spare` is the port of the write that busy-target holds; it needs no listener and no deny.
            busy_target:                  {port: "{{ port_base | int + 43 }}", control: "{{ port_base | int + 53 }}", spare: "{{ port_base | int + 63 }}"}
        children:
          control:
            hosts:
              localhost:
                ansible_connection: local
          # One host per case. They run one after the other (serial: 1 in converge.yml), in this order.
          case_hosts:
            vars:
              ansible_connection: local
            hosts:
              interrupted_reorder: {}
              busy_target: {}
              failure_after_partial_change: {}
          nodes:
            vars:
              ansible_connection: community.general.incus
            hosts:
              nested-gateway:  {ansible_incus_host: nested-gateway}
              nested-app-dev:  {ansible_incus_host: nested-app-dev}
              nested-app-prod: {ansible_incus_host: nested-app-prod}

scenario:
  # `cleanup` last puts the real ufw back even when a case left the shim (converge also does it for each case in an `always` section).
  test_sequence:
    - prepare
    - converge
    - verify
    - cleanup
