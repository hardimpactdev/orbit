[package]
name = "orbit-executor-instance"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Instance container clones for the Orbit executor (ADR 0271)"

[dependencies]
orbit-executor-core = { path = "../executor-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
base64 = "0.22"
crypto_box = { version = "0.9", default-features = false, features = ["seal", "salsa20", "getrandom", "std"] }
tempfile = "3"

[lints]
workspace = true
