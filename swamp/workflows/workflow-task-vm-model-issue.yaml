id: af8f92b8-61ae-4f8b-a348-0c73dbd9072d
name: task-vm-model-issue
description: 'One parent-local model issue fragment: full intent, vault env, inline
  actions and native result.'
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.provision
      - tasks.provision
      - task_vm.enroll
      - task_vm.image_refresh
      - task_vm.prepare_runtime
    intent:
      type: object
      properties:
        task_vm_id:
          type: integer
          minimum: 1
        gateway_node_id:
          type: integer
          minimum: 1
        model_router_node_id:
          type: integer
          minimum: 1
        model_origin:
          type: string
          format: uri
      required:
      - task_vm_id
      - gateway_node_id
      - model_router_node_id
      - model_origin
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        model_key:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-vm-model-key-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
        model_router_management:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^model-router-management-node-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
        model_router_anchor:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^model-router-anchor-node-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - model_key
      - model_router_management
      - model_router_anchor
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: model
  labels: {role: swamp}
  steps:
  - name: input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ ("ansible-input-model-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}
      methodName: write
      inputs:
        intent: ${{ inputs.intent }}
        path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
  - name: anchor
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: input
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-model-router-vm-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, -e "@$ORBIT_RUN/intent.json" --tags anchor "$ORBIT_ANSIBLE/task-vm-model-key.yml"
        env: &model
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps.input.outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps.input.outputs.assets + "/ansible.cfg" }}
          ANSIBLE_FORCE_COLOR: '0'
          ORBIT_MODEL_KEY: ${{ vault.get(inputs.execution_secrets.model_key.vault, inputs.execution_secrets.model_key.key) }}
          ORBIT_MODEL_MANAGEMENT: ${{ vault.get(inputs.execution_secrets.model_router_management.vault, inputs.execution_secrets.model_router_management.key) }}
          ORBIT_MODEL_ANCHOR: ${{ vault.get(inputs.execution_secrets.model_router_anchor.vault, inputs.execution_secrets.model_router_anchor.key) }}
  - name: issue
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: anchor
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-model-router-vm-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, -e "@$ORBIT_RUN/intent.json" --tags issue "$ORBIT_ANSIBLE/task-vm-model-key.yml"
        env: *model
  - name: result
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: issue
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-model-router-vm-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: |-
          printf '{"task_vm_id": %s, "issued": true}\n' "$ORBIT_TASK_VM_ID"
        env:
          ORBIT_TASK_VM_ID: ${{ string(inputs.intent.task_vm_id) }}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: model, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-model-router-vm-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
