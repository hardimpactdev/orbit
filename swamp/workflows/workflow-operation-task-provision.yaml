id: 11b8ed3f-1814-4165-80c9-8af59fe94c22
name: operation-task-provision
description: >-
  Start a task VM for a task group (docs/cli/tasks/provision.mmd) from full inputs on 209: a copy of the host's base snapshot with a clone
  of its seed, the identity the admission minted and the claim's Pi token and models file (the guard origin and the fixed model key), with
  the hub peer added beside the boot; the converge of the release refresh, which is a no-op on a current base, and the new task branch;
  then one ready check. No step calls the Gateway or the model router.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [tasks.provision, task_vm.image_refresh]}
    intent: {type: object}
    execution_secrets:
      type: object
      # The slot's identity, which the start writes onto the new VM; and the claim: the Pi token and the models file with the fixed model key.
      properties:
        wireguard: &secret
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^(task-vm-slot-(wireguard|ssh-host|agent)-[1-9][0-9]*)$'}
          required: [vault, key]
          additionalProperties: false
        ssh_host: *secret
        agent_secret: *secret
        claim:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: '^task-vm-pi-claim-[1-9][0-9]*$'}
          required: [vault, key]
          additionalProperties: false
      required: [wireguard, ssh_host, agent_secret, claim]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: provision
  labels: {role: swamp}
  steps:
  - name: Create and start the VM
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-slot-start
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ {"wireguard": inputs.execution_secrets.wireguard, "ssh_host": inputs.execution_secrets.ssh_host,
          "agent_secret": inputs.execution_secrets.agent_secret, "claim": inputs.execution_secrets.claim} }}'}
  # The VM's peer on the WireGuard hub, while the VM boots.
  - name: Add the hub peer
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-hub-peer
      inputs: {hub: '${{ inputs.intent.hub_peer.hub }}', hub_ssh_execution: '${{ inputs.intent.hub_peer.hub_ssh_execution }}',
        public_key: '${{ inputs.intent.hub_peer.public_key }}', guest_node_id: '${{ inputs.intent.hub_peer.guest_node_id }}'}
  - name: Converge and branch
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Create and start the VM, condition: {type: succeeded}}, {step: Add the hub peer, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent.converge }}
        guest: ${{ inputs.intent.slot.name }}
        tags: software,tools,boot,checkout,fleet,check,branch
        with_pi: ${{ inputs.intent.with_pi }}
  # One exec: the agent, the tunnel, Pi and the three containers. The tunnel is up once WireGuard has a handshake with the hub; the hub
  # answers no ping from a task VM, so a ping proves nothing. Keepalive makes the first handshake at once; the exec waits up to 20 s for it.
  - name: Read the readiness
    labels: {role: swamp}
    dependsOn: [{step: Converge and branch, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-ready-vm-" + string(inputs.intent.guest_ssh.target.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-ready-vm-" + string(inputs.intent.guest_ssh.target.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.host.ssh.target.user }}', port: '${{ inputs.intent.host.ssh.target.port }}', identityFile: '${{ inputs.intent.host.ssh.identity_file }}'}
        hosts: [{name: host, address: '${{ inputs.intent.host.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.host.ssh.target.host_keys }}'}}]
      inputs:
        hosts: name:host
        sudo: true
        okExitCodes: any
        argv: [timeout, '60', incus, --project, '${{ inputs.intent.host.project }}', exec, '${{ inputs.intent.slot.name }}', --, sh, -c,
          'systemctl is-active "$1" "$2" "$3"; for i in $(seq 20); do test "$(wg show orbit latest-handshakes | cut -f2 | sort -n | tail -n 1)" -gt 0 2>/dev/null && echo tunnel-up && break; sleep 1; done; incus list --format csv --columns ns', sh,
          orbit-agent.service, wg-quick@orbit.service, '${{ inputs.intent.slot.pi_unit }}']
        timeoutSec: 90
  # What every later step does (sync, check, turn, script): ssh from a Swamp worker to the VM over WireGuard, with its pinned host key.
  - name: Reach the VM by WireGuard
    labels: {role: swamp}
    dependsOn: [{step: Converge and branch, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-reach-" + string(inputs.intent.guest_ssh.target.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-reach-" + string(inputs.intent.guest_ssh.target.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.guest_ssh.target.user }}', port: '${{ inputs.intent.guest_ssh.target.port }}', identityFile: '${{ inputs.intent.guest_ssh.identity_file }}'}
        hosts: [{name: vm, address: '${{ inputs.intent.guest_ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.guest_ssh.target.host_keys }}'}}]
      inputs:
        hosts: name:vm
        argv: ['true']
        timeoutSec: 30
  - name: Check ready
    labels: {role: swamp}
    dependsOn: [{step: Read the readiness, condition: {type: succeeded}}, {step: Reach the VM by WireGuard, condition: {type: succeeded}}]
    task:
      type: assert
      expr: >-
        steps["Read the readiness"].outputs.stdout.split("\n").filter(l, l == "active").size() == 3
        && steps["Read the readiness"].outputs.stdout.contains("tunnel-up")
        && steps["Read the readiness"].outputs.stdout.split("\n").filter(l, l.endsWith(",RUNNING")).size() == 3
      severity: high
      message: '${{ "The task VM is not ready: " + steps["Read the readiness"].outputs.stdout }}'
