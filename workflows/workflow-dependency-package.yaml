id: f6396e8f-001e-48d0-8f89-5ac76037381b
name: dependency-package
tags: {}
description: Admit or resume one project batch group and reconcile its existing per-group owner.
inputs:
  properties:
    workItem: { type: string }
    targets: { type: array, items: { type: object }, minItems: 1 }
  required: [workItem, targets]
jobs:
  - name: tick
    steps:
      - name: admit
        task:
          type: model_method
          modelIdOrName: orbit-gateway
          methodName: admit_package
          inputs:
            workItem: '${{ inputs.workItem }}'
            targets: '${{ inputs.targets }}'
      - name: reconcile
        dependsOn:
          - step: admit
            condition: { type: succeeded }
        task:
          type: workflow
          workflowIdOrName: group-supervise
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: dependency-package
            preapprovalModel: orbit-driver-package
