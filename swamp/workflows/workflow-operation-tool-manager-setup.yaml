id: 2a25f8bb-82b0-4bcb-93d2-cd0ce9fcb4af
name: operation-tool-manager-setup
description: The shared Tool Manager setup that tool.install runs on first use and the development deploy runs for Vite+.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    ssh:
      type: object
    report:
      type: boolean
  required:
  - operation_id
  - node_id
  - intent
  - ssh
  additionalProperties: false
jobs:
- name: setup
  steps:
  - {"name":"Prepare manager commands","labels":{"role":"swamp"},"task":{"type":"behavior","behaviorType":"@nckrtl/tool-write-command","behaviorName":"${{ \"tm-argv-\" + string(inputs.node_id) }}","methodName":"manager_assets","inputs":{"input":"${{ inputs.intent }}"}}}
  - {"name":"Read manager version","labels":{"role":"swamp"},"dependsOn":[{"step":"Prepare manager commands","condition":{"type":"succeeded"}}],"task":{"type":"behavior","behaviorType":"@swamp/ssh","behaviorName":"${{ \"tm-command-\" + string(inputs.node_id) }}","methodName":"exec","globalArgs":{"name":"${{ \"tm-command-\" + string(inputs.node_id) }}","transport":{"kind":"ssh","user":"${{ inputs.ssh.target.user }}","port":"${{ inputs.ssh.target.port }}","identityFile":"${{ inputs.ssh.identity_file }}","hostKeys":"${{ inputs.ssh.target.host_keys }}","identitiesOnly":true},"hosts":[{"name":"target","address":"${{ inputs.ssh.target.host }}"}]},"inputs":{"hosts":"name:target","sudo":false,"argv":"${{ [\"timeout\", \"60\"] + steps[\"Prepare manager commands\"].outputs.version }}","timeoutSec":905,"okExitCodes":"any"}}}
  - {"name":"Read the pinned installer","labels":{"role":"swamp"},"dependsOn":[{"step":"Read manager version","condition":{"type":"succeeded"}}],"guard":"${{ steps[\"Read manager version\"].outputs.exitCode != 127 || !(\"setup\" in inputs.intent) || inputs.intent.setup == null || inputs.intent.platform != \"linux\" }}","task":{"type":"behavior","behaviorType":"@nckrtl/node-tool-setup-assets","behaviorName":"${{ \"tm-pinned-installer-\" + string(inputs.node_id) }}","methodName":"read","inputs":{"setup":"${{ inputs.intent.setup }}"}}}
  - {"name":"Refresh prerequisites","labels":{"role":"swamp"},"writes":true,"dependsOn":[{"step":"Read the pinned installer","condition":{"type":"completed"}}],"guard":"${{ steps[\"Read manager version\"].outputs.exitCode != 127 || !(\"setup\" in inputs.intent) || inputs.intent.setup == null || inputs.intent.platform != \"linux\" || size(steps[\"Prepare manager commands\"].outputs.packages) == 0 }}","task":{"type":"behavior","behaviorType":"@swamp/cfgmgmt/apt","behaviorName":"${{ \"tm-prerequisites-\" + string(inputs.node_id) }}","methodName":"refresh","globalArgs":{"nodeHost":"${{ inputs.ssh.target.host }}","nodeUser":"${{ inputs.ssh.target.user }}","nodePort":"${{ inputs.ssh.target.port }}","nodeIdentityFile":"${{ inputs.ssh.identity_file }}","become":true,"packages":"${{ steps[\"Prepare manager commands\"].outputs.packages }}","ensure":"present"},"inputs":{}}}
