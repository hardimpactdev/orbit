id: d58dd3f3-ed2f-44ad-bdce-128aa2399481
name: operation-instance-transfer
description: >-
  Move one captured development checkout through native209 SSH, Process and
  Route children.
queueTimeout: 30
vaults:
  - orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
        - instance.transfer
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
              - orbit-control-inputs
          key:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'
        required:
          - vault
          - key
        additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: transfer
    target: orbit-node-209
    steps:
      - name: destination-ready-assets
        target: orbit-node-209
        dependsOn: []
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-0" }}'
          methodName: read
          inputs:
            action: transfer_probe
            input:
              path: '${{ inputs.intent.destination.destination }}'
              root: '${{ inputs.intent.destination.root }}'
              destination: true
      - name: destination-ready
        target: orbit-node-209
        dependsOn:
          - step: destination-ready-assets
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-1" }}'
          methodName: script
          globalArgs: &ref_1
            name: '${{ "itr-destination-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.destination.ssh_execution.target.user }}'
              port: '${{ inputs.intent.destination.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.destination.ssh_execution.identity_file }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.destination.ssh_execution.target.host }}'
                transport:
                  hostKeys: >-
                    ${{ inputs.intent.destination.ssh_execution.target.host_keys
                    }}
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destination-ready-assets"].outputs.script_body }}'
      - name: source-filesystem-assets
        target: orbit-node-209
        dependsOn:
          - step: destination-ready
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-2" }}'
          methodName: read
          inputs:
            action: transfer_probe
            input:
              path: '${{ inputs.intent.source.source }}'
              destination: false
      - name: source-filesystem
        target: orbit-node-209
        dependsOn:
          - step: source-filesystem-assets
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-3" }}'
          methodName: script
          globalArgs: &ref_0
            name: '${{ "itr-source-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.source.ssh_execution.target.user }}'
              port: '${{ inputs.intent.source.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.source.ssh_execution.identity_file }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.source.ssh_execution.target.host }}'
                transport:
                  hostKeys: '${{ inputs.intent.source.ssh_execution.target.host_keys }}'
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["source-filesystem-assets"].outputs.script_body }}'
      - name: top
        target: orbit-node-209
        dependsOn:
          - step: source-filesystem
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-4" }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.source }}'
              - rev-parse
              - '--show-toplevel'
      - name: git-directory
        target: orbit-node-209
        dependsOn:
          - step: top
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-5" }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.source }}'
              - rev-parse
              - '--absolute-git-dir'
      - name: common
        target: orbit-node-209
        dependsOn:
          - step: git-directory
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-6" }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-c'
              - core.hooksPath=/dev/null
              - '-c'
              - core.fsmonitor=false
              - '-C'
              - '${{ inputs.intent.source.source }}'
              - rev-parse
              - '--path-format=absolute'
              - '--git-common-dir'
      - name: origin-assets
        target: orbit-node-209
        dependsOn:
          - step: common
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-7" }}'
          methodName: read
          inputs:
            action: origin
            input:
              checkout: '${{ inputs.intent.source.source }}'
      - name: origin
        target: orbit-node-209
        dependsOn:
          - step: origin-assets
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-8" }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["origin-assets"].outputs.script_body }}'
      - name: source-proof
        target: orbit-node-209
        dependsOn:
          - step: origin
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-9" }}'
          methodName: transferSource
          inputs:
            identity: '${{ inputs.intent.source.repository_identity }}'
            path: '${{ inputs.intent.source.source }}'
            top: '${{ steps["top"].outputs }}'
            origin: '${{ steps["origin"].outputs }}'
            git_directory: '${{ steps["git-directory"].outputs }}'
            common: '${{ steps["common"].outputs }}'
            filesystem: '${{ steps["source-filesystem"].outputs }}'
      - name: pause
        target: orbit-node-209
        dependsOn:
          - step: source-proof
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        forEach:
          item: member
          in: '${{ inputs.intent.processes.source }}'
        task:
          type: workflow
          workflowIdOrName: operation-process-control
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.stop
            intent: '${{ self.member.stop_intent }}'
            execution_secrets: {}
      - name: archive-assets
        target: orbit-node-209
        dependsOn:
          - step: source-proof
            condition:
              type: always
          - step: pause
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-11" }}'
          methodName: read
          inputs:
            action: transfer_archive
            input:
              path: '${{ inputs.intent.source.source }}'
              common: '${{ steps["source-proof"].outputs.common }}'
              git_directory: '${{ steps["source-proof"].outputs.git_directory }}'
              archive: '${{ "/tmp/orbit-transfer-" + run.id + ".tar" }}'
      - name: archive
        target: orbit-node-209
        dependsOn:
          - step: archive-assets
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-12" }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["archive-assets"].outputs.script_body }}'
      - name: download
        target: orbit-node-209
        dependsOn:
          - step: archive
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-13" }}'
          methodName: copy
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            src: '${{ "/tmp/orbit-transfer-" + run.id + ".tar" }}'
            dst: '${{ "/tmp/orbit-transfer-" + run.id + ".download.tar" }}'
            direction: from
      - name: upload
        target: orbit-node-209
        dependsOn:
          - step: download
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-14" }}'
          methodName: copy
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            src: '${{ "/tmp/orbit-transfer-" + run.id + ".download.tar" }}'
            dst: '${{ "/tmp/orbit-transfer-" + run.id + ".install.tar" }}'
            direction: to
            mode: '0600'
            atomic: true
      - name: install-assets
        target: orbit-node-209
        dependsOn:
          - step: upload
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-15" }}'
          methodName: read
          inputs:
            action: transfer_install
            input:
              path: '${{ inputs.intent.destination.destination }}'
              archive: '${{ "/tmp/orbit-transfer-" + run.id + ".install.tar" }}'
      - name: install
        target: orbit-node-209
        dependsOn:
          - step: install-assets
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-16" }}'
          methodName: script
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["install-assets"].outputs.script_body }}'
      - name: destination-proof
        target: orbit-node-209
        dependsOn:
          - step: install
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-17" }}'
          methodName: decode
          inputs:
            observation: '${{ steps["install"].outputs }}'
      - name: standalone
        target: orbit-node-209
        dependsOn:
          - step: destination-proof
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-18" }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-C'
              - '${{ inputs.intent.destination.destination }}'
              - config
              - core.bare
              - 'false'
      - name: worktree-config
        target: orbit-node-209
        dependsOn:
          - step: standalone
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-19" }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '-C'
              - '${{ inputs.intent.destination.destination }}'
              - config
              - '--unset-all'
              - core.worktree
            okExitCodes:
              - 0
              - 5
      - name: environment-permissions-assets
        target: orbit-node-209
        dependsOn:
          - step: worktree-config
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-20" }}'
          methodName: read
          inputs:
            action: protect_environment
            input:
              application: '${{ inputs.intent.destination.application }}'
      - name: environment-permissions
        target: orbit-node-209
        dependsOn:
          - step: environment-permissions-assets
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-21" }}'
          methodName: script
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["environment-permissions-assets"].outputs.script_body }}'
      - name: workloads
        target: orbit-node-209
        dependsOn:
          - step: environment-permissions
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        forEach:
          item: workload
          in: '${{ inputs.intent.workloads }}'
        task:
          type: workflow
          workflowIdOrName: instance-route-workload
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ self.workload }}'
            execution_secrets: {}
      - name: activate
        target: orbit-node-209
        dependsOn:
          - step: environment-permissions
            condition:
              type: always
          - step: workloads
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        forEach:
          item: member
          in: '${{ inputs.intent.processes.destination }}'
        task:
          type: workflow
          workflowIdOrName: operation-process-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.create
            intent: '${{ self.member.intent }}'
            execution_secrets: >-
              ${{ self.member.secret_field in inputs.execution_secrets ?
              {"environment":inputs.execution_secrets[self.member.secret_field]}
              : {} }}
      - name: forward
        target: orbit-node-209
        dependsOn:
          - step: environment-permissions
            condition:
              type: always
          - step: workloads
            condition:
              type: always
          - step: activate
            condition:
              type: always
        guard: '${{ steps.exists(n, steps[n].status == "failed") }}'
        allowFailure: true
        task:
          type: workflow
          workflowIdOrName: route-mutation-forward
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent }}'
            execution_secrets: '${{ inputs.execution_secrets }}'
            parent_run_id: '${{ run.id }}'
      - name: restore
        target: orbit-node-209
        dependsOn:
          - step: forward
            condition:
              type: always
        guard: >-
          ${{ (("forward" in steps) && steps["forward"].status == "succeeded" &&
          steps.forward.outputs.result.ready) || !("destination-proof" in steps)
          || steps["destination-proof"].status != "succeeded" }}
        allowFailure: true
        task:
          type: workflow
          workflowIdOrName: route-mutation-restore
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent }}'
            execution_secrets: '${{ inputs.execution_secrets }}'
            parent_run_id: '${{ run.id }}'
      - name: restore-source-runtime
        target: orbit-node-209
        dependsOn:
          - step: restore
            condition:
              type: always
        guard: >-
          ${{ ("forward" in steps) && steps["forward"].status == "succeeded" &&
          steps.forward.outputs.result.ready }}
        forEach:
          item: member
          in: '${{ inputs.intent.processes.source }}'
        task:
          type: workflow
          workflowIdOrName: operation-process-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.create
            intent: '${{ self.member.intent }}'
            execution_secrets: >-
              ${{ self.member.secret_field in inputs.execution_secrets ?
              {"environment":inputs.execution_secrets[self.member.secret_field]}
              : {} }}
      - name: discard-destination-runtime
        target: orbit-node-209
        dependsOn:
          - step: restore
            condition:
              type: always
          - step: restore-source-runtime
            condition:
              type: always
        guard: >-
          ${{ ("forward" in steps) && steps["forward"].status == "succeeded" &&
          steps.forward.outputs.result.ready || !("destination-proof" in steps)
          || steps["destination-proof"].status != "succeeded" || !(("restore" in
          steps) && steps["restore"].status == "succeeded" &&
          steps.restore.outputs.result.ready) ||
          steps.exists(n,n.startsWith("restore-source-runtime-") &&
          steps[n].status == "failed") }}
        forEach:
          item: member
          in: '${{ inputs.intent.processes.destination }}'
        task:
          type: workflow
          workflowIdOrName: operation-process-destroy
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.destroy
            intent: '${{ self.member.control_intent }}'
            execution_secrets: {}
      - name: discard-assets
        target: orbit-node-209
        dependsOn:
          - step: restore
            condition:
              type: always
          - step: restore-source-runtime
            condition:
              type: always
          - step: discard-destination-runtime
            condition:
              type: always
        guard: >-
          ${{ ("forward" in steps) && steps["forward"].status == "succeeded" &&
          steps.forward.outputs.result.ready || !("destination-proof" in steps)
          || steps["destination-proof"].status != "succeeded" || !(("restore" in
          steps) && steps["restore"].status == "succeeded" &&
          steps.restore.outputs.result.ready) || steps.exists(n,
          (n.startsWith("restore-source-runtime-") ||
          n.startsWith("discard-destination-runtime-")) && steps[n].status ==
          "failed") }}
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-28" }}'
          methodName: read
          inputs:
            action: transfer_remove
            input:
              proof: '${{ steps["destination-proof"].outputs }}'
      - name: discard
        target: orbit-node-209
        dependsOn:
          - step: discard-assets
            condition:
              type: always
        guard: >-
          ${{ ("forward" in steps) && steps["forward"].status == "succeeded" &&
          steps.forward.outputs.result.ready || !("destination-proof" in steps)
          || steps["destination-proof"].status != "succeeded" || !(("restore" in
          steps) && steps["restore"].status == "succeeded" &&
          steps.restore.outputs.result.ready) || steps.exists(n,
          (n.startsWith("restore-source-runtime-") ||
          n.startsWith("discard-destination-runtime-")) && steps[n].status ==
          "failed") }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-29" }}'
          methodName: script
          globalArgs: *ref_1
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["discard-assets"].outputs.script_body }}'
      - name: result
        target: orbit-node-209
        dependsOn:
          - step: discard
            condition:
              type: always
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-30" }}'
          methodName: transferResult
          inputs:
            cutover: >-
              ${{ ("forward" in steps) && steps["forward"].status == "succeeded"
              && steps.forward.outputs.result.ready }}
            restored: >-
              ${{ ("restore" in steps) && steps["restore"].status == "succeeded"
              && steps.restore.outputs.result.ready }}
            transfer_id: '${{ inputs.intent.transfer_id }}'
            outcomes: '${{ steps }}'
      - name: retire-runtime
        target: orbit-node-209
        dependsOn:
          - step: result
            condition:
              type: always
        guard: >-
          ${{ !(("forward" in steps) && steps["forward"].status == "succeeded"
          && steps.forward.outputs.result.ready) || !("result" in steps) ||
          steps.result.status != "succeeded" }}
        forEach:
          item: member
          in: '${{ inputs.intent.processes.source }}'
        task:
          type: workflow
          workflowIdOrName: operation-process-destroy
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.destroy
            intent: '${{ self.member.control_intent }}'
            execution_secrets: {}
      - name: retire-source-assets
        target: orbit-node-209
        dependsOn:
          - step: result
            condition:
              type: always
          - step: retire-runtime
            condition:
              type: always
        guard: >-
          ${{ !(("forward" in steps) && steps["forward"].status == "succeeded"
          && steps.forward.outputs.result.ready) || !("result" in steps) ||
          steps.result.status != "succeeded" ||
          steps.exists(n,n.startsWith("retire-runtime-") && steps[n].status ==
          "failed") }}
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-32" }}'
          methodName: read
          inputs:
            action: transfer_remove
            input:
              proof: '${{ steps["source-proof"].outputs }}'
      - name: retire-source
        target: orbit-node-209
        dependsOn:
          - step: retire-source-assets
            condition:
              type: always
        guard: >-
          ${{ !(("forward" in steps) && steps["forward"].status == "succeeded"
          && steps.forward.outputs.result.ready) || !("result" in steps) ||
          steps.result.status != "succeeded" ||
          steps.exists(n,n.startsWith("retire-runtime-") && steps[n].status ==
          "failed") }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-33" }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["retire-source-assets"].outputs.script_body }}'
      - name: prune-worktree
        target: orbit-node-209
        dependsOn:
          - step: retire-source
            condition:
              type: always
        guard: >-
          ${{ !(("forward" in steps) && steps["forward"].status == "succeeded"
          && steps.forward.outputs.result.ready) || !("result" in steps) ||
          steps.result.status != "succeeded" ||
          steps["source-proof"].outputs.common ==
          steps["source-proof"].outputs.git_directory }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-34" }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/git
              - '--git-dir'
              - '${{ steps["source-proof"].outputs.common }}'
              - worktree
              - prune
      - name: remove-source-archive
        target: orbit-node-209
        dependsOn:
          - step: prune-worktree
            condition:
              type: always
        guard: >-
          ${{ ! ("archive" in steps) || steps["archive"].status != "succeeded"
          }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-35" }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/rm
              - '-f'
              - '--'
              - '${{ "/tmp/orbit-transfer-" + run.id + ".tar" }}'
      - name: remove-destination-archive
        target: orbit-node-209
        dependsOn:
          - step: remove-source-archive
            condition:
              type: always
        guard: '${{ ! ("upload" in steps) || steps["upload"].status != "succeeded" }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "itr-" + run.id + "-36" }}'
          methodName: exec
          globalArgs: *ref_1
          inputs:
