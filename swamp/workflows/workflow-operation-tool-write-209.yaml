id: 3f4a442f-a80b-4d66-9ef8-5b1f4c462f7f
name: operation-tool-write-209
description: Tool install and update from 209 in the steps of docs/flows/tool.install.mmd and tool.update.mmd, one shipped phase script per step through official SSH.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [tool.install, tool.update]}
    intent: {type: object}
    ssh: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, ssh]
  additionalProperties: false
# Node steps carry their flow chart labels (ADR 0246); install and update share this workflow, so each kind's own
# labels run only for that kind. Lowercase steps are typed work on 209 that the charts do not show. A Node step prints
# its result and exits nonzero when it did not do its job; later steps read that exit code.
jobs:
- name: tools
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/tool-write-command'
      behaviorName: '${{ "tw-assets-" + run.id }}'
      methodName: assets
      inputs: {input: '${{ inputs.intent }}'}
  # Only when the Tool Manager is not ready yet: the shared setup child, which the development deploy also runs.
  - name: Set up the Tool Manager
    target: orbit-node-209
    dependsOn: [{step: assets, condition: {type: succeeded}}]
    guard: '${{ inputs.intent.kind == "tool.update" || !("setup" in inputs.intent) || inputs.intent.setup == null || ("manager_ready" in inputs.intent && inputs.intent.manager_ready) }}'
    task:
      type: workflow
      workflowIdOrName: operation-tool-manager-setup
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', intent: '${{ inputs.intent }}', ssh: '${{ inputs.ssh }}', report: true}
  - name: Add the signed apt source
    target: orbit-node-209
    dependsOn:
      - {step: assets, condition: {type: succeeded}}
      - {step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ inputs.intent.kind != "tool.install" || !("repository_given" in inputs.intent) || !inputs.intent.repository_given || ("Set up the Tool Manager" in steps && steps["Set up the Tool Manager"].status == "succeeded" && steps["Set up the Tool Manager"].outputs["Set up the Tool Manager"].exitCode != 0) }}'
    task: &source
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tw-source-" + run.id }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ "tw-ssh-" + run.id }}'
        transport:
          kind: ssh
          user: '${{ inputs.ssh.target.user }}'
          port: '${{ inputs.ssh.target.port }}'
          identityFile: '${{ inputs.ssh.identity_file }}'
          identitiesOnly: true
          hostKeys: '${{ inputs.ssh.target.host_keys }}'
        hosts: [{name: target, address: '${{ inputs.ssh.target.host }}'}]
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 65
        argv: [timeout, '60', python3, -I, -c, '${{ steps.assets.outputs.driver }}', source]
        stdin: '${{ steps.assets.outputs.bundle }}'
  - name: Update the apt source
    target: orbit-node-209
    dependsOn: [{step: assets, condition: {type: succeeded}}]
    guard: '${{ inputs.intent.kind != "tool.update" || !("repository_given" in inputs.intent) || !inputs.intent.repository_given }}'
    task: *source
  - name: Check the candidate
    target: orbit-node-209
    dependsOn:
      - {step: Set up the Tool Manager, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
      - {step: Add the signed apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
      - {step: Update the apt source, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ ("Set up the Tool Manager" in steps && steps["Set up the Tool Manager"].status == "succeeded" && steps["Set up the Tool Manager"].outputs["Set up the Tool Manager"].exitCode != 0) || ["Add the signed apt source", "Update the apt source"].exists(s, s in steps && steps[s].status == "succeeded" && steps[s].outputs.exitCode != 0) }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tw-check-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 125
        argv: [timeout, '120', python3, -I, -c, '${{ steps.assets.outputs.driver }}', check]
        stdin: '${{ steps.assets.outputs.bundle }}'
  # The constraint, the installed version and every refusal, before any package write.
  - name: decide
    target: orbit-node-209
    dependsOn: [{step: Check the candidate, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/tool-write-command'
      behaviorName: '${{ "tw-decide-" + run.id }}'
      methodName: decide
      inputs: {input: '${{ inputs.intent }}', check: '${{ steps["Check the candidate"] }}'}
  # apt as root with --no-remove, waiting up to 300 s for a busy lock; other managers as the managed account.
  - name: Install the package
    target: orbit-node-209
    dependsOn: [{step: decide, condition: {type: succeeded}}]
    guard: '${{ inputs.intent.kind != "tool.install" || !steps.decide.outputs.mutate }}'
    task: &write
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "tw-write-" + run.id }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 905
        argv: [timeout, '900', python3, -I, -c, '${{ steps.assets.outputs.driver }}', write, '${{ steps.decide.outputs.candidate_json }}']
        stdin: '${{ steps.assets.outputs.bundle }}'
  - name: Upgrade the package
    target: orbit-node-209
    dependsOn: [{step: decide, condition: {type: succeeded}}]
    guard: '${{ inputs.intent.kind != "tool.update" || !steps.decide.outputs.mutate }}'
    task: *write
  - name: result
    target: orbit-node-209
    dependsOn:
      - {step: Set up the Tool Manager, condition: {type: always}}
      - {step: Add the signed apt source, condition: {type: always}}
      - {step: Update the apt source, condition: {type: always}}
      - {step: Check the candidate, condition: {type: always}}
      - {step: decide, condition: {type: always}}
      - {step: Install the package, condition: {type: always}}
      - {step: Upgrade the package, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/tool-write-command'
      behaviorName: '${{ "tw-result-" + run.id }}'
      methodName: result
      inputs:
        input: '${{ inputs.intent }}'
        setup: '${{ !("Set up the Tool Manager" in steps) ? {"status": "skipped"} : steps["Set up the Tool Manager"].status != "succeeded" ? {"status": steps["Set up the Tool Manager"].status} : {"status": "succeeded", "outputs": steps["Set up the Tool Manager"].outputs["Set up the Tool Manager"]} }}'
        source: '${{ "Add the signed apt source" in steps && steps["Add the signed apt source"].status != "skipped" ? steps["Add the signed apt source"] : ("Update the apt source" in steps && steps["Update the apt source"].status != "skipped" ? steps["Update the apt source"] : null) }}'
        check: '${{ "Check the candidate" in steps ? steps["Check the candidate"] : null }}'
        decision: '${{ "decide" in steps ? steps.decide : null }}'
        write: '${{ "Install the package" in steps && steps["Install the package"].status != "skipped" ? steps["Install the package"] : ("Upgrade the package" in steps && steps["Upgrade the package"].status != "skipped" ? steps["Upgrade the package"] : null) }}'
  - name: accepted
    target: orbit-node-209
    dependsOn: [{step: result, condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps.result.outputs.ok == true', severity: high, message: The Tool write did not complete.}
