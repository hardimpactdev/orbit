id: a02d5140-0af9-4049-b8d9-56032384330d
name: operation-metrics-fleet
description: Reconcile full admitted public Metrics intent with placed single-action command steps.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - metrics.reconcile
    intent:
      type: object
      properties:
        participant_node_ids:
          type: array
          items:
            type: integer
            minimum: 1
        metrics_fleet:
          type: object
        caddy_publications:
          type: array
          items:
            type: object
      required:
      - participant_node_ids
      - metrics_fleet
      - caddy_publications
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        grafana_password:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^metrics-grafana-node-[1-9][0-9]*-active$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - grafana_password
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: intent
  steps:
  - name: read
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: &id001
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/metrics-fleet-intent'
      behaviorName: ${{ "metrics-intent-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        intent: ${{ inputs.intent }}
- name: assets
  steps:
  - name: assets${{ string(self.id) }}
    target: ${{ "orbit-node-" + string(self.id) }}
    labels:
      node: ${{ string(self.id) }}
    writes: false
    forEach:
      item: id
      in: ${{ inputs.intent.participant_node_ids }}
    task:
      type: behavior
      behaviorType: '@nckrtl/metrics-fleet-intent'
      behaviorName: ${{ "metrics-assets-" + string(inputs.operation_id) + "-" + string(self.id) }}
      methodName: assets
      inputs: {}
  dependsOn:
  - job: intent
    condition:
      type: succeeded
- name: shared-native-prerequisites
  dependsOn:
  - job: assets
    condition:
      type: succeeded
  steps:
  - name: shared-native-prerequisites
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: assert
      expr: size(steps.read.outputs.pools) == 0 && size(steps.read.outputs.publications) == 0
      message: metrics.native_shared_steps_unavailable
      severity: high
- name: verify-existing-credential
  dependsOn:
  - job: shared-native-prerequisites
    condition:
      type: succeeded
  steps:
  - name: verify-existing-credential
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-existing-credential-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_GRAFANA_PASSWORD,ORBIT_METRICS_ADDRESS -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_GRAFANA_PASSWORD: ${{ vault.get(inputs.execution_secrets.grafana_password.vault, inputs.execution_secrets.grafana_password.key)
            }}
          ORBIT_METRICS_ADDRESS: ${{ inputs.intent.metrics_fleet.metrics_address }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(inputs.node_id)].outputs.scripts["verify-existing-credential"]
            }}
- name: inspect-exporter-files
  dependsOn:
  - job: verify-existing-credential
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-files${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-files-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-exporter-files"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: inspect-exporter-service
  dependsOn:
  - job: inspect-exporter-files
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-service${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-service-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-exporter-service"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: inspect-exporter-firewall
  dependsOn:
  - job: inspect-exporter-service
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-firewall${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-firewall-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-exporter-firewall"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: inspect-fpm-exporter
  dependsOn:
  - job: inspect-exporter-firewall
    condition:
      type: succeeded
  steps:
  - name: inspect-fpm-exporter${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-fpm-exporter-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-fpm-exporter"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
- name: inspect-service-firewall
  dependsOn:
  - job: inspect-fpm-exporter
    condition:
      type: succeeded
  steps:
  - name: inspect-service-firewall${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-service-firewall-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-service-firewall"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
- name: plan-service-rules
  dependsOn:
  - job: inspect-service-firewall
    condition:
      type: succeeded
  steps:
  - name: rule-plan
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/metrics-fleet-intent'
      behaviorName: ${{ "metrics-rules-" + string(inputs.operation_id) }}
      methodName: serviceRules
      inputs:
        intent: ${{ inputs.intent }}
        snapshots: ${{ steps.read.outputs.ids.map(id, {"node_id":id,"stdout":steps["inspect-service-firewall"+string(id)].outputs.stdout})
          }}
- name: inspect-runtime-container
  dependsOn:
  - job: plan-service-rules
    condition:
      type: succeeded
  steps:
  - name: inspect-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-runtime-container-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_CONTAINER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-runtime-container"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: check-runtime-recovery
  dependsOn:
  - job: inspect-runtime-container
    condition:
      type: succeeded
  steps:
  - name: check-runtime-recovery${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-check-runtime-recovery-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_CONTAINER_BEFORE: ${{ steps["inspect-runtime-container" + self.item.key].outputs.stdout }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["check-runtime-recovery"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: pull-runtime-image
  dependsOn:
  - job: check-runtime-recovery
    condition:
      type: succeeded
  steps:
  - name: pull-runtime-image${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-pull-runtime-image-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_CONTAINER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["pull-runtime-image"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: validate-prometheus-config
  dependsOn:
  - job: pull-runtime-image
    condition:
      type: succeeded
  steps:
  - name: validate-prometheus-config${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-validate-prometheus-config-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_CONTAINER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["validate-prometheus-config"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
    guard: ${{ self.item.key != "prometheus" }}
- name: inspect-runtime-files
  dependsOn:
  - job: validate-prometheus-config
    condition:
      type: succeeded
  steps:
  - name: inspect-runtime-files
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-runtime-files-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(inputs.node_id)].outputs.scripts["inspect-runtime-files"]
            }}
- name: inspect-exporter-binaries
  dependsOn:
  - job: inspect-runtime-files
    condition:
      type: succeeded
  steps:
  - name: inspect-exporter-binaries${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-inspect-exporter-binaries-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["inspect-exporter-binaries"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
- name: install-node-exporter
  dependsOn:
  - job: inspect-exporter-binaries
    condition:
      type: succeeded
  steps:
  - name: install-node-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-install-node-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/apt-get -o DPkg::Lock::Timeout=60 install --yes --no-install-recommends -- prometheus-node-exporter
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "node_exporter" || !self.item.selected }}
- name: download-cadvisor
  dependsOn:
  - job: install-node-exporter
    condition:
      type: succeeded
  steps:
  - name: download-cadvisor${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-download-cadvisor-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["download-cadvisor"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || !self.item.selected }}
- name: verify-cadvisor-digest
  dependsOn:
  - job: download-cadvisor
    condition:
      type: succeeded
  steps:
  - name: verify-cadvisor-digest${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-cadvisor-digest-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["verify-cadvisor-digest"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || !self.item.selected }}
- name: publish-cadvisor-binary
  dependsOn:
  - job: verify-cadvisor-digest
    condition:
      type: succeeded
  steps:
  - name: publish-cadvisor-binary${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-publish-cadvisor-binary-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_OPERATION_ID -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["publish-cadvisor-binary"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || !self.item.selected }}
- name: stop-exporter
  dependsOn:
  - job: publish-cadvisor-binary
    condition:
      type: succeeded
  steps:
  - name: stop-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-stop-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_BEFORE,ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_EXPORTER_BEFORE: ${{ steps["inspect-exporter-files" + self.item.key].outputs.stdout }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["stop-exporter"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.selected }}
- name: disable-exporter
  dependsOn:
  - job: stop-exporter
    condition:
      type: succeeded
  steps:
  - name: disable-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-disable-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_BEFORE,ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_EXPORTER_BEFORE: ${{ steps["inspect-exporter-files" + self.item.key].outputs.stdout }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["disable-exporter"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.selected }}
- name: publish-exporter-configuration
  dependsOn:
  - job: disable-exporter
    condition:
      type: succeeded
  steps:
  - name: publish-exporter-configuration${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-publish-exporter-configuration-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["publish-exporter-configuration"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: reload-exporter-units
  dependsOn:
  - job: publish-exporter-configuration
    condition:
      type: succeeded
  steps:
  - name: reload-exporter-units${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-reload-exporter-units-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/systemctl daemon-reload
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
- name: enable-exporter
  dependsOn:
  - job: reload-exporter-units
    condition:
      type: succeeded
  steps:
  - name: enable-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-enable-exporter-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_EXPORTER_INTENT -- /usr/bin/python3 "$ORBIT_ACTION_SCRIPT"
        env:
          ORBIT_EXPORTER_INTENT: ${{ self.item.json }}
          ORBIT_ACTION_SCRIPT: ${{ steps["assets" + string(self.item.node_id)].outputs.scripts["enable-exporter"]
            }}
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ !self.item.selected }}
- name: restart-exporter
  dependsOn:
  - job: enable-exporter
    condition:
      type: succeeded
  steps:
  - name: restart-exporter${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
