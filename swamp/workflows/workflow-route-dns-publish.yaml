id: 3aca13ae-e8bb-40b4-bc14-072b4c7e435d
name: route-dns-publish
description: Apply a full public Route DNS snapshot with official file and service actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: dns
  steps:
  - name: read-records
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: &id001
      node: ${{ string(inputs.intent.control_node_id) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-read-records-" + run.id }}
      methodName: exec
      globalArgs: &id002
        name: ${{ "route-dns-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        hosts:
        - name: dns
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:dns
        argv:
        - sudo
        - /usr/bin/cat
        - /etc/dnsmasq.d/orbit-records.conf
  - name: read-catalog
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-read-catalog-" + run.id }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:dns
        argv:
        - sudo
        - /usr/bin/cat
        - /var/lib/orbit/private-dns/catalog.json
    dependsOn:
    - step: read-records
      condition:
        type: succeeded
  - name: compose
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: read-catalog
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/route-mutation-command'
      behaviorName: ${{ "route-dns-compose-" + run.id }}
      methodName: dns
      inputs:
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        alternatives: ${{ inputs.intent.alternatives }}
        current:
          records: ${{ steps["read-records"].outputs.stdout }}
          catalog: ${{ steps["read-catalog"].outputs.stdout }}
  - name: catalog-directory
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ "route-dns-catalog-directory-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        path: /var/lib/orbit/private-dns
        ensure: present
        owner: root
        group: root
        mode: '0755'
    dependsOn:
    - step: compose
      condition:
        type: succeeded
  - name: records
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "route-dns-records-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        path: /etc/dnsmasq.d/orbit-records.conf
        ensure: present
        owner: root
        group: root
        mode: '0644'
        content: ${{ steps.compose.outputs.records }}
    dependsOn:
    - step: catalog-directory
      condition:
        type: succeeded
  - name: catalog
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "route-dns-catalog-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        path: /var/lib/orbit/private-dns/catalog.json
        ensure: present
        owner: root
        group: root
        mode: '0644'
        content: ${{ steps.compose.outputs.catalog }}
    dependsOn:
    - step: records
      condition:
        type: succeeded
  - name: validate
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-validate-" + run.id }}
      methodName: exec
      inputs:
        hosts: name:dns
        argv:
        - sudo
        - /usr/sbin/dnsmasq
        - --test
      globalArgs: *id002
    dependsOn:
    - step: catalog
      condition:
        type: succeeded
  - name: restart-backend
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "route-dns-restart-backend-" + run.id }}
      methodName: restart
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        service: dnsmasq
    dependsOn:
    - step: validate
      condition:
        type: succeeded
  - name: listener
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "route-dns-listener-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        service: orbit-private-dns.socket
        ensure: running
        enabled: true
    dependsOn:
    - step: restart-backend
      condition:
        type: succeeded
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-dns-result-" + run.id }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' ''{"ready":true}''

          '
    dependsOn:
    - step: listener
      condition:
        type: succeeded
