command: task:sync
chart: task/engine/sync
target: app-dev
sources: [gateway]
baseline: [operations]
cases:
  - id: signed-and-swamp-copy-sync
    batch: fresh-fleet
    covers: ["path:engine", "path:receipt-lost", "path:step-failed", "path:swamp"]
    summary: Sync one task copy with work in every state through the signed executor, after a dropped fetch receipt, after a failed import, and through Swamp with the capability absent; only origin/<default> moves, the credential never enters the copy, and a sibling clone stays as it was.
    exclusive: true
    fails_on_base: true
    timeout: 1800
    setup:
      - sync_fixture: {repository: "https://github.com/laravel/prompts.git", branch: main}
    act:
      - sync_copy: {name: copy, sibling: sibling}
      - task_sync: {name: copy, via: engine, sibling: sibling, key: signed}
      - task_sync: {name: copy, via: engine, sibling: sibling, fault: receipt, key: dropped}
      - task_sync: {name: copy, via: engine, sibling: sibling, fault: held-ref, key: retried}
      - task_sync: {name: copy, via: swamp, sibling: sibling, key: fallback}
    expect:
      - sync_compare: {engine: signed, swamp: fallback}
      - clone_cleanup: {}
uncovered:
  "path:engine": "The copy comes from task:start of a new external group on the fixture Project, then goes back three commits and loses every object only the mirror head reaches, before every sync but the retry, so each of those imports a missing head. The retry runs on the copy as the failed import left it, with only the injected ref lock released: the head is already there, so it moves origin/<default> with no bundle. A copy turn beside the sync is not run. Fixture only: the nested fleet has no AI router (Valkey and CLIProxyAPI), so the fixture sets the tasks extension's stored state directly, past the dependency check of extension:enable, and restores what it read; model routing is not under test. Not covered: a nonempty minted credential. TaskSyncEngineFlow::mint asks the Project's source access for a GitHub token and writes it as an https://x-access-token line for github.com; a source the nested fleet can serve (no GitHub) mints none, and the product has no credentialed non-GitHub source without new product code. The run records its credential digest (the empty line), and the scan, checked first against a worktree sentinel, finds no credential form in the copy's processes, files, Git configuration or the Operation record during and after every sync, the failed import included; Gateway and executor tests cover the minted token."
  "path:receipt-lost": "The fault drops the fetch receipt. Lost import and clear receipts, and an order that expires before the target lock, are covered only by Gateway and executor tests."
  "path:step-failed": "The failure holds the copy's remote ref lock so the import fails after the fetch moved the mirror; a failed fetch, a cancel, a missing default branch and tasks.base_ref_mismatch are covered only by tests."
  "path:swamp": "Fallback runs with the Node's whole instance action family absent; a Node that reports the actions without the instance.fetch_seed feature, and a Project read through the Gateway's GitHub CLI login, are covered only by Gateway tests."
