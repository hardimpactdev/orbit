id: ac44a2e1-3b12-4637-b1c2-0278229f5a96
name: task-vm-image-promote
description: Point the image alias of an Incus host at the published candidate and keep the image it replaces as the -previous rollback copy.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.image_build]}
    intent: {type: object}
    fingerprint: {type: string}
  required: [operation_id, node_id, kind, intent, fingerprint]
  additionalProperties: false
jobs:
- name: promote
  labels: {role: swamp}
  steps:
    # Exit 1 is a missing alias: the first promotion on a host has no previous image.
  - name: Retire the earlier rollback copy
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-promote-" + string(inputs.node_id) + "-previous" }}
      methodName: exec
      globalArgs: &host
        name: ${{ "task-vm-image-promote-" + string(inputs.node_id) + "-previous" }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '60', incus, image, alias, delete, --project, '${{ inputs.intent.project }}', '--', '${{ inputs.intent.previous_alias }}']
        timeoutSec: 80
  - name: Keep the promoted image as the rollback copy
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Retire the earlier rollback copy, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-promote-" + string(inputs.node_id) + "-keep" }}
      methodName: exec
      globalArgs:
        <<: *host
        name: ${{ "task-vm-image-promote-" + string(inputs.node_id) + "-keep" }}
      inputs:
        hosts: name:host
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '60', incus, image, alias, rename, --project, '${{ inputs.intent.project }}', '--', '${{ inputs.intent.base_alias }}', '${{ inputs.intent.previous_alias }}']
        timeoutSec: 80
  - name: Point the image at the candidate
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Keep the promoted image as the rollback copy, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-promote-" + string(inputs.node_id) + "-point" }}
      methodName: exec
      globalArgs:
        <<: *host
        name: ${{ "task-vm-image-promote-" + string(inputs.node_id) + "-point" }}
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '60', incus, image, alias, create, --project, '${{ inputs.intent.project }}', '--', '${{ inputs.intent.base_alias }}', '${{ inputs.fingerprint }}']
        timeoutSec: 80
