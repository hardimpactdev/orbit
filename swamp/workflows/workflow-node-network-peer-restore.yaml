- name: peer_resolver
  steps:
  - name: restore_resolver_setting
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-restore-resolver-setting" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" "$SETTING_JSON" <<'PYTHON'
          import json
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          def publish(path, value):
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-network-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
          saved = json.loads(private_read(journal))
          if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
              raise SystemExit("wireguard.peer_recovery_pending")
          setting = json.loads(sys.argv[4])
          if saved["resolver_settings"].get(setting["link"], {}).get(setting["property"]) != " ".join(setting["value"]):
              raise SystemExit("wireguard.peer_state_unsupported")
          arguments = ["/usr/bin/resolvectl", setting["property"], setting["link"], *setting["value"]]
          if not setting["value"]:
              arguments.append("")
          subprocess.run(arguments, check=True, capture_output=True, timeout=30)
          print('{"restored":true}')
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.restoration_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
          SETTING_JSON: ${{ self.setting.json }}
    guard: ${{ !steps.restore_view.outputs.present }}
    forEach:
      item: setting
      in: ${{ steps.restore_view.outputs.settings }}
  dependsOn:
  - job: peer_files_and_service
    condition:
      type: or
      conditions:
      - type: succeeded
      - type: skipped
- name: peer_restoration
  steps:
  - name: verify_peer_restoration
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-verify-peer-restoration" }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" "$OPERATION_ID" "$TRANSACTION_ID" <<'PYTHON'
          import json
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          operation_id = int(sys.argv[2])
          transaction_id = sys.argv[3]
          root = Path("/etc/wireguard")
          journal = root / ".orbit.native-network-transaction"
          def private_read(path, optional=False):
              if optional and not os.path.lexists(path):
                  return None
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
                  raise SystemExit("wireguard.peer_state_unsupported")
              return path.read_text()
          def publish(path, value):
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-network-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(value)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(candidate, path)
              finally:
                  if os.path.exists(candidate):
                      os.unlink(candidate)
          saved = json.loads(private_read(journal))
          if saved.get("operation_id") != operation_id or saved.get("transaction_id") != transaction_id:
              raise SystemExit("wireguard.peer_recovery_pending")
          if private_read(root / "orbit.conf", True) != saved["config"] or private_read(root / "orbit.dns-link", True) != saved["dns_file"]:
              raise SystemExit("wireguard.peer_rollback_failed")
          active = subprocess.run(["/usr/bin/systemctl", "is-active", "--quiet", "wg-quick@orbit"], capture_output=True, timeout=10).returncode == 0
          enabled = subprocess.run(["/usr/bin/systemctl", "is-enabled", "wg-quick@orbit"], capture_output=True, text=True, timeout=10).stdout.strip()
          if active != saved["active"] or enabled != saved["enabled"]:
              raise SystemExit("wireguard.peer_rollback_failed")
          for link, properties in saved["resolver_settings"].items():
              for name, expected in properties.items():
                  observed = subprocess.run(["/usr/bin/resolvectl", name, link], check=True, capture_output=True, text=True, timeout=10).stdout.split(":", 1)[-1].strip()
                  if observed != expected:
                      raise SystemExit("wireguard.peer_rollback_failed")
          print('{"peer_restored":true}')
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.restoration_intent.outputs.network_json }}
          OPERATION_ID: ${{ string(inputs.operation_id) }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
    guard: ${{ !steps.restore_view.outputs.present }}
