type: '@nckrtl/orbit-gateway'
typeVersion: 2026.10.27.2
id: f5fa45d6-6307-48b6-a094-9aae8f79febc
name: orbit-gateway
version: 1
tags: {}
# The Gateway client for externally orchestrated task groups (ADR 0229).
# Beast authenticates by its WireGuard address; only the Orbit root CA is needed.
globalArguments:
  gatewayUrl: https://gateway.orbit
  caFile: /usr/local/share/ca-certificates/orbit-managed-root-ca.crt
  timeoutSeconds: 60
  projectExtensions: [{ projectId: 20, type: '@nckrtl/project-nckrtl-com' }]
  dependencyProjects:
    - projectId: 18
      repository: https://github.com/hardimpactdev/lindaretel.git
      script: scripts/dependencies
      check: composer check
      defaultBranch: main
methods: {}
