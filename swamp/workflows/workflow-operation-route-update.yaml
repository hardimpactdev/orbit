id: b1a5e413-5c52-4d05-966b-f78d57c2da06
name: operation-route-update
description: Immutable Route update and restoration through official209 publication children.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.update
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
        required:
        - vault
        - key
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: update
  steps:
  - name: prepare
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: workload
      in: ${{ inputs.intent.workloads }}
    dependsOn: []
    task:
      type: workflow
      workflowIdOrName: instance-route-workload
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.workload.node_id }}
          instance_id: ${{ self.workload.instance_id }}
          connection: ${{ self.workload.connection }}
          host_keys: ${{ self.workload.host_keys }}
          plan: ${{ self.workload.prepare }}
        execution_secrets: {}
  - name: forward
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: prepare, condition: {type: always}}
    guard: ${{ !inputs.intent.effectful || steps.exists(k,k.startsWith("prepare-") && steps[k].status == "failed")
      }}
    task:
      type: workflow
      workflowIdOrName: route-mutation-forward
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        parent_run_id: ${{ run.id }}
  - name: retire
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: workload
      in: ${{ inputs.intent.workloads }}
    dependsOn:
    - {step: prepare, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    guard: ${{ !("forward" in steps) || steps.forward.status != "succeeded" || !steps.forward.outputs.result.ready
      }}
    task:
      type: workflow
      workflowIdOrName: instance-route-workload
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.workload.node_id }}
          instance_id: ${{ self.workload.instance_id }}
          connection: ${{ self.workload.connection }}
          host_keys: ${{ self.workload.host_keys }}
          plan: ${{ self.workload.selected }}
        execution_secrets: {}
  - name: restore-workload
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: workload
      in: ${{ inputs.intent.workloads }}
    dependsOn:
    - {step: prepare, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    - {step: retire, condition: {type: always}}
    guard: ${{ !(inputs.intent.effectful && (!("forward" in steps) || steps.forward.status != "succeeded" || !steps.forward.outputs.result.ready
      || steps.exists(k,k.startsWith("retire-") && steps[k].status == "failed"))) }}
    task:
      type: workflow
      workflowIdOrName: instance-route-workload
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent:
          node_id: ${{ self.workload.node_id }}
          instance_id: ${{ self.workload.instance_id }}
          connection: ${{ self.workload.connection }}
          host_keys: ${{ self.workload.host_keys }}
          plan: ${{ self.workload.restore }}
        execution_secrets: {}
  - name: restore
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: prepare, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    - {step: retire, condition: {type: always}}
    - {step: restore-workload, condition: {type: always}}
    guard: ${{ !(inputs.intent.effectful && (!("forward" in steps) || steps.forward.status != "succeeded" || !steps.forward.outputs.result.ready
      || steps.exists(k,k.startsWith("retire-") && steps[k].status == "failed"))) }}
    task:
      type: workflow
      workflowIdOrName: route-mutation-restore
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        parent_run_id: ${{ run.id }}
  - name: result
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: prepare, condition: {type: always}}
    - {step: forward, condition: {type: always}}
    - {step: retire, condition: {type: always}}
    - {step: restore-workload, condition: {type: always}}
    - {step: restore, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-update-result'
      behaviorName: route-update-result
      methodName: read
      inputs:
        effectful: ${{ inputs.intent.effectful }}
        route_id: ${{ inputs.intent.route_id }}
        result_route_id: ${{ inputs.intent.result_route_id }}
        workload_count: ${{ size(inputs.intent.workloads) }}
        steps: ${{ steps }}
  - name: complete
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: result, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-update-result'
      behaviorName: route-update-complete
      methodName: complete
      inputs:
        stdout: ${{ steps.result.outputs.stdout }}
