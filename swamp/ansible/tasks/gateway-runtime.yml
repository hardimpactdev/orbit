---
# Caddy serves the Gateway from the home of its account, which a new Ubuntu keeps at 0750: the group of the account lets it in. A group
# applies to a running service only after a restart, so Caddy restarts when it joins.
- name: Let Caddy into the Gateway account's group
  ansible.builtin.user: { name: caddy, groups: "{{ rt.gateway.account }}", append: true }
  register: caddy_group
- name: Restart Caddy for its new group # noqa no-handler
  when: caddy_group is changed
  ansible.builtin.systemd: { name: caddy.service, state: restarted }
# Write runtime files validated the pool before it replaced the live one. A reload replaces the workers after their
# requests end; it runs only when the pool changed.
- name: Reload PHP-FPM # noqa no-handler
  when: >-
    rt.gateway.pool in (runtime_files.results | selectattr('changed') | map(attribute='item.path'))
  ansible.builtin.systemd: { name: php8.5-fpm.service, state: reloaded }
# Settings no code reads any more leave the shared Gateway environment; the release links this file as each release's `.env`.
- name: Remove retired settings from the Gateway environment
  ansible.builtin.lineinfile:
    path: "{{ rt.gateway.environment }}"
    regexp: "^{{ item | regex_escape }}="
    state: absent
  loop: "{{ rt.gateway.retired_settings }}"
  # The file holds credentials: a diff or a failure must not print it.
  no_log: true
  diff: false
# Hourly log rotation, unless an operator masked logrotate.
- name: Read the logrotate mask
  ansible.builtin.command: { argv: [systemctl, is-enabled, logrotate.service, logrotate.timer] }
  register: logrotate_state
  changed_when: false
  failed_when: false
- name: Run logrotate hourly
  when: logrotate_state.stdout_lines | select('match', '^masked') | list | length == 0
  ansible.builtin.systemd: { name: logrotate.timer, state: started, enabled: true }
