            condition:
              type: succeeded
      - name: caddy_package_proven
        guard: ${{ !steps.admit.outputs.ready }}
        dependsOn:
          - step: caddy_package
            condition:
              type: succeeded
        task:
          type: assert
          expr: steps.caddy_package.outputs.ok
          message: The caddy-package stage refused its admitted footprint
          severity: high
  - name: caddy_job
    dependsOn:
      - job: caddy_package_job
        condition:
          type: succeeded
    steps:
      - name: caddy_cancellation
        writes: false
        guard: ${{ !steps.admit.outputs.ready }}
        task:
          type: behavior
