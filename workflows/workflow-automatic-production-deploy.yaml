id: 78efdd30-08ce-4ffb-a8eb-c7259c96ad24
name: automatic-production-deploy
description: Run production auto-deploy policy after the Gateway cutover. Discover all enabled production Instances.
trigger:
  schedule: 30 * * * * *
inputs:
  properties:
    instances:
      type: array
      items: { type: integer, minimum: 1 }
      uniqueItems: true
      default: []
      description: Optional narrower filter. Empty discovers every enabled production Instance from the Gateway.
jobs:
  - name: policy
    steps:
      - name: tick
        task:
          type: model_method
          modelType: '@nckrtl/automatic-deploy'
          modelName: automatic-production-deploy
          methodName: tick
          inputs:
            instances: '${{ inputs.instances }}'
