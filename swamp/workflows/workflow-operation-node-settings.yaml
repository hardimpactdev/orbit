id: "b100f60c-b164-4036-8881-17e603ba3901"
name: "operation-node-settings"
description: "Create and check a Node's apps folder from 209 with one shipped script over official SSH."
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [node.settings]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: settings
  labels: {role: swamp}
  steps:
  - name: 'Read the scripts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-scripts'
      behaviorName: node-settings-scripts
      methodName: read
      inputs: {script: apps_folder, input: '${{ inputs.intent.storage }}'}
    # Missing parts are made as the managed user and group, mode 0755; existing folders stay as they are.
  - name: 'Create the apps folder'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the scripts', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-settings-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "node-settings-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', create, '${{ steps["Read the scripts"].outputs.input }}']
        timeoutSec: 40
    # The terminal result: a real folder, owned by the managed user and group, that only the owner may write.
  - name: 'Check owner and mode'
    labels: {role: swamp}
    dependsOn: [{step: 'Create the apps folder', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-settings-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', check, '${{ steps["Read the scripts"].outputs.input }}']
        timeoutSec: 40
