---
# One phase of instance-migrate.yml, `phase`, on the Node. The checkout is `migrate.checkout`; the new container is `container`,
# in `container.project`. Git reads the checkout as root, so each call names it as a safe directory. `incus` gets no stray input.
# A refused preflight changed nothing. Do not discard an earlier failed move's resources or rewrite its awake marker.
- name: Leave the Node unchanged after a refused preflight
  when: >-
    phase == 'restore' and
    (lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/result.json', errors='ignore')
     | default('{}', true) | from_json).get('preflight_refused', false)
  ansible.builtin.meta: end_host

# The deploy HTTPS transport, before any retirement check or resource change.
# Older Gateway inputs have no source key during release overlap.
- name: Check remote deployment access before any Node change
  when: phase == 'container' and migrate.get('source') is not none
  block:
    - name: Reserve a private temporary source credential
      ansible.builtin.tempfile:
        state: directory
        prefix: orbit-migrate-source-
      register: migrate_source_private
    - name: Read the remote with the deploy credential
      block:
        - name: Write the temporary fetch credential
          ansible.builtin.copy:
            content: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/source-credential', rstrip=false) }}"
            dest: "{{ migrate_source_private.path }}/credential"
            mode: "0600"
          no_log: true
        - name: Read the remote branch once within thirty seconds
          ansible.builtin.command:
            argv:
              - timeout
              - --kill-after=1
              - "30"
              - git
              - -c
              - core.hooksPath=/dev/null
              - -c
              - core.fsmonitor=false
              - -c
              - credential.helper=
              - -c
              - "credential.helper=store --file={{ migrate_source_private.path }}/credential"
              - -c
              - protocol.allow=never
              - -c
              - protocol.https.allow=always
              - -c
              - http.followRedirects=false
              - -c
              - "url.https://github.com/.insteadOf=git@github.com:"
              - -c
              - url.https://github.com/.insteadOf=ssh://git@github.com/
              - -C
              - /
              - ls-remote
              - --exit-code
              - --heads
              - --
              - "{{ migrate.source.repository }}"
              - "{{ 'refs/heads/' ~ migrate.source.branch }}"
            expand_argument_vars: false
          environment:
            LC_ALL: C
            LANG: C
            GIT_TERMINAL_PROMPT: "0"
            GIT_CONFIG_NOSYSTEM: "1"
            GIT_CONFIG_GLOBAL: /dev/null
            GIT_ALLOW_PROTOCOL: https
          register: migrate_source_read
          changed_when: false
          failed_when: false
          no_log: true
      always:
        - name: Remove the temporary fetch credential
          ansible.builtin.file: {path: "{{ migrate_source_private.path }}", state: absent}
    - name: Classify authentication diagnostics privately
      ansible.builtin.set_fact:
        migrate_source_auth_denied: >-
          {{ migrate_source_read.rc not in [0, 2, 124, 137]
             and migrate.source.get('access_denied_message') is not none
             and ('authentication failed' in (migrate_source_read.stderr | lower)
                  or 'could not read username' in (migrate_source_read.stderr | lower)
                  or 'repository not found' in (migrate_source_read.stderr | lower)
                  or 'requested url returned error: 401' in (migrate_source_read.stderr | lower)
                  or 'requested url returned error: 403' in (migrate_source_read.stderr | lower)) }}
      no_log: true
    - name: Name a failed source read without remote output
      when: migrate_source_read.rc != 0
      ansible.builtin.set_fact:
        migrate_refusal_code: >-
          {{ 'source.read_timed_out' if migrate_source_read.rc in [124, 137] else
             'source.github_app_denied' if migrate_source_auth_denied else 'source.head_unavailable' }}
        migrate_refusal_message: >-
          {{ 'Could not reach the source in 30 s: ' ~ migrate.source.repository ~ '.'
             if migrate_source_read.rc in [124, 137] else
             migrate.source.access_denied_message if migrate_source_auth_denied else
             'The remote branch ' ~ migrate.source.branch ~ ' does not exist in ' ~ migrate.source.repository ~ '.'
             if migrate_source_read.rc == 2 else 'Could not reach the source: ' ~ migrate.source.repository ~ '.' }}
    - name: Require the remote branch to be readable
      ansible.builtin.assert:
        that: migrate_source_read.rc == 0
        fail_msg: source.head_unavailable
        quiet: true

- name: Name the commands
  ansible.builtin.set_fact:
    incus_project: [incus, --project, "{{ container.project }}"]
    as_orbit: >-
      {{ ['incus', 'exec', '--project', container.project, '--cwd', container.workspace, '--env', 'HOME=/home/orbit', container.name,
          '--', 'runuser', '-u', 'orbit', '--'] }}
    as_root: "{{ ['incus', 'exec', '--project', container.project, container.name, '--'] }}"
    checkout_git: >-
      {{ ['/usr/bin/git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', '-c', 'core.quotePath=false',
          '-c', 'safe.directory=' ~ migrate.checkout, '-C', migrate.checkout] }}
    # Beside the mirror, on the Node's disk and readable by root only; the container's copy sits beside the workspace.
    node_archive: "{{ container.mirror | dirname }}/migrate-{{ container.instance_id }}-{{ run_id }}"
    container_archive: "/srv/.orbit-migrate-{{ run_id }}"
    # Load the trusted release library in memory: no Node install and no script bytes in argv.
    migrate_links_script: |
      import sys, types
      library = types.ModuleType("instance_migrate_git")
      exec({{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_git.py') | to_json }}, library.__dict__)
      sys.modules[library.__name__] = library
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_links.py') }}


# Cutover already made the container the runtime. Its Schedules must follow even when the later Git retirement refuses.
- name: Publish the moved Instance's Schedules before retiring Git data
  when: phase == 'retire'
  ansible.builtin.include_tasks:
    file: instance-migrate-schedules.yml
    apply: { tags: [always] }

# Check every planned retirement before any Node change, and again before any checkout in the batch goes.
- name: Check all planned retirements
  when: phase in ['container', 'quiesce', 'retire']
  ansible.builtin.include_tasks:
    file: instance-migrate-retirement-check.yml
    apply: { tags: [always] }
  loop: "{{ migrate.retire }}"
  loop_control: { loop_var: retired, label: "{{ retired.path }}" }

# The move copies the files that differ from the commit of the recorded branch, so the checkout must be on it.
- name: Check the checkout's branch
  when: phase in ['container', 'quiesce']
  block:
    - name: Read the checkout's branch
      ansible.builtin.command: { argv: "{{ checkout_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}" }
      register: checkout_branch
      changed_when: false
      failed_when: false
    - name: Explain a changed branch
      when: checkout_branch.rc != 0 or checkout_branch.stdout | trim != migrate.branch
      ansible.builtin.set_fact:
        migrate_refusal_code: instance.migrate_branch_changed
        migrate_refusal_message: >-
          The checkout is no longer on recorded branch {{ migrate.branch }}.
          All data stays in the source or retained folder. Return to the recorded branch and retry.
    - name: Refuse another branch
      ansible.builtin.assert:
        that: checkout_branch.rc == 0 and checkout_branch.stdout | trim == migrate.branch
        fail_msg: instance.migrate_branch_changed
        quiet: true

# Validate every Schedule before changing any writer; all general checkout preflights still run before stopping timers.
- name: Check the Instance's Schedules before downtime
  when: phase == 'quiesce'
  ansible.builtin.include_tasks:
    file: instance-migrate-schedules.yml
    apply: { tags: [always] }
  vars:
    schedule_phase: check

# Predict the copied layout before downtime; the same resolver checks the exact copy as the final guard.
- name: Check checkout links before downtime
  when: phase in ['container', 'quiesce']
  block:
    - name: Read checkout symlinks
      ansible.builtin.command:
        argv: ["python3", "-", "{{ migrate.checkout }}", "--predict-copy"]
        expand_argument_vars: false
        stdin: "{{ migrate_links_script }}"
      register: migrate_links_read
      changed_when: false
    - name: Check the source symlink result
      ansible.builtin.include_tasks: instance-migrate-link-result.yml

# No service host is rewritten. Check every copied app environment while the checkout still serves.
- name: Check copied service endpoints before downtime
  when: phase in ['container', 'quiesce']
  ansible.builtin.include_tasks:
    file: instance-migrate-env-check.yml
    apply: { tags: [always] }

# Nothing on the Node changed before this point. Restore preserves prior resources when these read-only checks refused.
- name: Record that the container preflight passed
  when: phase == 'container'
  ansible.builtin.set_fact:
    migrate_preflight_passed: true

# A container that an earlier failed move left is not the Instance's: this move starts with a new one. After a failure the new
# container goes with what the move added on the Node, so the checkout Instance is as it was.
- name: Remove the move's container
  when: phase in ['container', 'restore']
  ansible.builtin.include_tasks:
    file: instance-migrate-discard.yml
    apply: { tags: [always] }

# Build and start with the same NIC rules and firewall paths as create. The checkout still serves throughout this phase.
- name: Prepare the move's container
  when: phase == 'container'
  ansible.builtin.include_tasks:
    file: instance-container-phase.yml
    apply: { tags: [always] }

# The database stays where it is. The container reaches its server through its own ACL rule and the Node's firewall rule, which
# the container phase added; the move proves every attached target before quiesce.
- name: Check the way to each database server
  when: phase == 'container'
  block:
    - name: Reach the server's port from the container
      ansible.builtin.command:
        argv: "{{ as_orbit + ['timeout', '5', 'bash', '-c', 'exec 3<>\"/dev/tcp/$1/$2\"', 'bash', item.host, item.port | string] }}"
      loop: "{{ migrate.databases }}"
      loop_control: { label: "{{ item.host }}:{{ item.port }}" }
      register: migrate_reach
      changed_when: false
      failed_when: false
    - name: Refuse a database server out of reach
      ansible.builtin.assert:
        that: migrate_reach.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length == 0
        fail_msg: instance.database_unreachable
        quiet: true

# The Gateway mapped host command names to this container's runtime. Check its actual executables before any writer stops.
# Repeat immediately before quiesce, so a removed runtime or image program still refuses without downtime.
- name: Check moved Process executables before downtime
  when: phase in ['container', 'quiesce']
  block:
    - name: Read executable availability inside the container
      ansible.builtin.command:
        argv: "{{ as_root + ['test', '-x', item.1] }}"
        expand_argument_vars: false
      loop: "{{ migrate.processes | subelements('executables') }}"
      loop_control: { label: "{{ item.0.name }}: {{ item.1 }}" }
      register: migrate_binaries
      changed_when: false
      failed_when: false
    - name: Name an unavailable Process executable
      when: migrate_binaries.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length > 0
      ansible.builtin.set_fact:
        migrate_refusal_code: instance.migrate_process_binary_unavailable
        migrate_refusal_message: >-
          {{ (migrate_refusal_message | default('')) ~ ('\n' if migrate_refusal_message is defined else '')
             ~ 'Process ' ~ unavailable.item.0.name ~ ' executable [' ~ unavailable.item.1 ~ '] is unavailable in the container.' }}
      loop: "{{ migrate_binaries.results | rejectattr('rc', 'equalto', 0) | list }}"
      loop_control: { loop_var: unavailable, label: "{{ unavailable.item.0.name }}: {{ unavailable.item.1 }}" }
    - name: Refuse an unavailable Process executable
      ansible.builtin.assert:
        that: migrate_binaries.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length == 0
        fail_msg: instance.migrate_process_binary_unavailable
        quiet: true

# Run-local recovery checkpoint, written before the first host writer can stop. A failed probe never writes it.
- name: Record that quiesce began
  when: phase == 'quiesce'
  ansible.builtin.copy:
    content: "true"
    dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/quiesced"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Stop the Instance's Schedules after all preflight checks
  when: phase == 'quiesce'
  ansible.builtin.include_tasks:
    file: instance-migrate-schedules.yml
    apply: { tags: [always] }
  vars:
    schedule_phase: stop

# The same Process ids are about to run in the container. Disable host boot links before copying, so a Node reboot cannot start
# a second writer. A failed move restores desired state only after its container is gone. A recorded but uninstalled unit skips.
- name: Read the old Process unit files
  when: phase == 'quiesce' or (phase == 'restore' and migrate_quiesced | bool)
  ansible.builtin.stat: { path: "{{ item.path }}" }
  loop: "{{ migrate.processes }}"
  loop_control: { label: "{{ item.name }}" }
  register: source_process_files

- name: Stop the old Process units before copying
  when: phase == 'quiesce' and item.stat.exists
  ansible.builtin.systemd_service: { name: "{{ item.item.name }}", state: stopped, enabled: false }
  loop: "{{ source_process_files.results | default([]) }}"
  loop_control: { label: "{{ item.item.name }}" }

- name: Restore the old Process units after removing the failed container
  when: phase == 'restore' and migrate_quiesced | bool and item.stat.exists
  ansible.builtin.systemd_service:
    name: "{{ item.item.name }}"
    state: "{{ 'started' if item.item.desired == 'running' else 'stopped' }}"
    enabled: "{{ item.item.desired == 'running' }}"
  loop: "{{ source_process_files.results | default([]) }}"
  loop_control: { label: "{{ item.item.name }}" }

- name: Restore the Instance's Schedules after removing the failed container
  when: phase == 'restore'
  ansible.builtin.include_tasks:
    file: instance-migrate-schedules.yml
    apply: { tags: [always] }

# The container already serves at retire, even if checkout removal later refuses. Retire only this Instance's disabled units.
- name: Remove the old Process units and environment folders
  when: phase == 'retire'
  ansible.builtin.file: { path: "{{ item }}", state: absent }
  loop: "{{ (migrate.processes | map(attribute='path') | list) + (migrate.processes | map(attribute='environment_directory') | list) }}"
  notify: Reload the retired Process units

- name: Finish retiring the Process units
  when: phase == 'retire'
  ansible.builtin.meta: flush_handlers

# Without its awake marker the Route shows the wake page, and the Gateway starts no wake while the move runs. So nothing writes
# the checkout or the database between the copy and the Route's move.
- name: Remove the awake marker
  when: phase == 'quiesce'
  ansible.builtin.file: { path: "{{ migrate.awake.path }}", state: absent }

# A non-default Instance runs T3, published on the Node's WireGuard address in NAT mode, as a clone's is.
- name: Publish T3 on the Node's WireGuard address
  when: phase == 'files' and container.clone | default(none) is not none
  block:
    - name: Read the container's devices
      ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
      register: migrate_devices
      changed_when: false
    - name: Add the proxy device
      when: container.clone.t3.device not in ((migrate_devices.stdout | from_json).devices | default({}))
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['config', 'device', 'add', container.name, container.clone.t3.device, 'proxy',
              'listen=tcp:' ~ container.clone.t3.listen ~ ':' ~ container.clone.t3.port,
              'connect=tcp:' ~ container.address ~ ':' ~ container.clone.t3.internal_port, 'nat=true'] }}
      changed_when: true

# The workspace holds the branch's commit. On top come the files that differ from it, staged or not, the untracked files and
# the ignored ones, such as `vendor`, `storage` and `.env`: one archive, pushed in and extracted as `orbit`. Never the checkout's
# `.git`: a non-default checkout is a linked worktree.
- name: Copy the checkout's files into the workspace
  when: phase == 'files'
  block:
    - name: Export local Git state without changing the source
      ansible.builtin.command:
        argv: [python3, '-', "{{ migrate.checkout }}", export, "{{ node_archive }}", "--branch", "{{ migrate.branch }}"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_git.py') }}"
      register: migrate_git_export
      no_log: true
      changed_when: true
      failed_when: false
    - name: Require a complete Git export
      ansible.builtin.assert:
        that: migrate_git_export.rc == 0
        fail_msg: >-
          {{ (migrate_git_export.stdout | default('{}', true) | from_json).error_code | default('instance.migrate_git_state_mismatch') }}
        quiet: true
    - name: Archive the file overlay and directories absent from the Git checkout
      ansible.builtin.command:
        argv: ["python3", "-", "{{ migrate.checkout }}", "--archive-prefix", "{{ node_archive }}"]
        expand_argument_vars: false
        stdin: "{{ migrate_links_script }}"
      environment:
        ORBIT_CHECKOUT: "{{ migrate.checkout }}"
      register: migrate_archive
      no_log: true
      changed_when: true
    - name: Count archived untracked leaves that Git does not ignore
      ansible.builtin.command:
        argv: [python3, '-', "{{ node_archive }}.tar", "{{ node_archive }}.counted"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_files.py') }}"
      register: migrate_untracked_count
      changed_when: false
      no_log: true
    - name: Push the archive and the deleted files into the container
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--uid', '1000', '--gid', '2760', '--mode', '0640',
              node_archive ~ item, container.name ~ container_archive ~ item] }}
      loop: [".tar", ".deleted", ".git.pack", ".git.json"]
      changed_when: true
    - name: Extract the archive in the workspace
      ansible.builtin.command:
        argv: "{{ as_orbit + ['tar', '-xf', container_archive ~ '.tar', '--no-same-owner', '-C', container.workspace] }}"
      changed_when: true
    - name: Remove the files the checkout deleted
      ansible.builtin.command:
        argv: "{{ as_orbit + ['sh', '-c', 'xargs -0 rm -f -- < \"$1\"', 'sh', container_archive ~ '.deleted'] }}"
      changed_when: true
    - name: Recheck the source snapshot before verifying the copy
      ansible.builtin.command:
        argv: [python3, '-', "{{ migrate.checkout }}", check-source, "{{ node_archive }}.git.json"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_git.py') }}"
      register: migrate_git_source
      no_log: true
      changed_when: false
      failed_when: false
    - name: Require the exported source to remain unchanged
      ansible.builtin.assert:
        that: migrate_git_source.rc == 0
        fail_msg: instance.migrate_git_source_changed
        quiet: true
    - name: Import and verify all local Git state before path rewrites
      ansible.builtin.command:
        argv: "{{ as_orbit + ['python3', '-', container.workspace, 'import', container_archive ~ '.git.json', container_archive ~ '.git.pack'] }}"
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_git.py') }}"
      register: migrate_git_import
      no_log: true
      changed_when: migrate_git_import.rc == 0 and (migrate_git_import.stdout | from_json).changed
      failed_when: false
    - name: Require an identical and complete copied Git state
      ansible.builtin.assert:
        that: migrate_git_import.rc == 0
        fail_msg: >-
          {{ (migrate_git_import.stdout | default('{}', true) | from_json).error_code | default('instance.migrate_git_state_mismatch') }}
        quiet: true
    # Inspect and rewrite the actual copy, including bundle-only links. No link name or target crosses Incus's JSON argv.
    - name: Check and rewrite links inside the copied workspace
      ansible.builtin.command:
        argv: "{{ as_orbit + ['python3', '-', container.workspace, '--old-checkout', migrate.checkout, '--rewrite'] }}"
        expand_argument_vars: false
        stdin: "{{ migrate_links_script }}"
      register: migrate_links_read
      changed_when: >-
        migrate_links_read.rc == 0 and (migrate_links_read.stdout | from_json).refused | length == 0
        and (migrate_links_read.stdout | from_json).rewrites | length > 0
    - name: Check the copied symlink result before starting any Process
      ansible.builtin.include_tasks: instance-migrate-link-result.yml
    # Both users edit every file: the group `work` reads and writes, others get nothing.
    - name: Give the group the copied files
      ansible.builtin.command: { argv: "{{ as_root + ['chmod', '-R', 'g+rwX,o-rwx', container.workspace] }}" }
      changed_when: true
    - name: Restore the added directories' exact modes including special bits
      ansible.builtin.command:
        argv: >-
          {{ as_orbit + ['python3', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_migrate_links.py'),
              container.workspace, '--restore-directories'] }}
        expand_argument_vars: false
        stdin: "{{ (migrate_archive.stdout | from_json).directory_modes }}"
      no_log: true
      changed_when: true
  always:
    - name: Remove the archive on the Node
      ansible.builtin.file: { path: "{{ node_archive }}{{ item }}", state: absent }
      loop: [".tar", ".list", ".untracked", ".counted", ".deleted", ".git.pack"]
    - name: Remove the archive in the container
      ansible.builtin.command:
        argv: >-
          {{ as_root + ['rm', '-f', '--', container_archive ~ '.tar',
              container_archive ~ '.deleted', container_archive ~ '.git.pack', container_archive ~ '.git.json'] }}
      changed_when: false
      failed_when: false

- name: Record the copied untracked file count for the terminal result
  when: phase == 'files'
  no_log: true
  ansible.builtin.copy:
    content: "{{ migrate_untracked_count.stdout }}"
    dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/untracked-files.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

# `.env` came as it was. A path in it that points into the checkout, such as a SQLite file's, points into the workspace now.
- name: Point .env at the workspace
  when: phase == 'files'
  ansible.builtin.command:
    argv: >-
      {{ as_root + ['sh', '-c', 'test ! -f "$3" || { sed "s#$1#$2#g" "$3" > "$3.orbit" && cat "$3.orbit" > "$3"; rm -f -- "$3.orbit"; }',
          'sh', migrate.checkout, container.workspace, container.environment_file] }}
  changed_when: true

- name: Read the workspace's commit
  when: phase == 'files'
  block:
    - name: Read the commit
      ansible.builtin.command:
        argv: "{{ as_orbit + ['git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', '--verify', 'HEAD^{commit}'] }}"
      register: migrate_head
      changed_when: false
    - name: Keep the commit
      ansible.builtin.set_fact:
        migrate_commit: "{{ migrate_head.stdout | trim }}"

# The Route serves the container now. The checkout goes; a default's stays while a worktree of its repository is left.
- name: Remove the checkout
  when: phase == 'retire'
  ansible.builtin.include_tasks:
    file: instance-migrate-retire.yml
    apply: { tags: [always] }
  loop: "{{ migrate.retire }}"
  loop_control: { loop_var: retired, label: "{{ retired.path }}" }

- name: Report the commit
  when: migrate_commit is defined
  ansible.builtin.debug:
    msg: "orbit-commit={{ migrate_commit }}"

- name: Remove the private source snapshot after retention or restore
  when: phase in ['retire', 'restore']
  ansible.builtin.file:
    path: "{{ node_archive }}.git.json"
    state: absent
  changed_when: false
