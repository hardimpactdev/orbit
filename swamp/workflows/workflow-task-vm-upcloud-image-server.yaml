id: ea09deaa-6bb5-4728-8ff5-7cc21159170c
name: task-vm-upcloud-image-server
description: Launch one UpCloud build server from 209 with inline curl, then boot and check it over pinned official SSH; TypeScript shapes bodies and replies only.
version: 1
queueTimeout: 60
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(task-vm-upcloud-token|task-vm-image-bootstrap-[1-9][0-9]*)$'}
        required: [vault, key]
        additionalProperties: false
      propertyNames: {enum: [upcloud, bootstrap]}
    slot: {type: string, enum: [builder, smoke]}
    source: {type: string}
  required: [intent, execution_secrets, slot, source]
  additionalProperties: false
jobs:
- name: server
  writes: true
  steps:
  - name: plans
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --header 'Accept: application/json' https://api.upcloud.com/1.3/plan
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: request
    labels: {role: swamp}
    dependsOn:
    - {step: plans, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: request
      inputs:
        intent: ${{ inputs.intent }}
        slot: ${{ inputs.slot }}
        source: ${{ inputs.source }}
        plans_stdout: ${{ steps.plans.outputs.stdout }}
  - name: create
    # UpCloud refuses a clone of a template it still prepares and changes nothing; curl's bounded retry is the wait (Q-WAIT).
    labels: {role: swamp}
    dependsOn:
    - {step: request, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-upcloud-image-api" }}'
      methodName: execute
      inputs:
        run: |
          timeout 660 curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --variable %ORBIT_HOST_PRIVATE_KEY --request POST --header 'Content-Type: application/json' \
            --expand-data "$ORBIT_CREATE_DATA" https://api.upcloud.com/1.3/server
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_HOST_PRIVATE_KEY: ${{ vault.get(inputs.execution_secrets.bootstrap.vault, inputs.execution_secrets.bootstrap.key) }}
          ORBIT_CREATE_DATA: ${{ steps.request.outputs.create_data }}
  - name: server
    labels: {role: swamp}
    dependsOn:
    - {step: create, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: server
      inputs:
        intent: ${{ inputs.intent }}
        slot: ${{ inputs.slot }}
        stdout: ${{ steps.create.outputs.stdout }}
  - name: boot
    # OpenSSH retries the connection while the server boots; one literal timeout bounds the boot and cloud-init.
    labels: {role: swamp}
    dependsOn:
    - {step: server, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-boot-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("image-upcloud-boot-" + steps.server.outputs.address).split(".").join("-") }}
        transport:
          kind: ssh
          user: orbit
          port: 22
          identityFile: ${{ inputs.intent.ssh.identity_file }}
          connectTimeoutSec: 10
          extraOptions: [ConnectionAttempts=90]
          controlMaster: {enabled: false}
        hosts:
        - name: target
          address: ${{ steps.server.outputs.address }}
          transport:
            hostKeys: ${{ [inputs.intent.host_key] }}
      inputs:
        hosts: name:target
        argv: [timeout, '900', /usr/bin/sudo, -n, --, /usr/bin/cloud-init, status, --wait]
        timeoutSec: 1200
  - name: agent-copy
    labels: {role: swamp}
    dependsOn:
    - {step: boot, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: copy
      globalArgs: &guest
        name: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
        transport:
          kind: ssh
          user: orbit
          port: 22
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ steps.server.outputs.address }}
          transport:
            hostKeys: ${{ [inputs.intent.host_key] }}
      inputs:
        hosts: name:target
        src: /usr/local/bin/orbit-agent
        dst: ${{ inputs.intent.candidate }}
        direction: to
        atomic: true
        mode: '0700'
        verifySha256: true
        timeoutSec: 300
  - name: agent-install
    labels: {role: swamp}
    dependsOn:
    - {step: agent-copy, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '210', /usr/bin/sudo, -n, --, '${{ inputs.intent.candidate }}', command, agent.install]
        timeoutSec: 240
        stdin: ${{ inputs.intent.envelopes.install }}
  - name: agent-install-reply
    labels: {role: swamp}
    dependsOn:
    - {step: agent-install, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["agent-install"].outputs.stdout }}
        expect: installed
        pin: ${{ inputs.intent.agent_sha256 }}
  - name: cloud-init
    labels: {role: swamp}
    dependsOn:
    - {step: agent-install-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '75', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, guest.cloud-init]
        timeoutSec: 105
        stdin: ${{ inputs.intent.envelopes.cloud_init }}
  - name: cloud-init-reply
    labels: {role: swamp}
    dependsOn:
    - {step: cloud-init, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps["cloud-init"].outputs.stdout }}
        expect: ready
  - name: owner
    # The account check runs as `orbit` itself, so it sees the UID and GID the recipe expects.
    labels: {role: swamp}
    dependsOn:
    - {step: cloud-init-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/local/bin/orbit-agent, command, image.owner]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.owner }}
  - name: owner-reply
    labels: {role: swamp}
    dependsOn:
    - {step: owner, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps.owner.outputs.stdout }}
        expect: ready
  - name: inspect
    labels: {role: swamp}
    dependsOn:
    - {step: owner-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '60', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.inspect-phase]
        timeoutSec: 90
        stdin: ${{ inputs.intent.envelopes.inspect_boot }}
  - name: phases
    labels: {role: swamp}
    dependsOn:
    - {step: inspect, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: phases
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.inspect.outputs.stdout }}
  - name: verify
    # The smoke server checks the template it booted from; the builder skips these.
    labels: {role: swamp}
    guard: ${{ inputs.slot != "smoke" }}
    dependsOn:
    - {step: phases, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.verify]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.verify }}
  - name: verify-reply
    labels: {role: swamp}
    dependsOn:
    - {step: verify, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps.verify.outputs.stdout }}
        expect: ready
  - name: check
    labels: {role: swamp}
    dependsOn:
    - {step: verify-reply, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("image-upcloud-" + steps.server.outputs.address).split(".").join("-") }}
      methodName: exec
      globalArgs: *guest
      inputs:
        hosts: name:target
        argv: [timeout, '150', /usr/bin/sudo, -n, --, /usr/local/bin/orbit-agent, command, image.check]
        timeoutSec: 180
        stdin: ${{ inputs.intent.envelopes.check }}
  - name: check-reply
    labels: {role: swamp}
    dependsOn:
    - {step: check, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-upcloud-image-build'
      behaviorName: '${{ "task-vm-upcloud-image-input" }}'
      methodName: reply
      inputs:
        stdout: ${{ steps.check.outputs.stdout }}
        expect: ready
