id: 550a0a41-b59c-5ae7-bce7-399ad0fa27ac
name: task-check-push
description: Push a passed handoff candidate when CI is required, produce the check receipt and remove the scratch files.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      propertyNames:
        enum:
        - github_token
        - checks_token
        - git_authorization
      maxProperties: 3
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-check-(write|read|git)-[a-f0-9-]{36}$
        required:
        - vault
        - key
        additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
    candidate:
      type: object
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  - candidate
  additionalProperties: false
jobs:
- name: push
  labels:
    role: swamp
  steps:
  - name: export
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: exec
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - bundle
        - create
        - ${{ "/tmp/orbit-task-check-" + inputs.run_id + "/candidate.bundle" }}
        - HEAD
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    guard: ${{ has(inputs.candidate.result.error_code) || inputs.intent.check_name == null || inputs.candidate.result.outcome
      != "passed" || inputs.candidate.result.commit == null }}
    writes: true
  - name: prepare_local
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-prepare_local-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: 'mkdir -p -- "$ORBIT_PUBLICATION_ROOT"

          '
        env:
          ORBIT_PUBLICATION_ROOT: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control" }}
    dependsOn:
    - step: export
      condition:
        type: succeeded
  - name: copy_bundle
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: copy
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        src: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "/candidate.bundle" }}
        dst: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control/candidate.bundle" }}
        direction: from
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: prepare_local
      condition:
        type: succeeded
  - name: import
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-import-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: 'set -eu

          git init --quiet --bare --template= --object-format="$ORBIT_OBJECT_FORMAT" "$ORBIT_REPOSITORY"

          git -C "$ORBIT_REPOSITORY" fetch --quiet --no-tags "$ORBIT_BUNDLE" HEAD:refs/heads/candidate

          git -C "$ORBIT_REPOSITORY" rev-parse refs/heads/candidate ''refs/heads/candidate^{tree}''

          '
        ignoreExitCode: true
        timeout: 60000
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          ORBIT_OBJECT_FORMAT: ${{ inputs.candidate.object_format }}
          ORBIT_BUNDLE: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control/candidate.bundle" }}
          ORBIT_REPOSITORY: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control/repository.git" }}
    dependsOn:
    - step: copy_bundle
      condition:
        type: succeeded
  - name: import_result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ ("task-check-import_result-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: imported
      inputs:
        local: ${{ inputs.candidate.result }}
        steps: ${{ steps }}
    dependsOn:
    - step: import
      condition:
        type: succeeded
  - name: mint_github
    writes: true
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-mint-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 60 --max-filesize 65536 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt\
          \ \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_MINT_REQUEST\"\
          \ \"$ORBIT_MINT_URL\"\n"
        ignoreExitCode: true
        env:
          ORBIT_MINT_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/github-token"
            }}
          ORBIT_MINT_REQUEST: ${{ "{\"run_id\":\"" + inputs.run_id + "\"}" }}
    dependsOn:
    - step: import_result
      condition:
        type: succeeded
    guard: ${{ !steps.import_result.outputs.imported }}
  - name: mint_result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ ("task-check-mint-result-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: minted
      inputs:
        expected: ${{ inputs.intent.execution_references_json }}
        steps: ${{ steps }}
    dependsOn:
    - step: mint_github
      condition:
        type: succeeded
  - name: push
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-push-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: 'git -C "$ORBIT_REPOSITORY" push --porcelain -- "$ORBIT_REMOTE" "$ORBIT_REFSPEC"

          '
        ignoreExitCode: true
        timeout: 60000
        env:
          GIT_ALLOW_PROTOCOL: https
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_KEY_1: core.hooksPath
          GIT_CONFIG_KEY_2: http.followRedirects
          GIT_CONFIG_KEY_3: http.https://github.com/.extraheader
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_VALUE_1: /dev/null
          GIT_CONFIG_VALUE_2: 'false'
          GIT_CONFIG_VALUE_3: ${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key)
            }}
          GIT_TERMINAL_PROMPT: '0'
          ORBIT_REFSPEC: ${{ inputs.candidate.refspec }}
          ORBIT_REMOTE: ${{ inputs.candidate.remote }}
          ORBIT_REPOSITORY: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control/repository.git" }}
    dependsOn:
    - step: mint_result
      condition:
        type: succeeded
    guard: ${{ !steps.mint_result.outputs.minted }}
    writes: true
  - name: finish
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ ("task-check-finish-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: finish
      inputs:
        intent: ${{ inputs.intent }}
        local: ${{ inputs.candidate.result }}
        steps: ${{ steps }}
    dependsOn:
    - step: push
      condition:
        type: always
    - step: import
      condition:
        type: always
    - step: mint_github
      condition:
        type: always
  - name: pending
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: ${{ ("task-check-pending-" + string(inputs.intent.group_id)).split(".").join("-") }}
      methodName: pending
      inputs:
        pending: true
        inputs: ${{ inputs }}
        root_run_id: ${{ inputs.run_id }}
        result: ${{ steps.finish.outputs.result }}
        pushed_at: ${{ steps.finish.outputs.pushed_at }}
        admitted_at: ${{ inputs.intent.admitted_at }}
    dependsOn:
    - step: finish
      condition:
        type: succeeded
    guard: ${{ !steps.finish.outputs.pending }}
  - name: revoke_write
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-revoke-write-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: 'timeout 30 gh api --method DELETE installation/token

          '
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key)
            }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control/gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    dependsOn:
    - step: finish
      condition:
        type: succeeded
    guard: ${{ !steps.finish.outputs.minted }}
    allowFailure: true
  - name: revoke_unused_read
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-revoke-unused-read-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: 'timeout 30 gh api --method DELETE installation/token

          '
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.checks_token.vault, inputs.execution_secrets.checks_token.key)
            }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control/gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    dependsOn:
    - step: finish
      condition:
        type: succeeded
    guard: ${{ steps.finish.outputs.pending || !steps.finish.outputs.minted }}
    allowFailure: true
  - name: cleanup_remote
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
      methodName: exec
      inputs:
        hosts: name:target
        timeoutSec: ${{ inputs.intent.run_budget_seconds }}
        argv:
        - rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-check-" + inputs.run_id }}
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
    dependsOn:
    - step: finish
      condition:
        type: always
    - step: pending
      condition:
        type: always
    allowFailure: true
  - name: cleanup_local
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-cleanup_local-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_PUBLICATION_ROOT" "$ORBIT_OUTPUT"

          '
        env:
          ORBIT_PUBLICATION_ROOT: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-control" }}
          ORBIT_OUTPUT: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-output" }}
    dependsOn:
    - step: finish
      condition:
        type: always
    - step: pending
      condition:
        type: always
    allowFailure: true
queueTimeout: 30
