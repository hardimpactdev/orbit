---
- name: Read recorded enrollment times
  ansible.builtin.command:
    argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  register: renewal_list
  changed_when: false
  no_log: true
- name: Read the current time
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", date_time]
    filter: ansible_date_time
- name: Select this worker and its peer
  ansible.builtin.set_fact:
    renewal_current: >-
      {{ (renewal_list.stdout | from_json).workers
        | selectattr('name', 'equalto', renewal_name) | first | default({}) }}
    renewal_other: >-
      {{ (renewal_list.stdout | from_json).workers
        | selectattr('name', 'equalto', renewal_peer_name) | first | default({}) }}
- name: Renew only an old or unavailable worker
  when: >-
    not renewal_completed and (renewal_current.status | default('') not in renewal_accepting or
    renewal_current.instanceUuid | default('') | length == 0 or
    ((ansible_date_time.epoch | int) -
    (renewal_current.enrolledAt | regex_replace('Z$', '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).timestamp()) >= 10800 or
    ((ansible_date_time.epoch | int) -
    (renewal_current.enrolledAt | regex_replace('Z$', '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).timestamp()) < 0)
  block:
    - name: Require an accepting peer before starting a drain
      ansible.builtin.assert:
        that:
          - renewal_other.status | default('') in renewal_accepting
          - renewal_other.instanceUuid | default('') | length > 0
        fail_msg: "Cannot renew {{ renewal_slot }} because {{ renewal_peer }} is unavailable"
    - name: Prepare the overlap credentials through official Swamp
      ansible.builtin.import_tasks: swamp-worker-overlap-credentials.yml
    - name: Start replacement capacity before any drain
      ansible.builtin.systemd_service:
        name: orbit-swamp-worker@c.service
        state: started
        enabled: false
      register: renewal_overlap_start
    - name: Wait for the overlap worker to accept dispatches
      ansible.builtin.command:
        argv: "{{ ['timeout', '3', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_overlap_wait
      changed_when: false
      no_log: true
      retries: 20
      delay: 2
      until: >-
        renewal_overlap_wait.rc == 0 and
        ((renewal_overlap_wait.stdout | from_json).workers
        | selectattr('name', 'equalto', renewal_names.c)
        | selectattr('status', 'in', renewal_accepting)
        | selectattr('instanceUuid') | list | length == 1)
    - name: Select replacement capacity
      ansible.builtin.set_fact:
        renewal_overlap: >-
          {{ (renewal_overlap_wait.stdout | from_json).workers
          | selectattr('name', 'equalto', renewal_names.c) | first }}
    - name: Require a recent replacement with enough dispatch slots
      ansible.builtin.assert:
        that:
          - renewal_overlap.capacity | int >= renewal_current.capacity | default(renewal_other.capacity) | int
          - renewal_overlap.activeDispatchIds | length < renewal_overlap.capacity | int
          - >-
            ((ansible_date_time.epoch | int) -
            (renewal_overlap.enrolledAt | regex_replace('Z$', '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).timestamp()) < 10800
        fail_msg: Overlap worker is full, too old or lacks capacity; no base worker will be drained
    - name: Prove replacement admission before draining the old instance
      ansible.builtin.import_tasks: swamp-worker-renew-verify.yml
      vars: {renewal_verify_slot: c}
    - name: Read the effective worker stop allowance
      ansible.builtin.command:
        argv:
          - timeout
          - '10'
          - busctl
          - get-property
          - org.freedesktop.systemd1
          - "/org/freedesktop/systemd1/unit/orbit_2dswamp_2dworker_40{{ item }}_2eservice"
          - org.freedesktop.systemd1.Service
          - TimeoutStopUSec
      loop: "{{ [renewal_slot, 'c'] }}"
      register: renewal_stop
      changed_when: false
    - name: Require the converged 75 minute drain allowance
      ansible.builtin.assert:
        that:
          - item.stdout.split() | length == 2
          - item.stdout.split()[0] == 't'
          - item.stdout.split()[1] | int >= 4500000000
        fail_msg: The worker unit must converge before renewal can start
      loop: "{{ renewal_stop.results }}"
      loop_control: {label: "{{ item.item }}"}
    - name: Refresh peer status after the live probe
      ansible.builtin.command:
        argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_peer_check
      changed_when: false
      no_log: true
    - name: Select the peer after its live probe
      ansible.builtin.set_fact:
        renewal_fresh_peer: >-
          {{ (renewal_peer_check.stdout | from_json).workers
            | selectattr('name', 'equalto', renewal_peer_name) | first | default({}) }}
    - name: Select the replacement after its live probe
      ansible.builtin.set_fact:
        renewal_fresh_overlap: >-
          {{ (renewal_peer_check.stdout | from_json).workers
            | selectattr('name', 'equalto', renewal_names.c) | first | default({}) }}
    - name: Require the peer and replacement still to accept work
      ansible.builtin.assert:
        that:
          - renewal_fresh_peer.instanceUuid | default('') == renewal_other.instanceUuid
          - renewal_fresh_peer.status | default('') in renewal_accepting
          - renewal_fresh_overlap.instanceUuid | default('') == renewal_overlap.instanceUuid
          - renewal_fresh_overlap.status | default('') in renewal_accepting
          - renewal_fresh_overlap.activeDispatchIds | default([]) | length < renewal_fresh_overlap.capacity | default(0) | int
        fail_msg: "Deferring renewal: peer or replacement changed or filled during its probe; no drain, retry in five minutes"
    # KillMode=mixed sends SIGTERM to the CLI only. The pinned CLI drains its runners.
    - name: Record the drain and its monitoring limit
      ansible.builtin.debug:
        msg: "Draining {{ renewal_slot }} after c accepts replacement capacity; peer failure during the blocking restart is checked after restart returns"
    - name: Drain active dispatches and restart this worker
      ansible.builtin.systemd_service:
        name: "orbit-swamp-worker@{{ renewal_slot }}.service"
        state: restarted
    - name: Wait for a different accepting instance without stopping the peer
      ansible.builtin.command:
        argv: "{{ ['timeout', '3', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_wait
      changed_when: false
      no_log: true
      retries: 20
      delay: 2
      until: >-
        renewal_wait.rc == 0 and
        (((renewal_wait.stdout | from_json).workers
        | selectattr('name', 'in', [renewal_peer_name, renewal_names.c])
        | selectattr('status', 'in', renewal_accepting) | list | length != 2) or
        ((renewal_wait.stdout | from_json).workers
        | selectattr('name', 'equalto', renewal_name)
        | selectattr('status', 'in', renewal_accepting)
        | rejectattr('instanceUuid', 'equalto', renewal_current.instanceUuid | default(''))
        | selectattr('instanceUuid') | list | length == 1))
    - name: Require the peer to remain accepting
      ansible.builtin.assert:
        that:
          - >-
            (renewal_wait.stdout | from_json).workers
            | selectattr('name', 'in', [renewal_peer_name, renewal_names.c])
            | selectattr('status', 'in', renewal_accepting) | list | length == 2
        fail_msg: >-
          Peer {{ renewal_peer }} failed during the blocking drain/restart of
          {{ renewal_slot }}; detected after restart, no further drain
    - name: Prove the new worker accepts dispatches before proceeding
      ansible.builtin.import_tasks: swamp-worker-renew-verify.yml
      vars:
        renewal_verify_slot: "{{ renewal_slot }}"
    - name: Require the renewed worker to restore the original capacity
      ansible.builtin.assert:
        that:
          - >-
            ((renewal_wait.stdout | from_json).workers
            | selectattr('name', 'equalto', renewal_name) | first).capacity | int >=
            renewal_current.capacity | default(renewal_other.capacity) | int
        fail_msg: Renewed worker lost capacity; c stays running and no further drain starts
    - name: Mark this round complete before considering another base worker
      ansible.builtin.set_fact:
        renewal_completed: true
    - name: Record successful sequential renewal
      ansible.builtin.debug:
        msg: "Renewed {{ renewal_slot }}; its new instance accepts dispatches"
