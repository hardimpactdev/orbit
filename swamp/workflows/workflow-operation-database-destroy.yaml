id: ad81876c-b31c-4ea4-8930-e9468294471a
name: operation-database-destroy
description: database:destroy from 209, one docker exec -i per batch; the admin password is the first stdin line of each, from the vault.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database.destroy}
    intent: {type: object}
    # Names only: fence, drop, gone and restore, each the admin password line and one batch, one whole value.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-destroy-[1-9][0-9]*(-[1-9][0-9]*)?-(fence|drop|gone|restore)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: destroy
  labels: {role: swamp}
  steps:
    # PostgreSQL: journal each database's ALLOW_CONNECTIONS and close it to new clients, in one transaction.
  - name: 'Fence new clients'
    labels: {role: swamp}
    writes: true
    guard: '${{ inputs.intent.driver != "pgsql" }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60"] + inputs.intent.admin_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.fence.vault, inputs.execution_secrets.fence.key) }}
        timeoutSec: 70
    # A blocker ends the batch before the first drop; the Gateway reads the database.in_use marker from its output.
  - name: 'Drop databases and users'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Fence new clients', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "300"] + inputs.intent.admin_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.drop.vault, inputs.execution_secrets.drop.key) }}
        okExitCodes: [0, 1, 3]
        timeoutSec: 310
    # The end check: it fails while a planned name remains, so a parent run sees a refused removal too.
  - name: 'Check they are gone'
    labels: {role: swamp}
    dependsOn: [{step: 'Drop databases and users', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60"] + inputs.intent.admin_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.gone.vault, inputs.execution_secrets.gone.key) }}
        timeoutSec: 70
    # PostgreSQL, only after a failure: each surviving database gets its journaled value back.
  - name: 'Restore the fence'
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: 'Drop databases and users', condition: {type: always}}
    - {step: 'Check they are gone', condition: {type: or, conditions: [{type: failed}, {type: skipped}]}}
    guard: '${{ inputs.intent.driver != "pgsql" || !("Fence new clients" in steps && steps["Fence new clients"].status == "succeeded") }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60"] + inputs.intent.admin_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.restore.vault, inputs.execution_secrets.restore.key) }}
        timeoutSec: 70
