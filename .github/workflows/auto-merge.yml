name: Auto-merge

# Pull requests from Nick and his Orbit app join the merge queue on their own once Required checks pass.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: ${{ !github.event.pull_request.draft && contains(fromJSON('["nckrtl", "orbit-nckrtl[bot]", "orbit-nckrtl"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-26.04
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto "$PR_URL"
