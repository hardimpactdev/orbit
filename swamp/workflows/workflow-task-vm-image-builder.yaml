id: 603e9527-b5e5-4707-8483-db13afb05069
name: task-vm-image-builder
description: Launch a builder VM from a source image on an Incus host, bring it to the pins of the release with the task VM role phases, clean and stop it, and publish it under a candidate alias. The image build and the image refresh both run it, from 209 over official SSH.
version: 1
queueTimeout: 60
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.image_build]}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: reset
  labels: {role: swamp}
  steps:
    # A missing instance is fine: exit 1 of `incus delete` for an unknown name.
  - name: Remove earlier attempts
    labels: {role: swamp}
    writes: true
    forEach:
      item: name
      in: '${{ [inputs.intent.builder, inputs.intent.smoke] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-reset-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs: &host
        name: ${{ "task-vm-image-reset-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '300', incus, delete, --force, --project, '${{ inputs.intent.project }}', '--', '${{ self.name }}']
        timeoutSec: 320
- name: launch
  labels: {role: swamp}
  dependsOn:
  - {job: reset, condition: {type: succeeded}}
  steps:
    # `incus init` reads the instance config (the cloud-init key for the orbit account and its drive) from stdin, then the VM starts.
  - name: Launch the builder
    labels: {role: swamp}
    writes: true
    concurrency: 1
    forEach:
      item: change
      in: '${{ [{"argv": ["incus", "init", "--vm", "--project", inputs.intent.project, "--config", "limits.cpu=" + string(inputs.intent.cpus), "--config", "limits.memory=" + inputs.intent.memory, "--device", "root,size=" + inputs.intent.disk, "--device", "eth0,network=" + inputs.intent.network, "--device", "eth0,security.port_isolation=true", "--", inputs.intent.source, inputs.intent.builder], "stdin": inputs.intent.launch_config}, {"argv": ["incus", "start", "--project", inputs.intent.project, "--", inputs.intent.builder], "stdin": ""}] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-launch-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-launch-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: '${{ ["timeout", "180"] + self.change.argv }}'
        stdin: ${{ self.change.stdin }}
        timeoutSec: 200
- name: wait
  labels: {role: swamp}
  dependsOn:
  - {job: launch, condition: {type: succeeded}}
  steps:
    # The Incus agent answers first; cloud-init has made the orbit account when its status ends.
  - name: Wait for the builder
    labels: {role: swamp}
    concurrency: 1
    forEach:
      item: wait
      in: '${{ [["incus", "wait", "--project", inputs.intent.project, "--timeout", "600", "--", inputs.intent.builder, "agent"], ["incus", "exec", "--project", inputs.intent.project, "--", inputs.intent.builder, "cloud-init", "status", "--wait"]] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-wait-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-wait-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: '${{ ["timeout", "660"] + self.wait }}'
        timeoutSec: 700
- name: phases
  labels: {role: swamp}
  dependsOn:
  - {job: wait, condition: {type: succeeded}}
  steps:
  - name: Run the task image phases
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ${{ inputs.intent.builder }}
        tags: software,tools,check
        with_pi: true
- name: clean
  labels: {role: swamp}
  dependsOn:
  - {job: phases, condition: {type: succeeded}}
  steps:
    # The clone makes its own cloud-init state, machine id and host keys at its first boot.
    # No `}}` inside the expression below: the closing braces of the map and of the expression are apart.
  - name: Clean and stop
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-image-clean
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: '${{ {"host_ssh_execution": inputs.intent.jump, "vm": {"name": inputs.intent.builder, "project": inputs.intent.project} } }}'
- name: publish
  labels: {role: swamp}
  dependsOn:
  - {job: clean, condition: {type: succeeded}}
  steps:
    # The output names the fingerprint; the Gateway reads it from this step. `--quiet` drops the progress lines, because a result keeps only the first 4 KB.
  - name: Publish the candidate
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-publish-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-publish-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '900', incus, publish, --quiet, --project, '${{ inputs.intent.project }}', --compression, none, --alias, '${{ inputs.intent.candidate_alias }}', '--', '${{ inputs.intent.builder }}', '${{ "orbit.recipe=" + inputs.intent.identity }}', orbit.profile=base]
        timeoutSec: 920
