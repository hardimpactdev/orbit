id: d72f5ebe-a54b-5cff-9a56-23bb4efb9214
name: route-create-dns
description: "route.create: the private DNS records outside the TLD."
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    intent: {type: object}
    node_id: {type: integer, minimum: 1}
  required: [intent, node_id]
  additionalProperties: false
jobs:
- name: create
  labels: {role: swamp}
  steps:
    # The VPN Node's whole records file.
  - name: 'records'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: dns, in: '${{ inputs.intent.dns.filter(d, string(d.node_id) == string(inputs.node_id)) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("route-dns-records-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: /etc/dnsmasq.d/orbit-records.conf, content: '${{ self.dns.records }}', owner: root, group: root, mode: '0644', ensure: present,
        nodeHost: '${{ inputs.intent.nodes[string(inputs.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(inputs.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(inputs.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(inputs.node_id)].identity_file }}', become: true}
      inputs: {}
    # The requester catalog the private DNS listener reads.
  - name: 'catalog'
    labels: {role: swamp}
    dependsOn:
    - {step: 'records', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: dns, in: '${{ inputs.intent.dns.filter(d, string(d.node_id) == string(inputs.node_id)) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("route-dns-catalog-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: /var/lib/orbit/private-dns/catalog.json, content: '${{ self.dns.catalog }}', owner: root, group: root, mode: '0644', ensure: present,
        nodeHost: '${{ inputs.intent.nodes[string(inputs.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(inputs.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(inputs.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(inputs.node_id)].identity_file }}', become: true}
      inputs: {}
    # dnsmasq reads its records only at start.
  - name: 'restart'
    labels: {role: swamp}
    dependsOn:
    - {step: 'records', condition: {type: always}}
    - {step: 'catalog', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: dns, in: '${{ inputs.intent.dns.filter(d, string(d.node_id) == string(inputs.node_id)) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("route-dnsmasq-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("route-dnsmasq-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.nodes[string(inputs.node_id)].user }}'
          port: '${{ inputs.intent.nodes[string(inputs.node_id)].port }}'
          identityFile: '${{ inputs.intent.nodes[string(inputs.node_id)].identity_file }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.nodes[string(inputs.node_id)].host }}'
          transport: {hostKeys: '${{ inputs.intent.nodes[string(inputs.node_id)].host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', systemctl, restart, dnsmasq, orbit-private-dns.service]
        timeoutSec: 70
