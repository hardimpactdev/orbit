---
# Container removal uses its saved identity, so a retry also works after the container is gone.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: container_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Remove the admitted container
  hosts: container_node
  gather_facts: false
  become: true
  tags: [stop, remove]
  module_defaults:
    ansible.builtin.command:
      stdin: ""
      stdin_add_newline: false
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    container: "{{ intent.container_destroy }}"
    phase: "{{ ansible_run_tags | first }}"
    incus: [incus, --project, "{{ container.project }}"]
  tasks:
    - name: Run the phase
      block:
        - name: Read the container inventory
          ansible.builtin.command: { argv: "{{ incus + ['list', '--format=json'] }}", stdin: "" }
          register: destroy_inventory
          changed_when: false
        - name: Select the container
          ansible.builtin.set_fact:
            present: "{{ (destroy_inventory.stdout | from_json | selectattr('name', 'equalto', container.name) | list) }}"
        # Before its databases drop, so no worker or other client in it holds a session that makes the drop refuse. A stopped or
        # missing container needs nothing.
        - name: Stop the container
          when: phase == 'stop' and present | length > 0 and present[0].status != 'Stopped'
          ansible.builtin.command: { argv: "{{ incus + ['stop', '--force', container.name] }}", stdin: "" }
          changed_when: true
        - name: Delete the container and its owned network state
          when: phase == 'remove'
          block:
            # Only a removal whose runtime recorded an inner volume names one (docs/reference/development-containers.md#the-inner-volume).
            - name: Read the inner volume
              when: container.inner_volume is defined
              ansible.builtin.command:
                argv: [incus, query, --, "/1.0/storage-pools/{{ container.pool }}/volumes/custom/{{ container.inner_volume }}?project={{ container.project }}"]
                stdin: ""
              register: destroy_inner_volume
              changed_when: false
              failed_when: false
            - name: Select the inner volume
              ansible.builtin.set_fact:
                inner_present: "{{ container.inner_volume is defined and destroy_inner_volume.rc == 0 }}"
            # Incus's own deletion first; a normal removal needs nothing more.
            - name: Stop and delete the container with its snapshots
              when: present | length > 0
              ansible.builtin.command: { argv: "{{ incus + ['delete', '--force', container.name] }}", stdin: "" }
              register: destroy_container_delete
              changed_when: destroy_container_delete.rc == 0
              failed_when: false
            - name: Delete the inner volume
              when: inner_present
              ansible.builtin.command:
                argv: "{{ incus + ['storage', 'volume', 'delete', container.pool, container.inner_volume] }}"
                stdin: ""
              register: destroy_inner_delete
              changed_when: destroy_inner_delete.rc == 0
              failed_when: false
            # Incus refuses to delete a record whose ZFS dataset went outside it (Instance 3427). An empty dataset with the record's own name,
            # and one per recorded snapshot, lets Incus delete the record its own way. Only this Instance's names; never a zfs destroy. The
            # inner volume then goes by name, each snapshot and then the volume: a copy's volume can be a clone whose origin went with its
            # Instance. A refusal for any other cause, or on a pool that is not ZFS, fails again in the second deletion with Incus's stderr.
            - name: Delete what Incus refused once more, after giving back its missing datasets
              when: refused_container or refused_inner
              vars:
                refused_container: "{{ (destroy_container_delete.rc | default(0)) != 0 }}"
                refused_inner: "{{ (destroy_inner_delete.rc | default(0)) != 0 }}"
                destroy_missing: "{{ destroy_datasets | default([]) | difference(destroy_existing.stdout_lines | default([])) | sort }}"
              block:
                - name: Read the storage pool
                  ansible.builtin.command: { argv: [incus, query, --, "/1.0/storage-pools/{{ container.pool }}"], stdin: "" }
                  register: destroy_pool
                  changed_when: false
                - name: Read the container's snapshots
                  when: refused_container and (destroy_pool.stdout | from_json).driver == 'zfs'
                  ansible.builtin.command:
                    argv: [incus, query, --, "/1.0/instances/{{ container.name }}/snapshots?project={{ container.project }}&recursion=1"]
                    stdin: ""
                  register: destroy_container_snapshots
                  changed_when: false
                - name: Read the inner volume's snapshots
                  when: refused_inner
                  ansible.builtin.command:
                    argv:
                      - incus
                      - query
                      - --
                      - >-
                        /1.0/storage-pools/{{ container.pool }}/volumes/custom/{{ container.inner_volume
                        }}/snapshots?project={{ container.project }}&recursion=1
                    stdin: ""
                  register: destroy_inner_snapshots
                  changed_when: false
                - name: Name the datasets Incus expects
                  when: (destroy_pool.stdout | from_json).driver == 'zfs'
                  ansible.builtin.set_fact:
                    destroy_datasets: >-
                      {{ (([own_root] + (destroy_container_snapshots.stdout | from_json | map(attribute='name')
                           | map('regex_replace', '^', own_root ~ '@snapshot-') | list)) if refused_container else [])
                         + (([own_inner] + (destroy_inner_snapshots.stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '')
                           | map('regex_replace', '^', own_inner ~ '@snapshot-') | list)) if refused_inner else []) }}
                  vars:
                    own_root: "{{ (destroy_pool.stdout | from_json).config['zfs.pool_name'] }}/containers/{{ container.project }}_{{ container.name }}"
                    own_inner: >-
                      {{ (destroy_pool.stdout | from_json).config['zfs.pool_name'] }}/custom/{{ container.project }}_{{ container.inner_volume | default('') }}
                - name: Read which of them exist
                  when: destroy_datasets is defined
                  ansible.builtin.command: { argv: "{{ ['zfs', 'list', '-H', '-o', 'name', '-t', 'all'] + destroy_datasets }}", stdin: "" }
                  register: destroy_existing
                  changed_when: false
                  failed_when: false
                # Never adopt a dataset: a name that another writer took since the read, with data or children, refuses the removal.
                - name: Read each missing name again with its children
                  ansible.builtin.command: { argv: [zfs, list, -H, -o, name, -r, -t, all, "{{ item }}"], stdin: "" }
                  loop: "{{ destroy_missing }}"
                  register: destroy_taken
                  changed_when: false
                  failed_when: false
                - name: Refuse a name that a dataset holds now
                  ansible.builtin.assert:
                    that: destroy_taken.results | default([]) | selectattr('rc', 'equalto', 0) | list | length == 0
                    fail_msg: instance.removal_dataset_taken
                    quiet: true
                # A dataset sorts before its own snapshots, so each snapshot finds its dataset. No `-p`: only this one name is made.
                - name: Make each missing one empty
                  ansible.builtin.command:
                    argv: >-
                      {{ ['zfs', 'snapshot', item] if '@' in item else ['zfs', 'create', '-o', 'mountpoint=legacy', '-o', 'canmount=noauto', item] }}
                    stdin: ""
                  loop: "{{ destroy_missing }}"
                  changed_when: true
                - name: Delete the container again
                  when: refused_container
                  ansible.builtin.command: { argv: "{{ incus + ['delete', '--force', container.name] }}", stdin: "" }
                  changed_when: true
                - name: Delete the inner volume's snapshots
                  when: refused_inner
                  ansible.builtin.command:
                    argv: "{{ incus + ['storage', 'volume', 'snapshot', 'delete', container.pool, container.inner_volume, item] }}"
                    stdin: ""
                  # Incus names a volume snapshot `<volume>/<snapshot>`; the snapshot's own name is the last part.
                  loop: "{{ (destroy_inner_snapshots.stdout | default('[]')) | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | list }}"
                  changed_when: true
                - name: Delete the inner volume again
                  when: refused_inner
                  ansible.builtin.command:
                    argv: "{{ incus + ['storage', 'volume', 'delete', container.pool, container.inner_volume] }}"
                    stdin: ""
                  changed_when: true
            - name: Read the ACL inventory in the default project
              ansible.builtin.command: { argv: [incus, query, --, "/1.0/network-acls?project=default&recursion=1"], stdin: "" }
              register: destroy_acls
              changed_when: false
            - name: Remove its ACL from the default project
              when: container.acl in (destroy_acls.stdout | from_json | map(attribute='name') | list)
              ansible.builtin.command: { argv: [incus, network, acl, delete, "{{ container.acl }}", --project, default], stdin: "" }
              changed_when: true
            - name: Read the added firewall rules
              ansible.builtin.command: { argv: [ufw, show, added], stdin: "" }
              register: destroy_firewall
              changed_when: false
            # By the rule itself, not its number: another removal on the Node deletes rules at the same time and shifts the numbers.
            - name: Delete only this Instance's rules
              ansible.builtin.command:
                argv: "{{ ['ufw', '--force'] + ((['route', 'delete'] + rule[2:]) if rule[1] == 'route' else (['delete'] + rule[1:])) }}"
                stdin: ""
              vars:
                rule: "{{ (item | regex_replace(\" comment '.*$\", '')).split() }}"
              loop: "{{ destroy_firewall.stdout_lines | select('search', \" comment '\" ~ (container.firewall_prefix | regex_escape)) | list }}"
              changed_when: true
            # The bridge endpoint records that only this Instance needed go with it, through the helper's own withdrawal under its
            # writer lock (docs/reference/development-containers.md#destroy). `bridge.endpoints` is what every other Instance on the Node
            # still needs, read after the admission stamp, so a record admitted since stays, and an endpoint another Instance uses is
            # never removed. The Node's own baseline comes from its stored bridge configuration. A refusal, such as a busy writer or
            # a still-needed endpoint without its record, changes nothing and leaves the records to host convergence; the removal
            # goes on and names it.
            - name: Read the bridge configuration
              when: container.bridge is defined
              ansible.builtin.slurp: { src: /var/lib/orbit/instance-bridge/config.json }
              register: destroy_bridge_config
              failed_when: false
            - name: Withdraw the bridge endpoints that no other Instance needs
              when: container.bridge is defined and destroy_bridge_config.content is defined and not ansible_check_mode
              ansible.builtin.command:
                argv: [python3, /usr/local/libexec/orbit-instance-bridge, --state-dir, /var/lib/orbit/instance-bridge, --intent, --reconcile, --withdraw]
                stdin: >-
                  {{ {'network': container.bridge.network, 'cidr': container.bridge.cidr, 'endpoints': container.bridge.endpoints,
                      'admitted_at': container.bridge.admitted_at | int,
                      'baseline': (destroy_bridge_config.content | b64decode | from_json).baseline | default({})} | to_json }}
              register: destroy_bridge
              failed_when: false
              changed_when: destroy_bridge.rc == 0 and (destroy_bridge.stdout | from_json).changed > 0
            - name: Remove this Instance's pending mail activation state
              ansible.builtin.file: {path: "/var/lib/orbit/instance-mail/{{ container.name }}", state: absent}
            # A removal saved before the marker joined its intent has none to name; a sleep never ran for it.
            - name: Remove this Instance's asleep marker
              when: container.asleep_marker is defined
              ansible.builtin.file: {path: "{{ container.asleep_marker }}", state: absent}
            # The power helper's files of the Instance go with the container: its plan, sleep result, swap limits record, target
            # descriptor, receipts, and its fast wake's request and outcome files. `discard` takes the Instance's lock, so it waits for a
            # helper still at work, and a late worker then finds no descriptor (docs/reference/prepared-restore.md#lifecycle).
            - name: Install the power helper
              ansible.builtin.include_tasks: { file: tasks/instance-power-helper.yml, apply: {tags: [always]} }
            - name: Discard this Instance's power helper files
              ansible.builtin.include_tasks: { file: tasks/instance-power-call.yml, apply: {tags: [always]} }
              vars:
                power_call: ['discard', '--instance', '{{ container.instance_id }}']
            # The Rust executor's freeze state of the Instance goes too: its plan, swap limits record and receipt. The container is
            # gone, so a late signed sleep or wake has nothing to act on. Signed destroy follows separately (ADR 0266).
            - name: Remove this Instance's executor power state
              ansible.builtin.file: {path: "/var/lib/orbit/executor/power/{{ container.instance_id }}", state: absent}
            - name: Remove the Node repository mirror
              ansible.builtin.file: { path: "{{ container.mirror }}", state: absent }
            # A task copy's base scratch, which a cancelled task:sync may leave; it holds no credential. The intent names no Instance id,
            # and a new key would not reach a run that an older Gateway admitted: the mirror's file name is the Instance id
            # (InstanceContainer::mirror).
            - name: Name the copy's base scratch by its Instance
              ansible.builtin.import_tasks: tasks/task-copy-base-names.yml
              vars:
                task_base_instance: "{{ container.mirror | basename | regex_replace('[.]git$', '') }}"
            - name: Remove the Node task base scratch
              ansible.builtin.file: { path: "{{ base_node }}", state: absent }
            - name: Read the remaining containers
              ansible.builtin.command: { argv: "{{ incus + ['list', '--format=json'] }}", stdin: "" }
              register: destroy_remaining
              changed_when: false
            - name: Read the storage volumes
              ansible.builtin.command:
                argv: [incus, query, --, "/1.0/storage-pools/{{ container.pool }}/volumes?project={{ container.project }}&recursion=1"]
                stdin: ""
              register: destroy_volumes
              changed_when: false
            - name: Check the container and volume are gone
              ansible.builtin.assert:
                that:
                  - destroy_remaining.stdout | from_json | selectattr('name', 'equalto', container.name) | list | length == 0
                  - >-
                    destroy_volumes.stdout | from_json | selectattr('name', 'equalto', container.name)
                    | selectattr('type', 'equalto', 'container') | list | length == 0
                  - >-
                    container.inner_volume is not defined or destroy_volumes.stdout | from_json
                    | selectattr('name', 'equalto', container.inner_volume) | selectattr('type', 'equalto', 'custom') | list | length == 0
                fail_msg: instance.removal_incomplete
                quiet: true
            # Only once the copy is gone: the last hold on the Node starts the runners that the holds stopped
            # (docs/reference/node-provisioning.md#proof-places-on-a-ci-node). A rerun changes nothing. A Node whose ci-runner role
            # went has no script, no hold and no runner to start.
            - name: Release the proof copy's CI place
              when: container.ci_hold | default(false)
              ansible.builtin.command:
                argv: [/usr/bin/timeout, "240", /usr/local/libexec/orbit-ci-runner-hold, release, "{{ container.name }}"]
                removes: /usr/local/libexec/orbit-ci-runner-hold
                stdin: ""
              changed_when: true
        - name: Write the phase result
          ansible.builtin.copy:
            content: >-
              {{ ({'container_present': present | length > 0, 'removed': phase == 'remove'}
                  | combine({'bridge_withdrawal': 'withdrawn' if destroy_bridge.rc == 0
                             else (((destroy_bridge.stdout | default('') | trim) if destroy_bridge.stdout | default('') is match('^\\s*[{]') else '{}') | from_json).error_code
                                  | default('instance.container_bridge_write_failed')}
                            if destroy_bridge.rc is defined else {})) | to_json }}
            dest: "{{ run }}/{{ phase }}.json"
            mode: "0600"
          changed_when: false
          delegate_to: localhost
          become: false
          vars: &local
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue:
        # Swamp keeps no stderr of a failed command step, so the refusal names the failed task, its message and the end of its
        # stderr; the Gateway records that as the Operation's stderr. 1,800 characters keep the JSON within the 4,096 bytes of
        # stdout that the run result keeps of "Read container removal". A failed stop skips the deletion, so its refusal goes to
        # remove.json too: the one file that step prints.
        - name: Write the phase refusal
          ansible.builtin.copy:
            content: >-
              {{ {'error_code': ansible_failed_result.msg
                   if ansible_failed_result.msg | default('') is match('^[a-z]+\.[a-z0-9_]+$')
                   else ('instance.teardown_step_failed' if phase == 'teardown' else 'instance.removal_incomplete'),
                  'detail': (failure_head ~ ((': ' ~ failure_tail) if failure_tail != '' else ''))[:1800]}
                 | to_json }}
            dest: "{{ run }}/remove.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            failure_head: >-
              {{ (ansible_failed_task.name | default('A removal task')) ~ ': '
                 ~ (ansible_failed_result.msg | default('The task failed.') | string | trim) }}
            # A real newline: this Jinja keeps '\n' in a string literal as two characters.
            failure_newline: "\n"
            # A loop's failure keeps its stderr per item. ASCII only, so the JSON stays as long as its characters.
            failure_stderr: >-
              {{ (ansible_failed_result.stderr | default(ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                 | selectattr('failed') | map(attribute='stderr', default='') | join(failure_newline)) | string | trim)
                 | regex_replace('[^\x00-\x7f]', '?') }}
            failure_room: "{{ [1798 - (failure_head | length), 0] | max }}"
            # A cut keeps whole lines only: the kept end loses its text up to the first newline, so no half line, such as a cut
            # secret, escapes the Gateway's redaction.
            failure_tail: >-
              {{ failure_stderr if failure_stderr | length <= failure_room | int
                 else ((failure_stderr[-(failure_room | int):] if failure_room | int > 0 else '').partition(failure_newline)[2]) }}
        - name: Fail the phase
          ansible.builtin.fail: { msg: "{{ ansible_failed_result.msg | default('Container removal failed.') }}" }
