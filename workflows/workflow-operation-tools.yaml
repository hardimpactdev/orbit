id: 774d24db-4bb9-4a5c-811d-ef19d16a3888
name: operation-tools
description: Claim and execute a Tool kind within one placed worker invocation.
labels: { pool: migration }
queueTimeout: 60
autoResume: true
trigger:
  schedule: "2,12,22,32,42,52 * * * * *"
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-tools-discovery
          methodName: discover
          inputs:
            family: operation-tools
            kinds: ["tool.install", "tool.update", "tool.remove", "tool.adopt", "tool.manager_converge"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.kind }}
        forEach:
          item: kind
          in: "${{ steps.discover.outputs.work.map(item, item.kind) }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-tools"
          behaviorName: '${{ "operation-tools-" + {"tool.install":"install", "tool.update":"update", "tool.remove":"remove", "tool.adopt":"adopt", "tool.manager_converge":"manager-converge"}[self.kind] }}'
          methodName: execute
          inputs:
            kind: "${{ self.kind }}"
            worker: '${{ run.id + ":" + self.kind }}'
