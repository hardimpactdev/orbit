id: 30f3bb33-0431-4fdf-9cd5-b54c5da45354
name: operation-cluster-router
description: "Cluster Router set in the chart's steps; Node work through official cfgmgmt and SSH behaviors (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: cluster.router_set}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: router
  labels: {role: swamp}
  steps:
    # The router role's account, packages and pinned Caddy package (cluster-router-prepare).
  - name: 'Prepare the Router'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: candidate, in: '${{ inputs.intent.candidate }}'}
    task:
      type: workflow
      workflowIdOrName: cluster-router-prepare
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        execution_secrets: {}
        intent: '${{ self.candidate.intent }}'
    # Per leaf on the candidate: a Node-local key and its public CSR (route-create-csr).
  - name: 'Request the certificates'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-csr
      inputs:
        intent: '${{ inputs.intent }}'
        leaf: '${{ self.leaf }}'
    # Per leaf: 209 has the CSR signed; the one Gateway call (route-create-sign).
  - name: 'Sign the CSRs'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        parent_run_id: '${{ run.id }}'
        leaf: '${{ inputs.intent.leaves[self.leaf] }}'
        request: '${{ steps["Request the certificates-" + string(self.leaf)].outputs.csr.stdout }}'
    # The candidate accepts members on 443 and 53; each workload accepts the candidate on its Route ports.
  - name: 'Open LAN paths'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: rule, in: '${{ inputs.intent.lan_present }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/firewall'
      behaviorName: '${{ ("route-lan-" + string(self.rule.node_id) + "-" + string(self.rule.port) + "-" + self.rule.source.split("/").join("-")).split(".").join("-") }}'
      methodName: apply
      globalArgs: {port: '${{ self.rule.port }}', protocol: '${{ self.rule.protocol }}', action: allow, ensure: present, source: '${{ self.rule.source }}',
        nodeHost: '${{ inputs.intent.nodes[string(self.rule.node_id)].host }}', nodeUser: '${{ inputs.intent.nodes[string(self.rule.node_id)].user }}', nodePort: '${{ inputs.intent.nodes[string(self.rule.node_id)].port }}',
        nodeIdentityFile: '${{ inputs.intent.nodes[string(self.rule.node_id)].identity_file }}', become: true}
      inputs: {}
    # Per Node: certificates and the prepared Caddyfile with the candidate's Router sites (route-create-site).
  - name: Hold the Route Nodes
    labels: {role: swamp}
    queueTimeout: 30
    writes: true
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-hold-acquire" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 30 --retry 20 --retry-all-errors --retry-delay 1 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_HOLD_REQUEST\" \"$ORBIT_HOLD_URL\"\n"
        env:
          ORBIT_HOLD_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/route-hold" }}
          ORBIT_HOLD_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\"}" }}'
    dependsOn:
    - step: Prepare the Router
      condition:
        type: always
    - step: Request the certificates
      condition:
        type: always
    - step: Sign the CSRs
      condition:
        type: always
    - step: Open LAN paths
      condition:
        type: always
  - name: 'Install certs, publish'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Open LAN paths', condition: {type: always}}
    - {step: Hold the Route Nodes, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.publish.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.publish }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSRs-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: {}
  - name: Release the Route Nodes
    labels: {role: swamp}
    queueTimeout: 30
    writes: true
    guard: '!("Hold the Route Nodes" in steps)'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-hold-release" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_HOLD_REQUEST\" \"$ORBIT_HOLD_URL\" || true\n"
        env:
          ORBIT_HOLD_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/route-release" }}
          ORBIT_HOLD_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\"}" }}'
    dependsOn:
    - step: Install certs, publish
      condition:
        type: always
    - step: Hold the Route Nodes
      condition:
        type: always
    # From the candidate over the LAN: each Route workload answers with a chain the Orbit root trusts.
  - name: 'Probe the workloads'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Open LAN paths', condition: {type: always}}
    - {step: 'Install certs, publish', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: probe, in: '${{ inputs.intent.probes }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("cluster-router-probe-" + string(self.probe.from)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("cluster-router-probe-" + string(self.probe.from)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.nodes[string(self.probe.from)].user }}'
          port: '${{ inputs.intent.nodes[string(self.probe.from)].port }}'
          identityFile: '${{ inputs.intent.nodes[string(self.probe.from)].identity_file }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.nodes[string(self.probe.from)].host }}'
          transport: {hostKeys: '${{ inputs.intent.nodes[string(self.probe.from)].host_keys }}'}
      inputs:
        hosts: name:target
        argv: '${{ ["timeout", "20", "openssl", "s_client", "-connect", self.probe.address + ":443", "-servername", self.probe.domain, "-verify_hostname", self.probe.domain, "-verify_return_error", "-CAfile", "/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"] }}'
        timeoutSec: 30
    # Private DNS answers the Cluster names with the candidate, then the DNS grace (cluster-router-select).
  - name: 'Select the Router in DNS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Open LAN paths', condition: {type: always}}
    - {step: 'Install certs, publish', condition: {type: always}}
    - {step: 'Probe the workloads', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: select, in: '${{ inputs.intent.select }}'}
    task:
      type: workflow
      workflowIdOrName: cluster-router-select
      inputs:
        intent: '${{ inputs.intent }}'
    # The old Router's lasting Caddyfile, certificates and the LAN rules only it needed (route-target-retire).
  - name: Hold the Nodes to retire
    labels: {role: swamp}
    queueTimeout: 30
    writes: true
    guard: '${{ size(inputs.intent.retire_nodes) == 0 || steps.exists(k, steps[k].status == "failed") }}'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-hold-acquire-retire" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 30 --retry 20 --retry-all-errors --retry-delay 1 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_HOLD_REQUEST\" \"$ORBIT_HOLD_URL\"\n"
        env:
          ORBIT_HOLD_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/route-hold" }}
          ORBIT_HOLD_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\"}" }}'
    dependsOn:
    - step: Release the Route Nodes
      condition:
        type: always
    - step: Prepare the Router
      condition:
        type: always
    - step: Request the certificates
      condition:
        type: always
    - step: Sign the CSRs
      condition:
        type: always
    - step: Open LAN paths
      condition:
        type: always
    - step: Install certs, publish
      condition:
        type: always
    - step: Probe the workloads
      condition:
        type: always
    - step: Select the Router in DNS
      condition:
        type: always
  - name: 'Retire the old Router'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Open LAN paths', condition: {type: always}}
    - {step: 'Install certs, publish', condition: {type: always}}
    - {step: 'Probe the workloads', condition: {type: always}}
    - {step: 'Select the Router in DNS', condition: {type: always}}
    - {step: Hold the Nodes to retire, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-retire
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ run.id }}'
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSRs-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: {}
  - name: Release the retired Nodes
    labels: {role: swamp}
    queueTimeout: 30
    writes: true
    guard: '!("Hold the Nodes to retire" in steps)'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-hold-release-retire" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_HOLD_REQUEST\" \"$ORBIT_HOLD_URL\" || true\n"
        env:
          ORBIT_HOLD_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/route-release" }}
          ORBIT_HOLD_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\"}" }}'
    dependsOn:
    - step: Retire the old Router
      condition:
        type: always
    - step: Hold the Nodes to retire
      condition:
        type: always
    # Only when preparing or publishing failed: the before Caddy, LAN and DNS state (cluster-router-revert).
  - name: 'Restore the before state'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Prepare the Router', condition: {type: always}}
    - {step: 'Request the certificates', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Open LAN paths', condition: {type: always}}
    - {step: 'Install certs, publish', condition: {type: always}}
    - {step: 'Probe the workloads', condition: {type: always}}
    - {step: 'Select the Router in DNS', condition: {type: always}}
    - {step: 'Retire the old Router', condition: {type: always}}
    guard: '${{ !steps.exists(k, steps[k].status == "failed" && !k.startsWith("Retire the old Router") && !k.startsWith("Hold the Nodes to retire") && !k.startsWith("Release the retired Nodes")) }}'
    writes: true
    task:
      type: workflow
      workflowIdOrName: cluster-router-revert
      inputs:
        intent: '${{ inputs.intent }}'
