id: 89dc7dce-dbf3-4a01-9abe-81e6e40d949d
name: operation-task-vm-enroll
description: One native TaskVM enroll root; first visit precedes its exact trusted
  guest worker.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.enroll
  required:
  - operation_id
  - node_id
  - kind
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: &id001
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: intent
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
- name: bootstrap
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes.execution_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes.execution_node_id)
      }}
  steps:
  - name: bootstrap
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        stage: bootstrap
- name: project-bootstrap
  dependsOn:
  - job: bootstrap
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: project-bootstrap
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        projection: bootstrap
- name: prepare-network
  dependsOn:
  - job: project-bootstrap
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes.execution_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes.execution_node_id)
      }}
  steps:
  - name: prepare-network
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        stage: prepare-network
- name: project-network
  dependsOn:
  - job: prepare-network
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: project-network
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        projection: network
- name: publish-hub
  dependsOn:
  - job: project-network
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes._wireguard.executor_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes._wireguard.executor_node_id)
      }}
  steps:
  - name: publish-hub
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/node-wireguard-direct'
      behaviorName: ${{ "wireguard-hub-" + string(data.latest("task-vm-enrollment-" + run.id,
        "placement-" + run.id).attributes._wireguard.hub_id) }}
      methodName: publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        snapshot: ${{ data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes._wireguard }}
  - name: hub-published
    dependsOn:
    - step: publish-hub
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps["publish-hub"].outputs.status == "succeeded"
      message: TaskVM WireGuard Hub publication failed
      severity: high
- name: publish-network
  dependsOn:
  - job: publish-hub
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes.execution_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes.execution_node_id)
