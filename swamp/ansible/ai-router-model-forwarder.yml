---
# The container model forwarder on an agent Node (docs/cli/ai-router/model-forwarder.mmd, /reference/ai-router#container-model-forwarder):
# its own Caddy on the container bridge address at port 8319, which passes every request to the guard, its UFW rule on the bridge,
# and a UFW route deny to the guard, so a container reaches the guard only through the forwarder. It holds no key. The guard phase
# of the same run has already admitted the Node's WireGuard address, or dropped it.
# Tag `apply` puts the forwarder in place, tag `remove` takes it off. Both end with a check from the Node against the guard.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ (lookup('ansible.builtin.file', run ~ '/intent.json') | from_json).forwarder }}"
    address_target: "{{ intent.ssh.target }}"
    address_identity: "{{ intent.ssh.identity_file }}"
    address_group: forwarder_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Apply the forwarder
  hosts: forwarder_node
  become: true
  gather_facts: false
  tags: [apply]
  vars:
    intent: "{{ (lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json).forwarder }}"
  tasks:
    # Containers call the bridge address, so it must be the bridge's own: a wrong address would bind the forwarder elsewhere.
    - name: Read the addresses of the bridge
      ansible.builtin.command: { argv: [ip, -4, -o, addr, show, dev, "{{ intent.bridge }}"] }
      register: bridge_addresses
      changed_when: false
    - name: Check that the address belongs to the bridge
      ansible.builtin.assert:
        that: bridge_addresses.stdout is search(' inet ' ~ (intent.address | regex_escape) ~ '/')
        fail_msg: "{{ intent.address }} is not an address of {{ intent.bridge }}"
    - name: Make the folder of the forwarder
      ansible.builtin.file: { path: "{{ intent.directory }}", state: directory, owner: root, group: root, mode: "0755" }
    - name: Write the Caddyfile
      ansible.builtin.copy:
        dest: "{{ intent.directory }}/Caddyfile"
        content: "{{ intent.caddyfile }}"
        owner: root
        group: root
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      register: caddyfile
    # Its own Caddy, apart from the Node's Orbit-rendered one: a dynamic user, no admin endpoint, no saved config, no credential, and no
    # privilege: port 8319 needs none. Incus brings the bridge up; until then the bind fails and systemd restarts the unit.
    - name: Write the unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ intent.unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Orbit ai-router container model forwarder
          After=network-online.target wg-quick@orbit.service incus.service
          Wants=network-online.target

          [Service]
          DynamicUser=yes
          ExecStart=/usr/bin/caddy run --adapter caddyfile --config {{ intent.directory }}/Caddyfile
          Restart=always
          RestartSec=2
          StateDirectory=orbit-ai-router-forwarder
          Environment=XDG_DATA_HOME=/var/lib/orbit-ai-router-forwarder XDG_CONFIG_HOME=/var/lib/orbit-ai-router-forwarder
          CapabilityBoundingSet=
          AmbientCapabilities=
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectKernelLogs=true
          ProtectControlGroups=true
          ProtectClock=true
          ProtectHostname=true
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          RestrictNamespaces=true
          RestrictRealtime=true
          LockPersonality=true
          SystemCallArchitectures=native

          [Install]
          WantedBy=multi-user.target
      register: unit
    - name: Run the forwarder
      ansible.builtin.systemd_service:
        name: "{{ intent.unit }}"
        daemon_reload: "{{ unit.changed }}"
        enabled: true
        state: "{{ 'restarted' if (unit.changed or caddyfile.changed) else 'started' }}"
    - name: Wait for the forwarder
      ansible.builtin.wait_for: { host: "{{ intent.address }}", port: "{{ intent.origin | urlsplit('port') }}", timeout: 15 }
    - name: Place the UFW rules
      ansible.builtin.import_tasks: tasks/firewall.yml
      vars:
        firewall_commands: "{{ intent.firewall.desired + intent.firewall.remove }}"
    # Through the forwarder with no key: the guard answers 401 only to a source it admits, so this proves it admits the Node and still
    # demands the key. A source it refuses gets 403, and without the UFW allow the request is dropped and the forwarder answers 502.
    - name: Check that the guard admits the Node and demands the key
      ansible.builtin.uri:
        url: "{{ intent.origin }}/v1/responses"
        method: POST
        status_code: 401
        timeout: 10
        use_proxy: false

- name: Remove the forwarder
  hosts: forwarder_node
  become: true
  gather_facts: false
  tags: [remove]
  vars:
    intent: "{{ (lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json).forwarder }}"
  tasks:
    - name: Remove the UFW rules
      ansible.builtin.import_tasks: tasks/firewall.yml
      vars:
        firewall_commands: "{{ intent.firewall.desired + intent.firewall.remove }}"
    - name: Stop the forwarder
      ansible.builtin.systemd_service: { name: "{{ intent.unit }}", enabled: false, state: stopped }
      failed_when: false
    - name: Remove the unit and the folder of the forwarder
      ansible.builtin.file: { path: "{{ item }}", state: absent }
      loop: ["/etc/systemd/system/{{ intent.unit }}", "{{ intent.directory }}"]
    - name: Reload systemd
      ansible.builtin.systemd_service: { daemon_reload: true }
    # The guard phase dropped the Node's address, so the guard's UFW deny drops it. SSH to the router's Node answers first, so a silent
    # guard port means the deny, not a broken tunnel.
    - name: Check that the router's Node answers on SSH
      ansible.builtin.wait_for: { host: "{{ intent.guard_origin | urlsplit('hostname') }}", port: 22, timeout: 5 }
    - name: Check that the guard port does not answer the Node
      ansible.builtin.wait_for:
        host: "{{ intent.guard_origin | urlsplit('hostname') }}"
        port: "{{ intent.guard_origin | urlsplit('port') }}"
        state: stopped
        timeout: 5
