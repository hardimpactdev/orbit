---
# End the fault and put the real ufw back (steps.py remove_shim, which `fault: {clear: true}` and the end of every case call): end the lock if
# a holder runs, drop the state of the shim, and move ufw.real back to ufw. Safe to run when nothing was installed. A write that waits on the
# lock must have ended before this runs (busy-case.yml waits for it): a shim that wakes after ufw.real moved back has no program to call.
# `tcontainer` and `shim_dir` come from cases.yml and molecule.yml.
- name: "{{ inventory_hostname }}: end the lock of the holder, if there is one (its process group leads with its pid)"
  ansible.builtin.shell: kill -- -$(cat {{ shim_dir }}/holder.pid)
  delegate_to: "{{ tcontainer }}"
  changed_when: false
  failed_when: false

- name: "{{ inventory_hostname }}: drop the state of the shim"
  ansible.builtin.file:
    path: "{{ shim_dir }}"
    state: absent
  delegate_to: "{{ tcontainer }}"

- name: "{{ inventory_hostname }}: the real ufw takes its path back"
  ansible.builtin.command:
    cmd: mv -f /usr/sbin/ufw.real /usr/sbin/ufw
    removes: /usr/sbin/ufw.real
  delegate_to: "{{ tcontainer }}"
