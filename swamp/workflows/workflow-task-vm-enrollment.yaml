id: 46c86e06-0241-416c-987b-c195e0522990
name: task-vm-enrollment
description: Bootstrap and enroll one admitted provider guest using complete public SSH inputs.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.provision
      - tasks.provision
    intent:
      type: object
      properties:
        provider:
          type: string
          enum:
          - incus
          - upcloud
      required:
      - provider
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models|provider-bootstrap)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
    guest:
      type: object
    provider:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - guest
  - provider
  additionalProperties: false
jobs:
- name: enrollment
  labels: {role: swamp}
  steps:
  - name: provider-plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment-input'
      behaviorName: '${{ "vm-enrollment-plan" }}'
      methodName: plan
      inputs:
        provider: ${{ inputs.intent.provider }}
  - name: bootstrap-account-assets
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-bootstrap-command'
      behaviorName: '${{ "vm-bootstrap-input" }}'
      methodName: read
      inputs:
        action: account
        user: ${{ inputs.intent.user }}
        command: ${{ inputs.intent.bootstrap }}
        artifact:
          url: ${{ inputs.intent.agent_artifact_url }}
          sha256: ${{ inputs.intent.agent_sha256 }}
    dependsOn:
    - step: provider-plan
      condition:
        type: succeeded
  - name: bootstrap-account
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user
            }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port
            }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file
            }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host
            }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys
              }}'
      inputs:
        hosts: name:target
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name]
          + ["/usr/bin/python3","-B","-c",steps["bootstrap-account-assets"].outputs.script_body] : ["/usr/bin/python3","-B","-c",steps["bootstrap-account-assets"].outputs.script_body]
          }}'
        sudo: ${{ inputs.intent.provider != "incus" }}
    dependsOn:
    - step: bootstrap-account-assets
      condition:
        type: succeeded
  - name: bootstrap-authorized_key-assets
    labels: {role: swamp}
