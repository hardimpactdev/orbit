id: 2fb743f6-7bd7-4d0a-8a61-168d30da8a44
name: operation-database-server-destroy
description: Database server removal from 209, one docker command per official SSH step; the data volume stays.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database_server.destroy}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: server
  labels: {role: swamp}
  steps:
    # A container that is already gone counts as stopped and removed; the check below proves the end state.
  - name: 'Stop the container'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '90', docker, stop, --time, '60', '${{ inputs.intent.container }}']
        okExitCodes: [0, 1]
        timeoutSec: 100
  - name: 'Remove the container'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Stop the container', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', docker, rm, '${{ inputs.intent.container }}']
        okExitCodes: [0, 1]
        timeoutSec: 70
  - name: 'Check it is gone'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove the container', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-destroy-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', docker, container, inspect, --format, '{{.Id}}', '${{ inputs.intent.container }}']
        okExitCodes: [0, 1]
        timeoutSec: 40
  - name: 'Report the result'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Stop the container', condition: {type: always}}
    - {step: 'Remove the container', condition: {type: always}}
    - {step: 'Check it is gone', condition: {type: always}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: database-server-destroy-result
      methodName: execute
      inputs:
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          # docker inspect exits 1 for a missing container: that is the removed end state.
          if os.environ['GONE_EXIT'] == '1':
              result = {'backend': 'absent'}
          elif os.environ['GONE_STATUS'] == 'succeeded':
              result = {'failed_step': 'Check it is gone', 'error_code': 'database.server_remove_incomplete'}
          else:
              failed = next((label for label in ('Stop the container', 'Remove the container', 'Check it is gone') if os.environ[label.split()[0].upper() + '_STATUS'] == 'failed'), None)
              result = {'failed_step': failed, 'error_code': 'database.server_remove_failed'}
          print(json.dumps(result))
          sys.exit(0 if 'backend' in result else 1)
          PY
        env:
          STOP_STATUS: '${{ "Stop the container" in steps ? steps["Stop the container"].status : "skipped" }}'
          REMOVE_STATUS: '${{ "Remove the container" in steps ? steps["Remove the container"].status : "skipped" }}'
          CHECK_STATUS: '${{ "Check it is gone" in steps ? steps["Check it is gone"].status : "skipped" }}'
          GONE_STATUS: '${{ "Check it is gone" in steps ? steps["Check it is gone"].status : "skipped" }}'
          GONE_EXIT: '${{ "Check it is gone" in steps && steps["Check it is gone"].status == "succeeded" ? string(steps["Check it is gone"].outputs.exitCode) : "" }}'
        ignoreExitCode: true
  - name: 'Fail on an error'
    labels: {role: swamp}
    dependsOn: [{step: 'Report the result', condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Report the result"].outputs.exitCode == 0', severity: high, message: The Database server removal did not complete.}
