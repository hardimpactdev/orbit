            argv:
              - /usr/bin/rm
              - '-f'
              - '--'
              - '${{ "/tmp/orbit-transfer-" + run.id + ".install.tar" }}'
      - name: remove-local-archive
        target: orbit-node-209
        dependsOn:
          - step: remove-destination-archive
            condition:
              type: always
        guard: >-
          ${{ ! ("download" in steps) || steps["download"].status != "succeeded"
