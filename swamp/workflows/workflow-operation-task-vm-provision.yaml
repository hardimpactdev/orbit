          "ok": true, "output": {"hub_configured": true}, "error_code": null}] : [])
          + (has(steps.publish_network) && has(steps.publish_network.outputs) ? [steps.publish_network.outputs]
          : []) + (has(steps.issue_worker) && has(steps.issue_worker.outputs) ? [steps.issue_worker.outputs]
          : []) + (has(steps.configure_worker) && has(steps.configure_worker.outputs)
          ? [steps.configure_worker.outputs] : []) + (has(steps.worker_ready) && has(steps.worker_ready.outputs)
          ? [steps.worker_ready.outputs] : []) + (has(steps.issue_model) && has(steps.issue_model.outputs)
          ? [{"stage": "issue-model", "ok": true, "output": {"issued": steps.issue_model.outputs.issued},
          "error_code": null}] : []) }}'
  - name: prepare_runtime_ready
    guard: ${{ !steps.admit.outputs.active }}
    dependsOn:
    - step: prepare_runtime
      condition:
        type: succeeded
    task:
