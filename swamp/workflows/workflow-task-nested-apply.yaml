id: 36a4edad-7628-4889-9391-edfbf2d87b29
name: task-nested-apply
description: >-
  Put the current checkout and state in the nested fleet of a task VM and make the long-running services run it (the apply step of stage 2 of the command development pipeline): the state of the Gateway and app-dev on their own disks over the checkout (a disk device of the containers), the migrations, a restart of the queue worker, the scheduler and the agent-view subscriber. Each step is one command over official SSH to the task VM.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [tasks.provision, proof.run]}
    guest_node_id: {type: integer, minimum: 1}
    ssh_execution: {type: object}
    fleet: {type: object}
    club: {type: boolean}
    remint: {type: boolean}
  required: [guest_node_id, ssh_execution, fleet]
  additionalProperties: false
jobs:
- name: apply
  labels: {role: swamp}
  steps:
  # `.env`, `storage` and `bootstrap/cache` stay on each guest's own disk. The containers start with the checkout attached, so the units of the ready copies bind them at boot (systemd makes the missing mount point `.env`). This step checks each unit and starts none: in a container no udev confirms the device behind the checkout's mount, so a start job waits 90 s for it and fails.
  - name: 'Check the state'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-check-the-state" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: &vm {name: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-check-the-state" + "-" + self.role).split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh_execution.target.user }}', port: '${{ inputs.ssh_execution.target.port }}', identityFile: '${{ inputs.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ inputs.fleet.guests[self.role] }}', '--', 'sh', '-c', 'for u; do systemctl is-active --quiet "$u" || { echo "$u is not active" >&2; exit 1; }; done', 'sh', 'home-orbit-orbit-apps-gateway-.env.mount', 'home-orbit-orbit-apps-gateway-storage.mount', 'home-orbit-orbit-apps-gateway-bootstrap-cache.mount'], timeoutSec: 40}}
  # The nested Gateway reads the agent it gives its Nodes from `apps/agent/delivery/manifest.json`, an ignored file of the shared checkout,
  # so a checkout that a fleet from ready copies mounts has none. It is the checkout's pin, as on a released Gateway: the pin is a byte copy
  # of the published release manifest.
  - name: 'Place the agent delivery'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-place-the-agent-delivery").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-place-the-agent-delivery").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ inputs.fleet.guests.gateway }}', '--user', '1000', '--', 'install', '-D', '-m', '0444', '/home/orbit/orbit/apps/gateway/resources/agent/frozen-manifest.json', '/home/orbit/orbit/apps/agent/delivery/manifest.json'], timeoutSec: 40}}
    dependsOn: [{step: 'Check the state', condition: {type: succeeded}}]
  # A failed task writes its message to stderr, which the run records with the failed step.
  # The Swamp tokens of the nested Gateway are renewed from the mounted checkout, so the tokens of the ready copies never decide how long a fleet lives (play `remint` of `gateway-bootstrap.yml`, with the control plan the build left on the machine). Only a fleet that starts from ready copies needs it: a restore of `base` brings back tokens that were renewed before it.
  - name: 'Re-mint the Swamp tokens'
    labels: {role: swamp}
    writes: true
    guard: '${{ !(has(inputs.remint) && inputs.remint) }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-re-mint-the-swamp-tokens").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-re-mint-the-swamp-tokens").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '900', 'incus', 'exec', '${{ inputs.fleet.guests.gateway }}', '--', 'env', 'ANSIBLE_CONFIG=/home/orbit/orbit/swamp/ansible/ansible.cfg', 'ANSIBLE_DISPLAY_FAILED_STDERR=true', '/opt/orbit/ansible/venv/bin/ansible-playbook', '-i', 'localhost,', '-e', '@/opt/orbit/bootstrap/control.yml', '--tags', 'remint', '/home/orbit/orbit/swamp/ansible/gateway-bootstrap.yml'], timeoutSec: 910}}
    dependsOn: [{step: 'Place the agent delivery', condition: {type: succeeded}}]
  # The ready copies hold an older database; the checked-out code owns the schema.
  - name: 'Migrate'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-migrate").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-migrate").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', '${{ inputs.fleet.guests.gateway }}', '--user', '1000', '--cwd', '/home/orbit/orbit/apps/gateway', '--', 'php', 'artisan', 'migrate', '--force'], timeoutSec: 130}}
    dependsOn: [{step: 'Place the agent delivery', condition: {type: succeeded}}, {step: 'Re-mint the Swamp tokens', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  # The queue worker, the scheduler and the agent-view subscriber load their code once; they run the checked-out code after this.
  - name: 'Restart the services'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-restart-the-services").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-restart-the-services").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', '${{ inputs.fleet.guests.gateway }}', '--', 'systemctl', 'restart', 'orbit-gateway-horizon.service', 'orbit-gateway-schedule.service', 'orbit-agent-view.service'], timeoutSec: 130}}
    dependsOn: [{step: 'Migrate', condition: {type: succeeded}}]
  # The behavior name carries the index, not the unit name: Swamp opens an SSH control socket under /tmp/swamp-ssh/<name>, and the longest unit name made the path too long for a Unix socket (108 bytes).
  # One check per unit: `systemctl is-active` with several units succeeds when one of them is active. The nested Swamp serve and its workers need the proof Club key, so they are checked only when the VM has it.
  - name: 'Check the services'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["orbit-gateway-horizon.service", "orbit-gateway-schedule.service", "orbit-agent-view.service"] + (has(inputs.club) && inputs.club ? ["orbit-swamp-serve.service", "orbit-swamp-worker@a.service", "orbit-swamp-worker@b.service"] : []) }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-check-the-services" + "-" + string(self._index)).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-apply-" + string(inputs.guest_node_id) + "-check-the-services" + "-" + string(self._index)).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', '${{ inputs.fleet.guests.gateway }}', '--', 'systemctl', 'is-active', '--quiet', '${{ self.role }}'], timeoutSec: 130}}
    dependsOn: [{step: 'Restart the services', condition: {type: succeeded}}]
