id: 17bf7d13-d591-4dc7-a735-5396d311994f
name: operation-task-vm-image-refresh
description: >-
  Refresh the base of one task VM host (docs/cli/task/vm-image-refresh.mmd) from full inputs on 209: set up the egress log of the host bridge,
  make the host's base VM when it has none, start it,
  converge it as a task start would, stop it and snapshot it and its seed, prove the snapshot with one task start, and keep the newest two
  snapshots, then remove the host's leftovers. With `rebuild`, the run first deletes the base VM and its seed and builds the base from stock.
  The Gateway records the new snapshot. No step calls the Gateway.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.image_refresh}
    intent:
      type: object
      properties:
        host: {type: object}
        converge: {type: object}
        # Whether the converge needs the Pi server: only when the base's recipe is older than the release's.
        with_pi: {type: boolean}
        # The task start that proves the candidate in a free slot, and its release: their intents and vault key names.
        prove: {type: object}
      required: [host, converge, with_pi, prove]
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        club:
          type: object
          properties:
            vault: {type: string, enum: [orbit-control-inputs]}
            key: {type: string, pattern: ^swamp-proof-club-api-key$}
          required: [vault, key]
          additionalProperties: false
      required: [club]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
# The egress log of the host bridge (docs/reference/compute-drivers.md#log-task-vm-egress): log-only. Only a safety check of the part fails
# it (rules that do not load, a bridge with IPv6, an ACL that lost its drop rule); it runs before the base is touched, so a failure here
# leaves the base as it was and starts no rollback.
- name: egress
  labels: {role: swamp}
  steps:
  - name: Log egress
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ inputs.execution_secrets }}', tags: egress-log}
- name: refresh
  labels: {role: swamp}
  dependsOn: [{job: egress, condition: {type: succeeded}}]
  steps:
  - name: Start the base VM
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ inputs.execution_secrets }}', tags: base-start}
  # The same converge as a task start, with no wait for the nested Gateway and no identity wipe: the base VM never gets an identity.
  - name: Converge
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Start the base VM, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent.converge }}
        guest: ${{ inputs.intent.host.base.vm }}
        tags: software,tools,boot,checkout,fleet,check
        with_pi: ${{ inputs.intent.with_pi }}
  - name: Stop and snapshot
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Converge, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ inputs.execution_secrets }}', tags: base-snapshot}
  # Steps 2 to 4 of a task start from the new snapshot, in a free slot, then its release.
  - name: Prove the candidate
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Stop and snapshot, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-candidate-proof
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', prove: '${{ inputs.intent.prove }}'}
  - name: Prune old snapshots
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Prove the candidate, condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ inputs.execution_secrets }}', tags: base-prune}
# After a refresh that passed, what no current path makes goes from the host (TaskVmHostLeftovers). Its failure fails no refresh and rolls
# nothing back: the next refresh removes what is left.
- name: clean
  labels: {role: swamp}
  dependsOn: [{job: refresh, condition: {type: succeeded}}]
  steps:
  - name: Remove host leftovers
    labels: {role: swamp}
    writes: true
    allowFailure: true
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ inputs.execution_secrets }}', tags: host-clean}
# A failed refresh leaves the host as it was: the base VM is stopped and rolled back to the recorded snapshot, and the run's snapshot goes.
- name: discard
  labels: {role: swamp}
  dependsOn: [{job: refresh, condition: {type: failed}}]
  steps:
  - name: Roll the base VM back
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-host-phase
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}',
        execution_secrets: '${{ inputs.execution_secrets }}', tags: base-discard}
