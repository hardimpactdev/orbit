id: 2c943794-6f3b-4f27-8ac1-a06911a0f1ea
name: node-private-dns
description: Install the private DNS listener release, units, records and catalog with official cfgmgmt and prove the loaded catalog.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: private-dns
  labels: {role: swamp}
  steps:
    # The release folder and its app/ folders, parents first.
  - name: 'Create the release folders'
    labels: {role: swamp}
    writes: true
    forEach: {item: folder, in: '${{ inputs.intent.dns.directories }}'}
    concurrency: 4
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ "node-dns-folder-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs: {path: '${{ self.folder }}', ensure: present, owner: root, group: root, mode: '0755', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Write the release files'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Create the release folders', condition: {type: succeeded}}]
    forEach: {item: file, in: '${{ inputs.intent.dns.files }}'}
    concurrency: 4
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-dns-file-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs: {path: '${{ self.file.path }}', ensure: present, content: '${{ self.file.content }}', owner: root, group: root, mode: '0644',
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Test the release'
    labels: {role: swamp}
    dependsOn: [{step: 'Write the release files', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-dns-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "node-dns-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "30", "/usr/bin/php8.5", inputs.intent.dns.release + "/serve.php", "--self-test"] }}'
        timeoutSec: 40
  - name: 'Write the listener service'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Test the release', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-dns-private-dns-service-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {service: orbit-private-dns.service, unitFile: '${{ inputs.intent.dns.service }}', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Write the DNS records'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Write the listener service', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-dns-records-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: '/etc/dnsmasq.d/orbit-records.conf', ensure: present, content: '${{ inputs.intent.dns.records }}', owner: root, group: root, mode: '0644',
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Write the DNS catalog'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Write the DNS records', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "node-dns-catalog-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: '/var/lib/orbit/private-dns/catalog.json', ensure: present, content: '${{ inputs.intent.dns.catalog }}', owner: root, group: root, mode: '0644',
        nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Test dnsmasq'
    labels: {role: swamp}
    dependsOn: [{step: 'Write the DNS catalog', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-dns-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/sbin/dnsmasq, --test]
        timeoutSec: 40
  - name: 'Restart dnsmasq'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Test dnsmasq', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-dns-dnsmasq-service-" + string(inputs.node_id) }}
      methodName: restart
      globalArgs: {service: dnsmasq.service, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Start the DNS socket'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Restart dnsmasq', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-dns-private-dns-socket-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {service: orbit-private-dns.socket, unitFile: '${{ inputs.intent.dns.socket }}', enabled: true, ensure: running, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Restart the listener'
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: 'Start the DNS socket', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "node-dns-private-dns-service-" + string(inputs.node_id) }}
      methodName: restart
      globalArgs: {service: orbit-private-dns.service, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Query the listener'
    labels: {role: swamp}
    dependsOn: [{step: 'Restart the listener', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-dns-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60", "/usr/bin/dig", "@" + inputs.intent.dns.address, "-p", "53", "+time=1", "+tries=50", "orbit-probe.invalid"] }}'
        timeoutSec: 70
  - name: 'Check the loaded catalog'
    labels: {role: swamp}
    dependsOn: [{step: 'Query the listener', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-dns-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '20', /usr/bin/cat, /var/lib/orbit/private-dns/catalog.json.loaded]
        timeoutSec: 40
  - name: 'Prove the loaded catalog'
    labels: {role: swamp}
    dependsOn: [{step: 'Check the loaded catalog', condition: {type: succeeded}}]
    task: {type: assert, severity: high, message: The private DNS listener did not load the new catalog.,
      expr: 'steps["Check the loaded catalog"].outputs.stdout in [inputs.intent.dns.catalog_sha256, inputs.intent.dns.catalog_sha256 + "\n"]'}
