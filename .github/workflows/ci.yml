name: CI

on:
  pull_request:
  # A push to task-*-handoff is Orbit's handoff commit, which CI tests as it tests a pull request
  # (docs/reference/tasks.md#handoff-ci). No pull request has such a branch as head.
  push:
    branches: [main, 'task-*-handoff']
  # A nightly run on main tests every project in full and refreshes each Pest TIA graph, as a manual dispatch does.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual runs get a group per ref and commit, so a push never cancels a full run. Every other run groups
# by its ref. Main keeps its running run: a newer push replaces only the waiting one, so after a burst of merges the
# newest commit is tested next, and every main run tests every project in full. Any other ref, a pull request's merge
# ref or a handoff branch, keeps only its newest run, so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'
  # The one definition of the two kinds of run. A handoff push is Orbit's push of a task handoff commit to
  # task-*-handoff, never a manual run or another task-* branch. A change run tests a change before it merges: a pull
  # request or a handoff push, and every job treats both alike. Steps read these values. GitHub reads no env in a
  # job's `if` or `runs-on`, so the two jobs that decide there spell out CHANGE_RUN verbatim, and a test pins that.
  HANDOFF_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task-') && endsWith(github.ref, '-handoff') }}
  CHANGE_RUN: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task-') && endsWith(github.ref, '-handoff') }}

jobs:
  project:
    name: ${{ matrix.project.name }}
    # On a change run (env.CHANGE_RUN, spelled out) this Gateway job checks quality on any orbit-shard runner while
    # all shards run independently. A full run keeps one six-worker recording run on Sabre. Fork PRs never run
    # on self-hosted runners.
    runs-on: ${{ matrix.project.directory == 'apps/gateway' && vars.ORBIT_SABRE_RUNNER == 'true' && (!(github.event_name == 'pull_request' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task-') && endsWith(github.ref, '-handoff')) && fromJSON('["self-hosted", "sabre"]') || (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "orbit-shard"]')) || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: CLI
            directory: apps/cli
          - name: Docs
            directory: apps/docs
          - name: Gateway
            directory: apps/gateway
          - name: E2E
            directory: apps/e2e
          - name: PHP SDK
            directory: packages/php-sdk

    env:
      ORBIT_TIA_DIRECTORY: .orbit-tia

    defaults:
      run:
        working-directory: ${{ matrix.project.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          repository: ${{ github.repository }}

      # The recipe's exact PHP build (ADR 0216). A hosted runner installs it; Sabre only verifies it, because a job never
      # installs software on a self-hosted runner.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: pcov

      # Sabre's own node shim lives in a home directory the runner user cannot read. GitHub-hosted runners ship Node.
      - name: Set up Node
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Bun for package cache and generated merge tests
        id: bun
        if: matrix.project.directory == 'apps/gateway' || matrix.project.directory == 'apps/docs'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Restore Bun downloads
        if: (matrix.project.directory == 'apps/gateway' || matrix.project.directory == 'apps/docs') && (github.ref != 'refs/heads/main' || github.event_name == 'pull_request')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - name: Cache Bun downloads on main
        if: (matrix.project.directory == 'apps/gateway' || matrix.project.directory == 'apps/docs') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - name: Set up Homebrew
        if: matrix.project.directory == 'apps/gateway' && runner.environment == 'github-hosted'
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install Gateway system dependencies
        if: matrix.project.directory == 'apps/gateway' && runner.environment == 'github-hosted'
        timeout-minutes: 10
        env:
          # A mirror that stops answering fails the request after 30 seconds and is retried, instead of hanging the job.
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          id -u caddy >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Prepare application environment
        if: matrix.project.directory == 'apps/docs' || matrix.project.directory == 'apps/gateway' || matrix.project.directory == 'apps/e2e'
        run: cp .env.example .env

      - name: Install dependencies
        if: matrix.project.directory != 'apps/e2e'
        run: composer install --no-interaction --prefer-dist

      # The Docs merge proof needs Gateway route discovery, not its test or analysis tools.
      - name: Install generated merge proof dependencies
        if: matrix.project.directory == 'apps/docs'
        working-directory: .
        run: |
          (cd apps/gateway && cp .env.example .env && composer install --no-dev --no-interaction --prefer-dist)
          (cd apps/web && bun install --frozen-lockfile)

      - name: Install all project dependencies for E2E integration tests
        if: matrix.project.directory == 'apps/e2e'
        working-directory: .
        run: bin/bootstrap --dependencies-only

      - name: Validate Composer metadata
        run: composer validate --strict

      # A change run restores quality caches only from main and saves none.
      - name: Compute PHPStan result cache prefix
        id: orbit-phpstan-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-phpstan-php8.5-${{ matrix.project.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.project.directory), format('{0}/phpstan.neon', matrix.project.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore PHPStan result cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.project.directory }}/vendor/phpstan/cache/resultCache.php
          key: ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CHANGE_RUN != 'true' && format('{0}-{1}-', steps.orbit-phpstan-key.outputs.prefix, github.ref_name) || '' }}
            ${{ steps.orbit-phpstan-key.outputs.prefix }}-main-
            ${{ env.CHANGE_RUN != 'true' && format('orbit-phpstan-php8.5-{0}-', matrix.project.directory) || '' }}

      - name: Compute Pint cache prefix
        id: orbit-lint-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-lint-php8.5-${{ matrix.project.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.project.directory), format('{0}/pint.json', matrix.project.directory), format('{0}/rector.php', matrix.project.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore Pint cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.project.directory }}/vendor/pint.cache
          key: ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CHANGE_RUN != 'true' && format('{0}-{1}-', steps.orbit-lint-key.outputs.prefix, github.ref_name) || '' }}
            ${{ steps.orbit-lint-key.outputs.prefix }}-main-
            ${{ env.CHANGE_RUN != 'true' && format('orbit-lint-php8.5-{0}-', matrix.project.directory) || '' }}

      # docs/reference/implementation-loop.md: runner policy, not PATH, is the sudo boundary.
      - name: Require no sudo for ordinary Gateway tests
        id: gateway-no-sudo
        if: matrix.project.directory == 'apps/gateway'
        uses: ./.github/actions/no-sudo

      - name: Verify Gateway shard coverage
        if: matrix.project.directory == 'apps/gateway' && env.CHANGE_RUN == 'true'
        run: ../../bin/check-pest-shards

      - name: Run project quality checks
        run: composer check

      - name: Check classification fakes
        run: php ../../bin/check-classification-fakes tests

      - name: Save PHPStan result cache
        if: success() && env.CHANGE_RUN != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.project.directory }}/vendor/phpstan/cache/resultCache.php
          key: ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Save Pint cache
        if: success() && env.CHANGE_RUN != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.project.directory }}/vendor/pint.cache
          key: ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Run full PR test suite
        if: matrix.project.directory != 'apps/gateway' && env.CHANGE_RUN == 'true'
        run: vendor/bin/pest --parallel --no-tia --compact

      # An unknown event base validates the recipe too.
      - name: Verify Ubuntu recipe pins against the named snapshot
        if: matrix.project.directory == 'apps/gateway' && (github.event_name == 'pull_request' || github.event_name == 'push')
        env:
          RECIPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A handoff push compares with where its branch left main: its event base is the previous handoff, or none.
          if [ "$HANDOFF_PUSH" = true ]; then RECIPE_BASE=$(git merge-base origin/main HEAD); fi
          if [ -z "$RECIPE_BASE" ] || ! git diff --quiet "$RECIPE_BASE" HEAD -- resources/machine-software/recipe.json; then
            php artisan orbit:machine-recipe --validate-ubuntu --json --no-interaction
          fi

      # Full mode records the graph without using it to select tests, on every event but a change run.
      # Gateway's phpunit.xml excludes privileged; a CLI exclusion would disable TIA recording.
      - name: Run full test suite and refresh Pest TIA graph
        if: env.CHANGE_RUN != 'true'
        run: vendor/bin/pest --parallel --tia --fresh --compact

      - name: Run redaction cases without PCRE JIT
        if: always() && matrix.project.directory == 'apps/gateway' && steps.gateway-no-sudo.outcome == 'success'
        env:
          PCRE_JIT: '0'
        # --no-tia prevents Pest's restart from dropping ini options and TIA from selecting which tests run.
        run: php -d pcre.jit="$PCRE_JIT" vendor/bin/pest tests/Feature/Logs/RedactionCasesTest.php --parallel --passthru-php="-d pcre.jit=0" --no-tia

      # A full run records this commit in the graph.
      # Stage the same-run exports for the cache-ref publisher and the background main cache store.
      - name: Export main caches
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PROJECT: ${{ matrix.project.directory }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          graph = Path('.orbit-tia/graph.json')
          data = json.loads(graph.read_text())
          baseline = data['baselines']['main']
          if data.get('schema') != 1 or baseline.get('sha') != os.environ['GITHUB_SHA'] or not baseline.get('results'):
              raise SystemExit('The main graph must describe this tested commit.')
          tested = {result['file'] for result in baseline['results'].values()}
          if set(data['edges']) - tested:
              raise SystemExit('The main graph must have a result for every linked test file.')
          quality = {}
          Path('.orbit-tia/quality').mkdir(exist_ok=True)
          for tool, source in (('pint', 'vendor/pint.cache'), ('phpstan', 'vendor/phpstan/cache/resultCache.php')):
              if Path(source).is_file() and Path(source).stat().st_size:
                  shutil.copyfile(source, f'.orbit-tia/quality/{tool}')
                  quality[tool] = hashlib.sha256(Path(source).read_bytes()).hexdigest()
          files = ['composer.lock', 'tests/Pest.php', 'phpunit.xml', 'phpunit.xml.dist']
          manifest = {
              'schema': 2,
              'project': os.environ['PROJECT'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'configurations': {tool: hashlib.sha256(Path(config).read_bytes()).hexdigest()
                                 for tool, config in (('pint', 'pint.json'), ('phpstan', 'phpstan.neon')) if tool in quality},
              'graph_sha256': hashlib.sha256(graph.read_bytes()).hexdigest(),
              'inputs': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files if Path(name).is_file()},
              'php': subprocess.run(['php', '-r', 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;'],
                                    check=True, capture_output=True, text=True).stdout,
              'quality': quality,
          }
          Path('.orbit-tia/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Publish main caches
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-tia-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            ${{ matrix.project.directory }}/.orbit-tia/graph.json
            ${{ matrix.project.directory }}/.orbit-tia/manifest.json
            ${{ matrix.project.directory }}/.orbit-tia/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Change runs use the static stock shard matrix below as the only source of the shard count. Main keeps one recording run for a complete TIA graph.
  gateway-shards:
    name: Gateway shards
    # env.CHANGE_RUN, spelled out.
    if: github.event_name == 'pull_request' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task-') && endsWith(github.ref, '-handoff')
    # Sabre and the Beast/Shark containers carry orbit-shard. Fork PRs use hosted runners.
    runs-on: ${{ vars.ORBIT_SABRE_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "orbit-shard"]') || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # A shard container only verifies the recipe build; tools/ci-runners/setup.sh installs it.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: pcov

      - name: Set up Node
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Bun for package cache tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Sabre's PHP CLI sets this in 99-github-actions.ini, and the PHP action sets it on a hosted runner. The shard runner
      # containers keep their PHP CLI default, so the job sets it only for its own processes and Pest's workers.
      - name: Keep exception arguments in traces
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/php"
          echo 'zend.exception_ignore_args=0' > "$RUNNER_TEMP/php/99-orbit-ci.ini"
          echo "PHP_INI_SCAN_DIR=:$RUNNER_TEMP/php" >> "$GITHUB_ENV"

      - name: Set up Homebrew
        if: runner.environment == 'github-hosted'
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install Gateway system dependencies
        if: runner.environment == 'github-hosted'
        timeout-minutes: 10
        env:
          APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          id -u caddy >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist

      - name: Require no sudo for ordinary Gateway tests
        uses: ./.github/actions/no-sudo

      # Every shard reads the same committed tests/.pest/shards.json; no cache or runtime planner.
      - name: Run Gateway shard ${{ matrix.shard }}
        run: vendor/bin/pest --parallel --no-tia --exclude-group=privileged --shard=${{ matrix.shard }}/${{ strategy.job-total }} --compact

  privileged:
    name: Gateway privileged
    # Only a disposable hosted runner may run this group: passwordless sudo, never fleet-host root.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none
      # The tests need ACL tools and the caddy Unix identity, not the Caddy binary or a package manager.
      - name: Install privileged test prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends --yes acl
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
      - name: Install Gateway dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
      # Valkey tests pull their image on the first real docker run.
      - name: Run privileged tests
        env:
          ORBIT_TEST_DOCKER: '1'
        run: vendor/bin/pest --parallel --no-tia --group=privileged --fail-on-empty-test-suite --compact --colors=never

  # The programs that the Gateway runs on Nodes: shellcheck, ruff, and their direct tests (docs/reference/remote-programs.md).
  remote-programs:
    name: Remote programs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      # The recipe's exact PHP build (ADR 0216), as in every other PHP job.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install shellcheck and Python test tools
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends --yes shellcheck
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install --quiet ruff==0.17.0 -r apps/gateway/tests/Programs/requirements.txt
          echo "$RUNNER_TEMP/ruff/bin" >> "$GITHUB_PATH"
      - name: Refuse Gateway script growth
        env:
          NODE_SCRIPTS_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'HEAD^1' }}
        run: |
          pytest -n auto --dist=load -q tools/test_node_scripts_ratchet.py
          # A handoff push compares with where its branch left main: its event base is the previous handoff, or none.
          if [ "$HANDOFF_PUSH" = true ]; then NODE_SCRIPTS_BASE=$(git merge-base origin/main HEAD); fi
          bin/node-scripts-ratchet --base "$NODE_SCRIPTS_BASE"
      # ORBIT_TEST_DOCKER also starts Valkey from a bootstrapped ACL file in Docker.
      - name: Pull the current Valkey test image
        run: |
          docker pull valkey/valkey:8.1
          docker run --rm valkey/valkey:8.1 valkey-server --version
      - name: Lint and test the remote programs
        env:
          ORBIT_TEST_DOCKER: '1'
        run: bin/remote-programs-check

  api-reference:
    name: API reference
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The recipe's exact PHP build (ADR 0216), with PCOV loaded and disabled.
      - name: Set up PHP
        uses: ./.github/actions/php
        with:
          coverage: none

      - name: Reject App-domain names
        run: php bin/project-vocabulary

      - name: Check that every environment variable is documented
        run: php bin/env-docs

      - name: Check that the projects share their tooling baseline
        run: php bin/tooling-baseline
      - name: Check that every docs page is in the site navigation
        run: php bin/docs-nav

      - name: Install Gateway and CLI dependencies
        run: |
          for project in apps/gateway apps/cli; do
            (cd "$project" && { [ -e .env ] || [ ! -f .env.example ] || cp .env.example .env; } && composer install --no-interaction --prefer-dist)
          done

      - name: Check that the API reference matches the Gateway routes
        run: bin/docs-openapi --check

      - name: Check that the MCP tool manifest matches the API reference
        run: bin/mcp-tools --check

  web:
    name: Web
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Restore Bun downloads
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - name: Cache Bun downloads on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the API types match the API reference
        run: bun run types && git diff --exit-code src/api/schema.d.ts

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Install the test browsers
        run: bunx playwright install --with-deps --only-shell chromium webkit

      - name: Run unit and verification tests
        run: bun run test:unit

      - name: Run browser tests
        run: bun run test:browser

      # Open pages compare their build with version.json, so the published build must hold it beside index.html.
      - name: Build
        run: bun run build && test -s dist/index.html && test -s dist/version.json

      # Automatic Gateway releases (ADR 0201) install this build for the same commit, so the Gateway needs no Node or Bun.
      # Every run on main publishes it, a manual dispatch too, so each successful Required checks result on main has one.
      - name: Publish web build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  pi-server:
    name: Pi server
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: apps/pi-server

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Restore Bun downloads
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - name: Cache Bun downloads on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  agent:
    name: Rust agent
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # A handoff push needs main's history to find where its branch left main. A string, because 0 is falsy.
          fetch-depth: ${{ env.HANDOFF_PUSH == 'true' && '0' || '2' }}
      # A change run that changes neither the agent nor this workflow cannot change the agent build.
      # Pushes to main and manual runs always build it.
      - name: Detect agent changes
        id: changes
        working-directory: .
        run: |
          # A pull request's merge commit has main as its first parent; a handoff push compares with where its branch left main.
          base=HEAD^1
          if [ "$HANDOFF_PUSH" = true ]; then base=$(git merge-base origin/main HEAD); fi
          if [ "$CHANGE_RUN" != true ] || git diff --name-only "$base" HEAD | grep -qE '^(apps/agent/|\.github/workflows/ci\.yml$)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
            echo "The change does not touch apps/agent or ci.yml; skipping the agent build."
          fi
      - name: Install Rust toolchain
        if: steps.changes.outputs.agent == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: clippy,rustfmt
      - name: Restore Rust caches
        if: steps.changes.outputs.agent == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/agent
      - name: Install cross compiler
        if: steps.changes.outputs.agent == 'true'
        run: command -v cross >/dev/null || cargo install cross --locked
      - name: Check formatting
        if: steps.changes.outputs.agent == 'true'
        run: cargo fmt --all -- --check
      - name: Run clippy
        if: steps.changes.outputs.agent == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        if: steps.changes.outputs.agent == 'true'
        run: cargo test --locked
      - name: Build static x86_64 binary
        if: steps.changes.outputs.agent == 'true'
        run: cross build --locked --release --target x86_64-unknown-linux-musl
      - name: Build static aarch64 binary
        if: steps.changes.outputs.agent == 'true'
        run: cross build --locked --release --target aarch64-unknown-linux-musl

      # Keep this after the builds so a version bump can prove its binaries before tagging.
      # Always check delivery, including recipe-only pull requests that skip the Rust build.
      - name: Install Python test tools
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/agent-tests"
          "$RUNNER_TEMP/agent-tests/bin/pip" install --quiet -r apps/gateway/tests/Programs/requirements.txt
          echo "$RUNNER_TEMP/agent-tests/bin" >> "$GITHUB_PATH"
      - name: Check agent release delivery
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pytest -n auto --dist=load -q tools/test_check_agent_release.py
          python3 tools/check_agent_release.py

  desktop:
    name: Desktop app
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # A handoff push needs main's history to find where its branch left main. A string, because 0 is falsy.
          fetch-depth: ${{ env.HANDOFF_PUSH == 'true' && '0' || '2' }}
      # A change run that changes neither the desktop app nor this workflow cannot change its build.
      # Pushes to main and manual runs always check it.
      - name: Detect desktop changes
        id: changes
        working-directory: .
        run: |
          # A pull request's merge commit has main as its first parent; a handoff push compares with where its branch left main.
          base=HEAD^1
          if [ "$HANDOFF_PUSH" = true ]; then base=$(git merge-base origin/main HEAD); fi
          if [ "$CHANGE_RUN" != true ] || git diff --name-only "$base" HEAD | grep -qE '^(apps/desktop/|\.github/workflows/ci\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "The change does not touch apps/desktop or ci.yml; skipping the desktop checks."
          fi
      - name: Set up Bun
        id: bun
        if: steps.changes.outputs.desktop == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Restore Bun downloads
        if: steps.changes.outputs.desktop == 'true' && (github.ref != 'refs/heads/main' || github.event_name == 'pull_request')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
      - name: Cache Bun downloads on main
        if: steps.changes.outputs.desktop == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
      - name: Install dependencies
        if: steps.changes.outputs.desktop == 'true'
        run: bun install --frozen-lockfile
      # Tauri links WebKitGTK on Linux; https://v2.tauri.app/start/prerequisites/ lists these packages.
      - name: Install the Tauri system libraries
        if: steps.changes.outputs.desktop == 'true'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Install Rust toolchain
        if: steps.changes.outputs.desktop == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - name: Restore Rust caches
        if: steps.changes.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Check formatting
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Run clippy
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  publish-ci-cache:
    name: Publish CI cache ref
    needs: [required]
    # Required checks accepts skipped PR-only jobs; override the implicit success() for that needs chain.
    if: ${{ !cancelled() && needs.required.result == 'success' && github.repository == 'hardimpactdev/orbit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sandbox-tia-*-${{ github.sha }}
          path: ${{ runner.temp }}/ci-cache-exports
      - name: Publish immutable tested-SHA ref and prune old cache refs
        run: python3 bin/ci-cache-ref publish --commit "$GITHUB_SHA" --exports "$RUNNER_TEMP/ci-cache-exports"

  required:
    name: Required checks
    if: always()
    needs: [project, gateway-shards, privileged, remote-programs, api-reference, web, pi-server, agent, desktop]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every project to pass
        env:
          PROJECT_RESULT: ${{ needs.project.result }}
          GATEWAY_SHARDS_RESULT: ${{ needs.gateway-shards.result }}
          PRIVILEGED_RESULT: ${{ needs.privileged.result }}
          REMOTE_PROGRAMS_RESULT: ${{ needs.remote-programs.result }}
          API_REFERENCE_RESULT: ${{ needs.api-reference.result }}
          WEB_RESULT: ${{ needs.web.result }}
          PI_SERVER_RESULT: ${{ needs.pi-server.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$PROJECT_RESULT" = success && test "$PRIVILEGED_RESULT" = success && test "$REMOTE_PROGRAMS_RESULT" = success && test "$API_REFERENCE_RESULT" = success && test "$WEB_RESULT" = success && test "$PI_SERVER_RESULT" = success && test "$AGENT_RESULT" = success && test "$DESKTOP_RESULT" = success && {
            if [ "$CHANGE_RUN" = true ]; then
              test "$GATEWAY_SHARDS_RESULT" = success
            else
              test "$GATEWAY_SHARDS_RESULT" = skipped
            fi
          }
