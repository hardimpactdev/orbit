---
# Internal workspace phases. Only this trusted program runs in the guest, as agent.
# Git snapshots and bounded receipts have no built-in Ansible module.
- name: Validate the recorded workspace target
  ansible.builtin.assert:
    that:
      - intent.runtime is defined
      - intent.runtime.project | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
      - intent.runtime.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
      - intent.snapshot_id | default('') is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
      - intent.branch | default('') | length > 0
      - workspace_phase in workspace_check_phases or intent.head | default('') is match('^[0-9a-f]{40}([0-9a-f]{24})?$')
      - workspace_phase in ['preflight', 'before', 'after', 'receipt', 'export', 'discard'] + workspace_check_phases
      - workspace_phase not in ['check', 'commit'] or intent.check | default(none) is mapping
      - workspace_phase != 'commit-ref' or intent.candidate_commit | default('') | length in [40, 64]
      # A publication's content check also takes the copy's .env, by its path under the fixed workspace root.
      - intent.worker_environment is not defined or (intent.environment_path | default('') is match('^[^/]')
        and '..' not in intent.environment_path.split('/'))
    fail_msg: tasks.workspace_target_invalid
  vars:
    workspace_check_phases: [check, commit, commit-ref]

- name: Name the guest boundary
  ansible.builtin.set_fact:
    workspace_exec: >-
      {{ ['incus', '--project', intent.runtime.project, 'exec', '--disable-stdin', '--cwd', '/srv/workspace',
          intent.runtime.name, '--', '/usr/sbin/runuser', '-u', 'agent', '--', '/usr/bin/env', '-i', 'HOME=/home/agent',
          'PATH=/usr/local/bin:/usr/bin:/bin', '/usr/bin/python3', '-I', '-c'] }}
    workspace_guest_program: |
      # The gap: Git has no module for temporary-index evidence or bound receipts.
      # This program is visible in the Ansible phase and runs only as agent, never on the Node.
      import hashlib
      import json
      import os
      import stat
      import subprocess
      import sys
      import tempfile
      from pathlib import Path

      os.umask(0o077)
      request = json.loads(sys.argv[2])
      phase = sys.argv[1]
      root = Path.cwd()
      scratch = Path('/tmp/orbit-task-workspace-' + request['snapshot_id'])
      env = {'HOME': '/home/agent', 'PATH': '/usr/local/bin:/usr/bin:/bin',
             'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_CONFIG_NOSYSTEM': '1', 'GIT_TERMINAL_PROMPT': '0'}
      git_argv = ['/usr/bin/git', '--literal-pathspecs', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false',
                  '-c', 'core.untrackedCache=false', '-c', 'core.quotePath=false', '-c', 'safe.directory=' + str(root)]


      def refuse(code):
          raise ValueError('tasks.workspace_' + code)


      def git(*args, index=None, data=None):
          local_env = {**env, **({'GIT_INDEX_FILE': str(index)} if index else {})}
          return subprocess.run(git_argv + list(args), input=data, capture_output=True,
                                env=local_env, check=True, timeout=60).stdout


      def text(*args):
          return git(*args).decode().strip()


      def digest(value):
          return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()


      def read(name):
          with (scratch / name).open() as stream:
              return json.load(stream)


      def write(name, value):
          # Immutable evidence: never recapture a snapshot after a replay or replace the original.
          with (scratch / name).open('x') as stream:
              json.dump(value, stream, sort_keys=True)


      def capture():
          descriptor, path = tempfile.mkstemp(prefix='index-', dir=scratch)
          os.close(descriptor)
          index = Path(path)
          try:
              index.unlink()
              real_index = Path(text('rev-parse', '--git-path', 'index'))
              raw = real_index.read_bytes() if real_index.exists() else b''
              if raw:
                  index.write_bytes(raw)
              else:
                  git('read-tree', '--empty', index=index)
              index_tree = git('write-tree', index=index).decode().strip()
              # Seed from the real index so force-added ignored paths remain tracked.
              git('add', '--all', '--', '.', index=index)
              tree = git('write-tree', index=index).decode().strip()
              return {'head': text('rev-parse', 'HEAD'), 'tree': tree, 'index_tree': index_tree,
                      'index_sha256': hashlib.sha256(raw).hexdigest()}
          finally:
              index.unlink(missing_ok=True)
              Path(str(index) + '.lock').unlink(missing_ok=True)


      def check_env(check):
          # The task check variables of every Project command, with the agent's own HOME and login shell.
          values = {'HOME': '/home/agent', 'USER': 'agent', 'LOGNAME': 'agent', 'PATH': env['PATH'],
                    'COMPOSER_NO_INTERACTION': '1', 'ORBIT_CHECK_PROCESSES': '1',
                    'COMPOSER_CACHE_DIR': '/home/agent/.cache/composer', 'ORBIT_SEED_PATH': '', 'ORBIT_SEED_COMMIT': ''}
          if check['ssr_port'] is not None:
              values.update({'INERTIA_SSR_PORT': str(check['ssr_port']),
                             'INERTIA_SSR_URL': 'http://127.0.0.1:' + str(check['ssr_port'])})
          return values


      def within(base, directory):
          return base if directory in ['', '.'] else base / directory


      def check_phase(check):
          import shutil
          if scratch.exists():
              # A resumed check starts again; this directory holds only this admitted check's scratch.
              shutil.rmtree(scratch)
          scratch.mkdir(mode=0o700)
          outputs = scratch / 'output'
          outputs.mkdir(mode=0o700)
          steps, names = {}, []
          command_env = check_env(check)

          def record(name, code, stdout=None):
              steps[name] = {'outputs': {'exitCode': code, **({} if stdout is None else {'stdout': stdout})}}

          def captured(name, directory, source, limit):
              # Output goes to a private guest file, never to Ansible or native history.
              names.append(name)
              with (outputs / name).open('xb') as stream:
                  process = subprocess.Popen(['/bin/bash', '-lc', source], cwd=directory, env=command_env,
                                             stdin=subprocess.DEVNULL, stdout=stream, stderr=subprocess.STDOUT,
                                             start_new_session=True)
                  try:
                      code = process.wait(timeout=limit)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, 9)
                      process.wait()
                      refuse('phase_failed')
              record(name, code)
              return code

          def tool(argv, directory, limit=600, ok=False):
              done = subprocess.run(argv, cwd=directory, env=env, stdin=subprocess.DEVNULL, capture_output=True,
                                    timeout=limit, check=False)
              if not ok and done.returncode != 0:
                  refuse('phase_failed')
              return done.returncode

          record('original', 0, text('rev-parse', 'HEAD') + '\n')
          setup_passed = True
          for index, step in enumerate(check['setup']):
              if captured(f'setup-{index}', root, step['command'], step['timeout_seconds']) != 0:
                  setup_passed = False
                  break
          project = 0
          if setup_passed and check['command'] is not None:
              project = captured('project', root, check['command'], 3600)
          before = capture()
          record('snapshot-before-head', 0, before['head'] + '\n')
          record('snapshot-before-tree', 0, before['tree'] + '\n')
          if check['base'] != '':
              record('diff', 0, git('diff-tree', '-r', '--no-renames', '--name-status', '-z', check['base'],
                                    before['tree']).decode(errors='replace'))
          runnable = setup_passed and project == 0
          commands = [item for item in check['deliverables'] if item['type'] == 'command']
          for index, item in enumerate(commands):
              directory = item.get('directory', '.')
              if runnable and item.get('fails_on_base', False):
                  tree = scratch / f'base-{index}'
                  archive = scratch / f'base-{index}.tar'
                  git('archive', '--format=tar', f'--prefix=base-{index}/', '--output=' + str(archive), check['base'])
                  tool(['tar', '-x', '-f', str(archive), '-C', str(scratch)], root)
                  tool(['find', '.', '-name', '.git', '-prune', '-o', '(', '-name', 'vendor', '-o', '-name', 'node_modules', ')',
                        '-type', 'd', '-prune', '-exec', 'cp', '-a', '--parents', '-t', str(tree), '{}', '+'], root)
                  paths = item.get('paths', [])
                  overlay = tool(['cp', '-p', '--parents', '-t', str(tree), '--', *paths], root, ok=True) if paths else 0
                  record(f'base_overlay-{index}', overlay)
                  if overlay == 0:
                      present = 0 if within(tree, directory).is_dir() else 1
                      record(f'base_directory-{index}', present)
                      if present == 0:
                          captured(f'base-{index}', within(tree, directory), item['command'], 600)
              if runnable:
                  captured(f'deliverable-{index}', within(root, directory), item['command'], 3600)
          after = capture()
          record('snapshot-after-head', 0, after['head'] + '\n')
          record('snapshot-after-tree', 0, after['tree'] + '\n')
          record('changed', 0, git('diff-tree', '-r', '--no-renames', '--name-status', '-z', before['tree'],
                                   after['tree']).decode(errors='replace'))
          for path in scratch.iterdir():
              if path != outputs:
                  shutil.rmtree(path) if path.is_dir() and not path.is_symlink() else path.unlink()
          return {'check': {'steps': steps}, 'outputs': names, 'changed': False}


      def commit_phase(check):
          identity = {'GIT_AUTHOR_NAME': 'Orbit', 'GIT_AUTHOR_EMAIL': 'orbit@users.noreply.github.com',
                      'GIT_COMMITTER_NAME': 'Orbit', 'GIT_COMMITTER_EMAIL': 'orbit@users.noreply.github.com'}
          git('add', '--all')
          subprocess.run(git_argv + ['-c', 'commit.gpgSign=false', 'commit', '--allow-empty', '--allow-empty-message',
                                     '--cleanup=verbatim', '--quiet', '--file=-'], input=check['message'].encode(),
                         capture_output=True, env={**env, **identity}, check=True, timeout=60)
          read = subprocess.run(git_argv + ['rev-parse', 'HEAD', 'HEAD^{tree}', 'HEAD^'], capture_output=True,
                                env=env, check=False, timeout=60)
          return {'commit_read': {'exitCode': read.returncode, 'stdout': read.stdout.decode(errors='replace')},
                  'changed': True}


      def candidate_matches(before):
          if request.get('candidate') != {'head': before['head'], 'tree': before['tree']}:
              refuse('snapshot_mismatch')


      def main():
          if phase == 'check-cleanup':
              import shutil
              shutil.rmtree(scratch, ignore_errors=True)
              return {'changed': False}
          git_dir = Path(text('rev-parse', '--absolute-git-dir'))
          if Path(text('rev-parse', '--show-toplevel')).resolve() != root.resolve():
              refuse('identity_changed')
          root_stat, git_stat = root.stat(), git_dir.stat()
          identity = {'root_device': root_stat.st_dev, 'root_inode': root_stat.st_ino,
                      'git_device': git_stat.st_dev, 'git_inode': git_stat.st_ino,
                      'branch': text('symbolic-ref', '--quiet', '--short', 'HEAD')}
          if identity['branch'] != request['branch']:
              refuse('identity_changed')
          head = text('rev-parse', 'HEAD')
          # Check phases are bound by the fixed root and recorded branch; the admitted checkout_path is never used.
          if phase == 'check':
              return check_phase(request['check'])
          if phase == 'commit':
              return commit_phase(request['check'])
          if phase == 'commit-ref':
              ref = 'refs/orbit/check-operations/' + str(int(request['operation_id']))
              git('update-ref', ref, request['candidate_commit'])
              return {'ref': ref, 'commit': text('rev-parse', ref), 'changed': True}
          if phase == 'preflight':
              if head != request['head']:
                  refuse('identity_changed')
              return {'checkout_fingerprint': identity, 'head': head, 'branch': identity['branch'], 'changed': False}
          if request.get('checkout_fingerprint') != identity:
              refuse('identity_changed')
          binding = {'runtime': request['runtime'], 'snapshot_id': request['snapshot_id'], 'checkout_fingerprint': identity}
          if scratch.exists():
              if read('binding.json') != binding:
                  refuse('snapshot_mismatch')
          elif phase not in ['discard', 'export-cleanup']:
              scratch.mkdir(mode=0o700)
              write('binding.json', binding)
          if phase == 'discard':
              if scratch.exists():
                  # This directory contains only our own scratch, never the checkout or a user-selected path.
                  import shutil
                  shutil.rmtree(scratch)
              return {'discarded': True, 'changed': False}
          if phase in ['export', 'export-cleanup']:
              bundle = scratch / 'export.bundle'
              if phase == 'export-cleanup':
                  bundle.unlink(missing_ok=True)
                  return {'changed': False}
              bundle.unlink(missing_ok=True)
              candidate = request.get('candidate', {})
              if candidate != {'head': head, 'tree': text('rev-parse', 'HEAD^{tree}')}:
                  refuse('snapshot_mismatch')
              try:
                  git('bundle', 'create', str(bundle), 'refs/heads/' + request['branch'])
                  git('bundle', 'verify', str(bundle))
                  expected = (candidate['head'] + ' refs/heads/' + request['branch'] + '\n').encode()
                  if git('bundle', 'list-heads', str(bundle)) != expected:
                      refuse('snapshot_mismatch')
                  with bundle.open('rb') as stream:
                      checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              except (OSError, ValueError, subprocess.SubprocessError):
                  bundle.unlink(missing_ok=True)
                  raise
              return {'head': head, 'tree': candidate['tree'], 'guest_bundle': str(bundle), 'sha256': checksum, 'changed': False}
          if phase == 'before':
              if head != request['head']:
                  refuse('identity_changed')
              if not (scratch / 'before.json').exists():
                  write('before.json', {**binding, **capture()})
              original = read('before.json')
              if any(original.get(key) != value for key, value in binding.items()):
                  refuse('snapshot_mismatch')
              return {**original, 'digest': digest(original), 'changed': False}
          before = read('before.json')
          if any(before.get(key) != value for key, value in binding.items()) or request.get('before_digest') != digest(before):
              refuse('snapshot_mismatch')
          if phase == 'after':
              if not (scratch / 'after.json').exists():
                  write('after.json', {**binding, 'before_digest': digest(before), **capture()})
              after = read('after.json')
              if any(after.get(key) != value for key, value in binding.items()) or after['before_digest'] != digest(before):
                  refuse('snapshot_mismatch')
              return {**after, 'digest': digest(after), 'changed': False}
          candidate_matches(before)
          if phase == 'receipt':
              try:
                  descriptor = os.open(scratch / 'receipt.json', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, 'rb') as stream:
                      if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                          refuse('receipt_invalid')
                      raw = stream.read(65537)
                  if len(raw) > 65536:
                      refuse('receipt_invalid')
                  envelope = json.loads(raw.decode('utf-8'))
                  if (envelope['snapshot_id'] != request['snapshot_id'] or envelope['candidate'] != request['candidate']
                          or not isinstance(envelope['receipt'], dict)):
                      refuse('receipt_invalid')
                  return {'receipt': envelope['receipt'], 'bytes': len(raw), 'changed': False}
              except (OSError, ValueError, KeyError, TypeError):
                  refuse('receipt_invalid')


      try:
          print(json.dumps(main()))
      except (OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError) as error:
          code = str(error)
          print(json.dumps({'error_code': code if code.startswith('tasks.workspace_') and '\n' not in code
                            else 'tasks.workspace_phase_failed'}))
          sys.exit(1)

- name: Run the workspace phase as agent
  ansible.builtin.command:
    argv: "{{ workspace_exec + [workspace_guest_program, workspace_phase, intent | to_json] }}"
    expand_argument_vars: false
    stdin: ''
    stdin_add_newline: false
  register: workspace_guest
  changed_when: (workspace_guest.stdout | from_json).changed | default(false)
  failed_when: false
  no_log: true

- name: Remove the failed check scratch as agent
  when: workspace_phase == 'check' and workspace_guest.rc != 0
  ansible.builtin.command:
    argv: "{{ workspace_exec + [workspace_guest_program, 'check-cleanup', intent | to_json] }}"
    expand_argument_vars: false
    stdin: ''
    stdin_add_newline: false
  changed_when: false
  failed_when: false
  no_log: true

- name: Check the workspace phase
  ansible.builtin.assert:
    that: workspace_guest.rc == 0
    fail_msg: "{{ (workspace_guest.stdout | from_json).error_code | default('tasks.workspace_phase_failed') }}"

- name: Keep the workspace evidence
  ansible.builtin.set_fact:
    workspace_result: "{{ workspace_guest.stdout | from_json }}"
  no_log: true

- name: Export only the verified branch bundle
  when: workspace_phase == 'export'
  block:
    - name: Create Node-controlled export scratch
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: orbit-task-export-
      register: workspace_export
      changed_when: false
    - name: Copy the agent's bundle to the Node
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull,
               "{{ intent.runtime.name }}{{ workspace_result.guest_bundle }}", "{{ workspace_export.path }}/branch.bundle"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: false
    - name: Check the transferred bytes on the Node
      ansible.builtin.stat:
        path: "{{ workspace_export.path }}/branch.bundle"
        checksum_algorithm: sha256
      register: workspace_bundle_stat
    - name: Verify the transferred bundle checksum
      ansible.builtin.assert:
        that: workspace_bundle_stat.stat.checksum == workspace_result.sha256
        fail_msg: tasks.workspace_phase_failed
    # The publish checks the candidate against the copy's .env on the worker. Its bytes never enter a result or a log.
    - name: Copy the copy's .env to the Node
      when: intent.worker_environment is defined
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull,
               "{{ intent.runtime.name }}/srv/workspace/{{ intent.environment_path }}", "{{ workspace_export.path }}/environment"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: false
    - name: Read the copied .env on the Node
      when: intent.worker_environment is defined
      ansible.builtin.stat:
        path: "{{ workspace_export.path }}/environment"
        follow: false
        get_checksum: false
      register: workspace_environment_stat
    - name: Require a regular .env file
      when: intent.worker_environment is defined
      ansible.builtin.assert:
        that: workspace_environment_stat.stat.isreg | default(false)
        fail_msg: tasks.publish_secret_unchecked
    - name: Fetch the .env to the worker
      when: intent.worker_environment is defined
      ansible.builtin.fetch:
        src: "{{ workspace_export.path }}/environment"
        dest: "{{ intent.worker_environment }}"
        flat: true
        fail_on_missing: true
        validate_checksum: true
      changed_when: false
      no_log: true
    - name: Return the Node export path
      when: intent.worker_bundle is not defined
      ansible.builtin.set_fact:
        workspace_result: >-
          {{ workspace_result | combine({'node_scratch': workspace_export.path, 'bundle': workspace_export.path ~ '/branch.bundle'}) }}
    # A publication takes the bundle to the worker, which pushes it; the Node keeps nothing.
    - name: Fetch the bundle to the worker
      when: intent.worker_bundle is defined
      ansible.builtin.fetch:
        src: "{{ workspace_export.path }}/branch.bundle"
        dest: "{{ intent.worker_bundle }}"
        flat: true
        fail_on_missing: true
        validate_checksum: true
      changed_when: false
    - name: Remove the Node export after the fetch
      when: intent.worker_bundle is defined
      ansible.builtin.file: { path: "{{ workspace_export.path }}", state: absent }
      changed_when: false
    - name: Return the worker bundle path
      when: intent.worker_bundle is defined
      ansible.builtin.set_fact:
        workspace_result: "{{ workspace_result | combine({'bundle': intent.worker_bundle}) }}"
  rescue:
    - name: Remove the incomplete Node export
      when: workspace_export.path is defined
      ansible.builtin.file:
        path: "{{ workspace_export.path }}"
        state: absent
      changed_when: false
    - name: Refuse the incomplete export
      ansible.builtin.fail:
        msg: tasks.workspace_phase_failed
  always:
    - name: Remove only the guest export bundle as agent
      ansible.builtin.command:
        argv: "{{ workspace_exec + [workspace_guest_program, 'export-cleanup', intent | to_json] }}"
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: workspace_export_cleanup
      changed_when: false
      failed_when: false
      no_log: true
    - name: Remove the Node export when guest cleanup fails
      when:
        - workspace_export.path is defined
        - workspace_export_cleanup.rc | default(1) != 0
      ansible.builtin.file:
        path: "{{ workspace_export.path }}"
        state: absent
      changed_when: false
    - name: Require guest export cleanup before handing off Node scratch
      ansible.builtin.assert:
        that: workspace_export_cleanup.rc | default(1) == 0
        fail_msg: tasks.workspace_phase_failed

- name: Collect the check output in the private run folder
  when: workspace_phase == 'check'
  block:
    - name: Create Node-controlled output scratch
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: orbit-task-check-
      register: workspace_check_scratch
      changed_when: false
    - name: Copy the agent's output folder to the Node
      ansible.builtin.command:
        argv: [incus, --project, "{{ intent.runtime.project }}", file, pull, --recursive,
               "{{ intent.runtime.name }}/tmp/orbit-task-workspace-{{ intent.snapshot_id }}/output", "{{ workspace_check_scratch.path }}"]
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      changed_when: false
    - name: Fetch each command output to the worker
      ansible.builtin.fetch:
        src: "{{ workspace_check_scratch.path }}/output/{{ item }}"
        dest: "{{ workspace_result_path | dirname }}/output/{{ item }}"
        flat: true
        fail_on_missing: true
      loop: "{{ workspace_result.outputs }}"
      changed_when: false
      no_log: true
    - name: Keep only exit codes and Git evidence
      ansible.builtin.set_fact:
        workspace_result: "{{ {'check': workspace_result.check, 'changed': false} }}"
      no_log: true
  rescue:
    - name: Refuse the incomplete check output
      ansible.builtin.fail:
        msg: tasks.workspace_phase_failed
  always:
    - name: Remove the Node output scratch
      when: workspace_check_scratch.path is defined
      ansible.builtin.file:
        path: "{{ workspace_check_scratch.path }}"
        state: absent
      changed_when: false
    - name: Remove the check scratch as agent
      ansible.builtin.command:
        argv: "{{ workspace_exec + [workspace_guest_program, 'check-cleanup', intent | to_json] }}"
        expand_argument_vars: false
        stdin: ''
        stdin_add_newline: false
      register: workspace_check_cleanup
      changed_when: false
      failed_when: false
      no_log: true
    - name: Require guest check cleanup
      ansible.builtin.assert:
        that: workspace_check_cleanup.rc | default(1) == 0
        fail_msg: tasks.workspace_phase_failed

- name: Record the private workspace result
  ansible.builtin.copy:
    content: "{{ workspace_result | to_json }}"
    dest: "{{ workspace_result_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
