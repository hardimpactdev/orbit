id: dd1ccba6-5339-44da-8040-616a905706a4
name: operation-task-publish
description: Publish the admitted checked commit in the chart's six steps; task VM work is official SSH exec argv, 209 work is inline git and gh api.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: tasks.publish}
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-publish-token-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: publish
  labels: {role: swamp}
  steps:
  - name: Check the workspace
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-publication-check
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        scratch: ${{ "/tmp/orbit-task-publish-" + run.id }}
  - name: Export the commit
    labels: {role: swamp}
    guard: ${{ !steps["Check the workspace"].outputs.verify.admitted }}
    task:
      type: workflow
      workflowIdOrName: task-publication-export
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        scratch: ${{ "/tmp/orbit-task-publish-" + run.id }}
    dependsOn:
    - step: Check the workspace
      condition:
        type: always
  - name: Import into a bare repo
    labels: {role: swamp}
    guard: ${{ !steps["Check the workspace"].outputs.verify.admitted }}
    task:
      type: workflow
      workflowIdOrName: task-publication-import
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        scratch: ${{ "/tmp/orbit-task-publish-" + run.id }}
        prepared: ${{ steps["Check the workspace"].outputs.prepare }}
    dependsOn:
    - step: Check the workspace
      condition:
        type: always
    - step: Export the commit
      condition:
        type: always
  - name: Push the branch
    labels: {role: swamp}
    guard: '${{ !("Import into a bare repo" in steps && steps["Import into a bare repo"].outputs.import_result.imported) }}'
    task:
      type: workflow
      workflowIdOrName: task-publication-push
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        scratch: ${{ "/tmp/orbit-task-publish-" + run.id }}
        prepared: ${{ steps["Check the workspace"].outputs.prepare }}
    dependsOn:
    - step: Check the workspace
      condition:
        type: always
    - step: Export the commit
      condition:
        type: always
    - step: Import into a bare repo
      condition:
        type: always
  - name: Open or update the PR
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-publication-pull-request
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        scratch: ${{ "/tmp/orbit-task-publish-" + run.id }}
        prepared: ${{ steps["Check the workspace"].outputs.prepare }}
        pushed: '${{ ("Push the branch" in steps && steps["Push the branch"].outputs.push_result.pushed) }}'
        observed: ${{ steps }}
    dependsOn:
    - step: Check the workspace
      condition:
        type: always
    - step: Export the commit
      condition:
        type: always
    - step: Import into a bare repo
      condition:
        type: always
    - step: Push the branch
      condition:
        type: always
  - name: Revoke the token
    labels: {role: swamp}
    # Revokes the token, removes the 209 scratch files, prints the receipt and fails on its error code.
    # A failed step keeps no stdout, so the Gateway then reads the receipt from the PR step.
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-publication-revoke" }}'
      methodName: execute
      inputs:
        run: |
          gh api --method DELETE installation/token >/dev/null 2>&1 || printf 'token revoke failed; it expires within one hour\n' >&2
          rm -rf -- "$ORBIT_SCRATCH-candidate.bundle" "$ORBIT_SCRATCH.git" "$GH_CONFIG_DIR"
          printf '%s\n' "$ORBIT_RESULT"
          test "$ORBIT_FAILED" = false
        timeout: 60000
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-publish-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_SCRATCH: ${{ "/tmp/orbit-task-publish-" + run.id }}
          ORBIT_RESULT: '${{ "Open or update the PR" in steps && "outputs" in steps["Open or update the PR"] && "shape_result" in steps["Open or update the PR"].outputs ? steps["Open or update the PR"].outputs.shape_result.result_json : "{\"error_code\":\"tasks.publish_failed\"}" }}'
          ORBIT_FAILED: '${{ "Open or update the PR" in steps && "outputs" in steps["Open or update the PR"] && "shape_result" in steps["Open or update the PR"].outputs ? string(steps["Open or update the PR"].outputs.shape_result.failed) : "true" }}'
    dependsOn:
    - step: Check the workspace
      condition:
        type: always
    - step: Export the commit
      condition:
        type: always
    - step: Import into a bare repo
      condition:
        type: always
    - step: Push the branch
      condition:
        type: always
    - step: Open or update the PR
      condition:
        type: always
queueTimeout: 60
