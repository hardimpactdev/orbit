---
# The hub loads every peer file it has when this runs, not the peers of the admitted snapshot: a Node that joined after
# admission, such as a task VM, has only its file, and a load without it would drop its live peer.
- name: Apply the hub peers
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      umask 077
      before=$(wg showconf orbit | grep -v '^ListenPort' | sha256sum)
      {
        printf '[Interface]\nPrivateKey = '; cat {{ hub_sync.private_key_file | quote }}
        printf '\nListenPort = %s\n\n' {{ hub_sync.port | quote }}
        for f in /etc/wireguard/orbit-peers.d/*.conf; do [ ! -f "$f" ] || cat "$f"; done
      } > {{ hub_sync.sync_path | quote }}
      wg syncconf orbit {{ hub_sync.sync_path | quote }}
      [ "$before" = "$(wg showconf orbit | grep -v '^ListenPort' | sha256sum)" ] || echo changed
  register: hub_peers
  changed_when: hub_peers.stdout is search('changed')
