id: eff5f27f-10b6-47a1-9616-9ad5a21d3f80
name: metrics-containers
description: Pull the pinned images and start the Prometheus and Grafana containers in their units, keeping the named data volumes; prove both answer.
vaults: [default, orbit-control-inputs]
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
jobs:
- name: containers
  steps:
  - name: plan
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@nckrtl/metrics-role-plan', behaviorName: '${{ "metrics-plan" }}', methodName: plan, inputs: {assignment_id: '${{ inputs.intent.assignment_id }}', address: '${{ inputs.intent.ssh_execution.target.host }}', files: '${{ inputs.intent.files }}'}}
  - name: reload_units
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-unitdefs-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: &ssh
        name: '${{ ("metrics-unitdefs-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.ssh_execution.target.user }}', port: '${{ inputs.intent.ssh_execution.target.port }}', identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'}
        hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}}]
      inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/systemctl, daemon-reload]}
  - name: stopped
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: plan, condition: {type: succeeded}}, {step: reload_units, condition: {type: succeeded}}]
    forEach: {item: service, in: '${{ [0, 1] }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("metrics-stop-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        service: '${{ steps.plan.outputs.services[self.service].name + ".service" }}'
        ensure: stopped
        enabled: false
  - name: remove_existing
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: stopped, condition: {type: succeeded}}]
    dataOutputOverrides: [{specName: state, vaultName: orbit-control-inputs}]
    forEach: {item: service, in: '${{ [0, 1] }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_container'
      behaviorName: '${{ ("metrics-old-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        name: '${{ steps.plan.outputs.services[self.service].name }}'
        image: '${{ steps.plan.outputs.services[self.service].image }}'
        ensure: absent
  - name: volume
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: remove_existing, condition: {type: succeeded}}]
    forEach: {item: service, in: '${{ [0, 1] }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-volume-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      globalArgs: *ssh
      inputs: {hosts: 'name:target', sudo: true, argv: '${{ steps.plan.outputs.services[self.service].volume_args }}'}
  - name: image
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: volume, condition: {type: succeeded}}]
    forEach: {item: service, in: '${{ [0, 1] }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/docker_image'
      behaviorName: '${{ ("metrics-image-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        image: '${{ steps.plan.outputs.services[self.service].image }}'
        ensure: present
  - name: started
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: image, condition: {type: succeeded}}]
    forEach: {item: service, in: '${{ [0, 1] }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("metrics-start-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        service: '${{ steps.plan.outputs.services[self.service].name + ".service" }}'
        ensure: running
        enabled: false
  # Q-WAIT: one bounded wait each. Grafana proves the stored admin login; curl hides the password from the process list.
  - name: prometheus_ready
    labels: {role: swamp}
    dependsOn: [{step: started, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-prometheus-ready-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: *ssh
      inputs: {hosts: 'name:target', timeoutSec: 70, argv: [timeout, '60', sh, -c, 'until curl -fs -o /dev/null http://127.0.0.1:9090/-/ready; do sleep 1; done']}
  - name: grafana_login
    labels: {role: swamp}
    dependsOn: [{step: started, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      methodName: exec
      behaviorName: '${{ ("metrics-grafana-ready-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      globalArgs: *ssh
      inputs: {hosts: 'name:target', sudo: true, timeoutSec: 70, argv: [timeout, '60', sh, -c, 'until curl -fs -o /dev/null -u "admin:$(cat /etc/orbit/metrics/grafana/admin-password)" "http://$1:3000/api/user"; do sleep 1; done', grafana-login, '${{ inputs.intent.ssh_execution.target.host }}']}
