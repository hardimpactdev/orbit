id: 05fa3d80-677d-4927-a5a3-1f0b7aeddb13
name: operation-conn-direct
description: Revoke old Gateway sessions through the typed native Conn revocation child.
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [conn.gateway_sessions_revoke]}
    intent:
      type: object
      properties:
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        revision:
          type: integer
          minimum: 1
        links:
          type: array
          items:
            type: string
      required:
      - url
      - labels
      - links
      - revision
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        admin_session:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^conn-pairing-revoke-[a-f0-9-]+$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - admin_session
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: conn
  labels:
    role: swamp
  steps:
  - name: Revoke old sessions
    labels:
      role: swamp
    writes: true
    task:
      type: workflow
      workflowIdOrName: operation-conn-pairing-revoke
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: conn.pairing_revoke
        intent:
          url: ${{ inputs.intent.url }}
          labels: ${{ inputs.intent.labels }}
          pairings: []
          links: ${{ inputs.intent.links }}
        execution_secrets: ${{ inputs.execution_secrets }}
