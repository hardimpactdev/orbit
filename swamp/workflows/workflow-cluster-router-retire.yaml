id: a16dc0bb-cdb5-45ea-9341-0cdbfd767a3d
name: cluster-router-retire
description: Retire only the admitted obsolete Router firewall policy after native Route cleanup.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: retire
  steps:
  - name: firewall
    target: orbit-node-209
    labels:
      node: '209'
    forEach:
      item: member
      in: ${{ [inputs.intent] }}
    task:
      type: workflow
      workflowIdOrName: cluster-router-firewall
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent: ${{ self.member }}
