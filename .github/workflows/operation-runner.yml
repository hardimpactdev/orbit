name: Independent Operation families
on:
  pull_request:
    paths:
      - 'extensions/behaviors/operation-runner/**'
      - 'extensions/behaviors/operations/**'
      - 'workflows/workflow-operation-*.yaml'
      - 'models/@nckrtl/operation-*/**'
      - 'docs/conversion-kit.md'
      - 'tests/operation_runner_native_test.py'
      - 'tests/fixtures/operation-executor.ts'
      - '.github/workflows/operation-runner.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/behaviors/operation-runner/**'
      - 'extensions/behaviors/operations/**'
      - 'workflows/workflow-operation-*.yaml'
      - 'models/@nckrtl/operation-*/**'
      - 'tests/operation_runner_native_test.py'
      - 'tests/fixtures/operation-executor.ts'
      - '.github/workflows/operation-runner.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  reference-family:
    runs-on: [self-hosted, hardimpact]
    env:
      SWAMP_NO_UPDATE_CHECK: '1'
      SWAMP_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.8
      - name: Check Operation protocol and family code
        run: |
          deno fmt --check extensions/behaviors/operation-runner extensions/behaviors/operations
          deno lint extensions/behaviors/operation-runner extensions/behaviors/operations
          deno check extensions/behaviors/operation-runner/mod.ts extensions/behaviors/operations/*/mod.ts extensions/behaviors/operations/routes/publication.ts extensions/behaviors/operations/_lib/direct_test.ts
      - name: Match Process admission fixture with Gateway main
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://raw.githubusercontent.com/hardimpactdev/orbit/main/apps/gateway/tests/Fixtures/Processes/create-admitted-input.json \
            --output "$RUNNER_TEMP/process-create-gateway.json"
          python3 - "$RUNNER_TEMP/process-create-gateway.json" <<'PYTHON'
          import hashlib, pathlib, sys
          native = pathlib.Path('extensions/behaviors/operations/processes-schedules/create-admitted-input.json')
          gateway = pathlib.Path(sys.argv[1])
          native_hash = hashlib.sha256(native.read_bytes()).hexdigest()
          gateway_hash = hashlib.sha256(gateway.read_bytes()).hexdigest()
          if native_hash != gateway_hash:
              sys.exit(f'Process admission fixture mismatch: native={native_hash}, Gateway={gateway_hash}')
          print(f'Process admission fixtures match: {native_hash}')
          PYTHON
