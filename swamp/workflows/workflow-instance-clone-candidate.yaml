id: b2f83469-9dcd-5aaf-a57d-7ee137a158fb
name: instance-clone-candidate
description: Check the clone candidate source on its Node, read-only, as the candidate Node user.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        git_read:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        environment:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        git_credential:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - git_read
      - environment
      - git_credential
      additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  additionalProperties: false
jobs:
- name: candidate
  labels:
    role: swamp
  steps:
  - name: candidate-branch
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - branch
        - --show-current
  - name: candidate-commit
    labels:
      role: swamp
    dependsOn:
    - step: candidate-branch
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-3-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - rev-parse
        - --verify
        - HEAD^{commit}
  - name: candidate-status
    labels:
      role: swamp
    dependsOn:
    - step: candidate-commit
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-4-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - status
        - --porcelain
        - --untracked-files=all
  - name: candidate-submodules
    labels:
      role: swamp
    dependsOn:
    - step: candidate-status
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-5-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - submodule
        - status
        - --recursive
  - name: candidate-origin
    labels:
      role: swamp
    dependsOn:
    - step: candidate-submodules
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-7-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$1" config --get remote.origin.url | sed -E
          "s#^([a-z+]+://)[^/@]*:[^/@]*@#\1REDACTED@#; s#^(https?://)[^/@]+@#\1REDACTED@#"
        - sh
        - ${{ inputs.intent.candidate.checkout }}
  - name: candidate
    labels:
      role: swamp
    dependsOn:
    - step: candidate-origin
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "icl-8" }}
      methodName: cloneCandidate
      inputs:
        intent: ${{ inputs.intent.candidate }}
        origin: ${{ steps["candidate-origin"].outputs }}
        branch: ${{ steps["candidate-branch"].outputs }}
        commit: ${{ steps["candidate-commit"].outputs }}
        status: ${{ steps["candidate-status"].outputs }}
        submodules: ${{ steps["candidate-submodules"].outputs }}
queueTimeout: 60
