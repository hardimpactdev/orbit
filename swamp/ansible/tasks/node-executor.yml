---
# The executor (ADR 0266, ADR 0267, ADR 0271 N7; docs/reference/executor.md): the second process of the one `orbit-agent` binary,
# which node-converge-base.yml has just reconciled. Every Node runs it; the per-role allowlist decides which families it runs. systemd
# only starts the executor at boot and restarts it after a crash; the executor holds its own socket. A changed agent binary or file
# restarts it, and it finishes any open order from its journal at start-up.
#
# Until the Gateway pins a key, the intent names `skip` and the converge records that reason in its run and starts nothing.
- name: Skip the executor until its key is pinned
  when: intent.executor.skip != None
  ansible.builtin.debug:
    msg: "executor install skipped: {{ intent.executor.skip }}"
- name: Run the executor
  when: intent.executor.skip == None
  block:
    # Ansible 2.20 validates fail_msg as a string even when the assertion holds, so a null plan_error must render as text.
    - name: Require pinned keys
      ansible.builtin.assert:
        that: [intent.executor.plan_error == None]
        fail_msg: "{{ intent.executor.plan_error | string }}"
        quiet: true
    - name: Ensure the relay user
      ansible.builtin.user:
        name: "{{ intent.executor.relay_user }}"
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        state: present
    - name: Ensure the executor directory
      ansible.builtin.file: { path: /etc/orbit/executor, state: directory, owner: root, group: root, mode: "0755" }
    - name: Reconcile the executor's keys, Node id, allowlist, restore pool and unit
      ansible.builtin.copy: { dest: "{{ item.path }}", content: "{{ item.content }}", owner: root, group: root, mode: "0644" }
      loop:
        - { path: /etc/orbit/executor/gateway.pub, content: "{{ intent.executor.gateway_keys }}" }
        - { path: /etc/orbit/executor/node, content: "{{ intent.executor.node }}" }
        - { path: /etc/orbit/executor/enabled, content: "{{ intent.executor.enabled }}" }
        - { path: /etc/orbit/executor/restore-threads, content: "{{ intent.executor.restore_threads }}" }
        - { path: /etc/systemd/system/orbit-executor.service, content: "{{ intent.executor.unit }}" }
      loop_control: { label: "{{ item.path }}" }
      register: executor_files
    - name: Allow the Node user the one relay command
      ansible.builtin.copy:
        dest: /etc/sudoers.d/orbit-executor-relay
        content: "{{ intent.executor.sudoers }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
    - name: Start the executor and restart only for managed changes
      ansible.builtin.systemd:
        name: orbit-executor.service
        enabled: true
        daemon_reload: "{{ executor_files is changed }}"
        state: "{{ 'restarted' if (agent_binary_changed | default(false)) or executor_files is changed else 'started' }}"
    # After the service runs the agent binary, the separate binary of ADR 0266 has no user left.
    - name: Remove the retired executor binary
      ansible.builtin.file: { path: "{{ intent.executor.retired_binary }}", state: absent }
