description: Set up one captured Tasks workspace on the provisioned VM as official
  SSH exec argv from 209, and fold the provision receipt; no script reaches the VM.
id: 46a068b0-6512-4c23-8729-e5bdc43c136c
inputs:
  additionalProperties: false
  properties:
    intent:
      type: object
    kind:
      enum:
      - tasks.provision
      type: string
    node_id:
      minimum: 1
      type: integer
    operation_id:
      minimum: 1
      type: integer
    # The root run of the Operation, which the Gateway checks when it mints the clone credential.
    run_id:
      pattern: ^[a-f0-9-]{36}$
      type: string
    vm:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - run_id
  - vm
  type: object
jobs:
- name: source
  steps:
  # The workspace connection pins the host key the VM child observed at enrollment.
  - name: guest
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-guest" }}'
      methodName: guest
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
    # Every failure lands in the receipt; this workspace run itself always ends with it.
    allowFailure: true
  - name: prepare
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-prepare" }}'
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        root: ${{ "/tmp/orbit-task-provision-"+run.id }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
  - name: directory
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-vm-workspace
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ steps.guest.outputs.workspace }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    allowFailure: true
  - name: control
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-control" }}'
      methodName: execute
      inputs:
        run: 'umask 077

          mkdir -p -- "$ORBIT_ROOT"

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
    allowFailure: true
  # The credential is minted here, minutes before the clone, because the VM step before it can wait for capacity for longer than an installation token lives.
  # It exists only in the vault and in the environment of the clone: the VM gets a bundle, never a credential.
  - name: mint_clone
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        purpose: clone
    dependsOn:
    - step: control
      condition:
        type: succeeded
    allowFailure: true
  - name: clone
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-clone" }}'
      methodName: execute
      inputs:
        run: 'git clone --branch "$ORBIT_BRANCH" -- "$ORBIT_REPOSITORY" "$ORBIT_SOURCE"

          '
        env:
          ORBIT_BRANCH: ${{ inputs.intent.workspace.default_branch }}
          ORBIT_REPOSITORY: ${{ inputs.intent.workspace.repository }}
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source"
            }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ${{ vault.get(inputs.intent.git_authorization.vault,
            inputs.intent.git_authorization.key) }}
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: 'git@github.com:'
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: ssh://git@github.com/
    dependsOn:
    - step: mint_clone
      condition:
        type: succeeded
    allowFailure: true
  - name: bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-bundle" }}'
      methodName: execute
      inputs:
        run: 'git -C "$ORBIT_SOURCE" bundle create "$ORBIT_BUNDLE" --all

          '
        env:
          ORBIT_SOURCE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source"
            }}
          ORBIT_BUNDLE: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.bundle"
            }}
    dependsOn:
    - step: clone
      condition:
        type: succeeded
    allowFailure: true
  - name: prepare_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/mkdir
        - -p
        - -m
        - '0700'
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
    dependsOn:
    - step: directory
      condition:
        type: succeeded
    allowFailure: true
  - name: copy_bundle
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        src: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/source.bundle"
          }}
        dst: ${{ "/tmp/orbit-task-provision-"+run.id+"/source.bundle" }}
        direction: to
    dependsOn:
    - step: bundle
      condition:
        type: succeeded
    - step: prepare_remote
      condition:
        type: succeeded
    allowFailure: true
  - name: import
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/git
        - clone
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id+"/source.bundle" }}
        - ${{ inputs.intent.workspace.checkout_path }}
    dependsOn:
    - step: directory
      condition:
        type: succeeded
    - step: copy_bundle
      condition:
        type: succeeded
    allowFailure: true
  - name: origin
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - remote
        - set-url
        - origin
        - ${{ inputs.intent.workspace.repository }}
    dependsOn:
    - step: import
      condition:
        type: succeeded
    allowFailure: true
  - name: branch
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - switch
        - -c
        - ${{ inputs.intent.workspace.branch }}
        - ${{ inputs.intent.workspace.start_commit }}
    dependsOn:
    - step: origin
      condition:
        type: succeeded
    allowFailure: true
  - name: identity
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - rev-parse
        - HEAD
        - --abbrev-ref
        - HEAD
    dependsOn:
    - step: branch
      condition:
        type: succeeded
    allowFailure: true
  - name: inspect
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - /usr/bin/env
        - -C
        - ${{ inputs.intent.workspace.checkout_path }}
        - stat
        - -c
        - '%n|%F|%s'
        - --
        - composer.json
        - ${{ inputs.intent.workspace.entry_point }}
    dependsOn:
    - step: identity
      condition:
        type: succeeded
    allowFailure: true
  - name: composer
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        src: ${{ inputs.intent.workspace.checkout_path + "/composer.json" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
        timeoutSec: 60
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    - step: control
      condition:
        type: succeeded
    guard: ${{ inputs.intent.workspace.skip_profile || !steps.inspect.outputs.stdout.contains("composer.json|regular")
      }}
    allowFailure: true
  - name: profile
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-profile" }}'
      methodName: profile
      inputs:
        intent: ${{ inputs.intent }}
        identity: ${{ steps.identity.outputs.stdout }}
        files: ${{ steps.inspect.outputs.stdout }}
        composer: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/composer.json" }}
    dependsOn:
    - step: identity
      condition:
        type: succeeded
    - step: inspect
      condition:
        type: succeeded
    - step: composer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    allowFailure: true
  # Private dependencies (docs/cli/tasks/provision.mmd). The token is minted beside the clone credential, so its dispatch is off the critical path; the old
  # files are cleared early for the same reason (uutils `install` cannot overwrite from stdin). Right before the first setup step the two files are written
  # by two parallel steps, so the write costs one dispatch. `deps_remove_files` and `deps_revoke` run together after the last setup step, whatever it did:
  # a revoked token is dead whether or not the files are gone yet.
  - name: deps_mint
    labels: {role: swamp}
    task:
      type: workflow
      workflowIdOrName: task-github-mint
      inputs:
        operation_id: ${{ inputs.operation_id }}
        run_id: ${{ inputs.run_id }}
        purpose: dependencies
    dependsOn:
    - step: control
      condition:
        type: succeeded
    guard: ${{ size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: deps_clear
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-clear-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-clear-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - rm
        - -f
        - --
        - ${{ "/home/" + inputs.intent.workspace.user + "/.config/composer/auth.json" }}
        - ${{ "/home/" + inputs.intent.workspace.user + "/.npmrc" }}
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    guard: ${{ size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: deps_write_composer
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-composer-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-composer-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - install
        - -D
        - -m
        - '0600'
        - /dev/stdin
        - ${{ "/home/" + inputs.intent.workspace.user + "/.config/composer/auth.json" }}
        stdin: ${{ vault.get(inputs.intent.dependency_auth.composer.vault, inputs.intent.dependency_auth.composer.key) }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: deps_mint
      condition:
        type: succeeded
    - step: deps_clear
      condition:
        type: succeeded
    guard: ${{ has(steps.profile.outputs.error_code) || size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: deps_write_npm
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-npm-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-npm-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - install
        - -m
        - '0600'
        - /dev/stdin
        - ${{ "/home/" + inputs.intent.workspace.user + "/.npmrc" }}
        stdin: ${{ vault.get(inputs.intent.dependency_auth.npm.vault, inputs.intent.dependency_auth.npm.key) }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: deps_mint
      condition:
        type: succeeded
    - step: deps_clear
      condition:
        type: succeeded
    guard: ${{ has(steps.profile.outputs.error_code) || size(inputs.intent.workspace.setup) == 0 }}
    allowFailure: true
  - name: setup-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-setup-" + string(steps.guest.outputs.workspace.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        argv: ${{ steps.prepare.outputs.setup[self._index] }}
        timeoutSec: ${{ self.setup.timeout_seconds }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: deps_write_composer
      condition:
        type: succeeded
    - step: deps_write_npm
      condition:
        type: succeeded
    forEach:
      item: setup
      in: ${{ inputs.intent.workspace.setup }}
    concurrency: 1
    guard: ${{ has(steps.profile.outputs.error_code) || (self._index > 0 && (!("setup-"+string(self._index-1)
      in steps) || steps["setup-"+string(self._index-1)].status != "succeeded")) }}
    allowFailure: true
  - name: deps_remove_files
    labels: {role: swamp}
    queueTimeout: 10
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-deps-remove-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-deps-remove-" + string(steps.guest.outputs.workspace.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 60
        argv:
        - timeout
        - "30"
        - rm
        - -f
        - --
        - ${{ "/home/" + inputs.intent.workspace.user + "/.config/composer/auth.json" }}
        - ${{ "/home/" + inputs.intent.workspace.user + "/.npmrc" }}
    dependsOn:
    - step: deps_mint
      condition:
        type: always
    - step: deps_clear
      condition:
        type: always
    - step: deps_write_composer
      condition:
        type: always
    - step: deps_write_npm
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    # A skipped mint asked for no token: there is no file to remove and no token to revoke.
    guard: ${{ !("deps_mint" in steps) }}
    allowFailure: true
  # curl prints the HTTP status instead of failing on it, so the receipt can tell a revoked token (204) from one that GitHub does not know (401, none minted
  # or already expired) and from a revoke that failed. The step itself fails only when GitHub could not be reached.
  - name: deps_revoke
    labels: {role: swamp}
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "tp-deps-revoke" }}
      methodName: execute
      inputs:
        run: "curl --silent --show-error --proto =https --max-time 30 --request DELETE \\\n  --variable %ORBIT_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_TOKEN}}' \\\n  --header 'Accept: application/vnd.github+json' \\\n  --output /dev/null --write-out '%{http_code}' https://api.github.com/installation/token\n"
        env:
          ORBIT_TOKEN: ${{ vault.get(inputs.intent.dependency_auth.token.vault, inputs.intent.dependency_auth.token.key) }}
    dependsOn:
    - step: deps_mint
      condition:
        type: always
    - step: deps_clear
      condition:
        type: always
    - step: deps_write_composer
      condition:
        type: always
    - step: deps_write_npm
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    guard: ${{ !("deps_mint" in steps) }}
    writes: true
    allowFailure: true
  - name: setup_copy
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        direction: from
        recursive: true
        src: ${{ "/tmp/orbit-task-provision-"+run.id+"/output" }}
        dst: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/" }}
        timeoutSec: 60
    dependsOn:
    - step: prepare_remote
      condition:
        type: succeeded
    - step: control
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    allowFailure: true
  - name: setup_output
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-setup-output" }}'
      methodName: setup_output
      inputs:
        intent: ${{ inputs.intent }}
        directory: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id+"/output" }}
    dependsOn:
    - step: setup_copy
      condition:
        type: succeeded
    allowFailure: true
  # The proof club token's private directory, owned by orbit.
  - name: proof_club_directory
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: profile
      condition:
        type: succeeded
    - step: setup-${{ self._index }}
      condition:
        type: always
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -d
        - -m
        - '0700'
        - -o
        - orbit
        - -g
        - orbit
        - --
        - /home/orbit/.config/swamp
  # install cannot replace an existing file from stdin; drop any previous token or link first.
  - name: proof_club_previous
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_directory
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - rm
        - -f
        - --
        - /home/orbit/.config/swamp/club-api-key
  # The token from the vault on SSH stdin, written 0600 for orbit; it never enters argv or history.
  - name: proof_club
    labels: {role: swamp}
    queueTimeout: 10
    allowFailure: true
    guard: ${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required || inputs.intent.proof_club == null }}
    dependsOn:
    - step: proof_club_previous
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-proof-club-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        sudo: true
        argv:
        - timeout
        - '30'
        - install
        - -m
        - '0600'
        - -o
        - orbit
        - -g
        - orbit
        - /dev/stdin
        - /home/orbit/.config/swamp/club-api-key
        stdin: ${{ vault.get(inputs.intent.proof_club.vault, inputs.intent.proof_club.key) }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-provision-data'
      behaviorName: '${{ "tp-data-result" }}'
      methodName: result
      inputs:
        intent: ${{ inputs.intent }}
        vm: ${{ inputs.vm }}
        steps: ${{ steps }}
    dependsOn:
    - step: guest
      condition:
        type: always
    - step: prepare
      condition:
        type: always
    - step: directory
      condition:
        type: always
    - step: control
      condition:
        type: always
    - step: mint_clone
      condition:
        type: always
    - step: clone
      condition:
        type: always
    - step: deps_mint
      condition:
        type: always
    - step: deps_clear
      condition:
        type: always
    - step: deps_write_composer
      condition:
        type: always
    - step: deps_write_npm
      condition:
        type: always
    - step: deps_remove_files
      condition:
        type: always
    - step: deps_revoke
      condition:
        type: always
    - step: bundle
      condition:
        type: always
    - step: prepare_remote
      condition:
        type: always
    - step: copy_bundle
      condition:
        type: always
    - step: import
      condition:
        type: always
    - step: origin
      condition:
        type: always
    - step: branch
      condition:
        type: always
    - step: identity
      condition:
        type: always
    - step: inspect
      condition:
        type: always
    - step: composer
      condition:
        type: always
    - step: profile
      condition:
        type: always
    - step: setup-${{ self._index }}
      condition:
        type: always
    - step: setup_output
      condition:
        type: always
    - step: proof_club_directory
      condition:
        type: always
    - step: proof_club_previous
      condition:
        type: always
    - step: proof_club
      condition:
        type: always
  - name: cleanup
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "tp-cleanup" }}'
      methodName: execute
      inputs:
        run: 'rm -rf -- "$ORBIT_ROOT"

          '
        env:
          ORBIT_ROOT: ${{ "/home/orbit/.cache/orbit-task-provision/"+run.id }}
    dependsOn:
    - step: result
      condition:
        type: always
    allowFailure: true
  - name: cleanup_remote
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        hosts:
        - address: ${{ steps.guest.outputs.workspace.ssh_execution.target.host }}
          name: target
          transport:
            hostKeys: ${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}
        name: '${{ ("tp-ssh-" + string(steps.guest.outputs.workspace.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          identityFile: ${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}
          kind: ssh
          port: ${{ steps.guest.outputs.workspace.ssh_execution.target.port }}
          user: ${{ steps.guest.outputs.workspace.ssh_execution.target.user }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - /usr/bin/rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-provision-"+run.id }}
    dependsOn:
    - step: result
      condition:
        type: always
    allowFailure: true
  labels: {role: swamp}
name: task-workspace-source
# Each SSH step is limited to 3900 s, the run budget of the largest Operation that calls it (OperationRunBudgets::SecondsByKind).
vaults:
- orbit-control-inputs
