id: 5522869b-0c77-49ca-a980-6c8d89ac266d
name: task-vm-runtime-command-confirm
description: Observe the exact guest, pinned Pi binary, services and authenticated capability in separate native command steps.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        pi_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^task-vm-pi-token-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - pi_token
      additionalProperties: false
  required:
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: confirm-runtime
  target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
  labels: &id001
    node: ${{ string(inputs.intent.guest_node_id) }}
  steps:
  - name: public-input
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment-inputs'
      behaviorName: ${{ "runtime-inputs-" + run.id }}
      methodName: guest
      inputs:
        intent: ${{ inputs.intent }}
  - name: identity
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-identity-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import pwd
          import socket

          try:
              account = pwd.getpwnam("orbit")
              if (
                  os.geteuid() != account.pw_uid
                  or os.environ["ORBIT_EXPECTED_NAME"] != socket.gethostname()
              ):
                  raise ValueError()
              print(
                  json.dumps(
                      {
                          "identity_verified": True,
                          "user": "orbit",
                          "hostname": socket.gethostname(),
                      }
                  )
              )
          except Exception:  # noqa: BLE001 -- Fixed script boundary discards diagnostics.
              print('{"error_code":"task_vm.runtime_not_ready"}')
              raise SystemExit(1)
          PYTHON
        env:
          ORBIT_EXPECTED_NAME: ${{ steps["public-input"].outputs.name }}
    dependsOn:
    - step: public-input
      condition:
        type: succeeded
  - name: sudo-ready
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-sudo-ready-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          /usr/bin/sudo -n -- /usr/bin/true
          printf '{"sudo_ready":true}\n'
    dependsOn:
    - step: identity
      condition:
        type: succeeded
  - name: pi-artifact
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-pi-artifact-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pwd
          import stat

          try:
              account = pwd.getpwnam("orbit")
              path = "/home/orbit/.local/bin/pi-server"
              for parent in [
                  "/home",
                  "/home/orbit",
                  "/home/orbit/.local",
                  "/home/orbit/.local/bin",
              ]:
                  info = os.lstat(parent)
                  if not stat.S_ISDIR(info.st_mode):
                      raise ValueError()
              info = os.lstat(path)
              if (
                  not stat.S_ISREG(info.st_mode)
                  or info.st_uid != account.pw_uid
                  or info.st_mode & 0o022
                  or not info.st_mode & 0o111
              ):
                  raise ValueError()
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as source:
                  actual = hashlib.file_digest(source, "sha256").hexdigest()
              if actual != os.environ["ORBIT_EXPECTED_PI_SHA256"]:
                  raise ValueError()
              print(json.dumps({"pi_sha256": actual, "current": True}))
          except Exception:  # noqa: BLE001 -- Fixed script boundary discards diagnostics.
              print('{"error_code":"task_vm.runtime_not_ready"}')
              raise SystemExit(1)
          PYTHON
        env:
          ORBIT_EXPECTED_PI_SHA256: ${{ steps["public-input"].outputs.pi_sha256 }}
    dependsOn:
    - step: sudo-ready
      condition:
        type: succeeded
  - name: observer-active
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-observer-active-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          state=$(/usr/bin/sudo -n -- /usr/bin/systemctl is-active -- orbit-agent.service)
          [ "$state" = active ]
          printf '{"observer_active":true}\n'
    dependsOn:
    - step: pi-artifact
      condition:
        type: succeeded
  - name: process-active
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-process-active-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          state=$(/usr/bin/sudo -n -- /usr/bin/systemctl is-active -- pi-server.service)
          [ "$state" = active ]
          printf '{"process_active":true}\n'
    dependsOn:
    - step: observer-active
      condition:
        type: succeeded
  - name: capabilities
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-capabilities-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import os
          import re
          import urllib.parse
          import urllib.request

          try:
              token = os.environ.pop("ORBIT_PI_TOKEN")
              if re.fullmatch("[a-f0-9]{64}", token) is None:
                  raise ValueError()

              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request, response, code, message, headers, new_url):
                      return None

              url = os.environ["ORBIT_PI_URL"]
              parsed = urllib.parse.urlsplit(url)
              if (
                  parsed.scheme != "http"
                  or parsed.hostname != os.environ["ORBIT_GUEST_ADDRESS"]
                  or parsed.port is None
                  or not 1 <= parsed.port <= 65535
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.path not in ("", "/")
                  or parsed.query
                  or parsed.fragment
              ):
                  raise ValueError()
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              request = urllib.request.Request(
                  url.rstrip("/") + "/capabilities", headers={"Authorization": "Bearer " + token}
              )
              with opener.open(request, timeout=5) as response:
                  if response.status < 200 or response.status >= 300:
                      raise ValueError()
              print('{"capabilities_ready":true}')
          except Exception:  # noqa: BLE001 -- Fixed script boundary discards diagnostics.
              print('{"error_code":"task_vm.runtime_not_ready"}')
              raise SystemExit(1)
          PYTHON
        env:
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
          ORBIT_PI_URL: ${{ steps["public-input"].outputs.pi_url }}
          ORBIT_GUEST_ADDRESS: ${{ steps["public-input"].outputs.guest_address }}
    dependsOn:
    - step: process-active
      condition:
        type: succeeded
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.guest_node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "runtime-result-" + run.id }}
      methodName: execute
      inputs:
        run: |
          set -eu
          /usr/bin/python3 - <<'PYTHON'
          import json
          import os

          print(
              json.dumps(
                  {
                      "ready": True,
                      "guest_node_id": int(os.environ["ORBIT_GUEST_NODE_ID"]),
                      "process": {
                          "process_id": int(os.environ["ORBIT_PROCESS_ID"]),
                          "status": "active",
                          "content_hash": os.environ["ORBIT_PROCESS_HASH"],
                      },
                  }
              )
          )
          PYTHON
        env:
          ORBIT_GUEST_NODE_ID: ${{ string(steps["public-input"].outputs.guest_node_id) }}
          ORBIT_PROCESS_ID: ${{ string(steps["public-input"].outputs.process_id) }}
          ORBIT_PROCESS_HASH: ${{ steps["public-input"].outputs.process_hash }}
    dependsOn:
    - step: capabilities
      condition:
        type: succeeded
