id: 2c1fb8bb-5e46-4f5e-b742-99e7801684d9
name: operation-route-caddy-delta
description: Compose captured public sections and apply them with official file actions.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
          not:
            enum:
            - 1
            - 18
        user:
          type: string
        control_node_id:
          type: integer
          minimum: 1
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
            become:
              type: boolean
              const: true
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
          - become
          additionalProperties: false
        before:
          type: object
        after:
          type: object
        direction:
          type: string
          enum:
          - forward
          - restore
      required:
      - node_id
      - user
      - control_node_id
      - connection
      - before
      - after
      - direction
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: publication
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels:
    node: ${{ string(inputs.intent.node_id) }}
  steps:
  - name: read-current
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-read-current-" + run.id }}
      methodName: execute
      inputs:
        run: |-
          set -eu
          if sudo /usr/bin/test -f /etc/caddy/Caddyfile; then sudo /usr/bin/cat /etc/caddy/Caddyfile; fi
  - name: compose
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "route-delta-compose-" + run.id }}
      methodName: caddy
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        control_node_id: ${{ inputs.intent.control_node_id }}
        connection: ${{ inputs.intent.connection }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
        current: ${{ steps["read-current"].outputs.stdout }}
    dependsOn:
    - step: read-current
      condition:
        type: succeeded
  - name: apply-config
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels:
      node: ${{ string(inputs.intent.control_node_id) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "route-delta-apply-config-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
        path: /etc/caddy/Caddyfile
        ensure: present
        content: ${{ steps.compose.outputs.caddy.content }}
        owner: root
        group: caddy
        mode: '0640'
    dependsOn:
    - step: compose
      condition:
        type: succeeded
  - name: validate
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-validate-" + run.id }}
      methodName: execute
      inputs:
        run: sudo -u caddy /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    dependsOn:
    - step: apply-config
      condition:
        type: succeeded
  - name: reload
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-reload-" + run.id }}
      methodName: execute
      inputs:
        run: sudo /usr/bin/systemctl reload caddy
    dependsOn:
    - step: validate
      condition:
        type: succeeded
- name: completion
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels:
    node: ${{ string(inputs.intent.node_id) }}
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-delta-result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '{"ready":true,"version":"%s"}\n' "$ORBIT_VERSION"
        env:
          ORBIT_VERSION: ${{ steps.compose.outputs.caddy.version }}
