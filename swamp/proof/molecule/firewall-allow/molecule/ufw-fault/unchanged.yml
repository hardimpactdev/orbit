---
# The `unchanged` step of the cases file (since: act): the UFW table and the firewall records of the Node are the same in two snapshots of
# converge, except the rows and records of one port. Variables: from_snap, to_snap, and except_port ('' for none, as a case that names no
# `except`). The rows are compared without their numbers and in sorted order, the records as sorted JSON, as the runner compares them
# (steps.py unchanged, without_port). Included by the verify-<case>.yml files.
- name: "{{ inventory_hostname }}: nothing else changed in UFW and the records ({{ from_snap }} to {{ to_snap }}, except port {{ except_port | default('') }})"
  vars:
    skip_re: "{{ ('^' ~ except_port ~ '[/: ]') if (except_port | default('') | string) != '' else '(?!)' }}"
    ufw_from: "{{ snaps[from_snap].ufw.split('\n') | select('search', '^\\[') | map('regex_replace', '^\\[ *[0-9]+\\] *', '') | reject('search', skip_re) | sort | list }}"
    ufw_to: "{{ snaps[to_snap].ufw.split('\n') | select('search', '^\\[') | map('regex_replace', '^\\[ *[0-9]+\\] *', '') | reject('search', skip_re) | sort | list }}"
    skip_ports: "{{ [except_port | default('') | int, except_port | default('') | string] }}"
    records_from: "{{ snaps[from_snap].records | rejectattr('port', 'in', skip_ports) | map('to_json') | sort | list }}"
    records_to: "{{ snaps[to_snap].records | rejectattr('port', 'in', skip_ports) | map('to_json') | sort | list }}"
  ansible.builtin.assert:
    that:
      - ufw_from == ufw_to
      - records_from == records_to
    fail_msg: >-
      unchanged {{ from_snap }} to {{ to_snap }}:
      UFW added {{ ufw_to | difference(ufw_from) | list | first | default('-') }}, removed {{ ufw_from | difference(ufw_to) | list | first | default('-') }};
      records added {{ records_to | difference(records_from) | length }}, removed {{ records_from | difference(records_to) | length }}
    quiet: true
