id: b1a5e413-5c52-4d05-966b-f78d57c2da06
name: operation-route-update
description: "Route update in the chart's steps; Node work through official cfgmgmt and SSH behaviors (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: route.update}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: update
  labels: {role: swamp}
  steps:
    # Domain change: per leaf, a Node-local key and its public CSR under the new Route's scope (route-create-csr).
  - name: 'Make a CSR on the Node'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-csr
      inputs:
        intent: '${{ inputs.intent }}'
        leaf: '${{ self.leaf }}'
    # Per leaf: 209 has the CSR signed; the one Gateway call (route-create-sign).
  - name: 'Sign the CSR'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        parent_run_id: '${{ run.id }}'
        leaf: '${{ inputs.intent.leaves[self.leaf] }}'
        request: '${{ steps["Make a CSR on the Node-" + string(self.leaf)].outputs.csr.stdout }}'
    # Per Node: certificate, web-root access, pools and the prepared Caddyfile with both sites (route-create-site).
  - name: 'Install cert, publish site'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.publish.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.publish }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSR-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
    # Laravel targets: the APP_URL line, or the production .env from the vault (route-create-site).
  - name: 'Write the new APP_URL'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.app_url.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.app_url }}'
        node_id: '${{ self.node.node_id }}'
        signed: []
        execution_secrets: '${{ inputs.execution_secrets }}'
    # From 209 to each serving Node and the Router on 443 with the new domain as SNI; a failed chain fails the step.
  - name: 'Probe the site over TLS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Write the new APP_URL', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: probe, in: '${{ inputs.intent.probes }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "route-update-probe-209-" + string(self.probe.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "route-update-probe-209-" + string(self.probe.node_id) }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.probe_ssh.target.user }}'
          port: '${{ inputs.intent.probe_ssh.target.port }}'
          identityFile: '${{ inputs.intent.probe_ssh.identity_file }}'
        hosts:
        - name: control
          address: '${{ inputs.intent.probe_ssh.target.host }}'
          transport: {hostKeys: '${{ inputs.intent.probe_ssh.target.host_keys }}'}
      inputs:
        hosts: name:control
        argv: '${{ ["timeout", "20", "openssl", "s_client", "-no_ign_eof", "-connect", self.probe.address + ":443", "-servername", self.probe.domain, "-verify_hostname", self.probe.domain, "-verify_return_error", "-CAfile", "/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"] }}'
        timeoutSec: 30
    # Publication change: the Ingress site, then its public ports (route-create-ingress).
  - name: 'Open or close the edge'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Write the new APP_URL', condition: {type: always}}
    - {step: 'Probe the site over TLS', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.edge_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-ingress
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
    # Only outside the TLD: the whole private DNS, written by the dns-publish phase.
  - name: 'Move private DNS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Write the new APP_URL', condition: {type: always}}
    - {step: 'Probe the site over TLS', condition: {type: always}}
    - {step: 'Open or close the edge', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: vpn, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: dns-publish
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ self.vpn.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          node_id: '${{ self.vpn.node_id }}'
          connection:
            nodeHost: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host }}'
            nodeUser: '${{ inputs.intent.nodes[string(self.vpn.node_id)].user }}'
            nodePort: '${{ inputs.intent.nodes[string(self.vpn.node_id)].port }}'
            nodeIdentityFile: '${{ inputs.intent.nodes[string(self.vpn.node_id)].identity_file }}'
            become: true
          host_keys: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host_keys }}'
          dns: '${{ self.vpn.dns }}'
        execution_secrets: {}
  - name: 'Withdraw the old site'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make a CSR on the Node', condition: {type: always}}
    - {step: 'Sign the CSR', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Write the new APP_URL', condition: {type: always}}
    - {step: 'Probe the site over TLS', condition: {type: always}}
    - {step: 'Open or close the edge', condition: {type: always}}
    - {step: 'Move private DNS', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-retire
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ run.id }}'
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSR-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
