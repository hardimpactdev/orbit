# A default applies only when no check (or intentional skip) claims the path; the plan summary names the path.
# Tooling roots have no static check of their own, so their default is empty: no job runs for a file that no check reads.
# The desktop checks are paused. Unknown roots fail instead of selecting everything.
[roots."apps/agent"]
inputs = ["apps/agent/**"]
default = ["agent"]

[roots."apps/cli"]
inputs = ["apps/cli/**"]
default = ["cli-static"]

[roots."apps/desktop"]
inputs = ["apps/desktop/**"]
default = []

[roots."apps/docs"]
inputs = ["apps/docs/**"]
default = ["docs"]

[roots."apps/e2e"]
inputs = ["apps/e2e/**"]
default = ["e2e-static"]

[roots."apps/gateway"]
inputs = ["apps/gateway/**"]
default = ["gateway-static"]

[roots."apps/pi-server"]
inputs = ["apps/pi-server/**"]
default = ["pi"]

[roots."apps/web"]
inputs = ["apps/web/**"]
default = ["web"]

[roots."packages/php-sdk"]
inputs = ["packages/php-sdk/**"]
default = ["sdk-static", "sdk-tests", "cli-static"]

[roots."docs"]
inputs = ["docs/**"]
default = ["docs"]

[roots.".github"]
inputs = [".github/**"]
default = []

[roots."bin"]
inputs = ["bin/**"]
default = []

[roots."tools"]
inputs = ["tools/**"]
default = []

[roots."scripts"]
inputs = ["scripts/**"]
default = []

[roots.".agents"]
inputs = [".agents/**"]
default = ["docs"]

[roots.".codex"]
inputs = [".codex/**"]
default = ["docs"]

[roots.".githooks"]
inputs = [".githooks/**"]
default = ["docs"]

[roots."swamp"]
inputs = ["swamp/**"]
default = ["swamp-shape"]

[roots."."]
inputs = [".editorconfig", ".gitattributes", ".gitignore", ".node-version", "composer.json", "composer.lock", "vet.json", "LICENSE", "*.md", "*.mdx", "*.mmd"]
default = []
