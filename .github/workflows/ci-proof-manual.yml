name: Manual copy proof
'on':
  workflow_dispatch:
    inputs:
      commit:
        description: Full lowercase SHA reachable from a repository branch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-copy-proof
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'hardimpactdev/orbit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hardimpactdev/orbit
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Check dispatcher and repository branch reachability
      env:
        GH_TOKEN: ${{ github.token }}
        PROOF_SHA: ${{ inputs.commit }}
      run: python3 -I bin/ci-proof-manual check
  proof:
    needs: preflight
    runs-on: ${{ fromJSON(vars.ORBIT_PROOF_RUNNER || '["self-hosted","hardimpact","orbit-shard"]') }}
    timeout-minutes: 275
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hardimpactdev/orbit
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Recheck admission and run the exact SHA through the enrolled caller
      env:
        GH_TOKEN: ${{ github.token }}
        PROOF_SHA: ${{ inputs.commit }}
        PROOF_RECEIPT: ${{ runner.temp }}/manual-proof/proof-receipt.json
      run: |
        mkdir -p "$RUNNER_TEMP/manual-proof"
        python3 -I bin/ci-proof-manual run
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: proof-receipt
        path: ${{ runner.temp }}/manual-proof/proof-receipt.json
        if-no-files-found: error
        overwrite: true
