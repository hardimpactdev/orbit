# Node role convergence for a sole database or ingress role, from 209 with official cfgmgmt and SSH argv.
# Every effect may fail; the result step assembles the role, footprint and CLI outcome from the step statuses.
id: 21b08662-58e5-4485-b42c-540dd9bd6004
name: node-role-converge
description: Converge a sole database or ingress role from 209 with official cfgmgmt behaviors and SSH argv; no shipped script.
vaults: []
labels: {role: swamp}
inputs:
  type: object
  properties:
    intent: {type: object}
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    execution_secrets: {type: object, additionalProperties: false}
  required: [intent, execution_secrets, operation_id, node_id]
  additionalProperties: false
jobs:
- name: effects
  steps:
    # The pinned release; a binary with the pinned SHA-256 is left alone.
  - name: 'Install the Node agent'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/fetch'
      behaviorName: ${{ "role-agent-binary-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {url: '${{ inputs.intent.footprint.payloads.agent.url }}', path: /usr/local/bin/orbit-agent, checksum: '${{ "sha256:" + inputs.intent.agent_sha256 }}', owner: root, group: root, mode: '0755', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Install Caddy'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Install the Node agent', condition: {type: succeeded}}]
    guard: '${{ inputs.intent.role != "ingress" }}'
    task:
      type: workflow
      workflowIdOrName: node-caddy-package
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: node.role_converge
        intent: '${{ {"ssh": inputs.intent.ssh, "package": inputs.intent.role != "ingress" ? {} : inputs.intent.caddy_package} }}'
  - name: 'Refresh package lists'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Install the Node agent', condition: {type: succeeded}}, {step: 'Install Caddy', condition: {type: always}}]
    guard: '${{ "Install Caddy" in steps && steps["Install Caddy"].status == "failed" }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/apt'
      behaviorName: ${{ "role-apt-" + string(inputs.node_id) }}
      methodName: refresh
      globalArgs: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Install prerequisites'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Refresh package lists', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/apt'
      behaviorName: ${{ "role-apt-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {packages: '${{ inputs.intent.prerequisites.packages }}', ensure: present, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Start Caddy'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Install prerequisites', condition: {type: succeeded}}]
    guard: '${{ inputs.intent.role != "ingress" }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "role-caddy-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {service: caddy.service, enabled: true, ensure: running, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Publish Caddy sites'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Start Caddy', condition: {type: succeeded}}]
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: node.role_converge
        execution_secrets: {}
        intent: {caddy_publication: '${{ "caddy" in inputs.intent ? inputs.intent.caddy : {} }}'}
  - name: 'Open ingress ports'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Publish Caddy sites', condition: {type: succeeded}}]
    forEach: {item: rule, in: '${{ inputs.intent.role != "ingress" ? [] : inputs.intent.firewall.desired }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-open-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-open-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ self.rule }}'
        timeoutSec: 40
  - name: 'Close ingress ports'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Publish Caddy sites', condition: {type: succeeded}}, {step: 'Open ingress ports', condition: {type: always}}]
    guard: '${{ steps.exists(k, k.startsWith("Open ingress ports-") && steps[k].status == "failed") }}'
    forEach: {item: rule, in: '${{ inputs.intent.role != "ingress" ? [] : inputs.intent.firewall.remove }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-close-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-close-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ self.rule }}'
        timeoutSec: 40
  - name: 'Prove the ports'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Publish Caddy sites', condition: {type: succeeded}}, {step: 'Open ingress ports', condition: {type: always}}, {step: 'Close ingress ports', condition: {type: always}}]
    guard: '${{ inputs.intent.role != "ingress" }}'
    task: {type: assert, severity: high, message: Every admitted firewall action must succeed.,
      expr: 'steps.filter(k, k.startsWith("Open ingress ports-") && steps[k].status == "succeeded").size() == inputs.intent.firewall.desired.size() && steps.filter(k, k.startsWith("Close ingress ports-") && steps[k].status == "succeeded").size() == inputs.intent.firewall.remove.size()'}
  - name: 'Apply private DNS policy'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Install prerequisites', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.footprint.network == null }}
    task:
      type: workflow
      workflowIdOrName: operation-fleet-peer-dns
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: fleet.peer_dns
        intent: '${{ inputs.intent.footprint.network == null ? {} : {"ssh": inputs.intent.ssh, "server": inputs.intent.footprint.network.peer_dns.dns_server,
          "dns_server": inputs.intent.footprint.network.peer_dns.dns_server, "public_key": inputs.intent.footprint.network.peer_dns.public_key,
          "domains": inputs.intent.footprint.network.peer_dns.domains, "dns_hook": inputs.intent.footprint.network.peer_dns.dns_hook,
          "probe": inputs.intent.footprint.network.peer_dns.probe} }}'
        execution_secrets: {}
    # The Node agent keeps its key; the role only proceeds when the key matches the recorded verifier.
  - name: 'Check the agent key'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Install prerequisites', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/bin/sha256sum, /etc/orbit/agent/secret]
        timeoutSec: 40
  - name: 'Prove the agent key'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Check the agent key', condition: {type: succeeded}}]
    task: {type: assert, severity: high, message: The Node agent key does not match the recorded verifier.,
      expr: 'steps["Check the agent key"].outputs.stdout in [inputs.intent.verifier_hash + "  /etc/orbit/agent/secret", inputs.intent.verifier_hash + "  /etc/orbit/agent/secret\n"]'}
    # The unit opens the apps root of the Node's account, as NodeAgentSshExecutor renders it.
  - name: 'Render the agent unit'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Prove the agent key', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-converge-command'
      behaviorName: ${{ "role-agent-unit-" + string(inputs.node_id) }}
      methodName: observer_files
      inputs:
        configuration: '${{ inputs.intent.footprint.payloads.agent.configuration }}'
        certificate: '${{ inputs.intent.footprint.payloads.agent.certificate }}'
        unit: '${{ inputs.intent.footprint.payloads.agent.unit }}'
        apps_root: '${{ inputs.intent.footprint.payloads.agent.apps_root }}'
        home: '${{ inputs.intent.user == "root" ? "/root" : "/home/" + inputs.intent.user }}'
  - name: 'Configure the Node agent'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Render the agent unit', condition: {type: succeeded}}]
    forEach: {item: file, in: '${{ [{"path": "/etc/orbit/agent/config.toml", "content": inputs.intent.footprint.payloads.agent.configuration}, {"path": "/etc/orbit/agent/ca.pem", "content": inputs.intent.footprint.payloads.agent.certificate}] }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "role-agent-file-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: apply
      globalArgs: {path: '${{ self.file.path }}', ensure: present, content: '${{ self.file.content }}', owner: root, group: root, mode: '0644', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Start the Node agent'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Configure the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "role-agent-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {service: orbit-agent.service, unitFile: '${{ steps["Render the agent unit"].outputs.unit }}', enabled: true, ensure: running, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Restart the Node agent'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Start the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: ${{ "role-agent-" + string(inputs.node_id) }}
      methodName: restart
      globalArgs: {service: orbit-agent.service, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Close Instance .env files'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Restart the Node agent', condition: {type: succeeded}}]
    guard: '${{ size(inputs.intent.footprint.payloads.agent.checkouts) == 0 }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60", "/usr/bin/find"] + inputs.intent.footprint.payloads.agent.checkouts + ["-maxdepth", "1", "-name", ".env", "-type", "f", "-perm", "/o=rwx", "-exec", "chmod", "o-rwx", "{}", "+"] }}'
        timeoutSec: 70
  - name: 'Check the Node agent'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Restart the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "role-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "role-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', /usr/bin/systemctl, is-active, orbit-agent.service]
        timeoutSec: 40
    # The pinned CLI release beside its version link; the profile is written even when no release is admitted.
  - name: 'Install the Orbit CLI'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Install prerequisites', condition: {type: succeeded}}]
    guard: '${{ inputs.intent.cli.skip_reason != null || inputs.intent.cli.plan_error != null || inputs.intent.cli.release == null }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/fetch'
      behaviorName: ${{ "role-cli-binary-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {url: '${{ inputs.intent.cli.release == null ? "https://invalid" : inputs.intent.cli.release.url }}', path: '${{ inputs.intent.cli.release == null ? "/usr/local/bin/orbit-none" : "/usr/local/bin/orbit-" + inputs.intent.cli.release.version }}', checksum: '${{ inputs.intent.cli.release == null ? "" : "sha256:" + inputs.intent.cli.release.sha256 }}', owner: root, group: root, mode: '0755', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Link the Orbit CLI'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Install the Orbit CLI', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/link'
      behaviorName: ${{ "role-cli-link-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: /usr/local/bin/orbit, ensure: present, target: '${{ inputs.intent.cli.release == null ? "orbit-none" : "orbit-" + inputs.intent.cli.release.version }}', owner: root, group: root, nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Create the CLI profile folder'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Install prerequisites', condition: {type: succeeded}}]
    guard: '${{ inputs.intent.cli.skip_reason != null || inputs.intent.cli.plan_error != null }}'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ "role-cli-folder-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: /root/.orbit, ensure: present, owner: root, group: root, mode: '0700', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Write the CLI profile'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Create the CLI profile folder', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "role-cli-profile-" + string(inputs.node_id) }}
      methodName: apply
      globalArgs: {path: /root/.orbit/config.json, ensure: present, content: '${{ inputs.intent.cli.profile }}', owner: root, group: root, mode: '0600', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
- name: result
  dependsOn: [{job: effects, condition: {type: always}}]
  steps:
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-converge-result'
      behaviorName: role-converge-result
      methodName: assemble
      inputs: {intent: '${{ inputs.intent }}', steps: '${{ steps }}'}
