# The batches of the proof cases, in run order. Admission and the runner read this file.
# A batch is a group of cases that run one after another after one restore of the task's base snapshot.
# Cases undo nothing; a case that changes state all cases share gets its own batch.
# Format: docs/reference/verification-cases.

batches:
  fresh-fleet:
    summary: The healthy nested fleet from the ready copies. Only Orbit's own rules and the proof-network allowance exist.
  dual-stack:
    summary: As fresh-fleet, and every Node also has an IPv6 address on the proof bridge.
    setup:
      - ipv6_addresses: {nodes: [gateway, app-dev, app-prod]}
  full-list:
    summary: As fresh-fleet, and no case of the same run has made an operator rule. For a case that checks the complete list.
  ufw-fault:
    summary: As fresh-fleet. A case makes `ufw` fail on a Node, so no other case may share it.
  node-down:
    summary: As fresh-fleet. A case stops a Node, its agent and SSH, so no other case may share it.
  no-grant:
    summary: As fresh-fleet, and app-prod has no access grant to app-dev.
    setup:
      - node_access_remove: {consumer: app-prod, serving: app-dev}
