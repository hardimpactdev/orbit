---
# The Incus work of a task VM host, one tagged part per Swamp phase. The host keeps one stopped base VM that never gets an identity;
# its ZFS snapshot is the base a task start copies (docs/cli/tasks/vm-image-refresh.mmd):
# - `base-start`: start the base VM; a host without one gets it once, from the stock Ubuntu VM image and an empty seed volume.
# - `base-snapshot`: stop the base VM and snapshot it and its seed volume under the run's name.
# - `base-prune`: keep the new snapshot and the recorded one, which becomes `-previous`; remove the others.
# - `base-discard`: after a failed refresh, stop the base VM, remove the run's snapshot and roll back to the recorded one.
# A task start and a release (docs/cli/tasks/provision.mmd, docs/cli/tasks/cancel.mmd):
# - `start`: copy the recorded base snapshot and its seed snapshot (ZFS clones), put the identity the admission minted and the claim's keys
#   on an identity volume of the VM, and start it. The base's orbit-identity unit applies them at boot. The containers start with the VM.
# - `delete`: the task VM, its seed clone and its identity volume go; the Gateway then deletes the Node and its keys.
# Every part is idempotent: a rerun finds its work done. The intent comes from the Gateway; this file names no host or VM. Secrets come
# from the environment, never from argv. The host is reached from the Swamp Node with its pinned host keys, never trusted on first use.
- name: Reach the task VM host
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Pin the host keys
      ansible.builtin.copy:
        dest: "{{ run_dir }}/known_hosts"
        mode: "0600"
        content: "{% for key in host.ssh.target.host_keys %}{{ host.ssh.target.host if host.ssh.target.port == 22
          else '[' ~ host.ssh.target.host ~ ']:' ~ host.ssh.target.port }} {{ key }}\n{% endfor %}"
    - name: Add the host
      ansible.builtin.add_host:
        name: task-vm-host
        groups: [task_vm_host]
        ansible_host: "{{ host.ssh.target.host }}"
        ansible_user: "{{ host.ssh.target.user }}"
        ansible_port: "{{ host.ssh.target.port }}"
        ansible_ssh_private_key_file: "{{ host.ssh.identity_file }}"

- name: Task VM base
  hosts: task_vm_host
  become: true
  gather_facts: false
  vars:
    incus: [incus, --project, "{{ host.project }}"]
    base: "{{ host.base }}"
  tasks:
    - name: Start the base VM
      tags: [base-start]
      block:
        - name: Read the base VM
          ansible.builtin.command: { argv: "{{ incus + ['list', '--format', 'json', '--', '^' ~ base.vm ~ '$'] }}" }
          register: base_read
          changed_when: false
        # Once per host: a host without a base VM gets it from the stock image that `task-vms:prepare-host` copied and a blank seed volume.
        # The first boot makes the `orbit` account with the key of the Swamp control Node and installs the SSH server; the converge that
        # follows builds everything else, and it builds all of it when no digest is recorded.
        - name: Make the base VM
          when: base_read.stdout | from_json | length == 0
          block:
            # A creation that failed half way leaves the seed; the VM does not exist, so its seed is not in use.
            - name: Remove the seed a failed creation left
              ansible.builtin.command: { argv: "{{ incus + ['storage', 'volume', 'delete', host.pool, base.seed] }}" }
              register: base_seed_delete
              changed_when: base_seed_delete.rc == 0
              failed_when: base_seed_delete.rc != 0 and 'not found' not in base_seed_delete.stderr
            - name: Create the blank seed volume
              ansible.builtin.command:
                argv: "{{ incus + ['storage', 'volume', 'create', host.pool, base.seed, 'size=' ~ base.seed_size, '--type', 'block'] }}"
              changed_when: true
            - name: Create the base VM
              ansible.builtin.command:
                argv: "{{ incus + ['init', '--vm', '--config', 'limits.cpu=' ~ base.cpus, '--config', 'limits.memory=' ~ base.memory,
                       '--device', 'root,size=' ~ base.disk, '--device', 'eth0,network=' ~ host.network, '--device', 'eth0,security.port_isolation=true',
                       '--', host.image, base.vm] }}"
                stdin: "{{ base.launch_config }}"
              changed_when: true
        # The disk name is the one the nested Incus database of the base VM knows its seed pool by. A creation that stopped before it adds it now.
        - name: Attach the seed
          when: "base_read.stdout | from_json | length == 0 or 'topology-seed' not in ((base_read.stdout | from_json | first).devices | default({}))"
          ansible.builtin.command:
            argv: "{{ incus + ['config', 'device', 'add', base.vm, 'topology-seed', 'disk', 'pool=' ~ host.pool, 'source=' ~ base.seed] }}"
          changed_when: true
        # The base is a snapshot, so the project must allow snapshots; `restricted=true` blocks them by default. Only a client of the
        # host's Incus API can take one: a task VM reaches only its guest socket, which cannot, so this opens nothing to a task.
        - name: Read the snapshot rule of the project
          ansible.builtin.command: { argv: [incus, project, get, "{{ host.project }}", restricted.snapshots] }
          register: base_snapshot_rule
          changed_when: false
        - name: Let the project keep snapshots
          when: base_snapshot_rule.stdout | trim != 'allow'
          ansible.builtin.command: { argv: [incus, project, set, "{{ host.project }}", restricted.snapshots=allow] }
          changed_when: true
        - name: Start the base VM
          when: (base_read.stdout | from_json | map(attribute='status') | first | default('Stopped')) != 'Running'
          ansible.builtin.command: { argv: "{{ incus + ['start', '--', base.vm] }}" }
          changed_when: true
        # The first boot of a new base VM takes minutes; a base VM that has run answers at once.
        - name: Wait for its guest agent
          ansible.builtin.command: { argv: "{{ ['timeout', '630'] + incus + ['wait', '--timeout', '600', '--interval', '1', '--', base.vm, 'agent'] }}" }
          changed_when: false
        # A new VM makes its host keys and installs the SSH server in its first boot; a base VM that has booted before returns at once.
        - name: Wait for the first boot
          ansible.builtin.command: { argv: "{{ ['timeout', '320'] + incus + ['exec', base.vm, '--', 'cloud-init', 'status', '--wait'] }}" }
          register: base_cloud_init
          changed_when: false
          failed_when: base_cloud_init.rc not in [0, 2]
        # The nested Swamp runs with the proof Swamp Club key; every task VM copied from the base has it from its first boot.
        - name: Give the base VM the Club key
          no_log: true
          ansible.builtin.command:
            argv: "{{ incus + ['exec', base.vm, '--', 'install', '-D', '-m', '0600', '-o', '1000', '-g', '1000', '/dev/stdin', base.club_key] }}"
            stdin: "{{ lookup('ansible.builtin.env', 'ORBIT_CLUB_KEY') }}"
            stdin_add_newline: false
          changed_when: true

    - name: Snapshot the base VM
      tags: [base-snapshot]
      block:
        - name: Stop the base VM
          ansible.builtin.command: { argv: "{{ incus + ['stop', '--timeout', '120', '--', base.vm] }}" }
          register: base_stop
          changed_when: base_stop.rc == 0
          failed_when: base_stop.rc != 0 and 'already stopped' not in base_stop.stderr
        - name: Snapshot it and its seed
          ansible.builtin.command: { argv: "{{ incus + item }}" }
          loop:
            - [snapshot, create, --reuse, "{{ base.vm }}", "{{ host.snapshot }}"]
            - [storage, volume, snapshot, create, --reuse, "{{ host.pool }}", "{{ base.seed }}", "{{ host.snapshot }}"]
          changed_when: true

    - name: Prune old snapshots
      tags: [base-prune]
      block:
        - name: Read the snapshots
          ansible.builtin.command: { argv: "{{ incus + item }}" }
          loop:
            - [snapshot, list, --format, json, "{{ base.vm }}"]
            - [storage, volume, snapshot, list, --format, json, "{{ host.pool }}", "{{ base.seed }}"]
          register: base_snapshots
          changed_when: false
        # The new base and the recorded one, which becomes `-previous`, stay. A task VM copied from an older one keeps its own clone.
        - name: Remove the other snapshots
          ansible.builtin.command: { argv: "{{ incus + command }}" }
          loop: >-
            {{ (base_snapshots.results[0].stdout | from_json | map(attribute='name') | reject('in', keep) | map('regex_replace', '^', 'vm:') | list)
               + (base_snapshots.results[1].stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | reject('in', keep)
               | map('regex_replace', '^', 'seed:') | list) }}
          vars:
            keep: "{{ [host.snapshot, host.current] | select | list }}"
            command: "{{ ['snapshot', 'delete', base.vm, item[3:]] if item is match('vm:') else
                        ['storage', 'volume', 'snapshot', 'delete', host.pool, base.seed, item[5:]] }}"
          changed_when: true

    - name: Roll the base VM back
      tags: [base-discard]
      block:
        - name: Stop the base VM
          ansible.builtin.command: { argv: "{{ incus + ['stop', '--force', '--', base.vm] }}" }
          register: discard_stop
          changed_when: discard_stop.rc == 0
          failed_when: discard_stop.rc != 0 and 'already stopped' not in discard_stop.stderr and 'not found' not in discard_stop.stderr
        - name: Remove the run's snapshots
          ansible.builtin.command: { argv: "{{ incus + item }}" }
          loop:
            - [snapshot, delete, "{{ base.vm }}", "{{ host.snapshot }}"]
            - [storage, volume, snapshot, delete, "{{ host.pool }}", "{{ base.seed }}", "{{ host.snapshot }}"]
          register: discard_delete
          changed_when: discard_delete.rc == 0
          failed_when: discard_delete.rc != 0 and 'not found' not in discard_delete.stderr
        - name: Roll back to the recorded snapshot
          when: host.current is not none
          ansible.builtin.command: { argv: "{{ incus + item }}" }
          loop:
            - [snapshot, restore, "{{ base.vm }}", "{{ host.current }}"]
            - [storage, volume, snapshot, restore, "{{ host.pool }}", "{{ base.seed }}", "{{ host.current }}"]
          changed_when: true

- name: Task VM slot
  hosts: task_vm_host
  become: true
  gather_facts: false
  vars:
    incus: [incus, --project, "{{ host.project }}"]
    # Named from the VM, so the playbook needs nothing more in the intent than the VM's name.
    identity_volume: "{{ slot.name }}-identity"
  tasks:
    # The identity is on the VM's disk before it boots: a small volume of its own holds the files, and the base's orbit-identity unit
    # applies them before sshd, WireGuard and the agent start (docs/cli/tasks/provision.mmd). The start waits for nothing in the guest.
    - name: Start a VM with its identity
      tags: [start]
      block:
        # A release that failed can leave the slot's VM, seed clone or identity volume; the start makes them new.
        - name: Remove what a failed release left
          ansible.builtin.command: { argv: "{{ incus + item }}" }
          loop:
            - [delete, --force, --, "{{ slot.name }}"]
            - [storage, volume, delete, "{{ host.pool }}", "{{ slot.seed_clone }}"]
            - [storage, volume, delete, "{{ host.pool }}", "{{ identity_volume }}"]
          register: slot_leftover
          changed_when: slot_leftover.rc == 0
          failed_when: slot_leftover.rc != 0 and 'not found' not in slot_leftover.stderr
        - name: Copy the base snapshot
          ansible.builtin.command: { argv: "{{ incus + ['copy', slot.base.vm ~ '/' ~ slot.base.snapshot, slot.name] }}" }
          changed_when: true
        - name: Clone the base seed snapshot
          ansible.builtin.command:
            argv: "{{ ['flock', '--wait', '600', '/run/lock/orbit-task-vm-seed.lock'] + incus
                      + ['storage', 'volume', 'copy', '--', host.pool ~ '/' ~ slot.base.seed ~ '/' ~ slot.base.snapshot, host.pool ~ '/' ~ slot.seed_clone] }}"
          changed_when: true
        - name: Make the identity volume
          ansible.builtin.command: { argv: "{{ incus + ['storage', 'volume', 'create', host.pool, identity_volume, 'size=16MiB'] }}" }
          changed_when: true
        # Each file goes from standard input into the volume at its path in the VM, with its owner and mode; no secret touches the host's disk.
        - name: Write the secret files
          no_log: true
          ansible.builtin.command:
            argv: "{{ incus + ['storage', 'volume', 'file', 'push', '--create-dirs', '--mode', '0600', '--uid', item.owner, '--gid', item.owner, '-',
                   host.pool, identity_volume ~ item.path] }}"
            stdin: "{{ item.content }}"
            stdin_add_newline: false
          loop:
            - { path: /etc/wireguard/orbit.key, content: "{{ lookup('ansible.builtin.env', 'ORBIT_SLOT_WIREGUARD_KEY') }}", owner: "0" }
            - { path: /etc/ssh/ssh_host_ed25519_key, content: "{{ lookup('ansible.builtin.env', 'ORBIT_SLOT_SSH_HOST_KEY') }}", owner: "0" }
            - { path: /etc/orbit/agent/secret, content: "{{ lookup('ansible.builtin.env', 'ORBIT_SLOT_AGENT_SECRET') }}", owner: "0" }
            # The claim's own Pi token and model file, minted at its admission: the first line, then models.json.
            - { path: "{{ slot.pi_home }}/.pi/agent/orbit-token", content: "{{ claim[0] }}", owner: "1000" }
            - { path: "{{ slot.pi_home }}/.pi/agent/models.json", content: "{{ claim[1] }}", owner: "1000" }
          vars:
            claim: "{{ lookup('ansible.builtin.env', 'ORBIT_CLAIM').split('\n', 1) }}"
          changed_when: true
        - name: Write the public files
          ansible.builtin.command:
            argv: "{{ incus + ['storage', 'volume', 'file', 'push', '--create-dirs', '--mode', item.mode, '--uid', '0', '--gid', '0', '-',
                   host.pool, identity_volume ~ item.path] }}"
            stdin: "{{ item.content }}"
            stdin_add_newline: false
          loop:
            - { path: /etc/hostname, content: "{{ slot.name }}\n", mode: "0644" }
            - { path: /etc/ssh/ssh_host_ed25519_key.pub, content: "{{ slot.identity.ssh_host_public_key }}\n", mode: "0644" }
            - { path: /etc/wireguard/orbit.conf, content: "{{ slot.identity.wireguard_config }}", mode: "0600" }
            - { path: /etc/wireguard/orbit.dns-link, content: "{{ slot.identity.dns_marker }}", mode: "0600" }
            - { path: /etc/orbit/agent/config.toml, content: "{{ slot.identity.agent_config }}", mode: "0644" }
            - { path: /etc/orbit/agent/ca.pem, content: "{{ slot.identity.certificate }}", mode: "0644" }
            - { path: /usr/local/share/ca-certificates/orbit-managed-root-ca.crt, content: "{{ slot.identity.certificate }}", mode: "0644" }
            - { path: /etc/systemd/system/orbit-agent.service, content: "{{ slot.identity.agent_unit }}", mode: "0644" }
            - { path: "{{ slot.identity.pi_unit_path }}", content: "{{ slot.identity.pi_unit }}", mode: "0644" }
            # What the orbit-identity unit sets from the files: the name, the firewall and the services (task-vm-boot.yml).
            - path: /etc/orbit/identity.env
              mode: "0644"
              content: "ORBIT_HOSTNAME={{ slot.name }}\nORBIT_PI_UNIT={{ slot.identity.pi_unit_name }}\nORBIT_PI_PORT={{ slot.identity.pi_port }}\n\
                ORBIT_CONTROL_IP={{ slot.identity.control_ip }}\nORBIT_GATEWAY_IP={{ slot.identity.gateway_ip }}\n"
          loop_control: { label: "{{ item.path }}" }
          changed_when: true
        - name: Give the VM its seed clone, its identity and its size
          ansible.builtin.command: { argv: "{{ incus + item }}" }
          loop:
            - [config, device, set, "{{ slot.name }}", topology-seed, "source={{ slot.seed_clone }}"]
            - [config, device, add, "{{ slot.name }}", orbit-identity, disk, "pool={{ host.pool }}", "source={{ identity_volume }}",
               path=/run/orbit-identity, readonly=true]
            - [config, set, "{{ slot.name }}", "limits.cpu={{ slot.cpus }}", "limits.memory={{ slot.memory }}"]
          changed_when: true
        - name: Start the VM
          ansible.builtin.command: { argv: "{{ incus + ['start', '--', slot.name] }}" }
          changed_when: true

    - name: Delete the VM
      tags: [delete]
      ansible.builtin.command: { argv: "{{ incus + item }}" }
      loop:
        - [delete, --force, --, "{{ slot.name }}"]
        - [storage, volume, delete, "{{ host.pool }}", "{{ slot.seed_clone }}"]
        - [storage, volume, delete, "{{ host.pool }}", "{{ identity_volume }}"]
      register: slot_delete
      changed_when: slot_delete.rc == 0
      failed_when: slot_delete.rc != 0 and 'not found' not in slot_delete.stderr
