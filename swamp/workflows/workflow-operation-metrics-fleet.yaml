- name: check-runtime-recovery
  dependsOn:
  - job: create-runtime-volume
    condition:
      type: succeeded
  steps:
  - name: check-runtime-recovery${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-check-runtime-recovery-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os

          before = json.loads(os.environ["ORBIT_CONTAINER_BEFORE"])
          if before["backup"] is not None:
              raise SystemExit("metrics.runtime_recovery_required")
          print('{"ready":true}')
          PYTHON
        env: *id007
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: stop-runtime-container
  dependsOn:
  - job: check-runtime-recovery
    condition:
      type: succeeded
  steps:
  - name: stop-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-stop-runtime-container-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE,ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          before = json.loads(os.environ["ORBIT_CONTAINER_BEFORE"])
          if (
              before["current"] is not None
              and before["current"]["hash"] != before["expected_hash"]
          ):
              subprocess.run(
                  ["/usr/bin/docker", "container", "stop", "--time", "30", "--", v["name"]],
                  check=True,
              )
          PYTHON
        env: *id007
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: preserve-runtime-container
  dependsOn:
  - job: stop-runtime-container
    condition:
      type: succeeded
  steps:
  - name: preserve-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-preserve-runtime-container-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE,ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          before = json.loads(os.environ["ORBIT_CONTAINER_BEFORE"])
          if (
              before["current"] is not None
              and before["current"]["hash"] != before["expected_hash"]
          ):
              subprocess.run(
                  ["/usr/bin/docker", "container", "rename", v["name"], v["backup"]], check=True
              )
          PYTHON
        env: *id007
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: create-runtime-container
  dependsOn:
  - job: preserve-runtime-container
    condition:
      type: succeeded
  steps:
  - name: create-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-create-runtime-container-" + string(inputs.operation_id) + "-" + self.item.key
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE,ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          before = json.loads(os.environ["ORBIT_CONTAINER_BEFORE"])
          if before["current"] is None or before["current"]["hash"] != before["expected_hash"]:
              args = [
                  "/usr/bin/docker",
                  "container",
                  "create",
                  "--pull=never",
                  "--name",
                  v["name"],
                  "--restart",
                  "unless-stopped",
                  "--network",
                  "host",
                  "--log-driver",
                  "json-file",
                  "--log-opt",
                  "max-size=10m",
                  "--log-opt",
                  "max-file=3",
              ]
              for key, value in sorted(v["labels"].items()):
                  args.extend(["--label", key + "=" + value])
              args.extend(
                  [
                      "--label",
                      "com.orbit.metrics.spec-hash=" + before["expected_hash"],
                      "--mount",
                      "type=volume,source=" + v["volume"] + ",target=" + v["mount_target"],
                  ]
              )
              for mount in v["mounts"]:
                  args.extend(["--volume", mount])
              for value in v["environment"]:
                  args.extend(["--env", value])
              args.extend(
                  [
                      "--health-cmd",
                      "wget --no-verbose --tries=1 --spider " + v["health_url"],
                      "--health-start-period",
                      "30s",
                      "--health-interval",
                      "5s",
                      "--health-retries",
                      "12",
                      "--",
                      v["image"],
                      *v["command"],
                  ]
              )
              subprocess.run(args, check=True)
          PYTHON
        env: *id007
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: start-runtime-container
  dependsOn:
  - job: create-runtime-container
    condition:
      type: succeeded
  steps:
  - name: start-runtime-container${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-start-runtime-container-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          subprocess.run(["/usr/bin/docker", "container", "start", "--", v["name"]], check=True)
          PYTHON
        env: *id007
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: verify-runtime-health
  dependsOn:
  - job: start-runtime-container
    condition:
      type: succeeded
  steps:
  - name: verify-runtime-health${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-runtime-health-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          r = subprocess.run(
              [
                  "/usr/bin/docker",
                  "container",
                  "inspect",
                  "--format={{.State.Status}} {{.State.Health.Status}}",
                  "--",
                  v["name"],
              ],
              capture_output=True,
              text=True,
              check=True,
          )
          if r.stdout.strip() != "running healthy":
              raise SystemExit("metrics.runtime_not_healthy")
          print('{"healthy":true}')
          PYTHON
        env: *id006
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: verify-final-credential
  dependsOn:
  - job: verify-runtime-health
    condition:
      type: succeeded
  steps:
  - name: verify-final-credential
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-final-credential-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_GRAFANA_PASSWORD,ORBIT_METRICS_ADDRESS -- /usr/bin/python3 - <<'PYTHON'
          import base64
          import os
          import urllib.error
          import urllib.request

          password = os.environ.pop("ORBIT_GRAFANA_PASSWORD")
          address = os.environ["ORBIT_METRICS_ADDRESS"]
          request = urllib.request.Request(
              "http://" + address + ":3000/api/user",
              headers={
                  "Authorization": "Basic "
                  + base64.b64encode(("admin:" + password).encode()).decode()
              },
          )


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          try:
              with urllib.request.build_opener(
                  urllib.request.ProxyHandler({}), NoRedirect()
              ).open(request, timeout=30) as response:
                  if response.status != 200:
                      raise ValueError()
          except Exception:
              raise SystemExit("metrics.credentials_unverified") from None
          print('{"verified":true}')
          PYTHON
        env: *id005
- name: retire-runtime-backup
  dependsOn:
  - job: verify-final-credential
    condition:
      type: succeeded
  steps:
  - name: retire-runtime-backup${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-retire-runtime-backup-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_CONTAINER_BEFORE,ORBIT_CONTAINER_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          v = json.loads(os.environ["ORBIT_CONTAINER_INTENT"])
          before = json.loads(os.environ["ORBIT_CONTAINER_BEFORE"])
          if (
              before["current"] is not None
              and before["current"]["hash"] != before["expected_hash"]
          ):
              subprocess.run(
                  ["/usr/bin/docker", "container", "rm", "--", v["backup"]], check=True
              )
          print('{"cleaned":true}')
          PYTHON
        env: *id007
    forEach:
      item: item
      in: ${{ steps.read.outputs.containers }}
- name: result
  dependsOn:
  - job: retire-runtime-backup
    condition:
      type: succeeded
  steps:
  - name: summary
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-result-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_NODE_IDS -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os

          ids = [int(value) for value in os.environ["ORBIT_NODE_IDS"].split(",")]
          print(json.dumps({"ready": True, "verified_node_ids": ids, "runtime_committed": True}))
          PYTHON
        env:
          ORBIT_NODE_IDS: ${{ steps.read.outputs.ids.map(id, string(id)).join(",") }}
