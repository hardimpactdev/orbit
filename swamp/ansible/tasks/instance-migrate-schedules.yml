---
# Registered Node timers become local container timers at cutover.
# Capture ALL timers before stopping ANY writer. Rollback restores observed activation, not just desired intent.
- name: Check and capture every Schedule before downtime
  when: phase == 'quiesce' and schedule_phase == 'check' and migrate.schedules | default([]) | length > 0
  block:
    - name: Start the Schedule activation snapshot
      ansible.builtin.set_fact:
        schedule_snapshots: []
    - name: Check the registered Schedule
      ansible.builtin.include_tasks:
        file: instance-migrate-schedule-check.yml
        apply: { tags: [always] }
      loop: "{{ migrate.schedules }}"
      loop_control: { loop_var: schedule, label: "{{ schedule.id }}:{{ schedule.name }}" }
    - name: Save activation states before stopping any timer
      ansible.builtin.copy:
        content: "{{ schedule_snapshots | to_json }}"
        dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/schedule-timers.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      changed_when: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Stop the source Schedules only after all checkout preflights passed
  when: phase == 'quiesce' and schedule_phase == 'stop'
  block:
    - name: Stop and disable the source timers
      ansible.builtin.systemd_service: { name: "{{ item.timer }}", state: stopped, enabled: false }
      loop: "{{ migrate.schedules }}"
      loop_control: { label: "{{ item.id }}:{{ item.name }}" }
    - name: Stop active Schedule services before copying
      ansible.builtin.systemd_service: { name: "{{ item.service }}", state: stopped }
      loop: "{{ migrate.schedules }}"
      loop_control: { label: "{{ item.id }}:{{ item.name }}" }

# This include runs only after discard has removed the failed container. No unit file was changed before cutover.
# A persistent fire before terminal projection is recorded as a waiting Operation and replayed when admission reopens.
- name: Restore the source timers' captured activation states
  when: phase == 'restore'
  ansible.builtin.systemd_service:
    name: "{{ item.schedule.timer }}"
    enabled: "{{ item.enabled }}"
    state: "{{ 'started' if item.active else 'stopped' }}"
  loop: >-
    {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/schedule-timers.json', errors='ignore')
       | default('[]', true) | from_json }}
  loop_control: { label: "{{ item.schedule.id }}:{{ item.schedule.name }}" }

# A failed install is before cutover: the normal restore removes the container then resumes the captured host timers.
- name: Install the container Schedules disabled
  when: phase == 'processes'
  ansible.builtin.include_tasks:
    file: instance-migrate-schedule-check.yml
    apply: { tags: [always] }
  loop: "{{ migrate.schedules | default([]) }}"
  loop_control: { loop_var: schedule, label: "{{ schedule.id }}:{{ schedule.name }}" }

# Cutover already happened. No Schedule error can fail retirement or invoke restore.
- name: Activate and retire each carried Schedule
  when: phase == 'retire'
  ansible.builtin.include_tasks:
    file: instance-migrate-schedule-check.yml
    apply: { tags: [always] }
  loop: "{{ migrate.schedules | default([]) }}"
  loop_control: { loop_var: schedule, label: "{{ schedule.id }}:{{ schedule.name }}" }

- name: Keep the named Schedule outcomes
  when: phase == 'retire'
  ansible.builtin.copy:
    content: "{{ {'schedules': schedule_outcomes | default([])} | to_json }}"
    dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/schedule-result.json"
    mode: "0600"
  failed_when: false
  delegate_to: localhost
  become: false
  changed_when: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
