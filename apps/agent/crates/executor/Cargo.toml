[package]
name = "orbit-executor"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "The Orbit executor: runs Gateway-signed orders on a Node; a mode of orbit-agent (ADR 0266, ADR 0267, ADR 0271)"

[lib]
path = "src/lib.rs"

# Until the pinned delivery carries an `orbit-agent` with the `execute` mode (ADR 0271 N7); the next pull request removes it.
[[bin]]
name = "orbit-executor"
path = "src/main.rs"

[dependencies]
orbit-executor-core = { path = "../executor-core" }

orbit-executor-power = { path = "../power" }
orbit-executor-firewall = { path = "../firewall" }
orbit-executor-route = { path = "../route" }
orbit-executor-dns = { path = "../dns" }
orbit-executor-instance = { path = "../instance" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
async-nats = { version = "=0.51.0", default-features = false, features = ["ring", "jetstream", "nuid", "server_2_14"] }

[lints]
workspace = true
