id: c1adc889-3366-40d0-bcf7-099179e97093
name: group-run
description: >-
  One admitted generation of one task group. Its drive hands the group to the next
  generation, which waits a minute first when this one waited on a Gateway operation.
autoResume: true
inputs:
  type: object
  properties:
    workItem: { type: string }
    factory: { type: string }
    generation: { type: integer }
    key: { type: string }
    definition: { type: string }
    preapprovalModel: { type: string }
    # busy: the previous generation waited on a running Gateway operation.
    pace: { type: string, enum: [none, busy], default: none }
  required: [workItem, factory, generation, key, definition, preapprovalModel]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: group
    steps:
      - name: claim
        guard: '${{ false }}'
        labels: {role: swamp}
        task:
          type: behavior
          behavior: '${{ inputs.definition }}'
          methodName: claim
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: '${{ inputs.factory }}'
            generation: '${{ inputs.generation }}'
            key: '${{ inputs.key }}'
            runId: '${{ run.id }}'
      # Look again in a minute, or at once when an event wakes this wait.
      - name: wait
        dependsOn: [{ step: claim, condition: { type: succeeded } }]
        guard: '${{ !steps.claim.outputs.admitted || inputs.pace != "busy" }}'
        allowFailure: true
        labels: {role: swamp}
        task:
          type: wait_for_signal
          timeout: 60
          schema:
            type: object
            additionalProperties: false
      - name: drive
        dependsOn:
          - { step: claim, condition: { type: succeeded } }
          - { step: wait, condition: { type: or, conditions: [{ type: completed }, { type: skipped }] } }
        guard: '${{ !steps.claim.outputs.admitted }}'
        labels: {role: swamp}
        task:
          type: behavior
          behavior: '${{ inputs.definition }}'
          methodName: drive
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: '${{ inputs.factory }}'
            generation: '${{ inputs.generation }}'
            key: '${{ inputs.key }}'
            runId: '${{ run.id }}'
