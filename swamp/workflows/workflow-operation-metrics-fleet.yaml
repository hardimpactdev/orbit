- name: verify-fpm-exporter
  dependsOn:
  - job: admit-service-allow
    condition:
      type: succeeded
  steps:
  - name: verify-fpm-exporter${{ string(self.item.node_id) }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-verify-fpm-exporter-" + string(inputs.operation_id) + "-" + string(self.item.node_id)
        }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n --preserve-env=ORBIT_SERVICE_INTENT -- /usr/bin/python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess

          v = json.loads(os.environ["ORBIT_SERVICE_INTENT"])
          root = pathlib.Path("/")
          for path, key in [
              ("etc/orbit/service-metrics/fpm.yml", "config"),
              ("etc/systemd/system/orbit-fpm-exporter.service", "unit"),
          ]:
              p = root / path
              content = p.read_text() if p.exists() else None
              if content != v[key]:
                  raise SystemExit("metrics.service_unverified")
          for property_name, key in [("is-active", "active"), ("is-enabled", "enabled")]:
              reply = subprocess.run(
                  ["/usr/bin/systemctl", property_name, "orbit-fpm-exporter"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if key == "active":
                  if not (
                      (reply.returncode == 0 and reply.stdout.strip() == "active")
                      or (
                          reply.returncode != 0
                          and reply.stdout.strip() in ("inactive", "failed", "unknown")
                      )
                  ):
                      raise SystemExit("metrics.service_unverified")
              else:
                  if not (
                      (reply.returncode == 0 and reply.stdout.strip() == "enabled")
                      or (
                          reply.returncode != 0
                          and reply.stdout.strip() in ("disabled", "masked", "not-found")
                      )
                  ):
                      raise SystemExit("metrics.service_unverified")
              if (reply.returncode == 0) != v[key]:
                  raise SystemExit("metrics.service_unverified")
          print('{"verified":true}')
          PYTHON
        env: *id004
    forEach:
      item: item
      in: ${{ steps.read.outputs.services }}
- name: remove-cadvisor-binary
  dependsOn:
  - job: verify-fpm-exporter
    condition:
      type: succeeded
  steps:
  - name: remove-cadvisor-binary${{ self.item.key }}
    target: ${{ "orbit-node-" + string(self.item.node_id) }}
    labels:
      node: ${{ string(self.item.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "metrics-remove-cadvisor-binary-" + string(inputs.operation_id) + "-" + self.item.key }}
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - <<'PYTHON'
          import hashlib
          import pathlib
          import stat

          root = pathlib.Path("/")
          p = root / "usr/local/bin/orbit-cadvisor"
          for parent in [*reversed([q for q in p.parents if q == root or root in q.parents]), p]:
              try:
                  st = parent.lstat()
              except FileNotFoundError:
                  continue
              if (
                  stat.S_ISLNK(st.st_mode)
                  or st.st_uid != 0
                  or st.st_mode & 0o022
                  or (parent != p and not stat.S_ISDIR(st.st_mode))
              ):
                  raise SystemExit("metrics.binary_ownership_drift")
          if p.exists():
              if not p.is_file():
                  raise SystemExit("metrics.binary_ownership_drift")
              with p.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              if digest != "6f258bed28113218c88729634c47ead8d928b81b1504b75fd911b98d29003a87":
                  raise SystemExit("metrics.binary_ownership_drift")
              p.unlink()
          print('{"removed":true}')
          PYTHON
    forEach:
      item: item
      in: ${{ steps.read.outputs.exporters }}
    guard: ${{ self.item.kind != "cadvisor" || self.item.selected }}
