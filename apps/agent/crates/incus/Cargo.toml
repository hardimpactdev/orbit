[package]
name = "orbit-executor-incus"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Incus primitives of the Orbit executor through the Incus REST API over its unix socket: instances, network ACLs, instance devices and storage volumes (ADR 0271 N3)"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
