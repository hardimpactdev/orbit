---
# One Node entry, two batched guest commands; shared with the native clone launch.
- name: Apply and check the admitted mail setup
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_mail.py') }}"
      - "{{ container | to_json }}"
      - >-
        {{ {'mail': lookup('ansible.builtin.file', playbook_dir ~ '/instance_mail.py'),
            'bridge': lookup('ansible.builtin.file', playbook_dir ~ '/instance_bridge.py')} | to_json }}
  register: mail_apply
  failed_when: false
  changed_when: mail_apply.rc == 0 and (mail_apply.stdout | from_json).status == 'applied'

- name: Require the admitted mail setup
  ansible.builtin.assert:
    that: mail_apply.rc == 0
    fail_msg: "{{ mail_apply.stderr if mail_apply.stderr in ['process.target_inactive', 'instance.host_unavailable'] else 'instance.mail_update_failed' }}"
    quiet: true

- name: Retain the public mail result
  ansible.builtin.set_fact:
    mail_result: "{{ mail_apply.stdout | from_json }}"

- name: Report the public mail outcome
  ansible.builtin.debug:
    msg: "orbit-mail={{ mail_result.status }}{{ (':' ~ mail_result.reason) if mail_result.reason is defined else '' }}"
