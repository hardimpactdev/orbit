id: ca5ceca0-f7da-4338-a1dd-196e06c64cd7
name: operation-route-target-set
description: "Route target set in the chart's steps; Node work through official cfgmgmt and SSH behaviors (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: route.target_set}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: update
  labels: {role: swamp}
  steps:
    # Per leaf: a Node-local key and its public CSR (route-create-csr).
  - name: 'Make CSRs on new Nodes'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-csr
      inputs:
        intent: '${{ inputs.intent }}'
        leaf: '${{ self.leaf }}'
    # Per leaf: 209 has the CSR signed; the one Gateway call (route-create-sign).
  - name: 'Sign the CSRs'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: leaf, in: '${{ inputs.intent.leaf_indexes }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        parent_run_id: '${{ run.id }}'
        leaf: '${{ inputs.intent.leaves[self.leaf] }}'
        request: '${{ steps["Make CSRs on new Nodes-" + string(self.leaf)].outputs.csr.stdout }}'
    # Development target: route:create's site steps move the published site (route-create-site).
  - name: 'Install cert, publish site'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.publish.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.publish }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSRs-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
    # Production set: each new target Node gets its LAN rule, certificates, staged site and .env (route-target-stage).
  - name: 'Stage the new targets'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.stage.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-stage
      inputs:
        intent: '${{ inputs.intent.stage }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSRs-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
    # From 209 to each new target on 443 with the Route domain as SNI; a failed chain fails the step.
  - name: 'Probe each new target'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Stage the new targets', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: probe, in: '${{ inputs.intent.probes }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "route-target-probe-209-" + string(self.probe.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "route-target-probe-209-" + string(self.probe.node_id) }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.probe_ssh.target.user }}'
          port: '${{ inputs.intent.probe_ssh.target.port }}'
          identityFile: '${{ inputs.intent.probe_ssh.identity_file }}'
        hosts:
        - name: control
          address: '${{ inputs.intent.probe_ssh.target.host }}'
          transport: {hostKeys: '${{ inputs.intent.probe_ssh.target.host_keys }}'}
      inputs:
        hosts: name:control
        argv: '${{ ["timeout", "20", "openssl", "s_client", "-no_ign_eof", "-connect", self.probe.address + ":443", "-servername", self.probe.domain, "-verify_hostname", self.probe.domain, "-verify_return_error", "-CAfile", "/usr/local/share/ca-certificates/orbit-managed-root-ca.crt"] }}'
        timeoutSec: 30
    # The Router's whole Caddyfile with the new pool, validated, then reloaded (route-create-site).
  - name: 'Switch the Router pool'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Stage the new targets', condition: {type: always}}
    - {step: 'Probe each new target', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.router.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.router }}'
        node_id: '${{ self.node.node_id }}'
        signed: []
        execution_secrets: '${{ inputs.execution_secrets }}'
    # Each Node drops the sites, LAN rules and temporary certificates no Route needs (route-target-retire).
  - name: 'Retire detached targets'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Stage the new targets', condition: {type: always}}
    - {step: 'Probe each new target', condition: {type: always}}
    - {step: 'Switch the Router pool', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-retire
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ run.id }}'
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
        signed: '${{ inputs.intent.leaf_indexes.map(i, steps["Sign the CSRs-" + string(i)].outputs.sign.stdout) }}'
        execution_secrets: '${{ inputs.execution_secrets }}'
    # Only a Node-scoped Route outside the TLD: the whole private DNS, written by the dns-publish phase.
  - name: 'Move private DNS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Make CSRs on new Nodes', condition: {type: always}}
    - {step: 'Sign the CSRs', condition: {type: always}}
    - {step: 'Install cert, publish site', condition: {type: always}}
    - {step: 'Stage the new targets', condition: {type: always}}
    - {step: 'Probe each new target', condition: {type: always}}
    - {step: 'Switch the Router pool', condition: {type: always}}
    - {step: 'Retire detached targets', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: vpn, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: dns-publish
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ self.vpn.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          node_id: '${{ self.vpn.node_id }}'
          connection:
            nodeHost: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host }}'
            nodeUser: '${{ inputs.intent.nodes[string(self.vpn.node_id)].user }}'
            nodePort: '${{ inputs.intent.nodes[string(self.vpn.node_id)].port }}'
            nodeIdentityFile: '${{ inputs.intent.nodes[string(self.vpn.node_id)].identity_file }}'
            become: true
          host_keys: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host_keys }}'
          dns: '${{ self.vpn.dns }}'
        execution_secrets: {}
