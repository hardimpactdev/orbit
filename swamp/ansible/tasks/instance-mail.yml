---
# Reusable by the explicit repair command and the lifecycle callers. No general env:sync or template rewriting.
- name: Read the named container
  ansible.builtin.command:
    argv: [incus, query, --, "/1.0/instances/{{ mail.name }}?project={{ mail.project }}"]
  register: mail_container
  changed_when: false
  failed_when: false

- name: Require a running container
  ansible.builtin.assert:
    that: mail_container.rc == 0 and (mail_container.stdout | from_json).status == 'Running'
    fail_msg: process.target_inactive
    quiet: true

- name: Name the scoped mail command
  ansible.builtin.set_fact:
    mail_exec: "{{ ['incus', 'exec', '--project', mail.project, mail.name, '--'] }}"

- name: Apply only owned mail keys
  ansible.builtin.command:
    argv: >-
      {{ mail_exec + ['php', '-r',
         (lookup('ansible.builtin.env', 'ORBIT_MAIL_RESOLVER') | replace('<?php', ''))
         ~ (lookup('ansible.builtin.file', playbook_dir ~ '/instance_mail.php') | replace('<?php', ''))] }}
    stdin: "{{ mail | to_json }}"
  register: mail_edit
  changed_when: mail_edit.rc == 0 and (mail_edit.stdout | from_json).changed
  failed_when: false
  no_log: true

- name: Require a rendered mail file
  ansible.builtin.assert:
    that: mail_edit.rc == 0
    fail_msg: env.configuration_invalid
    quiet: true

- name: Keep the public mail result
  ansible.builtin.set_fact:
    mail_result: "{{ mail_edit.stdout | from_json }}"

- name: Refresh the changed Instance
  when: mail_result.get('changed_key_count', 0) | int > 0
  block:
    - name: Clear Laravel config cache
      when: mail.laravel
      ansible.builtin.command:
        argv: "{{ mail_exec + ['runuser', '-u', 'orbit', '--', 'php', mail.application ~ '/artisan', 'config:clear', '--no-interaction'] }}"
        chdir: /
      changed_when: true
      no_log: true

    - name: Read the Instance unit states
      ansible.builtin.command:
        argv: "{{ mail_exec + ['systemctl', 'is-active', '--', item] }}"
      loop: "{{ mail.units }}"
      register: mail_units
      changed_when: false
      failed_when: false

    - name: Restart only its running units
      ansible.builtin.command:
        argv: "{{ mail_exec + ['systemctl', 'restart', '--no-block', '--', item.item] }}"
      loop: "{{ mail_units.results }}"
      when: item.rc == 0 and item.stdout | trim == 'active'
      changed_when: true

    - name: Check the restarted units
      ansible.builtin.command:
        argv: "{{ mail_exec + ['systemctl', 'show', '--property=ActiveState', '--property=Job', '--', item.item] }}"
      loop: "{{ mail_units.results }}"
      when: item.rc == 0 and item.stdout | trim == 'active'
      register: mail_ready
      changed_when: false
      until: mail_ready.rc == 0 and 'ActiveState=active' in mail_ready.stdout_lines and 'Job=' in mail_ready.stdout_lines
      retries: 10
      delay: 1
