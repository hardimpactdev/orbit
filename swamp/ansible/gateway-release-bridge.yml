---
# Public intent was captured by the candidate Gateway, not by an older admitting release.
- name: Address the Instance hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    bridge_release: "{{ (lookup('ansible.builtin.file', run ~ '/intent.json') | from_json).bridge_release_json | from_json }}"
  tasks:
    - name: Read the shipped helper checksum
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/instance_bridge.py"
        checksum_algorithm: sha256
      register: bridge_source
    - name: Bind the shipped helper to the candidate release
      ansible.builtin.assert:
        that: bridge_source.stat.checksum == bridge_release.sha256
        quiet: true
        fail_msg: gateway.release_bridge_checksum_mismatch
    - name: Pin the captured Node host keys
      ansible.builtin.known_hosts:
        path: "{{ run }}/known_hosts"
        name: "{{ item.0.host if item.0.port == 22 else '[' ~ item.0.host ~ ']:' ~ item.0.port }}"
        key: "{{ item.0.host if item.0.port == 22 else '[' ~ item.0.host ~ ']:' ~ item.0.port }} {{ item.1 }}"
        state: present
      loop: "{{ bridge_release.nodes | subelements('host_keys') }}"
      loop_control: {label: "{{ item.0.node_id }}"}
    - name: Address every captured Node
      ansible.builtin.add_host:
        name: "bridge_{{ item.node_id }}"
        groups: [bridge_release_hosts]
        ansible_host: "{{ item.host }}"
        ansible_user: "{{ item.user }}"
        ansible_port: "{{ item.port }}"
        ansible_ssh_private_key_file: "{{ item.identity_file }}"
        ansible_ssh_common_args: "-o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile={{ run }}/known_hosts"
        ansible_ssh_retries: 0
        ansible_timeout: 5
      loop: "{{ bridge_release.nodes }}"
      loop_control: {label: "{{ item.node_id }}"}

- name: Publish the candidate bridge helper
  hosts: bridge_release_hosts
  become: true
  gather_facts: false
  ignore_unreachable: true
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    bridge_release: "{{ (lookup('ansible.builtin.file', run ~ '/intent.json') | from_json).bridge_release_json | from_json }}"
    bridge_release_unit: /etc/systemd/system/orbit-instance-bridge-refresh.service
    bridge_release_path: /usr/local/libexec/orbit-instance-bridge
  tasks:
    - name: Read the existing refresh unit
      ansible.builtin.stat:
        path: "{{ bridge_release_unit }}"
        get_checksum: false
      register: bridge_refresh
    - name: Publish only where the refresh unit exists
      when: bridge_refresh.stat.exists | default(false)
      block:
        # copy defaults to atomic replacement. Never permit truncation of an executing Python source.
        - name: Install the exact candidate helper atomically
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/instance_bridge.py"
            dest: "{{ bridge_release_path }}"
            mode: '0755'
            unsafe_writes: false
          register: bridge_delivery
        - name: Read the installed helper checksum
          when: not (bridge_delivery.unreachable | default(false))
          ansible.builtin.stat:
            path: "{{ bridge_release_path }}"
            checksum_algorithm: sha256
          register: bridge_installed
        - name: Verify the helper follows the candidate release
          when: not (bridge_delivery.unreachable | default(false)) and not (bridge_installed.unreachable | default(false))
          ansible.builtin.assert:
            that: bridge_installed.stat.checksum == bridge_release.sha256
            quiet: true
            fail_msg: gateway.release_bridge_checksum_mismatch
