id: b6db2e34-cc2c-43f0-a68e-14ae79a54e32
name: operation-fleet-recipe-pr
description: One native recipe PR DAG on209; public intent, exact scoped mint and one GitHub write per step.
vaults: []
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      const: 209
    kind:
      type: string
      enum:
      - fleet.recipe_pr
    intent:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
jobs:
- name: github
  steps:
  - name: prepare
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-prepare-" + run.id }}
      methodName: prepare
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        run_id: ${{ run.id }}
  - name: branch
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-branch-" + run.id }}
      methodName: branch
      inputs: &id001
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        run_id: ${{ run.id }}
        plan: ${{ steps.prepare.outputs }}
    dependsOn:
    - step: prepare
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "open" }}
  - name: file
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-file-" + run.id }}
      methodName: file
      inputs: *id001
    dependsOn:
    - step: branch
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "open" }}
  - name: pull
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-pull-" + run.id }}
      methodName: pull
      inputs: *id001
    dependsOn:
    - step: file
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "open" }}
  - name: tree
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-tree-" + run.id }}
      methodName: tree
      inputs: *id001
    dependsOn:
    - step: pull
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "update" }}
  - name: commit
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-commit-" + run.id }}
      methodName: commit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        run_id: ${{ run.id }}
        plan: ${{ steps.prepare.outputs }}
        tree: ${{ steps.tree.outputs.sha }}
    dependsOn:
    - step: tree
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "update" }}
  - name: ref
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-ref-" + run.id }}
      methodName: ref
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        run_id: ${{ run.id }}
        plan: ${{ steps.prepare.outputs }}
        commit: ${{ steps.commit.outputs.sha }}
    dependsOn:
    - step: commit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "update" }}
  - name: close
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-close-" + run.id }}
      methodName: close
      inputs: *id001
    dependsOn:
    - step: ref
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "close" }}
  - name: merge
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-merge-" + run.id }}
      methodName: merge
      inputs: *id001
    dependsOn:
    - step: close
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.prepare.outputs.action != "merge" }}
  - name: comment
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-comment-" + run.id }}
      methodName: comment
      inputs: *id001
    dependsOn:
    - step: merge
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !has(steps.prepare.outputs.comment) }}
    allowFailure: true
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: ${{ "recipe-pr-result-" + run.id }}
      methodName: result
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        run_id: ${{ run.id }}
        plan: ${{ steps.prepare.outputs }}
        url: '${{ steps.prepare.outputs.action == "open" ? steps.pull.outputs.url : "" }}'
    dependsOn:
    - step: comment
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
        - type: failed
