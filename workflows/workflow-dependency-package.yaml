id: f6396e8f-001e-48d0-8f89-5ac76037381b
name: dependency-package
tags: {}
description: Admit one explicit package target and reconcile its existing per-group owner.
inputs:
  properties:
    workItem: { type: string }
    path: { type: string }
    manager: { type: string, enum: [composer, js] }
    package: { type: string }
    version: { type: string }
    purpose: { type: string, enum: [major, security] }
    advisoryUrls: { type: array, items: { type: string }, default: [] }
    advisories: { type: array, items: { type: string }, default: [] }
  required: [workItem, manager, package, version, purpose]
jobs:
  - name: tick
    steps:
      - name: admit
        task:
          type: model_method
          modelIdOrName: orbit-gateway
          methodName: admit_package
          inputs: '${{ inputs }}'
      - name: reconcile
        dependsOn:
          - step: admit
            condition: { type: succeeded }
        task:
          type: workflow
          workflowIdOrName: group-supervise
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: dependency-package
            preapprovalModel: orbit-driver-package
