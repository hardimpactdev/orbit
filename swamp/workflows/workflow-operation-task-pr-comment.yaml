id: 3b6f1c0e-5d42-4c8a-9a57-2f0e8d7b1c94
name: operation-task-pr-comment
description: Post one admitted comment on a task pull request as the Orbit App, with native GitHub commands.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.pr_comment]}
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        group_id:
          type: integer
          minimum: 1
        pr_number:
          type: integer
          minimum: 1
        repository:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        head_sha:
          type: string
          minLength: 1
          pattern: ^[a-f0-9]{40}$
        body:
          type: string
          minLength: 1
          maxLength: 9000
      required:
      - node_id
      - project_id
      - group_id
      - pr_number
      - repository
      - head_sha
      - body
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        write_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^pr-comment-write-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - write_token
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
vaults:
- orbit-control-inputs
jobs:
- name: comment
  labels:
    role: swamp
  steps:
  - name: Mint the token
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "pr-comment-mint" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 60 --max-filesize 65536 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_MINT_REQUEST\" \"$ORBIT_MINT_URL\"\n"
        env:
          ORBIT_MINT_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/github-token" }}
          ORBIT_MINT_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\",\"purpose\":\"pull_request\"}" }}'
  - name: Read the PR
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "pr-comment-read" }}
      methodName: execute
      inputs:
        run: |
          timeout 60 gh api "$ORBIT_PATH" --jq '[.state, .head.sha] | join(" ")'
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.write_token.vault, inputs.execution_secrets.write_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-pr-comment-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_PATH: ${{ "repos/" + inputs.intent.repository + "/pulls/" + string(inputs.intent.pr_number) }}
    dependsOn:
    - step: Mint the token
      condition:
        type: succeeded
  - name: Check the PR head
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: assert
      expr: 'steps["Read the PR"].outputs.stdout.trim() == "open " + inputs.intent.head_sha'
      message: tasks_pr.head_moved
      severity: high
    dependsOn:
    - step: Read the PR
      condition:
        type: succeeded
  - name: Post the comment
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "pr-comment-post" }}
      methodName: execute
      inputs:
        run: |
          timeout 60 gh api --method POST "$ORBIT_PATH" -f "body=$ORBIT_BODY" --jq '{comment: .id}'
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.write_token.vault, inputs.execution_secrets.write_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-pr-comment-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_PATH: ${{ "repos/" + inputs.intent.repository + "/issues/" + string(inputs.intent.pr_number) + "/comments" }}
          ORBIT_BODY: ${{ inputs.intent.body }}
    dependsOn:
    - step: Check the PR head
      condition:
        type: succeeded
    writes: true
- name: cleanup
  labels:
    role: swamp
  dependsOn:
  - job: comment
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  steps:
  - name: Revoke the token
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "pr-comment-revoke" }}
      methodName: execute
      inputs:
        run: timeout 30 gh api --method DELETE installation/token >/dev/null 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.write_token.vault, inputs.execution_secrets.write_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-pr-comment-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    guard: ${{ !("Mint the token" in steps && steps["Mint the token"].status == "succeeded") }}
    writes: true
    allowFailure: true
  - name: Remove CLI config
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "pr-comment-cleanup" }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_GH_DIRECTORY"
        env:
          ORBIT_GH_DIRECTORY: ${{ "/tmp/orbit-pr-comment-" + run.id + "-gh" }}
    writes: true
  - name: Confirm the comment step
    labels:
      role: swamp
    queueTimeout: 30
    task:
      type: assert
      expr: '"Post the comment" in steps && steps["Post the comment"].status == "succeeded" && steps["Remove CLI config"].status == "succeeded"'
      message: tasks_pr.comment_refused
      severity: high
    dependsOn:
    - step: Revoke the token
      condition:
        type: completed
    - step: Remove CLI config
      condition:
        type: completed
