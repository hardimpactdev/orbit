id: 611f677a-01ac-4d78-8677-36747ee90bd5
name: operation-routes
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "0,30 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-routes-discovery
          methodName: discover
          inputs:
            family: operation-routes
            kinds: ["route.workload_prepare", "route.offline_residue_clean", "route.withdraw_instance", "route.cleanup_instance", "route.lan_converge", "route.public_firewall", "route.shared_php_withdraw", "route.transfer_php_withdraw", "route.transfer_lan_remove", "route.analytics_publish", "route.analytics_remove", "route.analytics_host_prepare", "route.analytics_host_withdraw", "route.workload_firewall", "route.create", "route.converge", "route.withdraw", "route.destroy", "route.update", "route.target_set", "route.target_unset", "route.retire_source", "cluster.router_set", "cluster.router_unset", "route.router_lan_retire"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-routes'
          behaviorName: '${{ "operation-routes-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: '${{ self.work.kind }}'
            worker: '${{ self.work.worker }}'
