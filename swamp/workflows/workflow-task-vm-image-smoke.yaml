id: 3e658a5b-d35f-4a51-8cc9-a40e481a8439
name: task-vm-image-smoke
description: Boot a throwaway VM from the published candidate on its Incus host and run the check phase of the task VM role on it.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.image_build]}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: launch
  labels: {role: swamp}
  steps:
    # `incus init` reads the instance config (the cloud-init key and its drive) from stdin, then the VM starts.
  - name: Boot a copy
    labels: {role: swamp}
    writes: true
    concurrency: 1
    forEach:
      item: change
      in: '${{ [{"argv": ["incus", "init", "--vm", "--project", inputs.intent.project, "--config", "limits.cpu=" + string(inputs.intent.cpus), "--config", "limits.memory=" + inputs.intent.memory, "--device", "root,size=" + inputs.intent.disk, "--device", "eth0,network=" + inputs.intent.network, "--device", "eth0,security.port_isolation=true", "--", inputs.intent.candidate_alias, inputs.intent.smoke], "stdin": inputs.intent.launch_config}, {"argv": ["incus", "start", "--project", inputs.intent.project, "--", inputs.intent.smoke], "stdin": ""}] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-smoke-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-smoke-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: '${{ ["timeout", "180"] + self.change.argv }}'
        stdin: ${{ self.change.stdin }}
        timeoutSec: 200
- name: wait
  labels: {role: swamp}
  dependsOn:
  - {job: launch, condition: {type: succeeded}}
  steps:
  - name: Wait for the copy
    labels: {role: swamp}
    concurrency: 1
    forEach:
      item: wait
      in: '${{ [["incus", "wait", "--project", inputs.intent.project, "--timeout", "600", "--", inputs.intent.smoke, "agent"], ["incus", "exec", "--project", inputs.intent.project, "--", inputs.intent.smoke, "cloud-init", "status", "--wait"]] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-image-smoke-wait-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-image-smoke-wait-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: '${{ ["timeout", "660"] + self.wait }}'
        timeoutSec: 700
- name: check
  labels: {role: swamp}
  dependsOn:
  - {job: wait, condition: {type: succeeded}}
  steps:
  - name: Run the check phase
    labels: {role: swamp}
    writes: true
    task:
      type: workflow
      workflowIdOrName: task-vm-image-ansible
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ${{ inputs.intent.smoke }}
        tags: check
        with_pi: false
