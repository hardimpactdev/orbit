---
# The machine bus's server on the Gateway host (ADR 0271; docs/reference/gateway-engine.md#install): the pinned nats-server
# binary, from the release tarball whose SHA-256 the Gateway pins. The role's runtime files and units carry its configuration and
# its service; this phase only puts the binary and its user in place before those units start.
- name: Ensure the nats user
  ansible.builtin.user: { name: nats, system: true, create_home: false, home: /nonexistent, shell: /usr/sbin/nologin, state: present }
- name: Ensure the artifact cache
  ansible.builtin.file: { path: /var/cache/orbit, state: directory, owner: root, group: root, mode: "0755" }
- name: Fetch the pinned nats-server release
  ansible.builtin.include_tasks: artifact-fetch.yml
  vars: { artifact: "{{ rt.gateway.nats }}" }
- name: Unpack the pinned nats-server release into its own folder
  ansible.builtin.unarchive:
    src: "{{ rt.gateway.nats.path }}"
    dest: /usr/local/lib
    remote_src: true
    owner: root
    group: root
    creates: "/usr/local/lib/nats-server-v{{ rt.gateway.nats.version }}-linux-amd64/nats-server"
# A new version moves the link, which restarts the server.
- name: Link the nats-server binary to the pinned release
  ansible.builtin.file:
    src: "/usr/local/lib/nats-server-v{{ rt.gateway.nats.version }}-linux-amd64/nats-server"
    dest: "{{ rt.gateway.nats.binary }}"
    state: link
    force: true
  register: nats_binary
- name: Restart nats-server for a new binary # noqa no-handler
  when: nats_binary is changed
  ansible.builtin.systemd: { name: nats-server.service, state: restarted }
  failed_when: false
