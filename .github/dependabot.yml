version: 2

# One pull request a day bundles every update, so the self-hosted runners
# see one CI run instead of a burst of one run per package.
# See the Dependencies section of docs/contributor-guide.md.
multi-ecosystem-groups:
  daily:
    schedule:
      interval: daily

updates:
  - package-ecosystem: composer
    directory: /apps/cli
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: composer
    directory: /apps/gateway
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: composer
    directory: /apps/docs
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: composer
    directory: /packages/php-sdk
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: bun
    directory: /apps/web
    # Version bumps must also move the Vite core alias and runner overrides.
    ignore:
      - dependency-name: vite-plus
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: bun
    directory: /apps/desktop
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    patterns: ["*"]
    multi-ecosystem-group: daily
