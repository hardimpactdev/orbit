name: CI

on:
  pull_request:
  push:
    branches: [main, 'task-*-handoff']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"},"bearer":{"codeload.github.com":"${{ github.token }}"}}'
  CARGO_BUILD_JOBS: '4'

jobs:
  php:
    name: PHP syntax and Composer
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Validate Composer metadata
        run: git ls-files -z '*composer.json' | xargs -0 -I '{}' composer validate --strict --no-check-publish '{}'
      - name: Check changed PHP syntax
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=$(git merge-base origin/main HEAD); fi
          git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- '*.php' | xargs -0 -r -n 1 -P 4 php -l

  cli:
    name: CLI build
    uses: ./.github/workflows/orbit-cli-binary.yml
    with:
      commit: ${{ github.sha }}
      version: ''

  docs:
    name: Docs build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Install Docs dependencies
        run: composer install --working-dir=apps/docs --no-interaction --prefer-dist --no-dev
      - name: Build and check the documentation index
        run: |
          composer docs-build
          composer docs-lint

  api-reference:
    name: Generated contracts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/php
        with:
          coverage: none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install generator dependencies
        run: |
          cp apps/gateway/.env.example apps/gateway/.env
          composer install --working-dir=apps/gateway --no-interaction --prefer-dist --no-dev
          bun install --cwd apps/web --frozen-lockfile
      - name: Check OpenAPI and MCP tools
        run: |
          bin/docs-openapi --check
          bin/mcp-tools --check
      - name: Generate web schema
        run: bun run --cwd apps/web types

  web:
    name: Web build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: ./.github/actions/php
        with:
          coverage: none
      - name: Build API contracts
        working-directory: .
        run: composer install --working-dir=apps/gateway --no-dev --no-interaction --prefer-dist
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build && test -s dist/index.html && test -s dist/version.json
      - name: Publish web build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  changes:
    name: Select agent delivery
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.agent.outputs.build }}
      release: ${{ steps.agent.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the published agent source
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/ci-agent-delivery select --github-output "$GITHUB_OUTPUT"

  agent:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Build Linux agent
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/agent
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
    - name: Restore Rust caches
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: apps/agent
    - name: Install cross compiler
      run: command -v cross >/dev/null || cargo install cross --locked
    - name: Build the agent delivery
      run: scripts/build-delivery "$RUNNER_TEMP/agent-delivery"
    - name: Upload the agent delivery
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: agent-delivery-linux
        path: ${{ runner.temp }}/agent-delivery
        if-no-files-found: error
        retention-days: 30

  agent-macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Build macOS agent
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/agent
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin
    - name: Restore Rust caches
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: apps/agent
    - name: Build the macOS delivery
      run: scripts/build-delivery "$RUNNER_TEMP/agent-delivery" --target aarch64-apple-darwin --target x86_64-apple-darwin
    - name: Upload the macOS delivery
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: agent-delivery-macos
        path: ${{ runner.temp }}/agent-delivery
        if-no-files-found: error
        retention-days: 30

  agent-delivery:
    name: Combine agent delivery
    needs: [changes, agent, agent-macos]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.build == 'false' || (needs.agent.result == 'success' && needs.agent-macos.result == 'success')) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download built agent parts
        if: needs.changes.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-delivery-*
          path: ${{ runner.temp }}/agent-parts
      - name: Verify and combine built agents
        if: needs.changes.outputs.build == 'true'
        run: python3 tools/combine_agent_delivery.py "$RUNNER_TEMP/agent-delivery" "$RUNNER_TEMP/agent-parts/agent-delivery-linux" "$RUNNER_TEMP/agent-parts/agent-delivery-macos"
      - name: Reuse the published agent delivery
        if: needs.changes.outputs.build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.changes.outputs.release }}
        run: python3 bin/ci-agent-delivery reuse --release "$RELEASE" --destination "$RUNNER_TEMP/agent-delivery"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-delivery
          path: ${{ runner.temp }}/agent-delivery
          if-no-files-found: error
          retention-days: 30

  required:
    name: Required checks
    if: always()
    needs: [php, cli, docs, api-reference, web]
    runs-on: ubuntu-26.04
    steps:
      - name: Require builds and static checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          failed = {job: data['result'] for job, data in json.loads(os.environ['NEEDS']).items() if data['result'] != 'success'}
          if failed:
              sys.exit(f'Builds or static checks failed: {failed}')
          PYTHON
