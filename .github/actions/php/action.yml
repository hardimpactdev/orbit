name: Set up CI PHP
description: Install PHP and Composer for fast builds and static checks without compiling the agent.
inputs:
  coverage:
    description: Coverage driver, or none.
    default: none
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.5'
        extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_sqlite, zip
        coverage: ${{ inputs.coverage }}
        tools: composer:2.10.3
    - name: Locate Composer download cache
      id: composer-cache
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        echo "path=$(composer config cache-files-dir --global)" >> "$GITHUB_OUTPUT"
        echo "version=$(composer --version --no-ansi | awk '{print $3}')" >> "$GITHUB_OUTPUT"

    - name: Restore Composer downloads
      if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.path }}
        key: composer-${{ runner.os }}-${{ runner.arch }}-${{ steps.composer-cache.outputs.version }}-${{ hashFiles('**/composer.lock') }}

    # The stock action saves after the job's installs, and only main produces trusted download entries.
    - name: Cache Composer downloads on main
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.path }}
        key: composer-${{ runner.os }}-${{ runner.arch }}-${{ steps.composer-cache.outputs.version }}-${{ hashFiles('**/composer.lock') }}
