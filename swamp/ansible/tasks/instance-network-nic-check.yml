---
# The native clone and Ansible use the same gate. Expanded devices include profile inheritance and local overrides.
- name: Check the effective NIC gates on the Instance bridge
  tags: [always]
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_network.py') }}"
      - "{{ network_name }}"
      - "{{ expected_network_device | default('') }}"
    stdin: "{{ network_container | to_json }}"
  register: network_nic_check
  changed_when: false
  failed_when: false

- name: Refuse an unsafe effective NIC on the Instance bridge
  tags: [always]
  ansible.builtin.assert:
    that: network_nic_check.rc == 0
    fail_msg: >-
      {{ network_failure if expected_network_device is defined else network_failure ~ ': ' ~ network_nic_check.stdout }}
    quiet: true
