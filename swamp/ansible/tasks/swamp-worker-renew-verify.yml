---
- name: Probe the live connected worker
  ansible.builtin.command:
    argv: "{{ ['timeout', '125', renewal_swamp_binary, 'worker', 'verify', 'swamp-role-' ~ orbit_node_id ~ '-' ~ renewal_verify_slot] + renewal_remote }}"
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  register: renewal_probe
  changed_when: false
  failed_when: renewal_probe.rc not in [0, 1]
  no_log: true
- name: Decode the native live check
  ansible.builtin.set_fact:
    renewal_check: "{{ renewal_probe.stdout | from_json }}"
- name: Require exactly one connected worker
  ansible.builtin.assert:
    that:
      - renewal_check.total == 1
      - renewal_check.workers | length == 1
      - renewal_check.workers[0].name == 'swamp-role-' ~ orbit_node_id ~ '-' ~ renewal_verify_slot
    fail_msg: "Worker {{ renewal_verify_slot }} is not connected"
# The pinned native verify selects connected workers. An exact at_capacity refusal
# proves the live worker is full; requiring a free probe slot could starve renewal.
- name: Require a successful probe or the native full capacity refusal
  ansible.builtin.assert:
    that:
      - >-
        (renewal_check.passed == 1 and renewal_check.failed == 0 and renewal_check.workers[0].status == 'pass') or
        (renewal_check.passed == 0 and renewal_check.failed == 1 and renewal_check.workers[0].status == 'error' and
        renewal_check.workers[0].error | default('') == "Worker 'swamp-role-" ~ orbit_node_id ~ "-" ~ renewal_verify_slot ~ "' is at capacity")
    fail_msg: "Worker {{ renewal_verify_slot }} failed its native live check"
