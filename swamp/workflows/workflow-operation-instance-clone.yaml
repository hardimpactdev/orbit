id: 6c413eaa-2e25-43c8-b146-f6c8e103c00d
name: operation-instance-clone
description: Clone committed development source through official209 SSH and one terminal projection.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - instance.clone
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        git_read:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        environment:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
        git_credential:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - git_read
      - environment
      - git_credential
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  labels:
    role: swamp
  steps:
  - name: candidate-branch
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &id001
        name: ${{ ("icl-2-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.candidate.ssh_execution.target.user }}
          port: ${{ inputs.intent.candidate.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.candidate.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.candidate.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.candidate.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - branch
        - --show-current
  - name: candidate-commit
    labels:
      role: swamp
    dependsOn:
    - step: candidate-branch
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-3-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - rev-parse
        - --verify
        - HEAD^{commit}
  - name: candidate-status
    labels:
      role: swamp
    dependsOn:
    - step: candidate-commit
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-4-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - status
        - --porcelain
        - --untracked-files=all
  - name: candidate-submodules
    labels:
      role: swamp
    dependsOn:
    - step: candidate-status
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-5-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.candidate.checkout }}
        - submodule
        - status
        - --recursive
  - name: candidate-origin
    labels:
      role: swamp
    dependsOn:
    - step: candidate-submodules
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("icl-7-" + string(inputs.intent.candidate.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$1" config --get remote.origin.url | sed -E "s#^([a-z+]+://)[^/@]*:[^/@]*@#\1REDACTED@#;
          s#^(https?://)[^/@]+@#\1REDACTED@#"
        - sh
        - ${{ inputs.intent.candidate.checkout }}
  - name: candidate
    labels:
      role: swamp
    dependsOn:
    - step: candidate-origin
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "icl-8" }}
      methodName: cloneCandidate
      inputs:
        intent: ${{ inputs.intent.candidate }}
        origin: ${{ steps["candidate-origin"].outputs }}
        branch: ${{ steps["candidate-branch"].outputs }}
        commit: ${{ steps["candidate-commit"].outputs }}
        status: ${{ steps["candidate-status"].outputs }}
        submodules: ${{ steps["candidate-submodules"].outputs }}
  - name: source-worktrees
    labels:
      role: swamp
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (!(inputs.intent.source.seed_repository != null && inputs.intent.resolve.seed_commit != null) ||
      (inputs.intent.retained_source != null)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: &id002
        name: ${{ ("src-0-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -C
        - '${{ inputs.intent.source.seed_repository == null ? inputs.intent.source.checkout : inputs.intent.source.seed_repository }}'
        - worktree
        - list
        - --porcelain
    dependsOn:
    - step: candidate
      condition:
        type: succeeded
  - name: source-branch-available
    labels:
      role: swamp
    dependsOn:
    - step: source-worktrees
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "src-1" }}
      methodName: branchAvailable
      inputs:
        resolve: ${{ inputs.intent.resolve }}
        checkout: ${{ inputs.intent.source.checkout }}
        worktrees: '${{ inputs.intent.source.seed_repository != null && inputs.intent.resolve.seed_commit != null && !(inputs.intent.retained_source != null) ? steps["source-worktrees"].outputs
          : {"stdout":""} }}'
  - name: source-branch-accepted
    labels:
      role: swamp
    dependsOn:
    - step: source-branch-available
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: assert
      expr: steps["source-branch-available"].outputs.available
      severity: high
      message: instance.branch_in_use
  - name: source-prepare-read
    labels:
      role: swamp
    dependsOn:
    - step: source-branch-accepted
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-4-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - if [ -e "$1/.git" ]; then c=false; elif [ "$2" = true ]; then mkdir -p -- "$(dirname -- "$1")"; c=true; else mkdir -p -- "$1"; c=true; fi; printf "{\"created\":%s,\"owned\":%s}\n"
          "$c" "$3"
        - sh
        - ${{ inputs.intent.source.checkout }}
        - '${{ inputs.intent.source.seed_repository != null && inputs.intent.resolve.seed_commit != null ? "true" : "false" }}'
        - '${{ inputs.intent.source.prepare_id != null ? "true" : "false" }}'
    writes: true
  - name: source-prepared
    labels:
      role: swamp
    dependsOn:
    - step: source-prepare-read
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "src-5" }}
      methodName: decode
      inputs:
        observation: ${{ steps["source-prepare-read"].outputs }}
  - name: source-init
    labels:
      role: swamp
    dependsOn:
    - step: source-prepared
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (!steps["source-prepared"].outputs.created || (inputs.intent.source.seed_repository != null &&
      inputs.intent.resolve.seed_commit != null)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-6-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - init
        - --quiet
  - name: source-worktree
    labels:
      role: swamp
    dependsOn:
    - step: source-init
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (!steps["source-prepared"].outputs.created || !(inputs.intent.source.seed_repository != null &&
      inputs.intent.resolve.seed_commit != null)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-7-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -C
        - '${{ inputs.intent.source.seed_repository == null ? inputs.intent.source.checkout : inputs.intent.source.seed_repository }}'
        - worktree
        - add
        - --no-checkout
        - --detach
        - --
        - ${{ inputs.intent.source.checkout }}
        - '${{ inputs.intent.resolve.seed_commit == null ? "HEAD" : inputs.intent.resolve.seed_commit }}'
  - name: source-origin-read
    labels:
      role: swamp
    dependsOn:
    - step: source-worktree
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-9-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$1" config --get remote.origin.url | sed -E "s#^([a-z+]+://)[^/@]*:[^/@]*@#\1REDACTED@#;
          s#^(https?://)[^/@]+@#\1REDACTED@#" || true
        - sh
        - ${{ inputs.intent.source.checkout }}
  - name: source-origin-proof
    labels:
      role: swamp
    dependsOn:
    - step: source-origin-read
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "src-10" }}
      methodName: origin
      inputs:
        expected: ${{ inputs.intent.source.repository }}
        observation: ${{ steps["source-origin-read"].outputs }}
        allow_empty: ${{ steps["source-prepared"].outputs.owned }}
  - name: source-origin-configure
    labels:
      role: swamp
    dependsOn:
    - step: source-origin-proof
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (steps["source-origin-read"].outputs.stdout != "") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-11-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - config
        - remote.origin.url
        - ${{ inputs.intent.source.repository }}
  - name: source-git-directory
    labels:
      role: swamp
    dependsOn:
    - step: source-origin-configure
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-12-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - rev-parse
        - --absolute-git-dir
  - name: source-credential
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: source-git-directory
      condition: &id003
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (!inputs.intent.resolve.network || (inputs.intent.retained_source != null)) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-clone-credential-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        path: ${{ "/tmp/orbit-git-credential-" + run.id }}
        ensure: present
        mode: '0600'
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        content: ${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.execution_secrets.git_credential.key) }}
      inputs: {}
  - name: source-fetch
    labels:
      role: swamp
    dependsOn:
    - step: source-credential
      condition: *id003
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (!inputs.intent.resolve.network || (inputs.intent.retained_source != null)) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-18-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '300'
        - /usr/bin/env
        - GIT_TERMINAL_PROMPT=0
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -c
        - credential.helper=
        - -c
        - ${{ "credential.helper=store --file=/tmp/orbit-git-credential-" + run.id }}
        - -c
        - protocol.allow=never
        - -c
        - protocol.https.allow=always
        - -c
        - http.followRedirects=false
        - -c
        - 'url.https://github.com/.insteadOf=git@github.com:'
        - -c
        - url.https://github.com/.insteadOf=ssh://git@github.com/
        - -C
        - ${{ inputs.intent.source.checkout }}
        - fetch
        - --quiet
        - --no-tags
        - --prune
        - --
        - ${{ inputs.intent.source.repository }}
        - +refs/heads/*:refs/remotes/origin/*
    writes: true
  - name: source-credential-remove
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: source-fetch
      condition:
        type: always
    guard: ${{ !inputs.intent.resolve.network || (inputs.intent.retained_source != null) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-clone-credential-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        path: ${{ "/tmp/orbit-git-credential-" + run.id }}
        ensure: absent
        mode: '0600'
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
      inputs: {}
  - name: source-refs
    labels:
      role: swamp
    dependsOn:
    - step: source-credential-remove
      condition: *id003
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-19-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - for-each-ref
        - --format=%(refname)
        - refs/heads
        - refs/remotes/origin
  - name: source-selected
    labels:
      role: swamp
    dependsOn:
    - step: source-refs
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "src-20" }}
      methodName: select
      inputs:
        resolve: ${{ inputs.intent.resolve }}
        refs: ${{ steps["source-refs"].outputs }}
  - name: source-checkout
    labels:
      role: swamp
    dependsOn:
    - step: source-selected
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") || (inputs.intent.retained_source != null) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-21-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - checkout
        - --quiet
        - --no-track
        - -B
        - ${{ steps["source-selected"].outputs.branch }}
        - ${{ steps["source-selected"].outputs.reference }}
  - name: source-commit
    labels:
      role: swamp
    dependsOn:
    - step: source-checkout
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-22-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -c
        - core.hooksPath=/dev/null
        - -c
        - core.fsmonitor=false
        - -C
        - ${{ inputs.intent.source.checkout }}
        - rev-parse
        - --verify
        - HEAD^{commit}
  - name: source-profile-read
    labels:
      role: swamp
    dependsOn:
    - step: source-commit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("src-24-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '60'
        - /bin/sh
        - -c
        - cd -- "$1" 2>/dev/null || { echo absent; echo missing; exit 0; }; if [ -L "$2" ]; then echo unsafe; elif [ -f "$2" ]; then echo regular; elif [ -e "$2"
          ]; then echo other; else echo absent; fi; if [ -L composer.json ]; then echo unsafe; elif [ ! -e composer.json ]; then echo missing; elif [ -f composer.json
          ]; then echo file; head -c 1048577 composer.json; else echo unsafe; fi
        - sh
        - ${{ inputs.intent.application }}
        - '${{ has(inputs.intent.entry_point) && inputs.intent.entry_point != null ? inputs.intent.entry_point : "artisan" }}'
  - name: source-result
    labels:
      role: swamp
    dependsOn:
    - step: source-profile-read
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps.exists(key, steps[key].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-source-command'
      behaviorName: ${{ "src-25" }}
      methodName: provisioningResult
      inputs:
        intent: ${{ inputs.intent }}
        profile: ${{ steps["source-profile-read"].outputs }}
        branch: ${{ steps["source-selected"].outputs.branch }}
        commit: ${{ steps["source-commit"].outputs }}
  - name: environment
    labels:
      role: swamp
    dependsOn:
    - step: source-result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("instance-clone-environment-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
