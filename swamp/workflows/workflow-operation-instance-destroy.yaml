      methodName: fail
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed_step: complete
  dependsOn:
  - job: complete
    condition:
      type: failed
- name: report_native_failure
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: report_native_failure
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/operation-failure'
      behaviorName: ${{ "instance-destroy-failure-" + run.id }}
      methodName: report
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
  dependsOn:
  - job: complete
    condition:
      type: or
      conditions:
      - type: failed
      - type: skipped
  - job: failure_capture_sources
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  - job: failure_admission
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  - job: failure_prepare_sources
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  - job: failure_runtime
    condition:
      type: or
      conditions:
      - type: completed
      - type: skipped
  - job: failure_teardown
    condition:
      type: or
