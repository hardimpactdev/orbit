id: 3effe849-5048-45ba-8a9a-6bc62ef70c57
name: gateway-release-activate
description: Switch the Gateway to a built release, verify it and resume its cleanups; the release run starts it from the new commit's definition.
# A failed check switches back to the previous release; migrations are expand and contract, so it runs on the new
# schema (docs/reference/gateway-recovery.md#release-as-a-swamp-run).
queueTimeout: 120
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: gateway.release}
    intent:
      type: object
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        id: {type: string, pattern: '^[a-f0-9]{12}$'}
        previous: {type: string, pattern: '^[a-f0-9]{12}$'}
        horizon_unit: {type: string, pattern: '^$|^[A-Za-z0-9@_.-]+\.service$'}
        horizon_drain_seconds: {type: integer, minimum: 1, maximum: 3600}
        keep: {type: integer, minimum: 2, maximum: 20}
        ssh: {type: object}
      required: [sha, id, previous, horizon_unit, horizon_drain_seconds, keep, ssh]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: intent
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
- name: input
  labels: {role: swamp}
  steps:
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-activate-input-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ORBIT_KIND: '${{ inputs.kind }}'}
  dependsOn:
  - {job: intent, condition: {type: succeeded}}
- name: activate
  labels: {role: swamp}
  dependsOn:
  - {job: input, condition: {type: succeeded}}
  steps:
    # Horizon's running jobs finish on the release they started on. The unit stops the master with SIGTERM, never sends SIGKILL and waits as long as
    # the drain allows (GatewayHorizon::stopDirectives). The phase refuses a unit without that policy, stops it and requires it to be inactive.
  - name: Drain Horizon
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.horizon_unit == "" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-drain-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout "$ORBIT_TIMEOUT" /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags drain "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2
        env: &ansible {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}', ORBIT_ANSIBLE: '${{ steps["Write the intent"].outputs.assets }}', ANSIBLE_CONFIG: '${{
            steps["Write the intent"].outputs.assets + "/ansible.cfg" }}', ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null
              -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}', ANSIBLE_FORCE_COLOR: '0',
            ORBIT_TIMEOUT: '${{ string(inputs.intent.horizon_drain_seconds + inputs.intent.horizon_drain_seconds + 60) }}'}
    # Requires a sealed release, switches the application and web links atomically, reloads PHP-FPM and restarts the running services under the
    # application. A scheduler start pauses the release cleanups, so it first prints their generations for the cleanup step.
  - name: Switch the release
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Drain Horizon, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-switch-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" -e "expected_sha=$ORBIT_SHA" --tags switch "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2 && cat "$ORBIT_RUN/generations"
        env: {<<: *ansible, ORBIT_SHA: '${{ inputs.intent.sha }}'}
    # A failed check fails no run by itself: the switch-back after it does, so its marker reaches the Gateway.
  - name: Verify the Gateway
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: Switch the release, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-verify-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 180 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags verify "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2
        env: *ansible
    # After a failed check, the same phase puts the previous release back. It then fails the run with its marker; a switch-back that fails
    # reports its own error instead.
  - name: Switch back
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Verify the Gateway, condition: {type: failed}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-back-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: 'timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" -e "target_id=$ORBIT_PREVIOUS" --tags switch "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2 && echo "gateway.release_switched_back: the check failed; release $ORBIT_PREVIOUS is current again" >&2; exit 1'
        env: {<<: *ansible, ORBIT_PREVIOUS: '${{ inputs.intent.previous }}'}
    # Always, also after a failed drain, switch or check: the drain stopped Horizon, so every end of the run starts it again, on
    # the release that is live. Starting a running unit changes nothing.
  - name: Start Horizon
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.horizon_unit == "" }}
    dependsOn:
    - {step: Drain Horizon, condition: &always {type: always}}
    - {step: Switch the release, condition: *always}
    - {step: Verify the Gateway, condition: *always}
    - {step: Switch back, condition: *always}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-start-horizon-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: &ssh
        name: '${{ "gateway-release-ssh-" + string(inputs.node_id) }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        timeoutSec: 60
        argv: [/usr/bin/systemctl, start, '${{ inputs.intent.horizon_unit }}']
    # Best effort: the scheduler restart paused the release cleanups; they resume once a reconciliation finds no
    # differences. One that stays paused fails this step and keeps its own status; the release stays live.
  - name: Resume document cleanup
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn:
    - {step: Verify the Gateway, condition: {type: or, conditions: [{type: succeeded}, {type: failed}]}}
    - {step: Switch back, condition: {type: always}}
    - {step: Start Horizon, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "gateway-release-cleanup-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        timeoutSec: 360
        argv: [/usr/bin/timeout, '300', php8.5, /home/orbit/orbit/apps/gateway/artisan, gateway:release:cleanup, --no-interaction,
          '${{ "--before=" + steps["Switch the release"].outputs.stdout }}']
    # Best effort: keep the newest sealed releases, the current and the previous one; a later release retries.
  - name: Prune old releases
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: Verify the Gateway, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-release-prune-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "run_dir=$ORBIT_RUN" --tags prune "$ORBIT_ANSIBLE/operation-gateway-release.yml" >&2
        env: *ansible
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: intent, condition: &settled {type: or, conditions: [{type: completed}, {type: skipped}]}}
  - {job: input, condition: *settled}
  - {job: activate, condition: *settled}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "ansible-gateway-activate-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
