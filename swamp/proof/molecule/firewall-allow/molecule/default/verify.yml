---
# The state asserts of eight firewall:allow cases. converge.yml has run the CLI and checked the answers and receipts; this playbook only reads,
# and reads each thing once: the UFW table of every container, the firewall records of every Node, every probe of every case (in waves of as
# many as the limit allows, as async jobs), and Doctor, which runs beside the probes so that its wait for the agent's report overlaps them.
# The cases then check their own rows and records against what was read, with no further call to a container.
- ansible.builtin.import_playbook: facts.yml

- name: Read the UFW table of each container
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Read the UFW table
      ansible.builtin.command: ufw status numbered
      register: ufw_now
      changed_when: false

- name: Each case lists its probes
  hosts: case_hosts
  gather_facts: false
  vars_files: [cases.yml]
  tasks:
    - name: Keep the probes of the case
      ansible.builtin.set_fact:
        probes_of_case: "{{ probe_list }}"

- name: Read the records, run the probes, and Doctor beside them
  hosts: localhost:doctor_check
  gather_facts: false
  strategy: free
  tasks:
    - name: Read the firewall records of every Node
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: records
      when: inventory_hostname == 'localhost'

    - name: Keep the rules by Node
      ansible.builtin.set_fact:
        rules_by_node: "{{ dict(records.json.data | map(attribute='node') | zip(records.json.data | map(attribute='rules'))) }}"
      when: inventory_hostname == 'localhost'

    - name: Collect the probes of every case
      ansible.builtin.set_fact:
        all_probes: "{{ groups['case_hosts'] | map('extract', hostvars, 'probes_of_case') | flatten | list }}"
      when: inventory_hostname == 'localhost'

    - name: Run the probes, one wave at a time
      ansible.builtin.include_tasks: probe-wave.yml
      loop: "{{ (all_probes | default([])) | batch(parallel_limit | int) | list }}"
      loop_control: {loop_var: wave, label: "{{ wave | length }} probes"}
      when: inventory_hostname == 'localhost'

    - name: Doctor, start the clock
      ansible.builtin.set_fact:
        doctor_t0: "{{ now().timestamp() }}"
      when: inventory_hostname == 'doctor_check'

    - name: Doctor on the Node of the first case, firewall family (a silent agent shows as unverifiable, not as drift; the agent reports at its next tick, so poll)
      ansible.builtin.command:
        argv: "{{ orbit + ['doctor', '--node=' ~ hostvars['localhost'].node_ids[case_target.new_restricted_allow], '--family=firewall', '--json'] }}"
        chdir: /
      environment: "{{ cli_env }}"
      register: doctor
      failed_when: false
      changed_when: false
      until: doctor.stdout is search('^\\s*[{]') and (doctor.stdout | from_json).summary.drift == 0 and (doctor.stdout | from_json).summary.unverifiable == 0
      retries: "{{ (70 / (poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ poll_delay }}"
      when: inventory_hostname == 'doctor_check'

    - name: Doctor reports no drift
      ansible.builtin.set_fact:
        verified: "{{ doctor.stdout is search('^\\s*[{]') and (doctor.stdout | from_json).summary.drift == 0 and (doctor.stdout | from_json).summary.unverifiable == 0 }}"
        doctor_secs: "{{ (now().timestamp() - doctor_t0 | float) | round(1) }}"
        doctor_tries: "{{ doctor.attempts | default(1) }}"
      when: inventory_hostname == 'doctor_check'

- name: Check each case against what was read
  hosts: case_hosts
  gather_facts: false
  vars_files: [cases.yml]
  tasks:
    - name: The case's table and rules
      ansible.builtin.set_fact:
        rows: "{{ hostvars[tcontainer].ufw_now.stdout_lines }}"
        rules: "{{ hostvars['localhost'].rules_by_node[tnode] | default([]) }}"

    - name: Every probe of the case saw what was expected
      vars:
        mine: "{{ hostvars['localhost'].probe_obs | default([]) | selectattr('case', 'equalto', inventory_hostname) | list }}"
        wrong: "{{ mine | rejectattr('ok') | list }}"
      ansible.builtin.assert:
        that:
          - wrong | length == 0
          - mine | length == (d.probes | default([]) | length)
        fail_msg: "probes: {{ wrong | map(attribute='text') | join('; ') }}"
        quiet: true
      ignore_errors: true
      register: probes_checked

    - name: The probes failed
      ansible.builtin.set_fact:
        verify_failures: "Every probe of the case saw what was expected | {{ probes_checked.msg }}"
      when: probes_checked is failed

    - name: The checks of the case
      ansible.builtin.include_tasks: "verify-{{ inventory_hostname }}.yml"

- name: Verdicts
  hosts: localhost
  gather_facts: false
  vars:
    all_cases: "{{ groups['independent_cases'] + groups['exclusive_cases'] }}"
  tasks:
    - name: Verdict of each case (command seconds, case seconds in converge, the window of the case and of its CLI call, asks while the Node was busy)
      ansible.builtin.debug:
        msg: >-
          {{ item }}: {{ ('failed | ' ~ (hostvars[item].failures | default(hostvars[item].verify_failures | default('the checks did not end')))) if (hostvars[item].failures is defined or hostvars[item].verify_failures is defined or not (hostvars[item].verified | default(false))) else 'passed' }}
          (command {{ hostvars[item].cmd_secs }} s, case {{ hostvars[item].case_secs }} s, casewin {{ hostvars[item].case_start | float | round(2) }} {{ hostvars[item].case_end | float | round(2) }}, cli {{ hostvars[item].cli_start | float | round(1) }} {{ hostvars[item].cli_end | float | round(1) }}, busy {{ hostvars[item].busy_retries }}, on {{ hostvars[item].tnode }})
      loop: "{{ all_cases }}"

    - name: Doctor, reported apart from the cases
      ansible.builtin.debug:
        msg: >-
          doctor: {{ 'passed' if hostvars['doctor_check'].verified | default(false) else 'failed' }} (doctor {{ hostvars['doctor_check'].doctor_secs | default('-') }} s, {{ hostvars['doctor_check'].doctor_tries | default('-') }} asks)

    - name: Collect the failed cases
      ansible.builtin.set_fact:
        failed_cases: "{{ failed_cases | default([]) + [item] }}"
      loop: "{{ all_cases + ['doctor_check'] }}"
      when: hostvars[item].failures is defined or hostvars[item].verify_failures is defined or not (hostvars[item].verified | default(false))

    - name: Fail when a case failed
      ansible.builtin.assert:
        that: failed_cases | default([]) | length == 0
        fail_msg: "failed: {{ failed_cases | default([]) | join(', ') }}"
        quiet: true
