id: ecba7071-63ee-4dbf-a293-b2d60c476a2e
name: task-vm-runtime
description: Install the pinned Pi artifact, the Orbit root, Pi credentials and its Process in the guest with pinned official SSH from 209; an Ansible playbook writes them.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: runtime
  labels: {role: swamp}
  steps:
  - name: input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs:
        intent: ${{ inputs.intent }}
        path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
  - name: Fetch the Pi build
    labels: {role: swamp}
    dependsOn:
    - step: input
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-pi-source-" + string(inputs.intent.pi_artifact.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: copy
      globalArgs:
        name: '${{ ("vm-pi-source-" + string(inputs.intent.pi_artifact.ssh_execution.target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.intent.pi_artifact.ssh_execution.target.user }}
          port: ${{ inputs.intent.pi_artifact.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.pi_artifact.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.pi_artifact.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.pi_artifact.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ inputs.intent.pi_artifact.path }}
        dst: ${{ "/tmp/orbit-ansible-" + run.id + "/pi-server" }}
        direction: from
  # The pinned digest, checked on 209 before anything reaches the guest.
  - name: Check the Pi build
    labels: {role: swamp}
    dependsOn:
    - step: Fetch the Pi build
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-vm-runtime-check-build-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: printf '%s  %s\n' "$ORBIT_SHA" "$ORBIT_RUN/pi-server" | timeout 60 sha256sum -c --quiet
        env:
          ORBIT_SHA: ${{ inputs.intent.pi_artifact.sha256 }}
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
  - name: Write the playbook input
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: Check the Pi build
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-vm-runtime-input-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps.input.outputs.assets }}
          ORBIT_KIND: task_vm.runtime
  - name: Install the Pi server
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: Write the playbook input
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-vm-runtime-install-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "pi_path=$ORBIT_RUN/pi-server" --tags install "$ORBIT_ANSIBLE/task-vm-runtime.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps.input.outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps.input.outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ORBIT_PI_MODELS: ${{ vault.get(inputs.execution_secrets.pi_models.vault, inputs.execution_secrets.pi_models.key) }}
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
  - name: Check the Pi server
    labels: {role: swamp}
    dependsOn:
    - step: Install the Pi server
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-vm-runtime-check-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "pi_path=$ORBIT_RUN/pi-server" --tags check "$ORBIT_ANSIBLE/task-vm-runtime.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps.input.outputs.assets }}
          ANSIBLE_CONFIG: ${{ steps.input.outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          ORBIT_PI_TOKEN: ${{ vault.get(inputs.execution_secrets.pi_token.vault, inputs.execution_secrets.pi_token.key) }}
  - name: result
    labels: {role: swamp}
    dependsOn:
    - step: Check the Pi server
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-vm-runtime-result-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: printf '{"task_vm_id":%s,"guest_node_id":%s,"process_id":%s,"ready":true}\n' "$ORBIT_VM_ID" "$ORBIT_GUEST_ID" "$ORBIT_PROCESS_ID"
        env:
          ORBIT_VM_ID: ${{ string(inputs.intent.task_vm_id) }}
          ORBIT_GUEST_ID: ${{ string(inputs.intent.guest_node_id) }}
          ORBIT_PROCESS_ID: ${{ string(inputs.intent.runtime.process.process_id) }}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: runtime, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-vm-runtime-cleanup-" + string(inputs.intent.task_vm_id)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
