id: 10c1e646-19cd-4527-8be5-01f524976346
name: operation-instance-destroy
description: Development Instance destroy from209 through separately placed official SSH actions.
vaults:
  - orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      const: instance.destroy
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            const: orbit-control-inputs
          key:
            type: string
        required:
          - vault
          - key
        additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: destroy
    target: orbit-node-209
    steps:
      - name: destroy-directory
        target: orbit-node-209
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-0-" + run.id }}'
          methodName: exec
          globalArgs: &ref_0
            name: '${{ "id-destroy-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
            hosts:
              - name: target
                address: '${{ inputs.intent.ssh_execution.target.host }}'
                transport:
                  hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/mkdir
              - '-p'
              - '${{ "/tmp/orbit-instance-" + run.id }}'
      - name: destroy-observe-asset
        target: orbit-node-209
        dependsOn:
          - step: destroy-directory
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-1-" + run.id + "-" + string(self._index) }}'
          methodName: read
          inputs:
            action: inspect_source
            input:
              member: '${{ self.member }}'
              force: '${{ inputs.intent.force }}'
              repository: '${{ inputs.intent.repository }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-observe
        target: orbit-node-209
        dependsOn:
          - step: destroy-observe-asset
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-2-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destroy-observe-asset-" + string(self._index)].outputs.script_body }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-observed
        target: orbit-node-209
        dependsOn:
          - step: destroy-observe
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-3-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: decode
          inputs:
            observation: '${{ steps["destroy-observe-"+string(self._index)].outputs }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-origin-assets
        target: orbit-node-209
        dependsOn:
          - step: destroy-observed
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "idm-destro-4-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: read
          inputs:
            action: origin
            input:
              checkout: '${{ self.member.checkout_path }}'
              allow_empty: '${{ self.member.failed_creation }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-origin
        target: orbit-node-209
        dependsOn:
          - step: destroy-origin-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-5-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destroy-origin-assets-"+string(self._index)].outputs.script_body }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
        guard: '${{ !steps["destroy-observed-"+string(self._index)].outputs.origin_required }}'
      - name: destroy-inspect
        target: orbit-node-209
        dependsOn:
          - step: destroy-origin
            condition:
              type: always
          - step: destroy-observed
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-6-" + run.id }}'
          methodName: inspect
          inputs:
            input: '${{ inputs.intent }}'
            steps: '${{ steps }}'
      - name: destroy-source-assets
        target: orbit-node-209
        dependsOn:
          - step: destroy-inspect
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "idm-destro-7-" + run.id }}'
          methodName: paths
          inputs:
            intent: '${{ inputs.intent }}'
      - name: destroy-mint
        target: orbit-node-209
        dependsOn:
          - step: destroy-source-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "id-mint-" + run.id }}'
          methodName: execute
          inputs:
            run: python3 -B "$ORBIT_MINT_FILE"
            env:
              ORBIT_MINT_FILE: '${{ steps["destroy-source-assets"].outputs.directory + "/mint.py" }}'
              ORBIT_OPERATION_ID: '${{ string(inputs.operation_id) }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_GIT_REFERENCES: '${{ inputs.intent.execution_references_json }}'
      - name: destroy-fetch-files
        target: orbit-node-209
        dependsOn:
          - step: destroy-mint
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-9-" + run.id }}'
          methodName: copy
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            src: '${{ steps["destroy-source-assets"].outputs.directory + "/." }}'
            dst: '${{ "/tmp/orbit-instance-" + run.id + "/" }}'
            direction: to
            recursive: true
      - name: destroy-fetch
        target: orbit-node-209
        dependsOn:
          - step: destroy-fetch-files
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-10-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: exec
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/python3
              - '-B'
              - '${{ "/tmp/orbit-instance-" + run.id + "/fetch.py" }}'
              - '${{ self.member.checkout_path }}'
              - '${{ inputs.intent.repository }}'
            stdin: '${{ vault.get(inputs.execution_secrets.git_read.vault,inputs.execution_secrets.git_read.key) }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
        guard: '${{ inputs.intent.force || self.member.failed_creation }}'
      - name: destroy-verify-asset
        target: orbit-node-209
        dependsOn:
          - step: destroy-inspect
            condition:
              type: succeeded
          - step: destroy-fetch
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-11-" + run.id + "-" + string(self._index) }}'
          methodName: read
          inputs:
            action: verify_source
            input:
              member: '${{ self.member }}'
              capture: '${{ steps["destroy-inspect"].outputs.members.filter(row,row.instance_id == self.member.instance_id)[0] }}'
              force: '${{ inputs.intent.force }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-verify
        target: orbit-node-209
        dependsOn:
          - step: destroy-verify-asset
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-12-" + run.id + "-" + string(self._index) + "-" + string(self._index) }}'
          methodName: script
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            interpreter: python3
            script: '${{ steps["destroy-verify-asset-" + string(self._index)].outputs.script_body }}'
        forEach:
          item: member
          in: '${{ inputs.intent.members }}'
      - name: destroy-verified
        target: orbit-node-209
        dependsOn:
          - step: destroy-verify
            condition:
              type: always
          - step: destroy-inspect
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-13-" + run.id }}'
          methodName: require_actions
          inputs:
            names:
              - destroy-verify
            counts:
              - '${{ size(inputs.intent.members) }}'
            steps: '${{ steps }}'
      - name: destroy-schedules
        target: orbit-node-209
        dependsOn:
          - step: destroy-verified
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: operation-schedule-destroy
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: schedule.destroy
            intent:
              schedule:
                id: '${{ self.schedule.id }}'
              cascade: true
              ssh_execution: '${{ inputs.intent.ssh_execution }}'
            execution_secrets: {}
          behaviorName: undefined
        forEach:
          item: schedule
          in: '${{ inputs.intent.direct_destroy.runtime.schedules }}'
      - name: destroy-processes
        target: orbit-node-209
        dependsOn:
          - step: destroy-schedules
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: destroy-verified
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: operation-process-destroy
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: process.destroy
            intent:
              control: '${{ self.process }}'
              ssh_execution: '${{ inputs.intent.ssh_execution }}'
            execution_secrets: {}
          behaviorName: undefined
        forEach:
          item: process
          in: '${{ inputs.intent.native_runtime.processes }}'
      - name: destroy-runtime-ready
        target: orbit-node-209
        dependsOn:
          - step: destroy-schedules
            condition:
              type: always
          - step: destroy-processes
            condition:
              type: always
          - step: destroy-verified
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-16-" + run.id }}'
          methodName: require_actions
          inputs:
            names:
              - destroy-schedules
              - destroy-processes
            counts:
              - '${{ size(inputs.intent.direct_destroy.runtime.schedules) }}'
              - '${{ size(inputs.intent.native_runtime.processes) }}'
            steps: '${{ steps }}'
      - name: destroy-step-assets
        target: orbit-node-209
        dependsOn:
          - step: destroy-runtime-ready
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-destro-17-" + run.id }}'
          methodName: read
          inputs:
            action: run_project_step
            input: {}
      - name: destroy-step-copy
        target: orbit-node-209
        dependsOn:
          - step: destroy-step-assets
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-destro-18-" + run.id }}'
          methodName: copy
          globalArgs: *ref_0
          inputs:
            hosts: 'name:target'
            src: '${{ steps["destroy-step-assets"].outputs.script_file }}'
            dst: '${{ "/tmp/orbit-instance-" + run.id + "/run_project_step.py" }}'
            direction: to
      - name: destroy-teardown-0
        target: orbit-node-209
        dependsOn:
          - step: destroy-step-copy
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: workflow
          workflowIdOrName: instance-project-command
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent:
              ssh_execution: '${{ inputs.intent.ssh_execution }}'
              script: '${{ "/tmp/orbit-instance-"+run.id+"/run_project_step.py" }}'
              timeout_seconds: '${{ size(inputs.intent.teardown_commands)>0?inputs.intent.teardown_commands[0].timeout_seconds:60 }}'
              reference: >-
                ${{
                size(inputs.intent.teardown_commands)>0?inputs.execution_secrets[inputs.intent.teardown_commands[0].secret_field]:inputs.execution_secrets.git_read
                }}
        guard: '${{ size(inputs.intent.teardown_commands)<=0 || steps.exists(key,steps[key].status=="failed") }}'
      - name: destroy-teardown-1
