id: be0fb735-5420-4c04-aa82-b33a8a9ce8fa
name: operation-node-wireguard-hub-converge
description: Canonical hub publication on its exact admitted Node worker.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
    node_id:
      type: integer
    kind:
      type: string
      enum:
      - node.wireguard_hub_converge
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
target: orbit-node-209
labels:
  node: '209'
jobs:
- name: hub
  steps:
  - name: assets
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-assets-" + string(inputs.intent.hub_id) }}
      methodName: inventory
      inputs:
        intent: ${{ inputs.intent }}
  - name: publish_command
    writes: true
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "wireguard-hub-" + string(inputs.intent.hub_id) }}
      methodName: script
      inputs:
        hosts: name:hub
        interpreter: python3
        sudo: true
        script: ${{ steps.assets.outputs.script_body }}
      globalArgs:
        name: ${{ "wireguard-hub-" + string(inputs.intent.hub_id) }}
        transport: ${{ model["wireguard-hub-" + string(inputs.intent.hub_id)].input.globalArguments.transport
          }}
        hosts: ${{ model["wireguard-hub-" + string(inputs.intent.hub_id)].input.globalArguments.hosts
          }}
  - name: terminal
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - step: publish_command
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-terminal-" + string(inputs.intent.hub_id) }}
      methodName: terminal
      inputs:
        stdout: ${{ steps["publish_command"].outputs.stdout }}
