id: b77987fa-6c2a-4ba7-9b35-c1739ef369b1
name: operation-database-create
description: database:create from 209, one docker exec -i per batch; each login reads its password from the vault as the first stdin line.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database.create}
    intent: {type: object}
    # Names only: create (the admin password line and the create batch) and check (the owner's password line and the
    # owner check), each one whole value.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-create-(intent|owner)-[1-9][0-9]*$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: create
  labels: {role: swamp}
  steps:
    # One batch: a name the server holds for someone else stops it before any change (database.name_conflict). The
    # Gateway reads the outcome from the native result, so a refused batch still ends this step (exit 1 or 3).
  - name: 'Create owner and databases'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-create-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "300"] + inputs.intent.admin_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.create.vault, inputs.execution_secrets.create.key) }}
        okExitCodes: [0, 1, 3]
        timeoutSec: 310
    # The owner logs in with its own password; only then is the connection usable.
  - name: 'Check the owner login'
    labels: {role: swamp}
    dependsOn: [{step: 'Create owner and databases', condition: {type: succeeded}}]
    guard: '${{ steps["Create owner and databases"].outputs.exitCode != 0 }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60"] + inputs.intent.owner_client }}'
        stdin: ${{ vault.get(inputs.execution_secrets.check.vault, inputs.execution_secrets.check.key) }}
        okExitCodes: [0, 1, 2]
        timeoutSec: 70
