id: 393024cd-986d-46f7-bf26-2a500281d492
name: swamp-credential-monitor
description: Hourly read-only expiry check of Swamp-side credentials on Node 209; the Gateway alerts. Only the release load schedules it.
reports:
  skip: ["@swamp/workflow-summary"]
vaults: []
queueTimeout: 120
jobs:
  - name: monitor
    steps:
      - name: access
        labels: {role: swamp}
        queueTimeout: 120
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "credential-monitor-access" }}
          methodName: execute
          inputs:
            run: SWAMP_API_KEY_FILE=/home/orbit/.config/swamp/api-key timeout 30 /usr/local/bin/swamp access token list --repo-dir /home/orbit/apps/orbit-monorepo-staging/checkout/swamp --json
            env: {HOME: /home/orbit, SWAMP_HOME: /home/orbit/.swamp, SWAMP_CONFIG_DIR: /home/orbit/.config/swamp, SWAMP_SERVE_URL: '', SWAMP_SERVER_URL: '', SWAMP_NO_UPDATE_CHECK: '1', SWAMP_NO_TELEMETRY: '1'}
      - name: enrollment
        labels: {role: swamp}
        queueTimeout: 120
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "credential-monitor-enrollment" }}
          methodName: execute
          inputs:
            run: SWAMP_API_KEY_FILE=/home/orbit/.config/swamp/api-key timeout 30 /usr/local/bin/swamp worker token list --repo-dir /home/orbit/apps/orbit-monorepo-staging/checkout/swamp --json
            env: {HOME: /home/orbit, SWAMP_HOME: /home/orbit/.swamp, SWAMP_CONFIG_DIR: /home/orbit/.config/swamp, SWAMP_SERVE_URL: '', SWAMP_SERVER_URL: '', SWAMP_NO_UPDATE_CHECK: '1', SWAMP_NO_TELEMETRY: '1'}
      - name: certificate
        labels: {role: swamp}
        queueTimeout: 120
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: ${{ "credential-monitor-certificate" }}
          methodName: execute
          inputs:
            run: timeout 30 openssl x509 -enddate -noout -in /home/orbit/.config/swamp/serve-tls/cert.pem
            env: {HOME: /home/orbit, SWAMP_HOME: /home/orbit/.swamp, SWAMP_CONFIG_DIR: /home/orbit/.config/swamp, SWAMP_SERVE_URL: '', SWAMP_SERVER_URL: '', SWAMP_NO_UPDATE_CHECK: '1', SWAMP_NO_TELEMETRY: '1'}
      - name: check
        labels: {role: swamp}
        queueTimeout: 120
        dependsOn:
          - {step: access, condition: {type: succeeded}}
          - {step: enrollment, condition: {type: succeeded}}
          - {step: certificate, condition: {type: succeeded}}
        task:
          type: behavior
          behaviorType: '@nckrtl/node-worker-assets'
          behaviorName: ${{ "credential-monitor-report" }}
          methodName: credential_report
          inputs:
            access: '${{ steps.access.outputs.stdout }}'
            enrollment: '${{ steps.enrollment.outputs.stdout }}'
            certificate: '${{ steps.certificate.outputs.stdout }}'
