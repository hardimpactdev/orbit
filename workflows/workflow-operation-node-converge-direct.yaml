      - job: php_runtime_job
        condition:
          type: always
      - job: tmpfiles_job
        condition:
          type: always
      - job: agent_job
        condition:
          type: always
    steps:
      - name: project
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/node-converge-direct"
