id: 5e65a942-d0c8-4b9a-8f3b-6855888af30a
name: operation-instance-rename
description: Verify a development checkout and record its selected branch.
vaults: []
writes: true
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [instance.rename] }
  required: [operation_id, node_id, kind]
jobs:
  - name: rename
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: { node: '${{ string(inputs.node_id) }}' }
    steps:
      - name: inspect-and-project
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-rename'
          behaviorName: '${{ "instance-rename-node-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            run_id: '${{ run.id }}'
