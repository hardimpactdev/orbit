; priority=99
; Managed by Orbit for the app-prod PHP-FPM runtime. Orbit rewrites this file during convergence.
; OPcache shared memory is allocated once per FPM master, so sizing lives here.
; Timestamp validation is a per-pool policy in /etc/php/*/fpm/pool.d.
post_max_size = 64M
upload_max_filesize = 64M
opcache.enable = On
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 65407
opcache.jit = disable
opcache.jit_buffer_size = 0
