id: c1adc889-3366-40d0-bcf7-099179e97093
name: group-run
description: One admitted generation of one task group, followed by a durable wait.
autoResume: true
inputs:
  type: object
  properties:
    workItem: { type: string }
    factory: { type: string }
    generation: { type: integer }
    key: { type: string }
    definition: { type: string }
    preapprovalModel: { type: string }
  required: [workItem, factory, generation, key, definition, preapprovalModel]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: group
    steps:
      - name: claim
        guard: '${{ false }}'
        labels: {role: swamp}
        task:
          type: behavior
          behavior: '${{ inputs.definition }}'
          methodName: claim
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: '${{ inputs.factory }}'
            generation: '${{ inputs.generation }}'
            key: '${{ inputs.key }}'
            runId: '${{ run.id }}'
      - name: drive
        dependsOn: [{ step: claim, condition: { type: succeeded } }]
        guard: '${{ !steps.claim.outputs.admitted }}'
        labels: {role: swamp}
        task:
          type: behavior
          behavior: '${{ inputs.definition }}'
          methodName: drive
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: '${{ inputs.factory }}'
            generation: '${{ inputs.generation }}'
            key: '${{ inputs.key }}'
            runId: '${{ run.id }}'
      # Waiting on a running Gateway operation: look again in a minute, or at once on a wake.
      - name: wait
        dependsOn: [{ step: drive, condition: { type: succeeded } }]
        guard: '${{ steps.drive.outputs.terminal || steps.drive.outputs.idle }}'
        allowFailure: true
        labels: {role: swamp}
        task:
          type: wait_for_signal
          timeout: 60
          schema:
            type: object
            additionalProperties: false
      # Parked at a human gate: only an event (plan, approval, answer) wakes it.
      - name: park
        dependsOn: [{ step: drive, condition: { type: succeeded } }]
        guard: '${{ steps.drive.outputs.terminal || !steps.drive.outputs.idle }}'
        allowFailure: true
        labels: {role: swamp}
        task:
          type: wait_for_signal
          timeout: 86400
          schema:
            type: object
            additionalProperties: false
      # The owner starts its own next generation; no poll is needed while the group is active.
      - name: handoff
        dependsOn:
          - { step: wait, condition: { type: completed } }
          - { step: park, condition: { type: completed } }
        guard: '${{ steps.drive.outputs.terminal }}'
        labels: {role: swamp}
        task:
          type: behavior
          behavior: '${{ inputs.definition }}'
          methodName: handoff
          inputs:
            workItem: '${{ inputs.workItem }}'
            factory: '${{ inputs.factory }}'
            generation: '${{ inputs.generation }}'
            key: '${{ inputs.key }}'
            runId: '${{ run.id }}'
