---
# The model router's task VM guard on the router's Node (docs/cli/ai-router/task-guard.mmd, /reference/tasks#credentials-in-task-vms):
# its own Caddy on port 8318 of the WireGuard address, the two keys it loads as systemd credentials, its unit and its two UFW rules.
# Tag `apply` puts the guard in place, tag `remove` takes it off. The Gateway renders the Caddyfile and the rules; the two keys come from
# the environment, never from argv or the intent. Both tags end by proving that a source outside the task VM range is refused.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh.target }}"
    address_identity: "{{ intent.ssh.identity_file }}"
    address_group: guard_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Apply the guard
  hosts: guard_node
  become: true
  gather_facts: false
  tags: [apply]
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    guard: "{{ intent.directory }}"
    task_key: "{{ lookup('ansible.builtin.env', 'ORBIT_TASK_KEY') }}"
    anchor_key: "{{ lookup('ansible.builtin.env', 'ORBIT_ANCHOR_KEY') }}"
  tasks:
    - name: Check the two keys
      no_log: true
      ansible.builtin.assert:
        that:
          - task_key is match('^[a-f0-9]{64}$')
          - anchor_key is match('^[a-f0-9]{64}$')
          - task_key != anchor_key
    - name: Make the folder of the guard
      ansible.builtin.file: { path: "{{ guard }}", state: directory, owner: root, group: root, mode: "0755" }
    # Root only: the unit loads them with `LoadCredential`, so only its dynamic user reads them, not the Node's own Caddy. Caddy reads each
    # per request through a file placeholder; no trailing newline, so the file is the key.
    - name: Write the two keys
      no_log: true
      ansible.builtin.copy:
        dest: "{{ guard }}/{{ item.name }}"
        content: "{{ item.key }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { name: task.key, key: "{{ task_key }}" }
        - { name: anchor.key, key: "{{ anchor_key }}" }
      register: keys
    - name: Write the Caddyfile
      ansible.builtin.copy:
        dest: "{{ guard }}/Caddyfile"
        content: "{{ intent.caddyfile }}"
        owner: root
        group: root
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      register: caddyfile
    # Its own Caddy, apart from the Node's Orbit-rendered one: a dynamic user, no admin endpoint, no saved config, its state in its own
    # folder, and no privilege: port 8318 needs none.
    - name: Write the unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ intent.unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Orbit ai-router task VM guard
          After=network-online.target wg-quick@orbit.service
          Wants=network-online.target

          [Service]
          DynamicUser=yes
          LoadCredential=task.key:{{ guard }}/task.key
          LoadCredential=anchor.key:{{ guard }}/anchor.key
          ExecStart=/usr/bin/caddy run --adapter caddyfile --config {{ guard }}/Caddyfile
          Restart=always
          RestartSec=2
          StateDirectory=orbit-ai-router-guard
          Environment=XDG_DATA_HOME=/var/lib/orbit-ai-router-guard XDG_CONFIG_HOME=/var/lib/orbit-ai-router-guard
          CapabilityBoundingSet=
          AmbientCapabilities=
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectKernelLogs=true
          ProtectControlGroups=true
          ProtectClock=true
          ProtectHostname=true
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          RestrictNamespaces=true
          RestrictRealtime=true
          LockPersonality=true
          SystemCallArchitectures=native

          [Install]
          WantedBy=multi-user.target
      register: unit
    - name: Run the guard
      ansible.builtin.systemd_service:
        name: "{{ intent.unit }}"
        daemon_reload: "{{ unit.changed }}"
        enabled: true
        state: "{{ 'restarted' if (unit.changed or caddyfile.changed or keys.changed) else 'started' }}"
    - name: Wait for the guard
      ansible.builtin.wait_for: { host: "{{ intent.origin | urlsplit('hostname') }}", port: "{{ intent.origin | urlsplit('port') }}", timeout: 15 }
    - name: Place the two UFW rules
      ansible.builtin.import_tasks: tasks/firewall.yml
      vars:
        firewall_commands: "{{ intent.firewall.desired + intent.firewall.remove }}"
    # From the Node itself, a source outside the task VM range: even the task key gets 403.
    - name: Check that a source outside the range is refused
      no_log: true
      ansible.builtin.uri:
        url: "{{ intent.origin }}/v1/responses"
        method: POST
        headers: { Authorization: "Bearer {{ task_key }}" }
        status_code: 403
        timeout: 5
        use_proxy: false

- name: Remove the guard
  hosts: guard_node
  become: true
  gather_facts: false
  tags: [remove]
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
  tasks:
    - name: Remove the two UFW rules
      ansible.builtin.import_tasks: tasks/firewall.yml
      vars:
        firewall_commands: "{{ intent.firewall.desired + intent.firewall.remove }}"
    - name: Stop the guard
      ansible.builtin.systemd_service: { name: "{{ intent.unit }}", enabled: false, state: stopped }
      failed_when: false
    - name: Remove the unit and the folder of the guard
      ansible.builtin.file: { path: "{{ item }}", state: absent }
      loop: ["/etc/systemd/system/{{ intent.unit }}", "{{ intent.directory }}"]
    - name: Reload systemd
      ansible.builtin.systemd_service: { daemon_reload: true }

# From the swamp Node, a WireGuard member outside the task VM range: the Node answers on SSH, and port 8318 does not.
- name: Prove the refusal from the swamp Node
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [apply, remove]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    host: "{{ intent.origin | urlsplit('hostname') }}"
  tasks:
    - name: Check that the Node answers on SSH
      ansible.builtin.wait_for: { host: "{{ host }}", port: 22, timeout: 5 }
    - name: Check that port 8318 does not answer
      ansible.builtin.wait_for: { host: "{{ host }}", port: "{{ intent.origin | urlsplit('port') }}", state: stopped, timeout: 5 }
