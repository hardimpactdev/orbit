---
# The package cache of a task VM for the apt runs of a Node in its nested fleet (docs/cli/task/vm-fleet-build.mmd). `apt_proxy` is the
# Gateway's value (TaskVmAptCache): the stock apt-cacher-ng of the VM for a Node inside the nested subnet, none for every other Node.
# One drop-in of apt.conf.d, so the apt module, `apt-get` and a console read it alike. The cache proxies plain http only: https sources
# stay a direct download. apt asks it one request at a time, because it answers some of several requests in flight with another file's body.
# The pinned Tool Manager setup (`Read pinned APT state`) reads dpkg alone, and its own apt calls name the cache themselves or read https.
- name: Point apt at the package cache
  when: apt_proxy | default(none) is not none
  ansible.builtin.copy:
    dest: "{{ apt_conf_directory | default('/etc/apt/apt.conf.d') }}/90orbit-package-cache"
    content: |
      Acquire::http::Proxy "{{ apt_proxy }}";
      Acquire::http::Pipeline-Depth "0";
      Acquire::https::Proxy "DIRECT";
    owner: root
    group: root
    mode: "0644"
- name: Leave apt without the package cache
  when: apt_proxy | default(none) is none
  ansible.builtin.file: { path: "{{ apt_conf_directory | default('/etc/apt/apt.conf.d') }}/90orbit-package-cache", state: absent }
