id: 3b9f6a14-52c7-4e08-8d1a-7e40c5b2f9a6
name: route-withdraw-node
autoContinue: false
description: "instance.destroy: one Node's Route withdrawal. Plan it from the captured states, then one Node-local transaction under the Node lock reads, merges, tests and applies pools, Caddyfile and private DNS records, each written once, and removes the certificate folders."
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent:
      type: object
      properties:
        publication: {type: object}
        php: {type: object}
        caddy: {type: object}
        dns: {type: object}
        cleanup: {type: array}
      required: [publication, php, caddy, dns, cleanup]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
# The Node steps take one of 16 names per Node, `<family>-<node>-<route id % 16>` (`-none` without a Route), as a clone's create does
# (route-create-site): Swamp keeps every behavior definition, so names per Route grow its catalog for ever. A step waits at most 60 s
# for a name another run holds, so the Gateway keeps two removals of one slot off one Node (RoutePublicationHolds::WithdrawalSlots).
# Each run keeps its own run folder and step outputs.
jobs:
- name: withdraw
  labels: {role: swamp}
  steps:
    # Input: what the playbook needs of the Node, and the shipped playbooks, as the run folder that the phases read.
  - name: 'input'
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: '${{ ("route-withdraw-input-" + string(inputs.intent.publication.node_id) + "-" + (inputs.intent.publication.route_id == "none" ? "none" : string(int(inputs.intent.publication.route_id) % 16))).split(".").join("-") }}'
      methodName: write
      inputs:
        intent:
          node:
            host: '${{ inputs.intent.publication.connection.nodeHost }}'
            user: '${{ inputs.intent.publication.connection.nodeUser }}'
            port: '${{ inputs.intent.publication.connection.nodePort }}'
            identity_file: '${{ inputs.intent.publication.connection.nodeIdentityFile }}'
            host_keys: '${{ inputs.intent.publication.host_keys }}'
            account: '${{ inputs.intent.publication.user }}'
        path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
    # Compose: the captured states validated, and the merge steps the Node applies to what it holds. Pure; it writes the plan the apply
    # phase reads.
  - name: 'compose'
    labels: {role: swamp}
    dependsOn:
    - {step: 'input', condition: {type: succeeded}}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: '${{ ("route-withdraw-compose-" + string(inputs.intent.publication.node_id) + "-" + (inputs.intent.publication.route_id == "none" ? "none" : string(int(inputs.intent.publication.route_id) % 16))).split(".").join("-") }}'
      methodName: withdraw
      inputs:
        node_id: '${{ inputs.intent.publication.node_id }}'
        user: '${{ inputs.intent.publication.user }}'
        control_node_id: '${{ inputs.intent.publication.control_node_id }}'
        connection: '${{ inputs.intent.publication.connection }}'
        host_keys: '${{ inputs.intent.publication.host_keys }}'
        plan_path: '${{ "/tmp/orbit-ansible-" + run.id + "/plan.json" }}'
        php: '${{ inputs.intent.php }}'
        caddy: '${{ inputs.intent.caddy }}'
        dns: '${{ inputs.intent.dns }}'
        cleanup: '${{ inputs.intent.cleanup }}'
    # Apply: under the Node lock, the files read, merged, checked to change nothing outside the Route, kept as the previous generation,
    # tested, then committed and reloaded; the withdrawn certificate folders removed. The phase removes the run folder when it ends.
    # The module's own bounds (30 s for the locks, 30 s per validate, reload and restart, 10 s per test, a reload again after a failed
    # one) add up to 250 s with two PHP versions, inside this phase's 300 s.
  - name: 'apply'
    labels: {role: swamp}
    dependsOn:
    - {step: 'compose', condition: {type: succeeded}}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("route-withdraw-apply-" + string(inputs.intent.publication.node_id) + "-" + (inputs.intent.publication.route_id == "none" ? "none" : string(int(inputs.intent.publication.route_id) % 16))).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags apply "$ORBIT_ANSIBLE/route-withdraw.yml"
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
          ORBIT_ANSIBLE: '${{ steps.input.outputs.assets }}'
          ANSIBLE_CONFIG: '${{ steps.input.outputs.assets + "/ansible.cfg" }}'
          ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
    # Failure: the refusal of the Node transaction that the apply phase wrote, `{"error_code", "detail"}`. Swamp keeps no stderr of the
    # failed apply step, and gives a parent no output of a failed child, so it goes to the file the parent named (`refusal_path`), which
    # route-withdraw reads into its result. Nothing when apply never reached the Node transaction.
  - name: 'failure'
    labels: {role: swamp}
    dependsOn:
    - {step: 'apply', condition: {type: failed}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("route-withdraw-failure-" + string(inputs.intent.publication.node_id) + "-" + (inputs.intent.publication.route_id == "none" ? "none" : string(int(inputs.intent.publication.route_id) % 16))).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          if [ -f "$ORBIT_RUN/failure.json" ] && [ -n "$ORBIT_REFUSAL" ]; then timeout 10 cp -- "$ORBIT_RUN/failure.json" "$ORBIT_REFUSAL"; fi
          timeout 10 cat -- "$ORBIT_RUN/failure.json" 2>/dev/null || true
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
          ORBIT_REFUSAL: '${{ "refusal_path" in inputs.intent.publication ? inputs.intent.publication.refusal_path : "" }}'
    # Cleanup: the run folder after a failure; a success removed it in the apply phase, so this step is skipped.
  - name: 'cleanup'
    labels: {role: swamp}
    dependsOn:
    - {step: 'input', condition: {type: always}}
    - {step: compose, condition: {type: always}}
    - {step: apply, condition: {type: always}}
    - {step: failure, condition: {type: always}}
    guard: '${{ !steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("route-withdraw-cleanup-" + string(inputs.intent.publication.node_id) + "-" + (inputs.intent.publication.route_id == "none" ? "none" : string(int(inputs.intent.publication.route_id) % 16))).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
