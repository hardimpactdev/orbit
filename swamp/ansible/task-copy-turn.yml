---
# One agent turn in a task copy (docs/cli/task/copy-turn.mmd). T3's own CLI starts a thread with the admitted prompt, or sends it to
# the role's thread to continue it, waits for its run and reads the thread back. The CLI issues its T3 session inside the container
# and revokes it at exit, so no credential reaches the Node, Swamp or the Gateway. The title names the Orbit thread, so a run cut by
# its bound is still found, and a continued turn finds its thread. A reviewer works on the checked candidate, detached, and the task
# branch is checked out again at its tip after its turn. A run that waits for an answer has its question stored, and only then is it
# stopped, by `t3_copy_rpc.mjs` through the stock T3 server's own RPC: the answer comes as the next turn. Ansible keeps the raw replies out
# of its log and writes them to the run folder only; `@nckrtl/task-copy-turn` bounds and redacts them. Each T3 read and each helper call
# is bounded at 60 s, each Git command at 20 s.
- name: Address the recorded copy Node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: task_copy_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run the turn in the copy
  hosts: task_copy_node
  gather_facts: false
  become: true
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    # Non-login, as agent with its groups: `incus exec --user` would drop the `work` group that owns the checkout's Git folder.
    copy_exec: >-
      {{ ['incus', '--project', intent.runtime.project, 'exec', '--cwd', '/srv/workspace', intent.runtime.name, '--',
          '/usr/sbin/runuser', '-u', 'agent', '--', '/usr/bin/env', '-i', 'HOME=/home/agent', 'PATH=/usr/local/bin:/usr/bin:/bin'] }}
    copy_git: "{{ copy_exec + ['/usr/bin/timeout', '20', 'git', '-C', '/srv/workspace'] }}"
    reviewer: "{{ intent.turn.candidate | default(none) is not none }}"
  tasks:
    - name: Validate the admitted turn
      ansible.builtin.assert:
        that:
          - intent.runtime.project | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
          - intent.runtime.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$')
          - intent.turn.t3 | default('') is match('^/opt/orbit-agent/current/agent/bin/t3$')
          - intent.turn.node | default('') is match('^/opt/orbit-runtime/current/bin/node$')
          - intent.turn.thread | default('') in ['new', 'continue']
          - intent.turn.thread != 'new' or intent.turn.provider | default('', true) is match('^[A-Za-z][A-Za-z0-9]{0,63}$')
          - intent.turn.thread != 'new' or intent.turn.model | default('', true) is match('^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$')
          - intent.turn.candidate | default(none) is none or intent.turn.candidate is match('^[0-9a-f]{40}$')
          - intent.turn.title | default('') is match('^Orbit task [1-9][0-9]* thread [1-9][0-9]*$')
          - intent.turn.seconds | default(0) | int >= 60 and intent.turn.seconds | int <= 3600
          - intent.turn.prompt | default('') | length > 0
          - intent.turn.settle is defined and intent.turn.settle is sequence and intent.turn.settle is not string
          - intent.turn.settle | rejectattr('operation_id', 'integer') | list | length == 0
          - intent.turn.settle | map(attribute='title') | reject('match', '^Orbit task [1-9][0-9]* thread [1-9][0-9]*$') | list | length == 0
          - intent.turn.settle | map(attribute='branch') | select('string') | reject('match', '^task-[1-9][0-9]*$') | list | length == 0
        fail_msg: tasks.copy_turn_invalid
    # A copy the phase cannot reach fails here, before the launch mark: no turn can run there, so its group stays free.
    - name: Reach the copy as agent
      ansible.builtin.command:
        argv: "{{ copy_exec + ['/usr/bin/true'] }}"
      changed_when: false
    # An earlier turn that may still run is settled first by one rule: T3 lists its thread in no active state, or none of its title, and
    # a reviewer's checkout is clean on the task branch. While one is not, nothing is launched, and the work in the copy stays.
    - name: Settle the earlier turns
      when: intent.turn.settle | length > 0
      block:
        - name: List the threads to settle
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
          register: settle_threads
          failed_when: false
          changed_when: false
          no_log: true
        - name: Read the checkout a reviewer left
          when: intent.turn.settle | map(attribute='branch') | select('string') | list | length > 0
          block:
            - name: Read the checkout's changes
              ansible.builtin.command:
                argv: "{{ copy_git + ['status', '--porcelain'] }}"
              register: settle_status
              changed_when: false
            - name: Read the checkout's branch
              ansible.builtin.command:
                argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
              register: settle_branch
              failed_when: false
              changed_when: false
        - name: Name the settled turns
          vars:
            settle_listed: "{{ settle_threads.stdout | from_json if settle_threads.rc == 0 else none }}"
            settle_active: ['preparing', 'queued', 'starting', 'running', 'waiting']
          ansible.builtin.set_fact:
            settle_done: >-
              {% set done = [] %}{% for entry in intent.turn.settle if settle_listed is not none %}{% set mine = settle_listed
              | selectattr('title', 'equalto', entry.title) | list %}{% if (mine | length == 0 or (mine | length == 1
              and mine[0].status not in settle_active)) and (entry.branch is none or (settle_status.stdout | default('x') == ''
              and settle_branch.stdout | default('') == entry.branch)) %}{% set _ = done.append(entry.operation_id) %}{% endif %}{% endfor %}{{ done }}
          no_log: true
      rescue:
        # A list that is not JSON, or a checkout Git cannot read, settles nothing.
        - name: Settle nothing
          ansible.builtin.set_fact:
            settle_done: []
      always:
        - name: Write the settle evidence
          ansible.builtin.copy:
            content: >-
              {{ {'list_exit': settle_threads.rc | default(none), 'settled': settle_done | default([]),
                  'open': intent.turn.settle | map(attribute='operation_id') | reject('in', settle_done | default([])) | list} | to_json }}
            dest: "{{ run }}/settle.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require every earlier turn settled
          ansible.builtin.assert:
            that: intent.turn.settle | map(attribute='operation_id') | reject('in', settle_done | default([])) | list | length == 0
            fail_msg: tasks.copy_turn_unended
    # A continued turn sends to the T3 thread whose title names the Orbit thread. Without exactly one, nothing is launched. A list that
    # fails or is not JSON names no exit code: that is T3 failing, not a missing thread.
    - name: Find the thread to continue
      when: intent.turn.thread == 'continue'
      block:
        - name: List the threads
          ansible.builtin.command:
            argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
          register: turn_threads
          failed_when: false
          changed_when: false
          no_log: true
        - name: Name the thread to continue
          ansible.builtin.set_fact:
            turn_resumed: >-
              {{ ((turn_threads.stdout | from_json) if turn_threads.rc == 0 else [])
                 | selectattr('title', 'equalto', intent.turn.title) | map(attribute='threadId') | list }}
          no_log: true
      rescue:
        - name: Name no thread
          ansible.builtin.set_fact:
            turn_resumed: []
            turn_threads_unreadable: true
      always:
        - name: Write the thread evidence
          ansible.builtin.copy:
            content: >-
              {{ {'list_exit': none if turn_threads_unreadable | default(false) else turn_threads.rc | default(none),
                  'found': turn_resumed | default([]) | length} | to_json }}
            dest: "{{ run }}/continue.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require one thread to continue
          ansible.builtin.assert:
            that: turn_resumed | default([]) | length == 1
            fail_msg: >-
              {{ 'tasks.copy_thread_missing' if not turn_threads_unreadable | default(false) and turn_threads.rc | default(1) == 0
                 else 'tasks.copy_turn_failed' }}
    # A reviewer works on the checked candidate. A checkout with changes or without a branch is the implementer's work in progress:
    # nothing is launched, and nothing in it is touched.
    - name: Put the reviewer on the candidate
      when: reviewer
      block:
        - name: Read the checkout's changes
          ansible.builtin.command:
            argv: "{{ copy_git + ['status', '--porcelain'] }}"
          register: review_status
          changed_when: false
        - name: Read the checkout's branch
          ansible.builtin.command:
            argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
          register: review_branch
          failed_when: false
          changed_when: false
        - name: Require a clean checkout on a branch
          ansible.builtin.assert:
            that:
              - review_status.stdout == ''
              - review_branch.rc == 0 and review_branch.stdout | length > 0
            fail_msg: tasks.copy_tree_dirty
        # The restore requires the branch at this commit again: a reviewer that commits on it or moves it leaves it unrestored.
        - name: Read the branch's tip
          ansible.builtin.command:
            argv: "{{ copy_git + ['rev-parse', '--verify', 'HEAD'] }}"
          register: review_tip
          changed_when: false
        - name: Check the candidate out
          ansible.builtin.command:
            argv: "{{ copy_git + ['checkout', '--quiet', '--detach', intent.turn.candidate] }}"
          changed_when: true
        - name: Name the branch to restore
          ansible.builtin.set_fact:
            review_restore: "{{ review_branch.stdout }}"
        # From here the checkout is the reviewer's until `restore.json` says it is restored: a phase cut before that holds the group.
        - name: Mark the checkout as detached
          ansible.builtin.copy:
            content: "{}"
            dest: "{{ run }}/detach.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue:
        - name: Name the refusal
          ansible.builtin.set_fact:
            review_error: "{{ 'tasks.copy_tree_dirty' if ansible_failed_result.msg | default('') == 'tasks.copy_tree_dirty' else 'tasks.copy_turn_failed' }}"
      always:
        - name: Write the review evidence
          ansible.builtin.copy:
            content: "{{ {'ready': review_error is not defined, 'error_code': review_error | default(none)} | to_json }}"
            dest: "{{ run }}/review.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Require the reviewer's checkout
          ansible.builtin.assert:
            that: review_error is not defined
            fail_msg: "{{ review_error | default('') }}"
    # The run and its read; the reviewer's restore follows whatever happened in them.
    - name: Run the turn and read it back
      block:
        # Each evidence file is written as soon as its command ends, so a phase that the outer bound or a cancel cuts still tells
        # whether a turn was launched and how far it came.
        - name: Mark the turn as launched
          ansible.builtin.copy:
            content: "{}"
            dest: "{{ run }}/launch.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Start or continue the thread and wait for its run
          ansible.builtin.command:
            argv: >-
              {{ copy_exec + ['/usr/bin/timeout', '--kill-after=30', intent.turn.seconds | string, intent.turn.t3, 'thread']
                 + (['start', '--provider', intent.turn.provider, '--model', intent.turn.model, '--title', intent.turn.title, '--wait', '--json',
                     '/srv/workspace', '-'] if intent.turn.thread == 'new' else ['send', '--wait', '--json', turn_resumed | first, '-']) }}
            stdin: "{{ intent.turn.prompt }}"
            stdin_add_newline: false
          register: turn_start
          failed_when: false
          changed_when: true
          no_log: true
        - name: Write the start evidence
          ansible.builtin.copy:
            content: "{{ {'start_exit': turn_start.rc, 'start': turn_start.stdout | default('')} | to_json }}"
            dest: "{{ run }}/start.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        # `--wait` exits 2 when the run waits for an answer. The question is stored first; the run is stopped only after its evidence is
        # written, so a stopped run's question is never lost. The helper reads its session from `t3 auth session issue` itself and keeps it
        # in its memory only; the phase passes it nothing.
        - name: End the turn at its question
          when: turn_start.rc == 2
          block:
            - name: Name the waiting run
              ansible.builtin.set_fact:
                turn_waiting: "{{ turn_start.stdout | from_json }}"
              no_log: true
            - name: Read the question
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', 'read', turn_waiting.threadId] }}"
                stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
              register: turn_ask
              failed_when: false
              changed_when: false
              no_log: true
            - name: Write the question evidence
              ansible.builtin.copy:
                content: "{{ {'ask_exit': turn_ask.rc, 'ask': turn_ask.stdout | default('')} | to_json }}"
                dest: "{{ run }}/ask.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
            - name: Stop the run that asks
              when: turn_ask.rc == 0 and (turn_ask.stdout | from_json).requests | map(attribute='questions') | flatten | length > 0
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.node, '-', 'interrupt', turn_waiting.threadId, turn_waiting.runId] }}"
                stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
              register: turn_interrupt
              failed_when: false
              changed_when: true
              no_log: true
          rescue:
            # A start or a question that is not JSON stops nothing: the result reads the question as unread.
            - name: Stop nothing
              ansible.builtin.meta: noop
          always:
            - name: Write the interrupt evidence
              when: turn_interrupt.rc is defined
              ansible.builtin.copy:
                content: "{{ {'interrupt_exit': turn_interrupt.rc, 'interrupt': turn_interrupt.stdout | default('')} | to_json }}"
                dest: "{{ run }}/interrupt.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Read the thread back
          block:
            - name: Find the thread by its title
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'list', '--project', '/srv/workspace', '--json'] }}"
              register: turn_list
              failed_when: false
              changed_when: false
              no_log: true
            - name: Name the thread of this turn
              ansible.builtin.set_fact:
                turn_found: >-
                  {{ ((turn_list.stdout | from_json) if turn_list.rc == 0 else [])
                     | selectattr('title', 'equalto', intent.turn.title) | list }}
              no_log: true
            - name: Show the thread
              when: turn_found | length == 1
              ansible.builtin.command:
                argv: "{{ copy_exec + ['/usr/bin/timeout', '60', intent.turn.t3, 'thread', 'show', '--messages', '200', '--json', (turn_found | first).threadId] }}"
              register: turn_show
              failed_when: false
              changed_when: false
              no_log: true
          rescue:
            # A list that is not JSON reads as no thread found: the start evidence above still decides the turn.
            - name: Read no thread
              ansible.builtin.set_fact:
                turn_found: []
                turn_list_unreadable: true
          always:
            - name: Write the read evidence
              ansible.builtin.copy:
                content: >-
                  {{ {'list_exit': none if turn_list_unreadable | default(false) else turn_list.rc | default(none),
                      'found': turn_found | default([]) | length,
                      'status': ((turn_found | first).status | default(none)) if turn_found | default([]) | length == 1 else none,
                      'show_exit': turn_show.rc | default(none), 'show': turn_show.stdout | default('')} | to_json }}
                dest: "{{ run }}/read.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
      always:
        # After a reviewer turn, also a failed or cut one: what the reviewer changed goes, and the task branch is checked out again at
        # the tip it had. A checkout that is not clean on that branch and tip, or a run that still goes on and may change it again, holds
        # its group until task:cancel destroys the copy.
        - name: Restore the checkout after the reviewer
          when: review_restore is defined
          block:
            - name: Discard the reviewer's changes
              ansible.builtin.command:
                argv: "{{ copy_git + ['reset', '--quiet', '--hard'] }}"
              changed_when: true
            - name: Remove the reviewer's new files
              ansible.builtin.command:
                argv: "{{ copy_git + ['clean', '--quiet', '-fd'] }}"
              changed_when: true
            - name: Check the task branch out again
              ansible.builtin.command:
                argv: "{{ copy_git + ['checkout', '--quiet', review_restore] }}"
              changed_when: true
            - name: Read the restored changes
              ansible.builtin.command:
                argv: "{{ copy_git + ['status', '--porcelain'] }}"
              register: restored_status
              changed_when: false
            - name: Read the restored branch
              ansible.builtin.command:
                argv: "{{ copy_git + ['symbolic-ref', '--quiet', '--short', 'HEAD'] }}"
              register: restored_branch
              changed_when: false
            - name: Read the restored tip
              ansible.builtin.command:
                argv: "{{ copy_git + ['rev-parse', '--verify', 'HEAD'] }}"
              register: restored_tip
              changed_when: false
          rescue:
            - name: Name the failed restore
              ansible.builtin.set_fact:
                review_unrestored: true
          always:
            - name: Write the restore evidence
              ansible.builtin.copy:
                content: >-
                  {{ {'restored': not review_unrestored | default(false) and restored_status.stdout | default('x') == ''
                      and restored_branch.stdout | default('') == review_restore
                      and restored_tip.stdout | default('') == review_tip.stdout} | to_json }}
                dest: "{{ run }}/restore.json"
                mode: "0600"
              delegate_to: localhost
              become: false
              no_log: true
              vars:
                ansible_connection: local
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
