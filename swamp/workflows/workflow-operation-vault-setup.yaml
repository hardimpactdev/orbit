id: 6a0f42e3-1cd3-4d84-8b26-59ea7e7a321f
name: operation-vault-setup
description: Verify the account and collection with the official Bitwarden CLI on a Swamp worker.
vaults:
- orbit-control-inputs
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: vault.setup}
    intent:
      type: object
      properties:
        url:
          type: string
        client_id:
          type: string
          minLength: 1
        organization:
          type: string
          minLength: 1
        collection:
          type: string
          minLength: 1
        ca_file:
          type: string
          pattern: ^/
        published:
          type: boolean
        previous:
          type: object
          properties:
            organization_id:
              type: string
            collection_id:
              type: string
          required:
          - organization_id
          - collection_id
          additionalProperties: false
      required:
      - url
      - client_id
      - organization
      - collection
      - ca_file
      - published
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        configuration:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^vault-setup-[a-f0-9-]{36}$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - configuration
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: setup
  steps:
  - name: Prepare public data
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-prepare-public-data
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        env:
          ORBIT_VAULT_CONFIGURATION: ${{ vault.get(inputs.execution_secrets.configuration.vault, inputs.execution_secrets.configuration.key) }}
  - name: workspace
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-workspace
      methodName: execute
      inputs:
        run: timeout 30 mktemp -d -t orbit-vault-setup.XXXXXX
        env: {}
        timeout: 30000
    dependsOn:
    - step: Prepare public data
      condition:
        type: succeeded
  - name: Prepare session file
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: workspace
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-session-file
      methodName: execute
      inputs:
        run: timeout 30 install -m 0600 /dev/null "$BITWARDENCLI_APPDATA_DIR/session"
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
  - name: Configure the server
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-configure-the-server
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw config server "$ORBIT_URL" >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          ORBIT_URL: ${{ inputs.intent.url }}
        timeout: 60000
    dependsOn:
    - step: Prepare session file
      condition:
        type: succeeded
  - name: Log in
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-log-in
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw login --apikey >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_CLIENTID: ${{ inputs.intent.client_id }}
          BW_CLIENTSECRET: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.client_secret_key) }}
        timeout: 60000
    dependsOn:
    - step: Configure the server
      condition:
        type: succeeded
  - name: Unlock the vault
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-unlock-the-vault
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw unlock --passwordenv BW_PASSWORD --raw >"$BITWARDENCLI_APPDATA_DIR/session"
          2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_PASSWORD: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.master_password_key) }}
        timeout: 60000
    dependsOn:
    - step: Log in
      condition:
        type: succeeded
  - name: Resolve the session
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-resolve-the-session
      methodName: session
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
    dependsOn:
    - step: Unlock the vault
      condition:
        type: succeeded
  - name: Read account status
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-read-account-status
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw status >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/status" }}
        timeout: 60000
    dependsOn:
    - step: Resolve the session
      condition:
        type: succeeded
  - name: Read organizations
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-read-organizations
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw list organizations >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/organizations" }}
        timeout: 60000
    dependsOn:
    - step: Resolve the session
      condition:
        type: succeeded
  - name: Read collections
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-read-collections
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw list collections >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/collections" }}
        timeout: 60000
    dependsOn:
    - step: Resolve the session
      condition:
        type: succeeded
  - name: Check account KDF
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-check-account-kdf
      methodName: account
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        env:
          ORBIT_CLIENT_SECRET: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.client_secret_key) }}
          ORBIT_MASTER_PASSWORD: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.master_password_key) }}
    dependsOn:
    - step: Read account status
      condition:
        type: succeeded
  - name: Select the organization
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-select-the-organization
      methodName: organization
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        intent: ${{ inputs.intent }}
        env:
          ORBIT_CLIENT_SECRET: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.client_secret_key) }}
          ORBIT_MASTER_PASSWORD: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.master_password_key) }}
    dependsOn:
    - step: Read organizations
      condition:
        type: succeeded
  - name: Select the collection
    writes: true
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-select-the-collection
      methodName: collection
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
        intent: ${{ inputs.intent }}
        organization: ${{ steps["Select the organization"].outputs.id }}
        env:
          ORBIT_CLIENT_SECRET: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.client_secret_key) }}
          ORBIT_MASTER_PASSWORD: ${{ vault.get("orbit-control-inputs", steps["Prepare public data"].outputs.master_password_key) }}
    dependsOn:
    - step: Read collections
      condition:
        type: succeeded
    - step: Select the organization
      condition:
        type: succeeded
  - name: Probe write access
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-probe-write-access
      methodName: execute
      inputs:
        run: timeout 60 npx --yes --package=@bitwarden/cli@2026.6.0 bw create item <"$ORBIT_PROBE_FILE" >"$ORBIT_OUTPUT" 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_PROBE_FILE: ${{ steps["Select the collection"].outputs.payload_path }}
          ORBIT_OUTPUT: ${{ steps.workspace.outputs.stdout.trim() + "/probe" }}
        timeout: 60000
    dependsOn:
    - step: Check account KDF
      condition:
        type: succeeded
    - step: Select the collection
      condition:
        type: succeeded
  - name: Read probe identity
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-read-probe-identity
      methodName: probe
      inputs:
        directory: ${{ steps.workspace.outputs.stdout.trim() }}
    dependsOn:
    - step: Probe write access
      condition:
        type: succeeded
  - name: Verify the account
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/vault-sync-plan'
      behaviorName: vault-setup-verify-the-account
      methodName: setup
      inputs:
        intent: ${{ inputs.intent }}
        email: ${{ steps["Check account KDF"].outputs.email }}
        organization: ${{ steps["Select the organization"].outputs }}
        collection: ${{ steps["Select the collection"].outputs }}
        env:
          ORBIT_VAULT_CONFIGURATION: ${{ vault.get(inputs.execution_secrets.configuration.vault, inputs.execution_secrets.configuration.key) }}
    dependsOn:
    - step: Read probe identity
      condition:
        type: succeeded
  - name: Clear the session
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-clear-the-session
      methodName: execute
      inputs:
        run: timeout 30 npx --yes --package=@bitwarden/cli@2026.6.0 bw delete item "$ORBIT_PROBE_ID" --permanent >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
          BW_SESSION: ${{ vault.get("orbit-control-inputs", steps["Resolve the session"].outputs.session_key) }}
          ORBIT_PROBE_ID: ${{ steps["Read probe identity"].outputs.id }}
        timeout: 30000
    dependsOn:
    - step: Verify the account
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    guard: ${{ !("Read probe identity" in steps) || steps["Read probe identity"].status != "succeeded" }}
  - name: Log out
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-log-out
      methodName: execute
      inputs:
        run: timeout 30 npx --yes --package=@bitwarden/cli@2026.6.0 bw logout >/dev/null 2>/dev/null
        env:
          BITWARDENCLI_APPDATA_DIR: ${{ steps.workspace.outputs.stdout.trim() }}
          BW_NOINTERACTION: 'true'
          NODE_EXTRA_CA_CERTS: ${{ inputs.intent.ca_file }}
        timeout: 30000
    dependsOn:
    - step: Clear the session
      condition:
        type: or
        conditions:
        - type: completed
        - type: skipped
    guard: ${{ steps.workspace.status != "succeeded" }}
    allowFailure: true
  - name: Remove CLI session
    labels:
      role: swamp
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: vault-setup-remove-cli-session
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_VAULT_DIRECTORY"
        env:
          ORBIT_VAULT_DIRECTORY: ${{ steps.workspace.outputs.stdout.trim() }}
        timeout: 30000
    dependsOn:
    - step: Log out
      condition:
        type: completed
    guard: ${{ steps.workspace.status != "succeeded" }}
  - name: Confirm the setup
    labels:
      role: swamp
    dependsOn:
    - step: Verify the account
      condition:
        type: succeeded
    - step: Clear the session
      condition:
        type: completed
    - step: Remove CLI session
      condition:
        type: completed
    task:
      type: assert
      expr: steps["Clear the session"].status == "succeeded" && steps["Remove CLI session"].status == "succeeded"
      message: Vault account verification or session cleanup failed.
      severity: high
