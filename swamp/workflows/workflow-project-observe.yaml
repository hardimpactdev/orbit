id: 0e659cfe-fc72-4853-af4e-611c6d4fd8f7
name: project-observe
description: Observe admitted Project pull requests once and project public lifecycle evidence.
vaults:
- orbit-control-inputs
inputs:
  type: object
  additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      enum:
      - 209
    kind: {type: string, const: project.observe}
    intent:
      type: object
      additionalProperties: false
      required:
      - project
      - groups
      - pr_urls
      - admitted_at
      properties:
        project:
          type: object
          required:
          - id
          - repository
          - default_branch
          - check
          additionalProperties: false
          properties:
            id:
              type: integer
              minimum: 1
            repository:
              type: string
              minLength: 1
            default_branch:
              type: string
              minLength: 1
            check:
              type: string
              minLength: 1
        groups:
          type: array
          items:
            type: object
        pr_urls:
          type: array
          maxItems: 128
          items:
            type: string
            pattern: ^https://github\.com/[^/]+/[^/]+/pull/[1-9][0-9]*$
        admitted_at:
          type: string
          format: date-time
    execution_secrets:
      type: object
      properties: {}
      propertyNames:
        enum:
        - github_token
      maxProperties: 1
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^project-dependency-read-[1-9][0-9]*$
        required:
        - vault
        - key
        additionalProperties: false
reports:
  skip:
  - '@swamp/workflow-summary'
jobs:
- name: observe
  labels:
    role: swamp
  steps:
  - name: Read the watched PRs
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: project-dependency-evidence
      inputs:
        operation_id: ${{ inputs.operation_id }}
        project: ${{ inputs.intent.project }}
        groups: ${{ inputs.intent.groups }}
        pr_urls: ${{ inputs.intent.pr_urls }}
        previous_pr: []
        execution_secrets: ${{ inputs.execution_secrets }}
    dependsOn: []
  - name: Refresh the findings index
    labels:
      role: swamp
    dependsOn:
    - step: Read the watched PRs
      condition:
        type: succeeded
    task:
      type: model_method
      modelIdOrName: orbit-gateway
      methodName: refresh
      inputs:
        rows: '${{ steps["Read the watched PRs"].outputs.evidence.previous_index == null ? [] : [{"project":steps["Read
          the watched PRs"].outputs.evidence.project,"index":steps["Read the watched PRs"].outputs.evidence.previous_index,"evidence":steps["Read
          the watched PRs"].outputs.evidence.evidence}] }}'
        result: ${{ steps["Read the watched PRs"].outputs.evidence.result }}
queueTimeout: 30
