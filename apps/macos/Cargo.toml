[package]
name = "orbit-macos"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "orbit_macos"
path = "src/lib.rs"

[[bin]]
name = "orbit-macos"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
json-patch = "3"
minisign-verify = "0.2"
orbit-agent = { path = "../agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
ureq = { version = "2", features = ["native-certs"] }
url = "2"

[dev-dependencies]
minisign = "0.7"

[build-dependencies]
json-patch = "3"
serde_json = "1"
tauri-build = { version = "2", features = [] }
