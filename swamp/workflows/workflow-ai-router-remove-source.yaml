id: 51049b19-ed9c-4d63-a3d8-f4624b342e50
name: ai-router-remove-source
description: Route fixed collector source retirement to the admitted Node through
  native placement and the shared light-Node transport.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_.-]+$
    intent:
      type: object
      properties:
        target_node_id:
          type: integer
          minimum: 1
        retired:
          type: boolean
      required:
      - target_node_id
      - retired
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: ordinary
  steps:
  - name: remove-ordinary
    target: ${{ "orbit-node-" + string(inputs.intent.target_node_id) }}
    labels:
      node: ${{ string(inputs.intent.target_node_id) }}
    guard: ${{ inputs.intent.target_node_id in [1,18] }}
    writes: true
    task:
      type: workflow
      workflowIdOrName: ai-router-remove-source-ordinary
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
- name: proxy
  steps:
  - name: remove-proxy
    target: ${{ "orbit-node-" + string(inputs.intent.target_node_id) }}
    labels:
      node: ${{ string(inputs.intent.target_node_id) }}
    guard: ${{ !(inputs.intent.target_node_id in [1,18]) }}
    writes: true
    task:
      type: workflow
      workflowIdOrName: ai-router-remove-source-proxy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
