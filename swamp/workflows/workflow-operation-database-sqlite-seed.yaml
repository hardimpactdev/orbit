id: b33533ee-6cf6-5929-860d-6455ce15fc04
name: operation-database-sqlite-seed
queueTimeout: 30
description: Admitted SQLite actions through official SSH from Node 209; native recovery and public terminal projection.
writes: true
vaults: []
inputs: {type: object, properties: {operation_id: {type: integer, minimum: 1}, node_id: {type: integer, minimum: 1}, kind: {type: string, enum: [database.sqlite_seed]}, intent: {type: object},
    execution_secrets: {type: object, additionalProperties: false}}, required: [operation_id, node_id, kind, intent, execution_secrets], additionalProperties: false}
jobs:
- name: sqlite
  target: orbit-node-209
  steps:
  - name: run
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: database-sqlite-seed
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{ inputs.execution_secrets
          }}'}
  - name: result
    target: orbit-node-209
    dependsOn:
    - {step: run, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite-command-assets'
      behaviorName: ${{ "dbsm-" + run.id }}
      methodName: result
      inputs: {kind: '${{ inputs.kind }}', expected: [run], steps: '${{ steps }}'}
  - name: accept_result
    target: orbit-node-209
    dependsOn:
    - {step: result, condition: {type: succeeded}}
    task:
      type: assert
      expr: steps.result.outputs.exitCode == 0
      severity: high
      message: SQLite child did not complete.
