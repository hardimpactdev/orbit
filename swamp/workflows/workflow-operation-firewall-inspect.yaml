id: 64e7b66e-e7e4-42c6-ad24-3aa96f2cb56d
name: operation-firewall-inspect
description: One pinned SSH UFW read from209 with native typed comparison.
vaults: []
queueTimeout: 30
target: orbit-node-209
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [firewall.inspect]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: inspection
    steps:
      - name: read
        target: orbit-node-209
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "firewall-read-" + run.id }}'
          methodName: exec
          globalArgs:
            name: '${{ "firewall-read-" + run.id }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh.target.user }}'
              port: '${{ inputs.intent.ssh.target.port }}'
              identityFile: '${{ inputs.intent.ssh.identity_file }}'
              hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}'}]
          inputs:
            hosts: name:target
            argv: [/usr/sbin/ufw, status, numbered]
            sudo: true
      - name: result
        target: orbit-node-209
        dependsOn: [{step: read, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@nckrtl/firewall-inspection'
          behaviorName: '${{ "firewall-result-" + run.id }}'
          methodName: inspect
          inputs:
            stdout: '${{ steps.read.outputs.stdout }}'
            expected: '${{ inputs.intent.expected }}'
