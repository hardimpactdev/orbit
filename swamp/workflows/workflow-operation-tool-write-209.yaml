    dependsOn: [{step: Install the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Install Homebrew formula, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: Upgrade the package, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    guard: ${{ !steps.decide.outputs.mutate || inputs.intent.manager != "brew" }}
    task: {type: behavior, behaviorType: '@swamp/cfgmgmt/homebrew', behaviorName: '${{ "tool-formula-end-" + string(inputs.node_id) }}', methodName: check, inputs: {}, globalArgs: {nodeHost: '${{ inputs.ssh.target.host }}', nodeUser: '${{ inputs.ssh.target.user }}', nodePort: '${{ inputs.ssh.target.port }}', nodeIdentityFile: '${{ inputs.ssh.identity_file }}', packages: ['${{ inputs.intent.package }}'], ensure: present}}
  - name: Check the package
