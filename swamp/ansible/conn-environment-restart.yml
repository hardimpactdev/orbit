---
# The T3 restart of one running container for its machine name (docs/cli/conn/environment-restart.mmd). The Gateway read T3's threads
# with its admin session just before it admitted the run, and found no working run and no pending request.
#   restart: read the container; one that no longer runs, or whose /etc/machine-info lacks the name, is skipped; one whose T3 service runs
#   a terminal or a turn's process answers busy. Else
#   `systemctl try-restart t3.service`, then a bounded wait until T3 answers inside the container with the name as its label. Nothing
#   else restarts, and the restart itself is never repeated.
# It writes `result.json` in the run folder: `{"answer": "restarted", "restart_at": …}`,
# `{"answer": "skipped", "reason": "frozen"|"stopped"|"name_not_written"}`, `{"answer": "busy", "reason": "processes", "terminals": n,
# "commands": n}`, `{"answer": "busy", "reason": "processes_unreadable"}`, or the public error code.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: container_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Restart T3 in the container
  hosts: container_node
  gather_facts: false
  become: true
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    container: "{{ intent.container }}"
    as_agent: >-
      {{ ['incus', 'exec', '--project', container.project, '--cwd', '/home/agent', '--env', 'HOME=/home/agent', container.name,
          '--', 'runuser', '-u', 'agent', '--'] }}
    # The label read after the restart: 21 tries of at most about 4 s each (a 2 s curl, the exec, a 1 s delay).
    restart_retries: 20
    restart_delay: 1
  tasks:
    # Worst case inside the phase's 240 s: two reads, the try-restart's 100 s (systemd's 90 s stop of T3, and its start) and the
    # label reads' about 84 s, with room for the rescue to write the result.
    - name: Run the restart
      tags: [restart]
      block:
        # A container that froze or stopped after the Gateway's read reads the name at its next start.
        - name: Read the container
          ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
          register: restart_read
          changed_when: false

        - name: Skip a container that no longer runs
          when: (restart_read.stdout | from_json).status != 'Running'
          ansible.builtin.set_fact:
            restart_result: { answer: skipped, reason: "{{ 'frozen' if (restart_read.stdout | from_json).status == 'Frozen' else 'stopped' }}" }

        # The Node converge writes the name. Before it ran, a restart would read the old name again.
        - name: Read the written name
          when: restart_result is not defined
          ansible.builtin.command: { argv: [incus, exec, --project, "{{ container.project }}", "{{ container.name }}", --, cat, /etc/machine-info] }
          register: restart_machine_info
          changed_when: false
          failed_when: false

        - name: Skip a container whose name is not written
          when: restart_result is not defined and (restart_machine_info.stdout ~ '\n') != intent.machine_info
          ansible.builtin.set_fact:
            restart_result: { answer: skipped, reason: name_not_written }

        # The last guard, one read before the restart: systemd's MainPID of t3.service, its descendant cgroups (cgroup.stat) and its
        # exact members, with each one's parent, session, tty and name. Only a member that has exited may lack its line. The rule is the table in docs/reference/development-containers.md#existing-instances,
        # applied by templates/t3-service-processes.j2. A read that fails keeps the container busy.
        - name: Read the processes of T3's service
          when: restart_result is not defined
          ansible.builtin.command:
            argv:
              - incus
              - exec
              - --project
              - "{{ container.project }}"
              - "{{ container.name }}"
              - --
              - sh
              - -c
              - >-
                set -eu; main=$(systemctl show -p MainPID --value t3.service); cg=/sys/fs/cgroup/system.slice/t3.service;
                procs=$(cat "$cg/cgroup.procs"); echo "main $main";
                echo "children $(sed -n 's/^nr_descendants //p' "$cg/cgroup.stat" | grep . || echo -1)";
                for p in $procs; do ps -o pid=,ppid=,sid=,tty=,comm= -p "$p" || [ ! -d "/proc/$p" ]; done
          register: restart_ps
          changed_when: false
          failed_when: false

        - name: Keep a container busy whose T3 runs a terminal or a command, or whose processes cannot be read
          when: restart_result is not defined and (not restart_users.readable or (restart_users.terminals + restart_users.commands) > 0)
          ansible.builtin.set_fact:
            restart_result: >-
              {{ {'answer': 'busy', 'reason': 'processes', 'terminals': restart_users.terminals, 'commands': restart_users.commands}
                 if restart_users.readable else {'answer': 'busy', 'reason': 'processes_unreadable'} }}
          vars:
            restart_users: >-
              {{ (lookup('ansible.builtin.template', 'templates/t3-service-processes.j2',
                         template_vars={'lines': restart_ps.stdout_lines if restart_ps.rc == 0 else []}) | from_json) }}

        # The time the Gateway read is measured against (docs/reference/development-containers.md#the-restart-window).
        - name: Note the time of the restart
          when: restart_result is not defined
          ansible.builtin.set_fact:
            restart_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%S.%fZ') }}"

        # t3.service sets no KillMode: the stop ends every process of its cgroup, T3 terminals and what runs in them included.
        - name: Restart T3
          when: restart_result is not defined
          ansible.builtin.command:
            argv: [incus, exec, --project, "{{ container.project }}", "{{ container.name }}", --, timeout, "100", systemctl, try-restart, --, t3.service]
          changed_when: true

        # Type=simple reads as active the moment T3 forks, so the label read inside the container is the check that it is back.
        - name: Wait until T3 shows the name
          when: restart_result is not defined
          block:
            - name: Read T3's label
              ansible.builtin.command:
                argv: "{{ as_agent + ['curl', '--fail', '--silent', '--max-time', '2', 'http://127.0.0.1:' ~ intent.t3_port ~ '/.well-known/t3/environment'] }}"
              register: restart_label
              changed_when: false
              failed_when: false
              retries: "{{ restart_retries }}"
              delay: "{{ restart_delay }}"
              until: restart_label.rc == 0 and (restart_label.stdout | from_json).label | default('') == intent.name
            - name: Refuse a T3 that does not answer
              ansible.builtin.assert: { that: [restart_label.rc == 0], fail_msg: conn.t3_unready, quiet: true }
            - name: Refuse a label that is not the name
              ansible.builtin.assert:
                that: [(restart_label.stdout | from_json).label | default('') == intent.name]
                fail_msg: conn.t3_label_mismatch
                quiet: true

        - name: Write the result
          ansible.builtin.copy:
            content: "{{ restart_result | default({'answer': 'restarted', 'restart_at': restart_at}) | to_json }}"
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
          vars: &local
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue:
        - name: Write the failure
          ansible.builtin.copy:
            content: >-
              {{ {'error_code': ansible_failed_result.msg
                  if (ansible_failed_result.msg | default('') is match('^conn\.[a-z0-9_]+$'))
                  else 'conn.t3_restart_failed', 'restart_at': restart_at | default(none)} | to_json }}
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
          vars: *local
        - name: Fail the restart
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The T3 restart failed.') }}"
