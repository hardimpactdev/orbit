---
# The Instance image (docs/reference/development-containers.md#inside-a-container). Its alias is a digest of the whole definition the
# Gateway sends, so a host builds each definition once. A build container from the stock image installs the OS packages, sets up the
# users, the workspace and the firewall, and is published under the alias; the stable alias `orbit-instance` then names it, and the
# images it replaced go. The build container reaches the internet as every container does, through the egress proxy that the profile
# names for `incus exec` (tasks/instance-egress.yml), and it takes the bridge's last address, which no Instance gets.
- name: Read the Instance images
  environment: &image_local
    INCUS_REMOTE: local
    INCUS_SOCKET: "{{ container_image_socket }}"
  ansible.builtin.command: { argv: [incus, --project, "{{ instances.project }}", image, list, --format, json] }
  register: image_list
  changed_when: false

- name: Build the image
  environment: *image_local
  when: instances.image.alias not in (image_list.stdout | from_json | map(attribute='aliases') | flatten | map(attribute='name') | list)
  vars:
    build: orbit-instance-build
    in_build: [incus, exec, --project, "{{ instances.project }}", orbit-instance-build, --env, DEBIAN_FRONTEND=noninteractive, --]
  block:
    - name: Read existing prepared-image builders
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances?project={{ instances.project }}&recursion=1"] }
      register: image_leftover
      changed_when: false
    - name: Refuse a prior prepared-image builder
      ansible.builtin.assert:
        that: build not in (image_leftover.stdout | from_json | map(attribute='name') | list)
        fail_msg: >-
          instance.host_unavailable: instance {{ instances.project }}/{{ build }} requires an operator;
          see /solutions/incus-shared-image-refresh#operator-cleanup
    - name: Create the build container
      ansible.builtin.command:
        argv: [incus, --project, "{{ instances.project }}", init, "{{ instances.stock }}", "{{ build }}",
               --config, security.idmap.isolated=true, --device, "eth0,ipv4.address={{ instances.build_address }}"]
      register: image_created
      changed_when: true
    - name: Read the build container's effective devices
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances/{{ build }}?project={{ instances.project }}"] }
      register: image_nic_read
      changed_when: false
    - name: Check every effective build container NIC before starting
      ansible.builtin.include_tasks: instance-network-nic-check.yml
      vars:
        network_container: "{{ image_nic_read.stdout | from_json }}"
        network_name: "{{ instances.network }}"
        network_failure: instance.container_network_unsafe
        expected_network_device: eth0
    - name: Start the build container
      ansible.builtin.command: { argv: [incus, --project, "{{ instances.project }}", start, "{{ build }}"] }
      changed_when: true
    # Cloud-init's first boot makes the stock `ubuntu` user and its sudo grant; the setup script removes them only after it.
    # A container has no guest agent, so `cloud-init status --wait` blocks from the first moment of the boot. It exits 2 when
    # cloud-init finished with a recoverable warning; both are a finished boot.
    - name: Let cloud-init finish
      ansible.builtin.command: { argv: [incus, exec, --project, "{{ instances.project }}", "{{ build }}", --, cloud-init, status, --wait] }
      timeout: 400
      register: image_cloud_init
      changed_when: false
      failed_when: image_cloud_init.rc not in [0, 2]
    # The stock image starts its network a moment after the container. apt goes through the proxy, which resolves the names.
    - name: Read the package index
      ansible.builtin.command: { argv: "{{ in_build + ['apt-get', 'update'] }}" }
      register: image_index
      until: image_index.rc == 0
      retries: 30
      delay: 2
      changed_when: true
    - name: Install the OS packages
      ansible.builtin.command: { argv: "{{ in_build + ['apt-get', 'install', '--yes', '--no-install-recommends', '--'] + instances.image.packages }}" }
      changed_when: true
    - name: Set up the users, the workspace and no sudo
      ansible.builtin.command: { argv: "{{ in_build + ['sh', '-c', instances.image.prepare] }}" }
      changed_when: true
    - name: Write the image files
      ansible.builtin.command:
        argv: [incus, file, push, --project, "{{ instances.project }}", --create-dirs, --uid, "{{ item.uid }}", --gid, "{{ item.gid }}",
               --mode, "{{ item.mode }}", "-", "{{ build }}{{ item.path }}"]
        stdin: "{{ item.content }}"
        stdin_add_newline: false
      loop: "{{ instances.image.files }}"
      loop_control: { label: "{{ item.path }}" }
      changed_when: true
    - name: Enable the units and clean up
      ansible.builtin.command: { argv: "{{ in_build + item }}" }
      loop: "{{ instances.image.finish }}"
      changed_when: true
    # Nothing may publish an image with a sudo path: no `ubuntu` user, nothing in sudoers.d but its README, and no member of the
    # groups `sudo` or `admin`.
    - name: Read the sudo paths of the image
      ansible.builtin.command:
        argv: "{{ in_build + ['sh', '-c', image_audit] }}"
      vars:
        image_audit: >-
          getent passwd ubuntu >/dev/null && echo user:ubuntu;
          for f in /etc/sudoers.d/*; do [ "$f" = /etc/sudoers.d/README ] || [ ! -e "$f" ] || echo "sudoers:$f"; done;
          getent group sudo admin | cut -d: -f4 | tr , '\n' | sed '/^$/d; s/^/member:/'; true
      register: image_sudo
      changed_when: false
    - name: Require an image without a sudo path
      ansible.builtin.assert:
        that: image_sudo.stdout | trim == ''
        fail_msg: "instance.host_unavailable: the image keeps a sudo path: {{ image_sudo.stdout_lines | join(', ') }}"
        quiet: true
    - name: Stop and publish the build container
      ansible.builtin.command: { argv: "{{ ['incus', '--project', instances.project] + item }}" }
      loop:
        - [stop, "{{ build }}"]
        - [publish, "{{ build }}", --alias, "{{ instances.image.alias }}", user.orbit.stock-build=]
      changed_when: true
  always:
    - name: Remove the build container
      when: image_created is defined and image_created.rc == 0
      ansible.builtin.command: { argv: [incus, --project, "{{ instances.project }}", delete, --force, "--", "{{ build }}"] }
      register: image_removed
      changed_when: false
      failed_when: image_removed.rc != 0 and 'not found' not in image_removed.stderr

- name: Read the Instance images after the build
  environment: *image_local
  ansible.builtin.command: { argv: [incus, --project, "{{ instances.project }}", image, list, --format, json] }
  register: image_built
  changed_when: false

- name: Select the image and the image of the stable alias
  ansible.builtin.set_fact:
    image_current: "{{ image_of[instances.image.alias] }}"
    image_stable: "{{ image_of['orbit-instance'] | default('') }}"
  vars:
    image_of: >-
      {%- set out = {} -%}
      {%- for image in image_built.stdout | from_json -%}
        {%- for alias in image.aliases -%}{%- set _ = out.update({alias.name: image.fingerprint}) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Point the stable alias at the image
  environment: *image_local
  when: image_stable != image_current
  ansible.builtin.command:
    argv: [incus, query, --request, "{{ 'PUT' if image_stable != '' else 'POST' }}", --data,
           "{{ ({'target': image_current} if image_stable != '' else {'name': 'orbit-instance', 'target': image_current}) | to_json }}",
           --, "/1.0/images/aliases{{ '/orbit-instance' if image_stable != '' else '' }}?project={{ instances.project }}"]
  changed_when: true
