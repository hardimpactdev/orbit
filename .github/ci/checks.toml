# Fixture input closure includes local imports, copied scripts and Ansible includes.
# Costs start with shape-full.log; hosted ci-unit-times artifacts own later measurements.
# Primary case costs use completed hosted evidence from runs 43000765953, 43002948719, 43005032403 and 43010311414.
# Unmeasured primary cases use their file's largest completed retained case; they remain estimates.
# The inventory binds these declarations to exact registered names. Startup is budgeted separately.
[budget]
# The declared seconds one unit may fill. A lane that holds several units is shorter: see [runner-pool].
shard_seconds = 150
# Counted from the job's first step, not from the start of the units. A pool job spent 14.5 seconds at most before that
# step and 14 at most after its units (17 November 2026, 1,003 jobs), so the named cut stays inside shard_ceiling_seconds.
shard_deadline_seconds = 210
shard_ceiling_seconds = 240
shard_workers = 2
unit_ceiling_seconds = 180
slice_seconds = 60
slice_startup_seconds = 6
pr_shards = 20
# Maximum planned fixture jobs across both classes, independent of available runner slots. The shorter shared lane of
# [runner-pool] needs two more jobs than the former 18 and 8 for the largest plans of 17 November 2026.
runner_shards = 20
# Extra spreading target, not a wave count. Retain jobs needed for admission up to runner_shards.
spread_shards = 16
# Tool-dependent shards keep a separate per-class limit and also count against runner_shards.
self_hosted_shards = 10
# Concurrent units in one self-hosted shard. Its runner container shares the Node's memory with proof copies; four
# Ansible units at once made the cgroup reclaim memory until the heaviest units ran past unit_ceiling_seconds.
self_hosted_workers = 2
default_cost = 30
# A change to the fixture machinery (this table's shared sections, the loader, planner, runner, slice preload, shape gate
# or Ansible toolchain pins) selects these files, not every fixture: a Python unit, a Python unit with case_costs and a
# Deno unit with a receipt, then one small hosted Ansible fixture per family: container, host, node, migrate and worker.
machinery_canary = [
  "swamp/tests/ansible_inputs_test.py",
  "swamp/tests/instance_machine_name_test.py",
  "swamp/tests/clone_launch_redactor_test.ts",
  "swamp/tests/ansible_container_host_system_test.py",
  "swamp/tests/ansible_task_host_firewall_remove_test.ts",
  "swamp/tests/node_converge_test.ts",
  "swamp/tests/ansible_instance_migrate_source_test.ts",
  "swamp/tests/ansible_gateway_swamp_pin_test.ts",
]
# ADR 0262 step 2 names each file here: it cannot always fit the shards when selected. Units that fit run;
# the rest are named "not run" in the plan and do not block the merge. Overflow of any other file fails Required.
capacity_gap = [
  "swamp/tests/ansible_instance_migrate_preflight_test.ts",
  "swamp/tests/ansible_instance_migrate_move_test.ts",
  "swamp/tests/ansible_instance_container_test.ts",
  # A case above the 150-second lane on the self-hosted pool; ADR 0262 names each case.
  "swamp/tests/ansible_instance_host_test.ts",
  "swamp/tests/ansible_wireguard_hub_lan_rules_test.py",
  # The largest hosted file: 90 units that fill 17 of the 20 shards. A change to an input of every case, such as the
  # converge inputs list, together with a host task leaves no room for both. The split of this file by phase
  # (narrow inputs per file) removes this line, and its entry in capacity_gap_first.
  "swamp/tests/ansible_instance_fleet_test.ts",
  # Two large hosted files: 70 units and 2,462 of the 4,160 declared seconds that 16 hosted shards hold.
  # With other selected work, as in a plan that also carries undelivered main revisions, they pass runner_shards.
  # A hosted gap applies only when other changes select the file; a change to the file itself runs all its units.
  "swamp/tests/ansible_task_copy_turn_test.ts",
  "swamp/tests/ansible_instance_host_image_test.ts",
]
# Hosted gap files that keep their place before the other hosted gaps. Those keep their order by directness.
capacity_gap_first = ["swamp/tests/ansible_instance_fleet_test.ts"]

[runner-pool]
# Observed shared pool for pressure reports: ci-sabre-1..5 and ci-shark-1..5, measured in main CI on 2026-11-17.
# This is not online inventory or a reservation. See implementation-loop.md#shared-fixture-capacity.
slots = 10
# A shard can start on either host, and the plan cannot choose. The same unit takes 1.57 times as long on Sabre as on
# Shark (median of 335 units in 97 runs on 17 November 2026), and a Sabre shard ran up to 1.51 times its declared lane
# before the deadline cut it. The planner divides shard_seconds by this factor for a lane that holds more than one unit:
# 130 declared seconds, which 1.6 times over still ends inside the shard deadline. A unit alone in a lane may still fill
# shard_seconds. See implementation-loop.md#the-lane-of-the-slowest-runner.
slowest_runner_factor = 1.15

