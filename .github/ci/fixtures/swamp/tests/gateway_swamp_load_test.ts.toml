order = 780
cases = [
  "the release load compares only the commit's workflows, never a Schedule's",
  "the release load checks the Ansible collections without failing the release, and installs nothing",
  "a pin equal to the release's requirements.yml passes",
  "a pin from another requirements.yml fails the check with the converge that installs the collections",
  "a forced rollback release moves the serve checkout back to an ancestor commit",
  "an unforced load refuses an ancestor commit and leaves the checkout alone",
  "an unforced load moves the serve checkout forward",
  "the release passes its force flag to the load",
  "the checkout reads the release commit and the force flag from the load intent",
  "retained rollback checks out the sealed commit with an unavailable origin",
  "a resumed load checks the exact Gateway target before changing the staging checkout",
  "the load runs under pipefail on dash",
  "a refused serve-driver token names the expired token and its renewal, not a bare jq exit",
  "another swamp failure prints its stderr without blaming the token",
]
file = "swamp/tests/gateway_swamp_load_test.ts"
host_programs = ["jq"]
cost = 1
inputs = [
  "bin/swamp-shape-gate",
  "bin/gateway-release-phase",
  "swamp/ansible/ansible.cfg",
  "swamp/ansible/requirements.txt",
  "swamp/ansible/requirements.yml",
  "swamp/ansible/shape-gate-requirements.txt",
  "swamp/workflows/workflow-operation-gateway-release.yaml",
  "swamp/workflows/workflow-operation-gateway-swamp-load.yaml",
]
