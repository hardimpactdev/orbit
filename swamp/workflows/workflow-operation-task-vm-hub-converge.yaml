id: 07491a2f-25a8-4458-92dd-e58e467ac28c
name: operation-task-vm-hub-converge
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum: [task_vm.hub_converge]
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
    - operation_id
    - node_id
    - kind
    - intent
    - execution_secrets
  additionalProperties: false
jobs:
  - name: hub
    steps:
      - {name: validate, target: orbit-node-209, writes: true, task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: exec, globalArgs: &ref_0 {name: '${{ "task-vm-hub-"+run.id }}', transport: {kind: ssh, user: '${{ inputs.intent.ssh.target.user }}', port: '${{ inputs.intent.ssh.target.port }}', identityFile: '${{ inputs.intent.ssh.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.intent.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}}]}, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/sbin/nft, '--check', '--file', '-'], stdin: '${{ inputs.intent.nft }}'}}}
      - {name: filter_assets, target: orbit-node-209, dependsOn: [{step: validate, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@nckrtl/node-role-converge-command', behaviorName: filter_assets, methodName: read, inputs: {action: file, input: {path: /etc/orbit/task-vms/hub.nft, content: '${{ inputs.intent.nft }}', marker: '# Managed by Orbit (task VMs).', mode: '0600', owner: 'root:root'}}}}
      - {name: filter_command, target: orbit-node-209, writes: true, dependsOn: [{step: filter_assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: script, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, interpreter: python3, script: '${{ steps["filter_assets"].outputs.script_body }}'}}}
      - {name: filter, target: orbit-node-209, dependsOn: [{step: filter_command, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@nckrtl/node-role-converge-command', behaviorName: filter, methodName: decode, inputs: {stdout: '${{ steps["filter_command"].outputs.stdout }}'}}}
      - {name: unit_assets, target: orbit-node-209, dependsOn: [{step: filter, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@nckrtl/node-role-converge-command', behaviorName: unit_assets, methodName: read, inputs: {action: file, input: {path: /etc/systemd/system/orbit-task-vms-hub.service, content: '${{ inputs.intent.unit }}', marker: "[Unit]\nDescription=Orbit task VM filter on the WireGuard hub\n", mode: '0644', owner: 'root:root'}}}}
      - {name: unit_command, target: orbit-node-209, writes: true, dependsOn: [{step: unit_assets, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: script, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, interpreter: python3, script: '${{ steps["unit_assets"].outputs.script_body }}'}}}
      - {name: unit, target: orbit-node-209, dependsOn: [{step: unit_command, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@nckrtl/node-role-converge-command', behaviorName: unit, methodName: decode, inputs: {stdout: '${{ steps["unit_command"].outputs.stdout }}'}}}
      - {name: control_ssh, target: orbit-node-209, writes: true, dependsOn: [{step: unit, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: '${{ inputs.intent.control_rule }}'}}}
      - {name: reload, target: orbit-node-209, writes: true, dependsOn: [{step: control_ssh, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/systemctl, daemon-reload]}}}
      - {name: enable, target: orbit-node-209, writes: true, dependsOn: [{step: reload, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/systemctl, enable, orbit-task-vms-hub.service]}}}
      - {name: activate, target: orbit-node-209, writes: true, dependsOn: [{step: enable, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/bin/systemctl, restart, orbit-task-vms-hub.service]}}}
      - {name: observe, target: orbit-node-209, writes: true, dependsOn: [{step: activate, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ "task-vm-hub-"+run.id }}', methodName: exec, globalArgs: *ref_0, inputs: {hosts: 'name:target', sudo: true, argv: [/usr/sbin/nft, '--json', list, table, inet, orbit_task_vms]}}}
      - {name: result, target: orbit-node-209, dependsOn: [{step: observe, condition: {type: succeeded}}], task: {type: behavior, behaviorType: '@nckrtl/task-vm-hub-result', behaviorName: task-vm-hub-result, methodName: decode, inputs: {node_id: '${{ inputs.intent.node_id }}', source: '${{ inputs.intent.source }}', range: '${{ inputs.intent.range }}', stdout: '${{ steps.observe.outputs.stdout }}'}}}
