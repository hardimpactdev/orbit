id: fdd25bfe-62c9-47b6-b401-ea3900ac8a69
name: operation-instance-mail-update
description: Repair the shared development mail path, then apply the exact mailer-line rule.
queueTimeout: 10
labels: {role: swamp}
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: instance.mail_update}
    intent: {type: object}
    # The common Gateway envelope always supplies an empty map; this workflow accepts no secrets.
    execution_secrets: {type: object, properties: {}, additionalProperties: false}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
  - name: mail
    steps:
      - name: input
        labels: {role: swamp}
        writes: true
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ansible-input
          methodName: write
          inputs:
            intent: '${{ inputs.intent }}'
            path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
      - name: Apply development mail
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: input, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "instance-mail-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 90 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags mail "$ORBIT_ANSIBLE/instance-mail-update.yml"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ steps.input.outputs.assets }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_CONFIG: '${{ steps.input.outputs.assets + "/ansible.cfg" }}'
      - name: result
        labels: {role: swamp}
        dependsOn: [{step: Apply development mail, condition: {type: always}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: instance-mail-result
          methodName: execute
          inputs:
            run: timeout 5 cat "$ORBIT_RUN/result.json"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
      - name: cleanup
        labels: {role: swamp}
        dependsOn: [{step: result, condition: {type: always}}]
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: instance-mail-cleanup
          methodName: execute
          inputs:
            run: timeout 5 rm -rf -- "$ORBIT_RUN"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
