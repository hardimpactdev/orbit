---
# Reuse the nested Gateway's normal Node convergence. This installs only released, checksum-verified delivery through Orbit;
# no test fixture or hand-built binary is copied onto a Node.
- name: Admit the nested observer converge
  ansible.builtin.command:
    argv: [timeout, "120", incus, exec, "{{ fleet_guests.gateway }}", --user, "1000", --env, HOME=/home/orbit,
           --cwd, /home/orbit/orbit/apps/gateway, --, php, artisan, orbit:node-converge, "{{ fleet_agent.item }}"]
  register: fleet_agent_operation
  changed_when: true
  failed_when: fleet_agent_operation.rc != 0 or '#' not in fleet_agent_operation.stdout
- name: Wait for the nested observer converge
  ansible.builtin.import_tasks: task-vm-nested-wait.yml
  vars:
    wait_kind: operation
    wait_operation: "{{ fleet_agent_operation.stdout | regex_findall('#([0-9]+)') | first }}"
    wait_seconds: 420
- name: Read the converged observer digest
  ansible.builtin.command:
    argv: [timeout, "30", incus, exec, "{{ fleet_guests[fleet_agent.item] }}", --, sha256sum, /usr/local/bin/orbit-agent]
  register: fleet_agent_installed
  changed_when: false
- name: Check the nested observer pin
  ansible.builtin.assert:
    that: (fleet_agent_installed.stdout.split() | first | default('')) == fleet_agent_pin
    fail_msg: The nested observer does not match the released agent pin
- name: Retake the observer snapshots
  ansible.builtin.set_fact:
    fleet_agents_changed: true
