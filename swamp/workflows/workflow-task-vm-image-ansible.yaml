id: 502a67d6-4346-4af9-af8f-d076bc5afbb3
name: task-vm-image-ansible
description: Run phases of the task VM role playbook on the base VM of an Incus host, reached from 209 through the host with the address and host key read from the host.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.image_refresh}
    intent: {type: object}
    guest: {type: string, minLength: 1}
    tags: {type: string, minLength: 1}
    with_pi: {type: boolean}
  required: [operation_id, node_id, kind, intent, guest, tags, with_pi]
  additionalProperties: false
jobs:
- name: converge
  labels: {role: swamp}
  steps:
    # The guest's bridge address; Incus knows it, the Gateway cannot. A guest with Docker lists its docker0 address first, so the line of the NIC counts.
  - name: Read the guest address
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-vm-guest-read-" + inputs.guest).split(".").join("-") }}
      methodName: exec
      globalArgs: &host
        name: ${{ ("task-vm-guest-read-" + inputs.guest).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.jump.target.user }}
          port: ${{ inputs.intent.jump.target.port }}
          identityFile: ${{ inputs.intent.jump.identity_file }}
        hosts:
        - name: host
          address: ${{ inputs.intent.jump.target.host }}
          transport: {hostKeys: '${{ inputs.intent.jump.target.host_keys }}'}
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '30', incus, list, --project, '${{ inputs.intent.project }}', --format, csv, --columns, '4', '--', '${{ "^" + inputs.guest + "$" }}']
    # The host key the guest made at its first boot, read from the host that runs the guest.
  - name: Read the guest host key
    labels: {role: swamp}
    dependsOn:
    - {step: Read the guest address, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-vm-guest-read-" + inputs.guest).split(".").join("-") }}
      methodName: exec
      globalArgs: *host
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '30', incus, exec, --project, '${{ inputs.intent.project }}', '--', '${{ inputs.guest }}', cat, /etc/ssh/ssh_host_ed25519_key.pub]
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ ("ansible-input-converge-" + inputs.guest).split(".").join("-") }}
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
    # Pi is an internal artifact on the Gateway host; the software phase copies it to the guest when the guest copy differs from the pin. A guard that is true skips the step.
  - name: Fetch the Pi server
    labels: {role: swamp}
    writes: true
    guard: ${{ !inputs.with_pi }}
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-vm-guest-pi-" + inputs.guest).split(".").join("-") }}
      methodName: copy
      globalArgs:
        name: ${{ ("task-vm-guest-pi-" + inputs.guest).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.pi.source.ssh.target.user }}
          port: ${{ inputs.intent.pi.source.ssh.target.port }}
          identityFile: ${{ inputs.intent.pi.source.ssh.identity_file }}
        hosts:
        - name: source
          address: ${{ inputs.intent.pi.source.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.pi.source.ssh.target.host_keys }}'}
      inputs:
        hosts: name:source
        src: ${{ inputs.intent.pi.source.path }}
        dst: ${{ "/tmp/orbit-ansible-" + run.id + "/pi-server" }}
        direction: from
        timeoutSec: 300
  - name: Check the Pi server
    labels: {role: swamp}
    writes: true
    guard: ${{ !inputs.with_pi }}
    dependsOn:
    - {step: Fetch the Pi server, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-guest-pi-check-" + inputs.guest).split(".").join("-") }}
      methodName: execute
      inputs:
        run: printf '%s  %s\n' "$ORBIT_SHA" "$ORBIT_RUN/pi-server" | timeout 60 sha256sum -c --quiet
        env:
          ORBIT_SHA: ${{ inputs.intent.pi.sha256 }}
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
    # The playbook input and the run are one step: the inventory, the pinned host keys and the variables are built from the intent just before
    # Ansible starts, and a failure of either ends in the check below.
  - name: Run the Ansible phases
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    - {step: Check the Pi server, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    - {step: Read the guest host key, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-guest-phases-" + inputs.guest).split(".").join("-") }}
      methodName: execute
      inputs:
        # A failed run ends in the check below, whose message carries Ansible's error to the Operation.
        ignoreExitCode: true
        run: timeout 30 python3 "$ORBIT_ANSIBLE/build_vars.py" "$ORBIT_RUN" "$ORBIT_KIND" && timeout 3300 /opt/orbit/ansible/venv/bin/ansible-playbook -i "$ORBIT_RUN/inventory.yml" -e "@$ORBIT_RUN/vars.yml" -e "pi_path=$ORBIT_RUN/pi-server" --tags "$ORBIT_TAGS" "$ORBIT_ANSIBLE/task-vm-role.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ORBIT_TAGS: ${{ inputs.tags }}
          ORBIT_KIND: ${{ inputs.kind }}
          ORBIT_TARGET_HOST: '${{ steps["Read the guest address"].outputs.stdout.split("\n").filter(l, l.contains("(enp") || l.contains("(eth"))[0].split("(")[0].split("\"").join("").trim() }}'
          ORBIT_TARGET_KEY: '${{ steps["Read the guest host key"].outputs.stdout }}'
          ANSIBLE_CONFIG: ${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
          # The failed task and its stderr go to stderr; every task banner carries its start time, so a run shows where its time went.
          ANSIBLE_DISPLAY_FAILED_STDERR: 'true'
          ANSIBLE_STDOUT_CALLBACK: community.general.timestamp
          # The time of each task, slowest first, at the end of the run.
          ANSIBLE_CALLBACKS_ENABLED: ansible.posix.profile_tasks
          PROFILE_TASKS_TASK_OUTPUT_LIMIT: all
  - name: Check the Ansible phases
    labels: {role: swamp}
    dependsOn:
    - {step: Run the Ansible phases, condition: {type: succeeded}}
    task:
      type: assert
      expr: 'steps["Run the Ansible phases"].outputs.exitCode == 0'
      severity: high
      message: '${{ steps["Run the Ansible phases"].outputs.exitCode == 124 ? "Run the Ansible phases timed out after 3300s" : "Ansible exited with " + string(steps["Run the Ansible phases"].outputs.exitCode) + ": " + (size(steps["Run the Ansible phases"].outputs.stderr) > 3500 ? steps["Run the Ansible phases"].outputs.stderr.substring(size(steps["Run the Ansible phases"].outputs.stderr) - 3500) : steps["Run the Ansible phases"].outputs.stderr) }}'
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: converge, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ ("task-vm-guest-cleanup-" + inputs.guest).split(".").join("-") }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
