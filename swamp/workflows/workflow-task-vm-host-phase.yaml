id: 3c9b6f2e-8d41-4a7e-b5f0-6e2d9a1c7b84
name: task-vm-host-phase
description: Run one tagged part of the task VM host playbook (swamp/ansible/task-vm-host.yml) against one Incus host, from the Swamp Node with the host's pinned keys.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [task_vm.image_refresh]}
    intent: {type: object}
    tags: {type: string, minLength: 1}
    # After the phase, read the host's image aliases, so the caller sees which image an alias names.
    read_aliases: {type: boolean}
  required: [operation_id, node_id, kind, intent, tags]
  additionalProperties: false
jobs:
- name: phase
  labels: {role: swamp}
  steps:
  - name: Write the intent
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs: {intent: '${{ inputs.intent }}', path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'}
  - name: Run the host phase
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Write the intent, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-host-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 2400 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, -e "@$ORBIT_RUN/intent.json" -e "run_dir=$ORBIT_RUN" --tags "$ORBIT_TAGS" "$ORBIT_ANSIBLE/task-vm-host.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Write the intent"].outputs.assets }}
          ORBIT_TAGS: ${{ inputs.tags }}
          ANSIBLE_CONFIG: ${{ steps["Write the intent"].outputs.assets + "/ansible.cfg" }}
          ANSIBLE_SSH_ARGS: ${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}
          ANSIBLE_FORCE_COLOR: '0'
  - name: Read the aliases
    labels: {role: swamp}
    guard: '${{ !has(inputs.read_aliases) || !inputs.read_aliases }}'
    dependsOn:
    - {step: Run the host phase, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-host-aliases-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-host-aliases-" + string(inputs.node_id) }}
        transport: {kind: ssh, user: '${{ inputs.intent.host.ssh.target.user }}', port: '${{ inputs.intent.host.ssh.target.port }}', identityFile: '${{ inputs.intent.host.ssh.identity_file }}'}
        hosts: [{name: host, address: '${{ inputs.intent.host.ssh.target.host }}', transport: {hostKeys: '${{ inputs.intent.host.ssh.target.host_keys }}'}}]
      inputs: {hosts: 'name:host', sudo: true, argv: [timeout, '30', incus, --project, '${{ inputs.intent.host.project }}', image, alias, list, --format, json], timeoutSec: 40}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - {job: phase, condition: {type: or, conditions: [{type: completed}, {type: skipped}]}}
  steps:
  - name: Remove the playbook input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-vm-host-cleanup-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
