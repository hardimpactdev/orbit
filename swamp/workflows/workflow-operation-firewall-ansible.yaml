id: 70c1391b-51ac-4a42-8882-051c14ccfd82
name: operation-firewall-ansible
description: Converge one admitted firewall rule from Node 209 as one Ansible phase (read, plan, apply with the ufw module, check).
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [firewall.allow, firewall.deny, firewall.remove]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: firewall
  steps:
    # Input: the admitted intent as a 0600 file in the run folder, and the shipped playbooks.
  - name: input
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ansible-input
      methodName: write
      inputs:
        intent: '${{ inputs.intent }}'
        path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
    # The phase: read the rules, plan, change, read again, check. It writes result.json whether it passes or not.
  - name: Converge the rule
    labels: {role: swamp}
    dependsOn:
    - {step: input, condition: {type: succeeded}}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "firewall-converge-" + string(inputs.node_id) }}'
      methodName: execute
      inputs:
        run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags firewall "$ORBIT_ANSIBLE/operation-firewall-direct.yml"
        env:
          ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
          ORBIT_ANSIBLE: '${{ steps.input.outputs.assets }}'
          ANSIBLE_CONFIG: '${{ steps.input.outputs.assets + "/ansible.cfg" }}'
          ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
          ANSIBLE_CALLBACKS_ENABLED: ansible.posix.profile_tasks
          ANSIBLE_FORCE_COLOR: '0'
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
    # The public result the Gateway projects: the phase's result.json, printed. It runs after a failed phase too, so a refusal keeps its code.
  - name: Check the rules
    labels: {role: swamp}
    dependsOn:
    - {step: Converge the rule, condition: {type: always}}
    writes: false
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "firewall-result-" + string(inputs.node_id) }}'
      methodName: execute
      inputs:
        run: timeout 10 cat "$ORBIT_RUN/result.json"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
    # The run folder goes whatever happened.
  - name: cleanup
    labels: {role: swamp}
    dependsOn:
    - {step: Check the rules, condition: {type: always}}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "firewall-cleanup-" + string(inputs.node_id) }}'
      methodName: execute
      inputs:
        run: timeout 30 rm -rf -- "$ORBIT_RUN"
        env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
