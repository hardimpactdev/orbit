id: 855a0c69-2eab-4eea-8488-0b63b2312cb1
name: operation-route-removal
description: "Route destroy and withdrawal in the chart's steps; Node work through official cfgmgmt and SSH behaviors (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [route.destroy]}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: update
  labels: {role: swamp}
  steps:
    # --offline: each Node is tried once; one that does not answer is skipped by every later step.
  - name: 'Check each Node answers'
    labels: {role: swamp}
    dependsOn: []
    forEach: {item: node, in: '${{ inputs.intent.answer_nodes.map(n, {"node_id": n}) }}'}
    allowFailure: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("route-answer-" + string(self.node.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("route-answer-" + string(self.node.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ inputs.intent.nodes[string(self.node.node_id)].user }}'
          port: '${{ inputs.intent.nodes[string(self.node.node_id)].port }}'
          identityFile: '${{ inputs.intent.nodes[string(self.node.node_id)].identity_file }}'
        hosts:
        - name: target
          address: '${{ inputs.intent.nodes[string(self.node.node_id)].host }}'
          transport: {hostKeys: '${{ inputs.intent.nodes[string(self.node.node_id)].host_keys }}'}
      inputs:
        hosts: name:target
        argv: ['/usr/bin/true']
        timeoutSec: 20
    # Only outside the TLD: the whole private DNS without the name, written by the dns-publish phase; the name stops resolving first.
  - name: 'Remove private DNS'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Check each Node answers', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed" && !k.startsWith("Check each Node answers")) }}'
    writes: true
    forEach: {item: vpn, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: dns-publish
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ self.vpn.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          node_id: '${{ self.vpn.node_id }}'
          connection:
            nodeHost: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host }}'
            nodeUser: '${{ inputs.intent.nodes[string(self.vpn.node_id)].user }}'
            nodePort: '${{ inputs.intent.nodes[string(self.vpn.node_id)].port }}'
            nodeIdentityFile: '${{ inputs.intent.nodes[string(self.vpn.node_id)].identity_file }}'
            become: true
          host_keys: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host_keys }}'
          dns: '${{ self.vpn.dns }}'
        execution_secrets: {}
  - name: 'Withdraw site, remove cert'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Check each Node answers', condition: {type: always}}
    - {step: 'Remove private DNS', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed" && !k.startsWith("Check each Node answers")) || (string(self.node.node_id) in inputs.intent.answer_index && steps["Check each Node answers-" + string(inputs.intent.answer_index[string(self.node.node_id)])].status != "succeeded") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-retire
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ run.id }}'
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
        signed: []
        execution_secrets: '${{ inputs.execution_secrets }}'
    # Development targets: the Node's whole shared pool files, php-fpm -t, then a reload (route-create-site).
  - name: 'Converge PHP-FPM pools'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Check each Node answers', condition: {type: always}}
    - {step: 'Remove private DNS', condition: {type: always}}
    - {step: 'Withdraw site, remove cert', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed" && !k.startsWith("Check each Node answers")) || (string(self.node.node_id) in inputs.intent.answer_index && steps["Check each Node answers-" + string(inputs.intent.answer_index[string(self.node.node_id)])].status != "succeeded") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.pools.site_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-create-site
      inputs:
        intent: '${{ inputs.intent.pools }}'
        node_id: '${{ self.node.node_id }}'
        signed: []
        execution_secrets: '${{ inputs.execution_secrets }}'
    # The LAN tuples and public ports that no published Route still needs (route-remove-firewall).
  - name: 'Remove unused LAN rules'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Check each Node answers', condition: {type: always}}
    - {step: 'Remove private DNS', condition: {type: always}}
    - {step: 'Withdraw site, remove cert', condition: {type: always}}
    - {step: 'Converge PHP-FPM pools', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed" && !k.startsWith("Check each Node answers")) || (string(self.node.node_id) in inputs.intent.answer_index && steps["Check each Node answers-" + string(inputs.intent.answer_index[string(self.node.node_id)])].status != "succeeded") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.firewall_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-remove-firewall
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
    # The cfgmgmt check of each Node's file, certificate and firewall state (route-remove-check).
  - name: 'Check nothing is left'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Check each Node answers', condition: {type: always}}
    - {step: 'Remove private DNS', condition: {type: always}}
    - {step: 'Withdraw site, remove cert', condition: {type: always}}
    - {step: 'Converge PHP-FPM pools', condition: {type: always}}
    - {step: 'Remove unused LAN rules', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed" && !k.startsWith("Check each Node answers")) || (string(self.node.node_id) in inputs.intent.answer_index && steps["Check each Node answers-" + string(inputs.intent.answer_index[string(self.node.node_id)])].status != "succeeded") }}'
    forEach: {item: node, in: '${{ inputs.intent.check_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-remove-check
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
