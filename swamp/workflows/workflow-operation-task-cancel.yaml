id: 8ba8f6c9-0a5e-44da-9710-4bde40935894
name: operation-task-cancel
autoContinue: false
description: End one task group on 209 (docs/cli/task/cancel.mmd). The task VM release is deleted; no cancel starts this run. Origin already has the approved work.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [tasks.cancel, tasks.maintenance_finish]}
    intent:
      type: object
    execution_secrets: {type: object, additionalProperties: false}
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
queueTimeout: 60
jobs:
- name: check
  labels: {role: swamp}
  steps:
  # No cancel starts a run (docs/cli/task/cancel.mmd): the place release is deleted, so a run has nothing to release.
  - name: Check the end
    labels: {role: swamp}
    task: {type: assert, expr: 'inputs.intent.release == null', severity: high, message: A task VM release is deleted; nothing releases a task VM.}
