id: dea5d024-3c16-4eb7-a576-2fda63a93872
name: operation-instance-setup-direct
description: Run an Instance's admitted Project setup or teardown list in order over official SSH from 209, as the Instance account.
vaults: []
# The list totals at most 540 s.
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [instance.run_steps]}
    intent:
      type: object
      properties:
        instance_id: {type: integer, minimum: 1}
        list: {type: string, enum: [setup, teardown]}
        user: {type: string, pattern: '^[a-z_][a-z0-9_-]{0,63}$'}
        directory: {type: string, pattern: '^/'}
        # Each step's command, its sha256 and timeout, the checkout and the seed of the Instance, in order.
        steps: {type: array, maxItems: 32}
        ssh_execution: {type: object}
      required: [instance_id, list, user, directory, steps, ssh_execution]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: setup
  labels: {role: swamp}
  steps:
    # One command per step, in order, as the Instance account in the checkout; the first failure stops the list.
    # Command stdout is discarded; stderr stays in native history, and the Gateway redacts the Instance values when it reads it.
  - name: 'Run the setup steps'
    labels: {role: swamp}
    writes: true
    forEach: {item: step, in: '${{ inputs.intent.steps }}'}
    concurrency: 1
    guard: '${{ steps.exists(k, k.startsWith("Run the setup steps") && steps[k].status == "failed") }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "instance-steps-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "instance-steps-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        argv: ['/usr/bin/sudo', '-n', '--user', '${{ inputs.intent.user }}', '--', '/usr/bin/timeout', '${{ string(self.step.timeout_seconds) }}',
          '/usr/bin/env', '-C', '${{ self.step.directory }}', '${{ "ORBIT_INSTANCE_ID=" + string(self.step.instance_id) }}',
          '${{ "ORBIT_INSTANCE_NAME=" + self.step.instance_name }}', '${{ "ORBIT_SEED_PATH=" + (self.step.seed_path == null ? "" : self.step.seed_path) }}',
          '${{ "ORBIT_SEED_COMMIT=" + (self.step.seed_commit == null ? "" : self.step.seed_commit) }}', '/bin/sh', '-c', 'exec /bin/bash -eu -c "$1" >/dev/null', 'sh', '${{ self.step.command }}']
        timeoutSec: ${{ self.step.timeout_seconds + 5 }}
    # The end check: the run's terminal result reads this step.
  - name: 'Check every step passed'
    labels: {role: swamp}
    dependsOn: [{step: 'Run the setup steps', condition: {type: always}}]
    task: {type: assert, severity: high, message: A setup step failed.,
      expr: '!steps.exists(k, k.startsWith("Run the setup steps") && steps[k].status == "failed")'}
