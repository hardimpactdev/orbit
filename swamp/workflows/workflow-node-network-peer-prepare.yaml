id: 80bcf9b2-bc3b-5e0f-867d-c087c29c6b78
name: node-network-peer-prepare
description: Prepare one exact peer public key from full non-secret intent; no hub mutation or Gateway callback.
inputs:
  type: object
  properties:
    node_id:
      type: integer
    intent:
      type: object
  required:
  - node_id
  - intent
jobs:
- name: peer_key
  steps:
  - name: intent
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: &id001
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-network-command-inputs'
      methodName: prepare
      inputs:
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-intent" }}
  - name: prepare_key
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      methodName: execute
      inputs:
        run: |
          set -eu
          sudo -n -- /usr/bin/python3 - "$NETWORK_JSON" <<'PYTHON'
          import base64
          import json
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          import tomllib
          from pathlib import Path

          intent = json.loads(sys.argv[1])
          node_id = intent["node_id"]
          with open("/etc/orbit/agent/config.toml", "rb") as stream:
              installed = tomllib.load(stream)
          if installed.get("swamp_worker", {}).get("node_id") != node_id:
              raise SystemExit("wireguard.peer_worker_mismatch")
          root = Path("/etc/wireguard")
          if not os.path.lexists(root):
              root.mkdir(mode=0o700)
          metadata = root.lstat()
          if not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o077:
              raise SystemExit("wireguard.peer_state_unsupported")
          for name in (".orbit.peer-transaction", ".orbit.conf.rollback", ".orbit.dns-link.rollback", ".orbit.native-network-transaction"):
              if os.path.lexists(root / name):
                  raise SystemExit("wireguard.peer_recovery_pending")
          key_path = root / "orbit.key"
          if not os.path.lexists(key_path):
              if intent["existing_key"] is not None:
                  raise SystemExit("wireguard.peer_key_missing")
              generated = subprocess.run(["/usr/bin/wg", "genkey"], check=True, capture_output=True, text=True, timeout=10).stdout.strip()
              if len(base64.b64decode(generated, validate=True)) != 32:
                  raise SystemExit("wireguard.peer_key_failed")
              descriptor, candidate = tempfile.mkstemp(prefix=".orbit-key-", dir=root)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "w") as stream:
                      stream.write(generated + "\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.link(candidate, key_path)
              finally:
                  os.unlink(candidate)
          metadata = key_path.lstat()
          if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) != 0o600:
              raise SystemExit("wireguard.peer_state_unsupported")
          private = key_path.read_text()
          public = subprocess.run(["/usr/bin/wg", "pubkey"], input=private, check=True, capture_output=True, text=True, timeout=10).stdout.strip()
          if len(base64.b64decode(public, validate=True)) != 32:
              raise SystemExit("wireguard.peer_key_failed")
          if intent["existing_key"] is not None and public != intent["existing_key"]:
              raise SystemExit("vpn.peer_key_mismatch")
          print(json.dumps({"public_key": public}, separators=(",", ":")))
          PYTHON
        env:
          NETWORK_JSON: ${{ steps.intent.outputs.network_json }}
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-prepare-key" }}
    dependsOn:
    - step: intent
      condition:
        type: succeeded
  - name: public_key
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/node-network-command-inputs'
      methodName: publicKey
      inputs:
        stdout: ${{ steps.prepare_key.outputs.stdout }}
      behaviorName: ${{ "node-network-" + string(inputs.node_id) + "-public-key" }}
    dependsOn:
    - step: prepare_key
      condition:
        type: succeeded
