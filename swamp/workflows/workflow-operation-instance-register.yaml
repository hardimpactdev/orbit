id: c0791777-2696-430c-a78e-97b9289a655f
name: operation-instance-register
description: Adopt agent-verified source; run only the requested setup, Processes, Route and environment protection.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: instance.register}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: register
  labels: {role: swamp}
  steps:
  - name: Protect the .env
    labels: {role: swamp}
    writes: true
    guard: '${{ !inputs.intent.protect_environment }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "reg-env-" + string(inputs.node_id) }}'
      methodName: exec
      globalArgs:
        name: '${{ "reg-env-" + string(inputs.node_id) }}'
        transport: &transport
          kind: ssh
          user: '${{ inputs.intent.ssh_execution.target.user }}'
          port: '${{ inputs.intent.ssh_execution.target.port }}'
          identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
        hosts: &hosts
        - name: target
          address: '${{ inputs.intent.ssh_execution.target.host }}'
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        timeoutSec: 65
        argv: [/usr/bin/timeout, '60', /bin/sh, -c, '/usr/bin/sudo -n -- /usr/bin/chgrp -h orbit-env -- "$1" && /usr/bin/chmod 0640 -- "$1"', sh, '${{ inputs.intent.application + "/.env" }}']
  - name: Run Project setup steps
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Protect the .env, condition: {type: always}}]
    guard: '${{ !inputs.intent.run_setup || steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: step, in: '${{ inputs.intent.setup_steps }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ "reg-setup-" + string(inputs.node_id) + "-" + string(self._index) }}'
      methodName: exec
      globalArgs:
        name: '${{ "reg-setup-" + string(inputs.node_id) + "-" + string(self._index) }}'
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        timeoutSec: '${{ self.step.timeout_seconds + 5 }}'
        argv: [/usr/bin/timeout, '${{ string(self.step.timeout_seconds) }}', /usr/bin/env, -C, '${{ self.step.directory }}',
          '${{ "ORBIT_INSTANCE_ID=" + string(self.step.instance_id) }}', '${{ "ORBIT_INSTANCE_NAME=" + self.step.instance_name }}',
          '${{ "ORBIT_SEED_PATH=" + self.step.seed_path }}', '${{ "ORBIT_SEED_COMMIT=" + self.step.seed_commit }}',
          /bin/sh, -c, 'umask 077; exec /bin/bash -eu -c "$1" >/dev/null', sh, '${{ self.step.command }}']
  - name: Create, start Processes
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Protect the .env, condition: {type: always}}
    - {step: Run Project setup steps, condition: {type: always}}
    guard: '${{ !inputs.intent.run_setup || steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: member, in: '${{ inputs.intent.processes }}'}
    task:
      type: workflow
      workflowIdOrName: '${{ self.member.kind == "process.start" ? "operation-process-start" : "operation-process-create" }}'
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ self.member.kind }}'
        intent: '${{ self.member.intent }}'
        execution_secrets: '${{ "member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["member_" + string(self.member.id)]} : {} }}'
  - name: Hold the Route Nodes
    labels: {role: swamp}
    queueTimeout: 30
    writes: true
    guard: '${{ inputs.intent.route == null || steps.exists(k, steps[k].status == "failed") }}'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-hold-acquire" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 30 --retry 20 --retry-all-errors --retry-delay 1 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_HOLD_REQUEST\" \"$ORBIT_HOLD_URL\"\n"
        env:
          ORBIT_HOLD_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/route-hold" }}
          ORBIT_HOLD_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\"}" }}'
    dependsOn:
    - step: Protect the .env
      condition:
        type: always
    - step: Run Project setup steps
      condition:
        type: always
    - step: Create, start Processes
      condition:
        type: always
  - name: Create the Route
    labels: {role: swamp}
    writes: true
    dependsOn:
    - {step: Protect the .env, condition: {type: always}}
    - {step: Run Project setup steps, condition: {type: always}}
    - {step: 'Create, start Processes', condition: {type: always}}
    - {step: Hold the Route Nodes, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ inputs.intent.route == null || steps.exists(k, steps[k].status == "failed") }}'
    task:
      type: workflow
      workflowIdOrName: operation-route-create
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        parent_run_id: '${{ run.id }}'
        kind: route.create
        intent: '${{ inputs.intent.route }}'
        execution_secrets: '${{ inputs.intent.route_secrets }}'
  - name: Release the Route Nodes
    labels: {role: swamp}
    queueTimeout: 30
    writes: true
    guard: '!("Hold the Route Nodes" in steps)'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-hold-release" }}
      methodName: execute
      inputs:
        run: "curl --fail --silent --show-error --proto =https --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 \\\n  --cacert /usr/local/share/ca-certificates/orbit-managed-root-ca.crt \\\n  --header 'Content-Type: application/json' --header 'Accept: application/json' \\\n  --data \"$ORBIT_HOLD_REQUEST\" \"$ORBIT_HOLD_URL\" || true\n"
        env:
          ORBIT_HOLD_URL: ${{ "https://gateway.orbit/api/v1/direct-operations/" + string(inputs.operation_id) + "/route-release" }}
          ORBIT_HOLD_REQUEST: '${{ "{\"run_id\":\"" + run.id + "\"}" }}'
    dependsOn:
    - step: Create the Route
      condition:
        type: always
    - step: Hold the Route Nodes
      condition:
        type: always
