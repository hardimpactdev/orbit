id: a5dc9328-9812-4f24-9055-d874830f9bb7
name: task-vm-destroy
description: Delete the VM and its seed volume from 209 over pinned SSH (UpCloud through provider-power), remove its guest Node, and assert the host no longer lists either.
# Shared by task_vm.destroy, tasks.cancel and a failed task_vm.provision: a typed boundary, not an ordering aid.
queueTimeout: 60
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-pi-token-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: delete
  steps:
  # Incus: one forced delete per resource; an absent VM or volume exits 1 and counts as done, the end check proves it.
  - name: Delete the VM
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.provider != "incus" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-destroy-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-destroy-" + string(inputs.node_id) }}
        transport: &transport
          kind: ssh
          user: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.user : "" }}'
          port: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.port : 22 }}'
          identityFile: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.identity_file : "" }}'
        hosts: &hosts
        - name: target
          address: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.host : "" }}'
          transport:
            hostKeys: '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.host_ssh_execution.target.host_keys : [] }}'
      inputs:
        hosts: name:target
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '180', incus, delete, --force, --project, '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.vm.project : "" }}', --, '${{ inputs.intent.provider_input.name }}']
  - name: Delete the seed volume
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.provider != "incus" }}
    dependsOn:
    - step: Delete the VM
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-destroy-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-destroy-" + string(inputs.node_id) }}
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '180', incus, storage, volume, delete, --project, '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.vm.project : "" }}', --, '${{ inputs.intent.provider == "incus" ? inputs.intent.provider_input.vm.pool : "" }}', '${{ inputs.intent.provider_input.name + "-topology-seed" }}']
  # UpCloud: the provider-power child reads the server, stops a running one and deletes it with its storage; its read-back proves it gone.
  - name: Read the server
    labels: {role: swamp}
    guard: ${{ inputs.intent.provider != "upcloud" }}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs: &cloud_power
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.provider_input }}
        execution_secrets: '${{ inputs.intent.provider == "upcloud" ? {"upcloud":inputs.execution_secrets.upcloud} : {} }}'
        action: inspect
  - name: Stop the server
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.provider != "upcloud" || !steps["Read the server"].outputs.result.running }}
    dependsOn:
    - step: Read the server
      condition: {type: succeeded}
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        <<: *cloud_power
        action: stop
  - name: Delete the server
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.provider != "upcloud" }}
    dependsOn:
    - step: Read the server
      condition: {type: succeeded}
    - step: Stop the server
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-power
      inputs:
        <<: *cloud_power
        action: delete
- name: cleanup
  dependsOn:
  - job: delete
    condition: {type: succeeded}
  steps:
  - name: Forget the guest host key
    labels: {role: swamp}
    writes: true
    guard: ${{ !has(inputs.intent.wireguard_ip) || inputs.intent.wireguard_ip == null }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "vm-known-hosts" }}'
      methodName: execute
      inputs:
        # The address goes back to the pool; the next guest there brings its own key.
        run: |
          set -eu
          install -d -m 0700 "$HOME/.ssh"
          ssh-keygen -R "$ORBIT_ADDRESS" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1 || true
        env:
          ORBIT_ADDRESS: '${{ has(inputs.intent.wireguard_ip) && inputs.intent.wireguard_ip != null ? inputs.intent.wireguard_ip : "" }}'
  - name: Remove the guest Node
    labels: {role: swamp}
    writes: true
    guard: ${{ inputs.intent.guest_node_id == null }}
    task:
      type: workflow
      workflowIdOrName: operation-node-remove
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.removal }}
        execution_secrets: {}
- name: check
  dependsOn:
  - job: cleanup
    condition: {type: succeeded}
  steps:
  - name: Read the host again
    labels: {role: swamp}
    guard: ${{ inputs.intent.provider != "incus" }}
    forEach:
      item: read
      in: '${{ ["instances", "volumes"] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-destroy-read-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-destroy-read-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - '${{ inputs.intent.provider != "incus" ? "" : self.read == "instances" ? "/1.0/instances?project=" + inputs.intent.provider_input.vm.project : "/1.0/storage-pools/" + inputs.intent.provider_input.vm.pool + "/volumes/custom?project=" + inputs.intent.provider_input.vm.project }}'
  - name: Check the VM is gone
    labels: {role: swamp}
    dependsOn:
    - step: Read the host again
      condition: {type: succeeded}
    task:
      type: assert
      # `incus query` lists `/1.0/.../<name>?project=<p>`; task VM names hold no character it encodes.
      expr: '!steps["Read the host again-instances"].outputs.stdout.contains("/" + inputs.intent.provider_input.name + "?") && !steps["Read the host again-instances"].outputs.stdout.contains("/" + inputs.intent.provider_input.name + "\"") && !steps["Read the host again-volumes"].outputs.stdout.contains("/" + inputs.intent.provider_input.name + "-topology-seed?") && !steps["Read the host again-volumes"].outputs.stdout.contains("/" + inputs.intent.provider_input.name + "-topology-seed\"")'
      severity: high
      message: task_vm.destroy_failed
