id: fbfe0126-de99-42a6-be00-a8f1996126a9
name: task-nested-converge
description: >-
  Bring the nested Nodes of a task VM to the playbooks and pins of the checkout (the nested half of `Converge once`, stage 2 of the command development pipeline): the candidate CLI on the task VM asks the nested Gateway, through the CLI profile `nested`, to run `node:converge` for app-dev, app-prod and then the nested Gateway, and checks at the end that the operator still reaches the hub. The nested Orbit reads the playbooks from the NFS-mounted checkout. Each step is one command over official SSH to the task VM.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    guest_node_id: {type: integer, minimum: 1}
    ssh_execution: {type: object}
    checkout_path: {type: string, minLength: 1}
    fleet: {type: object}
  required: [guest_node_id, ssh_execution, checkout_path, fleet]
  additionalProperties: false
jobs:
- name: converge
  labels: {role: swamp}
  steps:
  # `node:converge` follows its own Operation to the end and exits nonzero when it fails, so one command is one step. The Nodes go one after the other: the nested Gateway locks the target and the hub for each converge. The workload Nodes carry the guest names (`nested-app-dev`); the Gateway Node is `gateway`.
  - name: 'Converge app-dev'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-converge-app-dev").split(".").join("-") }}', methodName: exec, globalArgs: &vm {name: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-converge-app-dev").split(".").join("-") }}', transport: {kind: ssh, user: '${{ inputs.ssh_execution.target.user }}', port: '${{ inputs.ssh_execution.target.port }}', identityFile: '${{ inputs.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ inputs.ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'env', 'HOME=/home/orbit', 'ORBIT_HOME=/home/orbit/.orbit', 'php', '${{ inputs.checkout_path }}/apps/cli/orbit', 'node:converge', '${{ inputs.fleet.guests["app-dev"] }}', '--json'], timeoutSec: 610}}
  - name: 'Converge app-prod'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-converge-app-prod").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-converge-app-prod").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'env', 'HOME=/home/orbit', 'ORBIT_HOME=/home/orbit/.orbit', 'php', '${{ inputs.checkout_path }}/apps/cli/orbit', 'node:converge', '${{ inputs.fleet.guests["app-prod"] }}', '--json'], timeoutSec: 610}}
    dependsOn: [{step: 'Converge app-dev', condition: {type: succeeded}}]
  # The Gateway comes last, after the Nodes it serves; a real Gateway converges itself, and the fleet build runs `node:converge` on it too. It runs through its own Orbit and Swamp, so its agent pin and role playbooks are proven.
  - name: 'Converge the Gateway'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-converge-the-gateway").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-converge-the-gateway").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '600', 'env', 'HOME=/home/orbit', 'ORBIT_HOME=/home/orbit/.orbit', 'php', '${{ inputs.checkout_path }}/apps/cli/orbit', 'node:converge', 'gateway', '--json'], timeoutSec: 610}}
    dependsOn: [{step: 'Converge app-prod', condition: {type: succeeded}}]
  # The Gateway converge rewrites the hub from its records, and the VM joined it as operator. Three pings through `wg-nested` fail the step when none is answered, that is when the operator can no longer reach the hub, so a dropped tunnel stops the run here and not at the readiness check.
  - name: 'Check the tunnel'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-check-the-tunnel").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-converge-" + string(inputs.guest_node_id) + "-check-the-tunnel").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '40', 'ping', '-c', '3', '-w', '30', '-I', 'wg-nested', '10.45.0.1'], timeoutSec: 50}}
    dependsOn: [{step: 'Converge the Gateway', condition: {type: succeeded}}]
