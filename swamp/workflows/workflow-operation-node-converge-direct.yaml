id: daace7ba-223f-47b6-9452-7c0da7cf384e
name: operation-node-converge-direct
description: Re-apply Orbit's own footprint on a Node from 209 over official SSH, in the chart's steps.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [node.converge]}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: converge
  labels: {role: swamp}
  steps:
  - name: 'Read the scripts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-scripts'
      behaviorName: node-converge-scripts
      methodName: read
      inputs:
        script: agent
        input:
          refusal: '${{ inputs.intent.refusal }}'
          url: '${{ "agent" in inputs.intent.payloads ? inputs.intent.payloads.agent.url : "" }}'
          sha256: '${{ inputs.intent.agent_sha256 }}'
          user: '${{ inputs.intent.user }}'
          configuration: '${{ "agent" in inputs.intent.payloads ? inputs.intent.payloads.agent : {} }}'
          verifier_hash: '${{ inputs.intent.verifier_hash }}'
    # An admission refusal stops here with its code. The pinned binary; a match changes nothing, otherwise the old one stays as orbit-agent.previous.
  - name: 'Install the Node agent'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the scripts', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '240', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', install, '${{ steps["Read the scripts"].outputs.input }}']
        timeoutSec: 250
    # Files with the same key: a missing or mismatched key fails here; orbit:node-agent-rekey makes a new one.
  - name: 'Configure the Node agent'
    labels: {role: swamp}
    dependsOn: [{step: 'Install the Node agent', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '120', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', configure, '${{ steps["Read the scripts"].outputs.input }}',
          '${{ string(steps["Install the Node agent"].outputs.stdout.contains("\"changed\": true")) }}']
        timeoutSec: 130
  - name: 'Apply private DNS policy'
    labels: {role: swamp}
    dependsOn: [{step: 'Configure the Node agent', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.network == null }}
    task:
      type: workflow
      workflowIdOrName: operation-fleet-peer-dns
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: fleet.peer_dns
        intent: '${{ inputs.intent.network == null ? {} : {"ssh": inputs.intent.ssh, "server": inputs.intent.network.peer_dns.dns_server,
          "dns_server": inputs.intent.network.peer_dns.dns_server, "public_key": inputs.intent.network.peer_dns.public_key, "domains": inputs.intent.network.peer_dns.domains}
          }}'
        execution_secrets: {}
    # Caddy, PHP-FPM, tmpfiles, the vpn DNS listener and Route residue: the fleet recipe's agent-free steps.
  - name: 'Re-apply role files'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Configure the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ !(["caddy-package", "caddy", "private-dns", "route-residue", "php-runtime", "tmpfiles"].exists(n, n in inputs.intent.payloads)) }}'
    task:
      type: workflow
      workflowIdOrName: node-converge-role-files
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          ssh: '${{ inputs.intent.ssh }}'
          agent_sha256: '${{ inputs.intent.agent_sha256 }}'
          automatic: false
          daytime: true
          recipe: {user: '${{ inputs.intent.user }}'}
          footprint: {node_id: '${{ inputs.intent.node_id }}', agent_sha256: '${{ inputs.intent.agent_sha256 }}', refusal: '${{ inputs.intent.refusal }}',
            artifacts: '${{ inputs.intent.artifacts }}', payloads: '${{ inputs.intent.payloads }}', network: '${{ inputs.intent.network }}'}
    # The agent is active on the pinned binary and its files hold their content.
  - name: 'Check the footprint'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Configure the Node agent', condition: {type: succeeded}}
    - {step: 'Apply private DNS policy', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    - {step: 'Re-apply role files', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-converge-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '30', python3, -I, -c, '${{ steps["Read the scripts"].outputs.body }}', check, '${{ steps["Read the scripts"].outputs.input }}']
        timeoutSec: 40
- name: result
  labels: {role: swamp}
  dependsOn: [{job: converge, condition: {type: always}}]
  steps:
  - name: 'Report the result'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-scripts'
      behaviorName: node-converge-result
      methodName: converge_result
      inputs: {intent: '${{ inputs.intent }}', steps: '${{ steps }}'}
    # A part that did not apply fails the run; the result above stays the terminal result.
  - name: 'Prove the footprint'
    labels: {role: swamp}
    dependsOn: [{step: 'Report the result', condition: {type: succeeded}}]
    task: {type: assert, expr: '!steps["Report the result"].outputs.stdout.contains("error_code")', severity: high, message: A footprint part did not apply.}
