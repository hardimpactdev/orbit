---
# The state asserts of the three prompt cases. converge.yml has run the CLI and checked the exit status, the output and the Operations of
# every run; this playbook only reads: the UFW table of the target and its firewall records, once. The cases then check their own rows and
# records, and the before/after snapshots that converge kept. One verdict line for each case, in the format of default/verify.yml.
- ansible.builtin.import_playbook: target.yml

- name: Read the UFW table of the target
  hosts: nodes
  gather_facts: false
  tasks:
    - name: Read the UFW table
      ansible.builtin.command: ufw status numbered
      register: ufw_now
      changed_when: false
      when: inventory_hostname == ('nested-' ~ hostvars['localhost'].target_node)

- name: Read the firewall records of the target
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the records of the Node
      ansible.builtin.uri:
        url: "{{ gateway_url }}/firewall-rules?node={{ node_ids[target_node] }}"
        ca_path: "{{ gateway_ca }}"
        headers: {Accept: application/json}
        return_content: true
      register: records

    - name: Keep the rules of the Node
      ansible.builtin.set_fact:
        rules_now: "{{ records.json.data | selectattr('node', 'equalto', target_node) | map(attribute='rules') | first | default([]) }}"

- name: Check each case against what was read
  hosts: case_hosts
  gather_facts: false
  vars_files: [cases.yml]
  tasks:
    - name: The case's table and rules
      ansible.builtin.set_fact:
        rows: "{{ hostvars[tcontainer].ufw_now.stdout_lines }}"
        rules: "{{ hostvars['localhost'].rules_now }}"

    - name: The checks of the case
      ansible.builtin.include_tasks: "verify-{{ inventory_hostname }}.yml"

- name: Verdicts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verdict of each case (command seconds, case seconds in converge, the window of the case and of its CLI calls, asks while the Node was busy)
      vars:
        h: "{{ hostvars[item] }}"
        why: "{{ h.failures | default('') or h.verify_failures | default('') or ('' if h.verified | default(false) else 'the checks did not end') }}"
      ansible.builtin.debug:
        msg: >-
          {{ item }}: {{ ('failed | ' ~ why) if why else 'passed' }}
          (command {{ h.cmd_secs | default('-') }} s, case {{ h.case_secs | default('-') }} s, casewin {{ h.case_start | default(0) | float | round(2) }} {{ h.case_end | default(0) | float | round(2) }}, cli {{ h.cli_start | default(0) | float | round(1) }} {{ h.cli_end | default(0) | float | round(1) }}, busy {{ h.busy_retries | default('-') }}, on {{ h.tnode | default('-') }})
      loop: "{{ groups['case_hosts'] }}"

    - name: Collect the failed cases
      vars:
        h: "{{ hostvars[item] }}"
      ansible.builtin.set_fact:
        failed_cases: "{{ failed_cases | default([]) + [item] }}"
      loop: "{{ groups['case_hosts'] }}"
      when: (h.failures | default('') | length > 0) or (h.verify_failures | default('') | length > 0) or not (h.verified | default(false) | bool)

    - name: Fail when a case failed
      ansible.builtin.assert:
        that: failed_cases | default([]) | length == 0
        fail_msg: "failed: {{ failed_cases | default([]) | join(', ') }}"
        quiet: true
