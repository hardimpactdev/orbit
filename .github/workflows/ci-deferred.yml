name: Main deferred fixtures
'on':
  push:
    branches:
    - main
  schedule:
  - cron: '*/10 * * * *'
  - cron: 17 3 * * *
  workflow_dispatch:
    inputs: &id001
      base:
        description: Optional manual ancestor backfill; does not advance queue
        type: string
        default: ''
      full_set:
        description: Run a full sweep only if the deferred queue is empty
        type: boolean
        default: false
  workflow_call:
    inputs: *id001
permissions:
  contents: read
concurrency:
  group: main-fixture-consumer
  cancel-in-progress: false
jobs:
  claim:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
    outputs:
      sha: ${{ steps.claim.outputs.sha }}
      has_work: ${{ steps.claim.outputs.has_work }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Claim newest main after settling the prior answer
      id: claim
      env:
        GH_TOKEN: ${{ github.token }}
        FULL_SET: ${{ inputs.full_set || false }}
        BACKFILL_BASE: ${{ inputs.base || '' }}
        NIGHTLY: ${{ github.event.schedule == '17 3 * * *' }}
      run: bin/ci-main-queue claim --consumer fixtures --output "$RUNNER_TEMP/main-queue-claim.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: steps.claim.outputs.has_work == 'true'
      with:
        name: main-queue-claim
        path: ${{ runner.temp }}/main-queue-claim.json
        if-no-files-found: error
        overwrite: true
  plan:
    if: needs.claim.outputs.has_work == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.claim.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: main-queue-claim
        path: ${{ runner.temp }}/main-input
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      with:
        deno-version: v2.9.8
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Install the fixture collector parser
      run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
    - name: Plan the union of deferred cases in the claimed range
      id: plan
      run: bin/ci-main-queue plan --claim "$RUNNER_TEMP/main-input/main-queue-claim.json" --output "$RUNNER_TEMP/full-set-plan.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: full-set-plan
        path: ${{ runner.temp }}/full-set-plan.json
        if-no-files-found: error
        overwrite: true
    needs: claim
  fixtures:
    needs:
    - claim
    - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.has_shards == 'true'
    name: Deferred (${{ matrix.name }})
    runs-on:
    - self-hosted
    - orbit-shard
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ needs.claim.outputs.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 2
      with:
        name: full-set-plan
        path: ${{ runner.temp }}/full-set-input
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      timeout-minutes: 3
      with:
        deno-version: v2.9.8
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      timeout-minutes: 2
      with:
        python-version: '3.13'
    - uses: ./.github/actions/php
      timeout-minutes: 4
      with:
        coverage: none
    - name: Run two bounded fixture workers
      timeout-minutes: 36
      env:
        SHARD_NAME: ${{ matrix.name }}
      run: bin/ci-deferred run --plan "$RUNNER_TEMP/full-set-input/full-set-plan.json" --shard "$SHARD_NAME" --output "$RUNNER_TEMP/full-set-times-$SHARD_NAME.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      timeout-minutes: 1
      with:
        name: full-set-times-${{ matrix.name }}
        path: ${{ runner.temp }}/full-set-times-${{ matrix.name }}.json
        if-no-files-found: error
        overwrite: true
  report:
    needs:
    - claim
    - plan
    - fixtures
    if: always() && needs.claim.outputs.has_work == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.claim.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      continue-on-error: true
      with:
        merge-multiple: true
        path: ${{ runner.temp }}/main-results
    - name: Reconcile every claimed fixture
      env:
        SHARD_RESULT: ${{ needs.fixtures.result }}
        PLAN_RESULT: ${{ needs.plan.result }}
      run: bin/ci-main-queue report --claim "$RUNNER_TEMP/main-results/main-queue-claim.json" --plan "$RUNNER_TEMP/main-results/full-set-plan.json" --results
        "$RUNNER_TEMP/main-results" --shard-result "$SHARD_RESULT" --output "$RUNNER_TEMP/main-queue-report.json" --plan-result "$PLAN_RESULT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: main-queue-report
        path: ${{ runner.temp }}/main-queue-report.json
        if-no-files-found: error
        overwrite: true
    - name: Publish all commit links, then advance the answer marker
      env:
        GH_TOKEN: ${{ github.token }}
      run: bin/ci-main-queue publish --claim "$RUNNER_TEMP/main-results/main-queue-claim.json" --output "$RUNNER_TEMP/main-queue-report.json"
