id: 19bf171c-cf2a-4509-beb7-3373c29f19af
name: cluster-router-prepare
description: Canonical Router prerequisites, Caddy package and owned firewall policy through official SSH.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: prepare
  steps:
  - name: account_assets
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-command'
      behaviorName: account-assets
      methodName: read
      inputs:
        action: account
        input: '${{ {"user": inputs.intent.user} }}'
  - name: account_command
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: account_assets, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "cluster-router-ssh-" + run.id }}
      methodName: script
      globalArgs:
        name: ${{ "cluster-router-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        interpreter: python3
        sudo: false
        script: ${{ steps["account_assets"].outputs.script_body }}
  - name: account
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: account_command, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-command'
      behaviorName: account-result
      methodName: decode
      inputs:
        stdout: ${{ steps["account_command"].outputs.stdout }}
  - name: packages_assets
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: account, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-bootstrap-command'
      behaviorName: packages-assets
      methodName: packages
      inputs:
        releases: ${{ inputs.intent.prerequisites.releases }}
        packages: ${{ inputs.intent.prerequisites.packages }}
  - name: packages
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - {step: packages_assets, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "cluster-router-ssh-" + run.id }}
      methodName: script
      globalArgs:
        name: ${{ "cluster-router-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        interpreter: python3
        sudo: true
        script: ${{ steps["packages_assets"].outputs.script_body }}
  - name: caddy_assets
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: packages, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-command'
      behaviorName: caddy-assets
      methodName: read
      inputs:
        action: caddy_package
        input: ${{ inputs.intent.caddy_package }}
  - name: caddy_command
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - {step: caddy_assets, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "cluster-router-ssh-" + run.id }}
      methodName: script
      globalArgs:
        name: ${{ "cluster-router-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        interpreter: python3
        sudo: true
        script: ${{ steps["caddy_assets"].outputs.script_body }}
  - name: caddy
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: caddy_command, condition: {type: succeeded}}
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-command'
      behaviorName: caddy-result
      methodName: decode
      inputs:
        stdout: ${{ steps["caddy_command"].outputs.stdout }}
  - name: firewall
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - {step: caddy, condition: {type: succeeded}}
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent:
          rule: ${{ inputs.intent.firewall }}
          control_node_id: 209
          connection: ${{ inputs.intent.connection }}
          host_keys: ${{ inputs.intent.host_keys }}
