id: 5b4345a1-1275-4443-a391-a69649f459b3
name: metrics-docker
description: Install Docker on the Metrics Node and keep it running, with official behaviors.
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
jobs:
- name: docker
  steps:
  - name: package
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/apt'
      behaviorName: '${{ ("metrics-engine-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        packages: [docker.io, openssl]
        ensure: present
  - name: daemon
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: package, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/systemd'
      behaviorName: '${{ ("metrics-daemon-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: apply
      inputs: {}
      globalArgs:
        nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        become: true
        service: docker.service
        ensure: running
        enabled: true
