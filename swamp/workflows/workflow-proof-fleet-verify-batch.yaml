id: 8e4d2b71-3c59-4a0e-b6d8-7f1a93c05e22
name: proof-fleet-verify-batch
description: One batch of proof cases on the task VM. The batch setup, then one runner step for all its cases (several at a time, the ones that run alone last), then one report of the verdict lines.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    ssh_execution:
      type: object
    checkout_path:
      type: string
    group_id:
      type: integer
      minimum: 1
    file:
      type: string
    # Empty on a task VM. In a task copy: `incus exec` into the copy and `runuser -u agent`, run as root on the copy's Node.
    runner_prefix:
      type: array
      items:
        type: string
    # The name of the SSH behavior that runs the setup and the batch. Swamp locks a behavior by name for the whole step, and a
    # second run waits 60 s for it and then fails. On a task VM the fleet is the host's one fleet, so the name is the Node's. In a
    # task copy the steps act only inside that copy, so the name is the copy's and proofs in two copies on one Node run side by side.
    ssh_name:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    batch:
      type: string
    setup:
      type: boolean
    restore:
      type: boolean
    cases:
      type: array
      items:
        type: string
      minItems: 1
  required:
  - ssh_execution
  - checkout_path
  - group_id
  - file
  - runner_prefix
  - ssh_name
  - batch
  - setup
  - cases
  additionalProperties: false
jobs:
- name: start
  labels: {role: swamp}
  steps:
  # Each batch but the first starts from the `base` snapshot of the fleet: restore, then apply the checkout, then the batch setup. A restore that fails stops the batch.
  - name: restore
    labels: {role: swamp}
    # A task copy has no restore of `base` yet: see `setup`.
    guard: '${{ !(has(inputs.restore) && inputs.restore) || size(inputs.runner_prefix) > 0 }}'
    allowFailure: true
    writes: true
    task:
      type: workflow
      workflowIdOrName: proof-fleet-restore
      inputs:
        ssh_execution: ${{ inputs.ssh_execution }}
  # In a task copy a later batch does not start: without a restore its start state is unknown, so its cases are unrun.
  - name: setup
    labels: {role: swamp}
    guard: '${{ has(inputs.restore) && inputs.restore && size(inputs.runner_prefix) > 0 }}'
    allowFailure: true
    dependsOn:
    - step: restore
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh_name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh_name }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 480
        sudo: '${{ size(inputs.runner_prefix) > 0 }}'
        argv: '${{ inputs.runner_prefix + ["python3", inputs.checkout_path + "/swamp/proof/runner/runner.py", "setup", inputs.batch, "--file", inputs.checkout_path + "/" + inputs.file, "--evidence", inputs.checkout_path + "/.orbit-artifacts/" + string(inputs.group_id) + "/verify"] }}'
- name: cases
  labels: {role: swamp}
  dependsOn:
  - job: start
    condition: {type: completed}
  steps:
  # One step runs the batch: the runner reads the fleet once, runs the cases that share the fleet several at a time (the cases file sets how many), then the
  # cases that run alone. It prints one verdict line a case, the ones that did not pass first. A failed restore or setup (this batch's start) skips it.
  # A case that did not pass triggers no restore: cases use their own resources, and the next batch restores anyway.
  - name: batch
    labels: {role: swamp}
    guard: '${{ steps.?restore.?status.orValue("") == "failed" || !steps.?setup.?outputs.?stdout.orValue("").contains("\"setup\": \"ok\"") }}'
    allowFailure: true
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh_name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh_name }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: 3600
        sudo: '${{ size(inputs.runner_prefix) > 0 }}'
        argv: '${{ inputs.runner_prefix + ["python3", inputs.checkout_path + "/swamp/proof/runner/runner.py", "batch", inputs.batch, "--file", inputs.checkout_path + "/" + inputs.file, "--evidence", inputs.checkout_path + "/.orbit-artifacts/" + string(inputs.group_id) + "/verify", "--only", inputs.cases.join(" ")] }}'
- name: report
  labels: {role: swamp}
  dependsOn:
  - job: cases
    condition: {type: completed}
  steps:
  # The verdict lines of the batch. A case with no line gets one of its own, so every case has one: unrun when the batch step printed nothing (the batch was
  # stopped before it), failed when it printed lines but none for the case (the runner stopped, or the output was cut).
  - name: report
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "proof-verify-batch-report" }}
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$LINES"
        env:
          LINES: '${{ [steps.?batch.?outputs.?stdout.orValue("").split("\n").map(l, l.trim()).filter(l, l.contains("\"verdict\""))].map(got, (got.join("\n") + inputs.cases.filter(c, !got.exists(l, l.contains("\"id\": \"" + c + "\""))).map(c, "\n{\"id\": \"" + c + "\", \"verdict\": \"" + (size(got) == 0 ? "unrun" : "failed") + "\", \"cause\": \"infrastructure\", \"secs\": 0, \"failed\": [\"" + (size(got) == 0 ? "run stopped: the batch setup did not succeed" : "the case printed no verdict") + "\"]}").join("")).trim())[0] }}'
