---
# One phase of instance-container.yml, `phase`, on the Node. Containers live in `container.project`; `incus` gets no stray input.
# Work in the container runs through `incus exec` from the Node: root for units and snapshots, `orbit` for the workspace.
- name: Name the container commands
  tags: [always]
  when: phase != 'node-service'
  vars:
    nic_filters: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance-nic-filters.json') | from_json }}"
  ansible.builtin.set_fact:
    incus_project: [incus, --project, "{{ container.project }}"]
    # The NIC of a new container, in the one call that makes it: its address, both ACLs with reject defaults, and the address filters
    # of instance-nic-filters.json, so it accepts only its own IPv4 and MAC address. Create and migrate write these; the native clone
    # writes the same filters from instance_network.py's FILTERS.
    nic_args: >-
      {{ ['--device', 'eth0,ipv4.address=' ~ container.address,
          '--device', 'eth0,security.acls=' ~ container.nic_acl ~ ',' ~ container.acl,
          '--device', 'eth0,security.acls.default.egress.action=reject',
          '--device', 'eth0,security.acls.default.ingress.action=reject']
         + (['--device'] | product(['eth0,'] | product(nic_filters.items() | map('join', '=')) | map('join')) | flatten) }}
    resource_args: >-
      {{ (['--config'] | product(container.config.items() | map('join', '=')) | list | flatten)
         + ['--device', 'root,type=disk', '--device', 'root,path=/',
            '--device', 'root,pool=' ~ container.root_disk_pool, '--device', 'root,size=' ~ container.root_disk_size] }}
    as_orbit: >-
      {{ ['incus', 'exec', '--project', container.project, '--cwd', container.workspace, '--env', 'HOME=/home/orbit', container.name,
          '--', 'runuser', '-u', 'orbit', '--'] }}
    as_root: "{{ ['incus', 'exec', '--project', container.project, container.name, '--'] }}"
    # A clone's T3 and its agents run as `agent`, which alone reaches T3's port in the container.
    as_agent: >-
      {{ ['incus', 'exec', '--project', container.project, '--cwd', '/home/agent', '--env', 'HOME=/home/agent', container.name,
          '--', 'runuser', '-u', 'agent', '--'] }}
    in_workspace: >-
      {{ ['incus', 'exec', '--project', container.project, '--cwd', container.workspace, '--env', 'HOME=/home/orbit', container.name,
          '--', 'runuser', '-u', 'orbit', '--', 'git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false'] }}
    mirror_git: [/usr/bin/git, -c, core.hooksPath=/dev/null, -c, core.fsmonitor=false, -C, "{{ container.mirror }}"]
    node_bundle: "/tmp/orbit-instance-{{ container.instance_id }}-{{ run_id }}.bundle"
    # Run-scoped, so the run of another Operation never removes it; the fetch and checkout phases of one run share it.
    container_bundle: "/tmp/orbit-workspace-{{ run_id }}.bundle"
    # FrankenPHP and the Project's development Processes; `units` are those that run, which seed and check stop, start and read.
    unit_files: "{{ container.units + (container.processes | default([])) }}"
    units: >-
      {{ (container.units + (container.processes | default([]) | selectattr('desired', 'equalto', 'running') | list))
         | map(attribute='name') | list }}

# Private runtime preparation is also the narrow per-Instance conversion entry.
- name: Prepare the Instance's private Node store
  tags: [node-store, node-runtime]
  when: phase in ['node-store', 'node-runtime']
  ansible.builtin.include_tasks:
    file: tasks/instance-node-runtime.yml
    apply: {tags: [always]}
  vars:
    node_fetch: "{{ phase == 'node-runtime' }}"

# A dedicated phase also serves the one-Instance refresh without visiting workspace or Process tasks.
- name: Apply development mail
  tags: [mail]
  when: phase == 'mail' and container.mail | default(none) is not none
  ansible.builtin.include_tasks:
    file: tasks/instance-mail.yml
    apply: {tags: [mail]}

- name: Read the container
  tags: [container, clone, stop, start]
  ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
  register: container_read
  changed_when: false
  failed_when: false
  when: phase in ['container', 'clone', 'stop', 'start']

# A wake (only its intent names the asleep marker) finds one of four states (docs/reference/development-containers.md#sleep-and-wake):
# Frozen, the sleep's state: resume it, close swap again, and wait a short time for the web unit; a silent one gets a stop and the
# boot below, as a visitor would rather wait for a boot than for ever. Stopped (after a host reboot or a sleep that fell back to a
# stop): the boot below. Running: no start and no resume. A Frozen container without its marker is a defect that the result names.
# A deployment's start resumes a Frozen container too, then converges as usual.
- name: Read the asleep marker
  tags: [start]
  when: phase == 'start' and intent.marker is defined
  ansible.builtin.stat: { path: "{{ intent.marker }}", get_checksum: false }
  register: wake_marker

- name: Note the container's state before the start
  tags: [start]
  when: phase == 'start'
  ansible.builtin.set_fact:
    start_found: "{{ (container_read.stdout | from_json).status if container_read.rc == 0 else 'Missing' }}"
    # Incus writes `memory.swap.max = 0` from `limits.memory`; a sleep opens it for this cgroup only.
    container_cgroup: "{{ cgroup_root | default('/sys/fs/cgroup') }}/lxc.payload.{{ container.project }}_{{ container.name }}"

- name: Resume the frozen container
  tags: [start]
  when: phase == 'start' and start_found == 'Frozen'
  block:
    - name: Resume the container
      ansible.builtin.command: { argv: "{{ incus_project + ['resume', container.name] }}" }
      register: container_resume
      changed_when: true
    # Pages in swap stay there and come back on use; a running container swaps no more, as before the sleep.
    - name: Keep the container's memory out of swap
      ansible.builtin.command: { argv: [tee, "{{ container_cgroup }}/memory.swap.max"], stdin: "0", stdin_add_newline: false }
      changed_when: true
    - name: Start the web probe clock
      ansible.builtin.set_fact: { resume_probe_started: "{{ now().timestamp() }}" }
    - name: Wait for the resumed web unit
      when: intent.web is defined and container.web_config | default(none) is not none
      ansible.builtin.command:
        argv: >-
          {{ as_root + ['curl', '--silent', '--output', '/dev/null', '--write-out', '%{http_code}', '--max-time', '1',
                        'http://127.0.0.1:' ~ intent.web.port ~ '/'] }}
      register: resumed_web
      until: resumed_web.rc == 0 and resumed_web.stdout | int > 0
      retries: "{{ intent.web.resume_seconds }}"
      delay: 1
      changed_when: false
      failed_when: false
    - name: Record the resume
      ansible.builtin.set_fact:
        start_resumed: "{{ resumed_web is skipped or (resumed_web.rc == 0 and resumed_web.stdout | int > 0) }}"
        start_resume_timing:
          resume_seconds: "{{ (container_resume.delta.split(':')[1] | int) * 60 + (container_resume.delta.split(':')[2] | float) }}"
          web_probe_seconds: "{{ ((now().timestamp() | float) - (resume_probe_started | float)) | round(3) }}"
    - name: Stop the resumed container whose web unit is silent
      when: not start_resumed
      ansible.builtin.command: { argv: "{{ incus_project + ['stop', '--force', container.name] }}" }
      changed_when: true
    - name: Read the container after the resume
      ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
      register: resumed_read
      changed_when: false
    - name: Use the state after the resume
      ansible.builtin.set_fact: { container_read: "{{ resumed_read }}" }

# A wake of a container that runs (resumed now, or running already) boots nothing, so it converges nothing: the keys below were
# applied at its last boot. The wake's result names its path and, for a resume, its seconds.
- name: Note the wake's path
  tags: [start]
  when: phase == 'start' and intent.marker is defined
  ansible.builtin.set_fact:
    start_skips_boot: "{{ start_found == 'Running' or start_resumed | default(false) | bool }}"
    wake_result: >-
      {{ {'wake': 'resumed' if start_resumed | default(false) | bool
                  else 'restarted_after_resume' if start_found == 'Frozen'
                  else 'already_running' if start_found == 'Running' else 'started',
          'marker_found': wake_marker.stat.exists}
         | combine(start_resume_timing | default({})) }}

# A nested-fleet container (only its intent has `allowed_devices`) is made from the nested-fleet image. While the Node's last
# converge recorded a failed build of that image, the stable alias may name an older image or none: the create refuses before any
# change (docs/reference/development-containers.md#the-nested-fleet-image). A later converge that builds the image clears the record.
- name: Read the record of a failed nested-fleet image build
  tags: [container]
  when: phase == 'container' and container_read.rc != 0 and container.allowed_devices is defined
  ansible.builtin.stat: { path: /var/lib/orbit/instance-nested-image.json, get_checksum: false }
  register: nested_image_failure

- name: Refuse a nested-fleet create while its image build has failed
  tags: [container]
  when: phase == 'container' and container_read.rc != 0 and container.allowed_devices is defined
  ansible.builtin.assert:
    that: not nested_image_failure.stat.exists
    fail_msg: instance.nested_fleet_image_unavailable
    quiet: true

# A new nested-fleet default (only its intent has `inner_volume`) holds its inner fleet on its own btrfs volume
# (docs/reference/development-containers.md#the-inner-volume). The create makes the volume before the container; a retry reuses it,
# and the start guard checks its keys before every start. Every other Instance, Instance 2454 among them, skips these tasks.
- name: Make the inner volume
  tags: [container]
  when: phase == 'container' and container.inner_volume is defined
  vars:
    inner: "{{ container.inner_volume }}"
  block:
    - name: Read the inner volume
      ansible.builtin.command:
        argv: [incus, query, --, "/1.0/storage-pools/{{ inner.pool }}/volumes/custom/{{ inner.name }}?project={{ container.project }}"]
      register: inner_volume_read
      changed_when: false
      failed_when: false
    - name: Create the inner volume
      when: inner_volume_read.rc != 0
      ansible.builtin.command:
        argv: >-
          {{ ['incus', 'storage', 'volume', 'create', inner.pool, inner.name, '--project', container.project]
             + (inner.config | dict2items | map(attribute='key') | zip(inner.config.values()) | map('join', '=') | list)
             + ['size=' ~ inner.size] }}
      changed_when: true

# The container's own ACL: the bridge's way to the model forwarder stays in the bridge ACL; this one lets the Node's Caddy reach
# FrankenPHP, a clone's T3 clients reach T3, and the container reach its database server. Network ACLs live in the default project.
- name: Converge the container's ACL
  tags: [container, clone]
  when: phase in ['container', 'clone']
  block:
    - name: Read the network ACLs
      ansible.builtin.command: { argv: [incus, query, "--", "/1.0/network-acls?project=default&recursion=1"] }
      register: container_acls
      changed_when: false
    - name: Create the container's ACL
      when: container.acl not in (container_acls.stdout | from_json | map(attribute='name') | list)
      ansible.builtin.command: { argv: [incus, network, acl, create, "{{ container.acl }}", --project, default] }
      changed_when: true
    - name: Write the container's ACL rules
      when: >-
        (container_acls.stdout | from_json | selectattr('name', 'equalto', container.acl) | list | first | default({}))
        | dict2items | selectattr('key', 'in', ['description', 'egress', 'ingress']) | items2dict != container.acl_rules
      ansible.builtin.command:
        argv: [incus, network, acl, edit, "{{ container.acl }}", --project, default]
        stdin: "{{ container.acl_rules | to_json }}"
      changed_when: true
    - name: Create the container from the image
      when: phase == 'container' and container_read.rc != 0
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['init', container.image, container.name, '--config', 'security.idmap.isolated=true'] + nic_args + resource_args }}
      changed_when: true

# The disk of the inner volume, on the stopped container before its first start; the start guard then admits it.
- name: Attach the inner volume
  tags: [container]
  when: phase == 'container' and container.inner_volume is defined
  vars:
    inner: "{{ container.inner_volume }}"
  block:
    - name: Read the container's devices
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
      register: inner_device_read
      changed_when: false
    - name: Add the inner volume's disk
      when: inner.device not in ((inner_device_read.stdout | from_json).devices | default({}))
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['config', 'device', 'add', container.name, inner.device, 'disk', 'pool=' ~ inner.pool,
                              'source=' ~ inner.name, 'path=' ~ inner.path] }}
      changed_when: true

# Lifecycle mutations only add; removal belongs to host reconciliation from current Gateway intent.
- name: Admit the attached target endpoints at the bridge
  tags: [container, clone]
  when: phase in ['container', 'clone']
  ansible.builtin.include_tasks: instance-bridge-rules.yml
  vars:
    bridge_network: "{{ container.network }}"
    bridge_cidr: "{{ container.bridge_cidr }}"
    bridge_endpoints: "{{ container.bridge_endpoints }}"
    bridge_admitted_at: "{{ container.bridge_admitted_at }}"
    bridge_reconcile: false

# A clone copies the default's seed snapshot, which the default took with its units stopped: a ZFS clone that needs no start of the
# default. The copy takes its own address and ACL; T3 is published on the Node's WireGuard address in NAT mode, so T3 sees its
# client's own address.
- name: Copy the default's seed snapshot
  tags: [clone]
  when: phase == 'clone'
  block:
    - name: Read the default's seed snapshots
      when: container_read.rc != 0
      ansible.builtin.command:
        argv: [incus, query, "--", "/1.0/instances/{{ container.clone.source }}/snapshots?project={{ container.project }}&recursion=1"]
      register: source_snapshots
      changed_when: false
    # A deployment of the default between this create's admission and its copy took a newer seed and deleted the admitted one.
    - name: Refuse a seed that a deployment replaced
      when: container_read.rc != 0
      ansible.builtin.assert:
        that: container.clone.snapshot in (source_snapshots.stdout | from_json | map(attribute='name') | list)
        fail_msg: instance.default_seed_moved
        quiet: true
    - name: Copy the snapshot
      when: container_read.rc != 0
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['copy', container.clone.source ~ '/' ~ container.clone.snapshot, container.name] + nic_args + resource_args }}
      changed_when: true
    - name: Read the copy's devices
      ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
      register: clone_read
      changed_when: false
    - name: Publish T3 on the Node's WireGuard address
      when: container.clone.t3.device not in ((clone_read.stdout | from_json).devices | default({}))
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['config', 'device', 'add', container.name, container.clone.t3.device, 'proxy',
              'listen=tcp:' ~ container.clone.t3.listen ~ ':' ~ container.clone.t3.port,
              'connect=tcp:' ~ container.address ~ ':' ~ container.clone.t3.internal_port, 'nat=true'] }}
      changed_when: true

# The copy is the default's machine until it is prepared, so it is prepared while it is stopped, before its first start: its own
# machine-id, and no `orbit-*` unit that starts at boot. The seed keeps the default's units enabled, and at boot they would run with
# the default's settings: FrankenPHP on the default's address, a queue worker on the default's database. Each later phase of the
# clone enables the units it sets up. The default's Process units and environment folders go; the `processes` phase checks again.
- name: Prepare the copy before its first start
  tags: [clone]
  when: phase == 'clone' and (container_read.rc != 0 or (container_read.stdout | from_json).status != 'Running')
  vars:
    files_route: "/1.0/instances/{{ container.name }}/files?project={{ container.project }}&path="
  block:
    - name: Read the units that start at boot, the Process units and the Process folders
      ansible.builtin.command: { argv: [incus, query, "--", "{{ files_route }}{{ item }}"] }
      loop:
        - /etc/systemd/system/multi-user.target.wants
        - /etc/systemd/system
        - /etc/orbit/processes
        - /etc/systemd/system/timers.target.wants
        - /etc/orbit/schedules
        - /etc/systemd/system/sockets.target.wants
      register: copy_read
      changed_when: false
      failed_when: copy_read.rc != 0 and 'not found' not in (copy_read.stderr | lower)
    - name: Name what the copy must not start or keep
      ansible.builtin.set_fact:
        copy_remove: >-
          {{ ((copy_read.results[0].stdout | default('[]', true) | from_json) | select('match', '^orbit-.*[.]service$')
               | map('regex_replace', '^', '/etc/systemd/system/multi-user.target.wants/') | list)
             + ((copy_read.results[1].stdout | default('[]', true) | from_json) | select('match', '^orbit-process-[0-9]+-.*[.]service$')
               | reject('in', container.processes | default([]) | map(attribute='name') | list)
               | map('regex_replace', '^', '/etc/systemd/system/') | list)
             + ((copy_read.results[2].stdout | default('[]', true) | from_json)
               | reject('in', container.processes | default([]) | map(attribute='id') | map('string') | list)
               | map('regex_replace', '^', '/etc/orbit/processes/') | list)
             + ((copy_read.results[1].stdout | default('[]', true) | from_json) | select('match', '^orbit-schedule-.*[.](service|timer)$')
               | map('regex_replace', '^', '/etc/systemd/system/') | list)
             + ((copy_read.results[3].stdout | default('[]', true) | from_json) | select('match', '^orbit-schedule-.*[.]timer$')
               | map('regex_replace', '^', '/etc/systemd/system/timers.target.wants/') | list)
             + ((copy_read.results[4].stdout | default('[]', true) | from_json) | select('match', '^.*[.](sh|complete)$')
               | map('regex_replace', '^', '/etc/orbit/schedules/') | list)
             + ((copy_read.results[1].stdout | default('[]', true) | from_json) | select('match', '^orbit-node-service-[0-9]+[.](socket|service)$')
               | map('regex_replace', '^', '/etc/systemd/system/') | list)
             + ((copy_read.results[5].stdout | default('[]', true) | from_json) | select('match', '^orbit-node-service-[0-9]+[.](socket|service)$')
               | map('regex_replace', '^', '/etc/systemd/system/sockets.target.wants/') | list) }}
    - name: Keep the default's units from starting in the copy
      when: copy_remove | length > 0
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'delete', '--force'] + (copy_remove | map('regex_replace', '^', container.name) | list) }}
      changed_when: true
    # Incus's own id of the copy, without dashes, the form systemd writes.
    - name: Give the copy its own machine-id
      ansible.builtin.command:
        argv: "{{ incus_project + ['file', 'push', '--uid', '0', '--gid', '0', '--mode', '0444', '-', container.name ~ '/etc/machine-id'] }}"
        stdin: "{{ (clone_read.stdout | from_json).config['volatile.uuid'] | replace('-', '') }}"
      changed_when: true

# UFW on the Node, each rule under the Instance's comment prefix: T3's route rules, the task VM range's deny first, and the way to
# the database server.
- name: Admit the container's own paths on the Node
  tags: [container, clone]
  when: phase in ['container', 'clone'] and container.firewall | default([]) | length > 0
  community.general.ufw:
    rule: "{{ item.rule }}"
    route: "{{ item.route | default('no') | bool }}"
    interface_in: "{{ item.interface_in }}"
    interface_out: "{{ item.interface_out | default(omit) }}"
    from_ip: "{{ item.from_ip }}"
    to_ip: "{{ item.to_ip }}"
    to_port: "{{ item.to_port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ container.firewall }}"
  loop_control: { label: "{{ item.comment }}" }

# Incus restores a container that was running when the host boots, without the start guard below. A nested-fleet intent sets
# `boot.autostart: false`, which create and clone write; a container made before the key keeps its config, so the start writes
# it here. It is the one key a start converges: it only takes a start away, and Incus applies it without a restart.
- name: Keep the container from starting at boot
  tags: [container, clone, start]
  when: >-
    phase in ['container', 'clone', 'start'] and not start_skips_boot | default(false) | bool and container_read.rc == 0
    and 'boot.autostart' in container.config
    and (container_read.stdout | from_json).expanded_config['boot.autostart'] | default('') != container.config['boot.autostart']
  ansible.builtin.command:
    argv: "{{ incus_project + ['config', 'set', container.name, 'boot.autostart=' ~ container.config['boot.autostart']] }}"
  changed_when: true

# Both independent ACLs reject by default. Validate all effective bridge NICs, including copied local extra devices.
- name: Check the container's effective egress gates before starting it
  tags: [container, clone, start]
  when: phase in ['container', 'clone', 'start'] and not start_skips_boot | default(false) | bool
  block:
    - name: Read the container's effective devices
      ansible.builtin.command: { argv: [incus, query, --, "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
      register: container_nic_read
      changed_when: false
    - name: Check every effective bridge NIC
      ansible.builtin.include_tasks: instance-network-nic-check.yml
      vars:
        network_container: "{{ container_nic_read.stdout | from_json }}"
        network_name: "{{ container.network }}"
        network_failure: instance.container_network_unsafe
        expected_network_device: eth0
        network_allowed_devices: "{{ container.allowed_devices | default({}) }}"
        network_allowed_config: "{{ container.config }}"
        # The only volume besides the root that the guard admits, with exactly these keys.
        network_allowed_volumes: >-
          {{ {container.inner_volume.device: container.inner_volume.config | combine({'size': container.inner_volume.size})}
             if container.inner_volume is defined else {} }}

- name: Start the container
  tags: [container, clone, start]
  when: phase in ['container', 'clone', 'start'] and (container_read.rc != 0 or (container_read.stdout | from_json).status != 'Running')
  ansible.builtin.command: { argv: "{{ incus_project + ['start', container.name] }}" }
  changed_when: true

# The inner Incus's pool on the inner volume, once. The inner Incus may still be starting with the container.
- name: Create the inner pool
  tags: [container]
  when: phase == 'container' and container.inner_volume is defined
  vars:
    inner_pool: "{{ container.inner_volume.inner_pool }}"
  block:
    - name: Wait for the inner Incus
      ansible.builtin.command: { argv: "{{ as_root + ['incus', 'admin', 'waitready', '--timeout', '60'] }}" }
      changed_when: false
    - name: Read the inner pool
      ansible.builtin.command: { argv: "{{ as_root + ['incus', 'storage', 'show', inner_pool.name] }}" }
      register: inner_pool_read
      changed_when: false
      failed_when: false
    - name: Create the inner pool on the inner volume
      when: inner_pool_read.rc != 0
      ansible.builtin.command:
        argv: "{{ as_root + ['incus', 'storage', 'create', inner_pool.name, 'btrfs', 'source=' ~ inner_pool.source] }}"
      changed_when: true

# A nested-fleet container (only its intent has `club_key`) gets its nested Gateway's Club key into its /run at each start, before
# any check of its inner fleet (docs/reference/development-containers.md#the-club-key-of-the-nested-gateway).
- name: Deliver the nested Gateway's Club key
  tags: [container, clone, start]
  when: phase in ['container', 'clone', 'start'] and container.club_key is defined
  ansible.builtin.include_tasks:
    file: tasks/instance-nested-club-key.yml
    apply: {tags: [always]}

# `php` on every PATH in the container is the Project's static build from the runtime folder: `/usr/local/bin` is on the PATH of
# units, login shells and `incus exec` sessions, so `composer` runs for `agent` and `orbit` alike. A Project without one has none.
- name: Link the Project's php
  tags: [container, start]
  when: phase in ['container', 'start'] and not start_skips_boot | default(false) | bool
  vars:
    container_php: "{{ container.php | default(none) or '' }}"
  block:
    - name: Read the php link
      ansible.builtin.command: { argv: "{{ as_root + ['readlink', '/usr/local/bin/php'] }}" }
      register: container_php_link
      changed_when: false
      failed_when: false
    - name: Read whether a php that is no link is there
      ansible.builtin.command: { argv: "{{ as_root + ['test', '-e', '/usr/local/bin/php'] }}" }
      register: container_php_file
      changed_when: false
      failed_when: false
    # A `php` that is no link is not Orbit's: it stays.
    - name: Point the php link at the Project's PHP
      when: >-
        container_php != '' and container_php_link.stdout != container_php
        and (container_php_link.rc == 0 or container_php_file.rc != 0)
      ansible.builtin.command: { argv: "{{ as_root + ['ln', '-sfn', container_php, '/usr/local/bin/php'] }}" }
      changed_when: true
    # Only a link goes: `readlink` fails on anything else.
    - name: Remove the php link of a Project without PHP
      when: container_php == '' and container_php_link.rc == 0
      ansible.builtin.command: { argv: "{{ as_root + ['rm', '-f', '/usr/local/bin/php'] }}" }
      changed_when: true

# Both static PHP binaries read this compiled-in scan directory. The settings are shared by every container, not a Project's: the
# memory limit, and PHP Data Bridge, which PHP loads from the runtime folder before the app. The bridge returns at once outside a
# web request, and FrankenPHP serves in classic mode, where it runs.
- name: Configure the container's PHP settings
  tags: [container, clone, start]
  when: phase in ['container', 'clone', 'start'] and not start_skips_boot | default(false) | bool
  vars:
    container_php_ini_path: /etc/orbit/php/conf.d/99-orbit-runtime.ini
    container_php_ini_content: "memory_limit = 1G\nauto_prepend_file = /opt/orbit-runtime/current/php-data-bridge/bridge/prepend.php\n"
  block:
    - name: Read the container's PHP settings
      ansible.builtin.command: { argv: "{{ as_root + ['cat', '--', container_php_ini_path] }}" }
      register: container_php_ini_read
      changed_when: false
      failed_when: container_php_ini_read.rc != 0 and 'No such file or directory' not in container_php_ini_read.stderr
    - name: Write the changed container PHP settings
      when: container_php_ini_read.rc != 0 or container_php_ini_read.stdout ~ '\n' != container_php_ini_content
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--create-dirs', '--uid', '0', '--gid', '0', '--mode', '0644', '-',
          container.name ~ container_php_ini_path] }}
        stdin: "{{ container_php_ini_content }}"
        stdin_add_newline: false
      notify: Restart the running Orbit units after changed PHP settings
      changed_when: true
    # Finish the restart dispatch before any readiness check later in the phase.
    - name: Finish applying changed PHP settings
      ansible.builtin.meta: flush_handlers

# The access plan's private names, such as `reverb.orbit` for an attached websocket app (docs/reference/development-containers.md#private-names-of-the-access-plan).
- name: Write the private names of the access plan
  tags: [container, clone, start]
  when: phase in ['container', 'clone', 'start'] and not start_skips_boot | default(false) | bool
  ansible.builtin.include_tasks:
    file: instance-private-names.yml
    apply:
      tags: [container, clone, start]
  vars:
    private_names_root: "{{ as_root }}"
    private_names_push: "{{ incus_project }}"
    private_names_container: "{{ container.name }}"
    private_names: "{{ container.private_names | default([]) }}"

# The composed NO_PROXY, present only when it is not the image's base (InstanceNodeServiceTargets::proxyEnvironment, the one builder),
# for the units and login shells. instance_node_services.py `proxy` is the one writer; a unit reads the value at its next start.
- name: Write the composed proxy environment
  tags: [container, clone, start]
  when: phase in ['container', 'clone', 'start'] and not start_skips_boot | default(false) | bool and container.proxy_environment is defined
  ansible.builtin.command:
    argv: "{{ ['timeout', '30'] + as_root + ['python3', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_node_services.py'), 'proxy'] }}"
    stdin: "{{ {'proxy_environment': container.proxy_environment} | to_json }}"
  register: composed_proxy_write
  changed_when: composed_proxy_write.rc == 0 and (composed_proxy_write.stdout | from_json).changed

- name: Stop the container
  tags: [stop]
  when: phase == 'stop' and container_read.rc == 0 and (container_read.stdout | from_json).status == 'Running'
  ansible.builtin.command: { argv: "{{ incus_project + ['stop', '--timeout', '30', container.name] }}" }
  changed_when: true

# The branch comes from a mirror on the Node: a container cannot reach GitHub, and the read token never enters it.
- name: Fetch the branch on the Node
  tags: [container, clone, fetch]
  when: phase in ['container', 'clone', 'fetch']
  vars:
    credential_path: "/tmp/orbit-git-credential-{{ run_id }}"
  block:
    - name: Make the mirror folder
      ansible.builtin.file: { path: "{{ container.mirror | dirname }}", state: directory, owner: root, group: root, mode: "0700" }
    - name: Initialise the mirror
      ansible.builtin.command:
        argv: [/usr/bin/git, init, --quiet, --bare, "{{ container.mirror }}"]
        creates: "{{ container.mirror }}/HEAD"
    # The token file lives only for the fetch, so writing and removing it is no change to the Node.
    - name: Write the read token
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', 'ORBIT_GIT_CREDENTIAL') }}"
        dest: "{{ credential_path }}"
        mode: "0600"
      no_log: true
      changed_when: false
    - name: Read the mirrored branch
      ansible.builtin.command: { argv: "{{ mirror_git + ['rev-parse', '--verify', '--quiet', 'refs/heads/' ~ container.branch] }}" }
      register: mirror_before
      changed_when: false
      failed_when: false
    - name: Name the remote Git command
      ansible.builtin.set_fact:
        remote_git: >-
          {{ ['/usr/bin/timeout', '300', '/usr/bin/env', 'GIT_TERMINAL_PROMPT=0', 'GIT_CONFIG_NOSYSTEM=1', 'GIT_CONFIG_GLOBAL=/dev/null']
          + mirror_git
          + ['-c', 'credential.helper=', '-c', 'credential.helper=store --file=' ~ credential_path,
          '-c', 'protocol.allow=never', '-c', 'http.followRedirects=false',
          '-c', 'url.https://github.com/.insteadOf=git@github.com:', '-c', 'url.https://github.com/.insteadOf=ssh://git@github.com/',
          '-c', 'protocol.' ~ container.protocols[0] ~ '.allow=always'] }}
    # A clone's branch is the matching origin branch, or a new branch at the seed's commit, which the workspace already holds.
    - name: Read whether the origin has the clone's branch
      when: phase == 'clone'
      ansible.builtin.command: { argv: "{{ remote_git + ['ls-remote', '--heads', '--', container.repository, 'refs/heads/' ~ container.branch] }}" }
      register: clone_remote
      changed_when: false
    - name: Fetch
      when: phase != 'clone' or clone_remote.stdout | trim != ''
      ansible.builtin.command:
        argv: >-
          {{ remote_git + ['fetch', '--quiet', '--no-tags', '--', container.repository,
          '+refs/heads/' ~ container.branch ~ ':refs/heads/' ~ container.branch] }}
      changed_when: false
    # The default's mirror on this Node holds the seed's commit, whichever branch the default follows.
    - name: Fetch the seed's commit from the default's mirror
      when: phase == 'clone' and clone_remote.stdout | trim == '' and mirror_before.rc != 0
      ansible.builtin.command:
        argv: "{{ mirror_git + ['fetch', '--quiet', '--no-tags', '--', container.clone.source_mirror, '+refs/heads/*:refs/seed/*'] }}"
      changed_when: false
    - name: Create the branch at the seed's commit
      when: phase == 'clone' and clone_remote.stdout | trim == '' and mirror_before.rc != 0
      ansible.builtin.command: { argv: "{{ mirror_git + ['branch', '--', container.branch, container.clone.seed_commit] }}" }
      changed_when: true
    - name: Read the fetched branch
      ansible.builtin.command: { argv: "{{ mirror_git + ['rev-parse', '--verify', 'refs/heads/' ~ container.branch] }}" }
      register: mirror_after
      changed_when: mirror_after.stdout != mirror_before.stdout
  always:
    - name: Remove the read token
      ansible.builtin.file: { path: "/tmp/orbit-git-credential-{{ run_id }}", state: absent }
      changed_when: false

# A pinned commit must be on the branch's first-parent chain; without one the branch's newest commit deploys.
- name: Check the commit on the Node
  tags: [fetch]
  when: phase == 'fetch'
  block:
    - name: Read the branch's first-parent chain
      ansible.builtin.command: { argv: "{{ mirror_git + ['rev-list', '--first-parent', 'refs/heads/' ~ container.branch] }}" }
      register: container_chain
      changed_when: false
    - name: Refuse a commit that is not on the branch
      ansible.builtin.assert:
        that: container.commit is none or container.commit in container_chain.stdout_lines
        fail_msg: deployment.commit_not_on_branch
        quiet: true
    - name: Keep the commit
      ansible.builtin.set_fact:
        container_commit: "{{ container.commit if container.commit is not none else container_chain.stdout_lines[0] }}"

# The first build brings the branch in only when the workspace is not at the mirror's commit yet, so a rerun changes nothing.
- name: Read the workspace and the mirror
  tags: [workspace]
  when: phase == 'workspace'
  block:
    - name: Read the workspace repository
      ansible.builtin.command: { argv: "{{ as_orbit + ['test', '-d', container.workspace ~ '/.git'] }}" }
      register: workspace_repository
      changed_when: false
      failed_when: workspace_repository.rc not in [0, 1]
    - name: Initialise the workspace repository
      when: workspace_repository.rc != 0
      ansible.builtin.command:
        argv: "{{ as_orbit + ['git', 'init', '--quiet', '--shared=group', '--initial-branch', container.branch, container.workspace] }}"
      changed_when: true
    - name: Read the workspace's branch and commit
      ansible.builtin.command: { argv: "{{ in_workspace + item }}" }
      loop:
        - [symbolic-ref, --quiet, --short, HEAD]
        - [rev-parse, --verify, --quiet, "HEAD^{commit}"]
      register: workspace_before
      changed_when: false
      failed_when: false
    - name: Read the mirror's commit
      ansible.builtin.command: { argv: "{{ mirror_git + ['rev-parse', '--verify', 'refs/heads/' ~ container.branch] }}" }
      register: mirror_head
      changed_when: false
    - name: Decide whether the branch moves in
      ansible.builtin.set_fact:
        workspace_behind: >-
          {{ workspace_before.results[0].stdout | trim != container.branch
             or workspace_before.results[1].stdout | trim != mirror_head.stdout | trim }}

- name: Bring the branch into the container
  tags: [fetch, workspace]
  when: phase == 'fetch' or (phase == 'workspace' and workspace_behind | bool)
  block:
    - name: Bundle the branch
      ansible.builtin.command: { argv: "{{ mirror_git + ['bundle', 'create', '--quiet', node_bundle, 'refs/heads/' ~ container.branch] }}" }
      changed_when: true
    - name: Push the bundle into the container
      ansible.builtin.command:
        argv: "{{ incus_project + ['file', 'push', '--uid', '1000', '--gid', '2760', '--mode', '0640', node_bundle, container.name ~ container_bundle] }}"
      changed_when: true
  always:
    - name: Remove the bundle on the Node
      ansible.builtin.file: { path: "{{ node_bundle }}", state: absent }

# The workspace is a repository shared by `orbit` and `agent` through the group `work`.
- name: Check out the branch in the workspace
  tags: [workspace]
  when: phase == 'workspace' and workspace_behind | bool
  block:
    - name: Fetch the bundle and check out the branch
      ansible.builtin.command: { argv: "{{ in_workspace + item }}" }
      loop:
        - [fetch, --quiet, "{{ container_bundle }}", "+refs/heads/{{ container.branch }}:refs/remotes/origin/{{ container.branch }}"]
        - [checkout, --quiet, -B, "{{ container.branch }}", "refs/remotes/origin/{{ container.branch }}"]
      changed_when: true
  always:
    - name: Remove the bundle in the container
      ansible.builtin.command: { argv: "{{ as_root + ['rm', '-f', '--', container_bundle] }}" }
      changed_when: false

- name: Read the checked-out commit
  tags: [workspace]
  when: phase == 'workspace'
  block:
    - name: Read the commit
      ansible.builtin.command: { argv: "{{ in_workspace + ['rev-parse', '--verify', 'HEAD^{commit}'] }}" }
      register: workspace_head
      changed_when: false
    - name: Keep the commit
      ansible.builtin.set_fact:
        container_commit: "{{ workspace_head.stdout | trim }}"

# The .env goes in as `orbit` with group `work`, 0640, through a 0600 file on the Node that is removed at once. It is compared by
# digest first, so a rerun with the same .env changes nothing.
- name: Read the digest of .env in the container
  tags: [workspace]
  when: phase == 'workspace'
  ansible.builtin.command: { argv: "{{ as_root + ['sha256sum', '--', container.environment_file] }}" }
  register: environment_digest
  changed_when: false
  failed_when: false

- name: Write .env in the container
  tags: [workspace]
  when: >-
    phase == 'workspace'
    and (environment_digest.stdout | default('')).split(' ') | first != lookup('ansible.builtin.env', 'ORBIT_ENVIRONMENT') | hash('sha256')
  vars:
    environment_path: "/tmp/orbit-environment-{{ container.instance_id }}-{{ run_id }}"
  block:
    - name: Write the .env on the Node
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', 'ORBIT_ENVIRONMENT') }}"
        dest: "{{ environment_path }}"
        mode: "0600"
      no_log: true
    - name: Push the .env into the container
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--uid', '1000', '--gid', '2760', '--mode', '0640', environment_path,
          container.name ~ container.environment_file] }}
      changed_when: true
  always:
    - name: Remove the .env on the Node
      ansible.builtin.file: { path: "{{ environment_path }}", state: absent }

# The .env holds the Instance's secrets, so Git must never take it, also when the Project's .gitignore does not name it. One line in
# the checkout's own info/exclude, written once; its other lines and the Project's files stay as they are.
- name: Keep .env out of Git
  tags: [workspace]
  when: phase == 'workspace' and container.environment_file.startswith(container.workspace ~ '/')
  block:
    - name: Find the exclude file of the checkout
      ansible.builtin.command: { argv: "{{ in_workspace + ['rev-parse', '--git-path', 'info/exclude'] }}" }
      register: workspace_exclude
      changed_when: false
    - name: Name .env in the exclude file
      ansible.builtin.command:
        argv: "{{ as_orbit + ['python3', '-I', '-c', exclude_program, workspace_exclude.stdout | trim, container.environment_file[container.workspace | length + 1:]] }}"
      vars:
        exclude_program: |
          import os, re, sys
          path, entry = sys.argv[1], '/' + re.sub(r'([\\*?\[])', r'\\\1', sys.argv[2])
          try:
              with open(path, 'rb') as stream:
                  data = stream.read()
          except FileNotFoundError:
              data = b''
          if entry.encode() in data.splitlines():
              print('unchanged')
              sys.exit(0)
          os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
          with open(path, 'ab') as stream:
              stream.write((b'' if not data or data.endswith(b'\n') else b'\n') + entry.encode() + b'\n')
          print('changed')
      register: workspace_exclude_write
      changed_when: workspace_exclude_write.stdout == 'changed'

# A deployment checks out only a clean tree that the commit fast-forwards.
- name: Check out the commit
  tags: [checkout]
  when: phase == 'checkout'
  vars:
    target: "{{ container.commit if container.commit is not none else 'refs/remotes/origin/' ~ container.branch }}"
  block:
    - name: Fetch the bundle
      ansible.builtin.command:
        argv: "{{ in_workspace + ['fetch', '--quiet', container_bundle, '+refs/heads/' ~ container.branch ~ ':refs/remotes/origin/' ~ container.branch] }}"
      changed_when: true
    - name: Read the tracked changes and the branch
      ansible.builtin.command: { argv: "{{ in_workspace + item }}" }
      loop:
        - [status, --porcelain, --untracked-files=no]
        - [symbolic-ref, --quiet, --short, HEAD]
      register: workspace_state
      changed_when: false
      failed_when: false
    - name: Refuse tracked changes
      ansible.builtin.assert:
        that: workspace_state.results[0].rc == 0 and workspace_state.results[0].stdout | trim == ''
        fail_msg: deployment.checkout_dirty
        quiet: true
    - name: Read whether the commit fast-forwards the branch
      ansible.builtin.command: { argv: "{{ in_workspace + ['merge-base', '--is-ancestor', 'HEAD', target] }}" }
      register: workspace_ancestor
      changed_when: false
      failed_when: workspace_ancestor.rc not in [0, 1]
    - name: Refuse a diverged branch
      ansible.builtin.assert:
        that:
          - workspace_state.results[1].stdout | trim == container.branch
          - workspace_ancestor.rc == 0
        fail_msg: deployment.branch_diverged
        quiet: true
    - name: Check out the commit
      ansible.builtin.command: { argv: "{{ in_workspace + ['checkout', '--quiet', '-B', container.branch, target] }}" }
      changed_when: true
  always:
    - name: Remove the bundle in the container
      ansible.builtin.command: { argv: "{{ as_root + ['rm', '-f', '--', container_bundle] }}" }
      changed_when: false

# `orbit` and `agent` share the workspace through the group `work`. A tool that asks for 0755 folders, such as Bun in `node_modules`,
# caps their ACL mask, so the other user cannot write there. Before the deploy steps (`checkout`) and after them (`processes`) root
# gives the group back what the owner has; only entries that lack it change.
- name: Keep the workspace writable for its group
  tags: [checkout, processes]
  when: phase in ['checkout', 'processes']
  ansible.builtin.command:
    argv: >-
      {{ as_root + ['find', container.workspace, '(', '(', '-type', 'd', '!', '-perm', '-g=rwx', ')', '-o',
          '(', '-type', 'f', '!', '-perm', '-g=rw', ')', ')', '-print', '-exec', 'chmod', 'g+rwX', '{}', '+'] }}
  register: workspace_modes
  changed_when: workspace_modes.stdout != ''

# A Process unit or folder that is not this Instance's goes: a clone starts with its default's units in the seed, and a definition the
# Project removed leaves its unit behind.
- name: Remove the Process units of other owners
  tags: [processes]
  when: phase == 'processes'
  vars:
    owned_units: "{{ container.processes | default([]) | map(attribute='name') | list }}"
    owned_ids: "{{ container.processes | default([]) | map(attribute='id') | map('string') | list }}"
  block:
    - name: Read the Process units and folders
      ansible.builtin.command:
        argv: >-
          {{ as_root + ['find', item, '-mindepth', '1', '-maxdepth', '1', '-name',
          'orbit-process-*.service' if item == '/etc/systemd/system' else '[0-9]*'] }}
      loop: [/etc/systemd/system, /etc/orbit/processes]
      register: foreign_read
      changed_when: false
      failed_when: foreign_read.rc != 0 and 'No such file' not in foreign_read.stderr
    - name: Name the foreign units and folders
      ansible.builtin.set_fact:
        foreign_units: "{{ foreign_read.results[0].stdout_lines | map('basename') | reject('in', owned_units) | list }}"
        foreign_folders: "{{ foreign_read.results[1].stdout_lines | map('basename') | reject('in', owned_ids) | list }}"
    - name: Stop and disable the foreign units
      when: foreign_units | length > 0
      ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'disable', '--now', '--'] + foreign_units }}" }
      changed_when: true
    - name: Remove the foreign units and folders
      when: foreign_units | length > 0 or foreign_folders | length > 0
      ansible.builtin.command:
        argv: >-
          {{ as_root + ['rm', '-rf', '--'] + (foreign_units | map('regex_replace', '^', '/etc/systemd/system/') | list)
             + (foreign_folders | map('regex_replace', '^', '/etc/orbit/processes/') | list) }}
      changed_when: true
    - name: Reload systemd after the removal
      when: foreign_units | length > 0
      ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'daemon-reload'] }}" }
      changed_when: true

# A migrated Schedule is installed disabled only after the workspace copy, before any application Process starts.
- name: Install carried container Schedules disabled
  tags: [processes]
  when: phase == 'processes' and intent.migrate is defined
  ansible.builtin.include_tasks:
    file: tasks/instance-migrate-schedules.yml
    apply: { tags: [processes] }
  vars:
    migrate: "{{ intent.migrate }}"

# FrankenPHP and the Project's other development Processes are `orbit-*` units, so a runtime folder update restarts them too. A
# Process's environment file is named by the digest of its content, so a changed value is a new file and a changed unit.
- name: Write the Processes' environment files
  tags: [processes]
  when: phase == 'processes' and (container.processes | default([]) | selectattr('environment') | list | length > 0)
  vars:
    environments: "{{ lookup('ansible.builtin.env', 'ORBIT_PROCESS_ENVIRONMENTS') | from_json }}"
  block:
    - name: Read the environment files
      ansible.builtin.command: { argv: "{{ as_root + ['test', '-f', item.environment] }}" }
      loop: "{{ container.processes | selectattr('environment') | list }}"
      loop_control: { label: "{{ item.name }}" }
      register: environments_read
      changed_when: false
      failed_when: environments_read.rc not in [0, 1]
    # Root reads it when systemd starts the unit; the values go in on standard input and never touch the Node's disk.
    - name: Push the missing environment files
      when: item.rc != 0
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--create-dirs', '--uid', '0', '--gid', '0', '--mode', '0600', '-',
              container.name ~ item.item.environment] }}
        stdin: "{{ environments[item.item.environment] }}"
        stdin_add_newline: false
      loop: "{{ environments_read.results }}"
      loop_control: { label: "{{ item.item.name }}" }
      no_log: true
      changed_when: true

- name: Read whether this container already has a private Node store
  tags: [processes]
  when: phase == 'processes'
  vars:
    node_private_layout: >-
      from pathlib import Path; import sys;
      h=Path("/var/lib/orbit/vite-plus-home/js_runtime");
      sys.exit(0 if not h.is_symlink() and h.is_dir() and not (h/"node").is_symlink()
      and (h/"node").is_dir() and Path("/usr/local/libexec/orbit-instance-node-runtime.py").is_file() else 1)
  ansible.builtin.command:
    argv: "{{ as_orbit + ['python3', '-c', node_private_layout] }}"
  register: node_private_bootstrap
  changed_when: false
  failed_when: node_private_bootstrap.rc not in [0, 1]

- name: Fetch Node versions before starting application Processes
  tags: [processes]
  when: phase == 'processes' and node_private_bootstrap.rc == 0
  ansible.builtin.include_tasks:
    file: tasks/instance-node-runtime.yml
    apply: {tags: [processes]}
  vars:
    node_fetch: true

# A changed value is a new file; the old one goes, so no former value stays in the container.
- name: Remove the Processes' former environment files
  tags: [processes]
  when: phase == 'processes' and (container.processes | default([]) | length > 0)
  ansible.builtin.command:
    argv: >-
      {{ as_root + ['find', '/etc/orbit/processes/' ~ item.id, '-maxdepth', '1', '-type', 'f', '-name', '*.env']
         + (['!', '-path', item.environment] if item.environment else []) + ['-print', '-delete'] }}
  loop: "{{ container.processes }}"
  loop_control: { label: "{{ item.name }}" }
  register: environments_removed
  changed_when: environments_removed.stdout != ''
  failed_when: environments_removed.rc != 0 and 'No such file' not in environments_removed.stderr

- name: Install and start the Processes
  tags: [processes]
  when: phase == 'processes' and unit_files | length > 0
  block:
    - name: Read the FrankenPHP configuration
      when: container.web_config | default(none) is not none
      ansible.builtin.command: { argv: "{{ as_root + ['cat', container.web_config.path] }}" }
      register: web_config_read
      changed_when: false
      failed_when: web_config_read.rc not in [0, 1]
    - name: Write the changed FrankenPHP configuration
      when:
        - container.web_config | default(none) is not none
        - web_config_read.rc != 0 or web_config_read.stdout ~ '\n' != container.web_config.content
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--create-dirs', '--uid', '0', '--gid', '0', '--mode', '0644', '-',
                              container.name ~ container.web_config.path] }}
        stdin: "{{ container.web_config.content }}"
        stdin_add_newline: false
      register: web_config_written
      changed_when: true
    - name: Read the units
      ansible.builtin.command: { argv: "{{ as_root + ['cat', '/etc/systemd/system/' ~ item.name] }}" }
      loop: "{{ unit_files }}"
      loop_control: { label: "{{ item.name }}" }
      register: units_read
      changed_when: false
      failed_when: false
    - name: Write the changed units
      when: item.rc != 0 or item.stdout ~ '\n' != item.item.content
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--uid', '0', '--gid', '0', '--mode', '0644', '-',
          container.name ~ '/etc/systemd/system/' ~ item.item.name] }}
        stdin: "{{ item.item.content }}"
        stdin_add_newline: false
      loop: "{{ units_read.results }}"
      loop_control: { label: "{{ item.item.name }}" }
      register: units_written
      changed_when: true
    - name: Reload systemd
      when: units_written.results | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0
      ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'daemon-reload'] }}" }
      changed_when: true
    - name: Enable and start the units
      when: units | length > 0
      ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'enable', '--now', '--no-block', '--'] + units }}" }
      changed_when: false
    # A changed unit restarts. A deployment's new seed then stops and starts every running unit on the new commit.
    - name: Restart the changed units
      when: changed_unit_names | length > 0 or web_config_written.changed | default(false)
      vars:
        changed_unit_names: >-
          {{ units_written.results | selectattr('changed', 'defined') | selectattr('changed')
             | map(attribute='item.item.name') | select('in', units) | list }}
        config_unit_names: "{{ ['orbit-frankenphp.service'] if web_config_written.changed | default(false) else [] }}"
      ansible.builtin.command:
        argv: "{{ as_root + ['systemctl', 'restart', '--no-block', '--'] + ((changed_unit_names + config_unit_names) | unique | list) }}"
      changed_when: true
# A start waits only for the Process units that the container's boot starts: installed and enabled (WantedBy=multi-user.target, so
# a link in its wants folder), and FrankenPHP. A definition that is new since the last deployment has its record in the intent but
# no unit file yet; a Process that was stopped and is now set to run has its file but is disabled. The `processes` phase installs,
# enables and starts both (enable --now) and waits for them.
- name: Read the Process units that start at boot
  tags: [start]
  when: phase == 'start'
  ansible.builtin.command:
    argv: >-
      {{ as_root + ['find', '/etc/systemd/system/multi-user.target.wants', '-mindepth', '1', '-maxdepth', '1',
                    '-name', 'orbit-process-*.service'] }}
  register: boot_units_read
  changed_when: false
  failed_when: boot_units_read.rc != 0 and 'No such file' not in boot_units_read.stderr

# PHP settings and any try-restart job above precede this check. Job= must be empty as well as ActiveState=active: a queued
# restart can still report active before systemd stops the former process. Each read and the phase itself have their own bound.
- name: Wait for each running unit
  tags: [processes, start]
  when: phase in ['processes', 'start']
  ansible.builtin.command:
    argv: "{{ as_root + ['timeout', '5', 'systemctl', 'show', '--property=ActiveState', '--property=Job', '--', item] }}"
  loop: >-
    {{ units | difference(container.processes | default([]) | map(attribute='name') | list)
       if phase == 'processes' and intent.migrate is defined
       else units | difference(container.processes | default([]) | map(attribute='name')
                               | reject('in', boot_units_read.stdout_lines | map('basename') | list) | list)
       if phase == 'start' else units }}
  register: unit_ready
  changed_when: false
  until: unit_ready.rc == 0 and 'ActiveState=active' in unit_ready.stdout_lines and 'Job=' in unit_ready.stdout_lines
  retries: 10
  delay: 1

# A wake's start (only its intent names the asleep marker; a deployment's start and restore-start have none) ends in the same run:
# once the web unit answers it removes the marker, then waits for T3 (docs/reference/development-containers.md#sleep-and-wake).
- name: Mark the woken Instance awake
  tags: [start]
  when: phase == 'start' and intent.marker is defined
  ansible.builtin.include_tasks:
    file: tasks/instance-container-power.yml
    apply: {tags: [always]}
  vars:
    power: awake
    marker: "{{ intent.marker }}"

# Only migration holds cutover for a stable Process. Create, deploy, start and direct process.* keep their own checks.
- name: Check each moved running Process before cutover
  tags: [processes]
  when: phase == 'processes' and intent.migrate is defined
  ansible.builtin.include_tasks:
    file: instance-migrate-process-ready.yml
    apply: { tags: [processes] }

# The agent's side of a clone: the placeholder model key, the Claude Code and Codex settings, the note links, and the instance file,
# whose presence starts T3. Whole files are compared by digest; JSON settings merge only Orbit's keys, preserving runtime state.
# A rerun changes nothing; the key comes through the vault.
- name: Prepare the agent
  tags: [agent]
  when: phase == 'agent'
  vars:
    agent_files: >-
      {{ (container.clone.files | selectattr('content', 'defined') | list)
         + [container.clone.model_environment | combine({'content': lookup('ansible.builtin.env', 'ORBIT_MODEL_ENVIRONMENT')})] }}
  block:
    - name: Make the agent's configuration folders
      ansible.builtin.command: { argv: "{{ as_agent + ['mkdir', '-p', '-m', '0700', '/home/agent/.claude', '/home/agent/.t3/userdata'] }}" }
      changed_when: false
    # Git keeps the agent's own preferences; only its trust list is Orbit's. The workspace's .git belongs to orbit.
    - name: Read the agent's trusted Git directories
      ansible.builtin.command: { argv: "{{ as_agent + ['git', 'config', '--global', '--get-all', 'safe.directory'] }}" }
      register: agent_git_safe
      changed_when: false
      failed_when: agent_git_safe.rc not in [0, 1]
    - name: Trust only the workspace for the agent
      when: agent_git_safe.stdout_lines != [container.workspace]
      ansible.builtin.command:
        argv: "{{ as_agent + ['git', 'config', '--global', '--replace-all', 'safe.directory', container.workspace] }}"
      changed_when: true
    - name: Read the agent's Git identity
      ansible.builtin.command: { argv: "{{ as_agent + ['git', 'config', '--global', '--get', item.key] }}" }
      loop: [{key: user.name, value: Orbit Agent}, {key: user.email, value: agent@orbit.local}]
      register: agent_git_identity
      changed_when: false
      failed_when: agent_git_identity.rc not in [0, 1]
    - name: Set only the agent's missing Git identity values
      when: item.rc == 1
      ansible.builtin.command: { argv: "{{ as_agent + ['git', 'config', '--global', item.item.key, item.item.value] }}" }
      loop: "{{ agent_git_identity.results }}"
      loop_control: { label: "{{ item.item.key }}" }
      changed_when: true
    - name: Read the digests of the agent's files
      ansible.builtin.command: { argv: "{{ as_root + ['sha256sum', '--', item.path] }}" }
      loop: "{{ agent_files }}"
      loop_control: { label: "{{ item.path }}" }
      register: agent_digests
      changed_when: false
      failed_when: false
    - name: Write the changed files
      when: (item.stdout | default('')).split(' ') | first != item.item.content | hash('sha256')
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--uid', item.item.uid | string, '--gid', item.item.gid | string, '--mode', item.item.mode,
              '-', container.name ~ item.item.path] }}
        stdin: "{{ item.item.content }}"
        stdin_add_newline: false
      loop: "{{ agent_digests.results }}"
      loop_control: { label: "{{ item.item.path }}" }
      no_log: true
      changed_when: true
    - name: Read the agent's JSON settings
      ansible.builtin.command: { argv: "{{ as_root + ['cat', '--', item.path] }}" }
      loop: "{{ container.clone.files | selectattr('json', 'defined') | list }}"
      loop_control: { label: "{{ item.path }}" }
      register: agent_settings
      changed_when: false
      failed_when: agent_settings.rc != 0 and 'No such file or directory' not in agent_settings.stderr
      no_log: true
    - name: Merge Orbit's changed JSON settings
      vars:
        settings: "{{ item.stdout | from_json if item.rc == 0 else {} }}"
      when: item.rc != 0 or settings != (settings | combine(item.item.json))
      ansible.builtin.command:
        argv: >-
          {{ incus_project + ['file', 'push', '--uid', item.item.uid | string, '--gid', item.item.gid | string, '--mode', item.item.mode,
              '-', container.name ~ item.item.path] }}
        stdin: "{{ settings | combine(item.item.json) | to_json }}\n"
        stdin_add_newline: false
      loop: "{{ agent_settings.results }}"
      loop_control: { label: "{{ item.item.path }}" }
      no_log: true
      changed_when: true
    - name: Read the note links
      ansible.builtin.command: { argv: "{{ as_agent + ['readlink', '--', item.path] }}" }
      loop: "{{ container.clone.links }}"
      loop_control: { label: "{{ item.path }}" }
      register: agent_links
      changed_when: false
      failed_when: false
    - name: Link the agents' instructions to the note
      when: item.stdout | trim != item.item.target
      ansible.builtin.command: { argv: "{{ as_agent + ['ln', '-sfn', '--', item.item.target, item.item.path] }}" }
      loop: "{{ agent_links.results }}"
      loop_control: { label: "{{ item.item.path }}" }
      changed_when: true

# T3 starts for the first time and makes its own identity: the default never ran it, so no clone shares one. The workspace becomes
# its project once; the project's id stays in the agent's settings, so a rerun adds none.
- name: Start T3
  tags: [t3]
  when: phase == 't3'
  vars:
    t3_project_mark: "{{ container.clone.t3.project_mark }}"
  block:
    - name: Start the T3 unit
      ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'start', '--', container.clone.t3.unit] }}" }
      changed_when: false
    - name: Wait for T3
      ansible.builtin.command:
        argv: >-
          {{ as_agent + ['curl', '--fail', '--silent', '--max-time', '2',
          'http://127.0.0.1:' ~ container.clone.t3.internal_port ~ '/.well-known/t3/environment'] }}
      register: t3_ready
      until: t3_ready.rc == 0
      retries: "{{ container.clone.t3.ready_seconds }}"
      delay: 1
      changed_when: false
      failed_when: false
    - name: Require a ready T3
      ansible.builtin.assert:
        that: t3_ready.rc == 0
        fail_msg: instance.t3_unready
        quiet: true
    - name: Read the T3 project mark
      ansible.builtin.command: { argv: "{{ as_agent + ['cat', '--', t3_project_mark] }}" }
      register: t3_project
      changed_when: false
      failed_when: false
    - name: Add the workspace as T3 project
      when: t3_project.rc != 0
      block:
        - name: Add the project
          ansible.builtin.command:
            argv: >-
              {{ as_agent + [container.clone.t3.t3, 'project', 'add', container.workspace, '--title', container.clone.t3.title] }}
          register: t3_added
          changed_when: true
        - name: Keep the project's id
          ansible.builtin.command:
            argv: "{{ as_agent + ['sh', '-c', 'umask 077 && cat > \"$1\"', 'sh', t3_project_mark] }}"
            stdin: "{{ t3_added.stdout | trim }}"
          changed_when: true

# Registration (docs/reference/development-containers.md#t3-registration-and-pairing): `agent` issues the Gateway's and Swamp's sessions and asks T3 about
# each, inside the container. The reply goes into the run folder on the worker, 0600; the next step checks it and stores the sessions
# in the vault. No session enters a log, an argument or the run's outputs.
- name: Register the T3 server
  tags: [register]
  when: phase == 'register'
  vars:
    t3_url: "http://127.0.0.1:{{ container.clone.t3.internal_port }}"
  block:
    - name: Read the served environment
      ansible.builtin.command: { argv: "{{ as_agent + ['curl', '--fail', '--silent', '--max-time', '5', t3_url ~ '/.well-known/t3/environment'] }}" }
      register: t3_environment
      changed_when: false
    - name: Issue the sessions
      ansible.builtin.command:
        argv: "{{ as_agent + [container.clone.t3.t3, 'auth', 'session', 'issue', '--label', item, '--token-only'] }}"
      loop: [Orbit Gateway, Orbit Swamp]
      register: t3_sessions
      no_log: true
      changed_when: true
    - name: Ask T3 about each session
      ansible.builtin.command:
        # curl's own `\n` puts the status on a last line of its own.
        argv: >-
          {{ as_agent + ['curl', '--silent', '--max-time', '5', '--header', '@-', '--write-out', '\n%{http_code}', t3_url ~ '/api/auth/session'] }}
        stdin: "Authorization: Bearer {{ item.stdout | trim }}"
      loop: "{{ t3_sessions.results }}"
      register: t3_checks
      no_log: true
      changed_when: false
    - name: Write the reply into the run folder
      ansible.builtin.copy:
        content: >-
          {{ {'environment': t3_environment.stdout,
              'gateway': {'token': t3_sessions.results[0].stdout | trim, 'status': t3_checks.results[0].stdout.splitlines() | last | default('0') | int,
                          'body': t3_checks.results[0].stdout.splitlines()[:-1] | join},
              'swamp': {'token': t3_sessions.results[1].stdout | trim, 'status': t3_checks.results[1].stdout.splitlines() | last | default('0') | int,
                        'body': t3_checks.results[1].stdout.splitlines()[:-1] | join}} | to_json }}
        dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/t3.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      # The reply lives in the run folder on the worker: no change to the Node.
      changed_when: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

# The inner fleet of a nested-fleet default (docs/reference/development-containers.md#refresh-after-a-release). Only such an intent has
# `fleet`, and only its deployment runs these tags: `fleet_check` compares the fleet with its rules before the run changes anything,
# `fleet_start` starts the fleet without a Doctor wait, `fleet_refresh` migrates and restarts the nested Gateway, converges the nested
# Nodes and waits for readiness, each only when its inputs changed, and retakes their `base` with the fleet stopped only when the
# fleet's disks changed (tasks/instance-fleet-refresh.yml), and `fleet_resume` starts a refreshed or restored fleet
# and waits for readiness (tasks/instance-fleet-*.yml).
- name: Run the phase of the nested fleet
  tags: [fleet_check, fleet_start, fleet_refresh, fleet_resume]
  when: phase in ['fleet_check', 'fleet_start', 'fleet_refresh', 'fleet_resume']
  ansible.builtin.include_tasks:
    file: "tasks/instance-fleet-{{ phase | replace('fleet_', '') }}.yml"
    apply: {tags: [always]}

# A failed deployment of a nested-fleet default puts the container back on its newest seed: the one the run took first, of the
# default as it was, fleet included, or a newer one. It never goes back past the fleet. The container stays stopped: the
# workflow's next step is `start`, the one start of a container.
- name: Restore the newest seed
  tags: [fleet_restore]
  when: phase == 'fleet_restore'
  block:
    - name: Read the seed snapshots
      ansible.builtin.command:
        argv: [incus, query, "--", "/1.0/instances/{{ container.name }}/snapshots?project={{ container.project }}&recursion=1"]
      register: restore_snapshots
      changed_when: false
    - name: Name the newest seed
      ansible.builtin.set_fact:
        restore_seed: >-
          {{ (restore_snapshots.stdout | from_json | selectattr('name', 'match', '^seed-') | sort(attribute='created_at')
              | map(attribute='name') | list | last) | default('') }}
    - name: Require a seed
      ansible.builtin.assert:
        that: restore_seed != ''
        fail_msg: instance.fleet_seed_missing
        quiet: true
    # The seed of an Instance with an inner volume is a pair: the volume goes back to its snapshot of the same name, or nothing does.
    - name: Read the inner volume's snapshots
      when: container.inner_volume is defined
      ansible.builtin.command:
        argv:
          - incus
          - query
          - "--"
          - "/1.0/storage-pools/{{ container.inner_volume.pool }}/volumes/custom/{{ container.inner_volume.name }}/snapshots?project={{ container.project }}&recursion=1"
      register: restore_volume_snapshots
      changed_when: false
    - name: Require the inner volume's half of the seed
      when: container.inner_volume is defined
      ansible.builtin.assert:
        that: restore_seed in (restore_volume_snapshots.stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | list)
        fail_msg: instance.fleet_seed_missing
        quiet: true
    - name: Read the container's state
      ansible.builtin.command: { argv: [incus, query, "--", "/1.0/instances/{{ container.name }}?project={{ container.project }}"] }
      register: restore_read
      changed_when: false
    - name: Stop the container
      when: (restore_read.stdout | from_json).status == 'Running'
      ansible.builtin.command: { argv: "{{ incus_project + ['stop', '--timeout', '30', container.name] }}" }
      changed_when: true
    - name: Restore the container to the newest seed
      ansible.builtin.command: { argv: "{{ incus_project + ['snapshot', 'restore', container.name, restore_seed] }}" }
      changed_when: true
    - name: Restore the inner volume to the same seed
      when: container.inner_volume is defined
      ansible.builtin.command:
        argv: "{{ incus_project + ['storage', 'volume', 'snapshot', 'restore', container.inner_volume.pool, container.inner_volume.name, restore_seed] }}"
      changed_when: true

# Orbit delivers the Swamp Club key of a nested fleet at each start into the tmpfs `/run`, so no seed holds it. The key file that was
# placed by hand on the disk before that delivery refuses the seed before the seed changes anything. Only the path is tested.
- name: Refuse a nested-fleet seed while the Club key is on the disk
  tags: [seed]
  when: phase == 'seed' and intent.fleet is defined
  block:
    - name: Name the nested fleet's paths
      ansible.builtin.include_tasks:
        file: tasks/instance-fleet.yml
        apply: {tags: [seed]}
    - name: Look for the hand-placed Club key file
      ansible.builtin.command: { argv: "{{ as_root + ['test', '-e', fleet_old_club_key] }}" }
      register: seed_key_file
      changed_when: false
      failed_when: false
    - name: Refuse a seed that would hold the Club key
      ansible.builtin.assert:
        that: seed_key_file.rc != 0
        fail_msg: instance.fleet_key_on_disk
        quiet: true

# An explicit default deploy prepares its seed, not every running container.
# The app-user conversion is atomic and never restarts a Process itself.
- name: Prepare Node for the default seed without starting or stopping Processes
  tags: [seed]
  when: phase == 'seed' and intent.migrate is not defined
  ansible.builtin.include_tasks:
    file: tasks/instance-node-runtime.yml
    apply: {tags: [seed]}
  vars:
    node_fetch: false

# A clone copies the seed snapshot, so it is taken with the Processes stopped: no file is half written in it. Every passed deployment
# retakes it, also at the same commit: the default's files (caches, built assets) move on between deployments, and a clone must start
# from what the default has now.
- name: Take the seed snapshot
  tags: [seed]
  when: phase == 'seed'
  block:
    - name: Read the checked-out commit
      ansible.builtin.command: { argv: "{{ in_workspace + ['rev-parse', '--verify', 'HEAD^{commit}'] }}" }
      register: seed_head
      changed_when: false
    - name: Read the snapshots
      ansible.builtin.command:
        argv: [incus, query, "--", "/1.0/instances/{{ container.name }}/snapshots?project={{ container.project }}&recursion=1"]
      register: seed_snapshots
      changed_when: false
    # The seed of an Instance with an inner volume is a pair: the container snapshot and the volume snapshot of the same name
    # (docs/reference/development-containers.md#the-inner-volume). Every other Instance, Instance 2454 among them, reads no volume.
    - name: Read the inner volume's snapshots
      when: container.inner_volume is defined
      ansible.builtin.command:
        argv:
          - incus
          - query
          - "--"
          - "/1.0/storage-pools/{{ container.inner_volume.pool }}/volumes/custom/{{ container.inner_volume.name }}/snapshots?project={{ container.project }}&recursion=1"
      register: seed_volume_snapshots
      changed_when: false
    - name: Name the seed
      ansible.builtin.set_fact:
        container_commit: "{{ seed_head.stdout | trim }}"
        seed_name: "seed-{{ seed_head.stdout | trim }}"
        seed_names: "{{ seed_snapshots.stdout | from_json | map(attribute='name') | select('match', '^seed-') | list }}"
        # Incus may name a volume snapshot `<volume>/<snapshot>`; the seed name is the last part.
        seed_volume_names: >-
          {{ (seed_volume_snapshots.stdout | from_json | map(attribute='name') | map('regex_replace', '^.*/', '') | select('match', '^seed-') | list)
             if container.inner_volume is defined else [] }}
    # Every passed deployment retakes the seed, also at the same commit: the default's caches and built files move on, and a clone must
    # copy them as they are now. A nested-fleet default's deployment (its intent has `fleet` too) seeds before its refresh, so a
    # failure restores a seed with the fleet, and after it, so the seed holds the refreshed fleet and its record.
    - name: Snapshot the container with the Processes stopped
      when: >-
        seed_name not in seed_names
        or (container.inner_volume is defined and seed_name not in seed_volume_names)
        or intent.deployment is defined
        or (node_runtime_result | default({})).get('seed_refresh_required', false)
      block:
        - name: Stop the Processes
          when: units | length > 0
          ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'stop', '--'] + units }}" }
          changed_when: true
        - name: Snapshot the container
          ansible.builtin.command:
            argv: >-
              {{ incus_project + ['snapshot', 'create', container.name, seed_name]
                 + (['--reuse'] if seed_name in seed_names else []) }}
          changed_when: true
        # The other half of the pair, at once, with the Processes still stopped. A failure deletes both halves of this name, so no
        # reader ever finds a container seed without its volume seed: a clone then refuses with instance.default_seed_moved, and an
        # older pair, which the run deletes only after both halves exist, stays for a restore.
        - name: Snapshot the inner volume with the seed's name
          when: container.inner_volume is defined
          block:
            - name: Snapshot the inner volume
              ansible.builtin.command:
                argv: >-
                  {{ incus_project + ['storage', 'volume', 'snapshot', 'create', container.inner_volume.pool, container.inner_volume.name,
                                      seed_name] + (['--reuse'] if seed_name in seed_volume_names else []) }}
              changed_when: true
          rescue:
            - name: Delete the container half of the seed
              ansible.builtin.command: { argv: "{{ incus_project + ['snapshot', 'delete', container.name, seed_name] }}" }
              changed_when: true
              failed_when: false
            - name: Delete the volume half of the seed
              ansible.builtin.command:
                argv: "{{ incus_project + ['storage', 'volume', 'snapshot', 'delete', container.inner_volume.pool, container.inner_volume.name, seed_name] }}"
              changed_when: true
              failed_when: false
            - name: Fail the seed
              ansible.builtin.fail:
                msg: instance.seed_volume_snapshot_failed
      always:
        - name: Start the Processes again
          when: units | length > 0
          ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'start', '--'] + units }}" }
          changed_when: false
    - name: Clear the captured Node-store refresh marker as the app user
      when: intent.migrate is not defined and (node_runtime_result | default({})).get('seed_refresh_required', false)
      ansible.builtin.command:
        argv: >-
          {{ as_orbit + ['python3', '-c', lookup('ansible.builtin.file', playbook_dir ~ '/instance_node_runtime.py'),
              'seed-complete', container | to_json] }}
      changed_when: true
    # A clone made from an older seed does not need it: on ZFS, Incus keeps a deleted snapshot's blocks while a clone uses them. A
    # clone admitted for an older seed and not copied yet refuses with instance.default_seed_moved, and its next create takes the new one.
    - name: Delete the older seeds
      ansible.builtin.command: { argv: "{{ incus_project + ['snapshot', 'delete', container.name, item] }}" }
      loop: "{{ seed_names | reject('equalto', seed_name) | list }}"
      changed_when: true
    - name: Delete the older seeds of the inner volume
      when: container.inner_volume is defined
      ansible.builtin.command:
        argv: "{{ incus_project + ['storage', 'volume', 'snapshot', 'delete', container.inner_volume.pool, container.inner_volume.name, item] }}"
      loop: "{{ seed_volume_names | reject('equalto', seed_name) | list }}"
      changed_when: true

- name: Check the container
  tags: [check]
  when: phase == 'check'
  block:
    - name: Read the branch and the commit
      ansible.builtin.command: { argv: "{{ in_workspace + item }}" }
      loop:
        - [symbolic-ref, --quiet, --short, HEAD]
        - [rev-parse, --verify, "HEAD^{commit}"]
        - [rev-parse, --verify, "{{ (container.commit if container.commit is not none else 'refs/remotes/origin/' ~ container.branch) ~ '^{commit}' }}"]
      register: check_git
      changed_when: false
    - name: Read the Processes
      ansible.builtin.command: { argv: "{{ as_root + ['systemctl', 'is-active', '--'] + units if units | length > 0 else ['true'] }}" }
      register: check_units
      changed_when: false
      failed_when: false
    - name: Require the commit on the branch
      ansible.builtin.assert:
        that:
          - check_git.results[0].stdout | trim == container.branch
          - check_git.results[1].stdout | trim == check_git.results[2].stdout | trim
        fail_msg: deployment.branch_changed
        quiet: true
    - name: Require running Processes
      ansible.builtin.assert:
        that: check_units.rc == 0
        fail_msg: deployment.processes_inactive
        quiet: true
    - name: Keep the commit
      ansible.builtin.set_fact:
        container_commit: "{{ check_git.results[1].stdout | trim }}"

- name: Report the commit
  tags: [always]
  when: container_commit is defined
  ansible.builtin.debug:
    msg: "orbit-commit={{ container_commit }}"

# Reuse the current playbook/connection: the launch already admitted the Instance's target set.
- name: Apply mail before preparing the new workspace
  tags: [container, clone]
  when: phase in ['container', 'clone'] and container.mail | default(none) is not none
  block:
    - name: Attempt the shared mail setup
      ansible.builtin.include_tasks:
        file: tasks/instance-mail.yml
        apply: {tags: [container, clone]}
  rescue:
    - name: Keep mail failure advisory for creation
      ansible.builtin.set_fact:
        mail_result:
          status: failed
          reason: >-
            {{ ansible_failed_result.msg if ansible_failed_result.msg | default('') in
               ['instance.host_unavailable', 'process.target_inactive'] else 'instance.mail_update_failed' }}
    - name: Report the advisory mail outcome
      ansible.builtin.debug:
        msg: "orbit-mail=failed:{{ mail_result.reason }}"

# Attached databases must be reachable before any workspace commands or application Process starts.
- name: Prepare attached Node services before application work
  tags: [container, clone, node-service]
  when: phase == 'node-service' or (phase in ['container', 'clone'] and container.node_services | default([]) | length > 0)
  block:
    - name: Apply and probe attached Node services
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_node_services.py') }}"
          - "{{ container | to_json }}"
          - >-
            {{ {'node_services': lookup('ansible.builtin.file', playbook_dir ~ '/instance_node_services.py'),
                'bridge': lookup('ansible.builtin.file', playbook_dir ~ '/instance_bridge.py')} | to_json }}
      register: node_services_apply
      failed_when: false
      changed_when: node_services_apply.rc == 0 and (node_services_apply.stdout | from_json).status == 'applied'

    - name: Retain the public target failure evidence
      when: node_services_apply.rc != 0 and node_services_apply.stdout | length > 0
      vars:
        target_failure: "{{ node_services_apply.stdout | from_json }}"
      ansible.builtin.set_fact:
        migrate_process_failure: "{{ target_failure }}"
        migrate_refusal_code: "{{ target_failure.error_code }}"
        migrate_refusal_message: "{{ 'Attached Node service failed: ' ~ (target_failure.node_service_target | default({}) | to_json) }}"

    - name: Report only public target identity on failure
      when: node_services_apply.rc != 0 and migrate_process_failure is defined
      ansible.builtin.debug:
        msg: "{{ migrate_process_failure }}"

    - name: Require attached Node service access
      ansible.builtin.assert:
        that: node_services_apply.rc == 0
        fail_msg: >-
          {{ node_services_apply.stderr if node_services_apply.stderr in
             ['process.target_inactive', 'instance.host_unavailable', 'instance.node_service_port_in_use',
              'instance.node_service_unit_conflict', 'instance.node_service_unreachable', 'instance.bridge_busy']
             else 'instance.node_service_apply_failed' }}
        quiet: true

    - name: Retain the public Node service result
      ansible.builtin.set_fact:
        node_services_result: "{{ node_services_apply.stdout | from_json }}"
