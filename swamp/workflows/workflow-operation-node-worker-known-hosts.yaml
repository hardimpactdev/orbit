id: 2b9f1d87-8208-4c3a-b656-96606bdad3da
name: operation-node-worker-known-hosts
inputs:
  type: object
  properties:
    operation_id:
      type: integer
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum: [node.worker_known_hosts]
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        control_node_id:
          type: integer
          minimum: 1
        known_hosts_content:
          type: string
        digest:
          type: string
      required: [control_node_id, known_hosts_content, digest]
      additionalProperties: false
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
  - name: known_hosts
    labels: {role: swamp}
    steps:
      - name: Write known hosts
        labels: {role: swamp}
        writes: true
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: worker-known-hosts-writer
          methodName: execute
          inputs:
            # OpenSSH reads the passwd home (/home/<user>), not the worker unit's HOME; systemd sets USER.
            run: printf '%s' "$ORBIT_KNOWN_HOSTS_CONTENT" | install -D -m 0600 /dev/stdin "/home/$USER/.ssh/known_hosts"
            env:
              ORBIT_KNOWN_HOSTS_CONTENT: '${{ inputs.intent.known_hosts_content }}'
