id: 50dfa101-dcab-4fc4-aaac-e47dd1b47f0b
name: operation-node-bootstrap-probe
description: Read-only bootstrap using official SSH methods and native terminal projection.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - node.bootstrap_probe
    intent:
      type: object
      properties:
        bootstrap:
          type: object
      required:
      - bootstrap
      additionalProperties: false
    execution_secrets:
      type: object
      properties:
        bootstrap_identity:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^bootstrap-identity-node-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - bootstrap_identity
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: bootstrap
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: inspect-platform
    labels: &id001
      node: ${{ string(inputs.node_id) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "bootstrap-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id002
        name: ${{ "bootstrap-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.bootstrap.target.user }}
          port: ${{ inputs.intent.bootstrap.target.port }}
          identityContent: ${{ vault.get(inputs.execution_secrets.bootstrap_identity.vault, inputs.execution_secrets.bootstrap_identity.key)
            }}
        hosts:
        - name: target
          address: ${{ inputs.intent.bootstrap.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.bootstrap.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - uname
        - -sm
  - name: inspect-host-key
    labels: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "bootstrap-ssh-" + string(inputs.operation_id) }}
      methodName: collect-host-public-key
      globalArgs: *id002
      inputs:
        hosts: name:target
    dependsOn:
    - step: inspect-platform
      condition:
        type: succeeded
  - name: probe-host
    labels: *id001
    dependsOn:
    - step: inspect-host-key
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/node-bootstrap-probe-result'
      behaviorName: ${{ "bootstrap-result-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        bootstrap: ${{ inputs.intent.bootstrap }}
        observation: ${{ steps["inspect-platform"].outputs }}
        host_key: ${{ steps["inspect-host-key"].outputs }}
