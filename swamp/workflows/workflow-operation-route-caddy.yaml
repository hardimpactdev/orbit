id: a7839446-4acb-4e72-b82f-d188f108a1fc
name: operation-route-caddy
description: Official file application, validation and reload with complete public intent.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        caddy_publication:
          type: object
          properties:
            node_id:
              type: integer
              minimum: 1
            user:
              type: string
            caddy:
              type: object
            control_node_id:
              type: integer
              const: 209
            connection:
              type: object
              properties:
                nodeHost:
                  type: string
                nodeUser:
                  type: string
                nodeIdentityFile:
                  type: string
                become:
                  type: boolean
                  const: true
                nodePort:
                  type: integer
                  minimum: 1
                  maximum: 65535
              required:
              - nodeHost
              - nodeUser
              - nodeIdentityFile
              - become
              - nodePort
              additionalProperties: false
            host_keys:
              type: array
              items:
                type: string
              minItems: 1
          required:
          - node_id
          - user
          - caddy
          - control_node_id
          - connection
          - host_keys
          additionalProperties: false
      required:
      - caddy_publication
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: publication
  target: orbit-node-209
  labels:
    node: '209'
  steps:
  - name: input
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/caddy-public-input'
      behaviorName: ${{ "input-" + run.id }}
      methodName: prepare
      inputs:
        publication: ${{ inputs.intent.caddy_publication }}
  - name: apply-config
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-apply-config-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-ssh-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.caddy_publication.connection.nodeUser }}
          identityFile: ${{ inputs.intent.caddy_publication.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.caddy_publication.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.caddy_publication.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.caddy_publication.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /bin/sh
        - -c
        - |-
          set -eu
          /usr/bin/install -m 0640 -o root -g caddy /dev/null "$1"
          /usr/bin/cat > "$1"
        - route-file
        - /etc/caddy/Caddyfile
        stdin: ${{ steps.input.outputs.caddy.content }}
        sudo: true
    dependsOn:
    - step: input
      condition:
        type: succeeded
  - name: validate
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-validate-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - /bin/sh
        - -c
        - sudo -u caddy /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    dependsOn:
    - step: apply-config
      condition:
        type: succeeded
  - name: reload
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-ssh-reload-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - /bin/sh
        - -c
        - sudo /usr/bin/systemctl reload caddy
    dependsOn:
    - step: validate
      condition:
        type: succeeded
- name: completion
  target: orbit-node-209
  labels:
    node: '209'
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '{"ready":true,"result":"published","version":"%s"}\n' "$ORBIT_CADDY_VERSION"
        env:
          ORBIT_CADDY_VERSION: ${{ inputs.intent.caddy_publication.caddy.version }}
