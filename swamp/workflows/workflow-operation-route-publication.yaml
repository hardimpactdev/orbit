id: 2cd61bc8-5189-4365-b79d-41c614fac8a1
name: operation-route-publication
description: Execute immutable admitted Route intent using canonical native children
  on209.
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - route.private_dns_publish
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: publication
  steps:
  - name: read-records
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-root-read-records-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-dns-root-" + run.id }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - sudo
        - /usr/bin/cat
        - /etc/dnsmasq.d/orbit-records.conf
  - name: read-catalog
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-dns-root-read-catalog-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - sudo
        - /usr/bin/cat
        - /var/lib/orbit/private-dns/catalog.json
    dependsOn:
    - step: read-records
      condition:
        type: succeeded
  - name: publish
    target: orbit-node-209
    dependsOn:
    - step: read-records
      condition:
        type: succeeded
    - step: read-catalog
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: ${{ inputs.execution_secrets }}
        intent:
          node_id: ${{ inputs.intent.node_id }}
          connection: ${{ inputs.intent.connection }}
          host_keys: ${{ inputs.intent.host_keys }}
          before: &id002
            records: ${{ steps["read-records"].outputs.stdout }}
            catalog: ${{ steps["read-catalog"].outputs.stdout }}
          after: ${{ inputs.intent.after }}
          alternatives:
          - *id002
          - ${{ inputs.intent.after }}
  - name: restore
    target: orbit-node-209
    dependsOn:
    - step: read-records
      condition:
        type: succeeded
    - step: read-catalog
      condition:
        type: succeeded
    - step: publish
      condition:
        type: always
    task:
      type: workflow
      workflowIdOrName: route-dns-publish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: ${{ inputs.execution_secrets }}
        intent:
          node_id: ${{ inputs.intent.node_id }}
          connection: ${{ inputs.intent.connection }}
          host_keys: ${{ inputs.intent.host_keys }}
          before: ${{ inputs.intent.after }}
          after: *id002
          alternatives:
          - *id002
          - ${{ inputs.intent.after }}
    guard: ${{ steps.publish.status != "failed" }}
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: publish
      condition:
        type: always
    - step: restore
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-dns-root-result-" + run.id }}
      methodName: execute
      inputs:
        run: "if [ \"$READY\" = true ]; then\n  printf '{\"ready\":true,\"outcome\"\
          :\"published\",\"data\":{\"ready\":true,\"digest\":\"%s\"}}\\n' \"$DIGEST\"\
          \nelse\n  printf '{\"ready\":false,\"error_code\":\"private_dns.publication_failed\"\
          ,\"restored\":%s}\\n' \"$RESTORED\"\nfi\n"
        env:
          READY: ${{ string("publish" in steps && steps.publish.status == "succeeded")
            }}
          RESTORED: ${{ string("restore" in steps && steps.restore.status == "succeeded")
            }}
          DIGEST: ${{ inputs.intent.after.digest }}
vaults: []
