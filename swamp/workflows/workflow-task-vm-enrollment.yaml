id: 46c86e06-0241-416c-987b-c195e0522990
name: task-vm-enrollment
description: Bootstrap and enroll one admitted provider guest using complete public SSH inputs.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.provision
      - tasks.provision
    intent:
      type: object
      properties:
        provider:
          type: string
          enum:
          - incus
          - upcloud
      required:
      - provider
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|pi-models|provider-bootstrap)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token|agent-secret-node-[1-9][0-9]*)$
        required:
        - vault
        - key
        additionalProperties: false
    guest:
      type: object
    provider:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  - guest
  - provider
  additionalProperties: false
jobs:
- name: enrollment
  labels:
    role: swamp
  steps:
  - name: Pin the guest host key
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "vm-known-hosts" }}
      methodName: execute
      inputs:
        run: 'set -eu

          install -d -m 0700 "$HOME/.ssh"

          ssh-keygen -R "$ORBIT_ADDRESS" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1 || true

          printf ''%s\n'' "$ORBIT_LINES" >> "$HOME/.ssh/known_hosts"

          '
        env:
          ORBIT_ADDRESS: ${{ inputs.guest.ssh_execution.target.host }}
          ORBIT_LINES: ${{ inputs.guest.ssh_execution.target.host_keys.map(key, inputs.guest.ssh_execution.target.host + " " + key).join("\n") }}
    dependsOn: []
  - name: provider-plan
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment-input'
      behaviorName: ${{ "vm-enrollment-plan" }}
      methodName: plan
      inputs:
        provider: ${{ inputs.intent.provider }}
    dependsOn: []
  - name: bootstrap
    labels:
      role: swamp
    task:
      type: workflow
      workflowIdOrName: task-vm-bootstrap
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        guest: ${{ inputs.guest }}
        name: ${{ inputs.intent.name }}
    dependsOn:
    - step: provider-plan
      condition:
        type: succeeded
  - name: observer-identity-find
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/test","-e","/etc/orbit/agent/secret"] : ["/usr/bin/test","-e","/etc/orbit/agent/secret"] }}'
        okExitCodes:
        - 0
        - 1
    dependsOn:
    - step: bootstrap
      condition:
        type: succeeded
  - name: observer-identity-folder
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/install","-d","-m","0700","-o","root","-g","root","/etc/orbit/agent"] : ["/usr/bin/install","-d","-m","0700","-o","root","-g","root","/etc/orbit/agent"] }}'
    dependsOn:
    - step: observer-identity-find
      condition:
        type: succeeded
    guard: ${{ steps["observer-identity-find"].outputs.exitCode == 0 }}
  - name: observer-identity-create
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        stdin: ${{ vault.get(inputs.execution_secrets.agent_secret.vault, inputs.execution_secrets.agent_secret.key) }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/install","-D","-m","0600","-o","root","-g","root","/dev/stdin","/etc/orbit/agent/secret"] : ["/usr/bin/install","-D","-m","0600","-o","root","-g","root","/dev/stdin","/etc/orbit/agent/secret"] }}'
    dependsOn:
    - step: observer-identity-folder
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: observer-identity-trim
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/truncate","-s","64","/etc/orbit/agent/secret"] : ["/usr/bin/truncate","-s","64","/etc/orbit/agent/secret"] }}'
    dependsOn:
    - step: observer-identity-create
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: observer-identity-mode
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/chmod","0600","/etc/orbit/agent/secret"] : ["/usr/bin/chmod","0600","/etc/orbit/agent/secret"] }}'
    dependsOn:
    - step: observer-identity-trim
      condition:
        type: succeeded
  - name: observer-identity
    labels: &id001
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.user }}'
          port: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.port }}'
          identityFile: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).identity_file }}'
        hosts:
        - name: target
          address: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host }}'
          transport:
            hostKeys: '${{ (inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: ${{ inputs.intent.provider != "incus" }}
        argv: '${{ inputs.intent.provider == "incus" ? ["/usr/bin/sudo","-n","--","/usr/bin/incus","--project",inputs.intent.vm.project,"exec","--mode=non-interactive","--user","0","--group","0","--",inputs.intent.name] + ["/usr/bin/sha256sum","/etc/orbit/agent/secret"] : ["/usr/bin/sha256sum","/etc/orbit/agent/secret"] }}'
    dependsOn:
    - step: observer-identity-mode
      condition:
        type: succeeded
  - name: observer-identity-proven
    labels: *id001
    dependsOn:
    - step: observer-identity
      condition:
        type: succeeded
    task:
      type: assert
      severity: high
      message: agent.secret_mismatch
      expr: inputs.intent.observer_digest == null || steps["observer-identity"].outputs.stdout.startsWith(inputs.intent.observer_digest + "  ")
  - name: observer-configuration
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
      methodName: exec
      globalArgs:
        name: '${{ ("vm-first-" + string((inputs.intent.provider == "incus" ? inputs.intent.host_ssh_execution : inputs.guest.public_ssh_execution).target.host)).split(".").join("-") }}'
