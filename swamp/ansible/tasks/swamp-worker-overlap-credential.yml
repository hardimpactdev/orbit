---
- name: Read credential lifecycle metadata through official Swamp
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '30', renewal_swamp_binary] +
      (['worker', 'token', 'list'] if renewal_credential_kind == 'enrollment' else ['access', 'token', 'list']) + renewal_remote }}
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  register: renewal_token_list
  changed_when: false
  no_log: true
- name: Select the role-owned credential metadata
  ansible.builtin.set_fact:
    renewal_token_name: "{{ renewal_overlap_name ~ ('' if renewal_credential_kind == 'enrollment' else '-access') }}"
- name: Select credential expiry without reading its file
  ansible.builtin.set_fact:
    renewal_token_record: >-
      {{ renewal_token_list.stdout | from_json | selectattr('name', 'equalto', renewal_token_name) | first | default({}) }}
- name: Check the credential file metadata only
  ansible.builtin.stat:
    path: "{{ renewal_credentials_dir }}/{{ renewal_credential_kind }}.token"
    get_checksum: false
    get_mime: false
  register: renewal_token_file
- name: Decide whether the credential can cover a complete renewal round
  ansible.builtin.set_fact:
    renewal_token_stale: >-
      {{ renewal_token_record.effectiveState | default('') not in ['unused', 'enrolled', 'active'] or
      (renewal_token_record.expiresAt | regex_replace('Z$', '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).timestamp()
      - (ansible_date_time.epoch | int) <= renewal_round_seconds }}
- name: Repair or rotate credentials only while c is stopped
  when: renewal_token_stale or not renewal_token_file.stat.exists
  block:
    - name: Check the overlap unit is stopped before changing credentials
      ansible.builtin.command:
        argv: [timeout, '10', systemctl, show, orbit-swamp-worker@c.service, '--property=ActiveState', --value]
      register: renewal_credential_unit
      changed_when: false
    - name: Refuse credential changes under a running overlap worker
      ansible.builtin.assert:
        that: renewal_credential_unit.stdout | trim in ['inactive', 'failed']
        fail_msg: Cannot rotate or repair credentials while c is running; no credential changed
    - name: Revoke a credential that cannot cover the next round
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '60', renewal_swamp_binary] +
          (['worker', 'token', 'revoke'] if renewal_credential_kind == 'enrollment' else ['access', 'token', 'revoke']) +
          [renewal_token_name] + renewal_remote }}
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      when: renewal_token_stale and renewal_token_record.effectiveState | default('') in ['unused', 'enrolled', 'active']
      changed_when: true
      no_log: true
    - name: Mint the missing or expired credential through official Swamp
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '60', renewal_swamp_binary] +
          (['worker', 'token', 'create', renewal_token_name] if renewal_credential_kind == 'enrollment'
          else ['access', 'token', 'mint', renewal_token_name, '--principal', 'worker:c']) +
          ['--duration', '30d'] + renewal_remote }}
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      when: renewal_token_stale
      changed_when: true
      no_log: true
    # The official default vault retains a mint even if the following file write
    # is interrupted. A retry recovers that secret instead of minting twice.
    - name: Retrieve this credential privately from the official token vault
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '60', renewal_swamp_binary, 'vault', 'read-secret', '_token-secrets',
          ('worker-token-' if renewal_credential_kind == 'enrollment' else 'server-token-') ~ renewal_token_name] + renewal_remote }}
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_token_secret
      changed_when: false
      no_log: true
    - name: Save this credential before attempting the next one
      ansible.builtin.copy:
        dest: "{{ renewal_credentials_dir }}/{{ renewal_credential_kind }}.token"
        content: >-
          {{ (renewal_token_name ~ '.' if renewal_credential_kind == 'enrollment' else '') ~
          (renewal_token_secret.stdout | from_json).value }}
        owner: "{{ renewal_credential_owner }}"
        group: "{{ renewal_credential_group }}"
        mode: '0640'
      no_log: true
