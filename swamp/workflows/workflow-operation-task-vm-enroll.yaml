id: 89dc7dce-dbf3-4a01-9abe-81e6e40d949d
name: operation-task-vm-enroll
description: One native TaskVM enroll root; first visit precedes its exact trusted
  guest worker.
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.enroll
    _hub_command:
      type: object
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - _hub_command
  additionalProperties: true
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: &id001
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: intent
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: admit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
- name: bootstrap
  dependsOn:
  - job: admission
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes.execution_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes.execution_node_id)
      }}
  steps:
  - name: bootstrap
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        stage: bootstrap
- name: project-bootstrap
  dependsOn:
  - job: bootstrap
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: project-bootstrap
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        projection: bootstrap
- name: prepare-network
  dependsOn:
  - job: project-bootstrap
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes.execution_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes.execution_node_id)
      }}
  steps:
  - name: prepare-network
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: step
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        stage: prepare-network
- name: project-network
  dependsOn:
  - job: prepare-network
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: project-network
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment'
      behaviorName: ${{ "task-vm-enrollment-" + run.id }}
      methodName: project
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
        projection: network
- name: publish-hub
  dependsOn:
  - job: project-network
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes._wireguard.executor_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes._wireguard.executor_node_id)
      }}
  steps:
  - name: publish-hub_assets
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-assets-" + string(inputs._hub_command.hub_id)
        }}
      methodName: read
      inputs:
        intent: ${{ inputs._hub_command }}
        mode: publish
        prepared_peer: '${{ {"node_id": inputs._hub_command.context_node_id, "public_key":
          data.latest("task-vm-enrollment-" + run.id, "prepare-network-" + run.id).attributes.result.wireguard_public_key}
          }}'
  - name: publish-hub_command
    writes: true
    dependsOn:
    - step: publish-hub_assets
      condition:
        type: succeeded
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "wireguard-hub-" + string(inputs._hub_command.hub_id) }}
      methodName: script
      inputs:
        hosts: name:hub
        interpreter: python3
        sudo: true
        script: ${{ steps["publish-hub_assets"].outputs.script_body }}
      globalArgs:
        name: ${{ "wireguard-hub-" + string(inputs._hub_command.hub_id) }}
        transport: ${{ model["wireguard-hub-" + string(inputs._hub_command.hub_id)].input.globalArguments.transport
          }}
        hosts: ${{ model["wireguard-hub-" + string(inputs._hub_command.hub_id)].input.globalArguments.hosts
          }}
  - name: publish-hub
    target: orbit-node-209
    labels:
      node: '209'
    dependsOn:
    - step: publish-hub_command
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/node-hub-command'
      behaviorName: ${{ "wireguard-hub-result-" + string(inputs._hub_command.hub_id)
        }}
      methodName: result
      inputs:
        hub_id: ${{ inputs._hub_command.hub_id }}
        stdout: ${{ steps["publish-hub_command"].outputs.stdout }}
  - name: hub-published
    dependsOn:
    - step: publish-hub
      condition:
        type: succeeded
    task:
      type: assert
      expr: steps["publish-hub"].outputs.status == "succeeded"
      message: TaskVM WireGuard Hub publication failed
      severity: high
- name: publish-network
  dependsOn:
  - job: publish-hub
    condition:
      type: succeeded
  target: ${{ "orbit-node-" + string(data.latest("task-vm-enrollment-" + run.id, "placement-"
    + run.id).attributes.execution_node_id) }}
  labels:
    node: ${{ string(data.latest("task-vm-enrollment-" + run.id, "placement-" + run.id).attributes.execution_node_id)
      }}
  steps:
  - name: publish-network
    writes: true
    task:
