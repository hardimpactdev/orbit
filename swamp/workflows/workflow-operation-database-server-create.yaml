id: f497279b-80cd-4dc8-82bb-1a6622d977e4
name: operation-database-server-create
description: Database server create from 209 in the chart's phases, one shipped script phase per official SSH step.
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: database_server.create}
    intent: {type: object}
    # Names only: admin (the server's own password key) and, for Valkey, acl (the ACL file).
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^database-server-(create-intent-)?[1-9][0-9]*(-admin)?$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: server
  labels: {role: swamp}
  steps:
  - name: 'Read the scripts'
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-node-command'
      behaviorName: database-server-create-assets
      methodName: server_create
      inputs:
        intent:
          driver: '${{ inputs.intent.driver }}'
          process_id: '${{ inputs.intent.process_id }}'
          container: '${{ inputs.intent.container }}'
          container_input: '${{ inputs.intent.container_input }}'
          spec: '${{ inputs.intent.spec }}'
          scrub_spec: '${{ inputs.intent.scrub_spec }}'
          initialize: '${{ inputs.intent.initialize }}'
          password_variable: '${{ inputs.intent.password_variable }}'
          volume: '${{ inputs.intent.volume }}'
  - name: 'Pull the image'
    labels: {role: swamp}
    dependsOn: [{step: 'Read the scripts', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh
        name: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '600', python3, -I, -c, '${{ steps["Read the scripts"].outputs.create }}', '${{ steps["Read the scripts"].outputs.intent_json }}', pull]
        okExitCodes: [0, 1]
        timeoutSec: 610
    # Valkey starts only from its ACL file; the file holds password hashes and comes on stdin.
  - name: 'Write the ACL file'
    labels: {role: swamp}
    dependsOn: [{step: 'Pull the image', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.driver != "redis" || steps["Pull the image"].outputs.exitCode != 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '120', python3, -I, -c, '${{ steps["Read the scripts"].outputs.create }}', '${{ steps["Read the scripts"].outputs.intent_json }}', acl]
        stdin: ${{ vault.get(inputs.execution_secrets.acl.vault, inputs.execution_secrets.acl.key) }}
        okExitCodes: [0, 1]
        timeoutSec: 130
  - name: 'Start the container'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Pull the image', condition: {type: succeeded}}
    - {step: 'Write the ACL file', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
    guard: '${{ steps["Pull the image"].outputs.exitCode != 0 || ("Write the ACL file" in steps && steps["Write the ACL file"].status == "succeeded" && steps["Write the ACL file"].outputs.exitCode != 0) }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '120', python3, -I, -c, '${{ steps["Read the scripts"].outputs.create }}', '${{ steps["Read the scripts"].outputs.intent_json }}', start]
        stdin: ${{ vault.get(inputs.execution_secrets.admin.vault, inputs.execution_secrets.admin.key) }}
        okExitCodes: [0, 1]
        timeoutSec: 130
    # Docker owns the probe; the step reads its health events, bounded by the step timeout.
  - name: 'Wait until healthy'
    labels: {role: swamp}
    dependsOn: [{step: 'Start the container', condition: {type: succeeded}}]
    guard: ${{ steps["Start the container"].outputs.exitCode != 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '420', python3, -I, -c, '${{ steps["Read the scripts"].outputs.create }}', '${{ steps["Read the scripts"].outputs.intent_json }}', healthy]
        okExitCodes: [0, 1]
        timeoutSec: 430
  - name: 'Check the admin login'
    labels: {role: swamp}
    dependsOn: [{step: 'Wait until healthy', condition: {type: succeeded}}]
    guard: ${{ steps["Wait until healthy"].outputs.exitCode != 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', python3, -I, -c, '${{ steps["Read the scripts"].outputs.create }}', '${{ steps["Read the scripts"].outputs.intent_json }}', login]
        stdin: ${{ vault.get(inputs.execution_secrets.admin.vault, inputs.execution_secrets.admin.key) }}
        okExitCodes: [0, 1]
        timeoutSec: 70
    # The data volume keeps the password; the recreated container no longer carries it.
  - name: 'Remove the first-start env'
    labels: {role: swamp}
    dependsOn: [{step: 'Check the admin login', condition: {type: succeeded}}]
    guard: ${{ inputs.intent.driver == "redis" || steps["Check the admin login"].outputs.exitCode != 0 }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "database-server-create-ssh-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '540', python3, -I, -c, '${{ steps["Read the scripts"].outputs.create }}', '${{ steps["Read the scripts"].outputs.intent_json }}', scrub]
        stdin: ${{ vault.get(inputs.execution_secrets.admin.vault, inputs.execution_secrets.admin.key) }}
        okExitCodes: [0, 1]
        timeoutSec: 550
  - name: 'Report the result'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Read the scripts', condition: {type: always}}
    - {step: 'Pull the image', condition: {type: always}}
    - {step: 'Write the ACL file', condition: {type: always}}
    - {step: 'Start the container', condition: {type: always}}
    - {step: 'Wait until healthy', condition: {type: always}}
    - {step: 'Check the admin login', condition: {type: always}}
    - {step: 'Remove the first-start env', condition: {type: always}}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: database-server-create-result
      methodName: execute
      inputs:
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          # A phase that ran and failed names the failed step; its script's error_code wins over the fallback.
          phases = [('READ', 'Read the scripts', 'database.server_create_failed'), ('PULL', 'Pull the image', 'database.server_image_pull_failed'),
                    ('ACL', 'Write the ACL file', 'database.valkey_acl_failed'), ('START', 'Start the container', 'database.server_start_failed'),
                    ('HEALTHY', 'Wait until healthy', 'database.server_unhealthy'), ('LOGIN', 'Check the admin login', 'database.server_login_failed'),
                    ('SCRUB', 'Remove the first-start env', 'database.server_scrub_failed')]
          result = {'backend': 'active'}
          for name, label, fallback in phases:
              status, exit_code, stdout = (os.environ[name + suffix] for suffix in ('_STATUS', '_EXIT', '_STDOUT'))
              if status == 'failed' or (status == 'succeeded' and exit_code not in ('', '0')):
                  try:
                      value = json.loads(stdout) if stdout else {}
                  except ValueError:
                      value = {}
                  code = value.get('error_code') if isinstance(value, dict) and isinstance(value.get('error_code'), str) else fallback
                  result = {'failed_step': label, 'error_code': code}
                  break
          if 'error_code' not in result and os.environ['LOGIN_STATUS'] != 'succeeded':
              result = {'failed_step': None, 'error_code': 'database.server_create_failed'}
          print(json.dumps(result))
          sys.exit(0 if 'error_code' not in result else 1)
          PY
        env:
          READ_STATUS: '${{ "Read the scripts" in steps ? steps["Read the scripts"].status : "skipped" }}'
          READ_EXIT: ''
          READ_STDOUT: ''
          PULL_STATUS: '${{ "Pull the image" in steps ? steps["Pull the image"].status : "skipped" }}'
          PULL_EXIT: '${{ "Pull the image" in steps && steps["Pull the image"].status == "succeeded" ? string(steps["Pull the image"].outputs.exitCode) : "" }}'
          PULL_STDOUT: '${{ "Pull the image" in steps && steps["Pull the image"].status == "succeeded" ? steps["Pull the image"].outputs.stdout : "" }}'
          ACL_STATUS: '${{ "Write the ACL file" in steps ? steps["Write the ACL file"].status : "skipped" }}'
          ACL_EXIT: '${{ "Write the ACL file" in steps && steps["Write the ACL file"].status == "succeeded" ? string(steps["Write the ACL file"].outputs.exitCode) : "" }}'
          ACL_STDOUT: '${{ "Write the ACL file" in steps && steps["Write the ACL file"].status == "succeeded" ? steps["Write the ACL file"].outputs.stdout : "" }}'
          START_STATUS: '${{ "Start the container" in steps ? steps["Start the container"].status : "skipped" }}'
          START_EXIT: '${{ "Start the container" in steps && steps["Start the container"].status == "succeeded" ? string(steps["Start the container"].outputs.exitCode) : "" }}'
          START_STDOUT: '${{ "Start the container" in steps && steps["Start the container"].status == "succeeded" ? steps["Start the container"].outputs.stdout : "" }}'
          HEALTHY_STATUS: '${{ "Wait until healthy" in steps ? steps["Wait until healthy"].status : "skipped" }}'
          HEALTHY_EXIT: '${{ "Wait until healthy" in steps && steps["Wait until healthy"].status == "succeeded" ? string(steps["Wait until healthy"].outputs.exitCode) : "" }}'
          HEALTHY_STDOUT: '${{ "Wait until healthy" in steps && steps["Wait until healthy"].status == "succeeded" ? steps["Wait until healthy"].outputs.stdout : "" }}'
          LOGIN_STATUS: '${{ "Check the admin login" in steps ? steps["Check the admin login"].status : "skipped" }}'
          LOGIN_EXIT: '${{ "Check the admin login" in steps && steps["Check the admin login"].status == "succeeded" ? string(steps["Check the admin login"].outputs.exitCode) : "" }}'
          LOGIN_STDOUT: '${{ "Check the admin login" in steps && steps["Check the admin login"].status == "succeeded" ? steps["Check the admin login"].outputs.stdout : "" }}'
          SCRUB_STATUS: '${{ "Remove the first-start env" in steps ? steps["Remove the first-start env"].status : "skipped" }}'
          SCRUB_EXIT: '${{ "Remove the first-start env" in steps && steps["Remove the first-start env"].status == "succeeded" ? string(steps["Remove the first-start env"].outputs.exitCode) : "" }}'
          SCRUB_STDOUT: '${{ "Remove the first-start env" in steps && steps["Remove the first-start env"].status == "succeeded" ? steps["Remove the first-start env"].outputs.stdout : "" }}'
        ignoreExitCode: true
  - name: 'Fail on an error'
    labels: {role: swamp}
    dependsOn: [{step: 'Report the result', condition: {type: succeeded}}]
    task: {type: assert, expr: 'steps["Report the result"].outputs.exitCode == 0', severity: high, message: The Database server create did not complete.}
