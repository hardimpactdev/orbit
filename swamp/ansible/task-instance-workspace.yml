---
# One internal child phase on the recorded Node. The caller owns guest snapshot lifetime.
- name: Address the recorded workspace Node
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: task_workspace_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run the task Instance workspace phase
  hosts: task_workspace_node
  gather_facts: false
  become: true
  tags: [always]
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    workspace_phase: "{{ ansible_run_tags | first }}"
    workspace_result_path: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
  tasks:
    - name: Run one workspace phase
      block:
        - name: Run the workspace tasks
          ansible.builtin.import_tasks: tasks/task-instance-workspace-phase.yml
      rescue:
        - name: Record the public workspace refusal
          ansible.builtin.copy:
            content: >-
              {{ {'error_code': ansible_failed_result.msg
                  if ansible_failed_result.msg | default('') is match('^tasks\.[a-z_]+$')
                  else 'tasks.workspace_phase_failed'} | to_json }}
            dest: "{{ workspace_result_path }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Fail the workspace phase
          ansible.builtin.fail:
            msg: tasks.workspace_phase_failed
