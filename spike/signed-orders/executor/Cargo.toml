[package]
name = "orbit-spike-executor"
version = "0.0.0"
edition = "2021"
publish = false

# SPIKE(signed-orders): a throwaway executor. Its own workspace so it never joins apps/agent's lockfile.
[workspace]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
