---
- name: Read the accepting pool before retiring overlap capacity
  ansible.builtin.command:
    argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  register: renewal_retire_pool
  changed_when: false
  no_log: true
- name: Retire overlap only if it is connected
  when: >-
    (renewal_retire_pool.stdout | from_json).workers
    | selectattr('name', 'equalto', renewal_names.c)
    | rejectattr('status', 'equalto', 'disconnected') | list | length > 0 and
    (not renewal_retire_if_ready | default(false) or
    ((renewal_retire_pool.stdout | from_json).workers
    | selectattr('name', 'in', [renewal_names.a, renewal_names.b])
    | selectattr('status', 'in', renewal_accepting) | list | length == 2))
  block:
    - name: Require both base workers accepting before retiring c
      ansible.builtin.assert:
        that:
          - >-
            (renewal_retire_pool.stdout | from_json).workers
            | selectattr('name', 'in', [renewal_names.a, renewal_names.b])
            | selectattr('status', 'in', renewal_accepting) | list | length == 2
        fail_msg: Cannot retire c while a base worker is unavailable; overlap capacity stays running
    - name: Probe base workers that have spare slots before draining c
      ansible.builtin.include_tasks: swamp-worker-renew-verify.yml
      loop: [a, b]
      loop_control: {loop_var: renewal_verify_slot}
      vars:
        renewal_retire_candidate: >-
          {{ (renewal_retire_pool.stdout | from_json).workers
          | selectattr('name', 'equalto', renewal_names[renewal_verify_slot]) | first }}
      when: renewal_retire_candidate.activeDispatchIds | length < renewal_retire_candidate.capacity | int
    - name: Check the effective overlap drain allowance
      ansible.builtin.command:
        argv:
          - timeout
          - '10'
          - busctl
          - get-property
          - org.freedesktop.systemd1
          - /org/freedesktop/systemd1/unit/orbit_2dswamp_2dworker_40c_2eservice
          - org.freedesktop.systemd1.Service
          - TimeoutStopUSec
      register: renewal_retire_stop
      changed_when: false
    - name: Require the overlap unit to allow 75 minutes to drain
      ansible.builtin.assert:
        that:
          - renewal_retire_stop.stdout.split() | length == 2
          - renewal_retire_stop.stdout.split()[0] == 't'
          - renewal_retire_stop.stdout.split()[1] | int >= 4500000000
        fail_msg: Overlap worker must have the converged drain allowance before retirement
    - name: Read fresh admission state after both probes
      ansible.builtin.command:
        argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_retire_fresh
      changed_when: false
      no_log: true
    - name: Select fresh base capacity
      ansible.builtin.set_fact:
        renewal_retire_bases: >-
          {{ (renewal_retire_fresh.stdout | from_json).workers
          | selectattr('name', 'in', [renewal_names.a, renewal_names.b]) | list }}
    - name: Require the same two base instances still accepting
      ansible.builtin.assert:
        that:
          - >-
            (renewal_retire_fresh.stdout | from_json).workers
            | selectattr('name', 'in', [renewal_names.a, renewal_names.b])
            | selectattr('status', 'in', renewal_accepting)
            | selectattr('instanceUuid', 'in',
              (renewal_retire_pool.stdout | from_json).workers | map(attribute='instanceUuid') | list)
            | list | length == 2
          - >-
            (renewal_retire_bases | map(attribute='capacity') | sum) -
            (renewal_retire_bases | map(attribute='activeDispatchIds') | map('length') | sum) > 0
        fail_msg: Base capacity changed or filled after probing; c stays running and no further drain starts
    - name: Log the overlap drain and monitoring limit
      ansible.builtin.debug:
        msg: Retiring c with a and b accepting; peer failure during blocking drain is detected after stop returns
    - name: Drain and retire the temporary worker
      ansible.builtin.systemd_service:
        name: orbit-swamp-worker@c.service
        state: stopped
        enabled: false
    - name: Read the pool after the blocking overlap drain
      ansible.builtin.command:
        argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
      become: true
      become_user: "{{ orbit_user }}"
      environment: "{{ renewal_environment }}"
      register: renewal_after_retire
      changed_when: false
      no_log: true
    - name: Require both base workers still accepting after overlap retirement
      ansible.builtin.assert:
        that:
          - >-
            (renewal_after_retire.stdout | from_json).workers
            | selectattr('name', 'in', [renewal_names.a, renewal_names.b])
            | selectattr('status', 'in', renewal_accepting) | list | length == 2
        fail_msg: Peer failed during blocking overlap drain; detected after stop, no further drain
    - name: End a recovery-only round after retiring retained overlap
      ansible.builtin.set_fact:
        renewal_completed: true
      when: renewal_retire_if_ready | default(false)
