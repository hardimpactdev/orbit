          \    with response:\n        status = response.status\n        content =\
          \ response.read(1048577) if path.endswith(\"api-keys\") and method == \"\
          GET\" else b\"\"\n    if len(content) > 1048576:\n        raise ValueError()\n\
          \    return status, content\n\n\ntry:\n    status, _ = request(\"/v1/models\"\
