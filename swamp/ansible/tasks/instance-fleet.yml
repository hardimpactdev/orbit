---
# The commands and rules of the nested fleet in an Instance container (docs/reference/development-containers.md#the-fleet-step). Each
# phase file imports this first: instance-fleet-rules.yml, instance-fleet-start.yml, instance-fleet-refresh.yml and
# instance-fleet-reset.yml. They run on the Node, as root, and reach the inner Incus with `incus exec` into the Instance container.
#
# The input, and the one place that defines it:
#   intent.container.project, .name       The Incus project and name of the Instance container (as for instance-container.yml).
#   intent.container.workspace            The workspace in the container: the source of the `checkout` device.
#   intent.fleet.guests                   {gateway, app-dev, app-prod}: the nested containers by role (TaskVmNestedFleet::Guests).
#   intent.fleet.layout.<role>.address    The address of each nested container on the inner bridge (TaskVmNestedFleet::Layout).
#   intent.fleet.operator                 {address, hub, network}: the container as operator, the nested Gateway as hub, the
#                                         fleet's network (TaskVmNestedFleet::operator()).
#   intent.fleet.checkout.path            Where the nested Gateway and app-dev see the workspace (TaskVmNestedFleet::CheckoutPath).
#   intent.fleet.proxy                    The egress proxy environment, name to value: HTTP_PROXY, HTTPS_PROXY, http_proxy,
#                                         https_proxy, NO_PROXY and no_proxy. The fleet's own names and networks are in NO_PROXY.
# A caller may set `fleet_ready_seconds` (default 300): the bound of the readiness wait.
#
# The paths below are facts of the image variant `orbit-instance-nested`, not of the intent. The Swamp Club key is a file that
# Orbit delivers into the container's /run; these tasks name its folder as the source of the `club-key` device and test that it is there.
# They never read, print or copy it.
- name: Name the fleet commands
  vars:
    fleet_outer_exec: [incus, --project, "{{ intent.container.project }}", exec, "{{ intent.container.name }}", --]
  ansible.builtin.set_fact:
    # A command in the Instance container, and the inner Incus there.
    fleet_outer: "{{ fleet_outer_exec }}"
    fleet_incus: "{{ fleet_outer_exec + ['incus'] }}"
    fleet_roles: [gateway, app-dev, app-prod]
    fleet_names: "{{ [intent.fleet.guests.gateway, intent.fleet.guests['app-dev'], intent.fleet.guests['app-prod']] }}"
    # The proof's own API calls, from the container over `wg-nested`, as the operator. The container's environment sends every
    # address but the egress proxy's through that proxy, which cannot reach the tunnel: the calls never use a proxy. `-S` keeps
    # curl's error, so a failed call says why.
    fleet_api: "https://{{ intent.fleet.operator.hub }}/api/v1"
    fleet_curl: "{{ fleet_outer_exec + ['curl', '-sSk', '--noproxy', '*', '-m', '80', '-H', 'Host: gateway.orbit', '-H', 'Accept: application/json'] }}"
    # A command as the app user of a nested container: `runuser` gives `orbit` its groups, among them `work`, which the checkout
    # needs; `incus exec --user` gives only the user ID, with group 0.
    fleet_as_app_user: [runuser, -u, orbit, --]
    # Orbit delivers the Club key at each start into this tmpfs folder (docs/reference/development-containers.md#the-club-key-of-the-nested-gateway);
    # the `club-key` device shows the folder to the nested Gateway, and its api-key file is a link into it.
    fleet_club_folder: /run/orbit-club
    fleet_club_key: /run/orbit-club/swamp-club-api-key
    fleet_club_mount: /home/orbit/.config/swamp/club
    fleet_club_link: /home/orbit/.config/swamp/api-key
    fleet_club_target: club/swamp-club-api-key
    # The key file that was placed by hand before the delivery; it lay on the container's disk, so a seed refuses while it is there.
    fleet_old_club_key: /etc/orbit/swamp-club-api-key
    fleet_operator_key: /etc/wireguard/wg-nested.key
    # The refresh record (instance-fleet-refresh.yml): the digests of the parts the last passed refresh did, on the container's own
    # disk, so a seed holds the record of the fleet it holds. Absent while a refresh runs. Root-owned, in a root-owned folder.
    fleet_record: /var/lib/orbit/fleet-refresh.json
    fleet_tunnel: wg-nested
    fleet_tunnel_port: "51821"
    fleet_hub_port: "51820"
    fleet_ready_delay: 5
    # The bound of a wait for what a nested container sets up at boot (the hub key, the state mounts), polled every `fleet_ready_delay`.
    fleet_boot_seconds: 60
    # The services of the nested Gateway that run the checkout, and the Swamp units that need the Club key.
    fleet_gateway_services: [orbit-gateway-horizon.service, orbit-gateway-schedule.service, orbit-agent-view.service]
    fleet_swamp_services: [orbit-swamp-serve.service, orbit-swamp-worker@a.service, orbit-swamp-worker@b.service]
    fleet_state_mounts: [home-orbit-orbit-apps-gateway-.env.mount, home-orbit-orbit-apps-gateway-storage.mount,
                         home-orbit-orbit-apps-gateway-bootstrap-cache.mount]
    # The nested Gateway's Swamp state on its own disk: run records, vault files and the grants (TaskVmNestedFleet::GatewayState).
    fleet_swamp_state_mounts: [home-orbit-orbit-swamp-.swamp.mount, home-orbit-orbit-swamp-vaults.mount, home-orbit-orbit-swamp-grants.mount]

# The fleet rules by role: devices with the keys they must have, configuration keys, and files with their whole content (the proxy
# drop-ins of the nested Gateway's Swamp units, and the egress proxy of apt and of sudo and SSH sessions). They are the shape of the fleet that runs (docs/reference/development-containers.md#fleet-rules). A restore of `base`
# reverts devices and keys, so the refresh applies the rules with the fleet stopped before it takes `base`.
#
# Each rule is one of two kinds. Orbit owns a rule when it may write it on an existing fleet: the refresh writes an owned rule that
# differs, and the start lets it pass. A build rule (`fleet_build_rules`) is written only where the key is absent; a fleet that holds
# another value is refused with `instance.container_fleet_drift` before any change, and the start refuses a fleet that lacks it.
- name: Name the fleet rules
  vars:
    fleet_checkout_device:
      checkout: {type: disk, source: "{{ intent.container.workspace }}", path: "{{ intent.fleet.checkout.path }}", shift: "false"}
    # Docker in a nested Node skips its AppArmor profile when the kernel reads AppArmor as off.
    fleet_apparmor_device:
      apparmor-off: {type: disk, source: /etc/orbit/apparmor-off, path: /sys/module/apparmor/parameters/enabled, readonly: "true"}
    # The workspace is `agent:work` (2750:2760) with files of `orbit` (1000), facts of the image. The nested Gateway and app-dev keep
    # all three IDs, so nested root resolves every checkout inode and the state mounts come up. An ID shift fails two levels below the
    # host. Changing a map remaps a container's disk, so it is a build rule.
    fleet_idmap: {raw.idmap: "both 1000 1000\nuid 2750 2750\ngid 2760 2760"}
    # The inner Incus starts the fleet when the Instance container boots; the start also starts any nested container that is stopped.
    fleet_autostart: {boot.autostart: "true"}
    fleet_environment: "{{ dict(intent.fleet.proxy.keys() | map('regex_replace', '^', 'environment.') | zip(intent.fleet.proxy.values())) }}"
    # The Swamp units of the nested Gateway reach Swamp Club through the proxy: one Environment line, every proxy setting quoted.
    fleet_unit_environment: |
      [Service]
      Environment={{ intent.fleet.proxy | dict2items | map(attribute='key') | zip(intent.fleet.proxy.values()) | map('join', '=') | map('regex_replace', '^(.*)$', '"\1"') | join(' ') }}
    fleet_unit_files: >-
      {%- set out = [] -%}
      {%- for unit in ['orbit-swamp-serve.service', 'orbit-swamp-worker@.service'] -%}
      {%-   set _ = out.append({'path': '/etc/systemd/system/' ~ unit ~ '.d/50-inner-fleet-proxy.conf', 'content': fleet_unit_environment}) -%}
      {%- endfor -%}
      {{ out }}
    # A nested Node's base converge runs apt and downloads the agent over SSH, where the `environment.*` keys do not reach: apt reads
    # its proxy from its own file, and sudo and SSH sessions read /etc/environment. Both name the egress proxy; /etc/environment has
    # the same NO_PROXY, so the fleet's names and networks stay off the proxy. The apt file replaces the task VM package cache that
    # the image names, which no Instance runs (a role add through the nested Gateway writes it back; the next refresh replaces it).
    fleet_egress_files:
      - path: /etc/apt/apt.conf.d/90orbit-package-cache
        content: |
          Acquire::http::Proxy "{{ intent.fleet.proxy.HTTP_PROXY }}";
          Acquire::https::Proxy "{{ intent.fleet.proxy.HTTPS_PROXY }}";
      - path: /etc/environment
        content: |
          PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
          {% for key, value in intent.fleet.proxy.items() %}
          {{ key }}="{{ value }}"
          {% endfor %}
  ansible.builtin.set_fact:
    fleet_rules:
      gateway:
        devices: >-
          {{ fleet_checkout_device | combine({'club-key': {'type': 'disk', 'source': fleet_club_folder,
             'path': fleet_club_mount, 'required': 'false', 'shift': 'false'}}) }}
        config: "{{ fleet_idmap | combine(fleet_autostart, fleet_environment) }}"
        files: "{{ fleet_unit_files + fleet_egress_files }}"
      app-dev:
        devices: "{{ fleet_checkout_device | combine(fleet_apparmor_device) }}"
        config: "{{ fleet_idmap | combine(fleet_autostart, fleet_environment) }}"
        files: "{{ fleet_egress_files }}"
      app-prod:
        devices: "{{ fleet_apparmor_device }}"
        config: "{{ fleet_autostart | combine(fleet_environment) }}"
        files: "{{ fleet_egress_files }}"
    fleet_build_rules: [raw.idmap]
- name: List the fleet files
  ansible.builtin.set_fact:
    # Each file rule with its nested container: the rules read, write and check files by this list.
    fleet_files: >-
      {%- set out = [] -%}
      {%- for role in fleet_roles -%}
      {%-   for file in fleet_rules[role].files -%}
      {%-     set _ = out.append({'container': intent.fleet.guests[role], 'path': file.path, 'content': file.content}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}
