      - name: complete
        target: orbit-node-209
        dependsOn:
          - step: remove-local-archive
            condition:
              type: always
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-source-command'
          behaviorName: '${{ "itr-" + run.id + "-38" }}'
          methodName: complete
          inputs:
            cutover: >-
              ${{ ("forward" in steps) && steps["forward"].status == "succeeded"
              && steps.forward.outputs.result.ready }}
            outcomes: '${{ steps }}'
