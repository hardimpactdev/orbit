id: b6db2e34-cc2c-43f0-a68e-14ae79a54e32
name: operation-fleet-recipe-pr
description: One native recipe PR DAG on 209; the Gateway mints the scoped token at run start, each chart action is one step, and the token is revoked at the end.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      const: 209
    kind:
      type: string
      enum:
      - fleet.recipe_pr
    intent:
      type: object
    execution_secrets:
      type: object
      properties:
        github_token:
          type: object
          properties:
            vault:
              type: string
              enum:
              - orbit-control-inputs
            key:
              type: string
              pattern: ^fleet-recipe-pr-[1-9][0-9]*$
          required:
          - vault
          - key
          additionalProperties: false
      required:
      - github_token
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
jobs:
- name: github
  steps:
  - name: Prepare the candidate
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: recipe-pr-prepare
      methodName: prepare
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        env:
          GITHUB_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
  - name: Open the PR
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: recipe-pr-open
      methodName: open
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        plan: ${{ steps["Prepare the candidate"].outputs }}
        env:
          GITHUB_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
    dependsOn:
    - step: Prepare the candidate
      condition:
        type: succeeded
    guard: ${{ steps["Prepare the candidate"].outputs.action != "open" }}
  - name: Refresh the PR
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: recipe-pr-update
      methodName: update
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        plan: ${{ steps["Prepare the candidate"].outputs }}
        env:
          GITHUB_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
    dependsOn:
    - step: Prepare the candidate
      condition:
        type: succeeded
    guard: ${{ steps["Prepare the candidate"].outputs.action != "update" }}
  - name: Merge on green
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: recipe-pr-merge
      methodName: merge
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        plan: ${{ steps["Prepare the candidate"].outputs }}
        env:
          GITHUB_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
    dependsOn:
    - step: Prepare the candidate
      condition:
        type: succeeded
    guard: ${{ steps["Prepare the candidate"].outputs.action != "merge" }}
  - name: Close the PR
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: recipe-pr-retire
      methodName: retire
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        plan: ${{ steps["Prepare the candidate"].outputs }}
        env:
          GITHUB_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
    dependsOn:
    - step: Prepare the candidate
      condition:
        type: succeeded
    guard: ${{ steps["Prepare the candidate"].outputs.action != "close" }}
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/fleet-recipe-pr'
      behaviorName: recipe-pr-result
      methodName: result
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        plan: ${{ steps["Prepare the candidate"].outputs }}
        url: '${{ steps["Prepare the candidate"].outputs.action == "open" ? steps["Open the PR"].outputs.url : "" }}'
    dependsOn:
    - step: Open the PR
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Refresh the PR
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Merge on green
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
    - step: Close the PR
      condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}
- name: cleanup
  labels: {role: swamp}
  dependsOn:
  - job: github
    condition:
      type: completed
  steps:
  - name: Revoke the token
    labels: {role: swamp}
    allowFailure: true
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: recipe-pr-revoke
      methodName: execute
      inputs:
        run: timeout 30 gh api --method DELETE installation/token 2>/dev/null
        env:
          GH_TOKEN: ${{ vault.get(inputs.execution_secrets.github_token.vault, inputs.execution_secrets.github_token.key) }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-recipe-pr-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
