id: f96f99a0-c17d-40f0-b568-107653307880
name: task-vm-sweep-cloud-cleanup
description: Native forEach cleanup of the selected immutable orphan inventory.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    scope:
      type: object
      properties:
        live_names:
          type: array
          items: &id001
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,253}$
          maxItems: 4096
        max_task_vm_id:
          type: integer
          minimum: 0
        project: *id001
        pool: *id001
        operator_owned:
          type: array
          items:
            type: string
          maxItems: 4096
        max_build_id:
          type: integer
          minimum: 0
        recorded_build_ids: &id002
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 4096
        retired_build_ids: *id002
        protected_build_ids: *id002
      required:
      - live_names
      - max_task_vm_id
      additionalProperties: false
    resources:
      type: array
      items:
        type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - scope
  - resources
  - execution_secrets
  additionalProperties: false
jobs:
- name: cleanup
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: ${{ "swp-assets-"+run.id }}
      methodName: assets
      inputs:
        scope: ${{ inputs.scope }}
  - name: api
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-lifecycle-input'
      behaviorName: ${{ "swp-api-"+run.id }}
      methodName: api_assets
      inputs: {}
  - name: remove
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "swp-remove-"+run.id + "-"+string(self._index) }}
      methodName: execute
      inputs:
        run: 'exec python3 -B "$SCRIPT"

          '
        env:
          SCRIPT: ${{ steps.assets.outputs.cloud_remove }}
          PYTHONPATH: ${{ steps.api.outputs.directory }}
          ORBIT_SWEEP_ITEM: ${{ self.resource.input_json }}
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    - step: api
      condition:
        type: succeeded
    forEach:
      item: resource
      in: ${{ inputs.resources }}
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "swp-result-"+run.id }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' ''{"cleaned":true}''

          '
    dependsOn:
    - step: remove
      condition:
        type: succeeded
