id: ae3bff71-8b73-4cad-8ef4-e8f206492c43
name: route-certificate-publish
description: 'One affected Node: staged assets, public CSR batch, root-bound signing and per-leaf proof through
  one official SSH connection.'
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    parent_run_id:
      type: string
    restoring:
      type: boolean
    intent:
      type: object
      properties:
        control_node_id:
          type: integer
          const: 209
        connection:
          type: object
        host_keys:
          type: array
          items:
            type: string
          minItems: 1
        node_id:
          type: integer
          minimum: 1
        leaves:
          type: array
          items:
            type: object
          minItems: 1
          maxItems: 256
      required:
      - node_id
      - leaves
      - control_node_id
      - connection
      - host_keys
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - parent_run_id
  - restoring
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-certificate-assets'
      behaviorName: ${{ "route-cert-assets-" + run.id }}
      methodName: read
      inputs:
        node_id: ${{ inputs.intent.node_id }}
        leaves: ${{ inputs.intent.leaves }}
  - name: prepare-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: exec
      globalArgs: &id001
        name: ${{ "route-ssh-" + inputs.parent_run_id + "-" + string(inputs.intent.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
          port: ${{ inputs.intent.connection.nodePort }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
          transport:
            hostKeys: ${{ inputs.intent.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/mkdir
        - -p
        - -m
        - '0700'
        - ${{ "/tmp/orbit-route-" + run.id }}
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: copy-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-route-" + run.id + "/" }}
        direction: to
        recursive: true
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
  - name: request
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/node_batch.py" }}
        - request
        - ${{ "/tmp/orbit-route-" + run.id + "/requests.json" }}
        stdin: ${{ steps.assets.outputs.input_json }}
        sudo: true
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
  - name: request-info
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-certificate-assets'
      behaviorName: ${{ "route-cert-request-info-" + run.id }}
      methodName: requests
      inputs:
        leaves: ${{ inputs.intent.leaves }}
        stdout: ${{ steps.request.outputs.stdout }}
    dependsOn:
    - step: request
      condition:
        type: succeeded
  - name: copy-requests
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-route-" + run.id + "/requests.json" }}
        dst: ${{ "/tmp/orbit-route-" + run.id + "-requests.json" }}
        direction: from
    dependsOn:
    - step: request-info
      condition:
        type: succeeded
  - name: sign
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-sign-" + run.id }}
      methodName: execute
      inputs:
        run: /usr/bin/python3 -B "$ORBIT_CERTIFICATE_SIGN_SCRIPT"
        env:
          ORBIT_CERTIFICATE_SIGN_SCRIPT: ${{ steps.assets.outputs.scripts_directory + "/sign.py" }}
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ inputs.parent_run_id }}
          ORBIT_CERTIFICATE_MODE: node
          ORBIT_CERTIFICATE_REQUESTS_FILE: ${{ "/tmp/orbit-route-" + run.id + "-requests.json" }}
          ORBIT_CERTIFICATE_RESTORING: ${{ string(inputs.restoring) }}
    dependsOn:
    - step: copy-requests
      condition:
        type: succeeded
  - name: signature
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-certificate-assets'
      behaviorName: ${{ "route-cert-signature-" + run.id }}
      methodName: signed
      inputs:
        leaves: ${{ inputs.intent.leaves }}
        requests: ${{ steps["request-info"].outputs.requests }}
        stdout: ${{ steps.sign.outputs.stdout }}
    dependsOn:
    - step: sign
      condition:
        type: succeeded
  - name: publish
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/node_batch.py" }}
        - publish
        stdin: ${{ steps.signature.outputs.publish_json }}
        sudo: true
    dependsOn:
    - step: signature
      condition:
        type: succeeded
  - name: trust
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/node_batch.py" }}
        - trust
        stdin: ${{ steps.assets.outputs.input_json }}
        sudo: true
    dependsOn:
    - step: publish
      condition:
        type: succeeded
  - name: inspect
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-route-" + run.id + "/scripts/node_batch.py" }}
        - inspect
        stdin: ${{ steps.assets.outputs.input_json }}
        sudo: true
    dependsOn:
    - step: trust
      condition:
        type: succeeded
  - name: cleanup-assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "route-node-ssh-" + run.id }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -rf
        - ${{ "/tmp/orbit-route-" + run.id }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
  - name: cleanup-requests
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "route-cert-cleanup-requests-" + run.id }}
      methodName: execute
      inputs:
        run: /usr/bin/rm -f -- "$ORBIT_CERTIFICATE_REQUESTS_FILE"
        env:
          ORBIT_CERTIFICATE_REQUESTS_FILE: ${{ "/tmp/orbit-route-" + run.id + "-requests.json" }}
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-certificate-assets'
      behaviorName: ${{ "route-cert-result-" + run.id }}
      methodName: result
      inputs:
        leaves: ${{ inputs.intent.leaves }}
        stdout: ${{ steps.inspect.outputs.stdout }}
    dependsOn:
    - step: cleanup-assets
      condition:
        type: succeeded
    - step: cleanup-requests
      condition:
        type: succeeded
