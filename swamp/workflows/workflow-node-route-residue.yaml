id: be12633a-eac0-4b15-a1ad-c004ef2fe50b
name: node-route-residue
description: Remove the Caddy sites, PHP pools, certificates, LAN and ingress rules that removed Routes left on a Node, best effort.
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    intent: {type: object}
  required: [operation_id, node_id, kind, intent]
  additionalProperties: false
jobs:
- name: residue
  labels: {role: swamp}
  steps:
    # Each cleanup is best effort and runs after the one before it; the end assert reports any that failed.
  - name: 'Remove Caddy sites'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    guard: '${{ inputs.intent.residue.caddy == null }}'
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          caddy_publication:
            control_node_id: '${{ inputs.intent.ssh.control_node_id }}'
            connection: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
              nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
            host_keys: '${{ inputs.intent.ssh.target.host_keys }}'
            node_id: '${{ inputs.node_id }}'
            user: '${{ inputs.intent.user }}'
            caddy: '${{ inputs.intent.residue.caddy == null ? {} : inputs.intent.residue.caddy }}'
        execution_secrets: {}
    # The Gateway renders each version's whole pool file; an empty one goes away.
  - name: 'Write the PHP pools'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Remove Caddy sites', condition: {type: always}}]
    forEach: {item: pool, in: '${{ inputs.intent.residue.pools }}'}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("node-residue-pool-" + string(inputs.node_id) + "-" + self.pool.version).split(".").join("-") }}
      methodName: apply
      globalArgs: {path: '${{ self.pool.path }}', ensure: '${{ self.pool.content == "" ? "absent" : "present" }}', content: '${{ self.pool.content }}',
        owner: root, group: root, mode: '0644', nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
        nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
      inputs: {}
  - name: 'Test the PHP pools'
    labels: {role: swamp}
    allowFailure: true
    dependsOn: [{step: 'Write the PHP pools', condition: {type: always}}]
    forEach: {item: version, in: '${{ inputs.intent.residue.pools.filter(p, p.content != "").map(p, p.version) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("node-residue-test-" + string(inputs.node_id) + "-" + self.version).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("node-residue-test-" + string(inputs.node_id) + "-" + self.version).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "30", "/usr/sbin/php-fpm" + self.version, "-t"] }}'
        timeoutSec: 40
  - name: 'Reload the PHP pools'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Test the PHP pools', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
    forEach: {item: version, in: '${{ inputs.intent.residue.pools.map(p, p.version) }}'}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("node-residue-reload-" + string(inputs.node_id) + "-" + self.version).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("node-residue-reload-" + string(inputs.node_id) + "-" + self.version).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "60", "/usr/bin/systemctl", "try-reload-or-restart", "php" + self.version + "-fpm.service"] }}'
        timeoutSec: 70
  - name: 'Remove certificates'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Reload the PHP pools', condition: {type: always}}]
    forEach: {item: scope, in: '${{ inputs.intent.residue.certificates }}'}
    task:
      type: workflow
      workflowIdOrName: route-certificate-remove
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          control_node_id: '${{ inputs.intent.ssh.control_node_id }}'
          connection: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
            nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
          host_keys: '${{ inputs.intent.ssh.target.host_keys }}'
          leaf: {node_id: '${{ inputs.node_id }}', agent_sha256: '${{ inputs.intent.agent_sha256 }}', scope: '${{ self.scope }}', home: '${{ inputs.intent.home }}',
            user: '${{ inputs.intent.user }}', in_use: false}
        execution_secrets: {}
        parent_run_id: '${{ run.id }}'
        restoring: false
  - name: 'Remove LAN rules'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Remove certificates', condition: {type: always}}]
    guard: '${{ inputs.intent.residue.lan == null }}'
    task:
      type: workflow
      workflowIdOrName: route-lan-apply
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ inputs.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          control_node_id: '${{ inputs.intent.ssh.control_node_id }}'
          connection: {nodeHost: '${{ inputs.intent.ssh.target.host }}', nodeUser: '${{ inputs.intent.ssh.target.user }}', nodePort: '${{ inputs.intent.ssh.target.port }}',
            nodeIdentityFile: '${{ inputs.intent.ssh.identity_file }}', become: true}
          host_keys: '${{ inputs.intent.ssh.target.host_keys }}'
          rule: '${{ inputs.intent.residue.lan == null ? {} : inputs.intent.residue.lan }}'
        execution_secrets: {}
  - name: 'Apply ingress rules'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Remove LAN rules', condition: {type: always}}]
    forEach: {item: command, in: '${{ inputs.intent.residue.ingress_commands == null ? [] : inputs.intent.residue.ingress_commands.desired }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-residue-desired-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "node-residue-desired-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs: {hosts: 'name:target', sudo: true, argv: '${{ self.command }}'}
  - name: 'Remove ingress rules'
    labels: {role: swamp}
    writes: true
    allowFailure: true
    dependsOn: [{step: 'Apply ingress rules', condition: {type: always}}]
    forEach: {item: command, in: '${{ inputs.intent.residue.ingress_commands == null ? [] : inputs.intent.residue.ingress_commands.remove }}'}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "node-residue-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "node-residue-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh.target.user }}
          port: ${{ inputs.intent.ssh.target.port }}
          identityFile: ${{ inputs.intent.ssh.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh.target.host }}
          transport: {hostKeys: '${{ inputs.intent.ssh.target.host_keys }}'}
      inputs: {hosts: 'name:target', sudo: true, argv: '${{ self.command }}'}
  - name: 'Prove the residue is clear'
    labels: {role: swamp}
    dependsOn: [{step: 'Remove ingress rules', condition: {type: always}}]
    task: {type: assert, severity: high, message: A Route residue cleanup failed.,
      expr: 'steps.all(k, k == "Prove the residue is clear" || steps[k].status != "failed")'}
