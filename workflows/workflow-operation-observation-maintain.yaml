id: 51c70b61-c42d-4f16-89ae-12653d54627e
name: operation-observation-maintain
description: Select Gateway housekeeping state and snapshot Horizon natively.
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [observation.maintain] }
  required: [operation_id, node_id, kind]
jobs:
  - name: maintenance
    steps:
      - name: apply
        writes: true
        target: '${{ "orbit-node-" + string(inputs.node_id) }}'
        labels: { node: "${{ string(inputs.node_id) }}" }
        task:
          type: behavior
          behaviorType: "@nckrtl/observation-maintenance"
          behaviorName: '${{ "observation-maintenance-" + string(inputs.node_id) }}'
          methodName: apply
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"

  - name: report_failure
    dependsOn: [{job: maintenance, condition: {type: failed}}]
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: {node: '${{ string(inputs.node_id) }}'}
    steps:
      - name: report_failure
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-failure'
          behaviorName: '${{ "observation-failure-" + run.id }}'
          methodName: report
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            kind: '${{ inputs.kind }}'
            node_id: '${{ inputs.node_id }}'
            run_id: '${{ run.id }}'
