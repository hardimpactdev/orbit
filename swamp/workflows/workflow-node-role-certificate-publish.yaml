id: 4ae59518-f877-4ab7-9a51-069cd462a7ec
name: node-role-certificate-publish
description: Fixed role CSR, parent-bound signature, local publication, and native activation.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    parent_run_id:
      type: string
      minLength: 1
    leaf:
      type: object
    ssh:
      type: object
  required:
  - operation_id
  - node_id
  - kind
  - parent_run_id
  - leaf
  - ssh
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-certificate-assets'
      behaviorName: ${{ "role-assets-" + run.id }}
      methodName: read
      inputs:
        leaf: ${{ inputs.leaf }}
  - name: prepare-assets
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs: &id001
        name: ${{ inputs.ssh.name }}
        transport: ${{ inputs.ssh.transport }}
        hosts: ${{ inputs.ssh.hosts }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-role-certificate-" + run.id }}
    dependsOn:
    - step: assets
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: copy-assets
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: copy
      globalArgs: *id001
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-role-certificate-" + run.id + "/" }}
        direction: to
        recursive: true
    dependsOn:
    - step: prepare-assets
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: request
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-role-certificate-" + run.id + "/scripts/role_request.py" }}
        sudo: true
    dependsOn:
    - step: copy-assets
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: request-info
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-certificate-assets'
      behaviorName: ${{ "role-request-info-" + run.id }}
      methodName: decodeRequest
      inputs:
        leaf: ${{ inputs.leaf }}
        stdout: ${{ steps.request.outputs.stdout }}
    dependsOn:
    - step: request
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: sign
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-sign-" + run.id }}
      methodName: execute
      inputs:
        run: /usr/bin/python3 -B "$ORBIT_CERTIFICATE_SIGN_SCRIPT"
        env:
          ORBIT_CERTIFICATE_SIGN_SCRIPT: ${{ steps.assets.outputs.scripts_directory + "/sign.py" }}
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ inputs.parent_run_id }}
          ORBIT_CERTIFICATE_MODE: single
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["request-info"].outputs.request_json }}
          ORBIT_CERTIFICATE_LEAF: ${{ steps["request-info"].outputs.leaf_json }}
    dependsOn:
    - step: request-info
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: signed-info
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-certificate-assets'
      behaviorName: ${{ "role-signed-info-" + run.id }}
      methodName: decodeSigned
      inputs:
        leaf: ${{ inputs.leaf }}
        request: ${{ steps["request-info"].outputs.request }}
        stdout: ${{ steps.sign.outputs.stdout }}
    dependsOn:
    - step: sign
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: verify-pair
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs:
        name: ${{ inputs.ssh.name }}
        transport: ${{ inputs.ssh.transport }}
        hosts: ${{ inputs.ssh.hosts }}
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_SIGNED=" + steps["signed-info"].outputs.signed_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-role-certificate-" + run.id + "/scripts/role_verify.py" }}
        sudo: true
    dependsOn:
    - step: signed-info
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: publish
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_SIGNED=" + steps["signed-info"].outputs.signed_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-role-certificate-" + run.id + "/scripts/role_publish.py" }}
        sudo: true
    dependsOn:
    - step: verify-pair
      condition:
        type: succeeded
  - name: activate
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/systemctl
        - try-reload-or-restart
        - caddy
        sudo: true
    dependsOn:
    - step: publish
      condition:
        type: succeeded
  - name: cleanup-key
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs:
        name: ${{ inputs.ssh.name }}
        transport: ${{ inputs.ssh.transport }}
        hosts: ${{ inputs.ssh.hosts }}
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - -B
        - ${{ "/tmp/orbit-role-certificate-" + run.id + "/scripts/role_cleanup.py" }}
        sudo: true
    dependsOn:
    - step: activate
      condition:
        type: succeeded
  - name: cleanup-assets
    target: orbit-node-209
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ inputs.ssh.name }}
      methodName: exec
      globalArgs: *id001
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - ${{ "/tmp/orbit-role-certificate-" + run.id }}
    dependsOn:
    - step: cleanup-key
      condition:
        type: succeeded
  - name: result
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/node-role-certificate-assets'
      behaviorName: ${{ "role-result-" + run.id }}
      methodName: result
      inputs:
        leaf: ${{ inputs.leaf }}
        stdout: ${{ steps.publish.outputs.stdout }}
    dependsOn:
    - step: cleanup-assets
      condition:
        type: succeeded
