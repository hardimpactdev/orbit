---
# The grammar of the private DNS files, in one place. The phase (dns-publish.yml), its templates (templates/dns-*.j2) and the unit cases
# read these patterns, so the data the Gateway admits and the lines the phase installs are held to the same rule.
# A pattern ends with `\Z`, never `$`: `$` also matches before a trailing newline, and a newline would add a line to a dnsmasq file.
dns_pattern_label: '[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
dns_pattern_name: '{{ dns_pattern_label }}(?:\.{{ dns_pattern_label }})*'
dns_pattern_octet: '(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
dns_pattern_ipv4: '{{ dns_pattern_octet }}(?:\.{{ dns_pattern_octet }}){3}'
# The Node's own resolver (/etc/systemd/resolved.conf.d/30-orbit-local-dns.conf names it: DNS=127.0.0.55, Domains=~.). dnsmasq listens on it
# next to the VPN addresses, so the vpn Node resolves apt, the agent and every other name through the same dnsmasq.
dns_local_resolver: "{{ none if dns.kind | default('vpn') == 'cluster' else '127.0.0.55' }}"
# The zones that dnsmasq answers from its own data only (`local=/zone/` in orbit.conf). A name below such a zone never goes to an upstream
# resolver: an exact name gets its hosts line, and anything below it is NXDOMAIN. A forward rule for a child (`server=/*.name/#`) would
# override `local=`, so the NODATA/forward pair is for the names outside these zones only (dns_pair_names).
dns_local_zones: "{{ [] if dns.kind | default('vpn') == 'cluster' else ['orbit'] }}"
dns_pair_names: >-
  {{ dns.records | selectattr('pair') | map(attribute='name')
  | reject('match', '(?:.*[.])?(?:' ~ (dns_local_zones | map('regex_escape') | join('|')) ~ ')\Z') | unique | sort | list }}
dns_pattern_interface: '[A-Za-z0-9][A-Za-z0-9._-]{0,14}'

# Every line of a file the phase writes must match one of these, or the phase refuses the render before it installs anything.
dns_line_hosts: '^(?:#.*|{{ dns_pattern_ipv4 }} {{ dns_pattern_name }})\Z'
dns_line_servers: '^(?:#.*|server=/{{ dns_pattern_name }}/|server=/\*\.{{ dns_pattern_name }}/#)\Z'
dns_line_conf: >-
  ^(?:#.*|listen-address={{ dns_pattern_ipv4 }}|domain-needed|bogus-priv|bind-dynamic|no-resolv|no-hosts|local-ttl=30|server={{ dns_pattern_ipv4 }}|address=/\.{{ dns_pattern_name }}/{{ dns_pattern_ipv4 }}|local=/{{ dns_pattern_name }}/|addn-hosts=/[A-Za-z0-9/._-]+|servers-file=/[A-Za-z0-9/._-]+)\Z

# The times of one publication, in seconds, in one place. The Swamp step that runs the phase stops it after dns_phase_timeout
# (swamp/workflows/workflow-dns-publish.yaml), and a test keeps the two equal. The lock holder outlives a killed play, so it must outlive the step
# timeout and the cutover with a margin. A dead holder does not release the lock: it expires after dns_lock_hold. The next publication waits
# dns_lock_wait for a live or a dead holder, which covers a play stopped by the step timeout (dns_lock_hold - dns_phase_timeout left at most). A play
# that crashed earlier leaves up to dns_lock_hold seconds, so the next publication can give up with a lock timeout; the owner retries after the expiry.
# The Node's DNS does not wait for the lock: the detached cutover restores the old listener by itself (templates/dns-cutover.sh.j2).
dns_phase_timeout: 300
dns_cutover_budget: 90
dns_lock_margin: 30
dns_lock_hold: "{{ (dns_phase_timeout | int) + (dns_cutover_budget | int) + (dns_lock_margin | int) }}"
dns_lock_wait: "{{ (dns_lock_hold | int) - (dns_phase_timeout | int) + (dns_lock_margin | int) }}"
dns_lock_job_timeout: "{{ (dns_lock_wait | int) + (dns_lock_hold | int) + (dns_lock_margin | int) }}"

# The recovery script of the snapshot and the detached cutover (templates/dns-restore.sh.j2, dns-cutover.sh.j2): how long the restored
# resolvers get to answer, and how long dnsmasq gets to hold the listen addresses after its restart, in seconds. Both run inside
# dns_cutover_budget: a restart and a stop take about ten seconds, the held wait up to dns_held_wait for each of three addresses on a failure,
# and the restore up to dns_restore_deadline plus the last attempts.
dns_held_wait: 10
dns_restore_deadline: 30
