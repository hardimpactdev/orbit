- name: activate-runtime
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: dns
    condition:
      type: succeeded
  steps:
  - name: install-runtime
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: runtime
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
        phase: install
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
  - name: verify-runtime
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: runtime
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
        phase: verify
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
    dependsOn:
    - step: install-runtime
      condition:
        type: succeeded
- name: retirement
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: retire-artifacts
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: route
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        phase: retire
        target_node_id: ${{ self.member }}
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: ${{ steps.admission.outputs.caddy_node_ids }}
  dependsOn:
  - job: activate-runtime
    condition:
      type: succeeded
- name: completion
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: retire-runtime
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: runtime
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ inputs.node_id }}
        phase: retire
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
  - name: source-remove
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: removeSource
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        captured: ${{ steps.capture.outputs }}
    dependsOn:
    - step: retire-runtime
      condition:
        type: succeeded
  - name: retire
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: retire
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    dependsOn:
    - step: source-remove
      condition:
        type: succeeded
  dependsOn:
  - job: retirement
    condition:
      type: succeeded
- name: recover-state
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: recovery
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: recover
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
    guard: ${{ "retire" in steps && steps.retire.status == "succeeded" }}
  - name: rollback
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: rollback
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        decision: ${{ steps.recovery.outputs }}
    dependsOn:
    - step: recovery
      condition:
        type: succeeded
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover)
      }}
  dependsOn:
  - job: completion
    condition:
      type: always
- name: recover-caddy
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: restore-caddy
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishCaddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs.caddy_node_ids
        : [] }}'
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover)
      }}
  dependsOn:
  - job: recover-state
    condition:
      type: succeeded
- name: recover-dns
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: restore-dns
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication'
      behaviorName: ${{ "route-publication-node-" + string(self.member) }}
      methodName: publishDns
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ self.member }}
        recovery: true
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs.dns_node_ids
        : [] }}'
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover)
      }}
  dependsOn:
  - job: recover-caddy
    condition:
      type: succeeded
- name: recover-runtime
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: recover-dns
    condition:
      type: succeeded
  steps:
  - name: restore-runtime
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: runtime
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ inputs.node_id }}
        phase: restore
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover)
      }}
- name: recover-leaves
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: remove-candidate-certificates
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: removeCandidateCertificates
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        decision: ${{ steps.recovery.outputs }}
        target_node_id: ${{ self.member }}
    target: ${{ "orbit-node-" + string(self.member) }}
    labels:
      node: ${{ string(self.member) }}
    forEach:
      item: member
      in: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs.caddy_node_ids
        : [] }}'
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover)
      }}
  dependsOn:
  - job: recover-runtime
    condition:
      type: succeeded
- name: sqlite-cleanup-source
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: recover-leaves
    condition:
      type: always
  steps:
  - name: sqlite-cleanup-source
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: sqlite
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ inputs.node_id }}
        phase: cleanup-source
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
- name: sqlite-cleanup-target
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: recover-leaves
    condition:
      type: always
  steps:
  - name: sqlite-cleanup-target
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: sqlite
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        target_node_id: ${{ steps.admission.outputs.destination_node_id }}
        phase: cleanup-target
    target: ${{ "orbit-node-" + string(steps.admission.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.admission.outputs.destination_node_id) }}
    guard: ${{ !("admission" in steps && "outputs" in steps.admission) }}
- name: recover-cleanup
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  steps:
  - name: discard
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: discard
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        decision: ${{ steps.recovery.outputs }}
        target_node_id: ${{ steps.recovery.outputs.destination_node_id }}
    target: ${{ "orbit-node-" + string(steps.recovery.outputs.destination_node_id) }}
    labels:
      node: ${{ string(steps.recovery.outputs.destination_node_id) }}
    guard: ${{ !("recovery" in steps && "outputs" in steps.recovery && steps.recovery.outputs.recover)
      }}
  dependsOn:
  - job: recover-leaves
    condition:
      type: succeeded
  - job: sqlite-cleanup-source
    condition:
      type: succeeded
  - job: sqlite-cleanup-target
    condition:
      type: succeeded
- name: final-outcome
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels:
    node: ${{ string(inputs.node_id) }}
  dependsOn:
  - job: recover-cleanup
    condition:
      type: succeeded
  steps:
  - name: finish
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: finish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed: false
    guard: ${{ !("retire" in steps && steps.retire.status == "succeeded") }}
  - name: failed
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-transfer'
      behaviorName: ${{ "instance-transfer-" + run.id }}
      methodName: finish
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed: true
        decision: '${{ ("recovery" in steps && "outputs" in steps.recovery) ? steps.recovery.outputs :
          {"recover": false, "cancelled": false, "destination_node_id": inputs.node_id, "caddy_node_ids":
          [], "dns_node_ids": []} }}'
    dependsOn:
    - step: finish
      condition:
        type: always
    guard: ${{ ("retire" in steps && steps.retire.status == "succeeded") || !("discard" in steps && steps.discard.status
      == "succeeded") }}
