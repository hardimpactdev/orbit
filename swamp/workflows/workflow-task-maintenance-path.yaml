id: 85856d40-df44-408b-92dd-7769c6e6fed3
name: task-maintenance-path
# Each SSH step is limited to 3900 s, the run budget of the largest Operation that calls it (OperationBudgetTable::SecondsByKind).
description: One captured maintenance directory; every task VM action is one official SSH
  exec argv, visible in native history.
vaults: []
inputs:
  type: object
  properties:
    place:
      type: object
    ssh_execution:
      type: object
  required:
  - place
  - ssh_execution
jobs:
- name: inspect
  labels: {role: swamp}
  steps:
  # One `cat` per manifest of this manager; a missing file is a recorded observation.
  - name: read-before-${{ self._index }}
    labels: {role: swamp}
    forEach:
      item: item
      in: ${{ inputs.place.files }}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id) + "-" + self.item).split(".").join("-") }}'
      methodName: exec
      globalArgs: &read_ssh_args
        name: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id) + "-" + self.item).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - cat
        - --
        - ${{ inputs.place.directory + "/" + self.item }}
  - name: node-modules
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &ssh_args
        name: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ inputs.ssh_execution.target.user }}
          port: ${{ inputs.ssh_execution.target.port }}
          identityFile: ${{ inputs.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - test
        - -d
        - ${{ inputs.place.directory + "/node_modules" }}
    dependsOn:
    - step: read-before-${{ self._index }}
      condition:
        type: succeeded
  - name: before
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: inspect
      inputs:
        place: ${{ inputs.place }}
        phase: before
        steps: ${{ steps }}
    dependsOn:
    - step: node-modules
      condition:
        type: succeeded
  - name: audit-before
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        okExitCodes: [0, 1, 2, 3]
        argv: ${{ steps.before.outputs.audit_argv }}
        timeoutSec: 3600
    dependsOn:
    - step: before
      condition:
        type: succeeded
  - name: plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: plan
      inputs:
        place: ${{ inputs.place }}
        snapshot: ${{ steps.before.outputs.snapshot }}
        audit: ${{ steps["audit-before"].outputs.stdout }}
    dependsOn:
    - step: audit-before
      condition:
        type: succeeded
- name: target_releases
  labels: {role: swamp}
  steps:
  - name: release-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "tm-release-target-" + string(self._index) }}'
      methodName: release
      inputs:
        manager: ${{ inputs.place.manager }}
        name: ${{ self.item.name }}
    forEach:
      item: item
      in: ${{ steps.plan.outputs.release_targets }}
    concurrency: 1
  dependsOn:
  - job: inspect
    condition:
      type: succeeded
- name: update
  labels: {role: swamp}
  steps:
  - name: target-age
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: age
      inputs:
        place: ${{ inputs.place }}
        changed: ${{ steps.plan.outputs.release_targets }}
        readings: ${{ steps }}
  - labels: {role: swamp}
    guard: ${{ steps.plan.outputs.expo_url == null }}
    name: expo-fetch
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "maintenance-expo-fetch" }}'
      methodName: execute
      inputs:
        run: 'curl --fail --silent --show-error --location --output "$EXPO_ARCHIVE"
          "$EXPO_URL"

          '
        env:
          EXPO_ARCHIVE: ${{ "/tmp/orbit-expo-"+run.id+".tgz" }}
          EXPO_URL: ${{ steps.plan.outputs.expo_url }}
    dependsOn:
    - step: target-age
      condition:
        type: succeeded
  - labels: {role: swamp}
    guard: ${{ steps.plan.outputs.expo_url == null }}
    name: expo-catalog
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "maintenance-expo-catalog" }}'
      methodName: execute
      inputs:
        run: 'tar -xzOf "$EXPO_ARCHIVE" package/bundledNativeModules.json

          '
        env:
          EXPO_ARCHIVE: ${{ "/tmp/orbit-expo-"+run.id+".tgz" }}
    dependsOn:
    - step: expo-fetch
      condition:
        type: succeeded
  - labels: {role: swamp}
    guard: ${{ steps.plan.outputs.expo_url == null }}
    name: expo-validate
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-expo-validate" }}'
      methodName: expo
      inputs:
        place: ${{ inputs.place }}
        snapshot: ${{ steps.before.outputs.snapshot }}
        stdout: ${{ steps["expo-catalog"].outputs.stdout }}
    dependsOn:
    - step: expo-catalog
      condition:
        type: succeeded
  - labels: {role: swamp}
    guard: ${{ steps.plan.outputs.expo_url == null }}
    name: expo-cleanup
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "maintenance-expo-cleanup" }}'
      methodName: execute
      inputs:
        run: 'rm -f -- "$EXPO_ARCHIVE"

          '
        env:
          EXPO_ARCHIVE: ${{ "/tmp/orbit-expo-"+run.id+".tgz" }}
    dependsOn:
    - step: expo-validate
      condition:
        type: always
    allowFailure: true
  - name: prepare
    labels: {role: swamp}
    guard: ${{ steps.plan.outputs.prepare_argv == null }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        argv: ${{ steps.plan.outputs.prepare_argv }}
        timeoutSec: 3600
    dependsOn:
    - step: expo-validate
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  # 209 computed the whole manifest; tee writes it from stdin in place.
  - name: manifest
    labels: {role: swamp}
    guard: ${{ inputs.place.mode != "package" || !steps.plan.outputs.manifest_write }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - tee
        - --
        - ${{ steps.plan.outputs.manifest_path }}
        stdin: ${{ steps.plan.outputs.manifest_text }}
    dependsOn:
    - step: prepare
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: update
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        argv: ${{ steps.plan.outputs.update_argv }}
        timeoutSec: 3600
    dependsOn:
    - step: manifest
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: read-after-${{ self._index }}
    labels: {role: swamp}
    forEach:
      item: item
      in: ${{ inputs.place.files }}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id) + "-" + self.item).split(".").join("-") }}'
      methodName: exec
      globalArgs: *read_ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - cat
        - --
        - ${{ inputs.place.directory + "/" + self.item }}
    dependsOn:
    - step: update
      condition:
        type: succeeded
  - name: after
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: inspect
      inputs:
        place: ${{ inputs.place }}
        phase: after
        steps: ${{ steps }}
    dependsOn:
    - step: read-after-${{ self._index }}
      condition:
        type: succeeded
  - name: audit-after
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        okExitCodes: [0, 1, 2, 3]
        argv: ${{ steps.after.outputs.audit_argv }}
        timeoutSec: 3600
    dependsOn:
    - step: after
      condition:
        type: succeeded
  - name: verify
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: verify
      inputs:
        place: ${{ inputs.place }}
        before: ${{ steps.before.outputs.snapshot }}
        after: ${{ steps.after.outputs.snapshot }}
        audit: ${{ steps["audit-after"].outputs.stdout }}
    dependsOn:
    - step: audit-after
      condition:
        type: succeeded
  dependsOn:
  - job: target_releases
    condition:
      type: succeeded
- name: changed_releases
  labels: {role: swamp}
  steps:
  - name: release-changed-${{ self._index }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "tm-release-changed-" + string(self._index) }}'
      methodName: release
      inputs:
        manager: ${{ inputs.place.manager }}
        name: ${{ self.item.name }}
    forEach:
      item: item
      in: ${{ steps.verify.outputs.changed }}
    concurrency: 1
  dependsOn:
  - job: update
    condition:
      type: succeeded
- name: finalize
  labels: {role: swamp}
  steps:
  - name: age-verified
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: age
      inputs:
        place: ${{ inputs.place }}
        changed: ${{ steps.verify.outputs.changed }}
        readings: ${{ steps }}
        prefix: release-changed
  - name: restore-plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: restore
      inputs:
        place: ${{ inputs.place }}
        after: ${{ steps.after.outputs.snapshot }}
        declarations: ${{ steps.plan.outputs.declarations }}
    dependsOn:
    - step: age-verified
      condition:
        type: succeeded
    guard: ${{ inputs.place.manager != "js" || inputs.place.mode != "package" }}
  - name: restore-ranges
    labels: {role: swamp}
    guard: ${{ inputs.place.manager != "js" || inputs.place.mode != "package" || !steps["restore-plan"].outputs.manifest_write }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        argv:
        - tee
        - --
        - ${{ steps["restore-plan"].outputs.manifest_path }}
        stdin: ${{ steps["restore-plan"].outputs.manifest_text }}
    dependsOn:
    - step: restore-plan
      condition:
        type: succeeded
  - name: synchronize-lock
    labels: {role: swamp}
    guard: ${{ inputs.place.manager != "js" || inputs.place.mode != "package" }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        argv: ${{ steps["restore-plan"].outputs.sync_argv }}
        timeoutSec: 3600
    dependsOn:
    - step: restore-ranges
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: read-restored-${{ self._index }}
    labels: {role: swamp}
    guard: ${{ inputs.place.manager != "js" || inputs.place.mode != "package" }}
    forEach:
      item: item
      in: ${{ inputs.place.files }}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("maintenance-ssh-" + string(inputs.ssh_execution.target.node_id) + "-" + self.item).split(".").join("-") }}'
      methodName: exec
      globalArgs: *read_ssh_args
      inputs:
        hosts: name:target
        timeoutSec: 3900
        okExitCodes: any
        argv:
        - cat
        - --
        - ${{ inputs.place.directory + "/" + self.item }}
    dependsOn:
    - step: synchronize-lock
      condition:
        type: succeeded
  - name: restored
    labels: {role: swamp}
    guard: ${{ inputs.place.manager != "js" || inputs.place.mode != "package" }}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: inspect
      inputs:
        place: ${{ inputs.place }}
        phase: restored
        steps: ${{ steps }}
    dependsOn:
    - step: read-restored-${{ self._index }}
      condition:
        type: succeeded
  - name: synchronized
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-maintenance-input'
      behaviorName: '${{ "maintenance-input-task-maintenance-input" }}'
      methodName: synchronized
      inputs:
        place: ${{ inputs.place }}
        solved: ${{ steps.after.outputs.snapshot }}
        after: ${{ steps.restored.outputs.snapshot }}
    dependsOn:
    - step: restored
      condition:
        type: succeeded
    guard: ${{ inputs.place.manager != "js" || inputs.place.mode != "package" }}
  - name: Check the path
    labels: {role: swamp}
    task:
      type: assert
      expr: 'steps.verify.status == "succeeded" && steps["age-verified"].status == "succeeded" && (inputs.place.manager != "js" || inputs.place.mode != "package" || steps.synchronized.status == "succeeded")'
      message: The maintenance path did not finish its package and policy checks.
      severity: high
    dependsOn:
    - step: synchronized
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  dependsOn:
  - job: changed_releases
    condition:
      type: succeeded
queueTimeout: 30
