      - name: finish-setup
        target: orbit-node-209
        dependsOn:
          - step: finish-environment-library-copy
            condition:
              type: succeeded
          - step: create-admitted
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ "ids-finish-3-" + run.id }}'
          methodName: exec
          globalArgs: *ref_5
          inputs:
            hosts: 'name:target'
            argv:
              - /usr/bin/timeout
              - '--kill-after=1s'
              - '${{ string(inputs.intent.phase_plan.setup.seconds + 1) + ''s'' }}'
              - /usr/bin/python3
              - '-B'
              - '${{ "/tmp/orbit-create-phase-"+run.id+"/create/setup.py" }}'
              - '${{ steps["vp-result"].outputs.runtime == null ? "" : steps["vp-result"].outputs.runtime.store }}'
            okExitCodes: any
            timeoutSec: '${{ inputs.intent.phase_plan.setup.seconds + 2 }}'
            stdin: '${{ vault.get(inputs.execution_secrets.setup.vault,inputs.execution_secrets.setup.key) }}'
        queueTimeout: 15
      - name: finish-result
        target: orbit-node-209
        dependsOn:
          - step: finish-prepared
            condition:
              type: always
          - step: finish-environment-library
            condition:
              type: always
          - step: finish-environment-library-copy
            condition:
              type: always
          - step: finish-setup
            condition:
              type: always
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "idm-finish-4-" + run.id }}'
          methodName: create_result
          inputs:
            intent: '${{ inputs.intent }}'
            steps: '${{ steps }}'
        queueTimeout: 15
      - name: accepted
        target: orbit-node-209
        dependsOn:
          - step: finish-result
            condition:
              type: succeeded
        task:
          type: assert
          expr: 'steps["finish-result"].outputs.ready == true'
          severity: high
          message: The development Instance action did not complete.
        queueTimeout: 15
