id: 9249dbc7-f61a-4288-9e51-a10a3c0bfa1d
name: operation-firewall
description: Claim and execute a firewall kind within one placed worker invocation.
labels: { pool: migration }
queueTimeout: 300
autoResume: true
inputs:
  type: object
  properties:
    kind: {
      type: string,
      enum: [firewall.allow, firewall.deny, firewall.remove],
    }
    worker: { type: string }
  required: [kind, worker]
jobs:
  - name: firewall
    steps:
      - name: execute
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-firewall"
          behaviorName: '${{ "operation-firewall-" + {"firewall.allow":"allow", "firewall.deny":"deny", "firewall.remove":"remove"}[inputs.kind] }}'
          methodName: execute
          inputs:
            kind: "${{ inputs.kind }}"
            worker: "${{ inputs.worker }}"
