id: bf32f147-daa5-451f-af8c-2ae4eb680071
name: task-vm-sweep-incus
description: Sweep one Incus host through official SSH exec; selection stays on 209.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.sweep_host
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: inventory
  steps:
  - name: instances
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: &ssh_args
        name: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - /1.0/instances?all-projects=true
  - name: volumes
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - ${{ '/1.0/storage-pools/' + inputs.intent.scope.pool + '/volumes/custom?all-projects=true' }}
  - name: images
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - ${{ '/1.0/images?project=' + inputs.intent.scope.project }}
  - name: plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: '${{ "task-vm-sweep-plan" }}'
      methodName: incus_plan
      inputs:
        intent: ${{ inputs.intent }}
        instances: ${{ steps.instances.outputs.stdout }}
        volumes: ${{ steps.volumes.outputs.stdout }}
        images: ${{ steps.images.outputs.stdout }}
    dependsOn:
    - step: instances
      condition:
        type: succeeded
    - step: volumes
      condition:
        type: succeeded
    - step: images
      condition:
        type: succeeded
- name: remove-instances
  dependsOn:
  - job: inventory
    condition:
      type: succeeded
  steps:
  - name: remove-instance
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs: &remove_args
        name: ${{ "task-vm-sweep-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '180'
        - incus
        - delete
        - --force
        - --project
        - ${{ inputs.intent.scope.project }}
        - --
        - ${{ self.instance }}
    forEach:
      item: instance
      in: ${{ steps.plan.outputs.instances }}
- name: remove-volumes
  dependsOn:
  - job: remove-instances
    condition:
      type: succeeded
  steps:
  - name: remove-volume
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-remove-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs: *remove_args
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '180'
        - incus
        - storage
        - volume
        - delete
        - --project
        - ${{ inputs.intent.scope.project }}
        - --
        - ${{ inputs.intent.scope.pool }}
        - ${{ self.volume }}
    forEach:
      item: volume
      in: ${{ steps.plan.outputs.volumes }}
- name: observe
  dependsOn:
  - job: remove-volumes
    condition:
      type: succeeded
  steps:
  - name: after
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-sweep-read-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs: *ssh_args
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - ${{ '/1.0/instances?project=' + inputs.intent.scope.project }}
  - name: format
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: '${{ "task-vm-sweep-format" }}'
      methodName: incus_result
      inputs:
        scope: ${{ inputs.intent.scope }}
        instances: ${{ steps.plan.outputs.instances }}
        volumes: ${{ steps.plan.outputs.volumes }}
        stdout: ${{ steps.after.outputs.stdout }}
    dependsOn:
    - step: after
      condition:
        type: succeeded
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-result" }}'
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$RESULT"
        env:
          RESULT: ${{ steps.format.outputs.result_json }}
    dependsOn:
    - step: format
      condition:
        type: succeeded
queueTimeout: 60
