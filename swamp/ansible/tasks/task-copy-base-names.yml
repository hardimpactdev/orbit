---
# The one rule that names the scratch of task:sync of a copy (docs/reference/task-instance-workspace.md): the copy's Instance names
# its Node scratch and its bundle folder in the copy, so the next sync and the copy's destroy find what a cancelled sync left. The
# caller sets task_base_instance; task_base_root is the Node folder, which only a test moves.
- name: Name the copy's base scratch
  ansible.builtin.set_fact:
    base_node: "{{ task_base_root | default('/var/tmp') }}/orbit-task-base-{{ task_base_instance }}"
    base_guest: "/tmp/orbit-task-base-{{ task_base_instance }}"
    # The staging repository where the signed executor seeds the copy's missing mirror (instance.fetch_branch `seed`).
    base_seeding: "{{ task_base_mirrors | default('/var/lib/orbit/instance-repositories') }}/{{ task_base_instance }}.git.seeding"
