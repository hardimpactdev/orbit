id: a2ac2abb-17bf-4936-802e-995b004773aa
name: operation-instance-lifecycle-direct
description: Record a checked-out development branch directly on its admitted Node.
target: '${{ "orbit-node-" + string(inputs.node_id) }}'
vaults: []
writes: true
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: { type: string, enum: [instance.rename] }
  required: [operation_id, node_id, kind]
jobs:
  - name: rename
    steps:
      - name: inspect
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-lifecycle-direct'
          behaviorName: '${{ "instance-lifecycle-node-" + string(inputs.node_id) }}'
          methodName: rename
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            run_id: '${{ run.id }}'
