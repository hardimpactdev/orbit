id: 4217c494-14b5-54e3-887e-92585108a445
name: task-check-prepare
description: Build every check argv on 209 and prepare the run directories.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      propertyNames:
        enum:
        - github_token
        - checks_token
        - git_authorization
      maxProperties: 3
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-check-(write|read|git)-[a-f0-9-]{36}$
        required:
        - vault
        - key
        additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  additionalProperties: false
jobs:
- name: prepare
  labels:
    role: swamp
  steps:
  - name: prepare
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: ${{ "task-check-prepare" }}
      methodName: prepare
      inputs:
        intent: ${{ inputs.intent }}
        node_id: ${{ inputs.node_id }}
        root: ${{ "/tmp/orbit-task-check-" + inputs.run_id }}
  - name: prepare_remote
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - -m
        - '0700'
        - --
        - ${{ "/tmp/orbit-task-check-" + inputs.run_id + "/output" }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
  - name: output_local
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "task-check-output_local" }}
      methodName: execute
      inputs:
        run: 'umask 077

          mkdir -p -- "$ORBIT_OUTPUT"

          '
        env:
          ORBIT_OUTPUT: ${{ "/tmp/orbit-task-check-" + inputs.run_id + "-output" }}
    dependsOn:
    - step: prepare
      condition:
        type: succeeded
  - name: original
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
    dependsOn:
    - step: prepare_remote
      condition:
        type: succeeded
    guard: ${{ !steps.prepare.outputs.valid }}
queueTimeout: 30
