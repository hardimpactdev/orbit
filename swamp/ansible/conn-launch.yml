---
# Conn launch preparation, delivery and read-only recovery through the admitted Instance Node.
- name: Address the recorded Instance Node
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [launch]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: conn_launch_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run the scoped T3 call in the Instance
  hosts: conn_launch_node
  gather_facts: false
  become: true
  tags: [launch]
  vars:
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    inspect: "{{ intent.action == 'inspect-launch' }}"
    probe_args: >-
      {{ [intent.environment_id] + ([intent.requested_provider] if intent.requested_provider is defined else [])
         if inspect else [] }}
    instance_exec: >-
      {{ ['incus', '--project', intent.runtime.project, 'exec', '--cwd', '/srv/workspace', intent.runtime.name, '--',
          '/usr/sbin/runuser', '-u', 'agent', '--', '/usr/bin/env', '-i', 'HOME=/home/agent', 'PATH=/usr/local/bin:/usr/bin:/bin'] }}
    rpc: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/t3_copy_rpc.mjs') }}"
  tasks:
    - name: Validate the admitted launch target
      ansible.builtin.assert:
        that:
          - intent.action in ['inspect-launch', 'launch', 'reconcile-launch']
          - intent.runtime.project is match('^orbit-instances(?:-nested)?$')
          - intent.runtime.name == 'instance-' ~ intent.instance_id
          - not inspect or intent.environment_id is match('^[a-zA-Z0-9:_-]{1,255}$')
          - not inspect or intent.requested_provider is not defined or intent.requested_provider is match('^[a-zA-Z0-9._:-]{1,128}$')
        fail_msg: conn.launch_invalid_dispatch

    - name: Attempt the admitted T3 call
      ansible.builtin.command:
        argv: >-
          {{ instance_exec + ['/usr/bin/timeout', '60', '/opt/orbit-runtime/current/bin/node',
             '--input-type=module', '-e', rpc, '--', 'orbit-rpc', '/opt/orbit-agent/current/agent/bin/t3', intent.action]
             + probe_args }}
        stdin: "{{ omit if inspect else lookup('ansible.builtin.file', run ~ '/launch.json', rstrip=false) }}"
        stdin_add_newline: false
        expand_argument_vars: false
      register: launch_call
      changed_when: not inspect and intent.action == 'launch' and launch_call.rc == 0
      failed_when: false
      no_log: true

    - name: Keep the bounded launch receipt
      ansible.builtin.copy:
        dest: "{{ run }}/result.json"
        mode: '0600'
        content: >-
          {{ launch_call.stdout if launch_call.rc == 0 and launch_call.stdout | length <= 17000
             else {'error_code': 'conn.launch_workspace_failed' if inspect else 'conn.launch_first_message_unconfirmed'} | to_json }}
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      no_log: true

    - name: Require a verified T3 receipt
      ansible.builtin.assert:
        that:
          - launch_call.rc == 0
          - launch_call.stdout | length > 0
          - launch_call.stdout | length <= 17000
          - (launch_call.stdout | from_json).error_code is none
        fail_msg: "{{ 'conn.launch_workspace_failed' if inspect else 'conn.launch_first_message_unconfirmed' }}"

