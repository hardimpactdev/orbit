name: Provide Valkey
description: Install the Valkey server and client for the real database tests, from cached packages when the cache has them.
# A mirror that times out failed the job. The packages the first install downloads are cached for this runner image,
# and a later run installs them without a network. The job on main saves the cache, so pull requests and the merge
# queue read it.
runs:
  using: composite
  steps:
    - name: Read the runner image version
      id: image
      shell: bash
      run: echo "version=${ImageVersion:?}" >> "$GITHUB_OUTPUT"
    # The newest package set of this image is restored. A set is saved under its own digest, so a set that the
    # install had to replace reaches the next runner.
    - name: Restore the Valkey packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/orbit-ci-apt/valkey-server
        key: ci-apt-valkey-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-none
        restore-keys: ci-apt-valkey-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-
    - name: Install and verify Valkey
      id: install
      shell: bash
      run: |
        archives="$HOME/.cache/orbit-ci-apt/valkey-server"
        ORBIT_CI_APT_ARCHIVES="$archives" bin/ci-runner-prerequisites valkey-server
        command -v valkey-server
        command -v valkey-cli
        if compgen -G "$archives/*.deb" >/dev/null; then
          echo "set=$(cd "$archives" && sha256sum -- *.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        fi
    - name: Save the Valkey packages
      if: steps.install.outputs.set != '' && !endsWith(steps.restore.outputs.cache-matched-key, format('-{0}', steps.install.outputs.set))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/orbit-ci-apt/valkey-server
        key: ci-apt-valkey-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.install.outputs.set }}
