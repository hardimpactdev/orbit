# Runs the probes of the case (cases.yml: `probes`, the list named by `probe_set`: setup or expect). The caller imports this playbook with
# `probe_set`. The probes run in waves of as many as the limit allows (ANSIBLE_FORKS); probe-wave.yml runs a wave. The answer is `probe_obs`
# on localhost, one entry per probe; `probes_of_case` of the case host holds what ran.
- name: The case lists its probes
  hosts: case_hosts
  gather_facts: false
  vars_files: [cases.yml]
  tasks:
    - name: Keep the probes of the case
      ansible.builtin.set_fact:
        probes_of_case: "{{ probes[probe_set] | map('combine', probe_common) | list }}"

- name: Run the probes, one wave at a time
  hosts: localhost
  gather_facts: false
  tasks:
    - name: The probes of every case
      ansible.builtin.set_fact:
        all_probes: "{{ groups['case_hosts'] | map('extract', hostvars, 'probes_of_case') | flatten | list }}"
        probe_obs: []

    - name: Run the probes, one wave at a time
      ansible.builtin.include_tasks: probe-wave.yml
      loop: "{{ all_probes | batch(parallel_limit | int) | list }}"
      loop_control: {loop_var: wave, label: "{{ wave | length }} probes"}
