name: Composer maintenance

on:
  pull_request:
    paths:
      - 'extensions/behaviors/composer-maintenance/**'
      - 'extensions/behaviors/_lib/maintenance/**'
      - 'tests/batch_maintenance_test.ts'
      - '.github/workflows/composer-maintenance.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/behaviors/composer-maintenance/**'
      - 'extensions/behaviors/_lib/maintenance/**'
      - 'tests/batch_maintenance_test.ts'
      - '.github/workflows/composer-maintenance.yml'

permissions:
  contents: read

jobs:
  composer-maintenance:
    runs-on: [self-hosted, hardimpact]
    steps:
      - uses: actions/checkout@v4
      # Shared runners have no sudo. PHP is provided by the runner image.
      - name: Check PHP
        run: |
          command -v php >/dev/null \
            || { echo "::error::PHP 8.5 is missing from this runner image"; exit 1; }
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);' \
            || { echo "::error::PHP 8.5 is required, found $(php -r 'echo PHP_VERSION;')"; exit 1; }
          php -r 'exit(extension_loaded("json") ? 0 : 1);' \
            || { echo "::error::The PHP JSON extension is missing from this runner image"; exit 1; }
          php -v
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check formatting
        run: deno fmt --check extensions/behaviors/composer-maintenance extensions/behaviors/_lib/maintenance
      - name: Lint extension
        run: deno lint extensions/behaviors/composer-maintenance extensions/behaviors/_lib/maintenance
      - name: Test Composer maintenance (one worker)
        run: deno test --allow-all extensions/behaviors/composer-maintenance/mod_test.ts tests/lib_test.ts tests/batch_maintenance_test.ts
