        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed_step: php
  dependsOn:
  - job: php
    condition:
      type: failed
- name: failure_caddy
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: failure_caddy
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-destroy'
      behaviorName: ${{ "instance-destroy-" + run.id }}
      methodName: fail
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        run_id: ${{ run.id }}
        failed_step: caddy
  dependsOn:
  - job: caddy
    condition:
      type: failed
- name: failure_dns
  target: ${{ "orbit-node-" + string(inputs.node_id) }}
  labels: *id001
  steps:
  - name: failure_dns
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/instance-destroy'
      behaviorName: ${{ "instance-destroy-" + run.id }}
      methodName: fail
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
