---
# One nested Node's base converge for the refresh (instance-fleet-refresh.yml), through the nested Gateway's API as the operator: the
# base places the agent of the checkout's delivery pin, Orbit's files and units. The task VM refresh does the same with
# `node:converge <id> --base` (task-vm-fleet-base-node.yml). The wait reads the Operation every 5 s, 900 s at most. The count of tasks
# the converge changed (`result.changed`) adds to `fleet_converge_changed`, and a Node with a change joins `fleet_converge_changed_roles`;
# a result without a count counts as a change.
- name: Admit the base converge of {{ fleet_node.name }}
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '90'] + fleet_curl + ['--fail', '-X', 'POST', fleet_api ~ '/nodes/' ~ fleet_node.id ~ '/converge',
          '-H', 'Content-Type: application/json', '-d', '{"base":true}'] }}
  register: fleet_converge
  changed_when: true
- name: Wait for the base converge of {{ fleet_node.name }}
  ansible.builtin.command:
    argv: "{{ ['timeout', '90'] + fleet_curl + ['--fail', fleet_api ~ '/operations/' ~ (fleet_converge.stdout | from_json).data.id] }}"
  register: fleet_converge_wait
  changed_when: false
  failed_when: false
  until: >-
    ((fleet_converge_wait.stdout | default('{}', true) | from_json).data | default({})).status | default('')
    in ['succeeded', 'failed', 'cancelled', 'interrupted']
  retries: 180
  delay: "{{ fleet_ready_delay }}"
- name: Check the base converge of {{ fleet_node.name }}
  vars:
    fleet_operation: "{{ (fleet_converge_wait.stdout | default('{}', true) | from_json).data | default({}) }}"
  ansible.builtin.assert:
    that: fleet_operation.status | default('') == 'succeeded'
    fail_msg: >-
      The base converge of the nested Node {{ fleet_node.name }} (Operation {{ (fleet_converge.stdout | from_json).data.id }}) ended
      {{ fleet_operation.status | default('with no status') }}{{ (' with ' ~ fleet_operation.error_code)
         if fleet_operation.error_code | default(none) else '' }}
    quiet: true
- name: Count the tasks the base converge of {{ fleet_node.name }} changed
  vars:
    fleet_operation_changed: "{{ ((fleet_converge_wait.stdout | default('{}', true) | from_json).data.result | default({}, true)).changed | default(none) }}"
  ansible.builtin.set_fact:
    fleet_converge_changed: "{{ fleet_converge_changed | int + (fleet_operation_changed | int if fleet_operation_changed is number else 1) }}"
    # The Nodes whose disk the converge changed: their `base` is retaken, with the nested Gateway's.
    fleet_converge_changed_roles: >-
      {{ fleet_converge_changed_roles + ([fleet_node.name] if fleet_operation_changed is not number or fleet_operation_changed | int > 0 else []) }}
