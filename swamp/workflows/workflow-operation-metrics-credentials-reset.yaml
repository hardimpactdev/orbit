id: 77fef03c-7ee9-4b75-a41c-e52c77a37ed7
name: operation-metrics-credentials-reset
description: Reset the existing Grafana administrator credential on its admitted Node.
concurrency: 1
vaults: []
inputs:
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [metrics.credentials_reset]}
  required: [operation_id, node_id, kind]
jobs:
- name: credentials
  steps:
  - name: reset
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels: {node: '${{ string(inputs.node_id) }}'}
    task:
      type: behavior
      behaviorType: '@nckrtl/metrics-credentials-reset'
      behaviorName: ${{ "metrics-credentials-" + string(inputs.node_id) }}
      methodName: reset
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
