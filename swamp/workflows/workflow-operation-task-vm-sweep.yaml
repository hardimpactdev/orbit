id: aa946b88-1dfe-4010-a85d-bd9ddfe9110a
name: operation-task-vm-sweep
description: Sweep an immutable provider ownership scope on209; no Gateway callbacks.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.sweep_host
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        provider:
          type: string
          enum:
          - incus
          - upcloud
        ci_runner:
          type: boolean
        stray_vm_ids: &id002
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 4096
        image_cutoff:
          type: integer
        running_stamps:
          type: array
          items:
            type: string
        scope:
          type: object
          properties:
            live_names:
              type: array
              items: &id001
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,253}$
              maxItems: 4096
            max_task_vm_id:
              type: integer
              minimum: 0
            project: *id001
            pool: *id001
            operator_owned:
              type: array
              items:
                type: string
              maxItems: 4096
            max_build_id:
              type: integer
              minimum: 0
            recorded_build_ids: *id002
            retired_build_ids: *id002
            protected_build_ids: *id002
          required:
          - live_names
          - max_task_vm_id
          additionalProperties: false
        ssh_execution:
          type:
          - object
          - 'null'
      required:
      - node_id
      - provider
      - ci_runner
      - stray_vm_ids
      - image_cutoff
      - running_stamps
      - scope
      - ssh_execution
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: sweep
  steps:
  - name: incus
    target: orbit-node-209
    guard: ${{ inputs.intent.provider == "upcloud" }}
    task:
      type: workflow
      workflowIdOrName: task-vm-sweep-incus
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: cloud
    target: orbit-node-209
    guard: ${{ inputs.intent.provider != "upcloud" }}
    task:
      type: workflow
      workflowIdOrName: task-vm-sweep-cloud
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: incus
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: cloud
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "swp-result-"+run.id }}
      methodName: execute
      inputs:
        run: 'printf ''%s\n'' "$RESULT"

          '
        env:
          RESULT: '${{ inputs.intent.provider == "incus" ? steps.incus.outputs.result.stdout : steps.cloud.outputs.result.stdout }}'
