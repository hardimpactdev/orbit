---
- name: Check the target worker drain allowance
  ansible.builtin.command:
    argv:
      - timeout
      - '10'
      - busctl
      - get-property
      - org.freedesktop.systemd1
      - "/org/freedesktop/systemd1/unit/orbit_2dswamp_2dworker_40{{ renewal_slot }}_2eservice"
      - org.freedesktop.systemd1.Service
      - TimeoutStopUSec
  register: renewal_stop
  changed_when: false
- name: Require the converged 75 minute drain allowance
  ansible.builtin.assert:
    that:
      - renewal_stop.stdout.split() | length == 2
      - renewal_stop.stdout.split()[0] == 't'
      - renewal_stop.stdout.split()[1] | int >= 4500000000
    fail_msg: The worker unit must converge before renewal can start
# Native verify dispatches a probe and rejects at_capacity. A full peer can
# continue serving its existing work; probe only peers with a spare slot.
- name: Probe peers that have dispatch capacity
  ansible.builtin.include_tasks: swamp-worker-renew-verify.yml
  loop: "{{ renewal_peers }}"
  loop_control: {loop_var: renewal_peer, label: "{{ renewal_peer.name }}"}
  vars:
    renewal_verify_name: "{{ renewal_peer.name }}"
  when: renewal_peer.activeDispatchIds | length < renewal_peer.capacity | int
- name: Refresh the pool after the live probes
  ansible.builtin.command:
    argv: "{{ ['timeout', '30', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  register: renewal_before
  changed_when: false
  no_log: true
- name: Refresh the actual connection times after the live probes
  ansible.builtin.import_tasks: swamp-worker-connections.yml
- name: Read the time immediately before the controlled drain
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", date_time]
    filter: ansible_date_time
- name: Require unchanged accepting instances with full capacity and drain headroom
  ansible.builtin.assert:
    that:
      - renewal_live.status | default('') in renewal_accepting
      - renewal_live.instanceUuid | default('') == item.instanceUuid
      - renewal_live.capacity | default(0) | int >= renewal_capacity | int
      - renewal_connections[item.name] | int <= ansible_date_time.epoch | int
      - >-
        renewal_session_seconds - ((ansible_date_time.epoch | int) -
        renewal_connections[item.name]) > renewal_round_seconds
    fail_msg: >-
      Worker renewal stopped: pool capacity, instance or session headroom changed.
      No controlled drain started; the eight-hour cap risk remains
  loop: "{{ renewal_pool }}"
  loop_control: {label: "{{ item.name }}"}
  vars:
    renewal_live: >-
      {{ (renewal_before.stdout | from_json).workers
      | selectattr('name', 'equalto', item.name) | first | default({}) }}
- name: Require spare admission on the two survivors
  ansible.builtin.assert:
    that:
      - >-
        (renewal_survivors | map(attribute='activeDispatchIds') | map('length') | sum) <
        (renewal_survivors | map(attribute='capacity') | sum)
    fail_msg: 'Deferring renewal: both survivors are full; no drain, retry in five minutes'
  vars:
    renewal_survivors: >-
      {{ (renewal_before.stdout | from_json).workers
      | selectattr('name', 'in', renewal_peers | map(attribute='name') | list) | list }}
- name: Record the drain and its monitoring limit
  ansible.builtin.debug:
    msg: >-
      Draining {{ renewal_slot }} with two permanent workers accepting.
      Peer failure during the blocking restart is checked after restart returns; no next drain until all three accept
# KillMode=mixed sends SIGTERM only to the CLI. Pinned Swamp drains its runners.
- name: Restart only the oldest worker
  ansible.builtin.systemd_service:
    name: "orbit-swamp-worker@{{ renewal_slot }}.service"
    state: restarted
- name: Wait for a different accepting instance
  ansible.builtin.command:
    argv: "{{ ['timeout', '3', renewal_swamp_binary, 'worker', 'list', '--all'] + renewal_remote }}"
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  register: renewal_wait
  changed_when: false
  no_log: true
  retries: 20
  delay: 2
  until: >-
    renewal_wait.rc == 0 and
    (((renewal_wait.stdout | from_json).workers
    | selectattr('name', 'in', renewal_peers | map(attribute='name') | list)
    | selectattr('status', 'in', renewal_accepting) | list | length != 2) or
    ((renewal_wait.stdout | from_json).workers
    | selectattr('name', 'equalto', renewal_current.name)
    | selectattr('status', 'in', renewal_accepting)
    | rejectattr('instanceUuid', 'equalto', renewal_current.instanceUuid)
    | selectattr('instanceUuid') | list | length == 1))
- name: Require the full pool after the blocking restart
  ansible.builtin.assert:
    that:
      - renewal_restored.status | default('') in renewal_accepting
      - renewal_restored.instanceUuid | default('') | length > 0
      - renewal_restored.capacity | default(0) | int >= renewal_capacity | int
    fail_msg: Peer or renewed worker failed during the blocking drain; detected after restart, no further drain
  loop: "{{ renewal_pool }}"
  loop_control: {label: "{{ item.name }}"}
  vars:
    renewal_restored: >-
      {{ (renewal_wait.stdout | from_json).workers
      | selectattr('name', 'equalto', item.name) | first | default({}) }}
- name: Prove the renewed worker accepts dispatches
  ansible.builtin.import_tasks: swamp-worker-renew-verify.yml
  vars: {renewal_verify_name: "{{ renewal_current.name }}"}
