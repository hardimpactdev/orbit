---
- name: Create the endpoint policy program folder
  tags: [always]
  ansible.builtin.file: {path: /usr/local/libexec, state: directory, owner: root, group: root, mode: '0755'}

- name: Read the installed bridge helper without following links
  tags: [always]
  ansible.builtin.stat:
    path: /usr/local/libexec/orbit-instance-bridge
    follow: false
    checksum_algorithm: sha256
  register: bridge_helper_installed

- name: Refuse a bridge helper target symlink
  tags: [always]
  ansible.builtin.assert:
    that: not (bridge_helper_installed.stat.islnk | default(false))
    fail_msg: instance.bridge_helper_target_symlink
    quiet: true

- name: Install a changed bridge helper
  tags: [always]
  vars:
    bridge_helper_sha256: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_bridge.py', rstrip=false) | hash('sha256') }}"
  when: >-
    bridge_helper_installed.stat.checksum | default('') != bridge_helper_sha256
  block:
    - name: Report a planned bridge helper installation
      when: ansible_check_mode
      ansible.builtin.debug:
        msg: Bridge helper would change
      changed_when: true

    - name: Install the verified helper outside check mode
      when: not ansible_check_mode
      block:
        - name: Allocate a bridge helper candidate beside the target
          ansible.builtin.tempfile:
            state: file
            path: /usr/local/libexec
            prefix: .orbit-instance-bridge-
          register: bridge_helper_candidate
          changed_when: false

        - name: Read the candidate without following links
          ansible.builtin.stat:
            path: "{{ bridge_helper_candidate.path }}"
            follow: false
            get_checksum: false
          register: bridge_helper_candidate_before

        - name: Refuse a bridge helper candidate symlink
          ansible.builtin.assert:
            that: not (bridge_helper_candidate_before.stat.islnk | default(false))
            fail_msg: instance.bridge_helper_candidate_symlink
            quiet: true

        - name: Verify and publish the bridge helper candidate
          block:
            - name: Write the bridge helper candidate
              ansible.builtin.copy:
                src: "{{ playbook_dir }}/instance_bridge.py"
                dest: "{{ bridge_helper_candidate.path }}"
                owner: root
                group: root
                mode: '0755'
              changed_when: false

            - name: Read the staged bridge helper checksum
              ansible.builtin.stat:
                path: "{{ bridge_helper_candidate.path }}"
                follow: false
                checksum_algorithm: sha256
              register: bridge_helper_candidate_verified

            - name: Require the expected bridge helper checksum
              ansible.builtin.assert:
                that:
                  - bridge_helper_candidate_verified.stat.isreg | default(false)
                  - bridge_helper_candidate_verified.stat.checksum | default('') == bridge_helper_sha256
                fail_msg: instance.bridge_helper_checksum_mismatch
                quiet: true

            - name: Publish the verified bridge helper atomically
              ansible.builtin.command:
                argv:
                  - mv
                  - "-fT"
                  - "--"
                  - "{{ bridge_helper_candidate.path }}"
                  - /usr/local/libexec/orbit-instance-bridge
              changed_when: true
          always:
            - name: Remove the bridge helper candidate
              ansible.builtin.file:
                path: "{{ bridge_helper_candidate.path }}"
                state: absent
              changed_when: false

- name: Set the installed bridge helper ownership and mode
  tags: [always]
  when: bridge_helper_installed.stat.exists or not ansible_check_mode
  ansible.builtin.file:
    path: /usr/local/libexec/orbit-instance-bridge
    owner: root
    group: root
    mode: '0755'

# One attempt resolves all mappings before writing. The helper never retries; Ansible owns this bounded retry.
- name: Apply admitted bridge endpoint intent
  tags: [always]
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '/usr/local/libexec/orbit-instance-bridge', '--state-dir', '/var/lib/orbit/instance-bridge', '--intent']
         + (['--reconcile'] if bridge_reconcile else [])
         + (['--withdraw'] if bridge_withdraw | default(false) else []) }}
    stdin: >-
      {{ {'network': bridge_network, 'cidr': bridge_cidr, 'endpoints': bridge_endpoints,
          'admitted_at': bridge_admitted_at | int, 'baseline': bridge_baseline | default({})} | to_json }}
  register: bridge_rule_write
  failed_when: false
  changed_when: bridge_rule_write.rc == 0 and (bridge_rule_write.stdout | from_json).changed > 0
  until: >-
    bridge_rule_write.rc == 0 or
    ('412' not in bridge_rule_write.stderr and 'ETag' not in bridge_rule_write.stderr
     and 'precondition' not in bridge_rule_write.stderr | lower
     and 'Unknown or missing host side veth device' not in bridge_rule_write.stderr)
  retries: 4
  delay: 1

- name: Refuse an unresolved bridge endpoint
  tags: [always]
  when: not ansible_check_mode
  ansible.builtin.assert:
    that: bridge_rule_write.rc == 0
    fail_msg: "{{ (bridge_rule_write.stdout | from_json).error_code | default('instance.container_bridge_write_failed') }}"
    quiet: true
