id: 38356821-a5bb-4272-afab-60acf0a9cf22
name: operation-schedule-destroy
queueTimeout: 30
description: Stop and remove a Schedule through official cfgmgmt on 209.
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [schedule.destroy]}
    intent:
      type: object
      properties:
        schedule:
          type: object
          properties: {id: {type: string, format: uuid}}
          required: [id]
        cascade: {type: boolean}
        ssh_execution: {type: object}
      required: [schedule, cascade, ssh_execution]
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: schedule
    labels: {role: swamp}
    steps:
      - name: idle
        labels: {role: swamp}
        guard: ${{ inputs.intent.cascade }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("schedule-idle-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("schedule-idle-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
                transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
          inputs:
            hosts: name:target
            sudo: true
            okExitCodes: [3, 4]
            argv: [timeout, '60', systemctl, is-active, --quiet, '${{ "orbit-schedule-" + inputs.intent.schedule.id + ".service" }}']
      - name: stop_timer
        writes: true
        labels: {role: swamp}
        dependsOn: [{step: idle, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("schedule-stop_timer-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            service: ${{ "orbit-schedule-" + inputs.intent.schedule.id + ".timer" }}
            enabled: false
            ensure: stopped
          inputs: {}
      - name: stop_service
        writes: true
        labels: {role: swamp}
        dependsOn: [{step: stop_timer, condition: {type: succeeded}}]
        guard: ${{ !inputs.intent.cascade }}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("schedule-stop_service-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            service: ${{ "orbit-schedule-" + inputs.intent.schedule.id + ".service" }}
            ensure: stopped
          inputs: {}
      - name: remove_files
        writes: true
        labels: {role: swamp}
        dependsOn:
          - {step: stop_timer, condition: {type: succeeded}}
          - {step: stop_service, condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}
        forEach:
          item: part
          in: '${{ ["timer", "service", "script", "complete"] }}'
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("schedule-remove_files-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
          methodName: apply
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            path: '${{ self.part in ["timer", "service"] ? "/etc/systemd/system/orbit-schedule-" + inputs.intent.schedule.id + "." + self.part : "/etc/orbit/schedules/" + inputs.intent.schedule.id + (self.part == "script" ? ".sh" : ".complete") }}'
            ensure: absent
          inputs: {}
      - name: reload
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: remove_files, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("sch-reload-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("sch-reload-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
                transport: {hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'}
          inputs:
            hosts: name:target
            sudo: true
            argv: [timeout, '60', systemctl, daemon-reload]
      - name: check_files
        labels: {role: swamp}
        dependsOn: [{step: reload, condition: {type: succeeded}}]
        forEach: {item: part, in: '${{ ["timer", "service", "script", "complete"] }}'}
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/file'
          behaviorName: '${{ ("sch-absent-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}'
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            path: '${{ self.part in ["timer", "service"] ? "/etc/systemd/system/orbit-schedule-" + inputs.intent.schedule.id + "." + self.part : "/etc/orbit/schedules/" + inputs.intent.schedule.id + (self.part == "script" ? ".sh" : ".complete") }}'
            ensure: absent
          inputs: {}
      - name: check_timer
        labels: {role: swamp}
        dependsOn: [{step: reload, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("sch-removed-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: check
          globalArgs:
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            service: ${{ "orbit-schedule-" + inputs.intent.schedule.id + ".timer" }}
            enabled: false
            ensure: stopped
          inputs: {}
      - name: Check the removal
        labels: {role: swamp}
        dependsOn:
          - {step: check_files, condition: {type: succeeded}}
          - {step: check_timer, condition: {type: succeeded}}
        task:
          type: assert
          expr: 'steps.filter(name, name.startsWith("check_files-")).size() == 4 && steps.filter(name, name.startsWith("check_files-")).all(name, steps[name].outputs.status == "compliant") && steps.check_timer.outputs.status == "compliant" && !steps.check_timer.outputs.current.loaded'
          message: The Schedule files must be absent and its timer stopped, disabled and unloaded.
          severity: high
