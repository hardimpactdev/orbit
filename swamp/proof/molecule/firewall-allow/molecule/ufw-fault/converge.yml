---
# The commands of the three cases, run on the task VM (the operator side) with the real CLI against the nested Gateway. Swamp does not run them.
# The cases change the ufw program of app-dev, so they run one after the other (serial: 1), in the order of the inventory: interrupted-reorder,
# busy-target, failure-after-partial-change. Each case puts a shim over ufw and, in the `always` section, the real ufw back, so a failed
# case leaves no shim and no fault behind. A failed check is recorded, not raised, so one verdict per case survives. Results stay as
# cacheable facts of the case host (the fact cache of molecule.yml) for verify.yml.
- ansible.builtin.import_playbook: ../default/facts.yml

- name: Run the cases, one at a time
  hosts: case_hosts
  gather_facts: false
  serial: 1
  vars_files: [cases.yml]
  tasks:
    - name: "{{ inventory_hostname }}"
      block:
        - name: "{{ inventory_hostname }}: start the clock and forget the facts of an earlier run"
          ansible.builtin.set_fact:
            case_t0: "{{ now().timestamp() }}"
            failures: ''
            snaps: {}
            cmd_secs: 0
            held_id: ''
            held_end: ''
            cacheable: true

        - name: "{{ inventory_hostname }}: the commands and snapshots of the case"
          ansible.builtin.include_tasks: "{{ 'busy-case.yml' if d.hold is defined else 'fault-case.yml' }}"
      rescue:
        - name: "{{ inventory_hostname }}: record the failed check"
          ansible.builtin.set_fact:
            failures: "{{ 'converge | ' ~ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.msg | default('?')) }}"
            cacheable: true
      always:
        - name: "{{ inventory_hostname }}: the real ufw takes its path back, whatever happened"
          ansible.builtin.include_tasks: shim-remove.yml

        - name: "{{ inventory_hostname }}: keep the evidence for verify"
          ansible.builtin.set_fact:
            tnode: "{{ tnode }}"
            case_secs: "{{ ((now().timestamp() - case_t0 | float) | round(1)) }}"
            cmd_secs: "{{ cmd_secs | default(0) | float | round(1) }}"
            cacheable: true
