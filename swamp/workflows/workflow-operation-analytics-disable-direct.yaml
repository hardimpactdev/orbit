id: 46c6bbed-b4ab-4bdc-9a5b-6251a1ddbe41
name: operation-analytics-disable-direct
description: "Analytics disable in the chart's steps (rule 22)."
vaults: [orbit-control-inputs]
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: analytics.disable}
    intent: {type: object}
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: analytics
  labels: {role: swamp}
  steps:
    # Only outside the TLD: the whole private DNS without the tracking hosts, written by the dns-publish phase.
  - name: 'Remove private DNS'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    forEach: {item: vpn, in: '${{ inputs.intent.dns }}'}
    task:
      type: workflow
      workflowIdOrName: dns-publish
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        node_id: '${{ self.vpn.node_id }}'
        kind: '${{ inputs.kind }}'
        intent:
          node_id: '${{ self.vpn.node_id }}'
          connection:
            nodeHost: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host }}'
            nodeUser: '${{ inputs.intent.nodes[string(self.vpn.node_id)].user }}'
            nodePort: '${{ inputs.intent.nodes[string(self.vpn.node_id)].port }}'
            nodeIdentityFile: '${{ inputs.intent.nodes[string(self.vpn.node_id)].identity_file }}'
            become: true
          host_keys: '${{ inputs.intent.nodes[string(self.vpn.node_id)].host_keys }}'
          dns: '${{ self.vpn.dns }}'
        execution_secrets: {}
    # Each Router and Ingress: the whole Caddyfile without the tracking sites, then their scopes (route-target-retire).
  - name: 'Withdraw sites, certs'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Remove private DNS', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    writes: true
    forEach: {item: node, in: '${{ inputs.intent.retire_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-target-retire
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        kind: '${{ inputs.kind }}'
        parent_run_id: '${{ run.id }}'
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
        signed: []
        execution_secrets: {}
    # The cfgmgmt check of each Node's Caddyfile and certificate state (route-remove-check).
  - name: 'Check the hosts are gone'
    labels: {role: swamp}
    dependsOn:
    - {step: 'Remove private DNS', condition: {type: always}}
    - {step: 'Withdraw sites, certs', condition: {type: always}}
    guard: '${{ steps.exists(k, steps[k].status == "failed") }}'
    forEach: {item: node, in: '${{ inputs.intent.check_nodes.map(n, {"node_id": n}) }}'}
    task:
      type: workflow
      workflowIdOrName: route-remove-check
      inputs:
        intent: '${{ inputs.intent }}'
        node_id: '${{ self.node.node_id }}'
