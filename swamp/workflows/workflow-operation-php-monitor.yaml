id: 553b2e77-c04d-4509-ac8c-2e25836822f6
name: operation-php-monitor
description: Official file application, validation and reload with complete public intent.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        php_runtime:
          type: object
        node_id:
          type: integer
          minimum: 1
          not:
            enum:
            - 1
            - 18
        control_node_id:
          type: integer
          minimum: 1
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
            become:
              type: boolean
              const: true
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
          - become
          additionalProperties: false
      required:
      - php_runtime
      - node_id
      - control_node_id
      - connection
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - execution_secrets
  - intent
  additionalProperties: false
jobs:
- name: publication
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels:
    node: ${{ string(inputs.intent.node_id) }}
  steps:
  - name: probe
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "probe-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          if sudo /usr/bin/test -f "/etc/orbit/php-fpm/$ORBIT_PHP_USER/generated/php-fpm.conf"; then present=true; else present=false;
          fi

          if sudo /usr/bin/test -d "$ORBIT_PHP_HOME/current"; then initial=false; else initial=true; fi

          printf ''{"present":%s,"initial":%s}\n'' "$present" "$initial"'
        env:
          ORBIT_PHP_USER: ${{ inputs.intent.php_runtime.user }}
          ORBIT_PHP_HOME: ${{ inputs.intent.php_runtime.home }}
  - name: input
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/php-monitor-command'
      behaviorName: ${{ "input-" + run.id }}
      methodName: prepare
      inputs:
        runtime: ${{ inputs.intent.php_runtime }}
        observation: ${{ steps.probe.outputs.stdout }}
    dependsOn:
    - step: probe
      condition:
        type: succeeded
  - name: apply-pool
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels:
      node: ${{ string(inputs.intent.control_node_id) }}
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "apply-pool-" + run.id }}
      methodName: apply
      inputs: {}
      globalArgs:
        path: ${{ steps.input.outputs.path }}
        ensure: present
        content: ${{ steps.input.outputs.pool }}
        owner: root
        group: root
        mode: '0644'
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        nodeIdentityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        become: ${{ inputs.intent.connection.become }}
    dependsOn:
    - step: input
      condition:
        type: succeeded
    guard: ${{ !steps.input.outputs.present }}
  - name: validate
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "validate-" + run.id }}
      methodName: execute
      inputs:
        run: sudo --preserve-env=PHP_INI_SCAN_DIR "/usr/sbin/php-fpm$ORBIT_PHP_VERSION" -t --fpm-config "$ORBIT_PHP_MAIN"
        env:
          PHP_INI_SCAN_DIR: ${{ steps.input.outputs.scan_dir }}
          ORBIT_PHP_VERSION: ${{ steps.input.outputs.version }}
          ORBIT_PHP_MAIN: ${{ steps.input.outputs.main }}
    dependsOn:
    - step: apply-pool
      condition:
        type: succeeded
    guard: ${{ !steps.input.outputs.present }}
  - name: reload
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "reload-" + run.id }}
      methodName: execute
      inputs:
        run: sudo /usr/bin/systemctl reload "$ORBIT_PHP_SERVICE"
        env:
          ORBIT_PHP_SERVICE: ${{ steps.input.outputs.service }}
    dependsOn:
    - step: validate
      condition:
        type: succeeded
    guard: ${{ !steps.input.outputs.present }}
- name: completion
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels:
    node: ${{ string(inputs.intent.node_id) }}
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels:
      node: ${{ string(inputs.intent.node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "result-" + run.id }}
      methodName: execute
      inputs:
        run: printf '{"ready":true,"present":%s}\n' "$ORBIT_PHP_PRESENT"
        env:
          ORBIT_PHP_PRESENT: ${{ string(steps.input.outputs.present) }}
