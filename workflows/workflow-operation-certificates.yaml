id: 0eef618f-3b0c-464e-919a-ebb793d6aa9e
name: operation-certificates
description: Claim and execute one certificate kind on the same worker Node.
labels: { pool: migration }
queueTimeout: 60
autoResume: true
trigger:
  schedule: "0,10,20,30,40,50 * * * * *"
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-certificates-discovery
          methodName: discover
          inputs:
            family: operation-certificates
            kinds: ["certificate.converge", "certificate.remove"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.kind }}
        forEach:
          item: kind
          in: "${{ steps.discover.outputs.work.map(item, item.kind) }}"
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-certificates'
          behaviorName: "operation-certificates"
          methodName: execute
          inputs:
            kind: '${{ self.kind }}'
            worker: '${{ run.id + ":" + self.kind }}'
