---
- name: Make the overlap credential folder
  ansible.builtin.file:
    path: "{{ renewal_credentials_dir }}"
    state: directory
    owner: "{{ renewal_credential_owner }}"
    group: "{{ renewal_credential_group }}"
    mode: '0750'
- name: Check for overlap credentials without reading them
  ansible.builtin.stat:
    path: "{{ renewal_credentials_dir }}/{{ item }}.token"
    get_checksum: false
    get_mime: false
  loop: [enrollment, server]
  register: overlap_credentials
- name: Mint missing overlap credentials through official Swamp APIs
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '60', renewal_swamp_binary] +
      (['worker', 'token', 'create', 'swamp-role-' ~ orbit_node_id ~ '-c'] if item.item == 'enrollment'
      else ['access', 'token', 'mint', 'swamp-role-' ~ orbit_node_id ~ '-c-access', '--principal', 'worker:c']) +
      ['--duration', '30d'] + renewal_remote }}
  become: true
  become_user: "{{ orbit_user }}"
  environment: "{{ renewal_environment }}"
  loop: "{{ overlap_credentials.results }}"
  loop_control: {label: "{{ item.item }}"}
  when: not item.stat.exists
  register: overlap_minted
  changed_when: true
  no_log: true
- name: Store new overlap credentials privately on the Node
  ansible.builtin.copy:
    dest: "{{ renewal_credentials_dir }}/{{ item.item.item }}.token"
    content: "{{ (item.stdout | from_json).token }}"
    owner: "{{ renewal_credential_owner }}"
    group: "{{ renewal_credential_group }}"
    mode: '0640'
  loop: "{{ overlap_minted.results }}"
  loop_control: {label: "{{ item.item.item }}"}
  when: not item.skipped | default(false)
  no_log: true
