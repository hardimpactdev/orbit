id: 2c1fb8bb-5e46-4f5e-b742-99e7801684d9
name: operation-route-caddy-delta
description: Compose and publish a Route-owned section delta while preserving unrelated current publications.
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_.-]+$
    execution_secrets:
      type: object
      additionalProperties: false
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
          not:
            enum:
            - 1
            - 18
        user:
          type: string
        before:
          type: object
        after:
          type: object
        direction:
          type: string
          enum:
          - forward
          - restore
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
          required:
          - nodeHost
          - nodeUser
          additionalProperties: false
      required:
      - node_id
      - user
      - before
      - after
      - direction
      - connection
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: admission
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels: &id001
    node: ${{ string(inputs.intent.node_id) }}
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "caddy-delta-assets-" + run.id }}
      methodName: assets
      inputs:
        run_id: ${{ run.id }}
        node_id: ${{ inputs.intent.node_id }}
        user: ${{ inputs.intent.user }}
        before: ${{ inputs.intent.before }}
        after: ${{ inputs.intent.after }}
        direction: ${{ inputs.intent.direction }}
- name: composition
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels: *id001
  steps:
  - name: prepare-input
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: ${{ "caddy-delta-prepare-input-" + run.id }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        become: true
        path: ${{ steps.assets.outputs.stage_path }}
        ensure: present
        mode: '0700'
  - name: copy-input
    target: orbit-node-209
    labels:
      node: '209'
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ "caddy-delta-copy-input-" + run.id }}
      methodName: apply
      globalArgs:
        nodeHost: ${{ inputs.intent.connection.nodeHost }}
        nodeUser: ${{ inputs.intent.connection.nodeUser }}
        become: true
        path: ${{ steps.assets.outputs.input_path }}
        ensure: present
        content: ${{ steps.assets.outputs.input_json }}
        mode: '0600'
    dependsOn:
    - step: prepare-input
      condition:
        type: succeeded
  - name: compose
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-delta-compose-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          sudo --preserve-env=ORBIT_ROUTE_PUBLICATION_META /usr/bin/python3 "${{ steps.assets.outputs.scripts.compose_caddy
          }}"

          '
        env: &id002
          ORBIT_ROUTE_PUBLICATION_META: ${{ steps.assets.outputs.metadata_json }}
    dependsOn:
    - step: copy-input
      condition:
        type: succeeded
  - name: candidate
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/route-publication-command'
      behaviorName: ${{ "caddy-delta-candidate-" + run.id }}
      methodName: publication
      inputs:
        stdout: ${{ steps.compose.outputs.stdout }}
    dependsOn:
    - step: compose
      condition:
        type: succeeded
  dependsOn:
  - job: admission
    condition:
      type: succeeded
- name: publication
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels: *id001
  dependsOn:
  - job: composition
    condition:
      type: succeeded
  steps:
  - name: publish
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: workflow
      workflowIdOrName: operation-route-caddy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        execution_secrets: {}
        intent:
          caddy_publication: ${{ steps.candidate.outputs.publication }}
- name: completion
  target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
  labels: *id001
  dependsOn:
  - job: publication
    condition:
      type: succeeded
  steps:
  - name: cleanup-payload
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-delta-cleanup-payload-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          sudo --preserve-env=ORBIT_ROUTE_PUBLICATION_META /usr/bin/python3 "${{ steps.assets.outputs.scripts.cleanup_payload
          }}"

          '
        env: *id002
    allowFailure: true
  - name: result
    target: ${{ "orbit-node-" + string(inputs.intent.node_id) }}
    labels: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "caddy-delta-result-" + run.id }}
      methodName: execute
      inputs:
        run: 'set -eu

          printf ''%s\n'' "$ORBIT_CADDY_DELTA_RESULT"

          '
        env:
          ORBIT_CADDY_DELTA_RESULT: ${{ steps.candidate.outputs.result_json }}
    dependsOn:
    - step: cleanup-payload
      condition:
        type: succeeded
