---
# The fleet private names of the container's access plan, in the container's /etc/hosts. The container has no DNS server, and the
# egress proxy refuses private names, so each name the plan admits, such as `reverb.orbit` for an attached websocket app, gets the
# exact address the plan admits for it. Orbit owns only the lines between its two markers; an Instance without a name keeps none.
# Inputs: `private_names_root` (the `incus exec ... --` argv as root), `private_names_push` (the `incus --project` argv),
# `private_names_container`, and `private_names` (a list of name, host and port).
- name: Read the container's hosts file
  ansible.builtin.command: { argv: "{{ private_names_root + ['cat', '--', '/etc/hosts'] }}" }
  register: private_names_hosts
  changed_when: false
  failed_when: private_names_hosts.rc != 0 and 'No such file or directory' not in private_names_hosts.stderr

# instance_node_services.py `hosts` is the one renderer of the block; the clone renders it the same way before its copy's first start.
- name: Compose the hosts file with the plan's private names
  ansible.builtin.command:
    argv: [python3, -c, "{{ lookup('ansible.builtin.file', playbook_dir ~ '/instance_node_services.py') }}", hosts]
    stdin: "{{ {'hosts': private_names_hosts.stdout, 'private_names': private_names | default([])} | to_json }}"
  register: private_names_composed
  changed_when: false

- name: Write the changed hosts file
  vars:
    private_names_content: "{{ (private_names_composed.stdout | from_json).content }}"
  when: private_names_content.splitlines() != private_names_hosts.stdout.splitlines()
  ansible.builtin.command:
    argv: >-
      {{ private_names_push + ['file', 'push', '--uid', '0', '--gid', '0', '--mode', '0644', '-',
      private_names_container ~ '/etc/hosts'] }}
    stdin: "{{ private_names_content }}"
    stdin_add_newline: false
  changed_when: true
