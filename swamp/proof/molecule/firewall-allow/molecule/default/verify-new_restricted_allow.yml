---
# new-restricted-allow (main, changes-needed, succeeded). Exclusive in converge: "nothing else changed" compares the whole table of its Node.
# Doctor is its own host in verify.yml, so its wait overlaps the other checks.
- name: new-restricted-allow
  vars:
    allow_row: "{{ rows | select('search', c.port ~ '/tcp +ALLOW IN +' ~ src) | map('regex_replace', row_pattern, '\\1') | map('int') | list }}"
    deny_row: "{{ rows | select('search', 'proof:deny-new_restricted_allow$') | map('regex_replace', row_pattern, '\\1') | map('int') | list }}"
    matching: >-
      {{ rules | selectattr('action', 'equalto', 'allow') | selectattr('protocol', 'equalto', 'tcp') | selectattr('source', 'equalto', src)
      | selectattr('status', 'equalto', 'active') | selectattr('port', 'in', [c.port | int, c.port | string]) | list }}
  block:
    - name: One active record, and the allow line sits above the test deny
      ansible.builtin.assert:
        that: [matching | length == 1, allow_row | length == 1, deny_row | length > 0, allow_row | first < deny_row | first]
        quiet: true
    - name: Nothing else changed in UFW (rows without the port, numbers removed)
      ansible.builtin.assert:
        that: >-
          (ufw_before.split('\n') | select('search', '^\[') | map('regex_replace', '^\[ *[0-9]+\] *', '') | reject('search', c.port | string) | list)
          ==
          (ufw_after.split('\n') | select('search', '^\[') | map('regex_replace', '^\[ *[0-9]+\] *', '') | reject('search', c.port | string) | list)
        quiet: true
    - name: "{{ inventory_hostname }}: the checks of the case ended"
      ansible.builtin.set_fact:
        verified: true
  rescue:
    - name: "{{ inventory_hostname }}: record the failed check"
      ansible.builtin.set_fact:
        verify_failures: "{{ ansible_failed_task.name ~ ' | ' ~ (ansible_failed_result.assertion | default(ansible_failed_result.msg | default('?'))) }}"
