id: 3223de4f-62f3-4b27-a070-0488a1229801
name: operation-dispatch
description: Dispatch claimable kinds; each placed family claims and executes on one Node.
autoResume: true
inputs:
  type: object
  properties:
    work:
      type: array
      items: { type: object }
  required: [work]
jobs:
  - name: operations
    steps:
      - name: execute-${{ self.kind }}
        forEach:
          item: kind
          in: "${{ inputs.work.map(item, item.kind) }}"
        task:
          type: workflow
          workflowIdOrName: "${{ inputs.work.filter(item, item.kind == self.kind)[0].workflow }}"
          inputs:
            kind: "${{ self.kind }}"
            worker: "${{ inputs.work.filter(item, item.kind == self.kind)[0].worker }}"
