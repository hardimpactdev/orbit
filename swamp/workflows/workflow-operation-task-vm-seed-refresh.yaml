id: 9fcf9420-1228-45f0-90ac-a3c432c8671a
name: operation-task-vm-seed-refresh
description: Refresh the topology seed of one task VM host. Boot a builder from the task image with a clone of the current seed, build the ready nested topology in it, stop it, and swap its clone in as the seed. A failed run keeps the old seed; cleanup always runs.
vaults: [orbit-control-inputs]
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: task_vm.seed_refresh}
    intent: {type: object}
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(task-vm-seed-refresh-git-[1-9][0-9]*|swamp-proof-club-api-key)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
- name: boot
  steps:
  - name: Remove a stale builder
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &host
        name: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
        transport: {kind: ssh, user: '${{ inputs.intent.host_ssh_execution.target.user }}', port: '${{ inputs.intent.host_ssh_execution.target.port }}', identityFile: '${{ inputs.intent.host_ssh_execution.identity_file }}'}
        hosts: [{name: host, address: '${{ inputs.intent.host_ssh_execution.target.host }}', transport: {hostKeys: '${{ inputs.intent.host_ssh_execution.target.host_keys }}'}}]
      # The same cleanup script runs here and at the end (tools/task-vm-seed/cleanup-builder.sh, from the intent). It deletes the
      # builder, first renames a `-previous` seed back to a missing current seed, and only then deletes the unpromoted clone.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '330'
        - bash
        - -c
        - '${{ inputs.intent.scripts.cleanup }}'
        - bash
        - '${{ inputs.intent.seed.project }}'
        - '${{ inputs.intent.seed.pool }}'
        - '${{ inputs.intent.builder.name }}'
        - '${{ inputs.intent.seed.building }}'
        - '${{ inputs.intent.seed.previous }}'
        - '${{ inputs.intent.seed.current }}'
        timeoutSec: 340
  - name: Clone the seed
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Remove a stale builder, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # On ZFS the copy is a clone: it costs what the build writes. A host without the current seed fails here, and nothing changed.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '620'
        - flock
        - --wait
        - '600'
        - /run/lock/orbit-task-vm-seed.lock
        - incus
        - --project
        - '${{ inputs.intent.seed.project }}'
        - storage
        - volume
        - copy
        - '${{ inputs.intent.seed.pool + "/" + inputs.intent.seed.current }}'
        - '${{ inputs.intent.seed.pool + "/" + inputs.intent.seed.building }}'
        timeoutSec: 640
  - name: Start the builder
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Clone the seed, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # The instance config on stdin holds the large VM size, the bridge NIC and the seed clone as the disk `topology-seed`.
      # The builder has its address once the Incus agent reports it, and the agent is what the next steps run through.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '300'
        - sh
        - -c
        - |
          set -eu
          incus --project "$1" init --vm -- "$3" "$2"
          incus --project "$1" start "$2"
          incus --project "$1" wait "$2" ipv4 --timeout 120 --interval 1
        - sh
        - '${{ inputs.intent.seed.project }}'
        - '${{ inputs.intent.builder.name }}'
        - '${{ inputs.intent.image.fingerprint }}'
        stdin: '${{ inputs.intent.builder.config_json }}'
        timeoutSec: 310
- name: build
  dependsOn: [{job: boot, condition: {type: succeeded}}]
  steps:
  - name: Fetch the source
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # The GitHub read header reaches Git through its environment, from standard input. It is in no argument and no file.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '300'
        - incus
        - --project
        - '${{ inputs.intent.seed.project }}'
        - exec
        - '${{ inputs.intent.builder.name }}'
        - --
        - runuser
        - -u
        - orbit
        - --
        - sh
        - -c
        - |
          set -eu
          authorization=$(cat)
          export HOME=/home/orbit GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$authorization"
          mkdir -p "$(dirname "$4")"
          git clone --quiet --no-checkout -- "$1" "$4"
          git -C "$4" checkout --quiet -B "$3" "$2"
        - sh
        - '${{ inputs.intent.source.repository }}'
        - '${{ inputs.intent.source.commit }}'
        - '${{ inputs.intent.builder.branch }}'
        - '${{ inputs.intent.builder.checkout }}'
        stdin: '${{ vault.get(inputs.execution_secrets.git_authorization.vault, inputs.execution_secrets.git_authorization.key) }}'
        timeoutSec: 310
  - name: Prepare the builder
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Fetch the source, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # tools/task-vm-seed/prepare-builder.sh of the cloned release. The proof Swamp Club key, for the swamp runs of the
      # reset, arrives on standard input and is installed 0600 for `orbit`; the script also adds the stand-ins for the
      # services a task VM has.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '120'
        - incus
        - --project
        - '${{ inputs.intent.seed.project }}'
        - exec
        - '${{ inputs.intent.builder.name }}'
        - --
        - bash
        - '${{ inputs.intent.builder.checkout + "/tools/task-vm-seed/prepare-builder.sh" }}'
        stdin: '${{ vault.get(inputs.execution_secrets.proof_club.vault, inputs.execution_secrets.proof_club.key) }}'
        timeoutSec: 130
  - name: Install the dependencies
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Prepare the builder, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # The packages the reset copies into its source. No Composer scripts: they write generated files into the tracked tree,
      # and the nested Gateway discovers its packages itself.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '900'
        - incus
        - --project
        - '${{ inputs.intent.seed.project }}'
        - exec
        - '${{ inputs.intent.builder.name }}'
        - --
        - runuser
        - -u
        - orbit
        - --
        - env
        - HOME=/home/orbit
        - PATH=/usr/local/bin:/usr/bin:/bin
        - sh
        - -c
        - |
          set -eu
          for package in packages/php-sdk apps/cli apps/e2e apps/gateway; do
            composer install --working-dir="$1/$package" --no-interaction --no-progress --prefer-dist --no-scripts
          done
        - sh
        - '${{ inputs.intent.builder.checkout }}'
        timeoutSec: 910
  - name: Keep the ready state
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Install the dependencies, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # tools/task-vm-seed/ready-state.sh: check the three complete copies and keep the build's source tree, with the Gateway's
      # `.env`, as the volume `ready-source`. Its one line of output is the JSON object that the Gateway reads.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '600'
        - incus
        - --project
        - '${{ inputs.intent.seed.project }}'
        - exec
        - '${{ inputs.intent.builder.name }}'
        - --
        - bash
        - '${{ inputs.intent.builder.checkout + "/tools/task-vm-seed/ready-state.sh" }}'
        - '${{ inputs.intent.builder.group }}'
        timeoutSec: 610
  - name: Check the ready copies
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Keep the ready state, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # tools/task-vm-seed/check-ready.sh: a throwaway copy of each ready copy boots and answers, and holds no Swamp Club key.
      # The ready copies themselves are never started. Its one line of output lists the roles that passed.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '900'
        - incus
        - --project
        - '${{ inputs.intent.seed.project }}'
        - exec
        - '${{ inputs.intent.builder.name }}'
        - --
        - bash
        - '${{ inputs.intent.builder.checkout + "/tools/task-vm-seed/check-ready.sh" }}'
        timeoutSec: 910
  - name: Stop the builder
    labels: {role: swamp}
    writes: true
    dependsOn: [{step: Check the ready copies, condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # A clean stop: the builder's Incus unmounts the pool, so the seed holds a finished file system.
      inputs:
        hosts: name:host
        sudo: true
        argv: [timeout, '200', incus, --project, '${{ inputs.intent.seed.project }}', stop, '${{ inputs.intent.builder.name }}', --timeout, '180']
        timeoutSec: 210
- name: promote
  dependsOn: [{job: build, condition: {type: succeeded}}]
  steps:
  - name: Promote the seed
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # The only step that changes the seed a claim clones (tools/task-vm-seed/promote-seed.sh, from the intent). It takes the host
      # seed lock that a claim's clone takes, deletes the builder, runs `zfs promote`, ignores HUP, INT and TERM around the two
      # renames, and keeps the old seed as `-previous`, the rollback copy, until the next successful refresh. Standard output is
      # the one JSON line that the Gateway reads.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '400'
        - bash
        - -c
        - '${{ inputs.intent.scripts.promote }}'
        - bash
        - '${{ inputs.intent.seed.project }}'
        - '${{ inputs.intent.seed.pool }}'
        - '${{ inputs.intent.seed.current }}'
        - '${{ inputs.intent.seed.building }}'
        - '${{ inputs.intent.seed.previous }}'
        - '${{ inputs.intent.builder.name }}'
        timeoutSec: 410
- name: cleanup
  dependsOn:
  - {job: boot, condition: {type: always}}
  - {job: build, condition: {type: always}}
  - {job: promote, condition: {type: always}}
  steps:
  - name: Remove the builder
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-vm-seed-host-" + string(inputs.intent.host_node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *host
      # It runs after success, failure and cancellation, and first repairs a promotion that died between its renames. The listings
      # are the read-back for the end check.
      inputs:
        hosts: name:host
        sudo: true
        argv:
        - timeout
        - '330'
        - bash
        - -c
        - '${{ inputs.intent.scripts.cleanup }}'
        - bash
        - '${{ inputs.intent.seed.project }}'
        - '${{ inputs.intent.seed.pool }}'
        - '${{ inputs.intent.builder.name }}'
        - '${{ inputs.intent.seed.building }}'
        - '${{ inputs.intent.seed.previous }}'
        - '${{ inputs.intent.seed.current }}'
        timeoutSec: 340
- name: check
  dependsOn:
  - {job: promote, condition: {type: succeeded}}
  - {job: cleanup, condition: {type: succeeded}}
  steps:
  - name: Check the seed
    labels: {role: swamp}
    task:
      type: assert
      # The ready state check passed, the promotion printed the seed the claims clone, and the host now lists that
      # seed, and no builder and no unpromoted clone.
      expr: 'steps["Keep the ready state"].outputs.exitCode == 0 && steps["Check the ready copies"].outputs.exitCode == 0 && steps["Promote the seed"].outputs.exitCode == 0 && steps["Remove the builder"].outputs.exitCode == 0 && !steps["Remove the builder"].outputs.stdout.split("\n").exists(line, line == inputs.intent.builder.name || line == "custom," + inputs.intent.seed.building) && steps["Remove the builder"].outputs.stdout.split("\n").exists(line, line == "custom," + inputs.intent.seed.current)'
      severity: high
      message: The seed is not refreshed; the ready copies, the promotion or the cleanup is not as admitted.
