  - job: prepare
    condition:
      type: always
  - job: site
    condition:
      type: always
  - job: requests
    condition:
      type: always
  - job: sign
    condition:
      type: always
  - job: certificates
    condition:
      type: always
  - job: records
    condition:
      type: always
  - job: router
    condition:
      type: always
  - job: verify
    condition:
      type: always
  - job: activate
    condition:
