id: a574d7de-b643-4189-bbcc-399785e6bbe0
name: operation-instance-lifecycle
description: Claim a bounded batch of this family on its placed workers.
labels: { pool: migration }
autoResume: true
trigger:
  schedule: "6,36 * * * * *"
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: discover
    steps:
      - name: discover
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-discovery"
          behaviorName: operation-instance-lifecycle-discovery
          methodName: discover
          inputs:
            family: operation-instance-lifecycle
            kinds: ["instance.rename", "instance.destroy", "instance.create", "instance.register", "instance.clone", "instance.transfer", "instance.transfer_rollback"]
            worker: "${{ run.id }}"
  - name: execute
    dependsOn: [{ job: discover, condition: { type: succeeded } }]
    steps:
      - name: execute-${{ self.work.kind }}-${{ self.work.slot }}
        forEach:
          item: work
          in: "${{ has(steps.discover.outputs) ? steps.discover.outputs.work : [] }}"
        task:
          type: behavior
          behaviorType: "@nckrtl/operation-instance-lifecycle"
          behaviorName: '${{ "operation-instance-lifecycle-slot-" + string(self.work.slot) }}'
          methodName: execute
          inputs:
            kind: "${{ self.work.kind }}"
            worker: '${{ self.work.worker }}'
