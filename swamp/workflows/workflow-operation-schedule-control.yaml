id: baa6dafa-1638-4565-a5af-cd7103633c42
name: operation-schedule-control
description: Enable the installed Schedule timer through official cfgmgmt on 209.
vaults: []
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, enum: [schedule.enable]}
    intent:
      type: object
      properties:
        schedule:
          type: object
          properties: {id: {type: string, format: uuid}}
          required: [id]
          additionalProperties: false
        ssh_execution: {type: object}
      required: [schedule, ssh_execution]
      additionalProperties: false
    execution_secrets: {type: object, additionalProperties: false}
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  - name: schedule
    labels: {role: swamp}
    steps:
      - name: timer
        labels: {role: swamp}
        writes: true
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("schedule-enable-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: apply
          globalArgs: &timer_args
            nodeHost: ${{ inputs.intent.ssh_execution.target.host }}
            nodeUser: ${{ inputs.intent.ssh_execution.target.user }}
            nodePort: ${{ inputs.intent.ssh_execution.target.port }}
            nodeIdentityFile: ${{ inputs.intent.ssh_execution.identity_file }}
            become: true
            service: ${{ "orbit-schedule-" + inputs.intent.schedule.id + ".timer" }}
            enabled: true
            ensure: running
          inputs: {}
      - name: check_timer
        labels: {role: swamp}
        dependsOn: [{step: timer, condition: {type: succeeded}}]
        task:
          type: behavior
          behaviorType: '@swamp/cfgmgmt/systemd'
          behaviorName: '${{ ("schedule-enable-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: check
          globalArgs: *timer_args
          inputs: {}
      - name: Check the timer
        labels: {role: swamp}
        dependsOn: [{step: check_timer, condition: {type: succeeded}}]
        task:
          type: assert
          expr: steps.check_timer.outputs.status == "compliant"
          message: The Schedule timer must be enabled and active.
          severity: high
queueTimeout: 30
