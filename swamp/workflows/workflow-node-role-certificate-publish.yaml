id: 4ae59518-f877-4ab7-9a51-069cd462a7ec
name: node-role-certificate-publish
description: 'A fixed role: a Node-made key and CSR, signed from 209, installed by official steps, then a Caddy reload.'
vaults: []
queueTimeout: 30
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string}
    parent_run_id: {type: string, minLength: 1}
    leaf: {type: object}
    ssh: {type: object}
  required: [operation_id, node_id, kind, parent_run_id, leaf, ssh]
  additionalProperties: false
jobs:
- name: certificate
  steps:
    # A root-only folder for the pending key.
  - name: 'Make the key folder'
    labels: {role: swamp}
    dependsOn: []
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("role-cert-work-" + inputs.ssh.name).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ "/var/lib/orbit/role-certificates/" + inputs.leaf.scope + "/" + inputs.leaf.version }}', owner: root, group: root, mode: '0700', ensure: present,
        nodeHost: '${{ inputs.ssh.hosts[0].address }}', nodeUser: '${{ inputs.ssh.transport.user }}', nodePort: '${{ inputs.ssh.transport.port }}',
        nodeIdentityFile: '${{ inputs.ssh.transport.identityFile }}', become: true}
      inputs: {}
    # One openssl req: a Node-local key and the public CSR on stdout; the key never leaves the Node.
  - name: 'Make a CSR on the Node'
    labels: {role: swamp}
    dependsOn: [{step: 'Make the key folder', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh.name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh.name }}'
        transport: '${{ inputs.ssh.transport }}'
        hosts: '${{ inputs.ssh.hosts }}'
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "30", "openssl", "req", "-quiet", "-new", "-newkey", "rsa:2048", "-nodes", "-keyout", "/var/lib/orbit/role-certificates/" + inputs.leaf.scope + "/" + inputs.leaf.version + "/key.pem", "-subj", "/CN=Orbit", "-addext", "subjectAltName=DNS:" + inputs.leaf.domain] }}'
        timeoutSec: 40
    # The one step that calls the Gateway, from 209.
  - name: 'Sign the CSR'
    labels: {role: swamp}
    dependsOn: [{step: 'Make a CSR on the Node', condition: {type: succeeded}}]
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-sign'
      behaviorName: '${{ ("certificate-sign-" + string(inputs.leaf.node_id) + "-" + inputs.leaf.scope.split("/").join("-")).split(".").join("-") }}'
      methodName: sign
      inputs:
        operation_id: '${{ inputs.operation_id }}'
        run_id: '${{ inputs.parent_run_id }}'
        node_id: '${{ inputs.leaf.node_id }}'
        scope: '${{ inputs.leaf.scope }}'
        request: '${{ steps["Make a CSR on the Node"].outputs.stdout }}'
    # The fixed folder Caddy reads, root:caddy 0750.
  - name: 'Make the certificate folder'
    labels: {role: swamp}
    dependsOn: [{step: 'Sign the CSR', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("role-cert-current-" + inputs.ssh.name).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ (inputs.leaf.scope.split("role-")[1] == "gateway" ? "/etc/caddy/orbit-cert-current" : "/etc/caddy/orbit-" + inputs.leaf.scope.split("role-")[1] + "-cert-current") }}', owner: root, group: caddy, mode: '0750', ensure: present,
        nodeHost: '${{ inputs.ssh.hosts[0].address }}', nodeUser: '${{ inputs.ssh.transport.user }}', nodePort: '${{ inputs.ssh.transport.port }}',
        nodeIdentityFile: '${{ inputs.ssh.transport.identityFile }}', become: true}
      inputs: {}
    # One install of the pending key where Caddy reads it, root:caddy 0640.
  - name: 'Install the key'
    labels: {role: swamp}
    dependsOn: [{step: 'Make the certificate folder', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh.name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh.name }}'
        transport: '${{ inputs.ssh.transport }}'
        hosts: '${{ inputs.ssh.hosts }}'
      inputs:
        hosts: name:target
        sudo: true
        argv: '${{ ["timeout", "30", "install", "-o", "root", "-g", "caddy", "-m", "0640", "/var/lib/orbit/role-certificates/" + inputs.leaf.scope + "/" + inputs.leaf.version + "/key.pem", (inputs.leaf.scope.split("role-")[1] == "gateway" ? "/etc/caddy/orbit-cert-current" : "/etc/caddy/orbit-" + inputs.leaf.scope.split("role-")[1] + "-cert-current") + "/" + (inputs.leaf.scope.split("role-")[1] == "websocket" ? "reverb" : inputs.leaf.scope.split("role-")[1]) + ".key"] }}'
        timeoutSec: 40
    # The signed leaf, root:caddy 0640.
  - name: 'Install the certificate'
    labels: {role: swamp}
    dependsOn: [{step: 'Install the key', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("role-cert-pem-" + inputs.ssh.name).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ (inputs.leaf.scope.split("role-")[1] == "gateway" ? "/etc/caddy/orbit-cert-current" : "/etc/caddy/orbit-" + inputs.leaf.scope.split("role-")[1] + "-cert-current") + "/" + (inputs.leaf.scope.split("role-")[1] == "websocket" ? "reverb" : inputs.leaf.scope.split("role-")[1]) + ".pem" }}', content: '${{ "-----BEGIN CERTIFICATE-----" + steps["Sign the CSR"].outputs.stdout.split("-----BEGIN CERTIFICATE-----")[1] }}', owner: root, group: caddy, mode: '0640', ensure: present,
        nodeHost: '${{ inputs.ssh.hosts[0].address }}', nodeUser: '${{ inputs.ssh.transport.user }}', nodePort: '${{ inputs.ssh.transport.port }}',
        nodeIdentityFile: '${{ inputs.ssh.transport.identityFile }}', become: true}
      inputs: {}
    # The Orbit root the Gateway returned, root:caddy 0640.
  - name: 'Install the Orbit root'
    labels: {role: swamp}
    dependsOn: [{step: 'Install the certificate', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: '${{ ("role-cert-root-" + inputs.ssh.name).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ (inputs.leaf.scope.split("role-")[1] == "gateway" ? "/etc/caddy/orbit-cert-current" : "/etc/caddy/orbit-" + inputs.leaf.scope.split("role-")[1] + "-cert-current") + "/root-ca.pem" }}', content: '${{ "-----BEGIN CERTIFICATE-----" + steps["Sign the CSR"].outputs.stdout.split("-----BEGIN CERTIFICATE-----")[2] }}', owner: root, group: caddy, mode: '0640', ensure: present,
        nodeHost: '${{ inputs.ssh.hosts[0].address }}', nodeUser: '${{ inputs.ssh.transport.user }}', nodePort: '${{ inputs.ssh.transport.port }}',
        nodeIdentityFile: '${{ inputs.ssh.transport.identityFile }}', become: true}
      inputs: {}
    # A reload keeps open connections.
  - name: 'Reload Caddy'
    labels: {role: swamp}
    dependsOn: [{step: 'Install the Orbit root', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ inputs.ssh.name }}'
      methodName: exec
      globalArgs:
        name: '${{ inputs.ssh.name }}'
        transport: '${{ inputs.ssh.transport }}'
        hosts: '${{ inputs.ssh.hosts }}'
      inputs:
        hosts: name:target
        sudo: true
        argv: [timeout, '60', systemctl, try-reload-or-restart, caddy]
        timeoutSec: 70
    # The pending key folder, gone after the reload.
  - name: 'Remove the pending key'
    labels: {role: swamp}
    dependsOn: [{step: 'Reload Caddy', condition: {type: succeeded}}]
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/directory'
      behaviorName: '${{ ("role-cert-work-gone-" + inputs.ssh.name).split(".").join("-") }}'
      methodName: apply
      globalArgs: {path: '${{ "/var/lib/orbit/role-certificates/" + inputs.leaf.scope + "/" + inputs.leaf.version }}', ensure: absent,
        nodeHost: '${{ inputs.ssh.hosts[0].address }}', nodeUser: '${{ inputs.ssh.transport.user }}', nodePort: '${{ inputs.ssh.transport.port }}',
        nodeIdentityFile: '${{ inputs.ssh.transport.identityFile }}', become: true}
      inputs: {}
