        - docker
        - inspect
        - --format
        - '{{.State.Running}}'
        - ${{ self.process.name }}
        sudo: true
        timeoutSec: 20
    forEach:
      item: process
      in: ${{ inputs.intent.runtime_definitions.restart.filter(p, p.runtime == "docker") }}
    concurrency: 1
  - name: Read deployed commit
    labels:
      role: swamp
    dependsOn:
    - step: Read current back
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"] && !k.startsWith("Find releases in use") && !k.startsWith("Clean up releases")) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("instance-deploy-read-deployed-commit-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("instance-deploy-read-deployed-commit-" + string(inputs.intent.production.instance_id) + "-" + string(inputs.node_id)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - timeout
        - '30'
        - sudo
        - -n
        - -H
        - -u
        - ${{ inputs.intent.production.user }}
        - --
        - env
        - GIT_CONFIG_NOSYSTEM=1
        - GIT_CONFIG_GLOBAL=/dev/null
        - git
        - -c
        - core.hooksPath=/dev/null
        - -C
        - ${{ inputs.intent.production.release_path }}
        - rev-parse
        - --verify
        - HEAD
        sudo: true
        timeoutSec: 40
  - name: Check the deployment
    labels:
      role: swamp
    dependsOn:
    - step: Read current back
      condition:
        type: always
    - step: Check Process state
      condition:
        type: always
    - step: Read container state
      condition:
        type: always
    - step: Read deployed commit
      condition:
        type: always
    guard: ${{ inputs.intent.deployment.variant != "production" || steps.exists(k, steps[k].status in ["failed", "cancelled"] && !k.startsWith("Find releases in use") && !k.startsWith("Clean up releases")) }}
    task:
      type: assert
      severity: high
      message: The selected release, commit and running services must match the admitted deployment.
      expr: ((steps["Read current back"].outputs.stdout in ["releases/" + inputs.intent.production.release, "releases/" + inputs.intent.production.release + "\n"]) && (inputs.intent.php_input == null || steps["Check PHP runtime"].outputs.status
        == "compliant")) && steps["Read deployed commit"].outputs.stdout.trim() == steps["Read the release commit"].outputs.stdout.trim() && steps.filter(k,k.startsWith("Check Process state-")).all(k,steps[k].outputs.status == "compliant")
        && steps.filter(k,k.startsWith("Read container state-")).all(k,steps[k].outputs.stdout.trim() == "true")
