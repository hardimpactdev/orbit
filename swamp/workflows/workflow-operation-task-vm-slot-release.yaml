id: 75b2193a-23ec-407f-aa13-6721c64cc678
name: operation-task-vm-slot-release
description: Release one task VM slot. Delete its VM and its seed clone from 209 over pinned SSH, keep the identity volume, and assert the host lists no VM and no clone and still lists the volume.
# The slot keeps its Node, keys, tokens and identity volume, so the run holds no secret. The Gateway scrubs its own records after the terminal result.
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, enum: [task_vm.slot_release]}
    intent:
      type: object
    # The run rotates no secret, so the Gateway always sends an empty object.
    execution_secrets:
      type: object
      additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: delete
  steps:
  - name: Delete the VM
    # One forced delete per resource. An absent VM or volume exits 1 and counts as done; the end check proves both gone.
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-slot-release-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-slot-release-" + string(inputs.node_id) }}
        transport: &transport
          kind: ssh
          user: '${{ inputs.intent.host_ssh_execution.target.user }}'
          port: '${{ inputs.intent.host_ssh_execution.target.port }}'
          identityFile: '${{ inputs.intent.host_ssh_execution.identity_file }}'
        hosts: &hosts
        - name: target
          address: '${{ inputs.intent.host_ssh_execution.target.host }}'
          transport:
            hostKeys: '${{ inputs.intent.host_ssh_execution.target.host_keys }}'
      inputs:
        hosts: name:target
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '180', incus, delete, --force, --project, '${{ inputs.intent.vm.project }}', --, '${{ inputs.intent.vm.name }}']
  - name: Delete the seed clone
    labels: {role: swamp}
    writes: true
    dependsOn:
    - step: Delete the VM
      condition: {type: succeeded}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-slot-release-" + string(inputs.node_id) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-slot-release-" + string(inputs.node_id) }}
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        sudo: true
        okExitCodes: [0, 1]
        argv: [timeout, '180', incus, storage, volume, delete, --project, '${{ inputs.intent.vm.project }}', --, '${{ inputs.intent.vm.pool }}', '${{ inputs.intent.vm.seed_clone }}']
- name: check
  dependsOn:
  - job: delete
    condition: {type: succeeded}
  steps:
  - name: Read the host again
    labels: {role: swamp}
    forEach:
      item: read
      in: '${{ ["instances", "volumes"] }}'
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "task-vm-slot-release-read-" + string(inputs.node_id) + "-" + string(self._index) }}
      methodName: exec
      globalArgs:
        name: ${{ "task-vm-slot-release-read-" + string(inputs.node_id) + "-" + string(self._index) }}
        transport: *transport
        hosts: *hosts
      inputs:
        hosts: name:target
        sudo: true
        argv:
        - timeout
        - '60'
        - incus
        - query
        - '${{ self.read == "instances" ? "/1.0/instances?project=" + inputs.intent.vm.project : "/1.0/storage-pools/" + inputs.intent.vm.pool + "/volumes/custom?project=" + inputs.intent.vm.project }}'
  - name: Check the slot is clean
    labels: {role: swamp}
    dependsOn:
    - step: Read the host again
      condition: {type: succeeded}
    task:
      type: assert
      # `incus query` lists `/1.0/.../<name>?project=<p>`; slot names hold no character it encodes. The `?` and `"` ends keep
      # `beast-tvm-1` apart from `beast-tvm-10`.
      expr: '!steps["Read the host again-instances"].outputs.stdout.contains("/" + inputs.intent.vm.name + "?") && !steps["Read the host again-instances"].outputs.stdout.contains("/" + inputs.intent.vm.name + "\"") && !steps["Read the host again-volumes"].outputs.stdout.contains("/" + inputs.intent.vm.seed_clone + "?") && !steps["Read the host again-volumes"].outputs.stdout.contains("/" + inputs.intent.vm.seed_clone + "\"") && (steps["Read the host again-volumes"].outputs.stdout.contains("/" + inputs.intent.vm.identity_volume + "?") || steps["Read the host again-volumes"].outputs.stdout.contains("/" + inputs.intent.vm.identity_volume + "\""))'
      severity: high
      message: task_vm.slot_release_failed
