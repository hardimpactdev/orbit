id: d58dd3f3-ed2f-44ad-bdce-128aa2399481
name: operation-instance-transfer
description: Move one recorded development checkout through official SSH from 209 and the Process and Route children; the Gateway reads the outcome from the run.
queueTimeout: 30
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind: {type: string, const: instance.transfer}
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,255}$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: transfer
  labels:
    role: swamp
  steps:
  - name: Stop source Processes
    labels:
      role: swamp
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    forEach:
      item: member
      in: ${{ inputs.intent.processes.source }}
    task:
      type: workflow
      workflowIdOrName: operation-process-control
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.stop
        intent: ${{ self.member.stop_intent }}
        execution_secrets: {}
  - name: Archive the checkout
    labels:
      role: swamp
    dependsOn:
    - step: Stop source Processes
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-12-" + string(inputs.intent.source.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-3-" + string(inputs.intent.source.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.source.ssh_execution.target.user }}
          port: ${{ inputs.intent.source.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.source.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.source.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.source.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '600'
        - /bin/sh
        - -c
        - set -e; g=$(/usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false -C "$1" rev-parse --absolute-git-dir); c=$(/usr/bin/git -c core.hooksPath=/dev/null
          -c core.fsmonitor=false -C "$1" rev-parse --path-format=absolute --git-common-dir); set -- "$1" "$c" "$g" "$2"; [ ! -e "$2/objects/info/alternates" ] ||
          { echo instance.transfer_source_invalid >&2; exit 3; }; if [ "$3" = "$2" ] && [ -n "$(ls -A -- "$2/worktrees" 2>/dev/null)" ]; then echo instance.transfer_source_shared
          >&2; exit 3; fi; cd -- "$1"; tar --exclude=./.git --exclude="./$5" -cf "$4" .; cd -- "$2"; tar --exclude=./worktrees --exclude=./commondir --exclude=./gitdir
          --exclude=./config.worktree --exclude="*.lock" --transform "s,^\.,.git," -rf "$4" .; if [ "$3" != "$2" ]; then cd -- "$3"; for f in HEAD index ORIG_HEAD
          logs/HEAD; do [ ! -f "$f" ] || tar --transform "s,^,.git/," -rf "$4" "$f"; done; fi; chmod 600 -- "$4"
        - sh
        - ${{ inputs.intent.source.source }}
        - ${{ "/tmp/orbit-transfer-" + run.id + ".tar" }}
        - ${{ inputs.intent.source.environment_relative }}
    writes: true
  - name: Copy the archive to 209
    labels:
      role: swamp
    dependsOn:
    - step: Archive the checkout
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-13-" + string(inputs.intent.source.ssh_execution.target.host)).split(".").join("-") }}
      methodName: copy
      globalArgs:
        name: ${{ ("itr-3-" + string(inputs.intent.source.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.source.ssh_execution.target.user }}
          port: ${{ inputs.intent.source.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.source.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.source.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.source.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-transfer-" + run.id + ".tar" }}
        dst: ${{ "/tmp/orbit-transfer-" + run.id + ".download.tar" }}
        direction: from
  - name: Copy it to the destination
    labels:
      role: swamp
    dependsOn:
    - step: Copy the archive to 209
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-14-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: copy
      globalArgs:
        name: ${{ ("itr-1-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        src: ${{ "/tmp/orbit-transfer-" + run.id + ".download.tar" }}
        dst: ${{ "/tmp/orbit-transfer-" + run.id + ".install.tar" }}
        direction: to
        mode: '0600'
        atomic: true
  - name: Unpack the checkout
    labels:
      role: swamp
    dependsOn:
    - step: Copy it to the destination
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-16-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-1-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '600'
        - /bin/sh
        - -c
        - set -e; [ ! -e "$1" ] && [ ! -L "$1" ] || { echo instance.transfer_destination_exists >&2; exit 3; }; mkdir -p -- "$(dirname -- "$1")"; t=$(mktemp -d "$(dirname
          -- "$1")/.orbit-transfer-XXXXXX"); tar -xf "$2" -C "$t" --no-same-owner; chmod 750 -- "$t"; mv -T -- "$t" "$1"; stat -c "{\"device\":%d,\"inode\":%i,\"path\":\"%n\"}"
          -- "$1"
        - sh
        - ${{ inputs.intent.destination.destination }}
        - ${{ "/tmp/orbit-transfer-" + run.id + ".install.tar" }}
    writes: true
  - name: Make it standalone
    labels:
      role: swamp
    dependsOn:
    - step: Unpack the checkout
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-18-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-1-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.destination.destination }}
        - config
        - core.bare
        - 'false'
  - name: Drop the worktree config
    labels:
      role: swamp
    dependsOn:
    - step: Make it standalone
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-19-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-1-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/git
        - -C
        - ${{ inputs.intent.destination.destination }}
        - config
        - --unset-all
        - core.worktree
        okExitCodes:
        - 0
        - 5
    # The .env is group orbit-env, so the Node agent can report its key names.
  - name: Create the orbit-env group
    labels:
      role: swamp
    dependsOn:
    - step: Drop the worktree config
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/group'
      behaviorName: ${{ ("itr-env-group-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        groupname: orbit-env
        ensure: present
        system: true
        become: true
        nodeHost: ${{ inputs.intent.destination.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.destination.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.destination.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
      inputs: {}
  - name: Write .env
    labels:
      role: swamp
    dependsOn:
    - step: Create the orbit-env group
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/cfgmgmt/file'
      behaviorName: ${{ ("itr-env-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: apply
      globalArgs:
        path: ${{ inputs.intent.destination.environment }}
        ensure: present
        owner: ${{ inputs.intent.destination.ssh_execution.target.user }}
        group: orbit-env
        mode: '0640'
        become: true
        content: ${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}
        nodeHost: ${{ inputs.intent.destination.ssh_execution.target.host }}
        nodeUser: ${{ inputs.intent.destination.ssh_execution.target.user }}
        nodePort: ${{ inputs.intent.destination.ssh_execution.target.port }}
        nodeIdentityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
      inputs: {}
  - name: Run Project setup steps
    labels:
      role: swamp
    dependsOn:
    - step: Write .env
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    writes: true
    forEach:
      item: step
      in: ${{ inputs.intent.setup_steps }}
    concurrency: 1
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-setup-" + string(inputs.intent.destination.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-setup-" + string(inputs.intent.destination.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-") }}
        transport: &id001
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts: &id002
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        timeoutSec: ${{ self.step.timeout_seconds + 5 }}
        argv:
        - /usr/bin/timeout
        - ${{ string(self.step.timeout_seconds) }}
        - /usr/bin/env
        - -C
        - ${{ self.step.directory }}
        - ${{ "ORBIT_INSTANCE_ID=" + string(self.step.instance_id) }}
        - ${{ "ORBIT_INSTANCE_NAME=" + self.step.instance_name }}
        - /bin/sh
        - -c
        - exec /bin/bash -eu -c "$1" >/dev/null
        - sh
        - ${{ self.step.command }}
  - name: Prepare Route workloads
    labels:
      role: swamp
    dependsOn:
    - step: Write .env
      condition:
        type: always
    - step: Run Project setup steps
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    forEach:
      item: workload
      in: ${{ inputs.intent.workloads }}
    task:
      type: workflow
      workflowIdOrName: instance-route-workload
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ self.workload }}
        execution_secrets: {}
  - name: Create, start Processes
    labels:
      role: swamp
    dependsOn:
    - step: Write .env
      condition:
        type: always
    - step: Run Project setup steps
      condition:
        type: always
    - step: Prepare Route workloads
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    forEach:
      item: member
      in: ${{ inputs.intent.processes.destination }}
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.create
        intent: ${{ self.member.intent }}
        execution_secrets: '${{ self.member.secret_field in inputs.execution_secrets ? {"environment":inputs.execution_secrets[self.member.secret_field]} : {} }}'
  - name: Publish the Route
    labels:
      role: swamp
    dependsOn:
    - step: Write .env
      condition:
        type: always
    - step: Run Project setup steps
      condition:
        type: always
    - step: Prepare Route workloads
      condition:
        type: always
    - step: Create, start Processes
      condition:
        type: always
    guard: ${{ steps.exists(n, steps[n].status == "failed") }}
    allowFailure: true
    task:
      type: workflow
      workflowIdOrName: route-mutation-forward
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        parent_run_id: ${{ run.id }}
  - name: Check the destination
    labels:
      role: swamp
    dependsOn:
    - step: Publish the Route
      condition:
        type: always
    guard: ${{ inputs.intent.destination.domain == "" || !(("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the
      Route"].outputs.result.ready) }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-check-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-check-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport: *id001
        hosts: *id002
      inputs:
        hosts: name:target
        timeoutSec: 40
        argv:
        - /usr/bin/timeout
        - '30'
        - /usr/bin/curl
        - -sk
        - -o
        - /dev/null
        - --resolve
        - ${{ inputs.intent.destination.domain + ":443:" + inputs.intent.destination.ssh_execution.target.host }}
        - ${{ "https://" + inputs.intent.destination.domain + "/" }}
  - name: Restore the Route
    labels:
      role: swamp
    dependsOn:
    - step: Publish the Route
      condition:
        type: always
    guard: ${{ (("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready) || !("Unpack
      the checkout" in steps) || steps["Unpack the checkout"].status != "succeeded" }}
    allowFailure: true
    task:
      type: workflow
      workflowIdOrName: route-mutation-restore
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        parent_run_id: ${{ run.id }}
  - name: Restore the source
    labels:
      role: swamp
    dependsOn:
    - step: Restore the Route
      condition:
        type: always
    guard: ${{ ("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready }}
    forEach:
      item: member
      in: ${{ inputs.intent.processes.source }}
    task:
      type: workflow
      workflowIdOrName: operation-process-create
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.create
        intent: ${{ self.member.intent }}
        execution_secrets: '${{ self.member.secret_field in inputs.execution_secrets ? {"environment":inputs.execution_secrets[self.member.secret_field]} : {} }}'
  - name: Remove new Processes
    labels:
      role: swamp
    dependsOn:
    - step: Restore the Route
      condition:
        type: always
    - step: Restore the source
      condition:
        type: always
    guard: ${{ ("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready || !("Unpack
      the checkout" in steps) || steps["Unpack the checkout"].status != "succeeded" || !(("Restore the Route" in steps) && steps["Restore the Route"].status == "succeeded"
      && steps["Restore the Route"].outputs.result.ready) || steps.exists(n,n.startsWith("Restore the source-") && steps[n].status == "failed") }}
    forEach:
      item: member
      in: ${{ inputs.intent.processes.destination }}
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent: ${{ self.member.control_intent }}
        execution_secrets: {}
  - name: Discard the destination
    labels:
      role: swamp
    dependsOn:
    - step: Restore the Route
      condition:
        type: always
    - step: Restore the source
      condition:
        type: always
    - step: Remove new Processes
      condition:
        type: always
    guard: ${{ ("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready || !("Unpack
      the checkout" in steps) || steps["Unpack the checkout"].status != "succeeded" || !(("Restore the Route" in steps) && steps["Restore the Route"].status == "succeeded"
      && steps["Restore the Route"].outputs.result.ready) || steps.exists(n, (n.startsWith("Restore the source-") || n.startsWith("Remove new Processes-")) && steps[n].status
      == "failed") }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-29-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-1-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/timeout
        - '300'
        - /bin/sh
        - -c
        - rm -rf -- "$1"
        - sh
        - ${{ inputs.intent.destination.destination }}
    writes: true
  - name: Remove source Processes
    labels:
      role: swamp
    dependsOn:
    - step: Discard the destination
      condition:
        type: always
    - step: Check the destination
      condition:
        type: always
    guard: ${{ !(("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready) || (inputs.intent.destination.domain
      != "" && (!("Check the destination" in steps) || steps["Check the destination"].status != "succeeded")) }}
    forEach:
      item: member
      in: ${{ inputs.intent.processes.source }}
    task:
      type: workflow
      workflowIdOrName: operation-process-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: process.destroy
        intent: ${{ self.member.control_intent }}
        execution_secrets: {}
  - name: Prepare source retirement
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Discard the destination
      condition:
        type: always
    - step: Remove source Processes
      condition:
        type: always
    - step: Check the destination
      condition:
        type: always
    guard: ${{ !(("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready) || steps.exists(n,n.startsWith("Remove
      source Processes-") && steps[n].status == "failed") || (inputs.intent.destination.domain != "" && (!("Check the destination" in steps) || steps["Check the destination"].status
      != "succeeded")) }}
    task:
      type: behavior
      behaviorType: '@nckrtl/ansible-input'
      behaviorName: ${{ "itr-retire-input-" + string(inputs.node_id) }}
      methodName: write
      inputs:
        intent:
          ssh_execution: ${{ inputs.intent.source.ssh_execution }}
          source_paths: ${{ [inputs.intent.source.source] }}
          checkout_instances: []
        path: ${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}
  - name: Retire the source
    labels:
      role: swamp
    dependsOn:
    - step: Prepare source retirement
      condition:
        type: succeeded
    - step: Discard the destination
      condition:
        type: always
    - step: Remove source Processes
      condition:
        type: always
    - step: Check the destination
      condition:
        type: always
    guard: ${{ !(("Publish the Route" in steps) && steps["Publish the Route"].status == "succeeded" && steps["Publish the Route"].outputs.result.ready) || steps.exists(n,n.startsWith("Remove
      source Processes-") && steps[n].status == "failed") || (inputs.intent.destination.domain != "" && (!("Check the destination" in steps) || steps["Check the destination"].status
      != "succeeded")) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "itr-retire-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags remove "$ORBIT_ANSIBLE/instance-checkout-destroy.yml"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
          ORBIT_ANSIBLE: ${{ steps["Prepare source retirement"].outputs.assets }}
          ANSIBLE_DISPLAY_FAILED_STDERR: '1'
          ANSIBLE_SSH_ARGS: ${{ "-o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts -o StrictHostKeyChecking=yes" }}
    writes: true
  - name: Clean retirement files
    labels:
      role: swamp
    writes: true
    dependsOn:
    - step: Prepare source retirement
      condition:
        type: always
    - step: Retire the source
      condition:
        type: always
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "itr-retire-clean-" + string(inputs.node_id) }}
      methodName: execute
      inputs:
        run: timeout 10 rm -rf -- "$ORBIT_RUN"
        env:
          ORBIT_RUN: ${{ "/tmp/orbit-ansible-" + run.id }}
  - name: Remove the source archive
    labels:
      role: swamp
    dependsOn:
    - step: Retire the source
      condition:
        type: always
    guard: ${{ ! ("Archive the checkout" in steps) || steps["Archive the checkout"].status != "succeeded" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-35-" + string(inputs.intent.source.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-3-" + string(inputs.intent.source.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.source.ssh_execution.target.user }}
          port: ${{ inputs.intent.source.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.source.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.source.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.source.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -f
        - --
        - ${{ "/tmp/orbit-transfer-" + run.id + ".tar" }}
  - name: Remove the copied archive
    labels:
      role: swamp
    dependsOn:
    - step: Remove the source archive
      condition:
        type: always
    guard: ${{ ! ("Copy it to the destination" in steps) || steps["Copy it to the destination"].status != "succeeded" }}
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("itr-36-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
      methodName: exec
      globalArgs:
        name: ${{ ("itr-1-" + string(inputs.intent.destination.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.destination.ssh_execution.target.user }}
          port: ${{ inputs.intent.destination.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.destination.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.destination.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.destination.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - /usr/bin/rm
        - -f
        - --
        - ${{ "/tmp/orbit-transfer-" + run.id + ".install.tar" }}
  - name: Remove the 209 archive
    labels:
      role: swamp
    dependsOn:
    - step: Remove the copied archive
      condition:
        type: always
    guard: ${{ ! ("Copy the archive to 209" in steps) || steps["Copy the archive to 209"].status != "succeeded" }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "itr-37" }}
      methodName: execute
      inputs:
        run: rm -f -- "$ARCHIVE"
        env:
          ARCHIVE: ${{ "/tmp/orbit-transfer-" + run.id + ".download.tar" }}
