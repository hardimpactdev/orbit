id: 33e944fe-e0a1-4e6a-a19d-69103536273b
name: task-vm-provision
description: Provision one admitted Task VM with provider commands and209 official SSH; no guest Swamp
  worker.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.provision
      - tasks.provision
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^(task-vm-(model-key|pi-token|proof-club-key|provider-bootstrap)-[1-9][0-9]*|model-router-(management|anchor)-node-[1-9][0-9]*|task-vm-upcloud-token)$
        required:
        - vault
        - key
        additionalProperties: false
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: provision
  target: orbit-node-209
  steps:
  - name: eligible
    target: orbit-node-209
    task:
      type: assert
      expr: inputs.intent.eligible == true && inputs.intent.provider in ["incus","upcloud"]
      message: Provision requires its admitted provider and eligible VM
  - name: provider-plan
    target: orbit-node-209
    dependsOn:
    - step: eligible
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment-input'
      behaviorName: ${{ "vm-provision-plan-"+run.id }}
      methodName: plan
      inputs:
        provider: ${{ inputs.intent.provider }}
  - name: incus
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-incus
      inputs:
        operation_id: ${{ inputs.operation_id }}
        node_id: ${{ inputs.node_id }}
        kind: ${{ inputs.kind }}
        intent: ${{ inputs.intent }}
    dependsOn:
    - step: eligible
      condition:
        type: succeeded
    guard: ${{ inputs.intent.provider != "incus" }}
  - name: incus-first-visit
    target: orbit-node-209
    dependsOn:
    - step: incus
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: task-vm-incus-first-visit
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
    guard: ${{ inputs.intent.provider != "incus" }}
  - name: cloud
    target: orbit-node-209
    guard: ${{ inputs.intent.provider != "upcloud" }}
    dependsOn:
    - step: eligible
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: task-vm-provider-upcloud
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
        execution_secrets: '${{ inputs.intent.provider == "upcloud" ? {"upcloud":inputs.execution_secrets.upcloud,"bootstrap":inputs.execution_secrets.bootstrap}
          : {} }}'
  - name: guest
    target: orbit-node-209
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment-input'
      behaviorName: ${{ "vm-enrollment-input-"+run.id }}
      methodName: guest
      inputs:
        intent: ${{ inputs.intent }}
        provider: '${{ inputs.intent.provider == "incus" ? steps.incus.outputs.provider : steps.cloud.outputs.provider
          }}'
        public_key: '${{ inputs.intent.provider == "incus" ? steps["incus-first-visit"].outputs["guest-key"].stdout
          : inputs.intent.bootstrap_host_key }}'
    dependsOn:
    - step: eligible
      condition:
        type: succeeded
    - step: incus-first-visit
      condition:
        type: always
    - step: cloud
      condition:
        type: always
  - name: enrollment
    target: orbit-node-209
    dependsOn:
    - step: guest
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: task-vm-enrollment
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
        execution_secrets: ${{ inputs.execution_secrets }}
        guest: ${{ steps.guest.outputs }}
        provider: '${{ inputs.intent.provider == "incus" ? steps.incus.outputs.provider : steps.cloud.outputs.provider
          }}'
  - name: result
    target: orbit-node-209
    dependsOn:
    - step: enrollment
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-enrollment-input'
      behaviorName: ${{ "vm-enrollment-result-"+run.id }}
      methodName: forward
      inputs:
        receipt: ${{ steps.enrollment.outputs.result }}
  - name: cloud-prefix-rollback
    target: orbit-node-209
    guard: ${{ steps["provider-plan"].outputs.provider != "upcloud" }}
    dependsOn:
    - step: result
      condition:
        type: always
    - step: cloud
      condition:
        type: completed
    - step: enrollment
      condition:
        type: skipped
    - step: provider-plan
      condition:
        type: succeeded
    task:
      type: workflow
      workflowIdOrName: task-vm-destroy
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        execution_secrets: '${{ inputs.intent.provider == "upcloud" ? {"model_key":inputs.execution_secrets.model_key,"model_router_management":inputs.execution_secrets.model_router_management,"model_router_anchor":inputs.execution_secrets.model_router_anchor,"upcloud":inputs.execution_secrets.upcloud}
          : {} }}'
        intent:
          task_vm_id: ${{ inputs.intent.task_vm_id }}
          guest_node_id: null
          provider: upcloud
          model_key_required: true
          model_intent: ${{ inputs.intent.model_intent }}
          removal: null
          provider_input:
            task_vm_id: ${{ inputs.intent.task_vm_id }}
            name: ${{ inputs.intent.name }}
            provider: upcloud
            provider_id: '${{ inputs.intent.provider == "upcloud" ? inputs.intent.provider_id : null }}'
            vm: null
            host_ssh_execution: null
