id: 4a2d9dd5-9f83-41d4-b8df-8e46367ed230
name: task-check-ci
description: One bounded Checks observation per pending handoff at each native schedule tick.
trigger:
  schedule: 0 * * * * *
queueTimeout: 30
vaults:
- orbit-control-inputs
jobs:
- name: checks
  labels: {role: swamp}
  steps:
  - name: read-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-ci-read-" + string(self.check.attributes.inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          timeout 30 gh api "$ORBIT_PATH"
        ignoreExitCode: true
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(self.check.attributes.inputs.execution_secrets.checks_token.vault, self.check.attributes.inputs.execution_secrets.checks_token.key)
            }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-check-ci-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          ORBIT_PATH: ${{ "repos/" + self.check.attributes.inputs.intent.repository + "/commits/" + self.check.attributes.result.commit + "/check-runs?filter=latest&per_page=100" }}
    forEach: &id001
      item: check
      in: ${{ data.query('modelType == "@nckrtl/task-check-data" && specName == "pending" && tags.task_check == "pending" && attributes.pending == true')
        }}
  - name: ci-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ ("task-check-ci-data-" + string(self.check.attributes.inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: ci
      inputs:
        pending: ${{ self.check.attributes }}
        read: ${{ steps["read-" + string(self.check.attributes.inputs.operation_id)].outputs }}
    forEach: *id001
    dependsOn:
    - step: read-${{ self.check.attributes.inputs.operation_id }}
      condition:
        type: succeeded
  - name: prepare_remote-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: &id002
        name: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
        transport:
          kind: ssh
          user: ${{ self.check.attributes.inputs.intent.ssh_execution.target.user }}
          port: ${{ self.check.attributes.inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ self.check.attributes.inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ self.check.attributes.inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ self.check.attributes.inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-task-check-ci-" + run.id + "-" + string(self.check.attributes.inputs.operation_id) }}
    dependsOn:
    - step: ci-${{ self.check.attributes.inputs.operation_id }}
      condition: &id003
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.pending || steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.status
      != "succeeded" }}
  - name: snapshot-${{ self.check.attributes.inputs.operation_id }}-index
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=" + "/tmp/orbit-task-check-ci-" + run.id + "-" + string(self.check.attributes.inputs.operation_id) + "/index" }}
        - git
        - -C
        - ${{ self.check.attributes.inputs.intent.checkout_path }}
        - read-tree
        - HEAD
    dependsOn:
    - step: prepare_remote-${{ self.check.attributes.inputs.operation_id }}
      condition: *id003
    guard: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.pending || steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.status
      != "succeeded" }}
    allowFailure: true
  - name: snapshot-${{ self.check.attributes.inputs.operation_id }}-add
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=" + "/tmp/orbit-task-check-ci-" + run.id + "-" + string(self.check.attributes.inputs.operation_id) + "/index" }}
        - git
        - -C
        - ${{ self.check.attributes.inputs.intent.checkout_path }}
        - add
        - --all
    dependsOn:
    - step: snapshot-${{ self.check.attributes.inputs.operation_id }}-index
      condition: *id003
    guard: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.pending || steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.status
      != "succeeded" }}
    allowFailure: true
  - name: snapshot-${{ self.check.attributes.inputs.operation_id }}-tree
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "GIT_INDEX_FILE=" + "/tmp/orbit-task-check-ci-" + run.id + "-" + string(self.check.attributes.inputs.operation_id) + "/index" }}
        - git
        - -C
        - ${{ self.check.attributes.inputs.intent.checkout_path }}
        - write-tree
    dependsOn:
    - step: snapshot-${{ self.check.attributes.inputs.operation_id }}-add
      condition: *id003
    guard: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.pending || steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.status
      != "succeeded" }}
    allowFailure: true
  - name: snapshot-${{ self.check.attributes.inputs.operation_id }}-head
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - git
        - -C
        - ${{ self.check.attributes.inputs.intent.checkout_path }}
        - rev-parse
        - HEAD
    dependsOn:
    - step: snapshot-${{ self.check.attributes.inputs.operation_id }}-tree
      condition: *id003
    guard: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.pending || steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.status
      != "succeeded" }}
    allowFailure: true
  - name: observed-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ ("task-check-ci-data-" + string(self.check.attributes.inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: observed
      inputs:
        value: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs }}
        operation_id: ${{ self.check.attributes.inputs.operation_id }}
        steps: ${{ steps }}
    dependsOn:
    - step: snapshot-${{ self.check.attributes.inputs.operation_id }}-head
      condition:
        type: always
  - name: cleanup_remote-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: '${{ ("task-check-ci-ssh-" + string(self.check.attributes.inputs.intent.ssh_execution.target.node_id)).split(".").join("-") }}'
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - --
        - ${{ "/tmp/orbit-task-check-ci-" + run.id + "-" + string(self.check.attributes.inputs.operation_id) }}
    dependsOn:
    - step: observed-${{ self.check.attributes.inputs.operation_id }}
      condition:
        type: always
    guard: ${{ steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.pending || steps["ci-" + string(self.check.attributes.inputs.operation_id)].outputs.status
      != "succeeded" }}
    allowFailure: true
  - name: settle-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      # The group's record (one pending handoff per group): settle replaces it, so the next tick no longer finds it pending.
      behaviorName: '${{ ("task-check-pending-" + string(self.check.attributes.inputs.intent.group_id)).split(".").join("-") }}'
      methodName: settle
      inputs:
        value: ${{ steps["observed-" + string(self.check.attributes.inputs.operation_id)].outputs }}
    forEach: *id001
    dependsOn:
    - step: observed-${{ self.check.attributes.inputs.operation_id }}
      condition:
        type: succeeded
  - name: revoke_read-${{ self.check.attributes.inputs.operation_id }}
    labels: {role: swamp}
    forEach: *id001
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ ("task-check-revoke-read-" + string(self.check.attributes.inputs.intent.ssh_execution.target.host)).split(".").join("-") }}'
      methodName: execute
      inputs:
        run: |
          timeout 30 gh api --method DELETE installation/token
        timeout: 30000
        env:
          GH_TOKEN: ${{ vault.get(self.check.attributes.inputs.execution_secrets.checks_token.vault, self.check.attributes.inputs.execution_secrets.checks_token.key)
            }}
          GH_CONFIG_DIR: ${{ "/tmp/orbit-task-check-ci-" + run.id + "-gh" }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
    dependsOn:
    - step: settle-${{ self.check.attributes.inputs.operation_id }}
      condition:
        type: succeeded
    guard: ${{ steps["observed-" + string(self.check.attributes.inputs.operation_id)].outputs.pending }}
    allowFailure: true
  - name: collect
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: '${{ "task-check-ci-data" }}'
      methodName: collect
      inputs:
        steps: ${{ steps }}
    dependsOn:
    - step: settle-${{ self.check.attributes.inputs.operation_id }}
      condition:
        type: always
