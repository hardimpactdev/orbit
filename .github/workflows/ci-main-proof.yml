name: Main copy proof
'on':
  push:
    branches:
    - main
  schedule:
  - cron: '*/10 * * * *'
  - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      full_set:
        description: Run all kinds if the proof queue is empty
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: main-copy-proof-consumer
  cancel-in-progress: false
jobs:
  claim:
    if: github.ref == 'refs/heads/main' && vars.ORBIT_MAIN_PROOF_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      sha: ${{ steps.claim.outputs.sha }}
      has_work: ${{ steps.claim.outputs.has_work }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Claim newest main after settling the prior answer
      id: claim
      env:
        GH_TOKEN: ${{ github.token }}
        FULL_SET: ${{ inputs.full_set || false }}
        NIGHTLY: ${{ github.event.schedule == '17 3 * * *' }}
      run: bin/ci-main-queue claim --consumer proof --output "$RUNNER_TEMP/main-queue-claim.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: steps.claim.outputs.has_work == 'true'
      with:
        name: main-queue-claim
        path: ${{ runner.temp }}/main-queue-claim.json
        if-no-files-found: error
        overwrite: true
  proof:
    needs: claim
    if: needs.claim.outputs.has_work == 'true'
    runs-on: ${{ fromJSON(vars.ORBIT_PROOF_RUNNER || '["self-hosted","hardimpact","orbit-shard"]') }}
    timeout-minutes: 275
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.claim.outputs.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: main-queue-claim
        path: ${{ runner.temp }}/main-input
    - name: Request proof on the pinned SHA through the enrolled caller
      env:
        GH_TOKEN: ${{ github.token }}
        PROOF_CHECK_ELIGIBILITY: 'true'
        PROOF_RECEIPT: ${{ runner.temp }}/proof-receipt.json
      run: python3 -I bin/ci-main-proof run --claim "$RUNNER_TEMP/main-input/main-queue-claim.json" --output "$RUNNER_TEMP/proof-receipt.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: proof-receipt
        path: ${{ runner.temp }}/proof-receipt.json
        if-no-files-found: error
        overwrite: true
  report:
    needs:
    - claim
    - proof
    if: always() && needs.claim.outputs.has_work == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.claim.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      continue-on-error: true
      with:
        merge-multiple: true
        path: ${{ runner.temp }}/main-results
    - name: Keep exact proof evidence and mark range coverage honestly
      run: python3 -I bin/ci-main-proof report --claim "$RUNNER_TEMP/main-results/main-queue-claim.json" --receipt "$RUNNER_TEMP/main-results/proof-receipt.json"
        --output "$RUNNER_TEMP/main-queue-report.json" --job-result "$PROOF_JOB_RESULT"
      env:
        PROOF_JOB_RESULT: ${{ needs.proof.result }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: main-queue-report
        path: ${{ runner.temp }}/main-queue-report.json
        if-no-files-found: error
        overwrite: true
    - name: Publish all commit links, then advance the answer marker
      env:
        GH_TOKEN: ${{ github.token }}
      run: bin/ci-main-queue publish --claim "$RUNNER_TEMP/main-results/main-queue-claim.json" --output "$RUNNER_TEMP/main-queue-report.json"
