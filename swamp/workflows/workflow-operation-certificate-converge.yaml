id: d321071e-bf48-44fc-84bc-a67939f587f8
name: operation-certificate-converge
description: One admitted local leaf, visible command actions, and terminal public presence.
writes: true
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - certificate.converge
    intent:
      type: object
      properties:
        leaf:
          type: object
          properties:
            node_id:
              type: integer
              minimum: 1
            scope:
              type: string
              pattern: ^(app-instance-[1-9][0-9]*(-hostname-change)?|route-[1-9][0-9]*(-router(-hostname-change)?|-ingress)?)$
            user:
              type: string
              pattern: ^[a-z_][a-z0-9_-]{0,31}$
            home:
              type: string
            agent_sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            domain:
              type: string
              minLength: 1
              maxLength: 253
            version:
              type: string
              pattern: ^[a-f0-9]{16}$
            root_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
          required:
          - node_id
          - scope
          - user
          - agent_sha256
          - domain
          - version
          - root_hash
          additionalProperties: false
        control_node_id:
          type: integer
          minimum: 1
        connection:
          type: object
          properties:
            nodeHost:
              type: string
            nodeUser:
              type: string
            nodeIdentityFile:
              type: string
          required:
          - nodeHost
          - nodeUser
          - nodeIdentityFile
      required:
      - leaf
      - control_node_id
      - connection
    execution_secrets:
      type: object
      additionalProperties: false
      maxProperties: 0
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: &id001
      node: ${{ string(inputs.intent.control_node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent.leaf }}
  - name: prepare-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: &id002
        name: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.connection.nodeUser }}
          identityFile: ${{ inputs.intent.connection.nodeIdentityFile }}
        hosts:
        - name: target
          address: ${{ inputs.intent.connection.nodeHost }}
      inputs:
        hosts: name:target
        argv:
        - mkdir
        - -p
        - ${{ "/tmp/orbit-certificate-" + run.id }}
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: assets
      condition:
        type: succeeded
  - name: copy-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: copy
      globalArgs: *id002
      inputs:
        hosts: name:target
        src: ${{ steps.assets.outputs.scripts_directory }}
        dst: ${{ "/tmp/orbit-certificate-" + run.id + "/" }}
        direction: to
        recursive: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: prepare-assets
      condition:
        type: succeeded
  - name: request
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/request.py" }}
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: copy-assets
      condition:
        type: succeeded
  - name: request-result
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    writes: true
    dependsOn:
    - step: request
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: decodeRequest
      inputs:
        stdout: ${{ steps.request.outputs.stdout }}
        leaf: ${{ inputs.intent.leaf }}
  - name: sign-http
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: request-result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-sign-http-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: "#!/bin/sh\nset -eu\n/usr/bin/python3 - <<'PYTHON'\nimport json\nimport os\nimport re\nimport ssl\n\
          import sys\nimport urllib.request\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def\
          \ redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\n\ntry:\n    operation\
          \ = os.environ[\"ORBIT_CERTIFICATE_OPERATION_ID\"]\n    run_id = os.environ[\"ORBIT_CERTIFICATE_RUN_ID\"\
          ]\n    if not re.fullmatch(r\"[1-9][0-9]*\", operation):\n        raise ValueError(\"Invalid operation\"\
          )\n    raw = json.loads(os.environ[\"ORBIT_CERTIFICATE_REQUESTS\"])\n    if os.environ[\"ORBIT_CERTIFICATE_MODE\"\
          ] == \"single\":\n        leaf = json.loads(os.environ[\"ORBIT_CERTIFICATE_LEAF\"])\n        raw = [dict(node_id=leaf[\"\
          node_id\"], scope=leaf[\"scope\"], **raw)]\n    else:\n        raw = [record for batch in raw for record\
          \ in batch]\n    if len(raw) > 256:\n        raise ValueError(\"Too many requests\")\n    requests = [record\
          \ for record in raw if record.get(\"state\") == \"request\"]\n    if not requests:\n        print(json.dumps({\"\
          certificates\": []}))\n        sys.exit(0)\n    body = {\"run_id\": run_id, \"requests\": requests}\n\
          \    if os.environ.get(\"ORBIT_CERTIFICATE_RESTORING\") == \"true\":\n        body[\"restoring\"] = True\n\
          \    payload = json.dumps(body).encode()\n    url = (\n        \"https://gateway.orbit/api/v1/direct-operations/\"\
          \n        + operation\n        + \"/certificates/sign\"\n    )\n    request = urllib.request.Request(\n\
          \        url,\n        data=payload,\n        method=\"POST\",\n        headers={\n            \"Content-Type\"\
          : \"application/json\",\n            \"Accept\": \"application/json\",\n        },\n    )\n    context\
          \ = ssl.create_default_context(\n        cafile=\"/usr/local/share/ca-certificates/orbit-managed-root-ca.crt\"\
          \n    )\n    opener = urllib.request.build_opener(\n        NoRedirect(), urllib.request.HTTPSHandler(context=context)\n\
          \    )\n    with opener.open(request, timeout=60) as response:\n        raw_response = response.read(16_777_217)\n\
          \        if len(raw_response) > 16_777_216 or response.status != 200:\n            raise ValueError(\"\
          Invalid signing response\")\n    result = json.loads(raw_response)[\"data\"]\n    print(json.dumps(result))\n\
          except Exception:\n    print(json.dumps({\"error_code\": \"app-dev.certificate_sign_failed\"}))\n    sys.exit(1)\n\
          PYTHON\n"
        env:
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ run.id }}
          ORBIT_CERTIFICATE_MODE: single
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["request-result"].outputs.request_json }}
          ORBIT_CERTIFICATE_LEAF: ${{ steps.assets.outputs.input_json }}
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: signed-result
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: decodeSigned
      inputs:
        leaf: ${{ inputs.intent.leaf }}
        request: ${{ steps["request-result"].outputs.request }}
        stdout: '${{ steps["request-result"].outputs.state == "current" ? ''{"certificates":[]}'' : steps["sign-http"].outputs.stdout
          }}'
    dependsOn:
    - step: sign-http
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: publish
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_SIGNED=" + steps["signed-result"].outputs.signed_json }}
        - /usr/bin/python3
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/publish.py" }}
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: signed-result
      condition:
        type: succeeded
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: trust
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - /usr/bin/python3
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/trust.py" }}
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: publish
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: reload
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - sh
        - -c
        - if systemctl is-active --quiet caddy; then systemctl reload caddy; fi
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: trust
      condition:
        type: succeeded
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: inspect
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - env
        - ${{ "ORBIT_CERTIFICATE_INPUT=" + steps.assets.outputs.input_json }}
        - ${{ "ORBIT_CERTIFICATE_EXPECT_PRESENT=" + "true" }}
        - /usr/bin/python3
        - ${{ "/tmp/orbit-certificate-" + run.id + "/scripts/inspect.py" }}
        sudo: true
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: reload
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: cleanup-assets
    writes: true
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ "certificate-ssh-" + string(inputs.operation_id) }}
      methodName: exec
      globalArgs: *id002
      inputs:
        hosts: name:target
        argv:
        - rm
        - -rf
        - ${{ "/tmp/orbit-certificate-" + run.id }}
    target: ${{ "orbit-node-" + string(inputs.intent.control_node_id) }}
    labels: *id001
    dependsOn:
    - step: inspect
      condition:
        type: succeeded
    allowFailure: true
