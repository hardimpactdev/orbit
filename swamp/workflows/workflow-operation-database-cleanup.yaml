id: 48d7426d-54e7-44cf-b1bf-0706b5a874f5
name: operation-database-cleanup
queueTimeout: 30
description: Admitted SQLite actions through official SSH from209; native recovery and public terminal projection.
writes: true
vaults: []
inputs: {type: object, properties: {operation_id: {type: integer, minimum: 1}, node_id: {type: integer, minimum: 1}, kind: {type: string, enum: [database.sqlite_cleanup]}, intent: {
      type: object}, execution_secrets: {type: object, additionalProperties: false}}, required: [operation_id, node_id, kind, intent, execution_secrets], additionalProperties: false}
jobs:
- name: sqlite
  target: orbit-node-209
  steps:
  - name: cleanup
    target: orbit-node-209
    task:
      type: workflow
      workflowIdOrName: database-sqlite-action
      inputs: {operation_id: '${{ inputs.operation_id }}', node_id: '${{ inputs.node_id }}', kind: '${{ inputs.kind }}', intent: '${{ inputs.intent }}', execution_secrets: '${{ inputs.execution_secrets
          }}', action: cleanup}
  - name: result
    target: orbit-node-209
    dependsOn:
    - {step: cleanup, condition: {type: always}}
    task:
      type: behavior
      behaviorType: '@nckrtl/database-sqlite-command-assets'
      behaviorName: ${{ "dbsm-" + run.id }}
      methodName: result
      inputs: {kind: '${{ inputs.kind }}', expected: [cleanup], steps: '${{ steps }}'}
  - name: accept_result
    target: orbit-node-209
    dependsOn:
    - {step: result, condition: {type: succeeded}}
    task:
      type: assert
      expr: steps.result.outputs.exitCode == 0
      severity: high
      message: SQLite work did not complete.
