id: 6ea35d75-98b1-4769-8c23-49669fc28b06
name: operation-task-vm-dispatch
description: Execute one task VM dispatch with native queue and cancellation defaults.
labels: { pool: migration }
autoResume: true
inputs:
  type: object
  properties:
    kind: { type: string }
    worker: { type: string }
    behavior: { type: string }
  required: [kind, worker, behavior]
reports:
  skip: ["@swamp/workflow-summary"]
jobs:
  - name: execute
    steps:
      - name: execute
        task:
          type: behavior
          behaviorType: '@nckrtl/operation-task-vms'
          behaviorName: '${{ inputs.behavior }}'
          methodName: execute
          inputs:
            kind: '${{ inputs.kind }}'
            worker: '${{ inputs.worker }}'
