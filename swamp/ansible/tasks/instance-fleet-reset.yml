---
# Reset the nested fleet of an Instance container to `base`, then start it (instance-fleet-start.yml, which checks the fleet rules) and
# wait for readiness (instance-fleet-ready.yml): `base` holds a migrated nested Gateway. Input: instance-fleet.yml. A restore takes
# 4 to 8 s on the directory pool; each has 45 s. The restores run one after the other: three parallel restores save a few seconds
# against the minute of readiness after them.
# A restore of a running container starts it again; a stopped one stays stopped, and the start starts it.
- { name: Name the fleet commands, ansible.builtin.import_tasks: instance-fleet.yml }
- name: Restore base
  ansible.builtin.command: { argv: "{{ ['timeout', '45'] + fleet_incus + ['snapshot', 'restore', item, 'base'] }}" }
  loop: "{{ fleet_names }}"
  register: fleet_restore
  changed_when: true
  failed_when: false
- name: Check the restores
  vars:
    fleet_restore_failed: "{{ fleet_restore.results | rejectattr('rc', 'eq', 0) | list }}"
  ansible.builtin.assert:
    that: fleet_restore_failed | length == 0
    fail_msg: >-
      {{ fleet_restore_failed | map(attribute='item') | join(', ') }} did not restore base:
      {{ fleet_restore_failed | map(attribute='stderr') | map('trim') | join('; ') | truncate(400) }}
    quiet: true
- { name: Start the fleet, ansible.builtin.import_tasks: instance-fleet-start.yml }
- { name: Wait for readiness, ansible.builtin.import_tasks: instance-fleet-ready.yml }
