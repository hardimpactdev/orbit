---
# The container branch of the app-dev role on a Node of the build list (docs/reference/compute-drivers.md#prepare-an-instance-container-host).
# The Gateway sends `instances` only for such a Node, so every other Node runs none of this. It shares the kernel, Incus and container
# side with a task container host, then installs the two shared folders and builds the image. It creates no Instance.
# The Node provides the Incus pool: ZFS, where a copy is a clone, or a directory pool on a nested proof Node, where a copy is a full copy.
- name: Read the Instance pool
  ansible.builtin.command: { argv: [incus, query, "--", "/1.0/storage-pools/{{ instances.pool }}"] }
  register: instance_pool_read
  changed_when: false
  failed_when: false

- name: Require the Instance pool
  ansible.builtin.assert:
    that:
      - instance_pool_read.rc == 0
      - (instance_pool_read.stdout | from_json).driver in ['zfs', 'dir']
    fail_msg: "instance.host_unavailable: the Node needs the Incus storage pool {{ instances.pool }}, of driver zfs or dir"
    quiet: true

# The Gateway gives each Node a unique /24 of 10.253.0.0/16, but it does not see the bridges an operator made, such as a CI bridge.
# A range that another interface of the Node holds already refuses before any change.
- name: Read the Node's IPv4 addresses
  ansible.builtin.command: { argv: [ip, -4, -o, addr, show] }
  register: instance_node_addresses
  changed_when: false

- name: Refuse an Instance bridge range that another interface holds
  ansible.builtin.assert:
    that: instance_overlaps | length == 0
    fail_msg: "instance.host_unavailable: the Instance bridge range {{ instances.cidr }} overlaps {{ instance_overlaps | join(', ') }}"
    quiet: true
  vars:
    instance_overlaps: >-
      {%- set ns = namespace(out=[]) -%}
      {%- set c = instances.cidr.split('/') -%}{%- set o = c[0].split('.') | map('int') | list -%}
      {%- set first = ((o[0] * 256 + o[1]) * 256 + o[2]) * 256 + o[3] -%}{%- set last = first + 2 ** (32 - (c[1] | int)) - 1 -%}
      {%- for line in instance_node_addresses.stdout_lines -%}
        {%- set f = line.split() -%}
        {%- if f | length > 3 and f[2] == 'inet' and f[1] != instances.network -%}
          {%- set a = f[3].split('/') -%}{%- set q = a[0].split('.') | map('int') | list -%}
          {%- set size = 2 ** (32 - (a[1] | int)) -%}{%- set ip = ((q[0] * 256 + q[1]) * 256 + q[2]) * 256 + q[3] -%}
          {%- set start = ip - ip % size -%}
          {%- if start <= last and first <= start + size - 1 -%}{%- set ns.out = ns.out + [f[1] ~ ' ' ~ f[3]] -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Prepare the kernel and Incus for Instance containers
  ansible.builtin.include_tasks: task-container-host-system.yml
  vars:
    container_host: &instance_host
      kind: instances
      fail: instance.host_unavailable
      incus: "{{ instances.incus }}"
      ids: "{{ instances.ids }}"
      # An Instance container runs no WireGuard, Docker or nested bridges.
      modules: []
      project: "{{ instances.project }}"
      network: "{{ instances.network }}"
      address: "{{ instances.address }}"
      alias: "{{ instances.stock }}"
      pool: "{{ instances.pool }}"
      probe: "{{ (instance_pool_read.stdout | from_json).driver == 'zfs' }}"
    container_sysctls:
      fs.inotify.max_queued_events: 1048576
      fs.inotify.max_user_instances: 1048576
      fs.inotify.max_user_watches: 1048576
      kernel.keys.maxkeys: 2000
      kernel.keys.maxbytes: 2000000
      vm.max_map_count: 262144

# The cap the system part sized from memory, never above the cap the Node already runs. A task VM host keeps the ARC its task side
# sets (`instances.arc` is false there), so the Instance side never changes a cap that the host's task VMs run with.
- name: Keep the ZFS ARC within the Node's budget
  when: (instance_pool_read.stdout | from_json).driver == 'zfs' and instances.arc | default(true) | bool
  block:
    - name: Keep the ARC cap after reboot
      ansible.builtin.copy:
        dest: /etc/modprobe.d/orbit-instances-zfs.conf
        content: "# Orbit Instance container host: reserve RAM for host services.\noptions zfs zfs_arc_max={{ container_arc_max }}\n"
        owner: root
        group: root
        mode: "0644"
    - name: Read the running ARC cap
      ansible.builtin.slurp: { src: /sys/module/zfs/parameters/zfs_arc_max }
      register: instance_arc
    - name: Apply the ARC cap now
      when: (instance_arc.content | b64decode | trim) != (container_arc_max | string)
      ansible.builtin.command:
        argv: [tee, /sys/module/zfs/parameters/zfs_arc_max]
        stdin: "{{ container_arc_max }}"
      changed_when: true

- name: Install the shared folders
  ansible.builtin.include_tasks: instance-folder.yml
  loop: [runtime, agent]
  loop_control: { loop_var: folder_name }
  vars:
    folder: "{{ instances.folders[folder_name] }}"

# The project lets containers mount only the two folders, read-only and idmapped, and publish T3 with a proxy device. Every
# container gets an isolated ID map. The bridge reaches nothing by default: each Instance's own paths come with its create flow.
- name: Prepare the Instance bridge, project and profile
  ansible.builtin.include_tasks: task-container-host-prepare.yml
  vars:
    container_host: *instance_host
    container_acl_name: "{{ instances.network }}-egress"
    # Incus applies a bridge ACL to traffic to the Node too: the one way out is the model forwarder on the bridge's own address,
    # which the image's nftables admits only for `agent`.
    container_acl_rules:
      description: Orbit Instance boundary
      egress:
        - action: allow
          destination: "{{ instances.address.split('/')[0] }}/32"
          protocol: tcp
          destination_port: "{{ instances.forwarder_port | string }}"
          state: enabled
      ingress: []
    container_network_config:
      ipv4.dhcp.ranges: "{{ instances.dhcp_range }}"
      ipv4.nat: 'true'
      ipv6.address: none
      security.acls: "{{ instances.network }}-egress"
      security.acls.default.ingress.action: reject
      security.acls.default.egress.action: reject
    container_network_args: >-
      {{ container_network_config | dict2items | map(attribute='key') | zip(container_network_config.values()) | map('join', '=') | list }}
    # Every process in a container gets the runtime folder's environment: `incus exec` sessions, units and login shells alike.
    container_profile_config: "{{ instances.profile_config }}"
    container_devices:
      root: { type: disk, path: /, pool: "{{ instances.pool }}" }
      eth0: { type: nic, name: eth0, network: "{{ instances.network }}", security.port_isolation: 'true' }
      orbit-runtime:
        { type: disk, source: "{{ instances.folders.runtime.path }}", path: "{{ instances.folders.runtime.path }}", readonly: 'true', shift: 'true' }
      orbit-agent:
        { type: disk, source: "{{ instances.folders.agent.path }}", path: "{{ instances.folders.agent.path }}", readonly: 'true', shift: 'true' }
    container_restrictions:
      restricted: 'true'
      restricted.networks.access: "{{ instances.network }}"
      restricted.containers.privilege: isolated
      restricted.devices.disk: allow
      restricted.devices.disk.paths: "{{ instances.folders.runtime.path }},{{ instances.folders.agent.path }}"
      restricted.devices.proxy: allow
      restricted.snapshots: allow
      limits.virtual-machines: '0'

- name: Build the Instance image
  ansible.builtin.include_tasks: instance-image.yml
