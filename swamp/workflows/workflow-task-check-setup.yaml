id: 9c1e34b9-9284-55ec-9c37-844e90c1a203
name: task-check-setup
description: Run each baseline setup command in order as one SSH exec argv.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    intent:
      type: object
    execution_secrets:
      type: object
      propertyNames:
        enum:
        - github_token
        - checks_token
      maxProperties: 2
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-check-(write|read)-[a-f0-9-]{36}$
        required:
        - vault
        - key
        additionalProperties: false
    kind:
      type: string
    run_id:
      type: string
    prepared:
      type: object
  required:
  - operation_id
  - node_id
  - intent
  - execution_secrets
  - kind
  - run_id
  - prepared
  additionalProperties: false
jobs:
- name: setup
  labels:
    role: swamp
  steps:
  - name: setup-${{ self._index }}
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@swamp/ssh'
      behaviorName: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host) + "-" + string(self._index)).split(".").join("-")
        }}
      methodName: exec
      globalArgs:
        name: ${{ ("task-check-ssh-" + string(inputs.intent.ssh_execution.target.host)).split(".").join("-") }}
        transport:
          kind: ssh
          user: ${{ inputs.intent.ssh_execution.target.user }}
          port: ${{ inputs.intent.ssh_execution.target.port }}
          identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
        hosts:
        - name: target
          address: ${{ inputs.intent.ssh_execution.target.host }}
          transport:
            hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
      inputs:
        hosts: name:target
        okExitCodes: any
        timeoutSec: ${{ self.setup.timeout_seconds }}
        argv: ${{ inputs.prepared.setup[self._index] }}
    forEach:
      item: setup
      in: ${{ inputs.intent.setup }}
    concurrency: 1
    guard: ${{ self._index > 0 && (!("setup-" + string(self._index - 1) in steps) || !("outputs" in steps["setup-" + string(self._index
      - 1)]) || steps["setup-" + string(self._index - 1)].outputs.exitCode != 0) }}
    writes: true
  - name: setup_result
    labels:
      role: swamp
    task:
      type: behavior
      behaviorType: '@nckrtl/task-check-data'
      behaviorName: ${{ "task-check-setup_result" }}
      methodName: setup
      inputs:
        intent: ${{ inputs.intent }}
        prepared: ${{ inputs.prepared }}
        steps: ${{ steps }}
    dependsOn:
    - step: setup-${{ self._index }}
      condition:
        type: always
queueTimeout: 30
