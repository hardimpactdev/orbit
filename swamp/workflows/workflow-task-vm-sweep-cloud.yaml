id: e7de7f6f-f9ef-48f7-91d7-05a05deec696
name: task-vm-sweep-cloud
description: Sweep UpCloud from 209 with inline API requests; selection stays in TypeScript.
vaults:
- orbit-control-inputs
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - task_vm.sweep_host
    intent:
      type: object
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault:
            type: string
            enum:
            - orbit-control-inputs
          key:
            type: string
            pattern: ^task-vm-upcloud-token$
        required:
        - vault
        - key
        additionalProperties: false
      propertyNames:
        enum:
        - upcloud
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: inventory
  steps:
  - name: inventory
    labels: {role: swamp}
    task: &inventory
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-read" }}'
      methodName: execute
      inputs:
        run: |
          set -eu
          upcloud() {
            curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
              --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
              --header 'Accept: application/json' "https://api.upcloud.com/1.3/$1"
          }
          vms=$(upcloud 'server?label=orbit-task-vm')
          images=$(upcloud 'server?label=orbit-task-image')
          templates=$(upcloud storage/template)
          printf '{"vms":%s,"images":%s,"templates":%s}\n' "$vms" "$images" "$templates"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
  - name: plan
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: '${{ "task-vm-sweep-plan" }}'
      methodName: cloud_plan
      inputs:
        intent: ${{ inputs.intent }}
        stdout: ${{ steps.inventory.outputs.stdout }}
    dependsOn:
    - step: inventory
      condition:
        type: succeeded
- name: stop
  dependsOn:
  - job: inventory
    condition:
      type: succeeded
  steps:
  - name: stop-server
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-stop-" + string(self._index) }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request POST --header 'Content-Type: application/json' --data '{"stop_server":{"stop_type":"hard"}}' \
            "https://api.upcloud.com/1.3/server/$ORBIT_UUID/stop"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ self.server.uuid }}
    forEach:
      item: server
      in: ${{ steps.plan.outputs.stops }}
- name: remove
  dependsOn:
  - job: stop
    condition:
      type: succeeded
  steps:
  - name: remove-server
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-remove-server-" + string(self._index) }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request DELETE "https://api.upcloud.com/1.3/server/$ORBIT_UUID?storages=1&backups=delete"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ self.server.uuid }}
    forEach:
      item: server
      in: ${{ steps.plan.outputs.servers }}
  - name: remove-template
    labels: {role: swamp}
    writes: true
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-upcloud-remove-template-" + string(self._index) }}'
      methodName: execute
      inputs:
        run: |
          curl --silent --show-error --fail --proto =https --max-redirs 0 --max-time 60 \
            --variable %ORBIT_UPCLOUD_TOKEN --expand-header 'Authorization: Bearer {{ORBIT_UPCLOUD_TOKEN}}' \
            --request DELETE "https://api.upcloud.com/1.3/storage/$ORBIT_UUID"
        env:
          ORBIT_UPCLOUD_TOKEN: ${{ vault.get(inputs.execution_secrets.upcloud.vault, inputs.execution_secrets.upcloud.key) }}
          ORBIT_UUID: ${{ self.template.uuid }}
    forEach:
      item: template
      in: ${{ steps.plan.outputs.templates }}
- name: observe
  dependsOn:
  - job: remove
    condition:
      type: succeeded
  steps:
  - name: after
    labels: {role: swamp}
    task: *inventory
  - name: format
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-sweep-input'
      behaviorName: '${{ "task-vm-sweep-format" }}'
      methodName: cloud_result
      inputs:
        servers: ${{ steps.plan.outputs.servers }}
        templates: ${{ steps.plan.outputs.templates }}
        stdout: ${{ steps.after.outputs.stdout }}
    dependsOn:
    - step: after
      condition:
        type: succeeded
  - name: result
    labels: {role: swamp}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: '${{ "task-vm-sweep-result" }}'
      methodName: execute
      inputs:
        run: |
          printf '%s\n' "$RESULT"
        env:
          RESULT: ${{ steps.format.outputs.result_json }}
    dependsOn:
    - step: format
      condition:
        type: succeeded
queueTimeout: 60
