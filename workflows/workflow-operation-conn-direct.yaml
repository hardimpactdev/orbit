id: 05fa3d80-677d-4927-a5a3-1f0b7aeddb13
name: operation-conn-direct
description: Direct conn intent; private credentials never become workflow input.
vaults: []
inputs:
  properties:
    operation_id: { type: integer, minimum: 1 }
    node_id: { type: integer, minimum: 1 }
    kind: {
      type: string,
      enum: [conn.pairing_create],
    }
  required: [operation_id, node_id, kind]
jobs:
  - name: conn
    target: '${{ "orbit-node-" + string(inputs.node_id) }}'
    labels: { node: '${{ string(inputs.node_id) }}' }
    steps:
      - name: apply
        writes: true
        task:
          type: behavior
          behaviorType: "@nckrtl/conn-direct"
          behaviorName: '${{ "conn-operation-" + string(inputs.operation_id) }}'
          methodName: apply
          globalArgs:
            caFile: /usr/local/share/ca-certificates/orbit-root.crt
          inputs:
            operation_id: "${{ inputs.operation_id }}"
            node_id: "${{ inputs.node_id }}"
            kind: "${{ inputs.kind }}"
            run_id: "${{ run.id }}"
