---
# The move of a checkout Instance into a container on its app-dev Node (docs/cli/instance/migrate.mmd). Temporary: it goes when the
# last checkout Instance has moved (docs/reference/old-paths.md). The container itself is made by the phases of
# instance-container.yml, which this playbook does not repeat: `container`, `workspace`, `agent`, `processes`, `t3`, `register`
# and `seed`. One tagged part per Swamp phase here:
#   `container`: preflight, discard a prior failed container, shared container create and target probes, while the checkout serves.
#   `quiesce`: repeat the checks, stop the host writers, then the Route shows the wake page.
#   `files`: after `workspace`, the checkout's changed, untracked and ignored files, and the T3 proxy of a non-default Instance.
#   `retire`: after the Route has moved, the checkout goes and the Route serves again.
#   `restore`: after a failure, the new container and what the move added go, and the checkout serves again.
# The intent is the Gateway's admitted intent in the run folder: `intent.container` as for a create, `intent.migrate` for the checkout.
# `quiesce` and `files` write `result.json` in the run folder as the container phases do; a failed phase writes its public error code.
- name: Pin the Node and address it
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    run: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}"
    intent: "{{ lookup('ansible.builtin.file', run ~ '/intent.json') | from_json }}"
    address_target: "{{ intent.ssh_execution.target }}"
    address_identity: "{{ intent.ssh_execution.identity_file }}"
    address_group: migrate_node
  tasks:
    - name: Address the Node
      ansible.builtin.import_tasks: tasks/address-node.yml

- name: Run one phase of the move
  hosts: migrate_node
  gather_facts: false
  become: true
  tags: [container, quiesce, files, retire, restore-check, restore]
  vars:
    intent: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/intent.json') | from_json }}"
    container: "{{ intent.container }}"
    migrate: "{{ intent.migrate }}"
    run_id: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN_ID') }}"
    phase: "{{ ansible_run_tags | first }}"
    migrate_quiesced: >-
      {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'ORBIT_RUN') ~ '/quiesced', errors='ignore')
         | default('', true) | trim == 'true' or (intent.restore_quiesced | default(false) | bool) }}
  tasks:
    - name: Run the phase
      block:
        # Swamp runs one tag at a time; the included tasks run whatever their own tags, so `always` applies to them.
        - name: Run the phase's tasks
          ansible.builtin.include_tasks:
            file: tasks/instance-migrate-phase.yml
            apply: { tags: [always] }
        - name: Write the result
          when: phase in ['container', 'quiesce', 'files']
          ansible.builtin.copy:
            content: "{{ {'commit': migrate_commit | default(none)} | to_json }}"
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          # The result file lives in the run folder on the worker: no change to the Node.
          changed_when: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      rescue:
        # The code of a refusal is the fail_msg of its assert; anything else is the phase's own failure. A failed restore keeps
        # the code of the phase that failed before it.
        - name: Write the failure
          when: phase != 'restore' or (intent.restore_only | default(false) | bool)
          ansible.builtin.copy:
            content: >-
              {{ ({'error_code': migrate_refusal_code, 'error_message': migrate_refusal_message,
                   'preflight_refused': phase == 'container' and not (migrate_preflight_passed | default(false))}
                  if migrate_refusal_message is defined else {'error_code': ansible_failed_result.msg
                  if (ansible_failed_result.msg | default('') is match('^[a-z]+\.[a-z0-9_]+$'))
                  else 'instance.migrate_' ~ phase ~ '_failed'})
                  | combine({'preflight_refused': true} if phase == 'container' and not (migrate_preflight_passed | default(false)) else {}) | to_json }}
            dest: "{{ lookup('ansible.builtin.env', 'ORBIT_RUN') }}/result.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          vars:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Fail the phase
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The phase of the move failed.') }}"
      always:
        # Once the Route has moved, the container serves even if retirement refuses or fails. A failed restore keeps its old
        # failure behavior; a refused preflight ends the host before any restore action.
        - name: Let the Route serve again
          when: >-
            (phase == 'retire' and (migrate_claim.rc | default(0)) == 0) or
            (phase == 'restore' and migrate_quiesced | bool and ansible_failed_result is not defined)
          block:
            - name: Make the marker folder
              ansible.builtin.file: { path: "{{ migrate.awake.directory }}", state: directory, owner: root, group: caddy, mode: "0755" }
            - name: Write the awake marker
              ansible.builtin.copy: { content: "", dest: "{{ migrate.awake.path }}", mode: "0644", force: false }

  handlers:
    - name: Load the shared container handlers
      ansible.builtin.import_tasks: tasks/instance-container-handlers.yml
    - name: Reload the retired Process units
      ansible.builtin.systemd_service: { daemon_reload: true }
