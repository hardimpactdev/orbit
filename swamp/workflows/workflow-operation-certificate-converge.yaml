id: d321071e-bf48-44fc-84bc-a67939f587f8
name: operation-certificate-converge
description: One admitted local leaf, visible command actions, and terminal public presence.
writes: true
vaults: []
inputs:
  type: object
  properties:
    operation_id:
      type: integer
      minimum: 1
    node_id:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - certificate.converge
    intent:
      type: object
      properties:
        node_id:
          type: integer
          minimum: 1
        scope:
          type: string
          pattern: ^(app-instance-[1-9][0-9]*(-hostname-change)?|route-[1-9][0-9]*(-router(-hostname-change)?|-ingress)?)$
        user:
          type: string
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        home:
          type: string
        agent_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        domain:
          type: string
          minLength: 1
          maxLength: 253
        version:
          type: string
          pattern: ^[a-f0-9]{16}$
        root_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - node_id
      - scope
      - user
      - agent_sha256
      - domain
      - version
      - root_hash
      additionalProperties: false
    execution_secrets:
      type: object
      additionalProperties: false
      maxProperties: 0
  required:
  - operation_id
  - node_id
  - kind
  - intent
  - execution_secrets
  additionalProperties: false
jobs:
- name: certificate
  steps:
  - name: assets
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: read
      inputs:
        node_id: ${{ inputs.node_id }}
        intent: ${{ inputs.intent }}
  - name: request
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    dependsOn:
    - step: assets
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-request-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: sudo -n --preserve-env=ORBIT_CERTIFICATE_INPUT /usr/bin/python3 "${{ steps.assets.outputs.request_script }}"
        env:
          ORBIT_CERTIFICATE_INPUT: ${{ steps.assets.outputs.input_json }}
  - name: request-result
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    dependsOn:
    - step: request
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: decodeRequest
      inputs:
        stdout: ${{ steps.request.outputs.stdout }}
        leaf: ${{ inputs.intent }}
  - name: sign-http
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    dependsOn:
    - step: request-result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-sign-http-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: "#!/bin/sh\nset -eu\n/usr/bin/python3 - <<'PYTHON'\nimport json\nimport os\nimport re\nimport ssl\nimport sys\n\
          import urllib.request\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,\
          \ req, fp, code, msg, headers, newurl):\n        return None\n\n\ntry:\n    operation = os.environ[\"ORBIT_CERTIFICATE_OPERATION_ID\"\
          ]\n    run_id = os.environ[\"ORBIT_CERTIFICATE_RUN_ID\"]\n    if not re.fullmatch(r\"[1-9][0-9]*\", operation):\n\
          \        raise ValueError(\"Invalid operation\")\n    raw = json.loads(os.environ[\"ORBIT_CERTIFICATE_REQUESTS\"\
          ])\n    if os.environ[\"ORBIT_CERTIFICATE_MODE\"] == \"single\":\n        leaf = json.loads(os.environ[\"ORBIT_CERTIFICATE_LEAF\"\
          ])\n        raw = [dict(node_id=leaf[\"node_id\"], scope=leaf[\"scope\"], **raw)]\n    else:\n        raw = [record\
          \ for batch in raw for record in batch]\n    if len(raw) > 256:\n        raise ValueError(\"Too many requests\"\
          )\n    requests = [record for record in raw if record.get(\"state\") == \"request\"]\n    if not requests:\n   \
          \     print(json.dumps({\"certificates\": []}))\n        sys.exit(0)\n    body = {\"run_id\": run_id, \"requests\"\
          : requests}\n    if os.environ.get(\"ORBIT_CERTIFICATE_RESTORING\") == \"true\":\n        body[\"restoring\"] =\
          \ True\n    payload = json.dumps(body).encode()\n    url = (\n        \"https://gateway.orbit/api/v1/direct-operations/\"\
          \n        + operation\n        + \"/certificates/sign\"\n    )\n    request = urllib.request.Request(\n        url,\n\
          \        data=payload,\n        method=\"POST\",\n        headers={\n            \"Content-Type\": \"application/json\"\
          ,\n            \"Accept\": \"application/json\",\n        },\n    )\n    context = ssl.create_default_context(\n\
          \        cafile=\"/usr/local/share/ca-certificates/orbit-managed-root-ca.crt\"\n    )\n    opener = urllib.request.build_opener(\n\
          \        NoRedirect(), urllib.request.HTTPSHandler(context=context)\n    )\n    with opener.open(request, timeout=60)\
          \ as response:\n        raw_response = response.read(16_777_217)\n        if len(raw_response) > 16_777_216 or response.status\
          \ != 200:\n            raise ValueError(\"Invalid signing response\")\n    result = json.loads(raw_response)[\"\
          data\"]\n    print(json.dumps(result))\nexcept Exception:\n    print(json.dumps({\"error_code\": \"app-dev.certificate_sign_failed\"\
          }))\n    sys.exit(1)\nPYTHON\n"
        env:
          ORBIT_CERTIFICATE_OPERATION_ID: ${{ string(inputs.operation_id) }}
          ORBIT_CERTIFICATE_RUN_ID: ${{ run.id }}
          ORBIT_CERTIFICATE_MODE: single
          ORBIT_CERTIFICATE_REQUESTS: ${{ steps["request-result"].outputs.request_json }}
          ORBIT_CERTIFICATE_LEAF: ${{ steps.assets.outputs.input_json }}
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: signed-result
    target: orbit-node-209
    labels:
      node: '209'
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/certificate-script-assets'
      behaviorName: ${{ "certificate-assets-" + string(inputs.operation_id) }}
      methodName: decodeSigned
      inputs:
        leaf: ${{ inputs.intent }}
        request: ${{ steps["request-result"].outputs.request }}
        stdout: '${{ steps["request-result"].outputs.state == "current" ? ''{"certificates":[]}'' : steps["sign-http"].outputs.stdout
          }}'
    dependsOn:
    - step: sign-http
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: publish
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    dependsOn:
    - step: signed-result
      condition:
        type: succeeded
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-publish-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: sudo -n --preserve-env=ORBIT_CERTIFICATE_INPUT,ORBIT_CERTIFICATE_SIGNED /usr/bin/python3 "${{ steps.assets.outputs.publish_script
          }}"
        env:
          ORBIT_CERTIFICATE_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_CERTIFICATE_SIGNED: ${{ steps["signed-result"].outputs.signed_json }}
    guard: ${{ steps["request-result"].outputs.state == "current" }}
  - name: inspect
    target: ${{ "orbit-node-" + string(inputs.node_id) }}
    labels:
      node: ${{ string(inputs.node_id) }}
    writes: true
    dependsOn:
    - step: publish
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "certificate-command-inspect-" + string(inputs.operation_id) }}
      methodName: execute
      inputs:
        run: sudo -n --preserve-env=ORBIT_CERTIFICATE_INPUT,ORBIT_CERTIFICATE_EXPECT_PRESENT /usr/bin/python3 "${{ steps.assets.outputs.inspect_script
          }}"
        env:
          ORBIT_CERTIFICATE_INPUT: ${{ steps.assets.outputs.input_json }}
          ORBIT_CERTIFICATE_EXPECT_PRESENT: 'true'
