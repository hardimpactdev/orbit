id: c631d4e9-43b9-4ad3-899e-c35b57d1e40c
name: task-nested-fleet
description: >-
  Start the nested fleet of a task VM from the ready copies of its seed and join it as operator (stage 2 of the command development pipeline). Each step is one command over official SSH to the task VM.
vaults: []
queueTimeout: 60
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: tasks.provision}
    intent: {type: object}
    vm: {type: object}
  required: [operation_id, node_id, kind, intent, vm]
  additionalProperties: false
jobs:
- name: fleet
  labels: {role: swamp}
  steps:
  - name: guest
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@nckrtl/task-provision-data', behaviorName: '${{ "tp-data-guest-fleet" }}', methodName: guest, inputs: {intent: '${{ inputs.intent }}', vm: '${{ inputs.vm }}'}}
  # Decided by the orchestrator, for Nick's review: until the fleet build (task_vm.fleet_build) lands, a seed without its three ready copies skips the nested fleet,
  # and every step below follows the skip. When the fleet build lands, this branch calls it.
  - name: 'Look for ready copies'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-look-for-ready-copies").split(".").join("-") }}', methodName: exec,
      globalArgs: &vm {name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-look-for-ready-copies").split(".").join("-") }}', transport: {kind: ssh, user: '${{ steps.guest.outputs.workspace.ssh_execution.target.user }}', port: '${{ steps.guest.outputs.workspace.ssh_execution.target.port }}',
        identityFile: '${{ steps.guest.outputs.workspace.ssh_execution.identity_file }}'}, hosts: [{name: target, address: '${{ steps.guest.outputs.workspace.ssh_execution.target.host }}',
        transport: {hostKeys: '${{ steps.guest.outputs.workspace.ssh_execution.target.host_keys }}'}}]},
      inputs: {hosts: 'name:target', argv: ['incus', 'list', 'fleet-ready-', '--format', 'csv', '--columns', 'n'], timeoutSec: 40}}
    dependsOn: [{step: 'guest', condition: {type: succeeded}}]
  # The ready copies store the nested network: its subnet, and each Node MAC and address (stage 6).
  - name: 'Read the subnet'
    labels: {role: swamp}
    guard: '${{ steps["Look for ready copies"].outputs.stdout.split("\n").filter(l, l.startsWith("fleet-ready-")).size() != 3 }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-subnet").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-subnet").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'get', 'fleet-ready-gateway', 'user.ready.subnet'], timeoutSec: 40}}
    dependsOn: [{step: 'Look for ready copies', condition: {type: succeeded}}]
  - name: 'Read the MAC'
    labels: {role: swamp}
    guard: '${{ steps["Look for ready copies"].outputs.stdout.split("\n").filter(l, l.startsWith("fleet-ready-")).size() != 3 }}'
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-mac" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-mac" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'get', '${{ "fleet-ready-" + self.role }}', 'user.ready.hwaddr'], timeoutSec: 40}}
    dependsOn: [{step: 'Look for ready copies', condition: {type: succeeded}}]
  - name: 'Read the address'
    labels: {role: swamp}
    guard: '${{ steps["Look for ready copies"].outputs.stdout.split("\n").filter(l, l.startsWith("fleet-ready-")).size() != 3 }}'
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-address" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-address" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'config', 'get', '${{ "fleet-ready-" + self.role }}', 'user.ready.ipv4'], timeoutSec: 40}}
    dependsOn: [{step: 'Look for ready copies', condition: {type: succeeded}}]
  # The task VM owns the network and the three VMs: it creates the network from the stored subnet and needs no earlier fleet.
  # The converge of the task VM role creates the nested network when it exports the checkout to it; a fleet without that converge creates it here.
  - name: 'Look for the network'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-look-for-the-network").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-look-for-the-network").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'network', 'list', '--format', 'csv', '--columns', 'n'], timeoutSec: 40}}
    dependsOn: [{step: 'guest', condition: {type: succeeded}}]
  - name: 'Create the nested network'
    labels: {role: swamp}
    writes: true
    guard: '${{ steps["Look for the network"].outputs.stdout.split("\n").exists(l, l == inputs.intent.fleet.network) }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-create-the-nested-network").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-create-the-nested-network").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'network', 'create', '${{ inputs.intent.fleet.network }}', '${{ "ipv4.address=" + steps["Read the subnet"].outputs.stdout.split("\n")[0] }}', 'ipv4.nat=true', 'ipv6.address=none'], timeoutSec: 70}}
    dependsOn: [{step: 'Read the subnet', condition: {type: succeeded}}, {step: 'Look for the network', condition: {type: succeeded}}]
  # A copy of a stopped copy on the same pool is a clone; the guests keep their own state, database and `base` setting.
  # The network, wherever it came from, has the subnet that the copies store: each copy keeps its MAC and address inside it.
  - name: 'Read the network address'
    labels: {role: swamp}
    guard: '${{ steps["Look for ready copies"].outputs.stdout.split("\n").filter(l, l.startsWith("fleet-ready-")).size() != 3 }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-network-address").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-network-address").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'network', 'get', '${{ inputs.intent.fleet.network }}', 'ipv4.address'], timeoutSec: 40}}
    dependsOn: [{step: 'Create the nested network', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
  - name: 'Check the subnet'
    labels: {role: swamp}
    guard: '${{ steps["Look for ready copies"].outputs.stdout.split("\n").filter(l, l.startsWith("fleet-ready-")).size() != 3 }}'
    task: {type: assert, expr: 'steps["Read the network address"].outputs.stdout.split("\n")[0] == steps["Read the subnet"].outputs.stdout.split("\n")[0]', severity: high, message: The nested network does not have the subnet that the ready copies store}
    dependsOn: [{step: 'Read the network address', condition: {type: succeeded}}]
  - name: 'Copy the ready copies'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-copy-the-ready-copies" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-copy-the-ready-copies" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '300', 'incus', 'copy', '--instance-only', '${{ "fleet-ready-" + self.role }}', '${{ inputs.intent.fleet.guests[self.role] }}'], timeoutSec: 310}}
    dependsOn: [{step: 'Check the subnet', condition: {type: succeeded}}]
  # Each Node gets its stored MAC and address back, so the Orbit records in the copies stay true.
  - name: 'Add the NICs'
    labels: {role: swamp}
    writes: true
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-add-the-nics" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-add-the-nics" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'config', 'device', 'add', '${{ inputs.intent.fleet.guests[self.role] }}', 'eth0', 'nic', '${{ "network=" + inputs.intent.fleet.network }}', '${{ "hwaddr=" + steps["Read the MAC-" + self.role].outputs.stdout.split("\n")[0] }}', '${{ "ipv4.address=" + steps["Read the address-" + self.role].outputs.stdout.split("\n")[0] }}'], timeoutSec: 40}}
    dependsOn: [{step: 'Copy the ready copies', condition: {type: succeeded}}, {step: 'Read the MAC', condition: {type: succeeded}}, {step: 'Read the address', condition: {type: succeeded}}]
  - name: 'Start the nested VMs'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-start-the-nested-vms").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-start-the-nested-vms").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'start', '${{ inputs.intent.fleet.guests.gateway }}', '${{ inputs.intent.fleet.guests["app-dev"] }}', '${{ inputs.intent.fleet.guests["app-prod"] }}'], timeoutSec: 130}}
    dependsOn: [{step: 'Add the NICs', condition: {type: succeeded}}]
  - name: 'Wait for the agents'
    labels: {role: swamp}
    forEach: {item: role, in: '${{ ["gateway", "app-dev", "app-prod"] }}'}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-wait-for-the-agents" + "-" + self.role).split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-wait-for-the-agents" + "-" + self.role).split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '130', 'incus', 'wait', '${{ inputs.intent.fleet.guests[self.role] }}', 'agent', '--timeout', '120'], timeoutSec: 140}}
    dependsOn: [{step: 'Start the nested VMs', condition: {type: succeeded}}]
  # The Gateway database is the one its own `.env` names; the state is on the guest's own disk.
  - name: 'Read the database path'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-database-path").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-database-path").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'grep', '-m1', '^DB_DATABASE=', '/var/lib/orbit-checkout-state/apps/gateway/.env'], timeoutSec: 40}}
    dependsOn: [{step: 'Wait for the agents', condition: {type: succeeded}}]
  # The task VM joins as operator with its own WireGuard key. The private key stays in this VM; only the public key is printed.
  - name: 'Make the operator key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-make-the-operator-key").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-make-the-operator-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', sudo: true, argv: ['timeout', '30', 'sh', '-c', 'umask 077; wg genkey | tee /etc/wireguard/wg-nested.key | wg pubkey'], timeoutSec: 40}}
    dependsOn: [{step: 'Wait for the agents', condition: {type: succeeded}}]
  # The key goes into the nested Gateway's operator Node record, with `incus exec`: the VM is the Incus host of the nested VMs, so this needs no network yet.
  - name: 'Record the operator key'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-record-the-operator-key").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-record-the-operator-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'sqlite3', '${{ steps["Read the database path"].outputs.stdout.split("\n")[0].split("=")[1] }}', '${{ "update nodes set wireguard_public_key = ''" + steps["Make the operator key"].outputs.stdout.split("\n")[0] + "'' where name = ''operator''" }}'], timeoutSec: 40}}
    dependsOn: [{step: 'Read the database path', condition: {type: succeeded}}, {step: 'Make the operator key', condition: {type: succeeded}}]
  # The agent answers early in the boot. `systemctl start` returns when the hub tunnel is up, so the next steps find the interface.
  - name: 'Start the hub'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-start-the-hub").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-start-the-hub").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '120', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'systemctl', 'start', 'wg-quick@orbit'], timeoutSec: 130}}
    dependsOn: [{step: 'Record the operator key', condition: {type: succeeded}}]
  - name: 'Read the hub key'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-hub-key").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-read-the-hub-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'wg', 'show', 'orbit', 'public-key'], timeoutSec: 40}}
    dependsOn: [{step: 'Start the hub', condition: {type: succeeded}}]
  # The hub learns the key; the nested network keeps its address 10.45.0.10 for the operator.
  - name: 'Add the operator peer'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-add-the-operator-peer").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-add-the-operator-peer").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'wg', 'set', 'orbit', 'peer', '${{ steps["Make the operator key"].outputs.stdout.split("\n")[0] }}', 'allowed-ips', '10.45.0.10/32'], timeoutSec: 40}}
    dependsOn: [{step: 'Read the hub key', condition: {type: succeeded}}]
  # The VM brings up wg-nested as the operator 10.45.0.10. Its own `orbit` interface stays as it is.
  - name: 'Add the tunnel'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-add-the-tunnel").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-add-the-tunnel").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', sudo: true, argv: ['timeout', '30', 'ip', 'link', 'add', 'wg-nested', 'type', 'wireguard'], timeoutSec: 40}}
    dependsOn: [{step: 'Add the operator peer', condition: {type: succeeded}}]
  - name: 'Set the tunnel peer'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-set-the-tunnel-peer").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-set-the-tunnel-peer").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', sudo: true, argv: ['timeout', '30', 'wg', 'set', 'wg-nested', 'private-key', '/etc/wireguard/wg-nested.key', 'listen-port', '51821', 'peer', '${{ steps["Read the hub key"].outputs.stdout.split("\n")[0] }}', 'endpoint', '${{ steps["Read the address-gateway"].outputs.stdout.split("\n")[0] + ":51820" }}', 'allowed-ips', '10.45.0.0/24', 'persistent-keepalive', '25'], timeoutSec: 40}}
    dependsOn: [{step: 'Add the tunnel', condition: {type: succeeded}}]
  - name: 'Address the tunnel'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-address-the-tunnel").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-address-the-tunnel").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', sudo: true, argv: ['timeout', '30', 'ip', 'address', 'add', '10.45.0.10/24', 'dev', 'wg-nested'], timeoutSec: 40}}
    dependsOn: [{step: 'Set the tunnel peer', condition: {type: succeeded}}]
  - name: 'Bring up the tunnel'
    labels: {role: swamp}
    writes: true
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-bring-up-the-tunnel").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-bring-up-the-tunnel").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', sudo: true, argv: ['timeout', '30', 'ip', 'link', 'set', 'wg-nested', 'up'], timeoutSec: 40}}
    dependsOn: [{step: 'Address the tunnel', condition: {type: succeeded}}]
  # A ping makes the first handshake now, so the Gateway answers the operator at once.
  - name: 'Check the tunnel'
    labels: {role: swamp}
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-check-the-tunnel").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-check-the-tunnel").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '30', 'ping', '-c', '1', '-w', '20', '10.45.0.1'], timeoutSec: 40}}
    dependsOn: [{step: 'Bring up the tunnel', condition: {type: succeeded}}]
  # The nested Gateway runs its own Swamp as part of the Orbit under test. The ready copies are key-free; the VM holds the proof Swamp Club key from the workspace step.
  # `incus file push --create-dirs` makes the folders as root, which breaks the orbit user of the nested Gateway; the folders exist before the push, owned by orbit.
  - name: 'Make the Club key folder'
    labels: {role: swamp}
    writes: true
    guard: '${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-make-the-club-key-folder").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-make-the-club-key-folder").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'install', '-d', '-m', '0700', '-o', 'orbit', '-g', 'orbit', '/home/orbit/.config', '/home/orbit/.config/swamp'], timeoutSec: 70}}
    dependsOn: [{step: 'Check the tunnel', condition: {type: succeeded}}]
  - name: 'Push the Club key'
    labels: {role: swamp}
    writes: true
    guard: '${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-push-the-club-key").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-push-the-club-key").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'file', 'push', '--create-dirs', '--mode=0600', '--uid=1000', '--gid=1000', '/home/orbit/.config/swamp/club-api-key', '${{ inputs.intent.fleet.guests.gateway }}/home/orbit/.config/swamp/club-api-key'], timeoutSec: 70}}
    dependsOn: [{step: 'Make the Club key folder', condition: {type: succeeded}}]
  - name: 'Restart the nested Swamp'
    labels: {role: swamp}
    writes: true
    guard: '${{ !has(inputs.intent.proof_club_required) || !inputs.intent.proof_club_required }}'
    task: {type: behavior, behaviorType: '@swamp/ssh', behaviorName: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-restart-the-nested-swamp").split(".").join("-") }}', methodName: exec, globalArgs: {<<: *vm, name: '${{ ("nested-fleet-" + string(inputs.intent.guest_node_id) + "-restart-the-nested-swamp").split(".").join("-") }}'},
      inputs: {hosts: 'name:target', argv: ['timeout', '60', 'incus', 'exec', '${{ inputs.intent.fleet.guests.gateway }}', '--', 'systemctl', 'restart', 'orbit-swamp-serve', 'orbit-node-worker'], timeoutSec: 70}}
    dependsOn: [{step: 'Push the Club key', condition: {type: succeeded}}]
  - name: result
    labels: {role: swamp}
    task: {type: behavior, behaviorType: command/shell, behaviorName: '${{ "nested-fleet-result-" + string(inputs.intent.guest_node_id) }}', methodName: execute,
      inputs: {run: 'printf ''{"nested_fleet":"%s"}\n'' "$ORBIT_FLEET"', env: {ORBIT_FLEET: '${{ steps["Look for ready copies"].outputs.stdout.split("\n").filter(l, l.startsWith("fleet-ready-")).size() != 3 ? "none" : "started" }}'}}}
    dependsOn: [{step: 'Check the tunnel', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}, {step: 'Restart the nested Swamp', condition: {type: or, conditions: [{type: succeeded}, {type: skipped}]}}]
