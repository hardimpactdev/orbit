  steps:
  - name: issue_model
    guard: ${{ !steps.admit.outputs.active }}
    writes: true
    task:
      type: behavior
      behaviorType: '@nckrtl/task-vm-model-keys'
      behaviorName: ${{ "task-vm-model-router-" + string(steps.admit.outputs.input.model_router_node_id)
        }}
      methodName: issue
      inputs:
        operation_id: ${{ inputs.operation_id }}
        kind: ${{ inputs.kind }}
        node_id: ${{ inputs.node_id }}
        run_id: ${{ run.id }}
  - name: issue_model_ready
    guard: ${{ !steps.admit.outputs.active }}
