---
# The tasks of a sleep and of a wake's end. `power` is `prepared_sleep` (instance-container-power.yml: the sleep's one phase) or
# `awake` (the end of a wake's `start` part of instance-container.yml, which includes this file when its intent names the marker).

# Caddy's site of a container Instance checks the marker only once a publish of the Node's sites rendered the check. A marker without
# the check would leave the Route proxying to a stopped container, so the sleep refuses before it changes anything. An Instance without
# a published Route has no site (the intent's `route` is false): nothing proxies to it, so there is nothing to check.
- name: Refuse a sleep intent that does not say whether a Route has a site
  when: power == 'prepared_sleep'
  ansible.builtin.assert:
    that: intent.route is defined and intent.route is boolean
    fail_msg: The sleep intent names no `route`; the Gateway always sends it.
    quiet: true

# The helper of this commit, so the run never depends on when the role last converged (docs/reference/prepared-restore.md). It comes
# before the Caddy check and the marker: a failed install or probe changes nothing that a visitor sees.
- name: Install the power helper
  when: power == 'prepared_sleep'
  ansible.builtin.include_tasks: { file: instance-power-helper.yml, apply: {tags: [always]} }

- name: Read Caddy's loaded configuration
  when: power == 'prepared_sleep' and intent.route
  ansible.builtin.uri:
    url: "{{ caddy_admin }}/config/"
    return_content: true
    timeout: 5
  register: caddy_config
  changed_when: false
  failed_when: false

- name: Refuse a sleep while the site has no asleep check
  when: power == 'prepared_sleep' and intent.route
  ansible.builtin.assert:
    that:
      - caddy_config.status | default(0) == 200
      - ('/' ~ (marker | basename)) in caddy_config.content | default('')
    fail_msg: instance.sleep_route_unready
    quiet: true

# Before the freeze: a request during the freeze gets the wake page. The directory is the app-dev role's hibernation directory.
- name: Write the asleep marker
  when: power == 'prepared_sleep'
  ansible.builtin.copy:
    content: ""
    dest: "{{ marker }}"
    owner: "{{ marker_owner }}"
    group: "{{ marker_group }}"
    mode: "0644"

# The helper reads the container's state first. Running: it opens swap on each cgroup of the subtree that holds 0 and records it, pauses,
# records the plan of every process's resident pages, and reclaims once. Frozen by an earlier sleep: it changes nothing and returns that
# sleep's result. Stopped: it stays stopped. A failed swap write or pause closes what it opened: the container serves as before.
- name: Prepare the container's sleep
  when: power == 'prepared_sleep'
  ansible.builtin.include_tasks: { file: instance-power-call.yml, apply: {tags: [always]} }
  vars:
    power_call: ['prepare', '--instance', '{{ container.instance_id }}', '--operation', '{{ operation_id }}']
    power_call_intent: true

- name: Note the prepared sleep
  when: power == 'prepared_sleep'
  ansible.builtin.set_fact: { sleep_prepared: "{{ power_called }}" }

- name: Remove the marker of a container that still runs
  when: power == 'prepared_sleep' and sleep_prepared.outcome == 'failed' and sleep_prepared.state_after == 'running'
  ansible.builtin.file: { path: "{{ marker }}", state: absent }

# A failure that leaves the container frozen keeps the marker: it is asleep, and a later resume closes what the sleep opened.
- name: Refuse a sleep the helper could not finish
  when: power == 'prepared_sleep' and sleep_prepared.outcome in ['failed', 'missing']
  ansible.builtin.fail: { msg: "{{ sleep_prepared.error_code | default('instance.container_freeze_failed', true) }}" }

# Each call reads memory.stat once and stores the anonymous and file bytes in the sleep's result; the kernel's counters settle across
# CPUs a moment after the reclaim, so the phase reads them through the one call task until both are 0, at most 20 times, 0.1 s apart.
# The last read is what stays in RAM. A lock that stays busy fails `instance.power_helper_busy` and a crash `instance.power_helper_failed`,
# with the container frozen behind its marker.
- name: Settle the frozen container's counters
  when: power == 'prepared_sleep' and sleep_prepared.outcome == 'frozen'
  ansible.builtin.include_tasks: { file: instance-power-call.yml, apply: {tags: [always]} }
  vars:
    power_call: ['residual', '--instance', '{{ container.instance_id }}', '--operation', '{{ operation_id }}']
    power_call_retries: 19
    power_call_delay: 0.1
    power_call_settled: >-
      {{ (power_call_run.stdout | from_json).outcome != 'recorded'
         or ((power_call_run.stdout | from_json).prepared_restore.residual_anon_bytes == 0
             and (power_call_run.stdout | from_json).prepared_restore.residual_file_bytes == 0) }}

- name: Note what stayed in RAM
  when: power == 'prepared_sleep'
  ansible.builtin.set_fact:
    sleep_prepared_restore: >-
      {{ power_called.prepared_restore
         if sleep_prepared.outcome == 'frozen' and power_called.outcome == 'recorded'
         else sleep_prepared.prepared_restore }}

# Swap that cannot take the memory (it is full) leaves the app in RAM. A frozen container would then hold that RAM, which a sleep
# exists to free, so the sleep stops the container instead: its next wake is a boot behind the same marker. The plan goes first, so
# the resume reads no page back while swap is full; a clean stop of a frozen container times out, so it resumes first, and the
# resume closes what the sleep opened. A failed resume fails the sleep with the container frozen behind its marker: asleep. A
# nested-fleet container is never stopped: it runs again as before the sleep, and the sleep fails.
- name: Note whether the memory stayed in RAM
  when: power == 'prepared_sleep'
  ansible.builtin.set_fact:
    sleep_held: >-
      {{ sleep_prepared.outcome == 'frozen'
         and (sleep_prepared_restore.residual_anon_bytes | default(0) | int) > intent.freeze.resident_anon_mib * 1048576 }}
    # A nested-fleet container holds the Club key in /run and the tunnel `wg-nested`, which only a deployment or a start gives back.
    # Only a nested-fleet container's intent has `allowed_devices`, as the Gateway places it in the nested Incus project.
    sleep_nested: "{{ container.allowed_devices is defined }}"

- name: Resume the container whose memory stayed in RAM
  when: power == 'prepared_sleep' and sleep_held | bool
  block:
    - name: Discard the plan of the container whose memory stayed in RAM
      ansible.builtin.include_tasks: { file: instance-power-call.yml, apply: {tags: [always]} }
      vars:
        power_call: ['discard', '--instance', '{{ container.instance_id }}', '--plan-only']
    - name: Resume the container for a clean stop
      ansible.builtin.include_tasks: { file: instance-power-call.yml, apply: {tags: [always]} }
      vars:
        power_call: ['restore', '--instance', '{{ container.instance_id }}', '--operation', '{{ operation_id }}']
        power_call_intent: true
    - name: Refuse the sleep whose resume failed
      when: power_called.outcome != 'resumed'
      ansible.builtin.fail: { msg: instance.container_freeze_failed }

- name: Keep a nested-fleet container running when its memory stayed in RAM
  when: power == 'prepared_sleep' and sleep_held | bool and sleep_nested | bool
  block:
    - name: Remove the marker of the running nested-fleet container
      ansible.builtin.file: { path: "{{ marker }}", state: absent }
    - name: Refuse the sleep of the nested-fleet container
      ansible.builtin.fail: { msg: instance.container_freeze_failed }

- name: Stop the container whose memory stayed in RAM
  when: power == 'prepared_sleep' and sleep_held | bool and not sleep_nested | bool
  block:
    - name: Stop the container
      ansible.builtin.command: { argv: [incus, --project, "{{ container.project }}", stop, --timeout, "30", "{{ container.name }}"] }
      register: sleep_stopped
      changed_when: true
  rescue:
    # The resumed container runs with its swap closed: it serves again without the marker.
    - name: Remove the marker after the failed stop
      ansible.builtin.file: { path: "{{ marker }}", state: absent }
    - name: Refuse the failed stop
      ansible.builtin.fail: { msg: instance.container_freeze_failed }

# `swap_subtree` counts the inner cgroups this sleep opened. `prepared_restore` is the helper's own object: a stop says `skipped`,
# reason `stopped`, with what stayed in RAM.
- name: Note how the container sleeps
  when: power == 'prepared_sleep'
  ansible.builtin.set_fact:
    power_result:
      sleep: "{{ 'stopped' if sleep_held | bool or sleep_prepared.outcome == 'stopped' else 'frozen' }}"
      swap_subtree: "{{ 0 if sleep_held | bool else sleep_prepared.swap_subtree | length }}"
      prepared_restore: >-
        {{ dict(sleep_prepared_restore | dict2items | rejectattr('key', 'in', ['generation', 'processes', 'resident_mapping_bytes',
                'metadata_bytes', 'prepare_seconds']) | items2dict, status='skipped', reason='stopped')
           if sleep_held | bool else sleep_prepared_restore }}

# A wake's start (instance-container.yml, `start` with the marker in the intent) waited for every desired-running unit. FrankenPHP
# then answers once it listens: `intent.web.ready_seconds` tries 1 s apart, each the play's `web_probe` from the Node, bounded to 1.5 s. Only no answer at all
# refuses the wake. A Project without a web unit has nothing to wait for.
- name: Wait for the web unit to answer
  when: power == 'awake' and container.web_config | default(none) is not none
  ansible.builtin.command: { argv: "{{ web_probe }}" }
  register: web_ready
  until: web_ready.rc == 0 and web_ready.stdout | int > 0
  retries: "{{ intent.web.ready_seconds }}"
  delay: 1
  changed_when: false
  failed_when: false

- name: Refuse a wake whose web unit did not answer
  when: power == 'awake' and container.web_config | default(none) is not none
  ansible.builtin.assert:
    that: [web_ready.rc == 0, web_ready.stdout | int > 0]
    fail_msg: instance.web_unready
    quiet: true

# A web unit that listens before the app is ready answers 5xx for a moment: the visitor keeps the waiting page through it, up to
# `intent.web.settle_seconds`. An app that answers 5xx by itself (maintenance mode, an error on `/`) is then served as it is.
- name: Wait for the app behind the web unit
  when: power == 'awake' and container.web_config | default(none) is not none and web_ready.stdout | int >= 500
  ansible.builtin.command: { argv: "{{ web_probe }}" }
  register: app_ready
  until: app_ready.rc == 0 and app_ready.stdout | int > 0 and app_ready.stdout | int < 500
  retries: "{{ intent.web.settle_seconds }}"
  delay: 1
  changed_when: false
  failed_when: false

# Caddy sends the next request to the app. The visitor does not wait for T3.
- name: Remove the asleep marker
  when: power == 'awake'
  ansible.builtin.file:
    path: "{{ marker }}"
    state: absent
  register: wake_marker_removed

# The website is ready once this run removed the marker: the Node's UTC time, in milliseconds (docs/reference/prepared-restore.md#results).
# A marker that the Node's fast wake removed keeps that wake's time.
- name: Note when the website became ready
  when: power == 'awake' and wake_marker_removed is changed
  ansible.builtin.set_fact:
    wake_result: >-
      {{ wake_result | default({}) | combine({'ready_at': now(utc=true).isoformat(timespec='milliseconds')[:23] ~ 'Z',
                                             'ready_at_resolution_seconds': 0.001}) }}

# Every exec of a wake has its bound from the Node (`timeout`), so a container that does not answer ends the step, never the run's
# 240 s bound (Instance 2454 on 2026-11-17).
# A converge cannot exec in a frozen container, so one that slept through it may wake with a library cache that lacks the shared
# runtime libraries. After the marker went, so the visitor does not wait: one exec, `ldconfig -X` only when the cache lacks a soname of
# the runtime folder's `lib` at that path (the converge's own rule, instance_container_files.py).
# The Node's wake script (files/instance-container-wake.sh) runs the same check after its resume.
- name: Refresh a stale library cache after the wake
  when: power == 'awake'
  ansible.builtin.command:
    argv: ['timeout', '10', 'incus', 'exec', '--project', '{{ container.project }}', '{{ container.name }}', '--', 'sh', '-c', 'd=/opt/orbit-runtime/current/lib; c=$(ldconfig -p) || exit 0; for f in "$d"/lib*.so*; do n=${f##*/}; case "$n" in *.so|*.so.[0-9]|*.so.[0-9][0-9]|*.so.[0-9][0-9][0-9]) ;; *) continue;; esac; [ -e "$f" ] || continue; printf "%s\n" "$c" | sed -n "s/.* => //p" | grep -qxF "$d/$n" || { ldconfig -X && echo rebuilt; exit 0; }; done']
  register: wake_library_cache
  changed_when: "'rebuilt' in wake_library_cache.stdout"
  failed_when: false

# The converge keeps each container's Orbit root CA file current through the Incus file API, frozen ones included, but only an exec
# rebuilds the bundle, and a frozen container refuses an exec: so the wake does, after the marker went. A container without the file
# skips it. The Node's wake script (files/instance-container-wake.sh) runs the same check after its resume.
- name: Refresh a stale CA bundle after the wake
  when: power == 'awake'
  ansible.builtin.command:
    argv: ['timeout', '10', 'incus', 'exec', '--project', '{{ container.project }}', '{{ container.name }}', '--', 'sh', '-c', 'r=/usr/local/share/ca-certificates/orbit-managed-root-ca.crt; [ -r "$r" ] || exit 0; b=$(grep -v -- ----- "$r" | tr -d "\n"); grep -v -- ----- /etc/ssl/certs/ca-certificates.crt | tr -d "\n" | grep -qF "$b" || { update-ca-certificates >/dev/null && echo refreshed; }']
  register: wake_ca_bundle
  changed_when: "'refreshed' in wake_ca_bundle.stdout"
  failed_when: false

# A container that was switched while frozen resumes with the old server process still running. When its server drop-in differs
# from the runtime's recorded server, write it, reload systemd and restart t3.service so the Conn Server takes over.
- name: Check whether a resumed container needs its server drop-in updated
  when: >-
    power == 'awake' and start_resumed | default(false) | bool and container.clone | default(none) is not none
    and (container.clone.files | default([]) | selectattr('path', 'equalto', '/etc/systemd/system/t3.service.d/20-orbit-server.conf') | list | length) > 0
  block:
    - name: Read the resumed container's server drop-in
      ansible.builtin.command:
        argv: ['timeout', '10', 'incus', 'exec', '--project', '{{ container.project }}', '{{ container.name }}', '--', 'cat', '/etc/systemd/system/t3.service.d/20-orbit-server.conf']
      register: wake_server_drop_in_current
      changed_when: false
      failed_when: false

    - name: Apply the switched server drop-in after resume
      when: wake_server_drop_in_current.rc != 0 or (wake_server_drop_in_current.stdout ~ '\n') != server_drop_in.content
      vars:
        server_drop_in: "{{ (container.clone.files | selectattr('path', 'equalto', '/etc/systemd/system/t3.service.d/20-orbit-server.conf') | list)[0] }}"
      block:
        - name: Write the switched server drop-in
          ansible.builtin.command:
            argv:
              - incus
              - --project
              - "{{ container.project }}"
              - file
              - push
              - --create-dirs
              - --uid
              - "0"
              - --gid
              - "0"
              - --mode
              - "{{ server_drop_in.mode }}"
              - "-"
              - "{{ container.name }}{{ server_drop_in.path }}"
            stdin: "{{ server_drop_in.content }}"
            stdin_add_newline: false
          changed_when: true

        - name: Reload systemd for the switched server
          ansible.builtin.command:
            argv: ['timeout', '15', 'incus', 'exec', '--project', '{{ container.project }}', '{{ container.name }}', '--', 'systemctl', 'daemon-reload']
          changed_when: true

        - name: Restart T3 service for the switched server
          ansible.builtin.command:
            argv: ['timeout', '100', 'incus', 'exec', '--project', '{{ container.project }}', '{{ container.name }}', '--', 'systemctl', 'restart', '--', 't3.service']
          changed_when: true

# T3 gates only the end of the wake: a clone whose T3 stays silent ends failed while its site already serves.
- name: Wait for T3
  when: power == 'awake' and container.clone | default(none) is not none
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '5', 'incus', 'exec', '--project', container.project, '--cwd', '/home/agent', '--env', 'HOME=/home/agent', container.name,
          '--', 'runuser', '-u', 'agent', '--',
          'curl', '--fail', '--silent', '--max-time', '2',
          'http://127.0.0.1:' ~ container.clone.t3.internal_port ~ '/.well-known/t3/environment'] }}
  register: t3_ready
  until: t3_ready.rc == 0
  retries: "{{ container.clone.t3.ready_seconds }}"
  delay: 1
  changed_when: false
  failed_when: false

- name: Refuse a wake whose T3 did not answer
  when: power == 'awake' and container.clone | default(none) is not none
  ansible.builtin.assert:
    that: [t3_ready.rc == 0]
    fail_msg: instance.t3_unready
    quiet: true

- name: Record the container server version after the wake
  when: >-
    power == 'awake' and container.clone | default(none) is not none
    and t3_ready.rc == 0 and (t3_ready.stdout | from_json).serverVersion | default('') != ''
  ansible.builtin.set_fact:
    wake_result: "{{ wake_result | default({}) | combine({'server_version': (t3_ready.stdout | from_json).serverVersion}) }}"
