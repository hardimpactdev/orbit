---
# What the nested fleet needs from the task VM's own firewall, which denies incoming and routed traffic by default: the bridge's
# DHCP and DNS server, the package cache, and the nested containers' way out. Nothing else is opened; nothing else is served to them.
# intent.nested is null on an image, which has no nested bridge.
- name: Allow DHCP, DNS and the package cache from the nested bridge
  when: intent.nested is not none
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ intent.nested.interface }}"
    proto: "{{ item.proto }}"
    to_port: "{{ item.port }}"
    comment: orbit:task-vm-nested
  loop:
    - { proto: udp, port: "67" }
    - { proto: udp, port: "53" }
    - { proto: tcp, port: "53" }
    # The package cache (task-vm-apt-cache.yml): the nested Nodes read the Ubuntu snapshot indexes from it.
    - { proto: tcp, port: "3142" }
  loop_control: { label: "{{ item.proto }}/{{ item.port }}" }
- name: Route the nested bridge out
  when: intent.nested is not none
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ intent.nested.interface }}"
    comment: orbit:task-vm-nested
# The nested VMs of earlier images mounted the checkout over NFS. Their rule goes; absent is the end state.
- name: Withdraw the NFS rule of the earlier nested VMs
  when: intent.nested is not none
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ intent.nested.interface }}"
    from_ip: "{{ intent.nested.subnet }}"
    to_port: "2049"
    proto: tcp
    comment: orbit:task-vm-nfs
    delete: true
# The nested containers reach the internet (the Swamp Club, packages) through the task VM, which routes their bridge. Two settings of the
# VM decide whether it does, whatever starts first at boot:
# - the kernel forwards IPv4: Incus turns it on when it makes a bridge, and nothing may turn it off again;
# - Docker leaves the FORWARD policy alone: a Docker that turns forwarding on itself sets the policy to DROP, which drops the bridge's
#   traffic in every chain that hooks forwarding, also when UFW accepts it (`ip-forward-no-drop`, Docker 28 and later).
- name: Keep IPv4 forwarding on for the nested bridge
  when: intent.nested is not none
  ansible.builtin.copy: { dest: /etc/sysctl.d/60-orbit-nested.conf, content: "net.ipv4.ip_forward = 1\n", mode: "0644" }
- name: Turn IPv4 forwarding on now
  when: intent.nested is not none
  ansible.builtin.command: { argv: [sysctl, -w, net.ipv4.ip_forward=1] }
  changed_when: false
- name: Read the Docker daemon settings
  when: intent.nested is not none
  ansible.builtin.slurp: { src: /etc/docker/daemon.json }
  register: nested_docker_settings
  failed_when: false
- name: Keep Docker from dropping routed traffic
  when: intent.nested is not none
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ (nested_docker_settings.content | default('e30=') | b64decode | from_json) | combine({'ip-forward-no-drop': true}) | to_nice_json }}\n"
  register: nested_docker_config
- name: Restart Docker with the setting
  when: intent.nested is not none and nested_docker_config.changed
  ansible.builtin.systemd: { name: docker.service, state: restarted }
- name: Read the FORWARD chain that Docker uses
  when: intent.nested is not none
  ansible.builtin.command: { argv: [iptables, -S, FORWARD] }
  register: nested_forward
  changed_when: false
# A Docker that started before the setting left its DROP policy in a chain that UFW does not use; the setting keeps it from coming back.
- name: Undo the DROP policy that Docker set
  when: intent.nested is not none and nested_forward.stdout is search('-P FORWARD DROP') and nested_forward.stdout is not search('ufw')
  ansible.builtin.command: { argv: [iptables, -P, FORWARD, ACCEPT] }
  changed_when: true
