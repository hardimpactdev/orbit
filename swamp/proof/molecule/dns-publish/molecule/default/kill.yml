---
# A phase that is killed in the middle of the first cutover, as a worker crash or the timeout of the Swamp step does it. The old listener
# socket is slowed down on its way out (ExecStopPre), so the playbook is in the cutover for 20 seconds: the stop of the listener and the
# restart of dnsmasq are one detached command on the Node, which the kill of the playbook does not stop. What stays is the state of a crashed
# run: the snapshot, the files of the candidate, no revision, no loaded copy, and the lock holder, which the proof ends by hand because it
# would expire only after the lock time of the phase (swamp/ansible/vars/dns.yml).
- name: Slow down the stop of the old listener socket
  become: true
  block:
    - name: Make the folder of the drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/orbit-private-dns.socket.d
        state: directory
        mode: "0755"
    - name: Write the drop-in
      ansible.builtin.copy:
        content: "[Socket]\nExecStopPre=/bin/sh -c 'touch /run/orbit-proof-stopping; sleep 20'\n"
        dest: /etc/systemd/system/orbit-private-dns.socket.d/zz-proof.conf
        mode: "0644"
    - name: Read the drop-in
      ansible.builtin.systemd:
        daemon_reload: true
- name: Start the phase detached
  ansible.builtin.command:
    argv: [timeout, "200", ansible-playbook, -i, "{{ folder.path }}/inventory.yml", --tags, publish, "{{ ansible_dir }}/dns-publish.yml"]
    chdir: "{{ ansible_dir }}"
  environment:
    ORBIT_RUN: "{{ folder.path }}"
    ANSIBLE_NOCOLOR: "1"
  async: 250
  poll: 0
  changed_when: false
  register: killed_phase
- name: Wait until the old listener is being stopped
  ansible.builtin.wait_for:
    path: /run/orbit-proof-stopping
    timeout: 120
- name: Kill the playbook
  become: true
  ansible.builtin.command:
    argv: [pkill, -KILL, -f, "ansible-playbook -i {{ folder.path }}/inventory.yml"]
  register: killed
  failed_when: killed.rc not in [0, 1]
  changed_when: killed.rc == 0
- name: Wait until the detached cutover has stopped the old listener
  become: true
  ansible.builtin.command:
    argv: [systemctl, is-active, orbit-private-dns.socket]
  register: socket_state
  until: socket_state.stdout == 'inactive'
  retries: 45
  delay: 2
  changed_when: false
  failed_when: false
- name: Wait until the detached cutover has restarted dnsmasq
  become: true
  ansible.builtin.command:
    argv: [systemctl, is-active, dnsmasq]
  register: dnsmasq_state
  until: dnsmasq_state.stdout == 'active'
  retries: 30
  delay: 1
  changed_when: false
  failed_when: false
- name: End the lock holder that the killed phase left, and take the drop-in away
  become: true
  ansible.builtin.shell: |
    for f in /run/orbit-dnsmasq-lock.*.pid; do [ -e "$f" ] && pkill -F "$f"; rm -f "$f"; done
    rm -rf /etc/systemd/system/orbit-private-dns.socket.d /run/orbit-proof-stopping
    systemctl daemon-reload
    exit 0
  changed_when: true
