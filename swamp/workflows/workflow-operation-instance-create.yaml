id: c2c6c4a5-a667-4a81-9f5a-fae18fdf5d4a
name: operation-instance-create
description: 'Development Instance create: checkout/default Ansible phases, or the direct clone phases up to the T3 registration in their own job, with the clone''s Route beside them when its admission took the Route Nodes (the completion does its database, fleet, Processes, and a Route this run did not publish). Native progress records each phase.'
vaults: [orbit-control-inputs]
queueTimeout: 10
labels: {role: swamp}
inputs:
  type: object
  properties:
    operation_id: {type: integer, minimum: 1}
    node_id: {type: integer, minimum: 1}
    kind: {type: string, const: instance.create}
    intent: {type: object}
    # Names only: git_credential and environment, member_<Process id> for each development Process environment,
    # server_database_create and server_database_check for an owned server database, server_valkey_create and
    # server_valkey_check for a clone's own Valkey user, step_<index> for each development
    # deploy step of a container default, model_environment for a clone's placeholder model key, and process_environments for
    # a default's Process environment files or a clone's private workspace JSON (environment and processes), and club_key for
    # a nested-fleet container's Club key, which only its start step reads.
    execution_secrets:
      type: object
      additionalProperties:
        type: object
        properties:
          vault: {type: string, enum: [orbit-control-inputs]}
          key: {type: string, pattern: '^(?:instance-(?:git-(?:operation|credential)-|create-environment-(?:input|testing)-|create-model-|create-processes-)[1-9][0-9]*|process-instance-operation-[1-9][0-9]*-member-[1-9][0-9]*|database-create-(?:intent|owner)-[1-9][0-9]*|development-deploy-operation-[1-9][0-9]*-step-(?:[0-9]|[12][0-9]|3[01])|nested-fleet-club-api-key)$'}
        required: [vault, key]
        additionalProperties: false
  required: [operation_id, node_id, kind, intent, execution_secrets]
  additionalProperties: false
jobs:
  # One input predecessor. Swamp runs jobs in levels too: legacy, clone and publication share one level, each with its own step levels;
  # the create job starts when all have ended (swamp/docs/swamp-shape.md). A clone's job ends at the T3 registration.
  - name: input
    steps:
      - name: input
        labels: {role: swamp}
        writes: true
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: '@nckrtl/ansible-input'
          behaviorName: ${{ "ansible-input" }}
          methodName: write
          inputs:
            intent: '${{ inputs.intent }}'
            path: '${{ "/tmp/orbit-ansible-" + run.id + "/intent.json" }}'
  - name: legacy
    dependsOn: [{job: input, condition: {type: succeeded}}]
    steps:
      - name: checkout
        labels: {role: swamp}
        writes: true
        dependsOn: []
        guard: '${{ (inputs.intent.already_active || inputs.intent.container != null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-checkout-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 400 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags checkout "$ORBIT_ANSIBLE/operation-instance-create.yml"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_NODE_ID: '${{ string(inputs.node_id) }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
              ORBIT_GIT_CREDENTIAL: '${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.execution_secrets.git_credential.key) }}'
              ORBIT_ENVIRONMENT: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'
              ORBIT_ENVIRONMENT_TESTING: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.environment_testing ? inputs.execution_secrets.environment_testing.key : inputs.execution_secrets.environment.key) }}'
      - name: container
        labels: {role: swamp}
        writes: true
        dependsOn: []
        guard: '${{ (inputs.intent.already_active || inputs.intent.container == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-container-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 300 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags "$ORBIT_PHASE" "$ORBIT_ANSIBLE/instance-container.yml"
            env:
              ORBIT_PHASE: 'container'
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
              ORBIT_GIT_CREDENTIAL: '${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.execution_secrets.git_credential.key) }}'
              # Only a nested-fleet container's start gets its Club key, from its one vault copy; Ansible passes it on stdin. Any other run
              # names a key it always has, which Ansible never delivers (docs/reference/swamp-command-steps.md#secret-inputs).
              ORBIT_CLUB_KEY: '${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.intent.container != null && inputs.intent.container.project == "orbit-instances-nested" && inputs.intent.container.club_key.available ? inputs.execution_secrets.club_key.key : inputs.execution_secrets.git_credential.key) }}'
      - name: workspace
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: container, condition: {type: succeeded}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.container == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-workspace-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags workspace "$ORBIT_ANSIBLE/instance-container.yml"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
              ORBIT_ENVIRONMENT: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.execution_secrets.environment.key) }}'
      - name: deploy
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: workspace, condition: {type: succeeded}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.container == null || steps.exists(k, k.startsWith("deploy") && steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        forEach: {item: step, in: '${{ inputs.intent.container == null ? [] : inputs.intent.container.steps }}'}
        concurrency: 1
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-deploy-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("ic-deploy-" + string(inputs.node_id) + "-" + string(self._index)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.ssh_execution.identity_file }}'
              hostKeys: '${{ inputs.intent.ssh_execution.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.ssh_execution.target.host }}'}]
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["incus", "exec", "--project", inputs.intent.container.project, "--cwd", inputs.intent.container.workspace, inputs.intent.container.name, "--", "runuser", "-u", "orbit", "--", "/usr/bin/env", "-i"] + inputs.intent.container.environment + ["/bin/sh", "-c", self.step.required ? "s=$(cat) && exec timeout \"$1\" /bin/bash --noprofile --norc -eu -c \"$s\" </dev/null >/dev/null 2>&1" : "s=$(cat) || exit 1; timeout \"$1\" /bin/bash --noprofile --norc -eu -c \"$s\" </dev/null >/dev/null 2>&1; echo \"$?\"", "sh", string(self.step.timeout_seconds)] }}'
            stdin: '${{ vault.get(inputs.execution_secrets["step_" + string(self._index)].vault, inputs.execution_secrets["step_" + string(self._index)].key) }}'
            timeoutSec: '${{ self.step.timeout_seconds + 10 }}'
      - name: container-processes
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: workspace, condition: {type: succeeded}}
          - {step: deploy, condition: {type: always}}
        guard: '${{ (inputs.intent.already_active || inputs.intent.container == null || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-processes-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags processes "$ORBIT_ANSIBLE/instance-container.yml"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
              ORBIT_PROCESS_ENVIRONMENTS: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.container != null ? inputs.execution_secrets.process_environments.key : inputs.execution_secrets.environment.key) }}'
      - name: database-snapshot
        labels: {role: swamp}
        dependsOn: [{step: checkout, condition: {type: or, conditions: [type: succeeded, type: skipped]}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.database == null || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: workflow
          workflowIdOrName: instance-clone-database-snapshot
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent.database }}'
            run_id: '${{ run.id }}'
      - name: database-install
        labels: {role: swamp}
        dependsOn: [{step: database-snapshot, condition: {type: succeeded}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.database == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: workflow
          workflowIdOrName: instance-clone-database-install
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent.database }}'
            run_id: '${{ run.id }}'
            digest: '${{ steps["database-snapshot"].outputs.digest.stdout.split(" ")[0] }}'
      - name: database-cleanup
        labels: {role: swamp}
        dependsOn:
          - {step: database-snapshot, condition: {type: always}}
          - {step: database-install, condition: {type: always}}
        guard: '${{ (inputs.intent.already_active || inputs.intent.database == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: workflow
          workflowIdOrName: instance-clone-database-cleanup
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            intent: '${{ inputs.intent.database }}'
            run_id: '${{ run.id }}'
      - name: server-database
        labels: {role: swamp}
        dependsOn: [{step: checkout, condition: {type: or, conditions: [type: succeeded, type: skipped]}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.server_database == null || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: workflow
          workflowIdOrName: operation-database-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.intent.server_database == null ? inputs.node_id : inputs.intent.server_database.node_id }}'
            kind: database.create
            intent: '${{ inputs.intent.server_database == null ? {} : inputs.intent.server_database.intent }}'
            execution_secrets: '${{ inputs.intent.server_database == null ? {} : {"create": inputs.execution_secrets.server_database_create, "check": inputs.execution_secrets.server_database_check} }}'
      - name: server-database-check
        labels: {role: swamp}
        dependsOn: [{step: server-database, condition: {type: succeeded}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.server_database == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-dbcheck-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("ic-dbcheck-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.server_database == null ? 22 : inputs.intent.server_database.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.identity_file }}'
              hostKeys: '${{ inputs.intent.server_database == null ? [] : inputs.intent.server_database.intent.ssh_execution.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host }}'}]
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "60"] + (inputs.intent.server_database == null ? [] : inputs.intent.server_database.intent.owner_client) }}'
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.server_database == null ? inputs.execution_secrets.environment.key : inputs.execution_secrets.server_database_check.key) }}'
            timeoutSec: 70
      - name: server-database-fill
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: server-database-check, condition: {type: succeeded}}]
        guard: '${{ (inputs.intent.already_active || inputs.intent.server_database == null || inputs.intent.server_database.fill == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-dbfill-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
          methodName: exec
          globalArgs:
            name: '${{ ("ic-dbfill-" + string(inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host)).split(".").join("-") }}'
            transport:
              kind: ssh
              user: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.user }}'
              port: '${{ inputs.intent.server_database == null ? 22 : inputs.intent.server_database.intent.ssh_execution.target.port }}'
              identityFile: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.identity_file }}'
              hostKeys: '${{ inputs.intent.server_database == null ? [] : inputs.intent.server_database.intent.ssh_execution.target.host_keys }}'
            hosts: [{name: target, address: '${{ inputs.intent.server_database == null ? "none" : inputs.intent.server_database.intent.ssh_execution.target.host }}'}]
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "600"] + (inputs.intent.server_database == null || inputs.intent.server_database.fill == null ? [] : inputs.intent.server_database.fill) }}'
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, inputs.intent.server_database == null ? inputs.execution_secrets.environment.key : inputs.execution_secrets.server_database_create.key) }}'
            timeoutSec: 610
      - name: setup
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: checkout, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: database-install, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: server-database-check, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: server-database-fill, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
        guard: '${{ (inputs.intent.already_active || size(inputs.intent.setup_steps) == 0 || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-setup-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 600 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags setup "$ORBIT_ANSIBLE/operation-instance-create.yml"
            env:
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
      - name: processes
        labels: {role: swamp}
        dependsOn:
          - {step: checkout, condition: {type: always}}
          - {step: setup, condition: {type: always}}
        guard: '${{ (inputs.intent.already_active || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        forEach: {item: member, in: '${{ inputs.intent.processes }}'}
        task:
          type: workflow
          workflowIdOrName: '${{ self.member.kind == "process.start" ? "operation-process-start" : "operation-process-create" }}'
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ self.member.kind }}'
            intent: '${{ self.member.intent }}'
            execution_secrets: '${{ "member_" + string(self.member.id) in inputs.execution_secrets ? {"environment": inputs.execution_secrets["member_" + string(self.member.id)]} : {} }}'
      - name: route-csr
        labels: {role: swamp}
        writes: true
        dependsOn: []
        guard: '${{ (inputs.intent.already_active || inputs.intent.route == null) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        forEach: {item: leaf, in: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes }}'}
        task:
          type: workflow
          workflowIdOrName: route-create-csr
          inputs:
            intent: '${{ inputs.intent.route }}'
            leaf: '${{ self.leaf }}'
            operation_id: '${{ inputs.operation_id }}'
            parent_run_id: '${{ run.id }}'
      - name: route
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: route-csr, condition: {type: always}}
          - {step: checkout, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: container-processes, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: database-install, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: server-database-check, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
          - {step: server-database-fill, condition: {type: or, conditions: [type: succeeded, type: skipped]}}
        guard: '${{ (inputs.intent.already_active || inputs.intent.route == null || (inputs.intent.container != null && inputs.intent.container.clone != null) || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: workflow
          workflowIdOrName: operation-route-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            parent_run_id: '${{ run.id }}'
            kind: route.create
            intent: '${{ inputs.intent.route }}'
            execution_secrets: '${{ inputs.intent.route_secrets }}'
            signed: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes.map(i, ("route-csr-" + string(i)) in steps && steps["route-csr-" + string(i)].status == "succeeded" ? steps["route-csr-" + string(i)].outputs.sign.stdout : "") }}'
            prepared: '${{ string(inputs.node_id) }}'
            admitted: '${{ {"path": "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.path : "", "assets": "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "", "field": "route"} }}'
      - name: seed
        labels: {role: swamp}
        writes: true
        dependsOn:
          - {step: container-processes, condition: {type: succeeded}}
          - {step: route, condition: {type: always}}
        guard: '${{ (inputs.intent.already_active || inputs.intent.container == null || inputs.intent.container.clone != null || steps.exists(k, steps[k].status == "failed")) || (inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-seed-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags seed "$ORBIT_ANSIBLE/instance-container.yml"
            env: &container_phase
              ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'
              ORBIT_RUN_ID: '${{ run.id }}'
              ORBIT_ANSIBLE: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "" }}'
              ANSIBLE_CONFIG: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets + "/ansible.cfg" : "" }}'
              ANSIBLE_SSH_ARGS: '${{ "-o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/tmp/orbit-ansible-" + run.id + "/known_hosts" }}'
              ANSIBLE_FORCE_COLOR: '0'
              ANSIBLE_DISPLAY_FAILED_STDERR: '1'
  # Four fixed SSH behavior slots bound inventory and separate concurrent creates.
  - name: clone
    dependsOn: [{job: input, condition: {type: succeeded}}]
    steps:
      - name: clone-input
        labels: {role: swamp}
        writes: true
        dependsOn: []
        guard: '${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}'
          methodName: exec
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "20"] + ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_stage_argv : []) + ["stage"] }}'
            stdin: '${{ "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_payload : "" }}'
            timeoutSec: 30
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
      - name: clone-container
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-input, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}'
          methodName: exec
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "300"] + ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_argv : []) + ["container"] }}'
            stdin: ${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.execution_secrets.git_credential.key) }}
            timeoutSec: 310
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
      # A nested-fleet clone gets its nested Gateway's Club key right after its start, on SSH stdin into the copy's /run
      # (docs/reference/development-containers.md#the-club-key-of-the-nested-gateway). Any other clone skips it; its stdin names a
      # key every clone has (docs/reference/swamp-command-steps.md#secret-inputs).
      - name: clone-club-key
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-container, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null && inputs.intent.container.project == "orbit-instances-nested" && inputs.intent.container.club_key.available) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}'
          methodName: exec
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "60"] + ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_argv : []) + ["club-key"] }}'
            stdin: '${{ vault.get(inputs.execution_secrets.git_credential.vault, inputs.intent.container != null && inputs.intent.container.project == "orbit-instances-nested" && inputs.intent.container.club_key.available ? inputs.execution_secrets.club_key.key : inputs.execution_secrets.git_credential.key) }}'
            timeoutSec: 70
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
      # The checkout part of the workspace phase: the branch, this Instance's checkout mark and .env. PHP settings, Process files and the
      # units are the `services` part of the completion (workflow-operation-instance-complete.yaml). The step keeps its name: Conn maps it.
      - name: clone-workspace
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-container, condition: {type: succeeded}}, {step: clone-club-key, condition: {type: or, conditions: [type: succeeded, type: skipped]}}]
        guard: '${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}'
          methodName: exec
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "120"] + ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_argv : []) + ["checkout"] }}'
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, (inputs.intent.container == null ? inputs.execution_secrets.environment.key : inputs.execution_secrets.process_environments.key)) }}'
            timeoutSec: 130
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
      # One step writes the agent's files from the model key on stdin, then starts T3 (docs/cli/instance/container/create.mmd). It never
      # writes the workspace (T3 runs Git without optional locks), so it runs beside it under its own lock name; a shared name would make
      # Swamp run them one after another. Swamp starts a level of steps only when the whole level before it has ended
      # (swamp/docs/swamp-shape.md), so it names the same steps as the workspace and sits in its level. A failed copy or Club key skips
      # it, as it skips the workspace. clone-sessions is the join.
      - name: clone-t3
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-container, condition: {type: succeeded}}, {step: clone-club-key, condition: {type: or, conditions: [type: succeeded, type: skipped]}}]
        guard: '${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: '${{ ("ic-clone-t3-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}'
          methodName: exec
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "240"] + ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_argv : []) + ["t3"] }}'
            stdin: '${{ vault.get(inputs.execution_secrets.environment.vault, (inputs.intent.container != null && inputs.intent.container.clone != null ? inputs.execution_secrets.model_environment.key : inputs.execution_secrets.environment.key)) }}'
            timeoutSec: 250
          globalArgs:
            name: ${{ ("ic-clone-t3-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
      - name: clone-sessions
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-t3, condition: {type: succeeded}}, {step: clone-workspace, condition: {type: succeeded}}]
        guard: ${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
          methodName: exec
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "60"] + ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_argv : []) + ["sessions"] }}'
            stdin: ''
            timeoutSec: 70
      # It also brings a failed clone-t3 step's t3.json, which names the part that ran, so the create result keeps that part's code.
      - name: clone-session-copy
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-sessions, condition: {type: always}}]
        guard: ${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) || !(("clone-sessions" in steps && steps["clone-sessions"].status in ["succeeded", "failed"]) || ("clone-t3" in steps && steps["clone-t3"].status == "failed")) }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
          methodName: copy
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
          inputs:
            hosts: name:target
            src: '${{ ("input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.clone_private : "/tmp/orbit-clone-skipped") + "/t3.json" }}'
            dst: ${{ "/tmp/orbit-ansible-" + run.id + "/t3.json" }}
            direction: from
            captureOutput: false
            timeoutSec: 20
      - name: clone-register
        labels: {role: swamp}
        dependsOn: [{step: clone-session-copy, condition: {type: succeeded}}]
        guard: ${{ inputs.intent.already_active || inputs.intent.container == null || inputs.intent.container.clone == null || !("clone-sessions" in steps && steps["clone-sessions"].status == "succeeded") }}
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-t3'
          behaviorName: ${{ "ic-t3-register" }}
          methodName: register
          inputs:
            instance_id: ${{ inputs.intent.instance_id }}
            folder: ${{ "/tmp/orbit-ansible-" + run.id }}
  # A clone's Route, beside its copy (docs/cli/instance/container/create.mmd). Only a clone whose admission took the free Route Nodes
  # carries `route`; with a Node held the admission drops it and the completion publishes. No step reads the container: the CSR and the
  # site are host files, the site skips the Route access and APP_URL (`prepared`), and the TLS probe is a handshake with the Node's Caddy.
  # A failure here never stops a clone step and never fails the create: the completion publishes again. The Gateway frees the Route
  # Nodes and activates the Route when it sees `clone-route` succeed (NativeRunProgress), so the steps keep their names.
  - name: publication
    dependsOn: [{job: input, condition: {type: succeeded}}]
    steps:
      - name: clone-route-csr
        labels: {role: swamp}
        writes: true
        dependsOn: []
        guard: '${{ inputs.intent.already_active || inputs.intent.route == null || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}'
        forEach: {item: leaf, in: '${{ inputs.intent.route == null || inputs.intent.container == null || inputs.intent.container.clone == null ? [] : inputs.intent.route.leaf_indexes }}'}
        task:
          type: workflow
          workflowIdOrName: route-create-csr
          inputs:
            intent: '${{ inputs.intent.route }}'
            leaf: '${{ self.leaf }}'
            operation_id: '${{ inputs.operation_id }}'
            parent_run_id: '${{ run.id }}'
      - name: clone-route
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: clone-route-csr, condition: {type: always}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.route == null || !(inputs.intent.container != null && inputs.intent.container.clone != null) || steps.exists(k, k.startsWith("clone-route") && steps[k].status == "failed") }}'
        task:
          type: workflow
          workflowIdOrName: operation-route-create
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            parent_run_id: '${{ run.id }}'
            kind: route.create
            intent: '${{ inputs.intent.route }}'
            execution_secrets: '${{ inputs.intent.route_secrets }}'
            signed: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes.map(i, ("clone-route-csr-" + string(i)) in steps && steps["clone-route-csr-" + string(i)].status == "succeeded" ? steps["clone-route-csr-" + string(i)].outputs.sign.stdout : "") }}'
            prepared: '${{ string(inputs.node_id) }}'
            admitted: '${{ {"path": "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.path : "", "assets": "input" in steps && steps.input.status == "succeeded" ? steps.input.outputs.assets : "", "field": "route"} }}'
  # Compensation waits for all writers. A clone's create creates no database: its completion does.
  - name: create
    dependsOn: [{job: input, condition: {type: or, conditions: [type: completed, type: skipped]}}, {job: legacy, condition: {type: or, conditions: [type: completed, type: skipped]}}, {job: clone, condition: {type: or, conditions: [type: completed, type: skipped]}}, {job: publication, condition: {type: or, conditions: [type: completed, type: skipped]}}]
    steps:
      - name: finish
        labels: {role: swamp}
        dependsOn: []
        task:
          type: behavior
          behaviorType: '@nckrtl/instance-dev-command'
          behaviorName: '${{ "ic-finish" }}'
          methodName: create_result
          inputs:
            folder: '${{ "/tmp/orbit-ansible-" + run.id }}'
            intent: '${{ inputs.intent }}'
            checkout: '${{ "checkout" in steps ? steps.checkout : null }}'
            database: '${{ inputs.intent.server_database == null ? ("database-install" in steps ? steps["database-install"].status : "skipped") : (inputs.intent.server_database.fill != null ? ("server-database-fill" in steps ? steps["server-database-fill"].status : "skipped") : ("server-database-check" in steps ? steps["server-database-check"].status : "skipped")) }}'
            setup: '${{ "setup" in steps ? steps.setup.status : "skipped" }}'
            processes: '${{ inputs.intent.processes.map(p, ("processes-" + string(p.index)) in steps ? steps["processes-" + string(p.index)].status : "skipped") }}'
            # A clone's Route steps carry the `clone-` prefix: the legacy job owns `route-csr` and `route`.
            route: '${{ (inputs.intent.container != null && inputs.intent.container.clone != null ? "clone-route" : "route") in steps ? steps[inputs.intent.container != null && inputs.intent.container.clone != null ? "clone-route" : "route"].status : "skipped" }}'
            certificates: '${{ inputs.intent.route == null ? [] : inputs.intent.route.leaf_indexes.map(i, ((inputs.intent.container != null && inputs.intent.container.clone != null ? "clone-route-csr-" : "route-csr-") + string(i)) in steps ? steps[(inputs.intent.container != null && inputs.intent.container.clone != null ? "clone-route-csr-" : "route-csr-") + string(i)].status : "skipped") }}'
            container: '${{ inputs.intent.container == null ? dyn(null) : {"mail": (inputs.intent.container.clone != null ? ("clone-container" in steps ? steps["clone-container"] : null) : ("container" in steps ? steps.container : null)), "launch": (inputs.intent.container != null && inputs.intent.container.clone != null ? ("clone-container" in steps ? steps["clone-container"].status : "skipped") : ("container" in steps ? steps.container.status : "skipped")), "workspace": (inputs.intent.container != null && inputs.intent.container.clone != null ? ("clone-workspace" in steps ? steps["clone-workspace"] : null) : ("workspace" in steps ? steps.workspace : null)), "deploy": steps.filter(k, k.startsWith("deploy-")).map(k, steps[k].status), "processes": "container-processes" in steps ? steps["container-processes"].status : "skipped", "seed": "seed" in steps ? steps.seed.status : "skipped", "t3": "clone-t3" in steps ? steps["clone-t3"].status
              : "skipped", "register": "clone-sessions" in steps && steps["clone-sessions"].status == "failed" ? "failed" : ("clone-session-copy" in steps && steps["clone-session-copy"].status == "failed" ? "failed" : ("clone-register" in steps ? steps["clone-register"].status : "skipped")), "server": "clone-register" in steps && steps["clone-register"].status == "succeeded" ? steps["clone-register"].outputs.stdout : null, "club_key": "clone-club-key" in steps && steps["clone-club-key"].status == "succeeded" ? {"status": "succeeded", "outputs": {"stdout": steps["clone-club-key"].outputs.stdout} } : dyn(null)} }}'
            t3_observation: '${{ "clone-t3" in steps && steps["clone-t3"].status == "succeeded" ? steps["clone-t3"].outputs.stdout : "" }}'
            sessions_observation: '${{ "clone-sessions" in steps && steps["clone-sessions"].status == "succeeded" ? steps["clone-sessions"].outputs.stdout : "" }}'
            route_observation: '${{ "route" in steps && steps.route.status == "succeeded" ? steps.route.outputs : ("clone-route" in steps && steps["clone-route"].status == "succeeded" ? steps["clone-route"].outputs : {}) }}'
      # A failed create takes back a Route it started and did not finish publishing, under the Nodes it still holds. A clone's Route that
      # `clone-route` published is active and its Nodes are free: it stays until a retry or a removal (development-containers.md#create).
      - name: withdraw-route
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: finish, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.route == null || steps.finish.outputs.ready == true || ("clone-route" in steps && steps["clone-route"].status == "succeeded") || !(("route-csr-0" in steps && steps["route-csr-0"].status != "skipped") || ("route" in steps && steps.route.status != "skipped") || ("clone-route-csr-0" in steps && steps["clone-route-csr-0"].status != "skipped") || ("clone-route" in steps && steps["clone-route"].status != "skipped")) }}'
        task:
          type: workflow
          workflowIdOrName: '${{ "route-withdraw" }}'
          inputs:
            operation_id: '${{ inputs.operation_id }}'
            node_id: '${{ inputs.node_id }}'
            kind: '${{ inputs.kind }}'
            side: restore
            intent: '${{ {"route_mutations": inputs.intent.route_mutations} }}'
            execution_secrets: {}
      - name: stop-container
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: finish, condition: {type: succeeded}}]
        guard: '${{ inputs.intent.already_active || inputs.intent.container == null || steps.finish.outputs.ready == true || !(("clone-container" in steps && steps["clone-container"].status != "skipped") || ("container" in steps && steps.container.status != "skipped")) }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-stop-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 120 /opt/orbit/ansible/venv/bin/ansible-playbook -i localhost, --tags stop "$ORBIT_ANSIBLE/instance-container.yml"
            env: *container_phase
      # The clone's private folder (it holds T3 session tokens) goes beside finish, which reads only the run folder; stop-container
      # reads only the run folder too.
      - name: clone-private-cleanup
        labels: {role: swamp}
        writes: true
        dependsOn: []
        guard: ${{ inputs.intent.already_active || !(inputs.intent.container != null && inputs.intent.container.clone != null) }}
        task:
          type: behavior
          behaviorType: '@swamp/ssh'
          behaviorName: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
          methodName: exec
          globalArgs:
            name: ${{ ("ic-clone-" + string(inputs.node_id) + "-" + string(inputs.intent.instance_id % 4)).split(".").join("-") }}
            transport:
              kind: ssh
              user: ${{ inputs.intent.ssh_execution.target.user }}
              port: ${{ inputs.intent.ssh_execution.target.port }}
              identityFile: ${{ inputs.intent.ssh_execution.identity_file }}
              hostKeys: ${{ inputs.intent.ssh_execution.target.host_keys }}
            hosts:
              - name: target
                address: ${{ inputs.intent.ssh_execution.target.host }}
          inputs:
            hosts: name:target
            sudo: true
            argv: '${{ ["timeout", "20", "rm", "-rf", "--", "/tmp/orbit-clone-" + string(inputs.intent.instance_id) + "-" + run.id] }}'
            stdin: ''
            timeoutSec: 30
      - name: accepted
        labels: {role: swamp}
        dependsOn: [{step: finish, condition: {type: succeeded}}, {step: withdraw-route, condition: {type: always}}, {step: stop-container, condition: {type: always}}, {step: clone-private-cleanup, condition: {type: always}}]
        task: {type: assert, expr: 'steps.finish.outputs.ready == true', severity: high, message: The development Instance create did not complete.}
      - name: cleanup
        labels: {role: swamp}
        writes: true
        dependsOn: [{step: stop-container, condition: {type: always}}, {step: clone-private-cleanup, condition: {type: always}}]
        guard: '${{ inputs.intent.already_active }}'
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: '${{ "ic-cleanup-" + string(inputs.node_id) }}'
          methodName: execute
          inputs:
            run: timeout 30 rm -rf -- "$ORBIT_RUN"
            env: {ORBIT_RUN: '${{ "/tmp/orbit-ansible-" + run.id }}'}
