          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,253}', host) or not re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}', user) or not 1 <= port <= 65535 or node <= 0:
              raise SystemExit('node.removal_target_invalid')
          fields = os.environ['ORBIT_TARGET_KEY'].split()
          if len(fields) != 2 or fields[0] not in {'ssh-ed25519','ssh-rsa','ecdsa-sha2-nistp256','ecdsa-sha2-nistp384','ecdsa-sha2-nistp521'}:
              raise SystemExit('node.ssh_host_key_mismatch')
          fingerprint = 'SHA256:' + base64.b64encode(hashlib.sha256(base64.b64decode(fields[1], validate=True)).digest()).decode().rstrip('=')
          if fingerprint != os.environ['ORBIT_TARGET_FINGERPRINT']:
              raise SystemExit('node.ssh_host_key_mismatch')
          if node == int(os.environ['ORBIT_EXECUTOR_NODE']):
              raise SystemExit('node.removal_executor_invalid')
          identity = os.environ.pop('ORBIT_SSH_IDENTITY')
          with tempfile.TemporaryDirectory(prefix='orbit-removal-') as directory:
              key = Path(directory) / 'identity'
              known = Path(directory) / 'known_hosts'
              for path, value in [(key, identity), (known, 'orbit-removal-target ' + ' '.join(fields) + '\n')]:
                  with open(path, 'x', opener=lambda path, flags: os.open(path, flags, 0o600)) as stream:
                      stream.write(value)
              command = [
                  '/usr/bin/ssh', '-F', '/dev/null', '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes',
                  '-o', 'StrictHostKeyChecking=yes', '-o', 'UserKnownHostsFile=' + str(known),
                  '-o', 'GlobalKnownHostsFile=/dev/null', '-o', 'HostKeyAlias=orbit-removal-target',
                  '-o', 'ConnectTimeout=10', '-o', 'ConnectionAttempts=1', '-o', 'ControlMaster=no',
                  '-o', 'ForwardAgent=no', '-o', 'ClearAllForwardings=yes', '-o', 'LogLevel=ERROR',
                  '-i', str(key), '-p', str(port), '--', user + '@' + host,
              ]
              result = subprocess.run(command + ['sudo -n /usr/bin/systemctl disable orbit-node-worker.service'], capture_output=True, check=False, env=dict(os.environ))
              accepted = result.returncode == 0
          if not accepted:
              raise SystemExit('node.removal_retirement_uncertain')
          print(json.dumps({'ready': True}))
          PY_ACTION
        timeout: 120000
        env: *id002
    dependsOn:
    - step: verify-admitted-target
      condition:
        type: succeeded
    - step: verify-node-identity
      condition:
        type: succeeded
    - step: retirement-view
      condition:
        type: succeeded
    guard: ${{ !steps["retirement-view"].outputs.worker_present }}
  - name: stop-worker
    target: ${{ "orbit-node-" + string(inputs.executor_node_id) }}
    labels:
      node: ${{ string(inputs.executor_node_id) }}
    task:
      type: behavior
      behaviorType: command/shell
      behaviorName: ${{ "remove-" + string(inputs.operation_id) + "-stop-worker" }}
      methodName: execute
